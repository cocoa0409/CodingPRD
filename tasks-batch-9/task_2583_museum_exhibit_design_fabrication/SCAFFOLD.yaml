scenario: |
  Generate task harder than expert level!

  2583. Museum Exhibit Design & Fabrication (exhibit design and fabrication firm): interpretive planning with content development, storyline and learning objectives in collaboration with curators, schematic and design development with visitor flow, accessibility and object case requirements, artifact case design with environmental control, security and mount-making coordination with conservators, interactive and media element specification with durability and maintenance considerations, fabrication with shop drawings, materials selection for conservation-safe off-gassing and prototype approval, installation scheduling within an operating museum with noise, dust and access constraints, commissioning with punch list, docent training materials and maintenance manuals, warranty and long-term parts availability for interactives

domain_name: museum-exhibit-design-fabrication
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  state_machine_shape_secondary: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  design_notes: |
    The core challenge is a review panel (Curator / Conservator / AccessibilitySpecialist)
    whose votes decide a DesignPackage through repeated rounds, layered over an
    operating-museum installation calendar with two structurally different
    interval geometries (per-zone buffered half-open exclusion vs project-wide
    closed-interval closure capacity counting), plus a conservation-safety
    cascade that unwinds fabrication money and physical gallery slots without
    drift.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ExhibitProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: project name as contracted with the museum
        constraints: "1-160 chars, non-blank"
      - name: museum_name
        type: string
        source: input
        description: client museum operating the gallery
        constraints: "1-160 chars, non-blank"
      - name: storyline_title
        type: string
        source: input
        description: interpretive storyline headline agreed with curators
        constraints: "1-200 chars, non-blank"
      - name: objective_codes
        type: array
        source: input
        description: learning objective codes the exhibit must address
        constraints: "2-8 unique strings matching ^OBJ-[A-Z0-9]{2,6}$"
      - name: target_open_date
        type: datetime
        source: input
        description: contracted public opening instant (ISO 8601 UTC)
      - name: contract_value_cents
        type: integer
        source: input
        description: total contract value in cents; the conserved money pool
        constraints: ">= 1000000"
      - name: max_concurrent_closures
        type: integer
        source: input
        default: 2
        description: project-wide cap on simultaneously closure-requiring install windows
        constraints: ">= 1 and <= 5"
      - name: phase
        type: enum
        source: system
        default: INTERPRETIVE
        description: lifecycle phase of the project
        constraints: "INTERPRETIVE|SCHEMATIC|DESIGN_DEV|FABRICATION|INSTALLATION|COMMISSIONING|CLOSEOUT|WARRANTY_CLOSED"
      - name: posture
        type: enum
        source: computed
        description: derived aggregate gate over child conservation/review state (calculations.project_readiness_posture)
        constraints: "OPEN|RESTRICTED|FROZEN_CONSERVATION"
      - name: conservation_veto_count
        type: integer
        source: computed
        default: 0
        description: number of VETO ReviewVote rows cast by Conservator across all rounds of this project
      - name: conservation_block_count
        type: integer
        source: computed
        default: 0
        description: REJECTED ArtifactCase count + REJECTED MaterialSpec count + conservation_veto_count
      - name: open_revision_count
        type: integer
        source: computed
        default: 0
        description: count of DesignPackage rows of this project with status REVISION_REQUESTED
      - name: conditional_case_count
        type: integer
        source: computed
        default: 0
        description: count of ArtifactCase rows of this project with status CONDITIONALLY_APPROVED
      - name: pending_material_count
        type: integer
        source: computed
        default: 0
        description: count of MaterialSpec rows of this project with status IN {SUBMITTED, CONSERVATOR_REVIEW}
      - name: blocking_punch_count
        type: integer
        source: computed
        default: 0
        description: count of PunchItem rows of this project with severity BLOCKING and status OPEN
      - name: committed_fabrication_cents
        type: integer
        source: computed
        default: 0
        description: sum of actual_cost_cents over ShopDrawing rows of this project with status IN {APPROVED, APPROVED_AS_NOTED}
      - name: retainage_held_cents
        type: integer
        source: computed
        default: 0
        description: retainage withheld at closeout (calculations.closeout_settlement step 5)
      - name: warranty_reserve_cents
        type: integer
        source: computed
        default: 0
        description: long-term interactive warranty/parts reserve set at closeout (step 6)
      - name: released_cents
        type: integer
        source: computed
        default: 0
        description: cash released to the fabrication firm at closeout (step 7)
      - name: uncommitted_cents
        type: integer
        source: computed
        description: contract_value_cents - committed_fabrication_cents - retainage_held_cents - warranty_reserve_cents - released_cents
      - name: parts_commitment_years
        type: integer
        source: system
        default: 0
        description: long-term parts availability commitment recorded at closeout
      - name: docent_kit_url
        type: string
        source: system
        description: docent training material bundle recorded at closeout; null before closeout
      - name: maintenance_manual_url
        type: string
        source: system
        description: maintenance manual bundle recorded at closeout; null before closeout
      - name: warranty_registered_at
        type: datetime
        source: system
        description: logical-clock instant the warranty was registered at closeout; null before closeout
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectManager who created the project

  - name: DesignPackage
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: superseded_by_package_id
        type: string
        source: system
        description: FK -> DesignPackage.id; self-referential pointer set when a newer same-stage package supersedes this one; null while current
      - name: stage
        type: enum
        source: input
        description: design stage this package represents
        constraints: "SCHEMATIC|DESIGN_DEV"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: review lifecycle status
        constraints: "DRAFT|IN_REVIEW|REVISION_REQUESTED|APPROVED|SUPERSEDED"
      - name: egress_clear_width_cm
        type: number
        source: input
        description: narrowest clear egress width on the visitor route
        constraints: "> 0"
      - name: wheelchair_turning_radius_cm
        type: number
        source: input
        description: smallest wheelchair turning radius provided on the route
        constraints: "> 0"
      - name: peak_visitors_per_hour
        type: integer
        source: input
        description: designed peak visitor throughput
        constraints: ">= 1"
      - name: circulation_area_sqm
        type: number
        source: input
        description: circulation (non-case) floor area on the visitor route
        constraints: "> 0"
      - name: flow_capacity_score
        type: number
        source: computed
        description: visitor-flow headroom score (calculations.package_flow_and_accessibility)
      - name: accessibility_pass
        type: boolean
        source: computed
        description: true when all three accessibility minimums hold (calculations.package_flow_and_accessibility)
      - name: review_round_count
        type: integer
        source: computed
        default: 0
        description: number of ReviewRound rows opened against this package
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: number of times this package entered REVISION_REQUESTED
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectManager who created the package; used by the segregation-of-duties check on voting
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant the package reached APPROVED; null otherwise

  - name: ReviewRound
    parent: DesignPackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> DesignPackage.id; package under review in this round
      - name: round_number
        type: integer
        source: system
        description: 1-based round index within the package, assigned as package.review_round_count + 1
      - name: panel_roles
        type: array
        source: input
        description: reviewer roles seated on this round's panel
        constraints: "3-5 unique values from {Curator, Conservator, ProjectManager, AccessibilitySpecialist, FabricationLead}; must include both Curator and Conservator, because those two hold the veto"
      - name: required_vote_count
        type: integer
        source: computed
        description: quorum size, equal to ceil(length(panel_roles) * 2 / 3) - two thirds of the seated panel, rounded up, so a panel of 3 needs 2 votes, a panel of 4 needs 3 and a panel of 5 needs 4
      - name: cast_vote_count
        type: integer
        source: computed
        default: 0
        description: number of ReviewVote rows attached to this round
      - name: approve_count
        type: integer
        source: computed
        default: 0
        description: number of attached ReviewVote rows with decision APPROVE
      - name: revise_count
        type: integer
        source: computed
        default: 0
        description: number of attached ReviewVote rows with decision REVISE
      - name: veto_count
        type: integer
        source: computed
        default: 0
        description: number of attached ReviewVote rows with decision VETO
      - name: status
        type: enum
        source: system
        default: OPEN
        description: negotiation outcome of the round
        constraints: "OPEN|APPROVED|REVISION_REQUESTED|VETOED|CLOSED_SUPERSEDED"
      - name: decision_deadline_at
        type: datetime
        source: input
        description: instant after which review-sweep may lapse the round into REVISION_REQUESTED
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant the round left OPEN; null while OPEN
      - name: swept_by_deadline
        type: boolean
        source: system
        default: false
        description: true when the round left OPEN via review-sweep rather than a vote

  - name: ReviewVote
    parent: ReviewRound
    common_fields: false
    fields:
      - name: round_id
        type: string
        source: input
        description: FK -> ReviewRound.id; round this vote belongs to
      - name: voter_role
        type: string
        source: system
        description: X-User-Role of the caller at vote time
      - name: voter_user_id
        type: string
        source: system
        description: X-User-ID of the caller at vote time; opaque operator id, never an entity id
      - name: decision
        type: enum
        source: input
        description: this panelist's position
        constraints: "APPROVE|REVISE|VETO"
      - name: comment
        type: string
        source: input
        description: free-text rationale; null when omitted
        constraints: "0-500 chars"

  - name: GalleryZone
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; project whose exhibit occupies this zone
      - name: zone_code
        type: string
        source: input
        description: museum gallery zone label
        constraints: "1-40 chars, unique per project_id"
      - name: is_public_operating
        type: boolean
        source: input
        default: true
        description: true when the zone stays open to visitors during the install period
      - name: visitor_route_order
        type: integer
        source: input
        description: position of this zone on the interpretive visitor route
        constraints: ">= 1, unique per project_id"
      - name: max_noise_dba
        type: number
        source: input
        description: highest work noise level the museum tolerates in this zone
        constraints: "> 0"
      - name: case_slot_capacity
        type: integer
        source: input
        description: number of artifact cases the zone floor plan can carry; the conserved slot pool
        constraints: ">= 1 and <= 20"
      - name: reserved_case_slots
        type: integer
        source: computed
        default: 0
        description: count of ArtifactCase rows with this zone_id whose status IN {APPROVED, CONDITIONALLY_APPROVED}
      - name: available_case_slots
        type: integer
        source: computed
        description: case_slot_capacity - reserved_case_slots
      - name: closure_allowed
        type: boolean
        source: input
        default: false
        description: whether the museum permits closing this zone to visitors for work
      - name: dust_settling_buffer_minutes
        type: integer
        source: input
        default: 120
        description: zone-specific minimum settling buffer applied to DUST_GENERATING work
        constraints: ">= 0 and <= 480"
      - name: occupancy_state
        type: enum
        source: system
        default: OPERATING
        description: current visitor-access state of the zone
        constraints: "OPERATING|PARTIAL_CLOSURE|CLOSED"

  - name: ArtifactCase
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: zone_id
        type: string
        source: input
        description: FK -> GalleryZone.id; zone the case is sited in; consumes one case slot once approved
      - name: case_code
        type: string
        source: input
        description: case identifier on the fabrication schedule
        constraints: "1-40 chars, unique per project_id"
      - name: objective_code
        type: string
        source: input
        description: learning objective this case interprets; null when the case is purely architectural
        constraints: "when non-null MUST be a member of the owning project's objective_codes"
      - name: security_tier
        type: enum
        source: input
        description: case security build tier
        constraints: "BASIC|ENHANCED|HIGH_VALUE"
      - name: target_rh_pct
        type: number
        source: input
        description: designed relative-humidity setpoint inside the case
        constraints: "> 0 and < 100"
      - name: rh_tolerance_pct
        type: number
        source: input
        description: one-sided RH excursion the case design guarantees
        constraints: ">= 0 and <= 20"
      - name: target_lux
        type: number
        source: input
        description: designed illuminance on the object plane
        constraints: ">= 0"
      - name: uv_microwatt_per_lumen
        type: number
        source: input
        description: designed UV content of the case lighting
        constraints: ">= 0"
      - name: interior_l_cm
        type: number
        source: input
        description: interior clear length
        constraints: "> 0"
      - name: interior_w_cm
        type: number
        source: input
        description: interior clear width
        constraints: "> 0"
      - name: interior_h_cm
        type: number
        source: input
        description: interior clear height
        constraints: "> 0"
      - name: air_exchanges_per_day
        type: number
        source: input
        description: measured case air exchange rate
        constraints: "> 0"
      - name: case_volume_m3
        type: number
        source: computed
        description: interior volume in cubic metres (calculations.case_environmental_envelope)
      - name: silica_gel_kg
        type: number
        source: computed
        description: conditioned silica gel charge required to hold the RH setpoint (calculations.case_environmental_envelope)
      - name: placed_artifact_count
        type: integer
        source: computed
        default: 0
        description: count of Artifact rows with assigned_case_id equal to this case and placement_status IN {RESERVED, PLACED}
      - name: required_rh_min_pct
        type: number
        source: computed
        description: strictest floor across placed artifacts (max of their required_rh_min_pct); null when placed_artifact_count is 0
      - name: required_rh_max_pct
        type: number
        source: computed
        description: strictest ceiling across placed artifacts (min of their required_rh_max_pct); null when placed_artifact_count is 0
      - name: allowed_lux
        type: number
        source: computed
        description: strictest light limit across placed artifacts (min of their max_lux); null when placed_artifact_count is 0
      - name: env_feasible
        type: boolean
        source: computed
        description: true when the case setpoint band fits inside the strictest artifact band and target_lux <= allowed_lux
      - name: security_ok
        type: boolean
        source: computed
        description: true when SECURITY_RANK[security_tier] >= max SECURITY_RANK over placed artifacts' security_class
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: conservation-approval dimension of the case
        constraints: "DRAFT|CONSERVATOR_REVIEW|CONDITIONALLY_APPROVED|APPROVED|REJECTED"
      - name: mount_status
        type: enum
        source: system
        default: NOT_STARTED
        description: mount-making dimension of the case, advancing independently of status
        constraints: "NOT_STARTED|MOUNT_DESIGN|MOUNT_FABRICATED|MOUNT_INSTALLED"
      - name: conditions
        type: string
        source: system
        description: conservator conditions recorded with CONDITIONALLY_APPROVED; null otherwise
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent conservator decision; null before the first decision

  - name: Artifact
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: assigned_case_id
        type: string
        source: system
        description: FK -> ArtifactCase.id; set by a placement call, cleared when the placement is removed; null while UNPLACED
      - name: accession_number
        type: string
        source: input
        description: museum accession number
        constraints: "1-40 chars, unique per project_id"
      - name: material_class
        type: enum
        source: input
        description: dominant material class driving conservation limits
        constraints: "ORGANIC|METAL|PAPER|TEXTILE|COMPOSITE"
      - name: required_rh_min_pct
        type: number
        source: input
        description: lowest RH the object tolerates
        constraints: "> 0 and < 100"
      - name: required_rh_max_pct
        type: number
        source: input
        description: highest RH the object tolerates
        constraints: "> 0 and < 100 and > required_rh_min_pct"
      - name: max_lux
        type: number
        source: input
        description: highest illuminance the object tolerates
        constraints: ">= 0"
      - name: security_class
        type: enum
        source: input
        description: registrar-assigned security class
        constraints: "BASIC|ENHANCED|HIGH_VALUE"
      - name: condition_status
        type: enum
        source: input
        description: conservator condition assessment
        constraints: "STABLE|FRAGILE|UNSTABLE"
      - name: placement_status
        type: enum
        source: system
        default: UNPLACED
        description: placement dimension of the object
        constraints: "UNPLACED|RESERVED|PLACED|DEINSTALLED"

  - name: Interactive
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: code
        type: string
        source: input
        description: interactive/media element identifier
        constraints: "1-40 chars, unique per project_id"
      - name: kind
        type: enum
        source: input
        description: interactive technology family
        constraints: "TOUCHSCREEN|MECHANICAL|PROJECTION|AUDIO|AR_HEADSET"
      - name: objective_code
        type: string
        source: input
        description: learning objective this element addresses
        constraints: "MUST be a member of the owning project's objective_codes"
      - name: expected_daily_uses
        type: integer
        source: input
        description: specified visitor activations per operating day
        constraints: ">= 1"
      - name: duty_hours_per_day
        type: number
        source: input
        description: specified powered-on hours per operating day
        constraints: "> 0 and <= 24"
      - name: mtbf_cycles
        type: integer
        source: input
        description: manufacturer mean-cycles-between-failure rating
        constraints: ">= 1000"
      - name: parts_availability_years
        type: integer
        source: input
        description: vendor-committed spare-parts availability horizon
        constraints: ">= 0 and <= 30"
      - name: warranty_months
        type: integer
        source: input
        description: warranty term offered on this element
        constraints: ">= 0 and <= 120"
      - name: measured_daily_uses
        type: integer
        source: system
        description: prototype-measured activations per day, recorded on prototype approval; null before
      - name: measured_mtbf_cycles
        type: integer
        source: system
        description: prototype-measured mean-cycles-between-failure, recorded on prototype approval; null before
      - name: durability_index_spec
        type: number
        source: computed
        description: spec-stage durability index (calculations.interactive_durability_index, variant spec_stage)
      - name: durability_index_verified
        type: number
        source: computed
        description: prototype-verified durability index (variant prototype_verified); null before prototype approval
      - name: maintenance_tier
        type: enum
        source: computed
        description: maintenance burden band derived from durability_index_verified when non-null, else durability_index_spec
        constraints: "LOW|MEDIUM|HIGH|CRITICAL"
      - name: prototype_iteration
        type: integer
        source: computed
        default: 0
        description: number of times a prototype has been submitted for this element
      - name: status
        type: enum
        source: system
        default: SPECIFIED
        description: specification / prototype / fabrication lifecycle
        constraints: "SPECIFIED|PROTOTYPE_SUBMITTED|PROTOTYPE_APPROVED|PROTOTYPE_REJECTED|FABRICATED|COMMISSIONED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FabricationLead who submitted the current prototype; null before the first submission

  - name: MaterialSpec
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: material_name
        type: string
        source: input
        description: proprietary material / product name
        constraints: "1-120 chars, unique per project_id"
      - name: used_in
        type: enum
        source: input
        description: assembly the material is proposed for; drives the off-gassing limits
        constraints: "CASE_INTERIOR|CASE_EXTERIOR|MOUNT|GRAPHIC|INTERACTIVE_HOUSING"
      - name: oddy_test_result
        type: enum
        source: input
        description: Oddy corrosion test class reported by the lab
        constraints: "PASS|TEMPORARY|FAIL|UNTESTED"
      - name: voc_mg_per_m2_day
        type: number
        source: input
        description: total VOC emission rate from the chamber test
        constraints: ">= 0"
      - name: formaldehyde_ppm
        type: number
        source: input
        description: steady-state formaldehyde concentration from the chamber test
        constraints: ">= 0"
      - name: cure_days
        type: integer
        source: input
        description: off-gassing cure period the fabricator commits to before installation
        constraints: ">= 0 and <= 365"
      - name: verdict
        type: enum
        source: computed
        description: off-gassing verdict (calculations.material_offgassing_verdict)
        constraints: "CONSERVATION_SAFE|CONDITIONAL_SAFE|UNSAFE"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: conservator review lifecycle
        constraints: "SUBMITTED|CONSERVATOR_REVIEW|APPROVED|CONDITIONAL|REJECTED"
      - name: conditions
        type: string
        source: system
        description: conservator conditions recorded with CONDITIONAL; null otherwise
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent conservator decision; null before the first decision

  - name: ShopDrawing
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: material_spec_id
        type: string
        source: input
        description: FK -> MaterialSpec.id; primary material this drawing specifies
      - name: subject_case_id
        type: string
        source: input
        description: FK -> ArtifactCase.id; case this drawing details; null when the drawing details an interactive
      - name: subject_interactive_id
        type: string
        source: input
        description: FK -> Interactive.id; interactive this drawing details; null when the drawing details a case
      - name: drawing_number
        type: string
        source: input
        description: shop drawing sheet number
        constraints: "1-40 chars, unique per (project_id, revision)"
      - name: revision
        type: integer
        source: input
        default: 1
        description: sheet revision index
        constraints: ">= 1"
      - name: complexity_tier
        type: enum
        source: input
        description: shop labour tier this sheet is priced at
        constraints: "STANDARD|PRECISION|CONSERVATION_GRADE"
      - name: shop_hours
        type: number
        source: input
        description: estimated shop hours at submission
        constraints: "> 0"
      - name: material_area_m2
        type: number
        source: input
        description: sheet-good area consumed
        constraints: "> 0"
      - name: finish_grade
        type: enum
        source: input
        description: surface finish grade
        constraints: "MILL|SATIN|MUSEUM_GLOSS"
      - name: estimate_labor_cents
        type: integer
        source: computed
        description: schematic_estimate labour line item (calculations.fabrication_cost_estimate)
      - name: estimate_material_cents
        type: integer
        source: computed
        description: schematic_estimate material line item
      - name: estimate_finishing_cents
        type: integer
        source: computed
        description: schematic_estimate finishing line item
      - name: estimate_total_cents
        type: integer
        source: computed
        description: sum of the three schematic_estimate line items, each rounded before summing
      - name: actual_shop_hours
        type: number
        source: system
        description: shop hours supplied on the fabrication decision; null before the decision
      - name: actual_waste_factor
        type: number
        source: system
        description: material waste factor supplied on the fabrication decision; null before the decision
      - name: actual_labor_cents
        type: integer
        source: computed
        description: shop_drawing_actual labour line item; null before the decision
      - name: actual_material_cents
        type: integer
        source: computed
        description: shop_drawing_actual material line item; null before the decision
      - name: actual_finishing_cents
        type: integer
        source: computed
        description: shop_drawing_actual finishing line item; null before the decision
      - name: actual_cost_cents
        type: integer
        source: computed
        description: sum of the three shop_drawing_actual line items; the amount committed against the project ledger; null before the decision
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: drawing review lifecycle
        constraints: "SUBMITTED|UNDER_REVIEW|APPROVED|APPROVED_AS_NOTED|REJECTED|VOID"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FabricationLead who submitted the sheet; used by the segregation-of-duties check on the fabrication decision
      - name: void_reason
        type: string
        source: system
        description: reason recorded when the sheet became VOID, either operator-supplied or the literal MATERIAL_SPEC_REJECTED for cascaded voids; null otherwise

  - name: InstallWindow
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: zone_id
        type: string
        source: input
        description: FK -> GalleryZone.id; zone whose calendar this window occupies
      - name: work_class
        type: enum
        source: input
        description: disruption class of the work, driving the buffer geometry
        constraints: "QUIET|NOISY|DUST_GENERATING|CRANE_ACCESS"
      - name: noise_dba
        type: number
        source: input
        description: expected work noise level
        constraints: ">= 0 and <= 130"
      - name: starts_at
        type: datetime
        source: input
        description: nominal work start instant (ISO 8601 UTC)
      - name: ends_at
        type: datetime
        source: input
        description: nominal work end instant; MUST be strictly after starts_at
      - name: requires_gallery_closure
        type: boolean
        source: input
        default: false
        description: whether the window needs the zone closed to visitors
      - name: pre_access_buffer_minutes
        type: integer
        source: computed
        description: access/protection buffer before starts_at (calculations.zone_window_conflict_geometry)
      - name: settling_buffer_minutes
        type: integer
        source: computed
        description: dust/noise settling buffer after ends_at (calculations.zone_window_conflict_geometry)
      - name: effective_start_at
        type: datetime
        source: computed
        description: starts_at minus pre_access_buffer_minutes; left edge of the zone occupation interval
      - name: effective_end_at
        type: datetime
        source: computed
        description: ends_at plus settling_buffer_minutes; right edge (exclusive) of the zone occupation interval
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: museum-operations decision and execution lifecycle
        constraints: "REQUESTED|APPROVED|DENIED|IN_PROGRESS|COMPLETED|CANCELLED"
      - name: denial_reason
        type: string
        source: system
        description: reason recorded on DENIED, either operator-supplied or the literal DESIGN_REVISION_REOPENED for cascaded denials; null otherwise
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectManager who requested the window

  - name: PunchItem
    parent: ExhibitProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> ExhibitProject.id; owning project
      - name: interactive_id
        type: string
        source: input
        description: FK -> Interactive.id; interactive the defect sits on; null when the item is not element-specific
      - name: case_id
        type: string
        source: input
        description: FK -> ArtifactCase.id; case the defect sits on; null when the item is not case-specific
      - name: severity
        type: enum
        source: input
        description: commissioning severity band
        constraints: "BLOCKING|MAJOR|MINOR"
      - name: description
        type: string
        source: input
        description: defect description
        constraints: "1-500 chars, non-blank"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: punch-list lifecycle
        constraints: "OPEN|VERIFIED|WAIVED|CLOSED"
      - name: raised_by_role
        type: string
        source: system
        description: X-User-Role of the caller who raised the item
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller who raised the item; used by the segregation-of-duties check on verification
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller who verified the fix; null until VERIFIED
      - name: verification_note
        type: string
        source: system
        description: note recorded on verification; null until VERIFIED
      - name: waiver_reason
        type: string
        source: system
        description: reason recorded on waiver; null unless WAIVED
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of verification or waiver; null while OPEN

state_machines:
  - entity: ExhibitProject
    state_field: phase
    initial_state: INTERPRETIVE
    terminal_states: [WARRANTY_CLOSED]
    transitions:
      - from: INTERPRETIVE
        to: SCHEMATIC
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=SCHEMATIC"
        actor: ProjectManager
        preconditions:
          - "project.phase == INTERPRETIVE"
          - "project.storyline_title is non-blank"
          - "length(project.objective_codes) >= 2"
          - "project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
        note: "interpretive planning sign-off; content development is complete once storyline and at least two objectives exist"
      - from: SCHEMATIC
        to: DESIGN_DEV
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=DESIGN_DEV"
        actor: ProjectManager
        preconditions:
          - "project.phase == SCHEMATIC"
          - "there exists a DesignPackage with project_id == project.id, stage == SCHEMATIC, status == APPROVED"
          - "project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: DESIGN_DEV
        to: FABRICATION
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=FABRICATION"
        actor: ProjectManager
        preconditions:
          - "project.phase == DESIGN_DEV"
          - "there exists a DesignPackage with project_id == project.id, stage == DESIGN_DEV, status == APPROVED"
          - "every code in project.objective_codes appears as objective_code on at least one Interactive with project_id == project.id, or on at least one ArtifactCase with project_id == project.id (ERR_OBJECTIVE_NOT_ADDRESSED)"
          - "project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: FABRICATION
        to: INSTALLATION
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=INSTALLATION"
        actor: ProjectManager
        preconditions:
          - "project.phase == FABRICATION"
          - "project.posture == OPEN (ERR_PROJECT_POSTURE_RESTRICTED when RESTRICTED, ERR_PROJECT_FROZEN_CONSERVATION when FROZEN_CONSERVATION)"
          - "count(ArtifactCase where project_id == project.id) >= 1 and every such case has status == APPROVED"
          - "count(ShopDrawing where project_id == project.id and status IN {APPROVED, APPROVED_AS_NOTED}) >= 1"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: INSTALLATION
        to: COMMISSIONING
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=COMMISSIONING"
        actor: ProjectManager
        preconditions:
          - "project.phase == INSTALLATION"
          - "every InstallWindow with project_id == project.id has status IN {COMPLETED, DENIED, CANCELLED}"
          - "every Artifact with project_id == project.id and assigned_case_id != null has placement_status == PLACED"
          - "project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: COMMISSIONING
        to: CLOSEOUT
        trigger: "POST /exhibit-projects/{id}/advance-phase with to_phase=CLOSEOUT"
        actor: ProjectManager
        preconditions:
          - "project.phase == COMMISSIONING"
          - "project.blocking_punch_count == 0 (ERR_BLOCKING_PUNCH_ITEMS_OPEN)"
          - "every Interactive with project_id == project.id has status == COMMISSIONED"
          - "project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: CLOSEOUT
        to: WARRANTY_CLOSED
        trigger: "POST /exhibit-projects/{id}/closeout"
        actor: ProjectManager
        preconditions:
          - "project.phase == CLOSEOUT"
          - "project.posture == OPEN (ERR_PROJECT_POSTURE_RESTRICTED)"
          - "project.committed_fabrication_cents > 0 (ERR_NOTHING_TO_SETTLE)"
        side_effects:
          - "run calculations.closeout_settlement in its pinned 7-step order"
          - "set ExhibitProject.retainage_held_cents, ExhibitProject.warranty_reserve_cents, ExhibitProject.released_cents from steps 5, 6, 7"
          - "set ExhibitProject.committed_fabrication_cents to 0 and recompute ExhibitProject.uncommitted_cents"
          - "set ExhibitProject.docent_kit_url, ExhibitProject.maintenance_manual_url, ExhibitProject.parts_commitment_years from the request body"
          - "set ExhibitProject.warranty_registered_at to the logical clock instant"
          - "every PunchItem with project_id == project.id and status IN {VERIFIED, WAIVED} transitions to CLOSED"
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
      - from: DESIGN_DEV
        to: SCHEMATIC
        trigger: "system cascade: a DesignPackage with stage == SCHEMATIC belonging to this project entered REVISION_REQUESTED"
        actor: system
        preconditions:
          - "project.phase == DESIGN_DEV"
          - "the package that entered REVISION_REQUESTED has stage == SCHEMATIC"
        side_effects:
          - "every InstallWindow with project_id == project.id and status == REQUESTED transitions to DENIED with denial_reason = DESIGN_REVISION_REOPENED"
          - "recompute ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
        note: "cyclic revert; the phase machine is not a one-way pipeline"
      - from: FABRICATION
        to: DESIGN_DEV
        trigger: "system cascade: a DesignPackage with stage == DESIGN_DEV belonging to this project entered REVISION_REQUESTED"
        actor: system
        preconditions:
          - "project.phase == FABRICATION"
          - "the package that entered REVISION_REQUESTED has stage == DESIGN_DEV"
        side_effects:
          - "every InstallWindow with project_id == project.id and status == REQUESTED transitions to DENIED with denial_reason = DESIGN_REVISION_REOPENED"
          - "recompute ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"

  - entity: DesignPackage
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /design-packages/{id}/review-rounds"
        actor: ProjectManager
        preconditions:
          - "package.status == DRAFT"
          - "package.superseded_by_package_id is null"
          - "owning project.posture != FROZEN_CONSERVATION (ERR_PROJECT_FROZEN_CONSERVATION)"
          - "decision_deadline_at is strictly after the logical clock instant (ERR_DEADLINE_IN_PAST)"
        side_effects:
          - "create a ReviewRound with package_id = package.id, round_number = package.review_round_count + 1, status OPEN, required_vote_count = ceil(length(panel_roles) * 2 / 3)"
          - "increment DesignPackage.review_round_count by 1"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
      - from: REVISION_REQUESTED
        to: IN_REVIEW
        trigger: "POST /design-packages/{id}/review-rounds"
        actor: ProjectManager
        preconditions:
          - "package.status == REVISION_REQUESTED"
          - "package.superseded_by_package_id is null"
          - "owning project.posture != FROZEN_CONSERVATION"
          - "decision_deadline_at is strictly after the logical clock instant"
        side_effects:
          - "create the next ReviewRound with round_number = package.review_round_count + 1"
          - "increment DesignPackage.review_round_count by 1"
          - "recompute owning ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
        note: "revision loop; a package can re-enter review any number of times, which is what makes this machine cyclic"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system cascade: the package's OPEN ReviewRound reached quorum with approve_count == required_vote_count"
        actor: system
        preconditions:
          - "package.status == IN_REVIEW"
          - "round.cast_vote_count == round.required_vote_count and round.approve_count == round.required_vote_count"
        side_effects:
          - "set DesignPackage.approved_at to the logical clock instant"
          - "recompute owning ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "system cascade: the package's OPEN ReviewRound left OPEN as REVISION_REQUESTED (quorum reached with revise_count >= 1 and veto_count == 0) or as VETOED (any VETO vote), or was lapsed by POST /exhibit-projects/{id}/review-sweep"
        actor: system
        preconditions:
          - "package.status == IN_REVIEW"
        side_effects:
          - "increment DesignPackage.revision_count by 1"
          - "increment owning ExhibitProject.open_revision_count and recompute ExhibitProject.posture (RESTRICTED while any package of the project sits in REVISION_REQUESTED)"
          - "when package.stage == SCHEMATIC and project.phase == DESIGN_DEV, the project reverts DESIGN_DEV -> SCHEMATIC; when package.stage == DESIGN_DEV and project.phase == FABRICATION, the project reverts FABRICATION -> DESIGN_DEV"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
        note: "link 2 of the review cascade; the project-phase revert in the third bullet is link 3, and the install-window denials fired by that revert are link 4"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system cascade: POST /exhibit-projects/{id}/design-packages created a newer package with the same stage"
        actor: system
        preconditions:
          - "package.status IN {DRAFT, IN_REVIEW, REVISION_REQUESTED, APPROVED}"
          - "package.stage == the new package's stage"
        side_effects:
          - "set DesignPackage.superseded_by_package_id to the new package's id"
          - "every ReviewRound with package_id == package.id and status == OPEN transitions to CLOSED_SUPERSEDED"
          - "recompute owning ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
      - from: IN_REVIEW
        to: SUPERSEDED
        trigger: "system cascade: POST /exhibit-projects/{id}/design-packages created a newer package with the same stage"
        actor: system
        preconditions:
          - "package.stage == the new package's stage"
        side_effects:
          - "set DesignPackage.superseded_by_package_id to the new package's id"
          - "every ReviewRound with package_id == package.id and status == OPEN transitions to CLOSED_SUPERSEDED"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system cascade: POST /exhibit-projects/{id}/design-packages created a newer package with the same stage"
        actor: system
        preconditions:
          - "package.stage == the new package's stage"
        side_effects:
          - "set DesignPackage.superseded_by_package_id to the new package's id"
          - "recompute owning ExhibitProject.open_revision_count and ExhibitProject.posture"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade: POST /exhibit-projects/{id}/design-packages created a newer package with the same stage"
        actor: system
        preconditions:
          - "package.stage == the new package's stage"
        side_effects:
          - "set DesignPackage.superseded_by_package_id to the new package's id"
          - "refresh DesignPackage.updated_at and increment DesignPackage.version by 1"

  - entity: ReviewRound
    state_field: status
    initial_state: OPEN
    terminal_states: [APPROVED, REVISION_REQUESTED, VETOED, CLOSED_SUPERSEDED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /review-rounds/{id}/votes with decision=APPROVE that brings cast_vote_count to required_vote_count"
        actor: any role seated on round.panel_roles (Curator | Conservator | ProjectManager | AccessibilitySpecialist | FabricationLead)
        preconditions:
          - "round.status == OPEN"
          - "caller's X-User-Role is a member of round.panel_roles (ERR_VOTER_NOT_ON_PANEL)"
          - "no existing ReviewVote on this round has voter_user_id == caller's X-User-ID (ERR_DUPLICATE_VOTE)"
          - "caller's X-User-ID != package.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "after appending this vote, cast_vote_count == required_vote_count and approve_count == required_vote_count"
        side_effects:
          - "append the ReviewVote row and recompute cast_vote_count, approve_count, revise_count, veto_count"
          - "set ReviewRound.decided_at to the logical clock instant"
          - "the owning DesignPackage transitions IN_REVIEW -> APPROVED"
          - "refresh ReviewRound.updated_at and increment ReviewRound.version by 1"
      - from: OPEN
        to: REVISION_REQUESTED
        trigger: "POST /review-rounds/{id}/votes with the vote that brings cast_vote_count to required_vote_count while revise_count >= 1 and veto_count == 0"
        actor: any role seated on round.panel_roles (Curator | Conservator | ProjectManager | AccessibilitySpecialist | FabricationLead)
        preconditions:
          - "round.status == OPEN"
          - "caller's X-User-Role is a member of round.panel_roles"
          - "no existing ReviewVote on this round has voter_user_id == caller's X-User-ID"
          - "caller's X-User-ID != package.submitted_by_user_id"
          - "after appending this vote, cast_vote_count == required_vote_count, revise_count >= 1, veto_count == 0"
        side_effects:
          - "append the ReviewVote row and recompute the four vote counters"
          - "set ReviewRound.decided_at to the logical clock instant"
          - "the owning DesignPackage transitions IN_REVIEW -> REVISION_REQUESTED (link 2 of the review cascade)"
          - "refresh ReviewRound.updated_at and increment ReviewRound.version by 1"
      - from: OPEN
        to: VETOED
        trigger: "POST /review-rounds/{id}/votes with decision=VETO"
        actor: any role seated on round.panel_roles (Curator | Conservator | ProjectManager | AccessibilitySpecialist | FabricationLead)
        preconditions:
          - "round.status == OPEN"
          - "caller's X-User-Role is a member of round.panel_roles"
          - "no existing ReviewVote on this round has voter_user_id == caller's X-User-ID"
          - "caller's X-User-ID != package.submitted_by_user_id"
        side_effects:
          - "append the ReviewVote row and recompute the four vote counters"
          - "set ReviewRound.decided_at to the logical clock instant; quorum is NOT required for a veto"
          - "the owning DesignPackage transitions IN_REVIEW -> REVISION_REQUESTED"
          - "when the vote's voter_role == Conservator, increment ExhibitProject.conservation_veto_count by 1, which raises conservation_block_count and drives ExhibitProject.posture to FROZEN_CONSERVATION"
          - "refresh ReviewRound.updated_at and increment ReviewRound.version by 1"
        note: "branching fork-join: the three OPEN exits carry divergent side-effect sets, and only the Conservator veto branch freezes the project"
      - from: OPEN
        to: REVISION_REQUESTED
        trigger: "POST /exhibit-projects/{id}/review-sweep when the logical clock instant is >= round.decision_deadline_at"
        actor: ProjectManager
        preconditions:
          - "round.status == OPEN"
          - "logical clock now >= round.decision_deadline_at"
        side_effects:
          - "set ReviewRound.swept_by_deadline = true and ReviewRound.decided_at to the logical clock instant"
          - "the owning DesignPackage transitions IN_REVIEW -> REVISION_REQUESTED"
          - "rounds are swept in ascending (decision_deadline_at, created_at) order so the sweep is order-deterministic"
          - "refresh ReviewRound.updated_at and increment ReviewRound.version by 1"
        note: "ops-run checkpoint: deadline lapse counts as a revision request, no vote required"
      - from: OPEN
        to: CLOSED_SUPERSEDED
        trigger: "system cascade: the owning DesignPackage became SUPERSEDED"
        actor: system
        preconditions:
          - "round.status == OPEN"
        side_effects:
          - "set ReviewRound.decided_at to the logical clock instant"
          - "refresh ReviewRound.updated_at and increment ReviewRound.version by 1"

  - entity: ArtifactCase
    state_field: status
    dimension: conservation_approval
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CONSERVATOR_REVIEW
        trigger: "POST /artifact-cases/{id}/submit-for-conservation"
        actor: ProjectManager
        preconditions:
          - "case.status == DRAFT"
          - "case.placed_artifact_count >= 1 (ERR_CASE_HAS_NO_ARTIFACTS)"
          - "owning project.posture != FROZEN_CONSERVATION (ERR_PROJECT_FROZEN_CONSERVATION)"
        side_effects:
          - "recompute calculations.case_environmental_envelope for this case"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: REJECTED
        to: CONSERVATOR_REVIEW
        trigger: "POST /artifact-cases/{id}/submit-for-conservation"
        actor: ProjectManager
        preconditions:
          - "case.status == REJECTED"
          - "case.placed_artifact_count >= 1"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "decrement ExhibitProject.conservation_block_count by 1 and recompute ExhibitProject.posture"
          - "recompute calculations.case_environmental_envelope for this case"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
        note: "rework loop; the project must first be un-frozen by clearing every other conservation block, so this path is only reachable when this case was the last block"
      - from: CONSERVATOR_REVIEW
        to: APPROVED
        trigger: "POST /artifact-cases/{id}/conservator-decision with decision=APPROVE"
        actor: Conservator
        preconditions:
          - "case.status == CONSERVATOR_REVIEW"
          - "case.env_feasible == true (ERR_ENV_ENVELOPE_INFEASIBLE)"
          - "case.security_ok == true (ERR_SECURITY_TIER_INSUFFICIENT)"
          - "GalleryZone(case.zone_id).available_case_slots >= 1 (ERR_ZONE_CASE_SLOTS_EXHAUSTED)"
        side_effects:
          - "set ArtifactCase.decided_at to the logical clock instant and ArtifactCase.conditions to null"
          - "increment GalleryZone(case.zone_id).reserved_case_slots by 1 and recompute available_case_slots; refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "recompute ExhibitProject.conditional_case_count and ExhibitProject.posture"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: CONSERVATOR_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "POST /artifact-cases/{id}/conservator-decision with decision=APPROVE_WITH_CONDITIONS"
        actor: Conservator
        preconditions:
          - "case.status == CONSERVATOR_REVIEW"
          - "case.env_feasible == true"
          - "case.security_ok == true"
          - "GalleryZone(case.zone_id).available_case_slots >= 1"
          - "the request body supplies a non-blank conditions string (ERR_INVALID_REQUEST)"
        side_effects:
          - "set ArtifactCase.conditions from the request body and ArtifactCase.decided_at to the logical clock instant"
          - "increment GalleryZone(case.zone_id).reserved_case_slots by 1 and recompute available_case_slots; refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "increment ExhibitProject.conditional_case_count by 1, which drives ExhibitProject.posture to RESTRICTED"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: CONSERVATOR_REVIEW
        to: REJECTED
        trigger: "POST /artifact-cases/{id}/conservator-decision with decision=REJECT"
        actor: Conservator
        preconditions:
          - "case.status == CONSERVATOR_REVIEW"
        side_effects:
          - "set ArtifactCase.decided_at to the logical clock instant"
          - "every Artifact with assigned_case_id == case.id and placement_status == RESERVED transitions to UNPLACED and has assigned_case_id set to null"
          - "recompute ArtifactCase.placed_artifact_count (falls to 0) and null out required_rh_min_pct, required_rh_max_pct, allowed_lux"
          - "increment ExhibitProject.conservation_block_count by 1, which drives ExhibitProject.posture to FROZEN_CONSERVATION"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "system cascade: a ShopDrawing with subject_case_id == case.id became VOID"
        actor: system
        preconditions:
          - "case.status IN {APPROVED, CONDITIONALLY_APPROVED}"
        side_effects:
          - "decrement GalleryZone(case.zone_id).reserved_case_slots by 1 and recompute available_case_slots (compensating release of the slot reserved on approval); refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "when case.mount_status == MOUNT_FABRICATED it resets to MOUNT_DESIGN"
          - "every Artifact with assigned_case_id == case.id and placement_status == RESERVED transitions to UNPLACED with assigned_case_id set to null; recompute placed_artifact_count and the envelope fields"
          - "recompute ExhibitProject.conditional_case_count and ExhibitProject.posture"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
        note: "link 3 of the conservation cascade (material rejection -> drawing void -> case revert -> artifact release + zone slot release)"
      - from: CONDITIONALLY_APPROVED
        to: DRAFT
        trigger: "system cascade: a ShopDrawing with subject_case_id == case.id became VOID"
        actor: system
        preconditions:
          - "case.status == CONDITIONALLY_APPROVED"
        side_effects:
          - "decrement GalleryZone(case.zone_id).reserved_case_slots by 1 and recompute available_case_slots; refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "clear ArtifactCase.conditions"
          - "when case.mount_status == MOUNT_FABRICATED it resets to MOUNT_DESIGN"
          - "every Artifact with assigned_case_id == case.id and placement_status == RESERVED transitions to UNPLACED with assigned_case_id set to null"
          - "decrement ExhibitProject.conditional_case_count by 1 and recompute ExhibitProject.posture"
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"

  - entity: ArtifactCase
    state_field: mount_status
    dimension: mount_making
    initial_state: NOT_STARTED
    terminal_states: [MOUNT_INSTALLED]
    transitions:
      - from: NOT_STARTED
        to: MOUNT_DESIGN
        trigger: "POST /artifact-cases/{id}/mount-advance with to_mount_status=MOUNT_DESIGN"
        actor: Conservator
        preconditions:
          - "case.mount_status == NOT_STARTED"
          - "case.status IN {CONSERVATOR_REVIEW, CONDITIONALLY_APPROVED, APPROVED} (ERR_INVALID_CASE_STATE)"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
        note: "mount_status advances independently of status; a case can be in CONSERVATOR_REVIEW with mount_status MOUNT_DESIGN"
      - from: MOUNT_DESIGN
        to: MOUNT_FABRICATED
        trigger: "POST /artifact-cases/{id}/mount-advance with to_mount_status=MOUNT_FABRICATED"
        actor: Conservator
        preconditions:
          - "case.mount_status == MOUNT_DESIGN"
          - "case.status IN {APPROVED, CONDITIONALLY_APPROVED}"
          - "there exists a ShopDrawing with subject_case_id == case.id and status IN {APPROVED, APPROVED_AS_NOTED}"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: MOUNT_FABRICATED
        to: MOUNT_INSTALLED
        trigger: "POST /artifact-cases/{id}/mount-advance with to_mount_status=MOUNT_INSTALLED"
        actor: Conservator
        preconditions:
          - "case.mount_status == MOUNT_FABRICATED"
          - "owning project.phase == INSTALLATION (ERR_INVALID_PROJECT_PHASE)"
          - "there exists an InstallWindow with zone_id == case.zone_id and status == IN_PROGRESS (ERR_INVALID_WINDOW_STATE)"
        side_effects:
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: MOUNT_FABRICATED
        to: MOUNT_DESIGN
        trigger: "system cascade: the case's status dimension reverted to DRAFT because a ShopDrawing with subject_case_id == case.id became VOID"
        actor: system
        preconditions:
          - "case.mount_status == MOUNT_FABRICATED"
        side_effects:
          - "refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"

  - entity: Artifact
    state_field: placement_status
    initial_state: UNPLACED
    terminal_states: [DEINSTALLED]
    transitions:
      - from: UNPLACED
        to: RESERVED
        trigger: "POST /artifact-cases/{id}/placements"
        actor: Curator | Conservator
        preconditions:
          - "artifact.placement_status == UNPLACED (ERR_ARTIFACT_ALREADY_PLACED)"
          - "artifact.project_id == case.project_id (ERR_CROSS_PROJECT_REFERENCE)"
          - "case.status IN {DRAFT, CONSERVATOR_REVIEW} (ERR_INVALID_CASE_STATE)"
          - "expected_case_version == case.version (ERR_STALE_CASE_VERSION)"
        side_effects:
          - "set Artifact.assigned_case_id to case.id"
          - "increment ArtifactCase.placed_artifact_count by 1 and recompute calculations.case_environmental_envelope (required_rh_min_pct, required_rh_max_pct, allowed_lux, env_feasible, security_ok)"
          - "refresh Artifact.updated_at and increment Artifact.version by 1; refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
      - from: RESERVED
        to: UNPLACED
        trigger: "DELETE /artifact-cases/{id}/placements/{artifact_id}, or system cascade when the case is REJECTED or reverts to DRAFT"
        actor: Curator | Conservator | system
        preconditions:
          - "artifact.placement_status == RESERVED"
          - "artifact.assigned_case_id == case.id (ERR_ARTIFACT_NOT_IN_CASE)"
        side_effects:
          - "set Artifact.assigned_case_id to null"
          - "decrement ArtifactCase.placed_artifact_count by 1 and recompute the envelope fields from the remaining placed artifacts (null when none remain)"
          - "refresh Artifact.updated_at and increment Artifact.version by 1; refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
        note: "compensating action for the placement; placed_artifact_count returns to its pre-placement value with no drift"
      - from: RESERVED
        to: PLACED
        trigger: "system cascade: POST /install-windows/{id}/complete on a window whose zone_id matches the artifact's case zone_id"
        actor: system
        preconditions:
          - "artifact.placement_status == RESERVED"
          - "ArtifactCase(artifact.assigned_case_id).zone_id == window.zone_id"
        side_effects:
          - "refresh Artifact.updated_at and increment Artifact.version by 1"
      - from: PLACED
        to: DEINSTALLED
        trigger: "DELETE /artifact-cases/{id}/placements/{artifact_id}"
        actor: Curator | Conservator
        preconditions:
          - "artifact.placement_status == PLACED"
          - "artifact.assigned_case_id == case.id"
        side_effects:
          - "set Artifact.assigned_case_id to null"
          - "decrement ArtifactCase.placed_artifact_count by 1 and recompute the envelope fields"
          - "refresh Artifact.updated_at and increment Artifact.version by 1; refresh ArtifactCase.updated_at and increment ArtifactCase.version by 1"
        note: "removing an already-installed object deinstalls it rather than returning it to the unplaced pool; the four placement_status buckets always partition the project's artifacts"

  - entity: MaterialSpec
    state_field: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: CONSERVATOR_REVIEW
        trigger: "POST /material-specs/{id}/submit-for-conservation"
        actor: FabricationLead
        preconditions:
          - "spec.status == SUBMITTED"
          - "spec.oddy_test_result != UNTESTED (ERR_INVALID_MATERIAL_STATE)"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "recompute calculations.material_offgassing_verdict into MaterialSpec.verdict"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
      - from: REJECTED
        to: CONSERVATOR_REVIEW
        trigger: "POST /material-specs/{id}/submit-for-conservation"
        actor: FabricationLead
        preconditions:
          - "spec.status == REJECTED"
          - "spec.oddy_test_result != UNTESTED"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "decrement ExhibitProject.conservation_block_count by 1 and recompute ExhibitProject.posture"
          - "recompute MaterialSpec.verdict"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
        note: "resubmission loop after a reformulated sample clears the chamber test"
      - from: APPROVED
        to: CONSERVATOR_REVIEW
        trigger: "POST /material-specs/{id}/submit-for-conservation"
        actor: FabricationLead
        preconditions:
          - "spec.status == APPROVED"
          - "spec.oddy_test_result != UNTESTED"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "increment ExhibitProject.pending_material_count by 1 and recompute ExhibitProject.posture (RESTRICTED while the re-review is open)"
          - "recompute MaterialSpec.verdict from the current chamber numbers"
          - "every ShopDrawing already issued from this spec keeps its status; only a REJECT decision voids them"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
        note: "re-review of a cleared material: a new production lot is submitted for chamber re-testing. This edge is what makes the depth-4 conservation cascade reachable, because a spec that already carries APPROVED shop drawings can still end up REJECTED."
      - from: CONDITIONAL
        to: CONSERVATOR_REVIEW
        trigger: "POST /material-specs/{id}/submit-for-conservation"
        actor: FabricationLead
        preconditions:
          - "spec.status == CONDITIONAL"
          - "spec.oddy_test_result != UNTESTED"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "increment ExhibitProject.pending_material_count by 1 and recompute ExhibitProject.posture"
          - "recompute MaterialSpec.verdict and clear MaterialSpec.conditions"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
      - from: CONSERVATOR_REVIEW
        to: APPROVED
        trigger: "POST /material-specs/{id}/conservator-decision with decision=APPROVE"
        actor: Conservator
        preconditions:
          - "spec.status == CONSERVATOR_REVIEW"
          - "spec.verdict == CONSERVATION_SAFE (ERR_OFFGASSING_LIMIT_EXCEEDED)"
        side_effects:
          - "set MaterialSpec.decided_at to the logical clock instant and MaterialSpec.conditions to null"
          - "decrement ExhibitProject.pending_material_count by 1 and recompute ExhibitProject.posture"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
      - from: CONSERVATOR_REVIEW
        to: CONDITIONAL
        trigger: "POST /material-specs/{id}/conservator-decision with decision=APPROVE_WITH_CONDITIONS"
        actor: Conservator
        preconditions:
          - "spec.status == CONSERVATOR_REVIEW"
          - "spec.verdict IN {CONSERVATION_SAFE, CONDITIONAL_SAFE} (ERR_OFFGASSING_LIMIT_EXCEEDED)"
          - "the request body supplies a non-blank conditions string (ERR_INVALID_REQUEST)"
        side_effects:
          - "set MaterialSpec.conditions from the request body and MaterialSpec.decided_at to the logical clock instant"
          - "decrement ExhibitProject.pending_material_count by 1 and recompute ExhibitProject.posture"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
        note: "a CONDITIONAL material may only carry a drawing to APPROVED_AS_NOTED, never to APPROVED"
      - from: CONSERVATOR_REVIEW
        to: REJECTED
        trigger: "POST /material-specs/{id}/conservator-decision with decision=REJECT"
        actor: Conservator
        preconditions:
          - "spec.status == CONSERVATOR_REVIEW"
        side_effects:
          - "set MaterialSpec.decided_at to the logical clock instant"
          - "link 1: every ShopDrawing with material_spec_id == spec.id and status IN {SUBMITTED, UNDER_REVIEW, APPROVED, APPROVED_AS_NOTED} transitions to VOID with void_reason = MATERIAL_SPEC_REJECTED, processed in ascending created_at order"
          - "link 2 (caused by each VOID): a drawing that was APPROVED or APPROVED_AS_NOTED releases its actual_cost_cents from ExhibitProject.committed_fabrication_cents back into uncommitted_cents, and its subject_case_id ArtifactCase reverts APPROVED/CONDITIONALLY_APPROVED -> DRAFT with mount_status MOUNT_FABRICATED -> MOUNT_DESIGN"
          - "link 3 (caused by each case revert): every Artifact with assigned_case_id == that case and placement_status == RESERVED transitions to UNPLACED with assigned_case_id null, and the case's zone releases one reserved_case_slot"
          - "link 4 (caused by the slot release and the rejection itself): GalleryZone.available_case_slots is recomputed, ExhibitProject.conservation_block_count increments, and ExhibitProject.posture becomes FROZEN_CONSERVATION"
          - "decrement ExhibitProject.pending_material_count by 1"
          - "refresh MaterialSpec.updated_at and increment MaterialSpec.version by 1"
        note: "depth-4 conservation cascade; each link is caused by the preceding link, not by the original request"

  - entity: ShopDrawing
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /shop-drawings/{id}/start-review"
        actor: ProjectManager
        preconditions:
          - "drawing.status == SUBMITTED"
          - "owning project.phase IN {DESIGN_DEV, FABRICATION} (ERR_INVALID_PROJECT_PHASE)"
        side_effects:
          - "refresh ShopDrawing.updated_at and increment ShopDrawing.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /shop-drawings/{id}/decision with decision=APPROVE"
        actor: ProjectManager
        preconditions:
          - "drawing.status == UNDER_REVIEW"
          - "owning project.posture != FROZEN_CONSERVATION"
          - "caller's X-User-ID != drawing.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "MaterialSpec(drawing.material_spec_id).status == APPROVED (ERR_MATERIAL_NOT_CONSERVATION_APPROVED)"
          - "the request body supplies actual_shop_hours and actual_waste_factor (ERR_INVALID_REQUEST)"
          - "the shop_drawing_actual total <= ExhibitProject.uncommitted_cents (ERR_FABRICATION_BUDGET_EXCEEDED)"
        side_effects:
          - "store actual_shop_hours and actual_waste_factor, then run calculations.fabrication_cost_estimate variant shop_drawing_actual to fill actual_labor_cents, actual_material_cents, actual_finishing_cents, actual_cost_cents"
          - "increase ExhibitProject.committed_fabrication_cents by actual_cost_cents and recompute uncommitted_cents; refresh ExhibitProject.updated_at and increment ExhibitProject.version by 1"
          - "refresh ShopDrawing.updated_at and increment ShopDrawing.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED_AS_NOTED
        trigger: "POST /shop-drawings/{id}/decision with decision=APPROVE_AS_NOTED"
        actor: ProjectManager
        preconditions:
          - "drawing.status == UNDER_REVIEW"
          - "owning project.posture != FROZEN_CONSERVATION"
          - "caller's X-User-ID != drawing.submitted_by_user_id"
          - "MaterialSpec(drawing.material_spec_id).status IN {APPROVED, CONDITIONAL} (ERR_MATERIAL_NOT_CONSERVATION_APPROVED)"
          - "the request body supplies actual_shop_hours and actual_waste_factor"
          - "the shop_drawing_actual total <= ExhibitProject.uncommitted_cents"
        side_effects:
          - "same cost and ledger side effects as the APPROVED branch"
          - "refresh ShopDrawing.updated_at and increment ShopDrawing.version by 1"
        note: "the divergent branch that a CONDITIONAL material can reach; the money effect is identical, the conservation status recorded on the sheet is not"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /shop-drawings/{id}/decision with decision=REJECT"
        actor: ProjectManager
        preconditions:
          - "drawing.status == UNDER_REVIEW"
          - "caller's X-User-ID != drawing.submitted_by_user_id"
        side_effects:
          - "no ledger movement; committed_fabrication_cents is untouched"
          - "refresh ShopDrawing.updated_at and increment ShopDrawing.version by 1"
      - from: APPROVED
        to: VOID
        trigger: "POST /shop-drawings/{id}/void, or system cascade when MaterialSpec(drawing.material_spec_id) becomes REJECTED"
        actor: ProjectManager | system
        preconditions:
          - "drawing.status IN {SUBMITTED, UNDER_REVIEW, APPROVED, APPROVED_AS_NOTED}"
        side_effects:
          - "release actual_cost_cents from ExhibitProject.committed_fabrication_cents back into uncommitted_cents (compensating action; the five-bucket money identity is preserved exactly)"
          - "the subject ArtifactCase reverts APPROVED/CONDITIONALLY_APPROVED -> DRAFT, which releases one GalleryZone case slot and un-reserves that case's artifacts"
          - "set ShopDrawing.void_reason and refresh ShopDrawing.updated_at; increment ShopDrawing.version by 1"
      - from: APPROVED_AS_NOTED
        to: VOID
        trigger: "POST /shop-drawings/{id}/void, or system cascade when MaterialSpec(drawing.material_spec_id) becomes REJECTED"
        actor: ProjectManager | system
        preconditions:
          - "drawing.status == APPROVED_AS_NOTED"
        side_effects:
          - "release actual_cost_cents from ExhibitProject.committed_fabrication_cents back into uncommitted_cents"
          - "the subject ArtifactCase reverts CONDITIONALLY_APPROVED/APPROVED -> DRAFT with the same slot and artifact releases"
          - "set ShopDrawing.void_reason and increment ShopDrawing.version by 1"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /shop-drawings/{id}/void, or system cascade when MaterialSpec(drawing.material_spec_id) becomes REJECTED"
        actor: ProjectManager | system
        preconditions:
          - "drawing.status == SUBMITTED"
        side_effects:
          - "no ledger movement (actual_cost_cents is still null) and no case revert"
          - "set ShopDrawing.void_reason and increment ShopDrawing.version by 1"
      - from: UNDER_REVIEW
        to: VOID
        trigger: "POST /shop-drawings/{id}/void, or system cascade when MaterialSpec(drawing.material_spec_id) becomes REJECTED"
        actor: ProjectManager | system
        preconditions:
          - "drawing.status == UNDER_REVIEW"
        side_effects:
          - "no ledger movement and no case revert"
          - "set ShopDrawing.void_reason and increment ShopDrawing.version by 1"

  - entity: Interactive
    state_field: status
    initial_state: SPECIFIED
    terminal_states: [COMMISSIONED]
    transitions:
      - from: SPECIFIED
        to: PROTOTYPE_SUBMITTED
        trigger: "POST /interactives/{id}/submit-prototype"
        actor: FabricationLead
        preconditions:
          - "interactive.status == SPECIFIED"
          - "owning project.phase IN {DESIGN_DEV, FABRICATION}"
        side_effects:
          - "increment Interactive.prototype_iteration by 1 and set Interactive.submitted_by_user_id to the caller's X-User-ID"
          - "refresh Interactive.updated_at and increment Interactive.version by 1"
      - from: PROTOTYPE_REJECTED
        to: PROTOTYPE_SUBMITTED
        trigger: "POST /interactives/{id}/submit-prototype"
        actor: FabricationLead
        preconditions:
          - "interactive.status == PROTOTYPE_REJECTED"
          - "owning project.phase IN {DESIGN_DEV, FABRICATION}"
        side_effects:
          - "increment Interactive.prototype_iteration by 1 and set Interactive.submitted_by_user_id to the caller's X-User-ID"
          - "refresh Interactive.updated_at and increment Interactive.version by 1"
        note: "prototype iteration loop"
      - from: PROTOTYPE_SUBMITTED
        to: PROTOTYPE_APPROVED
        trigger: "POST /interactives/{id}/prototype-decision with decision=APPROVE"
        actor: ProjectManager | Conservator
        preconditions:
          - "interactive.status == PROTOTYPE_SUBMITTED"
          - "caller's X-User-ID != interactive.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "the request body supplies measured_daily_uses and measured_mtbf_cycles (ERR_INVALID_REQUEST)"
        side_effects:
          - "store measured_daily_uses and measured_mtbf_cycles"
          - "run calculations.interactive_durability_index variant prototype_verified into Interactive.durability_index_verified and recompute Interactive.maintenance_tier from it"
          - "refresh Interactive.updated_at and increment Interactive.version by 1"
      - from: PROTOTYPE_SUBMITTED
        to: PROTOTYPE_REJECTED
        trigger: "POST /interactives/{id}/prototype-decision with decision=REJECT"
        actor: ProjectManager | Conservator
        preconditions:
          - "interactive.status == PROTOTYPE_SUBMITTED"
          - "caller's X-User-ID != interactive.submitted_by_user_id"
        side_effects:
          - "leave measured_daily_uses, measured_mtbf_cycles and durability_index_verified untouched, so maintenance_tier keeps deriving from durability_index_spec"
          - "refresh Interactive.updated_at and increment Interactive.version by 1"
      - from: PROTOTYPE_APPROVED
        to: FABRICATED
        trigger: "POST /interactives/{id}/mark-fabricated"
        actor: FabricationLead
        preconditions:
          - "interactive.status == PROTOTYPE_APPROVED (ERR_PROTOTYPE_NOT_APPROVED)"
          - "owning project.phase IN {FABRICATION, INSTALLATION}"
          - "owning project.posture != FROZEN_CONSERVATION"
        side_effects:
          - "refresh Interactive.updated_at and increment Interactive.version by 1"
      - from: FABRICATED
        to: COMMISSIONED
        trigger: "POST /interactives/{id}/commission"
        actor: ProjectManager
        preconditions:
          - "interactive.status == FABRICATED"
          - "owning project.phase == COMMISSIONING (ERR_INVALID_PROJECT_PHASE)"
          - "no PunchItem with interactive_id == interactive.id has severity == BLOCKING and status == OPEN (ERR_BLOCKING_PUNCH_ITEMS_OPEN)"
        side_effects:
          - "refresh Interactive.updated_at and increment Interactive.version by 1"

  - entity: InstallWindow
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /install-windows/{id}/decision with decision=APPROVE"
        actor: MuseumOperations
        preconditions:
          - "window.status == REQUESTED"
          - "GalleryZone(window.zone_id).occupancy_state != CLOSED (ERR_ZONE_CLOSED_FOR_WORK)"
          - "window.requires_gallery_closure == false OR GalleryZone(window.zone_id).closure_allowed == true (ERR_ZONE_CLOSED_FOR_WORK)"
          - "calculations.zone_window_conflict_geometry finds no conflicting window on the same zone (ERR_ZONE_WINDOW_CONFLICT)"
          - "calculations.project_closure_capacity_peak stays within ExhibitProject.max_concurrent_closures (ERR_CLOSURE_CAPACITY_EXCEEDED)"
        side_effects:
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"
        note: "the two geometry checks are the guarded, cross-entity part of this transition: one is per-zone, one is project-wide"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /install-windows/{id}/decision with decision=DENY, or system cascade when the owning project reverts phase because a DesignPackage entered REVISION_REQUESTED"
        actor: MuseumOperations | system
        preconditions:
          - "window.status == REQUESTED"
        side_effects:
          - "set InstallWindow.denial_reason from the request body, or to the literal DESIGN_REVISION_REOPENED for the cascaded form"
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /install-windows/{id}/start"
        actor: MuseumOperations
        preconditions:
          - "window.status == APPROVED"
          - "owning project.phase == INSTALLATION (ERR_INVALID_PROJECT_PHASE)"
          - "logical clock now >= window.starts_at (ERR_INVALID_WINDOW_STATE)"
        side_effects:
          - "GalleryZone(window.zone_id).occupancy_state becomes CLOSED when window.requires_gallery_closure is true, else PARTIAL_CLOSURE; refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /install-windows/{id}/complete"
        actor: MuseumOperations
        preconditions:
          - "window.status == IN_PROGRESS"
        side_effects:
          - "GalleryZone(window.zone_id).occupancy_state returns to OPERATING; refresh GalleryZone.updated_at and increment GalleryZone.version by 1"
          - "every Artifact whose assigned_case_id names an ArtifactCase with zone_id == window.zone_id and whose placement_status == RESERVED transitions to PLACED, processed in ascending Artifact.created_at order"
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /install-windows/{id}/cancel"
        actor: MuseumOperations | FabricationLead
        preconditions:
          - "window.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "the window leaves both occupation sets, so calculations.zone_window_conflict_geometry and calculations.project_closure_capacity_peak stop counting it"
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /install-windows/{id}/cancel"
        actor: MuseumOperations | FabricationLead
        preconditions:
          - "window.status == REQUESTED"
        side_effects:
          - "refresh InstallWindow.updated_at and increment InstallWindow.version by 1"

  - entity: PunchItem
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /punch-items/{id}/verify"
        actor: FabricationLead | ProjectManager
        preconditions:
          - "item.status == OPEN"
          - "caller's X-User-ID != item.raised_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "owning project.phase IN {COMMISSIONING, CLOSEOUT} (ERR_INVALID_PROJECT_PHASE)"
        side_effects:
          - "set PunchItem.verified_by_user_id, PunchItem.verification_note and PunchItem.verified_at (logical clock instant)"
          - "when item.severity == BLOCKING, decrement ExhibitProject.blocking_punch_count by 1 and recompute ExhibitProject.posture"
          - "refresh PunchItem.updated_at and increment PunchItem.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /punch-items/{id}/waive"
        actor: ProjectManager
        preconditions:
          - "item.status == OPEN"
          - "item.severity IN {MAJOR, MINOR} (ERR_INVALID_PUNCH_STATE) - a BLOCKING item can never be waived"
          - "owning project.phase IN {COMMISSIONING, CLOSEOUT}"
        side_effects:
          - "set PunchItem.waiver_reason and PunchItem.verified_at (logical clock instant)"
          - "refresh PunchItem.updated_at and increment PunchItem.version by 1"
      - from: VERIFIED
        to: CLOSED
        trigger: "system cascade: POST /exhibit-projects/{id}/closeout"
        actor: system
        preconditions:
          - "item.status IN {VERIFIED, WAIVED}"
        side_effects:
          - "refresh PunchItem.updated_at and increment PunchItem.version by 1"
      - from: WAIVED
        to: CLOSED
        trigger: "system cascade: POST /exhibit-projects/{id}/closeout"
        actor: system
        preconditions:
          - "item.status == WAIVED"
        side_effects:
          - "refresh PunchItem.updated_at and increment PunchItem.version by 1"

concurrency_rules:
  - rule_id: design-package-create-stale-project
    parent_entity: ExhibitProject
    write_endpoint: "POST /exhibit-projects/{id}/design-packages"
    occ_field: "expected_project_version"
    description: |
      Creating a DesignPackage against an ExhibitProject whose version has
      advanced since the client last read it is rejected. This captures the
      case where another writer has already created a package of the same
      stage - which legitimately supersedes the prior package and its open
      review round - so the current writer's view of the project, including
      which package is current, is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: placement-create-stale-case
    parent_entity: ArtifactCase
    write_endpoint: "POST /artifact-cases/{id}/placements"
    occ_field: "expected_case_version"
    description: |
      Placing an Artifact into an ArtifactCase whose version has advanced
      since the client last read it is rejected. A placement is legitimate
      on its own terms - a case accepts many objects - but each placement
      rewrites the case's strictest-wins environmental envelope, so a client
      holding a stale case version is reasoning about an envelope that no
      longer exists.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

calculations:
  - name: fabrication_cost_estimate
    trigger: "on POST /shop-drawings (variant schematic_estimate, writes estimate_* fields) and on POST /shop-drawings/{id}/decision with decision IN {APPROVE, APPROVE_AS_NOTED} (variant shop_drawing_actual, writes actual_* fields and moves the project ledger)"
    algorithm: tiered_pricing
    formula: |
      # THREE LINE ITEMS, EACH ROUNDED TO WHOLE CENTS BEFORE THE SUM.
      # The rounding ORDER is pinned: round-per-line-item-then-sum.
      # Summing the unrounded line items and rounding once at the end is WRONG
      # and can differ by up to 1 cent per line item.
      labor_cents     = round_half_up(hours * SHOP_RATE_CENTS_PER_HOUR[drawing.complexity_tier] * labor_multiplier)
      material_cents  = round_half_up(drawing.material_area_m2 * MATERIAL_RATE_CENTS_PER_M2[MaterialSpec(drawing.material_spec_id).used_in] * waste_factor)
      finishing_cents = round_half_up(material_cents * FINISH_PCT[drawing.finish_grade])   # keyed on the ALREADY-ROUNDED material_cents
      total_cents     = labor_cents + material_cents + finishing_cents
    input_set: "exactly one ShopDrawing row plus the MaterialSpec named by its material_spec_id; no aggregation over sibling drawings"
    constants:
      SHOP_RATE_CENTS_PER_HOUR: { STANDARD: 9500, PRECISION: 14500, CONSERVATION_GRADE: 18500 }
      MATERIAL_RATE_CENTS_PER_M2: { CASE_INTERIOR: 42500, CASE_EXTERIOR: 31000, MOUNT: 58000, GRAPHIC: 12500, INTERACTIVE_HOUSING: 47500 }
      FINISH_PCT: { MILL: 0.0, SATIN: 0.075, MUSEUM_GLOSS: 0.135 }
      SCHEMATIC_LABOR_CONTINGENCY: 1.15
      SCHEMATIC_WASTE_FACTOR: 1.20
    precision: "whole cents, round_half_up, applied per line item before summing"
    variants:
      - name: schematic_estimate
        when: "at POST /shop-drawings, before any shop verification exists"
        difference: "hours = drawing.shop_hours, labor_multiplier = SCHEMATIC_LABOR_CONTINGENCY (1.15), waste_factor = SCHEMATIC_WASTE_FACTOR (1.20); results land in estimate_labor_cents / estimate_material_cents / estimate_finishing_cents / estimate_total_cents and never touch the project ledger"
      - name: shop_drawing_actual
        when: "at POST /shop-drawings/{id}/decision with decision IN {APPROVE, APPROVE_AS_NOTED}"
        difference: "hours = request actual_shop_hours, labor_multiplier = 1.00 (the schematic contingency is dropped, not re-based), waste_factor = request actual_waste_factor; results land in actual_* fields and actual_cost_cents is the amount committed against ExhibitProject.committed_fabrication_cents"

  - name: interactive_durability_index
    trigger: "on POST /exhibit-projects/{id}/interactives (variant spec_stage, writes durability_index_spec) and on POST /interactives/{id}/prototype-decision with decision=APPROVE (variant prototype_verified, writes durability_index_verified); maintenance_tier is re-derived after either"
    algorithm: weighted_scoring
    formula: |
      wear_ratio    = (uses_per_day * duty_hours_per_day * OPERATING_DAYS_PER_YEAR) / mtbf
      wear_penalty  = W_WEAR * min(WEAR_PENALTY_CAP, wear_ratio * 100)      # capped, so the score is non-linear in uses_per_day
      kind_penalty  = W_KIND * KIND_FRAGILITY[interactive.kind]
      parts_penalty = W_PARTS * max(0, PARTS_TARGET_YEARS - interactive.parts_availability_years) * 5
      index         = round_half_up(min(100.0, 100 - wear_penalty - kind_penalty - parts_penalty + prototype_credit), 2)
      # maintenance_tier is derived from durability_index_verified when it is
      # non-null, otherwise from durability_index_spec, using >= boundaries:
      #   >= 80 -> LOW ; >= 60 -> MEDIUM ; >= 40 -> HIGH ; else CRITICAL
    input_set: "exactly one Interactive row; the two variants read different fields of that same row, never sibling elements"
    constants:
      OPERATING_DAYS_PER_YEAR: 320
      KIND_FRAGILITY: { TOUCHSCREEN: 18, MECHANICAL: 26, PROJECTION: 14, AUDIO: 8, AR_HEADSET: 34 }
      W_WEAR: 0.55
      W_KIND: 0.9
      W_PARTS: 1.0
      WEAR_PENALTY_CAP: 60.0
      PARTS_TARGET_YEARS: 10
      PROTOTYPE_CREDIT: 8
      TIER_THRESHOLDS: { LOW: 80, MEDIUM: 60, HIGH: 40 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: spec_stage
        when: "at element specification"
        difference: "uses_per_day = expected_daily_uses, mtbf = mtbf_cycles, prototype_credit = 0"
      - name: prototype_verified
        when: "at prototype approval, once bench-measured figures exist"
        difference: "uses_per_day = measured_daily_uses, mtbf = measured_mtbf_cycles, prototype_credit = PROTOTYPE_CREDIT (8), and the result is clamped to 100.0; a measured element can therefore land in a different maintenance_tier than its own specification predicted"

  - name: case_environmental_envelope
    trigger: "on POST /artifact-cases/{id}/placements, on DELETE /artifact-cases/{id}/placements/{artifact_id}, on POST /artifact-cases/{id}/submit-for-conservation, and on every cascade that un-reserves an artifact from the case"
    algorithm: constraint_propagation
    formula: |
      placed = { Artifact a : a.assigned_case_id == case.id AND a.placement_status IN {RESERVED, PLACED} }
      case_volume_m3 = round_half_up((interior_l_cm * interior_w_cm * interior_h_cm) / 1000000.0, 4)
      silica_gel_kg  = round_half_up(case_volume_m3 * air_exchanges_per_day * SILICA_KG_PER_M3_EXCHANGE, 2)
      if placed is empty:
        required_rh_min_pct = null ; required_rh_max_pct = null ; allowed_lux = null
        env_feasible = true ; security_ok = true
      else:
        required_rh_min_pct = max over placed of a.required_rh_min_pct      # strictest floor wins
        required_rh_max_pct = min over placed of a.required_rh_max_pct      # strictest ceiling wins
        allowed_lux         = min over placed of a.max_lux
        env_feasible = (required_rh_min_pct <= required_rh_max_pct)
                       AND ((case.target_rh_pct - case.rh_tolerance_pct) >= required_rh_min_pct)
                       AND ((case.target_rh_pct + case.rh_tolerance_pct) <= required_rh_max_pct)
                       AND (case.target_lux <= allowed_lux)
                       AND (case.uv_microwatt_per_lumen <= MAX_UV_MICROWATT_PER_LUMEN)
        security_ok = SECURITY_RANK[case.security_tier] >= max over placed of SECURITY_RANK[a.security_class]
      # All four comparisons are inclusive: equality passes. max/min are
      # order-independent, so no tie-break is needed; the empty-set branch is
      # the only place where a null appears.
    input_set: "Artifact rows whose assigned_case_id equals this case and whose placement_status is RESERVED or PLACED; UNPLACED and DEINSTALLED rows are excluded even if they were once in this case"
    constants:
      SECURITY_RANK: { BASIC: 1, ENHANCED: 2, HIGH_VALUE: 3 }
      SILICA_KG_PER_M3_EXCHANGE: 3.5
      MAX_UV_MICROWATT_PER_LUMEN: 75.0
    precision: "case_volume_m3 to 4 decimal places, silica_gel_kg to 2 decimal places, both round_half_up; RH and lux comparisons are exact on the stored numbers"

  - name: package_flow_and_accessibility
    trigger: "on POST /exhibit-projects/{id}/design-packages, feeding the accessibility gate at validations priority 58"
    algorithm: threshold
    formula: |
      required_area_sqm   = peak_visitors_per_hour * SQM_PER_VISITOR
      circulation_ratio   = circulation_area_sqm / required_area_sqm
      flow_capacity_score = round_half_up(min(100.0, circulation_ratio * 100), 2)
      accessibility_pass  = (egress_clear_width_cm >= MIN_EGRESS_WIDTH_CM)
                            AND (wheelchair_turning_radius_cm >= MIN_TURN_RADIUS_CM)
                            AND (flow_capacity_score >= MIN_FLOW_SCORE)
    input_set: "exactly the DesignPackage row being created; no sibling packages participate"
    constants:
      SQM_PER_VISITOR: 0.65
      MIN_EGRESS_WIDTH_CM: 112
      MIN_TURN_RADIUS_CM: 76
      MIN_FLOW_SCORE: 60.0
    precision: "flow_capacity_score to 2 decimal places, round_half_up; all three gates use >= so a value exactly on the minimum passes"

  - name: material_offgassing_verdict
    trigger: "on POST /exhibit-projects/{id}/material-specs and on POST /material-specs/{id}/submit-for-conservation; MaterialSpec.verdict is what the conservator decision is checked against"
    algorithm: threshold
    formula: |
      # Evaluated in this exact order; the first matching branch wins.
      voc_limit  = VOC_LIMIT_MG_PER_M2_DAY[spec.used_in]
      chox_limit = FORMALDEHYDE_LIMIT_PPM[spec.used_in]
      cure_min   = MIN_CURE_DAYS[spec.used_in]
      1. UNSAFE            if spec.oddy_test_result IN {FAIL, UNTESTED}
                              OR spec.voc_mg_per_m2_day > (2 * voc_limit)
                              OR spec.formaldehyde_ppm  > (2 * chox_limit)
      2. CONSERVATION_SAFE if spec.oddy_test_result == PASS
                              AND spec.voc_mg_per_m2_day <= voc_limit
                              AND spec.formaldehyde_ppm  <= chox_limit
                              AND spec.cure_days >= cure_min
      3. CONDITIONAL_SAFE  otherwise
    input_set: "exactly the MaterialSpec row; the limits are selected by its used_in assembly, so the same chamber numbers are safe for a GRAPHIC and unsafe for a CASE_INTERIOR"
    constants:
      VOC_LIMIT_MG_PER_M2_DAY: { CASE_INTERIOR: 0.05, MOUNT: 0.05, CASE_EXTERIOR: 0.50, GRAPHIC: 0.80, INTERACTIVE_HOUSING: 0.60 }
      FORMALDEHYDE_LIMIT_PPM: { CASE_INTERIOR: 0.02, MOUNT: 0.02, CASE_EXTERIOR: 0.10, GRAPHIC: 0.10, INTERACTIVE_HOUSING: 0.10 }
      MIN_CURE_DAYS: { CASE_INTERIOR: 21, MOUNT: 21, CASE_EXTERIOR: 7, GRAPHIC: 3, INTERACTIVE_HOUSING: 5 }
    precision: "exact comparisons on the stored numbers; a value exactly equal to a limit satisfies the <= branch"

  - name: zone_window_conflict_geometry
    trigger: "on POST /install-windows (advisory computation of the buffer fields) and enforced on POST /install-windows/{id}/decision with decision=APPROVE"
    algorithm: interval_merge
    formula: |
      pre_access_buffer_minutes = PRE_ACCESS_BUFFER_MIN[window.work_class]
      settling_buffer_minutes   = SETTLING_BUFFER_MIN[window.work_class]
      if window.work_class == DUST_GENERATING:
        settling_buffer_minutes = max(SETTLING_BUFFER_MIN[DUST_GENERATING],
                                      GalleryZone(window.zone_id).dust_settling_buffer_minutes)
      effective_start_at = window.starts_at - pre_access_buffer_minutes minutes
      effective_end_at   = window.ends_at   + settling_buffer_minutes  minutes
      # HALF-OPEN geometry [effective_start_at, effective_end_at): two windows on
      # the same zone conflict iff
      #   new.effective_start_at <  other.effective_end_at
      #   AND other.effective_start_at < new.effective_end_at
      # Touching edges do NOT conflict, so two QUIET windows (both buffers 0)
      # may be scheduled back to back with a zero-minute gap.
      occupying = { InstallWindow w : w.zone_id == new.zone_id
                                      AND w.id != new.id
                                      AND w.status IN {REQUESTED, APPROVED, IN_PROGRESS} }
    input_set: "InstallWindow rows on the same zone_id with status IN {REQUESTED, APPROVED, IN_PROGRESS}; DENIED, COMPLETED and CANCELLED windows never occupy the zone"
    constants:
      PRE_ACCESS_BUFFER_MIN: { QUIET: 0, NOISY: 15, DUST_GENERATING: 30, CRANE_ACCESS: 45 }
      SETTLING_BUFFER_MIN: { QUIET: 0, NOISY: 30, DUST_GENERATING: 120, CRANE_ACCESS: 60 }
    precision: "whole minutes; all arithmetic on ISO 8601 UTC instants"

  - name: project_closure_capacity_peak
    trigger: "enforced on POST /install-windows/{id}/decision with decision=APPROVE when the window has requires_gallery_closure == true"
    algorithm: aggregation
    formula: |
      # CLOSED geometry [starts_at, ends_at] on the NOMINAL instants - no buffers
      # at all - and an aggregate capacity count rather than a binary exclusion.
      # Because the interval is closed, a window that starts exactly when another
      # ends DOES count as concurrent, which is the opposite of the per-zone rule.
      closing = { InstallWindow w : w.project_id == new.project_id
                                    AND w.requires_gallery_closure == true
                                    AND w.status IN {APPROVED, IN_PROGRESS} }
      events = for each w in (closing + {new}):
                 (w.starts_at, +1) and (w.ends_at, -1)
      # Sweep events in ascending timestamp; at an equal timestamp process every
      # +1 before every -1 (this is what makes the interval closed). Within the
      # same timestamp and sign, order by the owning window's created_at ASC.
      concurrent_peak = max running sum over the sweep
      reject when concurrent_peak > ExhibitProject.max_concurrent_closures
    input_set: "InstallWindow rows of the same project with requires_gallery_closure == true and status IN {APPROVED, IN_PROGRESS}, plus the window being approved; windows on other zones and other projects' windows are excluded, and REQUESTED windows do not yet count"
    constants:
      DEFAULT_MAX_CONCURRENT_CLOSURES: 2
    precision: "integer counting; the sweep is order-deterministic via (timestamp ASC, sign +1 before -1, created_at ASC)"

  - name: project_readiness_posture
    trigger: "recomputed after every mutation that can change a child counter: case and material conservator decisions, review-round outcomes, punch verification, package supersede, and every cascade link"
    algorithm: aggregation
    formula: |
      conservation_block_count = count(ArtifactCase c : c.project_id == P.id AND c.status == REJECTED)
                               + count(MaterialSpec m : m.project_id == P.id AND m.status == REJECTED)
                               + P.conservation_veto_count
      open_revision_count      = count(DesignPackage d : d.project_id == P.id AND d.status == REVISION_REQUESTED)
      conditional_case_count   = count(ArtifactCase c : c.project_id == P.id AND c.status == CONDITIONALLY_APPROVED)
      pending_material_count   = count(MaterialSpec m : m.project_id == P.id AND m.status IN {SUBMITTED, CONSERVATOR_REVIEW})
      blocking_punch_count     = count(PunchItem i : i.project_id == P.id AND i.severity == BLOCKING AND i.status == OPEN)
      # Evaluated in this exact order; the first matching branch wins.
      1. FROZEN_CONSERVATION if conservation_block_count > 0
      2. RESTRICTED          if open_revision_count > 0
                                OR conditional_case_count > 0
                                OR pending_material_count > 0
      3. OPEN                otherwise
    input_set: "all ArtifactCase, MaterialSpec, DesignPackage and PunchItem rows of this project, each with the explicit status filter above; SUPERSEDED packages and CLOSED punch items never contribute"
    constants: {}
    precision: "integer counters; posture is a pure function of them, never stored independently"

  - name: closeout_settlement
    trigger: "on POST /exhibit-projects/{id}/closeout"
    algorithm: waterfall_allocation
    formula: |
      # The retainage tier is keyed on a total that already contains the parts
      # premium, and the warranty reserve is keyed on the total AFTER retainage.
      # That looks circular, so the evaluation order is pinned to these 7 steps
      # and MUST NOT be re-entered or iterated to a fixed point.
      1. fab_total_cents = sum of actual_cost_cents over
                           { ShopDrawing d : d.project_id == P.id
                                             AND d.status IN {APPROVED, APPROVED_AS_NOTED} }
                           (integer addition, so the sum is order-independent;
                            VOID and REJECTED sheets are excluded)
      2. commissioned = { Interactive i : i.project_id == P.id AND i.status == COMMISSIONED }
         if commissioned is empty:
             parts_premium_pct = 0.0
         else:
             min_parts_years   = min over commissioned of i.parts_availability_years
             parts_premium_pct = PARTS_PREMIUM_PCT_BY_MIN_YEARS selected by the
                                 first matching >= band on min_parts_years
         parts_commitment_premium_cents = round_half_up(fab_total_cents * parts_premium_pct)
      3. pre_retainage_total_cents = fab_total_cents + parts_commitment_premium_cents
      4. retainage_pct = first matching >= band of RETAINAGE_TIERS_CENTS on
                         pre_retainage_total_cents
      5. retainage_cents = round_half_up(pre_retainage_total_cents * retainage_pct)
      6. warranty_reserve_cents = round_half_up(
             (pre_retainage_total_cents - retainage_cents) * WARRANTY_RESERVE_PCT)
      7. released_cents = pre_retainage_total_cents - retainage_cents - warranty_reserve_cents
      # Ledger writes: retainage_held_cents = step 5, warranty_reserve_cents =
      # step 6, released_cents = step 7, committed_fabrication_cents = 0, and
      # uncommitted_cents = contract_value_cents - (step5 + step6 + step7).
      # The five buckets therefore still sum to contract_value_cents exactly.
    input_set: "ShopDrawing rows of the project with status IN {APPROVED, APPROVED_AS_NOTED} for step 1, Interactive rows of the project with status == COMMISSIONED for step 2; no other rows participate"
    constants:
      PARTS_PREMIUM_PCT_BY_MIN_YEARS: [[15, 0.005], [10, 0.012], [5, 0.028], [0, 0.045]]
      RETAINAGE_TIERS_CENTS: [[20000000, 0.05], [5000000, 0.075], [0, 0.10]]
      WARRANTY_RESERVE_PCT: 0.02
    precision: "whole cents, round_half_up, applied at steps 2, 5 and 6 only; step 7 is exact integer subtraction so no cent can be lost or invented"

validations:
  - priority: 1
    category: auth
    check: "X-Role header is present and names one of the six §1.7 roles; X-User-ID header is present and non-blank on every mutating request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the X-Role value is permitted to invoke this endpoint per the §1.7 role matrix; checked before any path segment is resolved, so an unauthorized caller cannot probe for the existence of an id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all business endpoints"

  - priority: 4
    category: auth
    check: |
      Segregation of duties on the opaque X-User-ID. All four pairs are enforced:
      (a) POST /shop-drawings/{id}/decision - X-User-ID != drawing.submitted_by_user_id
      (b) POST /interactives/{id}/prototype-decision - X-User-ID != interactive.submitted_by_user_id
      (c) POST /punch-items/{id}/verify and /waive - X-User-ID != item.raised_by_user_id
      (d) POST /install-windows/{id}/decision - X-User-ID != window.requested_by_user_id
      The comparison is on the raw header string; no normalisation, no case folding.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shop-drawings/{id}/decision, POST /interactives/{id}/prototype-decision, POST /punch-items/{id}/verify, POST /punch-items/{id}/waive, POST /install-windows/{id}/decision"

  - priority: 6
    category: existence
    check: "the request body parses as a JSON object, every field declared required in §1.5 for this endpoint is present and non-null, every enum-typed field carries a declared value, every integer/number field is numeric and within its §1.1 constraints, and every datetime is a valid ISO 8601 UTC instant"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 8
    category: existence
    check: "the {id} in /exhibit-projects/{id}/... resolves to an ExhibitProject; also applied to a body-supplied project_id"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all /exhibit-projects/{id}/... endpoints"

  - priority: 9
    category: existence
    check: "the {id} in /design-packages/{id}/... resolves to a DesignPackage"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /design-packages/{id}, POST /design-packages/{id}/review-rounds"

  - priority: 10
    category: existence
    check: "the {id} in /review-rounds/{id}/... resolves to a ReviewRound"
    error_id: ERR_ROUND_NOT_FOUND
    http_status: 404
    applies_to: "GET /review-rounds/{id}, GET /review-rounds/{id}/votes, POST /review-rounds/{id}/votes"

  - priority: 11
    category: existence
    check: "the {id} in /gallery-zones/{id} resolves to a GalleryZone; also applied to a body-supplied zone_id on POST /exhibit-projects/{id}/artifact-cases and POST /install-windows"
    error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    applies_to: "GET /gallery-zones/{id}, POST /exhibit-projects/{id}/artifact-cases, POST /install-windows"

  - priority: 12
    category: existence
    check: "the {id} in /artifact-cases/{id}/... resolves to an ArtifactCase; also applied to a body-supplied subject_case_id on POST /shop-drawings and case_id on POST /exhibit-projects/{id}/punch-items"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /artifact-cases/{id}/... endpoints, POST /shop-drawings, POST /exhibit-projects/{id}/punch-items"

  - priority: 13
    category: existence
    check: "the {id} in /artifacts/{id} resolves to an Artifact; also applied to the body-supplied artifact_id on POST /artifact-cases/{id}/placements and to the {artifact_id} path segment on DELETE /artifact-cases/{id}/placements/{artifact_id}"
    error_id: ERR_ARTIFACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /artifacts/{id}, POST /artifact-cases/{id}/placements, DELETE /artifact-cases/{id}/placements/{artifact_id}"

  - priority: 14
    category: existence
    check: "the {id} in /interactives/{id}/... resolves to an Interactive; also applied to a body-supplied subject_interactive_id on POST /shop-drawings and interactive_id on POST /exhibit-projects/{id}/punch-items"
    error_id: ERR_INTERACTIVE_NOT_FOUND
    http_status: 404
    applies_to: "all /interactives/{id}/... endpoints, POST /shop-drawings, POST /exhibit-projects/{id}/punch-items"

  - priority: 15
    category: existence
    check: "the {id} in /material-specs/{id}/... resolves to a MaterialSpec; also applied to the body-supplied material_spec_id on POST /shop-drawings"
    error_id: ERR_MATERIAL_NOT_FOUND
    http_status: 404
    applies_to: "all /material-specs/{id}/... endpoints, POST /shop-drawings"

  - priority: 16
    category: existence
    check: "the {id} in /shop-drawings/{id}/... resolves to a ShopDrawing"
    error_id: ERR_DRAWING_NOT_FOUND
    http_status: 404
    applies_to: "all /shop-drawings/{id}/... endpoints"

  - priority: 17
    category: existence
    check: "the {id} in /install-windows/{id}/... resolves to an InstallWindow"
    error_id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "all /install-windows/{id}/... endpoints"

  - priority: 18
    category: existence
    check: "the {id} in /punch-items/{id}/... resolves to a PunchItem"
    error_id: ERR_PUNCH_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /punch-items/{id}, POST /punch-items/{id}/verify, POST /punch-items/{id}/waive"

  - priority: 22
    category: business_referential
    check: |
      Every cross-entity reference resolved in this request belongs to the same
      ExhibitProject as the primary resource. Enforced on:
      zone_id vs project_id (case create, window create), material_spec_id /
      subject_case_id / subject_interactive_id vs project_id (drawing create),
      artifact_id vs case.project_id (placement create and delete),
      interactive_id / case_id vs project_id (punch-item create).
      A referenced row that exists but belongs to another project is a 409, NOT
      a 404 - the row is not hidden, it is misfiled.
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/artifact-cases, POST /install-windows, POST /shop-drawings, POST /artifact-cases/{id}/placements, DELETE /artifact-cases/{id}/placements/{artifact_id}, POST /exhibit-projects/{id}/punch-items"

  - priority: 24
    category: state
    check: "expected_project_version in the body equals ExhibitProject.version as currently stored (§1.2.1 rule design-package-create-stale-project)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /exhibit-projects/{id}/design-packages"

  - priority: 25
    category: state
    check: "expected_case_version in the body equals ArtifactCase.version as currently stored (§1.2.1 rule placement-create-stale-case)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /artifact-cases/{id}/placements"

  - priority: 28
    category: business_constraint
    check: |
      Scoped uniqueness of human-authored codes, all case-sensitive exact matches:
      GalleryZone.zone_code unique per project_id; ArtifactCase.case_code unique
      per project_id; Artifact.accession_number unique per project_id;
      Interactive.code unique per project_id; MaterialSpec.material_name unique
      per project_id; the pair (drawing_number, revision) unique per project_id
      counting only ShopDrawing rows whose status != VOID, so a voided sheet
      frees its number for re-issue at the same revision.
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/gallery-zones, POST /exhibit-projects/{id}/artifact-cases, POST /exhibit-projects/{id}/artifacts, POST /exhibit-projects/{id}/interactives, POST /exhibit-projects/{id}/material-specs, POST /shop-drawings"

  - priority: 29
    category: business_constraint
    check: "no existing ReviewVote on this round shares the caller's voter_role; one vote per panel role per round, and a role cannot revise its vote"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /review-rounds/{id}/votes"

  - priority: 30
    category: auth
    check: "the caller's X-Role appears in round.panel_roles; ordered after existence because the panel is a property of the round row, not of the caller"
    error_id: ERR_VOTER_NOT_ON_PANEL
    http_status: 403
    applies_to: "POST /review-rounds/{id}/votes"

  - priority: 32
    category: business_constraint
    check: "no ReviewRound with package_id == package.id has status == OPEN; a package carries at most one open round at a time"
    error_id: ERR_ROUND_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /design-packages/{id}/review-rounds"

  - priority: 34
    category: business_temporal
    check: "ends_at is strictly after starts_at; a zero-length window is rejected"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /install-windows"

  - priority: 35
    category: business_temporal
    check: "decision_deadline_at is strictly after the current logical-clock instant; a deadline equal to the current instant is rejected because the round would be sweepable the moment it opens"
    error_id: ERR_DEADLINE_IN_PAST
    http_status: 422
    applies_to: "POST /design-packages/{id}/review-rounds"

  - priority: 38
    category: state
    check: |
      The owning ExhibitProject.phase permits this operation:
      design-packages create requires phase IN {SCHEMATIC, DESIGN_DEV, FABRICATION}
      (a design change issued during fabrication is what makes the phase
      machine cyclic - the new package supersedes the approved one and a
      REVISION_REQUESTED outcome reverts the project to DESIGN_DEV);
      gallery-zones / artifacts / interactives create requires
      phase IN {INTERPRETIVE, SCHEMATIC, DESIGN_DEV};
      material-specs create requires phase IN {INTERPRETIVE, SCHEMATIC,
      DESIGN_DEV, FABRICATION} - a material substitution mid-fabrication is
      normal, and it is the conservator decision, not the phase, that gates it;
      artifact-cases create requires phase IN {SCHEMATIC, DESIGN_DEV};
      shop-drawings create and decisions require phase == FABRICATION;
      install-windows create and decisions require phase IN {FABRICATION, INSTALLATION}
      (windows are requested and vetted while the shop is still building, which
      is why a phase revert out of FABRICATION has REQUESTED windows to deny);
      interactive commission and punch-items create require phase == COMMISSIONING;
      closeout requires phase == CLOSEOUT;
      advance-phase requires the exact predecessor phase named in §1.2.
    error_id: ERR_INVALID_PROJECT_PHASE
    http_status: 409
    applies_to: "all project-scoped mutations"

  - priority: 40
    category: business_safety
    check: "ExhibitProject.posture != FROZEN_CONSERVATION; a REJECTED case, a REJECTED material spec, or a recorded conservation veto freezes every forward-moving mutation on the project until the block is cleared"
    error_id: ERR_PROJECT_FROZEN_CONSERVATION
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/advance-phase, POST /exhibit-projects/{id}/design-packages, POST /shop-drawings, POST /shop-drawings/{id}/decision, POST /install-windows, POST /install-windows/{id}/decision, POST /artifact-cases/{id}/placements, POST /artifact-cases/{id}/mount-advance, POST /interactives/{id}/prototype-decision, POST /exhibit-projects/{id}/closeout"

  - priority: 42
    category: business_safety
    check: "ExhibitProject.posture == OPEN for the two gates that demand a fully settled project: advance-phase to INSTALLATION and closeout. A RESTRICTED posture (open revisions, conditionally approved cases, or pending material reviews) blocks both."
    error_id: ERR_PROJECT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/advance-phase with to_phase=INSTALLATION, POST /exhibit-projects/{id}/closeout"

  - priority: 44
    category: state
    check: "DesignPackage.status IN {DRAFT, REVISION_REQUESTED} when opening a review round; a SUPERSEDED, IN_REVIEW or APPROVED package cannot open one"
    error_id: ERR_INVALID_PACKAGE_STATE
    http_status: 409
    applies_to: "POST /design-packages/{id}/review-rounds"

  - priority: 45
    category: state
    check: "ReviewRound.status == OPEN; a round that already reached APPROVED, REVISION_REQUESTED, VETOED or CLOSED_SUPERSEDED accepts no further votes"
    error_id: ERR_INVALID_ROUND_STATE
    http_status: 409
    applies_to: "POST /review-rounds/{id}/votes"

  - priority: 46
    category: business_temporal
    check: "the current logical-clock instant is strictly before round.decision_deadline_at; a vote arriving exactly at the deadline instant is rejected, which is the same boundary the sweep uses in the opposite direction (sweep fires at >= deadline)"
    error_id: ERR_ROUND_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /review-rounds/{id}/votes"

  - priority: 48
    category: state
    check: |
      ArtifactCase.status permits the operation:
      placements create/delete requires status IN {DRAFT, REJECTED};
      submit-for-conservation requires status IN {DRAFT, REJECTED};
      conservator-decision requires status == CONSERVATOR_REVIEW;
      a drawing naming subject_case_id requires that case status IN
      {APPROVED, CONDITIONALLY_APPROVED}.
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /artifact-cases/{id}/placements, DELETE /artifact-cases/{id}/placements/{artifact_id}, POST /artifact-cases/{id}/submit-for-conservation, POST /artifact-cases/{id}/conservator-decision, POST /shop-drawings"

  - priority: 49
    category: state
    check: "the mount_status dimension permits the requested step: to_mount_status must be the immediate successor of the stored mount_status; advancing to MOUNT_FABRICATED or MOUNT_INSTALLED additionally requires case.status IN {APPROVED, CONDITIONALLY_APPROVED}; and MOUNT_FABRICATED additionally requires at least one ShopDrawing with subject_case_id == case.id and status IN {APPROVED, APPROVED_AS_NOTED}. The two dimensions are otherwise independent."
    error_id: ERR_INVALID_MOUNT_STATE
    http_status: 409
    applies_to: "POST /artifact-cases/{id}/mount-advance"

  - priority: 50
    category: state
    check: "MaterialSpec.status IN {SUBMITTED, REJECTED, APPROVED, CONDITIONAL} for submit-for-conservation (the last two are re-reviews of a cleared material, requested when a new production lot is chamber-tested) and == CONSERVATOR_REVIEW for conservator-decision"
    error_id: ERR_INVALID_MATERIAL_STATE
    http_status: 409
    applies_to: "POST /material-specs/{id}/submit-for-conservation, POST /material-specs/{id}/conservator-decision"

  - priority: 51
    category: state
    check: "ShopDrawing.status == SUBMITTED for start-review, == UNDER_REVIEW for decision, and IN {SUBMITTED, UNDER_REVIEW, APPROVED, APPROVED_AS_NOTED} for void (a VOID sheet cannot be voided again)"
    error_id: ERR_INVALID_DRAWING_STATE
    http_status: 409
    applies_to: "POST /shop-drawings/{id}/start-review, POST /shop-drawings/{id}/decision, POST /shop-drawings/{id}/void"

  - priority: 52
    category: state
    check: "Interactive.status IN {SPECIFIED, PROTOTYPE_REJECTED} for submit-prototype, == PROTOTYPE_SUBMITTED for prototype-decision, == PROTOTYPE_APPROVED for mark-fabricated, == FABRICATED for commission"
    error_id: ERR_INVALID_INTERACTIVE_STATE
    http_status: 409
    applies_to: "POST /interactives/{id}/submit-prototype, POST /interactives/{id}/prototype-decision, POST /interactives/{id}/mark-fabricated, POST /interactives/{id}/commission"

  - priority: 53
    category: state
    check: "InstallWindow.status == REQUESTED for decision, == APPROVED for start, == IN_PROGRESS for complete, and IN {REQUESTED, APPROVED} for cancel; additionally, mount-advance to MOUNT_INSTALLED requires that at least one InstallWindow with zone_id == case.zone_id is in status IN_PROGRESS, so a window running on a sibling zone of the same project does not unlock the mount"
    error_id: ERR_INVALID_WINDOW_STATE
    http_status: 409
    applies_to: "POST /install-windows/{id}/decision, POST /install-windows/{id}/start, POST /install-windows/{id}/complete, POST /install-windows/{id}/cancel, POST /artifact-cases/{id}/mount-advance with to_mount_status=MOUNT_INSTALLED"

  - priority: 54
    category: state
    check: "PunchItem.status == OPEN for verify and waive; additionally, waive requires severity IN {MAJOR, MINOR} because a BLOCKING defect can only be verified, never waived"
    error_id: ERR_INVALID_PUNCH_STATE
    http_status: 409
    applies_to: "POST /punch-items/{id}/verify, POST /punch-items/{id}/waive"

  - priority: 56
    category: business_constraint
    check: "panel_roles contains between 3 and 5 entries, has no duplicates, every entry is one of {Curator, Conservator, ProjectManager, AccessibilitySpecialist, FabricationLead}, and includes Curator and Conservator because both hold the veto"
    error_id: ERR_INVALID_PANEL_COMPOSITION
    http_status: 422
    applies_to: "POST /design-packages/{id}/review-rounds"

  - priority: 58
    category: business_safety
    check: "calculations.package_flow_and_accessibility yields accessibility_pass == true; the package is still stored with its computed flow_capacity_score and accessibility_pass == false is never persisted, because the create is rejected outright"
    error_id: ERR_ACCESSIBILITY_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /exhibit-projects/{id}/design-packages"

  - priority: 60
    category: business_constraint
    check: "the artifact being placed has placement_status == UNPLACED; an artifact already RESERVED, PLACED or DEINSTALLED cannot be placed into a case"
    error_id: ERR_ARTIFACT_ALREADY_PLACED
    http_status: 409
    applies_to: "POST /artifact-cases/{id}/placements"

  - priority: 61
    category: business_referential
    check: "on removal, artifact.assigned_case_id equals the {id} case and placement_status IN {RESERVED, PLACED}"
    error_id: ERR_ARTIFACT_NOT_IN_CASE
    http_status: 409
    applies_to: "DELETE /artifact-cases/{id}/placements/{artifact_id}"

  - priority: 62
    category: business_safety
    check: "artifact.condition_status != UNSTABLE; an unstable object may not be committed to a case until conservation stabilises it"
    error_id: ERR_ARTIFACT_CONDITION_UNSTABLE
    http_status: 422
    applies_to: "POST /artifact-cases/{id}/placements"

  - priority: 64
    category: business_safety
    check: "SECURITY_RANK[case.security_tier] >= SECURITY_RANK[artifact.security_class]; a HIGH_VALUE object cannot go into an ENHANCED or BASIC case. Ordered ABOVE the environmental gate so a request that breaks both reports the security failure."
    error_id: ERR_SECURITY_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /artifact-cases/{id}/placements"

  - priority: 66
    category: business_safety
    check: "the case's environmental envelope recomputed with the incoming artifact included yields env_feasible == true per calculations.case_environmental_envelope; all four comparisons are inclusive, so a case whose target_lux exactly equals the strictest allowed_lux passes"
    error_id: ERR_ENV_ENVELOPE_INFEASIBLE
    http_status: 422
    applies_to: "POST /artifact-cases/{id}/placements"

  - priority: 68
    category: business_constraint
    check: "the case has placed_artifact_count >= 1 at submission; an empty case has no envelope to review"
    error_id: ERR_CASE_HAS_NO_ARTIFACTS
    http_status: 422
    applies_to: "POST /artifact-cases/{id}/submit-for-conservation"

  - priority: 70
    category: business_safety
    check: "a conservator decision of APPROVE or APPROVE_WITH_CONDITIONS is refused when MaterialSpec.verdict == UNSAFE; only REJECT is permitted on an UNSAFE spec, so off-gassing cannot be waived by fiat"
    error_id: ERR_OFFGASSING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /material-specs/{id}/conservator-decision"

  - priority: 72
    category: business_safety
    check: "MaterialSpec(material_spec_id).status IN {APPROVED, CONDITIONAL} at drawing creation; SUBMITTED, CONSERVATOR_REVIEW and REJECTED specs cannot be built from. At the drawing decision the requirement is branch-specific: decision=APPROVE demands status == APPROVED, while decision=APPROVE_AS_NOTED accepts status IN {APPROVED, CONDITIONAL}, so a conditionally cleared material can only ever carry a sheet to APPROVED_AS_NOTED."
    error_id: ERR_MATERIAL_NOT_CONSERVATION_APPROVED
    http_status: 422
    applies_to: "POST /shop-drawings, POST /shop-drawings/{id}/decision with decision IN {APPROVE, APPROVE_AS_NOTED}"

  - priority: 74
    category: business_constraint
    check: "when subject_interactive_id is supplied, that Interactive.status IN {PROTOTYPE_APPROVED, FABRICATED, COMMISSIONED}; shop drawings for an interactive may not be issued before the prototype is approved"
    error_id: ERR_PROTOTYPE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /shop-drawings"

  - priority: 76
    category: business_constraint
    check: "interactive.warranty_months >= MIN_WARRANTY_MONTHS_BY_TIER[interactive.maintenance_tier] at commissioning, where the map is {LOW: 12, MEDIUM: 24, HIGH: 36, CRITICAL: 60}; the required term is therefore a function of the durability index that the prototype measurement produced"
    error_id: ERR_WARRANTY_TERM_TOO_SHORT
    http_status: 422
    applies_to: "POST /interactives/{id}/commission"

  - priority: 78
    category: business_constraint
    check: "every ArtifactCase in the window's zone that has at least one RESERVED artifact has mount_status == MOUNT_INSTALLED before the window may be completed; artifacts cannot become PLACED on an uninstalled mount"
    error_id: ERR_MOUNT_NOT_INSTALLED
    http_status: 409
    applies_to: "POST /install-windows/{id}/complete"

  - priority: 80
    category: business_constraint
    check: "every code in project.objective_codes appears as objective_code on at least one ArtifactCase or at least one Interactive of the project; interpretive learning objectives must all be carried by something buildable"
    error_id: ERR_OBJECTIVE_NOT_ADDRESSED
    http_status: 422
    applies_to: "POST /exhibit-projects/{id}/advance-phase with to_phase=FABRICATION"

  - priority: 82
    category: business_constraint
    check: "project.blocking_punch_count == 0; a BLOCKING punch item still OPEN stops the COMMISSIONING to CLOSEOUT advance"
    error_id: ERR_BLOCKING_PUNCH_ITEMS_OPEN
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/advance-phase with to_phase=CLOSEOUT"

  - priority: 84
    category: business_constraint
    check: "window.noise_dba <= GalleryZone(zone_id).max_noise_dba, UNLESS window.requires_gallery_closure == true, in which case the zone noise ceiling does not apply because no visitors are present. Conditional validation: the same noise figure passes or fails depending on a boolean elsewhere in the body."
    error_id: ERR_NOISE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /install-windows/{id}/decision"

  - priority: 85
    category: business_constraint
    check: "GalleryZone(zone_id).occupancy_state != CLOSED, and when requires_gallery_closure == true the zone must have closure_allowed == true"
    error_id: ERR_ZONE_CLOSED_FOR_WORK
    http_status: 422
    applies_to: "POST /install-windows/{id}/decision"

  - priority: 88
    category: business_temporal
    check: "no InstallWindow on the same zone with status IN {REQUESTED, APPROVED, IN_PROGRESS} overlaps this window under the half-open buffered geometry of calculations.zone_window_conflict_geometry; touching edges are allowed"
    error_id: ERR_ZONE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /install-windows/{id}/decision"

  - priority: 90
    category: business_temporal
    check: "when requires_gallery_closure == true, calculations.project_closure_capacity_peak <= ExhibitProject.max_concurrent_closures under the closed-interval unbuffered geometry. Ordered immediately after the per-zone rule so a window that breaks both reports the per-zone conflict; the two rules use deliberately different interval semantics."
    error_id: ERR_CLOSURE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /install-windows/{id}/decision"

  - priority: 92
    category: business_constraint
    check: "GalleryZone(case.zone_id).available_case_slots >= 1 when a case approval is about to reserve a slot; the zone slot identity case_slot_capacity == reserved_case_slots + available_case_slots must hold before and after"
    error_id: ERR_ZONE_CASE_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /artifact-cases/{id}/conservator-decision with decision IN {APPROVE, APPROVE_WITH_CONDITIONS}"

  - priority: 94
    category: business_fiscal
    check: "the drawing's actual_cost_cents fits in ExhibitProject.uncommitted_cents; fiscal checks run last, so a request that also violates a conservation or constraint rule never reports a budget error"
    error_id: ERR_FABRICATION_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /shop-drawings/{id}/decision with decision IN {APPROVE, APPROVE_AS_NOTED}"

  - priority: 96
    category: business_fiscal
    check: "ExhibitProject.committed_fabrication_cents > 0 at closeout; there must be something in the committed bucket to settle"
    error_id: ERR_NOTHING_TO_SETTLE
    http_status: 409
    applies_to: "POST /exhibit-projects/{id}/closeout"

endpoints:
  # ---- ExhibitProject -----------------------------------------------------
  - method: POST
    path: "/exhibit-projects"
    description: "Open a new exhibit commission. The project starts in phase INTERPRETIVE with an empty ledger."
    roles: [ProjectManager]
    code: 201
    input: [name, museum_name, storyline_title, objective_codes, target_open_date, contract_value_cents, "max_concurrent_closures?"]
    output: ExhibitProject
    side_effects:
      - "sets phase = INTERPRETIVE, version = 1"
      - "sets committed_fabrication_cents = 0, retainage_held_cents = 0, warranty_reserve_cents = 0, released_cents = 0 and uncommitted_cents = contract_value_cents (the five-bucket money identity holds from creation)"
      - "sets max_concurrent_closures to the supplied value or to DEFAULT_MAX_CONCURRENT_CLOSURES (2) when omitted"
      - "sets created_by_user_id from the X-User-ID header"
      - "runs calculations.project_readiness_posture, yielding posture = OPEN with all six counters at 0"

  - method: GET
    path: "/exhibit-projects"
    description: "List exhibit projects, newest first by created_at DESC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["phase?", "posture?", "limit?", "offset?"]
    output: ExhibitProject[]
    side_effects: []

  - method: GET
    path: "/exhibit-projects/{id}"
    description: "Read one project including its live posture, six counters and five money buckets."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: ExhibitProject
    side_effects: []

  - method: POST
    path: "/exhibit-projects/{id}/advance-phase"
    description: "Advance the project phase by exactly one step, enforcing that step's §1.2 preconditions."
    roles: [ProjectManager]
    code: 200
    input: [to_phase]
    output: ExhibitProject
    side_effects:
      - "applies the §1.2 ExhibitProject transition for (current phase -> to_phase)"
      - "recomputes calculations.project_readiness_posture"
      - "increments ExhibitProject.version by 1"

  - method: POST
    path: "/exhibit-projects/{id}/closeout"
    description: "Settle the project: run the pinned 7-step closeout waterfall, register warranty and parts commitments, publish docent and maintenance deliverables, and close every settled punch item."
    roles: [ProjectManager]
    code: 200
    input: [docent_kit_url, maintenance_manual_url, parts_commitment_years]
    output: ExhibitProject
    side_effects:
      - "runs calculations.closeout_settlement in its pinned 7-step order"
      - "writes retainage_held_cents, warranty_reserve_cents and released_cents, zeroes committed_fabrication_cents and recomputes uncommitted_cents so the five buckets still sum to contract_value_cents"
      - "sets docent_kit_url, maintenance_manual_url, parts_commitment_years and warranty_registered_at (logical clock instant)"
      - "transitions every PunchItem of the project with status IN {VERIFIED, WAIVED} to CLOSED"
      - "transitions phase CLOSEOUT -> WARRANTY_CLOSED"
      - "increments ExhibitProject.version by 1"

  - method: POST
    path: "/exhibit-projects/{id}/review-sweep"
    description: "Lapse every OPEN ReviewRound of this project whose decision_deadline_at is at or before the current logical-clock instant. Deterministic deadline enforcement without a background job."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ExhibitProject
    side_effects:
      - "each qualifying round is processed in ascending (decision_deadline_at, created_at) order; each transitions OPEN -> REVISION_REQUESTED with swept_by_deadline = true and decided_at = the clock instant"
      - "each swept round drives its DesignPackage IN_REVIEW -> REVISION_REQUESTED, incrementing DesignPackage.revision_count"
      - "may cascade an ExhibitProject phase revert and DENY every REQUESTED InstallWindow of the project, per §1.2"
      - "recomputes calculations.project_readiness_posture"
      - "increments ExhibitProject.version by 1"

  # ---- DesignPackage ------------------------------------------------------
  - method: POST
    path: "/exhibit-projects/{id}/design-packages"
    description: "Submit a schematic or design-development package. Permitted in phase SCHEMATIC, DESIGN_DEV or FABRICATION, so a design change can be issued mid-fabrication. Creating a package supersedes any existing package of the same stage on this project. OCC-guarded per §1.2.1 rule design-package-create-stale-project."
    roles: [ProjectManager, AccessibilitySpecialist]
    code: 201
    input: [expected_project_version, stage, egress_clear_width_cm, wheelchair_turning_radius_cm, peak_visitors_per_hour, circulation_area_sqm]
    output: DesignPackage
    side_effects:
      - "runs calculations.package_flow_and_accessibility, storing flow_capacity_score and accessibility_pass"
      - "sets status = DRAFT, review_round_count = 0, revision_count = 0, submitted_by_user_id from X-User-ID"
      - "every existing DesignPackage of this project with the same stage and status != SUPERSEDED transitions to SUPERSEDED, in ascending created_at order, and has superseded_by_package_id set to the new package id"
      - "every OPEN ReviewRound on a superseded package transitions to CLOSED_SUPERSEDED"
      - "recomputes ExhibitProject.open_revision_count and calculations.project_readiness_posture"
      - "increments ExhibitProject.version by 1"

  - method: GET
    path: "/exhibit-projects/{id}/design-packages"
    description: "List the project's design packages, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["stage?", "status?"]
    output: DesignPackage[]
    side_effects: []

  - method: GET
    path: "/design-packages/{id}"
    description: "Read one design package with its computed flow and accessibility results."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: DesignPackage
    side_effects: []

  - method: GET
    path: "/design-packages/{id}/superseded-packages"
    description: "List the packages this package superseded, i.e. every DesignPackage whose superseded_by_package_id equals this package's id, oldest first. Reverse-reachability channel for the self-referential FK."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: DesignPackage[]
    side_effects: []

  # ---- ReviewRound / ReviewVote ------------------------------------------
  - method: POST
    path: "/design-packages/{id}/review-rounds"
    description: "Open a multi-party review round on a package, naming the panel and the decision deadline. Moves the package into IN_REVIEW."
    roles: [ProjectManager]
    code: 201
    input: [panel_roles, decision_deadline_at]
    output: ReviewRound
    side_effects:
      - "sets round_number = package.review_round_count + 1 and increments DesignPackage.review_round_count"
      - "sets required_vote_count = ceil(length(panel_roles) * 2 / 3) - the quorum is two thirds of the panel, rounded up"
      - "sets status = OPEN, cast_vote_count = 0, approve_count = 0, revise_count = 0, veto_count = 0, swept_by_deadline = false"
      - "transitions DesignPackage DRAFT or REVISION_REQUESTED -> IN_REVIEW"
      - "recomputes ExhibitProject.open_revision_count and calculations.project_readiness_posture"
      - "increments DesignPackage.version and ExhibitProject.version by 1 each"

  - method: GET
    path: "/design-packages/{id}/review-rounds"
    description: "List the review rounds of a package, ascending by round_number."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?"]
    output: ReviewRound[]
    side_effects: []

  - method: GET
    path: "/review-rounds/{id}"
    description: "Read one review round with its live vote tallies and quorum target."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: ReviewRound
    side_effects: []

  - method: POST
    path: "/review-rounds/{id}/votes"
    description: "Cast this panel role's single vote. A VETO closes the round immediately regardless of quorum; otherwise the round resolves only when cast_vote_count reaches required_vote_count. Returns the UPDATED ReviewRound - not the vote row - so the caller sees the new tally and the resolved status in the same response; the vote itself is readable through GET /review-rounds/{id}/votes."
    roles: [Curator, Conservator, ProjectManager, AccessibilitySpecialist, FabricationLead]
    code: 201
    input: [decision, "comment?"]
    output: ReviewRound
    side_effects:
      - "creates an immutable ReviewVote with voter_role = X-Role and voter_user_id = X-User-ID"
      - "increments round.cast_vote_count and exactly one of approve_count / revise_count / veto_count"
      - "on decision = VETO the round transitions OPEN -> VETOED at once, and when X-Role IN {Curator, Conservator} ExhibitProject.conservation_veto_count is incremented"
      - "otherwise, when cast_vote_count == required_vote_count the round transitions to APPROVED (approve_count == required_vote_count) or to REVISION_REQUESTED (revise_count >= 1)"
      - "a round leaving OPEN drives its DesignPackage to APPROVED or REVISION_REQUESTED per §1.2, which may cascade an ExhibitProject phase revert and DENY every REQUESTED InstallWindow of the project"
      - "recomputes calculations.project_readiness_posture"
      - "increments ReviewRound.version, DesignPackage.version and ExhibitProject.version by 1 each when the round resolves"

  - method: GET
    path: "/review-rounds/{id}/votes"
    description: "List the votes cast in a round, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: ReviewVote[]
    side_effects: []

