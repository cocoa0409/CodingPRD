scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: efc_fafsa_vs_css_profile_diverge_on_identical_income
        grounds:
          - calculations.efc_calc
          - entities.FinancialAidProfile.fields.profile_type
          - entities.FinancialAidProfile.fields.declared_assets_cents
          - entities.FinancialAidProfile.fields.expected_family_contribution_cents
        distinguishing_aspect: |
          Two FinancialAidProfile rows with identical household_income_cents=8000000
          and household_size=4 produce DIFFERENT expected_family_contribution_cents:
          FAFSA variant returns 1056000, CSS_PROFILE variant with declared_assets_cents=5000000
          returns 1306000. Entity domain: FinancialAidProfile.
        test_recipe:
          setup:
            - "Two applicants A_FAFSA (FAFSA, $80k income, 4 ppl, $0 assets) and A_CSS (CSS_PROFILE, $80k income, 4 ppl, $50k assets) exist."
            - "Both applicants are in DRAFT profile_status (no apps submitted yet)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { email: "fafsa@u.edu", full_name: "FAF Sa", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_fafsa_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "css@u.edu", full_name: "C SS", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_css_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_fafsa_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4, declared_assets_cents: 0 }
              as: Applicant
              as_user_id: "${a_fafsa_id}"
              captures: { fap_fafsa_id: $.data.id, fap_fafsa_efc: $.data.expected_family_contribution_cents }
          trigger:
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_css_id}", profile_type: "CSS_PROFILE", household_income_cents: 8000000, household_size: 4, declared_assets_cents: 5000000 }
              as: Applicant
              as_user_id: "${a_css_id}"
              captures: { fap_css_id: $.data.id, fap_css_efc: $.data.expected_family_contribution_cents }
          assert:
            - "FinancialAidProfile.${fap_fafsa_id}.expected_family_contribution_cents == 1056000"
            - "FinancialAidProfile.${fap_css_id}.expected_family_contribution_cents == 1306000"
            - "FinancialAidProfile.${fap_css_id}.expected_family_contribution_cents > FinancialAidProfile.${fap_fafsa_id}.expected_family_contribution_cents"

      - name: composite_with_sat_vs_test_optional_diverge_on_same_applicant_data
        grounds:
          - calculations.composite_score_calc
          - entities.Applicant.fields.sat_total
          - entities.Application.fields.composite_score
        distinguishing_aspect: |
          Two Applications with identical gpa_unweighted=3.80, essays (3 completed),
          and recs (ratings [5,4]) yield DIFFERENT composite_score depending on
          whether the applicant has sat_total=1400 (with_sat_variant → 86.17) or
          sat_total=null (test_optional_variant → 79.50). Entity domain: Application
          (≠ FinancialAidProfile of instance 1).
        test_recipe:
          setup:
            - "Two schools S_with (REGULAR) and S_opt (REGULAR) exist, both with deadline_iso = 2026-12-01T00:00:00Z."
            - "Applicant A_with (gpa=3.80, sat=1400) and Applicant A_opt (gpa=3.80, sat=null) each have a DRAFT Application at their school, a FinancialAidProfile, 3 completed essays, and 2 SUBMITTED recommendations with ratings 5 and 4."
            - "SystemClock.current_utc == 2026-09-01T00:00:00Z (well before deadlines)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U With", state_code: "MA", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_with_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "U Opt", state_code: "NY", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_opt_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "a_with@u.edu", full_name: "A With", gpa_unweighted: 3.80, sat_total: 1400, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_with_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "a_opt@u.edu", full_name: "A Opt", gpa_unweighted: 3.80, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_opt_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_with_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_with_id}"
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_opt_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_opt_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_with_id}", school_id: "${s_with_id}" }
              as: Applicant
              as_user_id: "${a_with_id}"
              captures: { app_with_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${a_opt_id}", school_id: "${s_opt_id}" }
              as: Applicant
              as_user_id: "${a_opt_id}"
              captures: { app_opt_id: $.data.id }
            # Essays + recs for A_with
            - call: "POST /essays"
              payload: { application_id: "${app_with_id}", prompt_code: "P1", word_count: 500, text: "Lorem ipsum essay one.", completed: true }
              as: Applicant
              as_user_id: "${a_with_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_with_id}", prompt_code: "P2", word_count: 500, text: "Lorem ipsum essay two.", completed: true }
              as: Applicant
              as_user_id: "${a_with_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_with_id}", prompt_code: "P3", word_count: 500, text: "Lorem ipsum essay three.", completed: true }
              as: Applicant
              as_user_id: "${a_with_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_with_id}", school_id: "${s_with_id}", recommender_email: "r1@x.edu" }
              as: Applicant
              as_user_id: "${a_with_id}"
              captures: { rec_with_1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_with_id}", school_id: "${s_with_id}", recommender_email: "r2@x.edu" }
              as: Applicant
              as_user_id: "${a_with_id}"
              captures: { rec_with_2: $.data.id }
            - call: "POST /recommendation-requests/${rec_with_1}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_with_2}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            # Essays + recs for A_opt
            - call: "POST /essays"
              payload: { application_id: "${app_opt_id}", prompt_code: "P1", word_count: 500, text: "Lorem ipsum essay one.", completed: true }
              as: Applicant
              as_user_id: "${a_opt_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_opt_id}", prompt_code: "P2", word_count: 500, text: "Lorem ipsum essay two.", completed: true }
              as: Applicant
              as_user_id: "${a_opt_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_opt_id}", prompt_code: "P3", word_count: 500, text: "Lorem ipsum essay three.", completed: true }
              as: Applicant
              as_user_id: "${a_opt_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_opt_id}", school_id: "${s_opt_id}", recommender_email: "r1@y.edu" }
              as: Applicant
              as_user_id: "${a_opt_id}"
              captures: { rec_opt_1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_opt_id}", school_id: "${s_opt_id}", recommender_email: "r2@y.edu" }
              as: Applicant
              as_user_id: "${a_opt_id}"
              captures: { rec_opt_2: $.data.id }
            - call: "POST /recommendation-requests/${rec_opt_1}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_opt_2}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_with_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_with_id}"
              captures: { score_with: $.data.composite_score }
            - call: "POST /applications/${app_opt_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_opt_id}"
              captures: { score_opt: $.data.composite_score }
          assert:
            - "Application.${app_with_id}.composite_score == 86.17"
            - "Application.${app_opt_id}.composite_score == 79.50"
            - "Application.${app_with_id}.composite_score != Application.${app_opt_id}.composite_score"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: composite_score_per_component_rounding_order_pinned
        grounds:
          - calculations.composite_score_calc
          - entities.Application.fields.composite_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The composite_score formula
          pins per-component round-then-sum: gpa_term, sat_term, essay_term, rec_term
          each round_half_up to 2dp INDEPENDENTLY, then sum. A 'sum first, round once'
          implementation produces a different second decimal on inputs like
          gpa=3.80/sat=1400/essays=3/recs=[5,4]: per-component pinned order = 86.17;
          single-final-round = 86.17 here but diverges on other inputs (e.g.,
          gpa=3.40/sat=1200 gives 68.33 pinned vs 68.34 unpinned).
        test_recipe:
          setup:
            - "Applicant A (gpa=3.40, sat=1200), school S (REGULAR, deadline far future), DRAFT Application app with 2 completed essays and 2 SUBMITTED recs ratings [3,3], FinancialAidProfile present."
            - "SystemClock.current_utc == 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Round", state_code: "MA", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_round_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "round@u.edu", full_name: "R Round", gpa_unweighted: 3.40, sat_total: 1200, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_round_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_round_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_round_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_round_id}", school_id: "${s_round_id}" }
              as: Applicant
              as_user_id: "${a_round_id}"
              captures: { app_round_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_round_id}", prompt_code: "P1", word_count: 500, text: "Essay one body text.", completed: true }
              as: Applicant
              as_user_id: "${a_round_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_round_id}", prompt_code: "P2", word_count: 500, text: "Essay two body text.", completed: true }
              as: Applicant
              as_user_id: "${a_round_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_round_id}", school_id: "${s_round_id}", recommender_email: "r1@z.edu" }
              as: Applicant
              as_user_id: "${a_round_id}"
              captures: { rec_round_1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_round_id}", school_id: "${s_round_id}", recommender_email: "r2@z.edu" }
              as: Applicant
              as_user_id: "${a_round_id}"
              captures: { rec_round_2: $.data.id }
            - call: "POST /recommendation-requests/${rec_round_1}/submit"
              payload: { rating: 3 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_round_2}/submit"
              payload: { rating: 3 }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_round_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_round_id}"
              captures: { score_round: $.data.composite_score }
          assert:
            - "Application.${app_round_id}.composite_score == 68.33"
            # gpa_term=round(85.00*0.40,2)=34.00; sat_term=round(66.67*0.20,2)=round(13.334,2)=13.33;
            # essay_term=round(40.00*0.15,2)=6.00; rec_term=round(60.00*0.25,2)=15.00.
            # Pinned per-component sum: 34.00+13.33+6.00+15.00 = 68.33.

      - name: yield_posture_multi_input_nonlinear_threshold
        grounds:
          - calculations.yield_posture_calc
          - entities.School.fields.yield_posture
          - entities.School.fields.admitted_count
          - entities.School.fields.enrolled_count
          - entities.School.fields.assumed_yield_rate
          - entities.School.fields.target_class_size
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (admitted_count, enrolled_count,
          assumed_yield_rate, target_class_size) and non-linear interaction —
          projected_yield_count = round_half_up(admitted * rate + enrolled, 0),
          then ratio = projected / target maps through two nested threshold
          branches (>=1.00 → OVER_TARGET; >=0.85 → ON_TARGET; else OPEN). Mode
          (a), distinct from instance 1's mode (b).
        test_recipe:
          setup:
            - "School S_yield with target_class_size=20, assumed_yield_rate=0.50, REGULAR, plenty of time before deadline."
            - "32 distinct Applications at this school have just been ADMITTED through normal flow (UNDER_REVIEW→ADMITTED), so School.admitted_count==32, enrolled_count==0."
            - "SystemClock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Yield", state_code: "CA", admission_track: "REGULAR", deadline_iso: "2026-10-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 20, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_yield_id: $.data.id, s_yield_posture_initial: $.data.yield_posture }
            # Helper: this test bulk-creates 32 admitted applications. Per scaffold §1.5
            # priority ladder, we compose existing endpoints. For brevity here we describe
            # the loop; the unit-test-generator will expand this into 32 iterations of the
            # 'create-applicant + minimal-app + admit' chain. Each iteration captures
            # admit_version from the begin-review response.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            # (loop over i in 1..32)
            - call: "POST /applicants"
              payload: { email: "y_${i}@u.edu", full_name: "Y ${i}", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_y_i_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_y_i_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_y_i_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_y_i_id}", school_id: "${s_yield_id}" }
              as: Applicant
              as_user_id: "${a_y_i_id}"
              captures: { app_y_i_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_y_i_id}", prompt_code: "P1", word_count: 500, text: "essay one.", completed: true }
              as: Applicant
              as_user_id: "${a_y_i_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_y_i_id}", prompt_code: "P2", word_count: 500, text: "essay two.", completed: true }
              as: Applicant
              as_user_id: "${a_y_i_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_y_i_id}", school_id: "${s_yield_id}", recommender_email: "r1_${i}@x.edu" }
              as: Applicant
              as_user_id: "${a_y_i_id}"
              captures: { rec_y_i_1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_y_i_id}", school_id: "${s_yield_id}", recommender_email: "r2_${i}@x.edu" }
              as: Applicant
              as_user_id: "${a_y_i_id}"
              captures: { rec_y_i_2: $.data.id }
            - call: "POST /recommendation-requests/${rec_y_i_1}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_y_i_2}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_y_i_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_y_i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_y_i_id}/begin-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { app_y_i_ver: $.data.version }
            - call: "POST /applications/${app_y_i_id}/admit"
              payload: { expected_application_version: "${app_y_i_ver}" }
              as: AdmissionsOfficer
              captures: { s_yield_posture_after_i: $.data.status }
            # (end loop — at i=32, School.admitted_count==32, projected=16, ratio=0.80,
            # posture still OPEN.)
          trigger:
            # 33rd ADMIT brings admitted_count from 32 → 33 → projected_yield_count=round(33*0.50+0)=round(16.5)=17 → ratio=0.85 → ON_TARGET.
            - call: "POST /applicants"
              payload: { email: "y_33@u.edu", full_name: "Y 33", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_y_33_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_y_33_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_y_33_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_y_33_id}", school_id: "${s_yield_id}" }
              as: Applicant
              as_user_id: "${a_y_33_id}"
              captures: { app_y_33_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_y_33_id}", prompt_code: "P1", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_y_33_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_y_33_id}", prompt_code: "P2", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_y_33_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_y_33_id}", school_id: "${s_yield_id}", recommender_email: "r33a@x.edu" }
              as: Applicant
              as_user_id: "${a_y_33_id}"
              captures: { rec_33a: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_y_33_id}", school_id: "${s_yield_id}", recommender_email: "r33b@x.edu" }
              as: Applicant
              as_user_id: "${a_y_33_id}"
              captures: { rec_33b: $.data.id }
            - call: "POST /recommendation-requests/${rec_33a}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_33b}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_y_33_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_y_33_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_y_33_id}/begin-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { app_y_33_ver: $.data.version }
            - call: "POST /applications/${app_y_33_id}/admit"
              payload: { expected_application_version: "${app_y_33_ver}" }
              as: AdmissionsOfficer
          assert:
            - "School.${s_yield_id}.admitted_count == 33"
            - "School.${s_yield_id}.enrolled_count == 0"
            - "School.${s_yield_id}.yield_posture == 'ON_TARGET'"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branching_under_review_three_way_fork
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
          - state_machines.Application.UNDER_REVIEW_to_WAITLISTED
          - state_machines.Application.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Application SM exhibits a 3-way fork at UNDER_REVIEW — branches to
          ADMITTED, WAITLISTED, or DENIED, each with divergent side-effect sets
          (ADMITTED bumps School.admitted_count + recomputes yield_posture;
          WAITLISTED creates a WaitlistEntry; DENIED cascades AidPackage revoke
          + bumps denied_count). Entity: Application.
        test_recipe:
          setup:
