        grounds:
          - state_machines.Quote.SENT_to_APPROVED
          - state_machines.WorkOrder.QUOTE_SENT_to_APPROVED
          - calculations.stock_cut_allocation
        distinguishing_aspect: |
          Depth-3 chain from one trigger: quote approval (Quote) moves WorkOrder
          to APPROVED (hop 1); entering APPROVED auto-creates a StockReservation
          (hop 2); the reservation's allocation cut mutates the InventoryItem,
          reducing length_mm 1000 -> 497 (hop 3). Each hop is caused by the
          previous hop, not by the approve call directly.
        test_recipe:
          setup:
            - "WO with SENT quote; teardown requires rod 500mm; one AVAILABLE rod piece 1000mm @42c/mm (kerf 3 => required 503)"
          setup_api_calls:
