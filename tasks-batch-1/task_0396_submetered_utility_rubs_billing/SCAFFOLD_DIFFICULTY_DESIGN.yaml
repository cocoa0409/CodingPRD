              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pvb_id}", utility_id: "${uvb_id}", period_label: "2026-06", total_cost_cents: 20000 }
              as: PropertyManager
              captures: { vbvb_id: $.data.id }
            - call: "POST /vendor-bills/${vbvb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pvb_id}", utility_id: "${uvb_id}", vendor_bill_id: "${vbvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { vbbc_id: $.data.id }
            - call: "POST /billing-cycles/${vbbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /vendor-bills/${vbvb_id}/void"
