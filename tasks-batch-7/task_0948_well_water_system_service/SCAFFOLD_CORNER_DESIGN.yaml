      - name: corner_validation_lab_result_timestamp_range_and_exact_hold_time
        claim_type: Violation to Error
        grounds: ["validations[priority=32]", "validations[priority=34]", "errors[ERR_INVALID_TIMESTAMP]", "errors[ERR_INVALID_DATE_RANGE]", "calculations.water_test_hold_time_validity"]
        distinguishing_aspect: |
          Three lab-result attempts on ONE collected bacteriological sample separate
          three near neighbours: a non-ISO analyzed_at gives 400 ERR_INVALID_TIMESTAMP,
          an analyzed_at one hour BEFORE the sample gives 400 ERR_INVALID_DATE_RANGE
          (not a negative hold time), and an analyzed_at exactly 30.0 hours after the
          sample is VALID because the hold time is right-closed - the test lands in
          ANALYZED_NEGATIVE with hold_time_valid true and moves the well to SAFE. An
          implementation that routes the malformed value to ERR_VALIDATION, or that
          treats 30.0 hours as INVALID_HOLD_TIME, diverges on the first and third call.
        test_recipe:
          setup:
            - "One account, property, well (potability UNKNOWN) and one technician."
            - "One BACTERIOLOGICAL water test sampled 2026-06-01T00:00:00Z sitting in COLLECTED; the logical clock reads 2026-06-02T09:00:00Z."
