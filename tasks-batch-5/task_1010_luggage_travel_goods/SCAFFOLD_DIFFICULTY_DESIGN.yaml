scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: repair_quote_customer_pay_vs_warranty_covered
        grounds:
          - calculations.repair_quote
          - entities.RepairOrder.fields.quoted_total_cents
          - entities.RepairOrder.fields.warranty_cost_cents
          - state_machines.RepairOrder.INTAKE_to_QUOTED
        distinguishing_aspect: |
          Same two RepairLines produce quoted_total_cents 21750 (CUSTOMER_PAY: lines_total
          19250 + 2500 diagnostic fee) versus 0 with warranty_cost_cents 19250
          (WARRANTY_COVERED: fee waived) — divergence lives on the RepairOrder cost domain.
        test_recipe:
          setup:
            - "One Product, one Customer."
            - "RO_pay: RepairOrder with claim_id null (CUSTOMER_PAY) carrying WHEEL 2h STANDARD parts 4000 and ZIPPER 1.5h COMPLEX parts 1500."
            - "RO_cov: RepairOrder with claim_id pointing at a WarrantyClaim resolved REPAIR (WARRANTY_COVERED), identical two lines."
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "LUG-1", name: "Voyager 55", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_pay: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_pay}", repair_type: "WHEEL", labor_hours: 2, complexity: "STANDARD", parts_cost_cents: 4000 }
              as: Associate
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_pay}", repair_type: "ZIPPER", labor_hours: 1.5, complexity: "COMPLEX", parts_cost_cents: 1500 }
              as: Associate
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SN-1", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "WHEEL", description: "wheel cracked" }
              as: Associate
              captures: { claim_id: $.data.id }
            - call: "POST /store/warranty-claims/${claim_id}/review"
              payload: {}
              as: Associate
            - call: "POST /store/warranty-claims/${claim_id}/resolve"
              payload: { resolution: "REPAIR" }
              as: Manager
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", claim_id: "${claim_id}" }
              as: Associate
              captures: { ro_cov: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_cov}", repair_type: "WHEEL", labor_hours: 2, complexity: "STANDARD", parts_cost_cents: 4000 }
              as: Associate
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_cov}", repair_type: "ZIPPER", labor_hours: 1.5, complexity: "COMPLEX", parts_cost_cents: 1500 }
              as: Associate
          trigger:
            - call: "POST /store/repair-orders/${ro_pay}/quote"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_cov}/quote"
              payload: {}
              as: Associate
          assert:
            - "RepairOrder.${ro_pay}.quoted_total_cents == 21750"
            - "RepairOrder.${ro_pay}.warranty_cost_cents == 0"
            - "RepairOrder.${ro_cov}.quoted_total_cents == 0"
            - "RepairOrder.${ro_cov}.warranty_cost_cents == 19250"

      - name: loyalty_points_provisional_vs_final_tier_change
        grounds:
          - calculations.loyalty_points_accrual
          - entities.SalesOrder.fields.provisional_points
          - entities.SalesOrder.fields.points_credited
          - entities.Customer.fields.tier
        distinguishing_aspect: |
          The same OrderX (net merch 19000) yields provisional_points 237 (SILVER x1.25 at
          creation) but points_credited 285 (GOLD x1.5 at capture) — divergence lives on the
          Customer loyalty domain, a different entity than repair cost.
        test_recipe:
          setup:
            - "Customer starts BRONZE."
            - "Seed order net 50000 captured -> Customer SILVER (lifetime 50000)."
            - "OrderX (single line 20000) created while SILVER -> provisional_points 237."
            - "Seed order net 104500 captured -> Customer GOLD (lifetime 154500)."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-2", name: "Cabin 40", category: "SOFT_SIDE", msrp_cents: 20000, warranty_months: 12, length_mm: 400, width_mm: 300, height_mm: 200 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_seed1: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_seed1}", product_id: "${pid}", unit_price_cents: 50000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders/${so_seed1}/capture"
              payload: {}
              as: Associate
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_x: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_x}", product_id: "${pid}", unit_price_cents: 20000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_seed2: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_seed2}", product_id: "${pid}", unit_price_cents: 110000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders/${so_seed2}/capture"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/sales-orders/${so_x}/capture"
              payload: {}
              as: Associate
          assert:
            - "SalesOrder.${so_x}.provisional_points == 237"
            - "SalesOrder.${so_x}.points_credited == 285"
            - "Customer.${cust_id}.tier == GOLD"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: repair_labor_nested_clamp_mode_a
        grounds:
          - calculations.repair_quote
          - entities.RepairLine.fields.line_labor_cents
        distinguishing_aspect: |
          Mode (a): line labor = clamp(round(rate*hours*complexity), 1500, 20000) has 3
          interacting inputs and nested min/max — a sub-min line (raw 300) clamps up to 1500
          and an over-max line (raw 52500) clamps down to 20000.
        test_recipe:
          setup:
            - "One Product, one Customer, one CUSTOMER_PAY RepairOrder with a below-min line and an above-max line."
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "LUG-3", name: "Trunk 70", category: "HARD_SHELL", msrp_cents: 40000, warranty_months: 24, length_mm: 700, width_mm: 450, height_mm: 300 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_id}", repair_type: "ZIPPER", labor_hours: 0.1, complexity: "STANDARD", parts_cost_cents: 0 }
              as: Associate
              captures: { min_line: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_id}", repair_type: "WHEEL", labor_hours: 10, complexity: "COMPLEX", parts_cost_cents: 0 }
              as: Associate
              captures: { max_line: $.data.id }
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/quote"
              payload: {}
              as: Associate
          assert:
            - "RepairLine.${min_line}.line_labor_cents == 1500"
            - "RepairLine.${max_line}.line_labor_cents == 20000"
            - "RepairOrder.${ro_id}.quoted_total_cents == 24000"

      - name: sales_pricing_per_line_round_then_sum_mode_b
        grounds:
          - calculations.sales_order_pricing
          - entities.SalesOrderLine.fields.line_subtotal_cents
          - entities.SalesOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is load-bearing. Two lines of 99.5 cents each round
          per-line to 100 -> subtotal 200 -> total 216; sum-then-round would give 199 -> 215.
          The pinned per-line-first order yields 216.
        test_recipe:
          setup:
            - "BRONZE Customer, one Product, PENDING SalesOrder with two lines each unit 100 qty 1 discount 0.005."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-4", name: "Tag", category: "ACCESSORY", msrp_cents: 100, warranty_months: 0, length_mm: 80, width_mm: 50, height_mm: 10 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 100, qty: 1, line_discount_pct: 0.005 }
              as: Associate
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 100, qty: 1, line_discount_pct: 0.005 }
              as: Associate
          trigger:
            - call: "GET /store/sales-orders/${so_id}"
              payload: {}
              as: Associate
          assert:
            - "SalesOrder.${so_id}.subtotal_cents == 200"
            - "SalesOrder.${so_id}.total_cents == 216"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_cyclic_parts_hold_resume
        grounds:
          - state_machines.RepairOrder.IN_REPAIR_to_PARTS_HOLD
          - state_machines.RepairOrder.PARTS_HOLD_to_IN_REPAIR
        distinguishing_aspect: |
          RepairOrder cycles IN_REPAIR -> PARTS_HOLD -> IN_REPAIR; after resume the status is
          IN_REPAIR again, proving the loop (not a linear pipeline).
        test_recipe:
          setup:
            - "Product, Customer, ServiceBench; RepairOrder driven to IN_REPAIR (quote, approve, schedule, start)."
          setup_api_calls:
            - call: "POST /store/service-benches"
              payload: { label: "Bench A", skill: "GENERAL" }
              as: Manager
              captures: { bench_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-5", name: "Roller 50", category: "HARD_SHELL", msrp_cents: 25000, warranty_months: 24, length_mm: 500, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_id}", repair_type: "WHEEL", labor_hours: 1, complexity: "STANDARD", parts_cost_cents: 1000 }
              as: Associate
            - call: "POST /store/repair-orders/${ro_id}/quote"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_id}/approve"
              payload: {}
              as: Manager
            - call: "POST /store/repair-orders/${ro_id}/schedule"
              payload: { bench_id: "${bench_id}", bench_start: "2026-07-02T09:00:00Z", bench_end: "2026-07-02T10:00:00Z" }
              as: Associate
            - call: "POST /store/repair-orders/${ro_id}/start"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/parts-hold"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_id}/resume"
              payload: {}
              as: Associate
          assert:
            - "RepairOrder.${ro_id}.status == IN_REPAIR"

      - name: sales_order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.SalesOrder.PENDING_to_CAPTURED
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: |
          On the same SalesOrder row payment_status advances to CAPTURED while
          fulfillment_status remains UNFULFILLED — two independent axes on one entity.
        test_recipe:
          setup:
            - "Customer, Product, PENDING SalesOrder with one line."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-6", name: "Weekender", category: "DUFFEL", msrp_cents: 15000, warranty_months: 12, length_mm: 550, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 15000, qty: 1 }
              as: Associate
          trigger:
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
          assert:
            - "SalesOrder.${so_id}.payment_status == CAPTURED"
            - "SalesOrder.${so_id}.fulfillment_status == UNFULFILLED"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_publish_cascade_product_registration_claim_depth3
        grounds:
          - state_machines.RecallNotice.DRAFT_to_PUBLISHED
          - state_machines.Product.ACTIVE_to_RECALLED
          - state_machines.WarrantyRegistration.ACTIVE_to_RECALL_FLAGGED
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 chain from a recall trigger: publish -> Product RECALLED (link1) ->
          each ACTIVE WarrantyRegistration RECALL_FLAGGED (link2, caused by the product change)
          -> each open WarrantyClaim NEEDS_INFO (link3, caused by the registration change).
        test_recipe:
          setup:
            - "Product ACTIVE; Customer; WarrantyRegistration ACTIVE; WarrantyClaim in UNDER_REVIEW; RecallNotice DRAFT for the product."
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "LUG-7", name: "Shell 60", category: "HARD_SHELL", msrp_cents: 32000, warranty_months: 24, length_mm: 600, width_mm: 400, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SN-7", purchase_date: "2026-06-15T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "SHELL", description: "cracked shell" }
              as: Associate
              captures: { claim_id: $.data.id }
            - call: "POST /store/warranty-claims/${claim_id}/review"
              payload: {}
              as: Associate
            - call: "POST /store/recall-notices"
              payload: { product_id: "${pid}", reason: "hinge defect", remedy: "REPAIR" }
              as: Manager
              captures: { rn_id: $.data.id }
          trigger:
            - call: "POST /store/recall-notices/${rn_id}/publish"
              payload: {}
              as: Manager
          assert:
            - "Product.${pid}.status == RECALLED"
            - "WarrantyRegistration.${reg_id}.status == RECALL_FLAGGED"
            - "WarrantyClaim.${claim_id}.status == NEEDS_INFO"

      - name: capture_lifetime_spend_triggers_tier_upgrade_depth2
        grounds:
          - state_machines.SalesOrder.PENDING_to_CAPTURED
          - entities.Customer.fields.lifetime_spend_cents
          - entities.Customer.fields.tier
        distinguishing_aspect: |
          Depth-2 chain from a capture trigger: capture mutates Customer.lifetime_spend_cents to
          exactly 50000 (link1) and that field crossing the SILVER threshold (>= 50000) itself
          triggers tier BRONZE -> SILVER (link2). Different trigger than the recall cascade.
        test_recipe:
          setup:
            - "BRONZE Customer (lifetime 0); Product; PENDING SalesOrder with one line net 50000."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-8", name: "Set 3pc", category: "HARD_SHELL", msrp_cents: 50000, warranty_months: 24, length_mm: 500, width_mm: 350, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 50000, qty: 1 }
              as: Associate
          trigger:
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
          assert:
            - "Customer.${cust_id}.lifetime_spend_cents == 50000"
            - "Customer.${cust_id}.tier == SILVER"
            - "Customer.${cust_id}.points_balance == 500"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_repair_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRODUCT_RECALLED]
        distinguishing_aspect: |
          Approve on an INTAKE RepairOrder whose Product is RECALLED violates both state
          (priority 4) and business_safety (priority 5); the state error ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Customer; Product; RepairOrder left in INTAKE (never quoted); Product then RECALLED via a published recall."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c9@x.com", full_name: "C Nine" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-9", name: "Spinner 55", category: "HARD_SHELL", msrp_cents: 28000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
            - call: "POST /store/recall-notices"
              payload: { product_id: "${pid}", reason: "wheel defect", remedy: "REPAIR" }
              as: Manager
              captures: { rn_id: $.data.id }
            - call: "POST /store/recall-notices/${rn_id}/publish"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/approve"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: referential_beats_temporal_on_claim_review
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_REGISTRATION_NOT_ACTIVE]
          - errors[ERR_WARRANTY_EXPIRED]
        distinguishing_aspect: |
          Reviewing a claim whose registration is VOID (business_referential, priority 6) AND
          whose warranty has expired (business_temporal, priority 7) returns
          ERR_REGISTRATION_NOT_ACTIVE — a different category pair than state-vs-safety.
        test_recipe:
          setup:
            - "Product warranty_months 1; Customer; WarrantyRegistration purchased 2026-06-01 (expiry 2026-07-01); claim SUBMITTED; registration VOIDed; clock advanced to 2026-08-01 (past expiry)."
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "LUG-10", name: "Carry 22", category: "SOFT_SIDE", msrp_cents: 18000, warranty_months: 1, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c10@x.com", full_name: "C Ten" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SN-10", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "ZIPPER", description: "zip stuck" }
              as: Associate
              captures: { claim_id: $.data.id }
            - call: "POST /store/warranty-registrations/${reg_id}/void"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /store/warranty-claims/${claim_id}/review"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP 409"
            - "trigger response data.error_id == ERR_REGISTRATION_NOT_ACTIVE"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: airline_fit_inclusive_dimension_equality
        grounds:
          - calculations.airline_fit
          - endpoints[GET /store/products/{id}/airline-fit]
        distinguishing_aspect: |
          Carry-on fit uses inclusive <= on each dimension: a product exactly 560/350/230 against
          limits 560/350/230 fits (true); bumping length to 561 fails (false).
        test_recipe:
          setup:
            - "Airline with carry-on max 560/350/230, checked linear 1580; one product exactly at the limits; one product 1mm over on length."
          setup_api_calls:
            - call: "POST /store/airlines"
              payload: { iata_code: "UA", name: "United", carry_on_max_length_mm: 560, carry_on_max_width_mm: 350, carry_on_max_height_mm: 230, checked_linear_limit_mm: 1580 }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-11", name: "Exact", category: "HARD_SHELL", msrp_cents: 26000, warranty_months: 24, length_mm: 560, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid_fit: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-12", name: "OverBy1", category: "HARD_SHELL", msrp_cents: 26000, warranty_months: 24, length_mm: 561, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid_over: $.data.id }
          trigger:
            - call: "GET /store/products/${pid_fit}/airline-fit"
              payload: { airline_id: "${aid}" }
              as: Associate
              captures: { fit_yes: $.data.fits_carry_on }
            - call: "GET /store/products/${pid_over}/airline-fit"
              payload: { airline_id: "${aid}" }
              as: Associate
              captures: { fit_no: $.data.fits_carry_on }
          assert:
            - "airline-fit(${pid_fit}).fits_carry_on == true"
            - "airline-fit(${pid_over}).fits_carry_on == false"

      - name: repair_quote_empty_line_set_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_NO_REPAIR_LINES]
          - state_machines.RepairOrder.INTAKE_to_QUOTED
        distinguishing_aspect: |
          Zero-count boundary on a different metric (line count) and endpoint (quote): quoting a
          RepairOrder with an empty RepairLine set returns ERR_NO_REPAIR_LINES (422).
        test_recipe:
          setup:
            - "Customer; Product; RepairOrder in INTAKE with no repair lines."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c13@x.com", full_name: "C Thirteen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-13", name: "Empty", category: "BACKPACK", msrp_cents: 9000, warranty_months: 12, length_mm: 450, width_mm: 300, height_mm: 200 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/quote"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP 422"
            - "trigger response data.error_id == ERR_NO_REPAIR_LINES"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_review_requires_registration_active
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_UNDER_REVIEW
          - entities.WarrantyRegistration.fields.status
          - errors[ERR_REGISTRATION_NOT_ACTIVE]
        distinguishing_aspect: |
          WarrantyClaim's SUBMITTED->UNDER_REVIEW transition is gated by the sibling
          WarrantyRegistration.status == ACTIVE; a VOID registration blocks review
          (ERR_REGISTRATION_NOT_ACTIVE). Pair: WarrantyClaim depends on WarrantyRegistration.
        test_recipe:
          setup:
            - "Product warranty 24 (not expired at clock default); Customer; registration ACTIVE with a SUBMITTED claim; registration VOIDed."
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "LUG-14", name: "Guard", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c14@x.com", full_name: "C Fourteen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SN-14", purchase_date: "2026-06-20T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "HANDLE", description: "loose handle" }
              as: Associate
              captures: { claim_id: $.data.id }
            - call: "POST /store/warranty-registrations/${reg_id}/void"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /store/warranty-claims/${claim_id}/review"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_REGISTRATION_NOT_ACTIVE"

      - name: start_monogram_requires_order_captured
        grounds:
          - state_machines.SalesOrderLine.SCHEDULED_to_IN_PROGRESS
          - entities.SalesOrder.fields.payment_status
          - errors[ERR_ORDER_NOT_CAPTURED]
        distinguishing_aspect: |
          SalesOrderLine's SCHEDULED->IN_PROGRESS monogram transition is gated by the parent
          SalesOrder.payment_status == CAPTURED; a PENDING order blocks start-monogram
          (ERR_ORDER_NOT_CAPTURED). Pair: SalesOrderLine depends on SalesOrder — different pair.
        test_recipe:
          setup:
            - "Customer; Product; MonogramStation; PENDING SalesOrder with a monogrammed line scheduled on a station (SCHEDULED)."
          setup_api_calls:
            - call: "POST /store/monogram-stations"
              payload: { label: "Emboss 1", method: "EMBOSS" }
              as: Manager
              captures: { station_id: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c15@x.com", full_name: "C Fifteen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-15", name: "Mono Bag", category: "SOFT_SIDE", msrp_cents: 21000, warranty_months: 12, length_mm: 520, width_mm: 320, height_mm: 220 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 21000, qty: 1, monogram_text: "ABC" }
              as: Associate
              captures: { line_id: $.data.id }
            - call: "POST /store/sales-order-lines/${line_id}/schedule-monogram"
              payload: { monogram_station_id: "${station_id}", monogram_start: "2026-07-03T09:00:00Z", monogram_end: "2026-07-03T09:30:00Z" }
              as: Associate
          trigger:
            - call: "POST /store/sales-order-lines/${line_id}/start-monogram"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_ORDER_NOT_CAPTURED"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bench_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - state_machines.RepairOrder.APPROVED_to_SCHEDULED
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.RepairOrder.fields.bench_start
        distinguishing_aspect: |
          ServiceBench uses half-open [start,end): a second repair at [10:00,11:00) adjacent to an
          existing [09:00,10:00) succeeds, while [09:30,10:30) overlapping the same bench is rejected.
        test_recipe:
          setup:
            - "ServiceBench; Product; Customer; three APPROVED RepairOrders RO_A/RO_B/RO_C; RO_A scheduled [09:00,10:00) on the bench."
          setup_api_calls:
            - call: "POST /store/service-benches"
              payload: { label: "Bench B", skill: "GENERAL" }
              as: Manager
              captures: { bench_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-16", name: "Fix Me", category: "HARD_SHELL", msrp_cents: 24000, warranty_months: 24, length_mm: 500, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_a: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_a}", repair_type: "WHEEL", labor_hours: 1, complexity: "STANDARD", parts_cost_cents: 500 }
              as: Associate
            - call: "POST /store/repair-orders/${ro_a}/quote"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_a}/approve"
              payload: {}
              as: Manager
            - call: "POST /store/repair-orders/${ro_a}/schedule"
              payload: { bench_id: "${bench_id}", bench_start: "2026-07-04T09:00:00Z", bench_end: "2026-07-04T10:00:00Z" }
              as: Associate
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_b: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_b}", repair_type: "HANDLE", labor_hours: 1, complexity: "STANDARD", parts_cost_cents: 500 }
              as: Associate
            - call: "POST /store/repair-orders/${ro_b}/quote"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_b}/approve"
              payload: {}
              as: Manager
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_c: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_c}", repair_type: "ZIPPER", labor_hours: 1, complexity: "STANDARD", parts_cost_cents: 500 }
              as: Associate
            - call: "POST /store/repair-orders/${ro_c}/quote"
              payload: {}
              as: Associate
            - call: "POST /store/repair-orders/${ro_c}/approve"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /store/repair-orders/${ro_b}/schedule"
              payload: { bench_id: "${bench_id}", bench_start: "2026-07-04T10:00:00Z", bench_end: "2026-07-04T11:00:00Z" }
              as: Associate
            - call: "POST /store/repair-orders/${ro_c}/schedule"
              payload: { bench_id: "${bench_id}", bench_start: "2026-07-04T09:30:00Z", bench_end: "2026-07-04T10:30:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "RepairOrder.${ro_b}.status == SCHEDULED"
            - "RepairOrder.${ro_c}.status == APPROVED"
            - "second trigger response data.error_id == ERR_SCHEDULE_CONFLICT"

      - name: monogram_station_buffer_conflict_on_gap
        grounds:
          - state_machines.SalesOrderLine.QUEUED_to_SCHEDULED
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.SalesOrderLine.fields.monogram_start
        distinguishing_aspect: |
          MonogramStation uses a closed interval expanded by a 15-minute buffer: a second window at
          [09:40,10:00) is rejected against an existing [09:00,09:30) even though the raw intervals
          do not overlap (10-minute gap < 15) — different geometry than the bench's half-open rule.
        test_recipe:
          setup:
            - "MonogramStation; Customer; Product; PENDING SalesOrder with two monogrammed lines; line_a scheduled [09:00,09:30) on the station."
          setup_api_calls:
            - call: "POST /store/monogram-stations"
              payload: { label: "Emboss 2", method: "HEATSTAMP" }
              as: Manager
              captures: { station_id: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-17", name: "Mono Two", category: "SOFT_SIDE", msrp_cents: 22000, warranty_months: 12, length_mm: 520, width_mm: 320, height_mm: 220 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 22000, qty: 1, monogram_text: "AA" }
              as: Associate
              captures: { line_a: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 22000, qty: 1, monogram_text: "BB" }
              as: Associate
              captures: { line_b: $.data.id }
            - call: "POST /store/sales-order-lines/${line_a}/schedule-monogram"
              payload: { monogram_station_id: "${station_id}", monogram_start: "2026-07-05T09:00:00Z", monogram_end: "2026-07-05T09:30:00Z" }
              as: Associate
          trigger:
            - call: "POST /store/sales-order-lines/${line_b}/schedule-monogram"
              payload: { monogram_station_id: "${station_id}", monogram_start: "2026-07-05T09:40:00Z", monogram_end: "2026-07-05T10:00:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_SCHEDULE_CONFLICT"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: points_capture_then_refund_conserves_balance
        grounds:
          - state_machines.SalesOrder.PENDING_to_CAPTURED
          - state_machines.SalesOrder.CAPTURED_to_REFUNDED
          - entities.Customer.fields.points_balance
          - entities.SalesOrder.fields.points_credited
        distinguishing_aspect: |
          Conserved quantity = loyalty points: capture credits 500 points, refund debits the same
          500, so points_balance returns to 0 (points_balance == sum earned - sum reversed).
        test_recipe:
          setup:
            - "BRONZE Customer; Product; SalesOrder with one line net 50000; captured (points 500 credited)."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "LUG-18", name: "Big Case", category: "HARD_SHELL", msrp_cents: 50000, warranty_months: 24, length_mm: 700, width_mm: 450, height_mm: 300 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 50000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/sales-orders/${so_id}/refund"
              payload: {}
              as: Manager
          assert:
            - "SalesOrder.${so_id}.points_credited == 500"
            - "Customer.${cust_id}.points_balance == 0"
            - "Customer.${cust_id}.lifetime_spend_cents == 0"

      - name: store_credit_accept_then_void_conserves_credit
        grounds:
          - state_machines.TradeIn.OFFERED_to_ACCEPTED
          - state_machines.TradeIn.ACCEPTED_to_VOIDED
          - entities.Customer.fields.store_credit_cents
          - calculations.trade_in_offer_value
        distinguishing_aspect: |
          Conserved quantity = store credit (money, distinct from points): accepting a 9000
          trade-in credits store_credit_cents by 9000, voiding it debits the same 9000, so the
          balance returns to 0 (store_credit_cents == sum of ACCEPTED-not-VOIDED offers).
        test_recipe:
          setup:
            - "Customer (version 1); Product msrp 30000; TradeIn condition GOOD -> offer 9000; accepted (credit 9000)."
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "c19@x.com", full_name: "C Nineteen" }
              as: Associate
              captures: { cust_id: $.data.id, cust_ver: $.data.version }
            - call: "POST /store/products"
              payload: { sku: "LUG-19", name: "Trade Model", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/trade-ins"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", expected_customer_version: "${cust_ver}", condition: "GOOD" }
              as: Associate
              captures: { ti_id: $.data.id }
            - call: "POST /store/trade-ins/${ti_id}/accept"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /store/trade-ins/${ti_id}/void"
              payload: {}
              as: Manager
          assert:
            - "TradeIn.${ti_id}.offer_amount_cents == 9000"
            - "TradeIn.${ti_id}.status == VOIDED"
            - "Customer.${cust_id}.store_credit_cents == 0"
