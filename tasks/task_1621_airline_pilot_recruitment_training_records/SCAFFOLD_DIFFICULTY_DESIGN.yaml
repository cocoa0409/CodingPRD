  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: seat_gate_at_exact_sellable_ceiling
        grounds:
          - calculations.class_seat_forecast
          - validations[priority=17]
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: |
          Metric: integer seat count via POST /enrollments. cap 2, attrition 0.50
          -> max_seats_sellable = floor(3.0) = 3: the THIRD enrollment (active 2 < 3)
          succeeds; the FOURTH (active 3 < 3 false) fails — the gate is strict <,
          and floor() of an exactly-integer product must not drop a seat.
