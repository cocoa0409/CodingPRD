  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: sponsor_signatory_cannot_create_sponsor
        claim_type: role_exclusive_denied
        grounds: [roles.SecurityManager, roles.SponsorSignatory, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /badging/sponsors is exclusive to SecurityManager: a SponsorSignatory is rejected with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE (so the signatory identity resolves)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /badging/sponsors", payload: { name: "SkyChefs", sponsor_code: "SC", active_badge_quota: 5 }, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"

      - name: access_system_cannot_issue_badge_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.AccessControlSystem, roles.BadgingOfficer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "issue-badge is exclusive to BadgingOfficer: the AccessControlSystem role is rejected with ERR_FORBIDDEN_ROLE even for a READY application."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1's STERILE application ap1 is READY"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
