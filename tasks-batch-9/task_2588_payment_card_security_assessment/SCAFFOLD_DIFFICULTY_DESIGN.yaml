  - rule_id: compensating_invariant
    instances:

      - name: gap_ledger_reopen_then_retest_restores_open_gap_count
        grounds:
          - state_machines.RequirementAssessment.IN_PLACE_to_IN_TESTING
          - state_machines.RemediationItem.IN_PROGRESS_to_RETEST_PASSED
          - calculations.compliance_projection
          - entities.Engagement.fields.open_gap_count
          - entities.RemediationItem.fields.status
        distinguishing_aspect: |
          Conserved-quantity invariant CQ-1: engagement.open_gap_count must equal the number of
          RemediationItem rows in status OPEN, IN_PROGRESS or RETEST_FAILED after every write. Reopening a
          concluded requirement raises the ledger from 0 to 1 and a passing retest lowers it back to 0, so
          the counter is restored exactly - while as_found_compliance_percentage does NOT recover, which is
          what separates a conserved counter from a conserved percentage. The intermediate assign step is
          deliberately included because IN_PROGRESS still counts, so the ledger must not dip early.
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, approved_budget_amount 200000.00) is scope-locked, in FIELDWORK, with a FINAL ACTIVE SamplingPlan over three in-sample components at DC-EAST."
            - "RequirementAssessment 1.2.1 (family R1) and 8.3.1 (family R8) are both concluded IN_PLACE with remediation_status NONE."
            - "open_gap_count == 0, no RemediationItem row exists, posture == OPEN."
            - "as_found_compliance_percentage == 100.00 and as_attested_compliance_percentage == 100.00 over an applicable_requirement_count of 2."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
