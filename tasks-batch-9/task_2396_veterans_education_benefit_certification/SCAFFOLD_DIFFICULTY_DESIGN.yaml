              as_user_id: "${sup1}"
          assert:
            - "EnrollmentCertification.${cert1}.certified_days == 110"
            - "EnrollmentCertification.${cert1}.mha_monthly_rate_cents == 213700"
            - "EnrollmentCertification.${cert1}.mha_term_total_cents == 776444"
            - "EnrollmentCertification.${cert1}.mha_term_total_cents != 776443 (the sum-then-round result)"
            - "EnrollmentCertification.${cert1}.modality == RESIDENTIAL"
            - "EnrollmentCertification.${cert1}.mha_eligible == true"

      - name: annual_cap_ledger_and_yellow_ribbon_waterfall_pinned_order
        grounds:
          - calculations.covered_tuition_and_yellow_ribbon
          - entities.EnrollmentCertification.fields.ay_cap_remaining_before_cents
          - entities.EnrollmentCertification.fields.cap_charged_cents
          - entities.YellowRibbonAward.fields.school_share_cents
          - entities.YellowRibbonAgreement.fields.pool_remaining_cents
        distinguishing_aspect: |
          Modes (a) and (c) together: the eight-step waterfall carries the same
          quantity through a cap ledger whose dependency graph LOOKS circular
          (va_tuition_cents is capped by the ledger, the ledger is charged by
          va_tuition_cents, the Yellow Ribbon gap is the ledger's shortfall, and the
          VA match is itself tuition money) and the pinned S1..S8 order resolves it —
          the fall term consumes the whole 2790000 annual cap, so the spring term
          reads ay_cap_remaining_before_cents == 0, va_tuition_cents == 0 and a
          3150000 gap, and S8 then clamps the school share to the per-student
          headroom 420000 rather than the 1575000 half-gap.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "Program BSN-UG APPROVED with one catalog version effective 2026-07-01..2027-07-01, so both terms of academic_year 2026-2027 pin the same version."
            - "Terms FA2026 2026-08-24..2026-12-11 and SP2027 2027-01-11..2027-05-07, both academic_year 2026-2027, certification deadlines 2026-09-30 and 2027-01-31."
            - "Student V-1001 CH33 at benefit_level_pct 100 with a VERIFIED COE and 1080 entitlement days."
            - "Fall certification cert1 is CERTIFIED with cap_charged_cents 2790000."
            - "YellowRibbonAgreement yr1 for 2026-2027 UNDERGRAD: per_student_annual_cap_cents 500000, annual_pool_cents 1000000, max_participants 2; the fall award has already drawn school_share_cents 80000, leaving pool_remaining_cents 920000 and participant_count 1."
            - "Spring certification cert2 for 12 of 12 residential credits over 2027-01-11..2027-05-07 is SUBMITTED with a REPORTED TuitionFeeReport of 3000000 tuition + 150000 fees and no tuition-specific aid."
