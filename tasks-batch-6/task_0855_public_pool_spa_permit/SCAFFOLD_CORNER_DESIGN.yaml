        distinguishing_aspect: "At exactly VOLUME_SURCHARGE_FREE_GALLONS (25000) the billable gallons are max(0, 0) = 0, so ceil(0/10000) = 0 units and the fee equals the bare CLASS_C_SEMI_PUBLIC base of 18000 cents."
