        distinguishing_aspect: "Both sublimits are checked independently against the dwelling's own dwelling_limit_cents, so contents alone over the limit and loss-of-use alone over the limit each raise ERR_SUBLIMIT_EXCEEDS_LIMIT rather than only their sum being checked."
