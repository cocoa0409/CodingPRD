      - instance_id: CF-2
        name: coop_band_selected_from_gross_before_offset
        grounds:
          - calculations.invoice_net_due
          - calculations.marketing_commitment_ledger
          - entities.Invoice.fields.coop_cap_pct
          - entities.Invoice.fields.coop_offset_cents
          - entities.Invoice.fields.net_due_cents
        title: "invoice_net_due — the co-op ceiling band is selected from the gross, not from the post-offset payable"
        calculation: invoice_net_due
        rationale: >-
          The waterfall looks self-referential: the co-op offset reduces what the
          operator owes, and the co-op ceiling is a percentage of an amount. If
          the band were read off the post-offset payable the pipeline would need
          a fixed point; the scaffold pins the band to STEP 1's gross instead.
          Any fixture whose gross sits just above a band boundary and whose
          offset carries it back below that boundary distinguishes the two
          readings, and no amount of algebraic simplification collapses the
          six steps into one expression because STEP 4's launch-fee offset is
          floored by what STEP 3 left behind.
        distinguishing_aspect: >-
          gross 5200000 selects coop_cap_pct 0.08 (band 2, inclusive lower bound
          5000000), ceiling 416000, coop_offset_cents 416000 and net_due_cents
          4784000. Reading the band off the resulting 4784000 payable would put
          it in band 1 (0.05), ceiling 239200, offset 239200 and net_due
          4960800 — a 176800-cent divergence. The DRAFT invoice must report
          coop_cap_pct == 0.08 even though its own net_due_cents is below the
          band-2 threshold.
        test_recipe:
          setup: >-
            Cliffside Telco (TELCO, 200,000 total video subscribers) carries the
            network on BASIC under a flat-rate agreement: base 40.0000, zero
            escalator, 50% penetration floor, term 2025-01-01..2028-12-31. It
            reports 130,000 subscribers for 2026-06 — 65.00% penetration,
            comfortably above the floor, so the FINAL billable count is the
            reported 130,000 and the accepted fee is 130,000 * 40.0000 =
            5,200,000 cents, sitting 200,000 cents above the 5,000,000 band-2
            boundary. A separately negotiated COOP_ADVERTISING commitment of
            1,000,000 cents has 500,000 cents earned and none of it billed, so
            the co-op pool (500,000) exceeds the band-2 ceiling (416,000) and the
            ceiling — not the pool — is what binds.
