          assert:
            - "ab_cast == 3 (ABSTAIN counts toward turnout)"
            - "ab_abs == 2"
            - "ab_pct == 1.0 (denominator is YES+NO = 1, abstentions excluded)"
            - "ab_pass == true (STRICT 1.0 > 0.5)"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role fails priority-1 auth with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (even for a nonexistent resource)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cases/00000000-0000-4000-8000-000000000000", captures: { err_noh: $.data.error_id } }
          assert:
            - "err_noh == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth beats existence)"

      - name: not_found_beats_state_and_ownership
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "submit-dossier on a nonexistent case returns ERR_CASE_NOT_FOUND (existence p3), never a stage or ownership error — even though the caller's role is valid for the endpoint."
        test_recipe:
          setup: ["one candidate exists (a valid identity to act with)"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand NF", employee_id: "E9300", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_nf: $.data.id } }
          trigger:
            - { call: "POST /api/cases/00000000-0000-4000-8000-000000000000/submit-dossier", as: Candidate, as_user_id: "${cand_nf}", captures: { err_nf: $.data.error_id } }
          assert:
            - "err_nf == ERR_CASE_NOT_FOUND"

      - name: ownership_mismatch_on_foreign_case
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Candidate B calling submit-dossier on candidate A's case fails with ERR_OWNERSHIP_MISMATCH (p5) — after role (p2) and existence (p3) pass."
        test_recipe:
          setup: ["candidates A and B; case belongs to A, in DOSSIER_ASSEMBLY"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand OA", employee_id: "E9301", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_oa: $.data.id } }
            - { call: "POST /api/candidates", payload: { full_name: "Cand OB", employee_id: "E9302", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_ob: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_oa}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_oa: $.data.id } }
          trigger:
            - { call: "POST /api/cases/${case_oa}/submit-dossier", as: Candidate, as_user_id: "${cand_ob}", captures: { err_oo: $.data.error_id } }
          assert:
            - "err_oo == ERR_OWNERSHIP_MISMATCH"
            - "TenureCase.${case_oa}.stage == DOSSIER_ASSEMBLY"

      - name: arms_length_gate_on_solicitation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ARMS_LENGTH_VIOLATION]", entities.ReviewerInvitation.fields.is_arm_length, entities.ReviewerInvitation.fields.declared_coauthor]
        distinguishing_aspect: "Confidentiality/integrity gate: declared_coauthor true OR is_arm_length false each abort solicitation with ERR_ARMS_LENGTH_VIOLATION (422) — the safety gate fires before constraint/temporal checks."
        test_recipe:
          setup: ["case in EXTERNAL_REVIEW; one registered reviewer"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand AL", employee_id: "E9303", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_al: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_al}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_al: $.data.id, case_al_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_al}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_al_v}" }, as: Candidate, as_user_id: "${cand_al}", captures: { al_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_al}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_al_v} + 1" }, as: Candidate, as_user_id: "${cand_al}", captures: { al_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_al}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_al_v} + 2" }, as: Candidate, as_user_id: "${cand_al}", captures: { al_r1: $.data.id } }
