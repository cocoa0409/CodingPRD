            - "LabelTask.${task_1}.due_at == 2026-08-05T00:00:00Z and LabelTask.${task_1}.overdue == false"
            - "Step 1 returns HTTP 409 with ${err_place_early} == ERR_LABEL_NOT_PRINTED; both axes stay NOT_PRINTED x UNPLACED"
            - "Step 2 (print): print_status == PRINTED, placement_status still UNPLACED, printed_label_serial is non-null, PriceChangeLine.${line_1}.line_status == LABELED"
            - "Step 3 (place): placement_status == PLACED, print_status still PRINTED, placed_by_associate_id == ${la1}, placed_at == 2026-08-01T00:00:00Z"
            - "Step 4 (verify REJECTED): placement_status == REJECTED, rejection_count == 1, print_status == REPRINT_REQUIRED, printed_label_serial == null, PriceChangeLine.${line_1}.line_status == FAILED"
            - "Step 4 issues no AccountabilityAction — rejection_count 1 is below REJECTION_ACTION_THRESHOLD 2; GET /price-integrity/associates/${la1}/accountability-actions returns total_count 0"
            - "Step 5 (reprint): print_status == PRINTED, placement_status still REJECTED, PriceChangeLine.${line_1}.line_status == FAILED"
            - "Step 6 (replace): placement_status == PLACED, print_status still PRINTED, PriceChangeLine.${line_1}.line_status == LABELED"
            - "Step 7 (verify VERIFIED): placement_status == VERIFIED, print_status still PRINTED, verified_by_associate_id == ${pa1}, PriceChangeLine.${line_1}.line_status == VERIFIED"
            - "PriceChangeFile.${file_a}.status == PARTIALLY_EXECUTED and verified_line_count == 1 of line_count 2 — the second line has no task, so the file does not reach EXECUTED"
            - "PriceChangeLine.${line_2}.line_status == PENDING"
            - "Associate.${la1}.verified_placement_count == 1"
            - "Store.${store_a}.label_backlog_count == 0"

