              payload: { variant: "PROVISIONAL", geography_factor: 2, product_factor: 3, pep_factor: 2, adverse_media_factor: 3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id, score: $.data.total_score, band: $.data.risk_band }
          assert:
            - "RiskAssessment.${ra_id}.total_score == 36.00"
            - "RiskAssessment.${ra_id}.risk_band == MEDIUM"

      - name: rapid_movement_threshold_at_90pct_credited
        claim_type: threshold
        grounds: ["calculations.transaction_monitoring", "entities.Transaction.fields.triggered_rule"]
        distinguishing_aspect: "An account with cumulative_credited 1,000,000 sees a CASH_OUT of exactly 900,000 (== 0.90 * credited) fire RAPID_MOVEMENT (>= boundary)."
        test_recipe:
          setup: ["An ACTIVE account credited 1,000,000 cents (single WIRE_IN below CTR band)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Rapid Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2002-02-02" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-RAP-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "WIRE_IN", amount_cents: 1000000, posted_at: "2026-06-16T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_in: $.data.triggered_rule }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_OUT", amount_cents: 900000, posted_at: "2026-06-16T10:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_out: $.data.triggered_rule }
          assert:
            - "Transaction(in).triggered_rule == null (WIRE_IN does not count toward CTR cash window)"
            - "Transaction(out).triggered_rule == RAPID_MOVEMENT (900,000 >= 0.90 * 1,000,000)"

