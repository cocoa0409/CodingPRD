  # ===========================================================================
  # §0.5 rule 3 — non_linear_state_machine
  # Instance (a) exercises a CYCLE with a bounded loop counter on
  # PublicNotification.status; instance (b) exercises two PARALLEL, independent
  # state dimensions on one CapitalProject row. Different entities, different
  # non-linear shapes.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: notification_revision_cycle_clears_the_draft_and_increments_the_bounded_counter
        grounds:
          - state_machines.PublicNotification.SUBMITTED_to_DRAFT
          - state_machines.PublicNotification.DRAFT_to_SUBMITTED
          - entities.PublicNotification.fields.revision_count
          - entities.PublicNotification.fields.content_elements
          - entities.PublicNotification.fields.delivery_methods
          - calculations.notification_tier_and_deadline
          - global_constants.MAX_NOTIFICATION_REVISIONS
          - validations[priority=98]
        distinguishing_aspect: |
          A true cycle: PublicNotification returns to a state it has already occupied (DRAFT), and the
          loop is only terminating because revision_count is monotonic and bounded by
          MAX_NOTIFICATION_REVISIONS. Re-entering DRAFT is destructive — content_elements and
          delivery_methods are emptied — so a second lap must re-supply all six mandatory elements;
          re-submitting does NOT decrement or reset the counter. Instance (b) has no cycle at all: it
          advances two dimensions that never revisit a state.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "Laboratory certified for METHOD_533, lowest achievable detection limit 1.00, capacity 5."
            - "EntryPoint EPTDS-01, population 45000."
            - "Four ACCEPTED quarterly results at detection limit 1.00: 3.00 (2025Q3), 3.00 (2025Q4), 3.00 (2026Q1), 9.00 (2026Q2) -> compliance LRAA 4.50, ratio 1.1250, posture VIOLATION_PENDING."
            - "A determination for period_end 2026Q2 is created and ISSUED at the default clock 2026-08-01T00:00:00.000Z: MCL_VIOLATION / NON_ACUTE (LRAA 4.50 < ACUTE_MULTIPLIER * mcl = 16.00), so a DRAFT TIER_2 PublicNotification exists with required_by_at 2026-08-31T00:00:00.000Z."
            - "officer-1 submits that notification with all six MANDATORY_CONTENT_ELEMENTS and delivery methods [MAIL, POSTING]."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
