  - section: endpoints
    instances:

      - name: success_and_error_envelopes_match_the_fixed_shape
        claim_type: standard_crud
        grounds: ["response_envelope", "endpoints.POST_/producers", "endpoints.GET_/premises"]
        distinguishing_aspect: "Every 2xx body carries meta.api_request_id, meta.api_request_timestamp, response_type object or array and data; every error body carries response_type error with data.error_id and data.message."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
          trigger:
            - call: "POST /producers"
              payload: { legal_name: "Envelope Co", contact_email: "ops@envelope.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_ev: $.data.id }
            - call: "GET /premises"
              payload: { producer_id: "${prod_ev}" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "GET /producers/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { err_env: $.data.error_id, msg_env: $.data.message }
          assert:
            - "Create response has meta.api_request_id starting with req_ and an ISO-8601 meta.api_request_timestamp"
            - "Create response has response_type == object and data.id == ${prod_ev}"
            - "List response has response_type == array, data == [], total_count == 0, has_more == false, limit == 10, offset == 0"
            - "Error response has response_type == error, ${err_env} == ERR_PRODUCER_NOT_FOUND and ${msg_env} is a non-empty string"

      - name: pagination_limit_outside_bounds_is_rejected
        claim_type: standard_crud
        grounds: ["response_envelope.pagination_defaults", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit is bounded to [1,100]: limit=101 and limit=0 both return ERR_INVALID_REQUEST (400), while limit=100 succeeds."
        test_recipe:
          setup:
            - "One producer exists so the list endpoint has a valid filter target."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Page Co", contact_email: "ops@page.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_pg: $.data.id }
          trigger:
            - call: "GET /premises"
              payload: { producer_id: "${prod_pg}", limit: 101 }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { err_lim: $.data.error_id }
            - call: "GET /premises"
              payload: { producer_id: "${prod_pg}", limit: 0 }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { err_lim0: $.data.error_id }
          assert:
            - "${err_lim} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_lim0} == ERR_INVALID_REQUEST with HTTP 400"
            - "The same call with limit 100 returns 200"

      - name: sighting_history_is_ordered_and_hides_reversed_rows_by_default
        claim_type: computed_read
        grounds: ["endpoints.GET_/sightings", "entities.Sighting.fields.sequence_no", "entities.Sighting.fields.reversed"]
        distinguishing_aspect: "GET /sightings?animal_id=X returns rows ordered by sequence_no ASC and omits reversed rows; include_reversed=true restores them, so the same animal shows 2 rows by default and 3 with the flag after a movement void."
        test_recipe:
          setup:
            - "Animal an_s was tagged at P1 (seq 1), departed for P2 (seq 2), was received (seq 3), then the movement was disputed and voided, reversing the ARRIVAL and DEPARTURE rows."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "History Co", contact_email: "ops@history.example", state_code: "WY" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_hs: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_hs}", pin: "WYS0001", operation_type: "COW_CALF", state_code: "WY", capacity: 10 }
              as: Producer
              as_user_id: "${prod_hs}"
              captures: { hs1: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_hs}", pin: "WYS0002", operation_type: "FEEDLOT", state_code: "WY", capacity: 10 }
              as: Producer
              as_user_id: "${prod_hs}"
              captures: { hs2: $.data.id }
            - call: "POST /premises/${hs1}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-wy-1"
            - call: "POST /premises/${hs2}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-wy-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_hs: $.data.id }
            - call: "POST /device-suppliers/${sup_hs}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_hs_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_hs}", premises_id: "${hs1}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_hs_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_hs}"
              captures: { lot_hs: $.data.id }
            - call: "POST /tag-lots/${lot_hs}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-04-29", birth_premises_id: "${hs1}" }
              as: Producer
              as_user_id: "${prod_hs}"
              captures: { an_hs: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events"
              payload: { animal_id: "${an_hs}", origin_premises_id: "${hs1}", destination_premises_id: "${hs2}", departed_at: "2026-08-02T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_hs}"
              captures: { mv_hs: $.data.id }
            - call: "POST /movement-events/${mv_hs}/receive"
              payload: { arrived_at: "2026-08-02T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_hs}"
            - call: "POST /movement-events/${mv_hs}/dispute"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-wy-1"
            - call: "POST /movement-events/${mv_hs}/void"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
          trigger:
            - call: "GET /sightings"
              payload: { animal_id: "${an_hs}" }
              as: Producer
              as_user_id: "${prod_hs}"
            - call: "GET /sightings"
              payload: { animal_id: "${an_hs}", include_reversed: true }
              as: Producer
              as_user_id: "${prod_hs}"
            - call: "GET /sightings"
              payload: { source_movement_id: "${mv_hs}", include_reversed: true }
              as: Producer
              as_user_id: "${prod_hs}"
          assert:
            - "Default read returns 1 row: sequence_no 1, sighting_type TAG_APPLIED, reversed false"
            - "include_reversed read returns 3 rows ordered by sequence_no 1,2,3 with types TAG_APPLIED, DEPARTURE, ARRIVAL"
            - "Rows 2 and 3 have reversed == true and source_movement_id == ${mv_hs}"
            - "The source_movement_id filter returns exactly those 2 rows"
            - "Animal.${an_hs}.sighting_count == 1 and .last_sequence_no == 3"

      - name: logical_clock_defaults_to_2026_08_01_before_any_set
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/_clock/set_current_utc", "entities.Producer.fields.created_at"]
        distinguishing_aspect: "On a fresh server, with no clock call at all, the first created resource is stamped 2026-08-01T00:00:00.000Z; the clock never reads real wall-clock time."
        test_recipe:
          setup:
            - "Fresh server, no clock endpoint call has been made."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Clock Co", contact_email: "ops@clock.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_ck: $.data.id, made_at: $.data.created_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:30:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /producers"
              payload: { legal_name: "Clock Co Two", contact_email: "ops2@clock.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_ck2: $.data.id }
          assert:
            - "${made_at} == 2026-08-01T00:00:00.000Z"
            - "The clock response returns data.current_utc == 2026-09-15T12:30:00Z"
            - "Producer.${prod_ck2}.created_at == 2026-09-15T12:30:00.000Z"

  - section: errors
