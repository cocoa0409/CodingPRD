    input: [full_name, date_of_birth, state_code, "allergy_flags?", "high_risk_flag?", "insurance_plan_id?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/immunization/patients/{patientId}"
    description: "Get one patient"
    roles: [PharmacyTechnician, Pharmacist, Immunizer, ComplianceOfficer]
