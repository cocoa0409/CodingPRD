            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_v: $.data.version }
            - call: "POST /atfm/tmis/${tmi}/revisions"
              payload: { new_controlled_rate: 10, reason: "first", expected_tmi_version: "${tmi_v}" }
              as: FlowManager
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
          trigger:
            - call: "POST /atfm/tmis/${tmi}/revisions"
