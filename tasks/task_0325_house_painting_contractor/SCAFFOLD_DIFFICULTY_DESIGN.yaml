          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - calculations.project_totals
          - entities.Project.fields.revised_total_cents
        distinguishing_aspect: |
          Conserved quantity = money (Project.revised_total_cents, the live job total). Forward action (approve)
          would add the +47300 delta; the compensating action (reject) applies no surface mutation, so
          revised_total_cents stays exactly at its pre-order value (8913) with zero drift.
        test_recipe:
