  - rule_id: transitive_cascade
    instances:
      - name: critical_audit_suspends_contract_releases_allocation_surges_layover
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.RoomAllocation.HELD_to_RELEASED
          - state_machines.CrewLayoverRequirement.CONFIRMED_to_SURGED
          - state_machines.TransportTrip.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive cascade originating from POST /audits (severity CRITICAL):
          Contract ACTIVE -> SUSPENDED releases the contract's HELD allocation; that release
          surges the layover; the layover's SURGED state is what gates the follow-on
          distressed-book — each hop caused by the previous hop's mutation, not by the audit
          directly. The same suspension cancels SCHEDULED transport trips on the contract.
