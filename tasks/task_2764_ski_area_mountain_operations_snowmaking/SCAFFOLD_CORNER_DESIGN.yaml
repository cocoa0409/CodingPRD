      - name: a_new_session_supersedes_only_the_overlapping_peer_on_the_same_area_and_refunds_its_reservation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mountain-ops/snowmaking-sessions]
          - state_machines.SnowmakingSession.SCHEDULED_to_ABORTED
          - calculations.snowmaking_water_volume
          - entities.SnowmakingSession.fields.abort_reason
        distinguishing_aspect: |
          The create endpoint has a destructive side effect that is scoped by OVERLAP, not by recency:
          the second session kills the first because their windows intersect, and a third session whose
          window merely touches the survivor kills nothing. The season ledger must therefore end at the
          sum of the two live reservations exactly, with the superseded reservation fully refunded and
          water_used_af untouched - an implementation that treats supersede as "newest wins per area"
          aborts the survivor at trigger 8 and lands on the wrong ledger.
        test_recipe:
          setup:
            - "A PRESEASON season with water_right_seasonal_af 250.000, one CLOSED terrain area and one ONLINE pump house PH1 of max_gpm 2400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
