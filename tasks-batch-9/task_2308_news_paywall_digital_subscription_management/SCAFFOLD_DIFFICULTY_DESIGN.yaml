              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Notice A", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
