  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_cancel_exactly_120_minutes_is_on_time_no_fee
        grounds:
          - calculations.NO_SHOW_FEE
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Reservation.fields.no_show_fee_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the late-cancel window reached through the
          cancel endpoint: a cancel at exactly start_utc - 120 minutes is on-time
          (no_show_fee_cents stays 0, full reversal); one minute later would incur
          50% fee. Tests the strict boundary at LATE_CANCEL_WINDOW_MINUTES.
        test_recipe:
          setup:
            - "Venue+Bay+Member(wallet 50000). PEAK 60-min weekday reservation start 2026-06-02T18:00:00Z confirmed via WALLET (net 6800, wallet 43200)."
            - "Clock set to exactly 2026-06-02T16:00:00Z (start - 120 min)."
