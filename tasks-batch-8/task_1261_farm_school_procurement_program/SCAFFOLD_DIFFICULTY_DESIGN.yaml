scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 - dual_variant_calc (3 instances: offering scoring vs claim fiscal
  # vs report aggregation - three different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: preference_model_linear_vs_tiered_divergence
        grounds:
          - calculations.preference_points
          - entities.FarmProductOffering.fields.preference_points
          - entities.ProgramYear.fields.preference_model
        distinguishing_aspect: |
          Same farm distance (30) and radius (100) produce different points under
          the two preference_model variants: LINEAR gives 100-30=70, TIERED band
          25<d<=50 gives 75. Entity domain: FarmProductOffering scoring.
        test_recipe:
          setup:
            - "Two OPEN program years: LINEAR year and TIERED year, both radius 100"
            - "One APPROVED farm at distance 30 with valid cert and insurance"
            - "One ACTIVE product; one offering per year with identical inputs"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "YL", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "LINEAR", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr_l: $.data.id } }
            - { call: "POST /f2s/program-years/${yr_l}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/program-years", payload: { school_year_label: "YT", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr_t: $.data.id } }
            - { call: "POST /f2s/program-years/${yr_t}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
          trigger:
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr_l}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off_l: $.data.id, pts_l: $.data.preference_points } }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr_t}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off_t: $.data.id, pts_t: $.data.preference_points } }
          assert:
            - "FarmProductOffering.${off_l}.preference_points == 70 (LINEAR: 100-30)"
            - "FarmProductOffering.${off_t}.preference_points == 75 (TIERED: 25<30<=50)"
            - "Both offerings have is_local_eligible == true despite different points"

      - name: match_credit_provisional_vs_final_post_audit
        grounds:
          - calculations.match_credit
          - entities.ReimbursementClaim.fields.match_provisional_cents
          - entities.ReimbursementClaim.fields.match_final_cents
        distinguishing_aspect: |
          Same claim lines produce match_provisional_cents == 205 (claimed basis,
          pre-audit) vs match_final_cents == 178 (awarded basis, post-audit) on the
          ReimbursementClaim fiscal domain - a different domain from offering scoring.
        test_recipe:
          setup:
            - "OPEN TIERED year (radius 100, award 1000000), product, APPROVED local farm (distance 30)"
            - "Two VERIFIED offerings (price 150 and 250), two SIGNED agreements (committed 1 each)"
            - "Two ACCEPTED deliveries of quantity 1; two APPROVED invoices with totals 153 and 255 (150+3 incentive, 250+5 incentive), both delivered 2026-08-10"
            - "Claim for period 2026-08 containing both invoices"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 150, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off_a: $.data.id } }
            - { call: "POST /f2s/offerings/${off_a}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off_a}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off_b: $.data.id } }
            - { call: "POST /f2s/offerings/${off_b}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off_b}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off_a}", committed_quantity: 1, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr_a: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr_a}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off_b}", committed_quantity: 1, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr_b: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr_b}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr_a}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 1 }, as: FarmManager, as_user_id: "${farm}", captures: { del_a: $.data.id } }
            - { call: "POST /f2s/deliveries/${del_a}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_a}/accept", payload: { accepted_quantity: 1 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr_b}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 1 }, as: FarmManager, as_user_id: "${farm}", captures: { del_b: $.data.id } }
            - { call: "POST /f2s/deliveries/${del_b}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_b}/accept", payload: { accepted_quantity: 1 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/invoices", payload: { delivery_id: "${del_a}", invoice_number: "INV-A" }, as: FarmManager, as_user_id: "${farm}", captures: { inv_a: $.data.id } }
            - { call: "POST /f2s/invoices/${inv_a}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/invoices/${inv_a}/approve", payload: {}, as: DistrictProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /f2s/invoices", payload: { delivery_id: "${del_b}", invoice_number: "INV-B" }, as: FarmManager, as_user_id: "${farm}", captures: { inv_b: $.data.id } }
            - { call: "POST /f2s/invoices/${inv_b}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/invoices/${inv_b}/approve", payload: {}, as: DistrictProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /f2s/reimbursement-claims", payload: { program_year_id: "${yr}", period_month: "2026-08" }, as: ClaimsCoordinator, as_user_id: "claims-1", captures: { claim: $.data.id, claim_v: $.data.version } }
            - { call: "POST /f2s/reimbursement-claims/${claim}/lines", payload: { invoice_id: "${inv_a}", expected_claim_version: "${claim_v}" }, as: ClaimsCoordinator, as_user_id: "claims-1" }
            - { call: "GET /f2s/reimbursement-claims/${claim}", payload: {}, as: ClaimsCoordinator, as_user_id: "claims-1", captures: { claim_v2: $.data.version } }
            - { call: "POST /f2s/reimbursement-claims/${claim}/lines", payload: { invoice_id: "${inv_b}", expected_claim_version: "${claim_v2}" }, as: ClaimsCoordinator, as_user_id: "claims-1" }
            - { call: "POST /f2s/reimbursement-claims/${claim}/submit", payload: {}, as: ClaimsCoordinator, as_user_id: "claims-1" }
            - { call: "POST /f2s/reimbursement-claims/${claim}/start-review", payload: {}, as: StateGrantAuditor, as_user_id: "aud-1", captures: { prov_seen: $.data.match_provisional_cents } }
          trigger:
            - { call: "GET /f2s/claim-lines", payload: { invoice_id: "${inv_a}" }, as: StateGrantAuditor, as_user_id: "aud-1", captures: { line_a_id: "$.data[0].id" } }
            - { call: "GET /f2s/claim-lines", payload: { invoice_id: "${inv_b}" }, as: StateGrantAuditor, as_user_id: "aud-1", captures: { line_b_id: "$.data[0].id" } }
            - { call: "POST /f2s/claim-lines/${line_b_id}/disallow", payload: { disallowed_amount_cents: 53, reason: "documentation gap" }, as: StateGrantAuditor, as_user_id: "aud-1" }
            - { call: "POST /f2s/claim-lines/${line_a_id}/allow", payload: {}, as: StateGrantAuditor, as_user_id: "aud-1" }
          assert:
            - "Claim.${claim}.match_provisional_cents == 205 (round(153*0.5)=77 + round(255*0.5)=128, per-line then sum)"
            - "After audit: Claim.${claim}.match_final_cents == 178 (77 + round(202*0.5)=101)"
            - "Claim.${claim}.status == PARTIALLY_AWARDED and match_provisional remains 205"

      - name: report_cash_vs_accrual_month_split
        grounds:
          - calculations.local_spend_share
          - endpoints: "GET /f2s/program-years/{id}/report"
        distinguishing_aspect: |
          Same invoice (subtotal 10000) is counted by the ACCRUAL variant in
          2026-08 (delivery month) and by the CASH variant in 2026-09 (paid_at
          month) - different totals per month for identical underlying data on
          the ProgramYear reporting domain.
        test_recipe:
          setup:
            - "Standard chain: OPEN year, APPROVED compliant local farm, VERIFIED offering (price 250), forecast 400@wk6, kitchen+window, agreement committed 200 signed, delivery 2026-08-10 qty 40 ACCEPTED, invoice INV-1 approved (subtotal 10000, incentive 200, total 10200), unpaid"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { del: $.data.id } }
            - { call: "POST /f2s/deliveries/${del}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del}/accept", payload: { accepted_quantity: 40 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/invoices", payload: { delivery_id: "${del}", invoice_number: "INV-1" }, as: FarmManager, as_user_id: "${farm}", captures: { inv: $.data.id } }
            - { call: "POST /f2s/invoices/${inv}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/invoices/${inv}/approve", payload: {}, as: DistrictProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /f2s/program-years/${yr}/report", payload: { month: "2026-08" }, as: DistrictProgramAdmin, captures: { aug_accrual: $.data.accrual_local_spend_cents, aug_cash: $.data.cash_local_spend_cents } }
            - { call: "POST /f2s/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/invoices/${inv}/pay", payload: {}, as: DistrictProgramAdmin }
            - { call: "GET /f2s/program-years/${yr}/report", payload: { month: "2026-09" }, as: DistrictProgramAdmin, captures: { sep_cash: $.data.cash_local_spend_cents, sep_accrual: $.data.accrual_local_spend_cents } }
          assert:
            - "Report 2026-08: accrual_local_spend_cents == 10000 AND cash_local_spend_cents == 0"
            - "Report 2026-09: cash_local_spend_cents == 10000 AND accrual_local_spend_cents == 0"
            - "Invoice.${inv}.paid_at == 2026-09-02T00:00:00Z (logical clock, not wall clock)"

  # ===========================================================================
  # Rule 2 - combinatorial_formula (3 instances, modes a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_band_selection_mode_a
        grounds:
          - calculations.preference_points
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with 3+ inputs (distance, radius,
          model): at TIERED radius 100, distance exactly 25 -> 100 points while
          distance 26 -> 75 points; the band edge is inclusive on the lower side.
        test_recipe:
          setup:
            - "OPEN TIERED year radius 100; ACTIVE product; two APPROVED compliant farms at distance 25 and 26"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Farm25", contact_email: "a@x.com", distance_miles_to_hub: 25, acres: 100 }, as: DistrictProgramAdmin, captures: { farm25: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm25}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm25}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm25}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm25}" }
            - { call: "POST /f2s/farms/${farm25}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/farms", payload: { legal_name: "Farm26", contact_email: "b@x.com", distance_miles_to_hub: 26, acres: 100 }, as: DistrictProgramAdmin, captures: { farm26: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm26}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm26}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm26}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm26}" }
            - { call: "POST /f2s/farms/${farm26}/approve", payload: {}, as: DistrictProgramAdmin }
          trigger:
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm25}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm25}", captures: { off25: $.data.id } }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm26}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm26}", captures: { off26: $.data.id } }
          assert:
            - "FarmProductOffering.${off25}.preference_points == 100 (d <= 25 band edge is inclusive)"
            - "FarmProductOffering.${off26}.preference_points == 75 (25 < 26 <= 50)"

      - name: match_per_line_rounding_mode_b
        grounds:
          - calculations.match_credit
        distinguishing_aspect: |
          Mode (b) nested rounding order: per-line round_half_up then sum gives
          77+128=205 for claimed 153 and 255, while sum-then-round would give
          round(408*0.5)=204. Scaffold pins per-line-then-sum; assert 205.
        test_recipe:
          setup:
            - "Same fixture as match_credit_provisional_vs_final_post_audit up to a claim holding two lines with claimed 153 and 255, still pre-audit"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
