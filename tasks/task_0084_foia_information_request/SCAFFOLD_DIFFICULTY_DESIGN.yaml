              payload: { title: "Pricing", page_count: 2, contains_submitter_info: true, submitter_id: "${sub_id}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /records/${rec_id}/objection"
              payload: { submitter_id: "${sub_id}", objection_text: "trade secret" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { obj_id: $.data.id }
            - call: "POST /objections/${obj_id}/object"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /records/${rec_id}/review"
