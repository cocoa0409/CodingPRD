  - section: state_machines
    instances:
      - name: route_complete_skip_already_covered_stub
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RouteStop.SCHEDULED_to_SKIPPED
        excluded_because:
          difficulty_instance: transitive_cascade / route_complete_skips_scheduled_stops_depth2
