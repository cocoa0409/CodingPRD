        Entity pair (AuditVisit, Auditor). The visit is in a perfectly valid SCHEDULED state and the
        clock is inside its window, yet the transition is gated by a state living on a different
        aggregate. Suspension deliberately leaves SCHEDULED visits alone rather than voiding them, so
        the only way to observe the dependency is at the start boundary - and it must become passable
        again the moment the auditor is recertified, with no change to the visit itself.
