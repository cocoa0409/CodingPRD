# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2331 — League Merchandise Licensing & Royalty Administration
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in `assert:` was computed by executing the referenced
# calculations[].formula against its `constants:` (contract item 7).
#
# Shared fixture vocabulary used by the setup chains below:
#   clock            2026-08-01T00:00:00Z  (mandatory default; QUARTER_OF = 2026Q3)
#   category JERSEY  tiers [0,2000000)@1200bps  [2000000,5000000)@1000bps
#                          [5000000,null)@800bps ; closeout_rate 500bps
#                          closeout_cap 1500bps / hard 4000bps
#                          deduction_cap 500bps / hard 2000bps
#                          mg_floor 1000000 ; advance_floor 2500bps
#                          mark_usage_class LEAGUE_CLUB_AND_PLAYER
#   opaque actor ids u_ops_1 (LeagueLicensingManager), u_mco_1 (MarkComplianceOfficer),
#                    u_fin_1 / u_fin_2 (FinanceController), u_aud_1 (RoyaltyAuditor)
#   FILING_DEADLINE_DATE(2026Q2) = 2026-06-30 + 45d = 2026-08-14, so a report filed
#   at the default clock is never late (late_days == 0, interest == 0).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: royalty_provisional_quarterly_vs_final_annual_true_up
        grounds:
          - calculations.royalty_due_computation
          - entities.RoyaltyReport.fields.royalty_due_cents
          - entities.RoyaltyReport.fields.applied_tier_rate_bps
          - entities.LicenseAgreement.fields.contract_year_start_quarter
          - state_machines.RoyaltyReport.FILED_to_ACCEPTED
        distinguishing_aspect: |
          Entity domain = RoyaltyReport royalty rating. The two variants differ in
          TIER APPLICATION SHAPE on identical sales data: PROVISIONAL_QUARTERLY
          selects ONE rate from each quarter's own 1500000-cent basis (1200 bps
          both quarters, 180000 + 180000 = 360000), while FINAL_ANNUAL_TRUE_UP
          applies the tiers MARGINALLY to the 3000000-cent cumulative basis
          (2000000 @ 1200 + 1000000 @ 1000 = 340000), yielding delta_cents == -20000
          — a licensee CREDIT that the provisional path can never produce.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; category JERSEY as described in the header"
            - "licensee LIC_A is ACTIVE; agreement AGR_A is ACTIVE, NON_EXCLUSIVE, central_licensing_flag false, MG 4000000, required_advance 1000000 fully paid, term 2026-01-01..2027-12-31, contract_year_start_quarter 2026Q1"
            - "one AUTHORIZED DEPARTMENT retailer authorization for LIC_A covering 2026-01-01..2028-12-31"
            - "two ACCEPTED reports on AGR_A: 2026Q1 and 2026Q2, each a single DEPARTMENT line with gross_sales_cents 1500000, no closeout, no deductions"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Northstar Apparel", contact_email: "ops@northstar.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_a: $.data.id }
            - call: "POST /licensing/licensees/${lic_a}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_a}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 4000000, required_advance_cents: 1000000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_a: $.data.id }
            - call: "POST /licensing/agreements/${agr_a}/advance-payments"
              payload: { amount_cents: 1000000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_a}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_a}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_a}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_a}"
              as: LeagueLicensingManager
              captures: { lic_a_v: $.data.version }
            - call: "POST /licensing/licensees/${lic_a}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: true, expected_licensee_version: "${lic_a_v}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_a: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_a}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_a}"
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { agr_a_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_a}", period_quarter: "2026Q1", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_a}", gross_sales_cents: 1500000, units: 3000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_a_v1}" }
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { rpt_q1: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_q1}/file"
              as: Licensee
              as_user_id: "${lic_a}"
            - call: "POST /licensing/royalty-reports/${rpt_q1}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "GET /licensing/agreements/${agr_a}"
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { agr_a_v2: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_a}", period_quarter: "2026Q2", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_a}", gross_sales_cents: 1500000, units: 3000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_a_v2}" }
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { rpt_q2: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_q2}/file"
              as: Licensee
              as_user_id: "${lic_a}"
            - call: "POST /licensing/royalty-reports/${rpt_q2}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: FinanceController
              as_user_id: "u_fin_1"
          trigger:
            - call: "POST /licensing/agreements/${agr_a}/annual-true-up"
              payload: { contract_year: 1 }
              as: FinanceController
              as_user_id: "u_fin_1"
          assert:
            - "RoyaltyReport.${rpt_q1}.applied_tier_rate_bps == 1200"
            - "RoyaltyReport.${rpt_q1}.royalty_due_cents == 180000"
            - "RoyaltyReport.${rpt_q2}.applied_tier_rate_bps == 1200"
            - "RoyaltyReport.${rpt_q2}.royalty_due_cents == 180000"
            - "true-up response data.included_report_count == 2"
            - "true-up response data.cumulative_net_regular_cents == 3000000"
            - "true-up response data.provisional_total_cents == 360000"
            - "true-up response data.true_up_royalty_cents == 340000"
            - "true-up response data.delta_cents == -20000"
            - "LicenseAgreement.${agr_a}.cumulative_royalty_cents == 360000 (the true-up is a read-only projection and does NOT overwrite the ledger)"
            - "RoyaltyReport.${rpt_q1}.royalty_due_cents and RoyaltyReport.${rpt_q2}.royalty_due_cents are unchanged by the true-up call"

      - name: risk_index_rolling_monitor_vs_strict_assessment
        grounds:
          - calculations.compliance_risk_index
          - entities.Licensee.fields.compliance_risk_index
          - entities.RoyaltyReport.fields.return_count
          - state_machines.RoyaltyReport.FILED_to_RETURNED
          - state_machines.ProductSubmission.SAMPLE_REQUESTED_to_REVISION_REQUESTED
        distinguishing_aspect: |
          Entity domain = Licensee compliance scoring (NOT report rating, NOT the
          guarantee). The two variants differ only in DECAY over the SAME three
          factor rows (REPORT_RETURN weight 6 counted return_count == 2 times,
          dated 2026Q1 with ELAPSED_QUARTERS(2026Q1, 2026Q3) == 2; SAMPLE_FAIL
          weight 8 dated 2026Q3, elapsed 0): ROLLING_MONITOR halves per elapsed
          quarter and yields index 11 / band CLEAR, while STRICT_ASSESSMENT holds
          decay at 1.0 and yields index 20 / band WATCH. Only ROLLING_MONITOR is
          ever persisted, so Licensee.compliance_risk_index must read 11.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z (the mandatory default), so QUARTER_OF(clock) == 2026Q3"
            - "licensee LIC_B ACTIVE; agreement AGR_B ACTIVE on category JERSEY, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31"
            - "one AUTHORIZED DEPARTMENT authorization for LIC_B covering 2026-01-01..2028-12-31"
            - "a single 2026Q1 report is FILED, RETURNED, re-FILED and RETURNED again so return_count == 2 (both return rows are dated at period_quarter 2026Q1)"
            - "one submission with sample_required true reaches SAMPLE_REQUESTED and receives verdict FAIL, so its SampleReview.occurrence_quarter == 2026Q3"
            - "no audit engagement and no enforcement action exist for LIC_B, so exactly three factor rows are in the 8-quarter window"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/mark-rights"
              payload: { mark_code: "LEAGUE_SHIELD", owner_type: "LEAGUE", usage_class: "PRIMARY", royalty_share_bps: 0 }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { mark_league: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Harbor Knit Co", contact_email: "ops@harborknit.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_b: $.data.id }
            - call: "POST /licensing/licensees/${lic_b}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_b}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_b: $.data.id }
            - call: "POST /licensing/agreements/${agr_b}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_b}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_b}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_b}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_b}"
              as: LeagueLicensingManager
              captures: { lic_b_v: $.data.version }
            - call: "POST /licensing/licensees/${lic_b}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: true, expected_licensee_version: "${lic_b_v}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_b: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_b}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_b}"
              as: Licensee
              as_user_id: "${lic_b}"
              captures: { agr_b_v: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_b}", period_quarter: "2026Q1", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_b}", gross_sales_cents: 1500000, units: 3000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_b_v}" }
              as: Licensee
              as_user_id: "${lic_b}"
              captures: { rpt_b: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_b}/file"
              as: Licensee
              as_user_id: "${lic_b}"
            - call: "POST /licensing/royalty-reports/${rpt_b}/review-decisions"
              payload: { decision: "RETURN", reason: "Channel mix reconciliation missing" }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/royalty-reports/${rpt_b}/file"
              as: Licensee
              as_user_id: "${lic_b}"
            - call: "POST /licensing/royalty-reports/${rpt_b}/review-decisions"
              payload: { decision: "RETURN", reason: "Deduction schedule still unsupported" }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_b}/product-submissions"
              payload: { sku_class: "JERSEY", product_name: "Replica Home Jersey", mark_ids: ["${mark_league}"], retail_price_cents: 12999, sample_required: true }
              as: Licensee
              as_user_id: "${lic_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /licensing/product-submissions/${sub_b}/submit"
              as: Licensee
              as_user_id: "${lic_b}"
            - call: "POST /licensing/product-submissions/${sub_b}/review-decisions"
              payload: { decision: "BEGIN_REVIEW" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-submissions/${sub_b}/review-decisions"
              payload: { decision: "REQUEST_SAMPLE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-submissions/${sub_b}/sample-reviews"
              payload: { verdict: "FAIL", defect_codes: ["COLOR_OUT_OF_TOLERANCE"] }
              as: MarkComplianceOfficer
              as_user_id: "u_mco_1"
          trigger:
            - call: "GET /licensing/licensees/${lic_b}/risk-index?variant=ROLLING_MONITOR&as_of_quarter=2026Q3"
              as: MarkComplianceOfficer
            - call: "GET /licensing/licensees/${lic_b}/risk-index?variant=STRICT_ASSESSMENT&as_of_quarter=2026Q3"
              as: MarkComplianceOfficer
          assert:
            - "RoyaltyReport.${rpt_b}.return_count == 2 and status == RETURNED"
            - "SampleReview for ${sub_b} has occurrence_quarter == 2026Q3 and verdict == FAIL"
            - "ROLLING_MONITOR response data.index == 11"
            - "ROLLING_MONITOR response data.raw_weighted_total_milli == 11000"
            - "ROLLING_MONITOR response data.posture_band == CLEAR"
            - "ROLLING_MONITOR response data.factor_count == 3"
            - "STRICT_ASSESSMENT response data.index == 20"
            - "STRICT_ASSESSMENT response data.raw_weighted_total_milli == 20000"
            - "STRICT_ASSESSMENT response data.posture_band == WATCH"
            - "STRICT_ASSESSMENT response data.factor_count == 3"
            - "Licensee.${lic_b}.compliance_risk_index == 11 (only ROLLING_MONITOR is ever stored)"

      - name: mg_shortfall_interim_pro_rata_vs_final_at_expiry
        grounds:
          - calculations.mg_shortfall_assessment
          - entities.LicenseAgreement.fields.mg_accrued_shortfall_cents
          - entities.LicenseAgreement.fields.mg_final_shortfall_cents
          - state_machines.LicenseAgreement.contract_status.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Entity domain = LicenseAgreement minimum guarantee (neither report rating
          nor licensee scoring). The two variants differ in DENOMINATOR:
          INTERIM_PRO_RATA compares earned royalty 360000 against
          round_half_up(4000000 * 3 / 8) == 1500000 and writes 1140000, while
          FINAL_AT_EXPIRY compares the same 360000 against the FULL 4000000 and
          writes 3640000 — a strictly larger shortfall from identical data.
        test_recipe:
          setup:
            - "identical fixture to royalty_provisional_quarterly_vs_final_annual_true_up: LIC_A / AGR_A with two ACCEPTED 1500000-gross reports (2026Q1, 2026Q2) so cumulative_royalty_cents == 360000"
            - "AGR_A term 2026-01-01..2027-12-31 -> total_quarters == 8; clock at 2026-08-01 -> as_of_quarter 2026Q3 -> elapsed_quarters == 3"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Northstar Apparel", contact_email: "ops@northstar.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_a: $.data.id }
            - call: "POST /licensing/licensees/${lic_a}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_a}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 4000000, required_advance_cents: 1000000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_a: $.data.id }
            - call: "POST /licensing/agreements/${agr_a}/advance-payments"
              payload: { amount_cents: 1000000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_a}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_a}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_a}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_a}"
              as: LeagueLicensingManager
              captures: { lic_a_v: $.data.version }
            - call: "POST /licensing/licensees/${lic_a}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: true, expected_licensee_version: "${lic_a_v}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_a: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_a}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_a}"
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { agr_a_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_a}", period_quarter: "2026Q1", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_a}", gross_sales_cents: 1500000, units: 3000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_a_v1}" }
              as: Licensee
              as_user_id: "${lic_a}"
              captures: { rpt_q1: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_q1}/file"
              as: Licensee
