          - endpoints[POST /culinary/spec-change-orders/{spec_change_order_id}/approve]
        distinguishing_aspect: "One derived counter driven up by two creates and back down by two different resolutions — a rejection and an approval — with the value checked after every hop. The two decrements come from endpoints that share nothing else: reject writes only a reason, approve fires the whole four-hop cascade. Submission touches the counter not at all, which is the hop an implementation that increments on every SpecChangeOrder write gets wrong, and the counter must reach exactly 0 rather than drifting to 1 or -1."
