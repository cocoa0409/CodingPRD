  - rule_id: boundary_precision_check
    instances:

      - name: substantiation_exactly_at_anecdotal_min_passes_while_one_cent_below_fails
        grounds:
          - calculations.claim_substantiation_score.constants.ANECDOTAL_MIN
          - validations.priority_31
          - errors.ERR_CLAIM_UNSUBSTANTIATED
          - entities.BattlecardClaim.fields.substantiation_level
          - state_machines.Battlecard.DRAFT_to_LEGAL_REVIEW
        distinguishing_aspect: |
          Metric: substantiation_score against the inclusive ANECDOTAL_MIN boundary of
          0.90, exercised on POST /battlecards/{id}/submit-legal. Card A's single claim
          scores exactly 0.90 (one fresh PRICING_PERCEPTION item with a null rating:
          0.90 * 1.00 * 1.00) and must be ANECDOTAL, so the card reaches LEGAL_REVIEW.
          Card B's claim scores 0.89 (0.40 + 0.49), one cent below, and must be
          UNSUBSTANTIATED, so submit-legal is rejected. A `>` instead of `>=`
          comparison flips card A; a rounding slip of 0.01 flips card B.
        test_recipe:
          setup:
            - "Program ACTIVE; competitor Northwind PRIMARY; ENTERPRISE LOST deal drawn into the SEALED frame; consented ECONOMIC_BUYER contact."
            - "Interview 2026-08-10T14:00Z -> 15:00Z completed with four responses recorded on 2026-08-10 (all fresh at the 2026-08-10T15:30Z evaluation clock): EVALUATION_CRITERIA rated 1, COMPETITOR_POSITIONING rated 3, PRICING_PERCEPTION with NO rating, and PRODUCT_GAP with NO rating."
            - "Battlecard A (version v1) carries one FEATURE claim citing only the PRICING_PERCEPTION response -> item round_half_up(0.90 * 1.00 * 1.00, 2) = 0.90."
            - "Battlecard B (version v2) carries one FEATURE claim citing the PRODUCT_GAP response (0.40) and the EVALUATION_CRITERIA response (round_half_up(0.70 * 0.70, 2) = 0.49) -> 0.89."
