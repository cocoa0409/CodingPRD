scenario: "758. Graffiti & Nuisance-Abatement Program: report intake (311) & geolocation, severity/priority & private-vs-public, crew dispatch & removal log, property-owner notice & consent/cost-recovery, before/after photo, repeat-hotspot analytics, paint/material inventory, reporting"
domain_name: graffiti-abatement
api_prefix: "/abatement"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (Report -> Site, WorkOrder -> Report/Crew,
  # CostRecovery -> Site/WorkOrder, Notice -> Site/CostRecovery). No deep URL nesting
  # except append-only children (Photo, RemovalLog, MaterialReservation) under WorkOrder.

  state_machine_shape: branching
  # Report carries a revision cycle (IN_PROGRESS -> TRIAGED); WorkOrder forks at
  # IN_PROGRESS into {COMPLETED, RECALLED} with divergent side-effect sets; Notice
  # forks SENT -> {CONSENTED, DISPUTED, EXPIRED, WITHDRAWN}.

  relationship_patterns:
    - one_to_many        # Site has many Reports; WorkOrder has many MaterialReservations/Photos
    - cross_aggregate    # CostRecovery references both Site and WorkOrder; Notice references Site and CostRecovery

  role_model: peer_roles
  # IntakeClerk owns intake/triage; AbatementCoordinator owns dispatch/notice/recovery;
  # CrewLead (entity_backed) owns field execution of its own crew; InventoryManager owns
  # materials; PropertyOwnerUser (entity_backed) responds to notices; ProgramAdmin overrides.

  consistency_model: immediate
  # Every cascade (WorkOrder completion -> Report -> CostRecovery -> Site ledger) is applied
  # atomically inside the triggering request; derived fields are reconciled on write.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the property owner.
      - name: mailing_address
        type: string
        source: input
        description: Mailing address used for physical notices.
      - name: contact_email
        type: string
        source: input
        description: Contact email for electronic notices.

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: address
        type: string
        source: input
        description: Street address of the abatement site.
      - name: latitude
        type: number
        source: input
        description: Geolocation latitude of the site centroid.
      - name: longitude
        type: number
        source: input
        description: Geolocation longitude of the site centroid.
      - name: ownership_type
        type: enum
        source: input
        description: PUBLIC (city-owned) or PRIVATE (owner-billable).
        constraints: "one of {PUBLIC, PRIVATE}"
      - name: property_owner_id
        type: string
        source: input
        description: "FK -> PropertyOwner.id; nullable; REQUIRED when ownership_type == PRIVATE, MUST be null/absent when PUBLIC."
        default: null
      - name: status
        type: enum
        source: computed
        description: Repeat-hotspot posture recomputed from report_count_90d on every report create and on every report status change.
        default: NORMAL
        constraints: "one of {NORMAL, MONITORED, HOTSPOT}"
      - name: report_count_90d
        type: integer
        source: computed
        description: Count of Reports for this site whose created_at is within [clock_now - 90 days, clock_now].
        default: 0
      - name: open_report_count
        type: integer
        source: computed
        description: Count of Reports for this site whose status NOT IN {REMEDIATED, CLOSED}.
        default: 0
      - name: hotspot_severity_index_rolling
        type: integer
        source: computed
        description: Rolling variant of hotspot_severity_index — sum of SEVERITY_WEIGHT over ALL reports in the 90-day window regardless of status.
        default: 0
      - name: hotspot_severity_index_confirmed
        type: integer
        source: computed
        description: Confirmed variant of hotspot_severity_index — sum of SEVERITY_WEIGHT over only REMEDIATED reports in the 90-day window.
        default: 0
      - name: outstanding_recovery_cents
        type: integer
        source: computed
        description: Sum of CostRecovery.recoverable_cents for this site whose status IN {ASSESSED, DISPUTED, LIEN_PENDING}.
        default: 0
      - name: lien_count
        type: integer
        source: computed
        description: Number of CostRecovery rows for this site that have reached LIEN_PENDING.
        default: 0
      - name: active_notice_id
        type: string
        source: system
        description: System-maintained pointer to the current SENT Notice.id for this site; null when none; overwritten (and prior notice WITHDRAWN) on each new notice issuance.
        default: null

  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this graffiti/nuisance report is filed against."
      - name: reported_via
        type: enum
        source: input
        description: Intake channel of the 311 report.
        constraints: "one of {PHONE_311, WEB, MOBILE_APP}"
      - name: reporter_contact
        type: string
        source: input
        description: Optional call-back contact of the reporter.
        default: null
      - name: surface_type
        type: enum
        source: input
        description: Surface the graffiti is on; drives visibility weighting in priority scoring.
        constraints: "one of {WALL, FENCE, SIGN, SIDEWALK, VEHICLE}"
      - name: severity
        type: enum
        source: input
        description: Reporter/clerk-assessed severity; drives base weight in priority scoring and hotspot index.
        constraints: "one of {LOW, MEDIUM, HIGH, SEVERE}"
      - name: is_offensive
        type: boolean
        source: input
        description: Whether the content is offensive/hateful; adds a priority bonus and requires an offensive-certified crew to abate.
        default: false
      - name: description
        type: string
        source: input
        description: Free-text description of the reported nuisance.
      - name: latitude
        type: number
        source: input
        description: Geolocation latitude of the specific incident.
        default: null
      - name: longitude
        type: number
        source: input
        description: Geolocation longitude of the specific incident.
        default: null
      - name: priority_score
        type: number
        source: computed
        description: Combinatorial priority score; null until triage; computed by the priority_score calculation reading the site's posture at triage time.
        default: null
      - name: status
        type: enum
        source: system
        description: Report lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, TRIAGED, DISPATCHED, IN_PROGRESS, REMEDIATED, CLOSED}"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Crew display name.
      - name: crew_type
        type: enum
        source: input
        description: Whether the crew is city staff or a contractor.
        constraints: "one of {CITY, CONTRACTOR}"
      - name: is_offensive_certified
        type: boolean
        source: input
        description: Whether the crew is certified to abate offensive/hateful content.
        default: false
      - name: status
        type: enum
        source: system
        description: AVAILABLE (not mid-job) or DISPATCHED (currently executing an IN_PROGRESS work order).
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DISPATCHED}"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; the report being abated."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the crew dispatched to abate."
      - name: scheduled_start
        type: datetime
        source: input
        description: Scheduled start of the abatement window (ISO 8601 UTC).
      - name: scheduled_end
        type: datetime
        source: input
        description: Scheduled end of the abatement window (ISO 8601 UTC); MUST be strictly after scheduled_start.
      - name: method
        type: enum
        source: input
        description: Removal method.
        constraints: "one of {PAINT_OVER, PRESSURE_WASH, CHEMICAL}"
      - name: estimated_labor_hours
        type: number
        source: input
        description: Estimated crew labor hours; drives the provisional cost variant.
      - name: actual_labor_hours
        type: number
        source: system
        description: Actual labor hours supplied at completion; drives the final cost variant; null until COMPLETED.
        default: null
      - name: status
        type: enum
        source: system
        description: Work order lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, RECALLED}"

  - name: MaterialReservation
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this reservation supplies."
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; the material reserved."
      - name: quantity_reserved
        type: number
        source: system
        description: Quantity moved from Material.quantity_available to Material.quantity_reserved at dispatch.
      - name: quantity_consumed
        type: number
        source: system
        description: Quantity actually consumed at completion (defaults to quantity_reserved); null until CONSUMED.
        default: null
      - name: status
        type: enum
        source: system
        description: RESERVED at dispatch; CONSUMED at completion; RELEASED at cancel/recall.
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"

  - name: Photo
    parent: WorkOrder
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this photo documents."
      - name: phase
        type: enum
        source: input
        description: BEFORE (required before start) or AFTER (required before completion).
        constraints: "one of {BEFORE, AFTER}"
      - name: url
        type: string
        source: input
        description: Storage URL of the uploaded photo.
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the photo was recorded.

  - name: RemovalLog
    parent: WorkOrder
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this append-only log entry belongs to."
      - name: action
        type: enum
        source: system
        description: Event that produced this log entry.
        constraints: "one of {STARTED, COMPLETED, RECALLED}"
      - name: note
        type: string
        source: system
        description: Optional note carried from the triggering transition.
        default: null
      - name: logged_by
        type: string
        source: system
        description: X-User-ID of the actor whose transition produced this log entry.

  - name: Material
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Material name (e.g., "Gray Masonry Paint").
      - name: category
        type: enum
        source: input
        description: Material category.
        constraints: "one of {PAINT, SOLVENT, ABRASIVE}"
      - name: color
        type: string
        source: input
        description: Optional color label.
        default: null
      - name: unit
        type: enum
        source: input
        description: Unit of measure.
        constraints: "one of {LITERS, GALLONS}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Cost per unit in whole cents; used in material line-item costing.
      - name: quantity_available
        type: number
        source: input
        description: Quantity free to reserve; decremented on reservation, restored on release. Provided at creation, system-maintained thereafter.
      - name: quantity_reserved
        type: number
        source: system
        description: Quantity currently reserved to work orders; the conserved invariant quantity_available + quantity_reserved is unchanged by any reserve/release pair.
        default: 0
      - name: reorder_threshold
        type: number
        source: input
        description: Threshold at/under which status becomes LOW.
        default: 0
      - name: status
        type: enum
        source: computed
        description: "DEPLETED when quantity_available <= 0; else LOW when quantity_available <= reorder_threshold; else AVAILABLE."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, LOW, DEPLETED}"

  - name: CostRecovery
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose ownership determines recoverability."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order whose costs this recovery bills."
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: Provisional total from the abatement_cost calculation using estimated_labor_hours and reserved material quantities; set at dispatch.
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: Final total from the abatement_cost calculation using actual_labor_hours and consumed material quantities; null until ASSESSED.
        default: null
      - name: labor_cost_cents
        type: integer
        source: computed
        description: Rounded labor line of the currently-effective variant.
        default: 0
      - name: material_cost_cents
        type: integer
        source: computed
        description: Sum of per-reservation rounded material lines of the currently-effective variant.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Rounded admin fee (ADMIN_FEE_PCT of the rounded labor+material subtotal) of the currently-effective variant.
        default: 0
      - name: recoverable_cents
        type: integer
        source: computed
        description: Amount billable to the owner — equals the effective total when site.ownership_type == PRIVATE, else 0 for PUBLIC sites.
        default: 0
      - name: status
        type: enum
        source: system
        description: Cost-recovery lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, ASSESSED, DISPUTED, WAIVED, LIEN_PENDING, PAID, VOID}"

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site (and, via it, the property owner) served the notice."
      - name: cost_recovery_id
        type: string
        source: input
        description: "FK -> CostRecovery.id; the recovery this notice concerns; REQUIRED for notice_type == COST_RECOVERY_NOTICE, else null."
        default: null
      - name: notice_type
        type: enum
        source: input
        description: Type of notice served.
        constraints: "one of {ABATEMENT_NOTICE, COST_RECOVERY_NOTICE}"
      - name: cure_days
        type: integer
        source: input
        description: Number of days the owner has to respond before the notice may be expired.
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant at issuance.
      - name: cure_deadline
        type: datetime
        source: system
        description: sent_at + cure_days days; the notice may not be expired before this instant.
      - name: response_at
        type: datetime
        source: system
        description: Logical-clock instant of the owner's consent/dispute; null until responded.
        default: null
      - name: status
        type: enum
        source: system
        description: Notice lifecycle state.
        default: SENT
        constraints: "one of {SENT, CONSENTED, DISPUTED, EXPIRED, WITHDRAWN}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Report
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /abatement/reports/{id}/triage"
        actor: IntakeClerk
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "Compute priority_score via the priority_score calculation, reading site.status as of the current clock."
          - "Set report.priority_score."
        note: "site.status must already reflect this report because report create recomputes site posture before triage runs."
      - from: TRIAGED
        to: DISPATCHED
        trigger: "POST /abatement/work-orders (dispatch this report)"
        actor: AbatementCoordinator
        preconditions:
          - "report.status == TRIAGED"
          - "crew.status == AVAILABLE (cross-entity: WorkOrder depends on Crew)"
        side_effects:
          - "Create WorkOrder in SCHEDULED."
          - "Create one MaterialReservation per material_lines entry (RESERVED); debit Material.quantity_available, credit Material.quantity_reserved for each."
          - "Create CostRecovery in PENDING with estimated_cost_cents/recoverable_cents from the provisional variant."
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /abatement/work-orders/{id}/start"
        actor: CrewLead
        preconditions:
          - "report.status == DISPATCHED"
          - "a BEFORE Photo exists for the work order"
        side_effects:
          - "WorkOrder SCHEDULED -> IN_PROGRESS."
          - "Crew AVAILABLE -> DISPATCHED."
          - "Append RemovalLog(action=STARTED)."
      - from: IN_PROGRESS
        to: REMEDIATED
        trigger: "POST /abatement/work-orders/{id}/complete"
        actor: CrewLead
        preconditions:
          - "report.status == IN_PROGRESS"
          - "an AFTER Photo exists for the work order"
        side_effects:
          - "WorkOrder IN_PROGRESS -> COMPLETED; set actual_labor_hours."
          - "For each RESERVED reservation: set quantity_consumed = quantity_reserved, status CONSUMED, credit back Material.quantity_reserved (material leaves inventory)."
          - "Crew DISPATCHED -> AVAILABLE."
          - "CostRecovery PENDING -> ASSESSED (final variant) — see cascade rule_id abatement_completion_cascade."
          - "Recompute site.hotspot_severity_index_confirmed and site.open_report_count."
          - "Append RemovalLog(action=COMPLETED)."
      - from: IN_PROGRESS
        to: TRIAGED
        trigger: "POST /abatement/work-orders/{id}/recall"
        actor: AbatementCoordinator
        preconditions:
          - "report.status == IN_PROGRESS"
        side_effects:
          - "WorkOrder IN_PROGRESS -> RECALLED (revision cycle; report returns to TRIAGED for re-dispatch)."
          - "Release every RESERVED reservation: credit Material.quantity_available, debit Material.quantity_reserved, reservation -> RELEASED."
          - "Crew DISPATCHED -> AVAILABLE."
          - "CostRecovery PENDING -> VOID."
          - "Append RemovalLog(action=RECALLED)."
        note: "Non-linear cycle A->...->A: TRIAGED -> DISPATCHED -> IN_PROGRESS -> TRIAGED."
      - from: DISPATCHED
        to: TRIAGED
        trigger: "POST /abatement/work-orders/{id}/cancel"
        actor: AbatementCoordinator
        preconditions:
          - "report.status == DISPATCHED"
        side_effects:
          - "WorkOrder SCHEDULED -> CANCELLED."
          - "Release every RESERVED reservation: credit Material.quantity_available, debit Material.quantity_reserved, reservation -> RELEASED."
          - "CostRecovery PENDING -> VOID."
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /abatement/cost-recoveries/{id}/pay OR /waive (recovery resolved) OR site is PUBLIC"
        actor: system
        preconditions:
          - "report.status == REMEDIATED"
          - "the report's CostRecovery has reached a terminal recovery state {PAID, WAIVED} OR site.ownership_type == PUBLIC"
        side_effects:
          - "Report REMEDIATED -> CLOSED."

  - entity: WorkOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, RECALLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /abatement/work-orders/{id}/start"
        actor: CrewLead
        preconditions:
          - "work_order.status == SCHEDULED"
          - "acting CrewLead owns the crew (work_order.crew_id == X-User-ID)"
          - "a BEFORE Photo exists for the work order"
        side_effects:
          - "Report DISPATCHED -> IN_PROGRESS; Crew AVAILABLE -> DISPATCHED; append RemovalLog(STARTED)."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /abatement/work-orders/{id}/complete"
        actor: CrewLead
        preconditions:
          - "work_order.status == IN_PROGRESS"
          - "acting CrewLead owns the crew"
          - "an AFTER Photo exists for the work order"
        side_effects:
          - "Set actual_labor_hours; consume reservations; Crew -> AVAILABLE; Report -> REMEDIATED; CostRecovery -> ASSESSED; recompute site confirmed index."
        note: "Branch arm 1 of the IN_PROGRESS fork — remediation path with cost assessment."
      - from: IN_PROGRESS
        to: RECALLED
        trigger: "POST /abatement/work-orders/{id}/recall"
        actor: AbatementCoordinator
        preconditions:
          - "work_order.status == IN_PROGRESS"
        side_effects:
          - "Release reservations; Crew -> AVAILABLE; Report -> TRIAGED; CostRecovery -> VOID; append RemovalLog(RECALLED)."
        note: "Branch arm 2 of the IN_PROGRESS fork — abort path that reverts and voids; divergent side-effect set from COMPLETED."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /abatement/work-orders/{id}/cancel"
        actor: AbatementCoordinator
        preconditions:
          - "work_order.status == SCHEDULED"
        side_effects:
          - "Release reservations; Report -> TRIAGED; CostRecovery -> VOID."

  - entity: Crew
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DISPATCHED
        trigger: "POST /abatement/work-orders/{id}/start (system)"
        actor: system
        preconditions:
          - "crew.status == AVAILABLE"
        side_effects:
          - "Crew reserved to the started work order."
      - from: DISPATCHED
        to: AVAILABLE
        trigger: "POST /abatement/work-orders/{id}/complete OR /recall (system)"
        actor: system
        preconditions:
          - "crew.status == DISPATCHED"
        side_effects:
          - "Crew released back to the AVAILABLE pool."

  - entity: CostRecovery
    initial_state: PENDING
    terminal_states: [WAIVED, PAID, VOID]
    transitions:
      - from: PENDING
        to: ASSESSED
        trigger: "system, on WorkOrder complete (report reaching REMEDIATED)"
        actor: system
        preconditions:
          - "cost_recovery.status == PENDING"
        side_effects:
          - "Compute final_cost_cents and recoverable_cents (final variant)."
          - "Credit site.outstanding_recovery_cents by recoverable_cents."
      - from: PENDING
        to: VOID
        trigger: "system, on WorkOrder cancel or recall"
        actor: system
        preconditions:
          - "cost_recovery.status == PENDING"
        side_effects:
          - "No ledger change (a PENDING recovery was never in outstanding)."
      - from: ASSESSED
        to: PAID
        trigger: "POST /abatement/cost-recoveries/{id}/pay"
        actor: PropertyOwnerUser
        preconditions:
          - "cost_recovery.status == ASSESSED"
          - "acting PropertyOwnerUser owns the site's property_owner (site.property_owner_id == X-User-ID)"
        side_effects:
          - "Debit site.outstanding_recovery_cents by recoverable_cents."
          - "If the linked report is REMEDIATED, cascade Report -> CLOSED."
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /abatement/cost-recoveries/{id}/waive"
        actor: ProgramAdmin
        preconditions:
          - "cost_recovery.status == ASSESSED"
        side_effects:
          - "Debit site.outstanding_recovery_cents by recoverable_cents (conserved-quantity restoration)."
          - "If the linked report is REMEDIATED, cascade Report -> CLOSED."
      - from: ASSESSED
        to: DISPUTED
        trigger: "system, on Notice dispute"
        actor: system
        preconditions:
          - "cost_recovery.status == ASSESSED"
        side_effects:
          - "No ledger change (DISPUTED remains in outstanding)."
      - from: DISPUTED
        to: ASSESSED
        trigger: "system, on Notice consent (dispute resolved)"
        actor: system
        preconditions:
          - "cost_recovery.status == DISPUTED"
        side_effects:
          - "No ledger change (still in outstanding)."
      - from: ASSESSED
        to: LIEN_PENDING
        trigger: "system, on Notice expire"
        actor: system
        preconditions:
          - "cost_recovery.status == ASSESSED"
        side_effects:
          - "No ledger change (LIEN_PENDING remains in outstanding)."
          - "Increment site.lien_count by 1."

  - entity: Notice
    initial_state: SENT
    terminal_states: [CONSENTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SENT
        to: CONSENTED
        trigger: "POST /abatement/notices/{id}/consent"
        actor: PropertyOwnerUser
        preconditions:
          - "notice.status == SENT"
          - "acting PropertyOwnerUser owns the site's property_owner"
        side_effects:
          - "Set response_at; clear site.active_notice_id if it pointed here."
      - from: SENT
        to: DISPUTED
        trigger: "POST /abatement/notices/{id}/dispute"
        actor: PropertyOwnerUser
        preconditions:
          - "notice.status == SENT"
          - "acting PropertyOwnerUser owns the site's property_owner"
        side_effects:
          - "Set response_at."
          - "If notice.cost_recovery_id set and that CostRecovery is ASSESSED, cascade CostRecovery ASSESSED -> DISPUTED."
      - from: DISPUTED
        to: CONSENTED
        trigger: "POST /abatement/notices/{id}/consent"
        actor: PropertyOwnerUser
        preconditions:
          - "notice.status == DISPUTED"
          - "acting PropertyOwnerUser owns the site's property_owner"
        side_effects:
          - "Set response_at; clear site.active_notice_id if it pointed here."
          - "If notice.cost_recovery_id set and that CostRecovery is DISPUTED, cascade CostRecovery DISPUTED -> ASSESSED."
      - from: SENT
        to: EXPIRED
        trigger: "POST /abatement/notices/{id}/expire"
        actor: AbatementCoordinator
        preconditions:
          - "notice.status == SENT"
          - "clock_now >= notice.cure_deadline"
        side_effects:
          - "If notice.cost_recovery_id set and that CostRecovery is ASSESSED, cascade CostRecovery ASSESSED -> LIEN_PENDING (which itself increments site.lien_count)."
          - "Clear site.active_notice_id if it pointed here."
        note: "Depth-2 cascade origin: Notice -> CostRecovery -> Site.lien_count."
      - from: SENT
        to: WITHDRAWN
        trigger: "system, on issuance of a superseding Notice for the same site"
        actor: system
        preconditions:
          - "notice.status == SENT"
        side_effects:
          - "Prior SENT notice withdrawn when a new notice is issued for the site."

  - entity: Site
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: MONITORED
        trigger: "system, on report create when report_count_90d becomes exactly 2"
        actor: system
        preconditions:
          - "report_count_90d == 2 after this report"
        side_effects:
          - "Recompute rolling/confirmed hotspot indices."
      - from: MONITORED
        to: HOTSPOT
        trigger: "system, on report create when report_count_90d reaches >= 3"
        actor: system
        preconditions:
          - "report_count_90d >= 3 after this report"
        side_effects:
          - "Recompute rolling/confirmed hotspot indices."
      - from: HOTSPOT
        to: MONITORED
        trigger: "system, on recompute when report_count_90d drops to exactly 2 (window roll or remediation)"
        actor: system
        preconditions:
          - "report_count_90d == 2"
        side_effects: []
      - from: MONITORED
        to: NORMAL
        trigger: "system, on recompute when report_count_90d drops to <= 1"
        actor: system
        preconditions:
          - "report_count_90d <= 1"
        side_effects: []

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: notice-issue-stale-site
    parent_entity: Site
    write_endpoint: "POST /abatement/sites/{id}/notices"
    occ_field: "expected_site_version"
    description: |
      Issuing a new Notice for a Site whose version has advanced since the client
      last observed it is rejected. Notice issuance legitimately supersedes the prior
      SENT notice (prior -> WITHDRAWN) and mutates the site (active_notice_id, version),
      so a client whose expected_site_version is stale is issuing against a site view
      that a prior issuance has already moved past.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: priority_score
    trigger: "Report SUBMITTED -> TRIAGED (POST /abatement/reports/{id}/triage)"
    algorithm: weighted_scoring
    formula: |
      base        = SEVERITY_BASE[report.severity]
      visibility  = SURFACE_VISIBILITY[report.surface_type]
      offensive   = OFFENSIVE_BONUS if report.is_offensive else 0
      public_adj  = PUBLIC_PRIORITY_ADJ if site.ownership_type == "PUBLIC" else 0
      posture     = HOTSPOT_MULT[site.status]      # read at triage time
      raw         = (base * visibility + offensive + public_adj) * posture
      priority_score = round_half_up(raw, 2)
    input_set: "The single report being triaged plus its site's current ownership_type and status."
    constants:
      SEVERITY_BASE: { LOW: 10, MEDIUM: 25, HIGH: 50, SEVERE: 80 }
      SURFACE_VISIBILITY: { SIGN: 1.5, WALL: 1.2, VEHICLE: 1.1, FENCE: 1.0, SIDEWALK: 0.8 }
      OFFENSIVE_BONUS: 40
      PUBLIC_PRIORITY_ADJ: 5
      HOTSPOT_MULT: { HOTSPOT: 1.5, MONITORED: 1.2, NORMAL: 1.0 }
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: abatement_cost
    trigger: "Provisional at WorkOrder create (dispatch); final at WorkOrder complete (CostRecovery PENDING -> ASSESSED)."
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round each line item to whole cents, THEN sum.
      labor_line    = round_half_up(labor_hours * LABOR_RATE_CENTS_PER_HOUR)   # 1 line
      material_line = sum over reservations r of round_half_up(r.qty * material(r).unit_cost_cents)  # round PER reservation, then sum
      subtotal      = labor_line + material_line
      admin_line    = round_half_up(ADMIN_FEE_PCT * subtotal)                  # admin on the ROUNDED subtotal
      total_cents   = labor_line + material_line + admin_line
      recoverable_cents = total_cents if site.ownership_type == "PRIVATE" else 0
    input_set: "The work order's estimated_labor_hours + RESERVED reservation quantities (provisional); actual_labor_hours + CONSUMED quantities (final)."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 6500
      ADMIN_FEE_PCT: 0.15
    precision: "whole cents, round_half_up; per-line rounding then sum (NOT sum-then-round)"
    variants:
      - name: provisional
        when: "At dispatch — CostRecovery.estimated_cost_cents."
        difference: "labor_hours = work_order.estimated_labor_hours; qty = reservation.quantity_reserved."
      - name: final
        when: "At completion — CostRecovery.final_cost_cents and recoverable_cents."
        difference: "labor_hours = work_order.actual_labor_hours; qty = reservation.quantity_consumed."

  - name: hotspot_severity_index
    trigger: "Recomputed on Report create and on Report status change (writes both variants onto the site)."
    algorithm: aggregation
    formula: |
      window = [clock_now - 90 days, clock_now]
      rolling   = sum of SEVERITY_WEIGHT[r.severity] for r in reports(site) where r.created_at in window            # ALL statuses
      confirmed = sum of SEVERITY_WEIGHT[r.severity] for r in reports(site) where r.created_at in window and r.status == "REMEDIATED"
    input_set: "Reports of the site whose created_at is within the trailing 90-day window; rolling includes every status, confirmed includes only REMEDIATED."
    constants:
      SEVERITY_WEIGHT: { LOW: 1, MEDIUM: 2, HIGH: 4, SEVERE: 8 }
      WINDOW_DAYS: 90
    precision: "integer sum"
    variants:
      - name: rolling
        when: "Live posture — site.hotspot_severity_index_rolling."
        difference: "No status filter; counts every in-window report."
      - name: confirmed
        when: "Effectiveness reporting — site.hotspot_severity_index_confirmed."
        difference: "Status filter r.status == REMEDIATED only."

  - name: outstanding_recovery_total
    trigger: "Recomputed on every CostRecovery status change (ASSESSED add, PAID/WAIVED/VOID subtract)."
    algorithm: aggregation
    formula: |
      outstanding_recovery_cents = sum of cr.recoverable_cents
        for cr in cost_recoveries(site) where cr.status in {ASSESSED, DISPUTED, LIEN_PENDING}
    input_set: "CostRecovery rows of the site whose status is ASSESSED, DISPUTED, or LIEN_PENDING."
    constants: {}
    precision: "whole cents"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted to call this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body has all required fields with valid types/enums (e.g., ownership_type in {PUBLIC,PRIVATE}, scheduled_end > scheduled_start)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every referenced resource in the path and body exists, validated left-to-right (site_id, report_id, crew_id, material_id, work_order_id, cost_recovery_id, notice_id, property_owner_id)."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "For entity_backed roles, X-User-ID matches the owning entity: CrewLead's crew owns the work order; PropertyOwnerUser owns the site's property_owner."
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "work-order start/complete; notice consent/dispute; cost-recovery pay"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (generic invalid-transition guard)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "On dispatch, the chosen crew.status == AVAILABLE (cross-entity: WorkOrder depends on Crew)."
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /abatement/work-orders"

  - priority: 8
    category: state
    check: "On notice issuance for a COST_RECOVERY_NOTICE, the linked CostRecovery.status == ASSESSED (cross-entity: Notice depends on CostRecovery)."
    error_id: ERR_RECOVERY_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /abatement/sites/{id}/notices"

  - priority: 9
    category: state
    check: "On notice expire, clock_now >= notice.cure_deadline."
    error_id: ERR_CURE_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /abatement/notices/{id}/expire"

  - priority: 10
    category: business_safety
    check: "On dispatch of an offensive report (report.is_offensive == true), the crew.is_offensive_certified == true."
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /abatement/work-orders"

  - priority: 11
    category: business_temporal
    check: "The crew has no other non-terminal work order whose [scheduled_start, scheduled_end) half-open interval overlaps the new window."
    error_id: ERR_CREW_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /abatement/work-orders"

  - priority: 12
    category: business_temporal
    check: "For a PRIVATE site, no other non-terminal work order on the same site lies within SITE_BUFFER_HOURS (24h) of the new window (buffered adjacency: new.start < other.end + 24h AND other.start < new.end + 24h)."
    error_id: ERR_SITE_ABATEMENT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /abatement/work-orders"

  - priority: 13
    category: business_constraint
    check: "On start, a BEFORE Photo exists for the work order."
    error_id: ERR_BEFORE_PHOTO_REQUIRED
    http_status: 422
    applies_to: "POST /abatement/work-orders/{id}/start"

  - priority: 14
    category: business_constraint
    check: "On complete, an AFTER Photo exists for the work order."
    error_id: ERR_AFTER_PHOTO_REQUIRED
    http_status: 422
    applies_to: "POST /abatement/work-orders/{id}/complete"

  - priority: 15
    category: business_constraint
    check: "On site create, PRIVATE sites carry a property_owner_id; PUBLIC sites carry none."
    error_id: ERR_PRIVATE_SITE_REQUIRES_OWNER
    http_status: 422
    applies_to: "POST /abatement/sites"

  - priority: 16
    category: business_constraint
    check: "On notice issuance, expected_site_version equals the site's current version (OCC)."
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /abatement/sites/{id}/notices"

  - priority: 17
    category: business_fiscal
    check: "On dispatch, each requested material_lines quantity is <= that Material.quantity_available (checked cumulatively across the request)."
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 409
    applies_to: "POST /abatement/work-orders"

