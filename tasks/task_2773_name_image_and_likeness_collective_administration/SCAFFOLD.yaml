  - { error_id: ERR_TIER_NOT_OPEN,              http_status: 409, message: "The membership tier is not OPEN.", raised_by: "validation priority 13" }
  - { error_id: ERR_COMMITMENT_STATE_INVALID,   http_status: 409, message: "The commitment is not in a state that permits this action.", raised_by: "validation priority 14" }
  - { error_id: ERR_COMMITMENT_NOT_CHARGEABLE,  http_status: 409, message: "A contribution may only be attributed to an ACTIVE or PAST_DUE commitment.", raised_by: "validation priority 14" }
