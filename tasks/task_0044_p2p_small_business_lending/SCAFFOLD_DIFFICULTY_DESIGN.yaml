              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${l_id}", amount_cents: 800000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
            - call: "GET /loans/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v1: $.data.version }
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v1}" }
              as: Investor
              as_user_id: "${invy_id}"
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${l_id}/charge-off"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Loan.${l_id}.committed_cents == 1200000 (unchanged record of funded principal)"
            - "Investor.${invx_id}.committed_capital_cents == 0 (was 800000, decremented by 800000)"
            - "Investor.${invy_id}.committed_capital_cents == 0 (was 400000, decremented by 400000)"
            - "total committed_capital decrement (800000 + 400000) == Loan.${l_id}.committed_cents == 1200000"
