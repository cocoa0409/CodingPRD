            - "Logical clock at 2026-08-01T00:00:00Z."
            - "RELEASED ChainConfiguration CFG-1 on ELECTRIC model FRY-900, ConstructionProgram PRG-1, SiteOrder SITE-1 (committed 2026-09-25, 60 units)."
