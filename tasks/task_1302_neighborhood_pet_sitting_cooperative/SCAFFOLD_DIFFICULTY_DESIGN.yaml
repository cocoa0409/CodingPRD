            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
