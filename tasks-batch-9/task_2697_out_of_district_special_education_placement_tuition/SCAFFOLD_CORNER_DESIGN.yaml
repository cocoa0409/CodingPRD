            - "A follow-up GET /ood-placements/funding-claims?placement_id=${pl_id} returns total_count == 0 - CASCADE-B created nothing either"
            - "A follow-up GET /ood-placements/students/${stu_id} shows high_cost_flag == false and projected_state_recovery_cents == 0"
      - name: state_check_precedes_fiscal_check
        claim_type: Priority conflict
        grounds:
          - "validations[priority=8]"
          - "validations[priority=13]"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        excluded_because:
          difficulty_instance: state_priority_8_beats_fiscal_priority_13_on_double_execute_contract
          rationale: "That §1.8 instance constructs a single request that violates both the priority-8 state rule and the priority-13 fiscal rule - a second execute-contract on an account already drained by the first - and pins ERR_INVALID_STATE_TRANSITION as the answer. A separate corner test would be the same request."
      - name: referential_check_precedes_temporal_check
        claim_type: Priority conflict
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "errors[ERR_ATTENDANCE_PLACEMENT_MISMATCH]"
        excluded_because:
          difficulty_instance: referential_priority_9_beats_temporal_priority_10_on_attendance_create
          rationale: "That §1.8 instance sends one attendance create that simultaneously breaks the priority-9 referential linkage and the priority-10 period shape, and pins the priority-9 error_id. It already carries the both-violations-at-once fixture the priority-conflict row asks for."
      - name: safety_check_precedes_constraint_check
        claim_type: Priority conflict
        grounds:
          - "validations[priority=11]"
          - "validations[priority=12]"
          - "errors[ERR_TRANSITION_SERVICES_INCOMPLETE]"
        excluded_because:
          difficulty_instance: safety_priority_11_beats_constraint_priority_12_on_plan_activation
          rationale: "Plan activation is the one endpoint gated by a safety rule at 11 and a constraint rule at 12 in sequence. That §1.8 instance activates with an empty transition_services array AND an unmet readiness score, pins ERR_TRANSITION_SERVICES_INCOMPLETE, then fixes only the services and shows the readiness error surfaces second."
      - name: adjudication_depends_on_placement_state
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_CONCURRENT_DISTRICT_PLACEMENT]"
          - "state_machines.Placement"
        excluded_because:
          difficulty_instance: reimbursement_adjudication_barred_by_overlapping_active_placement
          rationale: "The concurrent-placement bar is validity keyed on a different entity's state, which is exactly the cross-entity validation row. That §1.8 instance tests both directions: an ACTIVE overlapping placement blocks adjudication, and the same claim adjudicates once that placement is no longer ACTIVE."
      - name: attendance_verification_must_run_before_invoice_verification
        claim_type: Cascading validation
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_ATTENDANCE_NOT_VERIFIED]"
          - "state_machines.TuitionInvoice"
        excluded_because:
          difficulty_instance: invoice_verification_gated_on_attendance_record_verification
          rationale: "Invoice verification cannot be evaluated until the attendance check has resolved, which is the cascading-validation ordering claim. That §1.8 instance drives the attendance record through SUBMITTED, DISPUTED and VERIFIED and shows the invoice verify is refused until the prerequisite check passes."
      - name: individually_valid_transport_requests_exhaust_the_route
        claim_type: Aggregate validation
        grounds:
          - "entities.TransportRoute.fields.seat_capacity"
          - "state_machines.TransportationAssignment[REQUESTED->WAITLISTED]"
        excluded_because:
          difficulty_instance: route_seat_identity_survives_waitlist_promotion_and_double_release
          rationale: "Each transport request is individually valid but collectively they exceed seat_capacity - the aggregate-validation row. That §1.8 instance saturates a capacity-1 route, shows the surplus request WAITLISTS rather than erroring (aggregate exhaustion is deliberately not an error here), and tracks the seat identity through promotion and a double release."

  # ===========================================================================
  # Table 5 (Endpoints) - one claim per endpoint pattern that this scaffold
  # actually declares: standard CRUD update, action endpoints, cross-reference
  # link, computed read and conditional action. No bulk endpoints are declared,
  # so the bulk-action row has no applicable instance.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: placement_decision_patch_revises_a_draft_and_is_rejected_from_team_review
        claim_type: Standard CRUD
        grounds:
          - "endpoints.PATCH_placement_decisions"
          - "state_machines.PlacementDecision"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
          - "validations[priority=8]"
          - "entities.PlacementDecision.fields.revision_round"
        distinguishing_aspect: |
          The only PATCH on a workflow entity in the whole API, and it is state-gated: editable from
          DRAFT and from RETURNED_FOR_REVISION, refused from TEAM_REVIEW and from the terminal APPROVED
          state. Every field is optional, so a one-field PATCH must leave the untouched fields exactly
          as they were while still bumping version - and the two REFUSED PATCHes must not bump it at
          all, which is what makes the version trace (1,2,3,4,4,5,6,7,8,8) the real assertion here. Note
          that PATCH does not validate the LRE documentation; that is submit-time work, so a PATCH may
          legally leave the row in a shape that submit would reject.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000, Harbor Academy APPROVED with a STATE_APPROVED FY2027 schedule."
            - "One Student, and one PlacementDecision AUTHORED BY u-coord-1 sitting in DRAFT at version 1 with recommended_placement_type DAY and three continuum options."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C080", full_name: "Dashiell Rakotomalala", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload: { student_id: "${stu_id}", recommended_placement_type: "DAY", lre_justification: "Two quarters of in-district resource room support produced no measurable progress on the communication goals.", continuum_options_considered: [{ setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "No progress." }, { setting: "RESOURCE_ROOM", rejected_reason: "Insufficient intensity." }, { setting: "SELF_CONTAINED_CLASS", rejected_reason: "No certified program." }] }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "PATCH /ood-placements/placement-decisions/${dec_id}"
              payload: { lre_justification: "A four-week diagnostic placement in the district separate class produced regression on two of three communication goals and three restraint incidents." }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "PATCH /ood-placements/placement-decisions/${dec_id}"
              payload: { recommended_placement_type: "RESIDENTIAL", continuum_options_considered: [{ setting: "SELF_CONTAINED_CLASS", rejected_reason: "No overnight nursing." }, { setting: "OUT_OF_DISTRICT_DAY", rejected_reason: "Regression across non-school hours." }, { setting: "HOME_HOSPITAL", rejected_reason: "No peer access." }] }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "PATCH /ood-placements/placement-decisions/${dec_id}"
              payload: { lre_justification: "Medical and behavioral supports require a 24-hour therapeutic milieu that no day option on the continuum can provide." }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/return-for-revision"
              payload: { reviewer_notes: "Document the residential nursing rationale." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "PATCH /ood-placements/placement-decisions/${dec_id}"
              payload: { lre_justification: "Medical and behavioral supports require a 24-hour therapeutic milieu that no day option on the continuum can provide." }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/approve"
              payload: { reviewer_notes: "Residential placement authorized." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "PATCH /ood-placements/placement-decisions/${dec_id}"
              payload: { recommended_placement_type: "DAY" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "Trigger 1 returns HTTP 200 with the new lre_justification, status still DRAFT, version == 2, and recommended_placement_type still DAY - the omitted fields were not blanked"
            - "Trigger 2 returns HTTP 200 with recommended_placement_type == RESIDENTIAL, three continuum options and version == 3"
            - "Trigger 3 returns status == TEAM_REVIEW, version == 4 and a non-null submitted_at"
            - "Trigger 4 (PATCH from TEAM_REVIEW) returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Trigger 5 returns status == RETURNED_FOR_REVISION, revision_round == 1, reviewed_by_user_id == u-chair-1 and version == 5 - proving trigger 4 did not bump the version from 4"
            - "Trigger 6 (PATCH from RETURNED_FOR_REVISION) returns HTTP 200 with version == 6 and status still RETURNED_FOR_REVISION"
            - "Trigger 7 returns status == TEAM_REVIEW with revision_round still 1 and version == 7"
            - "Trigger 8 returns status == APPROVED, a non-null decided_at and version == 8"
            - "Trigger 9 (PATCH from the terminal APPROVED state) returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "A follow-up GET shows recommended_placement_type == RESIDENTIAL and version == 8 - neither refused PATCH left a trace"
            - "A follow-up GET /ood-placements/students/${stu_id} shows placement_status == DECISION_APPROVED"
      - name: private_school_approval_status_patch_updates_and_bumps_version
        claim_type: Standard CRUD
        grounds:
          - "endpoints.PATCH_private_schools_id_approval_status"
          - "entities.ApprovedPrivateSchool.fields.approval_status"
        distinguishing_aspect: |
          The only PATCH in the scaffold. It must move the school between the three declared
          approval states and bump version on every write - the bump is load-bearing because it
          invalidates any in-flight expected_school_version. A school created without an explicit
          approval_status starts PROVISIONAL, so the walk PROVISIONAL -> APPROVED -> REVOKED
          exercises the whole enum and must leave version at 3.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "One ApprovedPrivateSchool created without approval_status, so it is PROVISIONAL at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
