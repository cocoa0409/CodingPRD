      - name: dim_stability_spec_limit_constant_switches_on_construction_type
        claim_type: constants_applied
        grounds:
          - "calculations.test_spec_limit_and_outcome.constants DIM_STAB_LIMIT_PCT_CLICK / DIM_STAB_LIMIT_PCT_OTHER"
          - "entities.TestResult.fields.spec_limit"
          - "entities.TestResult.fields.outcome"
        distinguishing_aspect: |
          One identical measured_value of 0.2000 PCT graded against two SKUs: the declared
          0.25 constant for a GLUE_DOWN plank makes it a PASS, while the 0.15 constant for
          a CLICK_LOCK_SPC plank makes it a FAIL — 0.2000 is beyond even the derived
          marginal edge 0.1575. The constant, not the reading, decides.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
