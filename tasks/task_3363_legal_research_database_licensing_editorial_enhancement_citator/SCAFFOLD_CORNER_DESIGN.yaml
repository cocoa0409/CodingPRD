            - {call: "GET /legal-research/subscriptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LicensingManager, captures: {err: $.data.error_id}}
          assert:
            - "success response: meta.api_request_id present, response_type == \"object\", data.id == ${acct}"
