            - "${active_after} == 125000000, ${lapsed_after} == 0, fulfilled_pledged_cents == 0, total_pledged_cents == 125000000, collected_to_date_cents == 25000000"
            - "${value_after} == 109560000 exactly — the conservative valuation returns to its pre-lapse value, and sponsor_projected_value_cents returns to 117000000"
