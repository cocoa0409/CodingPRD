              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp1_id: $.data.id }
          trigger:
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "the first create succeeded (Client.version advanced past ${cli_v}); the second create with stale expected_client_version returns ERR_STALE_CLIENT_VERSION (412)"

      - name: client_version_increments_on_patch
        claim_type: optimistic_concurrency
        grounds: [entities.Client.version]
        distinguishing_aspect: "PATCH /clients/{id} increments Client.version by exactly 1 (from 1 to 2)."
        test_recipe:
          setup: ["a fresh INTAKE client (version 1)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id, cli_v: $.data.version }
          trigger:
            - call: "PATCH /clients/${cli_id}"
              payload: { phone: "555-9999", expected_client_version: "${cli_v}" }
              as: IntakeCoordinator
          assert:
            - "response data.version == 2 (incremented by exactly 1)"

      - name: donation_balance_reconciles_across_contributions
        claim_type: derived_field_reconciliation
        grounds: [calculations.donation_balance_reconciliation, entities.Client.donation_balance_cents]
        distinguishing_aspect: "donation_balance_cents equals sum of RECORDED contributions: 5000 + 2500 = 7500, then 2500 after voiding the 5000 one."
        test_recipe:
          setup: ["a client with two RECORDED contributions of 5000 and 2500"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/contributions"
              payload: { amount_cents: 5000, period_month: "2026-03" }
              as: ContributionClerk
              captures: { c1: $.data.id }
            - call: "POST /clients/${cli_id}/contributions"
              payload: { amount_cents: 2500, period_month: "2026-03" }
              as: ContributionClerk
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /contributions/${c1}/void"
              payload: {}
              as: ContributionClerk
          assert:
            - "before void: Client.donation_balance_cents == 7500"
            - "after voiding the 5000 contribution: Client.donation_balance_cents == 2500"

