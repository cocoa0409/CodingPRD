# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0982_backyard_chicken_coop_service
# 9 rules x 2 instances = 18 instances. Every setup_api_calls/trigger chain
# drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: visit_provisional_vs_final_price_divergence
        grounds:
          - calculations.visit_provisional_price
          - calculations.visit_final_price
          - entities.ServiceVisit.fields.provisional_price_cents
          - entities.ServiceVisit.fields.final_price_cents
        distinguishing_aspect: |
          Dual-variant pricing on the ServiceVisit domain: identical scheduled
          inputs yield provisional 26500 (declared capacity tier 1500) but final
          28250 (observed flock tier 3250) because visit_final_price re-tiers on
          observed_flock_size while visit_provisional_price uses coop_capacity_hens.
        test_recipe:
          setup:
            - "URBAN household (zone multiplier 1.0); PLANNED coop with coop_capacity_hens=8 (tier 1500)"
            - "SETUP_INSTALL visit scheduled 2026-06-10T09:00:00Z-2026-06-10T11:00:00Z, assigned to tech-1, ON_SITE"
            - "No seasonal window covers URBAN in June; logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Prov", email: "hprov@x.com", address: "1 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "north", coop_capacity_hens: 8 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id, prov_price: $.data.provisional_price_cents }
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${visit_id}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits/${visit_id}/complete"
              payload: { observed_flock_size: 21, actual_duration_minutes: 180, findings_severity: "NONE" }
              as: ServiceTech
              as_user_id: "tech-1"
              captures: { fin_price: $.data.final_price_cents }
          assert:
            - "ServiceVisit.${visit_id}.provisional_price_cents == 26500 (25000*1.0*1.0 + 1500)"
            - "ServiceVisit.${visit_id}.final_price_cents == 28250 (25000*1.0*1.0 + 3250 + 0 overtime; observed flock 21 -> tier 3000+250)"
            - "final_price_cents != provisional_price_cents (28250 != 26500)"
            - "CoopSite.${coop_id}.status == INSTALLED (completion side effect)"

      - name: sitting_quote_vs_settlement_divergence
        grounds:
          - calculations.sitting_quote_price
          - calculations.sitting_final_settlement
          - entities.SittingEngagement.fields.quoted_price_cents
          - entities.SittingEngagement.fields.final_price_cents
        distinguishing_aspect: |
          Dual-variant pricing on the SittingEngagement domain (different entity
          from the visit variant): the forward-looking quote prices all nights
          (4500 with 10% plan discount), while the chronological settlement
          replays stop outcomes and the single SKIPPED stop contributes 0, so
          final_price_cents == 0 for the same engagement.
        test_recipe:
          setup:
            - "URBAN household with INSTALLED, grade-B coop"
            - "Plan with sitting_discount_pct=0.10; subscription ACTIVE (period 2026-06-01)"
            - "PUBLISHED URBAN route on 2026-07-10 (technician tech-9, max_stops 4)"
            - "Engagement 2026-07-10 -> 2026-07-11 (1 night), daily_window_start 08:00, QUOTED then CONFIRMED (1 stop created)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Sit", email: "hsit@x.com", address: "2 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "south", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_install: $.data.id }
            - call: "POST /coopcare/service-visits/${v_install}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_install}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_install}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "PREDATOR_PROOFING", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_proof: $.data.id }
            - call: "POST /coopcare/service-visits/${v_proof}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_proof}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_proof}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 90 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "SITPLAN", monthly_fee_cents: 2900, included_cleanings_per_period: 0, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-06-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-07-10T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /coopcare/sitting-routes/${route_id}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-11T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/quote"
              as: Dispatcher
              captures: { quoted: $.data.quoted_price_cents }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "GET /coopcare/route-stops"
              payload: { engagement_id: "${eng_id}" }
              as: Dispatcher
              captures: { stop_id: "$.data[0].id" }
            - call: "POST /coopcare/route-stops/${stop_id}/skip"
              payload: { reason: "gate locked" }
              as: ServiceTech
              as_user_id: "tech-9"
          trigger:
            - call: "POST /coopcare/sitting-engagements/${eng_id}/settle"
              as: BillingAdmin
              captures: { settled: $.data.final_price_cents }
          assert:
            - "SittingEngagement.${eng_id}.quoted_price_cents == 4500 (round_half_up(1 * 5000 * 1.0 * 0.90))"
            - "SittingEngagement.${eng_id}.final_price_cents == 0 (sole stop SKIPPED contributes 0)"
            - "final_price_cents != quoted_price_cents (0 != 4500)"
            - "SittingEngagement.${eng_id}.status == COMPLETED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) tiered vs (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: visit_price_tiered_multi_input
        grounds:
          - calculations.visit_provisional_price
          - calculations.seasonal_surcharge_lookup
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered flock fee
          (capacity 25 -> 3000+250*5), zone multiplier (RURAL 1.30), and a
          conditional seasonal-surcharge branch (wrap window 11-15->02-15 covers
          2026-12-20) compose into round_half_up(8000*1.30*1.25)+4250 = 17250.
        test_recipe:
          setup:
            - "RURAL seasonal window WINTER_PEAK 11-15 -> 02-15 (wraps year boundary), visit_surcharge_pct 0.25"
            - "RURAL household; coop capacity 25 hens, INSTALLED via prior SETUP_INSTALL visit"
            - "Logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /coopcare/seasonal-windows"
              payload: { window_code: "WINTER_PEAK", zone_code: "RURAL", start_md: "11-15", end_md: "02-15", visit_surcharge_pct: 0.25, sitting_surcharge_pct: 0.20 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H Rural", email: "hrural@x.com", address: "9 Range Rd", zone_code: "RURAL" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "big", coop_capacity_hens: 25 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_install: $.data.id }
            - call: "POST /coopcare/service-visits/${v_install}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_install}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_install}/complete"
              payload: { observed_flock_size: 25, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-12-20T09:00:00Z", scheduled_end: "2026-12-20T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id, prov_price: $.data.provisional_price_cents }
          assert:
            - "ServiceVisit.${visit_id}.provisional_price_cents == 17250 (base round_half_up(8000*1.30*1.25)=13000, flock tier 3000+250*5=4250)"
            - "ServiceVisit.${visit_id}.coverage == BILLABLE (no subscription)"
            - "ServiceVisit.${visit_id}.status == REQUESTED"

      - name: invoice_rounding_order_pinned
        grounds:
          - calculations.supply_order_totals
          - calculations.invoice_total_composition
          - calculations.invoice_sweep
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the order discount rounds
          once on the subtotal (999*0.10 -> 100, NOT per-line 33*3=99), then the
          invoice rounds tax once on the summed subtotal (3799*0.0825 -> 313);
          a sum-then-round vs per-line-then-sum confusion flips both literals.
        test_recipe:
          setup:
            - "Plan with supply_discount_pct=0.10, monthly_fee_cents=2900; subscription period starting 2026-05-01"
            - "Product FEED-A at 333 cents; order with 3 lines x quantity 1; order PLACED at default clock 2026-05-01"
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "SUPPLY10", monthly_fee_cents: 2900, included_cleanings_per_period: 0, included_health_checks_per_period: 0, supply_discount_pct: 0.10, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H Round", email: "hround@x.com", address: "3 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /coopcare/products"
              payload: { sku: "FEED-A", name: "Layer Feed", category: "FEED", unit_price_cents: 333 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coopcare/supply-orders"
              payload: { household_id: "${hh_id}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { order_id: $.data.id }
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/place"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { ord_total: $.data.total_cents, ord_disc: $.data.discount_cents }
          trigger:
            - call: "POST /coopcare/invoices"
              payload: { household_id: "${hh_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_id: $.data.id, inv_sub: $.data.subtotal_cents, inv_tax: $.data.tax_cents, inv_total: $.data.total_cents }
          assert:
            - "SupplyOrder.${order_id}.discount_cents == 100 (round_half_up(999*0.10); per-line rounding would yield 99)"
            - "SupplyOrder.${order_id}.total_cents == 899"
            - "Invoice.${inv_id}.subtotal_cents == 3799 (ORDER 899 + SUBSCRIPTION_FEE 2900)"
            - "Invoice.${inv_id}.tax_cents == 313 (round_half_up(3799*0.0825))"
            - "Invoice.${inv_id}.total_cents == 4112"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cycles on different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_reschedule_cycle
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_RESCHEDULE_REQUESTED
          - state_machines.ServiceVisit.RESCHEDULE_REQUESTED_to_SCHEDULED
          - errors[ERR_RESCHEDULE_LIMIT_REACHED]
        distinguishing_aspect: |
          Cyclic machine on ServiceVisit: SCHEDULED -> RESCHEDULE_REQUESTED ->
          SCHEDULED loops exactly twice (reschedule_count 0->1->2); the third
          request-reschedule is rejected ERR_RESCHEDULE_LIMIT_REACHED, proving
          the loop has a counter-based termination condition.
        test_recipe:
          setup:
            - "URBAN household; PLANNED coop; SETUP_INSTALL visit scheduled 2026-06-10T09:00:00Z-11:00:00Z, assigned to tech-1 (SCHEDULED)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Cyc", email: "hcyc@x.com", address: "4 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "east", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
          trigger:
            - call: "POST /coopcare/service-visits/${visit_id}/request-reschedule"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1", scheduled_start: "2026-06-11T09:00:00Z", scheduled_end: "2026-06-11T11:00:00Z" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${visit_id}/request-reschedule"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1", scheduled_start: "2026-06-12T09:00:00Z", scheduled_end: "2026-06-12T11:00:00Z" }
              as: Dispatcher
              captures: { visit_after: $.data.status, rc: $.data.reschedule_count }
            - call: "POST /coopcare/service-visits/${visit_id}/request-reschedule"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ServiceVisit.${visit_id}.status == SCHEDULED after the second re-assign (cycle traversed twice)"
            - "ServiceVisit.${visit_id}.reschedule_count == 2"
            - "third request-reschedule rejected with error_id == ERR_RESCHEDULE_LIMIT_REACHED (reschedule_count >= 2)"
            - "ServiceVisit.${visit_id}.scheduled_start == 2026-06-12T09:00:00Z (window override applied)"

      - name: invoice_dispute_reissue_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - calculations.invoice_total_composition
        distinguishing_aspect: |
          Cyclic machine on Invoice (different entity from the visit cycle):
          ISSUED -> DISPUTED -> ISSUED loops; the resolve adds a -100 ADJUSTMENT
          line and recomputes totals (subtotal 899, tax 74, total 973) while
          credit_applied_cents stays frozen at 0; a second dispute proves the
          cycle is re-entrant.
        test_recipe:
          setup:
            - "URBAN household; order with 3 lines of 333 cents PLACED at default clock (total 999, no subscription discount)"
            - "Invoice for period [2026-05-01, 2026-06-01) generated (subtotal 999, tax 82, total 1081) and ISSUED with wallet 0"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Disp", email: "hdisp@x.com", address: "5 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/products"
              payload: { sku: "FEED-A", name: "Layer Feed", category: "FEED", unit_price_cents: 333 }
              as: PlatformAdmin
            - call: "POST /coopcare/supply-orders"
              payload: { household_id: "${hh_id}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { order_id: $.data.id }
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/place"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/invoices"
              payload: { household_id: "${hh_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /coopcare/invoices/${inv_id}/issue"
              as: BillingAdmin
          trigger:
            - call: "POST /coopcare/invoices/${inv_id}/dispute"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/invoices/${inv_id}/resolve-dispute"
              payload: { adjustment_amount_cents: -100, reason: "cracked eggs" }
              as: BillingAdmin
              captures: { st: $.data.status, tot: $.data.total_cents, due: $.data.amount_due_cents, cred: $.data.credit_applied_cents }
            - call: "POST /coopcare/invoices/${inv_id}/dispute"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { st2: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == ISSUED after resolve-dispute (cycle DISPUTED -> ISSUED)"
            - "Invoice.${inv_id}.total_cents == 973 (subtotal 999-100=899, tax round_half_up(899*0.0825)=74)"
            - "Invoice.${inv_id}.amount_due_cents == 973 (credit_applied_cents frozen at 0)"
            - "second dispute succeeds: status == DISPUTED again (cycle is re-entrant)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: household_suspend_cascade_depth3
        grounds:
          - state_machines.HouseholdAccount.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
          - state_machines.SupplyOrder.PLACED_to_DRAFT
        distinguishing_aspect: |
          Depth-3 chain from the household-suspend trigger: suspend mutates the
          Subscription (PAUSED); the PAUSED transition itself cancels the covered
          SCHEDULED visit (used_cleanings released 1->0); that visit's CANCELLED
          transition itself reverts the linked PLACED order to DRAFT and clears
          fulfillment_visit_id. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "URBAN household; plan included_cleanings_per_period=2; subscription ACTIVE (period 2026-05-01)"
