            - call: "POST /fleet/consignments/${cns_r}/complete-recondition"
              payload: { recondition_actual_cents: 45500 }
              as: RemarketingManager
              as_user_id: "u-rmk-a"
          trigger:
            - call: "POST /fleet/consignments/${cns_r}/withdraw"
