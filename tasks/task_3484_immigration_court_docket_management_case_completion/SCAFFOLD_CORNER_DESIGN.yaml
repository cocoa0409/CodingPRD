              as: BoardMember
              as_user_id: "bm-01"
              captures: { e4: $.data.error_id }
            - call: "POST /eoir/motions-to-reopen/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { e5: $.data.error_id }
            - call: "POST /eoir/notices/00000000-0000-4000-8000-000000000000/mark-defective"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { e6: $.data.error_id }
            - call: "POST /eoir/appeals"
              payload: { decision_id: "00000000-0000-4000-8000-000000000000" }
              as: CourtAdministrator
              as_user_id: "admin-01"
