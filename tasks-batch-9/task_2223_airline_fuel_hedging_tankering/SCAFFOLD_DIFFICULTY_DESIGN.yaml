  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: instrument_accounting_dimension_redesignation_cycle
        grounds:
          - state_machines.HedgeInstrument.accounting_status_DESIGNATED_to_DEDESIGNATED
          - state_machines.HedgeInstrument.accounting_status_DEDESIGNATED_to_DESIGNATED
          - entities.HedgeInstrument.fields.accounting_status
          - entities.HedgeInstrument.fields.trade_status
          - validations[priority=21]
        distinguishing_aspect: |
          accounting_status re-enters DESIGNATED after DEDESIGNATED, so the accounting
          dimension is a cycle rather than a chain, and the re-entry guard is strictly
          stronger than the first entry: the first designate needs only trade_status
          EXECUTED plus an ACTIVE program, while the second additionally needs an
          APPROVED EARNINGS_VOLATILITY_BREACH PolicyException naming the instrument.
          trade_status stays EXECUTED across the whole cycle, proving the two dimensions
          advance independently.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_earnings_volatility_usd 150000.00 and min_coverage_pct 15.00."
            - "One ACTIVE HedgeProgram with consumption_basis_gallons 11000000 carrying one EXECUTED, DESIGNATED 2000000-gallon SWAP at strike 2.4000."
            - "One PUBLISHED MarkToMarketRun for 2027-02 at index 2.5000, so the trade carries mtm_value_usd 200000.00 in the program's designated bucket."
            - "A failing effectiveness test has already driven the trade to DEDESIGNATED and auto-raised a REQUESTED SYSTEM_BREACH PolicyException."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-NL1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-NL1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 20.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 2000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/designate"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs"
              payload: { period_month: "2027-02", settlement_index_usd_per_gal: 2.5000 }
              as: HedgeAccountant
              captures: { run_id: $.data.id }
            - call: "POST /fuel/mark-to-market-runs/${run_id}/compute"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs/${run_id}/publish"
              payload: {}
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { period_month: "2027-02", hedge_change_usd: -30000.00, hedged_item_change_usd: 100000.00 }
              as: HedgeAccountant
            - call: "GET /fuel/policy-exceptions"
              payload: { hedge_instrument_id: "${inst_id}", reason_code: "EARNINGS_VOLATILITY_BREACH" }
              as: RiskPolicyAdmin
              captures: { exc_id: "$.data[0].id" }
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/designate"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/policy-exceptions/${exc_id}/approve"
              payload: { decision_note: "Volatility breach accepted; re-designation permitted." }
              as: RiskPolicyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/designate"
              payload: {}
              as: HedgeAccountant
          assert:
            - "the first designate in the trigger returns 422 with error_id ERR_EXCEPTION_REQUIRED because the SYSTEM_BREACH exception is still REQUESTED"
            - "HedgeInstrument.${inst_id}.accounting_status is still DEDESIGNATED after that rejection"
            - "PolicyException.${exc_id}.status == APPROVED and PolicyException.${exc_id}.origin == SYSTEM_BREACH and PolicyException.${exc_id}.requested_by_user_id is null"
            - "the second designate returns 200: HedgeInstrument.${inst_id}.accounting_status == DESIGNATED"
            - "HedgeInstrument.${inst_id}.trade_status == EXECUTED at every step of the cycle"
            - "HedgeProgram.${prog_id}.designated_mtm_usd == 200000.00 and HedgeProgram.${prog_id}.undesignated_mtm_usd == 0.00"
            - "HedgeProgram.${prog_id}.earnings_volatility_usd == 0.00 and HedgeProgram.${prog_id}.compliance_posture == COMPLIANT"
            - "HedgePolicy.${policy_id}.open_exception_count == 0 (the approval closed the only open exception)"

      - name: directive_revision_cycle_then_supersession
        grounds:
          - state_machines.TankeringDirective.PROPOSED_to_NEEDS_REVISION
          - state_machines.TankeringDirective.NEEDS_REVISION_to_PROPOSED
          - state_machines.TankeringDirective.PROPOSED_to_SUPERSEDED
          - entities.TankeringDirective.fields.revision_count
        distinguishing_aspect: |
          PROPOSED is re-entered twice through NEEDS_REVISION, giving revision_count 2 on
          a directive that is still in its initial state name, and the terminal state
          SUPERSEDED is reachable only as a side effect of creating a sibling directive
          on the same FlightLeg - never by a transition on the directive itself.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Stations ORD (all-in 2.4700) and DFW (all-in 3.1000) each with one ACTIVE supply contract; ORD holds 500000 gallons."
