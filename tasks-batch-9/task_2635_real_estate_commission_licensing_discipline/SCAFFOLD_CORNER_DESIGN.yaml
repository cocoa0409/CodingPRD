              payload: { licensee_id: "${sam_id}", instructor_id: "${inst_id}", education_provider_id: "${prov_id}", course_type: "CE_CORE", credit_hours: 12, completed_on: "2026-08-19" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${sam_id}/status-changes"
