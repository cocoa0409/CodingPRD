        claim_type: parallel
        grounds:
          - entities.Showtime.status
          - entities.Showtime.sale_status
          - entities.Showtime.playback_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / showtime_three_parallel_status_dimensions_evolve_independently
          rationale: "The named 1.8 instance walks each of the three dimensions while the other two are pinned, which is exactly the parallel-shape claim."

