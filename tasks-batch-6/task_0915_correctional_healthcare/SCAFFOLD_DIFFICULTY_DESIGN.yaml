      - name: indigency_threshold_exactly_200_cents_is_not_indigent
        grounds:
          - calculations.indigency_determination
          - calculations.copay_amount
          - entities.CopayCharge.fields.charge_variant
        distinguishing_aspect: |
          A DIFFERENT metric (integer cents against INDIGENCY_THRESHOLD_CENTS) reached
          through a DIFFERENT endpoint (POST /inmates/{id}/copay-charges): a balance of
          exactly 200 is NOT indigent and pays 500, while 199 is indigent and is liened 250.
        test_recipe:
          setup:
            - "Two inmates at clock 2026-05-01T00:00:00Z, one with a single 200-cent DEPOSIT and one with a single 199-cent DEPOSIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1150", full_name: "Ray Sung", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm_a: $.data.id }
            - call: "POST /inmates"
              payload: { booking_number: "B-1151", full_name: "Sam Tran", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm_b: $.data.id }
            - call: "POST /inmates/${inm_a}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 200, memo: "deposit at the threshold" }
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm_b}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 199, memo: "deposit one cent below" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates/${inm_a}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg_a: $.data.id }
            - call: "POST /inmates/${inm_b}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg_b: $.data.id }
          assert:
            - "CopayCharge.${chg_a}.charge_variant == FUNDED"
            - "CopayCharge.${chg_a}.amount_cents == 500"
            - "Inmate.${inm_a}.account_balance_cents == -300"
            - "CopayCharge.${chg_b}.charge_variant == INDIGENT"
            - "CopayCharge.${chg_b}.amount_cents == 250"
            - "Inmate.${inm_b}.account_balance_cents == -51"

      - name: facility_adherence_empty_candidate_set_returns_zero
        grounds:
          - calculations.facility_adherence_index
