    path: "/district-energy/work-orders"
    description: "List work orders, filterable by segment, loop and lifecycle state."
    roles: [SystemController, DispatchOperator, NetworkEngineer, FieldTechnician, BillingAnalyst]
    code: 200
    input: ["segment_id?", "loop_id?", "work_state?", "work_type?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/submit-permit"
    description: "Submit a draft work order for an excavation permit after the window conflict sweep clears the segment."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["runs calculations.work_window_conflict_detection against every other open work order on the same segment", "sets work_state = PERMIT_PENDING and permit_decision = PENDING"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/permit-decision"
    description: "Grant or deny the excavation permit. Denial returns the order to DRAFT."
    roles: [NetworkEngineer]
    code: 200
    input: ["permit_decision", "decision_note?"]
    output: WorkOrder
    side_effects: ["stores permit_decision", "sets work_state = SCHEDULED on GRANTED", "sets work_state = DRAFT on DENIED"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/begin-excavation"
    description: "Break ground on a scheduled work order, isolating the loop when the work requires it."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets work_state = EXCAVATING", "cascades PipeSegment.condition to UNDER_REPAIR and increments PipeSegment.version by 1", "when requires_isolation is true sets NetworkLoop.posture = ISOLATED, increments open_isolation_count by 1 and increments NetworkLoop.version by 1", "decrements NetworkLoop.suspect_segment_count by 1 when the segment left the SUSPECT band"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/begin-repair"
    description: "Record that repair work has started in the open excavation."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets work_state = REPAIRING"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/backfill"
    description: "Record that the excavation has been backfilled."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets work_state = BACKFILLED"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/complete"
    description: "Sign off a backfilled work order. The signing technician must differ from the one that raised it."
    roles: [FieldTechnician]
    code: 200
    input: ["completion_note?"]
    output: WorkOrder
    side_effects: ["sets work_state = COMPLETED and stores completed_by_user_id = X-User-ID", "resets PipeSegment.makeup_water_ratio to 0.0, increments historical_leak_count by 1 for LEAK_REPAIR work, re-runs calculations.segment_leak_risk_score and re-bands PipeSegment.condition", "decrements NetworkLoop.open_isolation_count by 1 when requires_isolation is true", "cascades NetworkLoop.posture ISOLATED to NORMAL when suspect_segment_count == 0, otherwise to CONSTRAINED", "increments NetworkLoop.version by 1"]
  - method: POST
    path: "/district-energy/work-orders/{work_order_id}/cancel"
    description: "Cancel a work order that has not yet broken ground."
    roles: [FieldTechnician]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["sets work_state = CANCELLED"]

  - method: POST
    path: "/district-energy/expansion-projects"
    description: "Open a network expansion screening case for a prospective customer."
    roles: [NetworkEngineer]
    code: 201
    input: ["loop_id", "rate_schedule_id", "candidate_customer_name", "customer_class", "requested_capacity_kw", "route_length_m", "assumed_annual_energy_mwh", "assumed_marginal_cost_per_mwh", "design_delta_t_c"]
    output: ExpansionProject
    side_effects: ["creates the project with project_state SCREENING and null sizing outputs"]
  - method: GET
    path: "/district-energy/expansion-projects/{project_id}"
    description: "Read one expansion project including its sizing and economics."
    roles: [SystemController, NetworkEngineer, BillingAnalyst]
    code: 200
    input: []
    output: ExpansionProject
    side_effects: []
  - method: GET
    path: "/district-energy/expansion-projects"
    description: "List expansion projects, filterable by loop, tariff and lifecycle state."
    roles: [SystemController, NetworkEngineer, BillingAnalyst]
    code: 200
    input: ["loop_id?", "rate_schedule_id?", "project_state?", "limit?", "offset?"]
    output: ExpansionProject[]
    side_effects: []
  - method: POST
    path: "/district-energy/expansion-projects/{project_id}/size"
    description: "Select the smallest hydraulically feasible standard pipe diameter and value the connection over twenty years."
    roles: [NetworkEngineer]
    code: 200
    input: ["requested_capacity_kw?", "route_length_m?", "assumed_annual_energy_mwh?", "assumed_marginal_cost_per_mwh?", "design_delta_t_c?"]
    output: ExpansionProject
    side_effects: ["overwrites any supplied revision inputs", "runs calculations.expansion_sizing_and_npv and stores selected_diameter_mm, design_flow_m3_per_h, estimated_capex, annual_net_margin and npv", "sets project_state = SIZED"]
  - method: POST
    path: "/district-energy/expansion-projects/{project_id}/decision"
    description: "Approve or reject a sized expansion project. Approval requires a non-negative net present value."
    roles: [SystemController]
    code: 200
    input: ["decision", "decision_note?"]
    output: ExpansionProject
    side_effects: ["sets project_state = APPROVED on APPROVE after the net-present-value gate passes", "sets project_state = REJECTED on REJECT"]
  - method: POST
    path: "/district-energy/expansion-projects/{project_id}/convert"
    description: "Convert an approved expansion project into a pending connection agreement."
    roles: [BillingAnalyst]
    code: 200
    input: ["reserved_capacity_kw", "service_mode", "service_start_date", "service_end_date", "customer_name?"]
    output: ExpansionProject
    side_effects: ["creates a ConnectionAgreement on the project's loop_id and rate_schedule_id with contract_state PENDING_CAPACITY, billing_state CURRENT and the project's customer_class", "sets project_state = CONVERTED"]

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_FORBIDDEN_AGREEMENT
    http: 403
    condition: "a CustomerAccount acts on an invoice or agreement whose agreement id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the plan reviewer equals the plan author, or the work-order completer equals the reporter"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, inverted interval, malformed tier ladder or pagination outside 1..100"
  - id: ERR_LOOP_NOT_FOUND
    http: 404
    condition: "no NetworkLoop with the given id"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "no PipeSegment with the given id"
  - id: ERR_FUEL_CONTRACT_NOT_FOUND
    http: 404
    condition: "no FuelSupplyContract with the given id"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "no ProductionAsset with the given id"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "no LoadForecast with the given id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no DispatchPlan with the given id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no DispatchOrder with the given id"
  - id: ERR_RATE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "no RateSchedule with the given id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ConnectionAgreement with the given id"
  - id: ERR_METERING_POINT_NOT_FOUND
    http: 404
    condition: "no MeteringPoint with the given id"
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "no MeterReading with the given id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no Invoice with the given id"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "no WorkOrder with the given id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no ExpansionProject with the given id"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body does not resolve to an existing row"
  - id: ERR_STALE_LOOP_VERSION
    http: 412
    condition: "expected_loop_version does not equal the current NetworkLoop.version on dispatch plan creation"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the current ConnectionAgreement.version on invoice creation"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a code or supplier_code collides within its declared uniqueness scope"
  - id: ERR_SEGMENT_CYCLE
    http: 409
    condition: "the upstream_segment_id chain revisits a segment or leaves the loop"
  - id: ERR_SEGMENT_LOOP_MISMATCH
    http: 409
    condition: "a work order's loop_id differs from its segment's loop_id, or a metering point's segment and agreement sit on different loops"
  - id: ERR_CUSTOMER_CLASS_MISMATCH
    http: 409
    condition: "the customer class does not equal the referenced tariff's customer_class"
  - id: ERR_SERVICE_MODE_MISMATCH
    http: 409
    condition: "the requested service mode is incompatible with the loop's service_mode"
  - id: ERR_FORECAST_LOOP_MISMATCH
    http: 409
    condition: "the forecast referenced by a dispatch plan belongs to a different loop"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the dispatch plan is not in the from-state the requested transition declares"
  - id: ERR_FORECAST_STATE_INVALID
    http: 409
    condition: "the forecast is not DRAFT on publish, or not PUBLISHED when a plan optimizes against it"
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "the connection agreement is not in the from-state the requested contract transition declares"
  - id: ERR_INVOICE_STATE_INVALID
    http: 409
    condition: "the invoice is not in the from-state the requested transition declares, or its agreement is not ACTIVE or SUSPENDED"
  - id: ERR_WORK_ORDER_STATE_INVALID
    http: 409
    condition: "the work order is not in the from-state the requested transition declares, or excavation is attempted without a granted permit"
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: "the expansion project is not in the from-state the requested transition declares"
  - id: ERR_METER_STATE_INVALID
    http: 409
    condition: "the metering point is not in the from-state the requested action declares, or commissioning is attempted while its segment is UNDER_REPAIR"
  - id: ERR_AVAILABILITY_STATE_INVALID
    http: 409
    condition: "the requested fuel contract status or asset availability transition is not declared, including any transition out of EXPIRED"
  - id: ERR_ISOLATION_CLEARANCE_DENIED
    http: 409
    condition: "excavation requiring isolation is attempted while a COMMITTED dispatch plan holds the loop"
  - id: ERR_RESERVE_MARGIN_INSUFFICIENT
    http: 409
    condition: "the plan's N-1 reserve margin is below MIN_RESERVE_MARGIN_PCT at approval"
  - id: ERR_FUEL_DIVERSITY_BREACH
    http: 409
    condition: "the plan's fuel concentration index exceeds MAX_FUEL_DIVERSITY_HHI at approval"
  - id: ERR_LOOP_ISOLATED
    http: 409
    condition: "an agreement activation is attempted while the loop posture is ISOLATED"
  - id: ERR_LOOP_NOT_NORMAL
    http: 409
    condition: "a plan commit is attempted while the loop posture is not NORMAL"
  - id: ERR_WORK_WINDOW_CONFLICT
    http: 409
    condition: "the requested work window overlaps another open work order's buffered window on the same segment"
  - id: ERR_OUTSIDE_WORK_WINDOW
    http: 409
    condition: "excavation is attempted while the logical clock sits outside the work order's window"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the requested billing period overlaps an existing non-void invoice period for the same agreement"
  - id: ERR_READING_NOT_MONOTONIC
    http: 409
    condition: "a register read goes backwards in cumulative energy or in read_at for its metering point"
  - id: ERR_NO_ELIGIBLE_ASSETS
    http: 409
    condition: "no production asset on the loop is eligible for the merit-order waterfall"
  - id: ERR_PLAN_HAS_NO_ORDERS
    http: 409
    condition: "a dispatch plan is submitted with no dispatch orders"
  - id: ERR_INSUFFICIENT_GENERATION
    http: 409
    condition: "a dispatch plan is submitted while unserved_demand_kw is above 0.0"
  - id: ERR_STORAGE_ENERGY_INSUFFICIENT
    http: 409
    condition: "a storage dispatch order would draw more energy than the asset's state_of_charge_kwh at commit"
  - id: ERR_NO_FEASIBLE_PIPE_SIZE
    http: 422
    condition: "no standard diameter satisfies both the velocity and pressure-drop limits"
  - id: ERR_INSUFFICIENT_METER_DATA
    http: 422
    condition: "fewer than two admissible register reads fall inside the billing period under the requested variant"
  - id: ERR_LOOP_CAPACITY_EXCEEDED
    http: 409
    condition: "concurrent reserved capacity at some window boundary would exceed the loop oversubscription ceiling"
  - id: ERR_PROJECT_NPV_NEGATIVE
    http: 422
    condition: "an expansion project with a negative net present value is approved"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 409
    condition: "the payment amount does not equal the invoice total_amount exactly"

roles:
  - name: SystemController
    description: "Control-room authority for plant registration, supply-contract status, plan review, decommitment, reconciliation and expansion decisions."
    identity: "opaque"
    exclusive_operations:
      - "register and list network loops"
      - "register production assets and change their availability"
      - "register fuel supply contracts and move their status"
      - "review submitted dispatch plans (approve or reject)"
      - "decommit and reconcile dispatch plans"
      - "approve or reject sized expansion projects"
      - "reposition the logical clock"
    shared_operations:
      - "read loops, segments, assets, contracts, forecasts, plans, orders, agreements, metering points, readings, invoices, work orders and projects"
      - "read the loop emissions and efficiency summary"
  - name: DispatchOperator
    description: "Plant dispatcher who prepares load forecasts, optimizes merit-order plans, submits them for review and commits approved plans."
    identity: "opaque"
    exclusive_operations:
      - "create and publish load forecasts"
      - "create dispatch plans"
      - "optimize dispatch plans"
      - "submit dispatch plans for review"
      - "commit approved dispatch plans"
    shared_operations:
      - "read loops, segments, assets, contracts, forecasts, plans, orders, agreements and work orders"
  - name: NetworkEngineer
    description: "Distribution engineer responsible for buried piping records, leak-detection assessments, excavation permits and expansion sizing."
    identity: "opaque"
    exclusive_operations:
      - "register pipe segments"
      - "record condition assessments on pipe segments"
      - "grant or deny excavation permits"
      - "create expansion projects and run their sizing"
    shared_operations:
      - "read loops, segments, assets, contracts, forecasts, plans, orders, agreements, metering points, readings, work orders and projects"
      - "read the loop emissions and efficiency summary"
  - name: FieldTechnician
    description: "Field crew member who installs and reads meters and executes buried-pipe work orders through the excavation lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "install, commission and remove metering points"
      - "record thermal energy register reads"
      - "raise work orders and submit them for permit"
      - "begin excavation, begin repair, backfill, complete and cancel work orders"
    shared_operations:
      - "read loops, segments, assets, agreements, metering points, readings and work orders"
  - name: BillingAnalyst
    description: "Revenue analyst who publishes tariffs, manages connection agreements and capacity reservations, and runs the invoice lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "publish rate schedules"
      - "create, activate and change the status of connection agreements"
      - "create, issue, adjust and void invoices"
      - "convert approved expansion projects into pending agreements"
    shared_operations:
      - "read loops, segments, assets, contracts, forecasts, plans, orders, tariffs, agreements, metering points, readings, invoices, work orders and projects"
      - "read the loop emissions and efficiency summary"
  - name: CustomerAccount
    description: "The connected customer acting as its own connection agreement; may read its own agreement, meters and invoices and settle them in full."
    identity: "entity_backed:ConnectionAgreement"
    exclusive_operations:
      - "pay an issued or adjusted invoice in full"
    shared_operations:
      - "read its own connection agreement, metering points, register reads, invoices and the tariff applied to it"
