          assert:
            - "${slots_before} == 2"
            - "${log_in_range} == false"
            - "${unit_status} == IMPAIRED"
            - "${unit_strikes} == 1"
            - "ProductionBatch.${batch_a}.status == DISCARDED"
            - "ProductionBatch.${batch_a}.remaining_qty == 0"
            - "ProductionBatch.${batch_a}.discarded_qty == 40"
            - "ProductionBatch.${batch_b}.status == DISCARDED"
            - "ProductionBatch.${batch_b}.remaining_qty == 0"
            - "ProductionBatch.${batch_b}.discarded_qty == 20"
            - "GET /production-batches/${batch_a}/waste-logs -> data[0].reason == UNIT_IMPAIRED"
            - "GET /production-batches/${batch_a}/waste-logs -> data[0].food_cost_cents == 1600"
