        excluded_because:
          difficulty_instance: non_linear_state_machine / integrity_report_returned_for_info_cycle_requires_fresh_evidence
          rationale: "The loop-back and its termination condition (fresh evidence required before each resubmission, resubmission_count increments) are asserted by the named §1.8 instance."

      - name: remand_loop_bounded_by_the_round_limit_corner_stub
