        distinguishing_aspect: |
          The full five-device ranking literal is reproduced with device_id OMITTED, so the
          selector must be exercised rather than the caller's choice: the cheap TIER wins
          before cost is consulted (a 1200-cent STANDARD handset loses to a 3900-cent BASIC
          one) and the two identical 2100-cent BASIC handsets are separated only by
          created_at ASC, so D3 - not D5 and not D4 - must be issued.
