            - call: "POST /review-capacity-windows"
              payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-21T00:00:00Z", capacity_slots: 1 }
