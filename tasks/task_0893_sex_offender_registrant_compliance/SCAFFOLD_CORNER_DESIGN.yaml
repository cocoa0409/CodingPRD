# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage) — task 0893
# Clock default before any set: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_jurisdiction_success_and_defaults
        claim_type: Creation
        grounds: [entities.Jurisdiction, entities.Jurisdiction.fields.verification_grace_days]
        distinguishing_aspect: "POST /sorna/jurisdictions with only name+state_code returns 201, status ACTIVE, verification_grace_days default 3, counts 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id", g: "$.data.verification_grace_days" } }
          assert:
            - "Jurisdiction.${jur}.status == ACTIVE"
            - "Jurisdiction.${jur}.verification_grace_days == 3"
            - "Jurisdiction.${jur}.active_travel_hold_count == 0"

      - name: registrant_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Registrant, "errors[ERR_REGISTRANT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent registrant id returns ERR_REGISTRANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /sorna/registrants/00000000-0000-0000-0000-000000000000", payload: {}, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REGISTRANT_NOT_FOUND"

      - name: create_registrant_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Registrant.fields.date_of_birth, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /sorna/registrants without date_of_birth returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["One jurisdiction exists."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "No DOB" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: offense_invalid_enum_class_returns_error
        claim_type: Type Constraints
        grounds: [entities.Offense.fields.offense_class, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST offense with offense_class outside {CLASS_A,CLASS_B,CLASS_C} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["PENDING registrant exists."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Enum E", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_Z", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_ENUM"

      - name: registrant_system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Registrant.fields.status]
        distinguishing_aspect: "New registrant is created with system status PENDING and version 1; tier is unset before activation."
        test_recipe:
          setup: ["One jurisdiction exists."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "New N", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id", v: "$.data.version" } }
          assert:
            - "Registrant.${reg}.status == PENDING"
            - "Registrant.${reg}.version == 1"

  - section: state_machines
    instances:
      - name: activate_non_pending_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.Registrant.PENDING_to_ACTIVE, "errors[ERR_REGISTRANT_NOT_PENDING]"]
        distinguishing_aspect: "Calling activate on an already-ACTIVE registrant returns ERR_REGISTRANT_NOT_PENDING (409)."
        test_recipe:
          setup: ["ACTIVE TIER_1 registrant."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Act A", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REGISTRANT_NOT_PENDING"

      - name: activate_without_offense_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Registrant.PENDING_to_ACTIVE, "errors[ERR_NO_OFFENSES]"]
        distinguishing_aspect: "Activating a registrant with zero offenses returns ERR_NO_OFFENSES (409)."
        test_recipe:
          setup: ["PENDING registrant with no offenses."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Empty E", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_OFFENSES"

      - name: resolve_already_resolved_flag_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Registrant.DELINQUENT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a flag that is already RESOLVED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE registrant with a flag opened then resolved once."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Idem I", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer, captures: { fl: "$.data.id" } }
            - { call: "POST /sorna/compliance-flags/${fl}/resolve", payload: {}, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/compliance-flags/${fl}/resolve", payload: {}, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: decide_terminal_petition_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Petition.PENDING_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding a petition that is already DENIED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE registrant with a PENDING petition denied once by the reviewer."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Term T", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id" } }
            - { call: "POST /sorna/petitions/${pet}/decision", payload: { decision: "DENY", reviewer_ref: "rev-2" }, as: ComplianceReviewer }
          trigger:
            - { call: "POST /sorna/petitions/${pet}/decision", payload: { decision: "GRANT", reviewer_ref: "rev-2" }, as: ComplianceReviewer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: deny_travel_leaves_hold_count_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.TravelNotice.SUBMITTED_to_DENIED, entities.Jurisdiction.fields.active_travel_hold_count]
        distinguishing_aspect: "The DENY branch is terminal and does NOT increment destination active_travel_hold_count (stays 0)."
        test_recipe:
          setup: ["ACTIVE registrant in jur1; ACTIVE destination jur2 (hold_count 0); one SUBMITTED travel notice to jur2."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Home", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions", payload: { name: "Dest", state_code: "NV" }, as: RegistryAdmin, captures: { jur2: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Deny D", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur2}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { tn: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/travel-notices/${tn}/decision", payload: { decision: "DENY", decision_note: "not approved" }, as: RegistrationOfficer, captures: { st: "$.data.status" } }
          assert:
            - "TravelNotice.${tn}.status == DENIED"
            - "Jurisdiction.${jur2}.active_travel_hold_count == 0"

      - name: abscond_flag_cancels_travel_and_decrements_hold
        claim_type: Cross-entity
        grounds: [state_machines.Registrant.ACTIVE_to_ABSCONDER, entities.Jurisdiction.fields.active_travel_hold_count]
        distinguishing_aspect: "Opening an ABSCONDED flag flips registrant to ABSCONDER and cancels an APPROVED travel notice, decrementing the destination hold_count back to 0."
        test_recipe:
          setup: ["ACTIVE registrant in jur1 with an APPROVED travel notice to ACTIVE jur2 (jur2 hold_count 1)."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Home", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions", payload: { name: "Dest", state_code: "NV" }, as: RegistryAdmin, captures: { jur2: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Absc A", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur2}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { tn: "$.data.id" } }
            - { call: "POST /sorna/travel-notices/${tn}/decision", payload: { decision: "APPROVE" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "ABSCONDED" }, as: RegistrationOfficer, captures: { fl: "$.data.id" } }
          assert:
            - "Registrant.${reg}.status == ABSCONDER"
            - "TravelNotice.${tn}.status == CANCELLED"
            - "Jurisdiction.${jur2}.active_travel_hold_count == 0"

  - section: calculations
    instances:
      - name: tier_two_at_score_boundary_thirty
        claim_type: Constants Applied
        grounds: [calculations.tier_score, entities.Registrant.fields.tier]
        distinguishing_aspect: "A single CLASS_A offense yields tier_score exactly 30, the TIER_2 breakpoint, so tier == TIER_2 and interval 180."
        test_recipe:
          setup: ["PENDING registrant with one CLASS_A offense, then activated."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Two T", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P288", offense_class: "CLASS_A", conviction_date: "2019-01-01T00:00:00Z" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { tier: "$.data.tier", tscore: "$.data.tier_score" } }
          assert:
            - "Registrant.${reg}.tier_score == 30"
            - "Registrant.${reg}.tier == TIER_2"
            - "Registrant.${reg}.verification_interval_days == 180"

      - name: verification_reset_advances_next_due
        claim_type: Correct Result
        grounds: [calculations.verification_schedule, entities.Registrant.fields.next_verification_due]
        distinguishing_aspect: "Recording a PERIODIC verification at 2026-08-01 resets next_verification_due to 2027-08-01 (last_verified + 365)."
        test_recipe:
          setup: ["ACTIVE TIER_1 registrant; clock advanced to 2026-08-01."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Reset R", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: RegistryAdmin }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/verifications", payload: { verification_type: "PERIODIC", officer_ref: "off-9" }, as: RegistrationOfficer }
          assert:
            - "Registrant.${reg}.next_verification_due == 2027-08-01T00:00:00.000Z"
            - "Registrant.${reg}.last_verified_date == 2026-08-01T00:00:00.000Z"

  - section: validations
    instances:
      - name: duplicate_pending_petition_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ACTIVE_PETITION]"]
        distinguishing_aspect: "Filing a second petition while a PENDING one exists returns ERR_DUPLICATE_ACTIVE_PETITION (409)."
        test_recipe:
          setup: ["ACTIVE registrant with one PENDING DEREGISTER petition."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Dup D", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "TIER_REDUCTION" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_PETITION"

      - name: temporary_travel_missing_return_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=8]", "errors[ERR_MISSING_TRAVEL_RETURN]"]
        distinguishing_aspect: "A TEMPORARY travel notice without return_date returns ERR_MISSING_TRAVEL_RETURN (422)."
        test_recipe:
          setup: ["ACTIVE registrant."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Miss M", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_MISSING_TRAVEL_RETURN"

  - section: endpoints
    instances:
      - name: list_flags_by_registrant_reverse_reachable
        claim_type: Computed read
        grounds: [entities.ComplianceFlag.fields.registrant_id]
        distinguishing_aspect: "GET /sorna/registrants/{id}/flags returns the ComplianceFlag[] for that registrant (FK reverse-reachability)."
        test_recipe:
          setup: ["ACTIVE registrant with one OPEN flag."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "List L", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "TRAVEL_VIOLATION" }, as: RegistrationOfficer, captures: { fl: "$.data.id" } }
          trigger:
            - { call: "GET /sorna/registrants/${reg}/flags", payload: {}, as: ComplianceReviewer }
          assert:
            - "response contains ComplianceFlag ${fl} with status OPEN"

  - section: rbac
    instances:
      - name: reviewer_cannot_open_flag_returns_unauthorized
        claim_type: peer_roles
        grounds: [roles.ComplianceReviewer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ComplianceReviewer opening a flag (a RegistrationOfficer exclusive op) returns ERR_UNAUTHORIZED (403) — segregation of duties."
        test_recipe:
          setup: ["ACTIVE registrant exists."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Sod S", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: ComplianceReviewer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: registrant_cannot_decide_petition_returns_unauthorized
        claim_type: Segregation of duties
        grounds: [roles.Registrant, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Registrant deciding a petition (ComplianceReviewer exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["ACTIVE registrant with a PENDING petition; Registrant acts as itself."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Self S", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/petitions/${pet}/decision", payload: { decision: "GRANT" }, as: Registrant, as_user_id: "${reg}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: registrant_cannot_read_other_registrant_returns_unauthorized
        claim_type: peer_roles
        grounds: [roles.Registrant, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Registrant reading a different registrant's record (X-User-ID != path id) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Two registrants reg1 and reg2 exist."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "One 1", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg1: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Two 2", date_of_birth: "1981-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg2: "$.data.id" } }
          trigger:
            - { call: "GET /sorna/registrants/${reg2}", payload: {}, as: Registrant, as_user_id: "${reg1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: unauthenticated_request_returns_401
        claim_type: peer_roles
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no recognized role/id header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["One registrant exists."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Anon A", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
          trigger:
            - { call: "GET /sorna/registrants/${reg}", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

  - section: cross_cutting
    instances:
      - name: address_create_stale_registrant_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[address-create-stale-registrant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second RESIDENCE create carrying the pre-first-create registrant version is rejected ERR_STALE_VERSION (412) because the first RESIDENCE supersede advanced Registrant.version."
        test_recipe:
          setup: ["ACTIVE registrant; one RESIDENCE address already created (registrant.version advanced by 1)."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Occ O", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "1 First St", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 4000, grid_y: 4000, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "2 Second St", city: "Metro", state_code: "CA", postal_code: "90002", grid_x: 4200, grid_y: 4200, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION"

      - name: residence_supersede_marks_prior_historical
        claim_type: derived_field_reconciliation
        grounds: [entities.Address.fields.status, entities.Registrant.fields.current_residence_address_id]
        distinguishing_aspect: "Creating a second RESIDENCE (with the refreshed version) marks the prior RESIDENCE HISTORICAL and repoints current_residence_address_id to the new address."
        test_recipe:
          setup: ["ACTIVE registrant with one RESIDENCE address addr1; registrant version re-read after that create."]
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Move M", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "1 Old St", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 4000, grid_y: 4000, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer, captures: { addr1: "$.data.id" } }
            - { call: "GET /sorna/registrants/${reg}", payload: {}, as: RegistrationOfficer, captures: { reg_v2: "$.data.version" } }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "9 New St", city: "Metro", state_code: "CA", postal_code: "90003", grid_x: 7000, grid_y: 7000, expected_registrant_version: "${reg_v2}" }, as: RegistrationOfficer, captures: { addr2: "$.data.id" } }
          assert:
            - "Address.${addr1}.status == HISTORICAL"
            - "Address.${addr2}.status == VERIFIED"
            - "Registrant.${reg}.current_residence_address_id == ${addr2}"

