      - name: window_sanity_rejects_degenerate_and_future_dated_ranges
        claim_type: temporal_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_LOOKBACK_WINDOW_INVALID]
          - entities.PortabilityAssessment.fields.baseline_date
          - entities.ConflictWaiver.fields.response_deadline_date
          - entities.SearchFirmEngagement.fields.exclusivity_end_date
        distinguishing_aspect: |
          Priority 20 is a single rule guarding SIX endpoints with two different shapes of
          temporal nonsense, and this probe exercises one of each on three different
          aggregates: a degenerate half-open engagement window whose end EQUALS its start
          (empty, not merely inverted), a PortabilityAssessment baseline_date in the FUTURE
          relative to the logical clock, and a ConflictWaiver response_deadline_date that
          equals the clock rather than exceeding it. All three must return the same
          ERR_LOOKBACK_WINDOW_INVALID 422 and none may leave a row behind; the closing
          assessment with baseline 2026-07-01 then proves the endpoint itself is healthy.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one SearchFirm with max_fee_pct 0.3000, and one ACTIVE SearchFirmEngagement over [2026-08-01, 2026-12-01) with tail_off_days 90, so 2027-03-01 is the earliest compliant next start on the same practice group."
            - "One Candidate in DILIGENCE whose LateralQuestionnaire is UNDER_REVIEW with the SLIM BOOK and version captured as lpq_v1; no PortabilityAssessment exists yet."
            - "One PENDING ConflictCheck on the entry."
            - "The logical clock is at its default 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
