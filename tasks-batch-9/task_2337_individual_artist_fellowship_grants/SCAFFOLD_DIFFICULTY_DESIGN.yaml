            - { call: "GET /grants/payment-installments/${inst2}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/payment-installments/${inst3}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw1}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
            - "Exactly three installments exist, ordered installment_number 1, 2, 3"
            - "gross_cents == 600000 / 525000 / 375000 and they sum to exactly 1500000"
            - "withholding_rate == 0.2707 on all three (tin_status MISSING)"
            - "withholding_cents == 162420 / 142118 / 101513"
            - "net_cents == 437580 / 382882 / 273487"
            - "scheduled_date == 2027-01-01 / 2027-05-01 / 2027-08-29"
            - "Award.scheduled_withholding_cents == 406051, NOT 406050 (round_half_up(1500000 * 0.2707) = 406050 is the forbidden single-rounding reading)"
            - "Award.undisbursed_gross_cents == 1500000 and final_report_due_at == 2028-02-29 (grant_period_end 2027-12-31 plus 60 days across a leap February)"

