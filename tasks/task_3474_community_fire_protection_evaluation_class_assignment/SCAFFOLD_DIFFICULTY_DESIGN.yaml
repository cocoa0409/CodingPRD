          trigger:
            - { call: "POST /ppc/classifications/${cl2}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
          assert:
            - "Classification.${cl1}.status == SUPERSEDED with effective_until == 2026-09-01 (link 1)"
            - "Community.${c_id}.current_class_number == 10 and current_premium_modifier == 1.25 (link 2)"
            - "PropertyRiskProfile.${prop_id}.applicable_class == 10 (link 2)"
            - "PremiumQuote.${q2}.status == EXPIRED (link 3: QUOTED pinned to superseded classification)"
            - "PremiumQuote.${q1}.status == BOUND (conditional cascade: only QUOTED quotes expire)"
            - "Community.${c_id}.bound_exposure_cents == 10000000 (unchanged by the cascade)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority_beats_segregation_on_publish
        grounds:
          - validations[priority=19]
          - validations[priority=30]
        distinguishing_aspect: |
          Pair state x business_safety: a publish attempted while the cycle is still
          in SCORING (state violation, priority 19) by a registrar whose X-User-ID
          equals the cycle's field_analyst_id (SoD violation, priority 30) MUST return
          ERR_CYCLE_INVALID_STATE, not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Community driven to SCORING with a FINAL sheet; cycle never advanced to CLASSIFICATION_REVIEW; publisher id deliberately equals field_analyst_id"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Prio One", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 with error_id ERR_CYCLE_INVALID_STATE (state priority 19 beats business_safety priority 30)"
            - "no Classification is created for the cycle"
            - "EvaluationCycle.${cy_id}.status remains SCORING"

      - name: temporal_priority_beats_fiscal_on_quote_create
        grounds:
          - validations[priority=41]
          - validations[priority=48]
        distinguishing_aspect: |
          Pair business_temporal x business_fiscal: a quote create whose coverage
          window ends before it starts (temporal, priority 41) AND whose coverage is
          200% of insured value (fiscal, priority 48) MUST return
          ERR_COVERAGE_PERIOD_INVALID, not ERR_COVERAGE_EXCEEDS_VALUE — a different
          category pair than the state x safety instance.
        test_recipe:
          setup:
            - "Community with EFFECTIVE class-10 classification and a property insured for 100,000,000 cents"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Prio Two", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "7 Ash St", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
          trigger:
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 200000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-06-01", coverage_end_date: "2027-01-01" }, as: Insurer, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 422 with error_id ERR_COVERAGE_PERIOD_INVALID (temporal priority 41 beats fiscal priority 49)"
            - "no PremiumQuote is created for the property"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: class_boundary_90_00_vs_89_99
        grounds:
          - calculations.total_points_divergence_and_class
          - entities.ScoreSheet.fields.base_class
        distinguishing_aspect: |
          Points-metric boundary reachable via the score-sheet endpoint: adjusted
          total exactly 90.00 maps to class 1 while 89.99 maps to class 2; the only
          change between the two sheets is one risk-reduction credit dropping the raw
          CRR from 5.00 to 4.99.
        test_recipe:
          setup:
            - "Community in SCORING engineered for subtotal 85.00 (fd 40.00, water 35.00, comms 10.00); credits A/B/C verified (2.0+2.0+1.0, raw 5.00); credit D (0.99) PENDING"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Boundaryville", state_code: "TX", population: 12000, area_sq_miles: 25, rural_area_pct: 30, dept_type: "CAREER", needed_fire_flow_gpm: 2000, storage_capacity_gal: 0, supply_works_capacity_gpm: 2500, daily_consumption_gpm: 300 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 6, volunteers_on_duty_avg: 0, training_hours_per_firefighter_annual: 240, training_facility_level: "B", live_fire_training: true, coverage_pct_within_5mi: 50 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "LADDER", ladder_height_ft: 80 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 1st" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 5th" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h2: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1200 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h2}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t2: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 55, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PREVENTION_INSPECTION", activity_points: 2.5, evidence_note: "log A" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cra: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "CODE_ENFORCEMENT", activity_points: 3.0, evidence_note: "log B" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { crb: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PUBLIC_EDUCATION", activity_points: 1.0, evidence_note: "log C" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { crc: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "FIRE_INVESTIGATION", activity_points: 0.99, evidence_note: "log D" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { crd: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
