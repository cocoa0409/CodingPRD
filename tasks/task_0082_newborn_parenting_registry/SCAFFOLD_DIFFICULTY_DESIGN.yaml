          - entities.NicuStay.fields.admitted_at
        distinguishing_aspect: |
          NicuBed resource, HALF-OPEN [admitted_at, discharged_at) interval semantics: a manual
          assign-stay whose interval [2026-03-05T11:00:00Z, null) overlaps a prior closed stay
          interval [2026-03-05T09:00:00Z, 2026-03-05T12:00:00Z) on the same bed is rejected with
          ERR_BED_INTERVAL_OVERLAP. (A new admitted_at == prior.discharged_at would be allowed —
          adjacency — but here it strictly overlaps.)
        test_recipe:
          setup:
            - "Clock at 2026-03-05T13:00:00Z."
            - "One LEVEL_3 bed that already holds a CLOSED historical stay over [09:00Z,12:00Z) for newbornA (stepped down so the bed is VACANT)."
            - "NewbornB escalated PENDING_BED with admitted_at 2026-03-05T11:00:00Z (overlapping the prior interval), discharged_at null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
              captures: { bed_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T08:30:00Z", birth_sequence: 1, weight_grams: 1500, gestational_age_weeks: 31, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_a: $.data.id }
            - call: "GET /newborns/${nb_a}"
              payload: {}
              as: Neonatologist
              captures: { nb_a_v: $.data.version }
            - call: "POST /newborns/${nb_a}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T09:00:00Z", expected_newborn_version: "${nb_a_v}" }
              as: Neonatologist
              captures: { stay_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /newborns/${nb_a}/step-down"
              payload: {}
              as: Neonatologist
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:30:00Z", birth_sequence: 2, weight_grams: 1600, gestational_age_weeks: 32, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_b: $.data.id }
            - call: "GET /newborns/${nb_b}"
              payload: {}
              as: Neonatologist
              captures: { nb_b_v: $.data.version }
            - call: "POST /newborns/${nb_b}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T11:00:00Z", expected_newborn_version: "${nb_b_v}" }
              as: Neonatologist
              captures: { stay_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T13:00:00Z" }
              as: RegistrySupervisor
          trigger:
            - call: "POST /nicu-beds/${bed_id}/assign-stay"
              payload: { nicu_stay_id: "${stay_b}" }
              as: Neonatologist
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BED_INTERVAL_OVERLAP"

      - name: lactation_consult_closed_buffer_conflict_rejected
        grounds:
          - validations[priority=18]
          - entities.LactationConsult.fields.consult_datetime
        distinguishing_aspect: |
          LactationConsult-on-Newborn resource, CLOSED ±240-minute BUFFER semantics (distinct
          interval arithmetic from the bed's half-open overlap): a second consult at
          2026-03-05T13:00:00Z is within 240 minutes of an existing SCHEDULED consult at
          2026-03-05T11:00:00Z (gap exactly 120 min <= 240) and is rejected with
          ERR_CONSULT_BUFFER_CONFLICT, on a different resource entity than the NICU bed.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T08:00:00Z."
            - "A BORN newborn with one SCHEDULED LactationConsult at 2026-03-05T11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T07:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T11:00:00Z" }
              as: AttendingNurse
              captures: { lc1_id: $.data.id }
          trigger:
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T13:00:00Z" }
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CONSULT_BUFFER_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: terminate_enrollment_conserves_policy_dependent_slots
        grounds:
          - state_machines.DependentEnrollment.PENDING_to_ENROLLED
          - state_machines.DependentEnrollment.ENROLLED_to_TERMINATED
          - entities.InsurancePolicy.fields.dependents_added_count
        distinguishing_aspect: |
          Conserved quantity #1 — INSURANCE DEPENDENT SLOTS. Invariant:
          InsurancePolicy.dependents_added_count == count of ENROLLED DependentEnrollment rows for
          this policy. Enroll then terminate must return dependents_added_count to its pre-enroll
          value (0 -> 1 on enroll, 1 -> 0 on terminate); no slot drift.
        test_recipe:
          setup:
            - "Clock at 2026-03-06T12:00:00Z."
            - "A MARKETPLACE policy (slots_max 2, dependents_added_count 0) and a PENDING enrollment within SEP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 2 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_id}", policy_id: "${policy_id}", requested_at: "2026-03-06T12:00:00Z" }
              as: BenefitsCoordinator
              captures: { enr_id: $.data.id }
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { pol_v: $.data.version }
            - call: "POST /dependent-enrollments/${enr_id}/approve"
              payload: { expected_policy_version: "${pol_v}" }
              as: BenefitsCoordinator
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { count_after_enroll: $.data.dependents_added_count }
          trigger:
            - call: "POST /dependent-enrollments/${enr_id}/terminate"
              payload: {}
              as: BenefitsCoordinator
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { count_after_terminate: $.data.dependents_added_count }
          assert:
            - "InsurancePolicy.${policy_id}.dependents_added_count == 1 immediately after approve"
            - "InsurancePolicy.${policy_id}.dependents_added_count == 0 after terminate"
            - "DependentEnrollment.${enr_id}.status == TERMINATED"

      - name: stepdown_conserves_nicu_bed_occupancy_count
        grounds:
          - state_machines.Newborn.NICU_ADMITTED_to_STEP_DOWN
          - state_machines.NicuStay.ACTIVE_to_STEPPED_DOWN
          - entities.NicuBed.fields.occupancy_status
        distinguishing_aspect: |
          Conserved quantity #2 — NICU BED OCCUPANCY (a different conserved quantity from insurance
          slots). Invariant: count of beds with occupancy_status==OCCUPIED == count of NicuStay rows
          with status==ACTIVE. After escalating one newborn onto a single bed (occupied=1, active=1),
          step-down with NO waiting stay leaves occupied=0, active=0 — the forward escalate paired
          with the compensating step-down conserves the occupied==active equality.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "One LEVEL_3 bed, one escalated ACTIVE newborn on it, no other escalations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T09:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
              captures: { bed_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T08:30:00Z", birth_sequence: 1, weight_grams: 1500, gestational_age_weeks: 31, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_a: $.data.id }
            - call: "GET /newborns/${nb_a}"
              payload: {}
              as: Neonatologist
              captures: { nb_a_v: $.data.version }
            - call: "POST /newborns/${nb_a}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T09:00:00Z", expected_newborn_version: "${nb_a_v}" }
              as: Neonatologist
              captures: { stay_a: $.data.id }
            - call: "GET /nicu-beds/${bed_id}"
              payload: {}
              as: Neonatologist
              captures: { occ_after_escalate: $.data.occupancy_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
          trigger:
            - call: "POST /newborns/${nb_a}/step-down"
              payload: {}
              as: Neonatologist
            - call: "GET /nicu-beds/${bed_id}"
              payload: {}
              as: Neonatologist
              captures: { occ_after_stepdown: $.data.occupancy_status, stay_after: $.data.current_stay_id }
          assert:
            - "NicuBed.${bed_id}.occupancy_status == OCCUPIED immediately after escalate"
            - "NicuBed.${bed_id}.occupancy_status == VACANT after step-down"
            - "NicuBed.${bed_id}.current_stay_id == null after step-down"
            - "NicuStay.${stay_a}.status == STEPPED_DOWN"
