  # ===========================================================================
  # Rule 4 — Transitive cascades, each >= 3 hops, on DIFFERENT trigger endpoints
  #   instance 1 → invitation decline, 4 hops, forward direction
  #   instance 2 → contract rescission, 4 hops, compensating direction
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: invitation_decline_frees_seat_and_promotes_waitlist_four_hop
        grounds:
          - endpoints.POST_/interview-invitations/{id}/decline
          - calculations.waitlist_promotion_selector
          - state_machines.InterviewSlot.BOOKED_to_OPEN
          - state_machines.Application.SCHEDULED_to_NOT_INVITED
          - state_machines.InterviewInvitation.WAITLISTED_to_ISSUED
          - entities.Program.fields.invited_count
        cascade_chain: |
          hop 1  InterviewInvitation inv1: ACCEPTED -> DECLINED, responded_at stamped
          hop 2  because the seat it held was booked, InterviewSlot slot1.booked_count 1 -> 0
                 and slot1 returns BOOKED -> OPEN, and Application app1 SCHEDULED -> NOT_INVITED
          hop 3  because a seat freed inside a RELEASED wave, waitlist_promotion_selector runs
                 and the winning WAITLISTED invitation inv4 -> ISSUED with issued_at/expires_at set
          hop 4  because inv4 entered ISSUED, Application app3 NOT_INVITED -> INVITED and
                 Program.invited_count is recomputed over the changed invited set
        distinguishing_aspect: |
          The declining applicant's own seat release (hops 1-2) is only the start: the freed seat
          re-enters allocation and pulls a THIRD applicant's invitation and application forward
          (hops 3-4). The selector orders by Application.final_screen_score DESC before
          created_at ASC, and the higher-scoring waitlisted invitation inv4 (28.50) was created
          AFTER the lower-scoring inv3 (22.00), so an implementation that stops at hop 2, or that
          promotes on arrival order alone, produces a different observable end state.
          Program.invited_count is also the wrong kind of witness for a stop-at-hop-2 reading: it
          is 2 both before and after, because app1 leaves the invited set in the same request that
          app3 enters it. Only the per-application interview_status values distinguish the two
          readings, and only inv3-stays-WAITLISTED distinguishes score-order from arrival-order.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN, min_step2_score 220, quota_positions 2"
            - "one wave with seat_capacity 2 and one slot with applicant_capacity 1"
            - "four ADVANCED applications with final_screen_score 34.75 (app1), 22.00 (app2), 28.50 (app3), 24.70 (app4)"
            - "inv1 (app1) and inv2 (app4) created ISSUED, consuming both seats; inv3 (app2) then inv4 (app3) created WAITLISTED in that order"
            - "inv1 accepted into slot1, so slot1 is BOOKED and app1 is SCHEDULED"
