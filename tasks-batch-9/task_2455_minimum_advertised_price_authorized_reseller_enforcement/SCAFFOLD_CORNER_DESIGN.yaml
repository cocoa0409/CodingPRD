          trigger:
            - call: "GET /products/${prod}/effective-floor"
              payload: { channel: "MARKETPLACE", as_of: "2026-08-18T00:00:00Z", is_bundle: true }
              as: BrandChannelManager
              captures: { flbund: $.data.effective_map_floor_cents, srcbund: $.data.floor_source, aid: $.data.applied_exception_id }
          assert:
            - "HTTP 200"
            - "${flsolo} == 15000"
            - "${srcsolo} == 'STANDARD'"
            - "${flbund} == 13000"
            - "${srcbund} == 'EXCEPTION'"
