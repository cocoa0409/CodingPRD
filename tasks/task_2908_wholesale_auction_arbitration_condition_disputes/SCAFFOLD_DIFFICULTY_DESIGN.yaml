  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: pair_a_suspended_buyer_beats_expired_window_rejected
        grounds:
          - validations[priority=27]
          - validations[priority=33]
          - errors.ERR_BUYER_PRIVILEGE_SUSPENDED
          - errors.ERR_ARBITRATION_WINDOW_EXPIRED
        distinguishing_aspect: |
          Conflict pair A. Both violated rules are category `state` vs
          `business_temporal` and both return HTTP 409, so the ONLY observable signal is
          the error_id — an implementation that evaluates the window arithmetic before the
          privilege gate returns the identical status code with the wrong id. The pair is
          also asymmetric in cost: the privilege gate needs no clock arithmetic at all.
        test_recipe:
          setup:
            - "one Seller SL-1001, one Buyer BL-2001 and one MECHANICAL policy with window_hours 48, mileage_limit 250, min_claim_amount_cents 60000, requires_third_party_verification false, max_allowance_bps 2000, psi_extension_hours 96, psi_clean_waives_rights true"
            - "FOUR AuctionSale rows at hammer_time_utc 2026-08-01T00:00:00Z; sales 1/2/3 carry the three frivolous denials, sale 4 is the target of the barred claim"
            - "three MECHANICAL cases on sales 1/2/3, each evidenced, reviewed by arb-intake-01, DISPUTEd and decided FRIVOLOUS_DENIED by arb-decide-02, leaving the buyer SUSPENDED with frivolous_claim_count 3"
            - "the logical clock is then advanced to 2026-08-05T00:00:00Z, which is 96 hours after every hammer_time_utc — double the 48-hour MECHANICAL window"
            - "the target claim carries claim_amount_cents 100000 (above the 60000 minimum) and odometer_at_claim 99100 against announced 99000 (100 miles, inside the 250 limit), so exactly two rules are violated"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
