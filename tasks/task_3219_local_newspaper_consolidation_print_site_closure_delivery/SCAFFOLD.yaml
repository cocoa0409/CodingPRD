    code: 200
    input: []
    output: { is_legal_notice_ratio_compliant: boolean, on_time_market_count: integer, counted_market_count: integer, min_on_time_ratio_pct: integer, legal_notice_block: boolean, press_posture: string }
    side_effects: []

