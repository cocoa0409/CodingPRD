          CourseEnrollment runs two independent axes on one row: flagging integrity while
          progress_state is SUBMITTED_FOR_AWARD leaves progress_state untouched yet blocks the award
          with ERR_INTEGRITY_HOLD, and clearing the flag resumes the award from the same
