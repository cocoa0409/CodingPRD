            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag3_id}", distributor_id: "${dist_id}", quantity: 5, requested_ship_date: "2026-11-02T00:00:00Z", lot_code: "L-2", expected_price_agreement_version: "${ag3_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o32_id: $.data.id }
            - call: "POST /stewardship/orders/${o31_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${o31_id}/advance"
              payload: {}
              as: Distributor
