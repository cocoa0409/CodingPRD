      - name: coinsurance_rounded_per_line_before_sum
        claim_type: precision
        grounds: [calculations.estimate_patient_responsibility]
        distinguishing_aspect: "Pinned rounding order (per line, then sum): two lines at 100005 cents with 10% coinsurance produce 10001 + 10001 = 20002; the aggregate-rounding trap (round once on 200010) would produce 20001."
        test_recipe:
          setup:
            - "Charge items 90010 and 90011; contract ACME bundling NONE with both rates 100005 from 2026-01-01"
            - "Patient with snapshot (ded 0/0, oop 99999999/0, coins 10); case service 2026-08-20; DRAFT INSURED estimate [90010 x1, 90011 x1]"
