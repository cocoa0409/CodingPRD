        grounds:
          - errors[ERR_TEACHER_CASELOAD_EXCEEDED]
          - calculations.teacher_committed_minutes
          - calculations.assignment_minute_allocation
        distinguishing_aspect: |
          The caseload rule aggregates committed_weekly_minutes plus the allocation the accepting row
          would receive: a SUPPORT row worth 115 minutes is refused for a teacher capped at 100 with
          ERR_TEACHER_CASELOAD_EXCEEDED, while a teacher capped at exactly 115 is admitted because
          the comparison is <=.
