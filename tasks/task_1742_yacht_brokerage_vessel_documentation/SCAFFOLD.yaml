    description: "Reopen an APPROVED statement for rebalancing"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["statement.status = BALANCED", "re-runs all calculations", "increments statement.version by 1"]
  - method: POST
    path: "/yacht/closing-statements/{id}/void"
    description: "Void a DRAFT or BALANCED statement"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["statement.status = VOIDED", "attached TaxAssessment rows -> VOIDED"]
  - method: POST
    path: "/yacht/closing-statements/{id}/disburse"
    description: "Final disbursement; closes offer and listing; records title transfer"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["statement.status = DISBURSED", "offer.status = CLOSED", "listing.status = CLOSED", "TitleTransfer.status = RECORDED", "TaxAssessment rows -> FILED", "increments statement.version by 1"]
  - method: GET
    path: "/yacht/closing-statements/{id}/tax-assessments"
    description: "List tax assessments attached to a statement"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: TaxAssessment[]
    side_effects: []
  - method: POST
    path: "/yacht/closing-statements/{id}/title-transfers"
    description: "Draft a title transfer with warranty-of-title election"
    roles: [ClosingOfficer]
    code: 201
    input: [vessel_id, from_client_id, to_client_id, warranty_of_title]
    output: TitleTransfer
    side_effects: ["transfer.status = DRAFT"]
  - method: GET
    path: "/yacht/title-transfers/{id}"
    description: "Fetch one title transfer"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: TitleTransfer
    side_effects: []
  - method: GET
    path: "/yacht/title-transfers"
    description: "List title transfers with filters"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: ['closing_statement_id?', 'vessel_id?', 'from_client_id?', 'to_client_id?', 'status?', 'limit?', 'offset?']
    output: TitleTransfer[]
    side_effects: []
  - method: POST
    path: "/yacht/title-transfers/{id}/execute"
    description: "Execute signatures on the transfer instrument"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: TitleTransfer
    side_effects: ["transfer.status = EXECUTED", "sets executed_at"]
  - method: POST
    path: "/yacht/title-transfers/{id}/revoke"
    description: "Revoke an executed transfer before disbursement"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: TitleTransfer
    side_effects: ["transfer.status = REVOKED"]
  - method: GET
    path: "/yacht/domain-events"
    description: "Audit log query"
    roles: [PlatformAdmin]
    code: 200
    input: ['aggregate_type?', 'aggregate_id?', 'limit?', 'offset?']
    output: DomainEvent[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock (test-driving endpoint). Default startup clock is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the clock reads this fixed default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs system clock sweeps: listing expiry, offer expiry, contingency expiry"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per RBAC"
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Same actor role attempting both build and approve steps on a ClosingStatement"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, enum out of range, or field type mismatch"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource state does not permit requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current version (OCC)"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violation: duplicate HIN, duplicate active listing for vessel, or duplicate closing statement for offer"
  - id: ERR_DOC_MODE_MISMATCH
    http: 422
    condition: "uscg_official_no / state_title_no inconsistent with documentation_mode"
  - id: ERR_INVALID_DEADLINE
    http: 422
    condition: "Deadline not in the future, or end_date not after start_date"
  - id: ERR_DEADLINE_PASSED
    http: 422
    condition: "Acceptance/contingency deadline elapsed at request time"
  - id: ERR_LIEN_INSTRUMENT_MISMATCH
    http: 422
    condition: "PREFERRED_MORTGAGE recorded on STATE-titled vessel"
  - id: ERR_LISTING_NOT_ACCEPTING
    http: 409
    condition: "Offer attempted on listing not in ACTIVE (or kick-out eligible UNDER_CONTRACT)"
  - id: ERR_TITLE_ENCUMBERED
    http: 422
    condition: "FULL warranty of title attempted while vessel.liens_status == ENCUMBERED"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "DEPOSIT amount below required_deposit_cents"
  - id: ERR_DEPOSIT_EXCESSIVE
    http: 422
    condition: "DEPOSIT amount exceeds 2x required_deposit_cents (anti-structuring)"
  - id: ERR_ESCROW_NOT_CLEARED
    http: 409
    condition: "Release/refund/forfeit attempted on non-CLEARED escrow entry"
  - id: ERR_LIENS_OUTSTANDING
    http: 422
    condition: "Disbursement attempted while vessel.liens_status == ENCUMBERED"
  - id: ERR_SYNDICATION_STALE_PRICE
    http: 422
    condition: "Syndication push price != current list price, or listing not ACTIVE"
  - id: ERR_CONTINGENCY_UNRESOLVED
    http: 409
    condition: "Closing build/disburse attempted with contingencies outside {SATISFIED, WAIVED}"
  - id: ERR_OFFER_NOT_ACCEPTED
    http: 409
    condition: "Closing statement created for offer not in ACCEPTED"
  - id: ERR_WATERFALL_SHORTFALL
    http: 422
    condition: "Lien payoff pool insufficient — a lien would remain PARTIALLY_SATISFIED; disbursement blocked"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator; registers brokerages, agents, clients; reads everything; drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /yacht/brokerages"
      - "POST /yacht/agents"
      - "POST /_clock/set_current_utc"
      - "GET /yacht/domain-events"
    shared_operations:
      - "GET reads across all resources"
      - "POST /yacht/clients"
      - "POST /yacht/vessels"
  - name: ListingAgent
    description: "Seller-side broker agent; owns listings, counters/accepts/rejects offers, approves closing statements, records liens"
    identity: "entity_backed:BrokerAgent"
    exclusive_operations:
      - "POST /yacht/listings and listing lifecycle actions (activate, suspend, cancel, price)"
      - "POST /yacht/listings/{id}/syndication-events"
      - "POST /yacht/offers/{id}/accept, reject"
      - "POST /yacht/contingencies/{id}/renegotiate"
      - "POST /yacht/closing-statements/{id}/approve"
      - "POST /yacht/escrow-entries/{id}/forfeit"
    shared_operations:
      - "POST /yacht/clients"
      - "POST /yacht/vessels and PUT /yacht/vessels/{id}"
      - "POST /yacht/vessels/{id}/liens and /release"
      - "POST /yacht/vessels/{id}/documentation-records"
      - "POST /yacht/offers/{id}/counter (seller-side counter)"
      - "GET reads across all resources"
  - name: SellingAgent
    description: "Buyer-side broker agent; submits offers, counters, withdraws, drives contingency outcomes, fails offers"
    identity: "entity_backed:BrokerAgent"
    exclusive_operations:
      - "POST /yacht/offers"
      - "POST /yacht/offers/{id}/withdraw, fail"
      - "POST /yacht/contingencies/{id}/satisfy, waive, object"
    shared_operations:
      - "POST /yacht/clients"
      - "POST /yacht/offers/{id}/counter (buyer-side counter-of-counter)"
      - "GET reads across all resources"
  - name: ClosingOfficer
    description: "Settlement officer; builds/approves-adjacent closing statements, disburses, executes title transfers; segregated from ListingAgent approval"
    identity: "opaque"
    exclusive_operations:
      - "POST /yacht/closing-statements and build/reopen/void/disburse"
      - "POST /yacht/closing-statements/{id}/title-transfers"
      - "POST /yacht/title-transfers/{id}/execute, revoke"
      - "POST /yacht/escrow-entries/{id}/release"
    shared_operations:
      - "POST /yacht/vessels/{id}/liens and /release"
      - "POST /yacht/vessels/{id}/documentation-records"
      - "GET reads across all resources"
  - name: EscrowOfficer
    description: "Trust-account operator; records, clears, voids, and refunds escrow entries; segregated from release (ClosingOfficer) and forfeit (ListingAgent)"
    identity: "opaque"
    exclusive_operations:
      - "POST /yacht/offers/{id}/escrow-entries"
      - "POST /yacht/escrow-entries/{id}/clear, void, refund"
    shared_operations:
      - "GET reads across all resources"
