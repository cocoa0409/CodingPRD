  # ===========================================================================
  - section: calculations
    instances:
      - name: estimate_already_approved_blocks_second_approval
        claim_type: Correct Result
        grounds:
          - state_machines.ScopeEstimate.DRAFT_to_APPROVED
          - errors[ERR_ESTIMATE_ALREADY_APPROVED]
        distinguishing_aspect: "When two DRAFT estimates exist on different jobs of one claim is not possible (claim settles); within one job a second DRAFT supersedes the first, so ERR_ESTIMATE_ALREADY_APPROVED arises only across jobs — here a second job's estimate approval after the claim settled returns ERR_CLAIM_ALREADY_SETTLED, while ERR_ESTIMATE_ALREADY_APPROVED guards a single job that already has an APPROVED estimate via a re-drafted estimate."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / estimate_approve_requires_claim_open
          rationale: "The claim-settled / double-approval interaction is exercised by the named §1.8 instance which drives a settled claim and a second approval attempt."

      - name: equipment_sizing_fire_job_uses_class2
        claim_type: Constants Applied
        grounds:
          - calculations.chamber_equipment_sizing
          - entities.DryingChamber.fields.air_movers_required
        distinguishing_aspect: "A FIRE job (no water_class) sizes chambers at class 2: 300 sqft, 0 wall, dehu 70 => air_movers_required=5, dehumidifiers_required=5."
        test_recipe:
          setup: ["A FIRE job; one chamber R1 floor_area_sqft=300, wet_wall_linear_ft=0, dehu 70."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC16", peril: "FIRE", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
