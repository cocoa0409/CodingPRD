              captures: { err_id2: $.data.error_id }
          assert:
            - "${s1_status} == ACTIVE"
            - "${lic_v1} > ${lic_v0} (the S1 write bumped the parent licence version)"
            - "${err_id} == ERR_STALE_LICENSE_VERSION with HTTP 412 - the priority-10 state rule
               wins over the priority-29 temporal rule that the same request also violates"
            - "${err_id2} == ERR_SPONSORSHIP_PERIOD_OVERLAP with HTTP 409 - with a fresh version
               the request gets past the OCC gate and the back-dating is then rejected, proving
               both rules were genuinely violated by the first call"
