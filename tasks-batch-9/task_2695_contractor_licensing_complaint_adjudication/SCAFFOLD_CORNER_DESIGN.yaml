              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
              captures: { first_status: $.data.status }
          trigger:
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
          assert:
            - "${first_status} == INVESTIGATION"
            - "response http status == 409"
            - "response error_id == ERR_COMPLAINT_STATE_INVALID"
            - "Complaint.${cmp_id}.status == INVESTIGATION"
            - "Complaint.${cmp_id}.jurisdiction_basis == UNLICENSED_PRACTICE"
            - "Complaint.${cmp_id}.mediation_round_count == 0"
            - "Complaint.${cmp_id}.mediation_deadline == null"

      - name: corner_withdrawing_a_dismissed_complaint_is_refused
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Complaint.terminal_states
          - state_machines.Complaint.RECEIVED_to_DISMISSED_NO_JURISDICTION
          - errors[ERR_COMPLAINT_STATE_INVALID]
        distinguishing_aspect: "DISMISSED_NO_JURISDICTION is a terminal state: the consumer's own withdraw request — permitted only from RECEIVED, MEDIATION or INVESTIGATION — returns ERR_COMPLAINT_STATE_INVALID (409) and the dismissal_reason survives."
        test_recipe:
          setup:
            - "clock at 2026-08-01, one complaint screened REJECTED into DISMISSED_NO_JURISDICTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Terry Terminal", contact_email: "terry@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "Out Of State Roofing", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Roof work performed in another state" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "REJECTED", rejection_reason: "OUT_OF_STATE_WORK" }
              as: LicensingAnalyst
              captures: { dismissed_status: $.data.status }
          trigger:
            - call: "POST /licensing/complaints/${cmp_id}/withdraw"
              payload: {}
              as: Consumer
              as_user_id: "${con_id}"
          assert:
            - "${dismissed_status} == DISMISSED_NO_JURISDICTION"
            - "response http status == 409"
            - "response error_id == ERR_COMPLAINT_STATE_INVALID"
            - "Complaint.${cmp_id}.status == DISMISSED_NO_JURISDICTION"
            - "Complaint.${cmp_id}.dismissal_reason == OUT_OF_STATE_WORK"
            - "Complaint.${cmp_id}.jurisdiction_basis == null"

      - name: corner_deciding_a_hearing_before_it_convenes_is_refused
