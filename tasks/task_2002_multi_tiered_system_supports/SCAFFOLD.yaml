# =============================================================================
# PRD Benchmark Scaffold — Multi-Tiered System of Supports (MTSS/RTI)
# =============================================================================

scenario: |
  2002. Multi-Tiered System of Supports (MTSS/RTI): universal screening windows
  & benchmark cut points, tier assignment & intervention catalog matching,
  progress monitoring frequency & data decision rules, intervention fidelity
  checks, team meeting cadence & tier movement decisions, referral to
  special-education evaluation trigger, resource/interventionist scheduling
  capacity, outcome reporting by subgroup.

domain_name: multi-tiered-system-supports
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # interventionist capacity & student caseloads are finite
  secondary_archetype: compliance_audit      # fidelity mandates, special-ed referral timing, cooling-off
  complexity_layers:
    - rate_threshold_triggers                # benchmark cut points, slope thresholds, weeks-unresponsive trigger
    - cascading_side_effects                 # tier movement → intervention plan churn → capacity release
    - derived_field_reconciliation           # subgroup aggregates, district outcome reports re-derived on write
    - optimistic_concurrency                 # OCC on StudentPlan version guards tier-movement writes
  entity_topology: hierarchical              # District → School → Student → Plan → Probe/Session
  state_machine_shape: branching             # tier movement + screening window fork + referral branch
  relationship_patterns:
    - one_to_many                            # School→Student→Plan
    - many_to_many                           # StudentPlan ↔ Interventionist via InterventionAssignment
    - cross_aggregate                        # Interventionist referenced from StudentPlan under a different School (rare, allowed for shared staff)
  role_model: approval_chain                 # Coordinator proposes tier move, TeamLead ratifies, SpEdDirector approves referral
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: academic_year, type: string, source: input, description: "e.g. '2025-2026'" }
      - { name: sped_referral_min_weeks, type: integer, source: input, default: 12, description: "Min weeks of unresponsiveness at Tier 3 before sped referral is permitted" }
      - { name: fidelity_threshold_pct, type: integer, source: input, default: 80, description: "Min acceptable intervention fidelity (percent) for a plan to count as 'delivered'" }

  - name: School
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; owning district" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: grade_span_low, type: integer, source: input, description: "Lowest grade served, 0=K" }
      - { name: grade_span_high, type: integer, source: input, description: "Highest grade served" }

  - name: ScreeningWindow
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id" }
      - { name: window_kind, type: enum, source: input, description: "FALL | WINTER | SPRING" }
      - { name: opens_on, type: string, source: input, description: "ISO date the window opens (inclusive)" }
      - { name: closes_on, type: string, source: input, description: "ISO date the window closes (inclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → OPEN → CLOSED → SCORED" }
      - { name: screened_student_count, type: integer, source: computed, description: "Number of ScreeningScore records in this window" }

  - name: BenchmarkCutPoint
    parent: School
    common_fields: false  # immutable reference data; updates create a new cut point
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id" }
      - { name: window_kind, type: enum, source: input, description: "FALL | WINTER | SPRING this cut applies to" }
      - { name: grade_level, type: integer, source: input, description: "Grade this cut applies to (0-12)" }
      - { name: subject, type: enum, source: input, description: "READING | MATH" }
      - { name: tier2_max_score, type: integer, source: input, description: "Score <= this places student at Tier 2 candidacy" }
      - { name: tier3_max_score, type: integer, source: input, description: "Score <= this places student at Tier 3 candidacy (must be < tier2_max_score)" }

  - name: Student
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: grade_level, type: integer, source: input, description: "0=K … 12" }
      - { name: subgroup_codes, type: array, source: input, default: [], description: "Subset of {ELL, FRL, IEP, BLACK, HISPANIC, WHITE, ASIAN, MULTI}; used for outcome reporting" }
      - { name: current_tier, type: enum, source: computed, default: "TIER_1", description: "TIER_1 | TIER_2 | TIER_3; derived from the latest ratified TierMovement or, if none, TIER_1" }
      - { name: weeks_at_tier3_unresponsive, type: integer, source: computed, default: 0, description: "Consecutive weekly probes at TIER_3 whose slope_decision was NON_RESPONSIVE; reset on tier move or RESPONSIVE probe" }

  - name: ScreeningScore
    parent: ScreeningWindow
    common_fields: false  # append-only scorecard; corrections create a superseding row
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> ScreeningWindow.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: subject, type: enum, source: input, description: "READING | MATH" }
      - { name: raw_score, type: integer, source: input, description: "Screener raw score" }
      - { name: risk_band, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 from BenchmarkCutPoint comparison" }

  - name: InterventionCatalogEntry
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id" }
      - { name: title, type: string, source: input, description: "Program name, e.g. 'Read Naturally'" }
      - { name: subject, type: enum, source: input, description: "READING | MATH" }
      - { name: tier_target, type: enum, source: input, description: "TIER_2 | TIER_3" }
      - { name: grade_min, type: integer, source: input, description: "Min grade this entry serves" }
      - { name: grade_max, type: integer, source: input, description: "Max grade this entry serves" }
      - { name: session_minutes, type: integer, source: input, description: "Length of one delivered session" }
      - { name: sessions_per_week, type: integer, source: input, description: "Expected sessions per week (used for fidelity calc)" }
      - { name: probe_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY — how often progress probes are due" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Only active entries are eligible for new plan matching" }

  - name: Interventionist
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; primary school assignment" }
      - { name: full_name, type: string, source: input, description: "Interventionist name" }
      - { name: weekly_minute_capacity, type: integer, source: input, description: "Total minutes per week available for direct service" }
      - { name: committed_minutes_per_week, type: integer, source: computed, default: 0, description: "Sum of weekly demand across non-terminal InterventionAssignments; ledger kept consistent on assignment/exit" }
      - { name: subjects, type: array, source: input, description: "Subset of {READING, MATH} this interventionist can serve" }

  - name: StudentPlan
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: catalog_entry_id, type: string, source: input, description: "FK -> InterventionCatalogEntry.id; selected intervention" }
      - { name: interventionist_id, type: string, source: input, description: "FK -> Interventionist.id" }
      - { name: tier_at_start, type: enum, source: system, description: "TIER_2 | TIER_3 — copied from Student.current_tier at plan start" }
      - { name: started_on, type: string, source: system, description: "ISO date of plan activation" }
      - { name: weekly_minute_cost, type: integer, source: computed, description: "session_minutes * sessions_per_week from catalog entry at activation; pinned on plan to avoid catalog edits rewriting history" }
      - { name: probe_due_on, type: string, source: computed, description: "ISO date the next ProgressProbe is due, advanced by probe_frequency on each probe" }
      - { name: fidelity_pct, type: integer, source: computed, default: 100, description: "Rolling percent of scheduled InterventionSessions that were DELIVERED; floor 0, cap 100, integer truncation" }
      - { name: status, type: enum, source: system, description: "ACTIVE → PAUSED | EXIT_RESPONSIVE | EXIT_MOVED | EXIT_SPED_REFERRAL | EXIT_NO_PROGRESS | CANCELLED" }

  - name: ProgressProbe
    parent: StudentPlan
    common_fields: false  # append-only measurement; corrections supersede via new probe
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> StudentPlan.id" }
      - { name: administered_on, type: string, source: input, description: "ISO date probe was administered" }
      - { name: score, type: integer, source: input, description: "Probe raw score" }
      - { name: aimline_score, type: integer, source: computed, description: "Expected score at this probe per plan aimline (linear from plan start baseline to goal)" }
      - { name: slope_decision, type: enum, source: computed, description: "RESPONSIVE | NON_RESPONSIVE — based on probe slope vs aimline slope over the trailing 4 probes (or fewer if plan is young)" }

  - name: InterventionSession
    parent: StudentPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> StudentPlan.id" }
      - { name: scheduled_on, type: string, source: input, description: "ISO date of scheduled session" }
      - { name: minutes, type: integer, source: input, description: "Scheduled minutes; must equal catalog session_minutes at plan activation" }
      - { name: outcome, type: enum, source: input, description: "DELIVERED | STUDENT_ABSENT | STAFF_ABSENT | CANCELLED" }

  - name: TierMovement
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: from_tier, type: enum, source: system, description: "TIER_1 | TIER_2 | TIER_3 — copied from student at proposal" }
      - { name: to_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale" }
      - { name: decided_at_meeting_id, type: string, source: system, description: "FK -> TeamMeeting.id once ratified; null while PROPOSED" }
      - { name: status, type: enum, source: system, description: "PROPOSED → RATIFIED | REJECTED | SUPERSEDED" }

  - name: TeamMeeting
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id" }
      - { name: scheduled_on, type: string, source: input, description: "ISO date of meeting" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → CONVENED → MINUTED" }
      - { name: minuted_movement_count, type: integer, source: computed, default: 0, description: "TierMovement rows ratified at this meeting; incremented on ratify" }

  - name: SpedReferral
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: triggered_plan_id, type: string, source: system, description: "FK -> StudentPlan.id — the TIER_3 plan whose weeks-at-Tier-3-unresponsive counter hit the district minimum" }
      - { name: consent_received_on, type: string, source: input, description: "ISO date parent consent was received; null while PENDING_CONSENT" }
      - { name: evaluation_due_on, type: string, source: computed, description: "consent_received_on + 60 calendar days" }
      - { name: status, type: enum, source: system, description: "PENDING_CONSENT → CONSENTED → EVAL_IN_PROGRESS → ELIGIBLE | NOT_ELIGIBLE | WITHDRAWN" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningWindow
    initial_state: SCHEDULED
    terminal_states: [SCORED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (auto when clock reaches opens_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (auto when clock passes closes_on) or POST .../close"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: SCORED
        trigger: POST /districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}/score
        actor: DistrictCoordinator
        preconditions:
          - "Every ScreeningScore in this window has a risk_band computed (always true once score is created — closed loop)"
        side_effects:
          - "For each Student at this School whose latest risk_band is TIER_2 or TIER_3 and current_tier == TIER_1: auto-create a TierMovement (status=PROPOSED, from=TIER_1, to=band)"
          - "window.status → SCORED"

  - entity: StudentPlan
    initial_state: ACTIVE
    terminal_states: [EXIT_RESPONSIVE, EXIT_MOVED, EXIT_SPED_REFERRAL, EXIT_NO_PROGRESS, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/pause
        actor: InterventionistRole
        preconditions:
          - "Student.current_tier == StudentPlan.tier_at_start"
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: PAUSED
        to: ACTIVE
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/resume
        actor: InterventionistRole
        preconditions:
          - "Interventionist has at least weekly_minute_cost minutes of headroom (capacity re-check on resume)"
        side_effects:
          - "Increment Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: ACTIVE
        to: EXIT_RESPONSIVE
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/exit
        actor: TeamLead
        preconditions:
          - "Latest ProgressProbe.slope_decision == RESPONSIVE"
          - "Plan has at least 4 ProgressProbes"
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
          - "Auto-create TierMovement (status=PROPOSED, from=plan.tier_at_start, to=TIER_1 if tier_at_start==TIER_2 else TIER_2)"
      - from: ACTIVE
        to: EXIT_MOVED
        trigger: "system (cascade when a TierMovement ratifying this student to a different non-TIER_1 tier is minuted)"
        actor: system
        preconditions:
          - "TierMovement.status transitioned to RATIFIED for the same student"
          - "TierMovement.to_tier != StudentPlan.tier_at_start"
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: ACTIVE
        to: EXIT_SPED_REFERRAL
        trigger: "system (cascade when SpedReferral is created for this student while plan is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: ACTIVE
        to: EXIT_NO_PROGRESS
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/exit
        actor: TeamLead
        preconditions:
          - "Latest 4 ProgressProbes all NON_RESPONSIVE"
          - "weeks_at_tier3_unresponsive < district.sped_referral_min_weeks (otherwise referral flow must be used instead)"
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/cancel
        actor: TeamLead
        preconditions:
          - "No ProgressProbe exists yet on this plan"
        side_effects:
          - "Decrement Interventionist.committed_minutes_per_week by plan.weekly_minute_cost"
      - from: PAUSED
        to: CANCELLED
        trigger: POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/cancel
        actor: TeamLead
        preconditions: []
        side_effects: []

  - entity: TierMovement
    initial_state: PROPOSED
    terminal_states: [RATIFIED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: RATIFIED
        trigger: POST /districts/{d}/schools/{s}/team-meetings/{m}/ratify
        actor: TeamLead
        preconditions:
          - "TeamMeeting.status == CONVENED"
          - "TierMovement.status == PROPOSED"
          - "No other PROPOSED TierMovement exists for the same student created later than this one (otherwise that one supersedes)"
        side_effects:
          - "Student.current_tier := to_tier"
          - "If to_tier == TIER_1: Student.weeks_at_tier3_unresponsive := 0"
          - "Cascade: any ACTIVE StudentPlan for the student with tier_at_start != to_tier → EXIT_MOVED"
          - "Other PROPOSED TierMovements for the same student → SUPERSEDED"
          - "TeamMeeting.minuted_movement_count += 1"
      - from: PROPOSED
        to: REJECTED
        trigger: POST /districts/{d}/schools/{s}/team-meetings/{m}/reject
        actor: TeamLead
        preconditions:
          - "TeamMeeting.status == CONVENED"
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (when a different TierMovement for the same student is ratified, or when a newer TierMovement is proposed for the same student while this one is still PROPOSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TeamMeeting
    initial_state: SCHEDULED
    terminal_states: [MINUTED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: POST /districts/{d}/schools/{s}/team-meetings/{m}/convene
        actor: TeamLead
        preconditions: []
        side_effects: []
      - from: CONVENED
        to: MINUTED
        trigger: POST /districts/{d}/schools/{s}/team-meetings/{m}/minute
        actor: TeamLead
        preconditions:
          - "All PROPOSED TierMovements submitted to this meeting have been ratified or rejected (no PROPOSED rows remain with decided_at_meeting_id == this meeting)"
        side_effects: []

  - entity: SpedReferral
    initial_state: PENDING_CONSENT
    terminal_states: [ELIGIBLE, NOT_ELIGIBLE, WITHDRAWN]
    transitions:
      - from: PENDING_CONSENT
        to: CONSENTED
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/record-consent
        actor: SpEdDirector
        preconditions: []
        side_effects:
          - "evaluation_due_on := consent_received_on + 60 days"
      - from: CONSENTED
        to: EVAL_IN_PROGRESS
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/start-evaluation
        actor: SpEdDirector
        preconditions: []
        side_effects: []
      - from: EVAL_IN_PROGRESS
        to: ELIGIBLE
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/determine
        actor: SpEdDirector
        preconditions: []
        side_effects:
          - "Append IEP to Student.subgroup_codes if absent (does NOT auto-exit the MTSS tier system; student can be dual-served)"
      - from: EVAL_IN_PROGRESS
        to: NOT_ELIGIBLE
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/determine
        actor: SpEdDirector
        preconditions: []
        side_effects: []
      - from: PENDING_CONSENT
        to: WITHDRAWN
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/withdraw
        actor: SpEdDirector
        preconditions: []
        side_effects: []
      - from: CONSENTED
        to: WITHDRAWN
        trigger: POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/withdraw
        actor: SpEdDirector
        preconditions: []
        side_effects: []

  # Parallel-dimension machine: Student.current_tier is computed from ratified
  # TierMovements, while Student.weeks_at_tier3_unresponsive is computed from
  # ProgressProbe.slope_decision sequences. Both update the same Student row
  # but on independent triggers (Rule 3 instance: parallel dimensions).

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: tier-move-ratify-stale-student
    parent_entity: Student
    write_endpoint: "POST /districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}/ratify"
    occ_field: "expected_student_version"
    description: |
      Ratifying a TierMovement against a Student whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has ratified a different movement for the same student
      (bumping Student.version via current_tier update) and the current
      writer's view of the student is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-exit-stale-plan
    parent_entity: StudentPlan
    write_endpoint: "POST /districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/exit"
    occ_field: "expected_plan_version"
    description: |
      Exiting a StudentPlan whose version has advanced since the client last
      observed it is rejected. Captures the case where a system cascade
      (TierMovement ratification) has already moved the plan to EXIT_MOVED,
      advancing plan.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant (Rule 1 instance 1): risk band classification ---
  - name: risk_band_classification
    trigger: "on ScreeningScore creation"
    algorithm: threshold
    formula: |
      Inputs: raw_score, window's BenchmarkCutPoint matching (school, window.window_kind, student.grade_level, subject).

      Variant A (CUT_SCORE variant, the default):
        if raw_score <= cut.tier3_max_score: risk_band = TIER_3
        elif raw_score <= cut.tier2_max_score: risk_band = TIER_2
        else: risk_band = TIER_1

      Variant B (PERCENTILE variant, used when District flag `use_percentile_norms` is true — currently NOT enabled; kept for downstream variant test):
        Norm all ScreeningScore.raw_scores for (school, window_kind, grade, subject) cohort.
        bottom 10% → TIER_3; next 15% (10-25th pctile) → TIER_2; else TIER_1.
        Percentile uses rank/(N+1) * 100 with rank assigned by created_at ASC tie-break.

      The default CUT_SCORE variant is what the API returns; PERCENTILE is computed
      only when a district explicitly opts in via a future feature flag.
    constants:
      TIER3_PCTILE: 10
      TIER2_PCTILE: 25
    precision: "integer percentiles, truncation toward zero"
    variants:
      - name: cut_score
        when: "default; used in production"
        difference: "uses fixed cut.tier2_max_score / cut.tier3_max_score integer thresholds"
      - name: percentile
        when: "district opts into percentile norms"
        difference: "same ScreeningScore data, but uses rank-based thresholds; identical inputs can produce different risk_band than cut_score"

  # --- Dual-variant (Rule 1 instance 2): progress responsiveness ---
  - name: slope_decision
    trigger: "on ProgressProbe creation"
    algorithm: weighted_scoring
    formula: |
      Consider the trailing min(4, N) probes of the plan (including the new one), ordered by administered_on ASC, created_at ASC as tie-break.

      Variant SLOPE (default):
        Fit least-squares slope b over the trailing window's scores (x = probe index 0..k-1).
        Fit aimline slope a over the same window's aimline_score values.
        slope_decision = RESPONSIVE if b >= a else NON_RESPONSIVE

      Variant ENDPOINT (alternative decision rule some districts use):
        slope_decision = RESPONSIVE if latest.score >= latest.aimline_score else NON_RESPONSIVE

      Both variants consume identical trailing-window data and may produce
      different slope_decision values on the same probes — e.g., a student on
      a rising trajectory whose latest probe still falls below aimline is
      RESPONSIVE under SLOPE but NON_RESPONSIVE under ENDPOINT.

      The default SLOPE variant is what the API persists.
    precision: "slopes kept as rational (no rounding); comparison b >= a is exact rational comparison"
    variants:
      - name: slope
        when: "default; MTSS/RTI standard"
        difference: "regression slope of trailing window compared to aimline slope"
      - name: endpoint
        when: "alternative rule"
        difference: "only the latest probe score vs aimline is compared"

  # --- Combinatorial (Rule 2a): tier recommendation / movement eligibility ---
  - name: tier_movement_eligibility
    trigger: "POST /districts/{d}/schools/{s}/students/{st}/tier-movements (proposal validation)"
    algorithm: threshold
    formula: |
      Inputs: (1) student.current_tier, (2) latest ScreeningScore.risk_band across all subjects
      in the most recent SCORED window for the school, (3) weeks_at_tier3_unresponsive,
      (4) existence of ACTIVE StudentPlan.

      # Mode (a): ≥3 inputs with non-linear interaction / conditional branching
      if student.current_tier == TIER_1:
        if latest_band in {TIER_2, TIER_3}:
          proposed to_tier MUST equal latest_band (cannot skip from TIER_1 to TIER_3 if band is TIER_2)
        else:
          reject ERR_TIER_MOVE_NOT_INDICATED (no screening evidence)
      elif student.current_tier == TIER_2:
        if to_tier == TIER_1:
          require plan exited EXIT_RESPONSIVE (latest slope_decision == RESPONSIVE AND probe count >= 4)
        elif to_tier == TIER_3:
          require latest_band == TIER_3 OR (latest 4 probes NON_RESPONSIVE AND ACTIVE plan exists)
        else: reject ERR_INVALID_TIER_MOVE
      elif student.current_tier == TIER_3:
        if to_tier == TIER_1:
          reject ERR_TIER_SKIP_NOT_ALLOWED (must step down via TIER_2)
        elif to_tier == TIER_2:
          require latest slope_decision == RESPONSIVE AND weeks_at_tier3_unresponsive < district.sped_referral_min_weeks
        else: reject ERR_INVALID_TIER_MOVE

  # --- Combinatorial (Rule 2b): fidelity percentage rounding ---
  - name: fidelity_pct
    trigger: "on InterventionSession creation"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters. Scaffold pins ONE order.
      Let S = all InterventionSession rows for the plan ordered by scheduled_on ASC, created_at ASC.
      Let D = count(S where outcome == DELIVERED).
      Let N = count(S).
      Step 1: per-week fidelity W_i = floor(D_i * 100 / N_i) for each ISO week i (integer truncation).
      Step 2: plan.fidelity_pct = floor(sum(W_i) / count(weeks with at least one scheduled session)).
      The rounding order is per-week-then-average (NOT average-then-round); this is load-bearing
      because it loses fractions differently than a naive single division.
    precision: "integer percent, floor (truncation toward zero) at BOTH steps"
    note: "Rounds per-week then averages; do NOT compute D*100/N directly."

  # --- Combinatorial (Rule 2c): subgroup outcome aggregation with circular-looking dependency ---
  - name: subgroup_outcome_index
    trigger: "GET /districts/{d}/outcome-report?window_id=... (computed on read)"
    algorithm: aggregation
    formula: |
      # Mode (c): circular-looking dependency — pins evaluation order.
      For each subgroup G in {ELL, FRL, IEP, BLACK, HISPANIC, WHITE, ASIAN, MULTI}:
        Let Students_G = students at the district where G ∈ subgroup_codes.
        Let at_risk_G = those whose latest risk_band in the target window ∈ {TIER_2, TIER_3}.
        Let moved_up_G = at_risk_G whose current_tier today is strictly lower-risk than their risk_band
                         (TIER_2 band → now TIER_1, or TIER_3 band → now TIER_1 or TIER_2).
        Let denominator_G = max(1, |at_risk_G|)              # pinned: zero cohort yields 0, not NaN
        Let numerator_G = |moved_up_G|
        Let raw_index_G = numerator_G * 100 / denominator_G
        # Tiered amplification: districts with <30 students in G get a small-cohort penalty.
        Let size_penalty_G = 0 if |Students_G| >= 30 else 5
        # evaluation order pinned: apply size penalty BEFORE final rounding, NOT after.
        Let adjusted_G = raw_index_G - size_penalty_G
        subgroup_outcome_index[G] = max(0, floor(adjusted_G))
    precision: "integer percent, floor after penalty"
    note: "Evaluation order: raw_index → size_penalty subtraction → floor → max(0, .)."

  # --- Capacity check ---
  - name: interventionist_capacity_check
    trigger: "POST .../plans (creation) and POST .../plans/{id}/resume"
    algorithm: aggregation
    formula: |
      proposed_committed = interventionist.committed_minutes_per_week + plan.weekly_minute_cost
      if proposed_committed > interventionist.weekly_minute_capacity:
        reject ERR_CAPACITY_EXCEEDED
      Boundary: capacity is inclusive — proposed_committed == capacity is allowed (uses <= for accept).

  # --- Aimline projection ---
  - name: aimline_score
    trigger: "on ProgressProbe creation"
    algorithm: projection
    formula: |
      baseline = first ScreeningScore.raw_score for (plan.student_id, plan.catalog.subject)
               in the most recent SCORED ScreeningWindow at plan start.
      goal     = BenchmarkCutPoint.tier2_max_score for the student's (grade, subject, current window_kind).
      aimline_score(probe k) = baseline + (goal - baseline) * k / TOTAL_PROBES
      where TOTAL_PROBES is 8 for WEEKLY probe_frequency, 4 for BIWEEKLY.
      k is 1-indexed (first probe is k=1).
    precision: "round half-up to integer"
    constants:
      WEEKLY_PROBES: 8
      BIWEEKLY_PROBES: 4

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path IDs must exist, validated left-to-right: districtId → schoolId → studentId/meetingId/windowId → planId/probeId/referralId"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: existence
    check: "Referenced body FK ids (catalog_entry_id, interventionist_id) must exist AND belong to the same district/school as the request context"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST .../plans"

  - priority: 5
    category: state
    check: "Target resource must be in correct state (window CLOSED for scoring, plan ACTIVE for probes/sessions/exit, meeting CONVENED for ratify, etc.)"
    error_id: "ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_temporal
    check: "ScreeningScore.administered (creation) only allowed while parent ScreeningWindow.status == OPEN and current clock time within [opens_on, closes_on]"
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST .../screening-windows/{id}/scores"

  - priority: 7
    category: business_referential
    check: "Cut point lookup: a BenchmarkCutPoint matching (school, window.window_kind, student.grade_level, subject) MUST exist before a ScreeningScore can be recorded"
    error_id: ERR_CUT_POINT_NOT_DEFINED
    http_status: 422
    applies_to: "POST .../screening-windows/{id}/scores"

  - priority: 8
    category: business_constraint
    check: "Plan matching: catalog_entry.is_active == true AND plan subject ∈ interventionist.subjects AND student.grade_level ∈ [catalog.grade_min, catalog.grade_max] AND catalog.tier_target == student.current_tier"
    error_id: ERR_CATALOG_MISMATCH
    http_status: 422
    applies_to: "POST .../plans"

  - priority: 9
    category: business_constraint
    check: "Tier-movement eligibility rules per calculations.tier_movement_eligibility"
    error_id: "ERR_TIER_MOVE_NOT_INDICATED | ERR_TIER_SKIP_NOT_ALLOWED | ERR_INVALID_TIER_MOVE"
    http_status: 422
    applies_to: "POST .../tier-movements"

  - priority: 10
    category: business_safety
    check: "Sped referral precondition: Student.weeks_at_tier3_unresponsive >= District.sped_referral_min_weeks AND Student.current_tier == TIER_3 AND no other open SpedReferral (PENDING_CONSENT | CONSENTED | EVAL_IN_PROGRESS) exists for this student"
    error_id: ERR_SPED_REFERRAL_PRECONDITION
    http_status: 422
    applies_to: "POST .../sped-referrals"

  - priority: 11
    category: business_fiscal
    check: "Interventionist capacity: proposed_committed <= weekly_minute_capacity (inclusive)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST .../plans, POST .../plans/{id}/resume"

  - priority: 12
    category: business_constraint
    check: "Probe cadence: a new ProgressProbe may only be recorded when the current date is on or after plan.probe_due_on AND plan.status == ACTIVE"
    error_id: ERR_PROBE_NOT_DUE
    http_status: 422
    applies_to: "POST .../plans/{id}/probes"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- District / School ---
  - method: POST
    path: "/districts"
    description: "Create a district"
    roles: [PlatformAdmin]
    code: 201
    input: [name, academic_year, "sped_referral_min_weeks?", "fidelity_threshold_pct?"]
    output: District
    side_effects: []

  - method: GET
    path: "/districts"
    description: "List districts"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "District[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}"
    description: "Get a district"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools"
    description: "List schools in a district (FK reverse-reachability for School.district_id)"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "School[]"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/schools"
    description: "Create a school"
    roles: [PlatformAdmin]
    code: 201
    input: [name, grade_span_low, grade_span_high]
    output: School
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}"
    description: "Get a school"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: School
    side_effects: []

  # --- Screening Windows ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows"
    description: "Create a screening window"
    roles: [DistrictCoordinator]
    code: 201
    input: [window_kind, opens_on, closes_on]
    output: ScreeningWindow
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}"
    description: "Get a screening window"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: ScreeningWindow
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows"
    description: "List screening windows for a school"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ScreeningWindow[]"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}/close"
    description: "Manually close a window before its closes_on"
    roles: [DistrictCoordinator]
    code: 200
    input: []
    output: ScreeningWindow
    side_effects: ["status → CLOSED"]

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}/score"
    description: "Score a closed window; computes risk bands and auto-proposes TierMovements"
    roles: [DistrictCoordinator]
    code: 200
    input: []
    output: ScreeningWindow
    side_effects:
      - "Every ScreeningScore in window: risk_band computed"
      - "Per student with band ∈ {TIER_2, TIER_3} and current_tier == TIER_1: auto-create TierMovement (PROPOSED)"
      - "window.status → SCORED"

  # --- Benchmark Cut Points ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/benchmark-cut-points"
    description: "Define a cut point"
    roles: [DistrictCoordinator]
    code: 201
    input: [window_kind, grade_level, subject, tier2_max_score, tier3_max_score]
    output: BenchmarkCutPoint
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/benchmark-cut-points"
    description: "List cut points"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["window_kind?", "grade_level?", "subject?"]
    output: "BenchmarkCutPoint[]"
    side_effects: []

  # --- Students ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students"
    description: "Enroll a student"
    roles: [DistrictCoordinator, SchoolRegistrar]
    code: 201
    input: [full_name, grade_level, "subgroup_codes?"]
    output: Student
    side_effects: ["current_tier initialized to TIER_1, weeks_at_tier3_unresponsive initialized to 0"]

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}"
    description: "Get a student"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students"
    description: "List students"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "current_tier?", "grade_level?"]
    output: "Student[]"
    side_effects: []

  # --- Screening Scores ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}/scores"
    description: "Record a screening score"
    roles: [DistrictCoordinator, Teacher]
    code: 201
    input: [student_id, subject, raw_score]
    output: ScreeningScore
    side_effects: ["risk_band computed via risk_band_classification (cut_score variant)"]

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/screening-windows/{windowId}/scores"
    description: "List scores in a window"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "student_id?", "subject?"]
    output: "ScreeningScore[]"
    side_effects: []

  # --- Intervention Catalog ---
  - method: POST
    path: "/districts/{districtId}/intervention-catalog"
    description: "Add an intervention catalog entry"
    roles: [DistrictCoordinator]
    code: 201
    input: [title, subject, tier_target, grade_min, grade_max, session_minutes, sessions_per_week, probe_frequency, "is_active?"]
    output: InterventionCatalogEntry
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/intervention-catalog"
    description: "List catalog entries"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "subject?", "tier_target?", "is_active?"]
    output: "InterventionCatalogEntry[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/intervention-catalog/{entryId}"
    description: "Get a catalog entry"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: InterventionCatalogEntry
    side_effects: []

  # --- Interventionists ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/interventionists"
    description: "Add an interventionist"
    roles: [DistrictCoordinator, SchoolRegistrar]
    code: 201
    input: [full_name, weekly_minute_capacity, subjects]
    output: Interventionist
    side_effects: ["committed_minutes_per_week initialized to 0"]

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/interventionists/{interventionistId}"
    description: "Get an interventionist"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: Interventionist
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/interventionists"
    description: "List interventionists"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Interventionist[]"
    side_effects: []

  # --- Student Plans ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans"
    description: "Start an intervention plan"
    roles: [TeamLead, DistrictCoordinator]
    code: 201
    input: [catalog_entry_id, interventionist_id, "expected_student_version"]
    output: StudentPlan
    side_effects:
      - "tier_at_start := Student.current_tier"
      - "weekly_minute_cost := catalog.session_minutes * catalog.sessions_per_week"
      - "Interventionist.committed_minutes_per_week += weekly_minute_cost"
      - "probe_due_on := today + (7 if probe_frequency==WEEKLY else 14) days"
      - "Increments Student.version by 1"

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}"
    description: "Get a plan"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: StudentPlan
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans"
    description: "List plans for a student"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "StudentPlan[]"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/pause"
    description: "Pause an active plan"
    roles: [InterventionistRole, TeamLead]
    code: 200
    input: ["expected_plan_version"]
    output: StudentPlan
    side_effects:
      - "status → PAUSED"
      - "Interventionist.committed_minutes_per_week -= weekly_minute_cost"
      - "Increments StudentPlan.version by 1"

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/resume"
    description: "Resume a paused plan"
    roles: [InterventionistRole, TeamLead]
    code: 200
    input: ["expected_plan_version"]
    output: StudentPlan
    side_effects:
      - "status → ACTIVE"
      - "Capacity re-check (interventionist_capacity_check)"
      - "Interventionist.committed_minutes_per_week += weekly_minute_cost"
      - "Increments StudentPlan.version by 1"

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/exit"
    description: "Exit a plan (EXIT_RESPONSIVE if latest slope_decision RESPONSIVE; else EXIT_NO_PROGRESS if 4 non-responsive probes)"
    roles: [TeamLead]
    code: 200
    input: ["expected_plan_version", "exit_kind"]
    output: StudentPlan
    side_effects:
      - "status → EXIT_RESPONSIVE or EXIT_NO_PROGRESS per exit_kind and preconditions"
      - "Interventionist.committed_minutes_per_week -= weekly_minute_cost"
      - "If EXIT_RESPONSIVE: auto-create TierMovement PROPOSED to lower tier"
      - "Increments StudentPlan.version by 1"

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/cancel"
    description: "Cancel a plan (only when no probes yet, or when PAUSED)"
    roles: [TeamLead]
    code: 200
    input: ["expected_plan_version"]
    output: StudentPlan
    side_effects:
      - "status → CANCELLED"
      - "Interventionist.committed_minutes_per_week -= weekly_minute_cost (only if previously ACTIVE)"
      - "Increments StudentPlan.version by 1"

  # --- Progress Probes ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/probes"
    description: "Record a progress probe"
    roles: [InterventionistRole, Teacher]
    code: 201
    input: [administered_on, score]
    output: ProgressProbe
    side_effects:
      - "aimline_score computed via aimline_score"
      - "slope_decision computed via slope_decision (slope variant)"
      - "If plan.tier_at_start == TIER_3 and slope_decision == NON_RESPONSIVE: Student.weeks_at_tier3_unresponsive += 1"
      - "If slope_decision == RESPONSIVE: Student.weeks_at_tier3_unresponsive := 0"
      - "plan.probe_due_on advanced by probe_frequency"
      - "Auto-create SpedReferral (PENDING_CONSENT) when weeks_at_tier3_unresponsive >= District.sped_referral_min_weeks AND no open referral exists (cascade plan → EXIT_SPED_REFERRAL)"

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/probes"
    description: "List probes for a plan"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProgressProbe[]"
    side_effects: []

  # --- Intervention Sessions (fidelity) ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/sessions"
    description: "Record a scheduled/delivered session"
    roles: [InterventionistRole]
    code: 201
    input: [scheduled_on, minutes, outcome]
    output: InterventionSession
    side_effects: ["plan.fidelity_pct recomputed via fidelity_pct calculation"]

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/plans/{planId}/sessions"
    description: "List sessions for a plan"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "outcome?"]
    output: "InterventionSession[]"
    side_effects: []

  # --- Tier Movements ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/tier-movements"
    description: "Propose a tier movement"
    roles: [Teacher, TeamLead, DistrictCoordinator]
    code: 201
    input: [to_tier, rationale, "expected_student_version"]
    output: TierMovement
    side_effects:
      - "from_tier := Student.current_tier"
      - "Existing PROPOSED TierMovements for the same student → SUPERSEDED"
      - "Increments Student.version by 1"

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/tier-movements"
    description: "List tier movements for a student"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TierMovement[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/tier-movements/{movementId}"
    description: "Get a tier movement"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: TierMovement
    side_effects: []

  # --- Team Meetings ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings"
    description: "Schedule a team meeting"
    roles: [TeamLead]
    code: 201
    input: [scheduled_on]
    output: TeamMeeting
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}"
    description: "Get a team meeting"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: TeamMeeting
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings"
    description: "List team meetings"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TeamMeeting[]"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}/convene"
    description: "Convene a scheduled meeting"
    roles: [TeamLead]
    code: 200
    input: []
    output: TeamMeeting
    side_effects: ["status → CONVENED"]

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}/ratify"
    description: "Ratify a proposed tier movement at this meeting"
    roles: [TeamLead]
    code: 200
    input: [movement_id, "expected_student_version"]
    output: TierMovement
    side_effects:
      - "TierMovement.status → RATIFIED, decided_at_meeting_id := meetingId"
      - "Student.current_tier := to_tier"
      - "Other PROPOSED movements for same student → SUPERSEDED"
      - "ACTIVE plans for student with mismatched tier_at_start → EXIT_MOVED (cascade)"
      - "TeamMeeting.minuted_movement_count += 1"
      - "Increments Student.version by 1"

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}/reject"
    description: "Reject a proposed tier movement"
    roles: [TeamLead]
    code: 200
    input: [movement_id]
    output: TierMovement
    side_effects: ["TierMovement.status → REJECTED"]

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/team-meetings/{meetingId}/minute"
    description: "Mark a meeting as minuted (closes it)"
    roles: [TeamLead]
    code: 200
    input: []
    output: TeamMeeting
    side_effects: ["status → MINUTED"]

  # --- Sped Referrals ---
  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/sped-referrals"
    description: "Open a special-education referral (manual trigger; auto-creation via probe cascade also possible)"
    roles: [TeamLead, SpEdDirector]
    code: 201
    input: []
    output: SpedReferral
    side_effects:
      - "triggered_plan_id := student's current ACTIVE plan"
      - "Plan cascade: ACTIVE plan → EXIT_SPED_REFERRAL"
      - "status := PENDING_CONSENT"

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/sped-referrals/{referralId}"
    description: "Get a referral"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: []
    output: SpedReferral
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/sped-referrals"
    description: "List referrals for a student"
    roles: [PlatformAdmin, DistrictCoordinator, SchoolRegistrar, Teacher, InterventionistRole, TeamLead, SpEdDirector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SpedReferral[]"
    side_effects: []

