            - "step 8: data.settlement_status == 'RECONCILING' and data.final_total_cents == 151876"
            - "GET /rv-marketplace/meter-readings with booking_id == ${booking_id} returns total_count == 3"

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_expected_booking_version_is_rejected_then_the_current_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-booking]
          - endpoints[POST /rv-marketplace/delivery-assignments]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: >-
          The owner's /approve silently bumped the booking from version 1 to 2, so
          an assignment carrying the version read before approval is 412
          ERR_STALE_PARENT_VERSION — and because the guard runs at priority 8, it
          fires BEFORE the campground capacity and window checks; replaying with
          the current version then succeeds and rewrites the quote.
        test_recipe:
          setup: >-
            Full canonical marketplace with a CAMPGROUND_DROPOFF booking created
            (version captured) and then owner-approved (version now one higher).
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_camp
            - *k_booking_dropoff
            - *k_bkd_approve
          trigger:
            - call: "POST /rv-marketplace/delivery-assignments"
              payload:
                booking_id: "${booking_d_id}"
                campground_id: "${camp_id}"
                window_start: "2026-08-29T16:00:00Z"
                window_end: "2026-08-29T17:00:00Z"
                distance_miles: 10
                expected_booking_version: "${booking_d_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /rv-marketplace/delivery-assignments"
              payload:
                booking_id: "${booking_d_id}"
                campground_id: "${camp_id}"
                window_start: "2026-08-29T16:00:00Z"
                window_end: "2026-08-29T17:00:00Z"
                distance_miles: 10
                expected_booking_version: "${booking_d_v} + 1"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { assign_occ_id: "$.data.id" }
          assert:
            - "step 1: response 412 and data.error_id == 'ERR_STALE_PARENT_VERSION'"
            - "after step 1: GET /rv-marketplace/delivery-assignments with booking_id == ${booking_d_id} returns total_count == 0"
            - "after step 1: GET /rv-marketplace/campgrounds/${camp_id} returns data.scheduled_assignment_count == 0"
            - "step 2: response 201 and data.status == 'SCHEDULED' and data.delivery_fee_cents == 15500"
            - "step 2: GET /rv-marketplace/bookings/${booking_d_id} returns data.quoted_total_cents == 157643 and data.version == 3"

      - name: reusing_a_consumed_expected_listing_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[document-create-stale-listing]
          - endpoints[POST /rv-marketplace/vehicle-documents]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: >-
          Two owner devices that both read the listing at version 1 model the
          real race: the first document create consumes version 1 and bumps the
          listing to 2, so the second create replaying version 1 is 412 — the
          listing keeps exactly one document and stays at version 2 until the
          retry with version 2 lands.
        test_recipe:
          setup: "Logical clock pinned, one owner, one DRAFT listing at version 1."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_listing
            - *k_doc_title
          trigger:
            - call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "REGISTRATION"
                expires_on: "2027-06-30"
                image_ref: "s3://docs/reg-race.pdf"
                expected_listing_version: "${listing_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
            - *k_doc_reg
          assert:
            - "step 1: response 412 and data.error_id == 'ERR_STALE_PARENT_VERSION'"
            - "after step 1: GET /rv-marketplace/vehicle-documents with listing_id == ${listing_id} returns total_count == 1"
            - "after step 1: GET /rv-marketplace/listings/${listing_id} returns data.version == 2"
            - "step 2 (same create with expected_listing_version 2): response 201"
            - "after step 2: GET /rv-marketplace/listings/${listing_id} returns data.version == 3, and GET /rv-marketplace/vehicle-documents with listing_id == ${listing_id} returns total_count == 2"

      - name: every_parent_write_increments_the_version_by_exactly_one
        claim_type: optimistic_concurrency
        grounds:
          - entities.Listing.fields.version
          - endpoints[POST /rv-marketplace/vehicle-documents]
          - endpoints[GET /rv-marketplace/listings/{listingId}]
        distinguishing_aspect: >-
          The OCC counter must advance on writes to the parent CAUSED BY child
          creation, one step at a time, and must NOT advance on reads: the
          listing walks 1 → 2 → 3 across two document creates, and three
          interleaved GETs never move it.
        test_recipe:
          setup: "Logical clock pinned, one owner, one DRAFT listing."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_listing
          trigger:
            - call: "GET /rv-marketplace/listings/${listing_id}"
              as: Owner
              as_user_id: "${owner_id}"
            - *k_doc_title
            - call: "GET /rv-marketplace/listings/${listing_id}"
              as: Owner
              as_user_id: "${owner_id}"
            - *k_doc_reg
            - call: "GET /rv-marketplace/listings/${listing_id}"
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "step 1: data.version == 1 and data.inspection_photo_zone_count == 0"
            - "step 3: data.version == 2 (the TITLE upload bumped the parent exactly once)"
            - "step 5: data.version == 3, and GET /rv-marketplace/vehicle-documents with listing_id == ${listing_id} returns total_count == 2"
            - "a repeated GET after step 5 still returns data.version == 3 (reads never bump the counter)"

      - name: five_level_cascade_from_a_single_owner_cancellation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Booking trip_status
          - state_machines.DeliveryAssignment
          - calculations.owner_cancellation_penalty
        excluded_because:
          difficulty_instance: transitive_cascade / owner_cancellation_propagates_five_levels_to_a_second_listings_campground_slot
          rationale: >-
            That instance walks the whole chain (booking → assignment → campground
            slot → waitlisted assignment on another listing → owner penalty and
            ledger) and asserts every level, which is the end-to-end cascade claim.

      - name: both_overage_variants_produce_their_own_numbers
        claim_type: dual_variant_calculation
        grounds:
          - calculations.metered_overage.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / metered_overage_segment_wise_bills_where_trip_total_reports_zero
          rationale: >-
            That instance computes both the SEGMENT_WISE and TRIP_TOTAL variants
            from identical readings and asserts the 5813 vs 0 divergence.

      - name: penalty_threshold_fires_exactly_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.owner_penalty_accrual
          - entities.Owner.fields.status
        excluded_because:
          difficulty_instance: boundary_precision_check / owner_suspension_fires_at_exactly_twelve_points_not_eleven
          rationale: >-
            That instance probes 11 points (still ACTIVE) and 12 points
            (SUSPENDED), which is the cumulative-threshold boundary claim.

