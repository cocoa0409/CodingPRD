          trigger:
            - call: "POST /cylinders/${cyl1_id}/reclaim-certification"
              payload: { reclaim_certificate_number: "RC-2026-0001", reclaimed_quantity_lbs: 28.5, purity_verified: true, reclaim_issued_on: "2026-08-01T00:00:00Z" }
              as: ComplianceManager
