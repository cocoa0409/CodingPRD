      Money is conserved: committed_budget_cents + budget_headroom_cents must equal budget_total_cents 5000000 at every step, and cancelling a confirmed registration must return the pair to exactly its pre-confirmation values (1443174 / 3556826) after the 105500-cent air cost was added and removed — zero drift, not merely an approximate restoration.
