  - method: POST
    path: "/numbering/allocation-requests"
    description: "Files a numbering resource request (INITIAL, GROWTH, POOL_REPLENISH or SAFETY_VALVE). Guarded by optimistic concurrency on the rate center; a newer request from the same carrier for the same rate center supersedes that carrier's still-open request."
    roles: [CarrierRepresentative]
    code: 201
    input: [carrier_id, rate_center_id, request_type, requested_block_count, justification, expected_rate_center_version]
    output: AllocationRequest
    side_effects: ["rejects the write with ERR_STALE_RATE_CENTER_VERSION when expected_rate_center_version does not equal the rate center's current version", "status = PENDING_REVIEW, info_request_count = 0", "snapshots utilization_pct_at_submission from the effective filing and months_to_exhaust_at_submission from rate_center_months_to_exhaust", "moves the carrier's prior PENDING_REVIEW or INFO_REQUESTED request for the same rate center to SUPERSEDED and stamps its superseded_by_request_id", "increments RateCenter.pending_request_count and RateCenter.version by 1"]
  - method: GET
    path: "/numbering/allocation-requests"
    description: "Lists allocation requests with filtering and pagination; superseded_by_request_id finds the requests a given request displaced"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "rate_center_id?", "request_type?", "status?", "superseded_by_request_id?", "limit?", "offset?"]
    output: AllocationRequest[]
    side_effects: []
  - method: GET
    path: "/numbering/allocation-requests/{request_id}"
    description: "Retrieves one allocation request with its submission snapshots and, once approved, its granted block ids"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: []
  - method: POST
    path: "/numbering/allocation-requests/{request_id}/reviews"
    description: "Drives the AllocationRequest machine: REQUEST_INFO and DENY by the administrator, APPROVE by the regulatory approver, WITHDRAW by the filing carrier"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: [action, "info_note?", "granted_block_count?", "denial_note?"]
    output: AllocationRequest
    side_effects: ["REQUEST_INFO increments info_request_count and refuses once INFO_REQUEST_MAX_CYCLES (2) is reached", "APPROVE re-checks the applicant's eligibility_status, runs growth_grant_size, draws blocks through block_pool_selection, moves each drawn block POOL_AVAILABLE -> RESERVED and stamps assigned_block_ids in ranking order", "APPROVE recomputes RateCenter.available_block_count / assigned_block_count / aggregate_utilization_pct, Carrier.blocks_held_count, NPA.available_block_count / exhaust_projection_months and the NPA exhaust posture, which can set jeopardy_flag on every rate center under the code", "APPROVE of a SAFETY_VALVE request increments Carrier.safety_valve_grant_count by 1", "DENY stamps denial_reason; WITHDRAW closes the request without touching inventory", "every terminal outcome decrements RateCenter.pending_request_count by 1", "increments AllocationRequest.version, and on APPROVE also RateCenter.version, NPA.version and each drawn NumberBlock.version, by 1"]
  - method: POST
    path: "/numbering/allocation-requests/{request_id}/resubmissions"
    description: "The filing carrier answers an information request, moving INFO_REQUESTED back to PENDING_REVIEW"
    roles: [CarrierRepresentative]
    code: 200
    input: [revised_requested_block_count, response_note]
    output: AllocationRequest
    side_effects: ["overwrites requested_block_count and justification", "re-snapshots utilization_pct_at_submission and months_to_exhaust_at_submission against the carrier's current effective filing", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/numbering/utilization-filings"
    description: "Creates a DRAFT utilization and forecast report (NRUF) for one carrier, one rate center and one reporting period"
    roles: [CarrierRepresentative]
    code: 201
    input: [carrier_id, rate_center_id, reporting_period, numbers_assigned, numbers_intermediate, numbers_reserved, numbers_aging, numbers_administrative, blocks_held_at_period_end, forecast_quarters]
    output: UtilizationFiling
    side_effects: ["status = DRAFT; a DRAFT filing is never effective for allocation gating", "computes claimed_utilization_pct and strict_utilization_pct with the two variants of filing_utilization_pct", "rejects a second non-REJECTED filing for the same carrier, rate center and reporting period"]
  - method: POST
    path: "/numbering/utilization-filings/{filing_id}/submissions"
    description: "Submits a DRAFT filing, or resubmits a REJECTED one as an amendment"
    roles: [CarrierRepresentative]
    code: 200
    input: ["amendment_note?"]
    output: UtilizationFiling
    side_effects: ["sets status = SUBMITTED and submitted_at = clock_now", "recomputes claimed_utilization_pct and strict_utilization_pct", "an amendment of a REJECTED filing increments amendment_count by 1, clears audited_utilization_pct and requires amendment_note", "recomputes RateCenter.aggregate_utilization_pct with the sum-then-round rule", "increments UtilizationFiling.version and RateCenter.version by 1"]
  - method: GET
    path: "/numbering/utilization-filings"
    description: "Lists utilization filings with filtering and pagination"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "rate_center_id?", "reporting_period?", "status?", "limit?", "offset?"]
    output: UtilizationFiling[]
    side_effects: []
  - method: GET
    path: "/numbering/utilization-filings/{filing_id}"
    description: "Retrieves one filing with both utilization variants and, once audited, the audited figure"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
