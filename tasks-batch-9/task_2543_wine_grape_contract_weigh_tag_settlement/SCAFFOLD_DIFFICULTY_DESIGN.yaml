            - "The second trigger call returns 409 with error_id == ERR_LANE_DAILY_CAPACITY_EXCEEDED because 22.000 + 15.000 == 37.000 exceeds daily_capacity_tons 30.000"
            - "CrushPadLane.${lane_id}.committed_tons is still 22.000 and scheduled_appointment_count is still 1"
            - "A third request for the same 20:00-22:00 window with planned_tons 8.000 succeeds with 201, because 22.000 + 8.000 == 30.000 hits daily_capacity_tons exactly and equality is accepted"

      - name: appointment_state_outranks_arrival_window
        pair: "state (priority 22, ERR_APPOINTMENT_NOT_OPEN, 409) vs business_temporal (priority 36, ERR_OUTSIDE_APPOINTMENT_WINDOW, 409)"
        grounds:
          - validations.priority_22
          - validations.priority_36
          - state_machines.DeliveryAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          A third, disjoint category pair — STATE over TEMPORAL — and on a different endpoint
          (POST /weigh-tags rather than POST /delivery-appointments). The cancelled appointment
          is doubly invalid: its status is CANCELLED and the clock is a full day past its
          window plus the 60-minute late-arrival grace. The state error must win. A second,
          still-SCHEDULED appointment whose window has not opened yet isolates the temporal error.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec, lane L1, crew, ACTIVE contract, completed PICK_READY sampling visit, acknowledged pick call with target_pick_at 2026-08-25T14:00:00Z."
            - "Appointment A: 2026-08-25T14:00-16:00 planned 22.000, then CANCELLED while still SCHEDULED."
            - "Appointment B: 2026-08-27T14:00-16:00 planned 18.000, left SCHEDULED and never weighed."
            - "The clock is advanced to 2026-08-26T10:00:00Z, which is past A's window plus grace and before B's window opens."
