    grounds: endpoints.GET /candidates; response_envelope.pagination_defaults (limit 10, offset 0)
    distinguishing_aspect: Eleven rows exist and no limit is supplied, so the page size can only be right
      if the declared default of 10 is applied rather than returning everything.
    test_recipe:
