              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 3 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 3 }
              as: PickOperator
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_PACK_UNIT_MISMATCH"
            - "Order.${ord}.status == PICKING"

      - name: ownership_mismatch_sku_of_other_client_on_order_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=7]
          - entities.Sku.fields.client_id
          - entities.Order.fields.client_id
          - errors[ERR_CLIENT_OWNERSHIP_MISMATCH]
        distinguishing_aspect: |
          Cross-ownership integrity: importing an order under client A whose line
          references a SKU owned by client B is rejected with
          ERR_CLIENT_OWNERSHIP_MISMATCH (the SKU exists but is not owned by the path
          client).
        test_recipe:
          setup:
            - "Two clients A and B; SKU owned by B; import order under A referencing B's SKU"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "OwnA", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cliA: $.data.id }
            - call: "POST /clients"
              payload: { name: "OwnB", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cliB: $.data.id }
            - call: "POST /clients/${cliB}/skus"
              payload: { code: "B-SKU", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cliB}"
              captures: { skuB: $.data.id }
          trigger:
            - call: "POST /clients/${cliA}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${skuB}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cliA}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_CLIENT_OWNERSHIP_MISMATCH"

      - name: capacity_boundary_putaway_exactly_at_capacity_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=10]
          - entities.Bin.fields.occupied_cc
          - entities.Bin.fields.capacity_cc
        distinguishing_aspect: |
          Capacity boundary is inclusive (<=): a putaway that brings occupied_cc to
          EXACTLY capacity_cc (5 units * 400cc == 2000cc into a 2000cc bin) succeeds,
          confirming only strictly-over is rejected.
        test_recipe:
          setup:
            - "GENERAL bin capacity 2000cc; RECEIVED receipt of 5 units of a 400cc SKU"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ExactCap", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-VAL-04", bin_type: "GENERAL", capacity_cc: 2000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
          trigger:
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
              captures: { st: $.data.status }
          assert:
            - "response status code == 200"
            - "Receipt.${rcpt}.status == PUTAWAY"
            - "Bin.${bin}.occupied_cc == 2000"

