              as: MillPlanner
          assert:
            - "attempt 1 returns HTTP 422 with error.error_id == ERR_GAUGE_MISMATCH"
            - "attempt 2 returns HTTP 422 with error.error_id == ERR_PILE_HEIGHT_SPEC_DEVIATION"
            - "attempt 3 returns HTTP 422 with error.error_id == ERR_PATTERN_REPEAT_MISMATCH"
            - "attempt 4 returns HTTP 200 with ProductionRun.${pr}.status == TUFTING"
            - "ProductionRun.${pr}.pile_height_set_mm == 8.5 and ProductionRun.${pr}.pattern_repeat_loaded_mm == 300.0"
