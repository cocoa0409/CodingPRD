  - method: GET
    path: "/fresh/lots/{lotId}/markdown-quote"
    description: "Price the lot under BOTH markdown_price variants without writing anything: the LADDER_DAYS reading (days remaining alone) and the SELL_THROUGH reading (rung deepened by the sell-through shortfall). Returns ERR_RUNG_NOT_REACHED when no rung is satisfied."
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk]
    code: 200
    input: []
    output: { lot_id: string, days_remaining: integer, expected_sell_through_pct: number, sell_through_floor_pct: number, cost_floor_price_cents: integer, max_total_discount_pct: number, base_rung_index: integer, ladder_days_rung_index: integer, ladder_days_price_cents: integer, ladder_days_total_discount_pct: number, sell_through_shortfall_steps: integer, sell_through_rung_index: integer, sell_through_price_cents: integer, sell_through_total_discount_pct: number }
    side_effects: ["evaluates calculations.days_remaining, calculations.expected_sell_through, calculations.ladder_rung_selection and both priced variants of calculations.markdown_price; writes nothing, so DateCodeLot.version is unchanged"]
  - method: GET
    path: "/fresh/departments/{departmentId}/margin-report"
    description: "Gross-margin impact report for one fresh department over an inclusive calendar window, per calculations.gross_margin_impact"
    roles: [StoreOperationsAdmin, DepartmentManager, ComplianceAuditor]
    code: 200
    input: [window_start_date, window_end_date]
    output: { department_id: string, window_start_date: string, window_end_date: string, lot_count: integer, revenue_cents: integer, markdown_giveback_cents: integer, cogs_cents: integer, shrink_cost_cents: integer, donation_cost_cents: integer, gross_margin_cents: integer, gross_margin_pct: number, shrink_cost_ratio_pct: number }
    side_effects: ["evaluates calculations.gross_margin_impact; writes nothing (Department.shrink_cost_ratio_pct is NOT rewritten by this read)"]
  - method: GET
    path: "/fresh/stores/{storeId}/margin-rollup"
    description: "Store-level gross-margin rollup: the per-department margin-report figures of every department of the store, summed. Each department's lines are rounded first per calculations.gross_margin_impact, then the department totals are added, so the rollup equals the sum of the department reports exactly."
    roles: [StoreOperationsAdmin, ComplianceAuditor]
    code: 200
    input: [window_start_date, window_end_date]
    output: { store_id: string, window_start_date: string, window_end_date: string, department_count: integer, revenue_cents: integer, markdown_giveback_cents: integer, cogs_cents: integer, shrink_cost_cents: integer, donation_cost_cents: integer, gross_margin_cents: integer, gross_margin_pct: number, shrink_cost_ratio_pct: number }
    side_effects: ["evaluates calculations.gross_margin_impact once per department of the store and sums the department totals; writes nothing"]

