          trigger:
            - call: "GET /verification-standards/00000000-0000-0000-0000-000000009999"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_std: $.data.error_id }
            - call: "GET /counties/00000000-0000-0000-0000-000000009999"
