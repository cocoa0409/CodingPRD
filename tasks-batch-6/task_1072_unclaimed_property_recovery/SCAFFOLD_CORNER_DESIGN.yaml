scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: property_escheat_state_priority_rule
        claim_type: computed_field
        grounds:
          - entities.Property.escheat_state
          - entities.Property.owner_last_known_state
          - entities.Holder.incorporation_state
        distinguishing_aspect: >
          escheat_state follows the priority rule: with owner_last_known_state present it equals TX; when
          omitted it falls back to the holder's incorporation_state NY. Client-sent value is derived, not trusted.
        test_recipe:
          setup:
            - "One NY-incorporated holder; one property with owner_last_known_state TX and one with it omitted."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "TX Owner", owner_last_known_state: "TX", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_tx_id: $.data.id, es_tx: $.data.escheat_state }
          trigger:
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Unknown Owner", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_ny_id: $.data.id, es_ny: $.data.escheat_state }
          assert:
            - "Property.${prop_tx_id}.escheat_state == TX"
            - "Property.${prop_ny_id}.escheat_state == NY"

      - name: property_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Property, "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{unknown-uuid} returns ERR_PROPERTY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000000"
              as: StateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PROPERTY_NOT_FOUND"

      - name: holder_missing_required_field_returns_invalid
        claim_type: required_field
        grounds: [entities.Holder.holder_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /holders without holder_type is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY" }
              as: StateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: property_system_fields_ignored_on_create
        claim_type: system_field
        grounds: [entities.Property.status, entities.Property.remitted_amount_cents]
        distinguishing_aspect: "A freshly created property is ACTIVE with remitted_amount_cents 0 regardless of input; status/version are server-set."
        test_recipe:
          setup: ["One holder and one property type."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id, v: $.data.version }
          assert:
            - "Property.${prop_id}.status == ACTIVE"
            - "Property.${prop_id}.remitted_amount_cents == 0"
            - "Property.${prop_id}.version == 1"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: pay_before_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a FILED claim (never approved) is rejected ERR_INVALID_STATE; no ledger entries created."
        test_recipe:
          setup: ["A FILED FIRM claim on an escheated CA property."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "j@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /recovery-firms"
              payload: { legal_name: "FindIt", registered_state: "CA", license_number: "L1", max_fee_pct: 0.10 }
              as: StateAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "FIRM", recovery_firm_id: "${firm_id}", contract_fee_pct: 0.10 }
              as: RecoveryAgent
              as_user_id: "${firm_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/pay"
              as: StateApprover
              as_user_id: "appr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == FILED"

      - name: deny_then_examine_terminal_lockdown
        claim_type: terminal_state
        grounds: [state_machines.Claim.UNDER_REVIEW_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED claim is terminal; a subsequent examine is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["An OWNER claim examined then DENIED."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "j@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/deny"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == DENIED"

      - name: property_reactivates_on_owner_response
        claim_type: valid_transition
        grounds: [state_machines.Property.DUE_DILIGENCE_to_ACTIVE, entities.DueDiligenceNotice.responded]
        distinguishing_aspect: "Recording an owner response flips DueDiligenceNotice.responded true and returns the property to ACTIVE."
        test_recipe:
          setup: ["A DORMANT property that received a due-diligence notice (now DUE_DILIGENCE)."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: false, due_diligence_required: true, due_diligence_min_days: 60 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_id}/notices"
              payload: { method: "MAIL" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /due-diligence-notices/${notice_id}/record-response"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { responded: $.data.responded }
          assert:
            - "DueDiligenceNotice.${notice_id}.responded == true"
            - "Property.${prop_id}.status == ACTIVE"

      - name: evidence_review_reject_sets_status
        claim_type: side_effect
        grounds: [entities.EvidenceDocument.status, entities.EvidenceDocument.reviewed_by_user_id]
        distinguishing_aspect: "Reviewing an evidence document with decision REJECTED sets status REJECTED and records reviewed_by_user_id."
        test_recipe:
          setup: ["An OWNER claim in NEEDS_EVIDENCE with a PENDING evidence document."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "j@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/request-evidence"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/evidence"
              payload: { doc_type: "GOV_ID" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/evidence/${doc_id}/review"
              payload: { decision: "REJECTED" }
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { st: $.data.status }
          assert:
            - "EvidenceDocument.${doc_id}.status == REJECTED"

      - name: audit_close_assess_sets_penalty_and_clears_hold
        claim_type: side_effect
        grounds: [state_machines.AuditCase.OPEN_to_CLOSED_ASSESSED, entities.Holder.assessed_penalty_cents, entities.Holder.audit_hold]
        distinguishing_aspect: "close-assess adds the penalty to Holder.assessed_penalty_cents and clears audit_hold (no other open case)."
        test_recipe:
          setup: ["A holder with one OPEN audit case (audit_hold true)."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /audit-cases"
              payload: { holder_id: "${holder_id}" }
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audit-cases/${audit_id}/close-assess"
              payload: { assessed_penalty_cents: 25000, findings: "Late report" }
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { st: $.data.status }
          assert:
            - "AuditCase.${audit_id}.status == CLOSED_ASSESSED"
            - "Holder.${holder_id}.assessed_penalty_cents == 25000"
            - "Holder.${holder_id}.audit_hold == false"

      - name: audit_info_request_provide_cycle
        claim_type: valid_transition
        grounds: [state_machines.AuditCase.OPEN_to_INFO_REQUESTED, state_machines.AuditCase.INFO_REQUESTED_to_OPEN]
        distinguishing_aspect: "request-info moves OPEN->INFO_REQUESTED; provide-info returns INFO_REQUESTED->OPEN (cyclic)."
        test_recipe:
          setup: ["A holder with one OPEN audit case."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /audit-cases"
              payload: { holder_id: "${holder_id}" }
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { audit_id: $.data.id }
            - call: "POST /audit-cases/${audit_id}/request-info"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /audit-cases/${audit_id}/provide-info"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { st: $.data.status }
          assert:
            - "AuditCase.${audit_id}.status == OPEN"

      - name: accept_draft_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HolderReport.UNDER_AUDIT_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT report (never submitted/reviewed) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT CA report."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HolderReport.${report_id}.status == DRAFT"

  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: evaluate_dormancy_before_date_returns_not_yet_dormant
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_YET_DORMANT]"]
        distinguishing_aspect: "At clock 2022-12-31 (one day before dormancy_date 2023-01-01) evaluate-dormancy is rejected ERR_NOT_YET_DORMANT; property stays ACTIVE."
        test_recipe:
          setup: ["An ACTIVE property with dormancy_date 2023-01-01, clock at 2022-12-31."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2022-12-31T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_YET_DORMANT"
            - "Property.${prop_id}.status == ACTIVE"

      - name: claim_fee_exceeds_cap_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_FEE_EXCEEDS_CAP]"]
        distinguishing_aspect: "contract_fee_pct 0.20 exceeds min(firm 0.10, STATE_MAX_FEE_PCT 0.10) and POST /claims is rejected ERR_FEE_EXCEEDS_CAP."
        test_recipe:
          setup: ["An escheated CA property and a firm with max_fee_pct 0.10."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
