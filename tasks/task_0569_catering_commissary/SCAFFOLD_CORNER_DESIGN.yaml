# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Catering Commissary & Event Staffing — breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===================== Entities =====================
  - section: entities
    instances:
      - name: create_event_order_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.EventOrder.fields.status, endpoints]
        distinguishing_aspect: "POST /event-orders with all required fields returns 201, status defaults to DRAFT, version 1, actual_* fields null/0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /event-orders"
              payload: { guest_count: 50, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.20, gratuity_pct: 0.15 }
              as: SalesManager
              captures: { oid: $.data.id }
          assert:
            - "response.http_status == 201"
            - "EventOrder.${oid}.status == DRAFT"
            - "EventOrder.${oid}.version == 1"
            - "EventOrder.${oid}.actual_labor_total_cents == 0"

      - name: create_event_order_missing_required_guest_count_returns_validation
        claim_type: Required Fields
        grounds: [entities.EventOrder.fields.guest_count, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting guest_count on POST /event-orders returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /event-orders"
              payload: { event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.20, gratuity_pct: 0.15 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: create_menu_item_invalid_enum_category_returns_400
        claim_type: Type Constraints
        grounds: [entities.MenuItem.fields.category, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /menu-items with category not in {ENTREE,SIDE,BEVERAGE,DESSERT} returns ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "Mystery", category: "APPETIZER", sell_price_cents_per_portion: 900 }
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: create_order_line_nonpositive_portions_returns_422
        claim_type: Type Constraints
        grounds: [entities.OrderLine.fields.portions_per_guest, "errors[ERR_QUANTITY_NOT_POSITIVE]"]
        distinguishing_aspect: "portions_per_guest <= 0 returns ERR_QUANTITY_NOT_POSITIVE (422)."
        test_recipe:
          setup: ["MenuItem SALAD; DRAFT order."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 0 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_QUANTITY_NOT_POSITIVE"

      - name: create_event_order_invalid_time_window_returns_422
        claim_type: Type Constraints
        grounds: [entities.EventOrder.fields.event_end, "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "event_end not strictly after event_start returns ERR_INVALID_TIME_WINDOW (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T17:00:00Z", event_end: "2026-06-01T09:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_TIME_WINDOW"

      - name: portion_food_cost_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.MenuItem.fields.portion_food_cost_cents]
        distinguishing_aspect: "portion_food_cost_cents is server-computed: a menu item with no recipe lines reports 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "Plain", category: "SIDE", sell_price_cents_per_portion: 500 }
              as: KitchenManager
              captures: { mid: $.data.id }
          assert:
            - "MenuItem.${mid}.portion_food_cost_cents == 0"

      - name: get_event_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /event-orders/{id} with an unknown UUID returns ERR_EVENT_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /event-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_ORDER_NOT_FOUND"
            - "response.http_status == 404"

      - name: recipe_line_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RecipeLine.fields.qty_per_portion]
        distinguishing_aspect: "RecipeLine has common_fields:false; it exposes id and created_at only (no version, no update endpoint)."
        test_recipe:
          setup: ["Ingredient + MenuItem; add a recipe line."]
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
          trigger:
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
              captures: { rl_id: $.data.id }
          assert:
            - "RecipeLine.${rl_id}.id is a server-minted UUID with no type prefix"
            - "RecipeLine.${rl_id} response has no `version` field"

      - name: list_event_orders_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /event-orders returns paginated envelope with total_count and has_more; limit honored."
        test_recipe:
          setup: ["Two event orders created."]
          setup_api_calls:
            - call: "POST /event-orders"
              payload: { guest_count: 10, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "A", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
            - call: "POST /event-orders"
              payload: { guest_count: 12, event_start: "2026-06-02T09:00:00Z", event_end: "2026-06-02T17:00:00Z", venue_address: "B", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
          trigger:
            - call: "GET /event-orders"
              payload: { limit: 1, offset: 0 }
              as: SalesManager
          assert:
            - "response.data has total_count == 2 and has_more == true"
            - "len(response.data.items) == 1"

      - name: list_event_orders_invalid_pagination_returns_400
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "limit above 100 returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /event-orders"
              payload: { limit: 500, offset: 0 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_PAGINATION"

  # ===================== State Machines =====================
  - section: state_machines
    instances:
      - name: confirm_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.EventOrder.QUOTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm requires QUOTED; calling it on a DRAFT order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["DRAFT order (never quoted)."]
          setup_api_calls:
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: cancel_from_cancelled_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.EventOrder.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal; a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["DRAFT order cancelled once."]
          setup_api_calls:
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /event-orders/${oid}/cancel"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /event-orders/${oid}/cancel"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: double_confirm_is_rejected_idempotency
        claim_type: Idempotency
        grounds: [state_machines.EventOrder.QUOTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an already-CONFIRMED order returns ERR_INVALID_STATE (409) — no double-transition."
        test_recipe:
          setup: ["Order quoted then confirmed."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_from_draft_state_guarded_excluded
        claim_type: Precondition Enforcement
        grounds: ["state_machines.EventOrder.QUOTED_to_CONFIRMED"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / event_order_quote_revise_cycle
          rationale: "Confirm is guarded solely by the QUOTED state (reaching QUOTED always implies exactly one ACTIVE quote); the QUOTED/DRAFT gate is exercised by the revise-cycle instance and by confirm_from_draft_returns_invalid_state."

      - name: production_run_starts_in_scheduled_initial_state
        claim_type: Initial State
        grounds: [entities.ProductionRun.fields.status]
        distinguishing_aspect: "A newly created ProductionRun has status SCHEDULED."
        test_recipe:
          setup: ["Confirmed order with recipe/ingredient/station."]
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /stations"
              payload: { name: "Hot Line", concurrent_capacity: 2 }
              as: Admin
              captures: { stn_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 40, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /production-runs"
              payload: { event_order_id: "${oid}", station_id: "${stn_id}", menu_item_id: "${salad_id}", portions: 40, scheduled_start: "2026-06-01T06:00:00Z", scheduled_end: "2026-06-01T08:00:00Z" }
              as: KitchenManager
              captures: { pr_id: $.data.id }
          assert:
            - "ProductionRun.${pr_id}.status == SCHEDULED"

      - name: orderline_delete_on_draft_order_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.OrderLine.ACTIVE_to_REMOVED]
        distinguishing_aspect: "DELETE /order-lines/{id} on a DRAFT order transitions the line to REMOVED and bumps the parent order version."
        test_recipe:
          setup: ["DRAFT order with one line."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
              captures: { ol_id: $.data.id }
          trigger:
            - call: "DELETE /order-lines/${ol_id}"
              payload: {}
              as: SalesManager
          assert:
            - "OrderLine.${ol_id}.status == REMOVED"

      - name: orderline_delete_requires_draft_excluded
        claim_type: Invalid Transitions
        grounds: [state_machines.OrderLine.ACTIVE_to_REMOVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / orderline_delete_requires_order_draft
          rationale: "The DRAFT-gating negative path is the named §1.8 cross-entity instance."

      - name: pack_requires_runs_done_excluded
        claim_type: Precondition Enforcement
        grounds: [state_machines.EventOrder.IN_PRODUCTION_to_PACKED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pack_requires_all_runs_done
          rationale: "Pack precondition negative path is the named §1.8 instance."

  # ===================== Calculations =====================
  - section: calculations
    instances:
      - name: quote_estimate_food_revenue_and_cost_correct
        claim_type: Correct Result
        grounds: [calculations.event_estimate, entities.Quote.fields.food_revenue_cents, entities.Quote.fields.food_cost_cents]
        distinguishing_aspect: "Quote over guest_count 40, one SALAD line ppg 1.0 (sell 1000, cost 50): food_revenue 40000, food_cost 2000."
        test_recipe:
          setup: ["LETTUCE(cost10); SALAD sell 1000 recipe qty 5 -> cost 50; order guest 40; one line ppg 1.0."]
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /event-orders"
              payload: { guest_count: 40, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.food_revenue_cents == 40000"
            - "Quote.${q_id}.food_cost_cents == 2000"

      - name: quote_ceil_line_portions_fractional_ppg
        claim_type: Correct Result
        grounds: [calculations.event_estimate, entities.OrderLine.fields.portions_per_guest]
        distinguishing_aspect: "line_portions = ceil(ppg*headcount): ppg 0.33, guest 10 -> ceil(3.3)=4 portions; food_revenue 4*1000=4000."
        test_recipe:
          setup: ["SALAD sell 1000; order guest 10; one line ppg 0.33."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 10, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 0.33 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.food_revenue_cents == 4000"

      - name: scheduled_labor_no_overtime_under_threshold
        claim_type: Constants Applied
        grounds: [calculations.staff_labor, entities.StaffAssignment.fields.scheduled_labor_cents]
        distinguishing_aspect: "A 6h scheduled shift at rate 2000 yields scheduled_labor_cents 12000 (no overtime; 6 < 8.0)."
        test_recipe:
          setup: ["SERVER rate 2000; order CONFIRMED; assignment shift 6h."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /staff-members"
              payload: { name: "Sam Server", staff_role: "SERVER", hourly_rate_cents: 2000 }
              as: Admin
              captures: { sm_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T20:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /staff-assignments"
              payload: { event_order_id: "${oid}", staff_member_id: "${sm_id}", staff_role: "SERVER", shift_start: "2026-06-01T10:00:00Z", shift_end: "2026-06-01T16:00:00Z" }
              as: EventCaptain
              captures: { sa_id: $.data.id }
          assert:
            - "StaffAssignment.${sa_id}.scheduled_labor_cents == 12000"

      - name: equipment_availability_read_full_pool_when_unreserved
        claim_type: Correct Result
        grounds: [calculations.equipment_availability]
        distinguishing_aspect: "GET /equipment-items/{id}/availability over a window with no reservations returns available_units == total_units (10)."
        test_recipe:
          setup: ["CHAFER total_units 10, no reservations."]
          setup_api_calls:
            - call: "POST /equipment-items"
              payload: { name: "Chafer", asset_type: "CHAFER", total_units: 10, rental_price_cents: 500 }
              as: Admin
              captures: { eq_id: $.data.id }
          trigger:
            - call: "GET /equipment-items/${eq_id}/availability"
              payload: { out_time: "2026-06-01T10:00:00Z", return_time: "2026-06-01T16:00:00Z" }
              as: EventCaptain
              captures: { avail: $.data.available_units }
          assert:
            - "response.data.available_units == 10"
            - "response.data.total_units == 10"

      - name: portion_food_cost_rounding_excluded
        claim_type: Precision
        grounds: [calculations.portion_food_cost]
        excluded_because:
          difficulty_instance: combinatorial_formula / portion_food_cost_sum_then_round
