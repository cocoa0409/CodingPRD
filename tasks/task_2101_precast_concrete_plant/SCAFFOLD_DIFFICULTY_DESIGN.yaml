            - "CuringCycle.${cyc_d_id}.status == SCHEDULED (admitted: at 2026-08-04T00:00:00Z cycle A has already ended under half-open semantics, so the peak is exactly 40 + 60 = 100 bhp, which is not GREATER than the 100 bhp capacity)"
