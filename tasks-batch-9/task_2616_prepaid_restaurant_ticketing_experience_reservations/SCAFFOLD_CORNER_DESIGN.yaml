            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "nodraft@corner.test", display_name: "NoDraft Guest" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /ticket-classes/${tc_id}/pause"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T21:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /services/${svc_id}/release-run"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { err_release: $.data.error_id }
            - call: "POST /services/${svc_id}/hold-sweep"
              payload: { close_service: true }
              as: PlatformAdmin
              captures: { err_close: $.data.error_id }
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_id}", guest_id: "${g_id}", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err_wl: $.data.error_id }
