        distinguishing_aspect: "Ownership on POST /grade-appeals/{id}/withdraw is checked against PlayGrade.official_id, so Rita — a legitimate Official — is refused with 403 on Dan's appeal, and Dan's own withdrawal succeeds and refunds his credit."
