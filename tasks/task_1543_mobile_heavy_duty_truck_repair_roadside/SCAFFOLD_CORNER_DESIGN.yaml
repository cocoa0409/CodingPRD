            - { call: "POST /roadside/repeat-failure-cases/${cse}/decide", payload: { decision: "CONFIRMED_COMEBACK" }, as: OpsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /roadside/repeat-failure-cases/${cse}/decide", payload: { decision: "REJECTED", decision_note: "outside comeback window" }, as: OpsAdmin, captures: { st: $.data.status } }
          assert:
            - "policy == FULL (window_days 52 > 45) so err == ERR_REPEAT_WINDOW_EXPIRED (409)"
            - "st == REJECTED remains reachable from UNDER_REVIEW"

