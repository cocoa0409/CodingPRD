  # --- DistributionReport ---
  - method: POST
    path: "/medicine-relief/distribution-reports"
    description: "Site coordinator files a DRAFT distribution report against a DELIVERED shipment"
    roles: [SiteCoordinator]
    code: 201
    input: [site_id, shipment_id, reporting_period, units_distributed, patients_reached, wastage_units]
    output: DistributionReport
    side_effects: ["status=DRAFT, submitted_by_user_id=X-User-ID"]

  - method: GET
    path: "/medicine-relief/distribution-reports/{report_id}"
    description: "Get a distribution report"
    roles: [SiteCoordinator, ComplianceOfficer, DonorReportingOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DistributionReport
    side_effects: []

  - method: GET
    path: "/medicine-relief/distribution-reports"
    description: "List distribution reports (paginated, filterable)"
    roles: [SiteCoordinator, ComplianceOfficer, DonorReportingOfficer, PlatformAdmin]
    code: 200
    input: ["site_id?", "shipment_id?", "status?", "reporting_period?", "limit?", "offset?"]
    output: DistributionReport[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/distribution-reports/{report_id}/submit"
    description: "Submit a DRAFT report (overreport check applied)"
    roles: [SiteCoordinator]
    code: 200
    input: []
    output: DistributionReport
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/medicine-relief/distribution-reports/{report_id}/accept"
    description: "Compliance accepts a SUBMITTED report (must not be the submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DistributionReport
    side_effects: ["status -> ACCEPTED, reviewed_by_user_id recorded"]

  - method: POST
    path: "/medicine-relief/distribution-reports/{report_id}/reject"
    description: "Compliance rejects a SUBMITTED report (must not be the submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: DistributionReport
    side_effects: ["status -> REJECTED, reviewed_by_user_id recorded"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Caller does not own the targeted resource (SiteCoordinator.site mismatch or requested_by mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request body malformed; missing required fields or wrong types" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in the wrong state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the current entity version" }
  - { id: ERR_DONOR_NOT_ACTIVE, http: 409, condition: "ManufacturerDonor.status != ACTIVE for intake or release" }
  - { id: ERR_CONTROLLED_DONOR_UNREGISTERED, http: 422, condition: "Controlled-product lot intake or release from a donor without DEA registration" }
  - { id: ERR_CONTROLLED_SITE_NOT_AUTHORIZED, http: 422, condition: "Allocation of a CONTROLLED lot to a site without DEA registration" }
  - { id: ERR_COLD_CHAIN_INADEQUATE, http: 422, condition: "Cold-chain allocation to a site with zero cold_storage_capacity_l" }
  - { id: ERR_COLD_CHAIN_PACK_REQUIRED, http: 422, condition: "Cold-chain shipment pack-complete without packed_with_cold_shipper=true" }
  - { id: ERR_LOT_NOT_RELEASABLE, http: 409, condition: "Allocation decision references a lot not in RELEASABLE posture" }
  - { id: ERR_IMPORT_LICENSE_MISSING, http: 422, condition: "International site lacks a VERIFIED, unexpired IMPORT license; or customs declaration submitted without one" }
  - { id: ERR_NO_VERIFIED_LICENSE, http: 422, condition: "Site qualification/reinstatement attempted with zero active licenses" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "License verification attempted with expires_on <= current logical clock" }
  - { id: ERR_SITE_NOT_QUALIFIED, http: 409, condition: "Site.qualification_status != QUALIFIED for review/decision/dispatch" }
  - { id: ERR_QUANTITY_INVALID, http: 422, condition: "Decision line sum is 0 or exceeds request.quantity_requested" }
  - { id: ERR_INSUFFICIENT_AVAILABLE, http: 409, condition: "Decision would drive a lot's quantity_available negative" }
  - { id: ERR_OVERREPORTED, http: 422, condition: "Cumulative reported units exceed the shipment's delivered quantity" }
  - { id: ERR_CUSTOMS_NOT_CLEARED, http: 409, condition: "International shipment dispatch attempted before customs clearance" }
  - { id: ERR_CUSTOMS_VALUE_INVALID, http: 422, condition: "Customs declaration submit with declared_value_usd == 0" }
  - { id: ERR_INCOMPATIBLE_TEMPERATURE_BANDS, http: 422, condition: "max(storage_temp_min_c) > min(storage_temp_max_c) across a shipment's lots" }
  - { id: ERR_MODULE_OUT_OF_REGION, http: 422, condition: "Prepositioned module holding_country_code not in event's affected_country_codes and event.severity < 4" }
  - { id: ERR_EMERGENCY_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE EmergencyEvent" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user id attempted both submit and accept/reject on a DistributionReport" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator; registers donors, sites, modules; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/_clock/set_current_utc"
      - "POST /medicine-relief/donors/{id}/suspend"
      - "POST /medicine-relief/donors/{id}/deactivate"
    shared_operations:
      - "POST /medicine-relief/donors"
      - "POST /medicine-relief/lots"
      - "POST /medicine-relief/sites"
      - "POST /medicine-relief/prepositioned-modules"
      - "POST /medicine-relief/valuation-snapshots"
      - "All GET endpoints"

  - name: QAPharmacist
    description: "Quality assurance pharmacist; releases and recalls product lots"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/lots/{id}/release"
      - "POST /medicine-relief/lots/{id}/recall"
    shared_operations:
      - "POST /medicine-relief/lots"
      - "GET /medicine-relief/lots*"

  - name: ComplianceOfficer
    description: "Compliance reviewer; qualifies sites, verifies licenses, clears customs, reviews distribution reports"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/sites/{id}/qualify"
      - "POST /medicine-relief/sites/{id}/suspend"
      - "POST /medicine-relief/sites/{id}/reinstate"
      - "POST /medicine-relief/sites/{id}/revoke"
      - "POST /medicine-relief/licenses/{id}/verify"
      - "POST /medicine-relief/licenses/{id}/reject"
      - "POST /medicine-relief/customs-declarations/{id}/clear"
      - "POST /medicine-relief/customs-declarations/{id}/reject"
      - "POST /medicine-relief/distribution-reports/{id}/accept"
      - "POST /medicine-relief/distribution-reports/{id}/reject"
    shared_operations:
      - "POST /medicine-relief/sites"
      - "POST /medicine-relief/licenses"
      - "POST /medicine-relief/valuation-snapshots"
      - "Most GET endpoints"

  - name: AllocationOfficer
    description: "Allocation reviewer; scores requests and renders allocation decisions"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/allocation-requests/{id}/begin-review"
      - "POST /medicine-relief/allocation-requests/{id}/reject"
      - "POST /medicine-relief/allocation-decisions"
      - "POST /medicine-relief/allocation-decisions/{id}/finalize"
      - "POST /medicine-relief/allocation-decisions/{id}/void"
    shared_operations:
      - "GET /medicine-relief/allocation-requests*"
      - "GET /medicine-relief/allocation-decisions*"
      - "GET /medicine-relief/allocation-lines*"
      - "GET /medicine-relief/lots*"
      - "GET /medicine-relief/sites*"

  - name: LogisticsCoordinator
    description: "Warehouse/logistics operator; packs, dispatches, cancels shipments and manages customs"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/shipments"
      - "POST /medicine-relief/shipments/{id}/pack-complete"
      - "POST /medicine-relief/shipments/{id}/dispatch"
      - "POST /medicine-relief/shipments/{id}/mark-delivery-failed"
      - "POST /medicine-relief/shipments/{id}/cancel"
      - "POST /medicine-relief/customs-declarations"
      - "POST /medicine-relief/customs-declarations/{id}/submit"
    shared_operations:
      - "GET /medicine-relief/shipments*"
      - "GET /medicine-relief/customs-declarations*"
      - "GET /medicine-relief/lots*"
      - "GET /medicine-relief/sites*"
      - "GET /medicine-relief/allocation-lines*"

  - name: SiteCoordinator
    description: "Recipient-site user; files allocation requests, confirms deliveries, files distribution reports"
    identity: "entity_backed:RecipientSite"
    exclusive_operations:
      - "POST /medicine-relief/allocation-requests"
      - "POST /medicine-relief/allocation-requests/{id}/cancel"
      - "POST /medicine-relief/shipments/{id}/confirm-delivery"
      - "POST /medicine-relief/distribution-reports"
      - "POST /medicine-relief/distribution-reports/{id}/submit"
    shared_operations:
      - "POST /medicine-relief/licenses"
      - "GET /medicine-relief/sites/{id} (own site)"
      - "GET /medicine-relief/allocation-requests*"
      - "GET /medicine-relief/shipments*"
      - "GET /medicine-relief/distribution-reports*"
      - "GET /medicine-relief/emergency-events*"

  - name: EmergencyManager
    description: "Emergency response manager; declares/activates/closes events and reserves/deploys pre-positioned modules"
    identity: opaque
    exclusive_operations:
      - "POST /medicine-relief/emergency-events"
      - "POST /medicine-relief/emergency-events/{id}/activate"
      - "POST /medicine-relief/emergency-events/{id}/close"
      - "POST /medicine-relief/prepositioned-modules/{id}/reserve"
      - "POST /medicine-relief/prepositioned-modules/{id}/deploy"
      - "POST /medicine-relief/prepositioned-modules/{id}/consume"
    shared_operations:
      - "POST /medicine-relief/prepositioned-modules"
      - "GET /medicine-relief/emergency-events*"
      - "GET /medicine-relief/prepositioned-modules*"
      - "GET /medicine-relief/sites*"

  - name: DonorReportingOfficer
    description: "Donor reporting / valuation specialist"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /medicine-relief/valuation-snapshots"
      - "GET /medicine-relief/valuation-snapshots*"
      - "GET /medicine-relief/donors*"
      - "GET /medicine-relief/distribution-reports*"
      - "GET /medicine-relief/lots*"
