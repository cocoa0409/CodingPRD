          setup:
            - "ProgramYear PY-A 2026-27 (TX, term 2026-08-01 -> 2027-06-30) is ACTIVE and Student S1's Application A1 is ACCEPTED there."
            - "ProgramYear PY-B 2027-28-overlap (TX, term 2027-06-30 -> 2028-06-29) is WINDOW_OPEN with window 2027-01-01 -> 2027-03-01."
            - "ProgramYear PY-C 2027-28-clean (TX, term 2027-07-01 -> 2028-06-30) is WINDOW_OPEN with the same window."
            - "The clock has been moved to 2027-02-01, inside both new windows."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
