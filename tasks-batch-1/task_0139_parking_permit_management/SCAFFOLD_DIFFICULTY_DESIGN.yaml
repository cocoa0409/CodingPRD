scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: transient_charge_permit_zero_vs_transient_metered
        grounds:
          - calculations.transient_charge
          - state_machines.AccessSession.OPEN_to_CLOSED
          - entities.AccessSession.fields.gross_charge_cents
        distinguishing_aspect: |
          On AccessSession (the parking-session domain), a PERMIT session bills gross 0 while a
          TRANSIENT session with identical entry/exit bills the full metered amount (1500), so the
          same exit transition yields divergent charges keyed only on session_kind.
        test_recipe:
          setup:
            - "Garage G (gate_mode PERMIT_OR_TRANSIENT) with a MIXED zone Z bound to RatePlan RP (hourly 500, daily_cap 4000, monthly 9000, grace 15)."
            - "Zone Z capacity 5; one space S exists; Motorist M with an ACTIVE permit on Z for plate ABC123."
            - "A PERMIT session entered 2026-06-01T10:00:00Z and exits at 12:30:00Z (150 min)."
            - "Separately a TRANSIENT session entered 2026-06-01T10:00:00Z on a second space and exits 12:30:00Z."
          setup_api_calls:
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/garages"
              payload: { name: "G", gate_mode: "PERMIT_OR_TRANSIENT" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S2" }
              as: FacilityAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "m@x.com", default_plate: "ABC123" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "ABC123" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /parking/permits/${perm_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
              captures: { perm_v: $.data.version }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "ABC123", entry_at_utc: "2026-06-01T10:00:00Z", permit_id: "${perm_id}" }
              as: FacilityAdmin
              captures: { sess_permit_id: $.data.id, sess_permit_kind: $.data.session_kind }
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "XYZ999", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_trans_id: $.data.id, sess_trans_kind: $.data.session_kind }
          trigger:
            - call: "POST /parking/sessions/${sess_permit_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:30:00Z" }
              as: FacilityAdmin
              captures: { permit_gross: $.data.gross_charge_cents }
            - call: "POST /parking/sessions/${sess_trans_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:30:00Z" }
              as: FacilityAdmin
              captures: { trans_gross: $.data.gross_charge_cents }
          assert:
            - "AccessSession.${sess_permit_id}.session_kind == PERMIT"
            - "AccessSession.${sess_permit_id}.gross_charge_cents == 0"
            - "AccessSession.${sess_trans_id}.session_kind == TRANSIENT"
            - "AccessSession.${sess_trans_id}.gross_charge_cents == 1500"

      - name: citation_fine_first_offense_vs_repeat_offender
        grounds:
          - calculations.citation_fine
          - state_machines.Citation.ISSUED_to_UPHELD
          - entities.Citation.fields.amount_due_cents
        distinguishing_aspect: |
          On Citation (the enforcement domain, a different entity from AccessSession), the same
          base_fine_cents=5000 produces 5000 for a first offense but 7500 for the same plate's second
          citation, because the repeat-offender count selects a higher multiplier tier.
        test_recipe:
          setup:
            - "Garage G; an LPR read R1 and R2 both produce NO_PERMIT for plate DUP111."
            - "First citation on DUP111 is issued (prior_count 0); a second citation on DUP111 is then issued (prior_count 1)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "DUP111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r1_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "DUP111", plate_read_id: "${r1_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c1_id: $.data.id, c1_amount: $.data.amount_due_cents }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "DUP111", zone_id: "${z_id}", read_at_utc: "2026-06-01T09:00:00Z" }
              as: EnforcementOfficer
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "DUP111", plate_read_id: "${r2_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c2_id: $.data.id, c2_amount: $.data.amount_due_cents, c2_prior: $.data.prior_citation_count }
          assert:
            - "Citation.${c1_id}.amount_due_cents == 5000"
            - "Citation.${c1_id}.prior_citation_count == 0"
            - "Citation.${c2_id}.amount_due_cents == 7500"
            - "Citation.${c2_id}.prior_citation_count == 1"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: event_priced_metered_then_capped_then_flat_order
        # MODE (c): circular-looking pin — multiplier on metered, THEN daily cap, THEN flat surcharge.
        grounds:
          - calculations.transient_charge
          - entities.EventPricing.fields.multiplier
          - entities.EventPricing.fields.flat_surcharge_cents
          - state_machines.AccessSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          The evaluation order is pinned (multiplier → daily cap → flat surcharge): a TRANSIENT 150-min
          session at hourly 500 yields metered 1500, ×2.0 = 3000 (under the 4000 cap), + flat 1000 =
          4000 gross — a value that only the pinned order produces, distinguishing it from mode (a).
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, daily_cap 4000, grace 15)."
            - "A PUBLISHED EventPricing window [2026-06-01T09:00Z, 2026-06-01T18:00Z) with multiplier 2.0 and flat 1000."
            - "A TRANSIENT session enters 2026-06-01T10:00Z (inside window) and exits 12:30Z (150 min)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/event-pricing"
              payload: { garage_id: "${g_id}", name: "Concert", window_start_utc: "2026-06-01T09:00:00Z", window_end_utc: "2026-06-01T18:00:00Z", flat_surcharge_cents: 1000, multiplier: 2.0 }
              as: FacilityAdmin
              captures: { ep_id: $.data.id }
            - call: "POST /parking/event-pricing/${ep_id}/publish"
              payload: {}
              as: FacilityAdmin
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "EVT777", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:30:00Z" }
              as: FacilityAdmin
              captures: { gross: $.data.gross_charge_cents }
          assert:
            - "AccessSession.${sess_id}.gross_charge_cents == 4000"

      - name: validation_discount_three_way_min_budget_clip
        # MODE (a): ≥3-input non-linear interaction — min(raw_discount, gross, merchant_budget).
        grounds:
          - calculations.validation_discount
          - entities.Validation.fields.discount_kind
          - entities.Merchant.fields.validation_budget_cents
          - state_machines.AccessSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          applied_discount is the three-way min over {raw_discount, gross, merchant_budget}; with
          FLAT_CENTS 800, gross 1500, and merchant budget 500, the budget input dominates so applied=500
          and net=1000 — a non-linear interaction of three independent inputs (mode a), distinct from
          the pinned-order mode (c) instance above.
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, daily_cap 4000, grace 15)."
            - "Merchant MER in G with validation_budget_cents 500; a FLAT_CENTS 800 validation V (expires 2026-06-02)."
            - "A TRANSIENT session enters 2026-06-01T10:00Z and exits 12:30Z (gross 1500) presenting V at exit."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/merchants"
              payload: { garage_id: "${g_id}", name: "MER", validation_budget_cents: 500 }
              as: FacilityAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /parking/validations"
              payload: { garage_id: "${g_id}", merchant_id: "${mer_id}", discount_kind: "FLAT_CENTS", discount_value: 800, expires_at_utc: "2026-06-02T00:00:00Z" }
              as: Merchant
              as_user_id: "${mer_id}"
              captures: { v_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "VAL555", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:30:00Z", validation_id: "${v_id}" }
              as: FacilityAdmin
              captures: { gross: $.data.gross_charge_cents, net: $.data.net_charge_cents }
          assert:
            - "AccessSession.${sess_id}.gross_charge_cents == 1500"
            - "AccessSession.${sess_id}.net_charge_cents == 1000"
            - "Merchant.${mer_id}.validation_budget_cents == 0"
            - "Validation.${v_id}.status == REDEEMED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_revert_loop_requested_active_revoked
        grounds:
          - state_machines.Permit.REQUESTED_to_ACTIVE
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.Permit.REQUESTED_to_REJECTED
        distinguishing_aspect: |
          Permit has a branching shape: from REQUESTED it forks to ACTIVE or REJECTED, and ACTIVE
          branches again to REVOKED/EXPIRED with divergent side effects (REVOKED frees a slot and
          cascades waitlist promotion; REJECTED does not) — non-linear branching on the Permit entity.
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 1, RatePlan RP."
            - "Permit P requested, then activated (ACTIVE), then revoked (REVOKED) — a fork into the ACTIVE branch."
            - "A second permit Q requested then rejected (REJECTED) — the other fork from REQUESTED."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 1, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "m@x.com", default_plate: "PPP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "PPP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "QQQ222" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /parking/permits/${p_id}/revoke"
              payload: {}
              as: FacilityAdmin
            - call: "POST /parking/permits/${q_id}/reject"
              payload: {}
              as: FacilityAdmin
          assert:
            - "Permit.${p_id}.status == REVOKED"
            - "Permit.${q_id}.status == REJECTED"
            - "Zone.${z_id}.permits_active_count == 0"

      - name: citation_fork_join_via_appeal_branches
        grounds:
          - state_machines.Citation.ISSUED_to_UPHELD
          - state_machines.Citation.ISSUED_to_DISMISSED
          - state_machines.Appeal.SUBMITTED_to_UPHELD
          - state_machines.Appeal.SUBMITTED_to_DISMISSED
        distinguishing_aspect: |
          Citation (a different entity from Permit) forks from ISSUED into UPHELD or DISMISSED driven by
          the Appeal decision, with divergent side-effect sets per branch (DISMISSED lowers the motorist
          balance; UPHELD leaves it) — a branching fork-join, not a linear pipeline.
        test_recipe:
          setup:
            - "Garage G; Motorist M (plate FRK111); a NO_PERMIT citation C1 (amount 5000) and C2 (amount 7500) both ISSUED."
            - "Appeal A1 on C1 and Appeal A2 on C2, both SUBMITTED."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "m@x.com", default_plate: "FRK111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "FRK111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r1_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "FRK111", plate_read_id: "${r1_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "FRK111", zone_id: "${z_id}", read_at_utc: "2026-06-01T09:00:00Z" }
              as: EnforcementOfficer
              captures: { r2_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "FRK111", plate_read_id: "${r2_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c2_id: $.data.id }
            - call: "POST /parking/appeals"
              payload: { citation_id: "${c1_id}", motorist_id: "${m_id}", reason: "not me" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /parking/appeals"
              payload: { citation_id: "${c2_id}", motorist_id: "${m_id}", reason: "broken sign" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /parking/appeals/${a1_id}/decide"
              payload: { decision: "UPHELD" }
              as: EnforcementOfficer
            - call: "POST /parking/appeals/${a2_id}/decide"
              payload: { decision: "DISMISSED" }
              as: EnforcementOfficer
          assert:
            - "Citation.${c1_id}.status == DISMISSED"
            - "Citation.${c2_id}.status == UPHELD"
            - "Motorist.${m_id}.outstanding_balance_cents == 7500"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_cascades_capacity_then_waitlist_promotion_depth3
        grounds:
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.PermitWaitlistEntry.WAITING_to_PROMOTED
          - entities.Zone.fields.permits_active_count
          - entities.PermitWaitlistEntry.fields.promoted_permit_id
        distinguishing_aspect: |
          Depth-3 chain originating at Permit revoke: revoke (hop1 sets Permit REVOKED) → Zone
          permits_active_count decremented (hop2) → that freed capacity promotes the lowest-sequence
          WAITING entry, creating a new REQUESTED Permit and flipping the entry to PROMOTED (hop3). Each
          hop is caused by the prior one, not by the original revoke call directly.
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 1, RatePlan RP."
            - "Permit P ACTIVE (fills the single slot). Two WAITING waitlist entries W1 (seq lower) and W2 on Z."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 1, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M0", email: "m0@x.com", default_plate: "AAA000" }
              as: FacilityAdmin
              captures: { m0_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M1", email: "m1@x.com", default_plate: "BBB111" }
              as: FacilityAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M2", email: "m2@x.com", default_plate: "CCC222" }
              as: FacilityAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m0_id}", plate: "AAA000" }
              as: Motorist
              as_user_id: "${m0_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
            - call: "POST /parking/zones/${z_id}/waitlist"
              payload: { motorist_id: "${m1_id}", plate: "BBB111" }
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /parking/zones/${z_id}/waitlist"
              payload: { motorist_id: "${m2_id}", plate: "CCC222" }
              as: Motorist
              as_user_id: "${m2_id}"
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /parking/permits/${p_id}/revoke"
              payload: {}
              as: FacilityAdmin
              captures: { p_status: $.data.status }
          assert:
            - "Permit.${p_id}.status == REVOKED"
            - "PermitWaitlistEntry.${w1_id}.status == PROMOTED"
            - "PermitWaitlistEntry.${w2_id}.status == WAITING"
            - "PermitWaitlistEntry.${w1_id}.promoted_permit_id is a non-null Permit id"
            - "Zone.${z_id}.permits_active_count == 0"

      - name: appeal_uphold_cascades_citation_then_balance_depth2
        grounds:
          - state_machines.Appeal.SUBMITTED_to_UPHELD
          - state_machines.Citation.ISSUED_to_DISMISSED
          - entities.Motorist.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (appeal decide UPHELD): hop1 the linked Citation flips
          ISSUED→DISMISSED, and hop2 that dismissal recomputes Motorist.outstanding_balance_cents
          downward by the citation's amount_due_cents — caused by the citation flip, not by the decide
          call directly.
        test_recipe:
          setup:
            - "Garage G; Motorist M (plate APL111) with one ISSUED NO_PERMIT citation C (amount 5000); balance 5000."
            - "Appeal A on C, SUBMITTED."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "apl@x.com", default_plate: "APL111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "APL111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "APL111", plate_read_id: "${r_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c_id: $.data.id }
            - call: "POST /parking/appeals"
              payload: { citation_id: "${c_id}", motorist_id: "${m_id}", reason: "wrong" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /parking/appeals/${a_id}/decide"
              payload: { decision: "UPHELD" }
              as: EnforcementOfficer
          assert:
            - "Appeal.${a_id}.status == UPHELD"
            - "Citation.${c_id}.status == DISMISSED"
            - "Motorist.${m_id}.outstanding_balance_cents == 0"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_session_exit
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - state_machines.AccessSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          A session already CLOSED (state, priority 4) presented with an expired validation (business_temporal,
          priority 8) returns ERR_INVALID_STATE, not ERR_VALIDATION_NOT_REDEEMABLE — the state vs
          business_temporal pair resolves to the lower-priority state error.
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z; one session already CLOSED; an expired validation V."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/merchants"
              payload: { garage_id: "${g_id}", name: "MER", validation_budget_cents: 10000 }
              as: FacilityAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /parking/validations"
              payload: { garage_id: "${g_id}", merchant_id: "${mer_id}", discount_kind: "FLAT_CENTS", discount_value: 300, expires_at_utc: "2026-06-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${mer_id}"
              captures: { v_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "PRI111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T11:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:00:00Z", validation_id: "${v_id}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: zone_type_beats_capacity_on_permit_activate
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.Permit.REQUESTED_to_ACTIVE
        distinguishing_aspect: |
          Activating a permit in a TRANSIENT zone whose permit_capacity is 0 violates both zone_type
          (business_constraint priority 6) and capacity (business_constraint priority 12); the response
          is ERR_ZONE_TYPE_FORBIDDEN (priority 6 wins), pinning the within-category ordering — a different
          error-category pairing position than the state-vs-temporal instance above.
        test_recipe:
          setup:
            - "Garage G; a TRANSIENT zone Z with permit_capacity 0; a REQUESTED permit P targeting Z."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "zt@x.com", default_plate: "ZTP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "ZTP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ZONE_TYPE_FORBIDDEN"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grace_minutes_boundary_exact_vs_over
        grounds:
          - calculations.transient_charge
          - entities.RatePlan.fields.grace_minutes
          - state_machines.AccessSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          A stay of exactly grace_minutes (15) bills 0 (<= grace), while 16 minutes bills one full
          started hour (500) — the <= boundary on the grace metric on the session-exit endpoint.
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, grace 15). Two sessions: one 15 min, one 16 min."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S2" }
              as: FacilityAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "GRC015", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess15_id: $.data.id }
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "GRC016", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess16_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess15_id}/exit"
              payload: { exit_at_utc: "2026-06-01T10:15:00Z" }
              as: FacilityAdmin
              captures: { g15: $.data.gross_charge_cents }
            - call: "POST /parking/sessions/${sess16_id}/exit"
              payload: { exit_at_utc: "2026-06-01T10:16:00Z" }
              as: FacilityAdmin
              captures: { g16: $.data.gross_charge_cents }
          assert:
            - "AccessSession.${sess15_id}.gross_charge_cents == 0"
            - "AccessSession.${sess16_id}.gross_charge_cents == 500"

      - name: zone_capacity_strict_less_than_boundary_on_activate
        grounds:
          - validations[priority=12]
          - entities.Zone.fields.permit_capacity
          - state_machines.Permit.REQUESTED_to_ACTIVE
        distinguishing_aspect: |
          With permit_capacity 1 and permits_active_count already 1, the next activation is rejected
          because the rule is strict (count < capacity, i.e. 1 < 1 is false) — a different metric
          (integer capacity count) on a different endpoint (permit activate) than the grace-minutes boundary.
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 1; one ACTIVE permit fills it; a second REQUESTED permit awaits activation."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 1, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M1", email: "cap1@x.com", default_plate: "CAP111" }
              as: FacilityAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M2", email: "cap2@x.com", default_plate: "CAP222" }
              as: FacilityAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m1_id}", plate: "CAP111" }
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /parking/permits/${p1_id}/activate"
              payload: { expected_zone_version: "${z_v0}" }
              as: FacilityAdmin
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m2_id}", plate: "CAP222" }
              as: Motorist
              as_user_id: "${m2_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /parking/zones/${z_id}"
              payload: {}
              as: FacilityAdmin
              captures: { z_v1: $.data.version }
          trigger:
            - call: "POST /parking/permits/${p2_id}/activate"
              payload: { expected_zone_version: "${z_v1}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ZONE_AT_CAPACITY"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_activate_depends_on_zone_type_pair
        grounds:
          - state_machines.Permit.REQUESTED_to_ACTIVE
          - entities.Zone.fields.zone_type
          - validations[priority=6]
        distinguishing_aspect: |
          Permit's REQUESTED→ACTIVE transition is gated by the linked Zone's zone_type (must be PERMIT
          or MIXED) — the Permit→Zone pair. Activation in a TRANSIENT zone is rejected with
          ERR_ZONE_TYPE_FORBIDDEN.
        test_recipe:
          setup:
            - "Garage G; PERMIT zone Z capacity 5; a REQUESTED permit P on Z. (Positive: activation succeeds.)"
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "PERMIT", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "ce1@x.com", default_plate: "CEP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "CEP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
              captures: { p_status: $.data.status }
          assert:
            - "Permit.${p_id}.status == ACTIVE"
            - "Zone.${z_id}.permits_active_count == 1"

      - name: appeal_decide_depends_on_citation_state_pair
        grounds:
          - state_machines.Appeal.SUBMITTED_to_UPHELD
          - entities.Citation.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Appeal's SUBMITTED→UPHELD transition depends on the linked Citation being ISSUED (the
          Appeal→Citation pair, distinct from Permit→Zone). If the citation was already PAID, deciding
          the appeal is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Garage G; Motorist M (plate CES111); citation C ISSUED then PAID; an Appeal A on C, still SUBMITTED."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "ces@x.com", default_plate: "CES111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "CES111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "CES111", plate_read_id: "${r_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /parking/appeals"
              payload: { citation_id: "${c_id}", motorist_id: "${m_id}", reason: "later" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /parking/citations/${c_id}/pay"
              payload: { expected_citation_version: "${c_v}" }
              as: Motorist
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /parking/appeals/${a_id}/decide"
              payload: { decision: "UPHELD" }
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Citation.${c_id}.status == PAID"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: space_single_occupant_overlap_on_entry
        grounds:
          - validations[priority=10]
          - entities.Space.fields.is_occupied
          - state_machines.AccessSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          A Space admits at most one OPEN session at a time (point-occupancy interval semantics: an
          OPEN session occupies the stall for [entry, exit)). When the only space in a zone is already
          OPEN-occupied, a new entry into that zone is rejected with ERR_SPACE_OCCUPIED.
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z with exactly ONE space S1; one OPEN session already occupies S1."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "OCC111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "OCC222", entry_at_utc: "2026-06-01T10:05:00Z" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SPACE_OCCUPIED"

      - name: event_window_half_open_overlap_on_publish
        grounds:
          - validations[priority=9]
          - entities.EventPricing.fields.window_start_utc
          - entities.EventPricing.fields.window_end_utc
        distinguishing_aspect: |
          EventPricing windows use half-open [start, end) interval semantics: publishing a second
          PUBLISHED window [12:00, 18:00) when an existing PUBLISHED window is [09:00, 12:00) is allowed
          (adjacent, no overlap because end is exclusive), but [11:00, 14:00) overlaps and is rejected
          with ERR_EVENT_WINDOW_OVERLAP — a different interval geometry (adjacency-allowed) on a
          different resource entity than the Space point-occupancy rule.
        test_recipe:
          setup:
            - "Garage G; one PUBLISHED EventPricing window [09:00, 12:00). A second DRAFT window [11:00, 14:00) awaits publish (overlaps)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/event-pricing"
              payload: { garage_id: "${g_id}", name: "E1", window_start_utc: "2026-06-01T09:00:00Z", window_end_utc: "2026-06-01T12:00:00Z", flat_surcharge_cents: 1000 }
              as: FacilityAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /parking/event-pricing/${e1_id}/publish"
              payload: {}
              as: FacilityAdmin
            - call: "POST /parking/event-pricing"
              payload: { garage_id: "${g_id}", name: "E2", window_start_utc: "2026-06-01T11:00:00Z", window_end_utc: "2026-06-01T14:00:00Z", flat_surcharge_cents: 500 }
              as: FacilityAdmin
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /parking/event-pricing/${e2_id}/publish"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EVENT_WINDOW_OVERLAP"
            - "EventPricing.${e2_id}.status == DRAFT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: merchant_budget_conserved_under_validation_redemption
        grounds:
          - calculations.validation_discount
          - state_machines.AccessSession.OPEN_to_CLOSED
          - entities.Merchant.fields.validation_budget_cents
          - entities.AccessSession.fields.net_charge_cents
        distinguishing_aspect: |
          Conserved quantity (merchant economic budget): merchant.validation_budget_cents +
          sum(applied_discount over REDEEMED validations of that merchant) == initial_budget. After a
          PERCENT-20 validation applies 300 to a 1500 gross, budget falls 10000→9700 and the redeemed
          discount is exactly 300, so the sum is conserved at 10000.
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, grace 15). Merchant MER budget 10000."
            - "A PERCENT-20 validation V; a TRANSIENT session 10:00→12:30 (gross 1500) redeems V at exit."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/merchants"
              payload: { garage_id: "${g_id}", name: "MER", validation_budget_cents: 10000 }
              as: FacilityAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /parking/validations"
              payload: { garage_id: "${g_id}", merchant_id: "${mer_id}", discount_kind: "PERCENT", discount_value: 20, expires_at_utc: "2026-06-02T00:00:00Z" }
              as: Merchant
              as_user_id: "${mer_id}"
              captures: { v_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "CON111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:30:00Z", validation_id: "${v_id}" }
              as: FacilityAdmin
              captures: { net: $.data.net_charge_cents }
          assert:
            - "AccessSession.${sess_id}.net_charge_cents == 1200"
            - "Merchant.${mer_id}.validation_budget_cents == 9700"
            - "Validation.${v_id}.status == REDEEMED"

      - name: zone_capacity_conserved_under_revoke_without_promotion
        grounds:
          - state_machines.Permit.REQUESTED_to_ACTIVE
          - state_machines.Permit.ACTIVE_to_REVOKED
          - entities.Zone.fields.permits_active_count
          - entities.Zone.fields.permit_capacity
        distinguishing_aspect: |
          Conserved quantity (zone permit slots): permits_active_count + free_slots == permit_capacity
          at all times. Activating then revoking one permit with NO waitlist entries leaves
          permits_active_count back at 0 (capacity 5 fully free) — no slot leaks, a different conserved
          quantity (integer capacity) than the merchant budget cents.
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5, no waitlist. Permit P activated (count 1) then revoked."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "zc@x.com", default_plate: "ZCP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "ZCP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/permits/${p_id}/revoke"
              payload: {}
              as: FacilityAdmin
              captures: { p_status: $.data.status }
          assert:
            - "Permit.${p_id}.status == REVOKED"
            - "Zone.${z_id}.permits_active_count == 0"
            - "Zone.${z_id}.permit_capacity == 5"
