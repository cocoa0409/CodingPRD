# =============================================================================
# SCAFFOLD — task_3070: Direct Veterinary Payment at Checkout &
# Per-Condition Lifetime Deductible (Trupanion-style)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Direct Veterinary Payment at Checkout & Per-Condition Deductible (Trupanion):
  software installed at veterinary hospitals that adjudicates a claim during the
  visit and pays the hospital directly, per-condition lifetime deductible
  accounting rather than an annual deductible with condition definition disputes,
  waiting periods and pre-existing condition determination from medical record
  review, no payout caps with actual-cost reimbursement modeling and
  territory-based pricing, veterinary invoice line categorization between covered
  treatment and excluded exam fees, hospital onboarding, training and
  reconciliation of direct payments, policy pricing changes as a pet ages with
  regulatory rate filing, claim appeals with medical record requests

domain_name: direct-vet-payment
api_prefix: /vetpay

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TerritoryRateFiling
    parent: null
    common_fields: true
    fields:
      - { name: territory_code, type: string, source: input, description: "Postal prefix defining the rating territory, e.g. 941" }
      - { name: state_code, type: string, source: input, description: "Two-letter regulator state code" }
      - { name: species, type: enum, source: input, description: "DOG | CAT", constraints: "enum {DOG, CAT}" }
      - { name: base_monthly_premium_cents, type: integer, source: input, description: "Filed base premium for a pet of age band 0 at coverage_start" }
      - { name: age_band_multipliers, type: object, source: input, description: "Map of integer age band (floor of pet age in years) to premium multiplier decimal, e.g. {\"0\": 1.0, \"1\": 1.05}" }
      - { name: filing_effective_date, type: string, source: input, description: "ISO date; rate may be applied only on/after this date" }
      - { name: regulator_reference, type: string, source: input, description: "State DOI filing reference number" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | EFFECTIVE | SUPERSEDED", constraints: "enum {DRAFT, FILED, EFFECTIVE, SUPERSEDED}" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp when status -> FILED" }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock timestamp when status -> EFFECTIVE" }

  - name: Hospital
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Hospital legal name" }
      - { name: territory_code, type: string, source: input, description: "Hospital's rating territory" }
      - { name: bank_account_ref, type: string, source: input, description: "Opaque bank account reference used for direct-pay disbursement" }
      - { name: checkout_software_version, type: string, source: input, description: "Installed checkout software version string" }
      - { name: training_completed_at, type: datetime, source: system, description: "Set by POST .../training-complete; gates claim submission" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | ACTIVE | SUSPENDED", constraints: "enum {APPLIED, APPROVED, ACTIVE, SUSPENDED}" }
      - { name: running_ledger_balance_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for Payments to this hospital with ledger_status = POSTED minus clawed-back amounts from reversed Payments (REVERSED) minus clawback Payments (negative amounts). Maintained incrementally." }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: owner_name, type: string, source: input, description: "Pet owner full name" }
      - { name: pet_name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT", constraints: "enum {DOG, CAT}" }
      - { name: breed, type: string, source: input, description: "Pet breed" }
      - { name: pet_date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: territory_code, type: string, source: input, description: "Rating territory for this policy; must exist as EFFECTIVE TerritoryRateFiling for species at coverage_start" }
      - { name: coverage_start, type: string, source: input, description: "ISO date coverage begins" }
      - { name: per_condition_deductible_cents, type: integer, source: input, description: "Lifetime deductible per PolicyCondition, in cents" }
      - { name: reimbursement_rate, type: number, source: input, description: "Decimal in (0,1], e.g. 0.90", constraints: "0 < reimbursement_rate <= 1" }
      - { name: enrollment_status, type: enum, source: system, description: "INJURY_WAITING | ILLNESS_WAITING | FULLY_ACTIVE (parallel dimension 1)", constraints: "enum {INJURY_WAITING, ILLNESS_WAITING, FULLY_ACTIVE}" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | CANCELLED | LAPSED (parallel dimension 2)", constraints: "enum {ACTIVE, CANCELLED, LAPSED}" }
      - { name: current_monthly_premium_cents, type: integer, source: computed, description: "Premium in force = round_half_up(base of current EFFECTIVE filing x age multiplier for current band), cents" }
      - { name: filed_base_cents, type: integer, source: system, description: "Base premium from the rate filing locked at enrollment" }
      - { name: applied_filing_id, type: string, source: system, description: "FK -> TerritoryRateFiling.id; filing currently applied to this policy" }
      - { name: next_birthday, type: string, source: computed, description: "ISO date of next pet birthday, used by the age-band recalculation sweep" }
      - { name: injury_waiting_end, type: datetime, source: system, description: "coverage_start 00:00:00Z + INJURY_WAITING_DAYS" }
      - { name: illness_waiting_end, type: datetime, source: system, description: "coverage_start 00:00:00Z + ILLNESS_WAITING_DAYS" }

  - name: MedicalRecord
    parent: Policy
    common_fields: false
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; owning policy" }
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; hospital that produced the record" }
      - { name: record_type, type: enum, source: input, description: "EXAM | LAB | IMAGING | PROCEDURE | PRESCRIPTION", constraints: "enum {EXAM, LAB, IMAGING, PROCEDURE, PRESCRIPTION}" }
      - { name: recorded_at, type: datetime, source: input, description: "When the clinical event occurred (logical past dates allowed)" }
      - { name: diagnosis_code, type: string, source: input, description: "Diagnosis code attached to this record, e.g. K21.9" }
      - { name: notes, type: string, source: input, description: "Free-text clinical notes" }
      - { name: appeal_id, type: string, source: system, description: "FK -> ClaimAppeal.id; set when the record was submitted in support of an appeal; null otherwise", default: null }

  - name: PolicyCondition
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: condition_code, type: string, source: system, description: "Canonical condition identifier copied from the first accepted ClaimLine of this condition; immutable once minted" }
      - { name: preexisting, type: boolean, source: system, description: "True when medical-record review shows any EXAM/PROCEDURE/LAB record with this condition_code dated strictly before coverage_start" }
      - { name: deductible_target_cents, type: integer, source: system, description: "Copy of Policy.per_condition_deductible_cents at first use" }
      - { name: deductible_accumulated_cents, type: integer, source: computed, description: "Lifetime accumulated deductible cents consumed on this condition; never exceeds deductible_target_cents" }
      - { name: lifetime_reimbursed_cents, type: integer, source: computed, description: "Sum of reimbursement_cents across all PAID ClaimLines mapped to this condition (no payout cap)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; treating hospital" }
      - { name: visit_date, type: string, source: input, description: "ISO date of the visit" }
      - { name: claim_type, type: enum, source: input, description: "INJURY | ILLNESS", constraints: "enum {INJURY, ILLNESS}" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PREEXISTING_REVIEW | ADJUDICATED | DENIED | PAID | PAYMENT_FAILED | SETTLED | REOPENED", constraints: "enum {SUBMITTED, PREEXISTING_REVIEW, ADJUDICATED, DENIED, PAID, PAYMENT_FAILED, SETTLED, REOPENED}" }
      - { name: total_invoice_cents, type: integer, source: computed, description: "Sum of ClaimLine.amount_cents over all lines" }
      - { name: eligible_cents, type: integer, source: computed, description: "Sum over lines of eligible_amount_cents" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Sum over lines of deductible_applied_cents" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "Sum over lines of reimbursement_cents; amount payable to hospital (uncapped)" }
      - { name: member_responsibility_cents, type: integer, source: computed, description: "total_invoice_cents - reimbursement_cents" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Timestamp of checkout adjudication" }
      - { name: denial_reason, type: string, source: system, description: "Set when status = DENIED" }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the Payment created for this claim (null until checkout-pay succeeds)", default: null }

  - name: ClaimLine
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: seq, type: integer, source: system, description: "1-based line order within the claim" }
      - { name: description, type: string, source: input, description: "Invoice line description" }
      - { name: amount_cents, type: integer, source: input, description: "Invoice amount for this line, > 0" }
      - { name: category, type: enum, source: input, description: "TREATMENT | EXAM_FEE | TAX | OTHER_EXCLUDED", constraints: "enum {TREATMENT, EXAM_FEE, TAX, OTHER_EXCLUDED}" }
      - { name: condition_code, type: string, source: input, description: "Required when category = TREATMENT; condition this line treats" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "amount_cents when category = TREATMENT and not excluded; 0 otherwise" }
      - { name: policy_condition_id, type: string, source: system, description: "FK -> PolicyCondition.id this line mapped to; null for excluded lines", default: null }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Cents of this line consumed by the per-condition lifetime deductible" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "Per-line round_half_up((eligible - deductible_applied) x rate)" }

  - name: Payment
    parent: Hospital
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id" }
      - { name: amount_cents, type: integer, source: computed, description: "Positive for direct pay to hospital; negative for clawback Payments" }
      - { name: kind, type: enum, source: system, description: "DIRECT_PAY | CLAWBACK", constraints: "enum {DIRECT_PAY, CLAWBACK}" }
      - { name: status, type: enum, source: system, description: "INITIATED | SETTLED | FAILED | REVERSED", constraints: "enum {INITIATED, SETTLED, FAILED, REVERSED}" }
      - { name: ledger_status, type: enum, source: system, description: "POSTED | PENDING_POST | EXCLUDED", constraints: "enum {POSTED, PENDING_POST, EXCLUDED}" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key; duplicate key returns the existing Payment" }
      - { name: reverses_payment_id, type: string, source: system, description: "FK -> Payment.id for CLAWBACK payments; null for DIRECT_PAY", default: null }

  - name: ClaimAppeal
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: opened_by, type: enum, source: system, description: "PET_OWNER", constraints: "enum {PET_OWNER}" }
      - { name: reason_code, type: enum, source: input, description: "PREEXISTING_DISPUTE | CONDITION_DEFINITION | COVERAGE_DENIAL | LINE_CATEGORIZATION", constraints: "enum {PREEXISTING_DISPUTE, CONDITION_DEFINITION, COVERAGE_DENIAL, LINE_CATEGORIZATION}" }
      - { name: original_adjuster_id, type: string, source: system, description: "X-User-ID of the adjuster who last adjudicated or denied the underlying claim; recorded at appeal open for the segregation-of-duties check" }
      - { name: status, type: enum, source: system, description: "OPEN | RECORDS_REQUESTED | UNDER_REVIEW | UPHELD | OVERTURNED", constraints: "enum {OPEN, RECORDS_REQUESTED, UNDER_REVIEW, UPHELD, OVERTURNED}" }
      - { name: records_due_at, type: datetime, source: system, description: "Set when status -> RECORDS_REQUESTED; clock + RECORDS_WINDOW_DAYS" }
      - { name: resolution_note, type: string, source: system, description: "Adjudicator note on resolution" }

  - name: ReconciliationReport
    parent: Hospital
    common_fields: false
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, exclusive" }
      - { name: expected_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents where ledger_status = POSTED and created_at in [period_start, period_end) per the expected ledger variant" }
      - { name: actual_cents, type: integer, source: computed, description: "Hospital.running_ledger_balance_cents snapshot at report generation for the same window per the actual ledger variant" }
      - { name: discrepancy_cents, type: integer, source: computed, description: "expected_cents - actual_cents" }
      - { name: status, type: enum, source: system, description: "GENERATED | ACKNOWLEDGED | DISPUTED", constraints: "enum {GENERATED, ACKNOWLEDGED, DISPUTED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Hospital
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /vetpay/hospitals/{hospitalId}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Hospital.status == APPLIED"
        side_effects:
          - "increments Hospital.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /vetpay/hospitals/{hospitalId}/training-complete"
        actor: HospitalStaff
        preconditions:
          - "Hospital.status == APPROVED"
          - "X-User-ID == hospitalId (staff of this hospital only)"
        side_effects:
          - "training_completed_at := current logical clock"
          - "increments Hospital.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vetpay/hospitals/{hospitalId}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Hospital.status == ACTIVE"
        side_effects:
          - "All Claims at this hospital with status in {SUBMITTED, PREEXISTING_REVIEW, ADJUDICATED, REOPENED} -> DENIED with denial_reason = HOSPITAL_SUSPENDED, each such Claim's ClaimLine.computed fields zeroed and its Claim totals recomputed"
          - "Each Claim thereby set to DENIED cascades: its PolicyCondition mappings are released (deductible_applied contributions reversed) and PolicyCondition.deductible_accumulated_cents is recomputed"
          - "increments Hospital.version by 1"
        note: "Depth-3 cascade: suspend Hospital -> deny open Claims -> reverse PolicyCondition accumulations."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vetpay/hospitals/{hospitalId}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Hospital.status == SUSPENDED"
        side_effects:
          - "increments Hospital.version by 1"
        note: "Reinstatement does NOT reopen claims denied by the suspension; those remain DENIED."

  - entity: Policy
    initial_state: "enrollment_status: INJURY_WAITING; lifecycle_status: ACTIVE"
    terminal_states: ["lifecycle_status: CANCELLED", "lifecycle_status: LAPSED"]
    transitions:
      - from: "enrollment_status: INJURY_WAITING"
        to: "enrollment_status: ILLNESS_WAITING"
        trigger: "system (logical clock reaches injury_waiting_end, evaluated on any Policy read and by POST /vetpay/_clock/set_current_utc sweep)"
        actor: system
        preconditions:
          - "current logical clock >= injury_waiting_end"
        side_effects:
          - "increments Policy.version by 1"
      - from: "enrollment_status: ILLNESS_WAITING"
        to: "enrollment_status: FULLY_ACTIVE"
        trigger: "system (logical clock reaches illness_waiting_end, evaluated on any Policy read and by POST /vetpay/_clock/set_current_utc sweep)"
        actor: system
        preconditions:
          - "current logical clock >= illness_waiting_end"
        side_effects:
          - "increments Policy.version by 1"
      - from: "lifecycle_status: ACTIVE"
        to: "lifecycle_status: CANCELLED"
        trigger: "POST /vetpay/policies/{policyId}/cancel"
        actor: PetOwner
        preconditions:
          - "Policy.lifecycle_status == ACTIVE"
          - "X-User-ID equals the Policy's owner (policyId-bound owner id)"
        side_effects:
          - "increments Policy.version by 1"
      - from: "lifecycle_status: ACTIVE"
        to: "lifecycle_status: LAPSED"
        trigger: "system (premium non-payment marker: POST /vetpay/policies/{policyId}/mark-lapsed)"
        actor: PlatformAdmin
        preconditions:
          - "Policy.lifecycle_status == ACTIVE"
        side_effects:
          - "increments Policy.version by 1"
      - from: "any (lifecycle_status: ACTIVE)"
        to: "same (premium recalculation, no status change)"
        trigger: "system (POST /vetpay/_clock/set_current_utc sweep crosses next_birthday, or POST /vetpay/policies/{policyId}/recalculate-premium)"
        actor: system
        preconditions:
          - "Policy.lifecycle_status == ACTIVE"
          - "current logical date >= next_birthday"
        side_effects:
          - "applied_filing_id := newest EFFECTIVE TerritoryRateFiling for (territory_code, species) with filing_effective_date <= current logical date, tie-break latest effective_at then latest created_at"
          - "current_monthly_premium_cents := round_half_up(filed base from applied_filing_id x age_band_multipliers[new age band])"
          - "next_birthday advances by one year"
          - "increments Policy.version by 1"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [SETTLED]
    transitions:
      - from: SUBMITTED
        to: PREEXISTING_REVIEW
        trigger: "POST /vetpay/claims/{claimId}/flag-preexisting-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "increments Claim.version by 1"
      - from: PREEXISTING_REVIEW
        to: SUBMITTED
        trigger: "POST /vetpay/claims/{claimId}/clear-preexisting-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == PREEXISTING_REVIEW"
        side_effects:
          - "increments Claim.version by 1"
        note: "Cycle PREEXISTING_REVIEW <-> SUBMITTED: review may bounce a claim back for re-adjudication."
      - from: [SUBMITTED, PREEXISTING_REVIEW]
        to: ADJUDICATED
        trigger: "POST /vetpay/claims/{claimId}/adjudicate"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status in {SUBMITTED, PREEXISTING_REVIEW}"
          - "Hospital.status == ACTIVE (ERR_HOSPITAL_NOT_ACTIVE)"
          - "Policy.lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "if Claim.claim_type == INJURY then current clock >= Policy.injury_waiting_end else current clock >= Policy.illness_waiting_end (ERR_WAITING_PERIOD_ACTIVE)"
          - "no TREATMENT line maps to a PolicyCondition with preexisting == true (ERR_PREEXISTING_CONDITION)"
        side_effects:
          - "line categorization + per-condition deductible + reimbursement calculations run; Claim totals written"
          - "increments Claim.version by 1"
      - from: [SUBMITTED, PREEXISTING_REVIEW]
        to: DENIED
        trigger: "POST /vetpay/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status in {SUBMITTED, PREEXISTING_REVIEW}"
          - "denial_reason provided"
        side_effects:
          - "increments Claim.version by 1"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /vetpay/claims/{claimId}/checkout-pay"
        actor: HospitalStaff
        preconditions:
          - "Claim.status == ADJUDICATED"
          - "X-User-ID == Claim.hospital_id"
          - "Claim.reimbursement_cents >= 0 (0-payment claims allowed: a Payment of 0 is created)"
          - "idempotency_key not previously used for another Payment of this claim (duplicate key returns the existing Payment, no new Payment)"
        side_effects:
          - "Payment created: kind DIRECT_PAY, amount_cents = Claim.reimbursement_cents, status SETTLED, ledger_status POSTED"
          - "Claim.payment_id set"
          - "PolicyCondition.lifetime_reimbursed_cents incremented per line (no payout cap)"
          - "Hospital.running_ledger_balance_cents += amount_cents"
          - "increments Claim.version by 1; increments Hospital.version by 1"
      - from: ADJUDICATED
        to: PAYMENT_FAILED
        trigger: "system (simulated rail failure: checkout-pay with header-driven failure injection via payload simulate_outcome = FAILED)"
        actor: system
        preconditions:
          - "Claim.status == ADJUDICATED"
        side_effects:
          - "Payment created with status FAILED, ledger_status PENDING_POST, amount NOT added to Hospital.running_ledger_balance_cents"
          - "increments Claim.version by 1"
      - from: PAYMENT_FAILED
        to: ADJUDICATED
        trigger: "system (retry: another POST /vetpay/claims/{claimId}/checkout-pay after failure)"
        actor: system
        preconditions:
          - "Claim.status == PAYMENT_FAILED"
          - "prior Payment.status == FAILED"
        side_effects:
          - "prior FAILED Payment ledger_status := EXCLUDED"
          - "new Payment created (SETTLED/POSTED on success); Claim.payment_id updated to the new Payment"
          - "increments Claim.version by 1"
        note: "PAYMENT_FAILED <-> ADJUDICATED cycle: retry loop until success."
      - from: PAID
        to: SETTLED
        trigger: "system (logical clock >= paid timestamp + SETTLE_DELAY_DAYS, evaluated on Claim read and clock sweep)"
        actor: system
        preconditions:
          - "Claim.status == PAID"
          - "current logical clock >= adjudication payment time + SETTLE_DELAY_DAYS"
        side_effects:
          - "increments Claim.version by 1"
      - from: SETTLED
        to: REOPENED
        trigger: "system (ClaimAppeal resolved OVERTURNED with remedy REOPEN_CLAIM)"
        actor: system
        preconditions:
          - "Claim.status in {SETTLED, DENIED}"
        side_effects:
          - "original DIRECT_PAY Payment -> REVERSED and its ledger_status stays POSTED; a compensating CLAWBACK Payment (negative amount, POSTED) is created referencing reverses_payment_id"
          - "Hospital.running_ledger_balance_cents decreases by the clawed amount"
          - "PolicyCondition.lifetime_reimbursed_cents and deductible_accumulated_cents recomputed by replaying remaining non-reversed ClaimLines"
          - "increments Claim.version by 1; increments Hospital.version by 1"
        note: "Depth-3 cascade: appeal OVERTURNED -> claim REOPENED -> payment reversed + clawback -> hospital ledger debited."

  - entity: ClaimAppeal
    initial_state: OPEN
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: OPEN
        to: RECORDS_REQUESTED
        trigger: "POST /vetpay/appeals/{appealId}/request-records"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimAppeal.status == OPEN"
        side_effects:
          - "records_due_at := current clock + RECORDS_WINDOW_DAYS"
          - "increments ClaimAppeal.version by 1"
      - from: RECORDS_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /vetpay/appeals/{appealId}/submit-records"
        actor: HospitalStaff
        preconditions:
          - "ClaimAppeal.status == RECORDS_REQUESTED"
          - "current logical clock <= records_due_at (ERR_APPEAL_WINDOW_EXPIRED otherwise)"
          - "payload medical_record_ids all exist, belong to the Claim's Policy, and are not already attached to another appeal (ERR_RECORD_ALREADY_ATTACHED)"
        side_effects:
          - "each referenced MedicalRecord.appeal_id := this appeal id"
          - "increments ClaimAppeal.version by 1"
      - from: [OPEN, UNDER_REVIEW]
        to: UPHELD
        trigger: "POST /vetpay/appeals/{appealId}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimAppeal.status in {OPEN, UNDER_REVIEW}"
          - "outcome == UPHELD"
        side_effects:
          - "increments ClaimAppeal.version by 1"
      - from: [OPEN, UNDER_REVIEW]
        to: OVERTURNED
        trigger: "POST /vetpay/appeals/{appealId}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimAppeal.status in {OPEN, UNDER_REVIEW}"
          - "outcome == OVERTURNED"
          - "segregation of duties: the resolving adjuster's X-User-ID MUST differ from the X-User-ID of the adjuster who adjudicated or denied the underlying Claim (ERR_SELF_RESOLUTION_FORBIDDEN)"
        side_effects:
          - "underlying Claim transitions per remedy: DENIED -> REOPENED or SETTLED -> REOPENED (payment reversal + clawback cascade fires)"
          - "increments ClaimAppeal.version by 1"

  - entity: TerritoryRateFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /vetpay/rate-filings/{filingId}/file"
        actor: RateFilingAdmin
        preconditions:
          - "TerritoryRateFiling.status == DRAFT"
          - "filing_effective_date >= current logical date (ERR_FILING_RETROACTIVE)"
        side_effects:
          - "filed_at := current clock"
          - "increments TerritoryRateFiling.version by 1"
      - from: FILED
        to: EFFECTIVE
        trigger: "system (logical clock reaches filing_effective_date 00:00:00Z, evaluated on read and clock sweep)"
        actor: system
        preconditions:
          - "current logical date >= filing_effective_date"
        side_effects:
          - "effective_at := current clock"
          - "any other EFFECTIVE filing with same (territory_code, species) -> SUPERSEDED"
          - "increments TerritoryRateFiling.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-adjudicate-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /vetpay/claims/{claimId}/adjudicate"
    occ_field: "expected_claim_version"
    description: |
      Adjudicating a Claim whose version has advanced since the client last
      observed it is rejected. This captures the case where another adjuster
      has already adjudicated, flagged, or cleared review on the same claim
      and the current adjuster's view is stale.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: hospital-mutation-stale-hospital
    parent_entity: Hospital
    write_endpoint: "POST /vetpay/hospitals/{hospitalId}/approve"
    occ_field: "expected_hospital_version"
    description: |
      Approving a Hospital whose version has advanced since the client last
      observed it is rejected; an administrator acting on a stale snapshot
      (e.g., after another administrator already approved or suspended) must
      re-read before retrying.
    error_id: ERR_STALE_HOSPITAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_categorization_and_eligibility
    trigger: "Claim adjudication (POST /vetpay/claims/{claimId}/adjudicate)"
    algorithm: constraint_propagation
    formula: |
      for each ClaimLine in claim, ordered by seq ASC:
        if line.category == TREATMENT:
          condition_code required (else ERR_CONDITION_CODE_REQUIRED)
          find PolicyCondition of the claim's policy with condition_code ==
            line.condition_code; if none, create one now:
              preexisting := exists MedicalRecord of the policy with
                diagnosis_code == line.condition_code and
                recorded_at < policy.coverage_start 00:00:00Z and
                record_type in {EXAM, PROCEDURE, LAB}
              deductible_target_cents := policy.per_condition_deductible_cents
              deductible_accumulated_cents := 0
          if policy_condition.preexisting: reject claim with ERR_PREEXISTING_CONDITION
          line.eligible_amount_cents := line.amount_cents
          line.policy_condition_id := policy_condition.id
        else (EXAM_FEE | TAX | OTHER_EXCLUDED):
          line.eligible_amount_cents := 0
          line.policy_condition_id := null
    input_set: "all ClaimLines of the claim; MedicalRecords of the claim's policy with record_type in {EXAM, PROCEDURE, LAB}"
    precision: "integer cents; no rounding in this rule"

  - name: per_condition_deductible_and_reimbursement
    trigger: "Claim adjudication, immediately after line_categorization_and_eligibility"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned: process ClaimLines ordered by seq ASC
      (tie-break: none needed, seq is unique per claim).
      for each ClaimLine with eligible_amount_cents > 0:
        pc := the line's PolicyCondition
        remaining := pc.deductible_target_cents - pc.deductible_accumulated_cents
        line.deductible_applied_cents := min(remaining, line.eligible_amount_cents)
        pc.deductible_accumulated_cents += line.deductible_applied_cents
        base := line.eligible_amount_cents - line.deductible_applied_cents
        line.reimbursement_cents := round_half_up(base * policy.reimbursement_rate)  # per-line rounding, THEN sum
      claim.eligible_cents := sum(line.eligible_amount_cents)
      claim.deductible_applied_cents := sum(line.deductible_applied_cents)
      claim.reimbursement_cents := sum(line.reimbursement_cents)
      claim.total_invoice_cents := sum(line.amount_cents)
      claim.member_responsibility_cents := claim.total_invoice_cents - claim.reimbursement_cents
    input_set: "ClaimLines with eligible_amount_cents > 0 only; excluded lines contribute 0 to all claim totals except total_invoice_cents"
    constants:
      ROUNDING: "round_half_up per line, then sum (sum-then-round is FORBIDDEN)"
    precision: "integer cents, round_half_up at the per-line multiplication step only"
    note: "No payout cap: reimbursement_cents is unbounded by any lifetime or annual maximum."

  - name: monthly_premium
    trigger: "Policy creation; age-band sweep; recalculate-premium"
    algorithm: tiered_pricing
    formula: |
      age_band := floor((current logical date - pet_date_of_birth) in years)
      filing := the policy's applied_filing_id filing
      mult := filing.age_band_multipliers[str(age_band)] if present,
              else the multiplier of the greatest declared band <= age_band,
              else 1.0 if no band <= age_band exists
      current_monthly_premium_cents := round_half_up(filing.base_monthly_premium_cents * mult)
    input_set: "the applied TerritoryRateFiling; policy pet_date_of_birth; logical clock"
    precision: "integer cents, round_half_up"
    variants:
      - name: enrollment_base
        when: "at POST /vetpay/policies creation"
        difference: "filing := newest EFFECTIVE filing for (territory_code, species) with filing_effective_date <= coverage_start; tie-break latest effective_at then latest created_at. age band computed at coverage_start. Result stored in filed_base_cents AND current_monthly_premium_cents."
      - name: age_band_recalc
        when: "clock sweep crosses next_birthday or POST .../recalculate-premium"
        difference: "filing re-selected as the newest EFFECTIVE filing with filing_effective_date <= CURRENT logical date (not coverage_start); age band recomputed at current date; filed_base_cents is left unchanged (historical), only current_monthly_premium_cents and applied_filing_id update."

  - name: reconciliation_expected_vs_actual
    trigger: "POST /vetpay/hospitals/{hospitalId}/reconciliation-reports"
    algorithm: aggregation
    formula: |
      expected_cents := sum of Payment.amount_cents where
        payment.hospital_id == hospital AND payment.ledger_status == POSTED
        AND period_start <= payment.created_at < period_end   (half-open window)
      actual_cents := Hospital.running_ledger_balance_cents at report time
        for the identical window, reconstructed by replaying the same POSTED
        payments in created_at ASC order (tie-break: none; timestamps unique
        per mutation) and summing signed amounts.
      discrepancy_cents := expected_cents - actual_cents
    input_set: "Payments of the hospital with ledger_status == POSTED in the half-open [period_start, period_end) window; FAILED/EXCLUDED payments never contribute"
    precision: "integer cents"
    variants:
      - name: expected_ledger
        when: "expected_cents field"
        difference: "computed purely from the Payment table filtered by window and ledger_status"
      - name: actual_ledger
        when: "actual_cents field"
        difference: "reconstructed from the hospital ledger replay; identical inputs but a different accumulation path (incremental ledger vs windowed sum) — the two must agree when no reversal has been mishandled"
    note: "Dual-variant reconciliation: the two variants agree only if every reversal created a matching negative CLAWBACK payment."

  - name: preexisting_determination
    trigger: "PolicyCondition creation during adjudication; appeal re-review"
    algorithm: chronological
    formula: |
      records := MedicalRecords of the policy with
        diagnosis_code == condition_code AND
        record_type in {EXAM, PROCEDURE, LAB}
      preexisting := any(record.recorded_at < policy.coverage_start 00:00:00Z for record in records)
      Boundary: a record dated exactly ON coverage_start (>= coverage_start 00:00:00Z) does NOT count as pre-existing.
    input_set: "MedicalRecords of the policy; appeal-attached records participate once attached"
    precision: "datetime comparison at UTC midnight boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (hospitalId, policyId, claimId, appealId, filingId, reportId)"
    error_id: "ERR_HOSPITAL_NOT_FOUND / ERR_POLICY_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_APPEAL_NOT_FOUND / ERR_FILING_NOT_FOUND / ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body-referenced ids must exist (policy_id, hospital_id, medical_record_ids elements, expected_*_version target)"
    error_id: "ERR_POLICY_NOT_FOUND / ERR_HOSPITAL_NOT_FOUND / ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "POST endpoints with body FK references"
  - priority: 5
    category: state
    check: "Target resource must be in a state from which the requested transition exists"
    error_id: "ERR_INVALID_STATE (state-specific aliases: ERR_CLAIM_NOT_ADJUDICATABLE, ERR_CLAIM_NOT_PAYABLE, ERR_APPEAL_NOT_RESOLVABLE, ERR_FILING_NOT_FILABLE, ERR_HOSPITAL_NOT_APPROVABLE)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_temporal
    check: "Waiting periods: INJURY claims before injury_waiting_end and ILLNESS claims before illness_waiting_end are rejected; boundary is inclusive (claim at exactly waiting_end passes)"
    error_id: ERR_WAITING_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /vetpay/claims/{claimId}/adjudicate"
  - priority: 7
    category: business_safety
    check: "Pre-existing condition: no TREATMENT line may map to a PolicyCondition with preexisting == true"
    error_id: ERR_PREEXISTING_CONDITION
    http_status: 422
    applies_to: "POST /vetpay/claims/{claimId}/adjudicate"
  - priority: 8
    category: business_referential
    check: "Appeal record submission: every medical_record_id must exist, belong to the claim's policy, and not be attached to another appeal; submission must occur on/before records_due_at"
    error_id: "ERR_RECORD_NOT_FOUND / ERR_RECORD_ALREADY_ATTACHED / ERR_APPEAL_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /vetpay/appeals/{appealId}/submit-records"
  - priority: 9
    category: business_constraint
    check: "Segregation of duties: appeal resolver must not be the adjuster who adjudicated/denied the claim; hospital staff may act only for their own hospital; owner may cancel only own policy"
    error_id: "ERR_SELF_RESOLUTION_FORBIDDEN / ERR_UNAUTHORIZED"
    http_status: 403
    applies_to: "resolve / checkout-pay / training-complete / cancel"
  - priority: 10
    category: business_constraint
    check: "Hospital must be ACTIVE for claim submission and adjudication; policy lifecycle_status must be ACTIVE"
    error_id: "ERR_HOSPITAL_NOT_ACTIVE / ERR_POLICY_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /vetpay/claims, POST /vetpay/claims/{claimId}/adjudicate"
  - priority: 11
    category: business_fiscal
    check: "Rate filing: no EFFECTIVE filing may exist for (territory, species) at policy creation (else ERR_RATE_NOT_FILED); new filings must not be retroactive; claim line amounts must be positive integers"
    error_id: "ERR_RATE_NOT_FILED / ERR_FILING_RETROACTIVE / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /vetpay/policies, POST /vetpay/rate-filings/{filingId}/file, POST /vetpay/claims"

