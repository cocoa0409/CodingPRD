              captures: { field_id: $.data.id, field_value_before: $.data.value }
            - call: "GET /esign/audit-events?envelope_id=${env_id}"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { events_before: "$.data[0].sequence_number" }
          trigger:
            - call: "PATCH /esign/fields/${field_id}"
