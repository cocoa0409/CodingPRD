  # ===========================================================================

  - rule_id: combinatorial_formula
    instances:

      - name: fitness_composite_five_inputs_non_linear_floor_cap
        grounds:
          - calculations.physical_fitness_composite
          - entities.ScreeningRecord.fields.composite_score
          - entities.Recruit.fields.age_bracket
          - entities.CertificationStandard.fields.fitness_event_floor_points
          - validations[priority 55 ERR_FITNESS_STANDARD_NOT_MET]
          - endpoints[POST /screening-records/{screeningRecordId}/findings]
        distinguishing_aspect: |
          Five inputs interact: four event measurements plus the recruit's age_bracket, which
          selects the FITNESS_STANDARDS row. One event ratio is INVERTED (run time), each ratio
          is bucketed through TIER_BOUNDS unrounded, and then a non-linear gate caps the sum at
          COMPOSITE_FLOOR_CAP 59 whenever the WEAKEST event scores below fitness_event_floor_points.
          Two recruits differing by three inches of vertical jump differ by 18 composite points
          (59 vs 77), not 6, and the capped one cannot be CLEARED at all. No single-input formula
          and no linear sum of the four events reproduces both numbers.
        test_recipe:
          setup:
            - "One CertificationStandard with fitness_event_floor_points 10 and fitness_pass_score 60."
            - "One AcademyClass and two AGE_20_29 recruits, each with one ORDERED PHYSICAL_FITNESS ScreeningRecord."
            - "Recruit A's findings: push_ups 36 (ratio exactly 1.20), sit_ups 38 (ratio exactly 1.00), run 700s (ratio 750/700 = 1.0714), vertical_jump 13 in (ratio 0.7222)."
            - "Recruit B's findings are identical except vertical_jump 16 in (ratio 0.8889)."
            - "Logical clock stays at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-FIT", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 6.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-F", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "F-001", full_name: "Alba Reyes", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec_a: $.data.id }
            - call: "POST /recruits"
