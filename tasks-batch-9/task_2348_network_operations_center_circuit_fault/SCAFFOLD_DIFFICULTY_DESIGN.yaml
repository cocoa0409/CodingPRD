      - name: incident_escalation_dimension_de_escalates_on_mitigated
        grounds:
          - state_machines.Incident.response_state_dimension
          - state_machines.Incident.escalation_state_dimension
          - endpoints["POST /incidents/{id}/escalate"]
          - endpoints["POST /incidents/{id}/response"]
          - entities.Incident.fields.escalation_state
          - entities.Incident.fields.response_state
        distinguishing_aspect: |
          Two independent state dimensions on one row rather than a cycle on one dimension: escalate
          twice moves escalation_state NONE -> L1 -> L2 while response_state stays DETECTED, and then
          the single TRIAGED -> MITIGATED response step reaches across dimensions to de-escalate exactly
          one step (L2 -> L1) — the coupling is one-directional and one-step, not a reset to NONE.
        test_recipe:
          setup:
            - "Carrier SRG with one MONITORED circuit SRG-CKT-3001."
            - "One GOLD single-leg ApplicationPath on that circuit."
            - "A CRITICAL alarm at 00:00 opens Incident i2 in response_state DETECTED and escalation_state NONE with impact_score 50 -> SEV1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Southridge Networks", carrier_code: "SRG" }
              as: PlatformAdmin
              captures: { srg_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${srg_id}", carrier_circuit_identifier: "SRG-CKT-3001", site_a_code: "ATL01", site_z_code: "MIA01", bandwidth_mbps: 500, mrc_cents: 400000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Card Auth Path", service_tier: "GOLD", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pa_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c3_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-12T00:00:00Z", source_circuit_id: "${c3_id}" }
              as: NocAnalyst
              captures: { a2_id: $.data.id, i2_id: $.data.incident_id }
            - call: "POST /incidents/${i2_id}/escalate"
              payload: { target_escalation_state: "L1" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /incidents/${i2_id}/escalate"
              payload: { target_escalation_state: "L2" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /incidents/${i2_id}/response"
              payload: { target_response_state: "TRIAGED", note: "field tech dispatched" }
              as: NocAnalyst
          trigger:
            - call: "POST /incidents/${i2_id}/response"
              payload: { target_response_state: "MITIGATED", note: "traffic rerouted over the backup path" }
              as: NocAnalyst
          assert:
            - "Incident.${i2_id}.impact_score == 50 and severity == SEV1"
            - "after the two escalate calls escalation_state == L2 while response_state was still DETECTED"
            - "after the TRIAGED call escalation_state was still L2 (a response step below MITIGATED does not touch the escalation dimension)"
            - "Incident.${i2_id}.response_state == MITIGATED"
            - "Incident.${i2_id}.escalation_state == L1 (exactly one step down from L2, not NONE)"
            - "Incident.${i2_id}.mitigated_at == 2026-08-12T00:00:00.000Z"
            - "Incident.${i2_id}.resolved_at == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: alarm_to_circuit_to_path_posture_to_sibling_spof_to_severity
        grounds:
          - endpoints["POST /alarms"]
          - calculations.alarm_correlation_assignment
          - calculations.path_posture_and_legs
          - calculations.incident_severity_classification
          - entities.Circuit.fields.spof_flag
          - entities.ApplicationPath.fields.posture
          - entities.ApplicationPath.fields.healthy_leg_count
        distinguishing_aspect: |
          A four-hop structural cascade inside one request: alarm -> Circuit.operational_state DOWN ->
          ApplicationPath.posture DEGRADED_NO_REDUNDANCY -> the SURVIVING sibling circuit's spof_flag
          becomes true (the failed circuit's stays false) -> the incident's impact_score is computed
          AFTER those hops as 40 + 2 + 4 + 0 = 46 -> SEV2, so hop ordering is observable in one number.
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED circuits EWT-CKT-2001 (LEG_A) and EWT-CKT-2002 (LEG_B)."
            - "One GOLD ApplicationPath 'Core Voice Path' ACTIVE_ACTIVE with min_surviving_legs 1 spanning both legs; before the alarm its posture is PROTECTED with healthy_leg_count 2 and both circuits have spof_flag false."
            - "The logical clock is at 2026-08-11T04:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
