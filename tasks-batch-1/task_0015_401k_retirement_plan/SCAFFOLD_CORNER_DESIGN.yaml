        claim_type: immediate_consistency
        grounds:
          - state_machines.ContributionPeriod.OPEN_to_CLOSED
        distinguishing_aspect: "Immediate-consistency model: closing a ContributionPeriod and then immediately reading the participant returns the post-cascade employee_balance and employer_balance in the same request cycle."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; ACTIVE plan; ENROLLED participant with one OPEN ContributionPeriod gross=500000, deferral 400 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Imm", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Imm", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "GET /participants/${p_id}"
              payload: {}
              as: PlanAdmin
              captures: { eb: $.data.employee_balance_cents, mb: $.data.employer_balance_cents }
          assert:
            - "${eb} == 20000"
