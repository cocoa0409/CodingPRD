            - "after dispute, ServicePeriodReport.${rep4}.status == 'DISPUTED' and settlement_variant == 'NONE'"
            - "${disputed_gross} == 0"
            - "after dispute, ServicePeriodReport.${rep4}.on_time_pct == 0 and net_amount_cents == 0"
            - "after the second submit, ServicePeriodReport.${rep4}.status == 'SUBMITTED' and settlement_variant == 'PROVISIONAL'"
            - "${second_gross} == 7200"
            - "${second_round} == 1"
            - "ServicePeriodReport.${rep4}.billable_service_hours == 0.80 and ServicePeriodReport.${rep4}.on_time_pct == 100.00"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: maintenance_open_displaces_trip_and_requeues_request
        grounds:
          - state_machines.Vehicle.AVAILABLE_to_IN_MAINTENANCE
          - state_machines.Trip.ASSIGNED_to_SCHEDULED
          - state_machines.OnDemandRequest.MATCHED_to_PENDING
          - state_machines.Route.PUBLISHED_to_DEGRADED
          - entities.MaintenanceOrder.fields.displaced_trip_count
          - calculations.vehicle_committed_block_minutes
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /maintenance-orders: the OPEN order moves the
          vehicle to IN_MAINTENANCE, that vehicle transition displaces the ASSIGNED trip
          back to SCHEDULED, and that trip losing its vehicle pushes the MATCHED on-demand
          request back to PENDING — each hop caused by the previous one, plus the route
          degradation branch off hop three.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T05:00:00Z, so a maintenance order dated 2026-09-02 is same-day."
            - "One ACTIVE ServiceContract with one PUBLISHED Route (loop 48, headway 12, window 420..456) whose required_vehicle_count is 8."
            - "The first trip (departs 420, arrives 468) is ASSIGNED to an ADA vehicle and an ADA-certified driver."
            - "One OnDemandRequest requiring ADA is MATCHED to that trip."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T05:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Cascade Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c9: $.data.id }
            - call: "POST /service-contracts/${c9}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c9}", name: "Cascade Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r9: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-601", seat_capacity: 20, is_ada_accessible: true, odometer_km: 30000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v9: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Priya Raman", license_class: "CDL_B", ada_certified: true, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d9: $.data.id }
            - call: "POST /routes/${r9}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r9}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { z1: "$.data[0].id" }
            - call: "POST /trips/${z1}/assign"
              payload: { vehicle_id: "${v9}", driver_id: "${d9}" }
              as: OpsPlanner
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${c9}", service_date: "2026-09-02", requested_pickup_min: 420, party_size: 2, requires_ada: true }
              as: ClientLiaison
              captures: { od2: $.data.id }
            - call: "POST /on-demand-requests/${od2}/match"
              payload: {}
              as: OpsPlanner
          trigger:
            - call: "POST /maintenance-orders"
              payload: { vehicle_id: "${v9}", kind: "CORRECTIVE", service_date: "2026-09-02", window_start_min: 400, window_end_min: 500 }
              as: FleetManager
              captures: { mo1: $.data.id, displaced: $.data.displaced_trip_count }
          assert:
            - "${displaced} == 1"
            - "MaintenanceOrder.${mo1}.status == 'OPEN' and MaintenanceOrder.${mo1}.odometer_at_open == 30000"
            - "GET /vehicles/${v9} -> Vehicle.status == 'IN_MAINTENANCE' and Vehicle.committed_block_minutes == 0"
            - "GET /trips/${z1} -> Trip.dispatch_status == 'SCHEDULED' and Trip.vehicle_id == null and Trip.driver_id == null"
            - "GET /on-demand-requests/${od2} -> OnDemandRequest.status == 'PENDING' and OnDemandRequest.matched_trip_id == null and OnDemandRequest.promised_wait_minutes == 9"
            - "GET /routes/${r9} -> Route.status == 'DEGRADED' and Route.required_vehicle_count == 8"
            - "GET /drivers/${d9} -> Driver.assigned_duty_minutes_current_date == 0"

      - name: missed_trip_mints_memo_and_moves_contract_balance
        grounds:
          - state_machines.Trip.SCHEDULED_to_MISSED
          - state_machines.Trip.UNBILLED_to_CREDITED
          - calculations.contract_credit_balance
          - entities.CreditMemo.fields.amount_cents
          - entities.ServiceContract.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST /trips/{id}/mark-missed, not
          POST /maintenance-orders): the trip's settlement axis moving to CREDITED mints the
          MISSED_TRIP memo, and that memo becoming ISSUED is what drives the contract's
          credit_balance_cents from 0 to 4500.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with penalty_rate_cents_per_missed_trip 4500 and credit_balance_cents 0."
            - "One PUBLISHED Route with a single SCHEDULED trip on 2026-09-02 and no credit memos anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Missed Trip Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c10: $.data.id }
            - call: "POST /service-contracts/${c10}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c10}", name: "Missed Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r10: $.data.id }
            - call: "POST /routes/${r10}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r10}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { z2: "$.data[0].id" }
          trigger:
            - call: "POST /trips/${z2}/mark-missed"
              payload: { reason: "OPERATOR_FAULT" }
              as: OpsPlanner
              captures: { z2_settlement: $.data.settlement_status }
          assert:
            - "${z2_settlement} == 'CREDITED'"
            - "GET /trips/${z2} -> Trip.dispatch_status == 'MISSED' and Trip.missed_reason == 'OPERATOR_FAULT'"
            - "GET /credit-memos?contract_id=${c10} -> exactly one memo with trip_id == '${z2}', reason == 'MISSED_TRIP', status == 'ISSUED' and amount_cents == 4500"
            - "GET /service-contracts/${c10} -> ServiceContract.credit_balance_cents == 4500"

