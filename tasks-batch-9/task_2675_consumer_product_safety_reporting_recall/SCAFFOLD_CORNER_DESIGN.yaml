      - name: duplicate_disposition_pointers_reject_self_chain_and_cross_model_targets
        claim_type: Violation -> Error
        grounds:
          - validations[24]
          - validations[25]
          - errors.ERR_SELF_DUPLICATE_REFERENCE
          - errors.ERR_DUPLICATE_CHAIN_FORBIDDEN
        distinguishing_aspect: |
          Referential integrity on a SELF-REFERENTIAL pointer, probed on all three of
          its failure modes from a single surviving-primary fixture: the pointer at
          itself, the pointer at a row that is already a duplicate (chain depth 2),
          and the pointer at a row under a different ProductModel. An implementation
          that only rejects the self-pointer builds duplicate chains that no longer
          resolve to a primary in one hop.
        test_recipe:
          setup:
            - "two product models; three INTAKE incidents on the first model and one INTAKE incident on the second"
            - "the second incident of model A is already disposed as MERGED_DUPLICATE pointing at the first, so a valid one-hop pointer exists to chain off"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "KETTLE-A1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 400, units_registered: 100 }
              as: ProgramAdmin
              captures: { pma_id: $.data.id }
            - call: "POST /product-safety/product-models"
              payload: { model_code: "KETTLE-B2", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 400, units_registered: 100 }
              as: ProgramAdmin
              captures: { pmb_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pma_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Kettle lid released steam onto the user hand." }
              as: IntakeSpecialist
              captures: { a1_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pma_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Kettle lid released steam onto the user hand." }
              as: IntakeSpecialist
              captures: { a2_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pma_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Kettle lid released steam onto the user hand." }
              as: IntakeSpecialist
              captures: { a3_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmb_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Kettle lid released steam onto the user hand." }
              as: IntakeSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /product-safety/incidents/${a2_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${a1_id}", note: "Same consumer filed twice." }
              as: IntakeSpecialist
          trigger:
            - call: "POST /product-safety/incidents/${a3_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${a3_id}" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${a3_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${a2_id}" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${a3_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${b1_id}" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${a3_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${a1_id}" }
              as: IntakeSpecialist
              captures: { a3_status: $.data.status, a3_ptr: $.data.duplicate_of_incident_id }
          assert:
            - "pointing at itself returns 422 ERR_SELF_DUPLICATE_REFERENCE"
            - "pointing at the already-merged ${a2_id} returns 422 ERR_DUPLICATE_CHAIN_FORBIDDEN (the target's own status is MERGED_DUPLICATE)"
            - "pointing at ${b1_id} under the other product model returns 422 ERR_DUPLICATE_CHAIN_FORBIDDEN"
            - "the fourth call, pointing at the surviving primary ${a1_id}, returns 200 with ${a3_status} == MERGED_DUPLICATE and ${a3_ptr} == ${a1_id}"
            - "Incident.${a1_id}.status remains INTAKE and its duplicate_of_incident_id remains null — the primary is never rewritten"

