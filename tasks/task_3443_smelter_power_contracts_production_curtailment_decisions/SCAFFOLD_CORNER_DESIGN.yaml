- section: errors
  instances:
  - name: error_interruptible_cap_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INTERRUPTIBLE_CAP_EXCEEDED]
    excluded_because:
      difficulty_instance: interruptible_hours_exactly_at_cap
      rationale: Asserted as the failure path of the named difficulty instance (0.5h beyond the exactly-at-cap cumulative
        500h).
  - name: error_contract_window_overlap_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CONTRACT_WINDOW_OVERLAP]
    excluded_because:
      difficulty_instance: power_contract_half_open_adjacency
      rationale: Asserted as the C3 activate failure in the named difficulty instance.
  - name: error_permit_not_active_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PERMIT_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: restart_start_requires_active_spl_permit
      rationale: Asserted as the first start's failure in the named difficulty instance.
  - name: error_labor_notice_period_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LABOR_NOTICE_PERIOD]
    excluded_because:
      difficulty_instance: execute_notice_period_beats_hedge_coverage
      rationale: Asserted as the execute failure in the named difficulty instance.
  - name: error_product_mix_over_capacity_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PRODUCT_MIX_OVER_CAPACITY]
    excluded_because:
      difficulty_instance: product_mix_sum_exactly_at_capacity
      rationale: Asserted as the over-capacity plan rejection in the named difficulty instance.
  - name: error_hedge_volume_exceeds_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_HEDGE_VOLUME_EXCEEDS_EXPOSURE]
    excluded_because:
      difficulty_instance: hedge_delivery_month_aggregate_capacity
      rationale: Asserted as the 0.01t overflow rejection in the named difficulty instance.
  - name: error_labor_agreement_inactive_trigger
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LABOR_AGREEMENT_INACTIVE]
    excluded_because:
      difficulty_instance: decision_execute_requires_active_labor_agreement
      rationale: Asserted as the execute failure in the named difficulty instance.
