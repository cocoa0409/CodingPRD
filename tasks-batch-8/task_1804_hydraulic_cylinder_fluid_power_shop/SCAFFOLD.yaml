  - method: GET
    path: "/fluid-power/certificates/{id}"
    description: "Get a certificate"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/fluid-power/certificates"
    description: "List certificates"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["work_order_id?", "pressure_test_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/fluid-power/certificates/{id}/revoke"
    description: "Revoke a certificate; cascades work order back to TEST_PENDING and voids the passing test"
    roles: [QualityInspector]
    code: 200
    input: [reason]
    output: Certificate
    side_effects: ["ISSUED -> REVOKED; WorkOrder CERTIFIED -> TEST_PENDING; PressureTest PASSED -> VOIDED"]

  # --- ExchangeUnit pool ---
  - method: POST
    path: "/fluid-power/exchange-units"
    description: "Add a remanufactured unit to the exchange pool"
    roles: [ShopAdmin]
    code: 201
    input: [bore_mm, stroke_mm, rod_diameter_mm, pressure_class, unit_price_cents]
    output: ExchangeUnit
    side_effects: ["status=IN_POOL"]
  - method: GET
    path: "/fluid-power/exchange-units/{id}"
    description: "Get an exchange unit"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: ExchangeUnit
    side_effects: []
  - method: GET
    path: "/fluid-power/exchange-units"
    description: "List exchange pool units"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["status?", "work_order_id?", "bore_mm?", "limit?", "offset?"]
    output: ExchangeUnit[]
    side_effects: []
  - method: POST
    path: "/fluid-power/exchange-units/{id}/release"
    description: "Unreserve a unit back into the pool"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: []
    output: ExchangeUnit
    side_effects: ["RESERVED -> IN_POOL; work_order_id cleared"]
  - method: POST
    path: "/fluid-power/exchange-units/{id}/fulfill"
    description: "Hand the reserved unit to the customer; provisional core credit computed"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: []
    output: ExchangeUnit
    side_effects: ["RESERVED -> FULFILLED; provisional_credit_cents computed; Cylinder -> EXCHANGED; WorkOrder -> EXCHANGE_FULFILLED"]
  - method: POST
    path: "/fluid-power/exchange-units/{id}/receive-core"
    description: "Log return of the customer's core unit"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: []
    output: ExchangeUnit
    side_effects: ["FULFILLED -> CORE_RECEIVED"]
  - method: POST
    path: "/fluid-power/exchange-units/{id}/evaluate-core"
    description: "Grade the returned core; final credit computed and deal settled"
    roles: [QualityInspector]
    code: 200
    input: [condition, completeness]
    output: ExchangeUnit
    side_effects: ["CORE_RECEIVED -> SETTLED; final_credit_cents computed via exchange_core_credit final variant"]

  # --- FieldServiceJob ---
  - method: POST
    path: "/fluid-power/field-service-jobs"
    description: "Book an on-site hose-crimping job with assembly specs; provisional price computed"
    roles: [ShopAdmin, ServiceAdvisor, Customer]
    code: 201
    input: [customer_id, site_address, distance_km, assemblies]
    output: FieldServiceJob
    side_effects: ["status=REQUESTED; provisional_price_cents computed (non-emergency callout)"]
  - method: GET
    path: "/fluid-power/field-service-jobs/{id}"
    description: "Get a field service job"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: FieldServiceJob
    side_effects: []
  - method: GET
    path: "/fluid-power/field-service-jobs"
    description: "List field service jobs"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["customer_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: FieldServiceJob[]
    side_effects: []
  - method: POST
    path: "/fluid-power/field-service-jobs/{id}/schedule"
    description: "Assign technician and window (OCC on Technician.version; half-open overlap check)"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: [technician_id, window_start, window_end, expected_technician_version]
    output: FieldServiceJob
    side_effects: ["REQUESTED -> SCHEDULED; emergency_callout computed; increments Technician.version by 1"]
  - method: POST
    path: "/fluid-power/field-service-jobs/{id}/dispatch"
    description: "Dispatch the assigned technician"
    roles: [Technician]
    code: 200
    input: []
    output: FieldServiceJob
    side_effects: ["SCHEDULED -> DISPATCHED"]
  - method: POST
    path: "/fluid-power/field-service-jobs/{id}/complete"
    description: "Record crimp measurements and complete; out-of-tolerance assemblies keep the job DISPATCHED"
    roles: [Technician]
    code: 200
    input: [crimp_measurements]
    output: FieldServiceJob
    side_effects: ["DISPATCHED -> COMPLETED when all assemblies within tolerance; final_price_cents computed"]
  - method: POST
    path: "/fluid-power/field-service-jobs/{id}/cancel"
    description: "Cancel a field job"
    roles: [ShopAdmin, ServiceAdvisor, Customer]
    code: 200
    input: ["reason?"]
    output: FieldServiceJob
    side_effects: ["REQUESTED/SCHEDULED -> CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid type or enum member" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Entity-backed caller does not own / is not assigned to the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key references a non-existent resource" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target resource is in a terminal state; no further transitions" }
  - { id: ERR_QUOTE_NOT_APPROVABLE, http: 409, condition: "Quote is not SENT (already approved, revised, superseded, expired, or rejected)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Approve attempted after sent_at + quote_ttl_hours; quote flips to EXPIRED" }
  - { id: ERR_ACTIVE_QUOTE_EXISTS, http: 409, condition: "Work order already has a quote in DRAFT or SENT" }
  - { id: ERR_TEARDOWN_REPORT_EXISTS, http: 409, condition: "A teardown report already exists for the work order" }
  - { id: ERR_TEARDOWN_STALE, http: 409, condition: "Quote pinned to a superseded TeardownReport version; cannot be sent" }
  - { id: ERR_SCRAP_NOT_AUTHORIZED, http: 409, condition: "complete-scrap attempted before customer authorize-scrap" }
  - { id: ERR_CYLINDER_RETIRED, http: 409, condition: "Work order creation on a RETIRED or EXCHANGED cylinder" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Work order creation for a SUSPENDED customer" }
  - { id: ERR_CLEANLINESS_CLASS_EXCEEDED, http: 422, condition: "complete-assembly with cleanliness_passed false (latest sample above target class or none recorded)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Certification attempted by the same user id that is the work order's assigned technician" }
  - { id: ERR_PRESSURE_HOLD_INSUFFICIENT, http: 422, condition: "record-result passed=true but measured_hold_psi < required_hold_psi, duration below minimum, or leakage_drops > 0" }
  - { id: ERR_CRIMP_OUT_OF_TOLERANCE, http: 422, condition: "Any assembly's measured crimp diameter deviates from spec by more than crimp_tolerance_mm" }
  - { id: ERR_SEAL_KIT_INCOMPATIBLE, http: 422, condition: "Seal kit bore range, pressure-class ceiling, or fluid compatibility does not cover the cylinder spec" }
  - { id: ERR_TEST_BAY_WINDOW_OVERLAP, http: 409, condition: "Bay booking collides with another SCHEDULED/PASSED-pending booking once the mandatory buffer is added to both sides" }
  - { id: ERR_TECHNICIAN_WINDOW_OVERLAP, http: 409, condition: "Technician half-open window overlap with another SCHEDULED/DISPATCHED field job" }
  - { id: ERR_WINDOW_IN_PAST, http: 409, condition: "Scheduled window starts before the current logical clock" }
  - { id: ERR_PROMISE_INFEASIBLE, http: 422, condition: "promised_hours demands a faster turnaround tier than requested" }
  - { id: ERR_SPEC_MISMATCH, http: 422, condition: "Exchange unit bore/stroke/rod/pressure-class do not exactly match the cylinder" }
  - { id: ERR_NO_STOCK_FITS, http: 409, condition: "No AVAILABLE inventory piece of the material/diameter with length_mm >= cut_length_mm + kerf_mm" }
  - { id: ERR_UNIT_NOT_IN_POOL, http: 409, condition: "Exchange unit not IN_POOL when selected" }
  - { id: ERR_RESERVATION_NOT_OPEN, http: 409, condition: "Reservation not in expected state (consume requires OPEN and work order IN_REPAIR; complete-assembly requires all reservations CONSUMED)" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "An ISSUED certificate already exists for the work order" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Open approved-quote exposure plus this quote exceeds customer credit limit" }
  - { id: ERR_EXCHANGE_NOT_FULFILLED, http: 409, condition: "receive-core attempted before fulfill" }
  - { id: ERR_CORE_NOT_RETURNED, http: 409, condition: "Exchange work-order close attempted before the exchange deal is SETTLED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop owner/operator; configuration, catalog, inventory, pool, and full operational override (except segregation-of-duties bars it from certifying work it performed as a technician)"
    identity: "opaque"
    exclusive_operations:
      - "POST /fluid-power/_clock/set_current_utc"
      - "POST/PATCH /fluid-power/shops"
      - "POST /fluid-power/technicians"
      - "POST /fluid-power/seal-kits"
      - "POST /fluid-power/exchange-units"
      - "POST /fluid-power/test-bays"
    shared_operations:
      - "customers, cylinders, work orders, quotes, teardown reads, inventory, reservations, pressure-test reads, certificates reads, exchange lifecycle (release/fulfill/receive-core), field jobs (create/schedule/cancel), all GETs"

  - name: ServiceAdvisor
    description: "Front-counter advisor; intake, quoting, scheduling, and customer-facing administration"
    identity: "opaque"
    exclusive_operations:
      - "POST /fluid-power/quotes and /send"
      - "POST /fluid-power/work-orders/{id}/start-teardown and /complete-scrap and /close"
      - "POST /fluid-power/stock-reservations and /release"
      - "POST /fluid-power/field-service-jobs/{id}/schedule"
    shared_operations:
      - "customers, cylinders, work orders create/cancel, inventory receive, exchange release/fulfill/receive-core, field job create/cancel, all GETs"

  - name: Technician
    description: "Shop/field technician; performs teardown, repair, assembly, and assigned field work"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /fluid-power/teardown-reports, PATCH /fluid-power/teardown-reports/{id} (assigned WO only)"
      - "POST /fluid-power/work-orders/{id}/start-repair and /complete-assembly (assigned WO only)"
      - "POST /fluid-power/stock-reservations/{id}/consume (assigned WO only)"
      - "POST /fluid-power/field-service-jobs/{id}/dispatch and /complete (assigned job only)"
    shared_operations:
      - "cleanliness-checks (with QualityInspector), all GETs"

  - name: QualityInspector
    description: "Independent quality authority; pressure testing, certification, cleanliness verification, core grading"
    identity: "opaque"
    exclusive_operations:
      - "POST /fluid-power/pressure-tests and /record-result and /cancel"
      - "POST /fluid-power/certificates and /revoke (never for a work order where the inspector's X-User-ID equals assigned_technician_id)"
      - "POST /fluid-power/exchange-units/{id}/evaluate-core"
    shared_operations:
      - "cleanliness-checks (with Technician), all GETs"

  - name: Customer
    description: "External equipment owner; approves quotes, directs scrap-or-exchange decisions, books field service for own assets"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /fluid-power/quotes/{id}/approve and /request-revision (own work orders only)"
      - "POST /fluid-power/work-orders/{id}/authorize-scrap and /select-exchange (own work orders only)"
    shared_operations:
      - "cylinder registration (own customer_id), work-order create/cancel (own), field-job create/cancel (own), all GETs"
