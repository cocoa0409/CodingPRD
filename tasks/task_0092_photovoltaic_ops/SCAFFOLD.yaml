scenario: |
  Photovoltaic power-station operations and maintenance management: equipment ledger with station
  hierarchy (station/array/string/module), inverter and combiner-box ledger, transformer-and-grid-connection-point
  profile, warranty-and-supplier information, and equipment-life-cycle tracking; power-generation monitoring
  with real-time DC and AC power, irradiance and temperature reference, expected vs actual generation
  comparison, performance-ratio (PR) and capacity-factor calculation, and historical-data archiving with
  downsampling; inverter alarm with vendor-specific alarm-code mapping, alarm-level classification,
  alarm-aggregation deduplication, root-cause hint engine, alarm-acknowledgment, and alarm-history
  archiving; inspection plan with patrol-route definition by zone, periodic and special-condition
  (post-storm) patrols, patrol-checklist per equipment type, mobile-app on-site recording with photo
  and GPS, and patrol-completion verification; defect management with defect-source aggregation
  (alarm/patrol/data-anomaly/external-inspection), defect-severity classification, repair work-order
  dispatch, spare-parts requisition, repair-record with before-and-after data, and recurring-defect
  analysis; generation-revenue settlement with on-grid metering data, feed-in tariff and market-trading
  mixed pricing, settlement-period reconciliation with grid company, revenue-distribution to investors
  per shareholding, and invoice issuance; subsidy declaration with national-and-local subsidy policy
  mapping, eligibility-document preparation, declaration-submission workflow, approval-status tracking,
  subsidy-receipt accounting, and subsidy-arrears follow-up; event-driven synchronization with SCADA,
  weather-service, grid-dispatch, and financial-accounting systems; audit logging for alarm handling
  and revenue adjustments.
domain_name: photovoltaic-ops
api_prefix: /pv-ops

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - idempotency
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================
# §1.1 Entities
# ============================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Station display name (unique per operator).
        constraints: "1..120 chars, unique case-insensitive"
      - name: installed_capacity_kw
        type: number
        source: input
        description: Nameplate DC installed capacity in kW.
        constraints: "> 0, <= 1_000_000, 3 decimals"
      - name: ac_capacity_kw
        type: number
        source: input
        description: Inverter AC rated output capacity in kW.
        constraints: "> 0, <= installed_capacity_kw * 1.2"
      - name: commissioning_date
        type: datetime
        source: input
        description: Date the station was first grid-connected.
      - name: latitude
        type: number
        source: input
        description: Geographic latitude (decimal degrees).
        constraints: "-90 .. 90"
      - name: longitude
        type: number
        source: input
        description: Geographic longitude.
        constraints: "-180 .. 180"
      - name: grid_company
        type: string
        source: input
        description: Name of grid offtaker (utility) for settlement.
      - name: feed_in_tariff_cny_per_kwh
        type: number
        source: input
        description: Locked-in feed-in tariff price.
        constraints: ">= 0, 4 decimals"
      - name: market_trading_enabled
        type: boolean
        source: input
        description: Whether station also sells via market trading.
        default: false
      - name: operational_status
        type: enum
        source: computed
        description: Derived posture from active alarm count and inspection backlog.
        constraints: "OPERATIONAL | DEGRADED | OUT_OF_SERVICE"
      - name: lifecycle_state
        type: enum
        source: system
        description: Manual lifecycle state for the station record itself.
        constraints: "ACTIVE | DECOMMISSIONED"
        default: ACTIVE

  - name: Array
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Parent station UUID.
      - name: code
        type: string
        source: input
        description: Array identifier within the station.
        constraints: "1..32 chars, unique per station"
      - name: tilt_angle_deg
        type: number
        source: input
        description: Module tilt angle.
        constraints: "0 .. 90"
      - name: azimuth_deg
        type: number
        source: input
        description: Azimuth angle (0 = north).
        constraints: "0 .. 360"
      - name: string_count
        type: integer
        source: computed
        description: Count of String entities directly under this array.

  - name: PVString
    parent: Array
    common_fields: true
    fields:
      - name: array_id
        type: string
        source: input
        description: Parent Array UUID.
      - name: code
        type: string
        source: input
        description: String identifier within the array.
        constraints: "unique per array"
      - name: module_count
        type: integer
        source: input
        description: Number of modules in series.
        constraints: ">= 1, <= 40"
      - name: combiner_box_id
        type: string
        source: input
        description: FK to Inverter where role=COMBINER_BOX; nullable.
        default: null
      - name: inverter_id
        type: string
        source: input
        description: FK to Inverter where role=INVERTER.
      - name: rated_dc_power_kw
        type: number
        source: computed
        description: Sum of module Wp / 1000 for current module count and module model.

  - name: Module
    parent: PVString
    common_fields: true
    fields:
      - name: string_id
        type: string
        source: input
        description: Parent PVString UUID.
      - name: serial_no
        type: string
        source: input
        description: Manufacturer serial number.
        constraints: "unique globally"
      - name: wp_rating
        type: number
        source: input
        description: Module peak power in watts.
        constraints: "> 0, <= 1000"
      - name: manufacturer
        type: string
        source: input
        description: Module manufacturer.
      - name: warranty_supplier_id
        type: string
        source: input
        description: FK to Supplier.
      - name: warranty_until
        type: datetime
        source: input
        description: End date of factory warranty.
      - name: lifecycle_state
        type: enum
        source: system
        description: Lifecycle of the module asset.
        constraints: "INSTALLED | REMOVED | RETURN_TO_VENDOR | SCRAPPED"
        default: INSTALLED

  - name: Inverter
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: array_id
        type: string
        source: input
        description: Optional FK to Array (null when device serves multiple arrays).
        default: null
      - name: role
        type: enum
        source: input
        description: Device role.
        constraints: "INVERTER | COMBINER_BOX"
      - name: model
        type: string
        source: input
        description: Vendor model code (used as key into AlarmCodeMap).
      - name: vendor
        type: string
        source: input
        description: Vendor name (used as key into AlarmCodeMap).
      - name: serial_no
        type: string
        source: input
        description: Device serial.
        constraints: "unique globally"
      - name: rated_ac_power_kw
        type: number
        source: input
        description: Rated AC output for inverters; 0 for combiner boxes.
        constraints: ">= 0"
      - name: warranty_supplier_id
        type: string
        source: input
        description: FK to Supplier.
      - name: warranty_until
        type: datetime
        source: input
        description: End date of warranty.
      - name: lifecycle_state
        type: enum
        source: system
        description: Asset lifecycle.
        constraints: "OPERATING | UNDER_REPAIR | RETIRED"
        default: OPERATING

  - name: Transformer
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: code
        type: string
        source: input
        description: Transformer/grid-connection-point code.
        constraints: "unique per station"
      - name: rated_capacity_kva
        type: number
        source: input
        description: Rated capacity in kVA.
        constraints: "> 0"
      - name: primary_voltage_kv
        type: number
        source: input
        description: HV side voltage.
      - name: secondary_voltage_kv
        type: number
        source: input
        description: LV side voltage.
      - name: grid_connection_point_no
        type: string
        source: input
        description: Grid company contract point number.
        constraints: "unique globally"
      - name: warranty_supplier_id
        type: string
        source: input
        description: FK to Supplier.
      - name: warranty_until
        type: datetime
        source: input
        description: Warranty end date.

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Supplier legal name.
        constraints: "unique case-insensitive"
      - name: contact
        type: string
        source: input
        description: Contact phone/email blob.
      - name: rating
        type: enum
        source: input
        description: Service rating tier.
        constraints: "A | B | C"
        default: B
      - name: lifecycle_state
        type: enum
        source: system
        description: Active/blacklisted state.
        constraints: "ACTIVE | BLACKLISTED"
        default: ACTIVE

  - name: GenerationReading
    parent: Station
    common_fields: false
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: timestamp
        type: datetime
        source: input
        description: Reading timestamp (UTC, 1-minute aligned).
      - name: dc_power_kw
        type: number
        source: input
        description: Measured DC power.
        constraints: ">= 0"
      - name: ac_power_kw
        type: number
        source: input
        description: Measured AC power at meter.
        constraints: ">= 0"
      - name: irradiance_w_m2
        type: number
        source: input
        description: Plane-of-array irradiance.
        constraints: ">= 0"
      - name: module_temp_c
        type: number
        source: input
        description: Module surface temperature.
      - name: granularity
        type: enum
        source: system
        description: Sampling granularity (raw or downsampled bucket).
        constraints: "RAW_1MIN | AGG_15MIN | AGG_1H | AGG_1DAY"
        default: RAW_1MIN

  - name: AlarmCodeMap
    parent: null
    common_fields: false
    fields:
      - name: vendor
        type: string
        source: input
        description: Inverter vendor name.
        constraints: "(vendor, model, vendor_code) unique"
      - name: model
        type: string
        source: input
        description: Inverter model code.
      - name: vendor_code
        type: string
        source: input
        description: Raw alarm code emitted by the device.
      - name: canonical_code
        type: string
        source: input
        description: Normalized internal alarm code (e.g., INV_OVERTEMP).
      - name: severity
        type: enum
        source: input
        description: Default severity for this canonical code.
        constraints: "INFO | WARN | MAJOR | CRITICAL"
      - name: root_cause_hint
        type: string
        source: input
        description: Hint text returned to operator for triage.

  - name: AlarmEvent
    parent: Inverter
    common_fields: true
    fields:
      - name: inverter_id
        type: string
        source: input
        description: FK to Inverter.
      - name: station_id
        type: string
        source: computed
        description: Denormalized from inverter for station-scoped queries.
      - name: vendor_code
        type: string
        source: input
        description: Raw vendor code as received from SCADA.
      - name: canonical_code
        type: string
        source: computed
        description: Resolved via AlarmCodeMap at ingestion time.
      - name: severity
        type: enum
        source: computed
        description: Resolved severity at ingestion; can be overridden on acknowledge.
        constraints: "INFO | WARN | MAJOR | CRITICAL"
      - name: first_seen_at
        type: datetime
        source: input
        description: First occurrence within the dedup window.
      - name: last_seen_at
        type: datetime
        source: computed
        description: Last occurrence; bumped on duplicate ingestion within window.
      - name: occurrence_count
        type: integer
        source: computed
        description: Dedup repeat count.
        default: 1
      - name: state
        type: enum
        source: system
        description: Alarm workflow state.
        constraints: "OPEN | ACKNOWLEDGED | CLEARED | ARCHIVED"
        default: OPEN
      - name: acknowledged_by
        type: string
        source: system
        description: User id of operator who acknowledged; nullable.
      - name: acknowledged_at
        type: datetime
        source: system
        description: Acknowledgement timestamp.
      - name: defect_id
        type: string
        source: system
        description: FK to Defect if a defect was created from this alarm; nullable.

  - name: PatrolPlan
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: name
        type: string
        source: input
        description: Plan name.
        constraints: "1..120 chars, unique per station"
      - name: zone_route
        type: array
        source: input
        description: Ordered list of zone codes that form the patrol route.
        constraints: "1..50 entries, no duplicates"
      - name: kind
        type: enum
        source: input
        description: Plan kind.
        constraints: "PERIODIC | SPECIAL_POST_STORM"
      - name: cadence_days
        type: integer
        source: input
        description: For PERIODIC, days between scheduled patrols. Null for SPECIAL.
        constraints: ">=1, <=180; required when kind=PERIODIC"
      - name: checklist
        type: array
        source: input
        description: Equipment-type-keyed checklist entries (e.g., INVERTER:[temp, fan_noise]).
      - name: lifecycle_state
        type: enum
        source: system
        description: Plan lifecycle.
        constraints: "ACTIVE | RETIRED"
        default: ACTIVE

  - name: PatrolRecord
    parent: PatrolPlan
    common_fields: true
    fields:
      - name: patrol_plan_id
        type: string
        source: input
        description: FK to PatrolPlan.
      - name: station_id
        type: string
        source: computed
        description: Denormalized from plan.
      - name: scheduled_for
        type: datetime
        source: input
        description: Scheduled execution date.
      - name: actor_id
        type: string
        source: system
        description: Operator who executed the patrol (FieldOperator opaque id).
      - name: zone_progress
        type: array
        source: system
        description: Per-zone progress with photo_url and gps (lat,lng) and checklist findings.
      - name: completed_zone_count
        type: integer
        source: computed
        description: Count of zones with all required checklist items recorded.
      - name: state
        type: enum
        source: system
        description: Workflow state.
        constraints: "SCHEDULED | IN_PROGRESS | SUBMITTED | VERIFIED | REJECTED"
        default: SCHEDULED
      - name: verification_notes
        type: string
        source: system
        description: Verifier notes.

  - name: Defect
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: subject_type
        type: enum
        source: input
        description: Equipment type the defect refers to.
        constraints: "INVERTER | MODULE | TRANSFORMER | STRING | ARRAY"
      - name: subject_id
        type: string
        source: input
        description: Polymorphic FK to the subject equipment id (matches subject_type).
      - name: source
        type: enum
        source: input
        description: Source channel that produced this defect.
        constraints: "ALARM | PATROL | DATA_ANOMALY | EXTERNAL_INSPECTION"
      - name: source_ref_id
        type: string
        source: input
        description: FK to source record (AlarmEvent.id, PatrolRecord.id, etc.); nullable for DATA_ANOMALY.
      - name: severity
        type: enum
        source: input
        description: Severity at intake; may be escalated by rules.
        constraints: "MINOR | MODERATE | MAJOR | CRITICAL"
      - name: parent_defect_id
        type: string
        source: input
        description: Self-referential FK; points to a prior closed defect on the same subject for recurring-defect chaining.
        default: null
      - name: state
        type: enum
        source: system
        description: Workflow state.
        constraints: "OPEN | DISPATCHED | UNDER_REPAIR | RESOLVED | CLOSED | REOPENED"
        default: OPEN
      - name: opened_at
        type: datetime
        source: system
        description: Time defect entered OPEN.
      - name: resolved_at
        type: datetime
        source: system
        description: Time defect entered RESOLVED.
      - name: recurrence_index
        type: integer
        source: computed
        description: 1 + count of CLOSED ancestor defects in the parent_defect_id chain on the same subject.
        default: 1

  - name: WorkOrder
    parent: Defect
    common_fields: true
    fields:
      - name: defect_id
        type: string
        source: input
        description: FK to Defect.
      - name: assigned_supplier_id
        type: string
        source: input
        description: FK to Supplier (must not be BLACKLISTED).
      - name: assigned_technician_id
        type: string
        source: input
        description: Opaque field-operator id.
      - name: scheduled_start
        type: datetime
        source: input
        description: Scheduled start.
      - name: scheduled_end
        type: datetime
        source: input
        description: Scheduled end; must be > scheduled_start.
      - name: actual_start
        type: datetime
        source: system
        description: Bumped when work order moves to IN_PROGRESS.
      - name: actual_end
        type: datetime
        source: system
        description: Bumped when work order moves to COMPLETED.
      - name: before_metrics
        type: object
        source: input
        description: 'Snapshot of subject metrics before repair (e.g., {dc_power_kw: 12.3}).'
      - name: after_metrics
        type: object
        source: input
        description: Snapshot after repair; required to COMPLETE.
      - name: spare_part_lines
        type: array
        source: input
        description: List of {part_id, quantity} requisitioned.
      - name: state
        type: enum
        source: system
        description: Work order state.
        constraints: "DISPATCHED | IN_PROGRESS | COMPLETED | CANCELED"
        default: DISPATCHED

  - name: SparePart
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: SKU code.
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: Display name.
      - name: stock_on_hand
        type: integer
        source: system
        description: Current available stock.
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: system
        description: Reserved by open work orders.
        constraints: ">= 0"
      - name: unit_cost_cny
        type: number
        source: input
        description: Unit cost in CNY.
        constraints: ">= 0"

  - name: MeteringRecord
    parent: Station
    common_fields: false
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: settlement_period_id
        type: string
        source: input
        description: FK to SettlementPeriod.
      - name: window_start
        type: datetime
        source: input
        description: Start of metering window (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: End of metering window (exclusive).
      - name: on_grid_kwh
        type: number
        source: input
        description: Net on-grid energy in this window.
        constraints: ">= 0, 3 decimals"
      - name: pricing_channel
        type: enum
        source: input
        description: Which price applies to this slice.
        constraints: "FEED_IN | MARKET_TRADING"
      - name: market_price_cny_per_kwh
        type: number
        source: input
        description: Market clearing price; required when pricing_channel=MARKET_TRADING.
        default: null

  - name: SettlementPeriod
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of settlement period (typically month start).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of settlement period.
        constraints: "must be > period_start; (station_id, period_start, period_end) unique; non-overlapping across CONFIRMED periods"
      - name: provisional_revenue_cny
        type: number
        source: computed
        description: Provisional revenue computed from on_grid_kwh * applicable rates per MeteringRecord.
      - name: final_revenue_cny
        type: number
        source: computed
        description: Final revenue after grid-company reconciliation adjustment.
      - name: grid_company_confirmed_kwh
        type: number
        source: input
        description: Energy figure the grid company confirms during reconciliation.
        default: null
      - name: state
        type: enum
        source: system
        description: Settlement state.
        constraints: "DRAFT | RECONCILING | CONFIRMED | INVOICED | DISPUTED"
        default: DRAFT
      - name: invoice_no
        type: string
        source: system
        description: Issued invoice number; set on INVOICED.

  - name: InvestorShare
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: investor_name
        type: string
        source: input
        description: Investor legal name.
      - name: share_basis_points
        type: integer
        source: input
        description: Share in basis points (1/10000). Sum across active shares per station MUST equal 10000.
        constraints: "1..10000"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of shareholding.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end; null = open-ended.
        default: null

  - name: RevenueDistribution
    parent: SettlementPeriod
    common_fields: false
    fields:
      - name: settlement_period_id
        type: string
        source: system
        description: FK to SettlementPeriod.
      - name: investor_share_id
        type: string
        source: system
        description: FK to InvestorShare (snapshot at confirmation time).
      - name: investor_name
        type: string
        source: system
        description: Snapshotted name (so deletion of share record cannot break ledger).
      - name: share_basis_points
        type: integer
        source: system
        description: Snapshotted share.
      - name: amount_cny
        type: number
        source: system
        description: Distributed amount; sum across rows for a period MUST equal final_revenue_cny.

  - name: SubsidyPolicy
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Policy code.
        constraints: "unique"
      - name: scope
        type: enum
        source: input
        description: Policy scope.
        constraints: "NATIONAL | LOCAL"
      - name: rate_cny_per_kwh
        type: number
        source: input
        description: Subsidy per kWh.
        constraints: ">= 0, 4 decimals"
      - name: eligible_from
        type: datetime
        source: input
        description: Eligibility window start (inclusive).
      - name: eligible_to
        type: datetime
        source: input
        description: Eligibility window end (exclusive).
      - name: min_commissioning_date
        type: datetime
        source: input
        description: Stations commissioned before this date are NOT eligible.
        default: null
      - name: max_commissioning_date
        type: datetime
        source: input
        description: Stations commissioned after this date are NOT eligible.
        default: null
      - name: required_documents
        type: array
        source: input
        description: List of document keys required (e.g., GRID_CONNECTION_CERT, METER_REPORT).
      - name: lifecycle_state
        type: enum
        source: system
        description: Policy lifecycle.
        constraints: "ACTIVE | RETIRED"
        default: ACTIVE

  - name: SubsidyDeclaration
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK to Station.
      - name: subsidy_policy_id
        type: string
        source: input
        description: FK to SubsidyPolicy.
      - name: settlement_period_id
        type: string
        source: input
        description: FK to SettlementPeriod (must be CONFIRMED or INVOICED at submit time).
      - name: documents
        type: array
        source: input
        description: List of {key, ref_url}; must cover policy.required_documents.
      - name: claimed_kwh
        type: number
        source: computed
        description: Equals SettlementPeriod.grid_company_confirmed_kwh at submit time.
      - name: subsidy_amount_cny
        type: number
        source: computed
        description: claimed_kwh * policy.rate_cny_per_kwh, with floor 0.
      - name: state
        type: enum
        source: system
        description: Workflow state.
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | RECEIVED | ARREARS"
        default: DRAFT
      - name: approval_due_date
        type: datetime
        source: system
        description: Date by which approval is expected (submission + 90 days).
      - name: received_at
        type: datetime
        source: system
        description: Set on RECEIVED.
      - name: rejection_reason
        type: string
        source: system
        description: Set on REJECTED.

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at the time of the action.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role at the time of the action.
      - name: target_type
        type: enum
        source: system
        description: Type of audited target.
        constraints: "ALARM | SETTLEMENT | DECLARATION | DEFECT"
      - name: target_id
        type: string
        source: system
        description: id of the audited record.
      - name: action
        type: string
        source: system
        description: Symbolic action (e.g., ALARM_ACK, REVENUE_ADJUST, SETTLEMENT_CONFIRM).
      - name: before_value
        type: object
        source: system
        description: Snapshot before the action.
      - name: after_value
        type: object
        source: system
        description: Snapshot after the action.

# ============================================================
# §1.2 State machines
# ============================================================
state_machines:
  - entity: AlarmEvent
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /pv-ops/alarms (ingestion of duplicate vendor_code within dedup window)"
        actor: system
        preconditions:
          - "An OPEN AlarmEvent exists for (inverter_id, canonical_code) with last_seen_at within DEDUP_WINDOW_SECONDS (=300) of incoming.first_seen_at"
        side_effects:
          - "occurrence_count := occurrence_count + 1"
          - "last_seen_at := incoming.first_seen_at"
          - "version increments; updated_at refreshes"
        note: "Idempotent dedup; no new AlarmEvent row is created."
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /pv-ops/alarms/{id}/ack"
        actor: O&MEngineer
        preconditions:
          - "AlarmEvent.state == OPEN"
          - "AlarmEvent.severity in {WARN, MAJOR, CRITICAL} (INFO alarms cannot be ack'd; archive directly)"
        side_effects:
          - "acknowledged_by := X-User-ID"
          - "acknowledged_at := now()"
          - "AuditEntry created with target_type=ALARM, action=ALARM_ACK, before/after state snapshot"
          - "CASCADE HOP 1: If AlarmEvent.severity in {MAJOR, CRITICAL}, a Defect is auto-created with source=ALARM, source_ref_id=AlarmEvent.id, subject_type=INVERTER, subject_id=inverter_id, severity := AlarmEvent.severity mapped to defect severity (MAJOR→MAJOR, CRITICAL→CRITICAL), state=OPEN; AlarmEvent.defect_id := Defect.id"
          - "CASCADE HOP 2 (caused by the Defect creation in hop 1, not by the ack directly): if the new Defect carries severity=CRITICAL, then Inverter.lifecycle_state OPERATING→UNDER_REPAIR on the defect's subject inverter. Lower-severity defects do NOT touch the inverter, proving hop 2 is downstream of hop 1."
          - "CASCADE HOP 3 (caused by the Inverter mutation in hop 2): Station.operational_status recomputes via calculations.station_operational_status. May flip OPERATIONAL→DEGRADED or DEGRADED→OUT_OF_SERVICE depending on ratio crossings."
      - from: ACKNOWLEDGED
        to: CLEARED
        trigger: "POST /pv-ops/alarms/{id}/clear"
        actor: O&MEngineer
        preconditions:
          - "If AlarmEvent.defect_id is not null, the linked Defect.state IN {RESOLVED, CLOSED}"
        side_effects:
          - "AuditEntry with action=ALARM_CLEAR"
      - from: OPEN
        to: ARCHIVED
        trigger: "POST /pv-ops/alarms/{id}/archive"
        actor: O&MEngineer
        preconditions:
          - "AlarmEvent.severity == INFO"
        side_effects:
          - "No defect created; AuditEntry action=ALARM_ARCHIVE"
      - from: CLEARED
        to: ARCHIVED
        trigger: "POST /pv-ops/alarms/{id}/archive"
        actor: O&MEngineer
        preconditions: []
        side_effects: []

  - entity: Defect
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /pv-ops/defects/{id}/work-orders (creates WorkOrder)"
        actor: O&MEngineer
        preconditions:
          - "WorkOrder.assigned_supplier_id refers to Supplier where lifecycle_state == ACTIVE"
          - "Every spare_part_lines[*] has stock_on_hand - reserved_qty >= quantity (boundary precision: >=, not >)"
        side_effects:
          - "Defect.state := DISPATCHED"
          - "For each spare_part_lines[]: SparePart.reserved_qty += quantity"
      - from: DISPATCHED
        to: UNDER_REPAIR
        trigger: "POST /pv-ops/work-orders/{id}/start"
        actor: FieldOperator
        preconditions:
          - "WorkOrder.state == DISPATCHED"
        side_effects:
          - "WorkOrder.state := IN_PROGRESS; WorkOrder.actual_start := now()"
          - "Defect.state := UNDER_REPAIR"
      - from: UNDER_REPAIR
        to: RESOLVED
        trigger: "POST /pv-ops/work-orders/{id}/complete"
        actor: FieldOperator
        preconditions:
          - "WorkOrder.before_metrics and after_metrics both non-empty"
          - "For each spare_part_lines[]: SparePart.stock_on_hand >= quantity (still consumable)"
        side_effects:
          - "WorkOrder.state := COMPLETED; WorkOrder.actual_end := now()  (hop 0 — direct effect on WorkOrder)"
          - "CASCADE HOP 1: Defect.state := RESOLVED; Defect.resolved_at := now()  (Defect mutated as a consequence of the WorkOrder transition)"
          - "For each spare_part_lines[]: SparePart.stock_on_hand -= quantity; SparePart.reserved_qty -= quantity"
          - "CASCADE HOP 2 (caused by the Defect.state := RESOLVED in hop 1): If Defect.subject_type=INVERTER AND the Inverter's lifecycle_state == UNDER_REPAIR, flip it to OPERATING. Defects on other subject_types do not affect any Inverter, proving hop 2 is downstream of hop 1."
          - "CASCADE HOP 3 (caused by the Inverter mutation in hop 2): Station.operational_status recomputes via calculations.station_operational_status."
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /pv-ops/defects/{id}/close"
        actor: O&MEngineer
        preconditions:
          - "Defect.state == RESOLVED"
        side_effects:
          - "Defect.state := CLOSED"
          - "If a linked AlarmEvent exists and is in ACKNOWLEDGED, it is allowed to transition to CLEARED (manual)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /pv-ops/defects/{id}/reopen"
        actor: O&MEngineer
        preconditions:
          - "Defect.state == RESOLVED"
          - "Now - resolved_at <= REOPEN_GRACE_DAYS (=30)"
        side_effects:
          - "Defect.state := REOPENED"
      - from: REOPENED
        to: DISPATCHED
        trigger: "POST /pv-ops/defects/{id}/work-orders (re-dispatch)"
        actor: O&MEngineer
        preconditions: []
        side_effects:
          - "New WorkOrder spawned; stock reserved as in OPEN->DISPATCHED"
      - from: DISPATCHED
        to: OPEN
        trigger: "POST /pv-ops/work-orders/{id}/cancel"
        actor: O&MEngineer
        preconditions:
          - "WorkOrder.state == DISPATCHED"
        side_effects:
          - "WorkOrder.state := CANCELED"
          - "For each spare_part_lines[]: SparePart.reserved_qty -= quantity (compensation)"
          - "Defect.state := OPEN (revert)"

  - entity: WorkOrder
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /pv-ops/work-orders/{id}/start"
        actor: FieldOperator
        preconditions:
          - "WorkOrder.state == DISPATCHED"
          - "Defect.state == DISPATCHED (cross-entity gate)"
        side_effects:
          - "actual_start := now()"
          - "Defect.state := UNDER_REPAIR (mirror)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pv-ops/work-orders/{id}/complete"
        actor: FieldOperator
        preconditions:
          - "WorkOrder.before_metrics non-empty AND payload.after_metrics non-empty"
          - "For each spare_part_lines[]: SparePart.stock_on_hand >= quantity"
        side_effects:
          - "actual_end := now(); after_metrics := payload"
          - "Triggers Defect UNDER_REPAIR→RESOLVED (see Defect state machine)"
          - "SparePart consumption (stock_on_hand -=, reserved_qty -=)"
      - from: DISPATCHED
        to: CANCELED
        trigger: "POST /pv-ops/work-orders/{id}/cancel"
        actor: O&MEngineer
        preconditions:
          - "WorkOrder.state == DISPATCHED"
        side_effects:
          - "SparePart.reserved_qty -= quantity per line (compensation)"
          - "Defect.state := OPEN (or stays REOPENED→OPEN) — revert"

  - entity: PatrolRecord
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /pv-ops/patrol-records/{id}/start"
        actor: FieldOperator
        preconditions:
          - "PatrolRecord.state == SCHEDULED"
          - "PatrolPlan.lifecycle_state == ACTIVE"
        side_effects:
          - "actor_id := X-User-ID"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /pv-ops/patrol-records/{id}/zones/{zone}/log"
        actor: FieldOperator
        preconditions:
          - "PatrolRecord.state == IN_PROGRESS"
          - "X-User-ID == PatrolRecord.actor_id"
          - "Payload includes photo_url and gps {lat,lng} and every required checklist item for that zone"
        side_effects:
          - "zone_progress appended/replaced; completed_zone_count recomputed"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /pv-ops/patrol-records/{id}/submit"
        actor: FieldOperator
        preconditions:
          - "completed_zone_count == len(PatrolPlan.zone_route)"
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /pv-ops/patrol-records/{id}/verify"
        actor: O&MEngineer
        preconditions:
          - "PatrolRecord.state == SUBMITTED"
          - "Verifier (X-User-ID) != PatrolRecord.actor_id (segregation of duties)"
        side_effects:
          - "For each zone finding flagged as 'defect': a Defect is created with source=PATROL, source_ref_id=PatrolRecord.id (cascade)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pv-ops/patrol-records/{id}/reject"
        actor: O&MEngineer
        preconditions:
          - "Verifier (X-User-ID) != PatrolRecord.actor_id"
        side_effects:
          - "verification_notes := payload.notes"

  - entity: SettlementPeriod
    initial_state: DRAFT
    terminal_states: [INVOICED, DISPUTED]
    transitions:
      - from: DRAFT
        to: RECONCILING
        trigger: "POST /pv-ops/settlement-periods/{id}/start-reconciliation"
        actor: FinanceOfficer
        preconditions:
          - "now() >= period_end (boundary precision: >= not >)"
          - "There exists at least one MeteringRecord under this period"
        side_effects:
          - "provisional_revenue_cny computed from MeteringRecords (see calculations.provisional_settlement_revenue)"
      - from: RECONCILING
        to: CONFIRMED
        trigger: "POST /pv-ops/settlement-periods/{id}/confirm"
        actor: FinanceOfficer
        preconditions:
          - "grid_company_confirmed_kwh is set"
          - "Difference |sum(MeteringRecord.on_grid_kwh) - grid_company_confirmed_kwh| / max(sum(MeteringRecord.on_grid_kwh), 0.001) <= RECONCILIATION_TOLERANCE (=0.005)"
          - "No overlapping CONFIRMED SettlementPeriod exists for this station whose [period_start, period_end) intersects this period's window using closed-open interval semantics"
        side_effects:
          - "final_revenue_cny computed (see calculations.final_settlement_revenue) — value differs from provisional_revenue_cny when grid_company_confirmed_kwh != sum(on_grid_kwh)"
          - "RevenueDistribution rows are created via calculations.revenue_distribution; their sum MUST equal final_revenue_cny"
          - "AuditEntry created (target_type=SETTLEMENT, action=SETTLEMENT_CONFIRM)"
      - from: RECONCILING
        to: DISPUTED
        trigger: "POST /pv-ops/settlement-periods/{id}/dispute"
        actor: FinanceOfficer
        preconditions:
          - "grid_company_confirmed_kwh is set"
          - "Difference exceeds RECONCILIATION_TOLERANCE"
        side_effects:
          - "AuditEntry action=SETTLEMENT_DISPUTE"
      - from: CONFIRMED
        to: INVOICED
        trigger: "POST /pv-ops/settlement-periods/{id}/issue-invoice"
        actor: FinanceOfficer
        preconditions:
          - "invoice_no payload is unique across all SettlementPeriods"
        side_effects:
          - "invoice_no := payload.invoice_no"
      - from: CONFIRMED
        to: RECONCILING
        trigger: "POST /pv-ops/settlement-periods/{id}/revenue-adjust"
        actor: FinanceOfficer
        preconditions:
          - "SettlementPeriod.state == CONFIRMED (no adjustment after INVOICED)"
          - "No SubsidyDeclaration with state in {SUBMITTED, APPROVED, RECEIVED} references this SettlementPeriod"
        side_effects:
          - "Existing RevenueDistribution rows are deleted (compensation hop 1)"
          - "final_revenue_cny := null; provisional_revenue_cny recomputed (hop 2 — Σ RevenueDistribution.amount_cny invariant restored to 0 == final_revenue_cny=null)"
          - "AuditEntry action=REVENUE_ADJUST with before/after snapshot"

  - entity: SubsidyDeclaration
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pv-ops/subsidy-declarations/{id}/submit"
        actor: FinanceOfficer
        preconditions:
          - "SettlementPeriod.state IN {CONFIRMED, INVOICED}"
          - "Station.commissioning_date within policy.[min_commissioning_date, max_commissioning_date) if policy specifies bounds"
          - "Every policy.required_documents[i] is present in declaration.documents (set-containment)"
          - "SettlementPeriod.period_end within policy.[eligible_from, eligible_to) (closed-open)"
        side_effects:
          - "claimed_kwh := SettlementPeriod.grid_company_confirmed_kwh"
          - "subsidy_amount_cny := round(claimed_kwh * policy.rate_cny_per_kwh, 2)"
          - "approval_due_date := now() + 90 days"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pv-ops/subsidy-declarations/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "SubsidyDeclaration.state == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pv-ops/subsidy-declarations/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "rejection_reason := payload.reason"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /pv-ops/subsidy-declarations/{id}/receive"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "received_at := now()"
      - from: APPROVED
        to: ARREARS
        trigger: "POST /_clock/advance (system auto-transition when now() > approval_due_date + ARREARS_GRACE_DAYS=30)"
        actor: system
        preconditions:
          - "SubsidyDeclaration.state == APPROVED"
          - "now() > approval_due_date + 30 days"
        side_effects: []
      - from: ARREARS
        to: RECEIVED
        trigger: "POST /pv-ops/subsidy-declarations/{id}/receive"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "received_at := now()"

# ============================================================
# §1.2.1 Concurrency rules
# ============================================================
concurrency_rules:
  - scenario: "Two operators acknowledge the same OPEN alarm simultaneously"
    guarantee: "Exactly one ACK succeeds; the loser sees the alarm already in ACKNOWLEDGED state"
    error_id: ERR_ALARM_ALREADY_ACKED
    http_status: 409
    serialization: "First-writer-wins on AlarmEvent.state transition OPEN->ACKNOWLEDGED"
  - scenario: "Two work orders simultaneously requisition the same spare part with combined quantity exceeding stock_on_hand - reserved_qty"
    guarantee: "Exactly one work-order creation succeeds; the loser is rejected"
    error_id: ERR_SPARE_PART_INSUFFICIENT
    http_status: 409
    serialization: "Atomic check-and-reserve; serialization on (SparePart.id) row"
  - scenario: "Two finance officers confirm overlapping settlement periods on the same station simultaneously"
    guarantee: "Exactly one period reaches CONFIRMED; the other is rejected by overlap rule"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on Station.id during CONFIRMED-set insertion using closed-open intervals"
  - scenario: "Two duplicate alarm ingestion events with the same vendor_code arrive within DEDUP_WINDOW"
    guarantee: "Exactly one AlarmEvent row exists; both ingestions are accepted but at most one new row is created"
    error_id: ERR_ALARM_DEDUP_RACE
    http_status: 409
    serialization: "Atomic upsert on (inverter_id, canonical_code) when an OPEN row already exists; loser is rejected with this error when its payload claims to be a new alarm but the dedup index now points to another row"
  - scenario: "A revenue adjustment race: one request issues invoice, another initiates revenue-adjust on a CONFIRMED period"
    guarantee: "Exactly one succeeds; the loser sees state has already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SettlementPeriod.state"

# ============================================================
# §1.3 Calculations
# ============================================================
calculations:
  - name: expected_generation_kwh
    trigger: "GET /pv-ops/stations/{id}/performance?window_start=..&window_end=.. and during SettlementPeriod confirm"
    algorithm: forward_looking
    formula: |
      # Expected generation under reference conditions, computed forward from irradiance.
      # Step 1: For each GenerationReading in [window_start, window_end) at granularity RAW_1MIN
      #         that belongs to station_id:
      #             slice_hours = 1/60
      #             reading_expected_kwh = (irradiance_w_m2 / REFERENCE_IRRADIANCE_W_M2)
      #                                    * station.installed_capacity_kw
      #                                    * slice_hours
      # Step 2: expected_generation_kwh = round( sum(reading_expected_kwh), 3 )
      # Notes:
      #   - Forward-looking: uses *all* RAW_1MIN readings whose timestamp ∈ [window_start, window_end),
      #     including INFO-alarmed periods. CRITICAL/MAJOR alarmed periods are NOT excluded here;
      #     this is the distinguishing trait that makes PR diverge from the chronological pricing variant.
      #   - If a slice is missing, it contributes 0 to the sum (no interpolation).
    input_set: "All GenerationReading rows for station_id with granularity=RAW_1MIN and timestamp ∈ [window_start, window_end). NO state-based exclusion."
    constants:
      REFERENCE_IRRADIANCE_W_M2: 1000
    precision: "3 decimal places, round_half_up"

  - name: actual_generation_kwh
    trigger: "GET /pv-ops/stations/{id}/performance?window_start=..&window_end=.. and during SettlementPeriod start-reconciliation"
    algorithm: chronological
    formula: |
      # Actual generation summed chronologically with state-filter on inverter availability.
      # Step 1: Iterate GenerationReading rows for station_id with granularity=RAW_1MIN
      #         and timestamp ∈ [window_start, window_end) in ascending timestamp order.
      # Step 2: For each reading, if there exists ANY AlarmEvent on an Inverter under this station with
      #             severity IN {MAJOR, CRITICAL}
      #             AND state IN {OPEN, ACKNOWLEDGED}
      #             AND first_seen_at <= reading.timestamp <= last_seen_at,
      #         then the slice contributes 0 (downtime exclusion).
      #         Otherwise: slice_kwh = ac_power_kw * (1/60)
      # Step 3: actual_generation_kwh = round( sum(slice_kwh), 3 )
    input_set: "All RAW_1MIN GenerationReadings in window. Slices overlapping OPEN/ACK MAJOR-or-CRITICAL alarms produce 0."
    constants:
      MINUTES_PER_HOUR: 60
    precision: "3 decimal places, round_half_up"
    variants:
      - name: pr_variant
        when: "When called by GET /pv-ops/stations/{id}/performance for PR/capacity-factor output"
        difference: "Inputs identical to actual_generation_kwh; numerator divides by expected_generation_kwh for PR."

  - name: performance_ratio
    trigger: "GET /pv-ops/stations/{id}/performance"
    algorithm: aggregation
    formula: |
      if expected_generation_kwh > 0:
          pr = actual_generation_kwh / expected_generation_kwh
      else:
          pr = 0
      pr = round(pr, 4)
      capacity_factor = round(
          actual_generation_kwh / ( station.ac_capacity_kw *
              hours_between(window_start, window_end) ),
          4
      )
    input_set: "expected_generation_kwh and actual_generation_kwh as computed above."
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: provisional_settlement_revenue
    trigger: "Transition SettlementPeriod DRAFT -> RECONCILING"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial pricing across MeteringRecords.
      # For each MeteringRecord M under SettlementPeriod:
      #     if M.pricing_channel == FEED_IN:
      #         line_amount = M.on_grid_kwh * Station.feed_in_tariff_cny_per_kwh
      #     elif M.pricing_channel == MARKET_TRADING:
      #         if not Station.market_trading_enabled:
      #             raise ERR_MARKET_TRADING_DISABLED
      #         if M.market_price_cny_per_kwh is None:
      #             raise ERR_MARKET_PRICE_REQUIRED
      #         line_amount = M.on_grid_kwh * M.market_price_cny_per_kwh
      #     line_amount = round(line_amount, 2)        # ROUND PER LINE
      # provisional_revenue_cny = round( sum(line_amount), 2 )   # then sum, then final round
      # Evaluation order pinned: per-line round, then sum, then no further re-rounding of the sum.
    input_set: "All MeteringRecords with settlement_period_id == SettlementPeriod.id."
    constants: {}
    precision: "Per-line round to 2 decimals (round_half_up) THEN sum; no second round."

  - name: final_settlement_revenue
    trigger: "Transition SettlementPeriod RECONCILING -> CONFIRMED"
    algorithm: chronological
    formula: |
      # Apply grid-company reconciliation adjustment based on confirmed kWh.
      raw_kwh = sum(MeteringRecord.on_grid_kwh for M in this period)
      if raw_kwh == 0:
          adjustment_ratio = 1.0
      else:
          adjustment_ratio = SettlementPeriod.grid_company_confirmed_kwh / raw_kwh
      # Recompute revenue using adjusted on_grid_kwh per line, preserving channel-specific price:
      adjusted_total = 0
      for M in MeteringRecords ordered by window_start ASC, then id ASC:
          adjusted_kwh = round(M.on_grid_kwh * adjustment_ratio, 3)
          if M.pricing_channel == FEED_IN:
              price = Station.feed_in_tariff_cny_per_kwh
          else:
              price = M.market_price_cny_per_kwh
          line_amount = round(adjusted_kwh * price, 2)   # round per line
          adjusted_total += line_amount
      final_revenue_cny = round(adjusted_total, 2)
    input_set: "Same MeteringRecord set as provisional_settlement_revenue."
    constants: {}
    precision: "2 decimals, round_half_up; per-line rounding order pinned."
    variants:
      - name: provisional_vs_final
        when: "When grid_company_confirmed_kwh != sum(on_grid_kwh)"
        difference: "final differs from provisional by the adjustment_ratio applied per-line; sums may differ even when totals look close due to per-line rounding before summation."

  - name: revenue_distribution
    trigger: "Transition SettlementPeriod RECONCILING -> CONFIRMED (after final_settlement_revenue computes)"
    algorithm: waterfall_allocation
    formula: |
      # Distribute final_revenue_cny across active InvestorShares using basis-points,
      # with deterministic remainder-allocation.
      remaining = round(final_revenue_cny * 100)            # work in centiyuan (integer cents of CNY)
      shares = [ s for s in InvestorShare
                 where station_id == SettlementPeriod.station_id
                   and effective_from < SettlementPeriod.period_end
                   and (effective_to is null or effective_to > SettlementPeriod.period_start)
               ] ordered by investor_name ASC, then id ASC
      if sum(s.share_basis_points for s in shares) != 10000:
          raise ERR_INVESTOR_SHARES_INVALID
      allocations = []
      acc = 0
      for s in shares:
          raw = round(final_revenue_cny * 100 * s.share_basis_points / 10000)  # round_half_up to integer cents
          allocations.append((s, raw))
          acc += raw
      drift = round(final_revenue_cny * 100) - acc
      # Push the drift onto the LAST share in the ordering (deterministic tie-break)
      if drift != 0:
          last_s, last_raw = allocations[-1]
          allocations[-1] = (last_s, last_raw + drift)
      # Emit RevenueDistribution rows with amount_cny = raw_cents / 100
      # INVARIANT: sum(amount_cny) == final_revenue_cny (zero-drift compensating invariant)
    input_set: "InvestorShare rows where (effective_from, effective_to) overlaps SettlementPeriod window."
    constants: {}
    precision: "Per-share round_half_up to integer cents, drift placed on last share alphabetically."

  - name: subsidy_amount
    trigger: "Transition SubsidyDeclaration DRAFT -> SUBMITTED"
    algorithm: threshold
    formula: |
      claimed_kwh = SettlementPeriod.grid_company_confirmed_kwh
      subsidy_amount_cny = round(claimed_kwh * policy.rate_cny_per_kwh, 2)
      if subsidy_amount_cny < SUBSIDY_MIN_PAYOUT_CNY:
          raise ERR_SUBSIDY_BELOW_THRESHOLD
    input_set: "SettlementPeriod.grid_company_confirmed_kwh; SubsidyPolicy.rate_cny_per_kwh."
    constants:
      SUBSIDY_MIN_PAYOUT_CNY: 100
    precision: "2 decimals, round_half_up; minimum payout enforced AT the boundary >= 100."

  - name: station_operational_status
    trigger: "Any AlarmEvent transition or Defect transition or Inverter lifecycle change"
    algorithm: threshold
    formula: |
      total = count(Inverter where station_id == s.id and lifecycle_state in {OPERATING, UNDER_REPAIR})
      under_repair = count(Inverter where station_id == s.id and lifecycle_state == UNDER_REPAIR)
      if total == 0:
          s.operational_status := OPERATIONAL
      else:
          ratio = under_repair / total
          if ratio >= 0.50:
              s.operational_status := OUT_OF_SERVICE
          elif ratio >= 0.20:
              s.operational_status := DEGRADED
          else:
              s.operational_status := OPERATIONAL
    input_set: "All Inverter rows for the station."
    constants:
      DEGRADED_THRESHOLD: 0.20
      OUT_OF_SERVICE_THRESHOLD: 0.50
    precision: "Exact comparison; >= boundaries pinned."

  - name: defect_recurrence_index
    trigger: "POST /pv-ops/defects (Defect creation)"
    algorithm: topological
    formula: |
      # Walk parent_defect_id chain; index = 1 + (count of nodes in chain that reached CLOSED)
      idx = 1
      cur = defect.parent_defect_id
      while cur is not None:
          parent = Defect.get(cur)
          if parent.state == CLOSED:
              idx += 1
          if parent.subject_id != defect.subject_id or parent.subject_type != defect.subject_type:
              raise ERR_DEFECT_PARENT_SUBJECT_MISMATCH
          cur = parent.parent_defect_id
      defect.recurrence_index := idx
      if idx >= 3:
          defect.severity := max(defect.severity, MAJOR)   # auto-escalation at recurrence threshold
    input_set: "parent_defect_id ancestor chain on same subject."
    constants:
      RECURRENCE_ESCALATION_THRESHOLD: 3
    precision: "Integer; ancestor traversal must terminate (no cycles permitted by subject equality check)."

  - name: historical_downsampling
    trigger: "POST /_sweep/run (also internally on read of GET /pv-ops/stations/{id}/performance?granularity=AGG_*)"
    algorithm: interval_merge
    formula: |
      # Downsample RAW_1MIN to AGG_15MIN, AGG_1H, AGG_1DAY using closed-open bucketing.
      # For target granularity G with bucket size B minutes:
      #   For every aligned bucket [T, T+B):
      #     bucket_dc_power_kw   = round(avg(reading.dc_power_kw   for reading in bucket), 3)
      #     bucket_ac_power_kw   = round(avg(reading.ac_power_kw   for reading in bucket), 3)
      #     bucket_irradiance    = round(avg(reading.irradiance_w_m2 for reading in bucket), 1)
      #     bucket_module_temp_c = round(avg(reading.module_temp_c for reading in bucket), 2)
      #   Empty buckets are NOT created.
      #   Bucket boundary semantics: timestamp t belongs to bucket [floor(t,B), floor(t,B)+B); inclusive-exclusive.
    input_set: "GenerationReadings with granularity=RAW_1MIN; one downsampled row per non-empty bucket."
    constants:
      AGG_15MIN_BUCKET_MIN: 15
      AGG_1H_BUCKET_MIN: 60
      AGG_1DAY_BUCKET_MIN: 1440
    precision: "Averages rounded as listed; closed-open bucket semantics."

# ============================================================
# §1.4 Validations (priority-ordered)
# ============================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted for this operation per RBAC (§1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-resource ids resolve, left to right (Station before Array before String, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Foreign-key fields in body resolve (station_id, inverter_id, subsidy_policy_id, parent_defect_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a valid 'from' state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Supplier referenced by WorkOrder.assigned_supplier_id is not BLACKLISTED"
    error_id: ERR_SUPPLIER_BLACKLISTED
    http_status: 422
    applies_to: "POST /pv-ops/defects/{id}/work-orders"

  - priority: 8
    category: business_safety
    check: "Patrol verifier (X-User-ID) must differ from PatrolRecord.actor_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /pv-ops/patrol-records/{id}/verify, /reject"

  - priority: 9
    category: business_referential
    check: "Defect.parent_defect_id, if set, refers to a Defect with same (subject_type, subject_id)"
    error_id: ERR_DEFECT_PARENT_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /pv-ops/defects"

  - priority: 10
    category: business_referential
    check: "SubsidyDeclaration.settlement_period_id references a SettlementPeriod whose state IN {CONFIRMED, INVOICED}"
    error_id: ERR_SETTLEMENT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /pv-ops/subsidy-declarations/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "SettlementPeriod.period_end <= now() before transitioning to RECONCILING (>= boundary)"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /pv-ops/settlement-periods/{id}/start-reconciliation"

  - priority: 11.5
    category: business_constraint
    check: "At least one MeteringRecord exists under the SettlementPeriod before starting reconciliation (empty-collection boundary)"
    error_id: ERR_NO_METERING_RECORDS
    http_status: 422
    applies_to: "POST /pv-ops/settlement-periods/{id}/start-reconciliation"

  - priority: 12
    category: business_temporal
    check: "No overlapping CONFIRMED SettlementPeriod (closed-open) exists for the same station"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /pv-ops/settlement-periods/{id}/confirm; POST /pv-ops/settlement-periods (create)"

  - priority: 13
    category: business_temporal
    check: "Station.commissioning_date falls within [policy.min_commissioning_date, policy.max_commissioning_date)"
    error_id: ERR_SUBSIDY_INELIGIBLE_BY_COMMISSIONING_DATE
    http_status: 422
    applies_to: "POST /pv-ops/subsidy-declarations/{id}/submit"

  - priority: 14
    category: business_temporal
    check: "SettlementPeriod.period_end falls within [policy.eligible_from, policy.eligible_to)"
    error_id: ERR_SUBSIDY_OUT_OF_ELIGIBILITY_WINDOW
    http_status: 422
    applies_to: "POST /pv-ops/subsidy-declarations/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "policy.required_documents ⊆ {d.key for d in declaration.documents}"
    error_id: ERR_DOCUMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /pv-ops/subsidy-declarations/{id}/submit"

  - priority: 16
    category: business_constraint
    check: "MeteringRecord.pricing_channel == MARKET_TRADING implies Station.market_trading_enabled == true AND market_price_cny_per_kwh is not null"
    error_id: ERR_MARKET_TRADING_DISABLED
    http_status: 422
    applies_to: "POST /pv-ops/stations/{station_id}/metering"

  - priority: 17
    category: business_constraint
    check: "Sum of InvestorShare.share_basis_points (active during period) equals 10000 before SettlementPeriod CONFIRM"
    error_id: ERR_INVESTOR_SHARES_INVALID
    http_status: 422
    applies_to: "POST /pv-ops/settlement-periods/{id}/confirm"

  - priority: 18
    category: business_fiscal
    check: "Spare-part requisition: SparePart.stock_on_hand - SparePart.reserved_qty >= requested quantity (>= boundary, not >)"
    error_id: ERR_SPARE_PART_INSUFFICIENT
    http_status: 422
    applies_to: "POST /pv-ops/defects/{id}/work-orders"

  - priority: 19
    category: business_fiscal
    check: "computed subsidy_amount_cny >= SUBSIDY_MIN_PAYOUT_CNY (=100); boundary >="
    error_id: ERR_SUBSIDY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /pv-ops/subsidy-declarations/{id}/submit"

  - priority: 20
    category: business_fiscal
    check: "Reconciliation tolerance: |sum(MeteringRecord.on_grid_kwh) - grid_company_confirmed_kwh| / max(sum, 0.001) <= 0.005"
    error_id: ERR_RECONCILIATION_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /pv-ops/settlement-periods/{id}/confirm"

  - priority: 21
    category: business_constraint
    check: "AlarmEvent severity INFO cannot be ack'd (must be archived); MAJOR/CRITICAL ack creates a Defect"
    error_id: ERR_ALARM_INFO_NOT_ACKABLE
    http_status: 422
    applies_to: "POST /pv-ops/alarms/{id}/ack"

  - priority: 22
    category: business_constraint
    check: "Idempotency: POST /pv-ops/alarms with same vendor_code on same inverter within DEDUP_WINDOW (=300s) updates existing row instead of creating a new one"
    error_id: ERR_ALARM_DEDUP_RACE
    http_status: 409
    applies_to: "POST /pv-ops/alarms"

# ============================================================
# §1.5 API endpoints
# ============================================================
endpoints:
  # ---- Equipment ledger ----
  - method: POST
    path: /pv-ops/stations
    description: Create a station.
    roles: [PlatformAdmin]
    code: 201
    input: [name, installed_capacity_kw, ac_capacity_kw, commissioning_date, latitude, longitude, grid_company, feed_in_tariff_cny_per_kwh, "market_trading_enabled?"]
    output: Station

  - method: GET
    path: /pv-ops/stations
    description: List stations with pagination.
    roles: [PlatformAdmin, O&MEngineer, FinanceOfficer, FieldOperator]
    code: 200
    input: ["limit?", "offset?", "lifecycle_state?"]
    output: Station[]

  - method: GET
    path: /pv-ops/stations/{id}
    description: Get a station including derived operational_status.
    roles: [PlatformAdmin, O&MEngineer, FinanceOfficer, FieldOperator]
    code: 200
    input: []
    output: Station

  - method: POST
    path: /pv-ops/stations/{station_id}/arrays
    description: Create an Array under a station.
    roles: [PlatformAdmin]
    code: 201
    input: [code, tilt_angle_deg, azimuth_deg]
    output: Array

  - method: POST
    path: /pv-ops/arrays/{array_id}/strings
    description: Create a PVString under an array.
    roles: [PlatformAdmin]
    code: 201
    input: [code, module_count, inverter_id, "combiner_box_id?"]
    output: PVString

  - method: POST
    path: /pv-ops/strings/{string_id}/modules
    description: Register a module on a string.
    roles: [PlatformAdmin]
    code: 201
    input: [serial_no, wp_rating, manufacturer, warranty_supplier_id, warranty_until]
    output: Module

  - method: POST
    path: /pv-ops/inverters
    description: Register an inverter or combiner box.
    roles: [PlatformAdmin]
    code: 201
    input: [station_id, "array_id?", role, model, vendor, serial_no, rated_ac_power_kw, warranty_supplier_id, warranty_until]
    output: Inverter

  - method: GET
    path: /pv-ops/inverters/{id}
    description: Get an inverter.
    roles: [PlatformAdmin, O&MEngineer, FieldOperator]
    code: 200
    input: []
    output: Inverter

  - method: POST
    path: /pv-ops/stations/{station_id}/transformers
    description: Register a transformer / grid-connection point.
    roles: [PlatformAdmin]
    code: 201
    input: [code, rated_capacity_kva, primary_voltage_kv, secondary_voltage_kv, grid_connection_point_no, warranty_supplier_id, warranty_until]
    output: Transformer

  - method: POST
    path: /pv-ops/suppliers
    description: Register a supplier.
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact, "rating?"]
    output: Supplier

  - method: PATCH
    path: /pv-ops/suppliers/{id}
    description: Update supplier (e.g., blacklist).
    roles: [PlatformAdmin]
    code: 200
    input: ["contact?", "rating?", "lifecycle_state?", "version?"]
    output: Supplier

  # ---- Generation monitoring ----
  - method: POST
    path: /pv-ops/stations/{station_id}/readings
    description: Ingest a generation reading (event-driven SCADA sync).
    roles: [PlatformAdmin, system]
    code: 201
    input: [timestamp, dc_power_kw, ac_power_kw, irradiance_w_m2, module_temp_c]
    output: GenerationReading

  - method: GET
    path: /pv-ops/stations/{id}/performance
    description: Compute expected vs actual generation, PR, and capacity factor for a window.
    roles: [PlatformAdmin, O&MEngineer, FinanceOfficer]
    code: 200
    input: [window_start, window_end, "granularity?"]
    output: object  # { expected_generation_kwh, actual_generation_kwh, performance_ratio, capacity_factor }
    side_effects: [calculations.expected_generation_kwh, calculations.actual_generation_kwh, calculations.performance_ratio]

  - method: POST
    path: /_sweep/run
    description: Run historical-data downsampling sweep and auto-arrears scan.
    roles: [PlatformAdmin, system]
    code: 200
    input: []
    output: object
    side_effects: [calculations.historical_downsampling, "SubsidyDeclaration APPROVED -> ARREARS auto-transition"]

  - method: POST
    path: /_clock/advance
    description: Test-only clock advance to enable time-gated transitions.
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: object

  - method: POST
    path: /_events/emit
    description: Test-only external-event emission (SCADA, weather, grid-dispatch, finance) for event-driven sync.
    roles: [PlatformAdmin]
    code: 202
    input: [source, payload]
    output: object

  # ---- Alarms ----
  - method: POST
    path: /pv-ops/alarm-code-map
    description: Register vendor->canonical alarm-code mappings.
    roles: [PlatformAdmin]
    code: 201
    input: [vendor, model, vendor_code, canonical_code, severity, root_cause_hint]
    output: AlarmCodeMap

  - method: POST
    path: /pv-ops/alarms
    description: Ingest an alarm event from SCADA (deduplicated).
    roles: [PlatformAdmin, system]
    code: 201
    input: [inverter_id, vendor_code, first_seen_at]
    output: AlarmEvent
    side_effects: ["dedup merge into existing OPEN AlarmEvent"]

  - method: GET
    path: /pv-ops/alarms
    description: List alarms with filters.
    roles: [PlatformAdmin, O&MEngineer]
    code: 200
    input: ["station_id?", "inverter_id?", "state?", "severity?", "limit?", "offset?"]
    output: AlarmEvent[]

  - method: POST
    path: /pv-ops/alarms/{id}/ack
    description: Acknowledge alarm; may auto-create defect.
    roles: [O&MEngineer]
    code: 200
    input: ["version?"]
    output: AlarmEvent
    side_effects: ["state OPEN->ACKNOWLEDGED", "Defect auto-create when severity MAJOR/CRITICAL", "Inverter.lifecycle_state cascade for CRITICAL", "AuditEntry"]

  - method: POST
    path: /pv-ops/alarms/{id}/clear
    description: Clear an acknowledged alarm.
    roles: [O&MEngineer]
    code: 200
    input: ["version?"]
    output: AlarmEvent

  - method: POST
    path: /pv-ops/alarms/{id}/archive
    description: Archive an alarm (INFO directly, or after CLEARED).
    roles: [O&MEngineer]
    code: 200
    input: ["version?"]
    output: AlarmEvent

  # ---- Patrol ----
  - method: POST
    path: /pv-ops/stations/{station_id}/patrol-plans
    description: Create a patrol plan.
    roles: [O&MEngineer]
    code: 201
    input: [name, zone_route, kind, "cadence_days?", checklist]
    output: PatrolPlan

  - method: POST
    path: /pv-ops/patrol-plans/{id}/schedule
    description: Schedule one patrol record on this plan.
    roles: [O&MEngineer]
    code: 201
    input: [scheduled_for]
    output: PatrolRecord

  - method: POST
    path: /pv-ops/patrol-records/{id}/start
    description: Field operator starts the patrol.
    roles: [FieldOperator]
    code: 200
    input: []
    output: PatrolRecord

  - method: POST
    path: /pv-ops/patrol-records/{id}/zones/{zone}/log
    description: Log a zone with photo + GPS + checklist findings.
    roles: [FieldOperator]
    code: 200
    input: [photo_url, gps, checklist_findings]
    output: PatrolRecord

  - method: POST
    path: /pv-ops/patrol-records/{id}/submit
    description: Submit a patrol record for verification.
    roles: [FieldOperator]
    code: 200
    input: []
    output: PatrolRecord

  - method: POST
    path: /pv-ops/patrol-records/{id}/verify
    description: "Verify and accept a submitted patrol (SoD: not the same actor)."
    roles: [O&MEngineer]
    code: 200
    input: []
    output: PatrolRecord
    side_effects: ["Auto-create Defect from any zone finding flagged defect=true"]

  - method: POST
    path: /pv-ops/patrol-records/{id}/reject
    description: Reject a patrol (SoD).
    roles: [O&MEngineer]
    code: 200
    input: [notes]
    output: PatrolRecord

  # ---- Defects & work orders ----
  - method: POST
    path: /pv-ops/defects
    description: Open a defect (manual external-inspection or data-anomaly source).
    roles: [O&MEngineer]
    code: 201
    input: [station_id, subject_type, subject_id, source, "source_ref_id?", severity, "parent_defect_id?"]
    output: Defect
    side_effects: ["calculations.defect_recurrence_index"]

  - method: GET
    path: /pv-ops/defects
    description: List defects with filters and recurring-defect view.
    roles: [PlatformAdmin, O&MEngineer]
    code: 200
    input: ["station_id?", "state?", "source?", "subject_type?", "recurrence_index_min?", "limit?", "offset?"]
    output: Defect[]

  - method: POST
    path: /pv-ops/defects/{id}/work-orders
    description: Dispatch a work order against a defect.
    roles: [O&MEngineer]
    code: 201
    input: [assigned_supplier_id, assigned_technician_id, scheduled_start, scheduled_end, spare_part_lines, before_metrics]
    output: WorkOrder
    side_effects: ["SparePart reserved", "Defect OPEN/REOPENED -> DISPATCHED"]

  - method: POST
    path: /pv-ops/work-orders/{id}/start
    description: Start a work order.
    roles: [FieldOperator]
    code: 200
    input: []
    output: WorkOrder

  - method: POST
    path: /pv-ops/work-orders/{id}/complete
    description: Complete a work order with after-metrics.
    roles: [FieldOperator]
    code: 200
    input: [after_metrics]
    output: WorkOrder
    side_effects: ["SparePart consumption", "Defect UNDER_REPAIR -> RESOLVED", "Inverter cascade"]

  - method: POST
    path: /pv-ops/work-orders/{id}/cancel
    description: Cancel a dispatched work order, releasing spare-part reservations (compensation).
    roles: [O&MEngineer]
    code: 200
    input: []
    output: WorkOrder

  - method: POST
    path: /pv-ops/defects/{id}/close
    description: Close a resolved defect.
    roles: [O&MEngineer]
    code: 200
    input: []
    output: Defect

  - method: POST
    path: /pv-ops/defects/{id}/reopen
    description: Reopen a recently resolved defect.
    roles: [O&MEngineer]
    code: 200
    input: []
    output: Defect

  - method: POST
    path: /pv-ops/spare-parts
    description: Register a spare part SKU.
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, stock_on_hand, unit_cost_cny]
    output: SparePart

  - method: PATCH
    path: /pv-ops/spare-parts/{id}
    description: Adjust stock.
    roles: [PlatformAdmin]
    code: 200
    input: ["stock_on_hand?", "version?"]
    output: SparePart

  # ---- Settlement ----
  - method: POST
    path: /pv-ops/stations/{station_id}/settlement-periods
    description: Create a settlement period draft.
    roles: [FinanceOfficer]
    code: 201
    input: [period_start, period_end]
    output: SettlementPeriod

  - method: POST
    path: /pv-ops/stations/{station_id}/metering
    description: Record an on-grid metering line into an existing draft settlement period.
    roles: [FinanceOfficer]
    code: 201
    input: [settlement_period_id, window_start, window_end, on_grid_kwh, pricing_channel, "market_price_cny_per_kwh?"]
    output: MeteringRecord

  - method: POST
    path: /pv-ops/settlement-periods/{id}/start-reconciliation
    description: Move DRAFT -> RECONCILING and compute provisional revenue.
    roles: [FinanceOfficer]
    code: 200
    input: [grid_company_confirmed_kwh]
    output: SettlementPeriod
    side_effects: ["calculations.provisional_settlement_revenue"]

  - method: POST
    path: /pv-ops/settlement-periods/{id}/confirm
    description: Confirm settlement period; compute final revenue and create RevenueDistributions.
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: ["calculations.final_settlement_revenue", "calculations.revenue_distribution", "AuditEntry"]

  - method: POST
    path: /pv-ops/settlement-periods/{id}/dispute
    description: Mark a reconciling period as DISPUTED when grid tolerance breached.
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: SettlementPeriod

  - method: POST
    path: /pv-ops/settlement-periods/{id}/issue-invoice
    description: Issue an invoice number on a CONFIRMED period.
    roles: [FinanceOfficer]
    code: 200
    input: [invoice_no]
    output: SettlementPeriod

  - method: POST
    path: /pv-ops/settlement-periods/{id}/revenue-adjust
    description: Compensating action — revert a CONFIRMED period back to RECONCILING and clear distributions.
    roles: [FinanceOfficer]
    code: 200
    input: [reason]
    output: SettlementPeriod
    side_effects: ["RevenueDistribution rows deleted", "AuditEntry action=REVENUE_ADJUST"]

  - method: GET
    path: /pv-ops/settlement-periods/{id}
    description: Get a settlement period including computed amounts and distributions.
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: []
    output: SettlementPeriod

  - method: POST
    path: /pv-ops/stations/{station_id}/investor-shares
    description: Define investor shares for a station.
    roles: [PlatformAdmin]
    code: 201
    input: [investor_name, share_basis_points, effective_from, "effective_to?"]
    output: InvestorShare

  # ---- Subsidy ----
  - method: POST
    path: /pv-ops/subsidy-policies
    description: Register a subsidy policy.
    roles: [PlatformAdmin]
    code: 201
    input: [code, scope, rate_cny_per_kwh, eligible_from, eligible_to, "min_commissioning_date?", "max_commissioning_date?", required_documents]
    output: SubsidyPolicy

  - method: POST
    path: /pv-ops/stations/{station_id}/subsidy-declarations
    description: Draft a subsidy declaration.
    roles: [FinanceOfficer]
    code: 201
    input: [subsidy_policy_id, settlement_period_id, documents]
    output: SubsidyDeclaration

  - method: POST
    path: /pv-ops/subsidy-declarations/{id}/submit
    description: Submit a declaration.
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: SubsidyDeclaration
    side_effects: ["calculations.subsidy_amount", "approval_due_date := now()+90d"]

  - method: POST
    path: /pv-ops/subsidy-declarations/{id}/approve
    description: Approve a submitted declaration.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SubsidyDeclaration

  - method: POST
    path: /pv-ops/subsidy-declarations/{id}/reject
    description: Reject a submitted declaration.
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: SubsidyDeclaration

  - method: POST
    path: /pv-ops/subsidy-declarations/{id}/receive
    description: Record subsidy receipt (settles arrears too).
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: SubsidyDeclaration

  - method: GET
    path: /pv-ops/subsidy-declarations
    description: List declarations.
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: ["station_id?", "state?", "limit?", "offset?"]
    output: SubsidyDeclaration[]

  # ---- Audit ----
  - method: GET
    path: /pv-ops/audit-entries
    description: Query audit log.
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: ["target_type?", "target_id?", "actor_id?", "limit?", "offset?"]
    output: AuditEntry[]

# ============================================================
# §1.6 Error catalog
# ============================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role missing or unknown"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or FK does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource state does not permit the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on PATCH/PUT"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input shape / range violation not covered by a more specific code"
  - id: ERR_SUPPLIER_BLACKLISTED
    http: 422
    condition: "Cannot assign a BLACKLISTED supplier to a work order"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Same X-User-ID attempts both actor and verifier roles on a PatrolRecord"
  - id: ERR_DEFECT_PARENT_SUBJECT_MISMATCH
    http: 422
    condition: "parent_defect_id references a defect on a different subject"
  - id: ERR_SETTLEMENT_NOT_CONFIRMED
    http: 422
    condition: "SubsidyDeclaration references a SettlementPeriod not in {CONFIRMED, INVOICED}"
  - id: ERR_PERIOD_NOT_ENDED
    http: 422
    condition: "SettlementPeriod.period_end > now() when start-reconciliation is invoked"
  - id: ERR_NO_METERING_RECORDS
    http: 422
    condition: "No MeteringRecord rows exist under the SettlementPeriod at start-reconciliation"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "A CONFIRMED SettlementPeriod with overlapping [period_start,period_end) interval already exists for the station"
  - id: ERR_SUBSIDY_INELIGIBLE_BY_COMMISSIONING_DATE
    http: 422
    condition: "Station.commissioning_date outside policy's commissioning-date window"
  - id: ERR_SUBSIDY_OUT_OF_ELIGIBILITY_WINDOW
    http: 422
    condition: "SettlementPeriod.period_end outside policy.[eligible_from, eligible_to)"
  - id: ERR_DOCUMENTS_INCOMPLETE
    http: 422
    condition: "Declaration documents do not cover policy.required_documents"
  - id: ERR_MARKET_TRADING_DISABLED
    http: 422
    condition: "MARKET_TRADING line on a station with market_trading_enabled=false, or missing market_price_cny_per_kwh"
  - id: ERR_MARKET_PRICE_REQUIRED
    http: 422
    condition: "pricing_channel=MARKET_TRADING but market_price_cny_per_kwh is null"
  - id: ERR_INVESTOR_SHARES_INVALID
    http: 422
    condition: "Sum of active InvestorShare basis-points != 10000 at settlement confirmation"
  - id: ERR_SPARE_PART_INSUFFICIENT
    http: 422
    condition: "Requested spare-part quantity exceeds stock_on_hand - reserved_qty (boundary >=)"
  - id: ERR_SUBSIDY_BELOW_THRESHOLD
    http: 422
    condition: "Computed subsidy_amount_cny < SUBSIDY_MIN_PAYOUT_CNY (=100)"
  - id: ERR_RECONCILIATION_OUT_OF_TOLERANCE
    http: 422
    condition: "Reconciliation difference ratio > 0.005 at confirm step"
  - id: ERR_ALARM_INFO_NOT_ACKABLE
    http: 422
    condition: "INFO alarms cannot be acknowledged; must be archived directly"
  - id: ERR_ALARM_ALREADY_ACKED
    http: 409
    condition: "Concurrent ack: alarm has already advanced past OPEN"
  - id: ERR_ALARM_DEDUP_RACE
    http: 409
    condition: "Concurrent duplicate alarm ingestion within DEDUP_WINDOW could not be merged atomically"
  - id: ERR_ALARM_CODE_UNMAPPED
    http: 422
    condition: "Incoming vendor_code has no AlarmCodeMap entry for the (vendor, model) of the inverter"
  - id: ERR_INVOICE_DUPLICATE
    http: 409
    condition: "invoice_no already used for another SettlementPeriod"
  - id: ERR_UNIQUE_VIOLATION
    http: 409
    condition: "Generic unique-constraint violation (e.g., Station.name, Module.serial_no)"

# ============================================================
# §1.7 RBAC matrix
# ============================================================
roles:
  - name: PlatformAdmin
    description: System administrator; configures equipment ledger, suppliers, policies; can approve/reject subsidy declarations.
    identity: opaque
    exclusive_operations:
      - "POST /pv-ops/stations"
      - "POST /pv-ops/stations/{station_id}/arrays"
      - "POST /pv-ops/arrays/{array_id}/strings"
      - "POST /pv-ops/strings/{string_id}/modules"
      - "POST /pv-ops/inverters"
      - "POST /pv-ops/stations/{station_id}/transformers"
      - "POST /pv-ops/suppliers"
      - "PATCH /pv-ops/suppliers/{id}"
      - "POST /pv-ops/alarm-code-map"
      - "POST /pv-ops/spare-parts"
      - "PATCH /pv-ops/spare-parts/{id}"
      - "POST /pv-ops/stations/{station_id}/investor-shares"
      - "POST /pv-ops/subsidy-policies"
      - "POST /pv-ops/subsidy-declarations/{id}/approve"
      - "POST /pv-ops/subsidy-declarations/{id}/reject"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET /pv-ops/* (read-only)"
      - "POST /_sweep/run (with system)"
      - "POST /pv-ops/stations/{station_id}/readings (with system)"
      - "POST /pv-ops/alarms (with system)"

  - name: O&MEngineer
    description: Operations & maintenance engineer; runs alarm workflow, opens defects, dispatches work orders, verifies patrols.
    identity: opaque
    exclusive_operations:
      - "POST /pv-ops/alarms/{id}/ack"
      - "POST /pv-ops/alarms/{id}/clear"
      - "POST /pv-ops/alarms/{id}/archive"
      - "POST /pv-ops/stations/{station_id}/patrol-plans"
      - "POST /pv-ops/patrol-plans/{id}/schedule"
      - "POST /pv-ops/patrol-records/{id}/verify"
      - "POST /pv-ops/patrol-records/{id}/reject"
      - "POST /pv-ops/defects"
      - "POST /pv-ops/defects/{id}/work-orders"
      - "POST /pv-ops/work-orders/{id}/cancel"
      - "POST /pv-ops/defects/{id}/close"
      - "POST /pv-ops/defects/{id}/reopen"
    shared_operations:
      - "GET /pv-ops/* (read-only)"

  - name: FieldOperator
    description: Field technician executing patrols and work orders on-site.
    identity: opaque
    exclusive_operations:
      - "POST /pv-ops/patrol-records/{id}/start"
      - "POST /pv-ops/patrol-records/{id}/zones/{zone}/log"
      - "POST /pv-ops/patrol-records/{id}/submit"
      - "POST /pv-ops/work-orders/{id}/start"
      - "POST /pv-ops/work-orders/{id}/complete"
    shared_operations:
      - "GET /pv-ops/stations/{id} (read-only)"
      - "GET /pv-ops/inverters/{id} (read-only)"

  - name: FinanceOfficer
    description: Finance officer; runs metering, settlement, revenue distribution, and subsidy declarations.
    identity: opaque
    exclusive_operations:
      - "POST /pv-ops/stations/{station_id}/settlement-periods"
      - "POST /pv-ops/stations/{station_id}/metering"
      - "POST /pv-ops/settlement-periods/{id}/start-reconciliation"
      - "POST /pv-ops/settlement-periods/{id}/confirm"
      - "POST /pv-ops/settlement-periods/{id}/dispute"
      - "POST /pv-ops/settlement-periods/{id}/issue-invoice"
      - "POST /pv-ops/settlement-periods/{id}/revenue-adjust"
      - "POST /pv-ops/stations/{station_id}/subsidy-declarations"
      - "POST /pv-ops/subsidy-declarations/{id}/submit"
      - "POST /pv-ops/subsidy-declarations/{id}/receive"
    shared_operations:
      - "GET /pv-ops/* (read-only)"
      - "GET /pv-ops/audit-entries"
