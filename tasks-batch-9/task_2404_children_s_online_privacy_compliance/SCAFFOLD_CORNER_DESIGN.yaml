      - name: collection_refused_before_determination_and_on_general_audience
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - errors[ERR_DETERMINATION_NOT_MADE]
          - errors[ERR_SERVICE_NOT_CHILD_DIRECTED]
          - calculations.child_directed_determination
        distinguishing_aspect: "Priority 80 splits into two distinct error codes on the same endpoint: NOT_ASSESSED is ERR_DETERMINATION_NOT_MADE (the operator never ran the analysis) while GENERAL_AUDIENCE is ERR_SERVICE_NOT_CHILD_DIRECTED (the analysis was run and came back negative), and both fire even though the consent, notice, screen, activity and schedule are all in order — adding design evidence that lifts design_score to 0.51 then opens collection."
