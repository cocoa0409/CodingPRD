      - name: cascade_of_member_suspension_side_effects
        claim_type: cross_entity
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / member_suspension_cascades_credential_to_grant_to_showing
          rationale: "Every hop of the suspension cascade is asserted in the named §1.8 instance."

      - name: every_resource_type_returns_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
