              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/statements/${sm3_id}/close"
              payload: {}
              as: PropertyAccountant
          assert:
            - "MonthlyStatement.${sm3_id}.payroll_charge_cents == 570240"
            - "MonthlyStatement.${sm3_id}.base_fee_cents == 250000 (minimum floor binds at zero revenue)"
            - "MonthlyStatement.${sm3_id}.management_fee_total_cents == 250000"

      - name: annual_noi_incentive_mode_c_pinned_evaluation_order
        grounds:
          - calculations.annual_noi_incentive
          - entities.Budget.fields.status
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the hurdle base round(budget_noi * (1+hurdle)) is rounded first,
          then subtracted from actual_noi, then the share is applied; sharing
          before subtracting yields a different integer. With budget NOI
          5000000, actual NOI 5600000, hurdle 0.08, share 0.20 the pinned
          order yields annual_incentive_cents == 40000; the reversed order
          yields 36000.
        test_recipe:
          setup:
            - "Owner O4; Agreement AG4 ACTIVE with noi_hurdle_pct=0.08, incentive_noi_share_pct=0.20; Property P4 MANAGED with one resident"
            - "APPROVED ANNUAL Budget for P4 fiscal_year 2026: operating_revenue_cents=12000000, operating_expense_cents=7000000 (budget_noi=5000000)"
            - "Twelve CLOSED CASH statements for 2026-01..2026-12, each with one POSTED RENT ledger row of 1000000 collected in-month (actual revenue 12000000) and one POSTED EXPENSE row per month totalling 6400000 across the year (actual_noi = 5600000)"
            - "Logical clock at 2027-01-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "NOI Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o4_id: $.data.id }
