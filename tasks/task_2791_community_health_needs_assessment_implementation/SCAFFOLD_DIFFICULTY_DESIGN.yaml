# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Community Health Needs Assessment & Implementation
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves
# the declared behaviour identical; it only makes coverage harder to audit.
# Logical clock default: 2026-08-01T00:00:00Z (no set_current_utc call needed
# unless an instance states otherwise).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: posting_valuation_provisional_vs_final_ratio_diverges
        grounds:
          - calculations.posting_valued_amount
          - calculations.report_category_totals
          - calculations.report_indirect_and_grand_total
          - entities.CommunityBenefitReport.fields.valuation_basis
          - entities.ExpensePosting.fields.ratio_applied
          - state_machines.CommunityBenefitReport.OPEN_to_LOCKED
        distinguishing_aspect: |
          The two variants are selected by the report's own valuation_basis,
          not by the caller: identical charges_cents inputs are valued with
          the unaudited prior-year ratio 0.3200 while the report is
          PROVISIONAL and re-valued with the audited ratio 0.2800 when it is
          locked, and the reconciliation delta propagates through both
          category totals and the overhead-tiered grand total.
        test_recipe:
          setup:
            - "one AssessmentCycle (fiscal_year 2026) whose prior_year_cost_to_charge_ratio is 0.3200 and total_operating_expense_cents is 120000000"
            - "one OPEN CommunityBenefitReport on that cycle, opened by user u_officer_1, carrying cost_to_charge_ratio 0.3200 and valuation_basis PROVISIONAL"
            - "three POSTED ExpensePosting rows: FINANCIAL_ASSISTANCE charges_cents 1234567 (valued 395061), SUBSIDIZED_SERVICES charges_cents 2222222 (valued 711111), COMMUNITY_HEALTH_IMPROVEMENT direct_cost_cents 850000 (valued 850000)"
            - "under the PROVISIONAL basis the report reads total_valued_cents 1956172, overhead_rate 0.05, indirect_allocation_cents 97809, grand_total_cents 2053981, benefit_pct_of_expense 1.71"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v1: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v1}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { p_fa: $.data.id }
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { rep_v2: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "SUBSIDIZED_SERVICES", charges_cents: 2222222, direct_cost_cents: 0, expected_report_version: "${rep_v2}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { p_ss: $.data.id }
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { rep_v3: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "COMMUNITY_HEALTH_IMPROVEMENT", charges_cents: 0, direct_cost_cents: 850000, expected_report_version: "${rep_v3}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { p_chi: $.data.id }
          trigger:
            - call: "POST /community-benefit-reports/${rep}/finalize"
              payload: { audited_cost_to_charge_ratio: 0.2800 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "HTTP 200"
            - "CommunityBenefitReport.${rep}.valuation_basis == FINAL and cost_to_charge_ratio == 0.2800 and status == LOCKED"
            - "ExpensePosting.${p_fa}.valued_cents == 345679 (was 395061 under PROVISIONAL) and ratio_applied == 0.2800 and valuation_basis_at_posting == FINAL"
            - "ExpensePosting.${p_ss}.valued_cents == 622222 (was 711111 under PROVISIONAL) and ratio_applied == 0.2800"
            - "ExpensePosting.${p_chi}.valued_cents == 850000 and ratio_applied == null — the cost-based category is variant-insensitive"
            - "CommunityBenefitReport.${rep}.financial_assistance_cents == 345679"
            - "CommunityBenefitReport.${rep}.subsidized_services_cents == 622222"
            - "CommunityBenefitReport.${rep}.community_health_improvement_cents == 850000"
            - "CommunityBenefitReport.${rep}.total_valued_cents == 1817901 (was 1956172)"
            - "CommunityBenefitReport.${rep}.indirect_allocation_cents == 90895 (was 97809)"
            - "CommunityBenefitReport.${rep}.grand_total_cents == 1908796 (was 2053981; reconciliation delta -145185)"
            - "CommunityBenefitReport.${rep}.benefit_pct_of_expense == 1.59 (was 1.71)"

      - name: candidate_composite_equal_weight_vs_community_weighted_diverges
        grounds:
          - calculations.candidate_composite_score
          - calculations.community_concern_index
          - calculations.indicator_severity_score
          - calculations.indicator_disparity_ratio
          - entities.PriorityCandidate.fields.scoring_variant
          - state_machines.PriorityCandidate.SCORED_to_SCORED
        distinguishing_aspect: |
          Both variants read the identical four inputs (severity 77.50,
          disparity points 60.00, community concern 100.00, hospital capacity
          70) yet EQUAL_WEIGHT returns 76.88 while COMMUNITY_WEIGHTED returns
          79.00, because the second reading moves weight off hospital
          capacity onto community concern and disparities.
        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION"
            - "one SUFFICIENT HealthIndicator (domain BEHAVIORAL_HEALTH, benchmark_value 12.0) with ACTIVE data points OVERALL 18.6, BLACK_NH 24.8, WHITE_NH 15.5, so severity_score is 77.50 and disparity_ratio is 1.60"
            - "one COMPLETED StakeholderInterview rating BEHAVIORAL_HEALTH 5 with attendee_count 12, so community_concern_index is 100.00"
            - "one PriorityCandidate with hospital_capacity_score 70, already SCORED under EQUAL_WEIGHT with composite_score 76.88"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
              captures: { dp_overall: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "COMMUNITY_WEIGHTED" }
              as: CommunityBenefitOfficer
          assert:
            - "HTTP 200"
            - "PriorityCandidate.${cand}.scoring_variant == COMMUNITY_WEIGHTED"
            - "PriorityCandidate.${cand}.severity_input == 77.50"
            - "PriorityCandidate.${cand}.disparity_points == 60.00"
            - "PriorityCandidate.${cand}.community_concern_index == 100.00"
            - "PriorityCandidate.${cand}.composite_score == 79.00 (the EQUAL_WEIGHT run on the identical inputs returned 76.88; variant delta +2.12)"
            - "PriorityCandidate.${cand}.status == SCORED"
            - "HealthIndicator.${ind}.severity_score == 77.50 and HealthIndicator.${ind}.disparity_ratio == 1.60 are unchanged by re-scoring"

  - rule_id: combinatorial_formula
    instances:
      - name: report_total_rounds_per_posting_before_summing
        grounds:
          - calculations.posting_valued_amount
          - calculations.report_category_totals
          - entities.CommunityBenefitReport.fields.financial_assistance_cents
          - entities.ExpensePosting.fields.valued_cents
        distinguishing_aspect: |
          Rounding order is the whole test: three FINANCIAL_ASSISTANCE
          postings of charges_cents 1005 at ratio 0.3200 each round up to 322
          cents, summing to 966, whereas summing the charges first
          (3015 * 0.3200 = 964.8) and rounding once yields 965. The pinned
          order is round-per-posting-then-sum, so 966 is correct and 965 is
          the rejected reading.
        test_recipe:
          setup:
            - "one AssessmentCycle (fiscal_year 2026) with prior_year_cost_to_charge_ratio 0.3200 and total_operating_expense_cents 120000000"
            - "one OPEN CommunityBenefitReport on that cycle with cost_to_charge_ratio 0.3200"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              captures: { rep: $.data.id, rep_v1: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1005, direct_cost_cents: 0, expected_report_version: "${rep_v1}" }
              as: CommunityBenefitOfficer
              captures: { p1: $.data.id }
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { rep_v2: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1005, direct_cost_cents: 0, expected_report_version: "${rep_v2}" }
              as: CommunityBenefitOfficer
              captures: { p2: $.data.id }
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { rep_v3: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1005, direct_cost_cents: 0, expected_report_version: "${rep_v3}" }
              as: CommunityBenefitOfficer
              captures: { p3: $.data.id }
          assert:
            - "HTTP 201"
            - "ExpensePosting.${p1}.valued_cents == 322 and ExpensePosting.${p2}.valued_cents == 322 and ExpensePosting.${p3}.valued_cents == 322"
            - "CommunityBenefitReport.${rep}.financial_assistance_cents == 966 (the sum-then-round reading would give 965)"
            - "CommunityBenefitReport.${rep}.total_valued_cents == 966"
            - "CommunityBenefitReport.${rep}.overhead_rate == 0.05"
            - "CommunityBenefitReport.${rep}.indirect_allocation_cents == 48"
            - "CommunityBenefitReport.${rep}.grand_total_cents == 1014"

      - name: report_overhead_tier_keyed_on_direct_benefit_not_grand_total
        grounds:
          - calculations.report_indirect_and_grand_total
          - calculations.report_category_totals
          - entities.CommunityBenefitReport.fields.overhead_rate
          - entities.CommunityBenefitReport.fields.grand_total_cents
        distinguishing_aspect: |
          The tier base is pinned to total_valued_cents, not to
          grand_total_cents: a single COMMUNITY_HEALTH_IMPROVEMENT posting of
          direct_cost_cents 4900000 selects overhead_rate 0.05 (base
          4900000 < 5000000) and produces grand_total_cents 5145000, while
          the circular reading that keys the tier off the resulting grand
          total (5145000 >= 5000000 -> 0.08) would produce 5292000.
        test_recipe:
          setup:
            - "one AssessmentCycle (fiscal_year 2026) with total_operating_expense_cents 120000000"
            - "one OPEN CommunityBenefitReport on that cycle with no postings, total_valued_cents 0 and overhead_rate 0.05"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              captures: { rep: $.data.id, rep_v1: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "COMMUNITY_HEALTH_IMPROVEMENT", charges_cents: 0, direct_cost_cents: 4900000, expected_report_version: "${rep_v1}" }
              as: CommunityBenefitOfficer
              captures: { p_chi: $.data.id }
          assert:
            - "HTTP 201"
            - "ExpensePosting.${p_chi}.valued_cents == 4900000 and ratio_applied == null"
            - "CommunityBenefitReport.${rep}.total_valued_cents == 4900000"
            - "CommunityBenefitReport.${rep}.overhead_rate == 0.05 (NOT 0.08)"
            - "CommunityBenefitReport.${rep}.indirect_allocation_cents == 245000 (NOT 392000)"
            - "CommunityBenefitReport.${rep}.grand_total_cents == 5145000 (NOT 5292000)"
            - "CommunityBenefitReport.${rep}.benefit_pct_of_expense == 4.29"

      - name: candidate_disparity_points_capped_by_min_at_100
        grounds:
          - calculations.candidate_composite_score
          - calculations.indicator_disparity_ratio
          - entities.PriorityCandidate.fields.disparity_points
        distinguishing_aspect: |
          The disparity term is a two-step composition with an inner cap:
          disparity_ratio 2.75 gives (2.75 - 1) * 100 = 175.00, which the
          min() against DISPARITY_POINTS_CEILING clamps to 100.00 before the
          weighted sum runs, producing composite 86.88 rather than the 105.63
          an uncapped reading would give.
        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION"
            - "one SUFFICIENT HealthIndicator (BEHAVIORAL_HEALTH, benchmark_value 12.0) with ACTIVE data points OVERALL 18.6, BLACK_NH 27.5, WHITE_NH 10.0, so severity_score is 77.50 and disparity_ratio is 2.75"
            - "one COMPLETED StakeholderInterview rating BEHAVIORAL_HEALTH 5 with attendee_count 12, so community_concern_index is 100.00"
            - "one DRAFT PriorityCandidate on that indicator with hospital_capacity_score 70"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "COMMUNITY_SURVEY", value: 27.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "COMMUNITY_SURVEY", value: 10.0, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
          trigger:
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
          assert:
            - "HTTP 200"
            - "HealthIndicator.${ind}.disparity_ratio == 2.75 and HealthIndicator.${ind}.subgroup_count == 2"
            - "PriorityCandidate.${cand}.disparity_points == 100.00 (the uncapped value would be 175.00)"
            - "PriorityCandidate.${cand}.severity_input == 77.50"
            - "PriorityCandidate.${cand}.community_concern_index == 100.00"
            - "PriorityCandidate.${cand}.composite_score == 86.88 (an uncapped disparity term would give 105.63)"

  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_board_defer_returns_to_strategy_development_and_readvances
        grounds:
          - state_machines.AssessmentCycle.BOARD_REVIEW_to_STRATEGY_DEVELOPMENT
          - state_machines.AssessmentCycle.STRATEGY_DEVELOPMENT_to_BOARD_REVIEW
          - state_machines.ImplementationStrategy.SUBMITTED_to_RETURNED
          - state_machines.ImplementationStrategy.RETURNED_to_SUBMITTED
          - entities.AssessmentCycle.fields.board_deferral_count
          - validations[priority=23]
        distinguishing_aspect: |
          The phase graph is not a chain: a DEFER board action walks
          BOARD_REVIEW back to STRATEGY_DEVELOPMENT, returns every SUBMITTED
          strategy to RETURNED while retaining submitted_at, and the same
          cycle can then be re-submitted and re-advanced without bound —
          board_deferral_count is the observable loop counter.
        test_recipe:
          setup:
            - "AssessmentCycle in BOARD_REVIEW with board_deferral_count 0 and posture RESTRICTED"
            - "one SELECTED PriorityCandidate (composite_score 76.88) carrying one SUBMITTED ImplementationStrategy with one DRAFT StrategyObjective and one PENDING ResourceCommitment"
            - "one EXECUTED PartnershipAgreement funding that commitment"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates/${cand}/select"
              payload: { selection_rationale: "Highest composite need with hospital capacity to act" }
              as: CommunityBenefitOfficer
              captures: { cand_v: $.data.version }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "STRATEGY_DEVELOPMENT" }
              as: CommunityBenefitOfficer
