scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: expected_vs_actual_generation_on_station
        grounds:
          - calculations.expected_generation_kwh
          - calculations.actual_generation_kwh
          - calculations.performance_ratio
          - entities.Station.fields.installed_capacity_kw
          - entities.GenerationReading.fields.irradiance_w_m2
          - entities.AlarmEvent.fields.severity
        distinguishing_aspect: |
          Both calculations consume the same RAW_1MIN GenerationReading set on a Station, but
          expected_generation_kwh is forward_looking (irradiance-driven, no state filter) while
          actual_generation_kwh is chronological with a state filter that zeros out slices that
          fall inside an OPEN/ACKNOWLEDGED MAJOR-or-CRITICAL alarm window — different algorithms
          on the SAME entity domain (Station + its readings), producing different kWh figures
          for identical inputs.
        test_recipe:
          setup:
            - "Station S with installed_capacity_kw=100, ac_capacity_kw=100, market_trading_enabled=true, feed_in_tariff_cny_per_kwh=0.5000"
            - "One Inverter I under S"
            - "_clock advanced to 2026-01-01T00:00:00Z"
            - "Ingest 60 GenerationReadings for S at minutes 0..59 of hour 0, each with irradiance_w_m2=800, dc_power_kw=72, ac_power_kw=70, module_temp_c=25"
            - "Ingest a MAJOR AlarmEvent on I via POST /pv-ops/alarms with first_seen_at=2026-01-01T00:15:00Z; AlarmCodeMap is preconfigured to map to canonical=INV_OVERTEMP severity=MAJOR; alarm acknowledged at 2026-01-01T00:45:00Z (state ACKNOWLEDGED, last_seen_at=2026-01-01T00:30:00Z)"
          trigger:
            - "GET /pv-ops/stations/{S.id}/performance?window_start=2026-01-01T00:00:00Z&window_end=2026-01-01T01:00:00Z"
          assert:
            - "response.data.expected_generation_kwh == 80.000   # 60 readings * (800/1000)*100*(1/60) = 80.000 exactly"
            - "response.data.actual_generation_kwh == 51.333   # included_slices = 60 - 16 (alarm window 00:15..00:30 inclusive both endpoints = 16 minutes excluded) = 44; total = round(44*70/60, 3) = round(51.3333, 3) = 51.333"
            - "response.data.performance_ratio == 0.6417   # round(51.333/80.000, 4)"
            - "response.data.capacity_factor == 0.5133     # round(51.333/(100*1.0), 4)"
      - name: provisional_vs_final_settlement_on_settlement_period
        grounds:
          - calculations.provisional_settlement_revenue
          - calculations.final_settlement_revenue
          - state_machines.SettlementPeriod.DRAFT_to_RECONCILING
          - state_machines.SettlementPeriod.RECONCILING_to_CONFIRMED
          - entities.MeteringRecord.fields.on_grid_kwh
          - entities.SettlementPeriod.fields.grid_company_confirmed_kwh
        distinguishing_aspect: |
          Same set of MeteringRecord rows feeds two different algorithms on the SettlementPeriod
          entity (a different domain from Station): provisional uses raw on_grid_kwh per-line then
          rounds, final scales each row by adjustment_ratio = grid_company_confirmed_kwh/Σon_grid_kwh
          before rounding per-line; the two produce divergent values whenever the grid figure
          differs from the metered sum even by a fraction within the 0.005 tolerance.
        test_recipe:
          setup:
            - "Station S2 with feed_in_tariff_cny_per_kwh=0.5000, market_trading_enabled=true"
            - "SettlementPeriod P (DRAFT) for S2 covering [2026-02-01,2026-03-01)"
            - "MeteringRecord M1 in P: pricing_channel=FEED_IN, on_grid_kwh=100.000"
            - "MeteringRecord M2 in P: pricing_channel=MARKET_TRADING, on_grid_kwh=80.000, market_price_cny_per_kwh=0.4500"
            - "_clock advanced to 2026-03-02T00:00:00Z"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/start-reconciliation with grid_company_confirmed_kwh=180.500"
            - "POST /pv-ops/settlement-periods/{P.id}/confirm (after defining a single InvestorShare with share_basis_points=10000 to satisfy invariants)"
          assert:
            - "After start-reconciliation: P.provisional_revenue_cny == 86.00   # round(100*0.50,2) + round(80*0.45,2) = 50.00 + 36.00"
            - "After confirm: P.final_revenue_cny == 86.24   # ratio=180.500/180.000; adj_kwh M1=round(100.278,3)=100.278 -> round(100.278*0.50,2)=50.14; M2=round(80.222,3)=80.222 -> round(80.222*0.45,2)=36.10; total=86.24"
            - "P.final_revenue_cny != P.provisional_revenue_cny"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_per_line_round_then_sum
        grounds:
          - calculations.provisional_settlement_revenue
          - calculations.final_settlement_revenue
          - entities.MeteringRecord.fields.pricing_channel
          - entities.Station.fields.feed_in_tariff_cny_per_kwh
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins "round per-line to 2
          decimals THEN sum" for provisional and final settlement revenue. If a naive implementation
          summed first and rounded once, the result would diverge by up to N/2 cents where N is the
          number of metering rows; the scaffold explicitly mandates per-line round → sum → no
          second round, so a test can drive the difference.
        test_recipe:
          setup:
            - "Station S with feed_in_tariff_cny_per_kwh=0.3333"
            - "SettlementPeriod P (DRAFT), three MeteringRecord rows each FEED_IN, on_grid_kwh = 1.005"
            - "_clock advanced past P.period_end"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/start-reconciliation with grid_company_confirmed_kwh=3.015"
          assert:
            - "P.provisional_revenue_cny == 0.99   # per-line: 1.005*0.3333=0.3349665 -> round_half_up to 2dp = 0.33; sum over 3 lines = 0.99. A sum-then-round implementation would produce round(3*0.3349665,2)=round(1.0049,2)=1.00 — pinning per-line order makes these diverge."
      - name: revenue_distribution_drift_compensation
        grounds:
          - calculations.revenue_distribution
          - entities.InvestorShare.fields.share_basis_points
          - entities.RevenueDistribution.fields.amount_cny
          - entities.SettlementPeriod.fields.final_revenue_cny
        distinguishing_aspect: |
          Mode (c) — circular-looking evaluation order pinned. Distribution rounds each share
          independently to integer cents (round_half_up), then computes drift = final_total_cents
          − Σraw_cents, then deterministically pushes the drift onto the LAST share by alphabetical
          investor_name ordering. Without the pinned tie-break, the drift could land on any share
          and the sum invariant would still hold but row-level outputs would differ; the scaffold
          fixes the order so each row is deterministic.
        test_recipe:
          setup:
            - "Station S (post-confirmation setup: P.final_revenue_cny=100.01)"
            - "InvestorShare A: investor_name='Alpha', share_basis_points=3333"
            - "InvestorShare B: investor_name='Beta', share_basis_points=3334"
            - "InvestorShare G: investor_name='Gamma', share_basis_points=3333"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/confirm"
          assert:
            - "RevenueDistribution for Alpha .amount_cny == 33.34   # round(10001*3333/10000)=round(3333.6333)=3334 cents"
            - "RevenueDistribution for Beta  .amount_cny == 33.35   # round(10001*3334/10000)=round(3334.7334)=3335 cents"
            - "RevenueDistribution for Gamma .amount_cny == 33.32   # 3334 raw cents minus drift of -2 (acc=10003, target=10001) — drift applied to last alphabetically (Gamma)"
            - "sum(amount_cny across rows) == 100.01"
      - name: subsidy_tier_with_threshold_floor
        grounds:
          - calculations.subsidy_amount
          - entities.SubsidyPolicy.fields.rate_cny_per_kwh
          - entities.SettlementPeriod.fields.grid_company_confirmed_kwh
          - errors[ERR_SUBSIDY_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Mode (a) — formula with three inputs (claimed_kwh, rate, min_payout) and non-linear
          interaction: nested rounding inside a conditional threshold gate. claimed_kwh × rate is
          rounded to 2 decimals first; THEN the threshold check >= 100 fires (boundary precision).
          A value rounding UP to exactly 100.00 passes; rounding to 99.99 fails. Different mode
          from per-line-round-then-sum because the conditional branch on threshold is the
          combinatorial axis here, not the rounding order.
        test_recipe:
          setup:
            - "SubsidyPolicy POL with rate_cny_per_kwh=0.0500, eligible window 2026-01-01..2027-01-01, no commissioning bounds"
            - "Station S commissioned 2025-06-01 (in window)"
            - "Two confirmed SettlementPeriods on S: P_low with grid_company_confirmed_kwh=1999.900 (rate*kwh=99.995→round=100.00 passes) and P_below with grid_company_confirmed_kwh=1999.890 (rate*kwh=99.9945→round=99.99 fails)"
            - "Both periods sit in policy eligibility window"
          trigger:
            - "POST /pv-ops/stations/{S.id}/subsidy-declarations referencing POL and P_low → submit"
            - "POST /pv-ops/stations/{S.id}/subsidy-declarations referencing POL and P_below → submit"
          assert:
            - "Declaration on P_low after submit has subsidy_amount_cny == 100.00 and state == SUBMITTED"
            - "Declaration on P_below submit returns 422 ERR_SUBSIDY_BELOW_THRESHOLD"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: defect_revision_cycle_revert
        grounds:
          - state_machines.Defect.OPEN_to_DISPATCHED
          - state_machines.Defect.DISPATCHED_to_OPEN
          - state_machines.Defect.RESOLVED_to_REOPENED
          - state_machines.Defect.REOPENED_to_DISPATCHED
          - state_machines.Defect.DISPATCHED_to_UNDER_REPAIR
        distinguishing_aspect: |
          Defect has a true cycle: OPEN → DISPATCHED → OPEN (work-order cancel revert) and
          RESOLVED → REOPENED → DISPATCHED. Within one Defect entity, the lifecycle is not a
          monotone DAG; the same OPEN/DISPATCHED states can be revisited via cancellation and
          reopen, which is structurally different from any linear A→B→C→D pipeline.
        test_recipe:
          setup:
            - "Station, Inverter, Supplier ACTIVE, SparePart with stock_on_hand=5"
            - "POST /pv-ops/defects (source=EXTERNAL_INSPECTION, severity=MINOR, subject_type=INVERTER) → state=OPEN"
            - "POST /pv-ops/defects/{id}/work-orders with spare_part_lines=[{part_id:S, quantity:2}] → Defect state=DISPATCHED; SparePart.reserved_qty=2"
          trigger:
            - "POST /pv-ops/work-orders/{wo.id}/cancel"
          assert:
            - "Defect.state == OPEN (cycle revert)"
            - "WorkOrder.state == CANCELED"
            - "SparePart.reserved_qty == 0 (compensation)"
            - "Subsequent POST /pv-ops/defects/{id}/work-orders succeeds again (entered DISPATCHED from OPEN twice — proves cycle)"
      - name: settlement_revenue_adjust_revision_cycle
        grounds:
          - state_machines.SettlementPeriod.RECONCILING_to_CONFIRMED
          - state_machines.SettlementPeriod.CONFIRMED_to_RECONCILING
          - calculations.revenue_distribution
        distinguishing_aspect: |
          SettlementPeriod also has a cycle CONFIRMED → RECONCILING via revenue-adjust, on a
          DIFFERENT entity from Defect. This proves the scaffold has at least two distinct entities
          with non-linear cycle shape.
        test_recipe:
          setup:
            - "Station with one InvestorShare 10000 bp"
            - "SettlementPeriod P → DRAFT → RECONCILING → CONFIRMED with final_revenue_cny=500.00; RevenueDistribution rows created"
            - "No SubsidyDeclaration references P"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/revenue-adjust with reason='operator correction'"
          assert:
            - "P.state == RECONCILING (cycle back)"
            - "P.final_revenue_cny is null"
            - "count(RevenueDistribution where settlement_period_id == P.id) == 0"
            - "AuditEntry with target_type=SETTLEMENT, action=REVENUE_ADJUST exists"

  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: alarm_ack_to_defect_to_inverter_to_station_status
        grounds:
          - state_machines.AlarmEvent.OPEN_to_ACKNOWLEDGED
          - calculations.station_operational_status
          - entities.Inverter.fields.lifecycle_state
          - entities.Station.fields.operational_status
          - entities.Defect.fields.state
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /pv-ops/alarms/{id}/ack on a CRITICAL alarm:
          (hop 1) AlarmEvent.state OPEN→ACKNOWLEDGED creates a new Defect row (mutation on
          a different entity caused by the ack); (hop 2) that creation triggers Inverter.lifecycle_state
          OPERATING→UNDER_REPAIR (mutation on a third entity, caused by the defect-creation hop, not
          the original ack — because non-CRITICAL alarms create defects without changing inverter
          state); (hop 3) the Inverter mutation triggers Station.operational_status recompute via
          station_operational_status, which can flip OPERATIONAL → DEGRADED → OUT_OF_SERVICE.
          Each link is caused by the previous link, not by the original action directly.
        test_recipe:
          setup:
            - "Station S with 5 Inverters all OPERATING (ratio under_repair/total = 0/5 = 0; status=OPERATIONAL)"
            - "AlarmCodeMap entry mapping vendor='V', model='M', vendor_code='E1' → canonical='INV_FAIL', severity=CRITICAL"
            - "POST /pv-ops/alarms (inverter_id=I_1, vendor_code='E1') → AlarmEvent OPEN, severity=CRITICAL"
          trigger:
            - "POST /pv-ops/alarms/{alarm.id}/ack (actor=O&MEngineer)"
          assert:
            - "AlarmEvent.state == ACKNOWLEDGED   # hop 0 (transition itself)"
            - "exists Defect d with source=ALARM, source_ref_id=alarm.id, subject_type=INVERTER, subject_id=I_1.id, severity in {MAJOR, CRITICAL}   # hop 1"
            - "Inverter I_1.lifecycle_state == UNDER_REPAIR   # hop 2"
            - "Station S.operational_status == OPERATIONAL   # hop 3 — 1/5=0.20 → DEGRADED boundary; assert based on threshold"
            - "# Recompute: ratio = 1/5 = 0.20 which is >= DEGRADED_THRESHOLD (0.20). So expect DEGRADED."
            - "Station S.operational_status == DEGRADED"
      - name: defect_resolve_to_inverter_to_station_status_back
        grounds:
          - state_machines.Defect.UNDER_REPAIR_to_RESOLVED
          - calculations.station_operational_status
          - entities.Inverter.fields.lifecycle_state
          - entities.Station.fields.operational_status
        distinguishing_aspect: |
          Depth-2 cascade from a different originating trigger (work-order completion).
          (hop 1) POST /pv-ops/work-orders/{id}/complete moves WorkOrder to COMPLETED and
          Defect to RESOLVED; the Defect transition itself (hop 1) flips Inverter.lifecycle_state
          UNDER_REPAIR→OPERATING; (hop 2) the Inverter flip triggers
          station_operational_status recompute. The triggering transition differs from the
          alarm-ack chain.
        test_recipe:
          setup:
            - "Continuing from previous setup: Station S, Inverter I_1 UNDER_REPAIR, S.operational_status=DEGRADED"
            - "Defect d UNDER_REPAIR exists; WorkOrder wo IN_PROGRESS with before_metrics={dc_power_kw:10}"
          trigger:
            - "POST /pv-ops/work-orders/{wo.id}/complete with after_metrics={dc_power_kw:40}"
          assert:
            - "WorkOrder.state == COMPLETED   # hop 0"
            - "Defect.state == RESOLVED       # hop 0"
            - "Inverter I_1.lifecycle_state == OPERATING   # hop 1"
            - "Station S.operational_status == OPERATIONAL # hop 2 — ratio back to 0/5 = 0"

  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_workorder_dispatch
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Defect.OPEN_to_DISPATCHED
          - entities.Supplier.fields.lifecycle_state
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_INVALID_STATE) vs business_safety (priority 7,
          ERR_SUPPLIER_BLACKLISTED). POST /pv-ops/defects/{id}/work-orders called on a Defect
          that is already in CLOSED (wrong from-state) AND assigning a BLACKLISTED supplier —
          both checks would fire; priority ordering pins ERR_INVALID_STATE as winner.
        test_recipe:
          setup:
            - "Defect d walked through OPEN→DISPATCHED→UNDER_REPAIR→RESOLVED→CLOSED via valid path"
            - "Supplier B with lifecycle_state=BLACKLISTED"
            - "SparePart S with available stock"
          trigger:
            - "POST /pv-ops/defects/{d.id}/work-orders with assigned_supplier_id=B.id and a valid spare-part line"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'   # priority 6 wins over priority 7 ERR_SUPPLIER_BLACKLISTED"
      - name: business_safety_vs_business_fiscal_on_workorder_creation
        grounds:
          - validations[priority=7]
          - validations[priority=18]
        distinguishing_aspect: |
          Different error-category pair: business_safety (priority 7, ERR_SUPPLIER_BLACKLISTED)
          vs business_fiscal (priority 18, ERR_SPARE_PART_INSUFFICIENT). Both fail simultaneously
          on the same POST /pv-ops/defects/{id}/work-orders call; the safety check must win.
        test_recipe:
          setup:
            - "Supplier B with lifecycle_state=BLACKLISTED"
            - "Defect d OPEN on a station/inverter"
            - "SparePart S with stock_on_hand=0, reserved_qty=0"
          trigger:
            - "POST /pv-ops/defects/{d.id}/work-orders with assigned_supplier_id=B.id and spare_part_lines=[{part_id:S.id, quantity:1}]"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_SUPPLIER_BLACKLISTED'   # priority 7 wins over priority 18 ERR_SPARE_PART_INSUFFICIENT"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spare_part_inclusive_boundary
        grounds:
          - validations[priority=18]
          - entities.SparePart.fields.stock_on_hand
          - entities.SparePart.fields.reserved_qty
        distinguishing_aspect: |
          Numeric threshold: requested quantity vs (stock_on_hand − reserved_qty) using `>=`.
          A request for exactly the available amount succeeds; one more fails. Endpoint:
          POST /pv-ops/defects/{id}/work-orders.
        test_recipe:
          setup:
            - "SparePart S with stock_on_hand=5, reserved_qty=2 (available=3)"
            - "Defect d1 OPEN, Defect d2 OPEN, both on station with ACTIVE supplier"
          trigger:
            - "Request A: POST /pv-ops/defects/{d1.id}/work-orders with spare_part_lines=[{part_id:S.id, quantity:3}]"
            - "Request B (after A): POST /pv-ops/defects/{d2.id}/work-orders with spare_part_lines=[{part_id:S.id, quantity:1}]"
          assert:
            - "Request A returns 201 (3 == available 3, >= boundary inclusive)"
            - "Request B returns 422 ERR_SPARE_PART_INSUFFICIENT (available after A: 5-5=0; 1 > 0)"
      - name: empty_metering_set_on_start_reconciliation
        grounds:
          - validations[priority=11.5]
          - state_machines.SettlementPeriod.DRAFT_to_RECONCILING
          - errors[ERR_NO_METERING_RECORDS]
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint
          (POST /pv-ops/settlement-periods/{id}/start-reconciliation): a settlement period that
          has zero MeteringRecord rows cannot start reconciliation, while one row succeeds. The
          metric is a count of rows, not a numeric threshold — different boundary semantics from
          the inclusive `>=` numeric boundary on spare-part stock.
        test_recipe:
          setup:
            - "SettlementPeriod P_empty in DRAFT with NO MeteringRecord rows; _clock advanced past period_end"
            - "SettlementPeriod P_one in DRAFT with exactly one MeteringRecord on_grid_kwh=10.000 FEED_IN; _clock advanced past period_end"
          trigger:
            - "POST /pv-ops/settlement-periods/{P_empty.id}/start-reconciliation with grid_company_confirmed_kwh=0.000"
            - "POST /pv-ops/settlement-periods/{P_one.id}/start-reconciliation with grid_company_confirmed_kwh=10.000"
          assert:
            - "First call returns 422 with error_id='ERR_NO_METERING_RECORDS'"
            - "Second call returns 200 with P_one.state == RECONCILING"

  # ============================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: subsidy_declaration_depends_on_settlement_period_state
        grounds:
          - validations[priority=10]
          - state_machines.SubsidyDeclaration.DRAFT_to_SUBMITTED
          - entities.SettlementPeriod.fields.state
        distinguishing_aspect: |
          Pair (SubsidyDeclaration, SettlementPeriod): submit of a SubsidyDeclaration is allowed
          only when the referenced SettlementPeriod is in CONFIRMED or INVOICED. The valid set
          of SubsidyDeclaration transitions depends on a different entity's state.
        test_recipe:
          setup:
            - "Station, Policy, SubsidyDeclaration D referencing SettlementPeriod P_draft in DRAFT"
          trigger:
            - "POST /pv-ops/subsidy-declarations/{D.id}/submit"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_SETTLEMENT_NOT_CONFIRMED'"
      - name: defect_close_depends_on_workorder_state
        grounds:
          - state_machines.Defect.UNDER_REPAIR_to_RESOLVED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.WorkOrder.fields.state
        distinguishing_aspect: |
          Different entity pair (Defect, WorkOrder): Defect can only reach RESOLVED via the
          work-order COMPLETE transition. Attempting to drive Defect to RESOLVED without first
          completing the WorkOrder is impossible through any declared endpoint, while a normal
          completion path succeeds.
        test_recipe:
          setup:
            - "Defect d in UNDER_REPAIR with WorkOrder wo IN_PROGRESS"
          trigger:
            - "Attempt 1: POST /pv-ops/defects/{d.id}/close → should fail (state preconditions: requires RESOLVED)"
            - "Attempt 2: POST /pv-ops/work-orders/{wo.id}/complete with after_metrics={x:1}, then POST /pv-ops/defects/{d.id}/close"
          assert:
            - "Attempt 1 returns 409 ERR_INVALID_STATE   # Defect can't close from UNDER_REPAIR — depends on WorkOrder.state"
            - "Attempt 2's complete call drives d.state==RESOLVED, then close returns 200 and d.state==CLOSED"

  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_period_closed_open_overlap_on_station
        grounds:
          - validations[priority=12]
          - entities.SettlementPeriod.fields.period_start
          - entities.SettlementPeriod.fields.period_end
          - concurrency_rules[scenario contains 'settlement']
        distinguishing_aspect: |
          Interval semantics: [period_start, period_end) closed-open on the Station resource.
          Adjacent periods that touch at the boundary (A.period_end == B.period_start) are
          ALLOWED (no overlap); periods that share a single instant inside both intervals are
          REJECTED. Boundary precision sits on the equality of the touching point.
        test_recipe:
          setup:
            - "Station S"
            - "SettlementPeriod A: [2026-01-01, 2026-02-01) confirmed (via the normal walk)"
          trigger:
            - "Request X: POST /pv-ops/stations/{S.id}/settlement-periods with [2026-02-01, 2026-03-01) — adjacent, no overlap"
            - "Request Y: POST /pv-ops/stations/{S.id}/settlement-periods with [2026-01-15, 2026-02-15) — overlaps A"
          assert:
            - "Request X returns 201 (touching boundary is not overlap; closed-open semantics)"
            - "Request Y returns 409 ERR_SETTLEMENT_PERIOD_OVERLAP"
      - name: investor_share_window_overlap_with_capacity_invariant
        grounds:
          - entities.InvestorShare.fields.effective_from
          - entities.InvestorShare.fields.effective_to
          - calculations.revenue_distribution
          - validations[priority=17]
        distinguishing_aspect: |
          Different interval semantics on a different resource (InvestorShare): the geometric
          treatment is aggregate-capacity rather than pairwise-overlap. The constraint is that the
          SUM of basis-points across InvestorShare rows whose (effective_from, effective_to)
          interval intersects the SettlementPeriod window equals 10000. Two halves at 6000+5000
          that fully overlap fail (sum=11000); two halves at 6000+4000 that fully overlap pass
          (sum=10000). The geometry is "sum over intersecting intervals" rather than the
          pairwise-disjoint geometry of SettlementPeriod.
        test_recipe:
          setup:
            - "Station S with SettlementPeriod P [2026-02-01, 2026-03-01), one MeteringRecord on_grid_kwh=10"
            - "InvestorShare X: 'Alpha', 6000 bp, effective_from=2026-01-01, effective_to=null"
            - "InvestorShare Y: 'Beta',  5000 bp, effective_from=2026-01-01, effective_to=null (sum=11000)"
            - "Reconciliation tolerance satisfied (grid_company_confirmed_kwh=10.000)"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/start-reconciliation, then POST /pv-ops/settlement-periods/{P.id}/confirm"
          assert:
            - "Confirm returns 422 ERR_INVESTOR_SHARES_INVALID (aggregate-overlap sum=11000 != 10000)"
            - "After PATCH Beta to 4000 bp (sum=10000), retry confirm returns 200"

  # ============================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: spare_part_reservation_zero_drift
        grounds:
          - state_machines.Defect.OPEN_to_DISPATCHED
          - state_machines.Defect.DISPATCHED_to_OPEN
          - entities.SparePart.fields.stock_on_hand
          - entities.SparePart.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity: SparePart.stock_on_hand and SparePart.reserved_qty. Forward action
          POST /pv-ops/defects/{id}/work-orders reserves qty units; compensating action
          POST /pv-ops/work-orders/{id}/cancel releases exactly qty units. The invariant pinned:
          (stock_on_hand_after, reserved_qty_after) == (stock_on_hand_before, reserved_qty_before)
          across the forward+compensating pair. Inventory units are the conserved quantity.
        test_recipe:
          setup:
            - "SparePart S0 with stock_on_hand=10, reserved_qty=0"
            - "Defect d OPEN on Station+Inverter"
            - "Capture (stock_before=10, reserved_before=0)"
          trigger:
            - "POST /pv-ops/defects/{d.id}/work-orders with spare_part_lines=[{part_id:S0.id, quantity:3}]"
            - "POST /pv-ops/work-orders/{wo.id}/cancel"
          assert:
            - "After dispatch: SparePart.stock_on_hand == 10 and SparePart.reserved_qty == 3"
            - "After cancel: SparePart.stock_on_hand == 10 and SparePart.reserved_qty == 0"
            - "Defect.state transitions OPEN -> DISPATCHED -> OPEN"
            - "Invariant: stock_on_hand + reserved_qty net change == 0 across forward+compensating pair"
      - name: revenue_distribution_sum_invariant
        grounds:
          - state_machines.SettlementPeriod.RECONCILING_to_CONFIRMED
          - state_machines.SettlementPeriod.CONFIRMED_to_RECONCILING
          - calculations.revenue_distribution
          - entities.RevenueDistribution.fields.amount_cny
          - entities.SettlementPeriod.fields.final_revenue_cny
        distinguishing_aspect: |
          Different conserved quantity (monetary CNY rather than inventory units). Forward action:
          POST /pv-ops/settlement-periods/{id}/confirm creates RevenueDistribution rows whose sum
          MUST equal final_revenue_cny exactly. Compensating action:
          POST /pv-ops/settlement-periods/{id}/revenue-adjust deletes all rows and nulls
          final_revenue_cny — leaving the invariant trivially true (0 == null treated as 0). The
          conserved quantity is Σ amount_cny relative to final_revenue_cny — a CNY-denominated
          ledger invariant, structurally different from the integer inventory invariant above.
        test_recipe:
          setup:
            - "Station with two InvestorShares 'Alpha' 6000 bp / 'Beta' 4000 bp, both effective_from=2026-01-01"
            - "SettlementPeriod P: [2026-02-01, 2026-03-01), one MeteringRecord FEED_IN on_grid_kwh=200.000, tariff=0.50, grid_company_confirmed_kwh=200.000"
          trigger:
            - "POST /pv-ops/settlement-periods/{P.id}/start-reconciliation, then /confirm"
            - "POST /pv-ops/settlement-periods/{P.id}/revenue-adjust with reason='audit'"
          assert:
            - "After confirm: P.final_revenue_cny == 100.00   # 200*0.50, per-line round"
            - "After confirm: sum(RevenueDistribution.amount_cny for P) == 100.00 (Alpha 60.00 + Beta 40.00)"
            - "After revenue-adjust: P.final_revenue_cny is null AND count(RevenueDistribution for P) == 0"
            - "Σ amount_cny across surviving rows (=0) matches final_revenue_cny (treated as 0/null) — invariant preserved"
