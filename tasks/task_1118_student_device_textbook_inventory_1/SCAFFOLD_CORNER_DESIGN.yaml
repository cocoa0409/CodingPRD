      - name: selector_uses_created_at_not_id_for_tiebreak
        claim_type: selector_determinism
        grounds: [calculations.loaner_pool_allocation]
        distinguishing_aspect: "When two loaners tie on (condition_grade, months_in_service), the selector picks by AssetUnit.created_at ASC, NOT by id"
