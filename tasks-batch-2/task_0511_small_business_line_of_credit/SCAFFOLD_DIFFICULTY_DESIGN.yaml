      - name: draw_at_exact_available_credit_boundary_succeeds
        grounds:
          - validations[priority=17]
          - calculations.outstanding_principal
          - errors[ERR_LIMIT_EXCEEDED]
          - entities.CreditLine.fields.available_credit_cents
        distinguishing_aspect: |
          Metric = available_credit_cents on the draw endpoint. A draw of principal_cents
          EXACTLY equal to available_credit_cents (1000000 on a fresh 1000000 line) succeeds
          (<= boundary is allowed); a draw of available_credit_cents + 1 would fail with
          ERR_LIMIT_EXCEEDED.
