          - entities.PollingPlace.fields.assigned_registered_voters
        distinguishing_aspect: "A DIFFERENT conserved quantity (registered voters across polling places): moving precinct PR from PP1 to PP2 leaves PP1.assigned + PP2.assigned == PR.registered_voters (340) unchanged; PP1 returns to 0 with no drift."
