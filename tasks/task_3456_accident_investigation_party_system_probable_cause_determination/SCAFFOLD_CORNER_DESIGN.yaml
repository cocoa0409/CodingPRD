              payload: { investigation_id: "${inv_id}", room_id: "room-9", window_start_utc: "2026-09-20T09:00:00Z", window_end_utc: "2026-09-20T10:00:00Z", sitting_member_ids: ["iic-1", "bm-1", "bm-2"] }
              as: BoardAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SOD_IIC_ON_BOARD"
            - "GET /board-meetings?investigation_id=${inv_id} returns 0 rows"

      - name: transcript_report_without_recorder_reference_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - entities.FactualReport.fields.recorder_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Conditional required field: a RECORDER_TRANSCRIPT report without recorder_id is a 400 ERR_INVALID_REQUEST, while a GROUP_FACTUAL report must NOT carry one — the same endpoint validates both directions of the conditional."
        test_recipe:
          setup:
            - "Base chain through FACTUAL with one seated group."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
          trigger:
            - call: "POST /groups/${grp_id}/factual-reports"
              payload: { report_kind: "RECORDER_TRANSCRIPT", content: "CVR transcript excerpt." }
              as: GroupChairman
              as_user_id: "gc-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /groups/${grp_id} shows factual_reports == [] (nothing persisted)"

      - name: transcript_verify_blocked_until_readout_complete
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_RECORDER_READOUT_INCOMPLETE
          - state_machines.FactualReport.SUBMITTED_to_VERIFIED
        distinguishing_aspect: "Recorder data protection on the verify path: a RECORDER_TRANSCRIPT report whose recorder still has a future readout session cannot be verified — premature disclosure is blocked before the factual record ever reaches the docket."
        test_recipe:
          setup:
            - "Base chain through FACTUAL; one CVR with a readout session ending 2026-09-03T12:00:00Z (in the future); a transcript report referencing it."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "CVR", condition: "INTACT" }
              as: RecorderCustodian
              captures: { cvr2_id: $.data.id }
            - call: "POST /recorders/${cvr2_id}/readout-sessions"
              payload: { bench_id: "bench-2", window_start_utc: "2026-09-03T10:00:00Z", window_end_utc: "2026-09-03T12:00:00Z" }
              as: RecorderCustodian
            - call: "POST /groups/${grp_id}/factual-reports"
              payload: { report_kind: "RECORDER_TRANSCRIPT", content: "CVR transcript excerpt.", recorder_id: "${cvr2_id}" }
              as: GroupChairman
              as_user_id: "gc-1"
              captures: { trpt_id: $.data.factual_reports.0.report_id }
          trigger:
            - call: "POST /groups/${grp_id}/factual-reports/${trpt_id}/verify"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RECORDER_READOUT_INCOMPLETE"
            - "GET /groups/${grp_id} shows the transcript report still SUBMITTED"

      - name: duplicate_seat_designation_and_report_number_conflicts
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_SEAT
          - errors.ERR_DUPLICATE_DESIGNATION
          - errors.ERR_DUPLICATE_REPORT_NUMBER
        distinguishing_aspect: "Three uniqueness scopes in one sweep: report_number is globally unique; (investigation_id, organization_id) is unique among ACTIVE designations; (designation, group) is unique among SEATED seats — each repeats returns its own 409."
        test_recipe:
          setup:
            - "Base chain through ON_SCENE with one designation already seated."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
          trigger:
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0001", category: "RAIL", occurred_at: "2026-08-30T01:00:00Z", location_state: "OH", fatalities_count: 0, injuries_count: 2, damage_estimate_cents: 250000, is_public_transport: true }
              as: DutyOfficer
              captures: { err_dup_case: $.data.error_id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${org_id}" }
              as: PartyCoordinator
              captures: { err_dup_dsg: $.data.error_id }
            - call: "POST /party-designations/${dsg_id}/seats"
              payload: { group_id: "${grp_id}" }
              as: IIC
              as_user_id: "iic-1"
              captures: { err_dup_seat: $.data.error_id }
          assert:
            - "err_dup_case == ERR_DUPLICATE_REPORT_NUMBER (409)"
            - "err_dup_dsg == ERR_DUPLICATE_DESIGNATION (409)"
            - "err_dup_seat == ERR_DUPLICATE_SEAT (409)"
            - "GET /party-designations?investigation_id=${inv_id} still returns exactly 1 row"

      - name: quorum_boundary_three_sits_two_fails
        claim_type: Violation → Error
        grounds:
          - errors.ERR_QUORUM_NOT_MET
          - entities.BoardMeeting.fields.sitting_member_ids
        distinguishing_aspect: "Aggregate validation boundary: two distinct sitting members fail with 422 ERR_QUORUM_NOT_MET while exactly three succeed — the quorum constant 3 is inclusive at the lower bound."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
          trigger:
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-4", window_start_utc: "2026-09-22T09:00:00Z", window_end_utc: "2026-09-22T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2"] }
              as: BoardAdmin
              captures: { err_quorum: $.data.error_id }
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-4", window_start_utc: "2026-09-22T09:00:00Z", window_end_utc: "2026-09-22T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg3_id: $.data.id }
          assert:
            - "the two-member request returns 422 and err_quorum == ERR_QUORUM_NOT_MET"
            - "the three-member request returns 201 — quorum of exactly 3 satisfies the gate"
            - "GET /board-meetings?investigation_id=${inv_id} returns exactly 1 row"

      - name: close_unacceptable_requires_streak_of_two
        claim_type: Violation → Error
        grounds:
          - errors.ERR_UNACCEPTABLE_STREAK_INSUFFICIENT
          - state_machines.SafetyRecommendation.OPEN_UNACCEPTABLE_to_CLOSED_UNACCEPTABLE
        distinguishing_aspect: "Aggregate-over-history gate: CLOSED_UNACCEPTABLE with unacceptable_streak 1 is refused; only after a second response is also classified UNACCEPTABLE (streak 2) does the close succeed — and the CLOSED state then rejects further responses (terminal lockdown)."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS with one recommendation issued to the operator."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_rec
          trigger:
            - call: "POST /safety-recommendations/${rec_id}/responses"
              payload: { response_text: "We disagree with the finding." }
              as: AddresseeContact
              as_user_id: "${org_id}"
            - call: "POST /safety-recommendations/${rec_id}/classify"
              payload: { classification: "UNACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
            - call: "POST /safety-recommendations/${rec_id}/close"
              payload: { outcome: "CLOSED_UNACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { err_streak: $.data.error_id }
            - call: "POST /safety-recommendations/${rec_id}/responses"
              payload: { response_text: "We still decline to act." }
              as: AddresseeContact
              as_user_id: "${org_id}"
            - call: "POST /safety-recommendations/${rec_id}/classify"
              payload: { classification: "UNACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
            - call: "POST /safety-recommendations/${rec_id}/close"
              payload: { outcome: "CLOSED_UNACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
            - call: "POST /safety-recommendations/${rec_id}/responses"
              payload: { response_text: "Late change of heart." }
              as: AddresseeContact
              as_user_id: "${org_id}"
              captures: { err_closed: $.data.error_id }
          assert:
            - "the first close returns 422 and err_streak == ERR_UNACCEPTABLE_STREAK_INSUFFICIENT (streak was 1)"
            - "after the second UNACCEPTABLE classification, unacceptable_streak == 2 and the close returns 200 with status CLOSED_UNACCEPTABLE"
            - "a response on the closed recommendation returns 409 and err_closed == ERR_RECOMMENDATION_STATE_INVALID"

      - name: launch_threshold_gate_at_adoption
        claim_type: Violation → Error
        grounds:
