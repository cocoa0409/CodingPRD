      - name: five_drill_lifecycle_ids_across_two_drills_and_three_revision_laps
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_DRILL_TIMESTAMP_OUT_OF_RANGE (400), ERR_DRILL_PARTICIPANTS_INSUFFICIENT (422),
          ERR_DRILL_NOT_ABANDONABLE (409), ERR_INVALIDATION_REASON_REQUIRED (422) and
          ERR_DRILL_REVISION_LIMIT_REACHED (409); §1.2 CesareanReadinessDrill (shape
          cyclic_with_revert, DOCUMENTED edge preconditions in order timestamps -> participant composition
          -> revision_count < DRILL_REVISION_LIMIT 2, ABANDONED edge declared only from
          SCHEDULED|IN_PROGRESS, INVALIDATED edge requiring a 10..500 char reason); §1.4 carve-out (f) of
          the priority-8 note; §1.3 cesarean_readiness_derivation (a unit loses READY the instant its only
          current drill is invalidated).
        distinguishing_aspect: |
          The revision loop is walked to its exact bound: revision_count 0 -> 1 -> 2, then the fourth
          document is 409 while status stays INVALIDATED, so an off-by-one that allows a third revision or
          forbids the second is caught. The three DOCUMENTED preconditions are separated in their declared
          order on the same drill-A call sequence (a backwards incision is 400 even though the participant
          roster is also illegal). Abandon is probed twice on statuses that are both undeclared for that
          edge - once terminal (ABANDONED) and once VALIDATED - and both answer the specific
          ERR_DRILL_NOT_ABANDONABLE rather than the generic ERR_INVALID_STATE_TRANSITION. Readiness is
          sampled on both sides of the invalidate, proving currency is revocable and that participant
          drill_currency_state falls back to LAPSED.
