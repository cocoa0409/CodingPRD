  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: impairment_finalize_gated_on_case_tdr_status
        grounds:
          - state_machines.ImpairmentAssessment.DRAFT_to_FINALIZED
