            - "Visit.${v2}.admission_status == CANCELLED; Guardian.${g2}.credits_held == 0 and credits_available == 8 (hold released, not consumed)"
            - "Visit.${v3}.admission_status == EVACUATED and final_charge_cents == 300 (round_half_up(0.5 * 30min*20c = 600))"
            - "Guardian.${g1}.points_balance == 200, Guardian.${g2}.points_balance == 200, Guardian.${g3}.points_balance == 200 (compensation ADJUSTMENT per affected guardian)"

      - name: party_cancel_cascade_to_loyalty_reversal
        grounds:
          - state_machines.PartyBooking.CONFIRMED_to_CANCELLED
          - state_machines.CafeOrder.PLACED_to_CANCELLED
          - entities.LoyaltyTransaction.fields.kind
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (party cancel, not slot
          close): booking CANCELLED with 50% deposit refund at T-3d -> linked
          PLACED cafe order CANCELLED -> its redeemed 300 points restored via
          a REVERSAL transaction, recomputing the guardian's points_balance.
        test_recipe:
          setup:
            - "CONFIRMED STD weekday booking (start 2026-06-08T10:00Z, total 30000, deposit 6000); guardian balance 400 after +400 seed and a linked PLACED order redeeming 300; clock at 2026-06-05T08:00Z (T-3d => 50% refund tier)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G Eight", email: "g8@x.com", phone: "888" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T10:00:00Z", child_count: 10, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id } }
            - { call: "POST /party-bookings/${pb}/confirm", payload: {}, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/loyalty-adjustments", payload: { points: 400, note: "seed" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 2 } ], child_ids: [], party_booking_id: "${pb}", points_to_redeem: 300 }, as: Guardian, as_user_id: "${g}", captures: { o: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T08:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /party-bookings/${pb}/cancel", payload: {}, as: Guardian, as_user_id: "${g}", captures: { pb_st: $.data.status, rf: $.data.refund_cents } }
            - { call: "GET /cafe-orders/${o}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { o_st: $.data.status } }
            - { call: "GET /guardians/${g}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { bal: $.data.points_balance } }
          assert:
            - "PartyBooking.${pb}.status == CANCELLED and refund_cents == 3000 (50% of 6000 deposit at T-3d)"
            - "CafeOrder.${o}.status == CANCELLED (cascade hop 2)"
            - "Guardian.${g}.points_balance == 400 (400 - 300 REDEEM + 300 REVERSAL; hop 3)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_state_beats_waiver_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WAIVER_INVALID]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a check-in that would
          fail both (visit already CANCELLED; guardian waiver EXPIRED) MUST
          return ERR_INVALID_STATE because priority 4 precedes priority 5.
        test_recipe:
          setup:
            - "visit v1 RESERVED then cancelled by staff; guardian waiver signed 2026-06-01, expired by clock advance to 2027-06-02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G Nine", email: "g9@x.com", phone: "999" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "POST /visits/${v1}/cancel", payload: {}, as: FrontDesk, as_user_id: "${fd}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T10:00:00Z" }, as: Admin }
