            - { call: "POST /grants/appeals", payload: { application_id: "${appD}", grounds_code: ELIGIBILITY_DETERMINATION_ERROR, statement: "My residency began before the stated date." }, as: Artist, as_user_id: "${artD}", captures: { ap5: "$.data.id" } }
            - { call: "POST /grants/appeals/${ap5}/screen", payload: {}, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap5}/decide", payload: { decision: UPHOLD, remedy_code: RESCORE_BY_NEW_PANEL }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap5}/decide", payload: { decision: UPHOLD, remedy_code: REINSTATE_ELIGIBILITY }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "GET /grants/discipline-categories/${tdisc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${appD}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The reads return eligible_application_count 0, then 1, then 2, then 2 again after the INELIGIBLE determination"
            - "The INELIGIBLE determination stamped notified_at \"2026-10-16T00:00:00.000Z\" and ineligibility_reason_code \"RESIDENCY_DURATION\" with residency_months_at_deadline 23"
            - "RESCORE_BY_NEW_PANEL returns 409 ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS for ELIGIBILITY_DETERMINATION_ERROR"
            - "REINSTATE_ELIGIBILITY returns 200 with status \"UPHELD\"; the final read shows eligible_application_count 3"
            - "The application reads status \"ELIGIBLE\" with ineligibility_reason_code null and assigned_panel_id null"

      - name: six_level_cascade_from_one_conflict_screening
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / blocking_conflict_cascades_six_levels_to_slot_and_cycle_posture
          rationale: "That §1.8 instance walks the full review -> application -> slot -> panel -> cycle -> posture chain from a single screening and asserts each level."

      - name: both_composite_variants_on_one_review_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / composite_score_provisional_mean_vs_final_trimmed_mean
          rationale: "The named §1.8 instance reads the provisional and the final variant off the same five reviews and asserts the delta."

  # ===========================================================================
  # SECTION: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: board_approval_response_already_carries_every_derived_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /grants/recommendation-slots/{recommendation_slot_id}/board-action]
        distinguishing_aspect: |
          The declared consistency model is immediate, so the approval's own
          response body must already show BOARD_APPROVED with
          awarded_amount_cents 1500000, and the reads that follow in the same test
          must show the fully reconciled ledger — cycle committed_cents 1627500,
          discipline committed_cents 1500000, artist active_award_count 1 and a
          discoverable Award — with no second call or delay needed.
        test_recipe:
          setup:
            - "CornerMain slate submitted with one PROPOSED slot and the cycle version captured"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
          trigger:
            - *n_approve
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/${disc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/artists/${art}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/awards", payload: { application_id: "${app}" }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The approval response itself reads status \"BOARD_APPROVED\", awarded_amount_cents 1500000 and board_action_by \"board-1\""
            - "The cycle read shows funded_total_cents 1500000, admin_assessment_rate 0.085, admin_assessment_cents 127500, committed_cents 1627500, available_cents 4072500 and posture \"OPEN\""
            - "The artist read shows active_award_count 1"
            - "The award list returns total_count 1 with status \"OFFERED\", payment_status \"UNPAID\", reporting_status \"NOT_DUE\", gross_amount_cents 1500000 and acceptance_deadline_at \"2026-10-30T00:00:00.000Z\""
