scenario: |
  Generate task harder than expert level!

  2729. Direct-to-Consumer Mattress Trial & Return Logistics (Casper): in-home trial period with
  minimum break-in window before returns, return pickup routing and donation-versus-recycle
  disposition, refund proration and promotional bundle unwind, comfort exchange to a different
  firmness with price differences, delivery damage and compression-recovery complaints, retail
  partner sales attribution and price-match policy, warranty claims on indentation depth with
  photographic evidence, fraud controls on repeat trial abuse
domain_name: dtc-mattress-trial-returns
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is a top-level path
  # (/trial-orders, /return-cases, /pickup-appointments). No nested ownership URLs.

  state_machine_shape: parallel
  # TrialOrder carries two independent axes (fulfillment_status x trial_status) that advance
  # on different triggers; ReturnCase carries (logistics_status x financial_status) and forks
  # at disposition; QualityClaim and AttributionClaim are cyclic evidence/revision loops.

  relationship_patterns:
    - one_to_many          # Customer -> TrialOrder, TrialOrder -> QualityClaim, PickupRoute -> PickupAppointment
    - self_referential     # TrialOrder.exchanged_from_order_id, RefundAuthorization.supersedes_refund_id
    - cross_aggregate      # RefundAuthorization reads ReturnCase + DispositionAssignment + QualityClaim state

  role_model: segregation_of_duties
  # A RefundAuthorization may not be released by the same FinanceController operator id that
  # authorized it; catalog/logistics/finance surfaces are otherwise peer-owned.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the Expert band of SKILL.md 0.4: 15 entities, 50 endpoints, 8 calculations,
  # 10 state machines, 3 OCC races. Density is carried by the refund ledger, which reads five other
  # entities, and by the two-variant proration/abuse-score pairs.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Customers."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
      - name: household_hash
        type: string
        source: input
        description: "Opaque hash of shipping address + surname used as the household fraud key. Two Customers sharing a household_hash belong to the same household."
        constraints: "non-empty; NOT unique"
      - name: status
        type: enum
        source: computed
        description: "Fraud posture recomputed from abuse_score_rolling on every TrialAbuseSignal append."
        default: ACTIVE
        constraints: "one of {ACTIVE, TRIAL_RESTRICTED, BLOCKED}"
      - name: lifetime_trial_count
        type: integer
        source: computed
        description: "Count of TrialOrder rows with this customer_id whose fulfillment_status has ever reached DELIVERED."
        default: 0
      - name: completed_return_count
        type: integer
        source: computed
        description: "Count of ReturnCase rows on this customer's orders whose logistics_status reached PICKED_UP."
        default: 0
      - name: abuse_score_rolling
        type: integer
        source: computed
        description: "Rolling-window variant of calculations.abuse_score (see 1.3); the value the status gate reads."
        default: 0
        constraints: "0..100"
      - name: abuse_score_lifetime
        type: integer
        source: computed
        description: "Lifetime variant of calculations.abuse_score (no decay, no window); reported but never used as a gate."
        default: 0
        constraints: "0..100"
      - name: trial_block_until
        type: datetime
        source: computed
        description: "Logical-clock instant until which new TrialOrders are refused; set when abuse_score_rolling first reaches ABUSE_BLOCK_THRESHOLD, else null."
        default: null
      - name: signal_count
        type: integer
        source: computed
        description: "Number of TrialAbuseSignal rows with this customer_id."
        default: 0

  - name: MattressModel
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog SKU; unique."
        constraints: "unique; non-empty"
      - name: name
        type: string
        source: input
        description: "Marketing name."
      - name: firmness
        type: enum
        source: input
        description: "Comfort level the model ships at; comfort exchanges move a customer between firmness values."
        constraints: "one of {SOFT, MEDIUM, FIRM}"
      - name: size
        type: enum
        source: input
        description: "Bed size; drives the logistics unit weight of a pickup (see calculations.pickup_units)."
        constraints: "one of {TWIN, QUEEN, KING}"
      - name: list_price_cents
        type: integer
        source: input
        description: "Catalog price in cents; the reference price for comfort-exchange price differences."
        constraints: "> 0"
      - name: break_in_nights
        type: integer
        source: input
        description: "Minimum nights that must elapse after delivery before a return or comfort exchange may be requested."
        default: 21
        constraints: ">= 0"
      - name: trial_nights
        type: integer
        source: input
        description: "Total in-home trial length in nights, counted from delivered_at."
        default: 100
        constraints: "> break_in_nights"
      - name: indentation_warranty_threshold_mm
        type: number
        source: input
        description: "Minimum measured body impression in millimetres for a WARRANTY_INDENTATION claim to be actionable."
        default: 25
        constraints: "> 0"
      - name: warranty_years
        type: integer
        source: input
        description: "Warranty term in years; coverage decays one step per completed ownership year."
        default: 10
        constraints: "> 0"
      - name: donation_eligible
        type: boolean
        source: input
        description: "False for models whose construction bars charitable resale (recycle-only)."
        default: true

  - name: PromotionBundle
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Promotion code; unique."
        constraints: "unique; non-empty"
      - name: accessory_retail_cents
        type: integer
        source: input
        description: "Retail value of the free accessory shipped with the bundle (pillow/protector)."
        default: 0
        constraints: ">= 0"
      - name: percent_off_bps
        type: integer
        source: input
        description: "Discount applied to the mattress at purchase, in basis points of gross_price_cents."
        default: 0
        constraints: "0..5000"
      - name: gift_card_cents
        type: integer
        source: input
        description: "Face value of a gift card issued at purchase."
        default: 0
        constraints: ">= 0"
      - name: unwind_policy
        type: enum
        source: input
        description: "How the bundle is clawed back when the mattress is returned."
        constraints: "one of {DEDUCT_RETAIL, DEDUCT_PRORATED, FORFEIT_NONE}"
      - name: requires_accessory_return
        type: boolean
        source: input
        description: "When true, the accessory component of the unwind is waived if the accessory comes back with the mattress."
        default: false

  - name: RetailPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Partner storefront name."
      - name: region_code
        type: string
        source: input
        description: "Two-letter region the partner sells in."
        constraints: "non-empty"
      - name: commission_bps
        type: integer
        source: input
        description: "Attribution commission in basis points of the order's paid_amount_cents."
        constraints: "0..3000"
      - name: price_match_policy
        type: enum
        source: input
        description: "Which price-match rule applies to this partner's PRICE_MATCH claims."
        constraints: "one of {MATCH_TO_LOWEST, MATCH_TO_ADVERTISED, NO_MATCH}"
      - name: attribution_window_days
        type: integer
        source: input
        description: "Days after delivered_at during which a SALES_ATTRIBUTION or PRICE_MATCH claim may be submitted."
        default: 30
        constraints: "> 0"
      - name: status
        type: enum
        source: input
        description: "Partner standing set at onboarding; SUSPENDED partners cannot submit claims."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: TrialOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the trialling household member."
      - name: model_id
        type: string
        source: input
        description: "FK -> MattressModel.id; the delivered model."
      - name: bundle_id
        type: string
        source: input
        description: "FK -> PromotionBundle.id; nullable when the order carries no promotion."
        default: null
      - name: retail_partner_id
        type: string
        source: input
        description: "FK -> RetailPartner.id; nullable, required when channel == RETAIL_PARTNER."
        default: null
      - name: exchanged_from_order_id
        type: string
        source: system
        description: "FK -> TrialOrder.id; nullable self-reference to the predecessor order when this order was minted by a comfort exchange or a damage replacement."
        default: null
      - name: channel
        type: enum
        source: input
        description: "Sales channel of record."
        constraints: "one of {DTC, RETAIL_PARTNER}"
      - name: gross_price_cents
        type: integer
        source: input
        description: "Pre-promotion price actually quoted to the customer."
        constraints: "> 0"
      - name: bundle_discount_cents
        type: integer
        source: computed
        description: "Percent-off portion of the bundle applied at purchase; see calculations.order_pricing."
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "gross_price_cents - bundle_discount_cents; the refundable principal."
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Physical-logistics axis of the order; advances on dispatch/deliver and on QualityClaim + ComfortExchange side effects."
        default: CREATED
        constraints: "one of {CREATED, IN_TRANSIT, DELIVERED, DAMAGED_REPORTED, REPLACED, CLOSED}"
      - name: trial_status
        type: enum
        source: computed
        description: "Trial-clock axis of the order; advances independently of fulfillment_status."
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, BREAK_IN, TRIAL_ACTIVE, TRIAL_EXPIRED, RETURN_REQUESTED, RETURNED, KEPT, EXCHANGED}"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant stamped by POST /trial-orders/{id}/deliver; null before delivery."
        default: null
      - name: break_in_ends_at
        type: datetime
        source: computed
        description: "delivered_at + MattressModel.break_in_nights days; null before delivery."
        default: null
      - name: trial_ends_at
        type: datetime
        source: computed
        description: "delivered_at + MattressModel.trial_nights days; null before delivery."
        default: null
      - name: nights_slept
        type: integer
        source: computed
        description: "Whole days elapsed from delivered_at to the earlier of the logical clock and the order's freeze instant (pickup completion or keep); null before delivery."
        default: null
      - name: exchange_chain_depth
        type: integer
        source: computed
        description: "0 for an order created directly; predecessor.exchange_chain_depth + 1 when minted through exchanged_from_order_id."
        default: 0
      - name: goodwill_credit_cents
        type: integer
        source: computed
        description: "Cumulative settled QualityClaim credit posted against this order."
        default: 0
      - name: price_match_credit_cents
        type: integer
        source: computed
        description: "Cumulative approved AttributionClaim price-match credit posted against this order."
        default: 0
      - name: refunded_total_cents
        type: integer
        source: computed
        description: "Sum of net_refund_cents over RefundAuthorization rows on this order with status == RELEASED."
        default: 0
      - name: outstanding_refundable_cents
        type: integer
        source: computed
        description: "Principal still eligible to be refunded; paid_amount_cents while no refund is RELEASED, 0 once one is."
      - name: retained_amount_cents
        type: integer
        source: computed
        description: "Principal the business keeps after a released refund; 0 while nothing is RELEASED."
        default: 0

  - name: ReturnCase
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> TrialOrder.id; the order being returned."
      - name: reason_code
        type: enum
        source: input
        description: "Customer-stated reason; DAMAGE cases skip the break-in gate."
        constraints: "one of {COMFORT, DAMAGE, PRICE, OTHER}"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant the return was opened."
      - name: logistics_status
        type: enum
        source: computed
        description: "Physical axis: pickup scheduling, collection, inspection, disposition."
        default: REQUESTED
        constraints: "one of {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED, CANCELLED}"
      - name: financial_status
        type: enum
        source: computed
        description: "Money axis: advances only through RefundAuthorization side effects, independently of logistics_status."
        default: PENDING
        constraints: "one of {PENDING, AUTHORIZED, RELEASED, VOID}"
      - name: picked_up_at
        type: datetime
        source: system
        description: "Logical-clock instant the pickup appointment closed with outcome COMPLETED; null otherwise."
        default: null
      - name: nights_used
        type: integer
        source: computed
        description: "floor((picked_up_at - TrialOrder.delivered_at) / 86400 seconds); the proration basis for both refund variants; null before pickup."
        default: null
      - name: condition_grade
        type: enum
        source: input
        description: "Inspector grade captured by POST /return-cases/{id}/inspect; null before inspection."
        default: null
        constraints: "one of {A, B, C, D}"
      - name: soil_flag
        type: boolean
        source: input
        description: "Inspector soiling finding captured at inspection."
        default: false
      - name: accessory_returned
        type: boolean
        source: input
        description: "Whether the bundle accessory came back with the mattress; captured at inspection."
        default: false
      - name: disposition
        type: enum
        source: computed
        description: "Outcome branch chosen at POST /return-cases/{id}/disposition; PENDING until then."
        default: PENDING
        constraints: "one of {PENDING, DONATION, RECYCLE}"
      - name: proration_deduction_cents
        type: integer
        source: computed
        description: "Usage retention withheld from the refund; the value differs between the PROVISIONAL and FINAL variants of calculations.refund_settlement."
        default: null
      - name: bundle_unwind_cents
        type: integer
        source: computed
        description: "Promotional claw-back withheld from the refund; see calculations.bundle_unwind."
        default: null
      - name: damage_offset_cents
        type: integer
        source: computed
        description: "Condition/soiling offset withheld from the refund; see calculations.damage_offset."
        default: null
      - name: provisional_refund_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant net refund, stamped at inspection."
        default: null
      - name: final_refund_cents
        type: integer
        source: computed
        description: "FINAL variant net refund, stamped when a RefundAuthorization is created; may differ from provisional_refund_cents on identical inputs."
        default: null

  - name: PickupRoute
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Region the route serves; must equal the disposition partner's region_code for a partner to be eligible."
        constraints: "non-empty"
      - name: route_date
        type: string
        source: input
        description: "Service date as YYYY-MM-DD; every appointment slot must fall inside the route window on this date."
        constraints: "ISO date"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the route service window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the route service window."
        constraints: "> window_start_at"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory drive buffer that must separate two appointment slots on this route."
        default: 30
        constraints: ">= 0"
      - name: capacity_units
        type: integer
        source: input
        description: "Total logistics units the truck can collect on this route."
        constraints: "> 0"
      - name: booked_units
        type: integer
        source: computed
        description: "Sum of units over PickupAppointment rows on this route with status IN {BOOKED, COMPLETED}."
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: "capacity_units - booked_units; the conserved-capacity counterpart of booked_units."
      - name: status
        type: enum
        source: computed
        description: "DRAFT until published; appointments may only be booked on a PUBLISHED route."
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED}"

  - name: PickupAppointment
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> PickupRoute.id; the route holding this slot."
      - name: return_case_id
        type: string
        source: input
        description: "FK -> ReturnCase.id; the return being collected."
      - name: slot_start_at
        type: datetime
        source: input
        description: "Inclusive start of the collection slot."
      - name: slot_end_at
        type: datetime
        source: input
        description: "Exclusive end of the collection slot."
        constraints: "> slot_start_at"
      - name: units
        type: integer
        source: computed
        description: "Logistics units consumed on the route, derived from the model size of the returned order; see calculations.pickup_units."
      - name: status
        type: enum
        source: computed
        description: "Slot lifecycle."
        default: BOOKED
        constraints: "one of {BOOKED, COMPLETED, MISSED, CANCELLED}"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the slot was closed as COMPLETED or MISSED; null while BOOKED or CANCELLED."
        default: null

  - name: DispositionPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Charity or recycler name."
      - name: partner_type
        type: enum
        source: input
        description: "CHARITY partners receive DONATION dispositions; RECYCLER partners receive RECYCLE dispositions."
        constraints: "one of {CHARITY, RECYCLER}"
      - name: region_code
        type: string
        source: input
        description: "Region served; must match the pickup route's region_code to be eligible."
        constraints: "non-empty"
      - name: daily_intake_capacity_units
        type: integer
        source: input
        description: "Maximum units the partner accepts per calendar intake_date."
        constraints: "> 0"
      - name: accepts_condition_grades
        type: array
        source: input
        description: "Condition grades the partner will accept, e.g. [A, B]."
        constraints: "non-empty subset of {A, B, C, D}"
      - name: soil_policy
        type: enum
        source: input
        description: "Whether the partner accepts a soiled unit."
        constraints: "one of {REJECT_SOILED, ACCEPT_SOILED}"
      - name: priority_rank
        type: integer
        source: input
        description: "Primary ranking key of the disposition selector; lower wins."
        constraints: ">= 1"
      - name: recycle_fee_cents_per_unit
        type: integer
        source: input
        description: "Per-unit fee charged by a RECYCLER; charities charge 0."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "Only ACTIVE partners enter the disposition candidate set."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: DispositionAssignment
    parent: null
    common_fields: true
    fields:
      - name: return_case_id
        type: string
        source: input
        description: "FK -> ReturnCase.id; the inspected return being dispositioned."
      - name: partner_id
        type: string
        source: system
        description: "FK -> DispositionPartner.id; chosen by the selector in calculations.disposition_partner_selection, never supplied by the caller."
      - name: intake_date
        type: string
        source: input
        description: "Calendar day the unit is delivered to the partner, YYYY-MM-DD; the aggregate capacity bucket key."
        constraints: "ISO date"
      - name: disposition_type
        type: enum
        source: computed
        description: "DONATION when the selected partner is a CHARITY, RECYCLE when it is a RECYCLER."
        constraints: "one of {DONATION, RECYCLE}"
      - name: units
        type: integer
        source: computed
        description: "Same unit count as the pickup appointment for this return case."
      - name: fee_cents
        type: integer
        source: computed
        description: "units * DispositionPartner.recycle_fee_cents_per_unit at assignment time."
        default: 0
      - name: fallback_applied
        type: boolean
        source: computed
        description: "True when DONATION was requested but the waterfall fell through to a RECYCLER."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Intake lifecycle."
        default: ASSIGNED
        constraints: "one of {ASSIGNED, DELIVERED, REJECTED}"

  - name: RefundAuthorization
    parent: null
    common_fields: true
    fields:
      - name: return_case_id
        type: string
        source: input
        description: "FK -> ReturnCase.id; the return this refund settles."
      - name: order_id
        type: string
        source: system
        description: "FK -> TrialOrder.id; copied from the return case at creation."
      - name: supersedes_refund_id
        type: string
        source: input
        description: "FK -> RefundAuthorization.id; nullable self-reference to the VOIDED authorization this one replaces."
        default: null
      - name: gross_refundable_cents
        type: integer
        source: computed
        description: "TrialOrder.paid_amount_cents at authorization time."
      - name: proration_deduction_cents
        type: integer
        source: computed
        description: "FINAL-variant usage retention copied onto the ledger row."
      - name: bundle_unwind_cents
        type: integer
        source: computed
        description: "Promotional claw-back copied onto the ledger row."
      - name: damage_offset_cents
        type: integer
        source: computed
        description: "Condition offset copied onto the ledger row."
      - name: net_refund_cents
        type: integer
        source: computed
        description: "gross_refundable_cents - proration_deduction_cents - bundle_unwind_cents - damage_offset_cents; must be > 0 to authorize."
      - name: authorized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceController that created this authorization."
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceController that released it; must differ from authorized_by_user_id."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of release; null until RELEASED."
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant of void; null unless VOIDED."
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Operator-supplied justification captured by POST /refund-authorizations/{id}/void; null until the row is voided."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Ledger row lifecycle."
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, RELEASED, VOIDED}"

  - name: ComfortExchange
    parent: null
    common_fields: true
    fields:
      - name: original_order_id
        type: string
        source: input
        description: "FK -> TrialOrder.id; the order the customer wants to swap out."
      - name: target_model_id
        type: string
        source: input
        description: "FK -> MattressModel.id; the requested replacement model."
      - name: replacement_order_id
        type: string
        source: system
        description: "FK -> TrialOrder.id; nullable until approval mints the replacement order."
        default: null
      - name: sequence_number
        type: integer
        source: computed
        description: "original_order.exchange_chain_depth + 1; the 1-based position of this exchange in the chain."
      - name: raw_price_difference_cents
        type: integer
        source: computed
        description: "target_model.list_price_cents - original_model.list_price_cents; may be negative."
      - name: exchange_fee_cents
        type: integer
        source: computed
        description: "Escalating handling fee keyed on sequence_number; see calculations.exchange_settlement."
      - name: tier_credit_cents
        type: integer
        source: computed
        description: "Loyalty credit keyed on the tier of abs(raw_price_difference_cents), evaluated before the fee is added."
      - name: price_difference_cents
        type: integer
        source: computed
        description: "raw_price_difference_cents + exchange_fee_cents - tier_credit_cents; positive means the customer owes money."
      - name: settlement_direction
        type: enum
        source: computed
        description: "CHARGE_CUSTOMER when price_difference_cents > 0, CREDIT_CUSTOMER when < 0, EVEN when exactly 0."
        constraints: "one of {CHARGE_CUSTOMER, CREDIT_CUSTOMER, EVEN}"
      - name: status
        type: enum
        source: computed
        description: "Exchange lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DECLINED}"
      - name: decline_note
        type: string
        source: input
        description: "Free-text note recorded when an agent declines."
        default: null

  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> TrialOrder.id; the order complained about."
      - name: claim_type
        type: enum
        source: input
        description: "SHIPPING_DAMAGE (delivery damage), COMPRESSION_RECOVERY (mattress has not decompressed), WARRANTY_INDENTATION (body impression after keeping)."
        constraints: "one of {SHIPPING_DAMAGE, COMPRESSION_RECOVERY, WARRANTY_INDENTATION}"
      - name: photo_evidence_count
        type: integer
        source: input
        description: "Number of photographs attached in the current evidence round."
        constraints: ">= 0"
      - name: measurement_method
        type: enum
        source: input
        description: "How the indentation was measured; required for WARRANTY_INDENTATION, null otherwise."
        default: null
        constraints: "one of {STRAIGHTEDGE_PHOTO, LASER_SCAN}"
      - name: measured_indentation_mm
        type: number
        source: input
        description: "Reported body-impression depth in millimetres; required for WARRANTY_INDENTATION, null otherwise."
        default: null
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim was filed."
      - name: evidence_round_count
        type: integer
        source: computed
        description: "Number of completed evidence submissions after the initial filing; incremented by each submit-evidence call."
        default: 0
      - name: ownership_years
        type: integer
        source: computed
        description: "floor((reported_at - TrialOrder.delivered_at) / 365 days); null for non-warranty claims."
        default: null
      - name: coverage_bps
        type: integer
        source: computed
        description: "Warranty coverage remaining in basis points after per-year decay; null for non-warranty claims."
        default: null
      - name: credit_cents
        type: integer
        source: computed
        description: "Credit granted at adjudication; 0 unless resolution == CREDIT."
        default: 0
      - name: resolution
        type: enum
        source: computed
        description: "Adjudication branch."
        default: PENDING
        constraints: "one of {PENDING, REPLACEMENT, CREDIT, DENIED}"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; cycles between SUBMITTED and EVIDENCE_REQUESTED until adjudicated."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, EVIDENCE_REQUESTED, APPROVED, DENIED, SETTLED, WITHDRAWN}"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TrialSupportAgent that adjudicated; null before adjudication."
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceController that posted the credit; null before settlement."
        default: null

  - name: AttributionClaim
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> RetailPartner.id; the claiming partner."
      - name: order_id
        type: string
        source: input
        description: "FK -> TrialOrder.id; the order being claimed."
      - name: claim_type
        type: enum
        source: input
        description: "SALES_ATTRIBUTION claims commission; PRICE_MATCH claims a customer credit against a competitor price."
        constraints: "one of {SALES_ATTRIBUTION, PRICE_MATCH}"
      - name: competitor_price_cents
        type: integer
        source: input
        description: "Advertised competitor price; required for PRICE_MATCH, null otherwise."
        default: null
        constraints: "> 0"
      - name: evidence_url_count
        type: integer
        source: input
        description: "Number of evidence links attached in the current round."
        constraints: ">= 0"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submission or resubmission."
      - name: revision_round_count
        type: integer
        source: computed
        description: "Number of completed REVISION_REQUESTED -> SUBMITTED loops."
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: "Commission granted on approval of a SALES_ATTRIBUTION claim; 0 otherwise."
        default: 0
      - name: price_match_credit_cents
        type: integer
        source: computed
        description: "Customer credit granted on approval of a PRICE_MATCH claim; 0 otherwise."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; cycles SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of APPROVED/REJECTED; null before resolution."
        default: null

  - name: TrialAbuseSignal
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer the signal is recorded against."
      - name: signal_type
        type: enum
        source: input
        description: "REPEAT_RETURN (a return completed pickup), HOUSEHOLD_MATCH (another household member already trialled), SHORT_TRIAL (returned within SHORT_TRIAL_NIGHTS of delivery), MULTI_CHANNEL (same household bought through both DTC and a retail partner)."
        constraints: "one of {REPEAT_RETURN, HOUSEHOLD_MATCH, SHORT_TRIAL, MULTI_CHANNEL}"
      - name: recorded_at
        type: datetime
        source: input
        description: "Logical-clock instant the signal is dated; defaults to the current logical clock when omitted. Decay is measured from this field, never from created_at."
        default: null
      - name: weight
        type: integer
        source: computed
        description: "Undecayed weight from calculations.abuse_score constants, keyed on signal_type."
      - name: source_note
        type: string
        source: input
        description: "Free-text provenance note."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# TrialOrder and ReturnCase each carry TWO independent dimensions that advance on
# different triggers; each dimension is declared as its own block with a `dimension:` key.
# ---------------------------------------------------------------------------
state_machines:
  - entity: TrialOrder
    dimension: fulfillment_status
    initial_state: CREATED
    terminal_states: [REPLACED, CLOSED]
    transitions:
      - from: CREATED
        to: IN_TRANSIT
        trigger: "POST /trial-orders/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "fulfillment_status == CREATED"
        side_effects:
          - "increments TrialOrder.version by 1"
        note: "trial_status stays NOT_STARTED — the two axes are independent."
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /trial-orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "fulfillment_status == IN_TRANSIT"
        side_effects:
          - "sets TrialOrder.delivered_at = current logical clock"
          - "computes TrialOrder.break_in_ends_at = delivered_at + MattressModel.break_in_nights days"
          - "computes TrialOrder.trial_ends_at = delivered_at + MattressModel.trial_nights days"
          - "advances the trial_status dimension NOT_STARTED -> BREAK_IN"
          - "increments Customer.lifetime_trial_count by 1"
          - "appends a TrialAbuseSignal with signal_type HOUSEHOLD_MATCH when another Customer sharing this customer's household_hash already has a TrialOrder whose fulfillment_status reached DELIVERED, then recomputes Customer.abuse_score_rolling / abuse_score_lifetime / status"
          - "appends a TrialAbuseSignal with signal_type MULTI_CHANNEL when the same household_hash already has a DELIVERED order whose channel differs from this order's channel, then recomputes the same three Customer fields"
          - "increments TrialOrder.version by 1"
      - from: DELIVERED
        to: DAMAGED_REPORTED
        trigger: "POST /quality-claims (claim_type IN {SHIPPING_DAMAGE, COMPRESSION_RECOVERY})"
        actor: Customer
        preconditions:
          - "fulfillment_status == DELIVERED"
        side_effects:
          - "increments TrialOrder.version by 1"
        note: "claim_type == WARRANTY_INDENTATION does NOT touch this dimension (the order is already CLOSED)."
      - from: DAMAGED_REPORTED
        to: DELIVERED
        trigger: "POST /quality-claims/{id}/adjudicate (resolution IN {CREDIT, DENIED}) or cascade from POST /comfort-exchanges/{id}/approve withdrawing the claim"
        actor: TrialSupportAgent
        preconditions:
          - "fulfillment_status == DAMAGED_REPORTED"
          - "no other QualityClaim on this order has status IN {SUBMITTED, EVIDENCE_REQUESTED}"
        side_effects:
          - "increments TrialOrder.version by 1"
        note: "Revert edge — this dimension is cyclic (DELIVERED -> DAMAGED_REPORTED -> DELIVERED)."
      - from: DAMAGED_REPORTED
        to: REPLACED
        trigger: "POST /quality-claims/{id}/adjudicate (resolution == REPLACEMENT), or POST /comfort-exchanges/{id}/approve while a COMPRESSION_RECOVERY QualityClaim on this order is still open"
        actor: TrialSupportAgent
        preconditions:
          - "fulfillment_status == DAMAGED_REPORTED"
          - "on the comfort-exchange path: trial_status == TRIAL_ACTIVE"
        side_effects:
          - "creates a replacement TrialOrder (fulfillment_status CREATED, trial_status NOT_STARTED, bundle_id null, exchanged_from_order_id = this order, exchange_chain_depth = this order's depth + 1; on the quality-claim path model_id is unchanged and gross_price_cents is copied from this order, on the comfort-exchange path model_id = ComfortExchange.target_model_id and gross_price_cents = that target MattressModel.list_price_cents)"
          - "on the comfort-exchange path: every COMPRESSION_RECOVERY QualityClaim on this order with status IN {SUBMITTED, EVIDENCE_REQUESTED} moves to WITHDRAWN"
          - "advances this order's trial_status dimension to EXCHANGED"
          - "increments TrialOrder.version by 1"
        note: "An open compression complaint does not block a comfort exchange - approving the exchange is itself the remedy, so the complaint is withdrawn rather than adjudicated."
      - from: DELIVERED
        to: REPLACED
        trigger: "POST /comfort-exchanges/{id}/approve"
        actor: TrialSupportAgent
        preconditions:
          - "fulfillment_status == DELIVERED"
          - "trial_status == TRIAL_ACTIVE"
        side_effects:
          - "see the ComfortExchange REQUESTED -> APPROVED transition for the full three-hop cascade"
          - "increments TrialOrder.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /pickup-appointments/{id}/complete (outcome == COMPLETED) cascade, or POST /trial-orders/{id}/keep"
        actor: system
        preconditions:
          - "fulfillment_status == DELIVERED"
        side_effects:
          - "freezes TrialOrder.nights_slept (at ReturnCase.nights_used on a pickup, at floor((clock - delivered_at)/86400) on a keep)"
          - "increments TrialOrder.version by 1"
      - from: DAMAGED_REPORTED
        to: CLOSED
        trigger: "POST /pickup-appointments/{id}/complete (outcome == COMPLETED) cascade, or POST /trial-orders/{id}/keep"
        actor: system
        preconditions:
          - "fulfillment_status == DAMAGED_REPORTED"
        side_effects:
          - "freezes TrialOrder.nights_slept exactly as on the DELIVERED -> CLOSED edge"
          - "increments TrialOrder.version by 1"
        note: "The unit is physically collected even while a quality complaint is unresolved; the open claim then blocks POST /refund-authorizations via validations[priority=36] instead of blocking the pickup."

  - entity: TrialOrder
    dimension: trial_status
    initial_state: NOT_STARTED
    terminal_states: [RETURNED, KEPT, EXCHANGED]
    transitions:
      - from: NOT_STARTED
        to: BREAK_IN
        trigger: "POST /trial-orders/{id}/deliver (same call that moves fulfillment_status to DELIVERED)"
        actor: LogisticsCoordinator
        preconditions:
          - "delivered_at was null"
        side_effects:
          - "the break-in and trial windows begin"
      - from: BREAK_IN
        to: TRIAL_ACTIVE
        trigger: "system lazy clock evaluation on any request that loads this TrialOrder (GET /trial-orders/{id}, GET /trial-orders, or any endpoint whose validation reads the order)"
        actor: system
        preconditions:
          - "current logical clock >= break_in_ends_at"
        side_effects:
          - "no other field changes; version is NOT incremented by a lazy re-derivation"
        note: "Boundary is inclusive: at exactly break_in_ends_at the order is already TRIAL_ACTIVE."
      - from: TRIAL_ACTIVE
        to: TRIAL_EXPIRED
        trigger: "system lazy clock evaluation on any request that loads this TrialOrder"
        actor: system
        preconditions:
          - "current logical clock >= trial_ends_at"
        side_effects:
          - "no other field changes; version is NOT incremented by a lazy re-derivation"
      - from: TRIAL_ACTIVE
        to: RETURN_REQUESTED
        trigger: "POST /return-cases"
        actor: Customer
        preconditions:
          - "no ReturnCase on this order has logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
        side_effects:
          - "creates the ReturnCase in logistics_status REQUESTED / financial_status PENDING"
          - "increments TrialOrder.version by 1"
      - from: BREAK_IN
        to: RETURN_REQUESTED
        trigger: "POST /return-cases (reason_code == DAMAGE only)"
        actor: Customer
        preconditions:
          - "reason_code == DAMAGE"
          - "an existing QualityClaim on this order has claim_type == SHIPPING_DAMAGE and status IN {SUBMITTED, EVIDENCE_REQUESTED, APPROVED}"
        side_effects:
          - "creates the ReturnCase in logistics_status REQUESTED / financial_status PENDING"
          - "increments TrialOrder.version by 1"
        note: "The only path that bypasses the break-in window; every other reason_code is rejected with ERR_BREAK_IN_NOT_ELAPSED."
      - from: RETURN_REQUESTED
        to: TRIAL_ACTIVE
        trigger: "POST /return-cases/{id}/cancel"
        actor: Customer
        preconditions:
          - "the ReturnCase logistics_status IN {REQUESTED, PICKUP_SCHEDULED}"
          - "current logical clock < trial_ends_at"
        side_effects:
          - "increments TrialOrder.version by 1"
        note: "Cycle: TRIAL_ACTIVE -> RETURN_REQUESTED -> TRIAL_ACTIVE. When the clock has passed trial_ends_at the order lands in TRIAL_EXPIRED instead."
      - from: RETURN_REQUESTED
        to: TRIAL_EXPIRED
        trigger: "POST /return-cases/{id}/cancel"
        actor: Customer
        preconditions:
          - "the ReturnCase logistics_status IN {REQUESTED, PICKUP_SCHEDULED}"
          - "current logical clock >= trial_ends_at"
        side_effects:
          - "increments TrialOrder.version by 1"
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /pickup-appointments/{id}/complete (outcome == COMPLETED) — cascade hop 2"
        actor: system
        preconditions:
          - "the linked ReturnCase just entered logistics_status PICKED_UP"
        side_effects:
          - "sets fulfillment_status to CLOSED on the same call"
          - "freezes nights_slept at ReturnCase.nights_used"
          - "because this order entered RETURNED: increments Customer.completed_return_count by 1 and appends a TrialAbuseSignal (REPEAT_RETURN when Customer.completed_return_count was >= 1 before the increment; additionally SHORT_TRIAL when ReturnCase.nights_used < SHORT_TRIAL_NIGHTS) — cascade hop 3"
          - "because a TrialAbuseSignal was appended: recomputes Customer.abuse_score_rolling / abuse_score_lifetime and re-derives Customer.status, setting trial_block_until = clock + ABUSE_BLOCK_DAYS days when abuse_score_rolling >= ABUSE_BLOCK_THRESHOLD — cascade hop 4"
          - "increments TrialOrder.version by 1"
      - from: TRIAL_ACTIVE
        to: KEPT
        trigger: "POST /trial-orders/{id}/keep"
        actor: Customer
        preconditions:
          - "trial_status IN {BREAK_IN, TRIAL_ACTIVE, TRIAL_EXPIRED}"
          - "no ReturnCase on this order has logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
        side_effects:
          - "sets fulfillment_status to CLOSED"
          - "freezes nights_slept at floor((clock - delivered_at) / 86400 seconds)"
          - "increments TrialOrder.version by 1"
        note: "Also reachable from BREAK_IN and TRIAL_EXPIRED with identical side effects."
      - from: TRIAL_EXPIRED
        to: KEPT
        trigger: "POST /trial-orders/{id}/keep"
        actor: Customer
        preconditions:
          - "no ReturnCase on this order has logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
        side_effects:
          - "sets fulfillment_status to CLOSED"
          - "freezes nights_slept"
          - "increments TrialOrder.version by 1"
      - from: BREAK_IN
        to: KEPT
        trigger: "POST /trial-orders/{id}/keep"
        actor: Customer
        preconditions:
          - "no ReturnCase on this order has logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
        side_effects:
          - "sets fulfillment_status to CLOSED"
          - "freezes nights_slept"
          - "increments TrialOrder.version by 1"
      - from: TRIAL_ACTIVE
        to: EXCHANGED
        trigger: "POST /comfort-exchanges/{id}/approve, or POST /quality-claims/{id}/adjudicate (resolution == REPLACEMENT)"
        actor: TrialSupportAgent
        preconditions:
          - "no ReturnCase on this order has logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
        side_effects:
          - "see ComfortExchange REQUESTED -> APPROVED for the cascade"
      - from: BREAK_IN
        to: EXCHANGED
        trigger: "POST /quality-claims/{id}/adjudicate (resolution == REPLACEMENT)"
        actor: TrialSupportAgent
        preconditions:
          - "fulfillment_status == DAMAGED_REPORTED"
        side_effects:
          - "mints the replacement TrialOrder and sets this order's fulfillment_status to REPLACED"

  - entity: ReturnCase
    dimension: logistics_status
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: PICKUP_SCHEDULED
        trigger: "POST /pickup-appointments"
        actor: LogisticsCoordinator
        preconditions:
          - "logistics_status == REQUESTED"
          - "PickupRoute.status == PUBLISHED"
          - "PickupRoute.region_code is the region of the appointment being booked"
        side_effects:
          - "creates the PickupAppointment in status BOOKED"
          - "adds PickupAppointment.units to PickupRoute.booked_units and re-derives PickupRoute.available_units"
          - "increments PickupRoute.version by 1"
          - "increments ReturnCase.version by 1"
      - from: PICKUP_SCHEDULED
        to: REQUESTED
        trigger: "POST /pickup-appointments/{id}/cancel, or POST /pickup-appointments/{id}/complete with outcome == MISSED"
        actor: LogisticsCoordinator
        preconditions:
          - "the PickupAppointment status == BOOKED"
        side_effects:
          - "subtracts PickupAppointment.units from PickupRoute.booked_units and re-derives PickupRoute.available_units so capacity_units == booked_units + available_units still holds"
          - "increments PickupRoute.version by 1"
          - "increments ReturnCase.version by 1"
        note: "Cycle: REQUESTED -> PICKUP_SCHEDULED -> REQUESTED; the return may be rebooked on any PUBLISHED route."
      - from: PICKUP_SCHEDULED
        to: PICKED_UP
        trigger: "POST /pickup-appointments/{id}/complete (outcome == COMPLETED) — cascade hop 1"
        actor: LogisticsCoordinator
        preconditions:
          - "the PickupAppointment status == BOOKED"
        side_effects:
          - "sets ReturnCase.picked_up_at = current logical clock"
          - "computes ReturnCase.nights_used = floor((picked_up_at - TrialOrder.delivered_at) / 86400 seconds)"
          - "because this ReturnCase entered PICKED_UP: advances TrialOrder.trial_status RETURN_REQUESTED -> RETURNED and fulfillment_status DELIVERED -> CLOSED (cascade hop 2, which itself triggers hops 3 and 4 on Customer)"
          - "increments ReturnCase.version by 1"
      - from: PICKED_UP
        to: INSPECTED
        trigger: "POST /return-cases/{id}/inspect"
        actor: LogisticsCoordinator
        preconditions:
          - "logistics_status == PICKED_UP"
        side_effects:
          - "stores condition_grade, soil_flag, accessory_returned"
          - "computes ReturnCase.bundle_unwind_cents (calculations.bundle_unwind), damage_offset_cents (calculations.damage_offset), proration_deduction_cents and provisional_refund_cents using the PROVISIONAL variant of calculations.refund_settlement"
          - "increments ReturnCase.version by 1"
      - from: INSPECTED
        to: DISPOSITIONED
        trigger: "POST /return-cases/{id}/disposition"
        actor: LogisticsCoordinator
        preconditions:
          - "logistics_status == INSPECTED"
          - "disposition == PENDING"
        side_effects:
          - "runs calculations.disposition_partner_selection and creates a DispositionAssignment in status ASSIGNED"
          - "sets ReturnCase.disposition to DONATION or RECYCLE from the selected partner's partner_type"
          - "increments ReturnCase.version by 1"
        note: "Branch point: the DONATION and RECYCLE arms produce different DispositionAssignment.fee_cents and different partner pools."
      - from: DISPOSITIONED
        to: INSPECTED
        trigger: "POST /disposition-assignments/{id}/confirm-intake (outcome == REJECTED)"
        actor: LogisticsCoordinator
        preconditions:
          - "the DispositionAssignment status == ASSIGNED"
        side_effects:
          - "sets DispositionAssignment.status = REJECTED and frees its units from the partner's intake_date bucket"
          - "resets ReturnCase.disposition to PENDING so a different partner can be selected"
          - "increments ReturnCase.version by 1"
        note: "Cycle: INSPECTED -> DISPOSITIONED -> INSPECTED."
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /return-cases/{id}/cancel"
        actor: Customer
        preconditions:
          - "logistics_status IN {REQUESTED, PICKUP_SCHEDULED}"
          - "financial_status == PENDING"
        side_effects:
          - "reverts TrialOrder.trial_status RETURN_REQUESTED -> TRIAL_ACTIVE (or TRIAL_EXPIRED when the clock has passed trial_ends_at)"
          - "increments ReturnCase.version by 1"
      - from: PICKUP_SCHEDULED
        to: CANCELLED
        trigger: "POST /return-cases/{id}/cancel"
        actor: Customer
        preconditions:
          - "financial_status == PENDING"
        side_effects:
          - "sets the linked BOOKED PickupAppointment to CANCELLED and returns its units to PickupRoute.available_units"
          - "increments PickupRoute.version by 1"
          - "reverts TrialOrder.trial_status RETURN_REQUESTED -> TRIAL_ACTIVE (or TRIAL_EXPIRED)"
          - "increments ReturnCase.version by 1"

  - entity: ReturnCase
    dimension: financial_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /refund-authorizations"
        actor: FinanceController
        preconditions:
          - "logistics_status == DISPOSITIONED"
          - "the linked DispositionAssignment.status == DELIVERED"
          - "no QualityClaim on the order has status IN {SUBMITTED, EVIDENCE_REQUESTED}"
        side_effects:
          - "creates the RefundAuthorization in status AUTHORIZED with the FINAL variant amounts"
          - "stamps ReturnCase.final_refund_cents and overwrites proration_deduction_cents with the FINAL-variant value"
          - "increments ReturnCase.version by 1"
      - from: AUTHORIZED
        to: RELEASED
        trigger: "POST /refund-authorizations/{id}/release"
        actor: FinanceController
        preconditions:
          - "the RefundAuthorization status == AUTHORIZED"
          - "X-User-ID differs from RefundAuthorization.authorized_by_user_id"
        side_effects:
          - "because the authorization entered RELEASED: TrialOrder.refunded_total_cents += net_refund_cents, outstanding_refundable_cents = 0, retained_amount_cents = paid_amount_cents - refunded_total_cents (cascade hop 2)"
          - "increments ReturnCase.version by 1"
      - from: AUTHORIZED
        to: VOID
        trigger: "POST /refund-authorizations/{id}/void"
        actor: FinanceController
        preconditions:
          - "the RefundAuthorization status == AUTHORIZED"
        side_effects:
          - "increments ReturnCase.version by 1"
      - from: RELEASED
        to: VOID
        trigger: "POST /refund-authorizations/{id}/void"
        actor: FinanceController
        preconditions:
          - "the RefundAuthorization status == RELEASED"
        side_effects:
          - "compensation: TrialOrder.refunded_total_cents -= net_refund_cents, outstanding_refundable_cents = paid_amount_cents - refunded_total_cents, retained_amount_cents = 0 when refunded_total_cents reaches 0"
          - "increments ReturnCase.version by 1"
      - from: VOID
        to: AUTHORIZED
        trigger: "POST /refund-authorizations (with supersedes_refund_id pointing at the VOIDED row)"
        actor: FinanceController
        preconditions:
          - "the superseded RefundAuthorization status == VOIDED"
          - "logistics_status == DISPOSITIONED"
        side_effects:
          - "creates a new RefundAuthorization recomputed against current state"
          - "increments ReturnCase.version by 1"
        note: "Cycle: PENDING -> AUTHORIZED -> VOID -> AUTHORIZED. This supersede path is what makes POST /refund-authorizations a true OCC race (see 1.2.1)."

  - entity: PickupRoute
    dimension: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pickup-routes/{id}/publish"
        actor: LogisticsCoordinator
        preconditions:
          - "status == DRAFT"
          - "window_end_at > window_start_at"
        side_effects:
          - "increments PickupRoute.version by 1"
        note: "Appointments may only be booked on a PUBLISHED route (cross-entity guard for PickupAppointment)."

  - entity: PickupAppointment
    dimension: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /pickup-appointments/{id}/complete (outcome == COMPLETED)"
        actor: LogisticsCoordinator
        preconditions:
          - "status == BOOKED"
          - "PickupRoute.status == PUBLISHED"
        side_effects:
          - "sets closed_at = current logical clock"
          - "PickupRoute.booked_units is unchanged (a COMPLETED slot still consumes capacity)"
          - "drives the four-hop cascade described on ReturnCase.logistics_status PICKUP_SCHEDULED -> PICKED_UP"
          - "increments PickupRoute.version by 1"
          - "increments PickupAppointment.version by 1"
      - from: BOOKED
        to: MISSED
        trigger: "POST /pickup-appointments/{id}/complete (outcome == MISSED)"
        actor: LogisticsCoordinator
        preconditions:
          - "status == BOOKED"
        side_effects:
          - "sets closed_at = current logical clock"
          - "subtracts units from PickupRoute.booked_units, restoring available_units"
          - "reverts ReturnCase.logistics_status PICKUP_SCHEDULED -> REQUESTED"
          - "increments PickupRoute.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /pickup-appointments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "status == BOOKED"
        side_effects:
          - "subtracts units from PickupRoute.booked_units, restoring available_units (capacity_units == booked_units + available_units invariant)"
          - "reverts ReturnCase.logistics_status PICKUP_SCHEDULED -> REQUESTED"
          - "increments PickupRoute.version by 1"

  - entity: DispositionAssignment
    dimension: status
    initial_state: ASSIGNED
    terminal_states: [DELIVERED, REJECTED]
    transitions:
      - from: ASSIGNED
        to: DELIVERED
        trigger: "POST /disposition-assignments/{id}/confirm-intake (outcome == DELIVERED)"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "the partner's intake_date bucket keeps these units permanently"
          - "unblocks POST /refund-authorizations for the linked ReturnCase"
      - from: ASSIGNED
        to: REJECTED
        trigger: "POST /disposition-assignments/{id}/confirm-intake (outcome == REJECTED)"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "frees the units from the partner's intake_date bucket (conserved-quantity compensation)"
          - "reverts ReturnCase.logistics_status DISPOSITIONED -> INSPECTED and disposition -> PENDING"

  - entity: RefundAuthorization
    dimension: status
    initial_state: AUTHORIZED
    terminal_states: [VOIDED]
    transitions:
      - from: AUTHORIZED
        to: RELEASED
        trigger: "POST /refund-authorizations/{id}/release"
        actor: FinanceController
        preconditions:
          - "status == AUTHORIZED"
          - "X-User-ID != authorized_by_user_id (segregation of duties)"
        side_effects:
          - "sets released_by_user_id = X-User-ID and released_at = current logical clock"
          - "because this row entered RELEASED: TrialOrder.refunded_total_cents += net_refund_cents, TrialOrder.outstanding_refundable_cents = 0, TrialOrder.retained_amount_cents = paid_amount_cents - refunded_total_cents"
          - "because TrialOrder.refunded_total_cents became > 0: ReturnCase.financial_status AUTHORIZED -> RELEASED"
          - "increments RefundAuthorization.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /refund-authorizations/{id}/void"
        actor: FinanceController
        preconditions:
          - "status == AUTHORIZED"
        side_effects:
          - "sets voided_at = current logical clock"
          - "ReturnCase.financial_status -> VOID; no money moved, so TrialOrder ledger fields are untouched"
      - from: RELEASED
        to: VOIDED
        trigger: "POST /refund-authorizations/{id}/void"
        actor: FinanceController
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "sets voided_at = current logical clock"
          - "compensating action: TrialOrder.refunded_total_cents -= net_refund_cents, outstanding_refundable_cents = paid_amount_cents - refunded_total_cents, retained_amount_cents = 0 when refunded_total_cents == 0"
          - "ReturnCase.financial_status RELEASED -> VOID"
          - "invariant preserved: TrialOrder.paid_amount_cents == refunded_total_cents + outstanding_refundable_cents + retained_amount_cents"

  - entity: ComfortExchange
    dimension: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /comfort-exchanges/{id}/approve"
        actor: TrialSupportAgent
        preconditions:
          - "status == REQUESTED"
          - "original TrialOrder.fulfillment_status IN {DELIVERED, DAMAGED_REPORTED}"
          - "original TrialOrder.trial_status == TRIAL_ACTIVE"
          - "expected_trial_order_version matches the original TrialOrder.version"
          - "Customer.status != BLOCKED"
        side_effects:
          - "cascade hop 1: creates the replacement TrialOrder (model_id = target_model_id, gross_price_cents = target MattressModel.list_price_cents, bundle_id null, channel and retail_partner_id copied from the original, exchanged_from_order_id = original_order_id, exchange_chain_depth = original.exchange_chain_depth + 1, fulfillment_status CREATED, trial_status NOT_STARTED) and stores its id in replacement_order_id"
          - "cascade hop 2: because a replacement order now exists, the original TrialOrder moves trial_status TRIAL_ACTIVE -> EXCHANGED and fulfillment_status -> REPLACED (from DELIVERED, or from DAMAGED_REPORTED when a compression complaint is still open)"
          - "cascade hop 3: because the original order entered EXCHANGED, every QualityClaim on it with claim_type == COMPRESSION_RECOVERY and status IN {SUBMITTED, EVIDENCE_REQUESTED} is set to WITHDRAWN with resolution DENIED"
          - "increments TrialOrder.version by 1 on the original order"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /comfort-exchanges/{id}/decline"
        actor: TrialSupportAgent
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "stores decline_note; the original TrialOrder is untouched, so the customer may request another exchange"

  - entity: QualityClaim
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: EVIDENCE_REQUESTED
        trigger: "POST /quality-claims/{id}/request-evidence"
        actor: TrialSupportAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments QualityClaim.version by 1"
      - from: EVIDENCE_REQUESTED
        to: SUBMITTED
        trigger: "POST /quality-claims/{id}/submit-evidence"
        actor: Customer
        preconditions:
          - "status == EVIDENCE_REQUESTED"
          - "evidence_round_count < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "replaces photo_evidence_count (and measured_indentation_mm for WARRANTY_INDENTATION) with the newly submitted values"
          - "increments evidence_round_count by 1"
        note: "Cycle: SUBMITTED -> EVIDENCE_REQUESTED -> SUBMITTED, bounded by MAX_EVIDENCE_ROUNDS."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /quality-claims/{id}/adjudicate (resolution IN {REPLACEMENT, CREDIT})"
        actor: TrialSupportAgent
        preconditions:
          - "status == SUBMITTED"
          - "photo_evidence_count >= the minimum for this claim_type / measurement_method (calculations.quality_claim_credit)"
          - "for WARRANTY_INDENTATION: measured_indentation_mm >= MattressModel.indentation_warranty_threshold_mm"
          - "resolution == REPLACEMENT requires claim_type IN {SHIPPING_DAMAGE, COMPRESSION_RECOVERY}"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and resolution to the requested branch"
          - "resolution == CREDIT: computes credit_cents from calculations.quality_claim_credit and reverts TrialOrder.fulfillment_status DAMAGED_REPORTED -> DELIVERED; when the order has already reached CLOSED or REPLACED the fulfillment dimension is left untouched"
          - "resolution == REPLACEMENT: mints a replacement TrialOrder and moves the original to fulfillment_status REPLACED / trial_status EXCHANGED"
          - "increments QualityClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /quality-claims/{id}/adjudicate (resolution == DENIED)"
        actor: TrialSupportAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets approved_by_user_id = X-User-ID, resolution DENIED, credit_cents 0"
          - "reverts TrialOrder.fulfillment_status DAMAGED_REPORTED -> DELIVERED only when the order is still in DAMAGED_REPORTED; a CLOSED or REPLACED order keeps its fulfillment_status"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /quality-claims/{id}/settle"
        actor: FinanceController
        preconditions:
          - "status == APPROVED"
          - "resolution == CREDIT"
          - "X-User-ID != approved_by_user_id (segregation of duties)"
        side_effects:
          - "sets settled_by_user_id = X-User-ID"
          - "adds credit_cents to TrialOrder.goodwill_credit_cents"
          - "increments QualityClaim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "cascade from POST /comfort-exchanges/{id}/approve (claim_type == COMPRESSION_RECOVERY)"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, EVIDENCE_REQUESTED}"
          - "claim_type == COMPRESSION_RECOVERY"
          - "the order this claim belongs to just entered trial_status EXCHANGED"
        side_effects:
          - "sets resolution DENIED and credit_cents 0"
      - from: EVIDENCE_REQUESTED
        to: WITHDRAWN
        trigger: "cascade from POST /comfort-exchanges/{id}/approve (claim_type == COMPRESSION_RECOVERY)"
        actor: system
        preconditions:
          - "claim_type == COMPRESSION_RECOVERY"
        side_effects:
          - "sets resolution DENIED and credit_cents 0"

  - entity: AttributionClaim
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /attribution-claims/{id}/review (action == ACCEPT_FOR_REVIEW)"
        actor: FinanceController
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments AttributionClaim.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /attribution-claims/{id}/review (action == REQUEST_REVISION)"
        actor: FinanceController
        preconditions:
          - "status == UNDER_REVIEW"
          - "revision_round_count < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments AttributionClaim.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /attribution-claims/{id}/resubmit"
        actor: RetailPartner
        preconditions:
          - "status == REVISION_REQUESTED"
          - "revision_round_count < MAX_REVISION_ROUNDS"
        side_effects:
          - "replaces evidence_url_count and competitor_price_cents with the resubmitted values"
          - "increments revision_round_count by 1 and re-stamps submitted_at from the logical clock"
        note: "Cycle: SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED, bounded by MAX_REVISION_ROUNDS."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /attribution-claims/{id}/resolve (decision == APPROVE)"
        actor: FinanceController
        preconditions:
          - "status == UNDER_REVIEW"
          - "submitted_at - TrialOrder.delivered_at <= RetailPartner.attribution_window_days days"
          - "claim_type == PRICE_MATCH requires RetailPartner.price_match_policy != NO_MATCH"
        side_effects:
          - "sets resolved_at = current logical clock"
          - "claim_type == SALES_ATTRIBUTION: computes commission_cents from calculations.attribution_settlement"
          - "claim_type == PRICE_MATCH: computes price_match_credit_cents and adds it to TrialOrder.price_match_credit_cents"
          - "increments AttributionClaim.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /attribution-claims/{id}/resolve (decision == REJECT)"
        actor: FinanceController
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "sets resolved_at = current logical clock; commission_cents and price_match_credit_cents stay 0"

  - entity: Customer
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: TRIAL_RESTRICTED
        trigger: "system re-derivation after any TrialAbuseSignal append (POST /trial-abuse-signals, delivery cascade, or return-pickup cascade) or on any request that loads this Customer"
        actor: system
        preconditions:
          - "ABUSE_RESTRICT_THRESHOLD <= abuse_score_rolling < ABUSE_BLOCK_THRESHOLD"
        side_effects:
          - "comfort exchanges are still allowed; new TrialOrders require TrialSupportAgent instead of self-service (informational only in this scaffold)"
      - from: TRIAL_RESTRICTED
        to: BLOCKED
        trigger: "system re-derivation after any TrialAbuseSignal append"
        actor: system
        preconditions:
          - "abuse_score_rolling >= ABUSE_BLOCK_THRESHOLD"
        side_effects:
          - "sets trial_block_until = current logical clock + ABUSE_BLOCK_DAYS days"
      - from: ACTIVE
        to: BLOCKED
        trigger: "system re-derivation after any TrialAbuseSignal append"
        actor: system
        preconditions:
          - "abuse_score_rolling >= ABUSE_BLOCK_THRESHOLD"
        side_effects:
          - "sets trial_block_until = current logical clock + ABUSE_BLOCK_DAYS days"
      - from: BLOCKED
        to: TRIAL_RESTRICTED
        trigger: "system lazy re-derivation on any request that loads this Customer after the logical clock advances"
        actor: system
        preconditions:
          - "current logical clock >= trial_block_until"
          - "ABUSE_RESTRICT_THRESHOLD <= abuse_score_rolling < ABUSE_BLOCK_THRESHOLD after decay"
        side_effects:
          - "clears trial_block_until to null"
      - from: TRIAL_RESTRICTED
        to: ACTIVE
        trigger: "system lazy re-derivation on any request that loads this Customer after the logical clock advances"
        actor: system
        preconditions:
          - "abuse_score_rolling < ABUSE_RESTRICT_THRESHOLD after decay"
        side_effects:
          - "no field other than status changes"
        note: "Cycle: ACTIVE -> TRIAL_RESTRICTED -> ACTIVE, driven purely by decay in calculations.abuse_score."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appointment-create-stale-route
    parent_entity: PickupRoute
    write_endpoint: "POST /pickup-appointments"
    occ_field: "expected_pickup_route_version"
    description: |
      Booking a PickupAppointment against a PickupRoute whose version has advanced since the
      client last observed it is rejected. A second booking for a different ReturnCase in a
      non-overlapping slot is legitimate product behaviour, so the write cannot be rejected on
      state grounds; the stale version is the only signal that the client's view of
      booked_units / available_units predates another booking that already consumed capacity.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

  - rule_id: refund-create-stale-return-case
    parent_entity: ReturnCase
    write_endpoint: "POST /refund-authorizations"
    occ_field: "expected_return_case_version"
    description: |
      Creating a RefundAuthorization against a ReturnCase whose version has advanced since the
      client last observed it is rejected. Because a VOIDED authorization may legitimately be
      superseded by a new one (ReturnCase.financial_status VOID -> AUTHORIZED), a second create
      is not blocked by state; the stale version is the only signal that the inspection grade,
      bundle unwind, or damage offset the client priced against has since been re-stamped.
    error_id: ERR_STALE_RETURN_CASE_VERSION
    http_status: 412

  - rule_id: exchange-approve-stale-order
    parent_entity: TrialOrder
    write_endpoint: "POST /comfort-exchanges/{id}/approve"
    occ_field: "expected_trial_order_version"
    description: |
      Approving a ComfortExchange against an original TrialOrder whose version has advanced
      since the agent last observed it is rejected. A customer may hold several REQUESTED
      exchanges (earlier ones declined), so approving any one of them is legitimate on state
      grounds; the stale version is the only signal that the order's ledger or trial fields
      moved after the agent priced the exchange.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# All money is integer cents. `round_half_up(x)` rounds a rational to the nearest
# whole cent, ties away from zero. No calculation reads any entity `id`.
# ---------------------------------------------------------------------------
calculations:
  - name: order_pricing
    trigger: "POST /trial-orders (creation)"
    algorithm: aggregation
    formula: |
      if bundle_id is null:
          bundle_discount_cents = 0
      else:
          bundle_discount_cents = round_half_up(gross_price_cents * PromotionBundle.percent_off_bps / 10000)
      paid_amount_cents            = gross_price_cents - bundle_discount_cents
      outstanding_refundable_cents = paid_amount_cents
      refunded_total_cents         = 0
      retained_amount_cents        = 0
    input_set: "The single TrialOrder being created plus its PromotionBundle (when bundle_id is non-null)."
    constants: {}
    precision: "integer cents, round_half_up"

  - name: refund_settlement
    trigger: "POST /return-cases/{id}/inspect stamps the PROVISIONAL variant into ReturnCase.provisional_refund_cents; POST /refund-authorizations stamps the FINAL variant into ReturnCase.final_refund_cents and into the RefundAuthorization row"
    algorithm: threshold
    formula: |
      gross_refundable_cents = TrialOrder.paid_amount_cents
      n                      = ReturnCase.nights_used
      T                      = MattressModel.trial_nights

      # --- proration, the ONLY term that differs between variants ---
      # PROVISIONAL (usage basis, one rounding at the end):
      proration_provisional = round_half_up(gross_refundable_cents * min(n, T) * USAGE_RETENTION_BPS / (T * 10000))
      # FINAL (flat tier basis):
      if   n <= TIER1_MAX_NIGHTS: tier_bps = TIER1_BPS
      elif n <= TIER2_MAX_NIGHTS: tier_bps = TIER2_BPS
      elif n <= TIER3_MAX_NIGHTS: tier_bps = TIER3_BPS
      else:                       tier_bps = TIER4_BPS
      proration_final = round_half_up(gross_refundable_cents * tier_bps / 10000)

      # --- shared terms (identical in both variants) ---
      bundle_unwind_cents = calculations.bundle_unwind
      damage_offset_cents = calculations.damage_offset

      provisional_refund_cents = gross_refundable_cents - proration_provisional - bundle_unwind_cents - damage_offset_cents
      final_refund_cents       = gross_refundable_cents - proration_final       - bundle_unwind_cents - damage_offset_cents
      # An authorization may only be created when final_refund_cents > 0 (exactly 0 is refused).
    input_set: "One ReturnCase whose logistics_status has reached INSPECTED, its TrialOrder, that order's MattressModel, and that order's PromotionBundle when present. Cancelled returns are never priced."
    constants:
      USAGE_RETENTION_BPS: 2500
      TIER1_MAX_NIGHTS: 30
      TIER1_BPS: 0
      TIER2_MAX_NIGHTS: 60
      TIER2_BPS: 500
      TIER3_MAX_NIGHTS: 100
      TIER3_BPS: 1200
      TIER4_BPS: 2000
    precision: "integer cents, round_half_up; each variant rounds its proration term exactly once"
    variants:
      - name: PROVISIONAL
        when: "Stamped at POST /return-cases/{id}/inspect, before disposition and before any finance review."
        difference: "Prorates by actual nights used against a flat 25% usage-retention rate, so the deduction grows linearly with nights_used."
      - name: FINAL
        when: "Stamped at POST /refund-authorizations, the row that actually moves money."
        difference: "Prorates by the flat tier band nights_used falls into, so the deduction is a step function; for identical inputs the two variants disagree everywhere except where the linear and step curves cross."

  - name: bundle_unwind
    trigger: "POST /return-cases/{id}/inspect, recomputed at POST /refund-authorizations"
    algorithm: waterfall_allocation
    formula: |
      if TrialOrder.bundle_id is null: return 0
      P = PromotionBundle, n = ReturnCase.nights_used, T = MattressModel.trial_nights
      accessory_waived = (P.requires_accessory_return == true AND ReturnCase.accessory_returned == true)

      # Components are evaluated in this fixed order and EACH is rounded to whole
      # cents BEFORE the sum. Summing the three exact rationals and rounding once
      # is a DIFFERENT number; this scaffold pins per-component rounding.
      # c1 - accessory value
      if P.unwind_policy == FORFEIT_NONE or accessory_waived:            c1 = 0
      elif P.unwind_policy == DEDUCT_RETAIL:                             c1 = P.accessory_retail_cents
      else:  # DEDUCT_PRORATED - the customer earns the gift over the trial
                                                                        c1 = round_half_up(P.accessory_retail_cents * (T - min(n, T)) / T)
      # c2 - bundle discount reallocated to the accessory the customer keeps
      if P.unwind_policy == FORFEIT_NONE or accessory_waived or P.accessory_retail_cents == 0:
                                                                        c2 = 0
      else:                                                             c2 = round_half_up(TrialOrder.bundle_discount_cents * P.accessory_retail_cents / (P.accessory_retail_cents + TrialOrder.gross_price_cents))
      # c3 - gift card face value
      if P.unwind_policy == FORFEIT_NONE:                                c3 = 0
      elif P.unwind_policy == DEDUCT_RETAIL:                            c3 = P.gift_card_cents
      else:                                                             c3 = round_half_up(P.gift_card_cents * (T - min(n, T)) / T)

      bundle_unwind_cents = c1 + c2 + c3
    input_set: "The one PromotionBundle referenced by the TrialOrder; components are always all three, with zeros for absent components."
    constants: {}
    precision: "integer cents, round_half_up per component, then integer addition"

  - name: damage_offset
    trigger: "POST /return-cases/{id}/inspect, recomputed at POST /refund-authorizations"
    algorithm: threshold
    formula: |
      grade_bps = {A: 0, B: 500, C: 1500, D: 3000}[ReturnCase.condition_grade]
      soil_bps  = SOIL_OFFSET_BPS if ReturnCase.soil_flag else 0
      damage_offset_cents = round_half_up(TrialOrder.paid_amount_cents * min(grade_bps + soil_bps, DAMAGE_OFFSET_CAP_BPS) / 10000)
    input_set: "The inspected ReturnCase and its TrialOrder."
    constants:
      SOIL_OFFSET_BPS: 1000
      DAMAGE_OFFSET_CAP_BPS: 4000
    precision: "integer cents, round_half_up"

  - name: abuse_score
    trigger: "Recomputed whenever a TrialAbuseSignal is appended (POST /trial-abuse-signals, the delivery cascade, or the return-pickup cascade) and lazily whenever a request loads the Customer, so clock advances alone can decay the score"
    algorithm: weighted_scoring
    formula: |
      W = {REPEAT_RETURN: 25, HOUSEHOLD_MATCH: 30, SHORT_TRIAL: 15, MULTI_CHANNEL: 10}
      for each TrialAbuseSignal s of this customer:
          age_days = floor((current_logical_clock - s.recorded_at) / 86400 seconds)
          # ROLLING_12M variant (the gate):
          if   age_days <  DECAY_STEP_DAYS:  eff_rolling = W[s.signal_type]
          elif age_days <  WINDOW_DAYS:      eff_rolling = round_half_up(W[s.signal_type] / 2)
          else:                              eff_rolling = 0
          # LIFETIME variant (reported only):
          eff_lifetime = W[s.signal_type]
      abuse_score_rolling  = min(SCORE_CEILING, sum of eff_rolling  over all signals)
      abuse_score_lifetime = min(SCORE_CEILING, sum of eff_lifetime over all signals)
      # posture re-derivation, evaluated in this order:
      if abuse_score_rolling >= ABUSE_BLOCK_THRESHOLD:
          status = BLOCKED; trial_block_until = current_logical_clock + ABUSE_BLOCK_DAYS days
      elif trial_block_until is not null and current_logical_clock < trial_block_until:
          status = BLOCKED
      elif abuse_score_rolling >= ABUSE_RESTRICT_THRESHOLD:
          status = TRIAL_RESTRICTED; trial_block_until = null
      else:
          status = ACTIVE;           trial_block_until = null
    input_set: "Every TrialAbuseSignal row with this customer_id, no status filter (signals are append-only and never retracted); the cap is applied once after summing."
    constants:
      DECAY_STEP_DAYS: 180
      WINDOW_DAYS: 365
      SCORE_CEILING: 100
      ABUSE_RESTRICT_THRESHOLD: 60
      ABUSE_BLOCK_THRESHOLD: 80
      ABUSE_BLOCK_DAYS: 365
      SHORT_TRIAL_NIGHTS: 30
    precision: "integer points; the half-weight step uses round_half_up on weight/2"
    variants:
      - name: ROLLING_12M
        when: "Always computed; stored in Customer.abuse_score_rolling and it alone decides Customer.status."
        difference: "Applies the 180-day half-weight step and drops signals at or beyond 365 days, so identical signal sets score lower as the clock advances."
      - name: LIFETIME
        when: "Always computed; stored in Customer.abuse_score_lifetime and reported to operators."
        difference: "No decay and no window, so it is monotonically non-decreasing and diverges from the rolling variant as soon as any signal passes 180 days."

  - name: exchange_settlement
    trigger: "POST /comfort-exchanges (creation) — the amounts are frozen on the request row and re-verified at approval"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED. The tier in step 4 is keyed on the STEP-1 raw
      # difference, NOT on the post-fee, post-credit price_difference_cents; keying
      # it on the final value would make the definition circular.
      step 1: raw_price_difference_cents = MattressModel[target_model_id].list_price_cents
                                         - MattressModel[original order.model_id].list_price_cents
      step 2: sequence_number   = original TrialOrder.exchange_chain_depth + 1
      step 3: exchange_fee_cents = min(EXCHANGE_FEE_CAP_CENTS,
                                       EXCHANGE_FEE_BASE_CENTS + (sequence_number - 1) * EXCHANGE_FEE_STEP_CENTS)
      step 4: a = abs(raw_price_difference_cents)
              if   a <  TIER_A_MAX_CENTS: tier_credit_bps = 0
              elif a <  TIER_B_MAX_CENTS: tier_credit_bps = TIER_B_CREDIT_BPS
              else:                       tier_credit_bps = TIER_C_CREDIT_BPS
      step 5: tier_credit_cents = round_half_up(original TrialOrder.paid_amount_cents * tier_credit_bps / 10000)
      step 6: price_difference_cents = raw_price_difference_cents + exchange_fee_cents - tier_credit_cents
      step 7: settlement_direction = CHARGE_CUSTOMER if price_difference_cents > 0
                                     CREDIT_CUSTOMER if price_difference_cents < 0
                                     EVEN            if price_difference_cents == 0
    input_set: "The original TrialOrder, its MattressModel, and the target MattressModel. Declined exchanges on the same order do not raise sequence_number - only an APPROVED exchange raises exchange_chain_depth on the minted replacement."
    constants:
      EXCHANGE_FEE_BASE_CENTS: 9900
      EXCHANGE_FEE_STEP_CENTS: 5000
      EXCHANGE_FEE_CAP_CENTS: 24900
      TIER_A_MAX_CENTS: 20000
      TIER_B_MAX_CENTS: 50000
      TIER_B_CREDIT_BPS: 250
      TIER_C_CREDIT_BPS: 500
      MAX_EXCHANGES_PER_CHAIN: 2
    precision: "integer cents, round_half_up on the tier credit only"

  - name: pickup_units
    trigger: "POST /pickup-appointments (stamped on PickupAppointment.units) and POST /return-cases/{id}/disposition (stamped on DispositionAssignment.units)"
    algorithm: aggregation
    formula: |
      units = SIZE_UNITS[MattressModel.size of the ReturnCase's TrialOrder]
      PickupRoute.booked_units    = sum of units over PickupAppointment rows with this route_id and status IN {BOOKED, COMPLETED}
      PickupRoute.available_units = PickupRoute.capacity_units - PickupRoute.booked_units
      # Invariant at every observable instant: capacity_units == booked_units + available_units
    input_set: "PickupAppointment rows on the route with status IN {BOOKED, COMPLETED}; MISSED and CANCELLED slots are excluded, which is what makes cancellation a conserving compensation."
    constants:
      SIZE_UNITS: { TWIN: 1, QUEEN: 2, KING: 3 }
    precision: "integer units"

  - name: disposition_partner_selection
    trigger: "POST /return-cases/{id}/disposition"
    algorithm: waterfall_allocation
    formula: |
      u = calculations.pickup_units for this ReturnCase
      d = requested intake_date
      r = the PickupRoute of this ReturnCase's PickupAppointment whose status == COMPLETED
      day_booked_units(p, d) = sum of DispositionAssignment.units where partner_id == p.id
                               AND intake_date == d AND status IN {ASSIGNED, DELIVERED}
                               (a REJECTED assignment frees its units from the bucket)

      # hard pre-filter on the DONATION arm (before any partner is considered):
      if requested_disposition == DONATION and not (MattressModel.donation_eligible == true
             and ReturnCase.condition_grade IN {A, B} and ReturnCase.soil_flag == false):
          reject with ERR_DONATION_INELIGIBLE

      # waterfall over partner types:
      type_order = [CHARITY, RECYCLER] if requested_disposition == DONATION else [RECYCLER]
      for t in type_order:
          eligible = every DispositionPartner p with
                p.status == ACTIVE
                AND p.partner_type == t
                AND p.region_code == r.region_code
                AND ReturnCase.condition_grade IN p.accepts_condition_grades
                AND (ReturnCase.soil_flag == false OR p.soil_policy == ACCEPT_SOILED)
                AND day_booked_units(p, d) + u <= p.daily_intake_capacity_units
          if eligible is non-empty:
              winner = eligible sorted by (p.priority_rank ASC,
                                           (p.daily_intake_capacity_units - day_booked_units(p, d)) DESC,
                                           p.created_at ASC)[0]
              fallback_applied = (requested_disposition == DONATION and t == RECYCLER)
              disposition_type = DONATION if t == CHARITY else RECYCLE
              fee_cents        = u * winner.recycle_fee_cents_per_unit
              return winner
      # empty-pool fallbacks, evaluated in this order:
      if some partner of the last type in type_order passes every clause EXCEPT the capacity clause:
          reject with ERR_PARTNER_INTAKE_CAPACITY_EXCEEDED
      reject with ERR_NO_DISPOSITION_PARTNER
    input_set: "All DispositionPartner rows; the candidate set is narrowed by the explicit predicate above. No random field participates: the final tie-break is created_at ASC, never id."
    constants: {}
    precision: "integer units and integer cents"

  - name: quality_claim_credit
    trigger: "Photo minimums are enforced at POST /quality-claims and POST /quality-claims/{id}/adjudicate; credit_cents is stamped at adjudication when resolution == CREDIT"
    algorithm: decay_function
    formula: |
      # required photographic evidence, by claim_type and measurement method:
      if claim_type == WARRANTY_INDENTATION:
          required_photos = MIN_PHOTOS_LASER if measurement_method == LASER_SCAN else MIN_PHOTOS_STRAIGHTEDGE
      else:
          required_photos = MIN_PHOTOS_DELIVERY
      # credit, when resolution == CREDIT:
      if claim_type == SHIPPING_DAMAGE:
          credit_cents = round_half_up(TrialOrder.paid_amount_cents * DAMAGE_GOODWILL_BPS / 10000)
      elif claim_type == COMPRESSION_RECOVERY:
          credit_cents = COMPRESSION_GOODWILL_CENTS
      else:  # WARRANTY_INDENTATION
          ownership_years = floor((reported_at - TrialOrder.delivered_at) / (365 * 86400 seconds))
          coverage_bps    = max(WARRANTY_FLOOR_BPS, 10000 - ownership_years * WARRANTY_DECAY_BPS_PER_YEAR)
          credit_cents    = round_half_up(TrialOrder.paid_amount_cents * coverage_bps / 10000)
    input_set: "The single QualityClaim being adjudicated, its TrialOrder and that order's MattressModel. Evidence from earlier rounds is replaced, not accumulated: only the latest photo_evidence_count counts."
    constants:
      MIN_PHOTOS_DELIVERY: 2
      MIN_PHOTOS_STRAIGHTEDGE: 3
      MIN_PHOTOS_LASER: 1
      DAMAGE_GOODWILL_BPS: 1500
      COMPRESSION_GOODWILL_CENTS: 7500
      WARRANTY_DECAY_BPS_PER_YEAR: 1000
      WARRANTY_FLOOR_BPS: 2000
      MAX_EVIDENCE_ROUNDS: 2
      COMPRESSION_RECOVERY_WAIT_NIGHTS: 3
      DAMAGE_REPORT_WINDOW_NIGHTS: 7
    precision: "integer cents, round_half_up"

  - name: attribution_settlement
    trigger: "POST /attribution-claims/{id}/resolve (decision == APPROVE)"
    algorithm: tiered_pricing
    formula: |
      window_days_elapsed = floor((AttributionClaim.submitted_at - TrialOrder.delivered_at) / 86400 seconds)
      if window_days_elapsed > RetailPartner.attribution_window_days:
          reject with ERR_ATTRIBUTION_WINDOW_CLOSED        # boundary is inclusive: == window is still open
      if evidence_url_count < MIN_CLAIM_EVIDENCE:
          reject with ERR_INSUFFICIENT_EVIDENCE

      if claim_type == SALES_ATTRIBUTION:
          require TrialOrder.channel == RETAIL_PARTNER and TrialOrder.retail_partner_id == partner_id
                  else reject with ERR_ATTRIBUTION_CHANNEL_MISMATCH
          commission_cents        = round_half_up(TrialOrder.paid_amount_cents * RetailPartner.commission_bps / 10000)
          price_match_credit_cents = 0
      else:  # PRICE_MATCH
          raw_gap = max(0, TrialOrder.gross_price_cents - AttributionClaim.competitor_price_cents)
          if   RetailPartner.price_match_policy == NO_MATCH:
                   reject with ERR_PRICE_MATCH_NOT_OFFERED
          elif RetailPartner.price_match_policy == MATCH_TO_LOWEST:
                   price_match_credit_cents = raw_gap
          else:  # MATCH_TO_ADVERTISED - capped at PRICE_MATCH_CAP_BPS of gross
                   price_match_credit_cents = min(raw_gap,
                                                  round_half_up(TrialOrder.gross_price_cents * PRICE_MATCH_CAP_BPS / 10000))
          commission_cents = 0
    input_set: "The single AttributionClaim being resolved, its RetailPartner and its TrialOrder. Rejected and REVISION_REQUESTED claims contribute nothing to the order's credit totals."
    constants:
      MIN_CLAIM_EVIDENCE: 2
      PRICE_MATCH_CAP_BPS: 1000
      MAX_REVISION_ROUNDS: 2
    precision: "integer cents, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority; the
# first failing row decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body contains every required field for the endpoint, no unknown fields, every enum value is a declared member, every *_cents / *_count / *_units value is an integer within its declared range, every datetime is ISO 8601 UTC, and conditionally required fields are present (measurement_method + measured_indentation_mm for claim_type WARRANTY_INDENTATION; competitor_price_cents for claim_type PRICE_MATCH; retail_partner_id for channel RETAIL_PARTNER)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every {id} path segment resolves, validated left to right"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RETURN_CASE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ATTRIBUTION_CLAIM_NOT_FOUND | ERR_EXCHANGE_NOT_FOUND | ERR_REFUND_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_CATALOG_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RETURN_CASE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_REFUND_NOT_FOUND"
    http_status: 404
    applies_to: "POST /trial-orders, POST /return-cases, POST /pickup-appointments, POST /refund-authorizations, POST /comfort-exchanges, POST /quality-claims, POST /attribution-claims, POST /trial-abuse-signals"
  - priority: 6
    category: auth
    check: "For entity_backed roles the acting identity owns the target: X-User-Role == Customer requires X-User-ID == TrialOrder.customer_id of the order in scope; X-User-Role == RetailPartner requires X-User-ID == AttributionClaim.partner_id (or the partner_id in the request body)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "GET /customers/{id}, POST /return-cases, POST /return-cases/{id}/cancel, POST /trial-orders/{id}/keep, POST /quality-claims, POST /quality-claims/{id}/submit-evidence, POST /comfort-exchanges, POST /attribution-claims, POST /attribution-claims/{id}/resubmit, GET /trial-orders/{id}, GET /return-cases/{id}, GET /quality-claims/{id}, GET /comfort-exchanges/{id}, GET /refund-authorizations/{id}, GET /attribution-claims/{id}"
  - priority: 7
    category: state
    check: "The TrialOrder's fulfillment_status / trial_status pair permits the requested transition (see 1.2). For POST /comfort-exchanges and POST /return-cases this rule only requires fulfillment_status IN {DELIVERED, DAMAGED_REPORTED} and trial_status IN {BREAK_IN, TRIAL_ACTIVE, TRIAL_EXPIRED}; the break-in and trial-window clocks are checked later by validations[priority=17] and validations[priority=18], never here, so a lazily expired order reaches priority 18 and answers ERR_TRIAL_WINDOW_EXPIRED rather than ERR_INVALID_ORDER_STATE."
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /trial-orders/{id}/dispatch, POST /trial-orders/{id}/deliver, POST /trial-orders/{id}/keep, POST /return-cases, POST /comfort-exchanges, POST /quality-claims"
  - priority: 8
    category: state
    check: "The ReturnCase's logistics_status and financial_status permit the requested transition"
    error_id: ERR_INVALID_RETURN_STATE
    http_status: 409
    applies_to: "POST /pickup-appointments, POST /return-cases/{id}/inspect, POST /return-cases/{id}/disposition, POST /return-cases/{id}/cancel, POST /refund-authorizations"
  - priority: 9
    category: state
    check: "The PickupRoute is PUBLISHED before an appointment may be booked on it, and the PickupAppointment is BOOKED before it may be completed or cancelled"
    error_id: "ERR_ROUTE_NOT_PUBLISHED | ERR_INVALID_APPOINTMENT_STATE"
    http_status: 409
    applies_to: "POST /pickup-routes/{id}/publish, POST /pickup-appointments, POST /pickup-appointments/{id}/complete, POST /pickup-appointments/{id}/cancel"
  - priority: 10
    category: state
    check: "The QualityClaim / AttributionClaim / ComfortExchange / RefundAuthorization / DispositionAssignment is in a status from which the requested action is declared in 1.2"
    error_id: "ERR_INVALID_CLAIM_STATE | ERR_INVALID_ATTRIBUTION_STATE | ERR_INVALID_EXCHANGE_STATE | ERR_INVALID_REFUND_STATE | ERR_INVALID_ASSIGNMENT_STATE"
    http_status: 409
    applies_to: "POST /quality-claims/{id}/request-evidence, POST /quality-claims/{id}/submit-evidence, POST /quality-claims/{id}/adjudicate, POST /quality-claims/{id}/settle, POST /attribution-claims/{id}/review, POST /attribution-claims/{id}/resubmit, POST /attribution-claims/{id}/resolve, POST /comfort-exchanges/{id}/approve, POST /comfort-exchanges/{id}/decline, POST /refund-authorizations/{id}/release, POST /refund-authorizations/{id}/void, POST /disposition-assignments/{id}/confirm-intake"
  - priority: 11
    category: state
    check: "Cross-entity guard: a RefundAuthorization may only be created when the ReturnCase's DispositionAssignment has status DELIVERED"
    error_id: ERR_DISPOSITION_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /refund-authorizations"
  - priority: 12
    category: state
    check: "expected_pickup_route_version equals PickupRoute.version"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /pickup-appointments"
  - priority: 13
    category: state
    check: "expected_return_case_version equals ReturnCase.version"
    error_id: ERR_STALE_RETURN_CASE_VERSION
    http_status: 412
    applies_to: "POST /refund-authorizations"
  - priority: 14
    category: state
    check: "expected_trial_order_version equals the original TrialOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /comfort-exchanges/{id}/approve"
  - priority: 15
    category: business_safety
    check: "Customer.status != BLOCKED and (trial_block_until is null or current logical clock >= trial_block_until), re-derived from calculations.abuse_score before the check"
    error_id: ERR_TRIAL_ABUSE_BLOCK
    http_status: 403
    applies_to: "POST /trial-orders, POST /comfort-exchanges"
  - priority: 16
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the operator recorded on the prior step (RefundAuthorization.authorized_by_user_id on release; QualityClaim.approved_by_user_id on settle)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /refund-authorizations/{id}/release, POST /quality-claims/{id}/settle"
  - priority: 17
    category: business_temporal
    check: "current logical clock >= TrialOrder.break_in_ends_at (inclusive), unless the request is a ReturnCase with reason_code == DAMAGE backed by a SHIPPING_DAMAGE QualityClaim"
    error_id: ERR_BREAK_IN_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /return-cases, POST /comfort-exchanges"
  - priority: 18
    category: business_temporal
    check: "current logical clock < TrialOrder.trial_ends_at"
    error_id: ERR_TRIAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /return-cases, POST /comfort-exchanges"
  - priority: 19
    category: business_temporal
    check: "For claim_type == COMPRESSION_RECOVERY: floor((clock - delivered_at)/86400) >= COMPRESSION_RECOVERY_WAIT_NIGHTS (the mattress must be given its decompression window before the complaint is accepted)"
    error_id: ERR_RECOVERY_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /quality-claims"
  - priority: 20
    category: business_temporal
    check: "For claim_type == SHIPPING_DAMAGE: floor((clock - delivered_at)/86400) <= DAMAGE_REPORT_WINDOW_NIGHTS"
    error_id: ERR_DAMAGE_REPORT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /quality-claims"
  - priority: 21
    category: business_temporal
    check: "floor((AttributionClaim.submitted_at - TrialOrder.delivered_at)/86400) <= RetailPartner.attribution_window_days (inclusive)"
    error_id: ERR_ATTRIBUTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /attribution-claims, POST /attribution-claims/{id}/resolve"
  - priority: 22
    category: business_constraint
    check: "No other Customer sharing this customer's household_hash has a TrialOrder whose fulfillment_status is IN {CREATED, IN_TRANSIT, DELIVERED, DAMAGED_REPORTED} at the moment of creation, and the household's count of DELIVERED-or-later orders is < HOUSEHOLD_TRIAL_LIMIT (2)"
    error_id: ERR_HOUSEHOLD_TRIAL_LIMIT
    http_status: 422
    applies_to: "POST /trial-orders"
  - priority: 23
    category: business_constraint
    check: "At most one ReturnCase per TrialOrder may be in logistics_status IN {REQUESTED, PICKUP_SCHEDULED, PICKED_UP, INSPECTED, DISPOSITIONED}"
    error_id: ERR_DUPLICATE_ACTIVE_RETURN
    http_status: 409
    applies_to: "POST /return-cases"
  - priority: 24
    category: business_constraint
    check: "sequence_number (original TrialOrder.exchange_chain_depth + 1) <= MAX_EXCHANGES_PER_CHAIN"
    error_id: ERR_EXCHANGE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /comfort-exchanges"
  - priority: 25
    category: business_constraint
    check: "The target MattressModel has the same size as the original order's model and a different id"
    error_id: ERR_MODEL_SIZE_MISMATCH
    http_status: 422
    applies_to: "POST /comfort-exchanges"
  - priority: 26
    category: business_constraint
    check: "photo_evidence_count >= the required_photos of calculations.quality_claim_credit for this claim_type / measurement_method"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /quality-claims, POST /quality-claims/{id}/submit-evidence, POST /quality-claims/{id}/adjudicate"
  - priority: 27
    category: business_constraint
    check: "evidence_url_count >= MIN_CLAIM_EVIDENCE"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /attribution-claims, POST /attribution-claims/{id}/resubmit"
  - priority: 28
    category: business_constraint
    check: "For claim_type == WARRANTY_INDENTATION: TrialOrder.trial_status == KEPT and measured_indentation_mm >= MattressModel.indentation_warranty_threshold_mm (inclusive)"
    error_id: ERR_INDENTATION_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /quality-claims, POST /quality-claims/{id}/adjudicate"
  - priority: 29
    category: business_constraint
    check: "evidence_round_count < MAX_EVIDENCE_ROUNDS on a submit-evidence call; revision_round_count < MAX_REVISION_ROUNDS on a resubmit or REQUEST_REVISION call"
    error_id: ERR_ROUND_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /quality-claims/{id}/submit-evidence, POST /attribution-claims/{id}/review, POST /attribution-claims/{id}/resubmit"
  - priority: 30
    category: business_constraint
    check: "For claim_type == SALES_ATTRIBUTION: TrialOrder.channel == RETAIL_PARTNER and TrialOrder.retail_partner_id == partner_id"
    error_id: ERR_ATTRIBUTION_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /attribution-claims, POST /attribution-claims/{id}/resolve"
  - priority: 31
    category: business_constraint
    check: "For claim_type == PRICE_MATCH: RetailPartner.price_match_policy != NO_MATCH"
    error_id: ERR_PRICE_MATCH_NOT_OFFERED
    http_status: 422
    applies_to: "POST /attribution-claims, POST /attribution-claims/{id}/resolve"
  - priority: 32
    category: business_temporal
    check: "The appointment slot lies inside the route window: slot_start_at >= PickupRoute.window_start_at and slot_end_at <= PickupRoute.window_end_at, and both fall on PickupRoute.route_date in UTC"
    error_id: ERR_SLOT_OUTSIDE_ROUTE_WINDOW
    http_status: 422
    applies_to: "POST /pickup-appointments"
  - priority: 33
    category: business_temporal
    check: "Interval semantics A - point adjacency with a buffer: for every existing PickupAppointment a on the same route with status IN {BOOKED, COMPLETED}, the new slot [slot_start_at, slot_end_at) must satisfy slot_start_at >= a.slot_end_at + buffer_minutes OR slot_end_at + buffer_minutes <= a.slot_start_at. Exact adjacency with zero gap collides whenever buffer_minutes > 0."
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /pickup-appointments"
  - priority: 34
    category: business_constraint
    check: "For requested_disposition == DONATION: MattressModel.donation_eligible == true, ReturnCase.condition_grade IN {A, B}, ReturnCase.soil_flag == false"
    error_id: ERR_DONATION_INELIGIBLE
    http_status: 422
    applies_to: "POST /return-cases/{id}/disposition"
  - priority: 35
    category: business_constraint
    check: "calculations.disposition_partner_selection yields a winner for at least one type in the waterfall"
    error_id: ERR_NO_DISPOSITION_PARTNER
    http_status: 422
    applies_to: "POST /return-cases/{id}/disposition"
  - priority: 36
    category: business_referential
    check: "No QualityClaim on the ReturnCase's TrialOrder has status IN {SUBMITTED, EVIDENCE_REQUESTED} - an unresolved quality complaint blocks the refund ledger"
    error_id: ERR_OPEN_QUALITY_CLAIM
    http_status: 409
    applies_to: "POST /refund-authorizations"
  - priority: 37
    category: business_referential
    check: "supersedes_refund_id, when supplied, references a RefundAuthorization on this same ReturnCase whose status == VOIDED; when omitted, no non-VOIDED RefundAuthorization may already exist on this ReturnCase"
    error_id: ERR_REFUND_SUPERSEDE_INVALID
    http_status: 409
    applies_to: "POST /refund-authorizations"
  - priority: 38
    category: business_fiscal
    check: "Interval semantics B - closed calendar-day bucket aggregate: day_booked_units(partner, intake_date) + units <= DispositionPartner.daily_intake_capacity_units. Assignments on adjacent intake_dates never collide, no matter the pickup times."
    error_id: ERR_PARTNER_INTAKE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /return-cases/{id}/disposition"
  - priority: 39
    category: business_fiscal
    check: "PickupRoute.booked_units + PickupAppointment.units <= PickupRoute.capacity_units (strictly greater is rejected; exact equality is allowed)"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pickup-appointments"
  - priority: 40
    category: business_fiscal
    check: "The FINAL variant of calculations.refund_settlement yields final_refund_cents > 0 (exactly 0 or negative is refused)"
    error_id: ERR_NO_REFUNDABLE_BALANCE
    http_status: 422
    applies_to: "POST /refund-authorizations"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table (flat topology - every collection is top-level)
# ---------------------------------------------------------------------------
endpoints:
  # --- catalog / configuration ------------------------------------------------
  - method: POST
    path: "/mattress-models"
    description: "Register a mattress model with its break-in and trial windows."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, firmness, size, list_price_cents, "break_in_nights?", "trial_nights?", "indentation_warranty_threshold_mm?", "warranty_years?", "donation_eligible?"]
    output: MattressModel
    side_effects: []
  - method: POST
    path: "/promotion-bundles"
    description: "Register a promotional bundle and its unwind policy."
    roles: [PlatformAdmin]
    code: 201
    input: [code, unwind_policy, "accessory_retail_cents?", "percent_off_bps?", "gift_card_cents?", "requires_accessory_return?"]
    output: PromotionBundle
    side_effects: []
  - method: POST
    path: "/retail-partners"
    description: "Onboard a retail partner with its commission and price-match policy."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, commission_bps, price_match_policy, "attribution_window_days?", "status?"]
    output: RetailPartner
    side_effects: []
  - method: POST
    path: "/disposition-partners"
    description: "Onboard a charity or recycler with its daily intake capacity and acceptance rules."
    roles: [PlatformAdmin]
    code: 201
    input: [name, partner_type, region_code, daily_intake_capacity_units, accepts_condition_grades, soil_policy, priority_rank, "recycle_fee_cents_per_unit?", "status?"]
    output: DispositionPartner
    side_effects: []
  - method: GET
    path: "/disposition-partners"
    description: "List disposition partners, filterable by region and type; paginated."
    roles: [LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: ["region_code?", "partner_type?", "status?", "limit?", "offset?"]
    output: DispositionPartner[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every window, expiry, decay and proration rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["advances the logical clock, which lazily re-derives TrialOrder.trial_status and Customer.status on subsequent loads"]

  # --- customers and fraud ----------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Create a customer with the household hash used by the fraud controls."
    roles: [PlatformAdmin, TrialSupportAgent]
    code: 201
    input: [email, full_name, household_hash]
    output: Customer
    side_effects: ["initialises status ACTIVE, both abuse scores 0, all counters 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Read a customer including both abuse-score variants and the derived fraud posture."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["lazily re-derives abuse_score_rolling, abuse_score_lifetime, status and trial_block_until against the current logical clock"]
  - method: GET
    path: "/customers/{id}/abuse-signals"
    description: "List the append-only abuse signals recorded against a customer."
    roles: [TrialSupportAgent, PlatformAdmin]
    code: 200
    input: ["signal_type?", "limit?", "offset?"]
    output: TrialAbuseSignal[]
    side_effects: []
  - method: POST
    path: "/trial-abuse-signals"
    description: "Fraud operations record a signal against a customer; recorded_at may be backdated to model an older signal."
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, signal_type, "recorded_at?", "source_note?"]
    output: TrialAbuseSignal
    side_effects: ["recomputes Customer.abuse_score_rolling and abuse_score_lifetime", "re-derives Customer.status and trial_block_until", "increments Customer.version by 1"]

  # --- trial orders -----------------------------------------------------------
  - method: POST
    path: "/trial-orders"
    description: "Open a trial order for a customer; prices the promotional bundle."
    roles: [TrialSupportAgent, PlatformAdmin]
    code: 201
    input: [customer_id, model_id, channel, gross_price_cents, "bundle_id?", "retail_partner_id?"]
    output: TrialOrder
    side_effects: ["runs calculations.order_pricing to set bundle_discount_cents, paid_amount_cents, outstanding_refundable_cents", "rejects a BLOCKED customer with ERR_TRIAL_ABUSE_BLOCK", "enforces the household trial limit"]
  - method: GET
    path: "/trial-orders/{id}"
    description: "Read one trial order with both status dimensions and the refund ledger fields."
    roles: [Customer, TrialSupportAgent, LogisticsCoordinator, FinanceController, RetailPartner, PlatformAdmin]
    code: 200
    input: []
    output: TrialOrder
    side_effects: ["lazily advances trial_status BREAK_IN -> TRIAL_ACTIVE -> TRIAL_EXPIRED against the logical clock without incrementing version"]
  - method: GET
    path: "/trial-orders"
    description: "List trial orders filtered by customer, model, bundle, retail partner, predecessor order, or either status dimension."
    roles: [Customer, TrialSupportAgent, LogisticsCoordinator, FinanceController, RetailPartner, PlatformAdmin]
    code: 200
    input: ["customer_id?", "model_id?", "bundle_id?", "retail_partner_id?", "exchanged_from_order_id?", "trial_status?", "fulfillment_status?", "limit?", "offset?"]
    output: TrialOrder[]
    side_effects: []
  - method: POST
    path: "/trial-orders/{id}/dispatch"
    description: "Move the fulfillment dimension CREATED -> IN_TRANSIT."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TrialOrder
    side_effects: ["increments TrialOrder.version by 1"]
  - method: POST
    path: "/trial-orders/{id}/deliver"
    description: "Record delivery: stamps delivered_at from the logical clock, opens the break-in and trial windows, and runs the household/multi-channel fraud signals."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TrialOrder
    side_effects: ["sets delivered_at, break_in_ends_at, trial_ends_at", "advances trial_status NOT_STARTED -> BREAK_IN", "increments Customer.lifetime_trial_count", "appends HOUSEHOLD_MATCH and/or MULTI_CHANNEL TrialAbuseSignal rows and recomputes both Customer abuse scores and status", "increments TrialOrder.version by 1"]
  - method: POST
    path: "/trial-orders/{id}/keep"
    description: "Customer keeps the mattress: closes fulfillment and freezes nights_slept."
    roles: [Customer, TrialSupportAgent]
    code: 200
    input: []
    output: TrialOrder
    side_effects: ["trial_status -> KEPT, fulfillment_status -> CLOSED, nights_slept frozen", "increments TrialOrder.version by 1"]

  # --- quality claims ---------------------------------------------------------
  - method: POST
    path: "/quality-claims"
    description: "File a delivery-damage, compression-recovery, or indentation-warranty claim with photographic evidence."
    roles: [Customer, TrialSupportAgent]
    code: 201
    input: [order_id, claim_type, photo_evidence_count, "measurement_method?", "measured_indentation_mm?"]
    output: QualityClaim
    side_effects: ["for SHIPPING_DAMAGE / COMPRESSION_RECOVERY: advances TrialOrder.fulfillment_status DELIVERED -> DAMAGED_REPORTED and increments TrialOrder.version by 1", "for WARRANTY_INDENTATION: stamps ownership_years and coverage_bps"]
  - method: GET
    path: "/quality-claims/{id}"
    description: "Read one quality claim."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: GET
    path: "/quality-claims"
    description: "List quality claims filtered by order, type, or status."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: ["order_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []
  - method: POST
    path: "/quality-claims/{id}/request-evidence"
    description: "Agent asks for more photographs, moving the claim into EVIDENCE_REQUESTED."
    roles: [TrialSupportAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["increments QualityClaim.version by 1"]
  - method: POST
    path: "/quality-claims/{id}/submit-evidence"
    description: "Customer supplies a new evidence round, replacing the previous photo count and measurement."
    roles: [Customer, TrialSupportAgent]
    code: 200
    input: [photo_evidence_count, "measured_indentation_mm?"]
    output: QualityClaim
    side_effects: ["replaces photo_evidence_count and measured_indentation_mm", "increments evidence_round_count by 1", "status EVIDENCE_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/quality-claims/{id}/adjudicate"
    description: "Agent decides the claim: REPLACEMENT mints a replacement order, CREDIT prices a goodwill credit, DENIED closes it."
    roles: [TrialSupportAgent]
    code: 200
    input: [resolution]
    output: QualityClaim
    side_effects: ["records approved_by_user_id", "REPLACEMENT: mints a replacement TrialOrder and moves the original to fulfillment REPLACED / trial EXCHANGED", "CREDIT: prices credit_cents via calculations.quality_claim_credit and reverts fulfillment DAMAGED_REPORTED -> DELIVERED (a CLOSED or REPLACED order keeps its fulfillment_status)", "DENIED: reverts fulfillment DAMAGED_REPORTED -> DELIVERED under the same condition"]
  - method: POST
    path: "/quality-claims/{id}/settle"
    description: "Finance posts an approved CREDIT to the order; the settling operator must differ from the approving operator."
    roles: [FinanceController]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["records settled_by_user_id", "adds credit_cents to TrialOrder.goodwill_credit_cents", "increments TrialOrder.version by 1"]

  # --- comfort exchanges ------------------------------------------------------
  - method: POST
    path: "/comfort-exchanges"
    description: "Request a comfort exchange to a different firmness in the same size; prices the price difference, the escalating exchange fee, and the loyalty tier credit."
    roles: [Customer, TrialSupportAgent]
    code: 201
    input: [original_order_id, target_model_id]
    output: ComfortExchange
    side_effects: ["runs calculations.exchange_settlement to set raw_price_difference_cents, exchange_fee_cents, tier_credit_cents, price_difference_cents, settlement_direction", "stamps sequence_number as the original order's exchange_chain_depth + 1"]
  - method: GET
    path: "/comfort-exchanges/{id}"
    description: "Read one comfort exchange with its settled price difference."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: ComfortExchange
    side_effects: []
  - method: GET
    path: "/comfort-exchanges"
    description: "List comfort exchanges filtered by original order, replacement order, target model, or status."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: ["original_order_id?", "replacement_order_id?", "target_model_id?", "status?", "limit?", "offset?"]
    output: ComfortExchange[]
    side_effects: []
  - method: POST
    path: "/comfort-exchanges/{id}/approve"
    description: "Approve the exchange under optimistic concurrency on the original TrialOrder; mints the replacement order and unwinds open compression complaints."
    roles: [TrialSupportAgent]
    code: 200
    input: [expected_trial_order_version]
    output: ComfortExchange
    side_effects: ["mints a replacement TrialOrder for target_model_id with exchanged_from_order_id set and exchange_chain_depth incremented", "original TrialOrder: trial_status -> EXCHANGED, fulfillment_status -> REPLACED", "every COMPRESSION_RECOVERY QualityClaim on the original order in SUBMITTED or EVIDENCE_REQUESTED moves to WITHDRAWN", "increments the original TrialOrder.version by 1"]
  - method: POST
    path: "/comfort-exchanges/{id}/decline"
    description: "Decline the exchange request with a note; the original order is untouched."
    roles: [TrialSupportAgent]
    code: 200
    input: [decline_note]
    output: ComfortExchange
    side_effects: ["increments ComfortExchange.version by 1"]

  # --- return cases -----------------------------------------------------------
  - method: POST
    path: "/return-cases"
    description: "Open a return case after the minimum break-in window has elapsed and before the trial window closes. Pricing waits for pickup and inspection."
    roles: [Customer, TrialSupportAgent]
    code: 201
    input: [order_id, reason_code]
    output: ReturnCase
    side_effects: ["stamps requested_at from the logical clock; logistics_status starts at REQUESTED, financial_status at PENDING, disposition at PENDING and nights_used stays null until pickup", "TrialOrder.trial_status TRIAL_ACTIVE -> RETURN_REQUESTED and TrialOrder.version increments by 1"]
  - method: GET
    path: "/return-cases/{id}"
    description: "Read one return case with both status dimensions and the refund breakdown."
    roles: [Customer, TrialSupportAgent, LogisticsCoordinator, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []
  - method: GET
    path: "/return-cases"
    description: "List return cases filtered by order, logistics status, financial status, or disposition."
    roles: [Customer, TrialSupportAgent, LogisticsCoordinator, FinanceController, PlatformAdmin]
    code: 200
    input: ["order_id?", "logistics_status?", "financial_status?", "disposition?", "limit?", "offset?"]
    output: ReturnCase[]
    side_effects: []
  - method: GET
    path: "/return-cases/{id}/refund-summary"
    description: "Computed read: the current refund arithmetic for the case, showing which variant of calculations.refund_settlement applies and the delta between the two."
    roles: [Customer, TrialSupportAgent, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output:
      variant_in_effect: string
      gross_refundable_cents: integer
      proration_deduction_cents: integer
      bundle_unwind_cents: integer
      damage_offset_cents: integer
      provisional_refund_cents: integer
      final_refund_cents: integer
      variant_delta_cents: integer
    side_effects: []
  - method: POST
    path: "/return-cases/{id}/cancel"
    description: "Customer withdraws the return request; the order returns to the trial window and the refund pricing is discarded."
    roles: [Customer, TrialSupportAgent]
    code: 200
    input: []
    output: ReturnCase
    side_effects: ["logistics_status -> CANCELLED and financial_status -> VOID", "TrialOrder.trial_status -> TRIAL_ACTIVE and TrialOrder.version increments by 1", "cancels any BOOKED PickupAppointment and returns its units to the route"]
  - method: POST
    path: "/return-cases/{id}/inspect"
    description: "Warehouse grades the returned unit; the grade and soil flag price the damage offset and gate donation eligibility."
    roles: [LogisticsCoordinator]
    code: 200
    input: [condition_grade, soil_flag, accessory_returned]
    output: ReturnCase
    side_effects: ["stores condition_grade, soil_flag and accessory_returned", "runs calculations.damage_offset to set damage_offset_cents and calculations.bundle_unwind to set bundle_unwind_cents", "runs the PROVISIONAL variant of calculations.refund_settlement to set proration_deduction_cents and provisional_refund_cents", "logistics_status PICKED_UP -> INSPECTED", "increments ReturnCase.version by 1"]
  - method: POST
    path: "/return-cases/{id}/disposition"
    description: "Choose donation versus recycle; the system selects the partner by waterfall and books a day of intake capacity."
    roles: [LogisticsCoordinator]
    code: 200
    input: [disposition, intake_date]
    output: DispositionAssignment
    side_effects: ["runs calculations.disposition_partner_selection to pick the partner and set fee_cents and fallback_applied", "creates a DispositionAssignment in ASSIGNED", "ReturnCase.disposition is set and logistics_status INSPECTED -> DISPOSITIONED", "increments ReturnCase.version by 1"]

  # --- pickup routing ---------------------------------------------------------
  - method: POST
    path: "/pickup-routes"
    description: "Create a regional pickup route in DRAFT with a service window and unit capacity."
    roles: [LogisticsCoordinator]
    code: 201
    input: [region_code, route_date, window_start_at, window_end_at, capacity_units, "buffer_minutes?"]
    output: PickupRoute
    side_effects: ["initialises booked_units 0 and available_units equal to capacity_units"]
  - method: GET
    path: "/pickup-routes/{id}"
    description: "Read one pickup route with its capacity ledger."
    roles: [LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: PickupRoute
    side_effects: []
  - method: POST
    path: "/pickup-routes/{id}/publish"
    description: "Publish the route so appointments may be booked against it."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: PickupRoute
    side_effects: ["status DRAFT -> PUBLISHED", "increments PickupRoute.version by 1"]
  - method: POST
    path: "/pickup-appointments"
    description: "Book a pickup slot on a published route under optimistic concurrency on the route's capacity ledger."
    roles: [LogisticsCoordinator]
    code: 201
    input: [route_id, return_case_id, slot_start_at, slot_end_at, expected_pickup_route_version]
    output: PickupAppointment
    side_effects: ["runs calculations.pickup_units to size the booking from the mattress size", "adds units to PickupRoute.booked_units and subtracts them from available_units", "ReturnCase.logistics_status REQUESTED -> PICKUP_SCHEDULED and ReturnCase.version increments by 1", "increments PickupRoute.version by 1"]
  - method: GET
    path: "/pickup-appointments/{id}"
    description: "Read one pickup appointment."
    roles: [LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: []
  - method: GET
    path: "/pickup-appointments"
    description: "List pickup appointments filtered by route, return case, or status."
    roles: [LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: ["route_id?", "return_case_id?", "status?", "limit?", "offset?"]
    output: PickupAppointment[]
    side_effects: []
  - method: POST
    path: "/pickup-appointments/{id}/complete"
    description: "Close out the visit. outcome COMPLETED drives the four-hop pickup cascade; outcome MISSED releases the slot's capacity without touching the return case."
    roles: [LogisticsCoordinator]
    code: 200
    input: [outcome]
    output: PickupAppointment
    side_effects: ["COMPLETED: ReturnCase.logistics_status -> PICKED_UP, picked_up_at stamped, nights_used frozen from the logical clock", "COMPLETED: TrialOrder.trial_status -> RETURNED and fulfillment_status -> CLOSED, nights_slept frozen", "COMPLETED: Customer.completed_return_count increments, a REPEAT_RETURN TrialAbuseSignal is appended, plus a SHORT_TRIAL signal when nights_used is under SHORT_TRIAL_NIGHTS", "COMPLETED: both Customer abuse-score variants recomputed, Customer.status and trial_block_until re-derived", "MISSED: units returned to PickupRoute.booked_units / available_units", "increments PickupAppointment.version and PickupRoute.version by 1"]
  - method: POST
    path: "/pickup-appointments/{id}/cancel"
    description: "Cancel a booked slot and return its capacity to the route."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: ["subtracts units from PickupRoute.booked_units and adds them back to available_units", "ReturnCase.logistics_status PICKUP_SCHEDULED -> REQUESTED and ReturnCase.version increments by 1", "increments PickupRoute.version by 1"]
  - method: GET
    path: "/disposition-assignments/{id}"
    description: "Read one disposition assignment."
    roles: [LogisticsCoordinator, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: DispositionAssignment
    side_effects: []
  - method: GET
    path: "/disposition-assignments"
    description: "List disposition assignments filtered by return case, partner, intake date, or status."
    roles: [LogisticsCoordinator, FinanceController, PlatformAdmin]
    code: 200
    input: ["return_case_id?", "partner_id?", "intake_date?", "status?", "limit?", "offset?"]
    output: DispositionAssignment[]
    side_effects: []
  - method: POST
    path: "/disposition-assignments/{id}/confirm-intake"
    description: "The charity or recycler confirms or rejects physical intake; only a DELIVERED assignment unlocks refund authorization."
    roles: [LogisticsCoordinator]
    code: 200
    input: [outcome]
    output: DispositionAssignment
    side_effects: ["DELIVERED: unlocks refund authorization for the return case", "REJECTED: releases the booked intake-day capacity and returns ReturnCase.logistics_status to INSPECTED, incrementing ReturnCase.version by 1"]

  # --- refunds ----------------------------------------------------------------
  - method: POST
    path: "/refund-authorizations"
    description: "Authorize the FINAL refund for an inspected, dispositioned return case under optimistic concurrency on the return case. Supplying supersedes_refund_id re-authorizes after a void."
    roles: [FinanceController]
    code: 201
    input: [return_case_id, expected_return_case_version, "supersedes_refund_id?"]
    output: RefundAuthorization
    side_effects: ["runs the FINAL variant of calculations.refund_settlement to set gross_refundable_cents, proration_deduction_cents, bundle_unwind_cents, damage_offset_cents and net_refund_cents", "copies net_refund_cents into ReturnCase.final_refund_cents and moves ReturnCase.financial_status PENDING -> AUTHORIZED", "records authorized_by_user_id from the X-User-ID header", "increments ReturnCase.version by 1"]
  - method: GET
    path: "/refund-authorizations/{id}"
    description: "Read one refund authorization with its full deduction breakdown."
    roles: [Customer, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: RefundAuthorization
    side_effects: []
  - method: GET
    path: "/refund-authorizations"
    description: "List refund authorizations filtered by order, return case, superseded predecessor, or status."
    roles: [Customer, FinanceController, PlatformAdmin]
    code: 200
    input: ["order_id?", "return_case_id?", "supersedes_refund_id?", "status?", "limit?", "offset?"]
    output: RefundAuthorization[]
    side_effects: []
  - method: POST
    path: "/refund-authorizations/{id}/release"
    description: "Release the authorized refund to the customer. The releasing operator must differ from the authorizing operator."
    roles: [FinanceController]
    code: 200
    input: []
    output: RefundAuthorization
    side_effects: ["status AUTHORIZED -> RELEASED and released_at stamped from the logical clock", "records released_by_user_id from the X-User-ID header", "adds net_refund_cents to TrialOrder.refunded_total_cents, subtracts it from TrialOrder.outstanding_refundable_cents and moves the non-refunded remainder into TrialOrder.retained_amount_cents so the money invariant holds", "ReturnCase.financial_status AUTHORIZED -> RELEASED", "increments TrialOrder.version and ReturnCase.version by 1"]
  - method: POST
    path: "/refund-authorizations/{id}/void"
    description: "Void an authorization or claw back a released refund; every ledger movement made by the release is reversed exactly."
    roles: [FinanceController]
    code: 200
    input: [void_reason]
    output: RefundAuthorization
    side_effects: ["status -> VOIDED and voided_at stamped from the logical clock", "when voiding a RELEASED refund: subtracts net_refund_cents from TrialOrder.refunded_total_cents, restores it to TrialOrder.outstanding_refundable_cents and returns TrialOrder.retained_amount_cents to its pre-release value", "ReturnCase.financial_status -> VOID", "increments TrialOrder.version and ReturnCase.version by 1"]

  # --- retail partner attribution and price match -----------------------------
  - method: POST
    path: "/attribution-claims"
    description: "A retail partner claims sales attribution commission or a price match on an order, with supporting evidence links."
    roles: [RetailPartner, PlatformAdmin]
    code: 201
    input: [partner_id, order_id, claim_type, evidence_url_count, "competitor_price_cents?"]
    output: AttributionClaim
    side_effects: ["stamps submitted_at from the logical clock", "enforces the partner's attribution window and price-match policy"]
  - method: GET
    path: "/attribution-claims/{id}"
    description: "Read one attribution claim with its priced commission or price-match credit."
    roles: [RetailPartner, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: AttributionClaim
    side_effects: []
  - method: GET
    path: "/attribution-claims"
    description: "List attribution claims filtered by partner, order, type, or status."
    roles: [RetailPartner, FinanceController, PlatformAdmin]
    code: 200
    input: ["partner_id?", "order_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: AttributionClaim[]
    side_effects: []
  - method: POST
    path: "/attribution-claims/{id}/review"
    description: "Finance takes the claim under review (action ACCEPT_FOR_REVIEW) or sends a reviewed claim back for one more revision round (action REQUEST_REVISION)."
    roles: [FinanceController]
    code: 200
    input: [action]
    output: AttributionClaim
    side_effects: ["action ACCEPT_FOR_REVIEW: status SUBMITTED -> UNDER_REVIEW", "action REQUEST_REVISION: status UNDER_REVIEW -> REVISION_REQUESTED, refused once revision_round_count has reached MAX_REVISION_ROUNDS", "increments AttributionClaim.version by 1"]
  - method: POST
    path: "/attribution-claims/{id}/resubmit"
    description: "The partner supplies more evidence and resubmits, consuming one revision round."
    roles: [RetailPartner]
    code: 200
    input: [evidence_url_count, "competitor_price_cents?"]
    output: AttributionClaim
    side_effects: ["replaces evidence_url_count and competitor_price_cents", "increments revision_round_count by 1", "status REVISION_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/attribution-claims/{id}/resolve"
    description: "Finance approves (decision APPROVE) or rejects (decision REJECT) the reviewed claim; approval prices the commission or the capped price-match credit and posts it to the order."
    roles: [FinanceController]
    code: 200
    input: [decision]
    output: AttributionClaim
    side_effects: ["decision APPROVE: runs calculations.attribution_settlement to set commission_cents and price_match_credit_cents", "decision APPROVE with claim_type PRICE_MATCH: adds price_match_credit_cents to TrialOrder.price_match_credit_cents, incrementing TrialOrder.version by 1; the refundable principal (paid_amount_cents, outstanding_refundable_cents, retained_amount_cents) is never touched, so paid_amount_cents == refunded_total_cents + outstanding_refundable_cents + retained_amount_cents still holds", "stamps resolved_at from the logical clock", "increments AttributionClaim.version by 1"]

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Authentication required"
    triggered_by: "any endpoint called without the X-User-ID and X-User-Role headers"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message_template: "Role {role} may not perform this operation"
    triggered_by: "a role outside the endpoint's roles list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Invalid request: {detail}"
    triggered_by: "missing required input field, unknown enum value, non-integer money field, or malformed timestamp"
  - error_id: ERR_NOT_OWNER
    http_status: 403
    message_template: "Customer {user_id} does not own resource {resource_id}"
    triggered_by: "a Customer acting on a trial order, return case, exchange, claim or refund belonging to another customer"
  - error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    message_template: "Customer {customer_id} not found"
    triggered_by: "unknown customer id in a path or in a body FK"
  - error_id: ERR_CATALOG_NOT_FOUND
    http_status: 404
    message_template: "Catalog record {record_id} not found"
    triggered_by: "unknown model_id or bundle_id in a body FK"
  - error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    message_template: "Partner {partner_id} not found"
    triggered_by: "unknown retail_partner_id or disposition partner id"
  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    message_template: "Trial order {order_id} not found"
    triggered_by: "unknown trial order id in a path or in a body FK"
  - error_id: ERR_RETURN_CASE_NOT_FOUND
    http_status: 404
    message_template: "Return case {return_case_id} not found"
    triggered_by: "unknown return case id in a path or in a body FK"
  - error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    message_template: "Pickup route {route_id} not found"
    triggered_by: "unknown pickup route id in a path or in a body FK"
  - error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    message_template: "Pickup appointment {appointment_id} not found"
    triggered_by: "unknown pickup appointment id in a path"
  - error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    message_template: "Disposition assignment {assignment_id} not found"
    triggered_by: "unknown disposition assignment id in a path"
  - error_id: ERR_REFUND_NOT_FOUND
    http_status: 404
    message_template: "Refund authorization {refund_id} not found"
    triggered_by: "unknown refund id in a path or in supersedes_refund_id"
  - error_id: ERR_EXCHANGE_NOT_FOUND
    http_status: 404
    message_template: "Comfort exchange {exchange_id} not found"
    triggered_by: "unknown comfort exchange id in a path"
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    message_template: "Quality claim {claim_id} not found"
    triggered_by: "unknown quality claim id in a path"
  - error_id: ERR_ATTRIBUTION_CLAIM_NOT_FOUND
    http_status: 404
    message_template: "Attribution claim {claim_id} not found"
    triggered_by: "unknown attribution claim id in a path"
  - error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    message_template: "Trial order is in {dimension} state {state}; {operation} is not permitted"
    triggered_by: "dispatching a delivered order, delivering twice, keeping a returned order, filing a claim on a closed order, or requesting a return on an order that was never delivered"
  - error_id: ERR_INVALID_RETURN_STATE
    http_status: 409
    message_template: "Return case is in state {state}; {operation} is not permitted"
    triggered_by: "inspecting before pickup, dispositioning before inspection, cancelling after pickup, or authorizing a refund on a cancelled case"
  - error_id: ERR_ROUTE_NOT_PUBLISHED
    http_status: 409
    message_template: "Pickup route {route_id} is in DRAFT and cannot accept appointments"
    triggered_by: "booking an appointment on a route that has not been published"
  - error_id: ERR_INVALID_APPOINTMENT_STATE
    http_status: 409
    message_template: "Pickup appointment is in state {state}; {operation} is not permitted"
    triggered_by: "completing or cancelling an appointment that is not BOOKED"
  - error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    message_template: "Quality claim is in state {state}; {operation} is not permitted"
    triggered_by: "adjudicating a settled claim, submitting evidence when none was requested, or settling a claim that was not approved for CREDIT"
  - error_id: ERR_INVALID_ATTRIBUTION_STATE
    http_status: 409
    message_template: "Attribution claim is in state {state}; {operation} is not permitted"
    triggered_by: "resolving a claim that is not UNDER_REVIEW, or resubmitting a claim that is not REVISION_REQUESTED"
  - error_id: ERR_INVALID_EXCHANGE_STATE
    http_status: 409
    message_template: "Comfort exchange is in state {state}; {operation} is not permitted"
    triggered_by: "approving or declining an exchange that has already been decided"
  - error_id: ERR_INVALID_REFUND_STATE
    http_status: 409
    message_template: "Refund authorization is in state {state}; {operation} is not permitted"
    triggered_by: "releasing a voided refund, releasing twice, or voiding an already-voided refund"
  - error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    message_template: "Disposition assignment is in state {state}; {operation} is not permitted"
    triggered_by: "confirming intake on an assignment that is not ASSIGNED"
  - error_id: ERR_DISPOSITION_NOT_CONFIRMED
    http_status: 409
    message_template: "Return case {return_case_id} has no DELIVERED disposition assignment"
    triggered_by: "authorizing a refund before the charity or recycler has confirmed intake"
  - error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    message_template: "Pickup route {route_id} version {expected} no longer current (now {actual})"
    triggered_by: "POST /pickup-appointments with an expected_pickup_route_version that does not equal the route's current version"
  - error_id: ERR_STALE_RETURN_CASE_VERSION
    http_status: 412
    message_template: "Return case {return_case_id} version {expected} no longer current (now {actual})"
    triggered_by: "POST /refund-authorizations with an expected_return_case_version that does not equal the return case's current version"
  - error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    message_template: "Trial order {order_id} version {expected} no longer current (now {actual})"
    triggered_by: "POST /comfort-exchanges/{id}/approve with an expected_trial_order_version that does not equal the original order's current version"
  - error_id: ERR_TRIAL_ABUSE_BLOCK
    http_status: 403
    message_template: "Customer {customer_id} is BLOCKED from trials until {trial_block_until}"
    triggered_by: "opening a trial order or requesting a comfort exchange for a customer whose lifetime abuse score has reached ABUSE_BLOCK_THRESHOLD"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message_template: "User {user_id} already performed the {prior_step} step and may not perform {current_step}"
    triggered_by: "the same X-User-ID releasing a refund it authorized, or settling a quality claim it approved"
  - error_id: ERR_BREAK_IN_NOT_ELAPSED
    http_status: 422
    message_template: "Minimum break-in window ends at {break_in_ends_at}; returns and exchanges open at that instant"
    triggered_by: "opening a return case or requesting a comfort exchange before the model's break-in nights have elapsed"
  - error_id: ERR_TRIAL_WINDOW_EXPIRED
    http_status: 422
    message_template: "Trial window closed at {trial_ends_at}"
    triggered_by: "opening a return case or requesting a comfort exchange after the trial window has closed"
  - error_id: ERR_RECOVERY_WINDOW_NOT_ELAPSED
    http_status: 422
    message_template: "Compression recovery requires at least {required_nights} nights after delivery"
    triggered_by: "filing a COMPRESSION_RECOVERY quality claim before COMPRESSION_RECOVERY_WAIT_NIGHTS have elapsed"
  - error_id: ERR_DAMAGE_REPORT_WINDOW_CLOSED
    http_status: 422
    message_template: "Delivery damage must be reported within {window_nights} nights of delivery"
    triggered_by: "filing a SHIPPING_DAMAGE quality claim after DAMAGE_REPORT_WINDOW_NIGHTS have elapsed"
  - error_id: ERR_ATTRIBUTION_WINDOW_CLOSED
    http_status: 422
    message_template: "Partner {partner_id} attribution window of {window_days} days closed at {deadline}"
    triggered_by: "submitting an attribution or price-match claim after the partner's attribution window has closed"
  - error_id: ERR_HOUSEHOLD_TRIAL_LIMIT
    http_status: 422
    message_template: "Household {household_hash} already has {count} trials in the rolling window"
    triggered_by: "opening a trial order for a household that already holds the maximum number of live trials"
  - error_id: ERR_DUPLICATE_ACTIVE_RETURN
    http_status: 409
    message_template: "Trial order {order_id} already has an open return case {return_case_id}"
    triggered_by: "opening a second return case while one is neither CANCELLED nor fully dispositioned"
  - error_id: ERR_EXCHANGE_LIMIT_REACHED
    http_status: 422
    message_template: "Exchange chain already used {count} of {max} permitted comfort exchanges"
    triggered_by: "requesting an exchange when the chain depth has reached MAX_EXCHANGES_PER_CHAIN"
  - error_id: ERR_MODEL_SIZE_MISMATCH
    http_status: 422
    message_template: "Target model size {target_size} does not match original size {original_size}"
    triggered_by: "requesting a comfort exchange to a model of a different size"
  - error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    message_template: "{required} items of evidence required, {supplied} supplied"
    triggered_by: "a quality claim whose photo count is below the minimum for its measurement method, or an attribution claim below MIN_CLAIM_EVIDENCE evidence links"
  - error_id: ERR_INDENTATION_BELOW_THRESHOLD
    http_status: 422
    message_template: "Measured indentation {measured_mm}mm is below the warranty threshold {threshold_mm}mm"
    triggered_by: "approving a WARRANTY_INDENTATION claim whose measurement does not reach the model's warranty threshold"
  - error_id: ERR_ROUND_LIMIT_REACHED
    http_status: 422
    message_template: "Only {max} additional {round_kind} rounds are permitted"
    triggered_by: "requesting a further evidence round on a quality claim, or a further revision round on an attribution claim, past the configured maximum"
  - error_id: ERR_ATTRIBUTION_CHANNEL_MISMATCH
    http_status: 422
    message_template: "Order {order_id} was not attributed to partner {partner_id}"
    triggered_by: "a SALES_ATTRIBUTION claim on an order whose retail_partner_id is unset or belongs to another partner"
  - error_id: ERR_PRICE_MATCH_NOT_OFFERED
    http_status: 422
    message_template: "Partner {partner_id} price-match policy is {policy}"
    triggered_by: "a PRICE_MATCH claim against a partner whose price_match_policy is NO_MATCH"
  - error_id: ERR_SLOT_OUTSIDE_ROUTE_WINDOW
    http_status: 422
    message_template: "Slot {slot_start_at}..{slot_end_at} falls outside route window {window_start_at}..{window_end_at}"
    triggered_by: "booking an appointment whose slot is not fully contained in the route's service window"
  - error_id: ERR_SLOT_OVERLAP
    http_status: 409
    message_template: "Slot overlaps appointment {appointment_id} once the {buffer_minutes} minute buffer is applied"
    triggered_by: "booking a slot whose buffer-extended half-open interval intersects a BOOKED or COMPLETED slot on the same route"
  - error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    message_template: "Route {route_id} has {available_units} units available, {requested_units} requested"
    triggered_by: "booking an appointment whose sized units exceed the route's remaining capacity"
  - error_id: ERR_DONATION_INELIGIBLE
    http_status: 422
    message_template: "Condition grade {grade} with soil flag {soil_flag} is not donatable for model {model_id}"
    triggered_by: "choosing DONATION for a unit that fails the donation pre-filter"
  - error_id: ERR_NO_DISPOSITION_PARTNER
    http_status: 422
    message_template: "No eligible disposition partner in region {region_code} for intake date {intake_date}"
    triggered_by: "the disposition waterfall exhausting both the charity and the recycler pools"
  - error_id: ERR_PARTNER_INTAKE_CAPACITY_EXCEEDED
    http_status: 422
    message_template: "Partner {partner_id} intake capacity for {intake_date} is exhausted"
    triggered_by: "the only eligible partner already holding its daily intake units for the requested calendar day"
  - error_id: ERR_OPEN_QUALITY_CLAIM
    http_status: 409
    message_template: "Trial order {order_id} has open quality claim {claim_id}"
    triggered_by: "authorizing a refund while a quality claim on the order is still SUBMITTED or EVIDENCE_REQUESTED"
  - error_id: ERR_REFUND_SUPERSEDE_INVALID
    http_status: 409
    message_template: "Refund {refund_id} is {status} and cannot be superseded"
    triggered_by: "re-authorizing with a supersedes_refund_id that is not a VOIDED refund on the same return case"
  - error_id: ERR_NO_REFUNDABLE_BALANCE
    http_status: 422
    message_template: "Final refund computes to {net_refund_cents}; nothing is refundable"
    triggered_by: "deductions and offsets consuming the entire refundable balance"

# ---------------------------------------------------------------------------
# 1.7 Role Definitions
# ---------------------------------------------------------------------------
roles:
  - role: Customer
    identity: "entity_backed:Customer"
    description: "The trial household. X-User-ID must equal the Customer.id that owns the resource."
    exclusive_operations: ["POST /trial-orders/{id}/keep"]
    shared_operations: ["POST /return-cases", "POST /return-cases/{id}/cancel", "POST /comfort-exchanges", "POST /quality-claims", "POST /quality-claims/{id}/submit-evidence", "GET /trial-orders/{id}", "GET /trial-orders", "GET /return-cases/{id}", "GET /return-cases", "GET /return-cases/{id}/refund-summary", "GET /comfort-exchanges/{id}", "GET /comfort-exchanges", "GET /quality-claims/{id}", "GET /quality-claims", "GET /refund-authorizations/{id}", "GET /refund-authorizations", "GET /customers/{id}"]
  - role: RetailPartner
    identity: "entity_backed:RetailPartner"
    description: "A retail reseller. X-User-ID must equal the RetailPartner.id named in partner_id."
    exclusive_operations: ["POST /attribution-claims/{id}/resubmit"]
    shared_operations: ["POST /attribution-claims", "GET /attribution-claims/{id}", "GET /attribution-claims", "GET /trial-orders/{id}", "GET /trial-orders"]
  - role: TrialSupportAgent
    identity: opaque
    description: "Front-line trial support: opens orders, adjudicates comfort exchanges and quality claims."
    exclusive_operations: ["POST /quality-claims/{id}/request-evidence", "POST /quality-claims/{id}/adjudicate", "POST /comfort-exchanges/{id}/approve", "POST /comfort-exchanges/{id}/decline"]
    shared_operations: ["POST /customers", "POST /trial-orders", "POST /trial-orders/{id}/keep", "POST /return-cases", "POST /return-cases/{id}/cancel", "POST /comfort-exchanges", "POST /quality-claims", "POST /quality-claims/{id}/submit-evidence", "GET /customers/{id}", "GET /customers/{id}/abuse-signals", "GET /trial-orders/{id}", "GET /trial-orders", "GET /return-cases/{id}", "GET /return-cases", "GET /return-cases/{id}/refund-summary", "GET /comfort-exchanges/{id}", "GET /comfort-exchanges", "GET /quality-claims/{id}", "GET /quality-claims"]
  - role: LogisticsCoordinator
    identity: opaque
    description: "Reverse-logistics operations: dispatch, delivery, pickup routing, inspection and disposition."
    exclusive_operations: ["POST /trial-orders/{id}/dispatch", "POST /trial-orders/{id}/deliver", "POST /return-cases/{id}/inspect", "POST /return-cases/{id}/disposition", "POST /pickup-routes", "POST /pickup-routes/{id}/publish", "POST /pickup-appointments", "POST /pickup-appointments/{id}/complete", "POST /pickup-appointments/{id}/cancel", "POST /disposition-assignments/{id}/confirm-intake"]
    shared_operations: ["GET /disposition-partners", "GET /pickup-routes/{id}", "GET /pickup-appointments/{id}", "GET /pickup-appointments", "GET /disposition-assignments/{id}", "GET /disposition-assignments", "GET /trial-orders/{id}", "GET /trial-orders", "GET /return-cases/{id}", "GET /return-cases"]
  - role: FinanceController
    identity: opaque
    description: "Refund and partner settlement authority. Segregation of duties is enforced on X-User-ID between authorize/release and approve/settle."
    exclusive_operations: ["POST /refund-authorizations", "POST /refund-authorizations/{id}/release", "POST /refund-authorizations/{id}/void", "POST /quality-claims/{id}/settle", "POST /attribution-claims/{id}/review", "POST /attribution-claims/{id}/resolve"]
    shared_operations: ["GET /refund-authorizations/{id}", "GET /refund-authorizations", "GET /return-cases/{id}", "GET /return-cases", "GET /return-cases/{id}/refund-summary", "GET /trial-orders/{id}", "GET /trial-orders", "GET /quality-claims/{id}", "GET /quality-claims", "GET /attribution-claims/{id}", "GET /attribution-claims", "GET /disposition-assignments/{id}", "GET /disposition-assignments", "GET /customers/{id}", "GET /comfort-exchanges/{id}", "GET /comfort-exchanges"]
  - role: PlatformAdmin
    identity: opaque
    description: "Configuration and fraud operations: catalog, bundles, partners, abuse signals and the logical clock."
    exclusive_operations: ["POST /mattress-models", "POST /promotion-bundles", "POST /retail-partners", "POST /disposition-partners", "POST /trial-abuse-signals", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /customers", "POST /attribution-claims", "GET /customers/{id}", "GET /customers/{id}/abuse-signals", "GET /disposition-partners", "GET /trial-orders/{id}", "GET /trial-orders", "GET /return-cases/{id}", "GET /return-cases", "GET /return-cases/{id}/refund-summary", "GET /pickup-routes/{id}", "GET /pickup-appointments/{id}", "GET /pickup-appointments", "GET /disposition-assignments/{id}", "GET /disposition-assignments", "GET /refund-authorizations/{id}", "GET /refund-authorizations", "GET /comfort-exchanges/{id}", "GET /comfort-exchanges", "GET /quality-claims/{id}", "GET /quality-claims", "GET /attribution-claims/{id}", "GET /attribution-claims"]
