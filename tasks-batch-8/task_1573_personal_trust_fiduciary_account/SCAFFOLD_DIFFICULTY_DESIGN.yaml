            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Five", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm5: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 10000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 3000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv1}" }, as: Beneficiary, as_user_id: "${b_inc}", captures: { req1: $.data.id } }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req1}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req1}/request-information", payload: { info_request_note: "need invoice" }, as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req1}/provide-information", payload: { info_response_note: "invoice attached" }, as: Beneficiary, as_user_id: "${b_inc}" }
            - { call: "POST /trusts/distribution-requests/${req1}/request-information", payload: { info_request_note: "need second quote" }, as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req1}/provide-information", payload: { info_response_note: "second quote attached" }, as: Beneficiary, as_user_id: "${b_inc}" }
            - { call: "POST /trusts/distribution-requests/${req1}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "EDUCATION", expected_trust_account_version: "${tv2}" }, as: Beneficiary, as_user_id: "${b_inc}", captures: { req2: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req2}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req2}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req2}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req2}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req2}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm4}" }
          assert:
            - "DistributionRequest.${req1}.status == APPROVED after the third APPROVE vote; the information cycle ran twice without error"
            - "DistributionRequest.${req1}.income_portion_cents == 3000000 and principal_portion_cents == 0"
            - "DistributionRequest.${req2}.status == DECLINED after the third DECLINE vote"
            - "TrustAccount.${trust_id}.reserved_income_cents == 3000000 (req1 reservation kept, req2 reservation of 1000000 released on DECLINED)"
            - "TrustAccount.${trust_id}.available_income_cents == 2000000"

      - name: tax_filing_amendment_cycle
        grounds:
          - state_machines.TaxReturnFiling.FILED_to_AMENDMENT_REQUIRED
          - state_machines.TaxReturnFiling.AMENDMENT_REQUIRED_to_DATA_COLLECTION
        distinguishing_aspect: |
          Non-linear machine on TaxReturnFiling (a different entity than DistributionRequest): the
          FILED -> AMENDMENT_REQUIRED -> DATA_COLLECTION amendment loop increments amendment_number,
          clears preparer/reviewer, and permits a full second pass to FILED.
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust with one INTEREST receipt of 10,000.00 in 2026; no fee assessments"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Amend Trust", trust_type: "IRREVOCABLE", grantor_name: "G Eight", governing_state: "NY", ein: "04-8888888", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-09-01", description: "interest" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
          trigger:
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_a" }
            - { call: "POST /trusts/tax-return-filings/${fil}/submit-for-review", as: TaxSpecialist, as_user_id: "tax_a" }
            - { call: "POST /trusts/tax-return-filings/${fil}/approve-review", as: TaxSpecialist, as_user_id: "tax_b" }
            - { call: "POST /trusts/tax-return-filings/${fil}/require-amendment", payload: { reason: "IRS notice" }, as: TaxSpecialist, as_user_id: "tax_b" }
            - { call: "POST /trusts/tax-return-filings/${fil}/begin-amendment", as: TaxSpecialist, as_user_id: "tax_a" }
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_a" }
            - { call: "POST /trusts/tax-return-filings/${fil}/submit-for-review", as: TaxSpecialist, as_user_id: "tax_a" }
            - { call: "POST /trusts/tax-return-filings/${fil}/approve-review", as: TaxSpecialist, as_user_id: "tax_b" }
          assert:
            - "After first approve-review: status == FILED, prepared_by_user_id == 'tax_a', reviewed_by_user_id == 'tax_b'"
            - "After begin-amendment: status == DATA_COLLECTION and amendment_number == 1"
            - "After the second full pass: status == FILED again (cyclic machine), dni_cents == 1000000"

  - rule_id: transitive_cascade
    instances:
      - name: price_update_to_trust_suspension
        grounds:
          - state_machines.InvestmentHolding.OPEN_to_CLOSED
          - calculations.ips_drift_measurement
          - state_machines.TrustAccount.ACTIVE_to_SUSPENDED
          - entities.ComplianceReview.fields.severity
        distinguishing_aspect: |
          Cascade of depth 4 triggered by a price update: (1) holding market_value recomputed, which
          (2) recomputes trust total_market_value and reruns the drift check, which (3) updates the
          existing EQUITY review in place to severity CRITICAL, which (4) auto-transitions the trust
          ACTIVE -> SUSPENDED. Each hop is caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "ACTIVE trust; ACTIVE IPS (equity target 60.00 band 5.00; fixed_income target 0.00 band 5.00) effective [2026-08-01, 2027-08-01)"
            - "IPS activation on the all-cash trust opened one STANDARD UNDERWEIGHT EQUITY review"
            - "Funded 1,000,000.00; three equity holdings bought: AAA 250,000.00, BBB 250,000.00, CCC 150,000.00 (each <= 25% concentration edge); cash 350,000.00"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Cascade Trust", trust_type: "IRREVOCABLE", grantor_name: "G Nine", governing_state: "DE", ein: "04-9999999", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2026-08-01", effective_to: "2027-08-01", equity_target_pct: 60.00, equity_band_pct: 5.00, fixed_income_target_pct: 0.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips: $.data.id } }
            - { call: "POST /trusts/investment-policy-statements/${ips}/activate", as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager, captures: { h1: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv2}" }, as: InvestmentManager, captures: { h2: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv3: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "CCC", units: 1000, unit_price_cents: 15000, expected_trust_account_version: "${tv3}" }, as: InvestmentManager, captures: { h3: $.data.id } }
          trigger:
            - { call: "POST /trusts/investment-holdings/${h3}/update-price", payload: { unit_price_cents: 15010, priced_at: "2026-10-01T00:00:00Z" }, as: InvestmentManager }
            - { call: "GET /trusts/compliance-reviews", payload: { trust_id: "${trust_id}" }, as: InvestmentManager }
            - { call: "POST /trusts/investment-holdings/${h3}/update-price", payload: { unit_price_cents: 81667, priced_at: "2026-10-02T00:00:00Z" }, as: InvestmentManager }
          assert:
            - "After the first update-price: InvestmentHolding.${h3}.market_value_cents == 15010000 and TrustAccount.total_market_value_cents == 100010000"
            - "Exactly one non-RESOLVED ComplianceReview exists for (trust, EQUITY); it was updated in place to direction OVERWEIGHT, severity STANDARD, measured_weight_pct == 65.00 (raw 0.6500350 > 0.65 breaches; display rounds to 65.00)"
            - "TrustAccount.status is still ACTIVE after the first update"
            - "After the second update-price (CCC MV 81,667,000; class weight raw 0.79000042 > 0.70): the SAME review is severity CRITICAL and TrustAccount.${trust_id}.status == SUSPENDED (auto-suspend hop)"

      - name: disburse_to_statement_supersede
        grounds:
          - state_machines.DistributionRequest.APPROVED_to_DISBURSED
          - state_machines.AnnualStatement.FINALIZED_to_SUPERSEDED
          - calculations.account_balances
        distinguishing_aspect: |
          Cascade of depth 3 triggered by disbursement (a different trigger than the price-update
          cascade): (1) a DISTRIBUTION LedgerEntry is appended, which (2) recomputes the trust's
          income balance and releases the reservation, which (3) supersedes the FINALIZED annual
          statement whose fiscal year covers the disbursement date.
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary Ivy (10000 bps); five ACTIVE committee members"
            - "Funded: INITIAL_FUNDING 100,000.00 + INTEREST 50,000.00 (both 2026 value dates)"
            - "AnnualStatement for fiscal_year 2026 generated and FINALIZED"
            - "Distribution request of 10,000.00 INCOME_ONLY approved by exactly 3 committee votes"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Supersede Trust", trust_type: "IRREVOCABLE", grantor_name: "G Ten", governing_state: "DE", ein: "04-1010101", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Four", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Five", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 10000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/annual-statements", payload: { trust_id: "${trust_id}", fiscal_year: 2026 }, as: TrustOfficer, captures: { stmt: $.data.id } }
            - { call: "POST /trusts/annual-statements/${stmt}/finalize", as: TrustOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/disburse", as: TrustOperationsOfficer }
            - call: "GET /trusts/ledger-entries"
              payload: { trust_id: "${trust_id}", entry_kind: "DISTRIBUTION" }
              as: TrustOperationsOfficer
              captures: { dist_amount: "$.data[0].amount_cents", dist_bucket: "$.data[0].bucket" }
            - { call: "GET /trusts/annual-statements/${stmt}", as: TrustOfficer }
          assert:
            - "DistributionRequest.${req}.status == DISBURSED"
            - "Hop 1: exactly one DISTRIBUTION LedgerEntry exists with amount_cents == -1000000 and bucket == INCOME"
            - "Hop 2: TrustAccount.income_balance_cents == 4000000 and reserved_income_cents == 0 and available_income_cents == 4000000"
            - "Hop 3: AnnualStatement.${stmt}.status == SUPERSEDED (stale after the in-year ledger append)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_disburse
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_REQUEST_NOT_APPROVED]
          - errors[ERR_INSUFFICIENT_AVAILABLE_BALANCE]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a disburse attempt that violates at once
          both the state precondition (request DECLINED, not APPROVED) and the fiscal rule
          (portions 45,000.00 exceed available income 30,000.00) must return the state-category error.
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary Ivy; five ACTIVE members; income 50,000.00, principal 100,000.00"
            - "Request of 45,000.00 INCOME_ONLY reached VOTING (reservation succeeded) and was then DECLINED 3-0; reservation released"
            - "An ADJUSTMENT of -20,000.00 to INCOME then reduced available_income to 30,000.00"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Priority Trust A", trust_type: "IRREVOCABLE", grantor_name: "G Eleven", governing_state: "DE", ein: "04-1111112", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 10000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 4500000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "DECLINE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "ADJUSTMENT", bucket: "INCOME", amount_cents: -2000000, value_date: "2026-08-20", description: "correction of misposted interest" }, as: TrustOperationsOfficer }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/disburse", as: TrustOperationsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_REQUEST_NOT_APPROVED (state priority 6 beats fiscal priority 11), NOT ERR_INSUFFICIENT_AVAILABLE_BALANCE"
            - "http status == 409"
            - "TrustAccount.income_balance_cents == 3000000 and no DISTRIBUTION ledger row was appended"

      - name: safety_beats_referential_on_request_create
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PURPOSE_OUTSIDE_STANDARD]
          - errors[ERR_CROSS_TRUST_REFERENCE]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_referential) - a different pair than
          state-vs-fiscal: creating a request whose purpose violates the HEMS standard AND whose
          beneficiary belongs to a different trust must return the safety error.
        test_recipe:
          setup:
            - "Trust A (HEMS, ACTIVE) with income beneficiary Ivy; Trust B (HEMS, ACTIVE) with no beneficiaries"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Safety Trust A", trust_type: "IRREVOCABLE", grantor_name: "G Twelve", governing_state: "DE", ein: "04-1212121", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { ta: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${ta}", full_name: "Ivy A", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { ben_a: $.data.id } }
            - { call: "POST /trusts/${ta}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${ta}/accept", as: TrustExecutive }
            - { call: "POST /trusts", payload: { trust_name: "Safety Trust B", trust_type: "IRREVOCABLE", grantor_name: "G Thirteen", governing_state: "DE", ein: "04-1313131", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { tb: $.data.id } }
            - { call: "POST /trusts/${tb}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${tb}/accept", as: TrustExecutive }
            - { call: "GET /trusts/${tb}", as: TrustOfficer, captures: { tbv: $.data.version } }
          trigger:
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${tb}", beneficiary_id: "${ben_a}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "TRAVEL", expected_trust_account_version: "${tbv}" }, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_PURPOSE_OUTSIDE_STANDARD (safety priority 7 beats referential priority 9), NOT ERR_CROSS_TRUST_REFERENCE"
            - "http status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_three_approves
        grounds:
          - calculations.committee_quorum_tally
          - state_machines.DistributionRequest.VOTING_to_APPROVED
        distinguishing_aspect: |
          Boundary on the vote-count metric reached via POST .../vote: approve_count must REACH
          quorum (>= 3) - the request stays VOTING at 1 and 2 approvals and flips to APPROVED at
          exactly the third APPROVE vote.
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary; five ACTIVE committee members; income 50,000.00; request of 10,000.00 INCOME_ONLY in VOTING"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Quorum Trust", trust_type: "IRREVOCABLE", grantor_name: "G Fourteen", governing_state: "DE", ein: "04-1414141", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "GET /trusts/distribution-requests/${req}", as: TrustOfficer, captures: { st1: $.data.status } }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "GET /trusts/distribution-requests/${req}", as: TrustOfficer, captures: { st2: $.data.status } }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "GET /trusts/distribution-requests/${req}", as: TrustOfficer, captures: { st3: $.data.status } }
          assert:
            - "After vote 1: status == VOTING and approve_count == 1"
            - "After vote 2: status == VOTING and approve_count == 2"
            - "After vote 3 (exactly QUORUM): status == APPROVED, approve_count == 3, decision_at is set"

      - name: drift_exact_band_edge_vs_just_over
        grounds:
          - calculations.ips_drift_measurement
          - entities.ComplianceReview.fields.measured_weight_pct
        distinguishing_aspect: |
          Boundary on the portfolio-weight metric reached via run-compliance-check / update-price
          (a different endpoint and metric than the vote count): an equity weight of exactly
          0.650000 opens no review (>= would; the rule is strict >), while 0.6500350 breaches even
          though the stored display rounds to 65.00.
        test_recipe:
          setup:
            - "ACTIVE trust; ACTIVE IPS (equity 60.00 +/- 5.00; fixed_income 0.00 +/- 5.00)"
            - "Funded 1,000,000.00; equity holdings AAA 250,000.00 + BBB 250,000.00 + CCC 150,000.00; cash 350,000.00 -> equity weight exactly 0.65"
            - "IPS activation earlier opened one STANDARD UNDERWEIGHT EQUITY review (all-cash at activation)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Edge Trust", trust_type: "IRREVOCABLE", grantor_name: "G Fifteen", governing_state: "DE", ein: "04-1515151", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2026-08-01", effective_to: "2027-08-01", equity_target_pct: 60.00, equity_band_pct: 5.00, fixed_income_target_pct: 0.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips: $.data.id } }
            - { call: "POST /trusts/investment-policy-statements/${ips}/activate", as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv2}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv3: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "CCC", units: 1000, unit_price_cents: 15000, expected_trust_account_version: "${tv3}" }, as: InvestmentManager, captures: { h3: $.data.id } }
          trigger:
            - { call: "POST /trusts/${trust_id}/run-compliance-check", as: InvestmentManager, captures: { opened0: $.data.opened_review_count } }
            - { call: "POST /trusts/investment-holdings/${h3}/update-price", payload: { unit_price_cents: 15010, priced_at: "2026-10-01T00:00:00Z" }, as: InvestmentManager }
            - { call: "GET /trusts/compliance-reviews", payload: { trust_id: "${trust_id}", status: "OPEN" }, as: InvestmentManager }
          assert:
            - "At the exact band edge (equity 65,000,000 / TMV 100,000,000 == 0.65): run-compliance-check returns opened_review_count == 0 (equality is NOT a breach)"
            - "After repricing CCC so equity is 65,010,000 / 100,010,000 (raw 0.6500350 > 0.65): exactly one OVERWEIGHT STANDARD review exists for EQUITY"
            - "The review's measured_weight_pct == 65.00 (rounded display) even though the raw ratio breached - decision uses the unrounded ratio"
            - "No FIXED_INCOME review exists (target 0.00 band 5.00 never breached at weight 0)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_voting_blocked_when_trust_suspended
        grounds:
          - state_machines.DistributionRequest.UNDER_REVIEW_to_VOTING
          - state_machines.TrustAccount.ACTIVE_to_SUSPENDED
          - errors[ERR_TRUST_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair DistributionRequest -> TrustAccount: open-voting is gated on the parent trust
          being ACTIVE; a suspended trust blocks it with ERR_TRUST_NOT_ACTIVE, and reinstatement
          (which itself requires zero non-RESOLVED reviews) re-enables the same transition.
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary; five ACTIVE members; income 50,000.00; request 10,000.00 INCOME_ONLY in UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Guard Trust", trust_type: "IRREVOCABLE", grantor_name: "G Sixteen", governing_state: "DE", ein: "04-1616161", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/suspend", payload: { reason: "executive hold" }, as: TrustExecutive }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /trusts/${trust_id}/reinstate", as: TrustExecutive }
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
          assert:
            - "First open-voting (trust SUSPENDED) fails: error_id == ERR_TRUST_NOT_ACTIVE, http 409"
            - "Reinstate succeeds because no non-RESOLVED ComplianceReview exists"
            - "Second open-voting succeeds: DistributionRequest.${req}.status == VOTING and reserved_income_cents == 1000000"

      - name: prepare_blocked_by_unposted_fee
        grounds:
          - state_machines.TaxReturnFiling.DATA_COLLECTION_to_PREPARED
          - entities.FeeAssessment.fields.status
          - errors[ERR_UNPOSTED_FEE_ASSESSMENTS]
        distinguishing_aspect: |
          Entity pair TaxReturnFiling -> FeeAssessment (a different pair than request-vs-trust):
          prepare is gated on every overlapping FINAL FeeAssessment being POSTED; a CALCULATED
          assessment blocks with ERR_UNPOSTED_FEE_ASSESSMENTS until it is disclosed and posted.
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust; principal funding 2,000,000.00; INTEREST receipt 10,000.00 (2026)"
            - "FINAL FeeAssessment for [2026-07-01, 2026-09-30] exists in CALCULATED (fee 4,375.00)"
            - "TaxReturnFiling for 2026 in DATA_COLLECTION"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Gate Trust", trust_type: "IRREVOCABLE", grantor_name: "G Seventeen", governing_state: "NY", ein: "04-1717171", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-09-10", description: "interest" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee: $.data.id } }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
          trigger:
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_a", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/fee-assessments/${fee}/disclose", as: TrustOperationsOfficer, as_user_id: "ops_disc" }
            - { call: "POST /trusts/fee-assessments/${fee}/post", as: TrustOperationsOfficer, as_user_id: "ops_post" }
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_a" }
          assert:
            - "First prepare fails: error_id == ERR_UNPOSTED_FEE_ASSESSMENTS, http 409"
            - "After disclose (ops_disc) + post (ops_post): FeeAssessment.${fee}.status == POSTED"
            - "Second prepare succeeds: dni_cents == 781250 (1,000,000 interest - 218,750 income fee portion)"
            - "trust_taxable_income_cents == 751250 (781250 - 0 distributions - 30000 exemption)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: ips_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.InvestmentPolicyStatement.fields.effective_from
          - errors[ERR_IPS_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN windows on InvestmentPolicyStatement - [2026-08-01, 2027-08-01)
          and [2027-08-01, 2028-08-01) abut and are BOTH accepted, while [2027-06-01, 2028-01-01)
          overlaps and is rejected. Abutment is legal here but illegal (a gap violation inverted) in
          the fee-tiling instance.
        test_recipe:
          setup:
            - "ACTIVE trust with an ACTIVE IPS covering [2026-08-01, 2027-08-01)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Window Trust", trust_type: "IRREVOCABLE", grantor_name: "G Eighteen", governing_state: "DE", ein: "04-1818181", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2026-08-01", effective_to: "2027-08-01", equity_target_pct: 60.00, equity_band_pct: 5.00, fixed_income_target_pct: 30.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips1: $.data.id } }
            - { call: "POST /trusts/investment-policy-statements/${ips1}/activate", as: InvestmentManager }
          trigger:
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2027-08-01", effective_to: "2028-08-01", equity_target_pct: 55.00, equity_band_pct: 5.00, fixed_income_target_pct: 35.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips2: $.data.id } }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2027-06-01", effective_to: "2028-01-01", equity_target_pct: 50.00, equity_band_pct: 5.00, fixed_income_target_pct: 40.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { err: $.data.error_id } }
          assert:
            - "Abutting statement [2027-08-01, 2028-08-01) created successfully (status DRAFT) - half-open adjacency is legal"
            - "Overlapping statement [2027-06-01, 2028-01-01) rejected: error_id == ERR_IPS_PERIOD_OVERLAP, http 409"
            - "InvestmentPolicyStatement.${ips1}.status == ACTIVE (unaffected by the rejected create)"

      - name: fee_period_gap_free_tiling
        grounds:
          - validations[priority=8]
          - errors[ERR_FEE_PERIOD_NOT_CONTIGUOUS]
        distinguishing_aspect: |
          Different interval semantics on a different resource: FINAL FeeAssessment periods are CLOSED
          intervals that must tile with neither overlap nor gap - [2026-10-01, 2026-12-31] after
          [2026-07-01, 2026-09-30] is legal (period_start == prior period_end + 1 day), while a gap
          start (2026-10-02) and an overlapping start (2026-09-15) are both rejected.
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust with principal cash 2,000,000.00"
            - "FINAL FeeAssessment A1 [2026-07-01, 2026-09-30] exists (CALCULATED)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Tile Trust", trust_type: "IRREVOCABLE", grantor_name: "G Nineteen", governing_state: "NY", ein: "04-1919191", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-10-01", period_end: "2026-12-31", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { a2: $.data.id } }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-10-02", period_end: "2026-12-31", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { err_gap: $.data.error_id } }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-09-15", period_end: "2026-10-15", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { err_ovl: "$.data.error_id" } }
          assert:
            - "Contiguous FINAL period [2026-10-01, 2026-12-31] created successfully"
            - "Gap start 2026-10-02 rejected: error_id == ERR_FEE_PERIOD_NOT_CONTIGUOUS, http 409"
            - "Overlap start 2026-09-15 rejected with the same error (tiling forbids both gaps and overlaps)"
            - "A PROVISIONAL assessment for any period is NOT subject to tiling (variant exclusion)"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_release_conserves_cents
        grounds:
          - calculations.account_balances
          - state_machines.DistributionRequest.VOTING_to_CANCELLED
          - entities.TrustAccount.fields.reserved_income_cents
        distinguishing_aspect: |
          Conserved quantity is CENTS: open-voting reserves 30,000.00 of income and cancelling the
          request releases exactly the same amount - the invariant income_balance_cents ==
          sum(INCOME ledger rows) AND reserved_income_cents == sum(portions over {VOTING, APPROVED})
          holds before, during, and after, with zero drift.
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary; five ACTIVE members; income 50,000.00 (INTEREST), principal 100,000.00"
            - "Request of 30,000.00 INCOME_FIRST progressed to VOTING (reservation applied)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Conserve Trust", trust_type: "IRREVOCABLE", grantor_name: "G Twenty", governing_state: "DE", ein: "04-2020202", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 10000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 3000000, allocation_source: "INCOME_FIRST", purpose_category: "EDUCATION", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { res_mid: $.data.reserved_income_cents, bal_mid: $.data.income_balance_cents } }
            - { call: "POST /trusts/distribution-requests/${req}/cancel", payload: { cancelled_reason: "beneficiary request" }, as: TrustOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { res_end: $.data.reserved_income_cents, avail_end: $.data.available_income_cents } }
          assert:
            - "After open-voting: reserved_income_cents == 3000000, income_balance_cents == 5000000, available_income_cents == 2000000"
            - "After cancel: reserved_income_cents == 0 and available_income_cents == 5000000 (exactly restored)"
            - "income_balance_cents == 5000000 at every observation (reserve/release never touches the ledger)"
            - "Sum over GET /trusts/ledger-entries?bucket=INCOME == 5000000 (ledger-derived balance invariant)"

      - name: share_reallocation_conserves_bps
        grounds:
          - calculations.share_reallocation
          - state_machines.Beneficiary.ACTIVE_to_DECEASED
          - entities.Beneficiary.fields.share_bps
        distinguishing_aspect: |
          Conserved quantity is BASIS POINTS (a different quantity than cents): marking beneficiary A
          (3333 bps) deceased redistributes exactly 3333 bps across survivors B/C via floor +
          largest-remainder (B gets 1666, C gets 1666 + 1 leftover = 1667), and the class sum is
          exactly 10000 before and after.
        test_recipe:
          setup:
            - "ACTIVE trust with APPROVED document per_stirpes=false; INCOME class A=3333, B=3333, C=3334 (created in that order)"
            - "A has a pending SUBMITTED distribution request"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Realloc Trust", trust_type: "IRREVOCABLE", grantor_name: "G Twentyone", governing_state: "TX", ein: "04-2121212", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "instrument" }, as: TrustOfficer, captures: { doc: $.data.id } }
            - { call: "POST /trusts/documents/${doc}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/interpret", payload: { per_stirpes: false, interpretation_notes: "lapse" }, as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/approve", as: TrustExecutive }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ann", beneficiary_class: "INCOME", share_bps: 3333, date_of_birth: "1950-01-01" }, as: TrustOfficer, captures: { b_a: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Bob", beneficiary_class: "INCOME", share_bps: 3333, date_of_birth: "1951-01-01" }, as: TrustOfficer, captures: { b_b: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Cid", beneficiary_class: "INCOME", share_bps: 3334, date_of_birth: "1952-01-01" }, as: TrustOfficer, captures: { b_c: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_a}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /trusts/beneficiaries/${b_a}/mark-deceased", payload: { deceased_at: "2026-09-01" }, as: TrustOfficer }
            - { call: "GET /trusts/beneficiaries/${b_b}", as: TrustOfficer, captures: { sh_b: $.data.share_bps } }
            - { call: "GET /trusts/beneficiaries/${b_c}", as: TrustOfficer, captures: { sh_c: $.data.share_bps } }
          assert:
            - "Beneficiary.${b_b}.share_bps == 4999 (3333 + floor(3333*3333/6667) = 3333 + 1666)"
            - "Beneficiary.${b_c}.share_bps == 5001 (3334 + 1666 + 1 largest-remainder leftover; frac 0.5833 > 0.4167)"
            - "4999 + 5001 == 10000 (class sum conserved exactly)"
            - "DistributionRequest.${req}.status == CANCELLED with cancelled_reason == BENEFICIARY_DECEASED (mark-deceased cascade hop 1)"
