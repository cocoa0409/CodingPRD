      - name: terminal_states_freeze_promo_action_item_and_program
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[PromoEvent].transitions
          - state_machines[AssortmentAction].transitions
          - state_machines[Item].transitions[BROKEN->MARKDOWN]
          - state_machines[AllocationProgram].transitions[ACTIVE->CLOSED]
          - validations[priority:8]
          - validations[priority:9]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_PROGRAM_LOCKED
        distinguishing_aspect: |
          Four terminal states are reached and then attacked from every declared trigger. The sharp corner is
          that a CLOSED program answers with TWO different codes depending on the request: a call that IS a
          declared program transition (activate, lock, close again) is refused by the priority-8 state rule
          with ERR_INVALID_STATE_TRANSITION, while a child DECISION (receipt create, snapshot create) is
          refused by the priority-9 program-status rule with ERR_PROGRAM_LOCKED. Executing the MARKDOWN action
          also drives the Item into its own terminal MARKDOWN, which is proved by re-running the detection
          sweep and getting zero new actions.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with store 0101, shelf plan capacity 24 / pmin 8, SizeProfile TOP-4SZ (all four sizes CORE) and SKU-1001"
            - "Position 0101 is empty -> broken_size_count 4, BROKEN, and the item is BROKEN"
            - "One detection sweep has raised a PENDING MARKDOWN action (markdown_pct_bp 4500, units_at_detection 0) and event BTS-A has been created and CANCELLED"
            - "No receipt, run or transfer exists, so the program close preconditions hold"
