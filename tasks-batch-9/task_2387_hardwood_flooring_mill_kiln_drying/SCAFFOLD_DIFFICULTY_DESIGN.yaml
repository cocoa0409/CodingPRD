  - rule_id: priority_pair_validation_conflict
    rule_summary: "Two requests each violate two rules from different categories at once; the lower-numbered priority must win and the other error must never surface."
    instances:
      - name: claim_state_beats_warranty_reserve_insufficient
        summary: "Adjudicating an INFO_REQUESTED claim on an underfunded line violates both priority 21 (claim state) and priority 51 (reserve insufficient); the response is ERR_CLAIM_STATE_INVALID."
        mechanism: "State validation (priority 21) is evaluated before business_fiscal validation (priority 51)."
        entities_touched: [WarrantyClaim, ProductLine]
        rules_referenced: [warranty_liability_dual_variant, product_line_posture]
        test_recipe:
          setup: "A SOLID line funded with only 100000 cents; a claim for 240 sq ft submitted by u_intake and then moved to INFO_REQUESTED. The adjudicated liability would be 151474, i.e. above the balance."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 100000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims/${claim_id}/request_info", payload: { info_request_note: "Send the subfloor moisture log" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "Response status 409 with data.error_id == \"ERR_CLAIM_STATE_INVALID\"."
            - "data.error_id is NOT \"ERR_WARRANTY_RESERVE_INSUFFICIENT\", even though 151474 > 100000."
            - "GET /mill/product-lines/{line_id} still shows warranty_balance_cents == 100000, warranty_committed_cents == 0 and posture == \"RESTRICTED\"."
            - "GET /mill/warranty-claims/{claim_id} still shows adjudication_status \"INFO_REQUESTED\" and adjudicated_liability_cents == null."
            - "After resubmit the same adjudicate call then returns ERR_WARRANTY_RESERVE_INSUFFICIENT, proving both rules were live."

      - name: lot_not_graded_beats_prefinish_window_invalid
        summary: "Scheduling a prefinish run for a MILLED lot with window_end before window_start violates priority 24 (business_safety) and priority 34 (business_temporal); the response is ERR_LOT_NOT_GRADED."
        mechanism: "business_safety (priority 24) is evaluated before business_temporal (priority 34)."
        entities_touched: [PrefinishRun, FlooringLot, PrefinishLine]
        rules_referenced: [prefinish_line_load_check]
