            - "after the first dmv-decision, TitleRecord.${tr}.state == REJECTED and rejection_count == 1"
            - "after the first resubmit, TitleRecord.${tr}.state == SUBMITTED and rejection_count == 1"
            - "after the second resubmit, TitleRecord.${tr}.state == SUBMITTED and rejection_count == 2"
            - "after the third dmv-decision, TitleRecord.${tr}.state == REJECTED and rejection_count == 3"
            - "the third resubmit returns HTTP 409 with error_id ERR_TITLE_RESUBMIT_LIMIT"
