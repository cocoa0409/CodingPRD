  # =====================================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: addon_apply_reverse_conserves_balance
        grounds:
          - state_machines.AddOn.APPLIED_to_REVERSED
          - calculations.balance_reconcile
          - entities.Invoice.fields.balance_amount_cents
        distinguishing_aspect: |
          Conserved quantity = Invoice.balance_amount_cents (money). Applying then reversing a TOUCH_UP
          add-on must return balance to its pre-add-on value: balance == contract_total - deposit_paid
          == 65450 before and after the apply+reverse pair; net drift zero.
        test_recipe:
          setup:
            - "contracted event, deposit paid (balance 65450), assignment scheduled"
            - "TOUCH_UP qty 2 applied (balance 90450) then assignment cancelled reversing it"
          setup_api_calls:
