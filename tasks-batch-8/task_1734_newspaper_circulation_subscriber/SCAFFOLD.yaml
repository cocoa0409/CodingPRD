# =============================================================================
# PRD Benchmark Seed Tables — task_1734_newspaper_circulation_subscriber
# =============================================================================

scenario: |
  Newspaper Circulation & Subscriber Management (local newspaper circulation department): subscription plan (print/digital/bundle) & rate step-ups, delivery route assignment & carrier settlement, delivery complaint & credit issuance, vacation hold/redelivery & billing proration, churn/save offer workflow, single-copy & rack sales reconciliation, audit bureau reporting of circulation, payment collection & lapse cycle

domain_name: newspaper-circulation-subscriber
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # subscriber ledger (charges/payments/credits) + carrier settlement ledger
  secondary_archetype: temporal_windowing         # vacation holds, route-assignment intervals, rack week buckets, audit periods
  complexity_layers:
    - optimistic_concurrency                      # OCC on Subscription.version for plan-change / save-offer supersede
    - cascading_side_effects                      # complaint->credit->charge->balance->status; reverse->charge->balance->status
    - rate_threshold_triggers                     # tenure step-ups, lapse aging thresholds, variance tolerance
    - dual_variant_calculation                    # proration PER_DAY vs PER_ISSUE; settlement GROSS vs NET
  entity_topology: flat                           # peer entities joined by FK references; no URL nesting except hold/offer creation
  state_machine_shape: parallel                   # Subscription billing_status x delivery_status evolve independently
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override               # CirculationDirector superset; DistrictManager owns distribution; ServiceRep owns subscriber care
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: plan_type, type: enum, source: input, description: "PRINT | DIGITAL | BUNDLE", constraints: "enum {PRINT, DIGITAL, BUNDLE}" }
      - { name: issues_per_week, type: integer, source: input, description: "Print issue days per week; 0 for DIGITAL, 1-7 otherwise", constraints: "0..7; must be 0 when plan_type=DIGITAL, >0 otherwise" }
      - { name: base_weekly_rate_cents, type: integer, source: input, description: "Weekly rate before step-ups", constraints: "> 0" }
      - { name: step_up_schedule, type: array, source: input, default: [], description: "Rate step-ups: [{after_weeks: integer, weekly_rate_cents: integer}] sorted by after_weeks ascending; a step applies when tenure_weeks >= after_weeks" }
      - { name: proration_method, type: enum, source: input, default: "PER_DAY", description: "Vacation-hold proration variant: PER_DAY | PER_ISSUE", constraints: "enum {PER_DAY, PER_ISSUE}" }
      - { name: min_weekly_rate_cents, type: integer, source: input, description: "Floor for save-offer discounted weekly rate", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED; RETIRED blocks new subscriptions and plan-changes into it" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Subscriber display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: service_address, type: string, source: input, default: null, description: "Delivery address; required before any print-capable subscription, route assignment, hold, or complaint" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LAPSED | CLOSED; compound bubble-up from child Subscription states" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "Ledger: sum over BillingCharge status IN {OPEN, PARTIALLY_PAID, PAID} of (amount_cents - paid_amount_cents - credit_applied_cents), minus unapplied_cash_cents" }
      - { name: unapplied_cash_cents, type: integer, source: computed, default: 0, description: "Overpayment remainder not allocated to any charge" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id; owning account" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; current plan" }
      - { name: start_date, type: string, source: input, description: "ISO date service begins; may be in the past (backdated start — catch-up charges generate on activation)" }
      - { name: billing_status, type: enum, source: system, default: "PENDING_START", description: "PENDING_START | ACTIVE | GRACE | SUSPENDED | CANCEL_PENDING | CANCELLED | LAPSED (billing axis)" }
      - { name: delivery_status, type: enum, source: system, default: "NOT_DELIVERED", description: "NOT_DELIVERED | DELIVERING | HELD (delivery axis, independent of billing axis)" }
      - { name: next_charge_date, type: string, source: system, description: "Next weekly BillingCharge period start" }
      - { name: pending_plan_id, type: string, source: system, default: null, description: "FK -> SubscriptionPlan.id; staged plan-change target (nullable)" }
      - { name: pending_plan_effective_date, type: string, source: system, default: null, description: "Date the staged plan-change applies (nullable)" }
      - { name: save_discount_pct, type: number, source: system, default: null, description: "Accepted save-offer discount fraction (nullable)" }
      - { name: save_discount_until, type: string, source: system, default: null, description: "Last date(save-exclusive) the save discount applies (nullable)" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason recorded at cancel request (nullable)" }
      - { name: ended_at, type: string, source: system, default: null, description: "Date of CANCELLED/LAPSED (nullable)" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique among non-INACTIVE routes" }
      - { name: carrier_id, type: string, source: input, default: null, description: "FK -> Carrier.id; assigned carrier (nullable)" }
      - { name: max_stops, type: integer, source: input, description: "Delivery capacity", constraints: "> 0" }
      - { name: assigned_stop_count, type: integer, source: computed, default: 0, description: "Count of RouteAssignment rows with status ACTIVE on this route" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Carrier name" }
      - { name: compensation_model, type: enum, source: input, description: "PER_COPY_GROSS | PER_COPY_NET_OF_COMPLAINTS (settlement variant selector)" }
      - { name: per_copy_rate_cents, type: integer, source: input, constraints: "> 0", description: "Base pay per delivered copy" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (carriers have no lifecycle transitions in this version)" }

  - name: RouteAssignment
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id" }
      - { name: start_date, type: string, source: input, description: "First delivery date (INCLUSIVE interval start)" }
      - { name: end_date, type: string, source: input, default: null, description: "Last delivery date (INCLUSIVE interval end; null = open-ended)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ENDED" }

  - name: VacationHold
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; from creation path" }
      - { name: start_date, type: string, source: input, description: "Hold start; HALF-OPEN interval [start_date, end_date) — end_date is the resume date" }
      - { name: end_date, type: string, source: input, description: "Resume date (exclusive end); length = end_date - start_date days, 1..21" }
      - { name: resolution, type: enum, source: input, description: "CREDIT (proration credit issued) | REDELIVER (missed copies redelivered, no credit)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }
      - { name: weekly_rate_snapshot_cents, type: integer, source: system, default: null, description: "effective_weekly_rate captured at hold activation; proration base" }
      - { name: credit_amount_cents, type: integer, source: system, default: null, description: "Proration credit issued at completion (CREDIT resolution only)" }

  - name: DeliveryComplaint
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: service_date, type: string, source: input, description: "Date of the missed/damaged delivery; within [today-7, today]" }
      - { name: complaint_type, type: enum, source: input, description: "MISSED | DAMAGED | LATE | OTHER" }
      - { name: route_id, type: string, source: system, default: null, description: "FK -> DeliveryRoute.id; resolved from the RouteAssignment covering service_date (null if none)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CREDITED | DENIED" }
      - { name: credit_amount_cents, type: integer, source: system, default: null, description: "Credit issued when CREDITED" }
      - { name: deny_reason, type: string, source: system, default: null, description: "Reason when DENIED" }

  - name: CreditMemo
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: source, type: enum, source: system, description: "GOODWILL (manual) | COMPLAINT (complaint credit) | PRORATION (vacation hold)" }
      - { name: complaint_id, type: string, source: system, default: null, description: "FK -> DeliveryComplaint.id; set for source=COMPLAINT" }
      - { name: hold_id, type: string, source: system, default: null, description: "FK -> VacationHold.id; set for source=PRORATION" }
      - { name: amount_cents, type: integer, source: input, constraints: "> 0", description: "Credit amount (input for GOODWILL; system-computed for COMPLAINT/PRORATION)" }
      - { name: applied_cents, type: integer, source: system, default: 0, description: "Amount auto-applied to open charges via waterfall at issuance" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | APPLIED (applied_cents == amount_cents) | VOIDED" }

  - name: SaveOffer
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; from path (manual) or cancel flow" }
      - { name: offer_type, type: enum, source: system, default: "DISCOUNT_RATE", description: "DISCOUNT_RATE (only supported type)" }
      - { name: discount_pct, type: number, source: input, constraints: "0.10..0.50 inclusive", description: "Discount fraction off the stepped weekly rate" }
      - { name: duration_weeks, type: integer, source: input, constraints: "4..26 inclusive", description: "Weeks the discounted rate applies after acceptance" }
      - { name: origin, type: enum, source: system, description: "CANCEL_FLOW (auto-created by cancel) | RETENTION_REP (manual create)" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | EXPIRED" }
      - { name: expires_at, type: string, source: system, description: "creation date + 7 days; accept requires today < expires_at" }

  - name: RackLocation
    parent: null
    common_fields: true
    fields:
      - { name: location_name, type: string, source: input, description: "Retail rack name" }
      - { name: address, type: string, source: input, description: "Rack street address" }
      - { name: price_per_copy_cents, type: integer, source: input, constraints: "> 0", description: "Single-copy price remitted per sold copy" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: RackSalesReport
    parent: null
    common_fields: true
    fields:
      - { name: rack_location_id, type: string, source: input, description: "FK -> RackLocation.id" }
      - { name: week_start_date, type: string, source: input, description: "ISO date of the week (must be a Monday); unique per rack location" }
      - { name: copies_delivered, type: integer, source: input, constraints: ">= 0", description: "Copies dropped at the rack; frozen once status leaves DRAFT" }
      - { name: copies_returned, type: integer, source: input, constraints: "0..copies_delivered", description: "Unsold copies picked up; correctable while DRAFT or DISPUTED" }
      - { name: reported_sold_copies, type: integer, source: input, default: null, description: "Location-reported sold count used for variance check (nullable)" }
      - { name: copies_sold, type: integer, source: computed, description: "copies_delivered - copies_returned" }
      - { name: amount_due_cents, type: integer, source: computed, description: "copies_sold * price_per_copy_cents at submit time" }
      - { name: variance_copies, type: integer, source: computed, description: "reported_sold_copies - copies_sold (0 when reported_sold_copies is null)" }
      - { name: variance_flag, type: boolean, source: computed, description: "true iff abs(variance_copies) > VARIANCE_TOLERANCE (2 copies); exactly == tolerance is NOT flagged" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | RECONCILED | DISPUTED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: amount_cents, type: integer, source: input, constraints: "> 0", description: "Tendered amount" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH | ACH" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | CLEARED | FAILED | REVERSED" }
      - { name: allocations, type: array, source: system, default: [], description: "Waterfall result at clearing: [{charge_id, amount_cents}] in allocation order" }

  - name: BillingCharge
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; denormalized owner" }
      - { name: period_start, type: string, source: system, description: "Charge period start (weekly)" }
      - { name: period_end, type: string, source: system, description: "period_start + 7 days" }
      - { name: due_date, type: string, source: system, description: "period_start + TERMS_DAYS (14)" }
      - { name: amount_cents, type: integer, source: system, description: "effective_weekly_rate at generation time" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Cleared payment allocations" }
      - { name: credit_applied_cents, type: integer, source: system, default: 0, description: "Credit memo applications" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PARTIALLY_PAID | PAID | WRITTEN_OFF" }

  - name: AuditReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "Reporting period end (inclusive); > period_start" }
      - { name: paid_print_subscribers, type: integer, source: computed, description: "Snapshot count per audit_circulation_totals" }
      - { name: paid_digital_subscribers, type: integer, source: computed, description: "Snapshot count per audit_circulation_totals" }
      - { name: single_copy_copies, type: integer, source: computed, description: "Sum of copies_sold over RECONCILED rack reports with week_start_date in period" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CERTIFIED | SUBMITTED" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Timestamp of certification" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: SubscriptionPlan
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/subscription-plans/{id}/retire"
        actor: CirculationDirector
        preconditions: []
        side_effects:
          - "Existing subscriptions on this plan are unaffected; new subscriptions and plan-changes into it rejected (ERR_PLAN_RETIRED)"

  - entity: Subscriber
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (bubble-up evaluated after any Subscription reaches a terminal state)"
        actor: system
        preconditions:
          - "Subscriber has >= 1 Subscription and every Subscription billing_status IN {CANCELLED, LAPSED}"
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /api/subscriptions (bubble-up when a new Subscription is created for a LAPSED subscriber)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: CLOSED
        trigger: "POST /api/subscribers/{id}/close"
        actor: ServiceRep | CirculationDirector
        preconditions:
          - "balance_due_cents == 0 AND unapplied_cash_cents == 0 (ERR_SUBSCRIBER_NOT_SETTLED)"
        side_effects: []

  - entity: Subscription
    initial_state: PENDING_START
    terminal_states: [CANCELLED, LAPSED]
    note: "Two parallel state axes on one row: billing_status and delivery_status evolve independently; billing transitions can force delivery transitions, never the reverse."
    transitions:
      - from: PENDING_START
        to: ACTIVE
        trigger: "system (daily cycle, when start_date <= today)"
        actor: system
        preconditions: []
        side_effects:
          - "next_charge_date = start_date; first weekly charge generated immediately (catch-up loop)"
          - "delivery_status NOT_DELIVERED -> DELIVERING when plan is print-capable (PRINT|BUNDLE)"

      - from: ACTIVE
        to: GRACE
        trigger: "system (daily cycle or post-mutation re-evaluation: oldest unpaid charge days_past_due > GRACE_DAYS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: GRACE
        to: ACTIVE
        trigger: "system (re-evaluation after payment clear / credit application: oldest unpaid charge days_past_due <= GRACE_DAYS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: GRACE
        to: SUSPENDED
        trigger: "system (daily cycle: oldest unpaid charge days_past_due > SUSPEND_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "delivery_status (DELIVERING|HELD) -> NOT_DELIVERED"
          - "charge generation stops while SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (reinstatement re-evaluation after payment clear: thresholds re-mapped on oldest unpaid past-due age; <= GRACE_DAYS lands ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "next_charge_date reset to reinstatement date"
          - "delivery_status NOT_DELIVERED -> DELIVERING when plan is print-capable"

      - from: SUSPENDED
        to: LAPSED
        trigger: "system (daily cycle: oldest unpaid charge days_past_due > LAPSE_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "All OPEN/PARTIALLY_PAID BillingCharge rows -> WRITTEN_OFF"
          - "delivery_status -> NOT_DELIVERED; ended_at = today"
          - "Subscriber bubble-up re-evaluated (may flip ACTIVE -> LAPSED)"

      - from: ACTIVE
        to: CANCEL_PENDING
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions:
          - "billing_status IN {ACTIVE, GRACE} (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "SaveOffer created: status OFFERED, origin CANCEL_FLOW, discount_pct 0.25, duration_weeks 8, expires_at = today + 7"
          - "cancel_reason recorded; Subscription.version incremented"

      - from: GRACE
        to: CANCEL_PENDING
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions: []
        side_effects:
          - "SaveOffer created: OFFERED, origin CANCEL_FLOW, 0.25 / 8 weeks / +7 day expiry"

      - from: CANCEL_PENDING
        to: ACTIVE
        trigger: "POST /api/save-offers/{id}/accept (the OFFERED offer on this subscription)"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions:
          - "offer status OFFERED (ERR_OFFER_NOT_OPEN) and today < expires_at"
        side_effects:
          - "SaveOffer -> ACCEPTED; save_discount_pct/save_discount_until = today + duration_weeks*7 set on Subscription"
          - "cancel_reason cleared; Subscription.version incremented"

      - from: CANCEL_PENDING
        to: CANCELLED
        trigger: "POST /api/save-offers/{id}/decline OR system (daily cycle expires OFFERED offer with expires_at <= today)"
        actor: Subscriber | ServiceRep | CirculationDirector | system
        preconditions: []
        side_effects:
          - "SaveOffer -> DECLINED (manual) or EXPIRED (system)"
          - "delivery_status -> NOT_DELIVERED; ended_at = today; Subscriber bubble-up re-evaluated"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel (no save offer is created from SUSPENDED)"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions: []
        side_effects:
          - "delivery_status -> NOT_DELIVERED; ended_at = today; Subscriber bubble-up re-evaluated"

  - entity: VacationHold
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (daily cycle, when start_date <= today)"
        actor: system
        preconditions: []
        side_effects:
          - "weekly_rate_snapshot_cents = effective_weekly_rate(today)"
          - "Subscription.delivery_status DELIVERING -> HELD"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (daily cycle, when end_date <= today) OR POST /api/vacation-holds/{id}/resume (early resume: effective end = today)"
        actor: system | Subscriber | ServiceRep | CirculationDirector
        preconditions: []
        side_effects:
          - "Subscription.delivery_status HELD -> DELIVERING"
          - "If resolution == CREDIT: CreditMemo created (source PRORATION, hold_id set, amount = vacation_proration_credit over actual held days) and auto-applied via payment waterfall; hold.credit_amount_cents set"
          - "If resolution == REDELIVER: no credit; missed copies queued for redelivery pack"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/vacation-holds/{id}/cancel"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions:
          - "status == SCHEDULED (ERR_HOLD_NOT_CANCELLABLE)"
        side_effects:
          - "No credit, no delivery change; zero drift on subscriber ledger"

  - entity: DeliveryComplaint
    initial_state: OPEN
    terminal_states: [CREDITED, DENIED]
    transitions:
      - from: OPEN
        to: CREDITED
        trigger: "POST /api/complaints/{id}/credit"
        actor: ServiceRep | CirculationDirector
        preconditions:
          - "status == OPEN (ERR_COMPLAINT_NOT_OPEN)"
          - "amount_cents (or default per-issue rate) <= COMPLAINT_CREDIT_CAP_CENTS (ERR_CREDIT_EXCEEDS_COMPLAINT_CAP)"
          - "subscriber monthly goodwill+complaint credit total stays <= MONTHLY_GOODWILL_CAP_CENTS (ERR_GOODWILL_CAP_EXCEEDED)"
        side_effects:
          - "CreditMemo created (source COMPLAINT, complaint_id set) and auto-applied waterfall to subscriber's open charges"
          - "Cascade: applied charge credit_applied_cents rises (may reach PAID) -> Subscriber.balance_due_cents recomputed -> Subscription billing re-evaluation (may flip GRACE -> ACTIVE)"
      - from: OPEN
        to: DENIED
        trigger: "POST /api/complaints/{id}/deny"
        actor: ServiceRep | CirculationDirector
        preconditions:
          - "status == OPEN (ERR_COMPLAINT_NOT_OPEN)"
        side_effects:
          - "deny_reason recorded; no credit issued"

  - entity: CreditMemo
    initial_state: ISSUED
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: ISSUED
        to: APPLIED
        trigger: "system (auto-apply waterfall at issuance reaches applied_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/credit-memos/{id}/void"
        actor: CirculationDirector
        preconditions:
          - "applied_cents == 0 (ERR_CREDIT_MEMO_LOCKED)"
        side_effects: []

  - entity: SaveOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/save-offers/{id}/accept"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions:
          - "status == OFFERED (ERR_OFFER_NOT_OPEN)"
          - "today < expires_at (ERR_OFFER_NOT_OPEN)"
          - "Subscription billing_status IN {CANCEL_PENDING, ACTIVE, GRACE} (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "Subscription: save_discount_pct/save_discount_until set; CANCEL_PENDING -> ACTIVE; version incremented"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/save-offers/{id}/decline"
        actor: Subscriber | ServiceRep | CirculationDirector
        preconditions:
          - "status == OFFERED (ERR_OFFER_NOT_OPEN)"
        side_effects:
          - "If Subscription billing_status == CANCEL_PENDING: -> CANCELLED, delivery NOT_DELIVERED, ended_at set"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (daily cycle, expires_at <= today) OR supersede on manual save-offer creation for the same subscription"
        actor: system | ServiceRep | CirculationDirector
        preconditions: []
        side_effects:
          - "Cycle expiry: if Subscription billing_status == CANCEL_PENDING -> CANCELLED (churn confirmed)"
          - "Supersede expiry: subscription billing unchanged (manual replacement offer)"

  - entity: DeliveryRoute
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /api/routes/{id} with status=INACTIVE"
        actor: DistrictManager | CirculationDirector
        preconditions: []
        side_effects:
          - "New RouteAssignments rejected (ERR_ROUTE_INACTIVE); existing assignments unaffected"

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: []
    transitions: []
    note: "No lifecycle transitions; settlement is a computed read, not a state machine."

  - entity: RouteAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /api/route-assignments/{id}/end"
        actor: DistrictManager | CirculationDirector
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "end_date >= start_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "end_date recorded; DeliveryRoute.assigned_stop_count decremented"

  - entity: RackLocation
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /api/rack-locations/{id} with status=INACTIVE"
        actor: DistrictManager | CirculationDirector
        preconditions: []
        side_effects:
          - "New RackSalesReports rejected for INACTIVE racks (ERR_INVALID_STATE)"

  - entity: RackSalesReport
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/rack-sales-reports/{id}/submit"
        actor: DistrictManager | CirculationDirector
        preconditions:
          - "status IN {DRAFT, DISPUTED} (ERR_REPORT_NOT_SUBMITTABLE)"
        side_effects:
          - "copies_sold, amount_due_cents, variance_copies, variance_flag computed; copies_delivered frozen"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /api/rack-sales-reports/{id}/submit (resubmission after correction)"
        actor: DistrictManager | CirculationDirector
        preconditions: []
        side_effects:
          - "Recomputed from corrected copies_returned; copies_delivered unchanged"
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /api/rack-sales-reports/{id}/reconcile"
        actor: CirculationDirector
        preconditions:
          - "status == SUBMITTED (ERR_REPORT_NOT_RECONCILABLE)"
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/rack-sales-reports/{id}/dispute"
        actor: CirculationDirector
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /api/payments/{id}/mark-cleared"
        actor: ServiceRep | CirculationDirector
        preconditions:
          - "status == INITIATED (ERR_PAYMENT_NOT_INITIATED)"
        side_effects:
          - "Waterfall allocation across subscriber's OPEN/PARTIALLY_PAID charges (due_date ASC, created_at ASC); charge statuses flip to PARTIALLY_PAID/PAID"
          - "Remainder -> Subscriber.unapplied_cash_cents; balance_due_cents recomputed"
          - "Subscription billing re-evaluation (GRACE->ACTIVE, SUSPENDED->ACTIVE/GRACE)"
      - from: INITIATED
        to: FAILED
        trigger: "POST /api/payments/{id}/mark-failed"
        actor: ServiceRep | CirculationDirector
        preconditions:
          - "status == INITIATED (ERR_PAYMENT_NOT_INITIATED)"
        side_effects: []
      - from: CLEARED
        to: REVERSED
        trigger: "POST /api/payments/{id}/reverse"
        actor: CirculationDirector
        preconditions:
          - "status == CLEARED (ERR_PAYMENT_NOT_CLEARED)"
        side_effects:
          - "Cascade depth 3: (1) each allocation undone in reverse allocation order — charge paid_amount_cents restored, PAID/PARTIALLY_PAID revert (PAID->OPEN when paid returns to 0)"
          - "(2) charge restoration itself triggers Subscriber.balance_due_cents recompute upward and unapplied_cash_cents clawback of the reversed remainder"
          - "(3) balance recompute triggers Subscription billing re-evaluation — may flip ACTIVE -> GRACE / GRACE -> SUSPENDED by lapse thresholds"

  - entity: BillingCharge
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "system (payment clearing or credit application with 0 < covered < outstanding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: PAID
        trigger: "system (payment clearing or credit application covering full outstanding)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription billing re-evaluation"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment clearing or credit application covering remainder)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription billing re-evaluation"
      - from: PAID
        to: OPEN
        trigger: "system (payment reversal restores paid_amount_cents to 0) — revision loop back into OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "Subscriber.balance_due_cents recomputed; Subscription billing re-evaluation may worsen status"
      - from: PARTIALLY_PAID
        to: OPEN
        trigger: "system (payment reversal removes all covered amount)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "system (subscription LAPSED) OR POST /api/billing-charges/{id}/write-off"
        actor: system | CirculationDirector
        preconditions:
          - "status IN {OPEN, PARTIALLY_PAID} (ERR_CHARGE_NOT_OPEN)"
        side_effects:
          - "Excluded from balance_due_cents aggregation"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "system (subscription LAPSED) OR POST /api/billing-charges/{id}/write-off"
        actor: system | CirculationDirector
        preconditions: []
        side_effects: []

  - entity: AuditReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /api/audit-reports/{id}/certify"
        actor: CirculationDirector
        preconditions:
          - "status == DRAFT (ERR_AUDIT_NOT_DRAFT)"
          - "Every RackSalesReport with week_start_date within [period_start, period_end] is RECONCILED (ERR_UNRECONCILED_RACK_VARIANCE)"
        side_effects:
          - "paid_print_subscribers / paid_digital_subscribers / single_copy_copies recomputed at certification (stale DRAFT snapshot discarded); certified_at stamped"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /api/audit-reports/{id}/submit"
        actor: CirculationDirector
        preconditions:
          - "status == CERTIFIED (ERR_AUDIT_NOT_CERTIFIED)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-plan-change-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{id}/plan-change"
    occ_field: "expected_subscription_version"
    description: |
      A plan-change request carrying an expected_subscription_version that no
      longer matches Subscription.version is rejected. This captures the case
      where another writer has just staged a plan change (which legitimately
      supersedes the prior pending change) and the current writer's view of
      the subscription is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: save-offer-create-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{id}/save-offers"
    occ_field: "expected_subscription_version"
    description: |
      A manual save-offer creation carrying an expected_subscription_version
      that no longer matches Subscription.version is rejected. Creating an
      offer legitimately supersedes (auto-expires) any existing OFFERED offer
      on the subscription, so a writer whose view predates the latest
      superseding mutation is dropped with a stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_weekly_rate
    trigger: "BillingCharge generation (daily cycle catch-up) and VacationHold activation snapshot"
    algorithm: tiered_pricing
    formula: |
      tenure_weeks = floor((charge_period_start - subscription.start_date) / 7)
      stepped = plan.base_weekly_rate_cents
      for step in plan.step_up_schedule (sorted by after_weeks ASC):
        if tenure_weeks >= step.after_weeks: stepped = step.weekly_rate_cents   # inclusive boundary
      rate = stepped
      if subscription.save_discount_until is not null AND charge_period_start < save_discount_until:
        discounted = round_half_up(stepped * (1 - subscription.save_discount_pct))
        rate = max(discounted, plan.min_weekly_rate_cents)
      return rate
    input_set: "Subscription (start_date, save_discount_*) x SubscriptionPlan (base rate, step_up_schedule, min_weekly_rate_cents)"
    precision: "integer cents, round_half_up for the discount multiply only"
    constants:
      DAYS_PER_WEEK: 7

  - name: vacation_proration_credit
    trigger: "VacationHold completion (natural end or early resume) when resolution == CREDIT"
    algorithm: tiered_pricing
    formula: |
      held_days = (actual_end_date - hold.start_date) in days   # half-open [start, actual_end)
      base = hold.weekly_rate_snapshot_cents
      variant PER_DAY:   credit = round_half_up(base * held_days / 7)
      variant PER_ISSUE: per_issue = round_half_up(base / plan.issues_per_week)
                         credit  = per_issue * held_days            # round FIRST, then multiply — order pinned
    input_set: "The completing VacationHold, its Subscription, the Subscription's plan"
    precision: "integer cents, round_half_up; PER_ISSUE rounds the per-issue rate BEFORE multiplying (nested rounding order is load-bearing)"
    variants:
      - name: PER_DAY
        when: "plan.proration_method == PER_DAY"
        difference: "single rounding after the multiply; e.g. base 1000, 4 days -> 571"
      - name: PER_ISSUE
        when: "plan.proration_method == PER_ISSUE"
        difference: "rounds per-issue rate first then multiplies; e.g. base 1000, 4 days, 7 issues/week -> 143*4 = 572"

  - name: payment_waterfall_allocation
    trigger: "Payment mark-cleared and CreditMemo issuance (auto-apply)"
    algorithm: waterfall_allocation
    formula: |
      eligible = subscriber's BillingCharge rows with status IN {OPEN, PARTIALLY_PAID}, outstanding = amount_cents - paid_amount_cents - credit_applied_cents > 0
      order: due_date ASC, tie-break created_at ASC (never id)
      for charge in order, while funds remain:
        take = min(remaining, charge.outstanding)
        apply to paid_amount_cents (payment) or credit_applied_cents (credit memo)
        flip charge status: fully covered -> PAID, partially -> PARTIALLY_PAID
      payment remainder -> subscriber.unapplied_cash_cents; credit remainder stays on memo (status ISSUED)
    input_set: "OPEN/PARTIALLY_PAID BillingCharge rows of the subscriber only"
    precision: "integer cents; allocations recorded on Payment.allocations in application order"

  - name: lapse_cycle_evaluation
    trigger: "daily cycle step 6 AND post-mutation re-evaluation after payment clear / credit apply / reversal"
    algorithm: threshold
    formula: |
      d = max over subscriber's charges with status IN {OPEN, PARTIALLY_PAID} of (today - due_date) in days; d = 0 when no such charge is past due
      d <= GRACE_DAYS (7)    -> ACTIVE      (strictly-greater thresholds: exactly 7 days past due stays ACTIVE)
      7 < d <= 21            -> GRACE
      21 < d <= 45           -> SUSPENDED
      d > 45                 -> LAPSED (terminal; write off OPEN/PARTIALLY_PAID charges)
      LAPSED and CANCELLED are never re-entered once reached.
    input_set: "Non-terminal subscriptions of the subscriber with their unpaid charges"
    constants:
      TERMS_DAYS: 14
      GRACE_DAYS: 7
      SUSPEND_DAYS: 21
      LAPSE_DAYS: 45

  - name: carrier_settlement
    trigger: "GET /api/carriers/{id}/settlement?week_start_date=... (computed read over the Monday-anchored week [week_start, week_start+7))"
    algorithm: aggregation
    formula: |
      delivered_copies = sum over the carrier's ACTIVE routes, over RouteAssignment rows (status any) whose
        [start_date, end_date-or-null] intersects the week, whose subscription plan is print-capable,
        AND whose subscription billing_status IN {ACTIVE, GRACE, CANCEL_PENDING}:
        overlap_days - held_days_in_overlap   (1 copy per delivery day)
      complaint_count = DeliveryComplaint rows (status any) with route_id on the carrier's routes and service_date in the week
      gross_cents = delivered_copies * carrier.per_copy_rate_cents
      bonus_cents = (complaint_count <= BONUS_MAX_COMPLAINTS) ? round_half_up(gross_cents * BONUS_PCT) : 0
      deduction_cents = (compensation_model == PER_COPY_NET_OF_COMPLAINTS)
                        ? min(complaint_count * PER_COMPLAINT_DEDUCTION_CENTS, DEDUCTION_CAP_CENTS) : 0
      net_cents = max(gross_cents + bonus_cents - deduction_cents, 0)
    input_set: "Carrier's ACTIVE routes, intersecting assignments, complaints attributed via route_id"
    precision: "integer cents, round_half_up on the bonus multiply"
    constants:
      BONUS_PCT: 0.05
      BONUS_MAX_COMPLAINTS: 2
      PER_COMPLAINT_DEDUCTION_CENTS: 150
      DEDUCTION_CAP_CENTS: 3000
    variants:
      - name: PER_COPY_GROSS
        when: "carrier.compensation_model == PER_COPY_GROSS"
        difference: "deduction_cents forced to 0; e.g. 7 copies @50c with 1 complaint -> 350 + 18 - 0 = 368"
      - name: PER_COPY_NET_OF_COMPLAINTS
        when: "carrier.compensation_model == PER_COPY_NET_OF_COMPLAINTS"
        difference: "deduction applies; same inputs -> 350 + 18 - 150 = 218"

  - name: rack_sales_reconciliation
    trigger: "RackSalesReport submit (initial and resubmission)"
    algorithm: aggregation
    formula: |
      copies_sold = copies_delivered - copies_returned
      amount_due_cents = copies_sold * rack.price_per_copy_cents
      variance_copies = (reported_sold_copies == null) ? 0 : reported_sold_copies - copies_sold
      variance_flag = abs(variance_copies) > VARIANCE_TOLERANCE   # exactly == 2 is NOT flagged
    input_set: "The single RackSalesReport and its RackLocation price"
    precision: "integer copies and cents"
    constants:
      VARIANCE_TOLERANCE: 2

  - name: audit_circulation_totals
    trigger: "AuditReport creation (snapshot) and certification (recompute; certification values win)"
    algorithm: aggregation
    formula: |
      paid_print_subscribers = count of Subscription with plan.plan_type IN {PRINT, BUNDLE}
        AND billing_status IN {ACTIVE, GRACE, CANCEL_PENDING}            # SUSPENDED/LAPSED/CANCELLED excluded (not paid circulation)
        AND start_date <= period_end AND (ended_at IS NULL OR ended_at >= period_start)
      paid_digital_subscribers = same filter with plan_type IN {DIGITAL, BUNDLE}
      single_copy_copies = sum of copies_sold over RackSalesReport with status == RECONCILED
        AND week_start_date IN [period_start, period_end]                # DRAFT/SUBMITTED/DISPUTED excluded
    input_set: "All subscriptions (status-filtered) and RECONCILED rack reports in the period"
    precision: "integer counts"

  - name: goodwill_cap_tracking
    trigger: "POST /api/credit-memos and POST /api/complaints/{id}/credit"
    algorithm: aggregation
    formula: |
      used = sum of CreditMemo.amount_cents where subscriber_id = target
        AND source IN {GOODWILL, COMPLAINT} AND status != VOIDED
        AND created_at date within the current calendar month
      reject when used + new_amount > MONTHLY_GOODWILL_CAP_CENTS (ERR_GOODWILL_CAP_EXCEEDED)
      complaint credits additionally reject when amount > COMPLAINT_CREDIT_CAP_CENTS (ERR_CREDIT_EXCEEDS_COMPLAINT_CAP)
    input_set: "Subscriber's current-month non-voided GOODWILL/COMPLAINT memos"
    constants:
      MONTHLY_GOODWILL_CAP_CENTS: 5000
      COMPLAINT_CREDIT_CAP_CENTS: 2000

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Subscriber-role callers may only touch resources whose subscriber chain equals X-User-ID (own subscriptions, holds, complaints, payments, charges, offers)"
    error_id: ERR_NOT_OWN_RESOURCE
    http_status: 403
    applies_to: "subscriber-scoped endpoints when X-User-Role == Subscriber"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request body shape: required fields present, types valid, enum membership, amount_cents > 0, end_date > start_date, week_start_date is a Monday, copies_returned <= copies_delivered"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "Target resource state permits the operation (subscription billing/delivery axis, complaint OPEN, offer OFFERED, report DRAFT/SUBMITTED/DISPUTED, payment INITIATED/CLEARED, charge OPEN/PARTIALLY_PAID, audit DRAFT/CERTIFIED, plan not RETIRED, route ACTIVE)"
    error_id: "ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_COMPLAINT_NOT_OPEN | ERR_OFFER_NOT_OPEN | ERR_REPORT_NOT_SUBMITTABLE | ERR_REPORT_NOT_EDITABLE | ERR_REPORT_NOT_RECONCILABLE | ERR_PAYMENT_NOT_INITIATED | ERR_PAYMENT_NOT_CLEARED | ERR_CHARGE_NOT_OPEN | ERR_AUDIT_NOT_DRAFT | ERR_AUDIT_NOT_CERTIFIED | ERR_PLAN_RETIRED | ERR_ROUTE_INACTIVE | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_subscription_version must equal Subscription.version on plan-change and save-offer create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/subscriptions/{id}/plan-change; POST /api/subscriptions/{id}/save-offers"
  - priority: 8
    category: business_temporal
    check: "Interval rules: hold window valid (start >= today, 1..21 days, no half-open overlap with SCHEDULED/ACTIVE holds); assignment closed-interval overlap; rack week uniqueness; audit period overlap; complaint filed within 7 days of service_date"
    error_id: "ERR_HOLD_WINDOW_INVALID | ERR_HOLD_OVERLAP | ERR_ASSIGNMENT_OVERLAP | ERR_REPORT_WEEK_CONFLICT | ERR_AUDIT_PERIOD_OVERLAP | ERR_COMPLAINT_WINDOW_CLOSED"
    http_status: 409
    applies_to: "hold create, assignment create, rack report create, audit create, complaint create"
  - priority: 9
    category: business_referential
    check: "Cross-entity referential fit: print-capable plan changes/subscriptions require subscriber.service_address; complaint/hold/assignment targets a print-capable plan"
    error_id: "ERR_SERVICE_ADDRESS_REQUIRED | ERR_DIGITAL_ONLY_PLAN"
    http_status: 409
    applies_to: "subscription create, plan-change, complaint create, hold create, assignment create"
  - priority: 10
    category: business_constraint
    check: "Capacity/uniqueness constraints: route stop capacity, duplicate complaint per (subscription, service_date) among non-DENIED, route_code uniqueness among non-INACTIVE routes"
    error_id: "ERR_ROUTE_AT_CAPACITY | ERR_DUPLICATE_COMPLAINT | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "assignment create, complaint create, route create"
  - priority: 11
    category: business_fiscal
    check: "Money/quota last: monthly goodwill cap, per-complaint credit cap, annual 30-day hold budget, settled ledger for subscriber close, unreconciled rack reports block audit certification"
    error_id: "ERR_GOODWILL_CAP_EXCEEDED | ERR_CREDIT_EXCEEDS_COMPLAINT_CAP | ERR_HOLD_LIMIT_EXCEEDED | ERR_SUBSCRIBER_NOT_SETTLED | ERR_UNRECONCILED_RACK_VARIANCE"
    http_status: 409
    applies_to: "credit endpoints, hold create, subscriber close, audit certify"

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- SubscriptionPlan ---
  - method: POST
    path: "/api/subscription-plans"
    description: "Create a subscription plan (config)"
    roles: [CirculationDirector]
    code: 201
    input: [name, plan_type, issues_per_week, base_weekly_rate_cents, "step_up_schedule?", "proration_method?", min_weekly_rate_cents]
    output: SubscriptionPlan
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/api/subscription-plans"
    description: "List plans"
    roles: [Subscriber, ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: ["plan_type?", "status?", "limit?", "offset?"]
    output: "SubscriptionPlan[]"
    side_effects: []
  - method: GET
    path: "/api/subscription-plans/{id}"
    description: "Get a plan"
    roles: [Subscriber, ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []
  - method: POST
    path: "/api/subscription-plans/{id}/retire"
    description: "Retire a plan; blocks new subscriptions/plan-changes into it"
    roles: [CirculationDirector]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: ["status ACTIVE -> RETIRED"]

  # --- Subscriber ---
  - method: POST
    path: "/api/subscribers"
    description: "Create a subscriber account"
    roles: [ServiceRep, CirculationDirector]
    code: 201
    input: [display_name, email, "service_address?"]
    output: Subscriber
    side_effects: ["status = ACTIVE, balances 0"]
  - method: GET
    path: "/api/subscribers"
    description: "List subscribers"
    roles: [ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Subscriber[]"
    side_effects: []
  - method: GET
    path: "/api/subscribers/{id}"
    description: "Get a subscriber (Subscriber role: own record only)"
    roles: [Subscriber, ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: []
    output: Subscriber
    side_effects: []
  - method: POST
    path: "/api/subscribers/{id}/close"
    description: "Close a LAPSED subscriber with a settled ledger"
    roles: [ServiceRep, CirculationDirector]
    code: 200
    input: []
    output: Subscriber
    side_effects: ["status LAPSED -> CLOSED"]

  # --- Subscription ---
  - method: POST
    path: "/api/subscriptions"
    description: "Create a subscription (PENDING_START; Subscriber role: subscriber_id must equal X-User-ID)"
    roles: [Subscriber, ServiceRep, CirculationDirector]
    code: 201
    input: [subscriber_id, plan_id, start_date]
    output: Subscription
    side_effects:
      - "billing_status = PENDING_START, delivery_status = NOT_DELIVERED"
      - "Subscriber LAPSED -> ACTIVE bubble-up"
      - "Print-capable plan requires subscriber.service_address (ERR_SERVICE_ADDRESS_REQUIRED); plan must be ACTIVE (ERR_PLAN_RETIRED)"
  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions; ordered by created_at ASC"
    roles: [ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: ["subscriber_id?", "plan_id?", "pending_plan_id?", "billing_status?", "delivery_status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []
  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Get a subscription (Subscriber role: own only)"
    roles: [Subscriber, ServiceRep, DistrictManager, CirculationDirector]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{id}/plan-change"
    description: "Stage a plan change effective at a future date; supersedes any pending change; OCC-guarded"
    roles: [Subscriber, ServiceRep, CirculationDirector]
    code: 200
    input: [new_plan_id, effective_date, expected_subscription_version]
    output: Subscription
    side_effects:
      - "pending_plan_id/pending_plan_effective_date set (supersede replaces any existing pending change)"
      - "increments Subscription.version by 1"
      - "daily cycle applies pending change when today >= effective_date: plan_id switched, pending fields cleared"
      - "Print-capable target requires service_address (ERR_SERVICE_ADDRESS_REQUIRED); target plan must be ACTIVE (ERR_PLAN_RETIRED)"
  - method: POST
    path: "/api/subscriptions/{id}/cancel"
    description: "Request cancellation: ACTIVE/GRACE -> CANCEL_PENDING with auto save offer; SUSPENDED -> CANCELLED directly"
    roles: [Subscriber, ServiceRep, CirculationDirector]
    code: 200
    input: [reason]
    output: Subscription
    side_effects:
      - "From ACTIVE/GRACE: SaveOffer created (OFFERED, CANCEL_FLOW, 0.25, 8 weeks, +7 day expiry)"
      - "From SUSPENDED: CANCELLED, delivery NOT_DELIVERED, ended_at set, Subscriber bubble-up"
      - "increments Subscription.version by 1"

