            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 1000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog_id}" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc_id: "$.data[0].id" }
          trigger:
            - call: "POST /stewardship/rebate-accruals/${acc_id}/claim"
              payload: {}
              as: Converter
              as_user_id: "${conv2_id}"
              captures: { own_err: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_OWNERSHIP_VIOLATION (actual ${own_err})"
            - "RebateAccrual.${acc_id}.status stays FINALIZED"

      - name: sod_auditor_identity_cannot_authorize_own_audit
        claim_type: Segregation of duties
        grounds:
          - validations[priority=4]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "SoD is identity-based across roles: the audit was recorded by X-User-ID qa-7; a ChannelManager call carrying the same X-User-ID qa-7 is refused with 403 ERR_SEGREGATION_OF_DUTIES even though the role is correct."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter AUDIT_RECORDED with score 90, audited_by == qa-7."
          setup_api_calls:
