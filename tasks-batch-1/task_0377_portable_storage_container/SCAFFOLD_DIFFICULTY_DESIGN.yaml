              payload: { agreement_id: "${ag2_id}", truck_id: "${truck_id}", container_unit_id: "${unit2_id}", origin_depot_id: "${depot_id}", destination_state_code: "CA", distance_miles: 40, window_start: "2026-07-20T11:00:00Z", window_end: "2026-07-20T13:00:00Z" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_TRUCK_CAPACITY_EXCEEDED (closed windows [09:00,11:00] and [11:00,13:00] touch at 11:00; 2 containers > max 1)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_conservation_reserve_then_cancel
        grounds:
          - state_machines.RentalAgreement.RESERVED_to_CANCELLED
          - calculations.inventory_availability
          - entities.DepotInventory.fields.available_units
        distinguishing_aspect: "Conserved quantity = container pool: total_units == available_units + reserved_units + committed_units must hold. Reserve (forward) then cancel (compensation) leaves available_units identical to before the reserve (1 -> 0 -> 1) with reserved_units back to 0 — the named pool identity is unchanged, a count-based conserved quantity."
        test_recipe:
          setup:
            - "C16 DepotInventory total_units=1, available_units=1; a QUOTED agreement reserved (available 0, reserved 1) then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "inv@x.com", full_name: "Inv Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /depot-inventory/${inv_id}"
              payload: {}
              as: DispatchOperator
              captures: { avail_after_reserve: $.data.available_units, reserved_after: $.data.reserved_units }
          trigger:
            - call: "POST /rental-agreements/${ag_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /depot-inventory/${inv_id}"
              payload: {}
              as: DispatchOperator
              captures: { avail_after_cancel: $.data.available_units, reserved_final: $.data.reserved_units, committed_final: $.data.committed_units, total_final: $.data.total_units }
          assert:
            - "After reserve DepotInventory.${inv_id}.available_units == 0 and reserved_units == 1"
            - "After cancel DepotInventory.${inv_id}.available_units == 1 and reserved_units == 0 and committed_units == 0"
            - "Invariant holds: total_units (1) == available_units (1) + reserved_units (0) + committed_units (0)"

      - name: ledger_conservation_move_schedule_then_cancel
        grounds:
          - state_machines.MoveOrder.SCHEDULED_to_CANCELLED
          - calculations.agreement_balance
          - entities.RentalAgreement.fields.balance_due_cents
        distinguishing_aspect: "Conserved quantity = agreement money ledger (FINAL balance_due_cents): scheduling a move posts a +19400 MOVE Charge; cancelling posts a compensating -19400 ADJUSTMENT, so the FINAL balance_due_cents returns to its pre-move value (24671) — a money-valued conserved quantity, different in kind from the integer container-count invariant of instance 1."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement (PLUS) delivered 2026-07-16; FINAL balance 24671 before any move; a LOCAL 30-mile MoveOrder scheduled (FINAL balance would be 44071) then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "PLUS", base_premium_cents: 1500, rate_bps: 80, min_premium_cents: 2000, coverage_cap_cents: 100000000 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { depot_id: "${depot_id}", plate: "TRK-LG", max_concurrent_containers: 1 }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "lgr@x.com", full_name: "Led Ger", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "PLUS", declared_value_cents: 500000, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "POST /move-orders"
              payload: { agreement_id: "${ag_id}", truck_id: "${truck_id}", container_unit_id: "${unit_id}", origin_depot_id: "${depot_id}", destination_state_code: "CA", distance_miles: 30, window_start: "2026-07-20T09:00:00Z", window_end: "2026-07-20T11:00:00Z" }
              as: DispatchOperator
              captures: { move_id: $.data.id }
            - call: "POST /rental-agreements/${ag_id}/request-closeout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { bal_with_move: $.data.balance_due_cents }
            - call: "POST /move-orders/${move_id}/cancel"
              payload: {}
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { bal_after_cancel: $.data.balance_due_cents }
          assert:
            - "With the move scheduled, FINAL RentalAgreement.${ag_id}.balance_due_cents == 44071 (24671 + 19400 MOVE)"
            - "After move cancel, FINAL RentalAgreement.${ag_id}.balance_due_cents == 24671 (the -19400 ADJUSTMENT restores the ledger)"
            - "Conserved money invariant: balance_after_cancel == balance_before_move (24671)"
