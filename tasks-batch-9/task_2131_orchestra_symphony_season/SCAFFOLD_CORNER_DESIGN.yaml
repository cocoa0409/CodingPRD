            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T14:00:00Z", scheduled_end_utc: "2026-11-04T15:00:00Z", minimum_complement: 0, break_minutes: 0 }
