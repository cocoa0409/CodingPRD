          trigger:
            - { call: "POST /abatement/manifests/${m1_id}/seal", payload: {}, as: Supervisor, as_user_id: "${w_sup}", captures: { fee1: "$.data.fee_cents" } }
            - { call: "POST /abatement/manifests/${m2_id}/seal", payload: {}, as: Supervisor, as_user_id: "${w_sup}", captures: { fee2: "$.data.fee_cents" } }
