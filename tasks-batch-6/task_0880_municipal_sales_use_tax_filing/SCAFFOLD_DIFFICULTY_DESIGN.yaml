          - entities.Audit.fields.gross_receipts_cents
        distinguishing_aspect: |
          Cents metric on POST /tax/audits: gross_receipts_cents exactly equal to
          NEXUS_THRESHOLD_CENTS (10000000) establishes nexus (>=), so nexus_established == true.
