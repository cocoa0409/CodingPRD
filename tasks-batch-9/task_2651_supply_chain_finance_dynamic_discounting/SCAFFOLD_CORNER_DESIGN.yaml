            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-DUTIES.csv", declared_row_count: 1, declared_total_cents: 100000, rows: [ { invoice_number: "DUT-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 100000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
