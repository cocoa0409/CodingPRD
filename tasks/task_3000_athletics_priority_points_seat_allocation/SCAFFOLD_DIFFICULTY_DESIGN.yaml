  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_info_request_cycle_returns_to_under_review
        grounds:
          - state_machines.PointDispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.PointDispute.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.PointDispute.fields.info_request_rounds
          - validations.priority_19
        distinguishing_aspect: |
          The PointDispute machine is cyclic, not linear: INFO_REQUESTED walks
          back to UNDER_REVIEW on provide-info, and the loop is bounded by a
          counter rather than by the state itself, so the second completed loop
          leaves the dispute in UNDER_REVIEW with info_request_rounds 2 and the
          third request-info is refused even though the state would admit it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00.000Z."
            - "One donor with a single RECEIVED gift, and a PointRecalculation for cycle 2026 in status COMMUNICATED whose dispute_window_end is 2026-09-30T00:00:00.000Z."
            - "One PointDispute filed by that donor in status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Quinn Disputer", email: "quinn.disputer@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { q_id: "$.data.id" }
            - call: "POST /athletics/donors/${q_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 2000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${r_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${r_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-disputes"
              payload: { donor_id: "${q_id}", recalculation_id: "${r_id}", claimed_points_delta: 10.00, basis_note: "A 2026 capital gift is missing from my statement." }
              as: Donor
              as_user_id: "${q_id}"
              captures: { disp_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-disputes/${disp_id}/review"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "analyst-1"
            - call: "POST /athletics/point-disputes/${disp_id}/request-info"
              payload: { info_note: "Please send the gift receipt." }
              as: DisputeAnalyst
              as_user_id: "analyst-1"
            - call: "POST /athletics/point-disputes/${disp_id}/provide-info"
              payload: { response_note: "Receipt attached." }
              as: Donor
              as_user_id: "${q_id}"
            - call: "POST /athletics/point-disputes/${disp_id}/request-info"
              payload: { info_note: "The receipt is illegible; please resend." }
              as: DisputeAnalyst
              as_user_id: "analyst-1"
            - call: "POST /athletics/point-disputes/${disp_id}/provide-info"
              payload: { response_note: "Legible receipt attached." }
              as: Donor
              as_user_id: "${q_id}"
            - call: "POST /athletics/point-disputes/${disp_id}/request-info"
              payload: { info_note: "One more document, please." }
              as: DisputeAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the second provide-info response has status UNDER_REVIEW and info_request_rounds == 2"
            - "the third request-info call returns ERR_INFO_REQUEST_LIMIT_REACHED with HTTP 422"
            - "PointDispute.${disp_id}.status == UNDER_REVIEW"
            - "PointDispute.${disp_id}.info_request_rounds == 2"
            - "PointDispute.${disp_id}.reviewed_by_user_id == analyst-1"
            - "Donor.${q_id}.dispute_adjustment_points == 0.00"

      - name: seat_assignment_parallel_occupancy_and_payment_dimensions
        grounds:
          - state_machines.SeatAssignment.occupancy_status
          - state_machines.SeatAssignment.payment_status
          - entities.SeatAssignment.fields.amount_paid_cents
          - entities.SeatAssignment.fields.release_reason
          - state_machines.SelectionSlot.CONSUMED_to_FORFEITED
        distinguishing_aspect: |
          SeatAssignment carries two independent state fields, so its state is a
          pair rather than a point on a line: the row reaches payment PAID while
          occupancy is still HELD, and after occupancy walks to its terminal
          RELEASED the payment axis stays PAID with amount_paid_cents intact.
          The consuming slot also stays CONSUMED because the row left occupancy
          from ASSIGNED rather than from HELD.
