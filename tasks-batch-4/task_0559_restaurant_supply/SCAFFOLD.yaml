    input: [product_id, quantity]
    output: OrderLine
    side_effects: ["pricing_tier + line_subtotal_cents computed (line_tier_pricing)", "order subtotal/tax recompute"]

  - method: GET
    path: "/orders/{order_id}/lines"
    description: "List an order's lines (reverse-reachability for OrderLine.order_id)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines filtered by order and/or product (reverse-reachability for OrderLine.order_id and OrderLine.product_id)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["product_id?", "order_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Get a single order line"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/orders/{order_id}/confirm"
    description: "Confirm a draft order: allocate stock, price, reserve credit (OCC on Account.version)"
    roles: [Buyer]
    code: 200
    input: [expected_account_version]
    output: PurchaseOrder
    side_effects: ["allocate/backorder cascade → Product.on_hand_qty → reorder recompute", "tax/total recompute", "Account.version += 1", "lifecycle_status → CONFIRMED"]

  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel a DRAFT or CONFIRMED order (compensating deallocation)"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["compensating restock cascade → Product.on_hand_qty → reorder recompute", "lines → CANCELLED", "lifecycle_status → CANCELLED"]

  - method: POST
    path: "/orders/{order_id}/invoice"
    description: "Invoice a confirmed order (payment dimension)"
    roles: [AccountManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["payment_status → INVOICED"]

  - method: POST
    path: "/orders/{order_id}/pay"
    description: "Record payment on an invoiced order (payment dimension)"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["payment_status → PAID", "Account outstanding recompute"]

  # ---- Shipment ----
  - method: POST
    path: "/shipments"
    description: "Create a shipment quote for a confirmed order (provisional freight & liftgate)"
    roles: [WarehouseOps]
    code: 201
    input: [order_id, carrier, "liftgate_required?"]
    output: Shipment
    side_effects: ["freight_quote_cents = freight_quote(provisional)", "shipping_mode computed", "order.freight_cents = freight_quote_cents; order total recompute", "status=QUOTED"]

  - method: GET
    path: "/shipments"
    description: "List shipments filtered by order (reverse-reachability for Shipment.order_id)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{shipment_id}"
    description: "Get a shipment"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/shipments/{shipment_id}/book"
    description: "Book a quoted shipment: recompute final freight from allocated qty; order → SHIPPED"
    roles: [WarehouseOps]
    code: 200
    input: ["carrier?"]
    output: Shipment
    side_effects: ["final_freight_cents = freight_quote(final)", "order.freight_cents=final; total recompute", "order → SHIPPED; lines → SHIPPED"]

  - method: POST
    path: "/shipments/{shipment_id}/deliver"
