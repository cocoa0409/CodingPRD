  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: c_term_patch_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[term-policy-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on WorkloadTerm.version: after a first PATCH advances version 1 -> 2, a second PATCH still carrying expected_term_version 1 is rejected 412 deterministically."
        test_recipe:
          setup: ["DRAFT term at version 1"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id", t_v: "$.data.version" } }
            - { call: "PATCH /workload-terms/${t_id}", payload: { expected_term_version: "${t_v}", lecture_multiplier: 1.1 }, as: DepartmentChair, captures: { t_v2: "$.data.version" } }
          trigger:
            - { call: "PATCH /workload-terms/${t_id}", payload: { expected_term_version: "${t_v}", lab_multiplier: 0.5 }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
            - { call: "GET /workload-terms/${t_id}", as: DepartmentChair, captures: { t_lab: "$.data.lab_multiplier", t_lec: "$.data.lecture_multiplier" } }
          assert:
            - "First PATCH succeeded: version ${t_v2} == 2 and lecture_multiplier == 1.1"
            - "Second PATCH with stale expected_term_version ${t_v}: ${err} == ERR_STALE_VERSION (http 412)"
            - "lab_multiplier remains 0.75 (rejected write did not apply)"

      - name: c_enrollment_sync_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-sync-stale-section-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CourseSection.version (different parent entity from the term rule): a second sync replaying the pre-first-sync version is rejected 412 and enrolled_count is not overwritten."
        test_recipe:
          setup: ["Term OPEN; CS-301; S1 created (version 1); first sync to 10 succeeds (version 2)"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id", s1_v: "$.data.version" } }
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 10, expected_section_version: "${s1_v}" }, as: Registrar, captures: { s1_v2: "$.data.version", s1_enrolled: "$.data.enrolled_count" } }
          trigger:
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 25, expected_section_version: "${s1_v}" }, as: Registrar, captures: { err: "$.data.error_id" } }
            - { call: "GET /course-sections/${s1_id}", as: DepartmentChair, captures: { s1_final_enrolled: "$.data.enrolled_count" } }
          assert:
            - "First sync: version ${s1_v2} == 2, enrolled_count == 10"
            - "Second sync replaying expected_section_version ${s1_v} (== 1): ${err} == ERR_STALE_VERSION (http 412)"
            - "enrolled_count remains 10 (stale write rejected)"

      - name: c_version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.CourseSection", "endpoints[POST /course-sections/{sectionId}/transition]"]
        distinguishing_aspect: "Every mutation bumps version by exactly 1 and refreshes updated_at: create v1 -> schedule v2 -> sync v3."
        test_recipe:
          setup: ["Term OPEN; CS-301"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair, captures: { v2: "$.data.version" } }
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 5, expected_section_version: "${v2}" }, as: Registrar, captures: { v3: "$.data.version" } }
          assert:
            - "${v1} == 1, ${v2} == 2, ${v3} == 3 (exactly +1 per mutation)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: c_immediate_read_after_write
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a write's effects are visible in the very next GET within the same test — no lag, no re-read divergence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "GET /courses/${c1_id}", as: DepartmentChair, captures: { got_code: "$.data.course_code", got_credits: "$.data.base_credits" } }
          assert:
            - "GET returns course_code == CS-301 and base_credits == 3 in the same request sequence"
