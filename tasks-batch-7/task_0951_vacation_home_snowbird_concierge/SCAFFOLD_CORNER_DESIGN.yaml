        grounds: ["validations[priority=3]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / auditor_write_on_unknown_visit_returns_403_not_404
          rationale: "Asserted as the auth-versus-existence pairing of the named difficulty instance."

