              payload: { project_id: "${p_id}", period_end: "2026-05-31", expected_project_version: "${p_v1}" }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { inv_id: $.data.id }
            - call: "POST /consultant-invoices/${ci_pwp}/release-payment"
              payload: {}
