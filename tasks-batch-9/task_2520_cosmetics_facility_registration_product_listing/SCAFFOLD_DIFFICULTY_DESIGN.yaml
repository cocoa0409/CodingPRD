        distinguishing_aspect: |
          A DIFFERENT error-category pair: BUSINESS_SAFETY (priority 32,
          ERR_ALLERGEN_DISCLOSURE_INCOMPLETE) versus BUSINESS_FISCAL (priority 53,
          ERR_DESIGNATION_CAP_EXCEEDED), both 422 and both raised by the same submit request. The
          safety defect must be reported first: a caller who fixed only the capacity problem would
