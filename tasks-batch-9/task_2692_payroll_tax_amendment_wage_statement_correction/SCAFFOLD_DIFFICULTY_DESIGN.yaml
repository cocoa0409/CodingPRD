            - "AmendedReturn.${ar1_id}.status == VOID after the void call, with void_reason recorded"
            - "the third 941X creation returns HTTP 201 with status == DRAFT and supersedes_amended_return_id == ${ar1_id}"
            - "GET /amended-returns?correction_case_id=${case_id} returns total_count == 3"
