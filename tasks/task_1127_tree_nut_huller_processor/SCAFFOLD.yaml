# =============================================================================
# SCAFFOLD.yaml — Task 1127: Tree-Nut Huller & Processor (California almond huller)
# §1.0–§1.7 seed tables. Difficulty/corner designs live in sibling files.
# =============================================================================

scenario: |
  generate task hard than expert level! 1127. Tree-Nut Huller & Processor (California almond huller): field lot intake & moisture/kernel test, hulling/drying yield & shrink, in-shell vs kernel processing routing, grower payment on graded kernel weight, aflatoxin sampling & lot rejection, storage rotation & fumigation, sizing/sorting spec by buyer, byproduct (hull/shell) sales

domain_name: tree-nut-huller-processor
api_prefix: ""  # flat multi-collection surface; lint infers collection segments from single-resource GETs

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower / ranch legal name" }
      - { name: ranch_code, type: string, source: input, description: "Unique ranch code", constraints: "unique across Grower" }
      - { name: base_price_cents_per_lb, type: integer, source: input, description: "Contracted base price per graded kernel lb, in cents", constraints: "> 0" }
      - { name: premium_rate_pct, type: number, source: input, description: "Grade premium rate applied to base when edible kernel pct meets threshold", default: 0.0, constraints: "0 <= x <= 1" }
      - { name: payable_outstanding_cents, type: integer, source: computed, description: "Sum of total_cents over this grower's Settlements in ISSUED status", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of total_cents over this grower's Settlements in PAID status", default: 0 }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer company name" }
      - { name: buyer_code, type: string, source: input, description: "Unique buyer code", constraints: "unique across Buyer" }

  - name: FieldLot
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; delivering grower" }
      - { name: variety, type: string, source: input, description: "Almond variety (e.g. Nonpareil)" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Scale weight at intake", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SAMPLED | GRADED | ROUTED_IN_SHELL | ROUTED_KERNEL | PROCESSING | PROCESSED | REJECTED | DISPOSED | SETTLED" }
      - { name: intake_moisture_pct, type: number, source: computed, description: "moisture_pct of latest RECORDED MOISTURE_KERNEL LabTest; null until one exists" }
      - { name: intake_kernel_pct, type: number, source: computed, description: "kernel_pct of latest RECORDED MOISTURE_KERNEL LabTest; null until one exists" }
      - { name: intake_fm_pct, type: number, source: computed, description: "foreign_material_pct of latest RECORDED MOISTURE_KERNEL LabTest; null until one exists" }
      - { name: aflatoxin_ppb, type: number, source: computed, description: "aflatoxin_ppb of latest RECORDED AFLATOXIN LabTest; null if none or after resample" }
      - { name: edible_kernel_pct, type: number, source: computed, description: "edible_kernel_pct of latest RECORDED KERNEL_GRADE LabTest; null until one exists" }
      - { name: size_spec, type: enum, source: computed, description: "SPEC_20_22 | SPEC_23_25 | SPEC_25_27 | UNSIZED; from latest RECORDED KERNEL_GRADE LabTest; null until one exists" }
      - { name: post_dry_moisture_pct, type: number, source: computed, description: "final_moisture_pct of latest COMPLETED DryingBatch for this lot; null until one exists" }
      - { name: requires_drying, type: boolean, source: computed, description: "true iff intake_moisture_pct > MOISTURE_STD_PCT (8.0); false once known otherwise; null until intake_moisture_pct known" }
      - { name: kernel_out_lbs, type: number, source: computed, description: "Sum of kernel_out_lbs over COMPLETED ProcessingRuns of this lot", default: 0 }
      - { name: shell_out_lbs, type: number, source: computed, description: "Sum of shell_out_lbs over COMPLETED ProcessingRuns of this lot", default: 0 }
      - { name: hull_out_lbs, type: number, source: computed, description: "Sum of hull_out_lbs over COMPLETED ProcessingRuns of this lot", default: 0 }
      - { name: provisional_kernel_lbs, type: number, source: computed, description: "Forward-looking kernel estimate per calculations.kernel_weight_grading (provisional variant); null until MOISTURE_KERNEL recorded" }
      - { name: graded_kernel_weight_lbs, type: number, source: computed, description: "Final graded kernel weight per calculations.kernel_weight_grading (final variant); null until a KERNEL_GRADE LabTest is RECORDED" }

  - name: LabTest
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> FieldLot.id; lot under test" }
      - { name: test_type, type: enum, source: input, description: "MOISTURE_KERNEL | AFLATOXIN | KERNEL_GRADE" }
      - { name: moisture_pct, type: number, source: input, description: "Required iff test_type=MOISTURE_KERNEL; forbidden otherwise", constraints: "0 < x < 100" }
      - { name: kernel_pct, type: number, source: input, description: "Required iff test_type=MOISTURE_KERNEL; forbidden otherwise", constraints: "0 < x <= 1" }
      - { name: foreign_material_pct, type: number, source: input, description: "Required iff test_type=MOISTURE_KERNEL; forbidden otherwise", constraints: "0 <= x < 1" }
      - { name: aflatoxin_ppb, type: number, source: input, description: "Required iff test_type=AFLATOXIN; forbidden otherwise", constraints: ">= 0" }
      - { name: edible_kernel_pct, type: number, source: input, description: "Required iff test_type=KERNEL_GRADE; forbidden otherwise", constraints: "0 < x <= 1" }
      - { name: size_spec, type: enum, source: input, description: "Required iff test_type=KERNEL_GRADE; forbidden otherwise. SPEC_20_22 | SPEC_23_25 | SPEC_25_27 | UNSIZED" }
      - { name: aflatoxin_verdict, type: enum, source: computed, description: "PASS | FAIL; set only on AFLATOXIN tests per calculations.aflatoxin_verdict; null for other types" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }

  - name: ProcessingRun
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> FieldLot.id; lot being hulled/processed" }
      - { name: input_weight_lbs, type: number, source: system, description: "Snapshot at creation = lot.gross_weight_lbs - sum(input_weight_lbs) over the lot's other non-CANCELLED runs" }
      - { name: kernel_out_lbs, type: number, source: input, description: "Kernel output recorded on complete; null until COMPLETED", constraints: ">= 0" }
      - { name: shell_out_lbs, type: number, source: input, description: "Shell output recorded on complete; null until COMPLETED", constraints: ">= 0" }
      - { name: hull_out_lbs, type: number, source: input, description: "Hull output recorded on complete; null until COMPLETED", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "QUEUED | RUNNING | COMPLETED | CANCELLED" }

  - name: Dryer
    parent: null
    common_fields: true
    fields:
      - { name: dryer_code, type: string, source: input, description: "Unique dryer identifier", constraints: "unique across Dryer" }
      - { name: capacity_lbs, type: integer, source: input, description: "Maximum lot gross weight per batch", constraints: "> 0" }

  - name: DryingBatch
    parent: null
    common_fields: true
    fields:
      - { name: dryer_id, type: string, source: input, description: "FK -> Dryer.id; reserved dryer" }
      - { name: lot_id, type: string, source: input, description: "FK -> FieldLot.id; lot being dried" }
      - { name: start_at, type: datetime, source: input, description: "Reservation window start (half-open interval [start_at, end_at))" }
      - { name: end_at, type: datetime, source: input, description: "Reservation window end (exclusive)", constraints: "must be > start_at" }
      - { name: final_moisture_pct, type: number, source: input, description: "Measured moisture at completion; supplied on complete call; null until COMPLETED", constraints: "0 < x < 100" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DRYING | COMPLETED | CANCELLED" }

  - name: StorageBin
    parent: null
    common_fields: true
    fields:
      - { name: bin_code, type: string, source: input, description: "Unique bin identifier", constraints: "unique across StorageBin" }
      - { name: capacity_lbs, type: integer, source: input, description: "Maximum stored weight", constraints: "> 0" }
      - { name: allowed_product_forms, type: array, source: input, description: "Non-empty subset of [IN_SHELL, KERNEL, HULL, SHELL]" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | FUMIGATING | AERATING" }
      - { name: occupied_lbs, type: number, source: computed, description: "Sum of remaining_lbs over placements in this bin with status IN {STORED, FUMIGATION_HOLD, QUARANTINED}", default: 0 }
      - { name: available_now_lbs, type: number, source: computed, description: "capacity_lbs - occupied_lbs (current variant of calculations.bin_capacity_projection)" }
      - { name: projected_available_lbs, type: number, source: computed, description: "capacity_lbs - occupied_lbs - sum of allocated_planned_lbs over this bin's STORED placements (forward-looking variant)" }
      - { name: fumigation_cleared_at, type: datetime, source: system, description: "cleared_at of the in-progress fumigation; null when status=AVAILABLE" }

  - name: StoragePlacement
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> StorageBin.id; destination bin" }
      - { name: lot_id, type: string, source: input, description: "FK -> FieldLot.id; source lot" }
      - { name: product_form, type: enum, source: input, description: "IN_SHELL | KERNEL | HULL | SHELL" }
      - { name: quantity_lbs, type: number, source: input, description: "Weight placed", constraints: "> 0" }
      - { name: remaining_lbs, type: number, source: system, description: "Unwithdrawn remainder; initialized = quantity_lbs" }
      - { name: allocated_planned_lbs, type: number, source: computed, description: "Sum of allocation quantities over PLANNED/BLOCKED Shipments referencing this placement", default: 0 }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock timestamp at placement (FIFO order key)" }
      - { name: status, type: enum, source: system, description: "STORED | FUMIGATION_HOLD | QUARANTINED | WITHDRAWN | DISPOSED" }

  - name: Withdrawal
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> StorageBin.id; source bin" }
      - { name: product_form, type: enum, source: input, description: "IN_SHELL | KERNEL | HULL | SHELL" }
      - { name: quantity_lbs, type: number, source: input, description: "Total weight to withdraw", constraints: "> 0" }
      - { name: allocations, type: array, source: system, description: "Ordered list of {placement_id, lot_id, quantity_lbs} consumed, in FIFO order per calculations.fifo_withdrawal_allocation" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical clock timestamp at withdrawal" }

  - name: FumigationEvent
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> StorageBin.id; fumigated bin" }
      - { name: start_at, type: datetime, source: input, description: "Scheduled start" }
      - { name: aeration_hours, type: integer, source: input, description: "Aeration buffer length in hours", constraints: "> 0" }
      - { name: cleared_at, type: datetime, source: system, description: "Set at begin-aeration = current logical clock + aeration_hours; null until AERATING" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | AERATING | CLEARED | CANCELLED" }

  - name: BuyerContract
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; contracting buyer" }
      - { name: product_form, type: enum, source: input, description: "IN_SHELL | KERNEL" }
      - { name: size_spec, type: enum, source: input, description: "SPEC_20_22 | SPEC_23_25 | SPEC_25_27 | UNSIZED; UNSIZED accepts any lot size_spec" }
      - { name: max_defects_pct, type: number, source: input, description: "Maximum defect fraction accepted", constraints: "0 <= x < 1" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Sale price per lb", constraints: "> 0" }
      - { name: required_qty_lbs, type: number, source: input, description: "Total contracted weight", constraints: "> 0" }
      - { name: reserved_qty_lbs, type: number, source: computed, description: "Sum of quantity_lbs over PLANNED/BLOCKED Shipments of this contract", default: 0 }
      - { name: delivered_qty_lbs, type: number, source: computed, description: "Sum of quantity_lbs over DELIVERED Shipments of this contract", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | FULFILLED | CLOSED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> BuyerContract.id; fulfilled contract" }
      - { name: bin_id, type: string, source: input, description: "FK -> StorageBin.id; source bin" }
      - { name: quantity_lbs, type: number, source: input, description: "Weight to ship", constraints: "> 0" }
      - { name: allocations, type: array, source: system, description: "Ordered list of {placement_id, lot_id, quantity_lbs} reserved at creation, FIFO per calculations.fifo_withdrawal_allocation" }
      - { name: status, type: enum, source: system, description: "PLANNED | BLOCKED | DELIVERED | CANCELLED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> FieldLot.id; settled lot" }
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; copied from lot.grower_id at creation" }
      - { name: graded_kernel_weight_lbs, type: number, source: system, description: "Snapshot of lot.graded_kernel_weight_lbs at creation" }
      - { name: base_cents, type: integer, source: computed, description: "Per calculations.settlement_amount (component rounded before summing)" }
      - { name: premium_cents, type: integer, source: computed, description: "Per calculations.settlement_amount" }
      - { name: moisture_deduction_cents, type: integer, source: computed, description: "Per calculations.settlement_amount" }
      - { name: total_cents, type: integer, source: computed, description: "base_cents + premium_cents - moisture_deduction_cents (sum of already-rounded components)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | CANCELLED" }

  - name: ByproductSale
    parent: null
    common_fields: true
    fields:
      - { name: product_form, type: enum, source: input, description: "HULL | SHELL" }
      - { name: quantity_lbs, type: number, source: input, description: "Weight sold", constraints: "> 0" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Sale price per lb", constraints: "> 0" }
      - { name: buyer_name, type: string, source: input, description: "Free-text counterparty (byproduct buyers are not Buyer entities)" }
      - { name: total_cents, type: integer, source: computed, description: "round_half_up(quantity_lbs * price_cents_per_lb)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FieldLot
    initial_state: RECEIVED
    terminal_states: [DISPOSED, SETTLED]
    transitions:
      - from: RECEIVED
        to: SAMPLED
        trigger: "POST /lab-tests with test_type=MOISTURE_KERNEL"
        actor: LabTechnician
        preconditions:
          - "lot.status == RECEIVED"
        side_effects:
          - "lot.intake_moisture_pct / intake_kernel_pct / intake_fm_pct set from the test"
          - "lot.requires_drying recomputed (intake_moisture_pct > 8.0)"
          - "lot.provisional_kernel_lbs computed (calculations.kernel_weight_grading, provisional variant)"
      - from: SAMPLED
        to: GRADED
        trigger: "POST /lab-tests with test_type=AFLATOXIN and aflatoxin_verdict == PASS"
        actor: LabTechnician
        preconditions:
          - "lot.status == SAMPLED"
          - "aflatoxin_ppb < 20.0 (calculations.aflatoxin_verdict)"
        side_effects:
          - "lot.aflatoxin_ppb set from the test"
          - "COMPENSATION (resample-pass path): this lot's StoragePlacements in QUARANTINED -> STORED"
          - "Shipments in BLOCKED whose allocations reference only placements no longer QUARANTINED/FUMIGATION_HOLD -> PLANNED"
      - from: [SAMPLED, GRADED, ROUTED_IN_SHELL, ROUTED_KERNEL, PROCESSING, PROCESSED]
        to: REJECTED
        trigger: "POST /lab-tests with test_type=AFLATOXIN and aflatoxin_verdict == FAIL"
        actor: LabTechnician
        preconditions:
          - "aflatoxin_ppb >= 20.0 (calculations.aflatoxin_verdict)"
        side_effects:
          - "lot.aflatoxin_ppb set from the test"
          - "CASCADE link 2: this lot's StoragePlacements in STORED -> QUARANTINED"
          - "CASCADE link 3: Shipments in PLANNED whose allocations reference any of those placements -> BLOCKED"
      - from: REJECTED
        to: SAMPLED
        trigger: "POST /lots/{id}/resample"
        actor: IntakeOperator
        preconditions:
          - "lot.status == REJECTED"
        side_effects:
          - "lot.aflatoxin_ppb reset to null (awaiting new AFLATOXIN test)"
          - "placements stay QUARANTINED until a subsequent AFLATOXIN PASS"
      - from: REJECTED
        to: DISPOSED
        trigger: "POST /lots/{id}/dispose"
        actor: IntakeOperator
        preconditions:
          - "lot.status == REJECTED"
        side_effects:
          - "this lot's StoragePlacements in QUARANTINED -> DISPOSED"
          - "affected StorageBin.occupied_lbs / available_now_lbs / projected_available_lbs recomputed (disposed weight leaves the bin)"
      - from: GRADED
        to: ROUTED_IN_SHELL
        trigger: "POST /lots/{id}/route with route=IN_SHELL"
        actor: IntakeOperator
        preconditions:
          - "lot.status == GRADED"
          - "latest AFLATOXIN test recorded with PASS (business_safety, ERR_AFLATOXIN_UNRESOLVED)"
          - "if lot.requires_drying: a COMPLETED DryingBatch exists for the lot (ERR_DRYING_REQUIRED)"
        side_effects: []
      - from: GRADED
        to: ROUTED_KERNEL
        trigger: "POST /lots/{id}/route with route=KERNEL"
        actor: IntakeOperator
        preconditions:
          - "lot.status == GRADED"
          - "latest AFLATOXIN test recorded with PASS (business_safety, ERR_AFLATOXIN_UNRESOLVED)"
          - "if lot.requires_drying: a COMPLETED DryingBatch exists for the lot (ERR_DRYING_REQUIRED)"
        side_effects: []
      - from: [ROUTED_IN_SHELL, ROUTED_KERNEL]
        to: PROCESSING
        trigger: "POST /processing-runs (first non-cancelled run for the lot)"
        actor: PlantOperator
        preconditions:
          - "lot.status IN {ROUTED_IN_SHELL, ROUTED_KERNEL}"
          - "expected_lot_version == lot.version (OCC, ERR_STALE_LOT_VERSION)"
        side_effects:
          - "increments FieldLot.version by 1"
      - from: PROCESSING
        to: PROCESSED
        trigger: "POST /processing-runs/{id}/complete (first COMPLETED run)"
        actor: PlantOperator
        preconditions:
          - "run.status == RUNNING"
        side_effects:
          - "lot.kernel_out_lbs / shell_out_lbs / hull_out_lbs recomputed over COMPLETED runs"
      - from: PROCESSED
        to: SETTLED
        trigger: "system (a Settlement for this lot transitions ISSUED -> PAID)"
        actor: system
        preconditions:
          - "settlement.lot_id == lot.id and settlement transitions to PAID"
        side_effects: []
        note: "bubble-up from Settlement pay"

  - entity: ProcessingRun
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /processing-runs/{id}/start"
        actor: PlantOperator
        preconditions:
          - "run.status == QUEUED"
          - "run's lot.status IN {ROUTED_IN_SHELL, ROUTED_KERNEL, PROCESSING}"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /processing-runs/{id}/complete"
        actor: PlantOperator
        preconditions:
          - "run.status == RUNNING"
          - "kernel_out_lbs + shell_out_lbs + hull_out_lbs <= run.input_weight_lbs (ERR_SHRINK_NEGATIVE)"
        side_effects:
          - "run.kernel_out_lbs / shell_out_lbs / hull_out_lbs recorded"
          - "lot.kernel_out_lbs / shell_out_lbs / hull_out_lbs recomputed (COMPLETED runs only)"
          - "lot -> PROCESSED if lot.status == PROCESSING"
          - "lot.graded_kernel_weight_lbs recomputed if a KERNEL_GRADE LabTest exists"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /processing-runs/{id}/cancel"
        actor: PlantOperator
        preconditions:
          - "run.status == QUEUED"
        side_effects: []

  - entity: DryingBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DRYING
        trigger: "POST /drying-batches/{id}/start"
        actor: PlantOperator
        preconditions:
          - "batch.status == SCHEDULED"
          - "current logical clock >= batch.start_at (ERR_SCHEDULE_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: DRYING
        to: COMPLETED
        trigger: "POST /drying-batches/{id}/complete"
        actor: PlantOperator
        preconditions:
          - "batch.status == DRYING"
          - "current logical clock >= batch.end_at (ERR_SCHEDULE_WINDOW_NOT_OPEN)"
        side_effects:
          - "batch.final_moisture_pct recorded"
          - "lot.post_dry_moisture_pct = final_moisture_pct"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /drying-batches/{id}/cancel"
        actor: PlantOperator
        preconditions:
          - "batch.status == SCHEDULED"
        side_effects: []

  - entity: StorageBin
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: FUMIGATING
        trigger: "system (POST /fumigations/{id}/start on a SCHEDULED FumigationEvent of this bin)"
        actor: system
        preconditions:
          - "bin.status == AVAILABLE"
        side_effects:
          - "bin.fumigation_cleared_at = null"
      - from: FUMIGATING
        to: AERATING
        trigger: "system (POST /fumigations/{id}/begin-aeration)"
        actor: system
        preconditions:
          - "bin.status == FUMIGATING"
        side_effects:
          - "bin.fumigation_cleared_at = event.cleared_at"
      - from: AERATING
        to: AVAILABLE
        trigger: "system (lazy clearance: evaluated on POST /_clock/set_current_utc and on any operation touching the bin, when current logical clock >= event.cleared_at)"
        actor: system
        preconditions:
          - "current logical clock >= cleared_at of the AERATING event"
        side_effects:
          - "event AERATING -> CLEARED"
          - "bin.fumigation_cleared_at = null"
          - "placements FUMIGATION_HOLD -> STORED"
          - "Shipments BLOCKED whose allocated placements are all back to STORED -> PLANNED"

  - entity: StoragePlacement
    initial_state: STORED
    terminal_states: [WITHDRAWN, DISPOSED]
    transitions:
      - from: STORED
        to: WITHDRAWN
        trigger: "system (POST /withdrawals or POST /shipments/{id}/confirm consumes remaining_lbs to 0)"
        actor: system
        preconditions:
          - "remaining_lbs reaches 0 via FIFO consumption"
        side_effects:
          - "StorageBin.occupied_lbs / available_now_lbs / projected_available_lbs recomputed"
      - from: STORED
        to: QUARANTINED
        trigger: "system (AFLATOXIN FAIL on placement's lot — cascade link 2)"
        actor: system
        preconditions:
          - "placement.lot transitions to REJECTED"
        side_effects:
          - "PLANNED Shipments allocating this placement -> BLOCKED (cascade link 3)"
      - from: QUARANTINED
        to: STORED
        trigger: "system (subsequent AFLATOXIN PASS after resample — compensation)"
        actor: system
        preconditions:
          - "placement.lot transitions SAMPLED -> GRADED"
        side_effects:
          - "BLOCKED Shipments whose allocated placements are all STORED -> PLANNED"
      - from: QUARANTINED
        to: DISPOSED
        trigger: "system (POST /lots/{id}/dispose on placement's lot)"
        actor: system
        preconditions:
          - "placement.lot transitions REJECTED -> DISPOSED"
        side_effects:
          - "StorageBin.occupied_lbs recomputed (weight leaves bin)"
      - from: STORED
        to: FUMIGATION_HOLD
        trigger: "system (POST /fumigations/{id}/start on placement's bin — cascade link 1)"
        actor: system
        preconditions:
          - "placement.bin transitions AVAILABLE -> FUMIGATING"
        side_effects:
          - "PLANNED Shipments allocating this placement -> BLOCKED (cascade link 2)"
      - from: FUMIGATION_HOLD
        to: STORED
        trigger: "system (fumigation event CLEARED)"
        actor: system
        preconditions:
          - "placement.bin transitions AERATING -> AVAILABLE"
        side_effects:
          - "BLOCKED Shipments whose allocated placements are all STORED -> PLANNED"

  - entity: FumigationEvent
    initial_state: SCHEDULED
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /fumigations/{id}/start"
        actor: PlantAdmin
        preconditions:
          - "event.status == SCHEDULED"
          - "current logical clock >= event.start_at (ERR_SCHEDULE_WINDOW_NOT_OPEN)"
          - "bin.status == AVAILABLE"
        side_effects:
          - "CASCADE link 1: bin.status AVAILABLE -> FUMIGATING"
          - "CASCADE link 1b: bin's placements STORED -> FUMIGATION_HOLD"
          - "CASCADE link 2: PLANNED Shipments allocating those placements -> BLOCKED"
      - from: ACTIVE
        to: AERATING
        trigger: "POST /fumigations/{id}/begin-aeration"
        actor: PlantAdmin
        preconditions:
          - "event.status == ACTIVE"
        side_effects:
          - "event.cleared_at = current logical clock + aeration_hours hours"
          - "bin.status FUMIGATING -> AERATING; bin.fumigation_cleared_at = cleared_at"
      - from: AERATING
        to: CLEARED
        trigger: "system (lazy clearance on clock-set or bin operation when clock >= cleared_at)"
        actor: system
        preconditions:
          - "current logical clock >= event.cleared_at"
        side_effects:
          - "bin.status AERATING -> AVAILABLE"
          - "placements FUMIGATION_HOLD -> STORED"
          - "BLOCKED Shipments whose allocated placements are all STORED -> PLANNED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fumigations/{id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "event.status == SCHEDULED"
        side_effects: []

  - entity: BuyerContract
    initial_state: OPEN
    terminal_states: [FULFILLED, CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /contracts/{id}/suspend"
        actor: PlantAdmin
        preconditions:
          - "contract.status == OPEN"
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /contracts/{id}/resume"
        actor: PlantAdmin
        preconditions:
          - "contract.status == SUSPENDED"
        side_effects: []
      - from: OPEN
        to: FULFILLED
        trigger: "system (POST /shipments/{id}/confirm makes delivered_qty_lbs == required_qty_lbs)"
        actor: system
        preconditions:
          - "delivered_qty_lbs == required_qty_lbs after confirm"
        side_effects: []
        note: "bubble-up from Shipment confirm"
      - from: [OPEN, SUSPENDED, FULFILLED]
        to: CLOSED
        trigger: "POST /contracts/{id}/close"
        actor: PlantAdmin
        preconditions:
          - "contract.reserved_qty_lbs == 0"
        side_effects: []

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /shipments/{id}/confirm"
        actor: PlantOperator
        preconditions:
          - "shipment.status == PLANNED"
          - "shipment's bin.status == AVAILABLE (business_safety, ERR_BIN_FUMIGATION_ACTIVE; lazy fumigation clearance evaluated first)"
          - "no allocated placement in QUARANTINED (else shipment would be BLOCKED)"
        side_effects:
          - "allocated placements' remaining_lbs decremented by allocated quantities; placements hitting 0 -> WITHDRAWN"
          - "allocated placements' allocated_planned_lbs decremented"
          - "contract.reserved_qty_lbs -= quantity_lbs; contract.delivered_qty_lbs += quantity_lbs"
          - "contract OPEN -> FULFILLED when delivered_qty_lbs == required_qty_lbs"
          - "bin occupied/available fields recomputed"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: PlantOperator
        preconditions:
          - "shipment.status == PLANNED"
        side_effects:
          - "allocated placements' allocated_planned_lbs decremented (remaining_lbs untouched — compensation)"
          - "contract.reserved_qty_lbs -= quantity_lbs"
      - from: PLANNED
        to: BLOCKED
        trigger: "system (allocated placement -> QUARANTINED or FUMIGATION_HOLD)"
        actor: system
        preconditions:
          - "any allocated placement left STORED"
        side_effects: []
      - from: BLOCKED
        to: PLANNED
        trigger: "system (all allocated placements back to STORED)"
        actor: system
        preconditions:
          - "every allocated placement.status == STORED"
        side_effects: []

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /settlements/{id}/approve"
        actor: PlantAdmin
        preconditions:
          - "settlement.status == DRAFT"
        side_effects:
          - "grower.payable_outstanding_cents += settlement.total_cents"
      - from: ISSUED
        to: DRAFT
        trigger: "POST /settlements/{id}/void"
        actor: PlantAdmin
        preconditions:
          - "settlement.status == ISSUED"
        side_effects:
          - "grower.payable_outstanding_cents -= settlement.total_cents (compensation of approve)"
      - from: ISSUED
        to: PAID
        trigger: "POST /settlements/{id}/pay"
        actor: PlantAdmin
        preconditions:
          - "settlement.status == ISSUED"
        side_effects:
          - "grower.payable_outstanding_cents -= settlement.total_cents"
          - "grower.lifetime_paid_cents += settlement.total_cents"
          - "settlement's lot PROCESSED -> SETTLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /settlements/{id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "settlement.status == DRAFT"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-lot
    parent_entity: FieldLot
    write_endpoint: "POST /processing-runs"
    occ_field: "expected_lot_version"
    description: |
      Creating a ProcessingRun against a FieldLot whose version has advanced
      since the client last observed it is rejected. Multiple runs per lot are
      legitimate, so a second create with a fresh version succeeds; the stale
      writer's view of the lot is rejected instead.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: shipment-create-stale-contract
    parent_entity: BuyerContract
    write_endpoint: "POST /shipments"
    occ_field: "expected_contract_version"
    description: |
      Creating a Shipment against a BuyerContract whose version has advanced
      since the client last observed it is rejected. Multiple shipments per
      contract are legitimate, so a second create with a fresh version
      succeeds; the stale writer's view of the contract is rejected instead.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kernel_weight_grading
    trigger: "provisional variant: when a MOISTURE_KERNEL LabTest is RECORDED; final variant: when a KERNEL_GRADE LabTest is RECORDED or a ProcessingRun completes while a KERNEL_GRADE exists"
    algorithm: forward_looking
    formula: |
      # provisional variant (FieldLot.provisional_kernel_lbs):
      excess = max(0, intake_moisture_pct - MOISTURE_STD_PCT)
      provisional_kernel_lbs = round_half_up_2dp(
          gross_weight_lbs * intake_kernel_pct * (1 - intake_fm_pct)
          * (1 - SHRINK_PER_MOISTURE_POINT * excess) )
      # final variant (FieldLot.graded_kernel_weight_lbs):
      graded_kernel_weight_lbs = round_half_up_2dp(
          (sum of kernel_out_lbs over this lot's COMPLETED ProcessingRuns)
          * edible_kernel_pct )
    input_set: "provisional: the lot's latest RECORDED MOISTURE_KERNEL test + gross_weight_lbs; final: COMPLETED ProcessingRuns only (QUEUED/RUNNING/CANCELLED excluded) + latest RECORDED KERNEL_GRADE test"
    constants:
      MOISTURE_STD_PCT: 8.0
      SHRINK_PER_MOISTURE_POINT: 0.01
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "intake, before processing — forward-looking estimate from the intake MOISTURE_KERNEL test"
        difference: "uses gross_weight_lbs and intake test fractions with a moisture-excess shrink factor; ignores actual run outputs"
      - name: final
        when: "after processing — actual graded kernel weight backing grower payment"
        difference: "uses completed-run kernel_out_lbs times the KERNEL_GRADE edible_kernel_pct; ignores intake estimates entirely"

  - name: settlement_amount
    trigger: "POST /settlements (creation snapshots the lot's graded kernel weight and prices it)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED: each component is rounded to whole cents
      # (round_half_up) BEFORE summation; total_cents is the integer sum of
      # already-rounded components — never round(sum(...)).
      effective_moisture = lot.post_dry_moisture_pct if not null else lot.intake_moisture_pct
      excess = max(0, effective_moisture - MOISTURE_STD_PCT)
      base_cents = round_half_up_0dp(graded_kernel_weight_lbs * grower.base_price_cents_per_lb)
      premium_cents = round_half_up_0dp(base_cents * grower.premium_rate_pct)
                      if lot.edible_kernel_pct >= PREMIUM_GRADE_PCT else 0
      moisture_deduction_cents = round_half_up_0dp(base_cents * DEDUCT_PER_MOISTURE_POINT * excess)
      total_cents = base_cents + premium_cents - moisture_deduction_cents
    input_set: "the Settlement's snapshotted graded_kernel_weight_lbs; the lot's latest KERNEL_GRADE edible_kernel_pct; the lot's post_dry_moisture_pct (if any) else intake_moisture_pct; the grower's base_price_cents_per_lb and premium_rate_pct"
    constants:
      MOISTURE_STD_PCT: 8.0
      PREMIUM_GRADE_PCT: 0.70
      DEDUCT_PER_MOISTURE_POINT: 0.005
    precision: "0 decimal places (whole cents) per component, round_half_up; components rounded first, then summed"

  - name: bin_capacity_projection
    trigger: "recomputed on any mutation of the bin's placements or of PLANNED/BLOCKED shipments allocating them; surfaced on GET /bins and GET /bins/{id}"
    algorithm: aggregation
    formula: |
      occupied_lbs = sum(remaining_lbs) over placements of this bin
                     with status IN {STORED, FUMIGATION_HOLD, QUARANTINED}
      available_now_lbs = capacity_lbs - occupied_lbs
      projected_available_lbs = capacity_lbs - occupied_lbs
                                - sum(allocated_planned_lbs) over the same placements
    input_set: "placements of this bin with status IN {STORED, FUMIGATION_HOLD, QUARANTINED} (WITHDRAWN and DISPOSED excluded); allocated_planned_lbs counts only PLANNED/BLOCKED shipment allocations"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: current
        when: "available_now_lbs — what can be placed right now"
        difference: "subtracts occupied only; ignores shipment reservations"
      - name: forward_looking
        when: "projected_available_lbs — what remains free assuming all PLANNED/BLOCKED shipments ship"
        difference: "additionally subtracts allocated_planned_lbs; strictly <= available_now_lbs"

  - name: fifo_withdrawal_allocation
    trigger: "POST /withdrawals (consumes stock) and POST /shipments (reserves stock)"
    algorithm: chronological
    formula: |
      eligible = placements p where p.bin_id == target bin
                 AND p.status == STORED
                 AND p.product_form == requested product_form
      sort eligible by (placed_at ASC, created_at ASC)   # tie-break: created_at, never id
      free(p) = p.remaining_lbs - p.allocated_planned_lbs
      walk the sorted list, consuming min(needed, free(p)) from each,
      until the requested quantity_lbs is satisfied; the last placement
      may be partially consumed. Pool insufficient -> ERR_INSUFFICIENT_STORED.
      For POST /shipments the same walk reserves (allocated_planned_lbs)
      instead of consuming, and an additional spec gate applies:
      if contract.size_spec != UNSIZED, every allocated placement's lot
      size_spec must equal contract.size_spec, else ERR_SPEC_MISMATCH.
    input_set: "STORED placements of the target bin matching product_form; QUARANTINED/FUMIGATION_HOLD/WITHDRAWN/DISPOSED excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: aflatoxin_verdict
    trigger: "POST /lab-tests with test_type=AFLATOXIN"
    algorithm: threshold
    formula: |
      aflatoxin_verdict = FAIL if aflatoxin_ppb >= AFLATOXIN_LIMIT_PPB else PASS
    input_set: "the aflatoxin_ppb value of the test being recorded"
    constants:
      AFLATOXIN_LIMIT_PPB: 20.0
    precision: "1 decimal place comparison; the boundary value 20.0 itself is FAIL (>=)"

  - name: byproduct_available_stock
    trigger: "validated on POST /byproduct-sales; aggregation over plant-wide production and sales"
    algorithm: aggregation
    formula: |
      stock(HULL)  = sum(hull_out_lbs)  over ALL COMPLETED ProcessingRuns
                     - sum(quantity_lbs) over all ByproductSale with product_form=HULL
      stock(SHELL) = sum(shell_out_lbs) over ALL COMPLETED ProcessingRuns
                     - sum(quantity_lbs) over all ByproductSale with product_form=SHELL
      sale allowed iff quantity_lbs <= stock(product_form)
    input_set: "COMPLETED ProcessingRuns only; all ByproductSale rows (sales are append-only, never reversed)"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: dryer_reservation_overlap
    trigger: "POST /drying-batches"
    algorithm: interval_merge
    formula: |
      # Half-open intervals: [start_at, end_at). Adjacent reservations where
      # new.start_at == existing.end_at do NOT conflict.
      conflict(dryer) = exists existing batch b on same dryer
          with b.status IN {SCHEDULED, DRYING}
          AND new.start_at < b.end_at AND new.end_at > b.start_at
    input_set: "DryingBatches of the same dryer with status IN {SCHEDULED, DRYING}; COMPLETED/CANCELLED excluded"
    constants: {}
    precision: "ISO8601 timestamp comparison, exact to the second"

  - name: fumigation_schedule_overlap
    trigger: "POST /fumigations"
    algorithm: interval_merge
    formula: |
      # Closed intervals INCLUDING the aeration buffer:
      # effective_end(e) = e.cleared_at if set, else e.start_at + e.aeration_hours
      # occupied(e) = [e.start_at, effective_end(e)] — BOTH endpoints inclusive.
      # A new event whose start_at == existing effective_end CONFLICTS
      # (closed-interval touch); it must be strictly greater.
      conflict(bin) = exists existing event e on same bin
          with e.status IN {SCHEDULED, ACTIVE, AERATING}
          AND new.start_at <= effective_end(e) AND effective_end(new) >= e.start_at
    input_set: "FumigationEvents of the same bin with status IN {SCHEDULED, ACTIVE, AERATING}; CLEARED/CANCELLED excluded"
    constants: {}
    precision: "ISO8601 timestamp comparison, exact to the second"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles; ownership scope: Grower may only access lots/settlements whose grower_id == X-User-ID, Buyer only contracts/shipments whose (contract.)buyer_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids validated left-to-right, then body FK fields (grower_id, lot_id, dryer_id, bin_id, contract_id, buyer_id) must reference existing entities"
    error_id: ERR_GROWER_NOT_FOUND
    http_status: 404
    applies_to: "all (per-entity variants: ERR_BUYER_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_DRYER_NOT_FOUND, ERR_DRYING_BATCH_NOT_FOUND, ERR_BIN_NOT_FOUND, ERR_PROCESSING_RUN_NOT_FOUND, ERR_FUMIGATION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND)"
  - priority: 4
    category: state
    check: "OCC: expected_lot_version == FieldLot.version on POST /processing-runs; expected_contract_version == BuyerContract.version on POST /shipments"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /processing-runs (ERR_STALE_LOT_VERSION), POST /shipments (ERR_STALE_CONTRACT_VERSION)"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, types correct, enum values in declared sets, test-type-conditional field rules on POST /lab-tests (fields required/forbidden per test_type)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints (ERR_INVALID_ENUM for enum membership failures)"
  - priority: 6
    category: state
    check: "State preconditions of the target transition hold (§1.2). Triggers on terminal states are rejected with ERR_ALREADY_TERMINAL; any other invalid from-state with ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (route, resample, dispose, run start/complete/cancel, batch start/complete/cancel, fumigation start/begin-aeration/cancel, contract suspend/resume/close, shipment confirm/cancel, settlement approve/void/pay/cancel); also POST /lab-tests (KERNEL_GRADE requires lot PROCESSED; AFLATOXIN/MOISTURE_KERNEL require a non-terminal lot) and POST /drying-batches (lot must have a RECORDED MOISTURE_KERNEL test)"
  - priority: 7
    category: business_safety
    check: "Aflatoxin clearance: routing requires a RECORDED AFLATOXIN test with verdict PASS (ERR_AFLATOXIN_UNRESOLVED). Fumigation lockout: no placements, withdrawals, shipment creation, or shipment confirmation touching a bin whose status IN {FUMIGATING, AERATING} after lazy clearance evaluation (ERR_BIN_FUMIGATION_ACTIVE)"
    error_id: ERR_AFLATOXIN_UNRESOLVED
    http_status: 422
    applies_to: "POST /lots/{id}/route (ERR_AFLATOXIN_UNRESOLVED); POST /placements, POST /withdrawals, POST /shipments, POST /shipments/{id}/confirm (ERR_BIN_FUMIGATION_ACTIVE)"
  - priority: 8
    category: business_temporal
    check: "Dryer reservation overlap per calculations.dryer_reservation_overlap (ERR_DRYER_TIME_CONFLICT); fumigation schedule overlap incl. aeration buffer per calculations.fumigation_schedule_overlap (ERR_FUMIGATION_TIME_CONFLICT); batch/fumigation start before start_at, batch complete before end_at (ERR_SCHEDULE_WINDOW_NOT_OPEN)"
    error_id: ERR_DRYER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /drying-batches (ERR_DRYER_TIME_CONFLICT), POST /fumigations (ERR_FUMIGATION_TIME_CONFLICT), POST /drying-batches/{id}/start, POST /drying-batches/{id}/complete, POST /fumigations/{id}/start (ERR_SCHEDULE_WINDOW_NOT_OPEN, 422)"
  - priority: 9
    category: business_constraint
    check: "Drying prerequisite when lot.requires_drying (ERR_DRYING_REQUIRED); placement product_form in bin.allowed_product_forms (ERR_BIN_PRODUCT_MISMATCH); bin capacity occupied+quantity <= capacity (ERR_BIN_CAPACITY_EXCEEDED); shipment size-spec gate per calculations.fifo_withdrawal_allocation (ERR_SPEC_MISMATCH); run outputs sum <= input_weight_lbs (ERR_SHRINK_NEGATIVE); per-lot per-form placed total <= lot output of that form (ERR_LOT_OUTPUT_EXCEEDED)"
    error_id: ERR_DRYING_REQUIRED
    http_status: 422
    applies_to: "POST /lots/{id}/route (ERR_DRYING_REQUIRED); POST /placements (ERR_BIN_PRODUCT_MISMATCH, ERR_BIN_CAPACITY_EXCEEDED, ERR_LOT_OUTPUT_EXCEEDED); POST /shipments (ERR_SPEC_MISMATCH); POST /processing-runs/{id}/complete (ERR_SHRINK_NEGATIVE)"
  - priority: 10
    category: business_fiscal
    check: "Shipment reserved+delivered+quantity <= contract.required_qty_lbs (ERR_CONTRACT_REMAINING_EXCEEDED); withdrawal quantity <= FIFO free pool (ERR_INSUFFICIENT_STORED); byproduct sale quantity <= calculations.byproduct_available_stock (ERR_BYPRODUCT_STOCK_EXCEEDED)"
    error_id: ERR_CONTRACT_REMAINING_EXCEEDED
    http_status: 422
    applies_to: "POST /shipments (ERR_CONTRACT_REMAINING_EXCEEDED), POST /withdrawals (ERR_INSUFFICIENT_STORED), POST /byproduct-sales (ERR_BYPRODUCT_STOCK_EXCEEDED)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed role (Grower/Buyer) accessing a resource outside its ownership scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or test-type-conditional field rule violated on POST /lab-tests" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside the declared set" }
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "grower_id path/body reference does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyer_id path/body reference does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot_id path/body reference does not exist" }
  - { id: ERR_DRYER_NOT_FOUND, http: 404, condition: "dryer_id path/body reference does not exist" }
  - { id: ERR_DRYING_BATCH_NOT_FOUND, http: 404, condition: "drying-batch id in path does not exist" }
  - { id: ERR_BIN_NOT_FOUND, http: 404, condition: "bin_id path/body reference does not exist" }
  - { id: ERR_PROCESSING_RUN_NOT_FOUND, http: 404, condition: "processing-run id in path does not exist" }
  - { id: ERR_FUMIGATION_NOT_FOUND, http: 404, condition: "fumigation id in path does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract_id path/body reference does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id in path does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement id in path does not exist" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version != FieldLot.version on POST /processing-runs (OCC)" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != BuyerContract.version on POST /shipments (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition precondition fails: target entity not in a valid from-state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Trigger attempted on an entity already in a terminal state" }
  - { id: ERR_AFLATOXIN_UNRESOLVED, http: 422, condition: "Routing a lot without a RECORDED AFLATOXIN test with verdict PASS" }
  - { id: ERR_BIN_FUMIGATION_ACTIVE, http: 422, condition: "Placement/withdrawal/shipment-create/shipment-confirm touches a bin in FUMIGATING or AERATING status" }
  - { id: ERR_DRYER_TIME_CONFLICT, http: 409, condition: "New drying batch overlaps an existing SCHEDULED/DRYING batch on the same dryer (half-open intervals)" }
  - { id: ERR_FUMIGATION_TIME_CONFLICT, http: 409, condition: "New fumigation event overlaps an existing event's closed [start_at, effective_end] interval incl. aeration buffer" }
  - { id: ERR_SCHEDULE_WINDOW_NOT_OPEN, http: 422, condition: "Start before start_at, or batch complete before end_at, per the logical clock" }
  - { id: ERR_DRYING_REQUIRED, http: 422, condition: "Routing a lot with intake_moisture_pct > 8.0 and no COMPLETED DryingBatch" }
  - { id: ERR_BIN_PRODUCT_MISMATCH, http: 422, condition: "Placement product_form not in bin.allowed_product_forms" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 422, condition: "occupied_lbs + quantity_lbs > capacity_lbs (equality is allowed)" }
  - { id: ERR_SPEC_MISMATCH, http: 422, condition: "Allocated placement lot size_spec != contract.size_spec for a non-UNSIZED contract" }
  - { id: ERR_SHRINK_NEGATIVE, http: 422, condition: "kernel_out + shell_out + hull_out > run.input_weight_lbs on run completion" }
  - { id: ERR_LOT_OUTPUT_EXCEEDED, http: 422, condition: "Cumulative placed weight of a product form for a lot exceeds that lot's output of that form" }
  - { id: ERR_CONTRACT_REMAINING_EXCEEDED, http: 422, condition: "reserved_qty_lbs + delivered_qty_lbs + quantity_lbs > contract.required_qty_lbs" }
  - { id: ERR_INSUFFICIENT_STORED, http: 422, condition: "FIFO free pool (remaining - allocated_planned) of matching STORED placements < requested quantity" }
  - { id: ERR_BYPRODUCT_STOCK_EXCEEDED, http: 422, condition: "Byproduct sale quantity exceeds calculations.byproduct_available_stock for that form" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: /growers, description: "Register a grower with contracted pricing", roles: [PlantAdmin], code: 201, input: [name, ranch_code, base_price_cents_per_lb, "premium_rate_pct?"], output: Grower, side_effects: [] }
  - { method: GET, path: /growers, description: "List growers (paginated)", roles: [PlantAdmin], code: 200, input: ["limit?", "offset?"], output: "Grower[]", side_effects: [] }
  - { method: GET, path: "/growers/{id}", description: "Read one grower; Grower role limited to own id", roles: [PlantAdmin, Grower], code: 200, input: [], output: Grower, side_effects: [] }
  - { method: POST, path: /buyers, description: "Register a buyer", roles: [PlantAdmin], code: 201, input: [name, buyer_code], output: Buyer, side_effects: [] }
  - { method: GET, path: /buyers, description: "List buyers (paginated)", roles: [PlantAdmin], code: 200, input: ["limit?", "offset?"], output: "Buyer[]", side_effects: [] }
  - { method: GET, path: "/buyers/{id}", description: "Read one buyer; Buyer role limited to own id", roles: [PlantAdmin, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }

  - { method: POST, path: /lots, description: "Field lot intake (status RECEIVED)", roles: [IntakeOperator], code: 201, input: [grower_id, variety, gross_weight_lbs], output: FieldLot, side_effects: ["FieldLot created in RECEIVED"] }
  - { method: GET, path: /lots, description: "List lots; Grower sees only own lots", roles: [PlantAdmin, IntakeOperator, LabTechnician, PlantOperator, Grower], code: 200, input: ["grower_id?", "status?", "limit?", "offset?"], output: "FieldLot[]", side_effects: [] }
  - { method: GET, path: "/lots/{id}", description: "Read one lot; Grower limited to own lots", roles: [PlantAdmin, IntakeOperator, LabTechnician, PlantOperator, Grower], code: 200, input: [], output: FieldLot, side_effects: [] }
  - { method: POST, path: "/lots/{id}/route", description: "Route a GRADED lot to IN_SHELL or KERNEL processing", roles: [IntakeOperator], code: 200, input: [route], output: FieldLot, side_effects: ["GRADED -> ROUTED_IN_SHELL | ROUTED_KERNEL"] }
  - { method: POST, path: "/lots/{id}/resample", description: "Re-open a REJECTED lot for re-sampling (cycle REJECTED -> SAMPLED)", roles: [IntakeOperator], code: 200, input: [], output: FieldLot, side_effects: ["REJECTED -> SAMPLED; aflatoxin_ppb reset to null"] }
  - { method: POST, path: "/lots/{id}/dispose", description: "Dispose a REJECTED lot; quarantined placements -> DISPOSED", roles: [IntakeOperator], code: 200, input: [], output: FieldLot, side_effects: ["REJECTED -> DISPOSED; placements QUARANTINED -> DISPOSED; bin occupancy recomputed"] }

  - { method: POST, path: /lab-tests, description: "Record a lab test (moisture/kernel intake test, aflatoxin sample, or kernel grade). Conditional required fields per test_type.", roles: [LabTechnician], code: 201, input: [lot_id, test_type, "moisture_pct?", "kernel_pct?", "foreign_material_pct?", "aflatoxin_ppb?", "edible_kernel_pct?", "size_spec?"], output: LabTest, side_effects: ["MOISTURE_KERNEL: lot RECEIVED -> SAMPLED + provisional_kernel_lbs; AFLATOXIN: verdict per calculations.aflatoxin_verdict, PASS -> GRADED / FAIL -> REJECTED with quarantine cascade; KERNEL_GRADE (lot must be PROCESSED): graded_kernel_weight_lbs computed"] }
  - { method: GET, path: /lab-tests, description: "List lab tests, filterable by lot", roles: [PlantAdmin, LabTechnician, IntakeOperator, PlantOperator], code: 200, input: ["lot_id?", "test_type?", "limit?", "offset?"], output: "LabTest[]", side_effects: [] }

  - { method: POST, path: /processing-runs, description: "Create a hulling run for a routed lot (OCC on lot version; multiple runs per lot allowed)", roles: [PlantOperator], code: 201, input: [lot_id, expected_lot_version], output: ProcessingRun, side_effects: ["increments FieldLot.version by 1", "first run: lot ROUTED_* -> PROCESSING", "run.input_weight_lbs snapshot = lot.gross_weight_lbs - sum(input_weight_lbs) of the lot's other non-CANCELLED runs"] }
  - { method: GET, path: /processing-runs, description: "List processing runs, filterable by lot", roles: [PlantAdmin, PlantOperator], code: 200, input: ["lot_id?", "status?", "limit?", "offset?"], output: "ProcessingRun[]", side_effects: [] }
  - { method: POST, path: "/processing-runs/{id}/start", description: "Start a QUEUED run", roles: [PlantOperator], code: 200, input: [], output: ProcessingRun, side_effects: ["QUEUED -> RUNNING"] }
  - { method: POST, path: "/processing-runs/{id}/complete", description: "Complete a RUNNING run, recording hulling/drying yield outputs (shrink = input - outputs >= 0)", roles: [PlantOperator], code: 200, input: [kernel_out_lbs, shell_out_lbs, hull_out_lbs], output: ProcessingRun, side_effects: ["RUNNING -> COMPLETED", "lot output sums recomputed", "lot PROCESSING -> PROCESSED", "graded_kernel_weight_lbs recomputed if KERNEL_GRADE exists"] }
  - { method: POST, path: "/processing-runs/{id}/cancel", description: "Cancel a QUEUED run", roles: [PlantOperator], code: 200, input: [], output: ProcessingRun, side_effects: ["QUEUED -> CANCELLED"] }

  - { method: POST, path: /dryers, description: "Register a dryer", roles: [PlantAdmin], code: 201, input: [dryer_code, capacity_lbs], output: Dryer, side_effects: [] }
  - { method: GET, path: /dryers, description: "List dryers", roles: [PlantAdmin, PlantOperator], code: 200, input: ["limit?", "offset?"], output: "Dryer[]", side_effects: [] }
  - { method: POST, path: /drying-batches, description: "Reserve a dryer window for a lot (requires the lot to have a RECORDED MOISTURE_KERNEL test; half-open overlap rule)", roles: [PlantOperator], code: 201, input: [dryer_id, lot_id, start_at, end_at], output: DryingBatch, side_effects: ["DryingBatch created SCHEDULED"] }
  - { method: GET, path: /drying-batches, description: "List drying batches, filterable by dryer and lot", roles: [PlantAdmin, PlantOperator], code: 200, input: ["dryer_id?", "lot_id?", "status?", "limit?", "offset?"], output: "DryingBatch[]", side_effects: [] }
  - { method: POST, path: "/drying-batches/{id}/start", description: "Start a SCHEDULED batch once the clock reaches start_at", roles: [PlantOperator], code: 200, input: [], output: DryingBatch, side_effects: ["SCHEDULED -> DRYING"] }
  - { method: POST, path: "/drying-batches/{id}/complete", description: "Complete a DRYING batch at/after end_at, recording final moisture", roles: [PlantOperator], code: 200, input: [final_moisture_pct], output: DryingBatch, side_effects: ["DRYING -> COMPLETED", "lot.post_dry_moisture_pct set"] }
  - { method: POST, path: "/drying-batches/{id}/cancel", description: "Cancel a SCHEDULED batch", roles: [PlantOperator], code: 200, input: [], output: DryingBatch, side_effects: ["SCHEDULED -> CANCELLED"] }

  - { method: POST, path: /bins, description: "Register a storage bin with allowed product forms", roles: [PlantAdmin], code: 201, input: [bin_code, capacity_lbs, allowed_product_forms], output: StorageBin, side_effects: [] }
  - { method: GET, path: /bins, description: "List bins with computed capacity fields", roles: [PlantAdmin, PlantOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "StorageBin[]", side_effects: [] }
  - { method: GET, path: "/bins/{id}", description: "Read one bin (occupied_lbs, available_now_lbs, projected_available_lbs)", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: StorageBin, side_effects: [] }
  - { method: POST, path: /placements, description: "Place processed product into a bin (lot must be PROCESSED; capacity/product-form/lot-output checks)", roles: [PlantOperator], code: 201, input: [bin_id, lot_id, product_form, quantity_lbs], output: StoragePlacement, side_effects: ["StoragePlacement created STORED, remaining_lbs = quantity_lbs, placed_at = logical clock", "bin occupied/available fields recomputed"] }
  - { method: GET, path: /placements, description: "List placements, filterable by bin, lot, status", roles: [PlantAdmin, PlantOperator], code: 200, input: ["bin_id?", "lot_id?", "status?", "limit?", "offset?"], output: "StoragePlacement[]", side_effects: [] }
  - { method: POST, path: /withdrawals, description: "Withdraw product from a bin, consuming STORED placements FIFO (placed_at ASC, created_at ASC)", roles: [PlantOperator], code: 201, input: [bin_id, product_form, quantity_lbs], output: Withdrawal, side_effects: ["placements consumed per calculations.fifo_withdrawal_allocation", "placements at 0 -> WITHDRAWN", "bin occupied/available fields recomputed"] }
  - { method: GET, path: /withdrawals, description: "List withdrawals, filterable by bin", roles: [PlantAdmin, PlantOperator], code: 200, input: ["bin_id?", "limit?", "offset?"], output: "Withdrawal[]", side_effects: [] }

  - { method: POST, path: /fumigations, description: "Schedule a bin fumigation with aeration buffer (closed-interval overlap rule)", roles: [PlantAdmin], code: 201, input: [bin_id, start_at, aeration_hours], output: FumigationEvent, side_effects: ["FumigationEvent created SCHEDULED"] }
  - { method: GET, path: /fumigations, description: "List fumigation events, filterable by bin", roles: [PlantAdmin, PlantOperator], code: 200, input: ["bin_id?", "status?", "limit?", "offset?"], output: "FumigationEvent[]", side_effects: [] }
  - { method: POST, path: "/fumigations/{id}/start", description: "Start a SCHEDULED fumigation (bin -> FUMIGATING; placements -> FUMIGATION_HOLD; affected shipments -> BLOCKED)", roles: [PlantAdmin], code: 200, input: [], output: FumigationEvent, side_effects: ["SCHEDULED -> ACTIVE", "bin AVAILABLE -> FUMIGATING", "placements STORED -> FUMIGATION_HOLD", "PLANNED shipments allocating them -> BLOCKED"] }
  - { method: POST, path: "/fumigations/{id}/begin-aeration", description: "End fumigation, start aeration buffer; cleared_at = clock + aeration_hours", roles: [PlantAdmin], code: 200, input: [], output: FumigationEvent, side_effects: ["ACTIVE -> AERATING", "bin FUMIGATING -> AERATING", "cleared_at set"] }
  - { method: POST, path: "/fumigations/{id}/cancel", description: "Cancel a SCHEDULED fumigation", roles: [PlantAdmin], code: 200, input: [], output: FumigationEvent, side_effects: ["SCHEDULED -> CANCELLED"] }

  - { method: POST, path: /contracts, description: "Create a buyer contract with sizing/sorting spec", roles: [PlantAdmin], code: 201, input: [buyer_id, product_form, size_spec, max_defects_pct, price_cents_per_lb, required_qty_lbs], output: BuyerContract, side_effects: ["BuyerContract created OPEN"] }
  - { method: GET, path: /contracts, description: "List contracts; Buyer sees only own", roles: [PlantAdmin, Buyer, PlantOperator], code: 200, input: ["buyer_id?", "status?", "limit?", "offset?"], output: "BuyerContract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Read one contract; Buyer limited to own", roles: [PlantAdmin, Buyer, PlantOperator], code: 200, input: [], output: BuyerContract, side_effects: [] }
  - { method: POST, path: "/contracts/{id}/suspend", description: "Suspend an OPEN contract (no new shipments)", roles: [PlantAdmin], code: 200, input: [], output: BuyerContract, side_effects: ["OPEN -> SUSPENDED"] }
  - { method: POST, path: "/contracts/{id}/resume", description: "Resume a SUSPENDED contract", roles: [PlantAdmin], code: 200, input: [], output: BuyerContract, side_effects: ["SUSPENDED -> OPEN"] }
  - { method: POST, path: "/contracts/{id}/close", description: "Close a contract with no reserved quantity", roles: [PlantAdmin], code: 200, input: [], output: BuyerContract, side_effects: ["OPEN|SUSPENDED|FULFILLED -> CLOSED when reserved_qty_lbs == 0"] }

  - { method: POST, path: /shipments, description: "Plan a shipment against a contract from a bin (OCC on contract version; FIFO allocation; spec/remaining checks)", roles: [PlantOperator], code: 201, input: [contract_id, bin_id, quantity_lbs, expected_contract_version], output: Shipment, side_effects: ["increments BuyerContract.version by 1", "allocations reserved per calculations.fifo_withdrawal_allocation (allocated_planned_lbs incremented)", "contract.reserved_qty_lbs += quantity_lbs"] }
  - { method: GET, path: /shipments, description: "List shipments; Buyer sees only own contracts' shipments", roles: [PlantAdmin, PlantOperator, Buyer], code: 200, input: ["contract_id?", "bin_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/shipments/{id}", description: "Read one shipment; Buyer limited to own contracts", roles: [PlantAdmin, PlantOperator, Buyer], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/shipments/{id}/confirm", description: "Confirm a PLANNED shipment (delivers stock, advances contract delivered; contract -> FULFILLED at required qty)", roles: [PlantOperator], code: 200, input: [], output: Shipment, side_effects: ["PLANNED -> DELIVERED", "placement remaining_lbs decremented; 0 -> WITHDRAWN", "contract reserved -> delivered", "contract -> FULFILLED when delivered == required"] }
  - { method: POST, path: "/shipments/{id}/cancel", description: "Cancel a PLANNED shipment (releases reservation only)", roles: [PlantOperator], code: 200, input: [], output: Shipment, side_effects: ["PLANNED -> CANCELLED", "allocated_planned_lbs released", "contract.reserved_qty_lbs -= quantity_lbs"] }

  - { method: POST, path: /settlements, description: "Create a grower settlement for a PROCESSED lot with a RECORDED KERNEL_GRADE test (final variant pricing)", roles: [PlantAdmin], code: 201, input: [lot_id], output: Settlement, side_effects: ["Settlement created DRAFT with graded_kernel_weight_lbs snapshot and components per calculations.settlement_amount"] }
  - { method: GET, path: /settlements, description: "List settlements; Grower sees only own", roles: [PlantAdmin, Grower], code: 200, input: ["lot_id?", "grower_id?", "status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/settlements/{id}", description: "Read one settlement; Grower limited to own", roles: [PlantAdmin, Grower], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/settlements/{id}/approve", description: "Issue a DRAFT settlement (grower payable debited)", roles: [PlantAdmin], code: 200, input: [], output: Settlement, side_effects: ["DRAFT -> ISSUED", "grower.payable_outstanding_cents += total_cents"] }
  - { method: POST, path: "/settlements/{id}/void", description: "Void an ISSUED settlement back to DRAFT (compensation)", roles: [PlantAdmin], code: 200, input: [], output: Settlement, side_effects: ["ISSUED -> DRAFT", "grower.payable_outstanding_cents -= total_cents"] }
  - { method: POST, path: "/settlements/{id}/pay", description: "Pay an ISSUED settlement (lot -> SETTLED)", roles: [PlantAdmin], code: 200, input: [], output: Settlement, side_effects: ["ISSUED -> PAID", "payable_outstanding -= total_cents", "lifetime_paid += total_cents", "lot PROCESSED -> SETTLED"] }
  - { method: POST, path: "/settlements/{id}/cancel", description: "Cancel a DRAFT settlement", roles: [PlantAdmin], code: 200, input: [], output: Settlement, side_effects: ["DRAFT -> CANCELLED"] }

  - { method: POST, path: /byproduct-sales, description: "Sell hull or shell byproduct stock", roles: [PlantOperator], code: 201, input: [product_form, quantity_lbs, price_cents_per_lb, buyer_name], output: ByproductSale, side_effects: ["ByproductSale recorded; total_cents computed"] }
  - { method: GET, path: /byproduct-sales, description: "List byproduct sales", roles: [PlantAdmin, PlantOperator], code: 200, input: ["product_form?", "limit?", "offset?"], output: "ByproductSale[]", side_effects: [] }

  - { method: GET, path: "/lab-tests/{id}", description: "Read one lab test", roles: [PlantAdmin, LabTechnician, IntakeOperator, PlantOperator], code: 200, input: [], output: LabTest, side_effects: [] }
  - { method: GET, path: "/processing-runs/{id}", description: "Read one processing run", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: ProcessingRun, side_effects: [] }
  - { method: GET, path: "/drying-batches/{id}", description: "Read one drying batch", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: DryingBatch, side_effects: [] }
  - { method: GET, path: "/placements/{id}", description: "Read one placement", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: StoragePlacement, side_effects: [] }
  - { method: GET, path: "/withdrawals/{id}", description: "Read one withdrawal", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: Withdrawal, side_effects: [] }
  - { method: GET, path: "/fumigations/{id}", description: "Read one fumigation event", roles: [PlantAdmin, PlantOperator], code: 200, input: [], output: FumigationEvent, side_effects: [] }

  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock (test-driving endpoint). Server startup default before any call is exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time. Setting the clock triggers lazy fumigation clearance evaluation."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["lazy clearance: AERATING fumigations with cleared_at <= clock -> CLEARED; bins AERATING -> AVAILABLE; placements FUMIGATION_HOLD -> STORED; unblocked shipments BLOCKED -> PLANNED"]

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Huller administration: master data (growers, buyers, dryers, bins), buyer contracts, settlements, fumigation scheduling, logical clock"
    identity: opaque
    exclusive_operations: ["POST /growers", "POST /buyers", "POST /dryers", "POST /bins", "POST /contracts", "contract suspend/resume/close", "settlement create/approve/void/pay/cancel", "fumigation create/start/begin-aeration/cancel", "POST /_clock/set_current_utc"]
    shared_operations: ["read lots, lab tests, processing runs, drying batches, bins, placements, withdrawals, contracts, shipments, settlements, byproduct sales"]
  - name: IntakeOperator
    description: "Scale-house operator: lot intake and routing/disposition"
    identity: opaque
    exclusive_operations: ["POST /lots", "POST /lots/{id}/route", "POST /lots/{id}/resample", "POST /lots/{id}/dispose"]
    shared_operations: ["read lots, lab tests"]
  - name: LabTechnician
    description: "Lab: records moisture/kernel, aflatoxin, and kernel-grade tests"
    identity: opaque
    exclusive_operations: ["POST /lab-tests"]
    shared_operations: ["read lots, lab tests"]
  - name: PlantOperator
    description: "Plant floor: processing runs, drying, storage, shipments, byproduct sales"
    identity: opaque
    exclusive_operations: ["POST /processing-runs + start/complete/cancel", "POST /drying-batches + start/complete/cancel", "POST /placements", "POST /withdrawals", "POST /shipments + confirm/cancel", "POST /byproduct-sales"]
    shared_operations: ["read lots, lab tests, bins, placements, withdrawals, shipments, contracts (read-only)"]
  - name: Grower
    description: "Delivering grower; read-only access to own lots and settlements"
    identity: "entity_backed:Grower"
    exclusive_operations: []
    shared_operations: ["GET /lots, GET /lots/{id}, GET /settlements, GET /settlements/{id} — restricted to grower_id == X-User-ID"]
  - name: Buyer
    description: "Contracted buyer; read-only access to own contracts and shipments"
    identity: "entity_backed:Buyer"
    exclusive_operations: []
    shared_operations: ["GET /contracts, GET /contracts/{id}, GET /shipments, GET /shipments/{id} — restricted to buyer_id == X-User-ID"]
