            - "Booked actuals are per-lot: Entitlement.${ent_id}.booked_whole_shares == 30 AND booked_cash_in_lieu_cents == 5499"
            - "PositionLot.${l1}.quantity == 15 AND PositionLot.${l2}.quantity == 15; bases unchanged 105000 / 106000"
            - "Account.${a1}.cash_balance_cents == 5499 (booking credits per-lot CIL only)"

      - name: rights_oversubscription_single_pass
        grounds:
          - calculations.rights_oversubscription_allocation
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned single-pass
          order: remainder (1000 offered - 200 basic = 800) feeds oversubscription
          proration capped by additional requested (A1 min(50, 400)=50;
          A2 min(150, 400)=150); no second pass, 600 shares retained by issuer.
