        grounds: [roles.PlatformAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "PlatformAdmin owns creation/settings/clock only; lifecycle transitions (activate) are ProjectManager-exclusive -> ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["project created"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: project_engineer_cannot_accept_impact_forbidden
        claim_type: rbac_denial
        grounds: [roles.ProjectEngineer, roles.ProjectManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "accept is ProjectManager-exclusive; ProjectEngineer (who prices) gets ERR_FORBIDDEN_ROLE — the role-level half of the segregation-of-duties design."
        test_recipe:
          setup: ["project ACTIVE (contingency 2000000); reviewer R1; RFI answered with cost flag; IA priced"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P", initial_contingency_cents: 2000000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi: $.data.id }
            - call: "POST /v1/rfis/${rfi}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi}/answer"
              payload: { answer_text: "premium", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 100000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi}" }
              as: ProjectEngineer
              captures: { ia: "$.data[0].id" }
            - call: "POST /v1/impact-assessments/${ia}/price"
              payload: { sub_quote_cents: 100000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
          trigger:
            - call: "POST /v1/impact-assessments/${ia}/accept"
              payload: {}
              as: ProjectEngineer
              as_user_id: "pe-002"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (role check precedes the SoD check)"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_project_version_on_rfi_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rfi-create-stale-project]"]
        distinguishing_aspect: "Creating RFI1 bumps Project.version; a second create still carrying the pre-create version is refused with 412 ERR_STALE_PROJECT_VERSION — two strictly sequential writes."
        test_recipe:
          setup: ["project ACTIVE; client holds version observed before RFI1 was created"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "R1", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi1: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "R2", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_PROJECT_VERSION and http status == 412 (first create advanced Project.version)"

      - name: occ_stale_submittal_version_on_revision_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revision-create-stale-submittal]"]
        distinguishing_aspect: "After rev0 is created the submittal version has advanced; replaying the same create with the stale expected_submittal_version yields 412 ERR_STALE_SUBMITTAL_VERSION, and OCC (priority 6) fires before the state check (priority 8) that would also reject it."
        test_recipe:
          setup: ["project ACTIVE; sub C1 responsible; section activated -> S; rev0 created (S now IN_REVIEW, version advanced)"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", responsible_subcontractor_id: "${c1_id}" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s: "$.data[0].id" }
            - call: "GET /v1/submittals/${s}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev0: $.data.id }
          trigger:
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r1", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_SUBMITTAL_VERSION and http status == 412"

      - name: occ_report_create_supersedes_then_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-create-stale-project]", state_machines.OwnerReport.status.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Creating a report whose period overlaps a PUBLISHED report legitimately supersedes it (superseded_by_report_id set); replaying a create with the pre-supersede version is then refused 412."
        test_recipe:
          setup: ["project ACTIVE; report1 [2026-08-01, 2026-08-31] created and published"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v1: $.data.version }
            - call: "POST /v1/projects/${p_id}/owner-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_project_version: "${p_v1}" }
              as: ProjectEngineer
              captures: { rep1: $.data.id }
            - call: "POST /v1/owner-reports/${rep1}/publish"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /v1/projects/${p_id}/owner-reports"
              payload: { period_start: "2026-08-15", period_end: "2026-09-15", expected_project_version: "${p_v2}" }
              as: ProjectEngineer
              captures: { rep2: $.data.id }
            - call: "GET /v1/owner-reports/${rep1}"
              payload: {}
              as: ProjectEngineer
              captures: { rep1_st: $.data.status, rep1_by: $.data.superseded_by_report_id }
            - call: "POST /v1/projects/${p_id}/owner-reports"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_project_version: "${p_v2}" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "rep1_st == SUPERSEDED and rep1_by == ${rep2} (overlap supersedes)"
            - "err == ERR_STALE_PROJECT_VERSION for the create replaying the pre-supersede version"

      - name: daily_scan_is_idempotent_checkpoint
        claim_type: ops_run_checkpoint
        grounds: ["endpoints: POST /v1/projects/{projectId}/run-daily-scan", entities.Project.fields.ops_scan_index]
        distinguishing_aspect: "A second scan at the same clock position appends no new events and does not re-increment late_ack_count (overdue flags latch once), while ops_scan_index still advances per run."
        test_recipe:
          setup: ["project ACTIVE (ack 5); sub C1 responsible SEC; reviewer R1; one RFI answered, distributed, sent at 2026-08-03 (ack_due 2026-08-10); clock at 2026-08-11"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "MechCo", trade: "mechanical" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "230000", responsible_subcontractor_id: "${c1_id}" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", spec_section_id: "${sec_id}", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi: $.data.id }
            - call: "POST /v1/rfis/${rfi}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi}/answer"
              payload: { answer_text: "a", cost_impact_flag: false, schedule_impact_flag: false }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /v1/rfis/${rfi}/distribute"
              payload: {}
              as: ProjectEngineer
              captures: { rec: "$.data[0].id" }
            - call: "POST /v1/distribution-records/${rec}/send"
              payload: {}
              as: ProjectEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/projects/${p_id}/run-daily-scan"
              payload: {}
              as: ProjectManager
              captures: { idx1: $.data.ops_scan_index }
            - call: "GET /v1/subcontractors/${c1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { late1: $.data.late_ack_count }
            - call: "POST /v1/projects/${p_id}/run-daily-scan"
              payload: {}
              as: ProjectManager
              captures: { idx2: $.data.ops_scan_index }
            - call: "GET /v1/subcontractors/${c1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { late2: $.data.late_ack_count }
          assert:
            - "late1 == 1 and late2 == 1 (overdue latches; no double count on re-scan)"
            - "idx2 == idx1 + 1 (each scan advances the epoch)"

      - name: pagination_limit_offset_interaction
        claim_type: pagination_with_filtering
        grounds: [response_envelope, "endpoints: GET /v1/rfis"]
        distinguishing_aspect: "With 3 RFIs, limit=2 returns the first two in created_at order with has_more true; offset=2&limit=2 returns the remaining one — page membership is stable and non-overlapping."
        test_recipe:
          setup: ["project ACTIVE; three RFIs created in order R1,R2,R3"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v1: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "R1", question_text: "Q", expected_project_version: "${p_v1}" }
              as: ProjectEngineer
              captures: { rfi1: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { p_v2: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "R2", question_text: "Q", expected_project_version: "${p_v2}" }
              as: ProjectEngineer
              captures: { rfi2: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { p_v3: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "R3", question_text: "Q", expected_project_version: "${p_v3}" }
              as: ProjectEngineer
              captures: { rfi3: $.data.id }
          trigger:
            - call: "GET /v1/rfis"
              payload: { project_id: "${p_id}", limit: 2, offset: 0 }
              as: ProjectEngineer
              captures: { p1_a: "$.data[0].id", p1_b: "$.data[1].id" }
            - call: "GET /v1/rfis"
              payload: { project_id: "${p_id}", limit: 2, offset: 2 }
              as: ProjectEngineer
              captures: { p2_a: "$.data[0].id" }
          assert:
            - "p1_a == ${rfi1} and p1_b == ${rfi2} (created_at ASC)"
            - "p2_a == ${rfi3} and page 2 has exactly one element (has_more false on page 2, true on page 1)"

