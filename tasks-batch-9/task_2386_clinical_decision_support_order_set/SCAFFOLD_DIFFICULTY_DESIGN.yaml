            - call: "POST /cds/vendor-releases/${vrb_id}/deltas"
              payload: { rule_code: "DOSE-B4", change_type: "DOSING_BOUND_CHANGED", description: "Vancomycin upper bound lowered", new_severity: "MODERATE" }
              as: PharmacyInformaticist
