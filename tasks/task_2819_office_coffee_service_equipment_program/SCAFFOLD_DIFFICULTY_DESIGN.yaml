              as: BillingSpecialist
              captures: { adj_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "DISPUTE", dispute_reason: "Roast spec changed mid-quarter" }
              as: CustomerContact
              as_user_id: "${acct_id}"
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: 240 }
              as: BillingSpecialist
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct_id}"
          assert:
            - "trigger step 1 response: PriceAdjustment.adj_status == DISPUTED and dispute_reason == 'Roast spec changed mid-quarter'"
            - "trigger step 2 response: PriceAdjustment.adj_status == PROPOSED and adjustment_pct_bps == 240 and revision_count == 1"
            - "PriceAdjustment.${adj_id}.adj_status == ACCEPTED and PriceAdjustment.${adj_id}.movement_bps == 800"
            - "PriceAdjustment.${adj_id}.accepted_at == 2026-08-03T08:00:00Z"
            - "Account.${acct_id}.green_price_factor_bps == 10240"
            - "Account.${acct_id}.green_index_baseline_micros == 2160000"
            - "Account.${acct_id}.price_protection_until == 2026-11-01T08:00:00Z"

