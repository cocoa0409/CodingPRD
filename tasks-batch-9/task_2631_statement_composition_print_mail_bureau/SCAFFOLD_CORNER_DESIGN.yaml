              as: ClientLiaison
              captures: { v4_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v4_file_id}", account_ref: "ABC2401", sequence_no: 1, statement_amount_cents: 5000, address_line1: "2900 Failover Freeway", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2901" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v4_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${v4_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v4_file_id}", template_id: "${v4_template_id}", rush_requested: false }
