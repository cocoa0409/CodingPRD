            - "the SPOILAGE row's id, occurred_at, bottles and cogs_cents are byte-identical before and after the reversal, and DepletionEntry exposes no update endpoint (common_fields: false, no version field)"
            - "sum(bottles) and sum(cogs_cents) over those 2 rows are both exactly 0"
            - "a second reverse on ${wo1_id} returns HTTP 409 with error_id ERR_WRITE_OFF_NOT_APPROVED and does not double-credit the lot (bottles_on_hand stays 12)"
      - name: event_settlement_void_restores_monetary_and_lot_ledgers
        grounds:
          - state_machines.WineDinnerEvent.SETTLED_to_SETTLEMENT_VOIDED
          - state_machines.InventoryLot.DEPLETED_to_ON_HAND
          - calculations.event_settlement_draw
          - calculations.lot_depletion_cogs
          - endpoints["POST /beverage-program/wine-dinner-events/{event_id}/void-settlement"]
        distinguishing_aspect: |
          Where the write-off instance compensates a single-lot, single-entry, cost-only movement,
          this one compensates a MULTI-LOT, dual-ledger movement: a FIFO settlement drains lot 1
          entirely and bites into lot 2, and books revenue as well as cost, so the void must unwind two
          per-lot draws in the exact proportions they were taken (6 bottles / 18000 from lot 1 and
          2 bottles / 10000 from lot 2 — not 4 and 4, and not 8 from either) while returning both
          venue.cogs_ledger_cents and venue.revenue_ledger_cents to zero and resetting
          settled_cogs_cents / settled_revenue_cents to null. Two independent ledgers plus a
          proportional multi-lot restore is a strictly harder invariant than a single mirrored entry.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with costing_method FIFO, event_cogs_target_pct 28.0 and bin A1 (capacity 48)."
            - "Two RED lots on the same wine in A1: 6 bottles at 3000 cents received 2026-08-10, then 6 bottles at 5000 cents received 2026-08-20."
            - "A published ListVersion with one by-the-glass RED entry (pour_size_ml 177, effective_pours 3)."
            - "A 24-seat dinner pinned to that version with pour_plan [{entry, 2}], priced (final_ticket_price_cents 3000) and confirmed, then settled by the Controller."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, costing_method: "FIFO", event_cogs_target_pct: 28.0, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_red_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w_red_id}", bin_id: "${bin_id}", bottles_received: 6, unit_cost_cents: 3000, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w_red_id}", bin_id: "${bin_id}", bottles_received: 6, unit_cost_cents: 5000, received_at: "2026-08-20T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot2_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: true, pour_size_ml: 177, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/publish"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wine-dinner-events"
              payload: { venue_id: "${v1_id}", list_version_id: "${lv_id}", name: "Ridge Vertical", starts_at: "2026-10-10T18:00:00Z", ends_at: "2026-10-10T21:00:00Z", seat_count: 24, pour_plan: [{ list_entry_id: "${e1_id}", pours_per_seat: 2 }] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /beverage-program/wine-dinner-events/${ev1_id}/price"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/wine-dinner-events/${ev1_id}/confirm"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wine-dinner-events/${ev1_id}/settle"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
          trigger:
            - call: "POST /beverage-program/wine-dinner-events/${ev1_id}/void-settlement"
              payload: { note: "Event postponed after settlement was posted in error." }
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "state immediately after settle: WineDinnerEvent.${ev1_id}.state == SETTLED, settled_cogs_cents == 28000, settled_revenue_cents == 72000 (3000 * 24), InventoryLot.${lot1_id}.bottles_on_hand == 0 and state == DEPLETED, InventoryLot.${lot2_id}.bottles_on_hand == 4 and state == ON_HAND, Venue.${v1_id}.cogs_ledger_cents == 28000, Venue.${v1_id}.revenue_ledger_cents == 72000"
            - "the settlement drew 8 bottles total: event_pours == floor(750 / EVENT_POUR_SIZE_ML 100) - 1 == 6, so bottles_needed == ceil(24 seats * 2 pours_per_seat / 6) == 8, split FIFO as 6 bottles from ${lot1_id} at 3000 (18000) and 2 bottles from ${lot2_id} at 5000 (10000); the by-the-glass effective_pours of 3 is deliberately NOT the divisor here"
            - "after the void: WineDinnerEvent.${ev1_id}.state == SETTLEMENT_VOIDED with settled_cogs_cents == null and settled_revenue_cents == null"
            - "InventoryLot.${lot1_id}.bottles_on_hand == 6 and state == ON_HAND (DEPLETED_to_ON_HAND fired), InventoryLot.${lot2_id}.bottles_on_hand == 6 and state == ON_HAND"
            - "the restore was proportional to the draw: lot 1 regained exactly 6 and lot 2 exactly 2 — an implementation that returns 4 and 4, or all 8 to the earliest lot, leaves lot 2 at 8 or lot 1 at 8 and fails here"
            - "Venue.${v1_id}.cogs_ledger_cents == 0 and Venue.${v1_id}.revenue_ledger_cents == 0"
            - "CellarBin.${bin_id}.bottles_stored == 12 and utilization_pct == 25.00"
            - "GET /beverage-program/depletion-entries?event_id=${ev1_id} returns exactly 4 rows: EVENT(lot ${lot1_id}, bottles 6, cogs_cents 18000, revenue_cents 72000), EVENT(lot ${lot2_id}, bottles 2, cogs_cents 10000, revenue_cents 0), REVERSAL(lot ${lot1_id}, bottles -6, cogs_cents -18000, revenue_cents -72000), REVERSAL(lot ${lot2_id}, bottles -2, cogs_cents -10000, revenue_cents 0)"
            - "sum(bottles), sum(cogs_cents) and sum(revenue_cents) over those 4 rows are each exactly 0, and the two EVENT rows are unchanged from settlement time"
            - "ListEntry.${e1_id}.availability_state == AVAILABLE both before and after the void, because 4 bottles of ${lot2_id} remained available throughout"
