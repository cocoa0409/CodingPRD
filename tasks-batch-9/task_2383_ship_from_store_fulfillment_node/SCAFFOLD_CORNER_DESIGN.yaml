            - call: "POST /fulfillment-network/stores/00000000-0000-4000-8000-000000000031/carrier-pickups"
              payload: { carrier_code: "ACME", window_start_utc: "2026-08-03T09:30:00Z", window_end_utc: "2026-08-03T11:00:00Z", parcel_capacity: 3 }
