              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/cases/${case_id}/follow-up-contacts"
              payload: { contact_date: "2026-06-30", contact_method: "PHONE", outcome: "CONTACT_MADE", vital_status_at_contact: "ALIVE" }
              as: RegistryManager
              captures: { err2: $.data.error_id }
          assert:
            - "the 2026-08-02 contact returns HTTP 422 with data.error_id == ERR_CONTACT_DATE_INVALID (future relative to the logical clock)"
            - "the 2026-06-30 contact returns HTTP 422 with data.error_id == ERR_CONTACT_DATE_INVALID (earlier than diagnosis_date 2026-07-01)"
            - "TumorCase.${case_id}.last_contact_date is still null and vital_status is still UNKNOWN after both refusals"
            - "GET /cancer-registry/follow-up-contacts?case_id=${case_id} returns total_count == 0"

      - name: attendance_of_twenty_nine_minutes_leaves_discipline_uncovered_and_credit_rejected
        claim_type: Violation -> Error
        grounds:
          - calculations.conference_quorum
          - validations[priority 61 credit requires quorum_met]
          - errors[ERR_CONFERENCE_QUORUM_NOT_MET]
        distinguishing_aspect: |
          QUORUM_MIN_MINUTES is a per-attendee filter applied BEFORE the discipline set is built:
          a pathologist present for 29 minutes does not cover PATHOLOGY, so quorum_met is false even
          though every required discipline has a body in the room and the prospective ratio 0.9
          clears its own threshold - and CREDIT is then refused with a 409.
        test_recipe:
          setup:
            - "One program with a past session requiring four disciplines; three attendees stay 45 minutes and the pathologist stays 29."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-07-15T13:00:00Z", end_at: "2026-07-15T14:30:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "RADIATION_ONCOLOGY", "PATHOLOGY"] }
              as: AccreditationCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-SURG-1", discipline: "SURGERY", attended_minutes: 45, is_required_coordinator: true }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-MEDONC-1", discipline: "MEDICAL_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-RADONC-1", discipline: "RADIATION_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-PATH-1", discipline: "PATHOLOGY", attended_minutes: 29 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/hold"
              payload: { cases_presented_count: 10, prospective_case_count: 9 }
              as: AccreditationCoordinator
          trigger:
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/credit"
              payload: { disposition: "CREDIT", credit_note: "Quarterly tumour board" }
              as: AccreditationCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the hold response reports quorum_met == false with prospective_case_ratio == 0.9"
            - "the credit call returns HTTP 409 with data.error_id == ERR_CONFERENCE_QUORUM_NOT_MET"
            - "ConferenceSession.${sess_id}.session_state is still HELD and credited_on == null"
            - "CancerProgram.${prog_id}.credited_sessions_12mo == 0 and conference_frequency_compliant == false"

      - name: duplicate_casefinding_entry_on_same_natural_key_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 61 casefinding uniqueness]
          - errors[ERR_DUPLICATE_CASEFINDING_ENTRY]
          - entities.CasefindingEntry
        distinguishing_aspect: |
          The natural key is (source_id, patient_mrn, primary_site_code, diagnosis_date) - the
          accession_date is NOT part of it, so a re-listed pathology report on a different accession
          day is a duplicate, while the same patient with a second primary site is not.
        test_recipe:
          setup:
            - "One program and one PATHOLOGY source carrying one entry for MRN-0001 / C50.9 / 2026-07-01."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-09", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-09", primary_site_code: "C34.9", histology_code: "8140/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
          assert:
            - "the re-listed report returns HTTP 409 with data.error_id == ERR_DUPLICATE_CASEFINDING_ENTRY despite the different accession_date"
            - "the second primary site C34.9 for the same MRN is created with HTTP 201"
            - "CasefindingSource.${src_id}.entries_this_month == 2 (the rejected duplicate did not count)"

      - name: survey_date_one_day_inside_lead_window_rejected_and_boundary_accepted
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority 56 survey lead time]
          - errors[ERR_SURVEY_DATE_TOO_SOON]
          - state_machines.CancerProgram.accreditation_state ACCREDITED->SURVEY_SCHEDULED
        distinguishing_aspect: |
          SURVEY_LEAD_DAYS is 60 and the comparison is >=, so at clock 2026-08-01 the date
          2026-09-29 is refused and 2026-09-30 is accepted; the refused attempt must leave the
          program ACCREDITED with survey_date still null.
        test_recipe:
          setup:
            - "One freshly created (ACCREDITED) program at the default clock 2026-08-01."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/programs/${prog_id}/survey-schedule"
              payload: { survey_date: "2026-09-29" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/programs/${prog_id}/survey-schedule"
              payload: { survey_date: "2026-09-30" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          assert:
            - "2026-09-29 returns HTTP 422 with data.error_id == ERR_SURVEY_DATE_TOO_SOON and the program is still accreditation_state ACCREDITED with survey_date == null"
            - "2026-09-30 returns HTTP 200 with accreditation_state == SURVEY_SCHEDULED, survey_date == 2026-09-30 and survey_year == 2026"
            - "registry_posture is still OPEN (scheduling a survey does not freeze the registry)"

      - name: clock_cannot_stand_still_or_move_backward
        claim_type: Violation -> Error
        grounds:
          - validations[priority 57 clock monotonicity]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The comparison is STRICTLY greater than the current instant, so re-setting the clock to
          its own startup default 2026-08-01T00:00:00Z is an error, not a no-op; an earlier instant
          fails the same way and a later one succeeds with a null payload.
        test_recipe:
          setup:
            - "A fresh server whose logical clock reads exactly 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the equal instant returns HTTP 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the earlier instant returns HTTP 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the later instant returns HTTP 200 with data == null"
            - "a subsequent attempt to set 2026-08-15T00:00:00Z (now in the past) again returns ERR_CLOCK_NOT_MONOTONIC"

      - name: validation_priority_conflict_frozen_posture_versus_capacity_cap
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: frozen_registry_masks_abstractor_capacity_cap_on_assign
          rationale: |
            The §1.8 instance already violates the posture rule and the capacity cap in the same
            assign call and pins which error surfaces, including the flip once the freeze is lifted.

      - name: validation_priority_conflict_submission_state_versus_unpaid_assessment
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: submission_state_check_masks_unpaid_assessment_on_second_transmit
          rationale: |
            The §1.8 instance drives the same two-rule conflict on retransmit and shows the masked
            ERR_ASSESSMENT_UNPAID surfacing only after the state precondition is satisfied.

      - name: validation_cross_entity_gate_on_critical_deficiency
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: case_assignment_gated_by_critical_deficiency_state_on_another_entity
          rationale: |
            The §1.8 instance already proves assignment validity depends on a Deficiency row of the
            program and tests both the cited and the resolved side of that gate.

      - name: validation_aggregate_limit_on_overlapping_auditor_windows
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: third_overlapping_auditor_window_exceeds_capacity_until_one_is_voided
          rationale: |
            The §1.8 instance covers the aggregate-capacity pattern end to end: two windows are
            individually legal, the third breaches the aggregate, and voiding one releases the slot.

      - name: validation_temporal_buffer_on_conference_calendar
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: conference_back_to_back_session_violates_thirty_minute_changeover_buffer
          rationale: |
            The §1.8 instance already sits on both sides of the buffered edge (start_at == prior
            end_at rejected, prior end_at + 30 minutes accepted).

      - name: validation_cascading_check_order_on_submission_transmit
        claim_type: Cascading validation
        excluded_because:
          difficulty_instance: transmit_requires_every_item_case_completed_after_audit_regression
          rationale: |
            The §1.8 instance requires the item-level completeness check to run against state that a
            prior audit cascade changed, which is exactly the cascading-validation pattern.

  # =========================================================================
  # Guide section 5 - From Table 5 (Endpoints)  [64 endpoints]
