      - name: export_control_blocked_and_lab_capacity_exceeded_are_both_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EXPORT_CONTROL_BLOCKED
          - errors.ERR_LAB_CAPACITY_EXCEEDED
          - validations.priority_8_ERR_EXPORT_CONTROL_BLOCKED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / export_control_block_outranks_lab_capacity_exceeded_on_grant_request"
          rationale: "That instance issues one grant request that violates both rules at once and asserts ERR_EXPORT_CONTROL_BLOCKED, then repairs the compliance status and re-issues the same over-capacity request to observe ERR_LAB_CAPACITY_EXCEEDED. Both ids are therefore reached from a live request in a single recipe; a standalone triggerability test would add no coverage."

      - name: the_rfe_round_limit_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RFE_ROUND_LIMIT_REACHED
          - validations.priority_18_ERR_RFE_ROUND_LIMIT_REACHED
          - state_machines.VisaCase.SUBMITTED_to_RFE_RECEIVED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / visa_rfe_self_loop_bounded_by_rfe_round_limit"
          rationale: "The self-loop instance walks the RFE cycle to rfe_round_count 2 and then asserts the third RFE is refused with ERR_RFE_ROUND_LIMIT_REACHED at 409 with the case still SUBMITTED, which is the only reachable trigger for this id."

      - name: unverified_funding_and_below_floor_salary_are_both_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FUNDING_NOT_VERIFIED
          - errors.ERR_SALARY_BELOW_FLOOR
          - validations.priority_11_ERR_FUNDING_NOT_VERIFIED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / unverified_funding_outranks_salary_below_floor_on_issue_offer"
          rationale: "That instance triggers ERR_FUNDING_NOT_VERIFIED with both rules violated, then verifies the award and re-issues to observe ERR_SALARY_BELOW_FLOOR on the surviving violation, so both ids are reached from live requests."

      - name: the_rank_years_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RANK_YEARS_EXCEEDED
          - validations.priority_15_ERR_RANK_YEARS_EXCEEDED
          - calculations.months_in_rank_ledger
        excluded_because:
          difficulty_instance: "boundary_precision_check / total_months_in_rank_cap_accepts_exactly_sixty_and_rejects_sixty_one"
          rationale: "The boundary instance accepts a term landing on exactly 60 cumulative months and refuses the one-month-longer term with ERR_RANK_YEARS_EXCEEDED, covering the id at the only place the cap can bite."

      - name: the_development_docs_incomplete_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DEVELOPMENT_DOCS_INCOMPLETE
          - validations.priority_20_ERR_DEVELOPMENT_DOCS_INCOMPLETE
          - endpoints.POST /appointments/{id}/activate
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / activation_blocked_until_every_funder_required_development_document_is_approved"
          rationale: "That instance refuses activation with ERR_DEVELOPMENT_DOCS_INCOMPLETE while one funder-required document is still short of APPROVED, then approves it and activates, so the id is exercised alongside its satisfaction case."

      - name: the_grievance_window_closed_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GRIEVANCE_WINDOW_CLOSED
          - validations.priority_26_ERR_GRIEVANCE_WINDOW_CLOSED
          - endpoints.POST /grievances
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / grievance_refused_while_its_review_has_not_reached_finalized_non_renewed"
          rationale: "That instance files against a review that has no grievance window at all and asserts ERR_GRIEVANCE_WINDOW_CLOSED, then files successfully once the review is FINALIZED_NON_RENEWED, covering both halves of the window rule."

      - name: the_appointment_term_overlap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_APPOINTMENT_TERM_OVERLAP
          - validations.priority_25_ERR_APPOINTMENT_TERM_OVERLAP
          - endpoints.POST /appointments
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / successive_appointment_terms_treat_a_touching_endpoint_as_an_overlap"
          rationale: "That instance refuses a successor term whose first day equals the predecessor's last day with ERR_APPOINTMENT_TERM_OVERLAP and accepts the next-day term, which is the tightest reachable form of this id."

      - name: the_lab_buffer_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LAB_BUFFER_CONFLICT
          - validations.priority_27_ERR_LAB_BUFFER_CONFLICT
          - calculations.lab_bench_occupancy
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / bench_seat_buffer_expands_only_the_leading_edge_of_the_requested_interval"
          rationale: "That instance drives a request whose buffer-expanded leading edge collides with an existing grant and asserts ERR_LAB_BUFFER_CONFLICT, then shifts the request one day later to succeed."

      - name: the_funding_budget_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FUNDING_BUDGET_EXCEEDED
          - validations.priority_31_ERR_FUNDING_BUDGET_EXCEEDED
          - calculations.funding_encumbrance
        excluded_because:
          difficulty_instance: "compensating_invariant / offer_withdrawal_releases_the_exact_encumbrance_and_restores_reusable_budget"
          rationale: "That instance refuses a competing offer with ERR_FUNDING_BUDGET_EXCEEDED while the first offer holds the award, then issues it after the withdrawal releases the exact encumbrance, which is the only reachable trigger for this id."

      - name: the_start_before_lawful_date_error_is_a_defensive_guard_behind_the_deferral
        claim_type: error_triggerable
        grounds:
          - errors.ERR_START_BEFORE_LAWFUL_DATE
          - validations.priority_24_ERR_START_BEFORE_LAWFUL_DATE
          - state_machines.VisaCase.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: "transitive_cascade / visa_approval_defers_term_recomputes_ledger_and_auto_withdraws_short_term"
          rationale: "Activation requires the visa to be APPROVED at priority 22, and CH-B link 2 rewrites Appointment.term_start_date to earliest_lawful_start_date during that same approval, so by the time priority 24 runs the two dates are equal at worst. The cascade instance asserts exactly that rewrite and the equality it produces, which is the only observable behaviour of this guard; the strictly-earlier start it would report is unreachable through the declared API."

  - section: rbac
