scaffold_corner_design:

  - section: entities
    instances:
      - name: create_zone_returns_201_with_common_fields
        claim_type: creation
        grounds: ["entities.FloorZone", "endpoints"]
        distinguishing_aspect: "POST /fleet/zones with all required inputs returns 201 and the response carries id, created_at, updated_at, version=1, posture=OPEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id, z1_v: $.data.version, z1_posture: $.data.posture }
          assert:
            - "http status == 201"
            - "FloorZone.${z1}.version == 1"
            - "FloorZone.${z1}.posture == OPEN"

      - name: create_zone_missing_zone_code_fails
        claim_type: required_fields
        grounds: ["entities.FloorZone.fields.zone_code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required zone_code returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/zones"
              payload: { grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: get_zone_by_id_returns_record
        claim_type: retrieval
        grounds: ["entities.FloorZone", "endpoints"]
        distinguishing_aspect: "GET /fleet/zones/{id} returns the persisted record."
        test_recipe:
          setup: ["Zone Z1 exists"]
          setup_api_calls:
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
          trigger:
            - call: "GET /fleet/zones/${z1}"
              as: FleetAdmin
          assert:
            - "http status == 200"
            - "response data.id == ${z1}"

      - name: get_zone_missing_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/zones/00000000-0000-0000-0000-000000000000"
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: zone_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["three zones Z1, Z2, Z3 created"]
          setup_api_calls:
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z2", grid_x: 5, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z3", grid_x: 10, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/zones?limit=2&offset=0"
              as: FleetAdmin
              
          assert:
            - "response data.total_count == 3"
            - "response data.has_more == true"

      - name: drive_unit_default_status_active
        claim_type: defaults
        grounds: ["entities.DriveUnit.fields.status"]
        distinguishing_aspect: "Newly created DriveUnit starts in status ACTIVE with battery_pct 100."
        test_recipe:
          setup: ["Zone Z1 exists"]
          setup_api_calls:
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id, du1_status: $.data.status, du1_battery: $.data.battery_pct }
          assert:
            - "DriveUnit.${du1}.status == ACTIVE"
            - "DriveUnit.${du1}.battery_pct == 100"

      - name: pick_task_est_cost_computed_at_dispatch
        claim_type: computed_fields
        grounds: ["entities.PickTask.fields.est_cost"]
        distinguishing_aspect: "PickTask.est_cost is null at creation (CREATED) and populated by the planning variant of travel_cost_estimate at dispatch."
        test_recipe:
          setup:
            - "Zone Z1; Pod P1; Sku SKU1 with 5 units; PickStation ST1; CustomerOrder O1 line qty 1."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
          trigger:
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id }
          assert:
            - "PickTask.${pt1}.status == CREATED"
            - "PickTask.${pt1}.est_cost is null"

      - name: invalid_velocity_class_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Sku.fields.velocity_class", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Posting velocity_class='TURBO' (not in {HIGH, MEDIUM, LOW}) returns ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKUX", velocity_class: "TURBO" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: child_creation_with_wrong_parent_returns_404
        claim_type: parent_relationships
        grounds: ["entities.Pod.fields.zone_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /fleet/pods with a non-existent zone_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/pods"
              payload: { pod_code: "PX", zone_id: "00000000-0000-0000-0000-000000000000", slot_capacity: 5 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

  - section: state_machines
    instances:
      - name: pick_task_terminal_cancelled_rejects_dispatch
        claim_type: invalid_transition
        grounds: ["state_machines.PickTask", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatching a CANCELLED PickTask returns ERR_INVALID_STATE; terminal states are locked."
        test_recipe:
          setup: ["PT1 created then cancelled before sequence"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id }
            - call: "POST /fleet/pick-tasks/${pt1}/cancel"
              payload: {}
              as: FlowController
          trigger:
            - call: "POST /fleet/pick-tasks/${pt1}/dispatch"
              payload: {}
              as: FlowController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: release_failed_to_draft_cycle
        claim_type: valid_transition
        grounds: ["state_machines.SoftwareRelease.FAILED_to_DRAFT"]
        distinguishing_aspect: "SoftwareRelease supports a revision loop: VALIDATING -> FAILED -> DRAFT."
        test_recipe:
          setup: ["SoftwareRelease R1 created and pushed to VALIDATING"]
          setup_api_calls:
            - call: "POST /fleet/software-releases"
              payload: { release_code: "1.0.0" }
              as: ReleaseEngineer
              captures: { r1: $.data.id }
            - call: "POST /fleet/software-releases/${r1}/validate"
              payload: {}
              as: ReleaseEngineer
            - call: "POST /fleet/software-releases/${r1}/record-validation"
              payload: { outcome: "FAIL", defect_notes: "vibration sensor regressed" }
              as: SafetyOfficer
          trigger:
            - call: "POST /fleet/software-releases/${r1}/revise"
              payload: {}
              as: ReleaseEngineer
          assert:
            - "SoftwareRelease.${r1}.status == DRAFT"

      - name: pod_quarantined_on_stranded_robot
        claim_type: side_effect_execution
        grounds: ["state_machines.PickTask.DISPATCHED_to_FAILED", "state_machines.DriveUnit.EN_ROUTE_to_STRANDED"]
        distinguishing_aspect: "When a STRANDED_ROBOT exception is filed against an EN_ROUTE DriveUnit, the in-flight PickTask fails and the Pod becomes QUARANTINED."
        test_recipe:
          setup: ["PT1 dispatched; DU1 is EN_ROUTE with PT1's pod"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z2", grid_x: 10, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z2: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z2}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt1}/sequence"
              payload: { expected_station_version: "${st1_v}" }
              as: FlowController
            - call: "POST /fleet/pick-tasks/${pt1}/dispatch"
              payload: {}
              as: FlowController
          trigger:
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "STRANDED_ROBOT", zone_id: "${z1}", drive_unit_id: "${du1}" }
              as: FloorSupervisor
              captures: { ex1: $.data.id }
          assert:
            - "DriveUnit.${du1}.status == STRANDED"
            - "PickTask.${pt1}.status == FAILED"
            - "Pod.${p1}.status == QUARANTINED"

      - name: pick_task_initial_state_created
        claim_type: initial_state
        grounds: ["state_machines.PickTask"]
        distinguishing_aspect: "Newly created PickTask starts in CREATED with sequence_index null."
        test_recipe:
          setup:
            - "Zone Z1; Pod P1; Sku SKU1 with 5 units; PickStation ST1; CustomerOrder O1."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
          trigger:
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id, pt1_status: $.data.status, pt1_seq: $.data.sequence_index }
          assert:
            - "PickTask.${pt1}.status == CREATED"
            - "PickTask.${pt1}.sequence_index is null"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Calling any endpoint without X-User-Role or X-User-ID returns ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/zones"
              as: ANONYMOUS_NO_HEADERS
          assert:
            - "http status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: insufficient_inventory_blocks_pick_task_creation
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "Creating a PickTask whose quantity exceeds (on-hand - reserved) returns ERR_INSUFFICIENT_INVENTORY 422."
        test_recipe:
          setup: ["Zone Z1; Pod P1; Sku SKU1 with 2 units on hand; PickStation ST1; Order O1 line qty 5."]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 2 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 5}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
          trigger:
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 5 }
              as: FlowController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "http status == 422"

      - name: line_must_belong_to_order_referential
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REFERENTIAL_MISMATCH]"]
        distinguishing_aspect: "POST /fleet/pick-tasks with line_id from a different order returns ERR_REFERENTIAL_MISMATCH."
        test_recipe:
          setup: ["Zone Z1; Pod P1; Sku SKU1 with 10 units; PickStation ST1; Orders O1, O2 each with one line for SKU1."]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 5, height: 5, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
