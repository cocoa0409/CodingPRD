          trigger:
            - call: "POST /packaging-distribution/orders/${ord_a}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { sur_a: $.data.oversize_surcharge_cents }
            - call: "POST /packaging-distribution/orders/${ord_b}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { sur_b: $.data.oversize_surcharge_cents }
          assert:
            - "order A (dist 3 < 4, 100 lbs <= 150): oversize_surcharge_cents == 8900 (captured ${sur_a})"
            - "order B (dist |3-7| == 4 >= 4, 200 lbs > 150): oversize_surcharge_cents == 16400 (captured ${sur_b}: 8900 + 2500 + 5000)"

      - name: custom_lead_time_business_day_projection
        claim_type: correct_result
        grounds:
          - calculations.calc_custom_lead_time
        distinguishing_aspect: "Friday submit with lead_time_days 3 skips the weekend: promised_ship_date is the following Wednesday (2026-08-07 submit + 3 business days = 2026-08-12)."
        test_recipe:
