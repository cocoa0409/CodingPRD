# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >= 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_provisional_vs_final
        grounds:
          - calculations.provisional_permit_fee
          - calculations.final_permit_fee
          - entities.SignApplication.fields.provisional_fee_cents
          - entities.Permit.fields.fee_charged_cents
          - state_machines.Variance.UNDER_REVIEW_to_GRANTED
        distinguishing_aspect: |
          Same original MONUMENT/150sqft/EXTERNAL request yields provisional_fee_cents=61100 (from requested 150 sqft)
          but Permit.fee_charged_cents=43600 (from approved 100 sqft after a partial AREA variance) — divergence lives on the Permit/Application fee domain.
        test_recipe:
          setup:
            - "Parcel with max_sign_area_sqft=100, allowed_illumination=DIGITAL_DISPLAY, max_signs=5, historic_overlay=false."
            - "MONUMENT application requesting 150 sqft / EXTERNAL; submitted (provisional fee computed from 150)."
            - "AREA variance recommended then GRANTED at granted_value=100 (partial relief)."
            - "Dimensional review PASS (effective 100 <= 100) and overlay CLEARED; application APPROVED."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 100, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "DIGITAL_DISPLAY", max_signs: 5, historic_overlay: false }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Acme Signs", contact_email: "a@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "MONUMENT", requested_area_sqft: 150, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "EXTERNAL" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { prov_fee: $.data.provisional_fee_cents }
            - call: "POST /variances"
              payload: { application_id: "${application_id}", kind: "AREA", requested_value: 150, justification: "corner lot hardship" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { variance_id: $.data.id }
            - call: "POST /variances/${variance_id}/recommend"
              payload: { recommendation: "RECOMMEND_APPROVE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /variances/${variance_id}/decide"
              payload: { decision: "GRANT", granted_value: 100 }
              as: ZoningBoard
              as_user_id: "board-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
          trigger:
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { permit_id: $.data.id, final_fee: $.data.fee_charged_cents }
          assert:
            - "SignApplication.${application_id}.provisional_fee_cents == 61100"
            - "Permit.${permit_id}.fee_charged_cents == 43600"

      - name: non_conforming_straight_line_vs_declining
        grounds:
          - calculations.non_conforming_valuation
          - entities.NonConformingRegistration.fields.straight_line_value_cents
          - entities.NonConformingRegistration.fields.declining_balance_value_cents
        distinguishing_aspect: |
          Same registration (original 1,000,000c, 5-year term, 2.0 years elapsed) yields straight_line_value_cents=600000
          but declining_balance_value_cents=640000 — dual-variant divergence on the NonConformingRegistration domain (distinct entity from the permit-fee dual variant).
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; register a non-conforming sign (original 1,000,000c, 5-year term) so registered_at=2026-05-01."
            - "Advance clock to 2028-04-30T00:00:00Z (exactly 730 days = 2.0 years elapsed)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /non-conforming"
              payload: { parcel_id: "${parcel_id}", description: "legacy pole sign", original_value_cents: 1000000, amortization_period_years: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { ncr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-30T00:00:00Z" }
              as: Planner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /non-conforming?parcel_id=${parcel_id}"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "NonConformingRegistration.${ncr_id}.straight_line_value_cents == 600000"
            - "NonConformingRegistration.${ncr_id}.declining_balance_value_cents == 640000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_tiered_nonlinear_straddle
        grounds:
          - calculations.final_permit_fee
          - entities.Permit.fields.fee_charged_cents
        distinguishing_aspect: |
          Mode (a): fee = base(type) + tiered area (tier1 68 sqft @200c straddling into tier2 50 sqft @350c) + illumination surcharge — >=3 inputs, nested tier selection.
          DIGITAL/150sqft/DIGITAL_DISPLAY yields fee_charged_cents=101100 (50000 + 13600 + 17500 + 20000).
        test_recipe:
          setup:
            - "Parcel max_sign_area_sqft=200, allowed_illumination=DIGITAL_DISPLAY; conforming DIGITAL sign 150 sqft / DIGITAL_DISPLAY approved without variance."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "DIGITAL_DISPLAY", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Bright LED Co", contact_email: "b@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "DIGITAL", requested_area_sqft: 150, requested_height_ft: 30, requested_setback_ft: 12, requested_illumination: "DIGITAL_DISPLAY" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
          trigger:
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { permit_id: $.data.id }
          assert:
            - "Permit.${permit_id}.fee_charged_cents == 101100"

      - name: registration_fee_round_per_face_then_sum
        grounds:
          - calculations.billboard_registration_fee
          - entities.Billboard.fields.registration_fee_collected_cents
        distinguishing_aspect: |
          Mode (b): per-face rounding order is pinned — digital 3-face fee = 3 * round(3333*1.5=4999.5)=3*5000=15000, NOT round(3*4999.5=14998.5)=14999.
          Distinct mode from the tiered (a) instance.
        test_recipe:
          setup:
            - "Digital billboard with face_count=3 created by its operator; then registered."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 60, min_setback_ft: 10, allowed_illumination: "DIGITAL_DISPLAY", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Outdoor Media LLC", contact_email: "o@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { operator_id: $.data.id }
            - call: "POST /billboards"
              payload: { parcel_id: "${parcel_id}", operator_id: "${operator_id}", face_count: 3, is_digital: true, structure_height_ft: 45 }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { billboard_id: $.data.id }
          trigger:
            - call: "POST /billboards/${billboard_id}/register"
              payload: { amount_cents: 15000 }
              as: Applicant
              as_user_id: "${operator_id}"
          assert:
            - "Billboard.${billboard_id}.registration_fee_collected_cents == 15000"
            - "Billboard.${billboard_id}.registration_status == REGISTERED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: variance_revision_cycle_returns_to_under_review
        grounds:
          - state_machines.Variance.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Variance.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.Variance.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Variance entity: SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW; the second recommend re-enters UNDER_REVIEW.
        test_recipe:
          setup:
            - "An application exists with a filed variance (SUBMITTED)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 100, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Loop Signs", contact_email: "l@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "MONUMENT", requested_area_sqft: 150, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "EXTERNAL" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /variances"
              payload: { application_id: "${application_id}", kind: "AREA", requested_value: 150, justification: "hardship" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { variance_id: $.data.id }
          trigger:
            - call: "POST /variances/${variance_id}/recommend"
              payload: { recommendation: "RECOMMEND_APPROVE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /variances/${variance_id}/decide"
              payload: { decision: "REVISE" }
              as: ZoningBoard
              as_user_id: "board-1"
            - call: "POST /variances/${variance_id}/recommend"
              payload: { recommendation: "RECOMMEND_APPROVE" }
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "Variance.${variance_id}.status == UNDER_REVIEW"

      - name: application_parallel_review_axes_independent
        grounds:
          - state_machines.SignApplication.dimensional_review
          - state_machines.SignApplication.overlay_review
          - entities.SignApplication.fields.dimensional_review
          - entities.SignApplication.fields.overlay_review
        distinguishing_aspect: |
          Parallel dimensions on the SignApplication entity: recording DIMENSIONAL PASS advances dimensional_review to PASS while overlay_review remains PENDING — the two axes evolve independently.
        test_recipe:
          setup:
            - "A conforming submitted application (both review axes PENDING)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Axis Signs", contact_email: "ax@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "SignApplication.${application_id}.dimensional_review == PASS"
            - "SignApplication.${application_id}.overlay_review == PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: escalation_removal_revoke_cancel_depth3
        grounds:
          - state_machines.Violation.OPEN_to_ESCALATED
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - entities.RemovalOrder.fields.violation_id
        distinguishing_aspect: |
          Depth-3 chain from POST /violations/{id}/escalate: violation ESCALATED creates a RemovalOrder (link1);
          the RemovalOrder issuance revokes the linked Permit (link2); the Permit revoke cancels its SCHEDULED Inspection (link3).
        test_recipe:
          setup:
            - "ACTIVE permit on a parcel, with one SCHEDULED inspection and one OPEN violation linked to that permit; clock advanced past the violation cure_deadline."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Cascade Signs", contact_email: "c@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /inspectors"
              payload: { name: "Inspector Ivy" }
              as: Planner
              as_user_id: "planner-1"
              captures: { inspector_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/pay"
              payload: { amount_cents: 16600 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /inspections"
              payload: { permit_id: "${permit_id}", inspector_id: "${inspector_id}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Planner
              as_user_id: "planner-1"
              captures: { inspection_id: $.data.id }
            - call: "POST /violations"
              payload: { parcel_id: "${parcel_id}", kind: "EXCEEDS_PERMIT", permit_id: "${permit_id}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { violation_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Planner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /violations/${violation_id}/escalate"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "Violation.${violation_id}.status == ESCALATED"
            - "Permit.${permit_id}.status == REVOKED"
            - "Inspection.${inspection_id}.status == CANCELLED"
            - "GET /removal-orders?violation_id=${violation_id} returns exactly 1 RemovalOrder with status ISSUED"

      - name: registration_lapse_lease_suspend_depth2
        grounds:
          - state_machines.Billboard.REGISTERED_to_LAPSED
          - state_machines.BillboardLease.ACTIVE_to_SUSPENDED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Depth-2 chain from a distinct trigger (clock advance past registration_expires_at): billboard REGISTERED -> LAPSED (link1);
          the lapse suspends that billboard's ACTIVE leases -> SUSPENDED (link2).
        test_recipe:
          setup:
            - "A registered billboard (registration_expires_at=2027-05-01) with one ACTIVE lease [2026-06-01,2027-06-01)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 60, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Lapse Media", contact_email: "lm@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { operator_id: $.data.id }
            - call: "POST /billboards"
              payload: { parcel_id: "${parcel_id}", operator_id: "${operator_id}", face_count: 1, is_digital: false, structure_height_ft: 40 }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { billboard_id: $.data.id }
            - call: "POST /billboards/${billboard_id}/register"
              payload: { amount_cents: 3333 }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { bb_ver: $.data.version }
            - call: "POST /billboard-leases"
              payload: { billboard_id: "${billboard_id}", lessee_name: "Ad Buyer", start_date: "2026-06-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z", expected_billboard_version: "${bb_ver}" }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-15T00:00:00Z" }
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "Billboard.${billboard_id}.registration_status == LAPSED"
            - "BillboardLease.${lease_id}.status == SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pay
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Permit.ISSUED_to_ACTIVE
        distinguishing_aspect: |
          Category pair state (priority 6) vs business_fiscal (priority 11): paying an already-ACTIVE permit with amount_cents=1
          fails the state check (ERR_INVALID_STATE) rather than the fee-sufficiency check (ERR_FEE_NOT_PAID).
        test_recipe:
          setup:
            - "An ACTIVE (already paid) permit."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Prio Signs", contact_email: "p@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/pay"
