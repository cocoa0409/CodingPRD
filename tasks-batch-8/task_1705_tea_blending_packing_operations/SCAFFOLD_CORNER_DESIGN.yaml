      - name: supplier_suspended_blocks_lot_release
        claim_type: cross_entity_validation
        grounds:
          - "errors[ERR_SUPPLIER_SUSPENDED]"
          - "state_machines.LeafLot.LAB_SUBMITTED_to_RELEASED"
        distinguishing_aspect: "Entity pair LeafLot -> Supplier: a lot whose lab verdict is PASS still cannot be released while its supplier is SUSPENDED — the cross-entity gate re-checks at release time."
        test_recipe:
          setup: ["supplier; lot graded B, residue PASS (LAB_SUBMITTED); supplier suspended (lot cascades to ON_HOLD); retest PASS returns lot to LAB_SUBMITTED while supplier stays SUSPENDED"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Susp Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
