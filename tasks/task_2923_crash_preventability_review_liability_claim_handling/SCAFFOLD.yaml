# Task 2923 — Crash Preventability Review & Liability Claim Handling
# Motor-carrier risk management: crash intake -> evidence preservation -> safety
# committee preventability determination with appeal -> regulatory recordability
# and filing -> liability claim with reserve estimation, counsel assignment,
# third-party negotiation across policy layers and a self-insured retention ->
# driver discipline / retraining / continued-employment -> crash-rate analytics
# -> subrogation against at-fault third parties.

scenario: |
  2923. Crash Preventability Review & Liability Claim Handling (motor carrier risk management):
  crash notification intake with driver statement, telematics and camera evidence preservation,
  preventability determination by a safety review committee with criteria and appeal, regulatory
  recordability determination and reporting obligations, claim setup with reserve estimation and
  counsel assignment for litigation risk, third-party property damage and bodily injury negotiation
  with policy layers and self-insured retention, driver disciplinary action, retraining and
  continued-employment decisions, crash rate analytics by terminal, route and driver tenure,
  subrogation against at-fault third parties

domain_name: crash-preventability-liability-claims
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Flat: 13 peer entities linked by explicit FK body fields. URL paths are
  # single-level collections (`/crashes/{id}`, `/claims/{id}`, `/demands/{id}`,
  # `/evidence-items/{id}`, `/disciplinary-actions/{id}`) plus one level of
  # sub-resource collections for append-only children. No nested identifier
  # chains: a Demand is addressed as `/demands/{id}`, never
  # `/claims/{claim_id}/demands/{demand_id}`.

  state_machine_shape: cyclic
  # Cyclic is the dominant shape: ReviewCase re-enters DELIBERATION through a
  # granted appeal, Demand re-enters OFFER_OUTSTANDING through a claimant
  # counter and again through a rescinded settlement, Driver re-enters ACTIVE
  # after retraining. Claim additionally carries two parallel state dimensions
  # (`handling_status` x `reserve_status`), and `decide` branches to two target
  # states with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Terminal->Driver, Crash->EvidenceItem, ReviewCase->CommitteeVote, Claim->Demand, Demand->NegotiationRound
    - cross_aggregate      # ReviewCase.appeal_evidence_item_id crosses into the evidence aggregate; Claim reads Crash+Driver+Terminal
    - polymorphic_actor    # member_user_id / issued_by_user_id / decided_by_user_id hold opaque operator ids, never entity ids

  role_model: segregation_of_duties
  # A SafetyManager who is also a seated committee member (same X-User-ID)
  # cannot decide the case he voted on, and the manager who decided cannot be
  # the one who grants the appeal. Blended with peer_roles: safety-side roles
  # (Dispatcher/CommitteeMember/SafetyManager) and claim-side roles
  # (ClaimsAdjuster/ClaimsManager) own disjoint resource sets.

  consistency_model: immediate
  # Every cascade in §1.2 completes inside the triggering request. Clock-window
  # dependent computed fields (Terminal.preventable_crash_count,
  # Terminal.crash_rate_per_million_miles, Terminal.risk_tier,
  # Terminal.active_driver_count, Terminal.suspended_driver_count,
  # Terminal.staffing_posture, Driver.preventable_points,
  # Driver.required_action_tier, Driver.tenure_band) are re-derived at response
  # time on every read, so moving the logical clock alone changes them.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable terminal name.
      - name: terminal_code
        type: string
        source: input
        description: Operator-assigned terminal code; unique across all Terminals.
        constraints: "3-10 chars, uppercase alphanumeric; unique (ERR_TERMINAL_CODE_DUPLICATE)"
      - name: region_code
        type: string
        source: input
        description: Two-letter region/state code used for analytics grouping.
      - name: annual_miles_millions
        type: number
        source: input
        description: Exposure denominator for crash-rate analytics, in millions of miles driven per year.
        constraints: "> 0; at most 4 decimal places"
      - name: active_driver_count
        type: integer
        source: computed
        description: "Count of Driver rows with terminal_id == this Terminal.id AND status IN {ACTIVE, SUSPENDED_PENDING_ACTION, RETRAINING_REQUIRED} (i.e. status != TERMINATED). Re-derived on every read."
      - name: suspended_driver_count
        type: integer
        source: computed
        description: "Count of Driver rows with terminal_id == this Terminal.id AND status IN {SUSPENDED_PENDING_ACTION, RETRAINING_REQUIRED}. Re-derived on every read."
      - name: preventable_crash_count
        type: integer
        source: computed
        description: "Output of calculations.terminal_crash_rate (basis AS_DETERMINED): count of Crash rows with terminal_id == this Terminal.id, preventability_status == PREVENTABLE, and occurred_at in the half-open window [current_utc - 365d, current_utc). Re-derived on every read."
      - name: crash_rate_per_million_miles
        type: number
        source: computed
        description: "Output of calculations.terminal_crash_rate: preventable_crash_count / annual_miles_millions, round_half_up to 3 decimals. Re-derived on every read."
      - name: risk_tier
        type: enum
        source: computed
        description: "Threshold band over crash_rate_per_million_miles per calculations.terminal_crash_rate."
        constraints: "STANDARD | ELEVATED | CRITICAL"
      - name: staffing_posture
        type: enum
        source: computed
        description: "Output of calculations.terminal_staffing_posture over suspended_driver_count / active_driver_count. Gates issuance of new SUSPENSION disciplinary actions at this terminal."
        constraints: "OK | STRAINED | CRITICAL"
      - name: late_filing_count
        type: integer
        source: computed
        description: "Count of Crash rows with terminal_id == this Terminal.id AND reporting_status == LATE_FILED (no time window). Re-derived on every read."

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; the terminal this driver is domiciled at."
      - name: employee_code
        type: string
        source: input
        description: Payroll code for the driver; unique within the owning terminal.
        constraints: "unique per (terminal_id, employee_code) (ERR_EMPLOYEE_CODE_DUPLICATE)"
      - name: full_name
        type: string
        source: input
        description: Driver legal name.
      - name: cdl_number
        type: string
        source: input
        description: Commercial driver licence number.
      - name: hire_date
        type: string
        source: input
        description: "Date of hire, ISO 8601 calendar date (YYYY-MM-DD), used as the tenure baseline."
      - name: status
        type: enum
        source: system
        description: "Employment/duty state; see state_machines.Driver."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED_PENDING_ACTION | RETRAINING_REQUIRED | TERMINATED"
      - name: tenure_band
        type: enum
        source: computed
        description: "Band of (current_utc - hire_date): < 365 days -> UNDER_12_MONTHS; >= 365 and < 1096 days -> MONTHS_12_TO_36; >= 1096 days -> OVER_36_MONTHS. Re-derived on every read."
        constraints: "UNDER_12_MONTHS | MONTHS_12_TO_36 | OVER_36_MONTHS"
      - name: preventable_points
        type: number
        source: computed
        description: "Output of calculations.driver_preventable_points. Re-derived on every read and after every cascade that changes a Crash.preventability_status for this driver."
      - name: required_action_tier
        type: enum
        source: computed
        description: "Threshold band over preventable_points per calculations.driver_preventable_points; the floor for a permissible DisciplinaryAction.action_type."
        constraints: "NONE | COACHING | RETRAINING | SUSPENSION | TERMINATION_REVIEW"
      - name: continued_employment_decision
        type: enum
        source: system
        description: "Outcome of POST /drivers/{id}/employment-decision."
        default: PENDING
        constraints: "PENDING | CONTINUE | SEPARATE"
      - name: decision_note
        type: string
        source: input
        description: "Free-text rationale recorded by the last employment decision; null until a decision is made."
        default: null

  - name: Crash
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver operating the unit at the time of the crash."
      - name: terminal_id
        type: string
        source: computed
        description: "FK -> Terminal.id; copied from Driver.terminal_id at intake and frozen, so terminal analytics are stable even if the driver later transfers."
      - name: occurred_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the crash; must be <= current_utc."
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the crash notification was intaken (equals current_utc at POST /crashes)."
      - name: location_text
        type: string
        source: input
        description: Free-text crash location.
      - name: severity
        type: enum
        source: input
        description: "Adjuster-assigned severity band; drives the required evidence kind set and the reserve severity base."
        constraints: "MINOR | MODERATE | SEVERE | CATASTROPHIC"
      - name: route_class
        type: enum
        source: input
        description: "Operating class of the run; an analytics grouping key."
        constraints: "LOCAL | REGIONAL | LINEHAUL"
      - name: tow_away
        type: boolean
        source: input
        description: Whether any unit was towed from the scene.
      - name: tow_reason
        type: enum
        source: input
        description: "Why the unit was towed; only DISABLING_DAMAGE contributes to DOT recordability."
        constraints: "NONE | CONVENIENCE | DISABLING_DAMAGE"
      - name: injury_transported_count
        type: integer
        source: input
        description: Number of persons transported from the scene for immediate medical attention.
        constraints: ">= 0"
      - name: fatality_count
        type: integer
        source: input
        description: Number of fatalities.
        constraints: ">= 0"
      - name: hazmat_release
        type: boolean
        source: input
        description: Whether a hazardous-material release occurred; shortens the regulatory filing window.
      - name: mechanical_factor
        type: boolean
        source: input
        description: "Whether a mechanical/equipment factor is in play. When false, the vehicle_condition_precheck criterion is not applicable in calculations.preventability_determination and its weight is renormalised away."
      - name: third_party_at_fault
        type: boolean
        source: input
        description: Whether an identified third party is alleged at fault; required to be true before a SubrogationDemand may be opened.
      - name: dot_recordable
        type: boolean
        source: computed
        description: "Output of calculations.crash_recordability, evaluated once at intake and frozen."
      - name: recordability_codes
        type: array
        source: computed
        description: "Ordered list of the recordability triggers that fired, in the fixed order [FATALITY, INJURY_TRANSPORTED, DISABLING_TOW, HAZMAT_RELEASE]; empty when dot_recordable is false."
      - name: report_due_at
        type: datetime
        source: computed
        description: "occurred_at + 24h when hazmat_release is true, else occurred_at + 72h; null when dot_recordable is false. Frozen at intake."
      - name: reporting_status
        type: enum
        source: system
        description: "Regulatory filing dimension; see state_machines.Crash.reporting_status."
        constraints: "NOT_REQUIRED | PENDING_FILING | FILED | LATE_FILED"
      - name: filing_reference
        type: string
        source: input
        description: "Agency filing reference recorded by POST /crashes/{id}/regulatory-report; null before filing."
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the regulatory filing; null before filing."
        default: null
      - name: preventability_status
        type: enum
        source: system
        description: "Safety determination dimension; see state_machines.Crash.preventability_status."
        default: REPORTED
        constraints: "REPORTED | UNDER_REVIEW | PREVENTABLE | NON_PREVENTABLE"
      - name: appeals_exhausted
        type: boolean
        source: system
        description: "Set true when the crash's ReviewCase reaches CLOSED_FINAL; makes the current preventability_status permanent."
        default: false
      - name: evidence_posture
        type: enum
        source: computed
        description: "Output of calculations.crash_evidence_posture over this crash's EvidenceItem rows; gates POST /review-cases/{id}/decide and selects the preventability variant."
        default: PARTIAL
        constraints: "PARTIAL | COMPLETE | COMPROMISED"

  - name: DriverStatement
    parent: null
    common_fields: false
    description_note: "Append-only intake artifact; no update endpoint, no version field."
    fields:
      - name: crash_id
        type: string
        source: input
        description: "FK -> Crash.id; the crash this statement narrates."
      - name: narrative
        type: string
        source: input
        description: Driver's own account of the crash.
        constraints: "1-4000 chars"
      - name: conditions_note
        type: string
        source: input
        description: Optional road/weather/light conditions note.
        default: null
      - name: attested
        type: boolean
        source: input
        description: Driver attestation that the narrative is true; must be true.
        constraints: "must be true (ERR_STATEMENT_NOT_ATTESTED)"
      - name: submitted_by_driver_id
        type: string
        source: system
        description: "Copy of the submitting X-User-ID (which must equal Crash.driver_id); recorded for audit. Not a foreign key for reachability purposes — the statement is discovered through its crash."
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission.

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - name: crash_id
        type: string
        source: input
        description: "FK -> Crash.id; the crash whose evidence this item preserves."
      - name: kind
        type: enum
        source: input
        description: "Evidence channel. TELEMATICS_SNAPSHOT, FORWARD_CAMERA and ELD_LOG participate in the required-kind sets of calculations.crash_evidence_posture."
        constraints: "TELEMATICS_SNAPSHOT | FORWARD_CAMERA | DRIVER_FACING_CAMERA | ELD_LOG | SCENE_PHOTO"
      - name: source_device_id
        type: string
        source: input
        description: Vendor identifier of the device or feed the item was pulled from.
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the preserved data window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the preserved data window; must be > window_start_at."
      - name: retention_deadline_at
        type: datetime
        source: input
        description: "Vendor purge deadline; must be > current_utc at creation. Preservation after this instant is refused."
      - name: preservation_state
        type: enum
        source: system
        description: "See state_machines.EvidenceItem."
        default: REQUESTED
        constraints: "REQUESTED | PRESERVED | PURGED_BEFORE_HOLD | RELEASED"
      - name: evidence_hash
        type: string
        source: input
        description: "SHA-256 hex digest of the preserved artifact; optional at request time, required at preserve time."
        default: null
      - name: preserved_copy_uri
        type: string
        source: input
        description: "Immutable-store URI of the preserved copy; set by POST /evidence-items/{id}/preserve."
        default: null
      - name: preserved_at
        type: datetime
        source: system
        description: Logical-clock instant of preservation; null while REQUESTED.
        default: null
      - name: purge_reason
        type: string
        source: input
        description: "Reason recorded by POST /evidence-items/{id}/purge."
        default: null

  - name: ReviewCase
    parent: null
    common_fields: true
    fields:
      - name: crash_id
        type: string
        source: input
        description: "FK -> Crash.id; at most one ReviewCase per Crash (ERR_REVIEW_CASE_EXISTS)."
      - name: committee_name
        type: string
        source: input
        description: Name of the seated safety review committee.
      - name: statement_waiver_reason
        type: string
        source: input
        description: "Reason the driver statement requirement is waived; when absent, a DriverStatement must already exist for the crash."
        default: null
      - name: status
        type: enum
        source: system
        description: "See state_machines.ReviewCase."
        default: DRAFT
        constraints: "DRAFT | DELIBERATION | DECIDED | CLOSED_FINAL"
      - name: determination
        type: enum
        source: system
        description: "The committee's preventability determination; PENDING until the first decide."
        default: PENDING
        constraints: "PENDING | PREVENTABLE | NON_PREVENTABLE"
      - name: decision_basis
        type: enum
        source: computed
        description: "Which variant of calculations.preventability_determination produced `determination`: UNWEIGHTED_MAJORITY when Crash.evidence_posture == COMPLETE, WEIGHTED_CRITERIA when Crash.evidence_posture == COMPROMISED. NOT_APPLICABLE before any decision."
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | UNWEIGHTED_MAJORITY | WEIGHTED_CRITERIA"
      - name: committee_score
        type: number
        source: computed
        description: "Output of calculations.preventability_determination: mean of the non-superseded, non-ABSTAIN CommitteeVote.weighted_member_score values, round_half_up to 2 decimals. Always computed at decide time regardless of which variant decides, so it is observable under both bases. Null before any decision."
        default: null
      - name: active_vote_count
        type: integer
        source: computed
        description: "Count of non-superseded CommitteeVote rows on this case whose vote != ABSTAIN. Re-derived on every read."
      - name: abstain_count
        type: integer
        source: computed
        description: "Count of non-superseded CommitteeVote rows on this case whose vote == ABSTAIN. Re-derived on every read."
      - name: next_vote_sequence
        type: integer
        source: system
        description: "Next CommitteeVote.sequence_number to mint for this case; starts at 1 and increments on every accepted vote."
        default: 1
      - name: appeal_round
        type: integer
        source: system
        description: "Number of granted appeals; 0 on creation, capped at APPEAL_MAX_ROUNDS."
        default: 0
      - name: appeal_grounds
        type: string
        source: input
        description: "Narrative grounds of the most recently granted appeal; null before any appeal."
        default: null
      - name: appeal_grounds_code
        type: enum
        source: input
        description: "Category of the most recently granted appeal."
        default: null
        constraints: "NEW_EVIDENCE | PROCEDURAL | CRITERIA_MISAPPLICATION"
      - name: appeal_evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the newly surfaced evidence cited by a NEW_EVIDENCE appeal. Null for PROCEDURAL and CRITERIA_MISAPPLICATION appeals and before any appeal."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SafetyManager who recorded the most recent decision; used by the appeal segregation-of-duties check. Not a foreign key."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent decision; the appeal window baseline."
        default: null

  - name: CommitteeVote
    parent: null
    common_fields: false
    description_note: "Append-only ballot; superseded rather than updated."
    fields:
      - name: review_case_id
        type: string
        source: input
        description: "FK -> ReviewCase.id; the case this ballot belongs to."
      - name: member_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CommitteeMember who cast the ballot. Not a foreign key — CommitteeMember is an opaque role."
      - name: sequence_number
        type: integer
        source: system
        description: "Per-case monotonically increasing ballot index taken from ReviewCase.next_vote_sequence; the sole ordering key for 'latest ballot per member'."
      - name: vote
        type: enum
        source: input
        description: "The member's ballot."
        constraints: "PREVENTABLE | NON_PREVENTABLE | ABSTAIN"
      - name: criterion_scores
        type: object
        source: input
        description: "Map with exactly the five keys speed_and_spacing, hazard_recognition, vehicle_condition_precheck, regulatory_compliance, evasive_action, each an integer 0-4. Required when vote != ABSTAIN; must be omitted when vote == ABSTAIN."
        default: null
      - name: weighted_member_score
        type: number
        source: computed
        description: "Output of calculations.preventability_determination step 1 for this ballot: the renormalised weighted criterion mean, round_half_up to 2 decimals. Null for ABSTAIN ballots."
        default: null
      - name: superseded
        type: boolean
        source: computed
        description: "True when a later ballot (greater sequence_number) exists on the same review_case_id from the same member_user_id."
        default: false
      - name: comment
        type: string
        source: input
        description: Optional deliberation comment.
        default: null
      - name: cast_at
        type: datetime
        source: system
        description: Logical-clock instant the ballot was cast.

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: crash_id
        type: string
        source: input
        description: "FK -> Crash.id; at most one Claim per Crash (ERR_CLAIM_EXISTS)."
      - name: claimant_notice_date
        type: string
        source: input
        description: "ISO 8601 calendar date the carrier received notice of a third-party claim."
      - name: adjuster_note
        type: string
        source: input
        description: Optional free-text setup note.
        default: null
      - name: handling_status
        type: enum
        source: system
        description: "Workflow dimension; see state_machines.Claim.handling_status. Evolves independently of reserve_status."
        default: SETUP
        constraints: "SETUP | NEGOTIATION | SETTLEMENT_COMPLETE | CLOSED"
      - name: reserve_status
        type: enum
        source: system
        description: "Reserve-maturity dimension; see state_machines.Claim.reserve_status. Evolves independently of handling_status."
        default: PROVISIONAL
        constraints: "PROVISIONAL | REVISED | FINAL"
      - name: litigation_risk_score
        type: integer
        source: computed
        description: "Output of calculations.litigation_risk_score, 0-100. Recomputed on claim creation and on every cascade that changes Crash.preventability_status or Crash.evidence_posture."
      - name: litigation_risk_multiplier
        type: number
        source: computed
        description: "Tier selected from litigation_risk_score per calculations.litigation_risk_score; 1.00 | 1.15 | 1.35 | 1.60."
      - name: counsel_required
        type: boolean
        source: computed
        description: "True when litigation_risk_score >= COUNSEL_REQUIRED_SCORE (55)."
        default: false
      - name: counsel_assigned
        type: boolean
        source: system
        description: "True once POST /claims/{id}/counsel-assignment has succeeded."
        default: false
      - name: counsel_firm_name
        type: string
        source: input
        description: Assigned defence firm; null until assignment.
        default: null
      - name: counsel_type
        type: enum
        source: input
        description: "Tier of the assigned counsel."
        default: NONE
        constraints: "NONE | PANEL | IN_HOUSE | LEAD_TRIAL"
      - name: counsel_assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant counsel was assigned; null until assignment."
        default: null
      - name: litigation_flag
        type: boolean
        source: system
        description: "Set true when counsel is assigned while counsel_required is true; marks the claim as being handled under litigation risk."
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim was closed; null while open."
        default: null
      - name: provisional_reserve_cents
        type: integer
        source: computed
        description: "Output of calculations.claim_reserve variant provisional_at_setup, computed once at claim creation and frozen thereafter."
      - name: revised_reserve_cents
        type: integer
        source: computed
        description: "Output of the calculations.claim_reserve variant selected by the most recent POST /claims/{id}/reserve-revisions `basis`; null until the first revision."
        default: null
      - name: outstanding_reserve_cents
        type: integer
        source: computed
        description: "Unpaid case reserve. Initialised to provisional_reserve_cents at creation; reset by every reserve revision; decremented by settlements; restored by rescissions; zeroed into reserve_released_cents at close."
      - name: indemnity_paid_cents
        type: integer
        source: computed
        description: "Cumulative indemnity paid on settled demands of this claim."
        default: 0
      - name: alae_paid_cents
        type: integer
        source: computed
        description: "Cumulative allocated loss adjustment expense paid on settled demands of this claim."
        default: 0
      - name: reserve_released_cents
        type: integer
        source: computed
        description: "Reserve released (not paid) when the claim closed."
        default: 0
      - name: subrogation_recovered_cents
        type: integer
        source: computed
        description: "Cumulative amount recovered from at-fault third parties on this claim."
        default: 0
      - name: sir_eroded_cents
        type: integer
        source: computed
        description: "Portion of settlement_total allocated to the layer whose layer_type == SIR, cumulative over this claim."
        default: 0
      - name: insured_paid_cents
        type: integer
        source: computed
        description: "Portion of settlement_total allocated to layers whose layer_type IN {PRIMARY, EXCESS}, cumulative over this claim."
        default: 0
      - name: layer_allocations
        type: array
        source: computed
        description: "Ordered array of objects { policy_layer_id, layer_index, layer_type, allocated_cents } produced by calculations.settlement_layer_waterfall, ascending by layer_index. Empty until the first settlement; entries are merged (allocated_cents summed) across settlements on the same claim."
        default: []
      - name: total_incurred_cents
        type: integer
        source: computed
        description: "indemnity_paid_cents + alae_paid_cents + outstanding_reserve_cents - subrogation_recovered_cents. Re-derived on every read."
      - name: claim_exposure_cents
        type: integer
        source: computed
        description: "Conserved ledger quantity: outstanding_reserve_cents + indemnity_paid_cents + alae_paid_cents + reserve_released_cents. Unchanged by settlement, rescission and close; changed only by a reserve revision."

  - name: PolicyLayer
    parent: null
    common_fields: false
    description_note: "Program configuration; immutable once created (no update endpoint, no version field)."
    fields:
      - name: program_year
        type: integer
        source: input
        description: "Calendar year of the insurance program this layer belongs to; a Claim consumes the layer set whose program_year equals the UTC year of its Crash.occurred_at."
      - name: layer_index
        type: integer
        source: input
        description: "1-based position in the tower; unique per program_year (ERR_POLICY_LAYER_DUPLICATE) and the sole waterfall ordering key."
        constraints: ">= 1"
      - name: layer_type
        type: enum
        source: input
        description: "Layer role. layer_index 1 MUST be SIR with attachment_point_cents == 0."
        constraints: "SIR | PRIMARY | EXCESS"
      - name: attachment_point_cents
        type: integer
        source: input
        description: "Cumulative amount that must be consumed by lower layers before this layer attaches; MUST equal the sum of limit_cents over layers 1..layer_index-1 of the same program_year."
        constraints: ">= 0"
      - name: limit_cents
        type: integer
        source: input
        description: "Per-claim (per-occurrence) capacity of this layer."
        constraints: "> 0"
      - name: insurer_name
        type: string
        source: input
        description: Carrier or retention holder for the layer.

  - name: Demand
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this third-party demand is asserted against."
      - name: claimant_name
        type: string
        source: input
        description: Name of the demanding third party.
      - name: claimant_type
        type: enum
        source: input
        description: "Head of damage. THIRD_PARTY_BODILY_INJURY demands are subject to the counsel gate on offers."
        constraints: "THIRD_PARTY_PROPERTY | THIRD_PARTY_BODILY_INJURY"
      - name: demand_amount_cents
        type: integer
        source: input
        description: The amount demanded; the ceiling for any carrier offer.
        constraints: "> 0"
      - name: represented_by_counsel
        type: boolean
        source: input
        description: Whether the claimant is represented by an attorney.
      - name: demand_received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the written demand was received; must be <= current_utc."
      - name: status
        type: enum
        source: system
        description: "See state_machines.Demand."
        default: DEMANDED
        constraints: "DEMANDED | OFFER_OUTSTANDING | COUNTER_OUTSTANDING | SETTLED | CLOSED_PAID"
      - name: next_round_index
        type: integer
        source: system
        description: "Next NegotiationRound.round_index to mint for this demand; starts at 1."
        default: 1
      - name: round_count
        type: integer
        source: computed
        description: "Count of NegotiationRound rows with demand_id == this Demand.id. Re-derived on every read."
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "Accepted indemnity amount; null unless status IN {SETTLED, CLOSED_PAID}."
        default: null
      - name: alae_cents
        type: integer
        source: computed
        description: "Allocated loss adjustment expense computed by calculations.settlement_layer_waterfall step 3; null unless status IN {SETTLED, CLOSED_PAID}."
        default: null
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "settled_amount_cents + alae_cents; null unless status IN {SETTLED, CLOSED_PAID}."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement; the rescission-window baseline. Null unless status IN {SETTLED, CLOSED_PAID}."
        default: null
      - name: settlement_reference
        type: string
        source: input
        description: Release-agreement reference recorded at settlement.
        default: null
      - name: rescission_count
        type: integer
        source: system
        description: Number of times a settlement on this demand has been rescinded.
        default: 0

  - name: NegotiationRound
    parent: null
    common_fields: false
    description_note: "Append-only negotiation ledger; the standing round is superseded rather than updated, except for the claimant counter and the accept/rescind outcome flips recorded on the standing round itself."
    fields:
      - name: demand_id
        type: string
        source: input
        description: "FK -> Demand.id; the demand being negotiated."
      - name: round_index
        type: integer
        source: system
        description: "1-based round number taken from Demand.next_round_index; the sole ordering key for 'standing round'."
      - name: carrier_offer_cents
        type: integer
        source: input
        description: The carrier's offer for this round; must strictly exceed the previous round's carrier_offer_cents and must not exceed Demand.demand_amount_cents.
        constraints: "> 0"
      - name: claimant_counter_cents
        type: integer
        source: input
        description: The claimant's counter recorded against this round; null until a counter is recorded.
        default: null
      - name: gap_cents
        type: integer
        source: computed
        description: "claimant_counter_cents - carrier_offer_cents; null while claimant_counter_cents is null."
        default: null
      - name: outcome
        type: enum
        source: system
        description: "OPEN on creation; COUNTERED once a counter is recorded; SUPERSEDED when a later round is opened; ACCEPTED when the demand settles on this round; back to OPEN when that settlement is rescinded."
        default: OPEN
        constraints: "OPEN | COUNTERED | ACCEPTED | SUPERSEDED"
      - name: offered_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ClaimsAdjuster who opened the round. Not a foreign key."
      - name: offered_at
        type: datetime
        source: system
        description: Logical-clock instant the round was opened.
      - name: countered_at
        type: datetime
        source: system
        description: Logical-clock instant the counter was recorded; null while claimant_counter_cents is null.
        default: null

  - name: DisciplinaryAction
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the disciplined driver. Must equal the referenced Crash.driver_id."
      - name: crash_id
        type: string
        source: input
        description: "FK -> Crash.id; the preventable crash this action arises from."
      - name: action_type
        type: enum
        source: input
        description: "Severity of the action; its ordinal (COACHING 1, RETRAINING 2, SUSPENSION 3, TERMINATION_RECOMMENDATION 4) must be >= the ordinal of Driver.required_action_tier (NONE 0, COACHING 1, RETRAINING 2, SUSPENSION 3, TERMINATION_REVIEW 4)."
        constraints: "COACHING | RETRAINING | SUSPENSION | TERMINATION_RECOMMENDATION"
      - name: action_note
        type: string
        source: input
        description: Rationale recorded by the issuing SafetyManager.
      - name: suspension_start_at
        type: datetime
        source: input
        description: "Inclusive start of the out-of-service period; required when action_type == SUSPENSION, must be null otherwise."
        default: null
      - name: suspension_end_at
        type: datetime
        source: input
        description: "Inclusive end of the out-of-service period; required when action_type == SUSPENSION, must be > suspension_start_at."
        default: null
      - name: retraining_course_code
        type: string
        source: input
        description: "Course the driver must complete; required when action_type IN {RETRAINING, SUSPENSION}, must be null otherwise."
        default: null
      - name: retraining_status
        type: enum
        source: system
        description: "PENDING when retraining_course_code is set, otherwise NOT_REQUIRED; flips to COMPLETED via POST /disciplinary-actions/{id}/complete-retraining; reset to NOT_REQUIRED when the action is VOIDED."
        constraints: "NOT_REQUIRED | PENDING | COMPLETED"
      - name: status
        type: enum
        source: system
        description: "See state_machines.DisciplinaryAction."
        default: ISSUED
        constraints: "ISSUED | COMPLETED | VOIDED"
      - name: override_reason
        type: string
        source: input
        description: "Required to issue a SUSPENSION while the driver's Terminal.staffing_posture == CRITICAL."
        default: null
      - name: override_flag
        type: boolean
        source: system
        description: True when the action was issued under a staffing-posture override.
        default: false
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the issuing SafetyManager. Not a foreign key."
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant retraining was recorded complete; null otherwise.
        default: null

  - name: SubrogationDemand
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim whose paid loss is being pursued against a third party."
      - name: third_party_name
        type: string
        source: input
        description: Name of the at-fault third party or its insurer.
      - name: at_fault_percentage
        type: integer
        source: input
        description: Comparative-fault share attributed to the third party.
        constraints: "1-100"
      - name: basis_note
        type: string
        source: input
        description: Liability basis for the recovery claim.
      - name: status
        type: enum
        source: system
        description: "See state_machines.SubrogationDemand."
        default: DRAFT
        constraints: "DRAFT | READY_TO_PURSUE | RECOVERED | DENIED | WRITTEN_OFF"
      - name: recoverable_base_cents
        type: integer
        source: computed
        description: "Claim.indemnity_paid_cents + Claim.alae_paid_cents frozen at the instant this demand became READY_TO_PURSUE; null while DRAFT."
        default: null
      - name: max_recoverable_cents
        type: integer
        source: computed
        description: "round_half_up(recoverable_base_cents * at_fault_percentage / 100); null while DRAFT."
        default: null
      - name: recovered_amount_cents
        type: integer
        source: input
        description: "Amount actually recovered, recorded at resolution; 0 for DENIED and WRITTEN_OFF outcomes."
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Optional resolution narrative.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution; null until terminal.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Crash
    dimension: preventability_status
    initial_state: REPORTED
    terminal_states: []
    note: |
      No state is structurally terminal: PREVENTABLE and NON_PREVENTABLE are
      re-enterable through a granted appeal. Finality is enforced by
      Crash.appeals_exhausted, which the CLOSED_FINAL branch of
      ReviewCase.decide sets to true once appeal_round == APPEAL_MAX_ROUNDS.
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /review-cases"
        actor: SafetyManager
        preconditions:
          - "crash.preventability_status == REPORTED -- this holds exactly when no ReviewCase exists for the crash, so a duplicate request is answered by ERR_REVIEW_CASE_EXISTS (validations priority 50), never by ERR_CRASH_STATE_INVALID"
          - "no ReviewCase exists with crash_id == crash.id (ERR_REVIEW_CASE_EXISTS)"
          - "a DriverStatement exists with crash_id == crash.id, OR statement_waiver_reason is present"
        side_effects:
          - "creates ReviewCase in DRAFT with determination PENDING, appeal_round 0, next_vote_sequence 1"
          - "sets crash.preventability_status = UNDER_REVIEW"
          - "increments crash.version by 1 and refreshes crash.updated_at"
      - from: UNDER_REVIEW
        to: PREVENTABLE
        trigger: "POST /review-cases/{id}/decide when the selected variant of calculations.preventability_determination yields PREVENTABLE"
        actor: system
        preconditions:
          - "the crash's ReviewCase transitions DELIBERATION -> DECIDED or DELIBERATION -> CLOSED_FINAL in the same request"
        side_effects:
          - "CASCADE A link 2: sets crash.preventability_status = PREVENTABLE"
          - "because crash.preventability_status changed, recomputes calculations.driver_preventable_points for crash.driver_id (CASCADE A link 3)"
          - "because crash.preventability_status changed, recomputes Claim.litigation_risk_score / litigation_risk_multiplier / counsel_required for the Claim with claim.crash_id == crash.id, when one exists"
          - "increments crash.version by 1"
      - from: UNDER_REVIEW
        to: NON_PREVENTABLE
        trigger: "POST /review-cases/{id}/decide when the selected variant yields NON_PREVENTABLE"
        actor: system
        preconditions:
          - "the crash's ReviewCase transitions DELIBERATION -> DECIDED or DELIBERATION -> CLOSED_FINAL in the same request"
        side_effects:
          - "sets crash.preventability_status = NON_PREVENTABLE"
          - "recomputes calculations.driver_preventable_points for crash.driver_id (the crash contributes 0 points)"
          - "recomputes Claim.litigation_risk_score for the Claim with claim.crash_id == crash.id, when one exists"
          - "increments crash.version by 1"
      - from: PREVENTABLE
        to: UNDER_REVIEW
        trigger: "POST /review-cases/{id}/appeal (appeal granted)"
        actor: SafetyManager
        preconditions:
          - "crash.appeals_exhausted == false"
          - "the crash's ReviewCase is in DECIDED"
        side_effects:
          - "COMPENSATION: sets crash.preventability_status = UNDER_REVIEW"
          - "because crash.preventability_status left PREVENTABLE, recomputes calculations.driver_preventable_points for crash.driver_id from scratch, restoring the pre-decision value exactly"
          - "because the recomputed Driver.required_action_tier is now below SUSPENSION and no non-VOIDED SUSPENSION DisciplinaryAction remains, sets Driver.status back to ACTIVE when it was SUSPENDED_PENDING_ACTION"
          - "voids every DisciplinaryAction with crash_id == crash.id and status == ISSUED (status -> VOIDED, retraining_status -> NOT_REQUIRED)"
          - "recomputes Claim.litigation_risk_score for the Claim with claim.crash_id == crash.id, when one exists"
          - "increments crash.version by 1"
      - from: NON_PREVENTABLE
        to: UNDER_REVIEW
        trigger: "POST /review-cases/{id}/appeal (appeal granted)"
        actor: SafetyManager
        preconditions:
          - "crash.appeals_exhausted == false"
          - "the crash's ReviewCase is in DECIDED"
        side_effects:
          - "sets crash.preventability_status = UNDER_REVIEW"
          - "recomputes calculations.driver_preventable_points for crash.driver_id (no change, the crash contributed 0)"
          - "increments crash.version by 1"

  - entity: Crash
    dimension: reporting_status
    initial_state: PENDING_FILING
    terminal_states: [NOT_REQUIRED, FILED, LATE_FILED]
    note: |
      Set at intake by calculations.crash_recordability: PENDING_FILING when
      dot_recordable is true, NOT_REQUIRED otherwise. This dimension evolves
      independently of preventability_status.
    transitions:
      - from: PENDING_FILING
        to: FILED
        trigger: "POST /crashes/{id}/regulatory-report when current_utc <= crash.report_due_at"
        actor: SafetyManager
        preconditions:
          - "crash.dot_recordable == true"
          - "crash.reporting_status == PENDING_FILING"
          - "current_utc <= crash.report_due_at (inclusive at the exact due instant)"
        side_effects:
          - "sets crash.reporting_status = FILED, crash.filing_reference, crash.filed_at = current_utc"
          - "increments crash.version by 1"
      - from: PENDING_FILING
        to: LATE_FILED
        trigger: "POST /crashes/{id}/regulatory-report when current_utc > crash.report_due_at"
        actor: SafetyManager
        preconditions:
          - "crash.dot_recordable == true"
          - "crash.reporting_status == PENDING_FILING"
        side_effects:
          - "sets crash.reporting_status = LATE_FILED, crash.filing_reference, crash.filed_at = current_utc"
          - "because crash.reporting_status became LATE_FILED, Terminal.late_filing_count for crash.terminal_id increases by 1 on next read"
          - "increments crash.version by 1"

  - entity: EvidenceItem
    dimension: preservation_state
    initial_state: REQUESTED
    terminal_states: [PURGED_BEFORE_HOLD, RELEASED]
    transitions:
      - from: REQUESTED
        to: PRESERVED
        trigger: "POST /evidence-items/{id}/preserve"
        actor: Dispatcher
        preconditions:
          - "evidence_item.preservation_state == REQUESTED"
          - "current_utc <= evidence_item.retention_deadline_at"
        side_effects:
          - "sets preservation_state = PRESERVED, preserved_copy_uri, evidence_hash, preserved_at = current_utc"
          - "recomputes calculations.crash_evidence_posture for evidence_item.crash_id"
          - "increments evidence_item.version by 1"
      - from: REQUESTED
        to: PURGED_BEFORE_HOLD
        trigger: "POST /evidence-items/{id}/purge on an item that was never preserved (spoliation)"
        actor: SafetyAdmin
        preconditions:
          - "evidence_item.preservation_state == REQUESTED"
        side_effects:
          - "sets preservation_state = PURGED_BEFORE_HOLD, purge_reason"
          - "because a PURGED_BEFORE_HOLD item now exists, Crash.evidence_posture for crash_id becomes COMPROMISED (COMPROMISED outranks COMPLETE)"
          - "because Crash.evidence_posture changed, recomputes Claim.litigation_risk_score / litigation_risk_multiplier / counsel_required for the Claim with claim.crash_id == crash_id, when one exists"
          - "increments evidence_item.version by 1"
        note: "Same trigger as the RELEASED branch below; the target state and the side-effect set diverge on whether the item was preserved."
      - from: PRESERVED
        to: RELEASED
        trigger: "POST /evidence-items/{id}/purge on a preserved item after the litigation hold has lifted"
        actor: SafetyAdmin
        preconditions:
          - "evidence_item.preservation_state == PRESERVED"
          - "either no Claim exists with claim.crash_id == evidence_item.crash_id, or that Claim.handling_status == CLOSED"
        side_effects:
          - "sets preservation_state = RELEASED, purge_reason"
          - "recomputes calculations.crash_evidence_posture for crash_id (a RELEASED item no longer satisfies a required kind, so posture may fall back to PARTIAL)"
          - "increments evidence_item.version by 1"

  - entity: ReviewCase
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED_FINAL]
    note: "Cyclic: DECIDED -> DELIBERATION via a granted appeal, then DELIBERATION -> CLOSED_FINAL on the post-appeal decision."
    transitions:
      - from: DRAFT
        to: DELIBERATION
        trigger: "POST /review-cases/{id}/open-deliberation"
        actor: SafetyManager
        preconditions:
          - "review_case.status == DRAFT"
          - "at least one EvidenceItem with crash_id == review_case.crash_id has preservation_state == PRESERVED"
        side_effects:
          - "sets review_case.status = DELIBERATION"
          - "increments review_case.version by 1"
      - from: DELIBERATION
        to: DELIBERATION
        trigger: "POST /review-cases/{id}/votes"
        actor: CommitteeMember
        preconditions:
          - "review_case.status == DELIBERATION"
          - "expected_review_case_version == review_case.version (see concurrency_rules.vote-cast-stale-review-case)"
          - "criterion_scores present with all five keys when vote != ABSTAIN; absent when vote == ABSTAIN"
        side_effects:
          - "creates a CommitteeVote with sequence_number = review_case.next_vote_sequence, member_user_id = X-User-ID, weighted_member_score per calculations.preventability_determination step 1"
          - "marks every earlier CommitteeVote on this case from the same member_user_id as superseded"
          - "increments review_case.next_vote_sequence by 1"
          - "increments review_case.version by 1"
        note: "Self-loop: the case stays in DELIBERATION while ballots accumulate."
      - from: DELIBERATION
        to: DECIDED
        trigger: "POST /review-cases/{id}/decide when review_case.appeal_round < APPEAL_MAX_ROUNDS"
        actor: SafetyManager
        preconditions:
          - "review_case.status == DELIBERATION"
          - "X-User-ID is not the member_user_id of any non-superseded CommitteeVote on this case (segregation of duties)"
          - "Crash.evidence_posture for review_case.crash_id IN {COMPLETE, COMPROMISED}"
          - "active_vote_count >= COMMITTEE_QUORUM_MIN (3) counting only non-superseded, non-ABSTAIN ballots"
        side_effects:
          - "CASCADE A link 1: sets review_case.status = DECIDED, determination, decision_basis, committee_score, decided_by_user_id = X-User-ID, decided_at = current_utc"
          - "CASCADE A link 2: because the case is now DECIDED with a determination, Crash.preventability_status moves UNDER_REVIEW -> PREVENTABLE or -> NON_PREVENTABLE"
          - "increments review_case.version by 1"
      - from: DELIBERATION
        to: CLOSED_FINAL
        trigger: "POST /review-cases/{id}/decide when review_case.appeal_round >= APPEAL_MAX_ROUNDS"
        actor: SafetyManager
        preconditions:
          - "same four preconditions as the DECIDED branch"
        side_effects:
          - "sets review_case.status = CLOSED_FINAL plus the same determination / decision_basis / committee_score / decided_by_user_id / decided_at fields"
          - "moves Crash.preventability_status UNDER_REVIEW -> PREVENTABLE or -> NON_PREVENTABLE exactly as the DECIDED branch does"
          - "additionally sets Crash.appeals_exhausted = true, permanently blocking further appeals"
          - "increments review_case.version by 1"
        note: "Branch divergence: identical trigger and preconditions, different target state and a strictly larger side-effect set, selected by appeal_round."
      - from: DECIDED
        to: DELIBERATION
        trigger: "POST /review-cases/{id}/appeal"
        actor: SafetyManager
        preconditions:
          - "review_case.status == DECIDED"
          - "review_case.appeal_round < APPEAL_MAX_ROUNDS (1)"
          - "current_utc <= review_case.decided_at + APPEAL_WINDOW_DAYS (14 days)"
          - "X-User-ID != review_case.decided_by_user_id (segregation of duties)"
          - "when grounds_code == NEW_EVIDENCE: appeal_evidence_item_id is present, that EvidenceItem exists, its crash_id == review_case.crash_id, and its preservation_state == PRESERVED"
        side_effects:
          - "sets review_case.status = DELIBERATION, appeal_round += 1, appeal_grounds, appeal_grounds_code, appeal_evidence_item_id"
          - "resets review_case.determination = PENDING, decision_basis = NOT_APPLICABLE, committee_score = null, decided_by_user_id = null, decided_at = null"
          - "COMPENSATION: moves Crash.preventability_status back to UNDER_REVIEW and unwinds every consequence of the vacated determination (driver points, driver status, terminal counters, disciplinary actions) per the Crash PREVENTABLE -> UNDER_REVIEW transition"
          - "existing CommitteeVote rows are retained and remain non-superseded, so the pre-appeal tally still counts toward quorum unless a member re-ballots"
          - "increments review_case.version by 1"

  - entity: Claim
    dimension: handling_status
    initial_state: SETUP
    terminal_states: [CLOSED]
    note: |
      Parallel dimension 1 of 2 on Claim. handling_status is driven by the child
      Demand population; reserve_status is driven by reserve revisions and close.
      A reserve revision moves reserve_status without touching handling_status,
      and a demand creation moves handling_status without touching reserve_status.
    transitions:
      - from: SETUP
        to: NEGOTIATION
        trigger: "POST /claims/{id}/demands (first demand on the claim)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.handling_status == SETUP"
        side_effects:
          - "creates a Demand in DEMANDED with next_round_index 1"
          - "sets claim.handling_status = NEGOTIATION"
          - "increments claim.version by 1"
      - from: NEGOTIATION
        to: NEGOTIATION
        trigger: "POST /claims/{id}/demands (additional demand)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.handling_status == NEGOTIATION"
        side_effects:
          - "creates another Demand in DEMANDED"
          - "increments claim.version by 1"
        note: "Self-loop: additional demands accumulate without leaving NEGOTIATION."
      - from: NEGOTIATION
        to: NEGOTIATION
        trigger: "POST /demands/{id}/settle while at least one sibling Demand of the claim is still in {DEMANDED, OFFER_OUTSTANDING, COUNTER_OUTSTANDING}"
        actor: system
        preconditions:
          - "the settling Demand's claim_id == claim.id"
        side_effects:
          - "moves the settled indemnity into claim.indemnity_paid_cents and the ALAE into claim.alae_paid_cents"
          - "reduces claim.outstanding_reserve_cents by exactly settlement_total_cents (never floored -- validation priority 72 has already guaranteed the reserve covers it), leaving claim.claim_exposure_cents unchanged"
          - "merges the waterfall result into claim.layer_allocations and increases claim.sir_eroded_cents / claim.insured_paid_cents"
          - "increments claim.version by 1"
        note: "Conditional cascade: the parent dimension stays in NEGOTIATION because a sibling demand is still open."
      - from: NEGOTIATION
        to: SETTLEMENT_COMPLETE
        trigger: "POST /demands/{id}/settle when every sibling Demand of the claim already has status IN {SETTLED, CLOSED_PAID}"
        actor: system
        preconditions:
          - "the settling Demand's claim_id == claim.id"
        side_effects:
          - "CASCADE B link 2: sets claim.handling_status = SETTLEMENT_COMPLETE"
          - "applies the same paid/reserve/waterfall side effects as the NEGOTIATION self-loop branch"
          - "CASCADE B link 3: because claim.handling_status became SETTLEMENT_COMPLETE, every SubrogationDemand with claim_id == claim.id and status == DRAFT moves DRAFT -> READY_TO_PURSUE and freezes recoverable_base_cents / max_recoverable_cents"
          - "increments claim.version by 1"
        note: "Bubble-up: the same trigger reaches NEGOTIATION or SETTLEMENT_COMPLETE depending on the aggregate state of the sibling Demands, and only the SETTLEMENT_COMPLETE branch carries the subrogation cascade."
      - from: SETTLEMENT_COMPLETE
        to: NEGOTIATION
        trigger: "POST /demands/{id}/rescind-settlement"
        actor: ClaimsManager
        preconditions:
          - "the rescinded Demand's claim_id == claim.id"
          - "current_utc <= demand.settled_at + RESCISSION_WINDOW_HOURS (168 hours)"
        side_effects:
          - "COMPENSATION: sets claim.handling_status = NEGOTIATION"
          - "returns the rescinded indemnity and ALAE from claim.indemnity_paid_cents / claim.alae_paid_cents to claim.outstanding_reserve_cents, leaving claim.claim_exposure_cents unchanged"
          - "subtracts the rescinded demand's allocations from claim.layer_allocations, claim.sir_eroded_cents and claim.insured_paid_cents, restoring the consumed capacity of every touched PolicyLayer"
          - "COMPENSATION: every SubrogationDemand with claim_id == claim.id and status == READY_TO_PURSUE moves back to DRAFT with recoverable_base_cents and max_recoverable_cents reset to null"
          - "increments claim.version by 1"
      - from: SETTLEMENT_COMPLETE
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: ClaimsManager
        preconditions:
          - "every Demand with claim_id == claim.id has status IN {SETTLED, CLOSED_PAID}"
          - "every SubrogationDemand with claim_id == claim.id has status IN {RECOVERED, DENIED, WRITTEN_OFF}"
        side_effects:
          - "sets claim.handling_status = CLOSED and claim.closed_at = current_utc"
          - "sets claim.reserve_status = FINAL and moves the residual claim.outstanding_reserve_cents into claim.reserve_released_cents, so outstanding_reserve_cents becomes 0 while invariants.claim_exposure_conserved still holds"
          - "moves every Demand with claim_id == claim.id from SETTLED to CLOSED_PAID"
          - "because the claim is CLOSED, every PRESERVED EvidenceItem on claim.crash_id becomes eligible for the PRESERVED -> RELEASED transition"
          - "increments claim.version by 1"
      - from: SETUP
        to: CLOSED
        trigger: "POST /claims/{id}/close on a claim that never received a demand"
        actor: ClaimsManager
        preconditions:
          - "no Demand exists with claim_id == claim.id"
          - "every SubrogationDemand with claim_id == claim.id has status IN {RECOVERED, DENIED, WRITTEN_OFF}"
        side_effects:
          - "sets claim.handling_status = CLOSED, claim.closed_at = current_utc, claim.reserve_status = FINAL"
          - "moves the whole claim.outstanding_reserve_cents into claim.reserve_released_cents"
          - "increments claim.version by 1"

  - entity: Claim
    dimension: reserve_status
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    note: "Parallel dimension 2 of 2 on Claim; advances only on reserve revisions and on close."
    transitions:
      - from: PROVISIONAL
        to: REVISED
        trigger: "POST /claims/{id}/reserve-revisions (first revision, either basis)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.handling_status != CLOSED"
          - "expected_claim_version == claim.version (see concurrency_rules.reserve-revision-stale-claim)"
          - "when basis == DEMAND_BASED: at least one Demand exists with claim_id == claim.id"
        side_effects:
          - "sets claim.reserve_status = REVISED"
          - "sets claim.revised_reserve_cents to the output of the calculations.claim_reserve variant selected by basis (PROVISIONAL_REFRESH -> provisional_at_setup, DEMAND_BASED -> demand_weighted)"
          - "sets claim.outstanding_reserve_cents = claim.revised_reserve_cents - claim.indemnity_paid_cents - claim.alae_paid_cents (floored at 0), which is the only operation that changes claim.claim_exposure_cents"
          - "increments claim.version by 1"
      - from: REVISED
        to: REVISED
        trigger: "POST /claims/{id}/reserve-revisions (subsequent revision, either basis)"
        actor: ClaimsAdjuster
        preconditions:
          - "same preconditions as PROVISIONAL -> REVISED"
        side_effects:
          - "re-runs the selected variant and overwrites claim.revised_reserve_cents and claim.outstanding_reserve_cents"
          - "increments claim.version by 1"
        note: "Self-loop: the reserve can be re-estimated any number of times before close."
      - from: REVISED
        to: FINAL
        trigger: "POST /claims/{id}/close"
        actor: ClaimsManager
        preconditions:
          - "the claim's handling_status transition to CLOSED succeeds in the same request"
        side_effects:
          - "sets claim.reserve_status = FINAL and releases the residual outstanding reserve"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /claims/{id}/close on a claim that was never revised"
        actor: ClaimsManager
        preconditions:
          - "the claim's handling_status transition to CLOSED succeeds in the same request"
        side_effects:
          - "sets claim.reserve_status = FINAL and releases the whole outstanding reserve"

  - entity: Demand
    dimension: status
    initial_state: DEMANDED
    terminal_states: [CLOSED_PAID]
    note: "Cyclic: OFFER_OUTSTANDING <-> COUNTER_OUTSTANDING while the parties trade positions, and SETTLED -> OFFER_OUTSTANDING when a settlement is rescinded inside the rescission window."
    transitions:
      - from: DEMANDED
        to: OFFER_OUTSTANDING
        trigger: "POST /demands/{id}/offers"
        actor: ClaimsAdjuster
        preconditions:
          - "demand.status == DEMANDED"
          - "carrier_offer_cents <= demand.demand_amount_cents"
          - "when demand.claimant_type == THIRD_PARTY_BODILY_INJURY and the parent Claim.counsel_required is true: Claim.counsel_assigned must be true"
        side_effects:
          - "creates a NegotiationRound with round_index = demand.next_round_index, outcome OPEN, offered_by_user_id = X-User-ID, offered_at = current_utc"
          - "increments demand.next_round_index by 1 and sets demand.status = OFFER_OUTSTANDING"
          - "increments demand.version by 1"
      - from: OFFER_OUTSTANDING
        to: COUNTER_OUTSTANDING
        trigger: "POST /demands/{id}/counters"
        actor: ClaimsAdjuster
        preconditions:
          - "demand.status == OFFER_OUTSTANDING"
          - "the standing NegotiationRound (highest round_index) has outcome == OPEN"
          - "claimant_counter_cents > the standing round's carrier_offer_cents"
          - "claimant_counter_cents <= the previous round's claimant_counter_cents when one exists (claimant positions may not increase)"
        side_effects:
          - "records claimant_counter_cents, gap_cents and countered_at on the standing NegotiationRound and flips its outcome to COUNTERED"
          - "sets demand.status = COUNTER_OUTSTANDING"
          - "increments demand.version by 1"
      - from: COUNTER_OUTSTANDING
        to: OFFER_OUTSTANDING
        trigger: "POST /demands/{id}/offers"
        actor: ClaimsAdjuster
        preconditions:
          - "demand.status == COUNTER_OUTSTANDING"
          - "carrier_offer_cents > the standing round's carrier_offer_cents (carrier positions may not decrease or repeat)"
          - "carrier_offer_cents <= demand.demand_amount_cents"
          - "when demand.claimant_type == THIRD_PARTY_BODILY_INJURY and the parent Claim.counsel_required is true: Claim.counsel_assigned must be true"
        side_effects:
          - "flips the previous standing NegotiationRound's outcome to SUPERSEDED"
          - "creates a new NegotiationRound with round_index = demand.next_round_index and outcome OPEN"
          - "increments demand.next_round_index by 1 and sets demand.status = OFFER_OUTSTANDING"
          - "increments demand.version by 1"
        note: "Loop back into OFFER_OUTSTANDING; the loop is bounded only by the monotonic-position validations, which force convergence."
      - from: OFFER_OUTSTANDING
        to: SETTLED
        trigger: "POST /demands/{id}/settle"
        actor: ClaimsManager
        preconditions:
          - "demand.status == OFFER_OUTSTANDING (the claimant accepts the standing carrier offer; settling from COUNTER_OUTSTANDING is not a legal transition)"
          - "the parent Claim.handling_status != CLOSED"
          - "the PolicyLayer tower for the Crash's program year has enough remaining capacity for settlement_total_cents (ERR_COVERAGE_EXHAUSTED otherwise)"
          - "claim.outstanding_reserve_cents >= settlement_total_cents (ERR_RESERVE_INSUFFICIENT otherwise) -- money must be reserved before it is paid"
        side_effects:
          - "CASCADE B link 1: sets demand.settled_amount_cents = the standing round's carrier_offer_cents, demand.alae_cents and demand.settlement_total_cents per calculations.settlement_layer_waterfall, demand.settled_at = current_utc, demand.status = SETTLED"
          - "flips the standing NegotiationRound's outcome to ACCEPTED"
          - "CASCADE B link 2: drives the parent Claim's handling_status dimension to NEGOTIATION (self-loop) or SETTLEMENT_COMPLETE, moving money from outstanding reserve into the paid buckets and consuming PolicyLayer capacity"
          - "CASCADE B link 3: on the SETTLEMENT_COMPLETE branch only, moves every DRAFT SubrogationDemand of the claim to READY_TO_PURSUE"
          - "increments demand.version by 1"
      - from: SETTLED
        to: OFFER_OUTSTANDING
        trigger: "POST /demands/{id}/rescind-settlement"
        actor: ClaimsManager
        preconditions:
          - "demand.status == SETTLED"
          - "current_utc <= demand.settled_at + RESCISSION_WINDOW_HOURS (168 hours)"
          - "the parent Claim.handling_status != CLOSED"
        side_effects:
          - "COMPENSATION: clears demand.settled_amount_cents, alae_cents, settlement_total_cents, settled_at and settlement_reference back to null; sets demand.status = OFFER_OUTSTANDING"
          - "increments demand.rescission_count by 1"
          - "flips the accepted NegotiationRound's outcome back to OPEN, so the same offer stands again"
          - "unwinds the parent Claim's paid buckets, layer allocations and reserve, and returns every READY_TO_PURSUE SubrogationDemand of the claim to DRAFT"
          - "increments demand.version by 1"
      - from: SETTLED
        to: CLOSED_PAID
        trigger: "POST /claims/{id}/close"
        actor: ClaimsManager
        preconditions:
          - "the parent Claim's handling_status transition to CLOSED succeeds in the same request"
        side_effects:
          - "sets demand.status = CLOSED_PAID, freezing the settlement beyond the reach of rescission"
          - "increments demand.version by 1"

  - entity: NegotiationRound
    dimension: outcome
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    note: "Ledger rows are append-only; only this outcome flag moves, and it is driven entirely by transitions on the parent Demand."
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /demands/{id}/counters"
        actor: ClaimsAdjuster
        preconditions:
          - "this round is the standing round (highest round_index) of the demand"
        side_effects:
          - "records claimant_counter_cents, gap_cents, countered_at on this row"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /demands/{id}/offers on a demand whose standing round is still OPEN is not permitted; the transition fires when a later round is opened from COUNTER_OUTSTANDING"
        actor: system
        preconditions:
          - "a new NegotiationRound with a greater round_index is created for the same demand"
        side_effects:
          - "this row stops being the standing round and is excluded from every 'standing offer' lookup"
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "POST /demands/{id}/offers (next round opened)"
        actor: system
        preconditions:
          - "a new NegotiationRound with a greater round_index is created for the same demand"
        side_effects:
          - "this row stops being the standing round"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /demands/{id}/settle"
        actor: ClaimsManager
        preconditions:
          - "this round is the standing round and demand.status == OFFER_OUTSTANDING"
        side_effects:
          - "this row's carrier_offer_cents becomes Demand.settled_amount_cents"
      - from: ACCEPTED
        to: OPEN
        trigger: "POST /demands/{id}/rescind-settlement"
        actor: ClaimsManager
        preconditions:
          - "this row is the accepted round of the demand"
        side_effects:
          - "COMPENSATION: the offer becomes standing again and may be re-accepted or superseded by a higher offer"

  - entity: Driver
    dimension: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Cyclic: ACTIVE -> RETRAINING_REQUIRED -> ACTIVE and ACTIVE -> SUSPENDED_PENDING_ACTION -> ACTIVE. Every non-terminal state can reach TERMINATED."
    transitions:
      - from: ACTIVE
        to: RETRAINING_REQUIRED
        trigger: "POST /disciplinary-actions with action_type == RETRAINING"
        actor: SafetyManager
        preconditions:
          - "driver.status == ACTIVE"
          - "the referenced Crash.preventability_status == PREVENTABLE and Crash.driver_id == driver.id"
          - "ordinal(action_type) >= ordinal(driver.required_action_tier)"
        side_effects:
          - "creates the DisciplinaryAction in ISSUED with retraining_status PENDING"
          - "sets driver.status = RETRAINING_REQUIRED"
          - "increments driver.version by 1"
      - from: ACTIVE
        to: SUSPENDED_PENDING_ACTION
        trigger: "POST /disciplinary-actions with action_type == SUSPENSION"
        actor: SafetyManager
        preconditions:
          - "driver.status == ACTIVE"
          - "the referenced Crash.preventability_status == PREVENTABLE and Crash.driver_id == driver.id"
          - "ordinal(action_type) >= ordinal(driver.required_action_tier)"
          - "the requested [suspension_start_at, suspension_end_at] window does not overlap the window of any non-VOIDED SUSPENSION DisciplinaryAction of the same driver, including the mandatory SUSPENSION_BUFFER_HOURS separation"
          - "when the driver's Terminal.staffing_posture == CRITICAL, override_reason must be present"
        side_effects:
          - "creates the DisciplinaryAction in ISSUED with retraining_status PENDING and override_flag set when override_reason was supplied"
          - "sets driver.status = SUSPENDED_PENDING_ACTION"
          - "because driver.status became SUSPENDED_PENDING_ACTION, Terminal.suspended_driver_count for driver.terminal_id increases by 1 on next read while active_driver_count is unchanged (a suspended driver is still non-TERMINATED and therefore still counted as active, per §1.1), which can move Terminal.staffing_posture"
          - "increments driver.version by 1"
      - from: SUSPENDED_PENDING_ACTION
        to: SUSPENDED_PENDING_ACTION
        trigger: "POST /disciplinary-actions with action_type == SUSPENSION on a driver who is already SUSPENDED_PENDING_ACTION"
        actor: SafetyManager
        preconditions:
          - "driver.status != TERMINATED (a TERMINATED driver takes no further action: ERR_DRIVER_STATE_INVALID)"
          - "the referenced Crash.preventability_status == PREVENTABLE and Crash.driver_id == driver.id"
          - "ordinal(action_type) >= ordinal(driver.required_action_tier)"
          - "the requested [suspension_start_at, suspension_end_at) window does not overlap the window of any non-VOIDED SUSPENSION DisciplinaryAction of the same driver, and is separated from each of them by at least SUSPENSION_BUFFER_HOURS"
          - "when the driver's Terminal.staffing_posture == CRITICAL, override_reason must be present"
        side_effects:
          - "creates the additional DisciplinaryAction in ISSUED with retraining_status PENDING"
          - "driver.status stays SUSPENDED_PENDING_ACTION, so Terminal.active_driver_count / suspended_driver_count are unchanged (a driver is counted as suspended once, not once per action)"
          - "increments driver.version by 1"
        note: "Self-loop: consecutive out-of-service periods stack on the same driver. This is the transition that makes the SUSPENSION_BUFFER_HOURS separation rule reachable, since the second window is checked against the first."
      - from: RETRAINING_REQUIRED
        to: ACTIVE
        trigger: "POST /disciplinary-actions/{id}/complete-retraining"
        actor: SafetyAdmin
        preconditions:
          - "the action's status == ISSUED and retraining_status == PENDING"
          - "no other DisciplinaryAction of this driver has status == ISSUED with retraining_status == PENDING"
        side_effects:
          - "sets the DisciplinaryAction status = COMPLETED, retraining_status = COMPLETED, completed_at = current_utc"
          - "sets driver.status = ACTIVE"
          - "increments driver.version by 1"
      - from: SUSPENDED_PENDING_ACTION
        to: ACTIVE
        trigger: "POST /disciplinary-actions/{id}/complete-retraining"
        actor: SafetyAdmin
        preconditions:
          - "the action's status == ISSUED and retraining_status == PENDING"
          - "current_utc > the action's suspension_end_at (the out-of-service period must have elapsed)"
          - "no other DisciplinaryAction of this driver has status == ISSUED with retraining_status == PENDING"
        side_effects:
          - "sets the DisciplinaryAction status = COMPLETED, retraining_status = COMPLETED, completed_at = current_utc"
          - "sets driver.status = ACTIVE"
          - "Terminal.suspended_driver_count for driver.terminal_id decreases by 1 on next read (active_driver_count never moved), restoring Terminal.staffing_posture"
          - "increments driver.version by 1"
        note: "Same trigger as the RETRAINING_REQUIRED -> ACTIVE transition but with an extra temporal precondition, because reinstating a suspended driver early is not permitted."
      - from: SUSPENDED_PENDING_ACTION
        to: ACTIVE
        trigger: "POST /review-cases/{id}/appeal (appeal granted, vacating the underlying PREVENTABLE determination)"
        actor: SafetyManager
        preconditions:
          - "every DisciplinaryAction of this driver arising from the appealed crash is voided in the same request"
          - "no non-VOIDED DisciplinaryAction of this driver still requires suspension or retraining"
        side_effects:
          - "COMPENSATION: sets driver.status = ACTIVE and leaves driver.preventable_points at exactly its pre-decision value"
          - "COMPENSATION: Terminal.suspended_driver_count returns to its pre-discipline value on next read; active_driver_count was never affected"
          - "increments driver.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /drivers/{id}/employment-decision with decision == SEPARATE"
        actor: SafetyManager
        preconditions:
          - "driver.status != TERMINATED"
          - "driver.required_action_tier == TERMINATION_REVIEW"
        side_effects:
          - "sets driver.continued_employment_decision = SEPARATE, decision_note, driver.status = TERMINATED"
          - "Terminal.active_driver_count for driver.terminal_id decreases by 1 on next read"
          - "increments driver.version by 1"
      - from: SUSPENDED_PENDING_ACTION
        to: TERMINATED
        trigger: "POST /drivers/{id}/employment-decision with decision == SEPARATE"
        actor: SafetyManager
        preconditions:
          - "driver.required_action_tier == TERMINATION_REVIEW"
        side_effects:
          - "sets driver.continued_employment_decision = SEPARATE, decision_note, driver.status = TERMINATED"
          - "Terminal.suspended_driver_count AND Terminal.active_driver_count both decrease by 1 on next read, because a TERMINATED driver leaves both counts"
          - "increments driver.version by 1"
      - from: RETRAINING_REQUIRED
        to: TERMINATED
        trigger: "POST /drivers/{id}/employment-decision with decision == SEPARATE"
        actor: SafetyManager
        preconditions:
          - "driver.required_action_tier == TERMINATION_REVIEW"
        side_effects:
          - "sets driver.continued_employment_decision = SEPARATE, decision_note, driver.status = TERMINATED"
          - "increments driver.version by 1"

  - entity: DisciplinaryAction
    dimension: status
    initial_state: ISSUED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /disciplinary-actions/{id}/complete-retraining"
        actor: SafetyAdmin
        preconditions:
          - "action.status == ISSUED"
          - "action.retraining_status == PENDING (a COACHING or TERMINATION_RECOMMENDATION action carries NOT_REQUIRED and can never complete this way)"
          - "when action.action_type == SUSPENSION: current_utc > action.suspension_end_at"
        side_effects:
          - "sets action.status = COMPLETED, action.retraining_status = COMPLETED, action.completed_at = current_utc"
          - "drives the Driver back to ACTIVE when no other pending action remains"
          - "increments action.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /review-cases/{id}/appeal (appeal granted on the action's crash)"
        actor: SafetyManager
        preconditions:
          - "action.crash_id == the appealed ReviewCase.crash_id"
          - "action.status == ISSUED"
        side_effects:
          - "COMPENSATION: sets action.status = VOIDED and action.retraining_status = NOT_REQUIRED"
          - "releases the action's suspension window, so a later SUSPENSION may reuse the same interval"
          - "increments action.version by 1"
        note: "Only ISSUED actions are voided; an already COMPLETED action is left untouched by the appeal (conditional cascade)."

  - entity: SubrogationDemand
    dimension: status
    initial_state: DRAFT
    terminal_states: [RECOVERED, DENIED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: READY_TO_PURSUE
        trigger: "POST /demands/{id}/settle whose parent Claim reaches SETTLEMENT_COMPLETE"
        actor: system
        preconditions:
          - "subrogation_demand.claim_id == the settling Demand's claim_id"
          - "subrogation_demand.status == DRAFT"
        side_effects:
          - "CASCADE B link 3: sets status = READY_TO_PURSUE and freezes recoverable_base_cents = Claim.indemnity_paid_cents + Claim.alae_paid_cents"
          - "sets max_recoverable_cents = round_half_up(recoverable_base_cents * at_fault_percentage / 100)"
          - "increments subrogation_demand.version by 1"
      - from: READY_TO_PURSUE
        to: DRAFT
        trigger: "POST /demands/{id}/rescind-settlement on the claim"
        actor: ClaimsManager
        preconditions:
          - "subrogation_demand.status == READY_TO_PURSUE"
        side_effects:
          - "COMPENSATION: sets status = DRAFT and resets recoverable_base_cents and max_recoverable_cents to null"
          - "increments subrogation_demand.version by 1"
      - from: READY_TO_PURSUE
        to: RECOVERED
        trigger: "POST /subrogation-demands/{id}/resolve with resolution == RECOVERED"
        actor: ClaimsManager
        preconditions:
          - "subrogation_demand.status == READY_TO_PURSUE"
          - "recovered_amount_cents is present, > 0 and <= max_recoverable_cents"
        side_effects:
          - "sets status = RECOVERED, recovered_amount_cents, resolution_note, resolved_at = current_utc"
          - "increases Claim.subrogation_recovered_cents by recovered_amount_cents, which lowers Claim.total_incurred_cents by the same amount without touching Claim.claim_exposure_cents"
          - "increments subrogation_demand.version by 1"
      - from: READY_TO_PURSUE
        to: DENIED
        trigger: "POST /subrogation-demands/{id}/resolve with resolution == DENIED"
        actor: ClaimsManager
        preconditions:
          - "subrogation_demand.status == READY_TO_PURSUE"
          - "recovered_amount_cents must be absent"
        side_effects:
          - "sets status = DENIED, resolution_note, resolved_at = current_utc; Claim.subrogation_recovered_cents is unchanged"
          - "increments subrogation_demand.version by 1"
      - from: READY_TO_PURSUE
        to: WRITTEN_OFF
        trigger: "POST /subrogation-demands/{id}/resolve with resolution == WRITTEN_OFF"
        actor: ClaimsManager
        preconditions:
          - "subrogation_demand.status == READY_TO_PURSUE"
          - "recovered_amount_cents must be absent"
        side_effects:
          - "sets status = WRITTEN_OFF, resolution_note, resolved_at = current_utc"
          - "increments subrogation_demand.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# ---------------------------------------------------------------------------
# The ONLY sanctioned write-write conflict mechanism in this domain. Every
# contended write below carries an `expected_<parent>_version` input that must
# equal the parent's current `version`; a mismatch is refused with the rule's
# error_id and 412, and no side effect is applied. Requests are processed one at
# a time in arrival order; a refused request leaves the parent untouched, so the
# caller must re-read the parent and retry with the fresh version.
concurrency_rules:
  - rule_id: reserve-revision-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/reserve-revisions"
    occ_field: expected_claim_version
    version_source: "Claim.version, as returned by POST /claims, GET /claims/{id} or any prior successful write on the claim"
    error_id: ERR_CLAIM_VERSION_STALE
    status: 412
    rationale: |
      Reserve revisions are absolute overwrites of revised_reserve_cents and
      outstanding_reserve_cents, not deltas. Two adjusters working the same file
      from stale reads would silently discard each other's estimate, so the
      second writer must observe the first writer's version bump and re-read.
      Note that a settlement, a rescission, a counsel assignment and every
      cascade that touches the claim also bump Claim.version, so a revision
      prepared before any of those becomes stale as well.
    on_success: "Claim.version increments by 1; the response body carries the new version."
    on_conflict: "ERR_CLAIM_VERSION_STALE (412); revised_reserve_cents, outstanding_reserve_cents, reserve_status and version are all unchanged."

  - rule_id: vote-cast-stale-review-case
    parent_entity: ReviewCase
    write_endpoint: "POST /review-cases/{id}/votes"
    occ_field: expected_review_case_version
    version_source: "ReviewCase.version, as returned by POST /review-cases/{id}/open-deliberation, GET /review-cases/{id} or the previous accepted ballot"
    error_id: ERR_REVIEW_CASE_VERSION_STALE
    status: 412
    rationale: |
      A ballot mints sequence_number from ReviewCase.next_vote_sequence and can
      supersede an earlier ballot from the same member. A member who read the
      case before another member's ballot landed would be voting on a tally he
      never saw, so each ballot must quote the version it was prepared against.
      This makes the quorum tally reproducible from the ballot sequence alone.
    on_success: "ReviewCase.version and ReviewCase.next_vote_sequence each increment by 1; the response is the updated ReviewCase, so the next voter can chain the returned version."
    on_conflict: "ERR_REVIEW_CASE_VERSION_STALE (412); no CommitteeVote row is created, next_vote_sequence and version are unchanged."

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: crash_recordability
    algorithm_type: threshold
    trigger: "POST /crashes (evaluated once at intake, then frozen)"
    inputs: [fatality_count, injury_transported_count, tow_away, tow_reason, hazmat_release, occurred_at]
    constants:
      REPORT_WINDOW_HOURS: 72
      HAZMAT_REPORT_WINDOW_HOURS: 24
    formula: |
      codes = []
      if fatality_count >= 1:                                     codes.append("FATALITY")
      if injury_transported_count >= 1:                           codes.append("INJURY_TRANSPORTED")
      if tow_away is true and tow_reason == "DISABLING_DAMAGE":    codes.append("DISABLING_TOW")
      if hazmat_release is true:                                   codes.append("HAZMAT_RELEASE")
      # `codes` is emitted in exactly this fixed order, never in trigger-evaluation
      # order and never sorted alphabetically.
      recordability_codes = codes
      dot_recordable      = len(codes) >= 1
      if dot_recordable:
          window_hours   = HAZMAT_REPORT_WINDOW_HOURS if hazmat_release else REPORT_WINDOW_HOURS
          report_due_at  = occurred_at + window_hours hours
          reporting_status = "PENDING_FILING"
      else:
          report_due_at    = null
          reporting_status = "NOT_REQUIRED"
    outputs: [dot_recordable, recordability_codes, report_due_at, reporting_status]
    notes: |
      A tow_away with tow_reason == CONVENIENCE is NOT a recordability trigger:
      both conditions must hold. hazmat_release both adds a code and shortens the
      window, so a hazmat crash with no injury and no tow is recordable with a
      24-hour window measured from occurred_at, not from intake.

  - name: crash_evidence_posture
    algorithm_type: aggregation
    trigger: "re-derived on every read of a Crash, and after every EvidenceItem preservation or purge"
    inputs: [Crash.severity, Crash.occurred_at, EvidenceItem rows with crash_id == crash.id]
    constants:
      REQUIRED_KINDS_MINOR: ["TELEMATICS_SNAPSHOT"]
      REQUIRED_KINDS_MODERATE: ["TELEMATICS_SNAPSHOT", "FORWARD_CAMERA"]
      REQUIRED_KINDS_SEVERE: ["TELEMATICS_SNAPSHOT", "FORWARD_CAMERA", "ELD_LOG"]
      REQUIRED_KINDS_CATASTROPHIC: ["TELEMATICS_SNAPSHOT", "FORWARD_CAMERA", "ELD_LOG"]
    formula: |
      required = REQUIRED_KINDS_<severity>
      # A required kind counts as satisfied only by an item that is currently
      # PRESERVED *and* whose data window brackets the crash instant. The window
      # is half-open: window_start_at <= occurred_at < window_end_at.
      satisfied = { item.kind for item in items
                    if item.preservation_state == "PRESERVED"
                    and item.window_start_at <= crash.occurred_at
                    and crash.occurred_at < item.window_end_at }
      spoliated = any(item.preservation_state == "PURGED_BEFORE_HOLD" for item in items)
      if spoliated:                        evidence_posture = "COMPROMISED"
      elif set(required) <= satisfied:     evidence_posture = "COMPLETE"
      else:                                evidence_posture = "PARTIAL"
    outputs: [evidence_posture]
    notes: |
      Priority matters: COMPROMISED outranks COMPLETE. A crash with every
      required kind preserved AND one spoliated item is COMPROMISED, not
      COMPLETE, and therefore decides under the WEIGHTED_CRITERIA variant. A
      RELEASED item no longer satisfies its kind, so releasing evidence on a
      COMPLETE crash drops it back to PARTIAL. An item whose window ends exactly
      at occurred_at does not bracket the crash (exclusive end).

  - name: preventability_determination
    algorithm_type: weighted_scoring
    trigger: "POST /review-cases/{id}/votes (step 1, per ballot) and POST /review-cases/{id}/decide (steps 2-3)"
    inputs: [CommitteeVote rows of the case, Crash.mechanical_factor, Crash.evidence_posture]
    constants:
      CRITERION_WEIGHT_SPEED_AND_SPACING: 0.30
      CRITERION_WEIGHT_HAZARD_RECOGNITION: 0.25
      CRITERION_WEIGHT_VEHICLE_CONDITION_PRECHECK: 0.15
      CRITERION_WEIGHT_REGULATORY_COMPLIANCE: 0.20
      CRITERION_WEIGHT_EVASIVE_ACTION: 0.10
      PREVENTABILITY_THRESHOLD: 2.50
      COMMITTEE_QUORUM_MIN: 3
    formula: |
      # ---- step 1: per-ballot weighted member score (at vote time) ----------
      # The five criterion weights sum to 1.00, but vehicle_condition_precheck is
      # NOT APPLICABLE when the crash has no mechanical factor, and its weight is
      # renormalised away rather than treated as a zero score.
      applicable = ["speed_and_spacing", "hazard_recognition", "regulatory_compliance", "evasive_action"]
      if crash.mechanical_factor is true:
          applicable.insert(2, "vehicle_condition_precheck")
      denominator = sum(CRITERION_WEIGHT[k] for k in applicable)     # 1.00 or 0.85
      raw   = sum(criterion_scores[k] * CRITERION_WEIGHT[k] for k in applicable) / denominator
      weighted_member_score = round_half_up(raw, 2)                  # PINNED at 2 decimals per ballot
      # ABSTAIN ballots carry no criterion_scores and no weighted_member_score.

      # ---- step 2: committee score (at decide time) -------------------------
      ballots = [v for v in votes if v.superseded is false and v.vote != "ABSTAIN"]
      # ORDER IS PINNED: mean of the ALREADY-ROUNDED per-ballot scores, then round
      # the mean. Never mean the unrounded raw scores.
      committee_score = round_half_up(sum(b.weighted_member_score for b in ballots) / len(ballots), 2)

      # ---- step 3: determination (variant-selected) -------------------------
      # see `variants` below
    variants:
      - variant_id: unweighted_majority
        selected_when: "Crash.evidence_posture == COMPLETE"
        decision_basis: UNWEIGHTED_MAJORITY
        formula: |
          preventable_votes     = count(b.vote == "PREVENTABLE"     for b in ballots)
          non_preventable_votes = count(b.vote == "NON_PREVENTABLE" for b in ballots)
          determination = "PREVENTABLE" if preventable_votes > non_preventable_votes else "NON_PREVENTABLE"
          # A tie resolves to NON_PREVENTABLE: the carrier bears the burden.
        rationale: "With a complete evidence record the committee's own ballots are dispositive and the criterion arithmetic is advisory only."
      - variant_id: weighted_criteria
        selected_when: "Crash.evidence_posture == COMPROMISED"
        decision_basis: WEIGHTED_CRITERIA
        formula: |
          determination = "PREVENTABLE" if committee_score >= PREVENTABILITY_THRESHOLD else "NON_PREVENTABLE"
        rationale: "When evidence was spoliated the ballots are discounted and the recorded criterion scoring governs, at a 2.50 threshold."
    outputs: [CommitteeVote.weighted_member_score, ReviewCase.committee_score, ReviewCase.determination, ReviewCase.decision_basis]
    notes: |
      committee_score is ALWAYS computed and stored at decide time, under both
      variants, so the arithmetic is observable even when the majority variant
      decides. Only the mapping from score/ballots to `determination` differs.
      Worked divergence (mechanical_factor true, denominator 1.00), three ballots:
        M1 speed 3 hazard 3 vehicle 2 regulatory 3 evasive 2 -> 2.75, vote NON_PREVENTABLE
        M2 speed 2 hazard 3 vehicle 3 regulatory 2 evasive 3 -> 2.50, vote NON_PREVENTABLE
        M3 speed 4 hazard 3 vehicle 2 regulatory 3 evasive 1 -> 2.95, vote PREVENTABLE
        committee_score = round_half_up((2.75 + 2.50 + 2.95)/3, 2) = 2.73
        weighted_criteria    -> 2.73 >= 2.50 -> PREVENTABLE
        unweighted_majority  -> 1 preventable vs 2 non-preventable -> NON_PREVENTABLE
      Worked rounding order (mechanical_factor false, denominator 0.85):
        M1 speed 0 hazard 3 regulatory 2 evasive 4 -> raw 1.82352941 -> 1.82
        M2 speed 2 hazard 3 regulatory 3 evasive 4 -> raw 2.76470588 -> 2.76
        M3 speed 4 hazard 3 regulatory 4 evasive 3 -> raw 3.58823529 -> 3.59
        pinned round-then-mean = 2.72
        mean-then-round (wrong) = 2.73
        no renormalisation, vehicle scored 0 with weight 0.15 (wrong) = 2.32

  - name: driver_preventable_points
    algorithm_type: decay_function
    trigger: "re-derived on every read of a Driver, and after every cascade that changes a Crash.preventability_status for that driver"
    inputs: [Crash rows with driver_id == driver.id and preventability_status == PREVENTABLE, current_utc]
    constants:
      SEVERITY_POINTS_MINOR: 2
      SEVERITY_POINTS_MODERATE: 4
      SEVERITY_POINTS_SEVERE: 8
      SEVERITY_POINTS_CATASTROPHIC: 12
      DECAY_FRESH_FACTOR: 1.0
      DECAY_AGED_FACTOR: 0.5
      DECAY_EXPIRED_FACTOR: 0.0
      DECAY_FRESH_DAYS: 365
      DECAY_AGED_DAYS: 730
      ACTION_TIER_TERMINATION_REVIEW_MIN: 12
      ACTION_TIER_SUSPENSION_MIN: 8
      ACTION_TIER_RETRAINING_MIN: 4
      ACTION_TIER_COACHING_MIN: 1
    formula: |
      points = 0
      for crash in preventable_crashes_of_driver:
          age_days = floor((current_utc - crash.occurred_at) / 1 day)
          if   age_days <  DECAY_FRESH_DAYS: factor = DECAY_FRESH_FACTOR    # 1.0
          elif age_days <  DECAY_AGED_DAYS:  factor = DECAY_AGED_FACTOR     # 0.5
          else:                              factor = DECAY_EXPIRED_FACTOR  # 0.0
          points += SEVERITY_POINTS[crash.severity] * factor
      preventable_points = round_half_up(points, 1)

      if   preventable_points >= 12: required_action_tier = "TERMINATION_REVIEW"
      elif preventable_points >=  8: required_action_tier = "SUSPENSION"
      elif preventable_points >=  4: required_action_tier = "RETRAINING"
      elif preventable_points >=  1: required_action_tier = "COACHING"
      else:                          required_action_tier = "NONE"
    outputs: [Driver.preventable_points, Driver.required_action_tier]
    notes: |
      The decay bands are half-open on the upper edge: a crash exactly 365 days
      old has already aged into the 0.5 band, and one exactly 730 days old is
      expired (factor 0.0). Because the bands are read against current_utc, moving
      the logical clock forward alone can lower a driver's tier — but it never
      voids an already-issued DisciplinaryAction. Only PREVENTABLE crashes
      contribute; UNDER_REVIEW and NON_PREVENTABLE crashes contribute nothing,
      which is what makes the appeal compensation exactly restorable.

  - name: terminal_crash_rate
    algorithm_type: threshold
    trigger: "re-derived on every read of a Terminal and on GET /terminals/{id}/crash-analytics"
    inputs: [Crash rows with terminal_id == terminal.id, Terminal.annual_miles_millions, current_utc, basis]
    constants:
      ANALYTICS_WINDOW_DAYS: 365
      RISK_TIER_CRITICAL_MIN: 3.000
      RISK_TIER_ELEVATED_MIN: 1.500
    formula: |
      window = [current_utc - ANALYTICS_WINDOW_DAYS days, current_utc)   # half-open
      in_window = [c for c in crashes_of_terminal if window.start <= c.occurred_at < window.end]
      if basis == "AS_DETERMINED":      # default, and the basis behind Terminal.preventable_crash_count
          counted = [c for c in in_window if c.preventability_status == "PREVENTABLE"]
      elif basis == "AS_REPORTED":      # every notified crash, determination ignored
          counted = in_window
      preventable_crash_count      = len(counted)
      crash_rate_per_million_miles = round_half_up(len(counted) / annual_miles_millions, 3)
      if   crash_rate_per_million_miles >= 3.000: risk_tier = "CRITICAL"
      elif crash_rate_per_million_miles >= 1.500: risk_tier = "ELEVATED"
      else:                                       risk_tier = "STANDARD"
    outputs: [Terminal.preventable_crash_count, Terminal.crash_rate_per_million_miles, Terminal.risk_tier]
    notes: |
      Terminal.preventable_crash_count / crash_rate_per_million_miles / risk_tier
      on the entity always reflect basis AS_DETERMINED; the AS_REPORTED basis is
      reachable only through GET /terminals/{id}/crash-analytics. The window is
      half-open: a crash exactly 365 days old sits ON the inclusive lower bound
      and is therefore IN, a crash one second older is OUT, and a crash at
      current_utc is OUT because the upper bound is exclusive.
      Worked: 1 preventable crash and annual_miles_millions 4.0 -> 0.250 STANDARD;
      the same crash with 0.6666 -> round_half_up(1.50015..., 3) = 1.500, which is
      exactly the ELEVATED boundary; with 0.5 -> 2.000 ELEVATED.

  - name: terminal_staffing_posture
    algorithm_type: threshold
    trigger: "re-derived on every read of a Terminal; gates POST /disciplinary-actions for SUSPENSION"
    inputs: [Terminal.active_driver_count, Terminal.suspended_driver_count]
    constants:
      STAFFING_CRITICAL_RATIO: 0.50
      STAFFING_STRAINED_RATIO: 0.20
    formula: |
      if active_driver_count == 0:
          staffing_posture = "OK"                 # no drivers, nothing to strain
      else:
          ratio = suspended_driver_count / active_driver_count      # exact rational, NOT rounded
          if   ratio >= 0.50: staffing_posture = "CRITICAL"
          elif ratio >= 0.20: staffing_posture = "STRAINED"
          else:               staffing_posture = "OK"
    outputs: [Terminal.staffing_posture]
    notes: |
      active_driver_count counts every non-TERMINATED driver, so a suspended
      driver is counted in BOTH the numerator and the denominator: 1 suspended of
      2 non-terminated drivers is ratio 0.50 -> CRITICAL exactly at the boundary.
      The ratio is compared unrounded; 1/5 = 0.20 is STRAINED, 1/6 = 0.1666... is OK.

  - name: litigation_risk_score
    algorithm_type: aggregation
    trigger: "POST /claims (at setup) and re-derived on every read of a Claim, plus after every cascade that changes Crash.preventability_status, Crash.evidence_posture or the claim's Demand population"
    inputs: [Crash.preventability_status, Crash.evidence_posture, Crash.fatality_count, Crash.hazmat_release, Driver.tenure_band, Demand rows of the claim]
    constants:
      RISK_PREVENTABLE: 30
      RISK_UNDER_REVIEW: 10
      RISK_REPORTED: 5
      RISK_NON_PREVENTABLE: 0
      RISK_EVIDENCE_COMPROMISED: 25
      RISK_EVIDENCE_PARTIAL: 5
      RISK_EVIDENCE_COMPLETE: 0
      RISK_FATALITY: 20
      RISK_HAZMAT: 10
      RISK_GREEN_DRIVER: 5
      RISK_REPRESENTED_BI_DEMAND: 15
      RISK_SCORE_CAP: 100
      COUNSEL_REQUIRED_SCORE: 55
      LITIGATION_MULTIPLIER_TIER1_MAX: 24
      LITIGATION_MULTIPLIER_TIER2_MAX: 54
      LITIGATION_MULTIPLIER_TIER3_MAX: 79
    formula: |
      # Crash severity deliberately does NOT appear here: severity already drives
      # the reserve base in calculations.claim_reserve, and counting it twice
      # would double-load the estimate.
      s  = RISK_<preventability_status>                      # 30 / 10 / 5 / 0
      s += RISK_EVIDENCE_<evidence_posture>                  # 25 / 5 / 0
      s += RISK_FATALITY        if crash.fatality_count >= 1 else 0
      s += RISK_HAZMAT          if crash.hazmat_release       else 0
      s += RISK_GREEN_DRIVER    if driver.tenure_band == "UNDER_12_MONTHS" else 0
      s += RISK_REPRESENTED_BI_DEMAND if any(d.claimant_type == "THIRD_PARTY_BODILY_INJURY"
                                             and d.represented_by_counsel is true
                                             for d in demands_of_claim) else 0
      litigation_risk_score = min(s, RISK_SCORE_CAP)
      counsel_required      = litigation_risk_score >= COUNSEL_REQUIRED_SCORE     # 55

      if   litigation_risk_score <= 24: litigation_risk_multiplier = 1.00
      elif litigation_risk_score <= 54: litigation_risk_multiplier = 1.15
      elif litigation_risk_score <= 79: litigation_risk_multiplier = 1.35
      else:                             litigation_risk_multiplier = 1.60
    outputs: [Claim.litigation_risk_score, Claim.litigation_risk_multiplier, Claim.counsel_required]
    notes: |
      Worked bands used throughout the design:
        REPORTED (5) + PARTIAL (5)                                  = 10  -> 1.00, counsel not required
        PREVENTABLE (30) + PARTIAL (5)                              = 35  -> 1.15, counsel not required
        PREVENTABLE (30) + COMPROMISED (25)                         = 55  -> 1.35, counsel REQUIRED (exact boundary)
        PREVENTABLE (30) + COMPROMISED (25) + HAZMAT (10)           = 65  -> 1.35, counsel required
        PREVENTABLE (30) + COMPROMISED (25) + FATALITY (20) + BI (15) + HAZMAT (10) + GREEN (5) = 105 -> capped to 100 -> 1.60
      The score is re-derived on read, so preserving a missing evidence kind, or
      granting an appeal, moves the multiplier without any claim-side write. The
      reserve does NOT move with it: the stored reserve only changes when a
      reserve revision is posted, which is what makes the multiplier-versus-reserve
      staleness observable.

  - name: claim_reserve
    algorithm_type: tiered_pricing
    trigger: "POST /claims (variant provisional_at_setup, frozen into provisional_reserve_cents) and POST /claims/{id}/reserve-revisions (variant selected by `basis`)"
    inputs: [Crash.severity, Crash.injury_transported_count, Crash.fatality_count, Claim.litigation_risk_multiplier, Claim.counsel_assigned, Demand rows of the claim]
    constants:
      SEVERITY_BASE_MINOR_CENTS: 500000
      SEVERITY_BASE_MODERATE_CENTS: 2500000
      SEVERITY_BASE_SEVERE_CENTS: 12000000
      SEVERITY_BASE_CATASTROPHIC_CENTS: 45000000
      INJURY_UNIT_CENTS: 3500000
      FATALITY_UNIT_CENTS: 90000000
      EXPENSE_RATIO: 0.18
      PROVISIONAL_FLOOR_CENTS: 250000
    formula: |
      # ---- shared tail, applied identically by both variants ----------------
      # gross_exposure_cents is produced by the variant; everything below is common.
      indemnity_component = round_half_up(gross_exposure_cents * litigation_risk_multiplier, 0)
      # ORDER IS PINNED: the expense loading is taken on the UNMULTIPLIED gross
      # exposure, not on indemnity_component. Loading the multiplied figure
      # double-counts litigation risk.
      expense_component   = round_half_up(gross_exposure_cents * EXPENSE_RATIO, 0) if claim.counsel_assigned else 0
      reserve_cents       = max(indemnity_component + expense_component, PROVISIONAL_FLOOR_CENTS)
    variants:
      - variant_id: provisional_at_setup
        selected_when: "POST /claims, and POST /claims/{id}/reserve-revisions with basis == PROVISIONAL_REFRESH"
        formula: |
          gross_exposure_cents = SEVERITY_BASE_<severity>_CENTS
                               + crash.injury_transported_count * INJURY_UNIT_CENTS
                               + crash.fatality_count           * FATALITY_UNIT_CENTS
        rationale: "Before any demand is quantified the only defensible exposure signal is the crash itself."
      - variant_id: demand_weighted
        selected_when: "POST /claims/{id}/reserve-revisions with basis == DEMAND_BASED"
        formula: |
          gross_exposure_cents = sum over Demand rows of the claim of:
              demand.settlement_total_cents  if demand.status IN {SETTLED, CLOSED_PAID}
              demand.demand_amount_cents     otherwise
          # requires at least one Demand; a DEMAND_BASED revision on a claim with
          # no demand is refused with ERR_NO_DEMANDS_TO_WEIGHT.
        rationale: "Once written demands exist they replace the severity proxy entirely; already-settled demands contribute their actual settled total, not their original ask."
    outputs: [Claim.provisional_reserve_cents, Claim.revised_reserve_cents, Claim.outstanding_reserve_cents]
    notes: |
      Worked values used throughout the design (SEVERE crash, 1 transported injury,
      0 fatalities -> gross 15,500,000):
        score 10 -> multiplier 1.00, no counsel -> 15,500,000
        score 35 -> multiplier 1.15, no counsel -> 17,825,000
        score 65 -> multiplier 1.35, no counsel -> 20,925,000
      demand_weighted with a single 20,000,000 demand at 1.00 -> 20,000,000; with a
      single 6,000,000 demand -> 6,000,000; with demands 20,000,000 + 6,000,000 at
      1.15 -> round_half_up(26,000,000 * 1.15) = 29,900,000, and with counsel
      assigned the expense loading is round_half_up(26,000,000 * 0.18) = 4,680,000
      for a reserve of 34,580,000. Loading the multiplied figure instead would give
      29,900,000 * 0.18 = 5,382,000 and a reserve of 35,282,000 — the pinned order
      is what distinguishes them. A MINOR crash with no injuries produces gross
      500,000; the PROVISIONAL_FLOOR_CENTS floor only binds below 250,000, which
      no severity base reaches, so the floor is exercised only through the
      demand_weighted variant on a sub-250,000 demand.

  - name: settlement_layer_waterfall
    algorithm_type: waterfall_allocation
    trigger: "POST /demands/{id}/settle"
    inputs: [standing NegotiationRound.carrier_offer_cents, PolicyLayer rows for the crash's program year, Claim.layer_allocations]
    constants:
      ALAE_RATE_LOW: 0.08
      ALAE_RATE_MID: 0.12
      ALAE_RATE_HIGH: 0.15
      ALAE_TIER_MID_MIN_CENTS: 5000000
      ALAE_TIER_HIGH_MIN_CENTS: 25000000
    formula: |
      # ---- step 1: indemnity is the standing carrier offer ------------------
      settled_amount_cents = standing_round.carrier_offer_cents

      # ---- step 2: ALAE rate tier ------------------------------------------
      # ORDER IS PINNED: the tier is keyed on the INDEMNITY ALONE, before ALAE is
      # added. Keying it on the settlement total is circular and, near a tier
      # edge, self-fulfilling.
      if   settled_amount_cents >= ALAE_TIER_HIGH_MIN_CENTS: alae_rate = 0.15
      elif settled_amount_cents >= ALAE_TIER_MID_MIN_CENTS:  alae_rate = 0.12
      else:                                                  alae_rate = 0.08

      # ---- step 3: ALAE and settlement total -------------------------------
      alae_cents             = round_half_up(settled_amount_cents * alae_rate, 0)
      settlement_total_cents = settled_amount_cents + alae_cents

      # ---- step 4: waterfall across the tower ------------------------------
      layers    = PolicyLayer rows with program_year == year_utc(crash.occurred_at), ascending by layer_index
      remaining = settlement_total_cents
      for layer in layers:
          already   = sum(a.allocated_cents for a in claim.layer_allocations if a.policy_layer_id == layer.id)
          capacity  = layer.limit_cents - already
          take      = min(remaining, capacity)
          if take > 0: record { policy_layer_id, layer_index, layer_type, allocated_cents: take }
          remaining -= take
          if remaining == 0: break

      # ---- step 5: overflow ------------------------------------------------
      if remaining > 0:
          refuse the whole settlement with ERR_COVERAGE_EXHAUSTED (422); no field
          on the Demand, the Claim or any PolicyLayer is modified.

      sir_eroded_cents    += sum(allocated_cents where layer_type == "SIR")
      insured_paid_cents  += sum(allocated_cents where layer_type IN {"PRIMARY", "EXCESS"})
    outputs: [Demand.settled_amount_cents, Demand.alae_cents, Demand.settlement_total_cents, Claim.layer_allocations, Claim.sir_eroded_cents, Claim.insured_paid_cents]
    notes: |
      Worked: a tower of SIR limit 10,000,000 (layer_index 1, attachment 0) plus
      PRIMARY limit 5,000,000 (layer_index 2, attachment 10,000,000) has capacity
      15,000,000. An offer of 13,392,857 lands in the MID tier: ALAE
      round_half_up(13,392,857 * 0.12) = round_half_up(1,607,142.84) = 1,607,143,
      total exactly 15,000,000, which exhausts the tower to the cent and succeeds.
      An offer of 13,392,858 produces the SAME ALAE 1,607,143 (round_half_up of
      1,607,142.96) and a total of 15,000,001 — one cent over capacity — and is
      refused with ERR_COVERAGE_EXHAUSTED.
      Tier-order worked case: an offer of 4,900,000 is under 5,000,000, so the rate
      is 0.08 and ALAE is 392,000 for a total of 5,292,000. Keying the tier on the
      total instead would push it into the MID tier for ALAE 588,000 and a total
      of 5,488,000.

  - name: subrogation_recovery
    algorithm_type: aggregation
    trigger: "the DRAFT -> READY_TO_PURSUE cascade (freeze) and POST /subrogation-demands/{id}/resolve (recovery)"
    inputs: [Claim.indemnity_paid_cents, Claim.alae_paid_cents, SubrogationDemand.at_fault_percentage, recovered_amount_cents]
    constants:
      RECOVERY_PERCENT_DENOMINATOR: 100
    formula: |
      # frozen at the DRAFT -> READY_TO_PURSUE transition, NOT re-derived later
      recoverable_base_cents = claim.indemnity_paid_cents + claim.alae_paid_cents
      max_recoverable_cents  = round_half_up(recoverable_base_cents * at_fault_percentage / 100, 0)

      # at resolve time
      if recovered_amount_cents > max_recoverable_cents:
          refuse with ERR_RECOVERY_EXCEEDS_BASE (422)
      claim.subrogation_recovered_cents += recovered_amount_cents
      claim.total_incurred_cents = claim.indemnity_paid_cents + claim.alae_paid_cents
                                 + claim.outstanding_reserve_cents - claim.subrogation_recovered_cents
    outputs: [SubrogationDemand.recoverable_base_cents, SubrogationDemand.max_recoverable_cents, Claim.subrogation_recovered_cents, Claim.total_incurred_cents]
    notes: |
      The base is frozen at READY_TO_PURSUE, so a later reserve revision cannot
      inflate the recovery ceiling. Worked: paid indemnity 13,392,857 plus paid
      ALAE 1,607,143 is a base of 15,000,000; at_fault_percentage 40 gives
      max_recoverable_cents 6,000,000. Recovering all 6,000,000 against an
      outstanding reserve of 5,000,000 leaves
      total_incurred_cents = 13,392,857 + 1,607,143 + 5,000,000 - 6,000,000 = 14,000,000,
      while claim_exposure_cents is untouched: a recovery is a receipt, not a
      change in exposure.

# ---------------------------------------------------------------------------
# Named conserved quantities (referenced by the §1.8 compensating_invariant rule)
# ---------------------------------------------------------------------------
invariants:
  - name: claim_exposure_conserved
    quantity: "Claim.claim_exposure_cents = outstanding_reserve_cents + indemnity_paid_cents + alae_paid_cents + reserve_released_cents"
    conserved_across:
      - "POST /demands/{id}/settle paired with POST /demands/{id}/rescind-settlement"
      - "POST /claims/{id}/close (reserve moves from outstanding to released, total unchanged)"
      - "POST /subrogation-demands/{id}/resolve (a recovery is a receipt, tracked separately)"
    changed_only_by: "POST /claims/{id}/reserve-revisions, which re-bases the estimate on purpose"
    kind: monetary_ledger

  - name: driver_points_and_terminal_headcount_conserved
    quantity: |
      Driver.preventable_points for the crash's driver, together with the pair
      (Terminal.active_driver_count, Terminal.suspended_driver_count) for that
      driver's terminal and Terminal.preventable_crash_count.
    conserved_across:
      - "POST /review-cases/{id}/decide (PREVENTABLE) paired with POST /review-cases/{id}/appeal that vacates it, at a fixed logical clock"
    changed_only_by: "a new crash, a new determination, an employment decision, or moving the logical clock across a decay or analytics-window boundary"
    kind: safety_scoring_and_headcount

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in strict ascending priority order;
# the FIRST violated rule determines the response and no side effect is applied)
# ---------------------------------------------------------------------------
# Domain ordering rationale: this is a safety-and-compliance domain, so the
# business band runs safety (30-35) -> temporal (40-43) -> referential (50-53)
# -> constraint (60-64) -> fiscal (70-71). The ladder is literal, and these
# cross-band pairs are deliberately exercised:
#   * business_safety (30) beats business_constraint (60): a decide request that
#     both lacks quorum and sits on a PARTIAL evidence record returns the
#     evidence error, because deciding on an incomplete record is the graver
#     defect.
#   * state (20) beats business_fiscal (70): settling an already-SETTLED demand
#     that would also blow through the policy tower returns the state error.
#   * OCC staleness (28) is checked AFTER state and segregation-of-duties (25)
#     but BEFORE every business rule, so a stale version never masks a
#     malformed workflow and never hides behind a business failure.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty; the role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when X-User-Role == Driver, X-User-ID must be the id of an existing Driver row, and the operation must concern that driver's own crash"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /crashes/{id}/driver-statements"
  - priority: 5
    category: existence
    check: "request body parses as JSON, unknown fields are rejected, every required input is present, and every present field matches its declared type, enum domain and range constraint (including limit 1-100 / offset >= 0 on list endpoints)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "conditional field shape: criterion_scores is required with exactly its five integer 0-4 keys when vote != ABSTAIN and MUST be absent when vote == ABSTAIN; suspension_start_at/suspension_end_at are required iff action_type == SUSPENSION; retraining_course_code is required iff action_type IN {RETRAINING, SUSPENSION}; appeal_evidence_item_id is required iff grounds_code == NEW_EVIDENCE; recovered_amount_cents is required iff resolution == RECOVERED"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /review-cases/{id}/votes, POST /disciplinary-actions, POST /review-cases/{id}/appeal, POST /subrogation-demands/{id}/resolve"
  - priority: 10
    category: existence
    check: "the {id} in the path resolves to an existing row of the addressed collection"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every path containing {id}"
  - priority: 11
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, checked in declaration order of the entity's fields"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /drivers, POST /crashes, POST /review-cases, POST /claims, POST /disciplinary-actions, POST /review-cases/{id}/appeal"
  - priority: 20
    category: state
    check: "the addressed entity is in a state from which the requested transition is declared in §1.2 (including: a Crash whose reporting_status is not PENDING_FILING cannot be filed (a duplicate ReviewCase is instead ERR_REVIEW_CASE_EXISTS at priority 50); a Demand not in OFFER_OUTSTANDING cannot settle; a SETTLED demand cannot settle again; a CLOSED claim accepts no writes; a driver already TERMINATED accepts no further action; an EvidenceItem not in REQUESTED cannot be preserved)"
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 21
    category: state
    check: "an appeal is refused once Crash.appeals_exhausted is true or ReviewCase.appeal_round has reached APPEAL_MAX_ROUNDS"
    error_id: ERR_APPEALS_EXHAUSTED
    http_status: 409
    applies_to: "POST /review-cases/{id}/appeal"
  - priority: 25
    category: business_safety
    check: "segregation of duties on the X-User-ID: the decider may not be the member_user_id of any non-superseded ballot on the case, and the appeal grantor may not be the ReviewCase.decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /review-cases/{id}/decide, POST /review-cases/{id}/appeal"
  - priority: 28
    category: state
    check: "expected_claim_version / expected_review_case_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_CLAIM_VERSION_STALE | ERR_REVIEW_CASE_VERSION_STALE"
    http_status: 412
    applies_to: "POST /claims/{id}/reserve-revisions, POST /review-cases/{id}/votes"
  - priority: 30
    category: business_safety
    check: "a determination may only be recorded on a crash whose evidence_posture is COMPLETE or COMPROMISED; a PARTIAL record is refused"
    error_id: ERR_EVIDENCE_POSTURE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /review-cases/{id}/decide"
  - priority: 31
    category: business_safety
    check: "deliberation may only be opened once at least one EvidenceItem of the crash is PRESERVED"
    error_id: ERR_NO_PRESERVED_EVIDENCE
    http_status: 409
    applies_to: "POST /review-cases/{id}/open-deliberation"
  - priority: 32
    category: business_safety
    check: "an EvidenceItem may not be preserved after its retention_deadline_at has passed"
    error_id: ERR_RETENTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /evidence-items/{id}/preserve"
  - priority: 33
    category: business_safety
    check: "a PRESERVED EvidenceItem may only be purged (released) when its crash has no Claim, or that Claim.handling_status == CLOSED — the litigation hold outranks the retention schedule"
    error_id: ERR_LITIGATION_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /evidence-items/{id}/purge"
  - priority: 34
    category: business_safety
    check: "a continued-employment decision of CONTINUE is refused while any DisciplinaryAction of the driver is still ISSUED with retraining_status == PENDING"
    error_id: ERR_RETRAINING_INCOMPLETE
    http_status: 409
    applies_to: "POST /drivers/{id}/employment-decision"
  - priority: 35
    category: business_safety
    check: "a decision of SEPARATE is refused unless Driver.required_action_tier == TERMINATION_REVIEW"
    error_id: ERR_SEPARATION_NOT_SUPPORTED
    http_status: 409
    applies_to: "POST /drivers/{id}/employment-decision"
  - priority: 40
    category: business_temporal
    check: "temporal windows: an appeal must be filed within APPEAL_WINDOW_DAYS (14) of ReviewCase.decided_at; a settlement may be rescinded only within RESCISSION_WINDOW_HOURS (168) of Demand.settled_at; retraining on a SUSPENSION may be completed only after suspension_end_at"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_RESCISSION_WINDOW_CLOSED | ERR_SUSPENSION_NOT_ELAPSED"
    http_status: 409
    applies_to: "POST /review-cases/{id}/appeal, POST /demands/{id}/rescind-settlement, POST /disciplinary-actions/{id}/complete-retraining"
  - priority: 41
    category: business_temporal
    check: "a new SUSPENSION window [suspension_start_at, suspension_end_at] must not overlap the window of any non-VOIDED SUSPENSION of the same driver, and must be separated from it by at least SUSPENSION_BUFFER_HOURS (24); windows are treated as half-open [start, end) for the overlap test, then widened by the buffer"
    error_id: ERR_SUSPENSION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /disciplinary-actions"
  - priority: 42
    category: business_temporal
    check: "an EvidenceItem window must satisfy window_start_at < window_end_at, retention_deadline_at > current_utc, and (for a TELEMATICS_SNAPSHOT, FORWARD_CAMERA or ELD_LOG item) must not duplicate an existing non-purged item of the same kind whose half-open window overlaps the requested one on the same crash; adjacent windows that merely touch are allowed"
    error_id: ERR_EVIDENCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /crashes/{id}/evidence-items"
  - priority: 43
    category: business_temporal
    check: "Crash.occurred_at and Crash.notified_at must both be <= current_utc with notified_at >= occurred_at; Demand.demand_received_at must be <= current_utc"
    error_id: ERR_FUTURE_TIMESTAMP
    http_status: 409
    applies_to: "POST /crashes, POST /claims/{id}/demands"
  - priority: 50
    category: business_referential
    check: "referential uniqueness and pairing: at most one ReviewCase per Crash; at most one Claim per Crash; Terminal.terminal_code globally unique; Driver.employee_code unique within its terminal; PolicyLayer.layer_index unique within its program_year; DisciplinaryAction.driver_id must equal the referenced Crash.driver_id; a DriverStatement's author must be the crash's driver"
    error_id: "ERR_REVIEW_CASE_EXISTS | ERR_CLAIM_EXISTS | ERR_TERMINAL_CODE_DUPLICATE | ERR_EMPLOYEE_CODE_DUPLICATE | ERR_POLICY_LAYER_DUPLICATE | ERR_DRIVER_CRASH_MISMATCH"
    http_status: 409
    applies_to: "POST /review-cases, POST /claims, POST /terminals, POST /drivers, POST /policy-layers, POST /disciplinary-actions, POST /crashes/{id}/driver-statements"
  - priority: 51
    category: business_referential
    check: "a ReviewCase may only be opened when a DriverStatement exists for the crash, unless statement_waiver_reason is supplied"
    error_id: ERR_DRIVER_STATEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /review-cases"
  - priority: 52
    category: business_referential
    check: "a DisciplinaryAction may only be issued on a Crash whose preventability_status == PREVENTABLE; a SubrogationDemand may only be opened on a Claim whose Crash.third_party_at_fault is true; a NEW_EVIDENCE appeal's appeal_evidence_item_id must belong to the case's crash and be PRESERVED"
    error_id: "ERR_CRASH_NOT_PREVENTABLE | ERR_NO_THIRD_PARTY_AT_FAULT | ERR_APPEAL_EVIDENCE_INVALID"
    http_status: 409
    applies_to: "POST /disciplinary-actions, POST /claims/{id}/subrogation-demands, POST /review-cases/{id}/appeal"
  - priority: 53
    category: business_referential
    check: "the crash's program year must have a well-formed PolicyLayer tower before a settlement: layer_index 1 must be SIR with attachment_point_cents == 0, indices must be contiguous from 1, and each layer's attachment_point_cents must equal the sum of limit_cents over the layers below it"
    error_id: ERR_POLICY_TOWER_MALFORMED
    http_status: 409
    applies_to: "POST /policy-layers, POST /demands/{id}/settle"
  - priority: 60
    category: business_constraint
    check: "a determination requires COMMITTEE_QUORUM_MIN (3) non-superseded, non-ABSTAIN ballots; ABSTAIN ballots never count toward quorum"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /review-cases/{id}/decide"
  - priority: 61
    category: business_constraint
    check: "monotonic negotiation positions: carrier_offer_cents must strictly exceed the standing round's carrier_offer_cents and must not exceed Demand.demand_amount_cents; claimant_counter_cents must strictly exceed the standing round's carrier_offer_cents and must not exceed the previous round's claimant_counter_cents"
    error_id: "ERR_OFFER_NOT_MONOTONIC | ERR_OFFER_EXCEEDS_DEMAND | ERR_COUNTER_NOT_MONOTONIC"
    http_status: 422
    applies_to: "POST /demands/{id}/offers, POST /demands/{id}/counters"
  - priority: 62
    category: business_constraint
    check: "a DisciplinaryAction's action_type ordinal must be >= the ordinal of Driver.required_action_tier; a SUSPENSION issued while the driver's Terminal.staffing_posture == CRITICAL additionally requires override_reason"
    error_id: "ERR_ACTION_TIER_INSUFFICIENT | ERR_STAFFING_OVERRIDE_REQUIRED"
    http_status: 422
    applies_to: "POST /disciplinary-actions"
  - priority: 63
    category: business_constraint
    check: "an offer on a THIRD_PARTY_BODILY_INJURY demand whose Claim.counsel_required is true requires Claim.counsel_assigned == true; a counsel assignment on a claim whose counsel_required is false is refused"
    error_id: "ERR_COUNSEL_REQUIRED | ERR_COUNSEL_NOT_REQUIRED"
    http_status: 422
    applies_to: "POST /demands/{id}/offers, POST /claims/{id}/counsel-assignment"
  - priority: 64
    category: business_constraint
    check: "a DEMAND_BASED reserve revision requires at least one Demand on the claim; a claim may only be closed when every Demand is SETTLED or CLOSED_PAID and every SubrogationDemand is resolved"
    error_id: "ERR_NO_DEMANDS_TO_WEIGHT | ERR_OPEN_DEMANDS_REMAIN | ERR_OPEN_SUBROGATION_REMAINS"
    http_status: 422
    applies_to: "POST /claims/{id}/reserve-revisions, POST /claims/{id}/close"
  - priority: 70
    category: business_fiscal
    check: "the settlement_total_cents of a settlement must fit in the remaining capacity of the crash program year's PolicyLayer tower, counting capacity already consumed by this claim"
    error_id: ERR_COVERAGE_EXHAUSTED
    http_status: 422
    applies_to: "POST /demands/{id}/settle"
  - priority: 71
    category: business_fiscal
    check: "recovered_amount_cents on a RECOVERED resolution must be > 0 and <= SubrogationDemand.max_recoverable_cents"
    error_id: ERR_RECOVERY_EXCEEDS_BASE
    http_status: 422
    applies_to: "POST /subrogation-demands/{id}/resolve"
  - priority: 72
    category: business_fiscal
    check: "a settlement may not pay out more than the money already reserved for it: settlement_total_cents must be <= Claim.outstanding_reserve_cents. This is what keeps invariants.claim_exposure_conserved exact -- the settlement moves cents from outstanding_reserve_cents into indemnity_paid_cents / alae_paid_cents rather than creating them. Runs after the coverage check at priority 70, so a settlement that both overflows the tower and outruns the reserve reports ERR_COVERAGE_EXHAUSTED."
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /demands/{id}/settle"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# api_prefix is "", so every path below is absolute and every single-resource
# path parameter is literally `{id}`. Sub-resource collections are one level
# deep (`/crashes/{id}/evidence-items`); peer entities are addressed directly
# (`/demands/{id}`, never `/claims/{claim_id}/demands/{demand_id}`).
# Every write endpoint requires the X-User-ID and X-User-Role headers.
endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 priority-ladder step 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Every window, deadline, decay band and analytics range in this domain is measured against this clock."
    roles: [SafetyAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "re-derives every clock-dependent computed field on the next read (Driver.tenure_band, Driver.preventable_points, Driver.required_action_tier, Terminal.preventable_crash_count, Terminal.crash_rate_per_million_miles, Terminal.risk_tier)"
      - "moves the evaluation point for every temporal validation (report_due_at, retention_deadline_at, appeal window, rescission window, suspension elapse)"

  # ---- Terminal -----------------------------------------------------------
  - method: POST
    path: "/terminals"
    description: Registers a terminal (domicile) with its annual exposure denominator.
    roles: [SafetyAdmin]
    code: 201
    input: [name, terminal_code, region_code, annual_miles_millions]
    output: Terminal
    side_effects:
      - "enforces terminal_code uniqueness (ERR_TERMINAL_CODE_DUPLICATE)"
      - "computed counters start at 0 and staffing_posture starts at OK"
  - method: GET
    path: "/terminals/{id}"
    description: Reads one terminal with all clock-dependent analytics re-derived at response time.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: []
    output: Terminal
    side_effects:
      - "re-derives calculations.terminal_crash_rate (basis AS_DETERMINED) and calculations.terminal_staffing_posture"
  - method: GET
    path: "/terminals"
    description: Lists terminals.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["region_code?", "risk_tier?", "staffing_posture?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []
  - method: GET
    path: "/terminals/{id}/crash-analytics"
    description: "Computed read: crash-rate analytics for the terminal over the trailing ANALYTICS_WINDOW_DAYS window, broken down by route class and driver tenure band."
    roles: [SafetyAdmin, SafetyManager, Auditor]
    code: 200
    input: ["basis?", "route_class?", "tenure_band?"]
    output: { terminal_id: string, basis: string, window_start_at: datetime, window_end_at: datetime, crash_count: integer, preventable_crash_count: integer, crash_rate_per_million_miles: number, risk_tier: string, by_route_class: array, by_tenure_band: array }
    side_effects:
      - "runs calculations.terminal_crash_rate with the requested basis (default AS_DETERMINED); route_class / tenure_band narrow the counted crash set before the rate is computed"

  # ---- Driver -------------------------------------------------------------
  - method: POST
    path: "/drivers"
    description: Hires a driver into a terminal.
    roles: [SafetyAdmin]
    code: 201
    input: [terminal_id, employee_code, full_name, cdl_number, hire_date]
    output: Driver
    side_effects:
      - "enforces employee_code uniqueness within terminal_id (ERR_EMPLOYEE_CODE_DUPLICATE)"
      - "status starts at ACTIVE, continued_employment_decision at PENDING; Terminal.active_driver_count grows by 1 on next read"
  - method: GET
    path: "/drivers/{id}"
    description: Reads one driver with tenure band, decayed preventable points and required action tier re-derived at response time.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: []
    output: Driver
    side_effects:
      - "re-derives calculations.driver_preventable_points"
  - method: GET
    path: "/drivers"
    description: Lists drivers, optionally scoped to one terminal.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["terminal_id?", "status?", "tenure_band?", "required_action_tier?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []
  - method: POST
    path: "/drivers/{id}/employment-decision"
    description: "Records the continued-employment decision after discipline: CONTINUE keeps the driver, SEPARATE terminates."
    roles: [SafetyManager]
    code: 200
    input: ["decision", "decision_note?"]
    output: Driver
    side_effects:
      - "CONTINUE is refused while any DisciplinaryAction of the driver is ISSUED with retraining_status PENDING (ERR_RETRAINING_INCOMPLETE)"
      - "SEPARATE requires required_action_tier == TERMINATION_REVIEW and drives Driver -> TERMINATED, lowering Terminal.active_driver_count"

  # ---- Crash --------------------------------------------------------------
  - method: POST
    path: "/crashes"
    description: Crash notification intake.
    roles: [Dispatcher, SafetyAdmin]
    code: 201
    input: [driver_id, terminal_id, occurred_at, notified_at, location_text, severity, route_class, tow_away, tow_reason, injury_transported_count, fatality_count, hazmat_release, mechanical_factor, third_party_at_fault]
    output: Crash
    side_effects:
      - "runs calculations.crash_recordability, freezing dot_recordable, recordability_codes, report_due_at and the initial reporting_status"
      - "preventability_status starts at REPORTED, evidence_posture at PARTIAL, appeals_exhausted at false"
  - method: GET
    path: "/crashes/{id}"
    description: Reads one crash with evidence posture re-derived at response time.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: []
    output: Crash
    side_effects:
      - "re-derives calculations.crash_evidence_posture"
  - method: GET
    path: "/crashes"
    description: Lists crashes with the analytics grouping keys as filters.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["driver_id?", "terminal_id?", "preventability_status?", "reporting_status?", "route_class?", "severity?", "limit?", "offset?"]
    output: Crash[]
    side_effects: []
  - method: POST
    path: "/crashes/{id}/driver-statements"
    description: "The involved driver's own account of the crash. Append-only; the acting X-User-ID must be the crash's driver_id."
    roles: [Driver]
    code: 201
    input: ["narrative", "conditions_note?", "attested"]
    output: DriverStatement
    side_effects:
      - "sets submitted_by_driver_id from X-User-ID and submitted_at from the logical clock"
      - "satisfies the ERR_DRIVER_STATEMENT_REQUIRED precondition of POST /review-cases"
  - method: GET
    path: "/crashes/{id}/driver-statements"
    description: "Reverse-reachability read for DriverStatement.crash_id; 0 or 1 rows in practice."
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: DriverStatement[]
    side_effects: []
  - method: POST
    path: "/crashes/{id}/evidence-items"
    description: Requests preservation of a telematics, camera or ELD artifact covering the crash instant.
    roles: [Dispatcher, SafetyAdmin]
    code: 201
    input: ["kind", "source_device_id", "window_start_at", "window_end_at", "retention_deadline_at", "evidence_hash?"]
    output: EvidenceItem
    side_effects:
      - "preservation_state starts at REQUESTED"
      - "rejects a window that overlaps an existing non-purged item of the same kind on the same crash (ERR_EVIDENCE_WINDOW_CONFLICT); adjacent windows that merely touch are accepted"
  - method: GET
    path: "/crashes/{id}/evidence-items"
    description: "Reverse-reachability read for EvidenceItem.crash_id."
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["kind?", "preservation_state?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/crashes/{id}/regulatory-report"
    description: Records the regulatory filing for a DOT-recordable crash; timeliness is judged against report_due_at.
    roles: [SafetyManager]
    code: 200
    input: [filing_reference]
    output: Crash
    side_effects:
      - "drives Crash.reporting_status PENDING_FILING -> FILED when current_utc <= report_due_at, or -> LATE_FILED otherwise"
      - "a LATE_FILED outcome raises Terminal.late_filing_count on next read"

  # ---- EvidenceItem -------------------------------------------------------
  - method: GET
    path: "/evidence-items/{id}"
    description: Reads one evidence item.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: GET
    path: "/evidence-items"
    description: Lists evidence items.
    roles: [SafetyAdmin, SafetyManager, Dispatcher, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["crash_id?", "kind?", "preservation_state?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/evidence-items/{id}/preserve"
    description: Places the artifact under litigation hold in the immutable store.
    roles: [Dispatcher, SafetyAdmin]
    code: 200
    input: [preserved_copy_uri, evidence_hash]
    output: EvidenceItem
    side_effects:
      - "REQUESTED -> PRESERVED; refused after retention_deadline_at (ERR_RETENTION_DEADLINE_PASSED)"
      - "re-derives Crash.evidence_posture, which can unblock POST /review-cases/{id}/decide and can move Claim.litigation_risk_score"
  - method: POST
    path: "/evidence-items/{id}/purge"
    description: "Purges the artifact. Branches on the current state: a never-preserved item becomes PURGED_BEFORE_HOLD (spoliation), a preserved item becomes RELEASED and only once the litigation hold has lifted."
    roles: [SafetyAdmin]
    code: 200
    input: [purge_reason]
    output: EvidenceItem
    side_effects:
      - "REQUESTED -> PURGED_BEFORE_HOLD forces Crash.evidence_posture to COMPROMISED, which flips the preventability variant to WEIGHTED_CRITERIA and raises Claim.litigation_risk_score by RISK_EVIDENCE_COMPROMISED - RISK_EVIDENCE_PARTIAL"
      - "PRESERVED -> RELEASED is refused while the crash's Claim is open (ERR_LITIGATION_HOLD_ACTIVE)"

  # ---- ReviewCase / CommitteeVote -----------------------------------------
  - method: POST
    path: "/review-cases"
    description: Opens a safety-review committee case on a crash and moves the crash under review.
    roles: [SafetyManager]
    code: 201
    input: [crash_id, committee_name, "statement_waiver_reason?"]
    output: ReviewCase
    side_effects:
      - "at most one case per crash (ERR_REVIEW_CASE_EXISTS); requires a DriverStatement unless statement_waiver_reason is supplied"
      - "Crash.preventability_status REPORTED -> UNDER_REVIEW"
  - method: GET
    path: "/review-cases/{id}"
    description: Reads one review case with the live ballot tally re-derived at response time.
    roles: [SafetyAdmin, SafetyManager, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: []
    output: ReviewCase
    side_effects:
      - "re-derives active_vote_count and abstain_count from the non-superseded ballots"
  - method: GET
    path: "/review-cases"
    description: "Lists review cases; also the reverse-reachability read for ReviewCase.crash_id and ReviewCase.appeal_evidence_item_id."
    roles: [SafetyAdmin, SafetyManager, CommitteeMember, ClaimsAdjuster, ClaimsManager, Auditor]
    code: 200
    input: ["crash_id?", "appeal_evidence_item_id?", "status?", "determination?", "limit?", "offset?"]
    output: ReviewCase[]
    side_effects: []
  - method: POST
    path: "/review-cases/{id}/open-deliberation"
    description: Seats the committee and opens balloting; requires at least one preserved evidence item.
    roles: [SafetyManager]
    code: 200
    input: []
    output: ReviewCase
    side_effects:
      - "DRAFT -> DELIBERATION; refused with ERR_NO_PRESERVED_EVIDENCE when nothing is preserved yet"
      - "bumps ReviewCase.version, which is the version a first ballot must quote"
  - method: POST
    path: "/review-cases/{id}/votes"
    description: "Casts one committee member's ballot with the five criterion scores. Returns the updated ReviewCase so the next voter can chain its version; the created CommitteeVote is discoverable only through GET /review-cases/{id}/votes."
    roles: [CommitteeMember]
    code: 201
    input: [expected_review_case_version, vote, "criterion_scores?", "comment?"]
    output: ReviewCase
    side_effects:
      - "OCC: expected_review_case_version must equal ReviewCase.version (ERR_REVIEW_CASE_VERSION_STALE, 412)"
      - "creates a CommitteeVote with sequence_number from next_vote_sequence, member_user_id from X-User-ID, and weighted_member_score from calculations.preventability_determination step 1"
      - "supersedes any earlier non-superseded ballot from the same member_user_id on this case"
  - method: GET
    path: "/review-cases/{id}/votes"
    description: "Reverse-reachability read for CommitteeVote.review_case_id; the only channel that exposes cascade-created ballots."
    roles: [SafetyAdmin, SafetyManager, CommitteeMember, Auditor]
    code: 200
    input: ["vote?", "superseded?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []
  - method: POST
    path: "/review-cases/{id}/decide"
    description: "Records the committee's preventability determination. Branches to DECIDED or CLOSED_FINAL on appeal_round, and selects the WEIGHTED_CRITERIA or UNWEIGHTED_MAJORITY variant on the crash's evidence posture."
    roles: [SafetyManager]
    code: 200
    input: []
    output: ReviewCase
    side_effects:
      - "segregation of duties: the deciding X-User-ID may not be a non-superseded balloting member (ERR_SEGREGATION_OF_DUTIES, 403)"
      - "requires COMMITTEE_QUORUM_MIN non-ABSTAIN ballots (ERR_QUORUM_NOT_MET) and evidence_posture IN {COMPLETE, COMPROMISED} (ERR_EVIDENCE_POSTURE_INSUFFICIENT, checked first)"
      - "CASCADE A: ReviewCase -> DECIDED/CLOSED_FINAL, Crash.preventability_status -> PREVENTABLE/NON_PREVENTABLE, Driver.preventable_points and required_action_tier re-derived, Terminal.preventable_crash_count / crash_rate_per_million_miles / risk_tier re-derived"
      - "on the CLOSED_FINAL branch additionally sets Crash.appeals_exhausted = true"
  - method: POST
    path: "/review-cases/{id}/appeal"
    description: "Grants an appeal of a recorded determination, returning the case to deliberation and unwinding every consequence of the vacated determination."
    roles: [SafetyManager]
    code: 200
    input: [appeal_grounds, appeal_grounds_code, "appeal_evidence_item_id?"]
    output: ReviewCase
    side_effects:
      - "segregation of duties: the granting X-User-ID may not be ReviewCase.decided_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
      - "window: current_utc <= decided_at + APPEAL_WINDOW_DAYS (ERR_APPEAL_WINDOW_CLOSED); capped at APPEAL_MAX_ROUNDS (ERR_APPEALS_EXHAUSTED)"
      - "COMPENSATION: DECIDED -> DELIBERATION, determination -> PENDING, Crash.preventability_status -> UNDER_REVIEW, Driver.preventable_points restored, Driver.status returned to ACTIVE where applicable, every ISSUED DisciplinaryAction on the crash -> VOIDED, Terminal counters restored"

  # ---- PolicyLayer --------------------------------------------------------
  - method: POST
    path: "/policy-layers"
    description: "Declares one layer of the insurance program tower for a program year (layer_index 1 is the self-insured retention)."
    roles: [ClaimsManager, SafetyAdmin]
    code: 201
    input: [program_year, layer_index, layer_type, attachment_point_cents, limit_cents, insurer_name]
    output: PolicyLayer
    side_effects:
      - "layer_index is unique per program_year (ERR_POLICY_LAYER_DUPLICATE)"
      - "structure is validated on write: index 1 must be SIR with attachment 0, and attachment_point_cents must equal the sum of the limits below it (ERR_POLICY_TOWER_MALFORMED)"
  - method: GET
    path: "/policy-layers/{id}"
    description: Reads one declared layer of a program-year tower.
    roles: [ClaimsManager, ClaimsAdjuster, SafetyAdmin, Auditor]
    code: 200
    input: []
    output: PolicyLayer
    side_effects: []
  - method: GET
    path: "/policy-layers"
    description: Lists the program tower, ascending by program_year then layer_index.
    roles: [ClaimsManager, ClaimsAdjuster, SafetyAdmin, Auditor]
    code: 200
    input: ["program_year?", "layer_type?", "limit?", "offset?"]
    output: PolicyLayer[]
    side_effects: []

  # ---- Claim --------------------------------------------------------------
  - method: POST
    path: "/claims"
    description: Opens a liability claim on a crash with a provisional reserve.
    roles: [ClaimsAdjuster]
    code: 201
    input: [crash_id, claimant_notice_date, "adjuster_note?"]
    output: Claim
    side_effects:
      - "at most one claim per crash (ERR_CLAIM_EXISTS)"
      - "runs calculations.litigation_risk_score then calculations.claim_reserve variant provisional_at_setup, freezing provisional_reserve_cents and seeding outstanding_reserve_cents"
      - "handling_status starts at SETUP, reserve_status at PROVISIONAL"
  - method: GET
    path: "/claims/{id}"
    description: Reads one claim with litigation risk, total incurred and the conserved exposure quantity re-derived at response time.
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "re-derives litigation_risk_score, litigation_risk_multiplier, counsel_required, total_incurred_cents and claim_exposure_cents"
  - method: GET
    path: "/claims"
    description: "Lists claims; also the reverse-reachability read for Claim.crash_id."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: ["crash_id?", "handling_status?", "reserve_status?", "counsel_required?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/reserve-revisions"
    description: "Re-estimates the case reserve. `basis` selects the calculations.claim_reserve variant: PROVISIONAL_REFRESH re-runs the severity estimate at the current multiplier, DEMAND_BASED re-bases it on the written demands."
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version, basis, "revision_note?"]
    output: Claim
    side_effects:
      - "OCC: expected_claim_version must equal Claim.version (ERR_CLAIM_VERSION_STALE, 412)"
      - "overwrites revised_reserve_cents and outstanding_reserve_cents; the only operation that changes claim_exposure_cents"
      - "reserve_status PROVISIONAL -> REVISED on the first revision"
  - method: POST
    path: "/claims/{id}/counsel-assignment"
    description: Assigns defence counsel to a claim whose litigation risk requires it.
    roles: [ClaimsManager]
    code: 200
    input: [counsel_firm_name, counsel_type]
    output: Claim
    side_effects:
      - "refused unless counsel_required is true (ERR_COUNSEL_NOT_REQUIRED)"
      - "sets counsel_assigned = true, counsel_assigned_at, litigation_flag = true; the EXPENSE_RATIO loading only enters the stored reserve on the NEXT reserve revision"
      - "unblocks offers on THIRD_PARTY_BODILY_INJURY demands of this claim"
  - method: POST
    path: "/claims/{id}/close"
    description: Closes the claim, releasing the residual reserve and lifting the litigation hold on the crash's evidence.
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "refused while any Demand is unsettled (ERR_OPEN_DEMANDS_REMAIN) or any SubrogationDemand is unresolved (ERR_OPEN_SUBROGATION_REMAINS)"
      - "handling_status -> CLOSED, reserve_status -> FINAL, outstanding_reserve_cents moved into reserve_released_cents with claim_exposure_cents unchanged"
      - "every SETTLED Demand -> CLOSED_PAID; PRESERVED EvidenceItems of the crash become releasable"
  - method: POST
    path: "/claims/{id}/demands"
    description: Records a third-party demand (property damage or bodily injury) against the claim.
    roles: [ClaimsAdjuster]
    code: 201
    input: [claimant_name, claimant_type, demand_amount_cents, represented_by_counsel, demand_received_at]
    output: Demand
    side_effects:
      - "Claim.handling_status SETUP -> NEGOTIATION on the first demand"
      - "a represented THIRD_PARTY_BODILY_INJURY demand raises Claim.litigation_risk_score by RISK_REPRESENTED_BI_DEMAND on next read"
  - method: GET
    path: "/claims/{id}/demands"
    description: "Reverse-reachability read for Demand.claim_id."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: ["status?", "claimant_type?", "limit?", "offset?"]
    output: Demand[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/subrogation-demands"
    description: Opens a recovery claim against an at-fault third party; only permitted when the crash alleges third-party fault.
    roles: [ClaimsManager, ClaimsAdjuster]
    code: 201
    input: [third_party_name, at_fault_percentage, basis_note]
    output: SubrogationDemand
    side_effects:
      - "refused when Crash.third_party_at_fault is false (ERR_NO_THIRD_PARTY_AT_FAULT)"
      - "starts in DRAFT with recoverable_base_cents and max_recoverable_cents null until the claim's settlements complete"
  - method: GET
    path: "/claims/{id}/subrogation-demands"
    description: "Reverse-reachability read for SubrogationDemand.claim_id."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyAdmin, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SubrogationDemand[]
    side_effects: []

  # ---- Demand / NegotiationRound ------------------------------------------
  - method: GET
    path: "/demands/{id}"
    description: Reads one third-party demand with its settlement figures.
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: []
    output: Demand
    side_effects:
      - "re-derives round_count from the negotiation ledger"
  - method: GET
    path: "/demands"
    description: "Lists demands; also the reverse-reachability read for Demand.claim_id."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: ["claim_id?", "status?", "claimant_type?", "represented_by_counsel?", "limit?", "offset?"]
    output: Demand[]
    side_effects: []
  - method: POST
    path: "/demands/{id}/offers"
    description: "Opens a new negotiation round with the carrier's offer. Supersedes the previous round; offers must strictly increase and may not exceed the demand."
    roles: [ClaimsAdjuster]
    code: 201
    input: [carrier_offer_cents]
    output: NegotiationRound
    side_effects:
      - "refused on a THIRD_PARTY_BODILY_INJURY demand whose Claim.counsel_required is true while counsel is unassigned (ERR_COUNSEL_REQUIRED)"
      - "Demand.status -> OFFER_OUTSTANDING; next_round_index increments; the previous standing round's outcome -> SUPERSEDED"
  - method: POST
    path: "/demands/{id}/counters"
    description: Records the claimant's counter against the standing round.
    roles: [ClaimsAdjuster]
    code: 200
    input: [claimant_counter_cents]
    output: NegotiationRound
    side_effects:
      - "counters must strictly exceed the standing offer and may not exceed the previous counter (ERR_COUNTER_NOT_MONOTONIC)"
      - "sets claimant_counter_cents, gap_cents, countered_at and outcome COUNTERED on the standing round; Demand.status -> COUNTER_OUTSTANDING"
  - method: GET
    path: "/demands/{id}/negotiation-rounds"
    description: "Reverse-reachability read for NegotiationRound.demand_id; ascending by round_index."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyManager, SafetyAdmin, Auditor]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []
  - method: POST
    path: "/demands/{id}/settle"
    description: "Settles the demand at the standing carrier offer, computes ALAE and allocates the settlement across the policy tower."
    roles: [ClaimsManager]
    code: 200
    input: [settlement_reference]
    output: Demand
    side_effects:
      - "runs calculations.settlement_layer_waterfall; refuses the whole settlement with ERR_COVERAGE_EXHAUSTED when the tower lacks capacity"
      - "CASCADE B: Demand -> SETTLED, standing round -> ACCEPTED, Claim paid buckets / layer_allocations / outstanding reserve updated, Claim.handling_status -> NEGOTIATION or SETTLEMENT_COMPLETE, and on SETTLEMENT_COMPLETE every DRAFT SubrogationDemand -> READY_TO_PURSUE with its recovery base frozen"
  - method: POST
    path: "/demands/{id}/rescind-settlement"
    description: "Rescinds a settlement inside the RESCISSION_WINDOW_HOURS window, restoring every consequence with no ledger drift."
    roles: [ClaimsManager]
    code: 200
    input: [rescission_reason]
    output: Demand
    side_effects:
      - "refused outside the 168-hour window (ERR_RESCISSION_WINDOW_CLOSED) or once the claim is CLOSED"
      - "COMPENSATION: Demand -> OFFER_OUTSTANDING with rescission_count += 1, standing round -> OPEN, Claim paid buckets and layer capacity restored with claim_exposure_cents unchanged, READY_TO_PURSUE SubrogationDemands returned to DRAFT"

  # ---- DisciplinaryAction -------------------------------------------------
  - method: POST
    path: "/disciplinary-actions"
    description: "Issues a disciplinary action arising from a crash determined PREVENTABLE; the action tier may not be lighter than the driver's required tier."
    roles: [SafetyManager]
    code: 201
    input: [driver_id, crash_id, action_type, action_note, "suspension_start_at?", "suspension_end_at?", "retraining_course_code?", "override_reason?"]
    output: DisciplinaryAction
    side_effects:
      - "refused unless Crash.preventability_status == PREVENTABLE (ERR_CRASH_NOT_PREVENTABLE) and driver_id == Crash.driver_id (ERR_DRIVER_CRASH_MISMATCH)"
      - "refused when action_type is lighter than Driver.required_action_tier (ERR_ACTION_TIER_INSUFFICIENT), when the suspension window conflicts with an existing one (ERR_SUSPENSION_WINDOW_CONFLICT), or when the terminal's staffing_posture is CRITICAL without an override_reason (ERR_STAFFING_OVERRIDE_REQUIRED)"
      - "drives Driver -> RETRAINING_REQUIRED or SUSPENDED_PENDING_ACTION, which raises Terminal.suspended_driver_count and can move Terminal.staffing_posture"
  - method: GET
    path: "/disciplinary-actions/{id}"
    description: Reads one disciplinary action.
    roles: [SafetyAdmin, SafetyManager, Auditor]
    code: 200
    input: []
    output: DisciplinaryAction
    side_effects: []
  - method: GET
    path: "/disciplinary-actions"
    description: "Lists disciplinary actions; also the reverse-reachability read for DisciplinaryAction.driver_id and DisciplinaryAction.crash_id."
    roles: [SafetyAdmin, SafetyManager, Auditor]
    code: 200
    input: ["driver_id?", "crash_id?", "status?", "action_type?", "retraining_status?", "limit?", "offset?"]
    output: DisciplinaryAction[]
    side_effects: []
  - method: POST
    path: "/disciplinary-actions/{id}/complete-retraining"
    description: "Records completion of the required retraining, returning the driver to duty when nothing else is pending."
    roles: [SafetyAdmin]
    code: 200
    input: ["completion_note?"]
    output: DisciplinaryAction
    side_effects:
      - "refused unless retraining_status == PENDING, and for a SUSPENSION refused before suspension_end_at has elapsed (ERR_SUSPENSION_NOT_ELAPSED)"
      - "ISSUED -> COMPLETED with retraining_status COMPLETED; Driver returns to ACTIVE when no other pending action remains, restoring the terminal headcounts"

  # ---- SubrogationDemand --------------------------------------------------
  - method: GET
    path: "/subrogation-demands/{id}"
    description: Reads one subrogation demand with its frozen recovery ceiling.
    roles: [ClaimsAdjuster, ClaimsManager, SafetyAdmin, Auditor]
    code: 200
    input: []
    output: SubrogationDemand
    side_effects: []
  - method: GET
    path: "/subrogation-demands"
    description: "Lists subrogation demands; also the reverse-reachability read for SubrogationDemand.claim_id."
    roles: [ClaimsAdjuster, ClaimsManager, SafetyAdmin, Auditor]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: SubrogationDemand[]
    side_effects: []
  - method: POST
    path: "/subrogation-demands/{id}/resolve"
    description: "Resolves the recovery attempt as RECOVERED, DENIED or WRITTEN_OFF."
    roles: [ClaimsManager]
    code: 200
    input: [resolution, "recovered_amount_cents?", resolution_note]
    output: SubrogationDemand
    side_effects:
      - "only from READY_TO_PURSUE; recovered_amount_cents is required for RECOVERED, forbidden otherwise, and capped at max_recoverable_cents (ERR_RECOVERY_EXCEEDS_BASE)"
      - "a recovery raises Claim.subrogation_recovered_cents and lowers Claim.total_incurred_cents without touching Claim.claim_exposure_cents"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
# Every code below is reachable from an empty database using only §1.5
# endpoints. Bodies always follow the §1.0 error envelope:
# { "meta": {...}, "response_type": "error", "data": { "error_id": ..., "message": ... } }
errors:
  # ---- auth ---------------------------------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-ID or X-User-Role missing, empty, or naming an undeclared role"
    triggered_by: "any endpoint"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    when: "the supplied role is not in the endpoint's roles list, or a Driver acts on a crash that is not his own"
    triggered_by: "any endpoint; e.g. POST /review-cases/{id}/decide as ClaimsAdjuster"
  # ---- request shape ------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "malformed JSON, unknown field, missing required input, wrong type, out-of-domain enum, out-of-range number, bad pagination bounds, or a violated conditional-shape rule (criterion_scores with ABSTAIN, suspension window on a non-SUSPENSION action, recovered_amount_cents on a DENIED resolution, ...)"
    triggered_by: "any endpoint"
  # ---- existence ----------------------------------------------------------
  - error_id: ERR_TERMINAL_NOT_FOUND
    http_status: 404
    when: "the path or body terminal_id does not resolve"
    triggered_by: "GET /terminals/{id}, GET /terminals/{id}/crash-analytics, POST /drivers, POST /crashes"
  - error_id: ERR_DRIVER_NOT_FOUND
    http_status: 404
    when: "the path or body driver_id does not resolve"
    triggered_by: "GET /drivers/{id}, POST /drivers/{id}/employment-decision, POST /crashes, POST /disciplinary-actions"
  - error_id: ERR_CRASH_NOT_FOUND
    http_status: 404
    when: "the path or body crash_id does not resolve"
    triggered_by: "GET /crashes/{id}, POST /crashes/{id}/evidence-items, POST /review-cases, POST /claims, POST /disciplinary-actions"
  - error_id: ERR_EVIDENCE_ITEM_NOT_FOUND
    http_status: 404
    when: "the path id or appeal_evidence_item_id does not resolve"
    triggered_by: "GET /evidence-items/{id}, POST /evidence-items/{id}/preserve, POST /evidence-items/{id}/purge, POST /review-cases/{id}/appeal"
  - error_id: ERR_REVIEW_CASE_NOT_FOUND
    http_status: 404
    when: "the path review case id does not resolve"
    triggered_by: "GET /review-cases/{id} and every /review-cases/{id}/* action"
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    when: "the path claim id does not resolve"
    triggered_by: "GET /claims/{id} and every /claims/{id}/* action"
  - error_id: ERR_POLICY_LAYER_NOT_FOUND
    http_status: 404
    when: "a referenced policy layer does not resolve"
    triggered_by: "internal waterfall lookups surfaced through POST /demands/{id}/settle"
  - error_id: ERR_DEMAND_NOT_FOUND
    http_status: 404
    when: "the path demand id does not resolve"
    triggered_by: "GET /demands/{id} and every /demands/{id}/* action"
  - error_id: ERR_DISCIPLINARY_ACTION_NOT_FOUND
    http_status: 404
    when: "the path disciplinary action id does not resolve"
    triggered_by: "GET /disciplinary-actions/{id}, POST /disciplinary-actions/{id}/complete-retraining"
  - error_id: ERR_SUBROGATION_DEMAND_NOT_FOUND
    http_status: 404
    when: "the path subrogation demand id does not resolve"
    triggered_by: "GET /subrogation-demands/{id}, POST /subrogation-demands/{id}/resolve"
  # ---- state --------------------------------------------------------------
  - error_id: ERR_CRASH_STATE_INVALID
    http_status: 409
    when: "the crash is not in a state that permits the operation (a second review case, a regulatory report on a non-recordable or already-filed crash)"
    triggered_by: "POST /review-cases, POST /crashes/{id}/regulatory-report"
  - error_id: ERR_EVIDENCE_ITEM_STATE_INVALID
    http_status: 409
    when: "preserving a non-REQUESTED item, or purging an already PURGED_BEFORE_HOLD / RELEASED item"
    triggered_by: "POST /evidence-items/{id}/preserve, POST /evidence-items/{id}/purge"
  - error_id: ERR_REVIEW_CASE_STATE_INVALID
    http_status: 409
    when: "voting on a DRAFT or DECIDED case, deciding a case not in DELIBERATION, opening deliberation twice, or appealing a case not in DECIDED"
    triggered_by: "every /review-cases/{id}/* action"
  - error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    when: "any write against a CLOSED claim, or closing an already CLOSED claim"
    triggered_by: "every /claims/{id}/* action"
  - error_id: ERR_DEMAND_STATE_INVALID
    http_status: 409
    when: "settling a demand that is not OFFER_OUTSTANDING (including a COUNTER_OUTSTANDING or already SETTLED demand), countering when no offer stands, or rescinding a demand that is not SETTLED"
    triggered_by: "POST /demands/{id}/settle, POST /demands/{id}/counters, POST /demands/{id}/rescind-settlement"
  - error_id: ERR_DRIVER_STATE_INVALID
    http_status: 409
    when: "any action on a TERMINATED driver"
    triggered_by: "POST /drivers/{id}/employment-decision, POST /disciplinary-actions"
  - error_id: ERR_DISCIPLINARY_ACTION_STATE_INVALID
    http_status: 409
    when: "completing retraining on an action that is already COMPLETED or VOIDED"
    triggered_by: "POST /disciplinary-actions/{id}/complete-retraining"
  - error_id: ERR_SUBROGATION_DEMAND_STATE_INVALID
    http_status: 409
    when: "resolving a subrogation demand that is still DRAFT or already resolved"
    triggered_by: "POST /subrogation-demands/{id}/resolve"
  - error_id: ERR_APPEALS_EXHAUSTED
    http_status: 409
    when: "Crash.appeals_exhausted is true or ReviewCase.appeal_round has reached APPEAL_MAX_ROUNDS (1)"
    triggered_by: "POST /review-cases/{id}/appeal"
  # ---- segregation of duties and OCC --------------------------------------
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "the deciding X-User-ID cast a non-superseded ballot on the case, or the appealing X-User-ID is the case's decided_by_user_id"
    triggered_by: "POST /review-cases/{id}/decide, POST /review-cases/{id}/appeal"
  - error_id: ERR_CLAIM_VERSION_STALE
    http_status: 412
    when: "expected_claim_version != Claim.version"
    triggered_by: "POST /claims/{id}/reserve-revisions"
  - error_id: ERR_REVIEW_CASE_VERSION_STALE
    http_status: 412
    when: "expected_review_case_version != ReviewCase.version"
    triggered_by: "POST /review-cases/{id}/votes"
  # ---- business_safety ----------------------------------------------------
  - error_id: ERR_EVIDENCE_POSTURE_INSUFFICIENT
    http_status: 409
    when: "the crash's evidence_posture is PARTIAL at decide time"
    triggered_by: "POST /review-cases/{id}/decide"
  - error_id: ERR_NO_PRESERVED_EVIDENCE
    http_status: 409
    when: "no EvidenceItem of the crash is PRESERVED"
    triggered_by: "POST /review-cases/{id}/open-deliberation"
  - error_id: ERR_RETENTION_DEADLINE_PASSED
    http_status: 409
    when: "current_utc > EvidenceItem.retention_deadline_at"
    triggered_by: "POST /evidence-items/{id}/preserve"
  - error_id: ERR_LITIGATION_HOLD_ACTIVE
    http_status: 409
    when: "releasing preserved evidence while the crash's Claim is not CLOSED"
    triggered_by: "POST /evidence-items/{id}/purge"
  - error_id: ERR_RETRAINING_INCOMPLETE
    http_status: 409
    when: "a CONTINUE decision while an ISSUED DisciplinaryAction of the driver still has retraining_status PENDING"
    triggered_by: "POST /drivers/{id}/employment-decision"
  - error_id: ERR_SEPARATION_NOT_SUPPORTED
    http_status: 409
    when: "a SEPARATE decision while Driver.required_action_tier != TERMINATION_REVIEW"
    triggered_by: "POST /drivers/{id}/employment-decision"
  - error_id: ERR_STATEMENT_NOT_ATTESTED
    http_status: 409
    when: "a driver statement is submitted with attested false"
    triggered_by: "POST /crashes/{id}/driver-statements"
  # ---- business_temporal --------------------------------------------------
  - error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    when: "current_utc > ReviewCase.decided_at + APPEAL_WINDOW_DAYS (14 days)"
    triggered_by: "POST /review-cases/{id}/appeal"
  - error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409
    when: "current_utc > Demand.settled_at + RESCISSION_WINDOW_HOURS (168 hours)"
    triggered_by: "POST /demands/{id}/rescind-settlement"
  - error_id: ERR_SUSPENSION_NOT_ELAPSED
    http_status: 409
    when: "completing retraining on a SUSPENSION before suspension_end_at has passed"
    triggered_by: "POST /disciplinary-actions/{id}/complete-retraining"
  - error_id: ERR_SUSPENSION_WINDOW_CONFLICT
    http_status: 409
    when: "the requested suspension window overlaps, or falls inside the SUSPENSION_BUFFER_HOURS separation of, an existing non-VOIDED suspension of the same driver"
    triggered_by: "POST /disciplinary-actions"
  - error_id: ERR_EVIDENCE_WINDOW_CONFLICT
    http_status: 409
    when: "window_start_at >= window_end_at, retention_deadline_at <= current_utc, or an overlapping non-purged item of the same kind already exists on the crash"
    triggered_by: "POST /crashes/{id}/evidence-items"
  - error_id: ERR_FUTURE_TIMESTAMP
    http_status: 409
    when: "occurred_at, notified_at or demand_received_at is after current_utc, or notified_at precedes occurred_at"
    triggered_by: "POST /crashes, POST /claims/{id}/demands"
  # ---- business_referential ----------------------------------------------
  - error_id: ERR_TERMINAL_CODE_DUPLICATE
    http_status: 409
    when: "terminal_code already exists"
    triggered_by: "POST /terminals"
  - error_id: ERR_EMPLOYEE_CODE_DUPLICATE
    http_status: 409
    when: "employee_code already exists within the same terminal_id"
    triggered_by: "POST /drivers"
  - error_id: ERR_POLICY_LAYER_DUPLICATE
    http_status: 409
    when: "layer_index already exists for that program_year"
    triggered_by: "POST /policy-layers"
  - error_id: ERR_REVIEW_CASE_EXISTS
    http_status: 409
    when: "the crash already has a ReviewCase"
    triggered_by: "POST /review-cases"
  - error_id: ERR_CLAIM_EXISTS
    http_status: 409
    when: "the crash already has a Claim"
    triggered_by: "POST /claims"
  - error_id: ERR_DRIVER_STATEMENT_REQUIRED
    http_status: 409
    when: "no DriverStatement exists for the crash and no statement_waiver_reason was supplied"
    triggered_by: "POST /review-cases"
  - error_id: ERR_DRIVER_CRASH_MISMATCH
    http_status: 409
    when: "the supplied driver_id is not the referenced Crash.driver_id"
    triggered_by: "POST /disciplinary-actions"
  - error_id: ERR_CRASH_NOT_PREVENTABLE
    http_status: 409
    when: "issuing discipline on a crash whose preventability_status is not PREVENTABLE"
    triggered_by: "POST /disciplinary-actions"
  - error_id: ERR_NO_THIRD_PARTY_AT_FAULT
    http_status: 409
    when: "opening a subrogation demand on a claim whose Crash.third_party_at_fault is false"
    triggered_by: "POST /claims/{id}/subrogation-demands"
  - error_id: ERR_APPEAL_EVIDENCE_INVALID
    http_status: 409
    when: "a NEW_EVIDENCE appeal cites an evidence item belonging to another crash or one that is not PRESERVED"
    triggered_by: "POST /review-cases/{id}/appeal"
  - error_id: ERR_POLICY_TOWER_MALFORMED
    http_status: 409
    when: "the program year's tower is not a contiguous ladder starting with an SIR at attachment 0 whose attachment points equal the cumulative limits below"
    triggered_by: "POST /policy-layers, POST /demands/{id}/settle"
  # ---- business_constraint -----------------------------------------------
  - error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    when: "fewer than COMMITTEE_QUORUM_MIN (3) non-superseded non-ABSTAIN ballots exist"
    triggered_by: "POST /review-cases/{id}/decide"
  - error_id: ERR_OFFER_NOT_MONOTONIC
    http_status: 422
    when: "carrier_offer_cents is not strictly greater than the standing round's offer"
    triggered_by: "POST /demands/{id}/offers"
  - error_id: ERR_OFFER_EXCEEDS_DEMAND
    http_status: 422
    when: "carrier_offer_cents > Demand.demand_amount_cents"
    triggered_by: "POST /demands/{id}/offers"
  - error_id: ERR_COUNTER_NOT_MONOTONIC
    http_status: 422
    when: "claimant_counter_cents <= the standing offer, or greater than the previous counter"
    triggered_by: "POST /demands/{id}/counters"
  - error_id: ERR_ACTION_TIER_INSUFFICIENT
    http_status: 422
    when: "ordinal(action_type) < ordinal(Driver.required_action_tier)"
    triggered_by: "POST /disciplinary-actions"
  - error_id: ERR_STAFFING_OVERRIDE_REQUIRED
    http_status: 422
    when: "a SUSPENSION is issued while the driver's Terminal.staffing_posture is CRITICAL and override_reason is absent"
    triggered_by: "POST /disciplinary-actions"
  - error_id: ERR_COUNSEL_REQUIRED
    http_status: 422
    when: "an offer is made on a THIRD_PARTY_BODILY_INJURY demand whose Claim.counsel_required is true while counsel is unassigned"
    triggered_by: "POST /demands/{id}/offers"
  - error_id: ERR_COUNSEL_NOT_REQUIRED
    http_status: 422
    when: "counsel is assigned to a claim whose counsel_required is false"
    triggered_by: "POST /claims/{id}/counsel-assignment"
  - error_id: ERR_NO_DEMANDS_TO_WEIGHT
    http_status: 422
    when: "a DEMAND_BASED reserve revision is posted on a claim with no demands"
    triggered_by: "POST /claims/{id}/reserve-revisions"
  - error_id: ERR_OPEN_DEMANDS_REMAIN
    http_status: 422
    when: "closing a claim while a Demand is still DEMANDED, OFFER_OUTSTANDING or COUNTER_OUTSTANDING"
    triggered_by: "POST /claims/{id}/close"
  - error_id: ERR_OPEN_SUBROGATION_REMAINS
    http_status: 422
    when: "closing a claim while a SubrogationDemand is still DRAFT or READY_TO_PURSUE"
    triggered_by: "POST /claims/{id}/close"
  # ---- business_fiscal ----------------------------------------------------
  - error_id: ERR_COVERAGE_EXHAUSTED
    http_status: 422
    when: "settlement_total_cents exceeds the remaining capacity of the program year's policy tower, even by one cent"
    triggered_by: "POST /demands/{id}/settle"
  - error_id: ERR_RECOVERY_EXCEEDS_BASE
    http_status: 422
    when: "recovered_amount_cents > SubrogationDemand.max_recoverable_cents or <= 0"
    triggered_by: "POST /subrogation-demands/{id}/resolve"
  - error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    when: "settlement_total_cents exceeds Claim.outstanding_reserve_cents; the file must be re-reserved (POST /claims/{id}/reserve-revisions) before the payment can be made"
    triggered_by: "POST /demands/{id}/settle"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# Blended segregation_of_duties + peer_roles. Two peer families own disjoint
# resource sets: the safety family (SafetyAdmin, Dispatcher, Driver,
# CommitteeMember, SafetyManager) and the claims family (ClaimsAdjuster,
# ClaimsManager), with Auditor as a read-only observer across both. Within the
# safety family two same-user prohibitions apply (see ERR_SEGREGATION_OF_DUTIES):
#   * the X-User-ID that decides a case may not have cast a live ballot on it;
#   * the X-User-ID that grants an appeal may not be the one that decided.
roles:
  - name: SafetyAdmin
    description: "Fleet safety administrator: maintains terminals and drivers, moves the logical clock, manages evidence custody and records retraining completion."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /terminals"
      - "POST /drivers"
      - "POST /evidence-items/{id}/purge"
      - "POST /disciplinary-actions/{id}/complete-retraining"
    shared_operations:
      - "POST /crashes (with Dispatcher)"
      - "POST /crashes/{id}/evidence-items (with Dispatcher)"
      - "POST /evidence-items/{id}/preserve (with Dispatcher)"
      - "POST /policy-layers (with ClaimsManager)"
      - "every GET on terminals, drivers, crashes, evidence items, review cases, votes, claims, demands, negotiation rounds, disciplinary actions, subrogation demands, policy layers and crash-analytics"

  - name: Dispatcher
    description: "Terminal dispatcher: takes the crash notification and requests preservation of telematics and camera evidence."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /crashes (with SafetyAdmin)"
      - "POST /crashes/{id}/evidence-items (with SafetyAdmin)"
      - "POST /evidence-items/{id}/preserve (with SafetyAdmin)"
      - "GET on terminals, drivers, crashes, driver statements, evidence items, demands, negotiation rounds"

  - name: Driver
    description: "The involved commercial driver; may file exactly one statement about his own crash and nothing else."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /crashes/{id}/driver-statements (X-User-ID MUST equal the crash's driver_id; any other driver is ERR_UNAUTHORIZED)"
    shared_operations: []

  - name: CommitteeMember
    description: "Seated member of the safety review committee; casts one live ballot per case with the five criterion scores."
    identity: opaque
    exclusive_operations:
      - "POST /review-cases/{id}/votes"
    shared_operations:
      - "GET on drivers, crashes, driver statements, evidence items, review cases and votes"

  - name: SafetyManager
    description: "Safety manager: opens and chairs review cases, records determinations, grants appeals, files regulatory reports, issues discipline and makes continued-employment decisions."
    identity: opaque
    exclusive_operations:
      - "POST /review-cases"
      - "POST /review-cases/{id}/open-deliberation"
      - "POST /review-cases/{id}/decide"
      - "POST /review-cases/{id}/appeal"
      - "POST /crashes/{id}/regulatory-report"
      - "POST /disciplinary-actions"
      - "POST /drivers/{id}/employment-decision"
    shared_operations:
      - "GET on terminals, crash-analytics, drivers, crashes, evidence items, review cases, votes, claims, demands, negotiation rounds, disciplinary actions"
    segregation_of_duties:
      - "may not decide a case on which this same X-User-ID cast a non-superseded ballot as CommitteeMember"
      - "may not grant an appeal of a determination this same X-User-ID recorded"

  - name: ClaimsAdjuster
    description: "Liability adjuster: opens claims, revises reserves, records third-party demands and runs the negotiation ledger."
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{id}/reserve-revisions"
      - "POST /claims/{id}/demands"
      - "POST /demands/{id}/offers"
      - "POST /demands/{id}/counters"
    shared_operations:
      - "POST /claims/{id}/subrogation-demands (with ClaimsManager)"
      - "GET on terminals, drivers, crashes, evidence items, review cases, claims, demands, negotiation rounds, policy layers, subrogation demands"

  - name: ClaimsManager
    description: "Claims manager: holds settlement, rescission, closure, counsel and recovery authority, and maintains the policy tower."
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/counsel-assignment"
      - "POST /claims/{id}/close"
      - "POST /demands/{id}/settle"
      - "POST /demands/{id}/rescind-settlement"
      - "POST /subrogation-demands/{id}/resolve"
    shared_operations:
      - "POST /policy-layers (with SafetyAdmin)"
      - "POST /claims/{id}/subrogation-demands (with ClaimsAdjuster)"
      - "GET on terminals, drivers, crashes, review cases, claims, demands, negotiation rounds, policy layers, subrogation demands"

  - name: Auditor
    description: "Read-only compliance auditor with the widest read surface and no write authority anywhere."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint in §1.5, including GET /terminals/{id}/crash-analytics and GET /review-cases/{id}/votes"
