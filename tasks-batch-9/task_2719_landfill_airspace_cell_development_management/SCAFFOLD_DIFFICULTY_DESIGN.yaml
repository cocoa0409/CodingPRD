      - name: slot_capacity_outranks_daily_gallon_cap
        grounds:
          - validations[priority=19]
          - validations[priority=26]
          - calculations.leachate_slot_occupancy
          - entities.TreatmentAgreement.fields.concurrent_slot_capacity
          - entities.TreatmentAgreement.fields.daily_gallon_cap
        distinguishing_aspect: |
          A single POST /leachate-shipments breaches the temporal slot rule at priority 19
          (409) and the fiscal daily-gallon rule at priority 26 (422). Both are aggregate
          checks over the same shipment set, so an implementation that sums gallons before
          counting overlapping windows silently returns the wrong code. A control request
          moved outside every existing window isolates the priority-26 error, which proves the
          slot count — not the gallons — decided the first response.
