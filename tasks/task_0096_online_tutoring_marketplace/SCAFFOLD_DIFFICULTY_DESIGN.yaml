      - name: not_found_beats_invalid_state_on_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair existence vs state: confirming a non-existent session
          id returns ERR_SESSION_NOT_FOUND (404, priority 4), never ERR_INVALID_STATE
          (409, priority 6) — the path-existence check fires before any state check.
        test_recipe:
          setup:
            - "Empty DB except auth context; a random non-existent session id."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
