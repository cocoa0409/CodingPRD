# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Index)
# Temporary Fencing & Site Security Rental.
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no category is invented here.
# Every numeric literal in every `assert:` was produced by executing the
# matching §1.3 formula against its `constants:` (Decimal + ROUND_HALF_UP).
# Shared fixture world (identical to §1.8 so both files compose):
#   logical clock base 2026-08-01T00:00:00Z
#   Municipality "City of Harbor Point" / HRB-01, rental_tax_rate_bp 890,
#     permit_lead_time_days 5, max_concurrent_closure_linear_feet 800,
#     permit_review_rounds_allowed 2, allows_solid_wind_screen true
#   FenceProduct PANEL-CL-10 (FENCE_PANEL, panel_length_ft 10, rate 0,
#     replacement 24000, fleet_age_months 18, owned 400)
#   FenceProduct GATE-12 (GATE, 4500, 95000, age 6, owned 40)
#   FenceProduct BARR-8 (BARRICADE, 3250, 42000, age 30, owned 60)
#   FenceProduct WB-6 (WATER_BARRIER, 2200, 31000, age 12, owned 80)
#   Crew CRW-A / CRW-B, depot DEP-1, daily_capacity_hours 12.0
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_municipality_returns_every_declared_field
        claim_type: creation
        grounds:
          - endpoints.POST /fence-rentals/municipalities
          - entities.Municipality.fields.jurisdiction_code
          - entities.Municipality.fields.committed_closure_linear_feet
          - response_envelope.success
        distinguishing_aspect: |
          A municipality created with only its required inputs comes back with
          HTTP 201, every declared field present in one `data` object, the
          derived committed_closure_linear_feet seeded to 0 and version 1,
          inside the declared { meta, response_type, data } envelope.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and data is a single object, not an array"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "Municipality.${m1_id}.name == \"City of Harbor Point\""
            - "Municipality.${m1_id}.jurisdiction_code == \"HRB-01\""
            - "Municipality.${m1_id}.permit_lead_time_days == 5"
            - "Municipality.${m1_id}.max_concurrent_closure_linear_feet == 800"
            - "Municipality.${m1_id}.rental_tax_rate_bp == 890"
            - "Municipality.${m1_id}.permit_review_rounds_allowed == 2"
            - "Municipality.${m1_id}.allows_solid_wind_screen is true"
            - "Municipality.${m1_id}.committed_closure_linear_feet == 0"
            - "Municipality.${m1_id}.version == 1"

      - name: get_product_returns_stored_data_and_fleet_counters
        claim_type: retrieval
        grounds:
          - endpoints.GET /fence-rentals/products/{id}
          - entities.FenceProduct.fields.reserved_count
          - entities.FenceProduct.fields.deployed_count
          - entities.FenceProduct.fields.lost_count
        distinguishing_aspect: |
          A freshly registered product read back by id returns the stored
          commercial fields unchanged and all four fleet counters at their
          seeded values: available_count equals owned_count 400 while
          reserved_count, deployed_count, damaged_count and lost_count are 0.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One FENCE_PANEL product PANEL-CL-10 with owned_count 400 and nothing dispatched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { p_panel_id: "$.data.id" }
          trigger:
            - call: "GET /fence-rentals/products/${p_panel_id}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dc-001"
          assert:
            - "HTTP status is 200"
            - "FenceProduct.${p_panel_id}.code == \"PANEL-CL-10\""
            - "FenceProduct.${p_panel_id}.category == \"FENCE_PANEL\""
            - "FenceProduct.${p_panel_id}.panel_length_ft == 10"
            - "FenceProduct.${p_panel_id}.replacement_cost_cents_per_unit == 24000"
            - "FenceProduct.${p_panel_id}.fleet_age_months == 18"
            - "FenceProduct.${p_panel_id}.owned_count == 400"
            - "FenceProduct.${p_panel_id}.available_count == 400"
            - "FenceProduct.${p_panel_id}.reserved_count == 0"
            - "FenceProduct.${p_panel_id}.deployed_count == 0"
            - "FenceProduct.${p_panel_id}.damaged_count == 0"
            - "FenceProduct.${p_panel_id}.lost_count == 0"

      - name: list_jobsites_filtered_by_account_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET /fence-rentals/jobsites
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Jobsite.fields.customer_account_id
        distinguishing_aspect: |
          Three jobsites on account A and one on account B: the filtered list
          reports total_count 3 (the filter, not the page, drives the count),
          returns 2 rows with has_more true at offset 0 limit 2 and 1 row with
          has_more false at offset 2, and never leaks account B's jobsite.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One municipality HRB-01."
            - "Account A with three jobsites; account B with one jobsite."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Harbor Festivals Co", billing_email: "ap@harborfest.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a2_id: "$.data.id" }
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 4, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id" }
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Dock Street Rebuild", address_line: "8 Dock Street", site_condition: "ASPHALT", phase_count: 2, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j2_id: "$.data.id" }
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Mill Lane Culvert", address_line: "77 Mill Lane", site_condition: "CONCRETE", phase_count: 1, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j3_id: "$.data.id" }
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a2_id}", municipality_id: "${m1_id}", site_label: "Quay Street Festival Lot", address_line: "11 Quay Street", site_condition: "SOIL", phase_count: 1, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j4_id: "$.data.id" }
          trigger:
            - call: "GET /fence-rentals/jobsites?customer_account_id=${a1_id}&limit=2&offset=0"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/jobsites?customer_account_id=${a1_id}&limit=2&offset=2"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/jobsites?customer_account_id=${a2_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
          assert:
            - "First page: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more is true, limit == 2, offset == 0"
            - "Second page: len(data) == 1, total_count == 3, has_more is false, offset == 2"
            - "The union of the two pages is exactly {${j1_id}, ${j2_id}, ${j3_id}} with no duplicate row"
            - "Jobsite ${j4_id} appears in neither page"
            - "Third call (account B, no pagination params): len(data) == 1, total_count == 1, has_more is false, limit == 10, offset == 0"
            - "Third call data[0].id == ${j4_id}"

      - name: get_contract_with_unknown_uuid_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_ERR_CONTRACT_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - endpoints.GET /fence-rentals/contracts/{id}
        distinguishing_aspect: |
          A syntactically valid UUID that matches no stored RentalContract
          returns 404 ERR_CONTRACT_NOT_FOUND in the declared error envelope,
          not 200 with a null data or a 500.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z; no contracts exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fence-rentals/contracts/3f1c9a52-0000-4c0a-9c2e-000000000999"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
          assert:
            - "HTTP status is 404"
            - "response_type == \"error\""
            - "data.error_id == \"ERR_CONTRACT_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "meta.api_request_id is present"

      - name: create_quote_missing_required_linear_feet_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_VALIDATION
          - errors.ERR_VALIDATION
          - endpoints.POST /fence-rentals/jobsites/{id}/quotes
          - endpoints.POST /fence-rentals/jobsites
        distinguishing_aspect: |
          Omitting the required linear_feet on a quote, and omitting the
          required site_condition on a jobsite, each return 400 ERR_VALIDATION
          and persist nothing: the jobsite's quote list stays empty and its
          version does not move.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, product PANEL-CL-10, jobsite J1 (SOIL, phase_count 4, requires_sidewalk_closure false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 4, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version" }
          trigger:
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Dock Street Rebuild", address_line: "8 Dock Street" }
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/quotes?jobsite_id=${j1_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/jobsites/${j1_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
          assert:
            - "First trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "Second trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "Third trigger: total_count == 0 and data == [] (no partial Quote row was written)"
            - "Fourth trigger: Jobsite.${j1_id}.version == 1 (the rejected quote never bumped the parent)"

      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Municipality.fields.permit_review_rounds_allowed
          - entities.Jobsite.fields.phase_count
          - entities.Jobsite.fields.requires_sidewalk_closure
          - entities.Quote.fields.wind_screen
          - entities.Quote.fields.addon_lines
          - entities.Quote.fields.status
        distinguishing_aspect: |
          A municipality created without permit_review_rounds_allowed and
          allows_solid_wind_screen, a jobsite created without phase_count and
          requires_sidewalk_closure, and a quote created without wind_screen
          and addon_lines land on exactly 2 / true / 1 / false / NONE / [] —
          and the NONE default prices the quote at the unscreened figure 27000.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01 created WITHOUT permit_review_rounds_allowed and WITHOUT allows_solid_wind_screen."
            - "Jobsite J1 created WITHOUT phase_count and WITHOUT requires_sidewalk_closure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version" }
          trigger:
            - call: "GET /fence-rentals/municipalities/${m1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "GET /fence-rentals/jobsites/${j1_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_id: "$.data.id" }
          assert:
            - "Municipality.${m1_id}.permit_review_rounds_allowed == 2"
            - "Municipality.${m1_id}.allows_solid_wind_screen is true"
            - "Municipality.${m1_id}.committed_closure_linear_feet == 0"
            - "Jobsite.${j1_id}.phase_count == 1"
            - "Jobsite.${j1_id}.requires_sidewalk_closure is false"
            - "Quote.${q1_id}.wind_screen == \"NONE\""
            - "Quote.${q1_id}.addon_lines == []"
            - "Quote.${q1_id}.status == \"DRAFT\""
            - "Quote.${q1_id}.monthly_recurring_cents == 27000 (the NONE default applies SCREEN_FACTOR 1.0 and SCREEN_ADDER 0)"

      - name: quote_money_fields_computed_server_side_extra_field_rejected
        claim_type: computed_fields
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.monthly_recurring_cents
          - entities.Quote.fields.tier_rate_cents_per_ft
          - entities.Quote.fields.panel_unit_count
          - validations.priority_3_ERR_VALIDATION
        distinguishing_aspect: |
          A client that tries to dictate monthly_recurring_cents is rejected
          with 400 ERR_VALIDATION (no unknown fields), and the same request
          without that field returns the server's own arithmetic: tier 54,
          monthly 27000, install labor 47500, permit fee 12500, one-time 78500,
          50 panels.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, product PANEL-CL-10, jobsite J1 (SOIL, requires_sidewalk_closure false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 4, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version" }
          trigger:
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE", monthly_recurring_cents: 1 }
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_id: "$.data.id" }
          assert:
            - "First trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\" (monthly_recurring_cents is not an accepted input)"
            - "Second trigger: HTTP 201"
            - "Quote.${q1_id}.tier_rate_cents_per_ft == 54"
            - "Quote.${q1_id}.monthly_recurring_cents == 27000"
            - "Quote.${q1_id}.install_labor_cents == 47500"
            - "Quote.${q1_id}.permit_handling_fee_cents == 12500"
            - "Quote.${q1_id}.one_time_cents == 78500"
            - "Quote.${q1_id}.panel_unit_count == 50"
            - "Quote.${q1_id}.monthly_recurring_cents != 1"

      - name: quote_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Quote.fields.issued_at_utc
          - entities.Quote.fields.valid_through_utc
          - response_envelope.success
        distinguishing_aspect: |
          A newly created quote carries a server-minted UUID id with no prefix,
          created_at and updated_at as ISO-8601 UTC instants ending in Z,
          version exactly 1, and both issue-time stamps still null because
          valid_through_utc is set at issue, never at creation.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, product PANEL-CL-10, jobsite J1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
