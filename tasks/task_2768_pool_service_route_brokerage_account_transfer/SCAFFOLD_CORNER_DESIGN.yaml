          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, ACTIVE seller, APPROVED buyer."
            - "DRAFT listing PUB-A in region PHX-A with zero accounts and zero valuations."
            - "DRAFT listing PUB-B in region PHX-B with one account (20000 service, no chemical, no repair, started 2019-03-15) and zero valuations."
