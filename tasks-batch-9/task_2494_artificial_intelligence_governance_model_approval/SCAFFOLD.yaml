scenario: |
  Generate task harder than expert level!

  2494. Artificial Intelligence Governance & Model Approval (enterprise artificial intelligence governance office): use case intake with risk classification by impact on individuals, decision autonomy and data sensitivity, approval workflow with legal, privacy, security and business review gated by risk tier, vendor and third-party model assessment covering training data provenance, output rights and data retention terms, testing requirements including bias evaluation, robustness and hallucination assessment appropriate to the use, human oversight design with review requirements and escalation for consequential decisions, disclosure obligations to users and required notices under applicable law, monitoring after deployment with incident reporting and periodic reassessment, inventory maintenance and retirement of unapproved or shadow deployments
domain_name: ai-governance-model-approval
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; URL paths are flat collections
  # (/use-cases, /model-assets, /test-evaluations, ...) with read-only
  # sub-resource GETs for reverse traversal. No nested write paths beyond the
  # single owning parent segment.

  state_machine_shape: cyclic
  # UseCase runs revision loops (UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW)
  # and reassessment loops (APPROVED -> UNDER_REASSESSMENT -> APPROVED);
  # ReviewGate runs condition loops (IN_REVIEW -> CONDITIONS_ISSUED -> IN_REVIEW)
  # and a compensation loop (CLEARED -> IN_REVIEW). classify() and
  # ShadowDeployment additionally fork into branches with divergent side effects.

  relationship_patterns:
    - one_to_many          # UseCase -> ReviewGate / ModelBinding / DisclosureNotice / ...
    - many_to_many         # UseCase <-> ModelAsset via ModelBinding junction rows
    - self_referential     # UseCase.predecessor_use_case_id -> UseCase.id (supersession chain)
    - cross_aggregate      # ReviewGate clearance depends on VendorModelAssessment on another aggregate

  role_model: segregation_of_duties
  # Four domain reviewer roles each own exactly one gate_type; the
  # GovernanceOfficer who signs the approval may be neither the intake
  # requester nor any reviewer who cleared a gate on that use case.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities, 50 endpoints, 39 error codes, 11 calculation rules (2 carrying
# divergent variants), 10 state machines. Density, not volume, carries the
# difficulty: every approval touches classification, gates, bindings, vendor
# terms, evaluations, oversight design and disclosure notices at once, and the
# final risk tier is recomputed from evidence produced by the very gates the
# provisional tier demanded.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: UseCase
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: title
        type: string
        source: input
        description: short human label for the AI use case
        constraints: "1..160 chars"
      - name: business_unit
        type: string
        source: input
        description: owning business unit code
        constraints: "1..40 chars"
      - name: description
        type: string
        source: input
        description: narrative of what the system does and how outputs are used
        constraints: "1..2000 chars"
      - name: requester_user_id
        type: string
        source: system
        description: "X-User-ID of the Requester who filed the intake; opaque operator identifier, never an entity id"
      - name: affects_individuals
        type: boolean
        source: input
        description: true when outputs are applied to identifiable natural persons
      - name: decision_autonomy
        type: enum
        source: input
        description: how much of the decision the model makes without a human
        constraints: "one of: ADVISORY | HUMAN_IN_LOOP | HUMAN_ON_LOOP | FULLY_AUTOMATED"
      - name: data_sensitivity
        type: enum
        source: input
        description: highest sensitivity class of data the use case processes
        constraints: "one of: PUBLIC | INTERNAL | CONFIDENTIAL | SPECIAL_CATEGORY"
      - name: individual_impact
        type: enum
        source: input
        description: severity of consequence for an affected individual
        constraints: "one of: NONE | LOW | MATERIAL | CONSEQUENTIAL"
      - name: jurisdictions
        type: array
        source: input
        description: legal jurisdictions in which the use case is deployed
        constraints: "array of enum EU | UK | US_CA | US_CO | US_FED; may be empty; no duplicates"
      - name: deployed_headcount_reach
        type: integer
        source: input
        description: number of individuals the deployment can touch per year
        constraints: ">= 0"
      - name: predecessor_use_case_id
        type: string
        source: input
        description: "FK -> UseCase.id; the prior-generation use case this intake supersedes; null when this is a first-generation intake"
        default: null
      - name: status
        type: enum
        source: system
        description: intake/approval lifecycle state (see 1.2 SM UseCase)
        default: DRAFT
        constraints: "one of: DRAFT | UNDER_REVIEW | CHANGES_REQUESTED | READY_FOR_APPROVAL | APPROVED | UNDER_REASSESSMENT | SUSPENDED | REJECTED | REVOKED"
      - name: classification_stale
        type: boolean
        source: computed
        description: true after intake fields are edited and before the next classify run
        default: false
      - name: classification_cycle_index
        type: integer
        source: computed
        description: number of classify runs performed; 0 before the first run
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: "currently effective provisional risk score from calculations.risk_classification_score variant INTAKE_PROVISIONAL; null before first classify"
        default: null
      - name: risk_tier
        type: enum
        source: computed
        description: "provisional tier derived from risk_score; drives required_gate_types, evaluation thresholds and control-debt multipliers"
        default: null
        constraints: "one of: MINIMAL | LIMITED | HIGH | PROHIBITED; null before first classify"
      - name: required_gate_types
        type: array
        source: computed
        description: "gate types the provisional tier demands, in canonical order LEGAL, PRIVACY, SECURITY, BUSINESS"
        default: []
        constraints: "array of enum LEGAL | PRIVACY | SECURITY | BUSINESS"
      - name: final_risk_score
        type: number
        source: computed
        description: "deployment-time score from calculations.risk_classification_score variant DEPLOYMENT_FINAL; written only by the approve transition"
        default: null
      - name: final_risk_tier
        type: enum
        source: computed
        description: "tier derived from final_risk_score; selects reassessment_interval_days and incident containment speed after approval"
        default: null
        constraints: "one of: MINIMAL | LIMITED | HIGH | PROHIBITED; null before approval"
      - name: control_credit
        type: number
        source: computed
        description: "credit for cleared gates and passed evaluations, capped at CONTROL_CREDIT_CAP; written by the approve transition"
        default: null
      - name: vendor_penalty
        type: number
        source: computed
        description: "penalty derived from the pinned binding's asset vendor_terms_grade; written by the approve transition"
        default: null
      - name: open_conditions_count
        type: integer
        source: computed
        description: "sum of ReviewGate.open_condition_count over gates of this use case whose status == CONDITIONS_ISSUED"
        default: 0
      - name: cleared_gate_count
        type: integer
        source: computed
        description: "count of ReviewGate rows of this use case with status == CLEARED"
        default: 0
      - name: monitoring_posture
        type: enum
        source: computed
        description: "post-deployment posture derived from open incidents by calculations.monitoring_posture_derivation"
        default: HEALTHY
        constraints: "one of: HEALTHY | WATCH | IMPAIRED"
      - name: safety_flag
        type: boolean
        source: computed
        description: true once any BIAS TestEvaluation on this use case has ended FAILED and has not been superseded by a later PASSED BIAS evaluation
        default: false
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent approve transition
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the GovernanceOfficer who signed the approval
        default: null
      - name: approval_expires_at
        type: datetime
        source: computed
        description: "approved_at + reassessment_interval_days; the sweep suspends the use case at or after this instant"
        default: null
      - name: reassessment_interval_days
        type: integer
        source: computed
        description: "days between periodic reassessments, selected from REASSESSMENT_INTERVAL_DAYS by final_risk_tier"
        default: null
      - name: reassessment_due_at
        type: datetime
        source: computed
        description: "instant at which the next periodic reassessment becomes due"
        default: null
      - name: reassessment_cycle_index
        type: integer
        source: computed
        description: number of reassessment cycles opened; 1 after the first approval
        default: 0
      - name: reassessment_status
        type: enum
        source: computed
        description: state of the current reassessment cycle
        default: NOT_SCHEDULED
        constraints: "one of: NOT_SCHEDULED | SCHEDULED | IN_PROGRESS | OVERDUE"
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded when classify forces PROHIBITED and rejects the intake
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: logical-clock instant of the revoke transition
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: free-text reason supplied on revoke
        default: null

  - name: ClassificationSnapshot
    parent: UseCase
    common_fields: false
    kind: event
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the classified use case"
      - name: cycle_index
        type: integer
        source: system
        description: "1-based classify cycle this snapshot belongs to; the current provisional snapshot is the one with max cycle_index and variant == INTAKE_PROVISIONAL"
      - name: variant
        type: enum
        source: system
        description: which calculation variant produced this snapshot
        constraints: "one of: INTAKE_PROVISIONAL | DEPLOYMENT_FINAL"
      - name: impact_points
        type: integer
        source: computed
        description: INDIVIDUAL_IMPACT_POINTS contribution
      - name: autonomy_points
        type: integer
        source: computed
        description: AUTONOMY_POINTS contribution
      - name: sensitivity_points
        type: integer
        source: computed
        description: SENSITIVITY_POINTS contribution
      - name: reach_points
        type: integer
        source: computed
        description: REACH_BANDS contribution selected by the deployed_headcount_reach band
      - name: jurisdiction_points
        type: integer
        source: computed
        description: "JURISDICTION_POINT_PER_HIGH_SCRUTINY * count(jurisdictions intersect HIGH_SCRUTINY_JURISDICTIONS)"
      - name: base_score
        type: integer
        source: computed
        description: sum of the five point contributions before variant adjustments
      - name: vendor_penalty
        type: number
        source: computed
        description: vendor terms penalty applied by this variant (always 0 for INTAKE_PROVISIONAL)
      - name: control_credit
        type: number
        source: computed
        description: control credit applied by this variant (always 0 for INTAKE_PROVISIONAL)
      - name: cleared_gate_count
        type: integer
        source: computed
        description: frozen count of CLEARED gates used to compute control_credit (0 for INTAKE_PROVISIONAL)
      - name: passed_eval_count
        type: integer
        source: computed
        description: frozen count of PASSED evaluations used to compute control_credit (0 for INTAKE_PROVISIONAL)
      - name: risk_score
        type: number
        source: computed
        description: final clamped score this snapshot recorded
      - name: risk_tier
        type: enum
        source: computed
        description: tier derived from risk_score by RISK_TIER_BANDS, or PROHIBITED when forced_prohibited
        constraints: "one of: MINIMAL | LIMITED | HIGH | PROHIBITED"
      - name: forced_prohibited
        type: boolean
        source: computed
        description: true when the PROHIBITED_COMBINATION override fired regardless of score
      - name: computed_at
        type: datetime
        source: system
        description: logical-clock instant at which this snapshot was computed

  - name: ReviewGate
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the use case under review"
      - name: gate_type
        type: enum
        source: system
        description: review domain this gate represents
        constraints: "one of: LEGAL | PRIVACY | SECURITY | BUSINESS"
      - name: status
        type: enum
        source: system
        description: gate lifecycle state (see 1.2 SM ReviewGate)
        default: PENDING
        constraints: "one of: PENDING | IN_REVIEW | CONDITIONS_ISSUED | CLEARED | VOIDED"
      - name: pinned_risk_tier
        type: enum
        source: system
        description: provisional risk_tier frozen onto the gate when classify created it
        constraints: "one of: MINIMAL | LIMITED | HIGH | PROHIBITED"
      - name: pinned_classification_index
        type: integer
        source: system
        description: "cycle_index of the snapshot this gate was pinned to; resolves to ClassificationSnapshot WHERE use_case_id == this.use_case_id AND cycle_index == this.pinned_classification_index AND variant == INTAKE_PROVISIONAL"
      - name: assigned_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the reviewer who most recently started review on this gate
        default: null
      - name: conditions
        type: array
        source: input
        description: remediation conditions the reviewer issued
        default: []
        constraints: "array of string, 1..20 entries when supplied"
      - name: open_condition_count
        type: integer
        source: computed
        description: "len(conditions) while status == CONDITIONS_ISSUED, else 0"
        default: 0
      - name: control_debt_index
        type: number
        source: computed
        description: "per-gate control debt from calculations.control_debt_index, 2 decimals; 0.00 whenever status is not CONDITIONS_ISSUED"
        default: 0.00
      - name: debt_before_clear
        type: number
        source: system
        description: control_debt_index value captured immediately before the clear transition zeroed it; restored verbatim by reopen
        default: 0.00
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the reviewer who cleared the gate
        default: null
      - name: cleared_at
        type: datetime
        source: system
        description: logical-clock instant of the clear transition
        default: null
      - name: decision_note
        type: string
        source: input
        description: reviewer note recorded on the latest decision
        default: null

  - name: ModelAsset
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: provider
        type: string
        source: input
        description: vendor or internal team that supplies the model
      - name: model_name
        type: string
        source: input
        description: model family name
      - name: model_version
        type: string
        source: input
        description: vendor-declared version label
      - name: hosting
        type: enum
        source: input
        description: where inference runs
        constraints: "one of: INTERNAL | VENDOR_API | ON_PREM"
      - name: modality
        type: enum
        source: input
        description: input/output modality
        constraints: "one of: TEXT | VISION | MULTIMODAL | TABULAR"
      - name: is_third_party
        type: boolean
        source: input
        description: true when the model is supplied by a third party and therefore needs a vendor assessment
      - name: status
        type: enum
        source: system
        description: asset registry state (see 1.2 SM ModelAsset)
        default: REGISTERED
        constraints: "one of: REGISTERED | APPROVED_FOR_USE | RESTRICTED"
      - name: vendor_terms_grade
        type: enum
        source: computed
        description: terms_grade copied from the most recently ACCEPTED VendorModelAssessment on this asset
        default: null
        constraints: "one of: A | B | C | D; null when no assessment has been accepted"
      - name: active_binding_count
        type: integer
        source: computed
        description: "count of ModelBinding rows on this asset with status IN {PINNED, STALE}"
        default: 0
      - name: enforced_shadow_count
        type: integer
        source: computed
        description: count of ShadowDeployment rows on this asset with status == ENFORCED_BLOCK
        default: 0

  - name: ModelBinding
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the use case this binding serves"
      - name: model_asset_id
        type: string
        source: input
        description: "FK -> ModelAsset.id; the asset bound to the use case"
      - name: pinned_model_version
        type: integer
        source: system
        description: value of ModelAsset.version at the instant the binding was created; staleness is detected by comparing against the asset's current version
      - name: status
        type: enum
        source: system
        description: binding lifecycle state (see 1.2 SM ModelBinding)
        default: PINNED
        constraints: "one of: PINNED | STALE | RETIRED"
      - name: pinned_at
        type: datetime
        source: system
        description: logical-clock instant at which the binding pinned the asset version
      - name: superseded_reason
        type: enum
        source: system
        description: why the binding left PINNED
        default: null
        constraints: "one of: SUPERSEDED_BY_NEW_BINDING | USE_CASE_REVOKED | APPROVAL_SUSPENDED | ASSET_REAPPROVED"

  - name: VendorModelAssessment
    parent: ModelAsset
    common_fields: true
    kind: resource
    fields:
      - name: model_asset_id
        type: string
        source: system
        description: "FK -> ModelAsset.id; the third-party asset being assessed"
      - name: vendor_name
        type: string
        source: input
        description: legal name of the vendor entity on the contract
      - name: training_data_provenance
        type: enum
        source: input
        description: how well the vendor documents the origin and licensing of training data
        constraints: "one of: DOCUMENTED_LICENSED | DOCUMENTED_MIXED | UNDISCLOSED"
      - name: output_rights
        type: enum
        source: input
        description: rights the enterprise obtains in model outputs
        constraints: "one of: FULL_ASSIGNMENT | LICENSE_WITH_RESTRICTIONS | VENDOR_RETAINS"
      - name: retention_days
        type: integer
        source: input
        description: contractual retention period for prompts and outputs; null when the contract is silent
        default: null
        constraints: ">= 0 when supplied"
      - name: retention_opt_out
        type: boolean
        source: input
        description: true when the enterprise can contractually opt out of vendor retention for training
      - name: subprocessors_disclosed
        type: boolean
        source: input
        description: true when the vendor discloses its full subprocessor list
      - name: status
        type: enum
        source: system
        description: assessment lifecycle state (see 1.2 SM VendorModelAssessment)
        default: SUBMITTED
        constraints: "one of: SUBMITTED | ACCEPTED | REJECTED | EXPIRED"
      - name: terms_variant
        type: enum
        source: system
        description: which calculations.vendor_terms_grade variant produced the currently stored grade
        default: CONSERVATIVE_LEGAL
        constraints: "one of: CONSERVATIVE_LEGAL | DOCUMENTED_TERMS"
      - name: effective_retention_days
        type: integer
        source: computed
        description: retention period the active variant actually scored
      - name: terms_risk_points
        type: number
        source: computed
        description: total terms risk points before banding into a grade
      - name: terms_grade
        type: enum
        source: computed
        description: grade banded from terms_risk_points by TERMS_GRADE_BANDS
        constraints: "one of: A | B | C | D"
      - name: decision_rationale
        type: string
        source: input
        description: rationale recorded by the GovernanceOfficer on decide
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the GovernanceOfficer who decided the assessment
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decide transition
        default: null

  - name: TestEvaluation
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: input
        description: "FK -> UseCase.id; the use case whose tier fixes the thresholds"
      - name: model_binding_id
        type: string
        source: input
        description: "FK -> ModelBinding.id; the binding under test; its asset owns the exclusive test window"
      - name: eval_type
        type: enum
        source: input
        description: which testing requirement this run discharges
        constraints: "one of: BIAS | ROBUSTNESS | HALLUCINATION | SECURITY_REDTEAM"
      - name: status
        type: enum
        source: system
        description: evaluation lifecycle state (see 1.2 SM TestEvaluation)
        default: PLANNED
        constraints: "one of: PLANNED | PASSED | FAILED | VOIDED"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the exclusive test window reserved on the bound asset
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the test window; must be strictly after window_start_at
      - name: worst_group_parity_ratio
        type: number
        source: input
        description: lowest subgroup selection-rate ratio observed; scored for eval_type BIAS
        default: null
        constraints: "0..1 with 4 decimals when supplied"
      - name: adversarial_pass_rate
        type: number
        source: input
        description: fraction of adversarial probes the model withstood; scored for ROBUSTNESS and SECURITY_REDTEAM
        default: null
        constraints: "0..1 with 4 decimals when supplied"
      - name: grounded_accuracy
        type: number
        source: input
        description: fraction of outputs traceable to supplied context; scored for HALLUCINATION
        default: null
        constraints: "0..1 with 4 decimals when supplied"
      - name: sample_size
        type: integer
        source: input
        description: number of scored examples in the run
        default: null
        constraints: ">= 0 when supplied"
      - name: evidence_uri
        type: string
        source: input
        description: pointer to the stored evaluation artefact
        default: null
      - name: required_metric_name
        type: string
        source: computed
        description: "field name the tier profile scores for this eval_type: worst_group_parity_ratio | adversarial_pass_rate | grounded_accuracy"
      - name: required_metric_threshold
        type: number
        source: computed
        description: minimum acceptable metric value selected by EVAL_THRESHOLDS from the use case pinned tier
      - name: required_sample_size
        type: integer
        source: computed
        description: minimum acceptable sample_size selected by MIN_SAMPLE_SIZE from the use case pinned tier
      - name: observed_metric_value
        type: number
        source: computed
        description: value of the field named by required_metric_name at completion
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of the complete transition
        default: null

  - name: OversightDesign
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the use case this human-oversight design covers"
      - name: review_mode
        type: enum
        source: input
        description: how humans intervene in the decision path
        constraints: "one of: NONE | SAMPLED | PRE_DECISION_REVIEW | DUAL_REVIEW"
      - name: sample_pct
        type: integer
        source: input
        description: percentage of decisions a human reviews; only scored when review_mode == SAMPLED
        constraints: "0..100"
      - name: escalation_sla_hours
        type: integer
        source: input
        description: hours within which an escalated consequential decision reaches a human decision-maker
        constraints: "0..240"
      - name: reviewer_role
        type: enum
        source: input
        description: role that staffs the oversight queue
        constraints: "one of: LegalReviewer | PrivacyReviewer | SecurityReviewer | BusinessReviewer"
      - name: override_capability
        type: boolean
        source: input
        description: true when the human reviewer can overturn a model output before it takes effect
      - name: status
        type: enum
        source: system
        description: design lifecycle state (see 1.2 SM OversightDesign)
        default: DRAFT
        constraints: "one of: DRAFT | APPROVED | REJECTED"
      - name: adequacy_score
        type: number
        source: computed
        description: score from calculations.oversight_adequacy_score, integer-valued 0..100
      - name: required_adequacy_score
        type: number
        source: computed
        description: threshold selected by REQUIRED_ADEQUACY from the use case pinned risk_tier and decision_autonomy
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the GovernanceOfficer who decided the design
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decide transition
        default: null

  - name: DisclosureNotice
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the use case the notice discloses"
      - name: notice_type
        type: enum
        source: input
        description: which statutory notice this publication discharges
        constraints: "one of: USER_FACING_AI_DISCLOSURE | AUTOMATED_DECISION_NOTICE | TRAINING_DATA_NOTICE | EMPLOYMENT_SCREENING_NOTICE"
      - name: jurisdiction
        type: enum
        source: input
        description: jurisdiction whose law requires the notice
        constraints: "one of: EU | UK | US_CA | US_CO | US_FED"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive first instant the notice is in force
      - name: effective_to
        type: datetime
        source: input
        description: inclusive last instant the notice is in force; must be strictly after effective_from
      - name: locale_count
        type: integer
        source: input
        description: number of locales the notice is published in
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: notice lifecycle state (see 1.2 SM DisclosureNotice)
        default: PUBLISHED
        constraints: "one of: PUBLISHED | WITHDRAWN"
      - name: withdrawn_at
        type: datetime
        source: system
        description: logical-clock instant of the withdraw transition
        default: null

  - name: MonitoringIncident
    parent: UseCase
    common_fields: true
    kind: resource
    fields:
      - name: use_case_id
        type: string
        source: input
        description: "FK -> UseCase.id; the deployed use case the incident concerns"
      - name: severity
        type: enum
        source: input
        description: incident severity band
        constraints: "one of: SEV1 | SEV2 | SEV3"
      - name: category
        type: enum
        source: input
        description: nature of the failure observed after deployment
        constraints: "one of: HARMFUL_OUTPUT | DRIFT | PRIVACY_LEAK | OVERSIGHT_FAILURE"
      - name: detected_at
        type: datetime
        source: input
        description: instant the failure was first observed; the containment clock starts here
      - name: summary
        type: string
        source: input
        description: what happened and who was affected
        constraints: "1..1000 chars"
      - name: reported_to_regulator
        type: boolean
        source: input
        description: true once the mandatory regulator notification has been filed
        default: false
      - name: status
        type: enum
        source: system
        description: incident lifecycle state (see 1.2 SM MonitoringIncident)
        default: OPEN
        constraints: "one of: OPEN | CONTAINED | ESCALATED | RESOLVED"
      - name: containment_hours
        type: integer
        source: computed
        description: hours allowed for containment, from calculations.incident_containment_deadline
      - name: containment_deadline_at
        type: datetime
        source: computed
        description: "detected_at + containment_hours"
      - name: contained_at
        type: datetime
        source: system
        description: logical-clock instant of the contain transition
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of the resolve transition
        default: null

  - name: ShadowDeployment
    parent: ModelAsset
    common_fields: true
    kind: resource
    fields:
      - name: model_asset_id
        type: string
        source: input
        description: "FK -> ModelAsset.id; the asset found running without approval"
      - name: claimed_use_case_id
        type: string
        source: input
        description: "FK -> UseCase.id; the use case the finder believes the shadow deployment belongs to, and the use case the link transition attaches it to; null when unattributed"
        default: null
      - name: environment
        type: enum
        source: input
        description: environment the unapproved deployment was found in
        constraints: "one of: SANDBOX | INTERNAL_PILOT | PRODUCTION"
      - name: discovered_source
        type: enum
        source: input
        description: how the deployment came to the governance office's attention
        constraints: "one of: NETWORK_SCAN | EXPENSE_REPORT | SELF_REPORT | VENDOR_INVOICE"
      - name: discovered_at
        type: datetime
        source: input
        description: instant of discovery; the grace clock starts here
      - name: status
        type: enum
        source: system
        description: shadow-deployment disposition (see 1.2 SM ShadowDeployment)
        default: DISCOVERED
        constraints: "one of: DISCOVERED | LINKED | GRACE_GRANTED | RETIRED | ENFORCED_BLOCK"
      - name: grace_days_granted
        type: integer
        source: computed
        description: extra days granted on top of the environment base grace
        default: 0
      - name: grace_deadline_at
        type: datetime
        source: computed
        description: instant after which the sweep blocks the deployment, from calculations.shadow_grace_deadline
      - name: retired_at
        type: datetime
        source: system
        description: logical-clock instant of the retire transition
        default: null

  - name: GovernanceLedgerEntry
    parent: UseCase
    common_fields: false
    kind: event
    fields:
      - name: use_case_id
        type: string
        source: system
        description: "FK -> UseCase.id; the use case whose governance position this entry moves"
      - name: entry_type
        type: enum
        source: system
        description: which governance event produced the entry
        constraints: "one of: APPROVAL_GRANTED | APPROVAL_REVOKED | APPROVAL_SUSPENDED | APPROVAL_REINSTATED | GATE_CLEARED | GATE_REOPENED | REASSESSMENT_COMPLETED | BINDING_RETIRED | VENDOR_ASSESSMENT_EXPIRED | SHADOW_ENFORCED | CLASSIFICATION_REJECTED | DISCLOSURE_WITHDRAWN"
      - name: reach_delta
        type: integer
        source: system
        description: "signed change this event applies to portfolio_approved_reach; 0 for events that do not move inventory reach"
      - name: debt_delta
        type: number
        source: system
        description: "signed change this event applies to control_debt_index_total, 2 decimals; 0.00 for events that do not move control debt"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the operator whose request produced the entry, or the literal "system" for sweep-produced entries
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant the entry was appended
      - name: note
        type: string
        source: system
        description: machine-generated explanation of the entry

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: UseCase
    initial_state: DRAFT
    terminal_states: [REJECTED, REVOKED]
    shape: "cyclic with a classify fork; revision loop UNDER_REVIEW <-> CHANGES_REQUESTED and reassessment loop APPROVED <-> UNDER_REASSESSMENT"
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /use-cases/{id}"
        actor: Requester
        preconditions:
          - "X-User-ID == use_case.requester_user_id"
          - "at least one updatable intake field present in the body"
        side_effects:
          - "overwrite supplied intake fields"
          - "set classification_stale = true"
          - "every ReviewGate of this use case with status IN {PENDING, IN_REVIEW, CONDITIONS_ISSUED, CLEARED} -> VOIDED; each voided gate's control_debt_index -> 0.00 and open_condition_count -> 0"
          - "recompute open_conditions_count and cleared_gate_count (both become 0)"
          - "increments UseCase.version by 1"
        note: "editing intake data invalidates the classification and every gate pinned to it"

      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /use-cases/{id}"
        actor: Requester
        preconditions:
          - "X-User-ID == use_case.requester_user_id"
          - "at least one updatable intake field present in the body"
        side_effects:
          - "same side effects as the DRAFT -> DRAFT edit above"
          - "increments UseCase.version by 1"
        note: "revision loop: the requester answers reviewer conditions by re-filing intake data"

      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /use-cases/{id}/classify"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == DRAFT"
          - "expected_use_case_version == use_case.version"
          - "calculations.risk_classification_score variant INTAKE_PROVISIONAL does NOT set forced_prohibited"
        side_effects:
          - "classification_cycle_index += 1"
          - "append ClassificationSnapshot(variant=INTAKE_PROVISIONAL, cycle_index=classification_cycle_index) recording every point contribution"
          - "set risk_score, risk_tier from the snapshot; set classification_stale = false"
          - "set required_gate_types = REQUIRED_GATES[risk_tier] in canonical order LEGAL, PRIVACY, SECURITY, BUSINESS"
          - "every pre-existing ReviewGate of this use case with status != VOIDED -> VOIDED (control_debt_index -> 0.00)"
          - "create one ReviewGate per entry of required_gate_types, in that canonical order, each status PENDING, pinned_risk_tier = risk_tier, pinned_classification_index = classification_cycle_index"
          - "recompute open_conditions_count = 0 and cleared_gate_count = 0"
          - "increments UseCase.version by 1"
        note: "fork branch A of classify; gates are created in canonical order so GET /use-cases/{id}/review-gates sorted by created_at ASC is index-stable"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /use-cases/{id}/classify"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == DRAFT"
          - "expected_use_case_version == use_case.version"
          - "calculations.risk_classification_score variant INTAKE_PROVISIONAL sets forced_prohibited = true"
        side_effects:
          - "classification_cycle_index += 1"
          - "append ClassificationSnapshot(variant=INTAKE_PROVISIONAL, forced_prohibited=true, risk_tier=PROHIBITED)"
          - "set risk_score, risk_tier = PROHIBITED, required_gate_types = [] and create NO ReviewGate rows"
          - "set rejection_reason = PROHIBITED_COMBINATION"
          - "append GovernanceLedgerEntry(entry_type=CLASSIFICATION_REJECTED, reach_delta=0, debt_delta=0.00)"
          - "increments UseCase.version by 1"
        note: "fork branch B of classify: divergent side-effect set (no gates, ledger entry, terminal state) from the same trigger"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /review-gates/{id}/issue-conditions"
        actor: "LegalReviewer | PrivacyReviewer | SecurityReviewer | BusinessReviewer"
        preconditions:
          - "gate.use_case_id == use_case.id AND gate.status == IN_REVIEW"
        side_effects:
          - "gate -> CONDITIONS_ISSUED with open_condition_count = len(conditions) and control_debt_index recomputed by calculations.control_debt_index"
          - "recompute use_case.open_conditions_count"
          - "use_case.status -> CHANGES_REQUESTED"
        note: "bubble-up: any gate issuing conditions pushes the whole intake back to the requester"

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /review-gates/{id}/start-review"
        actor: "LegalReviewer | PrivacyReviewer | SecurityReviewer | BusinessReviewer"
        preconditions:
          - "gate.use_case_id == use_case.id AND gate.status IN {PENDING, CONDITIONS_ISSUED}"
          - "after this gate's own conditions are cleared, use_case.open_conditions_count == 0"
        side_effects:
          - "gate -> IN_REVIEW; open_condition_count -> 0; control_debt_index -> 0.00; conditions -> []"
          - "recompute use_case.open_conditions_count"
          - "use_case.status -> UNDER_REVIEW when open_conditions_count == 0"
        note: "closes the revision loop CHANGES_REQUESTED -> UNDER_REVIEW; stays CHANGES_REQUESTED while any other gate still holds open conditions. The PENDING half of the from-set matters because a FAILED TestEvaluation also pushes the use case to CHANGES_REQUESTED without any gate ever issuing conditions - a reviewer taking up an untouched gate is then the only way back to UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: READY_FOR_APPROVAL
        trigger: "POST /review-gates/{id}/clear"
        actor: "LegalReviewer | PrivacyReviewer | SecurityReviewer | BusinessReviewer"
        preconditions:
          - "after this clear, every ReviewGate of the use case with status != VOIDED has status == CLEARED"
          - "cleared_gate_count == len(required_gate_types)"
        side_effects:
          - "use_case.status -> READY_FOR_APPROVAL"
          - "recompute cleared_gate_count"
        note: "compound bubble-up: parent state derived from the aggregate state of its gates"

      - from: READY_FOR_APPROVAL
        to: UNDER_REVIEW
        trigger: "POST /review-gates/{id}/reopen"
        actor: GovernanceOfficer
        preconditions:
          - "gate.status == CLEARED"
        side_effects:
          - "gate -> IN_REVIEW; control_debt_index restored to gate.debt_before_clear; open_condition_count restored to the value implied by debt_before_clear (len(conditions) as re-supplied is not required)"
          - "append GovernanceLedgerEntry(entry_type=GATE_REOPENED, reach_delta=0, debt_delta=+gate.debt_before_clear)"
          - "recompute cleared_gate_count and open_conditions_count"
          - "use_case.status -> UNDER_REVIEW"
        note: "compensating action for clear; restores control_debt_index_total to its pre-clear value with zero drift"

      - from: READY_FOR_APPROVAL
        to: APPROVED
        trigger: "POST /use-cases/{id}/approve"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == READY_FOR_APPROVAL"
          - "expected_use_case_version == use_case.version"
          - "classification_stale == false"
          - "risk_tier != PROHIBITED"
          - "exists OversightDesign WHERE use_case_id == use_case.id AND status == APPROVED"
          - "exists ModelBinding WHERE use_case_id == use_case.id AND status == PINNED (no PINNED binding -> ERR_MODEL_BINDING_MISSING)"
          - "that PINNED binding's pinned_model_version == its ModelAsset.version (otherwise ERR_MODEL_BINDING_STALE)"
          - "for every eval_type in REQUIRED_EVALS[risk_tier]: exists TestEvaluation WHERE use_case_id == use_case.id AND eval_type == that type AND status == PASSED"
          - "safety_flag == false"
          - "for every jurisdiction in use_case.jurisdictions: exists DisclosureNotice WHERE use_case_id == use_case.id AND jurisdiction == that value AND status == PUBLISHED AND effective_from <= now AND effective_to >= now"
          - "X-User-ID != use_case.requester_user_id"
          - "X-User-ID != cleared_by_user_id of every ReviewGate of the use case with status == CLEARED"
          - "portfolio_approved_reach_high_tier after this approval <= PORTFOLIO_HIGH_TIER_REACH_CAP"
        side_effects:
          - "run calculations.approval_finalization in its pinned six-step order"
          - "append ClassificationSnapshot(variant=DEPLOYMENT_FINAL, cycle_index=classification_cycle_index)"
          - "set control_credit, vendor_penalty, final_risk_score, final_risk_tier"
          - "set reassessment_interval_days = REASSESSMENT_INTERVAL_DAYS[final_risk_tier]"
          - "set approved_at = now, approved_by_user_id = X-User-ID, approval_expires_at = now + reassessment_interval_days days, reassessment_due_at = the same instant, reassessment_cycle_index = 1, reassessment_status = SCHEDULED"
          - "set monitoring_posture = HEALTHY"
          - "append GovernanceLedgerEntry(entry_type=APPROVAL_GRANTED, reach_delta=+deployed_headcount_reach, debt_delta=0.00)"
          - "when predecessor_use_case_id is non-null AND that UseCase.status == APPROVED: that predecessor -> REVOKED with revocation_reason = SUPERSEDED, which itself retires the predecessor's PINNED bindings, which itself decrements ModelAsset.active_binding_count"
          - "increments UseCase.version by 1"
        note: "the single densest transition: it reads gates, bindings, assets, vendor terms, evaluations, oversight design and notices, then rewrites the tier it was gated on"

      - from: APPROVED
        to: UNDER_REASSESSMENT
        trigger: "POST /_ops/governance-sweep (system, step 1)"
        actor: system
        preconditions:
          - "use_case.status == APPROVED AND now >= reassessment_due_at"
        side_effects:
          - "use_case.status -> UNDER_REASSESSMENT"
          - "reassessment_status -> IN_PROGRESS, or OVERDUE when now > reassessment_due_at + REASSESSMENT_OVERDUE_GRACE_DAYS days"
          - "increments UseCase.version by 1"

      - from: UNDER_REASSESSMENT
        to: APPROVED
        trigger: "POST /use-cases/{id}/complete-reassessment (outcome CONFIRMED)"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == UNDER_REASSESSMENT"
          - "monitoring_posture == HEALTHY"
          - "X-User-ID != use_case.requester_user_id"
        side_effects:
          - "reassessment_cycle_index += 1"
          - "reassessment_due_at = now + reassessment_interval_days days; approval_expires_at = the same instant; reassessment_status -> SCHEDULED"
          - "append GovernanceLedgerEntry(entry_type=REASSESSMENT_COMPLETED, reach_delta=0, debt_delta=0.00)"
          - "increments UseCase.version by 1"
        note: "closes the reassessment cycle; portfolio_approved_reach is untouched because the use case never left the inventory statuses"

      - from: UNDER_REASSESSMENT
        to: SUSPENDED
        trigger: "POST /use-cases/{id}/complete-reassessment (outcome SUSPEND)"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == UNDER_REASSESSMENT"
        side_effects:
          - "use_case.status -> SUSPENDED; reassessment_status -> SCHEDULED; reassessment_due_at = now + reassessment_interval_days days"
          - "every ModelBinding of the use case with status == PINNED -> STALE with superseded_reason = APPROVAL_SUSPENDED"
          - "append GovernanceLedgerEntry(entry_type=APPROVAL_SUSPENDED, reach_delta=0, debt_delta=0.00)"
          - "increments UseCase.version by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /monitoring-incidents (system cascade when monitoring_posture becomes IMPAIRED) or POST /_ops/governance-sweep (system, step 2, when now > approval_expires_at)"
        actor: system
        preconditions:
          - "use_case.status IN {APPROVED, UNDER_REASSESSMENT}"
          - "monitoring_posture == IMPAIRED after posture re-derivation, OR now > approval_expires_at during the sweep (STRICTLY greater: at the exact expiry instant step 1 opens the reassessment and step 2 leaves the use case alone, which is the only way UNDER_REASSESSMENT is observable given that reassessment_due_at and approval_expires_at are set to the same instant)"
        side_effects:
          - "use_case.status -> SUSPENDED"
          - "every ModelBinding of the use case with status == PINNED -> STALE with superseded_reason = APPROVAL_SUSPENDED"
          - "every TestEvaluation on a binding that just went STALE with status == PLANNED -> VOIDED"
          - "append GovernanceLedgerEntry(entry_type=APPROVAL_SUSPENDED, reach_delta=0, debt_delta=0.00)"
          - "increments UseCase.version by 1"
        note: "cascade hop 2 of the SEV1 incident chain; reach_delta is 0 because SUSPENDED stays inside INVENTORY_STATUSES"

      - from: UNDER_REASSESSMENT
        to: SUSPENDED
        trigger: "POST /_ops/governance-sweep (system, step 2, when now > approval_expires_at)"
        actor: system
        preconditions:
          - "use_case.status == UNDER_REASSESSMENT AND now > approval_expires_at (strictly greater, matching the APPROVED -> SUSPENDED expiry branch; a sweep run at exactly approval_expires_at only opens the reassessment)"
        side_effects:
          - "same side effects as the APPROVED -> SUSPENDED expiry branch"
          - "increments UseCase.version by 1"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /monitoring-incidents/{id}/resolve"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == SUSPENDED"
          - "after this resolve, monitoring_posture == HEALTHY"
          - "now < approval_expires_at (otherwise the use case stays SUSPENDED and ERR_APPROVAL_EXPIRED is NOT raised - resolve still succeeds, only the reinstatement is skipped)"
        side_effects:
          - "use_case.status -> APPROVED"
          - "every ModelBinding of the use case with status == STALE AND superseded_reason == APPROVAL_SUSPENDED AND pinned_model_version == its asset's current version -> PINNED with superseded_reason = null"
          - "append GovernanceLedgerEntry(entry_type=APPROVAL_REINSTATED, reach_delta=0, debt_delta=0.00)"
          - "increments UseCase.version by 1"
        note: "reinstatement loop; reach_delta 0 keeps portfolio_approved_reach conserved across suspend/reinstate"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /use-cases/{id}/revoke"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status IN {READY_FOR_APPROVAL, APPROVED, UNDER_REASSESSMENT, SUSPENDED}"
        side_effects:
          - "hop 1: use_case.status -> REVOKED, revoked_at = now, revocation_reason = body reason; append GovernanceLedgerEntry(entry_type=APPROVAL_REVOKED, reach_delta=-deployed_headcount_reach, debt_delta=0.00)"
          - "hop 2: caused by hop 1 - every ModelBinding of the use case with status IN {PINNED, STALE} -> RETIRED with superseded_reason = USE_CASE_REVOKED; append GovernanceLedgerEntry(entry_type=BINDING_RETIRED) per retired binding"
          - "hop 3: caused by hop 2 - for each retired binding, its ModelAsset.active_binding_count -= 1; when that count reaches 0 AND asset.is_third_party == true AND asset.status == APPROVED_FOR_USE, the asset -> RESTRICTED"
          - "hop 4: caused by hop 3 - every VendorModelAssessment on an asset that just went RESTRICTED with status == ACCEPTED -> EXPIRED, and the asset's vendor_terms_grade -> null; append GovernanceLedgerEntry(entry_type=VENDOR_ASSESSMENT_EXPIRED)"
          - "every PLANNED TestEvaluation on a retired binding -> VOIDED"
          - "every DisclosureNotice of the use case with status == PUBLISHED -> WITHDRAWN with withdrawn_at = now; append GovernanceLedgerEntry(entry_type=DISCLOSURE_WITHDRAWN)"
          - "increments UseCase.version by 1"
        note: "depth-4 transitive cascade: revoke -> bindings -> asset -> vendor assessments, each hop caused by the previous one"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /use-cases/{id}/revoke"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == SUSPENDED"
        side_effects:
          - "same four-hop cascade as APPROVED -> REVOKED; reach_delta = -deployed_headcount_reach because SUSPENDED was inside INVENTORY_STATUSES"
          - "increments UseCase.version by 1"

      - from: READY_FOR_APPROVAL
        to: REVOKED
        trigger: "POST /use-cases/{id}/revoke"
        actor: GovernanceOfficer
        preconditions:
          - "use_case.status == READY_FOR_APPROVAL"
        side_effects:
          - "same cascade, except reach_delta = 0 because the use case was never inside INVENTORY_STATUSES"
          - "increments UseCase.version by 1"

  - entity: ReviewGate
    initial_state: PENDING
    terminal_states: [VOIDED]
    shape: "cyclic: IN_REVIEW <-> CONDITIONS_ISSUED revision loop plus CLEARED -> IN_REVIEW compensation loop"
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /review-gates/{id}/start-review"
        actor: "the reviewer role matching gate_type per GATE_ROLE_MAP"
        preconditions:
          - "gate.status == PENDING"
          - "X-User-Role == GATE_ROLE_MAP[gate.gate_type] (otherwise ERR_GATE_ROLE_MISMATCH)"
          - "use_case.status IN {UNDER_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "assigned_reviewer_user_id = X-User-ID"
          - "increments ReviewGate.version by 1"

      - from: IN_REVIEW
        to: CONDITIONS_ISSUED
        trigger: "POST /review-gates/{id}/issue-conditions"
        actor: "the reviewer role matching gate_type"
        preconditions:
          - "gate.status == IN_REVIEW"
          - "X-User-Role == GATE_ROLE_MAP[gate.gate_type]"
          - "1 <= len(conditions) <= 20"
        side_effects:
          - "conditions = body conditions; open_condition_count = len(conditions)"
          - "control_debt_index = calculations.control_debt_index for this gate"
          - "use_case.open_conditions_count recomputed; use_case.status UNDER_REVIEW -> CHANGES_REQUESTED"
          - "increments ReviewGate.version by 1"

      - from: CONDITIONS_ISSUED
        to: IN_REVIEW
        trigger: "POST /review-gates/{id}/start-review"
        actor: "the reviewer role matching gate_type"
        preconditions:
          - "gate.status == CONDITIONS_ISSUED"
          - "X-User-Role == GATE_ROLE_MAP[gate.gate_type]"
        side_effects:
          - "conditions -> []; open_condition_count -> 0; control_debt_index -> 0.00; assigned_reviewer_user_id = X-User-ID"
          - "use_case.open_conditions_count recomputed; use_case.status -> UNDER_REVIEW when it reaches 0"
          - "increments ReviewGate.version by 1"
        note: "closes the gate revision loop"

      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /review-gates/{id}/clear"
        actor: "the reviewer role matching gate_type"
        preconditions:
          - "gate.status == IN_REVIEW"
          - "X-User-Role == GATE_ROLE_MAP[gate.gate_type]"
          - "X-User-ID != use_case.requester_user_id (otherwise ERR_SEGREGATION_OF_DUTIES)"
          - "gate.pinned_classification_index == use_case.classification_cycle_index AND use_case.classification_stale == false"
          - "when gate_type == LEGAL: the use case has a PINNED ModelBinding whose ModelAsset either has is_third_party == false, or has an ACCEPTED VendorModelAssessment with terms_grade IN {A, B, C} (otherwise ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED)"
          - "when gate_type == SECURITY: exists TestEvaluation WHERE use_case_id == use_case.id AND eval_type == SECURITY_REDTEAM AND status == PASSED (otherwise ERR_REQUIRED_EVALUATION_MISSING)"
          - "when gate_type == PRIVACY: for every jurisdiction in use_case.jurisdictions there exists a PUBLISHED DisclosureNotice on the use case for that jurisdiction (otherwise ERR_DISCLOSURE_NOT_PUBLISHED)"
        side_effects:
          - "debt_before_clear = control_debt_index; control_debt_index -> 0.00; open_condition_count -> 0"
          - "cleared_by_user_id = X-User-ID; cleared_at = now"
          - "append GovernanceLedgerEntry(entry_type=GATE_CLEARED, reach_delta=0, debt_delta=-debt_before_clear)"
          - "use_case.cleared_gate_count recomputed; when every non-VOIDED gate is CLEARED the use case bubbles up to READY_FOR_APPROVAL"
          - "increments ReviewGate.version by 1"

      - from: CONDITIONS_ISSUED
        to: CLEARED
        trigger: "POST /review-gates/{id}/clear"
        actor: "the reviewer role matching gate_type"
        preconditions:
          - "gate.status == CONDITIONS_ISSUED and all preconditions of the IN_REVIEW -> CLEARED row"
        side_effects:
          - "same as IN_REVIEW -> CLEARED; debt_before_clear captures the non-zero control_debt_index this gate carried, so reopen can restore it exactly"
          - "increments ReviewGate.version by 1"
        note: "a reviewer may clear straight out of CONDITIONS_ISSUED when the requester satisfied the conditions out of band"

      - from: CLEARED
        to: IN_REVIEW
        trigger: "POST /review-gates/{id}/reopen"
        actor: GovernanceOfficer
        preconditions:
          - "gate.status == CLEARED"
          - "use_case.status IN {UNDER_REVIEW, CHANGES_REQUESTED, READY_FOR_APPROVAL}"
        side_effects:
          - "control_debt_index = debt_before_clear; open_condition_count = 0; cleared_by_user_id -> null; cleared_at -> null"
          - "append GovernanceLedgerEntry(entry_type=GATE_REOPENED, reach_delta=0, debt_delta=+debt_before_clear)"
          - "use_case.cleared_gate_count recomputed; use_case.status READY_FOR_APPROVAL -> UNDER_REVIEW"
          - "increments ReviewGate.version by 1"
        note: "compensating action; the debt_delta pair (-x on clear, +x on reopen) sums to zero"

      - from: PENDING
        to: VOIDED
        trigger: "POST /use-cases/{id}/classify or PATCH /use-cases/{id} (system)"
        actor: system
        preconditions:
          - "the parent use case is being re-classified or its intake fields are being edited"
        side_effects:
          - "control_debt_index -> 0.00; open_condition_count -> 0"
          - "increments ReviewGate.version by 1"

      - from: IN_REVIEW
        to: VOIDED
        trigger: "POST /use-cases/{id}/classify or PATCH /use-cases/{id} (system)"
        actor: system
        preconditions:
          - "the parent use case is being re-classified or its intake fields are being edited"
        side_effects:
          - "control_debt_index -> 0.00; open_condition_count -> 0"
          - "increments ReviewGate.version by 1"

      - from: CONDITIONS_ISSUED
        to: VOIDED
        trigger: "POST /use-cases/{id}/classify or PATCH /use-cases/{id} (system)"
        actor: system
        preconditions:
          - "the parent use case is being re-classified or its intake fields are being edited"
        side_effects:
          - "control_debt_index -> 0.00 (this removes its contribution from control_debt_index_total); open_condition_count -> 0; use_case.open_conditions_count recomputed"
          - "increments ReviewGate.version by 1"

      - from: CLEARED
        to: VOIDED
        trigger: "POST /use-cases/{id}/classify or PATCH /use-cases/{id} (system)"
        actor: system
        preconditions:
          - "the parent use case is being re-classified or its intake fields are being edited"
        side_effects:
          - "use_case.cleared_gate_count recomputed"
          - "increments ReviewGate.version by 1"

  - entity: ModelAsset
    initial_state: REGISTERED
    terminal_states: []
    shape: "cyclic: RESTRICTED can return to APPROVED_FOR_USE on a fresh accepted assessment"
    transitions:
      - from: REGISTERED
        to: APPROVED_FOR_USE
        trigger: "POST /model-assets/{id}/approve-for-use"
        actor: GovernanceOfficer
        preconditions:
          - "asset.status == REGISTERED"
          - "when is_third_party == true: exists VendorModelAssessment on this asset WHERE status == ACCEPTED AND terms_grade IN {A, B, C} (otherwise ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED)"
        side_effects:
          - "increments ModelAsset.version by 1"
          - "every ModelBinding on this asset with status == PINNED AND pinned_model_version < the new asset version -> STALE with superseded_reason = ASSET_REAPPROVED"

      - from: RESTRICTED
        to: APPROVED_FOR_USE
        trigger: "POST /model-assets/{id}/approve-for-use"
        actor: GovernanceOfficer
        preconditions:
          - "asset.status == RESTRICTED"
          - "enforced_shadow_count == 0"
          - "when is_third_party == true: exists VendorModelAssessment on this asset WHERE status == ACCEPTED AND terms_grade IN {A, B, C}"
        side_effects:
          - "increments ModelAsset.version by 1"
          - "every ModelBinding on this asset with status == PINNED AND pinned_model_version < the new asset version -> STALE with superseded_reason = ASSET_REAPPROVED"
        note: "re-approval bumps version, which is exactly what makes previously pinned bindings stale"

      - from: APPROVED_FOR_USE
        to: APPROVED_FOR_USE
        trigger: "PATCH /model-assets/{id}"
        actor: GovernanceOfficer
        preconditions:
          - "asset.status == APPROVED_FOR_USE"
          - "at least one revisable attribute present in the body"
        side_effects:
          - "overwrite the supplied attributes"
          - "increments ModelAsset.version by 1"
          - "every ModelBinding on this asset with status == PINNED AND pinned_model_version < the new asset version -> STALE with superseded_reason = ASSET_REAPPROVED"
          - "every TestEvaluation with status == PLANNED on a binding that just went STALE -> VOIDED"
        note: "the vendor shipping a new model_version is the ordinary way a pinned binding goes stale; the version bump is what validations[priority=29] compares against"

      - from: APPROVED_FOR_USE
        to: RESTRICTED
        trigger: "system cascade from POST /use-cases/{id}/revoke (hop 3) or POST /_ops/governance-sweep (step 3)"
        actor: system
        preconditions:
          - "active_binding_count reached 0 AND is_third_party == true, OR enforced_shadow_count became >= 1"
        side_effects:
          - "every ACCEPTED VendorModelAssessment on this asset -> EXPIRED; vendor_terms_grade -> null"
          - "increments ModelAsset.version by 1"

  - entity: ModelBinding
    initial_state: PINNED
    terminal_states: [RETIRED]
    shape: "linear with a re-pin loop through STALE -> PINNED on reinstatement"
    transitions:
      - from: PINNED
        to: STALE
        trigger: "system cascade from PATCH /model-assets/{id}, POST /model-assets/{id}/approve-for-use, the APPROVED -> SUSPENDED transition, or POST /_ops/governance-sweep (step 2)"
        actor: system
        preconditions:
          - "pinned_model_version < ModelAsset.version, OR the parent use case left APPROVED for SUSPENDED"
        side_effects:
          - "superseded_reason set to ASSET_REAPPROVED or APPROVAL_SUSPENDED accordingly"
          - "every TestEvaluation on this binding with status == PLANNED -> VOIDED"
          - "increments ModelBinding.version by 1"

      - from: STALE
        to: PINNED
        trigger: "POST /monitoring-incidents/{id}/resolve (system, on reinstatement)"
        actor: system
        preconditions:
          - "superseded_reason == APPROVAL_SUSPENDED AND pinned_model_version == ModelAsset.version AND the parent use case returns to APPROVED"
        side_effects:
          - "superseded_reason -> null"
          - "increments ModelBinding.version by 1"

      - from: PINNED
        to: RETIRED
        trigger: "POST /use-cases/{id}/model-bindings (supersession) or POST /use-cases/{id}/revoke"
        actor: "GovernanceOfficer | system"
        preconditions:
          - "a newer binding is being created for the same use case, or the use case is being revoked"
        side_effects:
          - "superseded_reason = SUPERSEDED_BY_NEW_BINDING or USE_CASE_REVOKED"
          - "ModelAsset.active_binding_count -= 1"
          - "every TestEvaluation on this binding with status == PLANNED -> VOIDED"
          - "increments ModelBinding.version by 1"

      - from: STALE
        to: RETIRED
        trigger: "POST /use-cases/{id}/model-bindings (supersession) or POST /use-cases/{id}/revoke"
        actor: "GovernanceOfficer | system"
        preconditions:
          - "a newer binding is being created for the same use case, or the use case is being revoked"
        side_effects:
          - "same as PINNED -> RETIRED"
          - "increments ModelBinding.version by 1"

  - entity: VendorModelAssessment
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    shape: "branching fork-join: decide splits into ACCEPTED and REJECTED with divergent side-effect sets"
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vendor-assessments/{id}/decide (decision ACCEPT)"
        actor: GovernanceOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "when terms_variant == DOCUMENTED_TERMS: retention_days is non-null (otherwise ERR_RETENTION_TERMS_UNDOCUMENTED)"
        side_effects:
          - "recompute effective_retention_days, terms_risk_points, terms_grade with the requested variant"
          - "ModelAsset.vendor_terms_grade = this assessment's terms_grade"
          - "decided_by_user_id = X-User-ID; decided_at = now"
          - "increments VendorModelAssessment.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vendor-assessments/{id}/decide (decision REJECT)"
        actor: GovernanceOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "recompute effective_retention_days, terms_risk_points, terms_grade with the requested variant"
          - "ModelAsset.vendor_terms_grade is NOT written (divergent branch)"
          - "decided_by_user_id = X-User-ID; decided_at = now"
          - "increments VendorModelAssessment.version by 1"

      - from: ACCEPTED
        to: EXPIRED
        trigger: "system cascade when the ModelAsset moves to RESTRICTED"
        actor: system
        preconditions:
          - "the parent ModelAsset transitioned APPROVED_FOR_USE -> RESTRICTED"
        side_effects:
          - "append GovernanceLedgerEntry(entry_type=VENDOR_ASSESSMENT_EXPIRED, reach_delta=0, debt_delta=0.00) against the use case whose revocation started the cascade"
          - "increments VendorModelAssessment.version by 1"
        note: "hop 4 of the revoke cascade"

  - entity: TestEvaluation
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, VOIDED]
    shape: "branching: complete forks into PASSED and FAILED with divergent side-effect sets"
    transitions:
      - from: PLANNED
        to: PASSED
        trigger: "POST /test-evaluations/{id}/complete"
        actor: "SecurityReviewer | GovernanceOfficer"
        preconditions:
          - "evaluation.status == PLANNED"
          - "the metric named by required_metric_name is present in the body"
          - "observed_metric_value >= required_metric_threshold AND sample_size >= required_sample_size"
        side_effects:
          - "set observed_metric_value, completed_at = now"
          - "when eval_type == BIAS: use_case.safety_flag -> false"
          - "increments TestEvaluation.version by 1"

      - from: PLANNED
        to: FAILED
        trigger: "POST /test-evaluations/{id}/complete"
        actor: "SecurityReviewer | GovernanceOfficer"
        preconditions:
          - "evaluation.status == PLANNED"
          - "observed_metric_value < required_metric_threshold OR sample_size < required_sample_size"
        side_effects:
          - "set observed_metric_value, completed_at = now"
          - "when eval_type == BIAS: use_case.safety_flag -> true"
          - "when use_case.status IN {UNDER_REVIEW, READY_FOR_APPROVAL}: use_case.status -> CHANGES_REQUESTED"
          - "increments TestEvaluation.version by 1"
        note: "divergent branch: a failed BIAS run raises safety_flag and pushes the intake back, a failed ROBUSTNESS run only pushes it back"

      - from: PLANNED
        to: VOIDED
        trigger: "system cascade when the bound ModelBinding leaves PINNED"
        actor: system
        preconditions:
          - "the ModelBinding named by model_binding_id moved to STALE or RETIRED"
        side_effects:
          - "increments TestEvaluation.version by 1"

  - entity: OversightDesign
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    shape: "branching: decide forks on the adequacy threshold"
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /oversight-designs/{id}/decide (decision APPROVE)"
        actor: GovernanceOfficer
        preconditions:
          - "design.status == DRAFT"
          - "adequacy_score >= required_adequacy_score (otherwise ERR_OVERSIGHT_DESIGN_INADEQUATE)"
          - "use_case.risk_tier is non-null"
        side_effects:
          - "decided_by_user_id = X-User-ID; decided_at = now"
          - "increments OversightDesign.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /oversight-designs/{id}/decide (decision REJECT)"
        actor: GovernanceOfficer
        preconditions:
          - "design.status == DRAFT"
        side_effects:
          - "decided_by_user_id = X-User-ID; decided_at = now"
          - "increments OversightDesign.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /use-cases/{id}/oversight-designs (system supersession)"
        actor: system
        preconditions:
          - "a newer OversightDesign is being filed on the same use case while this one is still DRAFT"
        side_effects:
          - "decided_by_user_id = the literal system; decided_at = now"
          - "increments OversightDesign.version by 1"
        note: "the supersede half of concurrency_rules[oversight-design-create-stale-use-case]"

  - entity: DisclosureNotice
    initial_state: PUBLISHED
    terminal_states: [WITHDRAWN]
    shape: linear
    transitions:
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /disclosure-notices/{id}/withdraw or system cascade from POST /use-cases/{id}/revoke"
        actor: "Requester | GovernanceOfficer | system"
        preconditions:
          - "notice.status == PUBLISHED"
          - "when the actor is Requester: X-User-ID == use_case.requester_user_id"
        side_effects:
          - "withdrawn_at = now"
          - "the jurisdiction slot this notice occupied becomes free for a new PUBLISHED notice"
          - "increments DisclosureNotice.version by 1"

  - entity: MonitoringIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    shape: "branching with a return edge: contain forks on the containment deadline, ESCALATED can still be contained"
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "POST /monitoring-incidents/{id}/contain"
        actor: "GovernanceOfficer | SecurityReviewer"
        preconditions:
          - "incident.status == OPEN"
          - "now <= containment_deadline_at"
        side_effects:
          - "contained_at = now"
          - "recompute use_case.monitoring_posture; when it returns to HEALTHY and the use case is SUSPENDED, the use case is NOT reinstated here (reinstatement happens on resolve)"
          - "increments MonitoringIncident.version by 1"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /monitoring-incidents/{id}/contain"
        actor: "GovernanceOfficer | SecurityReviewer"
        preconditions:
          - "incident.status == OPEN"
          - "now > containment_deadline_at"
        side_effects:
          - "contained_at stays null"
          - "recompute use_case.monitoring_posture (ESCALATED still counts as an unresolved incident)"
          - "increments MonitoringIncident.version by 1"
        note: "divergent branch of the same trigger: the deadline decides which state the contain call lands in"

      - from: ESCALATED
        to: CONTAINED
        trigger: "POST /monitoring-incidents/{id}/contain"
        actor: GovernanceOfficer
        preconditions:
          - "incident.status == ESCALATED"
          - "reported_to_regulator == true when severity == SEV1 AND use_case.affects_individuals == true (otherwise ERR_REGULATOR_REPORT_REQUIRED)"
        side_effects:
          - "contained_at = now"
          - "recompute use_case.monitoring_posture"
          - "increments MonitoringIncident.version by 1"

      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /monitoring-incidents/{id}/resolve"
        actor: GovernanceOfficer
        preconditions:
          - "incident.status == CONTAINED"
          - "reported_to_regulator == true when severity == SEV1 AND use_case.affects_individuals == true"
        side_effects:
          - "resolved_at = now"
          - "recompute use_case.monitoring_posture; when it becomes HEALTHY and the use case is SUSPENDED and now < approval_expires_at, the use case is reinstated to APPROVED and its APPROVAL_SUSPENDED bindings return to PINNED"
          - "increments MonitoringIncident.version by 1"

  - entity: ShadowDeployment
    initial_state: DISCOVERED
    terminal_states: [RETIRED, ENFORCED_BLOCK]
    shape: "branching fork: link, grace and retire are three divergent dispositions of one discovery"
    transitions:
      - from: DISCOVERED
        to: LINKED
        trigger: "POST /shadow-deployments/{id}/link"
        actor: GovernanceOfficer
        preconditions:
          - "shadow.status IN {DISCOVERED, GRACE_GRANTED}"
          - "the UseCase named by the body use_case_id has status == APPROVED"
          - "that use case has a ModelBinding with status == PINNED and model_asset_id == shadow.model_asset_id (otherwise ERR_SHADOW_LINK_MISMATCH)"
        side_effects:
          - "claimed_use_case_id = body use_case_id"
          - "increments ShadowDeployment.version by 1"
        note: "branch A: the deployment turns out to be covered by an existing approval"

      - from: DISCOVERED
        to: GRACE_GRANTED
        trigger: "POST /shadow-deployments/{id}/grant-grace"
        actor: GovernanceOfficer
        preconditions:
          - "shadow.status == DISCOVERED"
          - "now <= grace_deadline_at (otherwise ERR_GRACE_PERIOD_ELAPSED)"
          - "1 <= grace_days <= MAX_GRACE_EXTENSION_DAYS (otherwise ERR_GRACE_EXTENSION_EXCEEDED)"
        side_effects:
          - "grace_days_granted = grace_days; grace_deadline_at recomputed by calculations.shadow_grace_deadline"
          - "increments ShadowDeployment.version by 1"
        note: "branch B: the business gets a bounded window to either link or retire"

      - from: GRACE_GRANTED
        to: LINKED
        trigger: "POST /shadow-deployments/{id}/link"
        actor: GovernanceOfficer
        preconditions:
          - "same as DISCOVERED -> LINKED"
        side_effects:
          - "claimed_use_case_id = body use_case_id"
          - "increments ShadowDeployment.version by 1"

      - from: DISCOVERED
        to: RETIRED
        trigger: "POST /shadow-deployments/{id}/retire"
        actor: GovernanceOfficer
        preconditions:
          - "shadow.status IN {DISCOVERED, GRACE_GRANTED, LINKED}"
        side_effects:
          - "retired_at = now"
          - "increments ShadowDeployment.version by 1"
        note: "branch C: the unapproved deployment is torn down"

      - from: GRACE_GRANTED
        to: RETIRED
        trigger: "POST /shadow-deployments/{id}/retire"
        actor: GovernanceOfficer
        preconditions:
          - "shadow.status == GRACE_GRANTED"
        side_effects:
          - "retired_at = now"
          - "increments ShadowDeployment.version by 1"

      - from: LINKED
        to: RETIRED
        trigger: "POST /shadow-deployments/{id}/retire"
        actor: GovernanceOfficer
        preconditions:
          - "shadow.status == LINKED"
        side_effects:
          - "retired_at = now"
          - "increments ShadowDeployment.version by 1"

      - from: DISCOVERED
        to: ENFORCED_BLOCK
        trigger: "POST /_ops/governance-sweep (system, step 3)"
        actor: system
        preconditions:
          - "shadow.status IN {DISCOVERED, GRACE_GRANTED} AND now > grace_deadline_at"
        side_effects:
          - "hop 1: shadow.status -> ENFORCED_BLOCK"
          - "hop 2: caused by hop 1 - ModelAsset.enforced_shadow_count += 1; when the count becomes >= 1 AND asset.status == APPROVED_FOR_USE the asset -> RESTRICTED"
          - "hop 3: caused by hop 2 - every ACCEPTED VendorModelAssessment on that asset -> EXPIRED and vendor_terms_grade -> null"
          - "append GovernanceLedgerEntry(entry_type=SHADOW_ENFORCED, reach_delta=0, debt_delta=0.00) against claimed_use_case_id when it is non-null"
          - "increments ShadowDeployment.version by 1"

      - from: GRACE_GRANTED
        to: ENFORCED_BLOCK
        trigger: "POST /_ops/governance-sweep (system, step 3)"
        actor: system
        preconditions:
          - "shadow.status == GRACE_GRANTED AND now > grace_deadline_at"
        side_effects:
          - "same three-hop cascade as DISCOVERED -> ENFORCED_BLOCK"
          - "increments ShadowDeployment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent UseCase.version only)
# =============================================================================

concurrency_rules:
  - rule_id: binding-create-stale-use-case
    parent_entity: UseCase
    write_endpoint: "POST /use-cases/{id}/model-bindings"
    occ_field: "expected_use_case_version"
    description: |
      Creating a ModelBinding against a UseCase whose version has advanced past
      the value the client last observed is rejected with a stale-version
      conflict. Binding creation legitimately supersedes the prior PINNED
      binding (retiring it), so a second create observing identical state would
      itself succeed under the product semantics - the stale expected version is
      the only signal that the client's view of the use case predates a
      supersession it never saw.
    error_id: ERR_STALE_USE_CASE_VERSION
    http_status: 412

  - rule_id: oversight-design-create-stale-use-case
    parent_entity: UseCase
    write_endpoint: "POST /use-cases/{id}/oversight-designs"
    occ_field: "expected_use_case_version"
    description: |
      Filing an OversightDesign against a UseCase whose version has advanced
      past the value the client last observed is rejected with a stale-version
      conflict. Filing a design legitimately supersedes any prior DRAFT design
      on the same use case (the prior row moves to REJECTED), so a second filing
      that observes identical use-case state succeeds by design; the stale
      expected version is the only signal that the filer's picture of the risk
      tier the design must clear predates a change it never saw.
    error_id: ERR_STALE_USE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: risk_classification_score
    trigger: "POST /use-cases/{id}/classify (variant INTAKE_PROVISIONAL) and step 4 of approval_finalization on POST /use-cases/{id}/approve (variant DEPLOYMENT_FINAL)"
    algorithm: weighted_scoring
    formula: |
      # --- shared point contributions (identical in both variants) ---
      impact_points       = INDIVIDUAL_IMPACT_POINTS[use_case.individual_impact]
      autonomy_points     = AUTONOMY_POINTS[use_case.decision_autonomy]
      sensitivity_points  = SENSITIVITY_POINTS[use_case.data_sensitivity]
      reach_points        = first matching band of REACH_BANDS over use_case.deployed_headcount_reach
      jurisdiction_points = JURISDICTION_POINT_PER_HIGH_SCRUTINY
                            * count(j in use_case.jurisdictions where j in HIGH_SCRUTINY_JURISDICTIONS)
      base_score = impact_points + autonomy_points + sensitivity_points
                 + reach_points + jurisdiction_points

      # --- variant adjustments ---
      raw_score = base_score + vendor_penalty - control_credit
      risk_score = max(0, min(100, round_half_up(raw_score, 0)))

      # --- banding, with the override taking precedence over the bands ---
      forced_prohibited = (use_case.affects_individuals == true
                           AND use_case.individual_impact == CONSEQUENTIAL
                           AND use_case.decision_autonomy == FULLY_AUTOMATED
                           AND use_case.data_sensitivity == SPECIAL_CATEGORY)
      if forced_prohibited: risk_tier = PROHIBITED
      elif risk_score >= 85: risk_tier = PROHIBITED
      elif risk_score >= 70: risk_tier = HIGH
      elif risk_score >= 35: risk_tier = LIMITED
      else:                  risk_tier = MINIMAL
    input_set: "the UseCase row's own declared intake fields; the DEPLOYMENT_FINAL variant additionally reads ReviewGate rows of this use case with status == CLEARED, TestEvaluation rows of this use case with status == PASSED, and the ACCEPTED VendorModelAssessment of the asset behind the use case's PINNED ModelBinding. Gates and evaluations in any other status are excluded."
    constants:
      INDIVIDUAL_IMPACT_POINTS: { NONE: 0, LOW: 10, MATERIAL: 25, CONSEQUENTIAL: 40 }
      AUTONOMY_POINTS: { ADVISORY: 0, HUMAN_IN_LOOP: 8, HUMAN_ON_LOOP: 18, FULLY_AUTOMATED: 30 }
      SENSITIVITY_POINTS: { PUBLIC: 0, INTERNAL: 6, CONFIDENTIAL: 14, SPECIAL_CATEGORY: 24 }
      REACH_BANDS: "deployed_headcount_reach >= 100000 -> 6; >= 10000 -> 4; >= 1000 -> 2; else 0"
      HIGH_SCRUTINY_JURISDICTIONS: [EU, UK, US_CO]
      JURISDICTION_POINT_PER_HIGH_SCRUTINY: 3
      RISK_TIER_BANDS: "score >= 85 -> PROHIBITED; >= 70 -> HIGH; >= 35 -> LIMITED; else MINIMAL"
      CONTROL_CREDIT_CAP: 15
      CREDIT_PER_CLEARED_GATE: 3
      CREDIT_PER_PASSED_EVAL: 2
      VENDOR_PENALTY_BY_GRADE: { A: 0, B: 5, C: 12, D: 25 }
      PROHIBITED_COMBINATION: "affects_individuals == true AND individual_impact == CONSEQUENTIAL AND decision_autonomy == FULLY_AUTOMATED AND data_sensitivity == SPECIAL_CATEGORY; when it holds, risk_tier is forced to PROHIBITED regardless of score and rejection_reason is recorded as the literal PROHIBITED_COMBINATION"
    precision: "risk_score is an integer, round_half_up at 0 decimals, clamped to 0..100"
    variants:
      - name: INTAKE_PROVISIONAL
        when: "run by POST /use-cases/{id}/classify, before any gate or evaluation evidence exists"
        difference: "vendor_penalty = 0 and control_credit = 0 by definition; cleared_gate_count and passed_eval_count are recorded as 0 even when such rows exist, because the provisional variant scores the declaration, not the controls"
      - name: DEPLOYMENT_FINAL
        when: "run by the approve transition as step 4 of approval_finalization"
        difference: |
          vendor_penalty = 0 when the pinned binding's ModelAsset.is_third_party == false,
          otherwise VENDOR_PENALTY_BY_GRADE[that asset's ACCEPTED VendorModelAssessment.terms_grade].
          control_credit = min(CONTROL_CREDIT_CAP,
                               CREDIT_PER_CLEARED_GATE * cleared_gate_count
                               + CREDIT_PER_PASSED_EVAL * passed_eval_count).
          Identical declared intake fields therefore yield a strictly lower (or equal)
          final score than the provisional score whenever any control evidence exists,
          and can land in a lower tier band.

  - name: vendor_terms_grade
    trigger: "POST /model-assets/{id}/vendor-assessments (variant CONSERVATIVE_LEGAL) and POST /vendor-assessments/{id}/decide (variant taken from the body terms_variant)"
    algorithm: weighted_scoring
    formula: |
      provenance_points = PROVENANCE_POINTS[assessment.training_data_provenance]
                        + (UNDISCLOSED_CONSERVATIVE_SURCHARGE
                           if variant == CONSERVATIVE_LEGAL
                              and assessment.training_data_provenance == UNDISCLOSED
                           else 0)
      rights_points     = OUTPUT_RIGHTS_POINTS[assessment.output_rights]
      retention_points  = first matching band of RETENTION_BANDS over effective_retention_days
      opt_out_points    = 0 if assessment.retention_opt_out else NO_OPT_OUT_POINTS
      subproc_points    = 0 if assessment.subprocessors_disclosed else UNDISCLOSED_SUBPROCESSOR_POINTS

      terms_risk_points = provenance_points + rights_points + retention_points
                        + opt_out_points + subproc_points

      if   terms_risk_points <= 8:  terms_grade = A
      elif terms_risk_points <= 20: terms_grade = B
      elif terms_risk_points <= 34: terms_grade = C
      else:                         terms_grade = D
    input_set: "the single VendorModelAssessment row being scored; no other rows participate"
    constants:
      PROVENANCE_POINTS: { DOCUMENTED_LICENSED: 0, DOCUMENTED_MIXED: 8, UNDISCLOSED: 20 }
      UNDISCLOSED_CONSERVATIVE_SURCHARGE: 10
      OUTPUT_RIGHTS_POINTS: { FULL_ASSIGNMENT: 0, LICENSE_WITH_RESTRICTIONS: 6, VENDOR_RETAINS: 16 }
      RETENTION_BANDS: "effective_retention_days <= 30 -> 0; <= 90 -> 5; <= 365 -> 10; else 18"
      NO_OPT_OUT_POINTS: 6
      UNDISCLOSED_SUBPROCESSOR_POINTS: 5
      ASSUMED_WORST_RETENTION_DAYS: 3650
      TERMS_GRADE_BANDS: "points <= 8 -> A; <= 20 -> B; <= 34 -> C; else D"
    precision: "terms_risk_points is an integer-valued number; no rounding is required because every contribution is an integer constant"
    variants:
      - name: CONSERVATIVE_LEGAL
        when: "always applied at submission time by POST /model-assets/{id}/vendor-assessments, and applied at decide time when the body terms_variant == CONSERVATIVE_LEGAL"
        difference: "effective_retention_days = ASSUMED_WORST_RETENTION_DAYS whenever retention_days is null OR retention_opt_out == false, otherwise the declared retention_days; UNDISCLOSED provenance additionally carries UNDISCLOSED_CONSERVATIVE_SURCHARGE"
      - name: DOCUMENTED_TERMS
        when: "applied only by POST /vendor-assessments/{id}/decide when the body terms_variant == DOCUMENTED_TERMS; requires retention_days to be non-null"
        difference: "effective_retention_days = the declared retention_days verbatim and no provenance surcharge is added, so the same stored row can grade two bands better than under CONSERVATIVE_LEGAL"

  - name: oversight_adequacy_score
    trigger: "POST /use-cases/{id}/oversight-designs (on create) and re-evaluated on POST /oversight-designs/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      mode_base        = MODE_BASE[design.review_mode]
      sample_component = min(SAMPLE_COMPONENT_CAP, floor(design.sample_pct * SAMPLE_WEIGHT))
                         if design.review_mode == SAMPLED else 0
      sla_component    = max(0, SLA_BASE_POINTS - floor(design.escalation_sla_hours / SLA_HOURS_PER_POINT))
      override_component = OVERRIDE_POINTS if design.override_capability else 0

      adequacy_score = min(100, mode_base + sample_component + sla_component + override_component)

      required_adequacy_score = REQUIRED_ADEQUACY[use_case.risk_tier][use_case.decision_autonomy]
    input_set: "the OversightDesign row being scored plus exactly two fields of its parent UseCase: risk_tier (the provisional tier, never final_risk_tier) and decision_autonomy"
    constants:
      MODE_BASE: { NONE: 0, SAMPLED: 30, PRE_DECISION_REVIEW: 70, DUAL_REVIEW: 90 }
      SAMPLE_WEIGHT: 0.3
      SAMPLE_COMPONENT_CAP: 30
      SLA_BASE_POINTS: 20
      SLA_HOURS_PER_POINT: 6
      OVERRIDE_POINTS: 10
      REQUIRED_ADEQUACY:
        HIGH:    { ADVISORY: 60, HUMAN_IN_LOOP: 75, HUMAN_ON_LOOP: 85, FULLY_AUTOMATED: 95 }
        LIMITED: { ADVISORY: 45, HUMAN_IN_LOOP: 60, HUMAN_ON_LOOP: 70, FULLY_AUTOMATED: 80 }
        MINIMAL: { ADVISORY: 30, HUMAN_IN_LOOP: 30, HUMAN_ON_LOOP: 30, FULLY_AUTOMATED: 30 }
        PROHIBITED: { ADVISORY: 100, HUMAN_IN_LOOP: 100, HUMAN_ON_LOOP: 100, FULLY_AUTOMATED: 100 }
    precision: "adequacy_score is integer-valued; floor() is applied inside sample_component and sla_component before the outer min/max, never after"
    variants: []
    note: "combinatorial mode (a): four inputs interact non-linearly - a nested min inside a conditional branch on review_mode, a clamped-at-zero max on the SLA term, and a two-dimensional tiered threshold selection for required_adequacy_score"

  - name: control_debt_index
    trigger: "POST /review-gates/{id}/issue-conditions (per-gate value) and every read of GET /inventory-summary (portfolio total)"
    algorithm: aggregation
    formula: |
      # ---- per-gate value, rounded to 2 decimals AT THE GATE ----
      gate_debt(g) = round_half_up(
                       GATE_WEIGHT[g.gate_type]
                       * (g.open_condition_count / OPEN_CONDITION_DIVISOR)
                       * TIER_MULTIPLIER[g.pinned_risk_tier],
                       2)

      # ---- portfolio total: SUM OF THE ALREADY-ROUNDED per-gate values ----
      # Rounding order is pinned: round per gate first, then sum. Summing the
      # unrounded products and rounding once at the end is WRONG and produces a
      # different cent value.
      control_debt_index_total = sum(g.control_debt_index
                                     for g in ReviewGate
                                     where g.status IN {PENDING, IN_REVIEW, CONDITIONS_ISSUED, CLEARED})
    input_set: "ReviewGate rows with status IN {PENDING, IN_REVIEW, CONDITIONS_ISSUED, CLEARED}; VOIDED gates are excluded entirely. A gate not in CONDITIONS_ISSUED contributes exactly 0.00 because its open_condition_count is 0."
    constants:
      GATE_WEIGHT: { LEGAL: 1.35, PRIVACY: 1.25, SECURITY: 1.15, BUSINESS: 0.75 }
      OPEN_CONDITION_DIVISOR: 3
      TIER_MULTIPLIER: { MINIMAL: 0.5, LIMITED: 1.0, HIGH: 1.5, PROHIBITED: 2.0 }
    precision: "2 decimal places, round_half_up, applied once per gate and never again to the sum"
    variants: []
    note: "combinatorial mode (b): the scaffold pins round-per-gate-then-sum. For a HIGH-tier use case whose LEGAL gate holds 2 conditions and whose PRIVACY, SECURITY and BUSINESS gates each hold 1, the pinned order yields 1.35 + 0.63 + 0.58 + 0.38 = 2.94, whereas sum-then-round yields 2.93."

  - name: approval_finalization
    trigger: "POST /use-cases/{id}/approve"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED. The dependency graph looks circular -
      # required_gate_types came from the provisional tier, control_credit comes
      # from the gates that tier demanded, the final tier comes from
      # control_credit, and the reassessment interval comes from the final tier -
      # so the value is only well defined because these six steps run in order.

      step 1  freeze evidence:
                cleared_gate_count = count(ReviewGate where use_case_id == U.id
                                                       and status == CLEARED)
                passed_eval_count  = count(TestEvaluation where use_case_id == U.id
                                                          and status == PASSED)
      step 2  control_credit = min(CONTROL_CREDIT_CAP,
                                   CREDIT_PER_CLEARED_GATE * cleared_gate_count
                                   + CREDIT_PER_PASSED_EVAL * passed_eval_count)
      step 3  binding = the ModelBinding of U with status == PINNED
              asset   = ModelAsset[binding.model_asset_id]
              vendor_penalty = 0 if asset.is_third_party == false
                               else VENDOR_PENALTY_BY_GRADE[asset.vendor_terms_grade]
      step 4  final_risk_score, final_risk_tier =
                risk_classification_score variant DEPLOYMENT_FINAL, using the
                control_credit from step 2 and the vendor_penalty from step 3
      step 5  reassessment_interval_days = REASSESSMENT_INTERVAL_DAYS[final_risk_tier]
      step 6  approved_at          = now
              approval_expires_at  = now + reassessment_interval_days days
              reassessment_due_at  = the same instant as approval_expires_at
              reassessment_cycle_index = 1
              reassessment_status  = SCHEDULED
    input_set: "ReviewGate rows of U with status == CLEARED; TestEvaluation rows of U with status == PASSED; the single ModelBinding of U with status == PINNED and its ModelAsset; that asset's VendorModelAssessment with status == ACCEPTED (when more than one has ever been accepted, the asset's current vendor_terms_grade field is authoritative)"
    constants:
      REASSESSMENT_INTERVAL_DAYS: { MINIMAL: 730, LIMITED: 365, HIGH: 180 }
      REASSESSMENT_OVERDUE_GRACE_DAYS: 30
      PORTFOLIO_HIGH_TIER_REACH_CAP: 250000
      INVENTORY_STATUSES: [APPROVED, UNDER_REASSESSMENT, SUSPENDED]
      REQUIRED_GATES:
        MINIMAL: [BUSINESS]
        LIMITED: [PRIVACY, BUSINESS]
        HIGH: [LEGAL, PRIVACY, SECURITY, BUSINESS]
        PROHIBITED: []
      REQUIRED_EVALS:
        MINIMAL: []
        LIMITED: [BIAS]
        HIGH: [BIAS, ROBUSTNESS, HALLUCINATION]
        PROHIBITED: []
    precision: "day arithmetic is exact calendar-day addition on the logical clock in UTC; no rounding"
    variants: []
    note: "combinatorial mode (c): a circular-looking dependency resolved by an explicit six-step order"

  - name: eval_threshold_profile
    trigger: "POST /test-evaluations (profile frozen at creation) and re-read by POST /test-evaluations/{id}/complete"
    algorithm: threshold
    formula: |
      tier = use_case.risk_tier                       # the provisional tier, pinned at create time
      required_metric_name     = METRIC_BY_EVAL_TYPE[evaluation.eval_type]
      required_metric_threshold = EVAL_THRESHOLDS[tier][evaluation.eval_type]
      required_sample_size      = MIN_SAMPLE_SIZE[tier]

      observed_metric_value = the body field named by required_metric_name
      passed = (observed_metric_value >= required_metric_threshold)
               AND (sample_size >= required_sample_size)
      # Both comparisons are >= : a value exactly equal to the threshold PASSES.
    input_set: "the single TestEvaluation row plus its parent UseCase's risk_tier at the instant the evaluation was created"
    constants:
      METRIC_BY_EVAL_TYPE:
        BIAS: worst_group_parity_ratio
        ROBUSTNESS: adversarial_pass_rate
        HALLUCINATION: grounded_accuracy
        SECURITY_REDTEAM: adversarial_pass_rate
      EVAL_THRESHOLDS:
        HIGH:    { BIAS: 0.80, ROBUSTNESS: 0.90, HALLUCINATION: 0.95, SECURITY_REDTEAM: 0.95 }
        LIMITED: { BIAS: 0.70, ROBUSTNESS: 0.80, HALLUCINATION: 0.85, SECURITY_REDTEAM: 0.85 }
        MINIMAL: { BIAS: 0.60, ROBUSTNESS: 0.70, HALLUCINATION: 0.75, SECURITY_REDTEAM: 0.75 }
        PROHIBITED: { BIAS: 1.00, ROBUSTNESS: 1.00, HALLUCINATION: 1.00, SECURITY_REDTEAM: 1.00 }
      MIN_SAMPLE_SIZE: { MINIMAL: 100, LIMITED: 300, HIGH: 1000, PROHIBITED: 1000 }
    precision: "metrics are compared at 4 decimal places as supplied; no rounding is applied before the comparison"
    variants: []

  - name: window_conflict_detection
    trigger: "POST /test-evaluations (evaluation windows) and POST /use-cases/{id}/disclosure-notices (notice windows)"
    algorithm: interval_merge
    formula: |
      # ---- evaluation windows: HALF-OPEN [window_start_at, window_end_at) ----
      # resource key: the ModelAsset behind the new evaluation's model_binding_id
      # candidate set: TestEvaluation rows whose model_binding_id points at ANY
      #                binding of that same asset, with status IN EVALUATION_WINDOW_STATUSES
      evaluation_conflict(new, existing) =
          new.window_start_at <  existing.window_end_at
      AND existing.window_start_at <  new.window_end_at
      # Touching windows do NOT conflict: existing = [T1, T2), new = [T2, T3) is
      # accepted because the comparison is strict on both sides.

      # ---- notice windows: CLOSED [effective_from, effective_to] + buffer ----
      # resource key: the triple (use_case_id, notice_type, jurisdiction)
      # candidate set: DisclosureNotice rows on that key with status == PUBLISHED
      notice_conflict(new, existing) =
          new.effective_from <= existing.effective_to
                                + DISCLOSURE_QUIET_BUFFER_DAYS days
      AND existing.effective_from <= new.effective_to
                                + DISCLOSURE_QUIET_BUFFER_DAYS days
      # Touching windows DO conflict, and so does any new window starting within
      # DISCLOSURE_QUIET_BUFFER_DAYS days after an existing one ends: for an
      # existing window ending 2026-09-30T00:00:00Z the earliest accepted start
      # is 2026-10-08T00:00:00Z.
    input_set: "for evaluations, TestEvaluation rows with status IN {PLANNED, PASSED, FAILED} reachable from the same ModelAsset through any of its ModelBinding rows (VOIDED evaluations are excluded and free their window); for notices, DisclosureNotice rows with status == PUBLISHED on the same (use_case_id, notice_type, jurisdiction) triple (WITHDRAWN notices are excluded and free their slot)"
    constants:
      DISCLOSURE_QUIET_BUFFER_DAYS: 7
      EVALUATION_WINDOW_STATUSES: [PLANNED, PASSED, FAILED]
      DISCLOSURE_WINDOW_STATUSES: [PUBLISHED]
    precision: "instant comparisons are exact to the second in UTC; the buffer is exact calendar-day addition"
    variants: []
    note: "the two interval semantics are deliberately different: the test-capacity resource is half-open and permits adjacency, the statutory-notice slot is closed and forbids adjacency within a quiet buffer"

  - name: incident_containment_deadline
    trigger: "POST /monitoring-incidents"
    algorithm: threshold
    formula: |
      effective_tier   = use_case.final_risk_tier if it is non-null else use_case.risk_tier
      containment_hours = ceil(CONTAINMENT_BASE_HOURS[incident.severity]
                               * TIER_SPEED_FACTOR[effective_tier])
      containment_deadline_at = incident.detected_at + containment_hours hours
    input_set: "the single MonitoringIncident row plus its parent UseCase's effective tier"
    constants:
      CONTAINMENT_BASE_HOURS: { SEV1: 4, SEV2: 24, SEV3: 72 }
      TIER_SPEED_FACTOR: { MINIMAL: 1.5, LIMITED: 1.0, HIGH: 0.5, PROHIBITED: 0.5 }
    precision: "containment_hours is an integer produced by ceil(); the deadline is exact hour arithmetic in UTC"
    variants: []

  - name: monitoring_posture_derivation
    trigger: "POST /monitoring-incidents, POST /monitoring-incidents/{id}/contain, POST /monitoring-incidents/{id}/resolve"
    algorithm: aggregation
    formula: |
      unresolved = MonitoringIncident rows where use_case_id == U.id
                                        and status IN {OPEN, ESCALATED}
      if any(i.severity == SEV1 for i in unresolved): monitoring_posture = IMPAIRED
      elif len(unresolved) >= 1:                      monitoring_posture = WATCH
      else:                                           monitoring_posture = HEALTHY
    input_set: "MonitoringIncident rows of the use case with status IN {OPEN, ESCALATED}; CONTAINED and RESOLVED incidents are excluded"
    constants: {}
    precision: "exact enum derivation; order-independent, so no tie-break is required"
    variants: []

  - name: shadow_grace_deadline
    trigger: "POST /shadow-deployments and POST /shadow-deployments/{id}/grant-grace"
    algorithm: threshold
    formula: |
      grace_deadline_at = shadow.discovered_at
                        + (BASE_GRACE_DAYS[shadow.environment] + shadow.grace_days_granted) days
      # grant-grace sets grace_days_granted = body grace_days (it overwrites, it
      # does not accumulate) and is rejected when grace_days exceeds
      # MAX_GRACE_EXTENSION_DAYS or when now is already past grace_deadline_at.
    input_set: "the single ShadowDeployment row"
    constants:
      BASE_GRACE_DAYS: { SANDBOX: 30, INTERNAL_PILOT: 14, PRODUCTION: 7 }
      MAX_GRACE_EXTENSION_DAYS: 30
    precision: "exact calendar-day addition in UTC"
    variants: []

  - name: inventory_conserved_quantities
    trigger: "GET /inventory-summary, and asserted as an invariant after every approve, revoke, suspend, reinstate, clear and reopen"
    algorithm: aggregation
    formula: |
      portfolio_approved_reach =
        sum(u.deployed_headcount_reach for u in UseCase where u.status IN INVENTORY_STATUSES)

      portfolio_approved_reach_high_tier =
        sum(u.deployed_headcount_reach for u in UseCase
            where u.status IN INVENTORY_STATUSES and u.final_risk_tier == HIGH)

      control_debt_index_total =
        sum(g.control_debt_index for g in ReviewGate
            where g.status IN {PENDING, IN_REVIEW, CONDITIONS_ISSUED, CLEARED})

      ledger_reach_balance = sum(e.reach_delta for e in GovernanceLedgerEntry)
      ledger_debt_balance  = sum(e.debt_delta  for e in GovernanceLedgerEntry)

      # ---- conserved quantity 1: inventory headcount reach ----
      # INVARIANT R: ledger_reach_balance == portfolio_approved_reach at all times.
      # A forward approve (+deployed_headcount_reach) paired with its compensating
      # revoke (-deployed_headcount_reach) leaves portfolio_approved_reach at its
      # pre-approval value and leaves sum(reach_delta) for that use case at 0.
      # Suspend and reinstate contribute reach_delta 0 because SUSPENDED is inside
      # INVENTORY_STATUSES, so posture churn cannot drift the reach total.

      # ---- conserved quantity 2: review control debt ----
      # INVARIANT D: for any gate g, the pair (clear, reopen) is debt-neutral:
      # control_debt_index_total returns to its exact pre-clear cent value and
      # sum(e.debt_delta for e in GovernanceLedgerEntry where e.use_case_id == U.id)
      # returns to 0.00. Gate VOIDing is deliberately NOT compensating: it removes
      # the gate's contribution permanently and appends no ledger entry.
    input_set: "all UseCase rows with status IN INVENTORY_STATUSES; all ReviewGate rows with status != VOIDED; all GovernanceLedgerEntry rows"
    constants:
      INVENTORY_STATUSES: [APPROVED, UNDER_REASSESSMENT, SUSPENDED]
      PORTFOLIO_HIGH_TIER_REACH_CAP: 250000
    precision: "reach quantities are exact integers; debt quantities are sums of values already rounded to 2 decimals, so the total is exact at 2 decimals"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "the {id} path segment of a /use-cases/{id}... path resolves to a UseCase row"
    error_id: ERR_USE_CASE_NOT_FOUND
    http_status: 404
    applies_to: "every /use-cases/{id}... path"

  - priority: 4
    category: existence
    check: "the {id} path segment of a /model-assets/{id}... path resolves to a ModelAsset row"
    error_id: ERR_MODEL_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "every /model-assets/{id}... path"

  - priority: 5
    category: existence
    check: "the {id} path segment of a /review-gates/{id}... path resolves to a ReviewGate row"
    error_id: ERR_REVIEW_GATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /review-gates/{id}/start-review, /issue-conditions, /clear, /reopen"

  - priority: 6
    category: existence
    check: "the {id} path segment of a /vendor-assessments, /oversight-designs, /test-evaluations, /disclosure-notices, /monitoring-incidents or /shadow-deployments path resolves to a row of the matching entity"
    error_id: ERR_GOVERNANCE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "POST /vendor-assessments/{id}/decide, POST /oversight-designs/{id}/decide, GET+POST /test-evaluations/{id}..., POST /disclosure-notices/{id}/withdraw, GET+POST /monitoring-incidents/{id}..., GET+POST /shadow-deployments/{id}..."

  - priority: 7
    category: existence
    check: "body foreign keys resolve, checked left-to-right in the order the fields appear in the endpoint's input list: use_case_id -> ERR_USE_CASE_NOT_FOUND, model_asset_id -> ERR_MODEL_ASSET_NOT_FOUND, model_binding_id / claimed_use_case_id / predecessor_use_case_id -> ERR_GOVERNANCE_RECORD_NOT_FOUND or ERR_USE_CASE_NOT_FOUND respectively"
    error_id: ERR_GOVERNANCE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "POST /use-cases, POST /test-evaluations, POST /monitoring-incidents, POST /shadow-deployments, POST /use-cases/{id}/model-bindings, POST /shadow-deployments/{id}/link"

  - priority: 8
    category: business_constraint
    check: "request body shape: every required field present, types correct, enum values inside their declared sets, window_end_at strictly after window_start_at, effective_to strictly after effective_from, sample_pct within 0..100, escalation_sla_hours within 0..240, deployed_headcount_reach >= 0, locale_count >= 1, jurisdictions free of duplicates, at least one updatable field on PATCH"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body"

  - priority: 9
    category: state
    check: "expected_use_case_version equals the current UseCase.version"
    error_id: ERR_STALE_USE_CASE_VERSION
    http_status: 412
    applies_to: "POST /use-cases/{id}/classify, POST /use-cases/{id}/model-bindings, POST /use-cases/{id}/oversight-designs, POST /use-cases/{id}/approve"

  - priority: 10
    category: state
    check: "the addressed UseCase (directly, or as the parent of the addressed child row) is not in a terminal status REJECTED or REVOKED"
    error_id: ERR_USE_CASE_TERMINAL
    http_status: 409
    applies_to: "every mutating endpoint whose target resolves to a UseCase or one of its children"

  - priority: 11
    category: state
    check: "use_case.status == DRAFT"
    error_id: ERR_USE_CASE_NOT_IN_DRAFT
    http_status: 409
    applies_to: "POST /use-cases/{id}/classify"

  - priority: 12
    category: state
    check: "the addressed ReviewGate is in a status from which the requested transition exists: start-review needs PENDING or CONDITIONS_ISSUED, issue-conditions needs IN_REVIEW, clear needs IN_REVIEW or CONDITIONS_ISSUED, reopen needs CLEARED"
    error_id: ERR_GATE_NOT_IN_REVIEWABLE_STATE
    http_status: 409
    applies_to: "POST /review-gates/{id}/start-review, /issue-conditions, /clear, /reopen"

  - priority: 13
    category: state
    check: "use_case.status == READY_FOR_APPROVAL"
    error_id: ERR_USE_CASE_NOT_READY_FOR_APPROVAL
    http_status: 409
    applies_to: "POST /use-cases/{id}/approve"

  - priority: 14
    category: state
    check: "use_case.status == UNDER_REASSESSMENT"
    error_id: ERR_REASSESSMENT_NOT_DUE
    http_status: 409
    applies_to: "POST /use-cases/{id}/complete-reassessment"

  - priority: 15
    category: state
    check: "the addressed VendorModelAssessment is SUBMITTED, or the addressed OversightDesign is DRAFT"
    error_id: ERR_ASSESSMENT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /vendor-assessments/{id}/decide, POST /oversight-designs/{id}/decide"

  - priority: 16
    category: state
    check: "the addressed TestEvaluation is PLANNED"
    error_id: ERR_EVALUATION_NOT_PLANNED
    http_status: 409
    applies_to: "POST /test-evaluations/{id}/complete"

  - priority: 17
    category: state
    check: "the addressed MonitoringIncident is in a status from which the requested transition exists: contain needs OPEN or ESCALATED, resolve needs CONTAINED"
    error_id: ERR_INCIDENT_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /monitoring-incidents/{id}/contain, POST /monitoring-incidents/{id}/resolve"

  - priority: 18
    category: state
    check: "the addressed ShadowDeployment is not already RETIRED or ENFORCED_BLOCK, and grant-grace additionally requires DISCOVERED"
    error_id: ERR_SHADOW_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /shadow-deployments/{id}/link, /grant-grace, /retire"

  - priority: 19
    category: state
    check: "the addressed DisclosureNotice is PUBLISHED"
    error_id: ERR_NOTICE_ALREADY_WITHDRAWN
    http_status: 409
    applies_to: "POST /disclosure-notices/{id}/withdraw"

  - priority: 20
    category: state
    check: "the ModelAsset is in a status from which the requested transition exists: approve-for-use needs REGISTERED or RESTRICTED (and a RESTRICTED asset additionally needs enforced_shadow_count == 0), while PATCH /model-assets/{id} needs APPROVED_FOR_USE because the revise-in-place transition is declared only on that state"
    error_id: ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE
    http_status: 409
    applies_to: "POST /model-assets/{id}/approve-for-use, PATCH /model-assets/{id}"

  - priority: 21
    category: business_safety
    check: "use_case.risk_tier != PROHIBITED"
    error_id: ERR_PROHIBITED_USE_CASE
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve, POST /oversight-designs/{id}/decide, POST /use-cases/{id}/model-bindings"

  - priority: 22
    category: business_safety
    check: "use_case.safety_flag == false, i.e. no BIAS TestEvaluation on this use case has ended FAILED without a later PASSED BIAS run"
    error_id: ERR_BIAS_EVALUATION_FAILED
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve"

  - priority: 23
    category: business_safety
    check: "the two applies_to endpoints consult DIFFERENT evidence sets. On POST /use-cases/{id}/approve: every eval_type in REQUIRED_EVALS[use_case.risk_tier] has a TestEvaluation with status == PASSED on this use case. On POST /review-gates/{id}/clear the tier list is NOT consulted at all; the single extra rule is that clearing a gate whose gate_type == SECURITY requires a PASSED SECURITY_REDTEAM evaluation on the use case, and clearing a PRIVACY or BUSINESS gate requires no evaluation evidence whatsoever"
    error_id: ERR_REQUIRED_EVALUATION_MISSING
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve, POST /review-gates/{id}/clear"

  - priority: 24
    category: business_safety
    check: "an OversightDesign with status == APPROVED exists for the use case"
    error_id: ERR_OVERSIGHT_DESIGN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve"

  - priority: 25
    category: business_safety
    check: "design.adequacy_score >= design.required_adequacy_score when the decision is APPROVE"
    error_id: ERR_OVERSIGHT_DESIGN_INADEQUATE
    http_status: 422
    applies_to: "POST /oversight-designs/{id}/decide"

  - priority: 26
    category: business_constraint
    check: "segregation of duties: the reviewer clearing a gate is not the use case requester, and the GovernanceOfficer approving is neither the requester nor any reviewer who cleared a gate on this use case; the officer completing a reassessment is not the requester"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /review-gates/{id}/clear, POST /use-cases/{id}/approve, POST /use-cases/{id}/complete-reassessment"

  - priority: 27
    category: business_constraint
    check: "X-User-Role == GATE_ROLE_MAP[gate.gate_type], i.e. LegalReviewer owns LEGAL, PrivacyReviewer owns PRIVACY, SecurityReviewer owns SECURITY, BusinessReviewer owns BUSINESS"
    error_id: ERR_GATE_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /review-gates/{id}/start-review, /issue-conditions, /clear"

  - priority: 28
    category: business_referential
    check: "a ModelBinding with status == PINNED exists for the use case"
    error_id: ERR_MODEL_BINDING_MISSING
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve, POST /review-gates/{id}/clear (LEGAL gate only)"

  - priority: 29
    category: business_referential
    check: "the PINNED ModelBinding's pinned_model_version equals its ModelAsset's current version"
    error_id: ERR_MODEL_BINDING_STALE
    http_status: 409
    applies_to: "POST /use-cases/{id}/approve"

  - priority: 30
    category: business_referential
    check: "the referenced ModelAsset has status == APPROVED_FOR_USE"
    error_id: ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE
    http_status: 422
    applies_to: "POST /use-cases/{id}/model-bindings"

  - priority: 31
    category: business_referential
    check: "a third-party asset has a VendorModelAssessment with status == ACCEPTED and terms_grade IN {A, B, C}"
    error_id: ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /model-assets/{id}/approve-for-use, POST /review-gates/{id}/clear (LEGAL gate only)"

  - priority: 32
    category: business_referential
    check: "terms_variant == DOCUMENTED_TERMS requires assessment.retention_days to be non-null"
    error_id: ERR_RETENTION_TERMS_UNDOCUMENTED
    http_status: 422
    applies_to: "POST /vendor-assessments/{id}/decide"

  - priority: 33
    category: business_referential
    check: "the link target UseCase has status == APPROVED and owns a PINNED ModelBinding whose model_asset_id equals the shadow deployment's model_asset_id"
    error_id: ERR_SHADOW_LINK_MISMATCH
    http_status: 422
    applies_to: "POST /shadow-deployments/{id}/link"

  - priority: 34
    category: business_temporal
    check: "for every jurisdiction in use_case.jurisdictions a DisclosureNotice exists with status == PUBLISHED and effective_from <= now <= effective_to"
    error_id: ERR_DISCLOSURE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve, POST /review-gates/{id}/clear (PRIVACY gate only)"

  - priority: 35
    category: business_temporal
    check: "closed-interval overlap with a mandatory quiet buffer: the new notice's [effective_from, effective_to] must not intersect, and must not start within DISCLOSURE_QUIET_BUFFER_DAYS days after the effective_to of, any PUBLISHED DisclosureNotice on the same use case with the same notice_type and jurisdiction"
    error_id: ERR_DISCLOSURE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /use-cases/{id}/disclosure-notices"

  - priority: 36
    category: business_constraint
    check: "half-open-interval overlap: the new evaluation's [window_start_at, window_end_at) must not intersect the window of any TestEvaluation with status IN {PLANNED, PASSED, FAILED} on a ModelBinding pointing at the same ModelAsset; touching windows where one ends exactly when the next begins are allowed"
    error_id: ERR_EVALUATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /test-evaluations"

  - priority: 37
    category: business_temporal
    check: "a SEV1 incident on a use case with affects_individuals == true has reported_to_regulator == true before it may be contained out of ESCALATED or resolved"
    error_id: ERR_REGULATOR_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /monitoring-incidents/{id}/contain (from ESCALATED), POST /monitoring-incidents/{id}/resolve"

  - priority: 38
    category: business_temporal
    check: "now <= shadow.grace_deadline_at"
    error_id: ERR_GRACE_PERIOD_ELAPSED
    http_status: 409
    applies_to: "POST /shadow-deployments/{id}/grant-grace"

  - priority: 39
    category: business_constraint
    check: "1 <= grace_days <= MAX_GRACE_EXTENSION_DAYS"
    error_id: ERR_GRACE_EXTENSION_EXCEEDED
    http_status: 422
    applies_to: "POST /shadow-deployments/{id}/grant-grace"

  - priority: 40
    category: business_temporal
    check: "now <= use_case.approval_expires_at (INCLUSIVE: because approve sets reassessment_due_at equal to approval_expires_at, a reassessment can only ever open at an instant that is already >= the expiry, so a strict comparison here would make both complete-reassessment outcomes unreachable; the error therefore fires only strictly after the expiry instant, which is reachable by sweeping at exactly approval_expires_at and then advancing the clock without sweeping again)"
    error_id: ERR_APPROVAL_EXPIRED
    http_status: 409
    applies_to: "POST /use-cases/{id}/complete-reassessment"

  - priority: 41
    category: business_fiscal
    check: "evaluated after step 4 of calculations.approval_finalization has produced final_risk_tier, and only when that tier is HIGH: portfolio_approved_reach_high_tier computed over the INVENTORY_STATUSES rows plus this use case's own deployed_headcount_reach must not exceed PORTFOLIO_HIGH_TIER_REACH_CAP; a use case whose final tier is LIMITED or MINIMAL never consults the cap"
    error_id: ERR_PORTFOLIO_REACH_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /use-cases/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Path convention: the primary resource identifier is always the literal
# placeholder `{id}`; sub-resource GETs hang off `/<parent-collection>/{id}/`.
# =============================================================================

endpoints:
  # --------------------------- ModelAsset registry ---------------------------
  - method: POST
    path: "/model-assets"
    description: "register a model asset in the inventory; third-party assets cannot be approved for use until a vendor assessment is accepted"
    roles: [GovernanceOfficer]
    code: 201
    input: [provider, model_name, model_version, hosting, modality, is_third_party]
    output: ModelAsset
    side_effects: ["creates ModelAsset in status REGISTERED with version 1, active_binding_count 0, enforced_shadow_count 0, vendor_terms_grade null"]

  - method: GET
    path: "/model-assets"
    description: "list registered model assets, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "provider?", "is_third_party?", "limit?", "offset?"]
    output: ModelAsset[]
    side_effects: []

  - method: GET
    path: "/model-assets/{id}"
    description: "read one model asset including its current version, which is what bindings pin against"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: []
    output: ModelAsset
    side_effects: []

  - method: PATCH
    path: "/model-assets/{id}"
    description: "revise the asset's vendor-declared version label or deployment attributes; every revision bumps ModelAsset.version, which is what makes previously pinned bindings stale"
    roles: [GovernanceOfficer]
    code: 200
    input: ["model_version?", "hosting?", "modality?"]
    output: ModelAsset
    side_effects:
      - "increments ModelAsset.version by 1"
      - "every ModelBinding on this asset with status == PINNED and pinned_model_version < the new version -> STALE with superseded_reason = ASSET_REAPPROVED"
      - "every TestEvaluation with status == PLANNED on a binding that just went STALE -> VOIDED"

  - method: POST
    path: "/model-assets/{id}/approve-for-use"
    description: "clear the asset for binding to use cases; third-party assets require an ACCEPTED VendorModelAssessment graded A, B or C"
    roles: [GovernanceOfficer]
    code: 200
    input: []
    output: ModelAsset
    side_effects:
      - "ModelAsset REGISTERED or RESTRICTED -> APPROVED_FOR_USE"
      - "increments ModelAsset.version by 1, staling any PINNED binding pinned to an older version"

  - method: GET
    path: "/model-assets/{id}/model-bindings"
    description: "list every binding that points at this asset, across all use cases, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ModelBinding[]
    side_effects: []

  - method: POST
    path: "/model-assets/{id}/vendor-assessments"
    description: "submit a third-party assessment covering training-data provenance, output rights and retention terms; the submission is graded immediately under the CONSERVATIVE_LEGAL variant"
    roles: [GovernanceOfficer, LegalReviewer]
    code: 201
    input: [vendor_name, training_data_provenance, output_rights, "retention_days?", retention_opt_out, subprocessors_disclosed]
    output: VendorModelAssessment
    side_effects:
      - "creates VendorModelAssessment in status SUBMITTED with terms_variant CONSERVATIVE_LEGAL"
      - "runs calculations.vendor_terms_grade variant CONSERVATIVE_LEGAL to set effective_retention_days, terms_risk_points and terms_grade"

  - method: GET
    path: "/model-assets/{id}/vendor-assessments"
    description: "list assessments filed against this asset, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VendorModelAssessment[]
    side_effects: []

  - method: POST
    path: "/vendor-assessments/{id}/decide"
    description: "accept or reject a vendor assessment, choosing which grading variant the decision stands on"
    roles: [GovernanceOfficer]
    code: 200
    input: [decision, terms_variant, "decision_rationale?"]
    output: VendorModelAssessment
    side_effects:
      - "re-runs calculations.vendor_terms_grade under the requested terms_variant and overwrites effective_retention_days, terms_risk_points and terms_grade"
      - "on ACCEPT: VendorModelAssessment -> ACCEPTED and ModelAsset.vendor_terms_grade = this row's terms_grade"
      - "on REJECT: VendorModelAssessment -> REJECTED and ModelAsset.vendor_terms_grade is left untouched"

  # ----------------------------- UseCase intake -----------------------------
  - method: POST
    path: "/use-cases"
    description: "file an AI use case intake; the record starts in DRAFT and carries no risk tier until it is classified"
    roles: [Requester]
    code: 201
    input: [title, business_unit, description, affects_individuals, decision_autonomy, data_sensitivity, individual_impact, jurisdictions, deployed_headcount_reach, "predecessor_use_case_id?"]
    output: UseCase
    side_effects: ["creates UseCase in status DRAFT with requester_user_id = X-User-ID, version 1, classification_stale false, classification_cycle_index 0"]

  - method: GET
    path: "/use-cases"
    description: "list use cases in the governance inventory, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "risk_tier?", "final_risk_tier?", "business_unit?", "predecessor_use_case_id?", "limit?", "offset?"]
    output: UseCase[]
    side_effects: []

  - method: GET
    path: "/use-cases/{id}"
    description: "read one use case with its full governance position, including version for optimistic concurrency"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: []
    output: UseCase
    side_effects: []

  - method: PATCH
    path: "/use-cases/{id}"
    description: "revise intake data while the use case is DRAFT or CHANGES_REQUESTED; revision invalidates the classification and voids every gate pinned to it"
    roles: [Requester]
    code: 200
    input: ["title?", "description?", "affects_individuals?", "decision_autonomy?", "data_sensitivity?", "individual_impact?", "jurisdictions?", "deployed_headcount_reach?"]
    output: UseCase
    side_effects:
      - "UseCase CHANGES_REQUESTED -> DRAFT, or DRAFT -> DRAFT"
      - "classification_stale -> true"
      - "every non-VOIDED ReviewGate of this use case -> VOIDED with control_debt_index 0.00 and open_condition_count 0"
      - "recomputes open_conditions_count and cleared_gate_count"
      - "increments UseCase.version by 1"

  - method: POST
    path: "/use-cases/{id}/classify"
    description: "run risk classification, which forks: an ordinary intake moves to UNDER_REVIEW with freshly created gates, a prohibited combination is rejected outright"
    roles: [GovernanceOfficer]
    code: 200
    input: [expected_use_case_version]
    output: UseCase
    side_effects:
      - "runs calculations.risk_classification_score variant INTAKE_PROVISIONAL and appends a ClassificationSnapshot"
      - "sets risk_score, risk_tier, required_gate_types; clears classification_stale"
      - "voids every pre-existing gate and creates one PENDING ReviewGate per required gate type in canonical order LEGAL, PRIVACY, SECURITY, BUSINESS"
      - "on the forced-PROHIBITED branch: UseCase -> REJECTED with rejection_reason and a CLASSIFICATION_REJECTED ledger entry, and no gates are created"
      - "increments UseCase.version by 1"

  - method: GET
    path: "/use-cases/{id}/classification-snapshots"
    description: "list the append-only classification snapshots of this use case, ordered by created_at ASC, so provisional and final scores can be compared"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: ClassificationSnapshot[]
    side_effects: []

  - method: GET
    path: "/use-cases/{id}/review-gates"
    description: "list the review gates of this use case, ordered by created_at ASC, which is the canonical gate order LEGAL, PRIVACY, SECURITY, BUSINESS"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "gate_type?", "limit?", "offset?"]
    output: ReviewGate[]
    side_effects: []

  - method: POST
    path: "/review-gates/{id}/start-review"
    description: "take up a gate for review, or return to review after the requester answered conditions; only the reviewer role that owns the gate type may call it"
    roles: [LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer]
    code: 200
    input: []
    output: ReviewGate
    side_effects:
      - "ReviewGate PENDING or CONDITIONS_ISSUED -> IN_REVIEW with assigned_reviewer_user_id = X-User-ID"
      - "clears conditions, open_condition_count and control_debt_index"
      - "recomputes use_case.open_conditions_count and may bubble the use case CHANGES_REQUESTED -> UNDER_REVIEW"
      - "increments ReviewGate.version by 1"

  - method: POST
    path: "/review-gates/{id}/issue-conditions"
    description: "issue remediation conditions on a gate under review, which pushes the whole intake back to the requester and books control debt"
    roles: [LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer]
    code: 200
    input: [conditions, "decision_note?"]
    output: ReviewGate
    side_effects:
      - "ReviewGate IN_REVIEW -> CONDITIONS_ISSUED with open_condition_count = len(conditions)"
      - "runs calculations.control_debt_index for this gate"
      - "recomputes use_case.open_conditions_count and bubbles the use case UNDER_REVIEW -> CHANGES_REQUESTED"
      - "increments ReviewGate.version by 1"

  - method: POST
    path: "/review-gates/{id}/clear"
    description: "clear a gate; the per-gate preconditions differ by gate type (LEGAL needs accepted vendor terms, SECURITY needs a passed red-team run, PRIVACY needs published notices)"
    roles: [LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer]
    code: 200
    input: ["decision_note?"]
    output: ReviewGate
    side_effects:
      - "ReviewGate IN_REVIEW or CONDITIONS_ISSUED -> CLEARED with cleared_by_user_id, cleared_at"
      - "captures debt_before_clear and zeroes control_debt_index and open_condition_count"
      - "appends GovernanceLedgerEntry(entry_type=GATE_CLEARED, debt_delta = -debt_before_clear)"
      - "recomputes use_case.cleared_gate_count and bubbles the use case to READY_FOR_APPROVAL once every non-VOIDED gate is CLEARED"
      - "increments ReviewGate.version by 1"

  - method: POST
    path: "/review-gates/{id}/reopen"
    description: "compensating action that undoes a clearance and restores the control debt the gate carried before it"
    roles: [GovernanceOfficer]
    code: 200
    input: ["decision_note?"]
    output: ReviewGate
    side_effects:
      - "ReviewGate CLEARED -> IN_REVIEW with control_debt_index restored to debt_before_clear and cleared_by_user_id/cleared_at nulled"
      - "appends GovernanceLedgerEntry(entry_type=GATE_REOPENED, debt_delta = +debt_before_clear)"
      - "recomputes use_case.cleared_gate_count and pushes the use case READY_FOR_APPROVAL -> UNDER_REVIEW"
      - "increments ReviewGate.version by 1"

  - method: POST
    path: "/use-cases/{id}/model-bindings"
    description: "bind an approved model asset to the use case, pinning the asset's current version; supersedes any prior binding on this use case"
    roles: [GovernanceOfficer]
    code: 201
    input: [model_asset_id, expected_use_case_version]
    output: ModelBinding
    side_effects:
      - "creates ModelBinding in status PINNED with pinned_model_version = ModelAsset.version and pinned_at = now"
      - "every prior ModelBinding of this use case in PINNED or STALE -> RETIRED with superseded_reason = SUPERSEDED_BY_NEW_BINDING, and each retired binding decrements ModelAsset.active_binding_count"
      - "every PLANNED TestEvaluation on a retired binding -> VOIDED"
      - "increments ModelAsset.active_binding_count for the newly bound asset"
      - "increments UseCase.version by 1"

  - method: GET
    path: "/use-cases/{id}/model-bindings"
    description: "list this use case's bindings, current and historical, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ModelBinding[]
    side_effects: []

  - method: POST
    path: "/use-cases/{id}/oversight-designs"
    description: "file the human-oversight design for the use case; the adequacy score is computed on filing and any prior DRAFT design on the same use case is superseded"
    roles: [Requester]
    code: 201
    input: [review_mode, sample_pct, escalation_sla_hours, reviewer_role, override_capability, expected_use_case_version]
    output: OversightDesign
    side_effects:
      - "creates OversightDesign in status DRAFT"
      - "runs calculations.oversight_adequacy_score to set adequacy_score and required_adequacy_score"
      - "every prior OversightDesign of this use case still in DRAFT -> REJECTED"
      - "increments UseCase.version by 1"

  - method: GET
    path: "/use-cases/{id}/oversight-designs"
    description: "list the oversight designs filed on this use case, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OversightDesign[]
    side_effects: []

  - method: POST
    path: "/oversight-designs/{id}/decide"
    description: "approve or reject the oversight design; approval is refused when the adequacy score falls short of the threshold the tier and autonomy level demand"
    roles: [GovernanceOfficer]
    code: 200
    input: [decision]
    output: OversightDesign
    side_effects:
      - "OversightDesign DRAFT -> APPROVED or REJECTED with decided_by_user_id and decided_at"
      - "increments OversightDesign.version by 1"

  # ------------------------- Testing and evaluation -------------------------
  - method: POST
    path: "/test-evaluations"
    description: "schedule a bias, robustness, hallucination or red-team run on a binding, reserving an exclusive test window on the bound asset; thresholds are frozen from the use case's tier at this instant"
    roles: [SecurityReviewer, GovernanceOfficer]
    code: 201
    input: [use_case_id, model_binding_id, eval_type, window_start_at, window_end_at]
    output: TestEvaluation
    side_effects:
      - "creates TestEvaluation in status PLANNED"
      - "runs calculations.eval_threshold_profile to freeze required_metric_name, required_metric_threshold and required_sample_size"

  - method: GET
    path: "/test-evaluations"
    description: "list evaluations, filterable by use case, binding, type and status, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["use_case_id?", "model_binding_id?", "eval_type?", "status?", "limit?", "offset?"]
    output: TestEvaluation[]
    side_effects: []

  - method: GET
    path: "/test-evaluations/{id}"
    description: "read one evaluation with its frozen threshold profile and observed metric"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: []
    output: TestEvaluation
    side_effects: []

  - method: POST
    path: "/test-evaluations/{id}/complete"
    description: "record the run's results; the frozen threshold profile decides whether the evaluation lands in PASSED or FAILED"
    roles: [SecurityReviewer, GovernanceOfficer]
    code: 200
    input: ["worst_group_parity_ratio?", "adversarial_pass_rate?", "grounded_accuracy?", sample_size, "evidence_uri?"]
    output: TestEvaluation
    side_effects:
      - "TestEvaluation PLANNED -> PASSED when observed_metric_value >= required_metric_threshold and sample_size >= required_sample_size, otherwise -> FAILED"
      - "sets observed_metric_value and completed_at"
      - "a BIAS run sets use_case.safety_flag true on FAILED and false on PASSED"
      - "a FAILED run pushes use_case UNDER_REVIEW or READY_FOR_APPROVAL -> CHANGES_REQUESTED"
      - "increments TestEvaluation.version by 1"

  # ------------------------- Disclosure obligations -------------------------
  - method: POST
    path: "/use-cases/{id}/disclosure-notices"
    description: "publish a statutory notice for one jurisdiction over a closed effective window; windows for the same notice_type and jurisdiction may not overlap and must respect a quiet buffer"
    roles: [Requester, GovernanceOfficer]
    code: 201
    input: [notice_type, jurisdiction, effective_from, effective_to, locale_count]
    output: DisclosureNotice
    side_effects: ["creates DisclosureNotice in status PUBLISHED"]

  - method: GET
    path: "/use-cases/{id}/disclosure-notices"
    description: "list the notices published for this use case, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["status?", "jurisdiction?", "notice_type?", "limit?", "offset?"]
    output: DisclosureNotice[]
    side_effects: []

  - method: POST
    path: "/disclosure-notices/{id}/withdraw"
    description: "withdraw a published notice, freeing its jurisdiction slot"
    roles: [Requester, GovernanceOfficer]
    code: 200
    input: []
    output: DisclosureNotice
    side_effects:
      - "DisclosureNotice PUBLISHED -> WITHDRAWN with withdrawn_at = now"
      - "increments DisclosureNotice.version by 1"

  # ---------------------- Approval, revocation, review ----------------------
  - method: POST
    path: "/use-cases/{id}/approve"
    description: "sign the deployment approval; recomputes the risk tier from the evidence the provisional tier demanded, then schedules the first reassessment"
    roles: [GovernanceOfficer]
    code: 200
    input: [expected_use_case_version]
    output: UseCase
    side_effects:
      - "runs calculations.approval_finalization in its pinned six-step order and appends a DEPLOYMENT_FINAL ClassificationSnapshot"
      - "UseCase READY_FOR_APPROVAL -> APPROVED with approved_at, approved_by_user_id, approval_expires_at, reassessment_due_at, reassessment_cycle_index 1, reassessment_status SCHEDULED"
      - "appends GovernanceLedgerEntry(entry_type=APPROVAL_GRANTED, reach_delta = +deployed_headcount_reach)"
      - "an APPROVED predecessor named by predecessor_use_case_id is revoked with revocation_reason SUPERSEDED, which cascades into its bindings and their assets"
      - "increments UseCase.version by 1"

  - method: POST
    path: "/use-cases/{id}/revoke"
    description: "revoke a use case; drives the four-hop cascade through bindings, assets and vendor assessments and withdraws its notices"
    roles: [GovernanceOfficer]
    code: 200
    input: [revocation_reason]
    output: UseCase
    side_effects:
      - "UseCase READY_FOR_APPROVAL, APPROVED, UNDER_REASSESSMENT or SUSPENDED -> REVOKED with revoked_at and revocation_reason"
      - "appends GovernanceLedgerEntry(entry_type=APPROVAL_REVOKED, reach_delta = -deployed_headcount_reach when the use case was inside INVENTORY_STATUSES, else 0)"
      - "hop 2: every PINNED or STALE binding -> RETIRED with superseded_reason USE_CASE_REVOKED"
      - "hop 3: each retired binding decrements ModelAsset.active_binding_count; a third-party asset that reaches 0 -> RESTRICTED"
      - "hop 4: every ACCEPTED VendorModelAssessment on a newly RESTRICTED asset -> EXPIRED and the asset's vendor_terms_grade -> null"
      - "every PLANNED TestEvaluation on a retired binding -> VOIDED; every PUBLISHED DisclosureNotice -> WITHDRAWN"
      - "increments UseCase.version by 1"

  - method: POST
    path: "/use-cases/{id}/complete-reassessment"
    description: "close the periodic reassessment cycle, either confirming the approval for another interval or suspending it"
    roles: [GovernanceOfficer]
    code: 200
    input: [outcome]
    output: UseCase
    side_effects:
      - "on CONFIRMED: UseCase UNDER_REASSESSMENT -> APPROVED, reassessment_cycle_index += 1, reassessment_due_at and approval_expires_at pushed out by reassessment_interval_days, REASSESSMENT_COMPLETED ledger entry appended"
      - "on SUSPEND: UseCase UNDER_REASSESSMENT -> SUSPENDED, every PINNED binding -> STALE with superseded_reason APPROVAL_SUSPENDED, APPROVAL_SUSPENDED ledger entry appended"
      - "increments UseCase.version by 1"

  - method: GET
    path: "/use-cases/{id}/ledger-entries"
    description: "read the append-only governance ledger of this use case, ordered by created_at ASC; reach_delta and debt_delta are what the conservation invariants are checked against"
    roles: [GovernanceOfficer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: GovernanceLedgerEntry[]
    side_effects: []

  # ------------------------- Post-deployment monitoring ---------------------
  - method: POST
    path: "/monitoring-incidents"
    description: "report a post-deployment incident; the containment deadline is derived from severity and the use case's effective tier, and a SEV1 report impairs the posture and suspends the approval"
    roles: [GovernanceOfficer, SecurityReviewer, PrivacyReviewer, Requester]
    code: 201
    input: [use_case_id, severity, category, detected_at, summary, "reported_to_regulator?"]
    output: MonitoringIncident
    side_effects:
      - "creates MonitoringIncident in status OPEN"
      - "runs calculations.incident_containment_deadline to set containment_hours and containment_deadline_at"
      - "re-derives use_case.monitoring_posture; an IMPAIRED posture cascades the use case APPROVED -> SUSPENDED, its PINNED bindings -> STALE and their PLANNED evaluations -> VOIDED"

  - method: GET
    path: "/monitoring-incidents"
    description: "list incidents, filterable by use case, status and severity, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["use_case_id?", "status?", "severity?", "limit?", "offset?"]
    output: MonitoringIncident[]
    side_effects: []

  - method: GET
    path: "/monitoring-incidents/{id}"
    description: "read one incident with its containment deadline"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: []
    output: MonitoringIncident
    side_effects: []

  - method: POST
    path: "/monitoring-incidents/{id}/contain"
    description: "record containment; whether the call lands in CONTAINED or ESCALATED depends on whether the containment deadline has already passed"
    roles: [GovernanceOfficer, SecurityReviewer]
    code: 200
    input: ["reported_to_regulator?"]
    output: MonitoringIncident
    side_effects:
      - "MonitoringIncident OPEN -> CONTAINED with contained_at = now when now <= containment_deadline_at, otherwise OPEN -> ESCALATED with contained_at left null"
      - "ESCALATED -> CONTAINED is allowed only once the regulator report is on file for a SEV1 incident touching individuals"
      - "re-derives use_case.monitoring_posture"
      - "increments MonitoringIncident.version by 1"

  - method: POST
    path: "/monitoring-incidents/{id}/resolve"
    description: "resolve a contained incident; when the posture returns to HEALTHY and the approval has not expired, the suspended use case is reinstated"
    roles: [GovernanceOfficer]
    code: 200
    input: ["reported_to_regulator?"]
    output: MonitoringIncident
    side_effects:
      - "MonitoringIncident CONTAINED -> RESOLVED with resolved_at = now"
      - "re-derives use_case.monitoring_posture; a HEALTHY posture on a SUSPENDED use case with now < approval_expires_at reinstates it to APPROVED, returns its APPROVAL_SUSPENDED bindings to PINNED and appends an APPROVAL_REINSTATED ledger entry"
      - "increments MonitoringIncident.version by 1"

  # ------------------- Shadow deployments and inventory ---------------------
  - method: POST
    path: "/shadow-deployments"
    description: "record an unapproved deployment found in the estate; the grace clock starts at discovered_at and depends on the environment it was found in"
    roles: [GovernanceOfficer, SecurityReviewer]
    code: 201
    input: [model_asset_id, "claimed_use_case_id?", environment, discovered_source, discovered_at]
    output: ShadowDeployment
    side_effects:
      - "creates ShadowDeployment in status DISCOVERED with grace_days_granted 0"
      - "runs calculations.shadow_grace_deadline to set grace_deadline_at"

  - method: GET
    path: "/shadow-deployments"
    description: "list discovered shadow deployments, filterable by asset, claimed use case, status and environment, ordered by created_at ASC"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: ["model_asset_id?", "claimed_use_case_id?", "status?", "environment?", "limit?", "offset?"]
    output: ShadowDeployment[]
    side_effects: []

  - method: GET
    path: "/shadow-deployments/{id}"
    description: "read one shadow deployment with its grace deadline"
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: []
    output: ShadowDeployment
    side_effects: []

  - method: POST
    path: "/shadow-deployments/{id}/link"
    description: "attribute the deployment to an approved use case that already pins the same asset"
    roles: [GovernanceOfficer]
    code: 200
    input: [use_case_id]
    output: ShadowDeployment
    side_effects:
      - "ShadowDeployment DISCOVERED or GRACE_GRANTED -> LINKED with claimed_use_case_id = body use_case_id"
      - "increments ShadowDeployment.version by 1"

  - method: POST
    path: "/shadow-deployments/{id}/grant-grace"
    description: "grant a bounded extension for the business to either link or tear down the deployment; grace_days overwrites rather than accumulates"
    roles: [GovernanceOfficer]
    code: 200
    input: [grace_days]
    output: ShadowDeployment
    side_effects:
      - "ShadowDeployment DISCOVERED -> GRACE_GRANTED with grace_days_granted = grace_days"
      - "re-runs calculations.shadow_grace_deadline"
      - "increments ShadowDeployment.version by 1"

  - method: POST
    path: "/shadow-deployments/{id}/retire"
    description: "record that the unapproved deployment has been torn down"
    roles: [GovernanceOfficer]
    code: 200
    input: []
    output: ShadowDeployment
    side_effects:
      - "ShadowDeployment DISCOVERED, GRACE_GRANTED or LINKED -> RETIRED with retired_at = now"
      - "increments ShadowDeployment.version by 1"

  - method: GET
    path: "/inventory-summary"
    description: "computed read of the governance inventory position: the two conserved quantities and their ledger balances, for reconciliation"
    roles: [GovernanceOfficer]
    code: 200
    input: ["business_unit?", "final_risk_tier?"]
    output:
      inventory_count: integer
      portfolio_approved_reach: integer
      portfolio_approved_reach_high_tier: integer
      control_debt_index_total: number
      ledger_reach_balance: integer
      ledger_debt_balance: number
      open_incident_count: integer
      unapproved_shadow_count: integer
    side_effects: ["runs calculations.inventory_conserved_quantities; writes nothing"]

  # --------------------------- Test-driving surface -------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [GovernanceOfficer, LegalReviewer, PrivacyReviewer, SecurityReviewer, BusinessReviewer, Requester]
    code: 200
    input: [current_utc]
    output:
      current_utc: datetime
    side_effects: ["moves the logical clock every deadline, expiry and window rule reads; performs no state transitions of its own"]

  - method: POST
    path: "/_ops/governance-sweep"
    description: "run the periodic governance sweep in its pinned three-step order: step 1 opens due reassessments, step 2 suspends expired approvals, step 3 enforces elapsed shadow deployments"
    roles: [GovernanceOfficer]
    code: 200
    input: []
    output:
      reassessments_opened: integer
      approvals_suspended: integer
      shadows_enforced: integer
      assets_restricted: integer
      assessments_expired: integer
    side_effects:
      - "step 1: every APPROVED use case with now >= reassessment_due_at -> UNDER_REASSESSMENT, reassessment_status IN_PROGRESS or OVERDUE, processed in created_at ASC order"
      - "step 2: every APPROVED or UNDER_REASSESSMENT use case with now > approval_expires_at -> SUSPENDED with its PINNED bindings -> STALE, processed in created_at ASC order; the comparison is STRICT while step 1 uses >=, so a sweep run at exactly the expiry instant opens the reassessment without suspending it - that asymmetry is deliberate and is the only window in which complete-reassessment can be attempted late enough to raise ERR_APPROVAL_EXPIRED"
      - "step 3: every DISCOVERED or GRACE_GRANTED shadow deployment with now > grace_deadline_at -> ENFORCED_BLOCK, incrementing ModelAsset.enforced_shadow_count, restricting the asset and expiring its ACCEPTED assessments, processed in created_at ASC order"
      - "step ordering matters: a use case whose reassessment opens in step 1 can still be suspended by step 2 in the same sweep, and never the other way round"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, blank, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the requester tries to clear a gate on their own intake, or the approving officer is the requester or a reviewer who cleared one of this use case's gates"
  - id: ERR_GATE_ROLE_MISMATCH
    http: 403
    condition: "a reviewer role acts on a gate whose gate_type belongs to a different reviewer role"

  # --- existence ---
  - id: ERR_USE_CASE_NOT_FOUND
    http: 404
    condition: "no UseCase exists for the supplied path or body use case id"
  - id: ERR_MODEL_ASSET_NOT_FOUND
    http: 404
    condition: "no ModelAsset exists for the supplied path or body asset id"
  - id: ERR_REVIEW_GATE_NOT_FOUND
    http: 404
    condition: "no ReviewGate exists for the supplied gate id"
  - id: ERR_GOVERNANCE_RECORD_NOT_FOUND
    http: 404
    condition: "no VendorModelAssessment, ModelBinding, OversightDesign, TestEvaluation, DisclosureNotice, MonitoringIncident or ShadowDeployment exists for the supplied id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value outside its declared set, non-positive interval, out-of-range percentage or hour count, duplicate jurisdictions, or an empty PATCH body"

  # --- optimistic concurrency ---
  - id: ERR_STALE_USE_CASE_VERSION
    http: 412
    condition: "expected_use_case_version does not equal the current UseCase.version"

  # --- state ---
  - id: ERR_USE_CASE_TERMINAL
    http: 409
    condition: "the addressed use case, or the parent of the addressed child record, is REJECTED or REVOKED"
  - id: ERR_USE_CASE_NOT_IN_DRAFT
    http: 409
    condition: "classify called on a use case that is not in DRAFT"
  - id: ERR_GATE_NOT_IN_REVIEWABLE_STATE
    http: 409
    condition: "the requested gate action has no transition out of the gate's current status"
  - id: ERR_USE_CASE_NOT_READY_FOR_APPROVAL
    http: 409
    condition: "approve called on a use case that is not in READY_FOR_APPROVAL"
  - id: ERR_REASSESSMENT_NOT_DUE
    http: 409
    condition: "complete-reassessment called on a use case that is not in UNDER_REASSESSMENT"
  - id: ERR_ASSESSMENT_ALREADY_DECIDED
    http: 409
    condition: "decide called on a VendorModelAssessment that is not SUBMITTED, or on an OversightDesign that is not DRAFT"
  - id: ERR_EVALUATION_NOT_PLANNED
    http: 409
    condition: "complete called on a TestEvaluation that is not PLANNED"
  - id: ERR_INCIDENT_NOT_ACTIONABLE
    http: 409
    condition: "contain called on an incident that is neither OPEN nor ESCALATED, or resolve called on an incident that is not CONTAINED"
  - id: ERR_SHADOW_NOT_ACTIONABLE
    http: 409
    condition: "link, grant-grace or retire called on a shadow deployment already RETIRED or ENFORCED_BLOCK, or grant-grace called on a deployment that is not DISCOVERED"
  - id: ERR_NOTICE_ALREADY_WITHDRAWN
    http: 409
    condition: "withdraw called on a DisclosureNotice that is already WITHDRAWN"
  - id: ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE
    http: 409
    condition: "approve-for-use called on an asset already APPROVED_FOR_USE or on a RESTRICTED asset whose enforced_shadow_count is still non-zero, or PATCH /model-assets/{id} called on an asset that is not APPROVED_FOR_USE, or a binding is created against an asset that is not APPROVED_FOR_USE"

  # --- safety ---
  - id: ERR_PROHIBITED_USE_CASE
    http: 422
    condition: "an approval, binding or oversight decision is attempted on a use case whose risk_tier is PROHIBITED"
  - id: ERR_BIAS_EVALUATION_FAILED
    http: 422
    condition: "approve attempted while safety_flag is true because a FAILED BIAS evaluation has not been superseded by a later PASSED one"
  - id: ERR_REQUIRED_EVALUATION_MISSING
    http: 422
    condition: "an eval_type demanded by REQUIRED_EVALS for the tier has no PASSED evaluation, or a SECURITY gate is cleared without a PASSED SECURITY_REDTEAM run"
  - id: ERR_OVERSIGHT_DESIGN_NOT_APPROVED
    http: 422
    condition: "approve attempted with no APPROVED OversightDesign on the use case"
  - id: ERR_OVERSIGHT_DESIGN_INADEQUATE
    http: 422
    condition: "an oversight design is approved while its adequacy_score is below required_adequacy_score"

  # --- referential and cross-aggregate ---
  - id: ERR_MODEL_BINDING_MISSING
    http: 422
    condition: "approve, or a LEGAL gate clearance, attempted with no PINNED ModelBinding on the use case"
  - id: ERR_MODEL_BINDING_STALE
    http: 409
    condition: "the PINNED binding's pinned_model_version no longer equals its ModelAsset's current version"
  - id: ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED
    http: 422
    condition: "a third-party asset is approved for use, or its LEGAL gate is cleared, without an ACCEPTED VendorModelAssessment graded A, B or C"
  - id: ERR_RETENTION_TERMS_UNDOCUMENTED
    http: 422
    condition: "a decision under terms_variant DOCUMENTED_TERMS is attempted on an assessment whose retention_days is null"
  - id: ERR_SHADOW_LINK_MISMATCH
    http: 422
    condition: "the link target use case is not APPROVED, or does not hold a PINNED binding on the shadow deployment's asset"

  # --- temporal and window ---
  - id: ERR_DISCLOSURE_NOT_PUBLISHED
    http: 422
    condition: "a jurisdiction in the use case's jurisdictions list has no PUBLISHED DisclosureNotice in force at the current logical time"
  - id: ERR_DISCLOSURE_WINDOW_CONFLICT
    http: 409
    condition: "a new notice's closed effective window overlaps, or starts inside the quiet buffer following, a PUBLISHED notice of the same notice_type and jurisdiction on this use case"
  - id: ERR_EVALUATION_WINDOW_CONFLICT
    http: 409
    condition: "a new evaluation's half-open test window intersects an existing PLANNED, PASSED or FAILED evaluation window on the same ModelAsset"
  - id: ERR_REGULATOR_REPORT_REQUIRED
    http: 422
    condition: "an escalated or unresolved SEV1 incident on a use case touching individuals is contained or resolved before the regulator notification is on file"
  - id: ERR_GRACE_PERIOD_ELAPSED
    http: 409
    condition: "grant-grace called after the shadow deployment's grace_deadline_at has already passed"
  - id: ERR_GRACE_EXTENSION_EXCEEDED
    http: 422
    condition: "grace_days is below 1 or above MAX_GRACE_EXTENSION_DAYS"
  - id: ERR_APPROVAL_EXPIRED
    http: 409
    condition: "complete-reassessment called strictly after the use case's approval_expires_at (at exactly that instant the call still succeeds, because reassessment_due_at equals approval_expires_at)"

  # --- fiscal / aggregate ---
  - id: ERR_PORTFOLIO_REACH_CAP_EXCEEDED
    http: 422
    condition: "the approval would push portfolio_approved_reach_high_tier above PORTFOLIO_HIGH_TIER_REACH_CAP"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================

roles:
  - name: Requester
    description: "business-unit owner who files the AI use case intake, keeps it current, files the human-oversight design and publishes the statutory notices"
    identity: opaque
    exclusive_operations:
      - "POST /use-cases"
      - "PATCH /use-cases/{id}"
      - "POST /use-cases/{id}/oversight-designs"
    shared_operations:
      - "POST /use-cases/{id}/disclosure-notices (with GovernanceOfficer)"
      - "POST /disclosure-notices/{id}/withdraw (with GovernanceOfficer)"
      - "POST /monitoring-incidents (with GovernanceOfficer, SecurityReviewer, PrivacyReviewer)"
      - "every GET on use cases, assets, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"
    note: "the requester may never clear a gate on their own intake, and may never be the approving officer (segregation of duties)"

  - name: LegalReviewer
    description: "legal reviewer who owns the LEGAL gate and files third-party vendor assessments covering training-data provenance and output rights"
    identity: opaque
    exclusive_operations:
      - "POST /review-gates/{id}/start-review, /issue-conditions and /clear where gate_type == LEGAL"
    shared_operations:
      - "POST /model-assets/{id}/vendor-assessments (with GovernanceOfficer)"
      - "GET /model-assets/{id}/vendor-assessments (with GovernanceOfficer)"
      - "every GET on use cases, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"

  - name: PrivacyReviewer
    description: "privacy reviewer who owns the PRIVACY gate and cannot clear it until the required notices are published in every declared jurisdiction"
    identity: opaque
    exclusive_operations:
      - "POST /review-gates/{id}/start-review, /issue-conditions and /clear where gate_type == PRIVACY"
    shared_operations:
      - "POST /monitoring-incidents (with GovernanceOfficer, SecurityReviewer, Requester)"
      - "every GET on use cases, assets, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"

  - name: SecurityReviewer
    description: "security reviewer who owns the SECURITY gate, runs the testing programme and reports unapproved deployments found in the estate"
    identity: opaque
    exclusive_operations:
      - "POST /review-gates/{id}/start-review, /issue-conditions and /clear where gate_type == SECURITY"
    shared_operations:
      - "POST /test-evaluations and POST /test-evaluations/{id}/complete (with GovernanceOfficer)"
      - "POST /shadow-deployments (with GovernanceOfficer)"
      - "POST /monitoring-incidents and POST /monitoring-incidents/{id}/contain (with GovernanceOfficer)"
      - "every GET on use cases, assets, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"

  - name: BusinessReviewer
    description: "business reviewer who owns the BUSINESS gate, the only gate every risk tier demands"
    identity: opaque
    exclusive_operations:
      - "POST /review-gates/{id}/start-review, /issue-conditions and /clear where gate_type == BUSINESS"
    shared_operations:
      - "every GET on use cases, assets, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"

  - name: GovernanceOfficer
    description: "AI governance office operator who runs classification, the model registry, vendor decisions, oversight decisions, approvals, revocations, reassessments and the shadow-deployment programme"
    identity: opaque
    exclusive_operations:
      - "POST /model-assets, PATCH /model-assets/{id}, POST /model-assets/{id}/approve-for-use"
      - "POST /vendor-assessments/{id}/decide"
      - "POST /use-cases/{id}/classify"
      - "POST /use-cases/{id}/model-bindings"
      - "POST /oversight-designs/{id}/decide"
      - "POST /review-gates/{id}/reopen"
      - "POST /use-cases/{id}/approve, /revoke and /complete-reassessment"
      - "POST /monitoring-incidents/{id}/resolve"
      - "POST /shadow-deployments/{id}/link, /grant-grace and /retire"
      - "GET /use-cases/{id}/ledger-entries"
      - "GET /inventory-summary"
      - "POST /_ops/governance-sweep"
    shared_operations:
      - "POST /model-assets/{id}/vendor-assessments (with LegalReviewer)"
      - "POST /test-evaluations and POST /test-evaluations/{id}/complete (with SecurityReviewer)"
      - "POST /use-cases/{id}/disclosure-notices and POST /disclosure-notices/{id}/withdraw (with Requester)"
      - "POST /monitoring-incidents and POST /monitoring-incidents/{id}/contain (with SecurityReviewer and others)"
      - "POST /shadow-deployments (with SecurityReviewer)"
      - "every GET on use cases, assets, gates, bindings, designs, evaluations, notices, incidents and shadow deployments"
      - "POST /_clock/set_current_utc"
    note: "no reviewer role can approve a use case, and no GovernanceOfficer can clear a domain gate; GATE_ROLE_MAP ties each gate_type to exactly one reviewer role"
