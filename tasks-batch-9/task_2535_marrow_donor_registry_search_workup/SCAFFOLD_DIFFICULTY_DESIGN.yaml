            - "WorkupCase.${wc_id}.clearance_status == IN_PROGRESS throughout - none of the three calls touched the clearance dimension"

  - rule_id: boundary_precision_check
    instances:
      - name: preliminary_score_floor_is_inclusive_to_the_hundredth
        grounds:
          - calculations.candidate_pool_materialization
          - calculations.match_probability_score.variants.PRELIMINARY
          - entities.SearchRequest.fields.min_preliminary_score
          - entities.SearchRequest.fields.match_pool_size
          - state_machines.SearchRequest.SEARCHING_to_NO_MATCH_FOUND
        distinguishing_aspect: |
          Metric: a 2-decimal probability score compared with `>=` on POST /registry/search-requests.
          Donor D1 scores exactly 94.75, so a floor of 94.76 empties the pool (and terminalizes the
          search as NO_MATCH_FOUND) while a floor of exactly 94.75 admits the same donor. One hundredth
          of a point separates a materialized pool from an empty one, and an implementation using `>`
          or rounding the comparison to one decimal fails one of the two directions.
        test_recipe:
          setup:
            - "one domestic registry and donor D1 whose PRELIMINARY score against the patient is exactly 94.75"
            - "one patient, no searches yet; clock left at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY", min_preliminary_score: 94.76 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_above_id: "$.data.id", sr_above_pool: "$.data.match_pool_size", sr_above_status: "$.data.status" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY", min_preliminary_score: 94.75 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_at_id: "$.data.id", sr_at_pool: "$.data.match_pool_size", sr_at_status: "$.data.status" }
          assert:
            - "the 94.76 search returns 201 with match_pool_size == 0, backup_candidate_count == 0 and status == NO_MATCH_FOUND"
            - "GET /registry/match-candidates?search_request_id=${sr_above_id} returns an empty data array with total_count 0"
            - "the 94.75 search is accepted (the previous search is terminal, so ERR_SEARCH_ALREADY_ACTIVE does not fire) and returns match_pool_size == 1 with status SEARCHING"
            - "GET /registry/match-candidates?search_request_id=${sr_at_id} returns exactly one row with preliminary_score == 94.75, rank_position 1 and candidate_role PRIMARY"
            - "SearchRequest.${sr_above_id}.min_preliminary_score == 94.76 and SearchRequest.${sr_at_id}.min_preliminary_score == 94.75 are both echoed back unrounded"

      - name: typing_deadline_expiry_is_strictly_after_the_deadline_instant
        grounds:
          - calculations.ct_deadline_and_expiry_sweep
          - entities.ConfirmatoryTypingRequest.fields.deadline_at
          - entities.ConfirmatoryTypingRequest.fields.priority_flag
          - entities.SearchRequest.fields.last_sweep_at
          - state_machines.ConfirmatoryTypingRequest.REQUESTED_to_EXPIRED
        distinguishing_aspect: |
          A different metric (a UTC instant at second resolution) on a different endpoint
          (POST /registry/search-requests/{id}/deadline-sweep). Three requests raised in the same
          transaction carry three different deadlines - 2026-08-07T00:00:00Z (domestic + priority
          reduction), 2026-08-08T00:00:00Z (domestic) and 2026-08-10T00:00:00Z (international grace) -
          and a sweep at exactly 2026-08-08T00:00:00Z must expire only the first, proving the
          comparison is `now > deadline_at` and not `>=`; a second sweep one second later expires the
          request that sat exactly on the boundary.
        test_recipe:
          setup:
            - "domestic registry (ct_response_deadline_hours 168) and international registry (168 + 48h grace)"
            - "donors D1 (domestic, rank 1), D2 (international, rank 2), D3 (domestic, rank 3) and a DOMESTIC_AND_INTERNATIONAL search"
            - "three confirmatory-typing requests raised at 2026-08-01T00:00:00Z; the D3 request carries priority_flag true"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "ZKRD-DE", name: "German Bone Marrow Donor Registry", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_intl_id}", donor_code: "D-0002", age_years: 41, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "11:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06", "02"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["DQB1"], prior_donation_count: 1 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_intl_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], ambiguous_loci: [], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_AND_INTERNATIONAL" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id", mc2_id: "$.data[1].id", mc3_id: "$.data[2].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id", ct1_deadline: "$.data.deadline_at" }
            - call: "POST /registry/match-candidates/${mc2_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct2_id: "$.data.id", ct2_deadline: "$.data.deadline_at" }
