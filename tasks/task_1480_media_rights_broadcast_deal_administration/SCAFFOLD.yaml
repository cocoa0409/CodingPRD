  - RightsManager
  code: 200
  input: []
  output: BroadcastEvent
  side_effects:
  - status → CANCELLED_BY_LEAGUE
  - ProductionObligation.games_required -= 1
- method: POST
  path: /deals/{dealId}/broadcast-events/{eventId}/cancel-by-broadcaster
