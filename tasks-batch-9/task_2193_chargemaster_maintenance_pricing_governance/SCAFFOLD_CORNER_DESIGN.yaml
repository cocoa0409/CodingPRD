            - "${e_entry_add} == ERR_INVALID_CYCLE_STATE with HTTP 409 (no new entries on a terminal cycle)"
            - "CodeUpdateCycle.${cycle}.entry_count == 2 and CodeUpdateEntry.${e1}.status == DEFERRED and CodeUpdateEntry.${e2}.status == DEFERRED"
            - "CodeUpdateEntry.${e1}.target_charge_item_id == null and CodeUpdateEntry.${e2}.target_charge_item_id == null"
            - "Facility.${fac}.chargemaster_posture == OPEN (CANCEL releases the mapping blackout)"
            - "ChargeItem.${it2}.code_value == 93460 and ChargeItem.${it3}.code_value == 93460 (no crosswalk was applied)"
            - "Facility.${fac}.active_item_count == 3 and Facility.${fac}.aggregate_gross_charge_cents == 720000"
      - name: batch_lifecycle_rejects_empty_reconcile_late_lines_and_dispute_without_exceptions
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BATCH_HAS_NO_LINES]
          - errors[ERR_INVALID_BATCH_STATE]
          - errors[ERR_NOTHING_TO_DISPUTE]
          - errors[ERR_BATCH_LINES_UNRECONCILED]
          - validations[priority=41]
          - state_machines.ChargeCaptureBatch
          - endpoints[POST /chargemaster/charge-capture-batches/{batch_id}/reconcile]
          - endpoints[POST /chargemaster/charge-capture-batches/{batch_id}/lines]
          - endpoints[POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle]
          - endpoints[GET /chargemaster/charge-capture-batches/{batch_id}]
        distinguishing_aspect: "Every rejection edge of the batch machine on one perfectly clean batch: the zero-line reconcile is a 422 while every wrong-state action is a 409, DISPUTE is refused because a fully MATCHED batch has exception_line_count 0 (a manager cannot dispute a clean batch), and ERR_BATCH_LINES_UNRECONCILED is proved to be an unreachable defensive guard — lines may only be appended while status == INGESTED and every reconcile pass assigns a match_status to every line, so no UNRECONCILED line can survive into FINALIZE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100 (manager mgr_cath); COST_PLUS_MARKUP rule with the default tiers."
            - "Item CDM-1001 driven to ACTIVE with cost 100000 and gross 240000."
            - "Batch b1 for CC-100 over the closed window 2026-09-01T00:00:00Z .. 2026-09-07T23:59:59Z, status INGESTED with zero lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              captures: { rule: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { gross: $.data.gross_charge_cents }
