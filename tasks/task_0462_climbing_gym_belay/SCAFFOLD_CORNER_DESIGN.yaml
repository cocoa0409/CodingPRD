              as: Examiner
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: member_cannot_freeze_other_members_membership
        claim_type: peer_roles
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Member A calling freeze on Member B's membership -> ERR_NOT_RESOURCE_OWNER (403); X-User-ID != membership.member_id."
        test_recipe:
          setup: ["Two members; member B has an ACTIVE membership."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Owner B", email: "ownerb@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Intruder A", email: "intrudera@x.com", date_of_birth: "1990-02-02" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mb_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
          trigger:
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v}" }
              as: Member
              as_user_id: "${ma_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID -> ERR_UNAUTHENTICATED (401). Modeled via an unauthenticated GET; transcribed by dropping headers."
        test_recipe:
          setup: ["One member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Auth M", email: "authm@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          trigger:
            - call: "GET /members/${mem_id}"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers omitted, response error_id == ERR_UNAUTHENTICATED (401)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_facility_correct_version_checkin_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[checkin-create-stale-facility]", endpoints]
        distinguishing_aspect: "A check-in with expected_facility_version matching Facility.version succeeds (201) and bumps version to next; a happy-path OCC pass."
        test_recipe:
          setup: ["A waivered member and a fresh facility version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "OCC Ok", email: "occok@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}" }
              as: FrontDesk
            - call: "POST /facilities"
              payload: { name: "OCC Wall", floor_capacity: 10, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v}" }
              as: FrontDesk
              captures: { ci_id: $.data.id }
          assert:
            - "response code == 201"
            - "Facility.${fac_id}.occupancy == 1"
            - "Facility.${fac_id}.version == 2"

      - name: occ_facility_stale_version_checkin_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[checkin-create-stale-facility]", "errors[ERR_STALE_FACILITY_VERSION]"]
        distinguishing_aspect: "A second check-in carrying the pre-occupancy facility version (stale by 1) -> ERR_STALE_FACILITY_VERSION (412); the first check-in already advanced Facility.version."
        test_recipe:
          setup: ["A facility version 1 with two waivered members; the first check-in advances version to 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "OCC A", email: "occa2@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${ma_id}" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "OCC B", email: "occb2@x.com", date_of_birth: "1990-02-02" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mb_id}" }
              as: FrontDesk
            - call: "POST /facilities"
              payload: { name: "Stale Wall2", floor_capacity: 10, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v_pre: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${ma_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v_pre}" }
              as: FrontDesk
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mb_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v_pre}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_FACILITY_VERSION"
            - "Facility.${fac_id}.occupancy == 1 (stale check-in did not increment)"

      - name: occ_clinic_stale_version_enroll_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enroll-create-stale-clinic]", "errors[ERR_STALE_CLINIC_VERSION]"]
        distinguishing_aspect: "A second enroll carrying the pre-enrollment clinic version (stale) -> ERR_STALE_CLINIC_VERSION (412); the first enroll already advanced Clinic.version."
        test_recipe:
          setup: ["A clinic version 1 with two members; the first enroll advances version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Cl A", email: "cla@x.com", date_of_birth: "2009-01-01" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Cl B", email: "clb@x.com", date_of_birth: "2009-02-02" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /clinics"
              payload: { title: "OCC Clinic", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T11:00:00Z", seat_capacity: 8 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v_pre: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${ma_id}", expected_clinic_version: "${cl_v_pre}" }
              as: FrontDesk
          trigger:
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${mb_id}", expected_clinic_version: "${cl_v_pre}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_CLINIC_VERSION"
            - "Clinic.${cl_id}.enrolled_count == 1"

      - name: occ_membership_stale_version_freeze_rejected
        claim_type: optimistic_concurrency
        grounds: ["errors[ERR_STALE_MEMBERSHIP_VERSION]", state_machines.Membership.ACTIVE_to_FROZEN]
        distinguishing_aspect: "A freeze carrying a stale expected_membership_version (one below current) -> ERR_STALE_MEMBERSHIP_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE membership whose version has advanced via a FAILED run-billing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Stale MS", email: "stalems@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v_pre: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "FAILED" }
              as: FrontDesk
          trigger:
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v_pre}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_MEMBERSHIP_VERSION"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: serious_incident_cascade_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Incident.OPEN_to_RESOLVED, entities.Incident.fields.severity]
        excluded_because:
          difficulty_instance: transitive_cascade / serious_incident_three_hop_cascade
          rationale: "The §1.8 instance already asserts the full 3-hop SERIOUS-incident cascade (cert REVOKED, membership SUSPENDED, check-in CHECKED_OUT) is applied atomically within the POST /incidents request."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: serious_incident_revokes_belay_cert
        claim_type: Cross-entity
        grounds: [state_machines.Certification.PASSED_to_REVOKED, entities.Incident.fields.certification_id]
        excluded_because:
          difficulty_instance: transitive_cascade / serious_incident_three_hop_cascade
          rationale: "The first hop of the §1.8 three-hop cascade asserts the referenced PASSED Certification transitions to REVOKED."
