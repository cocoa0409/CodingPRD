  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: aed_readiness_evaluated_at_asset_creation_for_each_shape
        claim_type: correct_result
        grounds:
          - calculations.aed_readiness_status
          - constants.AED_CONSUMABLE_WARN_DAYS
          - entities.FacilityAsset.fields.readiness_status
          - endpoints[POST /facility-assets]
        distinguishing_aspect: |
          The readiness ladder is evaluated at creation time, not only by the
          nightly run, and it discriminates three shapes on the same clock
          (2026-08-01): consumables far out plus a 12-day-old inspection -> READY;
          a pad expiring 2026-08-20, i.e. inside AED_CONSUMABLE_WARN_DAYS ->
          PADS_EXPIRING; a non-AED asset -> NOT_APPLICABLE regardless of its
          (absent) consumables.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain (clock 2026-08-01T00:00:00Z) plus Studio A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
