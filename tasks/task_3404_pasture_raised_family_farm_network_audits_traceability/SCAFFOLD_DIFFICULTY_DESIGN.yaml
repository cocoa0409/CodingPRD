  - rule_id: transitive_cascade
    instances:
      - name: critical_ca_overdue_suspends_farm_skips_stops_restores_capacity
        grounds:
          - state_machines.CorrectiveAction
          - state_machines.Farm
          - calculations.route_load_reconciliation
        distinguishing_aspect: |
          Clock-triggered cascade of depth 3+: clock advance flips CRITICAL corrective action
          to OVERDUE (link 1), which suspends the farm (link 2), which skips its SCHEDULED
          route stop (link 3), which forces route_load_reconciliation to restore the route's
          available_cases from 4 back to 10 (link 4, derived-field hop caused by the stop skip).
        test_recipe:
          setup:
            - "ACTIVE farm F (140 birds), CERTIFIED, contract; INITIAL audit passed 2026-09-03"
            - "route R (date 2026-09-20, capacity 10) with a SCHEDULED stop for F of 6 planned cases (committed 6, available 4)"
            - "ANNUAL audit completed CORRECTIVE_ACTION_REQUIRED at 2026-10-03T09:00:00Z with one CRITICAL finding (CA due 2026-10-10T09:00:00Z); farm still ACTIVE"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Hilltop Layers", region: "MO", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a1_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a1_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-20", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 6 }
              as: PlantOperator
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "ANNUAL", scheduled_for: "2026-10-03T00:00:00Z" }
              as: NetworkManager
              captures: { a2_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a2_id}/complete"
              payload: { outcome: "CORRECTIVE_ACTION_REQUIRED", findings: [{ severity: "CRITICAL", description: "broken fencing perimeter" }] }
              as: Auditor
              as_user_id: "auditor-a"
          trigger:
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /farm-network/audits/${a2_id}/corrective-actions"
              as: NetworkManager
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
            - call: "GET /farm-network/routes/${r_id}"
              as: PlantOperator
          assert:
            - "corrective action status == OVERDUE (link 1: clock flips the CA)"
            - "Farm.${f_id}.status == SUSPENDED (link 2: CRITICAL overdue suspends the farm)"
            - "route stop with stop_sequence 1 has status SKIPPED (link 3: suspension skips the scheduled stop)"
            - "route committed_cases == 0 and available_cases == 10 (link 4: skip re-reconciles the route load)"

      - name: incident_removal_cascades_contract_termination_commitment_cancellation
        grounds:
          - state_machines.WelfareIncident
          - state_machines.Farm
          - state_machines.FarmContract
          - state_machines.SupplyCommitment
        distinguishing_aspect: |
          Incident-resolution-triggered cascade (a different trigger than the clock-driven
          cascade): resolving a CRITICAL incident with disposition REMOVAL removes the farm
          (link 1), which terminates its ACTIVE contract (link 2), which cancels its
          future-dated ACTIVE commitment (link 3) — each hop caused by the previous link.
        test_recipe:
