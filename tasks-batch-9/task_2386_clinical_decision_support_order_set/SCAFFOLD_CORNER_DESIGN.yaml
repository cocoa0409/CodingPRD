              as: SystemAdmin
              captures: { pharm_id: $.data.id }
            - call: POST /cds/vendor-releases
              payload: { vendor_name: "Medisafe", release_label: "2026.11-empty", content_domain: "ALLERGY", received_at: "2026-08-01T00:00:00Z" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { empty_id: $.data.id }
            - call: POST /cds/vendor-releases
              payload: { vendor_name: "Medisafe", release_label: "2026.11", content_domain: "DOSING", received_at: "2026-08-01T00:00:00Z" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vr_id: $.data.id }
            - call: POST /cds/vendor-releases/${vr_id}/deltas
              payload: { rule_code: "DOSE-9001", change_type: "DOSING_BOUND_CHANGED", description: "Ceiling lowered", new_severity: "MODERATE" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d1_id: $.data.id }
          trigger:
            - call: POST /cds/vendor-releases/${empty_id}/run-impact-analysis
              payload: { analysis_note: "Nothing to score" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: POST /cds/vendor-releases/${vr_id}/activate
              payload: { activation_note: "Too early" }
              as: PharmacyInformaticist
