# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - breadth coverage of every testable claim in
#     SCAFFOLD.yaml (§1.1-§1.7) that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#     does not already assert. Sections and claim_type values are taken from
#     references/claim-extraction-guide.md; corners already covered by a §1.8
#     instance appear as `excluded_because:` stubs with no test_recipe.
#
#     Domain: smart-home-interoperability-certification (api_prefix "")
#     Logical clock: POST /_clock/set_current_utc; server default
#     2026-08-01T00:00:00Z. Every chain below starts from an EMPTY database.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:
      - name: specification_creation_applies_every_declared_default
        claim_type: creation
        grounds:
          - entities.Specification.fields
          - endpoints[POST /specifications]
          - response_envelope
        distinguishing_aspect: >
          A creation call carrying ONLY the three required inputs must come back with all six
          defaulted/system fields materialised: status DRAFT, sunset_date null, supersedes_specification_id
          null, min_plugfest_credits 0, ratified_at null, deprecated_at null, feature_set_count 0, and
          version 1. An implementation that leaves any of them absent from the response body fails.
        test_recipe:
          setup:
            - "Empty database; the logical clock is moved to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "GET /specifications/${spec_id}"
              payload: {}
              as: PublicViewer
          assert:
            - "POST returns 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "data.status == \"DRAFT\", data.ratified_at is null, data.deprecated_at is null"
            - "data.sunset_date is null, data.supersedes_specification_id is null, data.min_plugfest_credits == 0"
            - "data.feature_set_count == 0 and data.version == 1"
            - "data.id is a UUID with no type prefix, and data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "The GET returns 200 with byte-identical field values for version_label, status, security_baseline_level, effective_date and version"

      - name: every_collection_has_its_own_not_found_error_id
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_SPECIFICATION_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: >
          Eleven entities means eleven distinct 404 error ids; a single shared ERR_NOT_FOUND is wrong.
          Each GET-by-id below addresses the same syntactically valid but unstored UUID and must return
          that collection's OWN error_id, proving §1.4 priority 4 resolves path segments per collection.
        test_recipe:
          setup:
            - "Empty database - nothing is created at all, so every id below resolves to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /specifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /feature-sets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-laboratories/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /submissions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /plugfests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /plugfest-participations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /listings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /noncompliance-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "All eleven calls return HTTP 404 with response_type == \"error\""
            - "The error ids are, in order: ERR_SPECIFICATION_NOT_FOUND, ERR_FEATURE_SET_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_LABORATORY_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_TEST_PLAN_NOT_FOUND, ERR_TEST_SESSION_NOT_FOUND, ERR_PLUGFEST_NOT_FOUND, ERR_PARTICIPATION_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_CASE_NOT_FOUND"
            - "Every error body carries data.error_id and data.message and no data.id"

      - name: member_creation_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Member.fields.tier
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          tier has source input and no default, so omitting it is a 400 - not a silent ADOPTER. The
          rejection must also be total: no Member row may exist afterwards, which a naive
          create-then-validate implementation gets wrong.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "PLATINUM" }
              as: ProgramAdmin
            - call: "GET /members"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "The first call returns 400 ERR_INVALID_REQUEST (tier is required and has no default)"
            - "The second call returns 422 ERR_INVALID_ENUM_VALUE - PLATINUM is outside {ADOPTER, PARTICIPANT, PROMOTER}, and enum validity (priority 7) is checked after presence (priority 6)"
            - "GET /members returns 200 with total_count == 0 and has_more == false - neither rejected request created a row"

      - name: feature_set_range_and_enum_constraints_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.FeatureSet.fields.test_case_count
          - entities.FeatureSet.fields.obligation
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: >
          test_case_count's declared range is 1..500, so 0 and 501 are both 400s while 1 and 500 are
          accepted - the range is inclusive at both ends. Enum violations are a different error id and
          status (422 ERR_INVALID_ENUM_VALUE) from range violations (400 ERR_INVALID_REQUEST), and the
          parent's feature_set_count must count only the rows that survived.
        test_recipe:
          setup:
            - "One DRAFT Specification (feature sets may only be added while the version is DRAFT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "BAD_ZERO", obligation: "MANDATORY", test_case_count: 0 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "BAD_HIGH", obligation: "MANDATORY", test_case_count: 501 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "BAD_OBLIG", obligation: "REQUIRED", test_case_count: 10 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "CAMERA", feature_code: "BAD_TYPE", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "EDGE_LOW", obligation: "MANDATORY", test_case_count: 1 }
              as: ProgramAdmin
              captures: { fs_low_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "EDGE_HIGH", obligation: "OPTIONAL", test_case_count: 500 }
              as: ProgramAdmin
              captures: { fs_high_id: $.data.id }
            - call: "GET /specifications/${spec_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "test_case_count 0 returns 400 ERR_INVALID_REQUEST and 501 returns 400 ERR_INVALID_REQUEST"
            - "obligation \"REQUIRED\" returns 422 ERR_INVALID_ENUM_VALUE and device_type \"CAMERA\" returns 422 ERR_INVALID_ENUM_VALUE"
            - "The inclusive bounds are accepted: FeatureSet.${fs_low_id}.test_case_count == 1 and FeatureSet.${fs_high_id}.test_case_count == 500, both 201"
            - "FeatureSet.${fs_low_id}.security_relevant == false and depends_on_feature_set_id is null - both defaults applied"
            - "Specification.${spec_id}.feature_set_count == 2 - the four rejected requests contributed nothing"

      - name: laboratory_array_input_rejects_empty_and_duplicated_device_types
        claim_type: type_constraints
        grounds:
          - entities.TestLaboratory.fields.authorized_device_types
          - entities.TestLaboratory.fields.bench_capacity
          - validations[priority=6]
        distinguishing_aspect: >
          authorized_device_types is an array with three separate constraints (non-empty, no duplicates,
          every element a device_type enum member) and bench_capacity has the range 1..32. Element-level
          enum failure is 422 while the array-shape and range failures are 400, so the two must not be
          collapsed into one code.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /test-laboratories"
              payload: { name: "Lab Empty", bench_capacity: 2, authorized_device_types: [], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Lab Dup", bench_capacity: 2, authorized_device_types: ["LIGHTING", "LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Lab Enum", bench_capacity: 2, authorized_device_types: ["CAMERA"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Lab Zero", bench_capacity: 0, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Lab Big", bench_capacity: 33, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Lab Good", bench_capacity: 32, authorized_device_types: ["LIGHTING", "HUB"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
          assert:
            - "Empty array, duplicated element and bench_capacity 0 and 33 all return 400 ERR_INVALID_REQUEST"
            - "authorized_device_types [\"CAMERA\"] returns 422 ERR_INVALID_ENUM_VALUE - an element outside the enum is an enum failure, not a shape failure"
            - "The accepted laboratory has TestLaboratory.${lab_id}.bench_capacity == 32 (the inclusive upper bound) and authorized_device_types == [\"LIGHTING\", \"HUB\"]"
            - "TestLaboratory.${lab_id}.accreditation_status == \"PROVISIONAL\", reserved_bench_minutes == 0, competency_score is null, competency_variant is null, competency_reviewed_at is null"

      - name: submission_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CertificationSubmission.fields
          - endpoints[POST /submissions]
          - calculations.submission_certification_fee_cents
        distinguishing_aspect: >
          Nine of CertificationSubmission's fields are source input; every other field is system or
          computed. A create request that also supplies state, dac_state, certification_fee_cents,
          fee_escrowed_cents, version and id must have all six values discarded, and the pinned fee must
          be the computed 150000 (LIGHTING 120000 + 2 x 15000 + SB1 0, ADOPTER, STANDARD) rather than
          the client's number.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with LIGHTING feature sets CORE_ONOFF (MANDATORY 20) and CORE_DIM (MANDATORY 10)."
            - "One ADOPTER Member whose IP commitment is executed and whose tool access is GRANTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
          trigger:
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:BB:CC:DD", state: "CERTIFIED", dac_state: "ISSUED", certification_fee_cents: 1, fee_escrowed_cents: 999999, version: 42 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "The call returns 201 - unknown/system keys are ignored, not rejected"
            - "CertificationSubmission.${sub_id}.state == \"DRAFT\" and dac_state == \"NOT_ISSUED\" - the supplied CERTIFIED/ISSUED were discarded"
            - "CertificationSubmission.${sub_id}.certification_fee_cents == 150000 - computed from the formula, not the supplied 1"
            - "CertificationSubmission.${sub_id}.fee_escrowed_cents == 0 and version == 1 - the supplied 999999 and 42 were discarded"
            - "CertificationSubmission.${sub_id}.review_track == \"STANDARD\" (default applied), conformance_review_state == \"PENDING\", security_review_state == \"PENDING\", revision_round == 0"
            - "provisional_readiness_score, final_readiness_score, secure_boot_verified, verified_firmware_update_capability, conformance_reviewer_user_id, security_reviewer_user_id, dac_serial, submitted_at, review_started_at and certified_at are all null, and plugfest_credit_count == 0"

      - name: submission_list_filters_and_paginates_consistently
        claim_type: listing
        grounds:
          - endpoints[GET /submissions]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >
          The list surface must report total_count over the FILTERED set (not the whole table) and
          has_more relative to limit+offset. With three rows, one of them SUBMITTED, a state filter must
          drop total_count to 2 while the unfiltered page-2 request reports has_more false - a naive
          implementation that computes total_count before filtering, or has_more from the page length,
          fails.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20)."
            - "One ADOPTER Member in good standing with 1000000 cents of credit."
            - "Three of the member's submissions exist; the third has been submitted, so its state is SUBMITTED while the other two are DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-200", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:02" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-300", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:03" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub3_id: $.data.id }
            - call: "POST /submissions/${sub3_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "GET /submissions"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /submissions"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /submissions"
              payload: { state: "DRAFT", limit: 10, offset: 0 }
              as: ProgramAdmin
            - call: "GET /submissions"
              payload: { state: "SUBMITTED", member_id: "${m1_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
            - call: "GET /submissions"
              payload: { limit: 0, offset: 0 }
              as: ProgramAdmin
          assert:
            - "Page 1 (limit 2, offset 0) returns 200 with exactly 2 rows, total_count == 3 and has_more == true"
            - "Page 2 (limit 2, offset 2) returns exactly 1 row, total_count == 3 and has_more == false"
            - "state == DRAFT returns 2 rows with total_count == 2 - total_count is computed over the filtered set"
            - "state == SUBMITTED combined with member_id returns 1 row whose data[0].id == ${sub3_id} and total_count == 1"
            - "limit 0 is below the declared minimum of 1 and returns 400 ERR_INVALID_REQUEST"
            - "response_type == \"array\" on every successful list response"

      - name: feature_set_parent_must_exist_and_still_be_draft
        claim_type: parent_relationships
        grounds:
          - entities.FeatureSet.parent
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_SPECIFICATION_STATE]
        distinguishing_aspect: >
          FeatureSet's parent gate has two independent halves that must be checked in §1.4 priority
          order: existence (priority 5, 404) strictly before the parent's status (priority 13, 409). The
          same POST body therefore yields 404 for an unstored parent and 409 once the parent exists but
          has been ratified - and after ratification the specification's feature graph is frozen forever.
        test_recipe:
          setup:
            - "One Specification that is ratified during setup, so its status is RATIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /feature-sets"
              payload: { specification_id: "00000000-0000-4000-8000-000000000000", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { err_state: $.data.error_id }
            - call: "GET /specifications/${spec_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The unstored parent returns 404 ERR_SPECIFICATION_NOT_FOUND (priority 5 wins over priority 13)"
            - "The RATIFIED parent returns 409 ERR_INVALID_SPECIFICATION_STATE"
            - "Specification.${spec_id}.feature_set_count is still 1 and status == \"RATIFIED\" with ratified_at == \"2026-09-01T00:00:00Z\""
            - "GET /feature-sets?specification_id=${spec_id} returns total_count == 1"

      - name: feature_dependency_edges_cannot_leave_their_device_type
        claim_type: cycle_constraint
        grounds:
          - entities.FeatureSet.fields.depends_on_feature_set_id
          - validations[priority=32]
          - validations[priority=6]
          - errors[ERR_FEATURE_DEPENDENCY_CYCLE]
        distinguishing_aspect: >
          The depends_on graph is scoped to one (specification_id, device_type) pair and must stay
          acyclic. Because the edge can only be set at creation and never updated, acyclicity is
          structural - the reachable failure is a cross-device-type or cross-specification edge (422
          ERR_FEATURE_DEPENDENCY_CYCLE), plus the presence rule: CONDITIONAL requires the edge and
          MANDATORY/OPTIONAL must leave it null (400 ERR_INVALID_REQUEST).
        test_recipe:
          setup:
            - "Two DRAFT Specifications, S1 and S2."
