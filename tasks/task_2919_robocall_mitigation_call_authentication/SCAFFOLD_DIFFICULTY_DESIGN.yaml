              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /rmd/certificates/${cert_id}/issue"
              payload: {}
              as: PolicyAdministrator
            - call: "POST /rmd/certificates/${cert_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "CALL_BLOCKING_ANALYTICS"], expected_provider_version: "${prov_v0}" }
