  - name: error_session_creation_on_a_programme_disabled_exhibit_is_refused
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_INTERACTION_PROGRAM_DISABLED (409)
    - §1.4 priority 18 (applies to creation and to transitions)
    - §1.1 Exhibit.interaction_program_enabled (default false)
    - §1.5 PATCH /aquarium/exhibits/{id} (the only way to restore the flag)
    distinguishing_aspect: interaction_program_enabled defaults to FALSE, so a freshly created exhibit rejects session creation outright with 409 — the gate is not only about the CASCADE A auto-disable. A PATCH enabling the programme admits the identical booking.
