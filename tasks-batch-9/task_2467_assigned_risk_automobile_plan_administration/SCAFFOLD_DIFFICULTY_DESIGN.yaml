          The surcharge step function is closed on the left at 6: a risk with exactly 6 points
          (YOUTHFUL_OPERATOR adder 3 + SPEEDING_MAJOR 3) must take factor 1.60, while a 5-point risk
          (SENIOR 1 + SPEEDING_MINOR 1 + SPEEDING_MAJOR 3) stays in the 4-5 band at 1.35. One point
          of difference moves the annual charge from 208264 to 246834 and also crosses the expense
          tier boundary in the other direction. Metric = surcharge points on POST /plan/policies;
          the sibling instance measures candidate-set cardinality on the cycle-run endpoint.
