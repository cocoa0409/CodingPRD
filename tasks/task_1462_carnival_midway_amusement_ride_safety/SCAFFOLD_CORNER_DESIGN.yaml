            - "err == ERR_CROSS_FAIR_REFERENCE with http 422 (wristband's day belongs to ${fair_a}, ride to ${fair_b})"
            - "no redemption row is persisted; TicketSale.${sale_a}.credits_remaining == 3 (untouched)"

  # =================================================================
  # Section: rbac
  # =================================================================
  - section: rbac
    instances:
      - name: ride_operator_cannot_create_ticket_products_returns_403
        claim_type: role_exclusive_denial
        grounds:
          - 'roles[FairManager]'
          - 'errors[ERR_FORBIDDEN]'
        distinguishing_aspect: "Ticket-product configuration is FairManager-exclusive; a same-fair OPERATOR calling it fails with ERR_FORBIDDEN even though the caller is a perfectly valid staff member."
        test_recipe:
          setup: ["Fair with SUPERVISOR and OPERATOR staff"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway RB1", operator_company_name: "ShowCo", location: "Lot 61", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup RB1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Op RB1", functions: ["OPERATOR"] }, as: FairManager, as_user_id: "${sup_id}", captures: { op_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_id}", name: "Credits", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: RideOperator, as_user_id: "${op_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN with http 403 (RideOperator not in the endpoint's roles)"

      - name: inspector_cannot_complete_unassigned_appointment_returns_403
        claim_type: role_ownership
        grounds:
          - 'state_machines.InspectionAppointment.SCHEDULED_to_COMPLETED_PASS'
          - 'errors[ERR_FORBIDDEN]'
        distinguishing_aspect: "Completion is ownership-scoped: an active inspector who is NOT the assignee gets ERR_FORBIDDEN, even though StateInspector is the correct role for the endpoint."
        test_recipe:
          setup: ["Fair PERMIT_REQUESTED; appointment assigned to the first-registered inspector (insp1)"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway RB2", operator_company_name: "ShowCo", location: "Lot 62", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup RB2", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew RB2", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp RB2a", license_number: "LIC-RB2-1" }, as: StateProgramAdmin, captures: { insp1: "$.data.id" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp RB2b", license_number: "LIC-RB2-2" }, as: StateProgramAdmin, captures: { insp2: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-RB2-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${insp2}", captures: { err: "$.data.error_id" } }
          assert:
            - "assigned inspector is ${appt_insp} (== ${insp1}); completion attempted by ${insp2} -> err == ERR_FORBIDDEN with http 403"
            - "InspectionAppointment.${appt_id}.status == SCHEDULED (unchanged)"

      - name: crew_member_cannot_confirm_others_shift_returns_403
        claim_type: role_ownership
        grounds:
          - 'state_machines.CrewShift.SCHEDULED_to_CONFIRMED'
          - 'errors[ERR_FORBIDDEN]'
        distinguishing_aspect: "Shift confirmation is self-only: a different ACTIVE CREW member of the same fair gets ERR_FORBIDDEN when confirming someone else's shift."
        test_recipe:
          setup: ["Fair; two CREW staff; a SCHEDULED SETUP shift belonging to crew1"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway RB3", operator_company_name: "ShowCo", location: "Lot 63", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup RB3", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew One", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew1: "$.data.id", crew1_v: "$.data.version" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew Two", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew2: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew1}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew1_v}" }, as: FairManager, as_user_id: "${sup_id}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/crew-shifts/${shift_id}/confirm", payload: {}, as: CrewMember, as_user_id: "${crew2}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN with http 403 (caller ${crew2} != shift.staff_id ${crew1})"
            - "CrewShift.${shift_id}.status == SCHEDULED (unchanged)"

      - name: program_admin_cannot_register_rides_returns_403
        claim_type: role_exclusive_denial
        grounds:
          - 'roles[StateProgramAdmin]'
          - 'roles[FairManager]'
          - 'errors[ERR_FORBIDDEN]'
        distinguishing_aspect: "The state administrator owns fairs and inspectors but NOT ride inventory: POST /midway/rides as StateProgramAdmin fails with ERR_FORBIDDEN (peer-role separation between program and show sides)."
        test_recipe:
          setup: ["Fair exists"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway RB4", operator_company_name: "ShowCo", location: "Lot 64", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-RB4-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: StateProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

  # =================================================================
  # Section: cross_cutting_layers
  # =================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_crew_shift_stale_staff_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[crew-shift-create-stale-staff]'
          - 'errors[ERR_STALE_STAFF_VERSION]'
        distinguishing_aspect: "After one shift creation bumps StaffMember.version to 2, a second create carrying the stale observed version fails 412 ERR_STALE_STAFF_VERSION; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["Fair in SETUP; crew staff at version 1"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CC1", operator_company_name: "ShowCo", location: "Lot 65", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CC1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CC1", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v1: "$.data.version" } }
          trigger:
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v1}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh1: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 12, end_hour: 16, shift_role: "SETUP", expected_staff_version: "${crew_v1}" }, as: FairManager, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /midway/staff/${crew_id}", as: FairManager, as_user_id: "${sup_id}", captures: { crew_v2: "$.data.version" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 12, end_hour: 16, shift_role: "SETUP", expected_staff_version: "${crew_v2}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh2: "$.data.id" } }
          assert:
            - "first create with version 1 succeeds"
            - "second create with the same (now stale) version 1 -> err == ERR_STALE_STAFF_VERSION with http 412"
            - "re-read shows version == 2; retry with version 2 succeeds"
            - "exactly two CrewShift rows exist for ${crew_id} (the 412 created nothing)"

      - name: occ_permit_approve_stale_fair_version_then_recovery
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[permit-approve-stale-fair]'
          - 'errors[ERR_STALE_FAIR_VERSION]'
          - 'errors[ERR_PERMIT_INVALID_STATE]'
        distinguishing_aspect: "Adding a ride between the approver's fair read and the approve call bumps Fair.version, so the stale approve fails 412 ERR_STALE_FAIR_VERSION; a fresh read + approve succeeds; a THIRD approve then fails 409 ERR_PERMIT_INVALID_STATE (terminal PENDING->APPROVED already consumed)."
        test_recipe:
          setup: ["Fair PERMIT_REQUESTED with one verified ride; FAIR_WIDE PASS completed; approver observed fair version before a second ride was registered"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CC2", operator_company_name: "ShowCo", location: "Lot 66", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CC2", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CC2", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp CC2a", license_number: "LIC-CC2-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp CC2b", license_number: "LIC-CC2-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-CC2-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v_stale: "$.data.version" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Late Ride", manufacturer: "MFG", model: "X2", serial_number: "SN-CC2-2", ride_class: "KIDDIE", capacity_per_cycle: 6, min_rider_height_in: 30, max_rider_height_in: 60, wind_limit_mph: 35, cycle_inspection_interval: 10, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v_stale}" }, as: StateInspector, as_user_id: "${insp2_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v_fresh: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v_fresh}" }, as: StateInspector, as_user_id: "${insp2_id}", captures: { final_fee: "$.data.final_fee_cents" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v_fresh}" }, as: StateInspector, as_user_id: "${insp2_id}", captures: { err_again: "$.data.error_id" } }
          assert:
            - "stale approve -> err == ERR_STALE_FAIR_VERSION with http 412 (ride registration bumped Fair.version)"
            - "fresh approve succeeds; final_fee_cents == 39000 (only the SETUP_VERIFIED THRILL ride qualifies; the INSTALLED KIDDIE ride is excluded)"
            - "third approve -> err_again == ERR_PERMIT_INVALID_STATE with http 409 (permit already APPROVED)"

      - name: occ_checklist_countersign_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[checklist-countersign-stale-checklist]'
          - 'errors[ERR_STALE_CHECKLIST_VERSION]'
        distinguishing_aspect: "The countersigner's expected_checklist_version must match the post-submit version; the pre-submit version captured at creation fails 412 ERR_STALE_CHECKLIST_VERSION, and the correct version succeeds."
        test_recipe:
          setup: ["Permitted fair; day in CHECKLIST_PHASE; checklist created (version 1) and submitted (version 2)"]
