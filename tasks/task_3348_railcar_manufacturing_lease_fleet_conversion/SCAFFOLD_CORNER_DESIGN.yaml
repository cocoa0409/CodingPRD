  - name: rbac_lease_administrator_lessee_and_contract_lifecycle_operations_succeed
    claim_type: exclusive operations
    grounds:
    - roles.LeaseAdministrator.exclusive_operations
    - POST /api/v1/lessees
    - POST /api/v1/lease-contracts
    - POST /api/v1/lease-contracts/{id}/activate
    - entities.LeaseContract.fields.amendment_seq
    distinguishing_aspect: LeaseAdministrator alone mints the lessee account and the contract, and the
      DRAFT-to-ACTIVE activation is visible in the same chain with amendment_seq still 0 and version advanced
      by exactly one — no other §1.7 role appears on any of the three endpoints' §1.5 role lists.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - The contract term [2026-01-01, 2027-12-31) closes after the pinned clock date, which is the activate
        precondition's date test; no assignment exists, so the overlap precondition is vacuous.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-LA-1
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 9000000
        as: LeaseAdministrator
        captures:
          ls_id: $.data.id
          ls_status: $.data.status
          ls_balance: $.data.outstanding_balance_cents
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${ls_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 10000
          liability_bearer: LESSOR
          term_start_date: '2026-01-01'
          term_end_date: '2027-12-31'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
          lc_status_draft: $.data.status
          lc_seq0: $.data.amendment_seq
          lc_cap0: $.data.capital_allocation_cents
          lc_v0: $.data.version
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_status_active: $.data.status
          lc_v1: $.data.version
          lc_seq_after: $.data.amendment_seq
      assert:
      - The lessee write returns HTTP 201 with data.status == ${ls_status} == "ACTIVE" and data.outstanding_balance_cents
        == ${ls_balance} == 0
      - The contract write returns HTTP 201 with data.status == ${lc_status_draft} == "DRAFT", data.amendment_seq
        == ${lc_seq0} == 0 and data.capital_allocation_cents == ${lc_cap0} == 0
      - POST /lease-contracts/${lc_id}/activate returns HTTP 200 with data.status == ${lc_status_active}
        == "ACTIVE"
      - 'Activation advances the contract''s optimistic-concurrency counter by exactly one: data.version
        == ${lc_v1} == ${lc_v0} + 1'
      - 'Activation alone ratifies nothing: data.amendment_seq == ${lc_seq_after} == 0'
      - All three writes succeed for LeaseAdministrator alone, so lessee minting, contract drafting and
