              as_user_id: "dual-hat-user"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "$.data.error_id == ERR_SEGREGATION_OF_DUTIES (priority 15 wins over the fiscal fund-exceeded error)"

