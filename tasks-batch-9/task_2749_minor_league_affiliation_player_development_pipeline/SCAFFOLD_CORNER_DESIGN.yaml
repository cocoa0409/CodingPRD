              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { sv_agr_a: $.data.id }
            - call: "POST /affiliates/${sv_a}/facility-reviews"
              payload: { category: "LIGHTING", review_date: "2026-04-01", score: 75 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { sv_rev_a: $.data.id }
          trigger:
            - call: "POST /agreements/${sv_agr_a}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${sv_b}"
              captures: { sv_e1: $.data.error_id }
            - call: "POST /facility-reviews/${sv_rev_a}/disposition"
