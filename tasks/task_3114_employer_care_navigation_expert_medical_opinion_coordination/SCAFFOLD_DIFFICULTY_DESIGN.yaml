              as_user_id: "${m_id}"
            - call: "POST /care/members/${m_id}/navigation-cases"
              payload: { question_type: "CLINICAL", acuity: "LOW" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: $.data.id }
            - call: "POST /care/navigation-cases/${nc_id}/start"
              payload: {}
              as: NurseNavigator
              as_user_id: "nn-2"
            - call: "POST /care/members/${m_id}/expert-opinions"
