            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v1}", commission_rate_bps: 900, placement_fee_base_cents: 30000, employer_revenue_share_bps: 1000, note: "round 2 merchant" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { agreement_v2: $.data.version, status_r2: $.data.status }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v2}", commission_rate_bps: 1100, placement_fee_base_cents: 34000, employer_revenue_share_bps: 2000, note: "round 3 provider" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_v3: $.data.version, status_r3: $.data.status }
            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v3}", commission_rate_bps: 1000, placement_fee_base_cents: 32000, employer_revenue_share_bps: 1500, note: "round 4 merchant" }
              as: Merchant
              as_user_id: "${merchant_id}"
