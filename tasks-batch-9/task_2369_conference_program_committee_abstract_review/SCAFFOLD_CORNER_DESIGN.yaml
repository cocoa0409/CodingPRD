  # ===========================================================================
  # SECTION 2 — State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: conference_draft_to_cfa_open_opens_the_call_for_abstracts
        claim_type: valid_transition
        grounds:
          - state_machines.Conference.DRAFT_to_CFA_OPEN
          - endpoints.POST./conferences/{conferenceId}/status-transitions
        distinguishing_aspect: |
          The declared preconditions - at least one SubmissionCategory on the
          conference and a logical clock before abstract_deadline_utc - hold, so
          the transition succeeds, status becomes CFA_OPEN and Conference.version
          advances by exactly 1.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z, which is before the 2026-03-01T23:59:00Z abstract deadline."
            - "Conference GOS26 is DRAFT and category GEN already exists on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id", v0: "$.data.version" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
          trigger:
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
              captures: { new_status: "$.data.status", v1: "$.data.version" }
          assert:
            - "HTTP 200"
            - "Conference.${conf_id}.status == CFA_OPEN"
            - "Conference.${conf_id}.version == ${v0} + 1"
            - "Conference.${conf_id}.cfa_extension_count == 0 — an opening is not an extension"
            - "Conference.${conf_id}.abstract_deadline_utc == 2026-03-01T23:59:00Z (unchanged)"

      - name: committee_member_starts_invited_with_a_pending_coi_and_zero_load
        claim_type: initial_state
        grounds:
          - state_machines.CommitteeMember.initial_state
          - entities.CommitteeMember.fields.status
          - entities.CommitteeMember.fields.coi_declaration_status
        distinguishing_aspect: |
          A freshly recruited member is INVITED with coi_declaration_status
          PENDING, current_review_load 0 and chaired_session_count 0 - never
          ACTIVE on creation, which is what makes the COI gate at activation
          meaningful.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
          trigger:
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"] }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id", st: "$.data.status", coi: "$.data.coi_declaration_status", load: "$.data.current_review_load", maxload: "$.data.max_review_load", bias: "$.data.calibration_bias" }
          assert:
            - "HTTP 201"
            - "CommitteeMember.${mb_r1_id}.status == INVITED"
            - "CommitteeMember.${mb_r1_id}.coi_declaration_status == PENDING"
            - "CommitteeMember.${mb_r1_id}.current_review_load == 0"
            - "CommitteeMember.${mb_r1_id}.chaired_session_count == 0"
            - "CommitteeMember.${mb_r1_id}.max_review_load == 4 (declared default)"
            - "CommitteeMember.${mb_r1_id}.calibration_bias == 0.00 (declared default)"

      - name: conference_jump_from_draft_to_review_closed_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Conference.transitions
          - validations[priority=9]
          - errors[ERR_CONFERENCE_STATE_INVALID]
        distinguishing_aspect: |
          DRAFT has exactly one outgoing edge (CFA_OPEN). A request for
          REVIEW_CLOSED is a declared enum member with no transition from DRAFT,
          so it is a priority-9 state failure with HTTP 409
          ERR_CONFERENCE_STATE_INVALID - not ERR_VALIDATION, and the conference
          must not move or bump its version.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 is DRAFT with category GEN on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id", v0: "$.data.version" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
          trigger:
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { st_after: "$.data.status", v_after: "$.data.version" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_CONFERENCE_STATE_INVALID"
            - "Conference.${conf_id}.status == DRAFT"
            - "Conference.${conf_id}.version == ${v0} — a rejected transition writes nothing"

      - name: withdrawn_abstract_cannot_be_confirmed_afterwards
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Abstract.SUBMITTED_UNDER_REVIEW_SCORED_WAITLISTED_ACCEPTED_CONFIRMED_SCHEDULED_to_WITHDRAWN
          - validations[priority=10]
          - errors[ERR_ABSTRACT_STATE_INVALID]
        distinguishing_aspect: |
          WITHDRAWN is a declared terminal state of the Abstract status
          dimension. Even with the conference at DECISIONS_RELEASED and the
          author fully registered - i.e. with every OTHER precondition of
          ACCEPTED -> CONFIRMED satisfied - the confirmation must fail with
          HTTP 409 ERR_ABSTRACT_STATE_INVALID rather than resurrect the row.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 walked to DECISIONS_RELEASED."
            - "Category GEN has min_reviews_required 2 and discrepancy_threshold 4.00."
            - "Ada's abstract collected reviews of 4.00 and 3.00 (spread 1.00, no discrepancy case), was decided ORAL by chair Cho, and Ada then withdrew it."
            - "Ada is registered, so ERR_AUTHOR_NOT_REGISTERED cannot mask the state failure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "genomics"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1_id: "$.data.id" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r2_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv2_id: "$.data.id" }
            - call: "POST /reviews/${rv1_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "POST /reviews/${rv2_id}/submission"
              payload: { score_originality: 3, score_methodology: 3, score_relevance: 3, score_clarity: 3, confidence: "MEDIUM", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r2_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
            - call: "GET /conferences/${conf_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { conf_v1: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_v1}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: ConferenceAdmin
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: true }
              as: Author
              as_user_id: "${au_ada_id}"
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "WITHDRAWN", reason: "conflicting publication" }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { st_withdrawn: "$.data.status" }
          trigger:
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_ABSTRACT_STATE_INVALID"
            - "Abstract.${ab1_id}.status == WITHDRAWN"
            - "Abstract.${ab1_id}.decision == null and decided_by_member_id == null after the withdrawal"
            - "Conference.${conf_id}.accepted_oral_count == 0 — the withdrawal released the slot and nothing re-took it"
            - "Author.${au_ada_id}.is_registered == true, so registration was not the blocking reason"

      - name: second_decline_on_the_same_review_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Review.ASSIGNED_to_DECLINED
          - validations[priority=10]
          - errors[ERR_REVIEW_STATE_INVALID]
        distinguishing_aspect: |
          Declining is not idempotent: the first call moves ASSIGNED -> DECLINED
          and decrements the load to 0, the second finds a terminal DECLINED row
          and fails with HTTP 409 ERR_REVIEW_STATE_INVALID without decrementing
          the load a second time (which would drive it negative).
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN with category GEN (min_reviews_required 2)."
            - "Ada's abstract is UNDER_REVIEW with one ASSIGNED review held by Rui (load 1); Rui is the only ACTIVE reviewer, so no auto-reassignment is possible."
