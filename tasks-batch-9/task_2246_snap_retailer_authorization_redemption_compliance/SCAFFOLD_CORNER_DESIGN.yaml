          - state_machines.Investigation.initial_state
          - state_machines.RedemptionPeriod.initial_state
          - state_machines.EquipmentOrder.initial_state
        distinguishing_aspect: "Four different machines each start where §1.2 declares - RESERVED, OPEN, OPEN and DRAFT - and none of the four creations needs an explicit status input."
        test_recipe:
          setup:
            - "An authorized store plus a depot with one terminal."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
