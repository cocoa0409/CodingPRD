            - "leg B: approve against FINAL NOT_COMPATIBLE determination -> error_id == ERR_USE_INCOMPATIBLE (http 422)"
            - "both permits remain UNDER_REVIEW"
      - name: assignment_gated_by_volunteer_background_state
        grounds:
          - validations[priority=11]
          - state_machines.Volunteer.PENDING_to_CLEARED
        distinguishing_aspect: |
          Entity pair VolunteerAssignment -> Volunteer (different pair than
          permit->determination): assignment creation requires the linked
          volunteer's background_status == CLEARED; a PENDING volunteer is
          rejected with ERR_VOLUNTEER_NOT_CLEARED, and the same call succeeds
          after clear-background flips the other entity's state.
