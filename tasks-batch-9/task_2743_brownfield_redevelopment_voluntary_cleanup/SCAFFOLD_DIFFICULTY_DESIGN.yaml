  # ===========================================================================
  # Rule 3 — Non-linear state machines on three different entities, each
  #          exercising a different dimension of non-linearity
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: assessment_phase_revision_cycle_terminates_in_rejection
        grounds:
          - state_machines.AssessmentPhase.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.AssessmentPhase.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.AssessmentPhase.UNDER_REVIEW_to_REJECTED
          - entities.AssessmentPhase.fields.review_round
          - validations[38].ERR_ASSESSMENT_REVISION_LIMIT
        distinguishing_aspect: |
          Non-linearity dimension = CYCLE. The loop
          REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED
          runs exactly twice on one AssessmentPhase and then the same trigger
          (review decision REQUEST_REVISION) routes to a different target state
          because review_round has reached 3, so the loop is bounded by a counter
          rather than by the trigger. Same trigger, three different outcomes
          across the three passes.
        test_recipe:
          setup:
            - "Clock 2026-08-01; redeveloper and consultant parties; site UNDER_CONTRACT with a LiabilityProtection in inquiry_state AAI_PENDING (no inquiry-completion call, so the deficiency cascade has somewhere to land)."
            - "One PHASE_I assessment phase with a single finding, submitted (review_round 1) and therefore UNDER_REVIEW."
            - "Two REQUEST_REVISION decisions with a re-submit after each, leaving review_round 3 and status UNDER_REVIEW."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_site
            - *k_prot
            - &k_p9
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-06-01"
                field_end_date: "2026-07-10"
                delineation_confidence: SCREENING
                aai_report_date: "2026-07-20"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p9_id: $.data.id }
            - &k_p9f
              call: "POST /assessment-phases/${p9_id}/contaminant-findings"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-01"
                max_concentration_ugl: 480.0
                screening_level_ugl: 5.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p9sub1
              call: "POST /assessment-phases/${p9_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p9rev1
              call: "POST /assessment-phases/${p9_id}/review"
              payload: { decision: REQUEST_REVISION, review_comment: "Historical use narrative incomplete." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_p9sub2
              call: "POST /assessment-phases/${p9_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p9rev2
              call: "POST /assessment-phases/${p9_id}/review"
              payload: { decision: REQUEST_REVISION, review_comment: "Interview records still missing." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_p9sub3
              call: "POST /assessment-phases/${p9_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
          trigger:
            - &k_p9rev3
              call: "POST /assessment-phases/${p9_id}/review"
              payload: { decision: REQUEST_REVISION, review_comment: "Third pass still deficient; record rejected." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "AssessmentPhase.${p9_id}.status == REJECTED (not REVISION_REQUESTED)"
            - "AssessmentPhase.${p9_id}.review_round == 3"
            - "AssessmentPhase.${p9_id}.reviewed_by_user_id == 'reviewer-alpha'"
            - "LiabilityProtection.${prot_id}.inquiry_state == AAI_DEFICIENT"
            - "LiabilityProtection.${prot_id}.bfpp_status == NOT_ESTABLISHED"
            - "Site.${site_id}.delineation_status == NONE (no APPROVED phase was ever produced)"
            - "GET /assessment-phases/${p9_id} after the third decision shows review_round 3, proving the loop ran exactly twice"

      - name: liability_protection_parallel_dimensions_advance_independently
        grounds:
          - state_machines.LiabilityProtection.OBLIGATIONS_NONE_to_CURRENT
          - state_machines.LiabilityProtection.AAI_COMPLETE_to_AAI_STALE
          - state_machines.ContinuingObligation.CURRENT_to_AT_RISK
          - entities.LiabilityProtection.fields.bfpp_status
          - entities.LiabilityProtection.fields.compliance_pct
          - calculations.bfpp_compliance
        distinguishing_aspect: |
          Non-linearity dimension = PARALLEL STATE DIMENSIONS. inquiry_state and
          obligation_state advance on unrelated triggers and neither move
          disturbs the other: obligation_state goes OBLIGATIONS_NONE -> CURRENT
          while inquiry_state stays AAI_COMPLETE, then a sweep past
          aai_expires_on moves inquiry_state to AAI_STALE while obligation_state
          stays CURRENT with compliance_pct still 1.0000, and a later sweep moves
          obligation_state to AT_RISK while inquiry_state stays AAI_STALE. The
          derived bfpp_status is a function of the pair, so it reads
          NOT_ESTABLISHED even at compliance_pct 1.0000.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site left UNDER_CONTRACT (no acquisition call) so the sweep's staleness precondition applies."
            - "APPROVED PHASE_I with aai_report_date 2026-07-20, inquiry completed, so inquiry_state is AAI_COMPLETE and aai_expires_on is 2027-07-20."
            - "Five continuing obligations imposed by reviewer-alpha, all due 2028-06-30 with recurrence 90, total weight 20."
