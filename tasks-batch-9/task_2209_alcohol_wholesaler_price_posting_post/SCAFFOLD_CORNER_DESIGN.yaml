  - section: consistency model
    instances:
      - name: the_certify_response_itself_already_reflects_the_item_level_cascade_it_triggered
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.PriceSchedule.transitions.SUBMITTED_to_POSTED, calculations.schedule_effective_date]
        distinguishing_aspect: "Consistency is immediate, so the single certify response must already carry hold_window_ends_at and effective_date, and reads issued in the same run must agree field for field with it — including the price snapshot written onto every child item. A worker that cascades to items after responding shows DRAFT items on the immediately following read."
        test_recipe:
          setup:
            - "Wholesaler A holds a SUBMITTED 2026-09 schedule with two items (750ml/12 at 120000/11000 and 375ml/6 at 30000/5500)."
            - "The clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
