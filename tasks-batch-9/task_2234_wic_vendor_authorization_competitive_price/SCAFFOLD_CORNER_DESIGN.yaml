# =============================================================================
# §1.9 Scaffold Corner Design — task_2234 WIC Vendor Authorization &
# Competitive Price Management.
#
# A breadth walk of references/claim-extraction-guide.md against §1.1–§1.7 of
# SCAFFOLD.yaml. Each `claim_type` is a row of that guide. Instances whose claim
# is already carried (more sharply) by a §1.8 difficulty instance are recorded
# as `excluded_because:` stubs naming that instance, so the union of the two
# design files covers the guide without duplicating work.
#
# Fixture shorthand used in the prose `setup:` blocks (always spelled out in
# `setup_api_calls`):
#   CHAIN A  = clock 2026-08-01T00:00:00Z; peer group PG-SUPER-A (SUPERMARKET,
#              band 5000000..20000000 inclusive, PEER_MEDIAN, allowance 0.05,
#              min_submissions_for_ceiling 3, min_stock_multiplier 1.5);
#              FoodCategory MILK (min_stock_units 4, min_variety_count 2,
#              max_units_per_transaction 6, stock_required true);
#              AuthorizedFoodItem ITEM_MILK upc 00011122233,
#              required_for_authorization true; PriceCycle 2026Q3 over
#              [2026-08-01, 2026-09-01); Vendor v1 "Alpha Market"
#              (reported 6000000) trained INITIAL 2026-07-15, IN_REVIEW,
#              one ACCEPTED milk submission of 320, AUTHORIZED; cycle closed
#              and published, giving one ACTIVE PriceCeiling
#              (PG-SUPER-A, ITEM_MILK) with mar_cents 336
#              (base 320 via STATEWIDE_FALLBACK, x1.05 = 336, cap 400 idle).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities) — §1.1, entity_topology: flat
  # ===========================================================================
  - section: entities
    instances:

      - name: create_peer_group_returns_declared_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.PeerGroup
          - endpoints[POST /peer-groups]
        distinguishing_aspect: |
          A POST /peer-groups carrying every declared input field returns 201 with
          all eight inputs echoed unchanged plus the four system/computed fields
          seeded (status ACTIVE, member_count 0, retired_at null, version 1).
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
          assert:
            - "HTTP 201 with the §1.0 success envelope: the body has exactly the keys data and meta, and data.id is a non-empty string"
            - "Echoed inputs: code == PG-SUPER-A, store_type == SUPERMARKET, min_monthly_redemption_cents == 5000000, max_monthly_redemption_cents == 20000000, mar_method == PEER_MEDIAN, competitive_allowance_pct == 0.05, min_submissions_for_ceiling == 3, min_stock_multiplier == 1.5"
            - "Seeded fields: status == ACTIVE, member_count == 0, retired_at == null, version == 1"
            - "created_at == 2026-08-01T00:00:00.000Z and updated_at == 2026-08-01T00:00:00.000Z — both come from the logical clock, never from wall time"

      - name: get_vendor_returns_stored_data_after_create
        claim_type: retrieval
        grounds:
          - entities.Vendor
          - endpoints[POST /vendors]
          - endpoints[GET /vendors/{id}]
        distinguishing_aspect: |
          GET /vendors/{id} returns the same representation POST /vendors returned,
          including every computed field at its documented default, so a freshly
          created vendor reads back as APPLICANT / risk 0.0 / LOW with a null
          peer_group_id rather than an unassigned or absent field.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one vendor created and nothing else"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
          trigger:
            - call: "GET /vendors/${v1}"
              payload: {}
              as: VendorUnitAnalyst
          assert:
            - "HTTP 200 with data.id == ${v1}"
            - "store_name == Alpha Market, store_type == SUPERMARKET, reported_monthly_redemption_cents == 6000000"
            - "peer_group_id == null, authorization_status == APPLICANT, authorized_at == null, reauthorization_due_at == null, reauth_completed_count == 0"
            - "training_type == null, training_completed_at == null, training_expires_at == null"
            - "accepted_submission_count == 0, price_submission_complete == false, open_finding_count == 0, cure_deadline_at == null, compliance_buy_required == false"
            - "risk_flag == NONE, risk_score == 0.0, risk_tier == LOW, risk_epoch_at == null"
            - "reauthorization_hold == false, reauth_blocked_reason == null, authorization_blocked_reason == null"
            - "recoupment_balance_cents == 0, avg_monthly_redemption_cents == 0, sanction_points == 0, disqualified_until == null, denial_reason == null, version == 1"

      - name: list_authorized_food_items_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /authorized-food-items]
          - response_envelope.pagination_fields
          - entities.AuthorizedFoodItem.fields.status
        distinguishing_aspect: |
          The status filter and the offset/limit window compose: total_count counts
          the filtered population (2 ACTIVE of 3 items), not the whole table, and
          has_more is computed from offset + returned against that filtered total,
          so offset 1 limit 1 yields exactly one row with has_more false.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one MILK food category"
            - "Three authorized food items created in order (upc 00011122233, 00044455566, 00077788899); the third is then delisted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_1: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00044455566", brand: "Valley Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_2: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00077788899", brand: "Legacy Dairy", container_size_oz: 64, contract_brand: false, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_3: $.data.id }
            - call: "POST /authorized-food-items/${item_3}/delist"
              payload: { delist_reason: "brand withdrawn from the authorized food list" }
              as: VendorUnitSupervisor
          trigger:
            - call: "GET /authorized-food-items?status=ACTIVE&limit=1&offset=1"
              payload: {}
              as: VendorUnitAnalyst
            - call: "GET /authorized-food-items?status=DELISTED"
              payload: {}
              as: VendorUnitAnalyst
            - call: "GET /authorized-food-items?food_category_id=${cat_milk}"
              payload: {}
              as: VendorUnitAnalyst
          assert:
            - "First call: HTTP 200, data has exactly 1 element, meta.total_count == 2, meta.limit == 1, meta.offset == 1, meta.has_more == false"
            - "That single element has status == ACTIVE and its id is one of ${item_1} or ${item_2}, never ${item_3}"
            - "Second call: meta.total_count == 1 and the only element is ${item_3} with status == DELISTED, delist_reason == 'brand withdrawn from the authorized food list' and delisted_at == 2026-08-01T00:00:00.000Z"
            - "Third call: meta.total_count == 3, meta.limit == 10 (the declared default), meta.offset == 0, meta.has_more == false — an unfiltered read still sees the delisted row, because the domain has no soft-delete layer"

      - name: get_vendor_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority 5]
          - errors.ERR_VENDOR_NOT_FOUND
          - endpoints[GET /vendors/{id}]
        distinguishing_aspect: |
          An unresolved path id produces the entity-specific 404 (ERR_VENDOR_NOT_FOUND,
          not a generic ERR_INVALID_REQUEST), and the same id shape resolved against a
          different collection yields that collection's own 404 code.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; database contains no vendors and no peer groups"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /vendors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: VendorUnitAnalyst
            - call: "GET /peer-groups/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: VendorUnitAnalyst
          assert:
            - "First call: HTTP 404 with the §1.0 error envelope and error.id == ERR_VENDOR_NOT_FOUND"
            - "Second call: HTTP 404 with error.id == ERR_PEER_GROUP_NOT_FOUND — priority 5 names the first unresolved segment per collection"
            - "Neither response contains a data key"

      - name: create_food_category_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 7]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /food-categories]
        distinguishing_aspect: |
          Every POST /food-categories input except none is defaultable, so omitting
          min_stock_units — a field with source input and no declared default — is a
          422 ERR_INVALID_REQUEST, while omitting nothing succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
          assert:
            - "First call omits min_stock_units: HTTP 422 with error.id == ERR_INVALID_REQUEST and no FoodCategory row is created"
            - "Second call is the same payload with min_stock_units 4: HTTP 201 — proving the first rejection was caused by the omission and not by a duplicate code (the first call left nothing behind)"

      - name: create_peer_group_omitting_min_submissions_applies_default_three
        claim_type: defaults
        grounds:
          - entities.PeerGroup.fields.min_submissions_for_ceiling
          - endpoints[POST /peer-groups]
        distinguishing_aspect: |
          min_submissions_for_ceiling is the one optional PeerGroup input; omitting it
          stores the declared default 3 (not null and not 0), which is the value the
          PEER_GROUP-vs-STATEWIDE_FALLBACK branch of the ceiling sweep later reads.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /peer-groups"
              payload: { code: "PG-DEFAULTS", store_type: "SMALL_GROCERY", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 1000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.0, min_stock_multiplier: 0.5 }
              as: VendorUnitSupervisor
              captures: { pg_def: $.data.id }
          assert:
            - "HTTP 201 and data.min_submissions_for_ceiling == 3"
            - "GET /peer-groups/${pg_def} also reports min_submissions_for_ceiling == 3 — the default is persisted, not applied per read"
            - "competitive_allowance_pct == 0.0 is stored as supplied: 0.0 is a legal boundary value of [0, 0.25], not a missing field to be defaulted"

      - name: create_vendor_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Vendor.fields.authorization_status
          - entities.Vendor.fields.risk_score
          - entities.Vendor.fields.peer_group_id
          - endpoints[POST /vendors]
        distinguishing_aspect: |
          POST /vendors accepts exactly three inputs; system fields (id, created_at,
          version, authorization_status) and computed fields (peer_group_id,
          risk_score) supplied in the body are ignored rather than honoured, so a
          client cannot self-authorize a vendor at creation time.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ACTIVE peer group exists but no vendor is assigned to it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
          trigger:
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000, id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00Z", version: 99, authorization_status: "AUTHORIZED", peer_group_id: "${pg_a}", risk_score: 100.0, risk_tier: "HIGH", sanction_points: 7 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
          assert:
            - "HTTP 201 and data.id != 11111111-1111-1111-1111-111111111111 — the server mints the id"
            - "created_at == 2026-08-01T00:00:00.000Z and version == 1, not 2001-01-01 and 99"
            - "authorization_status == APPLICANT (the initial_state), peer_group_id == null, risk_score == 0.0, risk_tier == LOW, sanction_points == 0"
            - "GET /peer-groups/${pg_a} still reports member_count == 0 and version == 1: the ignored peer_group_id created no membership"

      - name: create_price_submission_with_unknown_food_item_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 6]
          - errors.ERR_FOOD_ITEM_NOT_FOUND
          - endpoints[POST /price-submissions]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          On a flat topology every body foreign key is validated, and priority 6
          resolves them in the endpoint's declared input order, so a request whose
          food_item_id and price_cycle_id are both bogus reports the food item first
          — ERR_FOOD_ITEM_NOT_FOUND, never ERR_PRICE_CYCLE_NOT_FOUND.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one vendor v1 (APPLICANT) and one OPEN price cycle 2026Q3 over [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "00000000-0000-0000-0000-000000000000", price_cycle_id: "00000000-0000-0000-0000-000000000000", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /price-submissions"
              payload: { vendor_id: "00000000-0000-0000-0000-000000000000", food_item_id: "00000000-0000-0000-0000-000000000000", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "00000000-0000-0000-0000-000000000000"
          assert:
            - "First call: HTTP 404 with error.id == ERR_FOOD_ITEM_NOT_FOUND — food_item_id precedes price_cycle_id in the endpoint's input list, so the food item decides the code even though both ids are unresolvable"
            - "Second call: HTTP 404 with error.id == ERR_VENDOR_NOT_FOUND — vendor_id is first in the input list; the scope rule at priority 3 is satisfied because X-User-ID equals the (unresolvable) body vendor_id, so existence at priority 6 is what fires"
            - "No PriceSubmission row is created by either call"

      - name: create_peer_group_with_unknown_store_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PeerGroup.fields.store_type
          - entities.PeerGroup.fields.competitive_allowance_pct
          - validations[priority 7]
        distinguishing_aspect: |
          Enum membership and numeric range are both enforced at priority 7 with the
          same code: an out-of-vocabulary store_type and a competitive_allowance_pct
          just above the 0.25 ceiling each yield 422 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /peer-groups"
              payload: { code: "PG-BAD-TYPE", store_type: "CONVENIENCE", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 1000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.0 }
              as: VendorUnitSupervisor
            - call: "POST /peer-groups"
              payload: { code: "PG-BAD-PCT", store_type: "SUPERMARKET", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 1000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.26, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.0 }
              as: VendorUnitSupervisor
            - call: "POST /peer-groups"
              payload: { code: "PG-EDGE-PCT", store_type: "SUPERMARKET", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 1000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.25, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.0 }
              as: VendorUnitSupervisor
          assert:
            - "First call: HTTP 422 with error.id == ERR_INVALID_REQUEST — CONVENIENCE is not in {SUPERMARKET, SUPERSTORE, MEDIUM_GROCERY, SMALL_GROCERY, PHARMACY}"
            - "Second call: HTTP 422 with error.id == ERR_INVALID_REQUEST — 0.26 exceeds the [0, 0.25] range"
            - "Third call: HTTP 201 with competitive_allowance_pct == 0.25 — the range is inclusive at its upper bound, so 0.25 must be accepted"
            - "Exactly one PeerGroup row exists after the three calls"

  # ===========================================================================
  # From Table 2 (State Machines) — §1.2, state_machine_shape: cyclic
  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_vendor_starts_in_applicant_state
        claim_type: initial_state
        grounds:
          - state_machines.Vendor.initial_state
          - endpoints[POST /vendors]
        distinguishing_aspect: |
          A vendor created through POST /vendors is in APPLICANT, and APPLICANT admits
          exactly one trigger: authorize and complete-reauthorization are refused with
          ERR_INVALID_VENDOR_STATE before any other precondition is consulted.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ACTIVE peer group PG-SUPER-A covering SUPERMARKET 5000000..20000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
          trigger:
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/authorize"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /vendors/${v1}/complete-reauthorization"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /vendors/${v1}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
          assert:
            - "First call: HTTP 201 with authorization_status == APPLICANT"
            - "Second call (authorize from APPLICANT): HTTP 409 with error.id == ERR_INVALID_VENDOR_STATE — the state check at priority 16 fires ahead of the training check at priority 21, so the absence of training is NOT the reported reason"
            - "Third call (complete-reauthorization from APPLICANT): HTTP 409 with error.id == ERR_INVALID_VENDOR_STATE"
            - "Fourth call: HTTP 200 with authorization_status == IN_REVIEW and peer_group_id == ${pg_a} — submit-application is the only trigger APPLICANT admits"

      - name: serve_notice_moves_sanction_case_to_notice_served_with_response_due
        claim_type: valid_transition
        grounds:
          - state_machines.SanctionCase.OPENED_to_NOTICE_SERVED
          - calculations.civil_money_penalty
          - entities.SanctionCase.fields.response_due_at
          - endpoints[POST /sanction-cases/{id}/serve-notice]
        distinguishing_aspect: |
          serve-notice on a CLASS_C case stamps response_due_at exactly
          CMP_ELECTION_DAYS (15) after notice_served_at — 2026-08-16T00:00:00Z — and
          because base_tier is 2 rather than 4 the vendor stays AUTHORIZED, so the
          suspension side effect of this same transition is conditional, not automatic.
        test_recipe:
          setup:
            - "CHAIN A: vendor v1 AUTHORIZED in PG-SUPER-A with an ACTIVE milk ceiling of 336; avg_monthly_redemption_cents == 6000000 (no claims exist, so the reported figure is the CMP base)"
            - "One CLASS_C sanction case opened against v1 by investigator inv-001"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
