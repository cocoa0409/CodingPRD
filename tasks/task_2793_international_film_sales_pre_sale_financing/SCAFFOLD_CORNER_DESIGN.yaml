              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v1: $.data.version }
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_de_id}", minimum_guarantee_usd: 2000000.00, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v1}" }
              as: SalesAgent
              captures: { contract_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_SIGNATURE", pct_of_mg: 0.45, due_date: "2026-09-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_sig_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_DELIVERY", pct_of_mg: 0.20, due_date: "2027-06-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_del_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_RELEASE", pct_of_mg: 0.10, due_date: "2027-07-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_rel_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_TERM_END", pct_of_mg: 0.25, due_date: "2028-08-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_end_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/accept"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_de_id}"
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/execute"
              payload: {}
              as: HeadOfSales
              as_user_id: "hos-closer-9"
            - call: "POST /film-sales/films/${film_id}/collection-accounts"
              payload: { bank_name: "Fiduciary Trust", account_reference: "CAM-2793" }
              as: CollectionAgent
              captures: { acct_id: $.data.id }
            - call: "POST /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: { tier_order: 1, tier_type: "BANK_DEBT", recipient_name: "Cine Lend Bank", pct_of_available: 1.00 }
              as: CollectionAgent
              captures: { tier_bank_id: $.data.id }
          trigger:
            - call: "GET /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: {}
              as: CollectionAgent
              captures: { tier_status_no_facility: "$.data[0].status" }
            - call: "POST /film-sales/films/${film_id}/banking-facilities"
              payload: { lender_name: "Cine Lend Bank", discount_rate_pct: 0.08, advance_rate_pct: 0.80, facility_cap_usd: 1000000.00 }
              as: Lender
              captures: { fac_id: $.data.id }
            - call: "GET /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: {}
              as: CollectionAgent
              captures: { tier_status_proposed: "$.data[0].status" }
            - call: "POST /film-sales/banking-facilities/${fac_id}/state"
              payload: { to_status: "APPROVED" }
              as: Lender
              as_user_id: "lender-approver-1"
            - call: "GET /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: {}
              as: CollectionAgent
              captures: { tier_status_approved: "$.data[0].status" }
          assert:
            - "${tier_status_no_facility} == SUSPENDED"
            - "${tier_status_proposed} == SUSPENDED — a PROPOSED facility does not activate the tier"
            - "${tier_status_approved} == ACTIVE"
            - "BankingFacility.${fac_id}.status == APPROVED with approved_by_user_id == lender-approver-1"
            - "BankingFacility.${fac_id}.completion_bond_required == true and completion_bond_posted == false"
            - "BankingFacility.${fac_id}.eligible_collateral_usd == 1343649.60"
            - "BankingFacility.${fac_id}.advance_amount_usd == 500000.00"
            - "WaterfallTier.${tier_bank_id}.recouped_usd == 0.00 and cap_usd is null while the facility is only APPROVED"

      - name: film_sales_status_can_loop_back_after_reversion
        claim_type: cyclic
        excluded_because:
          difficulty_instance: film_sales_status_cycles_in_market_to_sold_out_and_back_on_reversion
          rationale: |
            The Film machine's only cycle (IN_MARKET -> SOLD_OUT -> IN_MARKET, driven by
            published_territory_count and contract reversion) is walked end to end by that §1.8
            instance, including the loop-termination condition. A separate §1.9 walk would replay the
            identical edges with no new claim.

      - name: rejected_final_package_cascades_through_contract_milestones_and_facility
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: final_qc_rejection_cascades_four_levels_from_package_to_margin_call
          rationale: |
            The REJECTED_FINAL branch is the scaffold's deepest cascade (package -> contract ->
            milestones -> facility -> film) and that §1.8 instance already asserts every level plus the
            MARGIN_CALL arithmetic. Re-deriving one level of it here would be strictly weaker.

      - name: reverse_receipt_undoes_every_forward_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: reverse_receipt_restores_cash_and_tiered_commission_with_zero_drift
          rationale: |
            PaymentMilestone RECEIVED -> reverse-receipt is the scaffold's compensating action and that
            §1.8 instance asserts the full zero-drift invariant across the milestone, contract, account
            and agreement, which is a superset of any single-field §1.9 undo check.

      - name: negotiation_axis_loops_offer_counter_and_revise_until_the_round_limit
        claim_type: cyclic
        excluded_because:
          difficulty_instance: contract_negotiation_cycles_offer_counter_offer_until_round_limit_while_other_axes_hold
          rationale: |
            The OFFERED -> COUNTERED -> OFFERED loop, its negotiation_round bookkeeping and the
            terminating round-limit error are fully exercised by that §1.8 instance, which also pins
            the other two axes across the loop.

  # ===========================================================================
  - section: calculations
    instances:

      - name: cast_adjusted_estimate_from_a_three_comp_odd_sample
        claim_type: correct_result
        grounds:
          - calculations.territory_value_estimate
          - "endpoints[POST /film-sales/territory-valuations]"
        distinguishing_aspect: |
          Full arithmetic chain on an ODD sample: comps 800000.00 / 1000000.00 / 1200000.00 sort to a
          median of exactly 1000000.00 (the middle element, never an average), cast_score 88 lands in
          the >= 85 tier at 1.40, base_value_index 1.20 gives estimate_usd 1680000.00, and the two
          derived prices are ask 2100000.00 (x1.25) and floor 1176000.00 (x0.70).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTION film with principal_cast_score 88; territory DE with base_value_index 1.20 and three verified in-window ACTION comps."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_id: $.data.id }
          assert:
            - "HTTP 201 and TerritoryValuation.${val_id}.comp_sample_size == 3"
            - "TerritoryValuation.${val_id}.comp_median_usd == 1000000.00"
            - "TerritoryValuation.${val_id}.cast_multiplier == 1.40"
            - "TerritoryValuation.${val_id}.estimate_usd == 1680000.00"
            - "TerritoryValuation.${val_id}.ask_price_usd == 2100000.00"
            - "TerritoryValuation.${val_id}.floor_price_usd == 1176000.00"
            - "TerritoryValuation.${val_id}.status == DRAFT with published_by_user_id null"

      - name: even_sample_median_rounds_half_up_and_propagates_to_ask_and_floor
        claim_type: precision
        grounds:
          - calculations.territory_value_estimate
          - entities.TerritoryValuation.fields.comp_median_usd
        distinguishing_aspect: |
          A FOUR-comp sample averages the middle pair 900000.01 and 1000000.00 to 950000.005, which
          round_half_up at 2dp gives 950000.01 — one cent above the truncating answer. That cent then
          survives three further roundings: estimate 1140000.01 (x1.20 = 1140000.012, rounds DOWN),
          ask 1425000.01 (x1.25 = 1425000.0125, rounds DOWN) and floor 798000.01 (x0.70 = 798000.007,
          rounds UP), so no single rounding direction reproduces all three figures.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; DE has four verified in-window ACTION comps: 800000.00, 900000.01, 1000000.00, 1200000.00."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Delta", genre: "ACTION", cast_score: 60, gross_license_fee_usd: 900000.01, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "COMPARABLE_WEIGHTED" }
              as: SalesAgent
              captures: { val_id: $.data.id }
          assert:
            - "TerritoryValuation.${val_id}.comp_sample_size == 4"
            - "TerritoryValuation.${val_id}.comp_median_usd == 950000.01, not 950000.00"
            - "TerritoryValuation.${val_id}.estimate_usd == 1140000.01"
            - "TerritoryValuation.${val_id}.ask_price_usd == 1425000.01"
            - "TerritoryValuation.${val_id}.floor_price_usd == 798000.01"

      - name: comparable_eligibility_excludes_unverified_off_genre_stale_and_foreign_comps
        claim_type: input_set_filtering
        grounds:
          - calculations.territory_value_estimate
          - errors.ERR_NO_COMPARABLE_TITLES
        distinguishing_aspect: |
          Four separate exclusion reasons are exercised against ONE valuation, each represented by a
          5000000.00 comp that would dominate the median if it leaked in: verified=false, a DRAMA row,
