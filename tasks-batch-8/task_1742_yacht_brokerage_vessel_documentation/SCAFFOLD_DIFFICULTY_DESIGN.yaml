  # =====================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_balance_conserved_across_clear_and_refund
        grounds:
          - state_machines.EscrowLedgerEntry.PENDING_to_CLEARED
          - state_machines.EscrowLedgerEntry.CLEARED_to_REFUNDED
          - entities.EscrowLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = escrow trust balance per offer: sum(DEPOSIT
          amounts in CLEARED) - sum(outflows REFUNDED/FORFEITED/DISBURSED) is
          invariant under the clear->refund compensating pair; clearing then
          refunding the same entry returns the running balance to its
          pre-clear value.
        test_recipe:
          setup:
            - "Offer ACCEPTED then FAILED (contingency objection collapsed)"
            - "DEPOSIT 15000000 cleared -> balance +15000000; refund -> balance back to 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Inv House", home_state_code: "FL", escrow_account_ref: "T-I", license_no: "FL-BRK-I", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkI: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkI}", full_name: "LAI", license_no: "FL-AG-I1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laI: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkI}", full_name: "SAI", license_no: "FL-AG-I2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saI: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SI", residency_state_code: "FL", tax_id_last4: "1401" }
              as: PlatformAdmin
              captures: { selI: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BI", residency_state_code: "FL", tax_id_last4: "1402" }
              as: PlatformAdmin
              captures: { buyI: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USINVA123456", make: "MJM", model: "40z", year_built: 2016, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "9990002", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesI: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkI}", listing_agent_id: "${laI}", seller_id: "${selI}", vessel_id: "${vesI}", agreement_type: "CENTRAL", list_price_cents: 160000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laI}"
              captures: { lstI: $.data.id }
            - call: "POST /yacht/listings/${lstI}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laI}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstI}", buyer_id: "${buyI}", selling_agent_id: "${saI}", offer_price_cents: 150000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saI}"
              captures: { offI: $.data.id, offI_v: $.data.version }
            - call: "POST /yacht/offers/${offI}/accept"
              payload: { expected_offer_version: "${offI_v}" }
              as: ListingAgent
              as_user_id: "${laI}"
            - call: "POST /yacht/offers/${offI}/escrow-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 15000000, value_date: "2026-08-02T00:00:00Z" }
              as: EscrowOfficer
              captures: { entI: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/escrow-entries/${entI}/clear"
              payload: {}
              as: EscrowOfficer
            - call: "GET /yacht/offers/${offI}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saI}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${i0}/object"
              payload: { objection_note: "Sea trial engine overheat" }
              as: SellingAgent
              as_user_id: "${saI}"
            - call: "POST /yacht/contingencies/${i1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saI}"
