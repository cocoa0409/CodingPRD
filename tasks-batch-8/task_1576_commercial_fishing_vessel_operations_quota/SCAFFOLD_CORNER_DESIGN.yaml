            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d2" }, as: FisheriesRegulator, captures: { n2: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d3" }, as: FisheriesRegulator, captures: { n3: $.data.id } }
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator }
            - { call: "POST /violations/${n2}/adjudicate", as: FisheriesRegulator }
            - { call: "POST /violations/${n3}/adjudicate", as: FisheriesRegulator }
          trigger:
            - { call: "POST /vessels/${v1}/reinstate", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COMPLIANCE_TOO_LOW (http 409); vessel stays SUSPENDED at 5 points"

      - name: decommission_with_open_trip_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Vessel
          - errors[ERR_VESSEL_HAS_OPEN_TRIPS]
        distinguishing_aspect: "A vessel with a PLANNED trip cannot be decommissioned."
        test_recipe:
          setup: ["ACTIVE vessel with one PLANNED trip"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z8", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
