        trigger: "POST /api/outage-windows/{id}/transition {to: APPROVED}"
        actor: ProgramManager
        preconditions:
          - "duration end_at - start_at <= 8h (ERR_OUTAGE_DURATION_EXCEEDED)"
          - "crew capacity: at every instant, count of APPROVED|NOTIFIED|EXECUTED windows on the same feeder overlapping [start_at, end_at) stays <= 2, half-open semantics (ERR_CREW_CAPACITY_EXCEEDED)"
          - "every id in conversion_ids exists and belongs to this project (ERR_VALIDATION)"
        side_effects: []
      - from: APPROVED
        to: NOTIFIED
        trigger: "POST /api/outage-windows/{id}/transition {to: NOTIFIED}"
        actor: UtilityCoordinator
        preconditions:
          - "start_at - clock >= 72h exactly (ERR_NOTIFICATION_LEAD_TIME)"
        side_effects: ["notified_at = clock"]
      - from: NOTIFIED
        to: EXECUTED
        trigger: "POST /api/outage-windows/{id}/transition {to: EXECUTED}"
        actor: UtilityCoordinator
        preconditions:
          - "start_at <= clock (ERR_INVALID_STATE)"
          - "clock <= end_at (ERR_OUTAGE_WINDOW_MISSED)"
          - "every conversion in conversion_ids has work_status in ENERGIZED|INSPECTED|COMPLETE or temp_service_status == TEMP_ACTIVE (ERR_TEMP_SERVICE_REQUIRED)"
        side_effects: []
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /api/outage-windows/{id}/transition {to: CLOSED}"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
      - from: NOTIFIED
        to: PROPOSED
        trigger: "POST /api/outage-windows/{id}/transition {to: PROPOSED, new_start_at, new_end_at} (reschedule cycle)"
        actor: ProgramManager
        preconditions: ["new_start_at < new_end_at (ERR_VALIDATION)"]
        side_effects: ["start_at/end_at replaced", "notified_at reset to null"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/outage-windows/{id}/transition {to: CANCELLED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/outage-windows/{id}/transition {to: CANCELLED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: NOTIFIED
        to: CANCELLED
        trigger: "POST /api/outage-windows/{id}/transition {to: CANCELLED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [INCORPORATED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: PRICED
        trigger: "POST /api/change-orders/{id}/transition {to: PRICED, delta_cost_cents, delta_delay_days, delay_cause}"
        actor: ProgramManager
        preconditions: ["delta_delay_days >= 0 (ERR_VALIDATION)"]
        side_effects: []
      - from: PRICED
        to: PROPOSED
        trigger: "POST /api/change-orders/{id}/transition {to: PROPOSED} (revision cycle)"
        actor: ProgramManager
        preconditions: []
        side_effects: ["revision_count += 1", "delta fields cleared to null"]
      - from: PRICED
