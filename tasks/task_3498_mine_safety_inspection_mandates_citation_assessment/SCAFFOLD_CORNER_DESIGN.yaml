              payload: { current_utc: "2026-02-11T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/abate"
              payload: { abatement_note: "corrected" }
              as: OperatorRep
              as_user_id: "${op_id}"
            - call: "POST /msha/imminent-danger-orders"
