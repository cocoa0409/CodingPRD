        distinguishing_aspect: "On POST /memberships/{id}/charge a single request both sends a wrong amount_cents (p15 business_fiscal ERR_AMOUNT_MISMATCH) AND targets a membership whose member has no assigned PCP (p16 business_referential ERR_PCP_REQUIRED); p15 wins. Different category pair (business_fiscal vs business_referential) than instance one (business_temporal vs business_constraint)."
