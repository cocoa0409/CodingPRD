# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Voter Registration & Election Management — task_0098
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# Reusable opaque user ids: off-1/off-2 (ElectionOfficial), pw-1 (PollWorker),
# canvasser-tally-1 / canvasser-recount-2 (Canvasser), admin (ElectionAdmin).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_election_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Election, endpoints]
        distinguishing_aspect: "POST /elections with all required fields -> 201; response carries server-minted id, created_at, version=1, status=SCHEDULED, total_registered=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
          trigger:
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id, v: $.data.version }
          assert:
            - "Election.${e_id}.status == SCHEDULED"
            - "Election.${e_id}.version == 1"
            - "Election.${e_id}.total_registered == 0"

      - name: get_election_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Election, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /elections/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
          trigger:
            - call: "GET /elections/00000000-0000-4000-8000-000000000000"
              as: ElectionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: create_precinct_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Precinct, "errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /precincts omitting max_registrations -> ERR_INVALID_REQUEST (400); no precinct created."
        test_recipe:
          setup: ["An election exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999 }
              as: ElectionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: create_precinct_max_registrations_below_one_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Precinct.fields.max_registrations, "errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /precincts with max_registrations=0 violates the >=1 constraint -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An election exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 0 }
              as: ElectionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: registration_party_default_unaffiliated_applied
        claim_type: Defaults
        grounds: [entities.VoterRegistration.fields.party]
        distinguishing_aspect: "POST /registrations omitting party -> party defaults to UNAFFILIATED on the created row."
        test_recipe:
          setup: ["Election REGISTRATION_OPEN with a precinct."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
          assert:
            - "VoterRegistration.${r1_id}.party == UNAFFILIATED"
            - "VoterRegistration.${r1_id}.status == PENDING"

      - name: registration_invalid_party_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.VoterRegistration.fields.party, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /registrations with party='WHIG' (not in enum) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Election REGISTRATION_OPEN with a precinct."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
          trigger:
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10, party: "WHIG" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: list_precincts_pagination_envelope
        claim_type: Listing
        grounds: [entities.Precinct, endpoints]
        distinguishing_aspect: "GET /precincts?election_id=&limit=1&offset=0 returns array data with total_count and has_more in meta per the response envelope."
        test_recipe:
          setup: ["An election with two precincts."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P2", county_fips: "06075", street_low: 1000, street_high: 1999, max_registrations: 50 }
              as: ElectionAdmin
          trigger:
            - call: "GET /precincts"
              payload: { election_id: "${e_id}", limit: 1, offset: 0 }
              as: ElectionAdmin
          assert:
            - "response.data is an array of length 1"
            - "response.meta total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_already_active_registration_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.VoterRegistration.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a registration already ACTIVE -> ERR_INVALID_STATE (409); no second precinct increment."
        test_recipe:
          setup: ["One ACTIVE registration (already approved)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Precinct.${p_id}.assigned_count == 1"

      - name: election_open_voting_before_early_voting_start_returns_voting_not_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.Election.REGISTRATION_OPEN_to_VOTING_OPEN, "errors[ERR_VOTING_NOT_OPEN]"]
        distinguishing_aspect: "open-voting while ClockState.current_utc < early_voting_start -> ERR_VOTING_NOT_OPEN (422); election stays REGISTRATION_OPEN."
        test_recipe:
          setup: ["Election REGISTRATION_OPEN; clock before early_voting_start."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
          trigger:
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "VOTING_OPEN" }
              as: ElectionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_VOTING_NOT_OPEN"
            - "Election.${e_id}.status == REGISTRATION_OPEN"

      - name: terminal_recount_dismissed_then_certify_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RecountCase.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DISMISSED RecountCase is terminal; certifying it -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DISMISSED RecountCase on a TALLIED precinct."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /precincts/${p_id}/tally"
              payload: { reported_vote_count: 100 }
              as: Canvasser
              as_user_id: "canvasser-tally-1"
            - call: "POST /recount-cases"
              payload: { election_id: "${e_id}", precinct_id: "${p_id}" }
              as: ElectionAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /recount-cases/${rc_id}/transition"
              payload: { target_status: "DISMISSED" }
              as: ElectionAdmin
          trigger:
            - call: "POST /recount-cases/${rc_id}/transition"
              payload: { target_status: "CERTIFIED" }
              as: ElectionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "RecountCase.${rc_id}.status == DISMISSED"

      - name: accept_ballot_while_flagged_returns_ballot_not_cured
        claim_type: Precondition Enforcement
        grounds: [state_machines.AbsenteeBallot.request_status=RETURNED_to_request_status=ACCEPTED, "errors[ERR_BALLOT_NOT_CURED]", "validations[priority=12]"]
        distinguishing_aspect: "Accepting a RETURNED ballot whose cure_status is FLAGGED -> ERR_BALLOT_NOT_CURED (409); request_status stays RETURNED."
        test_recipe:
          setup: ["A RETURNED ballot with cure_status FLAGGED (CureCase OPEN)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_v: $.data.version }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r1_id}", mailing_address: "1 A St", expected_registration_version: "${r1_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b1_id: $.data.id }
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/flag-cure"
              payload: { reason: "MISSING_SIGNATURE" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_BALLOT_NOT_CURED"
            - "AbsenteeBallot.${b1_id}.request_status == RETURNED"

      - name: cure_approve_cascades_cured_and_accept_succeeds
        claim_type: Side Effect Execution
        grounds: [state_machines.CureCase.RESPONSE_SUBMITTED_to_APPROVED, state_machines.AbsenteeBallot.cure_status=CURE_PENDING_to_cure_status=CURED]
        distinguishing_aspect: "CureCase APPROVE sets ballot.cure_status=CURED; the ballot can then be ACCEPTED (positive side-effect path complementing the §1.8 DENY cascade)."
        test_recipe:
          setup: ["A RETURNED ballot whose CureCase is RESPONSE_SUBMITTED; off-1 reviewed the registration, off-2 adjudicates."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_v: $.data.version }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r1_id}", mailing_address: "1 A St", expected_registration_version: "${r1_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b1_id: $.data.id }
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/flag-cure"
              payload: { reason: "SIGNATURE_MISMATCH" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "GET /cure-cases"
              payload: { ballot_id: "${b1_id}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /cure-cases/${cc_id}/transition"
              payload: { decision: "SUBMIT_RESPONSE", voter_response_text: "me" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /cure-cases/${cc_id}/transition"
              payload: { decision: "APPROVE" }
              as: ElectionOfficial
              as_user_id: "off-2"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "off-1"
          assert:
            - "AbsenteeBallot.${b1_id}.cure_status == CURED"
            - "AbsenteeBallot.${b1_id}.request_status == ACCEPTED"

      - name: report_failure_activates_backup_cross_entity
        claim_type: Side Effect Execution
        grounds: [state_machines.VotingMachine.OPERATIONAL_to_FAILED, calculations.backup_selector, entities.MachineFailure.fields.resolution]
        distinguishing_aspect: "POST /machine-failures with an idle BACKUP present sets resolution=BACKUP_ACTIVATED and the backup's backup_for_machine_id to the failed machine (selector hit path complementing the §1.8 empty-pool miss)."
        test_recipe:
          setup: ["A precinct with one PRIMARY (cap 30) and two idle BACKUPs (cap 25 and cap 40)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-11-03T12:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /voting-machines"
              payload: { precinct_id: "${p_id}", serial: "M-1", role: "PRIMARY", capacity: 30 }
              as: ElectionAdmin
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /voting-machines"
              payload: { precinct_id: "${p_id}", serial: "M-2", role: "BACKUP", capacity: 25 }
              as: ElectionAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /voting-machines"
              payload: { precinct_id: "${p_id}", serial: "M-3", role: "BACKUP", capacity: 40 }
              as: ElectionAdmin
              captures: { m3_id: $.data.id }
          trigger:
            - call: "POST /machine-failures"
              payload: { machine_id: "${m1_id}", expected_machine_version: "${m1_v}" }
              as: PollWorker
              as_user_id: "pw-1"
              captures: { backup: $.data.backup_machine_id, resolution: $.data.resolution }
          assert:
            - "MachineFailure.resolution == BACKUP_ACTIVATED"
            - "MachineFailure.backup_machine_id == ${m3_id}"
            - "VotingMachine.${m3_id}.backup_for_machine_id == ${m1_id}"
            - "VotingMachine.${m1_id}.status == FAILED"

      - name: close_polls_sweeps_open_cure_to_failed_and_rejected
        claim_type: Side Effect Execution
        grounds: [state_machines.Election.VOTING_OPEN_to_POLLS_CLOSED, state_machines.CureCase.transitions, "errors[ERR_CURE_DEADLINE_PASSED]"]
        distinguishing_aspect: "close-polls past cure_deadline expires an OPEN CureCase (status=EXPIRED), cascading the ballot to cure_status=CURE_FAILED and request_status=REJECTED."
        test_recipe:
          setup: ["A VOTING_OPEN election with a RETURNED ballot flagged (CureCase OPEN); clock advanced past cure_deadline and past election_date."]
          setup_api_calls:
            - call: "POST /_clock/set"
