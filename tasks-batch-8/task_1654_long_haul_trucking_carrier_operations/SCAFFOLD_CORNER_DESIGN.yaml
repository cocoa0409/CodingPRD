            - { call: "GET /loads/${load}/trips", payload: {}, as: Dispatcher, captures: { tr0: "$.data[0].id" } }
            - { call: "GET /trips/${trip}/check-calls", payload: {}, as: Dispatcher, captures: { cc0: "$.data[0].id" } }
          assert:
