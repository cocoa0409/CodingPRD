          - entities.Account.fields.outstanding_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on outstanding_cents reached via the loss endpoint: outstanding
          exactly 50000 stays CURRENT (> not >=), while 50001 flips PAST_DUE. Tested at the exact
          PAST_DUE_THRESHOLD_CENTS edge.
        test_recipe:
          setup:
            - "Account with a single LOSS charge of exactly 50000 (replacement 50000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme K", service_day: "MON", shortage_grace_units: 0 }
              as: ProgramAdmin
