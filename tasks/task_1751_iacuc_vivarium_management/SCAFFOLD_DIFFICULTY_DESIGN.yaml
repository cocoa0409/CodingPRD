              as: FacilityManager
              captures: { br_cage: $.data.id }
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "WEAN-1", room_code: "VIV-402", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { wean_cage: $.data.id }
