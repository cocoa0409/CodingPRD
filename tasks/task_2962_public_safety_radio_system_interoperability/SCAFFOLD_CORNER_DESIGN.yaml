        distinguishing_aspect: "provision_status RETIRED is terminal and guarded by its own error: a following ZEROIZE returns HTTP 409 ERR_UNIT_RETIRED rather than ERR_ALREADY_TERMINAL or ERR_INVALID_STATE_TRANSITION."
        test_recipe:
