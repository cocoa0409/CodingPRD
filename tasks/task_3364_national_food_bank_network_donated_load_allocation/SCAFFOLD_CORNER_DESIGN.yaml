# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3364_national_food_bank_network_donated_load_allocation
#
# Breadth probe over the §1.1–§1.7 surface: every testable claim not already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners already covered there
# appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: member_create_returns_initial_posture_and_system_fields
        claim_type: creation
        grounds:
          - entities.MemberFoodBank
          - endpoints.POST_/network/members
          - state_machines.MemberFoodBank.initial_state
        distinguishing_aspect: "A member created with six input fields comes back 201 in PENDING_CERTIFICATION with share_balance 0, share_reserved 0, audit_score 0, active_bid_count 0, version 1 and server-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clk
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /network/members"
              payload: { name: "Harvest Hope Food Bank", state_code: "SC", food_insecure_population: 180000, storage_capacity_lbs: 90000, refrigerated_capacity_lbs: 20000, transport_ability: "REGIONAL" }
              as: NetworkAdmin
              captures: { m_new: $.data.id, m_status: $.data.certification_status, m_bal: $.data.share_balance }
          assert:
            - "the response is HTTP 201 with response_type object"
            - "MemberFoodBank.${m_new}.certification_status == ${m_status} == PENDING_CERTIFICATION"
            - "MemberFoodBank.${m_new}.share_balance == ${m_bal} == 0 and share_reserved == 0 and audit_score == 0 and active_bid_count == 0"
            - "MemberFoodBank.${m_new}.version == 1 and id / created_at / updated_at are server-stamped and non-null"

      - name: load_get_unknown_id_returns_load_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOAD_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "A GET against a well-formed but unknown load id returns ERR_LOAD_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No loads exist."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /network/loads/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id, code: $.data.message }
          assert:
            - "the response error_id ${err} == ERR_LOAD_NOT_FOUND"
            - "the HTTP status is 404 and response_type is error"

      - name: bid_missing_required_shares_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/network/loads/{id}/bids
        distinguishing_aspect: "Omitting the required shares_offered field is rejected at payload validation (priority 2) before any existence, state or fiscal check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is BIDDING and member M1 is CERTIFIED with a 100000-share grant."
          setup_api_calls:
            - *c_clk
            - &c_agr
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Midwest Mills Co", donor_type: "MANUFACTURER", product_category: "DRY_GOODS", committed_lbs: 500000, freight_subsidy_pool_cents: 500000 }
              as: NetworkAdmin
              captures: { agr: $.data.id }
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - &c_load1
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-C1", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 620 }
              as: NetworkAdmin
              captures: { l1: $.data.id }
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - &c_m1
              call: "POST /network/members"
              payload: { name: "Greater Cleveland Food Bank", state_code: "OH", food_insecure_population: 250000, storage_capacity_lbs: 200000, refrigerated_capacity_lbs: 50000, transport_ability: "LOCAL" }
              as: NetworkAdmin
              captures: { m1: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - &c_grant1
              call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
          trigger:
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id ${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "no LoadBid row exists for load ${l1} and MemberFoodBank.${m1}.share_balance is still 100000"

      - name: audit_score_above_100_returns_400
        claim_type: type_constraints
        grounds:
          - errors[ERR_AUDIT_SCORE_OUT_OF_RANGE]
          - validations[priority=27]
          - entities.MemberAudit.fields.storage_score
        distinguishing_aspect: "storage_score 101 violates the declared [0, 100] range and is rejected with ERR_AUDIT_SCORE_OUT_OF_RANGE (400) while 100 is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 exists in PENDING_CERTIFICATION."
          setup_api_calls:
            - *c_clk
            - *c_m1
          trigger:
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "STORAGE", storage_score: 101, distribution_score: 90, reporting_score: 90 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { err: $.data.error_id }
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "STORAGE", storage_score: 100, distribution_score: 90, reporting_score: 90 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud_ok: $.data.id, aud_score: $.data.weighted_score }
          assert:
            - "the first call returns ${err} == ERR_AUDIT_SCORE_OUT_OF_RANGE with HTTP 400"
            - "the boundary value 100 is accepted: MemberAudit.${aud_ok}.weighted_score == ${aud_score} == 96.0 and audit_status == IN_PROGRESS"

      - name: member_balance_reserved_and_active_bid_count_recomputed
        claim_type: computed_fields
        grounds:
          - calculations.share_balance_recompute
          - entities.MemberFoodBank.fields.share_reserved
          - endpoints.GET_/network/members/{id}
        distinguishing_aspect: "After one grant and one bid the three derived member fields reconcile exactly: share_balance 99600, share_reserved 400, active_bid_count 1, and the ledger's last balance_after equals share_balance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED with a 100000-share grant and holds one SUBMITTED bid of 400 shares."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
              captures: { led_bal: $.data.balance_after }
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
          trigger:
            - call: "GET /network/members/${m1}"
              payload: {}
              as: NetworkAdmin
              captures: { bal: $.data.share_balance, res: $.data.share_reserved, cnt: $.data.active_bid_count }
            - call: "GET /network/members/${m1}/share-ledger"
              payload: {}
              as: NetworkAdmin
              captures: { last_bal: "$.data[1].balance_after", last_type: "$.data[1].entry_type" }
          assert:
            - "MemberFoodBank.${m1}.share_balance == ${bal} == 99600 and share_reserved == ${res} == 400 and active_bid_count == ${cnt} == 1"
            - "the ledger's newest entry has ${last_type} == BID_HOLD with ${last_bal} == 99600, matching MemberFoodBank.${m1}.share_balance"
            - "the GRANT entry's balance_after was ${led_bal} == 100000"

      - name: ledger_entry_exposes_no_version_or_update_path
        claim_type: immutability
        grounds:
          - entities.ShareLedgerEntry.common_fields
          - endpoints.POST_/network/share-ledger/grants
        distinguishing_aspect: "ShareLedgerEntry is declared with common_fields false, so its payload carries id and created_at only — no version and no updated_at — and the append-only ledger offers no update or delete endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED with one GRANT ledger entry."
          setup_api_calls:
            - *c_clk
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
              captures: { led: $.data.id, led_type: $.data.entry_type, led_amt: $.data.amount }
          trigger:
            - call: "GET /network/members/${m1}/share-ledger"
              payload: {}
              as: NetworkAdmin
              captures: { first_id: "$.data[0].id", first_created: "$.data[0].created_at" }
          assert:
            - "the grant entry has ${led_type} == GRANT with ${led_amt} == 100000 and the newest entry id ${first_id} is server-minted"
            - "each ShareLedgerEntry object carries id, created_at, member_id, entry_type, amount, balance_after, epoch and reference_id — and no version or updated_at field"
            - "the ledger is append-only: no PUT, PATCH or DELETE endpoint exists under /network/members/{id}/share-ledger"

      - name: bid_list_honors_pagination_and_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_/network/bids
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered bid list reports total_count across the whole match set while honoring limit, and has_more is true when a further page exists."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is BIDDING; certified members M1 and M2 each hold one SUBMITTED bid on it."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
            - &c_m2
              call: "POST /network/members"
              payload: { name: "Food Bank of Iowa", state_code: "IA", food_insecure_population: 100000, storage_capacity_lbs: 150000, refrigerated_capacity_lbs: 30000, transport_ability: "REGIONAL" }
              as: NetworkAdmin
              captures: { m2: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m2}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_2"
              captures: { aud2: $.data.id }
            - call: "POST /network/audits/${aud2}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m2}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m2_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m2}", epoch: "2026-09", expected_member_version: "${m2_v}" }
              as: NetworkAdmin
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "GET /network/loads/${l1}"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v2: $.data.version }
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m2}", shares_offered: 300, preference_rank: 2, can_self_transport: false, expected_load_version: "${l1_v2}" }
              as: MemberFoodBank
              as_user_id: "${m2}"
          trigger:
            - call: "GET /network/bids"
              payload: { load_id: "${l1}", limit: 1, offset: 0 }
              as: NetworkAdmin
              captures: { first_bid: "$.data[0].id" }
          assert:
            - "the response reports total_count 2 (the whole filtered match set) with has_more true and limit 1"
            - "exactly one LoadBid object is present in data; its id is ${first_bid} and both stored bids belong to load ${l1}"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: donated_load_created_posted_clear
        claim_type: initial_state
        grounds:
          - state_machines.DonatedLoad.initial_state
          - entities.DonatedLoad.fields.safety_status
          - endpoints.POST_/network/loads
        distinguishing_aspect: "A newly created load starts in POSTED with safety_status CLEAR, freight_decision PENDING, delivered_lbs 0 and meal_equivalent 0 regardless of the payload."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR is ACTIVE."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 12000, lot_code: "LOT-NEW", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 180 }
              as: NetworkAdmin
              captures: { lnew: $.data.id, st: $.data.status, saf: $.data.safety_status, fd: $.data.freight_decision }
          assert:
            - "DonatedLoad.${lnew}.status == ${st} == POSTED and safety_status == ${saf} == CLEAR"
            - "DonatedLoad.${lnew}.freight_decision == ${fd} == PENDING with freight_subsidy_cents == 0"
            - "DonatedLoad.${lnew}.delivered_lbs == 0 and meal_equivalent == 0 and version == 1"

      - name: post_on_awarded_load_returns_load_not_posted
        claim_type: invalid_transition
        grounds:
          - state_machines.DonatedLoad.AWARDED_to_IN_TRANSIT
          - validations[priority=14]
          - errors[ERR_LOAD_NOT_POSTED]
        distinguishing_aspect: "POST /network/loads/{id}/post from the AWARDED state is not a declared transition, so it is rejected with ERR_LOAD_NOT_POSTED (409) and no side effect fires."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is AWARDED to certified member M1 with one AWARDED bid."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "POST /network/loads/${l1}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l1_a: $.data.version }
          trigger:
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id ${err} == ERR_LOAD_NOT_POSTED with HTTP 409"
            - "DonatedLoad.${l1}.status is still AWARDED and DonatedLoad.${l1}.awarded_bid_id is unchanged"

      - name: cancelled_load_rejects_post_and_bid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DonatedLoad.terminal_states
          - state_machines.DonatedLoad.POSTED_to_CANCELLED
          - errors[ERR_LOAD_NOT_POSTED]
        distinguishing_aspect: "CANCELLED is terminal: both post and bid are rejected afterwards and the two SUBMITTED bids that existed at cancel time are REJECTED with LOAD_CANCELLED and their holds released."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is POSTED with two SUBMITTED bids (M1 400 shares, M2 300 shares)."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
            - *c_m2
            - call: "POST /network/audits"
              payload: { member_id: "${m2}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_2"
              captures: { aud2: $.data.id }
            - call: "POST /network/audits/${aud2}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m2}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m2_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m2}", epoch: "2026-09", expected_member_version: "${m2_v}" }
              as: NetworkAdmin
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid1: $.data.id }
            - call: "GET /network/loads/${l1}"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v2: $.data.version }
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m2}", shares_offered: 300, preference_rank: 2, can_self_transport: false, expected_load_version: "${l1_v2}" }
              as: MemberFoodBank
              as_user_id: "${m2}"
              captures: { bid2: $.data.id }
          trigger:
            - call: "POST /network/loads/${l1}/cancel"
              payload: {}
              as: NetworkAdmin
              captures: { l1_c: $.data.version }
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { err_post: $.data.error_id }
          assert:
            - "LoadBid.${bid1}.bid_status == REJECTED with rejection_reason LOAD_CANCELLED and the same for LoadBid.${bid2}"
            - "MemberFoodBank.${m1}.share_balance == 100000 and MemberFoodBank.${m2}.share_balance == 28571 after the holds were released"
            - "the post attempt on the cancelled load returns ${err_post} == ERR_LOAD_NOT_POSTED with HTTP 409"

      - name: second_withdraw_returns_bid_not_submitted
        claim_type: idempotency
        grounds:
          - state_machines.LoadBid.SUBMITTED_to_WITHDRAWN
          - errors[ERR_BID_NOT_SUBMITTED]
          - validations[priority=16]
