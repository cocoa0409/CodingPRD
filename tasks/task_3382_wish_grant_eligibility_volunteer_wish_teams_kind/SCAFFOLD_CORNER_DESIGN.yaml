              as: ReferralSource
              captures: { err_dup: $.data.error_id }
            - call: "POST /wish-grant/referrals/${ref1_id}/certify"
              payload: { qualifying_condition: "NON_QUALIFYING" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia - relapsed", source_type: "FAMILY", prognosis_months: 6 }
              as: ReferralSource
              captures: { ref2_id: $.data.id, child2_id: $.data.child_id }
          assert:
            - "err_dup == ERR_DUPLICATE_REFERRAL (409) while r1 is non-terminal"
            - "after r1 auto-DENIED (NON_QUALIFYING), re-referral succeeds: Referral.${ref2_id}.status == PENDING_CERTIFICATION"
            - "child2_id == child1_id (existing child reused on re-referral)"

      - name: age_check_priority_beats_duplicate_detection
        claim_type: priority_ordering
        grounds: ["validations[priority=21]", "validations[priority=23]"]
        distinguishing_aspect: "A referral that would violate BOTH the age bound (216 months after clock advance) and duplicate detection fails with the age error: priority 21 beats priority 23."
        test_recipe:
          setup: ["Chapter; referral r1 for 'Borderline Teen' dob 2008-09-20 created at clock 2026-09-01 (215 months) and left PENDING_CERTIFICATION; clock advanced to 2026-10-01."]
          setup_api_calls:
