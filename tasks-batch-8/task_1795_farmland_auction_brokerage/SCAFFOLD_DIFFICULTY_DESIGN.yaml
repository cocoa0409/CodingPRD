          setup:
            - "WHOLE listing (reserve 770000, tract T1 min 700000), ONLINE auction 2026-08-10 17:00-19:00Z, B1 qualified bid 700000 placed, clock advanced to 19:00 so the auction is CLOSED_PENDING_AWARD"
