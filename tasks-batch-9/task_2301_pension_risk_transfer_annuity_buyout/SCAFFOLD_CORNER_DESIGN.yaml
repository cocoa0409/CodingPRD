      - name: funded_status_is_a_pure_computed_read_visible_to_the_regulator
        claim_type: computed_read
        grounds:
          - endpoints.GET_/prt/plans/{id}/funded-status
          - calculations.funded_status_measurement
          - roles.Regulator
        distinguishing_aspect: |
          This endpoint returns an inline object, not an entity: it has no id, no
          version and no persistence, so calling it twice from two different roles
          must produce byte-identical figures, must not bump PensionPlan.version and
          must not append a SettlementEntry. The declared worked example is asserted
          literally so a wrong uplift constant or a truncating division is caught.
        test_recipe:
          setup:
            - "one plan with assets 92000000 and liability 100000000 plus one DEFERRED_VESTED participant at 100000/month"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id, v_before: $.data.version }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0100", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /prt/plans/${plan_id}/funded-status"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { reg_acct_bp: $.data.accounting_funded_status_bp, reg_settle_liab: $.data.settlement_basis_liability_cents, reg_gap: $.data.unfunded_settlement_gap_cents }
            - call: "GET /prt/plans/${plan_id}/funded-status"
              payload: {}
