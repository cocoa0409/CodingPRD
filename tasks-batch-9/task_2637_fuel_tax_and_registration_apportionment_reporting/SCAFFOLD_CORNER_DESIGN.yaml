            - "Vehicle.${v1_id}.vehicle_status == ACTIVE and Vehicle.${v1_id}.activated_on_date == 2026-08-01"
            - "Vehicle.${v9_id}.vehicle_status == PENDING and Vehicle.${v9_id}.activated_on_date == null"
            - "Vehicle.${v1_id}.credential_status == NONE — invoicing prices the fleet but issues nothing"

      - name: reconstruct_on_a_captured_trip_returns_invalid_trip_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.TripRecord.transitions.GAP_FLAGGED_to_RECONSTRUCTED
          - validations[17]
          - errors[ERR_INVALID_TRIP_STATE]
        distinguishing_aspect: "reconstruct exists only from GAP_FLAGGED; invoked on a CAPTURED trip it returns ERR_INVALID_TRIP_STATE 409 and leaves mileage_source TELEMATICS with the original legs still ACTIVE."
        test_recipe:
          setup:
            - "One carrier, one vehicle, one clean CAPTURED trip with a 400.0-mile odometer delta."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records/${t1_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and body.data.error_id == 'ERR_INVALID_TRIP_STATE'"
            - "TripRecord.${t1_id}.trip_status == CAPTURED and mileage_source == TELEMATICS"
            - "TripRecord.${t1_id}.reconstructed_by_user_id == null and supporting_document_reference == null"
            - "GET /apportionment/trip-records/${t1_id}/mileage-legs?leg_status=ACTIVE returns total_count == 1"

      - name: a_rejected_trip_is_terminal_and_a_second_review_cannot_revive_it
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TripRecord.terminal_states
          - state_machines.TripRecord.transitions.CAPTURED_to_REJECTED
          - validations[17]
        distinguishing_aspect: "REJECTED is the TripRecord machine's only terminal state: the reject itself voids the legs and zeroes accepted_leg_miles_total, and a follow-up ACCEPT review returns ERR_INVALID_TRIP_STATE 409 without restoring them."
        test_recipe:
          setup:
            - "One carrier, one vehicle, one CAPTURED trip with 400.0 miles of IL legs."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t1_id}/review"
              payload: { decision: "REJECT", review_note: "telematics feed corrupt" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/trip-records/${t1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and body.data.error_id == 'ERR_INVALID_TRIP_STATE'"
            - "TripRecord.${t1_id}.trip_status == REJECTED"
            - "TripRecord.${t1_id}.accepted_leg_miles_total == 0.0"
            - "GET /apportionment/trip-records/${t1_id}/mileage-legs?leg_status=ACTIVE returns total_count == 0 and ?leg_status=VOIDED returns total_count == 1"
            - "Carrier.${c1_id}.unsubstantiated_mileage_ratio == 0.0000 — a REJECTED trip leaves both sides of the ratio"

      - name: submitting_an_already_submitted_application_a_second_time_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.RegistrationApplication.transitions.DRAFT_to_SUBMITTED
