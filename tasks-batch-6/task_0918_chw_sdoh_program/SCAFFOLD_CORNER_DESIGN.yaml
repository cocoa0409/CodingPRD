scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:

      - name: patient_creation_applies_declared_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Patient.fields.enrollment_status
          - entities.Patient.fields.gate_status
          - entities.Patient.fields.risk_tier
          - endpoints.POST./chw/patients
        distinguishing_aspect: "A patient created with only the five required fields comes back with enrollment_status PROSPECTIVE, gate_status OPEN, risk_tier NONE, risk_score 0, unfulfilled_referral_count 0, empty program_enrollments and categorical_exclusions, both booleans false, and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-001" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C01", full_name: "Default Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, p1_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Patient.${p1}.enrollment_status == PROSPECTIVE"
            - "Patient.${p1}.gate_status == OPEN"
            - "Patient.${p1}.gate_reason == null"
            - "Patient.${p1}.risk_tier == NONE"
            - "Patient.${p1}.risk_score == 0"
            - "Patient.${p1}.risk_tier_effective_at == null"
            - "Patient.${p1}.unfulfilled_referral_count == 0"
            - "Patient.${p1}.program_enrollments == []"
            - "Patient.${p1}.categorical_exclusions == []"
            - "Patient.${p1}.child_in_household == false"
            - "Patient.${p1}.address_safety_flag == false"
            - "${p1_v} == 1"

      - name: patient_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no Patient row returns ERR_PATIENT_NOT_FOUND with HTTP 404, distinct from the generic ERR_RESOURCE_NOT_FOUND used for every other collection."
        test_recipe:
          setup:
            - "Empty database except for one worker."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-002" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "GET /chw/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PATIENT_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: referral_list_returns_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET./chw/referrals
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /chw/referrals with limit 1 against two referrals returns exactly one element with total_count 2, has_more true, limit 1 and offset 0 in the envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker, one ENROLLED patient, one ACTIVE organization with a FOOD_BOX offering of capacity_total 5 and no criteria."
            - "Two Referrals in status SENT against that offering."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-003" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C03", full_name: "Page Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v1: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v1}" }
              as: CHW
              as_user_id: "${w1}"
            - call: "GET /chw/offerings/${off1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { off1_v2: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v2}" }
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "GET /chw/referrals"
              payload: { patient_id: "${p1}", limit: 1, offset: 0 }
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == true"
            - "limit == 1 and offset == 0"
            - "len(data) == 1"

      - name: patient_missing_required_mrn_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=7]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required mrn field on POST /chw/patients returns ERR_VALIDATION with HTTP 400 and creates no row."
        test_recipe:
          setup:
            - "Empty database except for one worker."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-004" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /chw/patients"
              payload: { full_name: "No MRN", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: referral_urgency_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=8]
          - entities.Referral.fields.urgency
        distinguishing_aspect: "An urgency value outside ROUTINE, URGENT and EMERGENT is rejected at rung 5 with ERR_VALIDATION before any inventory or eligibility work happens."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker, one ENROLLED patient, one ACTIVE organization with a FOOD_BOX offering of capacity_total 5."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-005" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C05", full_name: "Enum Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v: $.data.version }
          trigger:
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "IMMEDIATE", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "ResourceOffering.${off1}.available_units == 5 — no hold was placed"

      - name: encounter_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Encounter.fields.billable_minutes
          - entities.Encounter.fields.travel_reimbursement_cents
          - entities.Encounter.fields.service_month
        distinguishing_aspect: "Client-supplied values for the computed fields billable_minutes, service_month and funding_source are ignored: the server derives billable_minutes 48 from the raw 45 and service_month 2026-06 from encounter_date."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-006" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C06", full_name: "Computed Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-05", direct_minutes: 30, indirect_minutes: 10, travel_minutes: 0, documentation_minutes: 5, billable_minutes: 999, service_month: "1999-01", funding_source: "PAYER" }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
          assert:
            - "Encounter.${e1}.billable_minutes == 48"
            - "Encounter.${e1}.raw_billable_minutes == 45"
            - "Encounter.${e1}.total_minutes == 45"
            - "Encounter.${e1}.service_month == 2026-06"
            - "Encounter.${e1}.funding_source == UNFUNDED"
            - "Encounter.${e1}.travel_reimbursement_cents == 0"
            - "Encounter.${e1}.status == DRAFT"

      - name: criterion_create_under_unknown_offering_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - entities.EligibilityCriterion.fields.offering_id
        distinguishing_aspect: "Creating an EligibilityCriterion under an offering id that resolves to nothing returns ERR_RESOURCE_NOT_FOUND at rung 3, before any criterion-shape validation runs."
        test_recipe:
          setup:
            - "Empty database except for one worker."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-007" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/offerings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/criteria"
              payload: { criterion_type: "INCOME_BAND", max_monthly_income_cents: 200000 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_RESOURCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: duplicate_mrn_second_patient_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.Patient.fields.mrn
        distinguishing_aspect: "A second POST /chw/patients carrying an mrn already on file is rejected with ERR_VALIDATION; the first row keeps its full_name."
        test_recipe:
          setup:
            - "One Patient with mrn MRN-C08 already on the roster."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-008" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C08", full_name: "First Row", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C08", full_name: "Duplicate Row", household_size: 3, monthly_income_cents: 120000, residence_zip: "60640" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "Patient.${p1}.full_name == First Row"

      - name: screening_instrument_default_cadence_applied
        claim_type: Defaults
        grounds:
          - entities.ScreeningInstrument.fields.rescreen_cadence_days
        excluded_because:
          difficulty_instance: screening_blocked_while_instrument_unpublished
          rationale: "That instance creates an instrument without rescreen_cadence_days and asserts the declared 90-day default on the created row."

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: referral_deliver_from_sent_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Referral.ACCEPTED_to_SERVICE_DELIVERED
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SERVICE_DELIVERED is reachable only from ACCEPTED; calling deliver on a SENT referral returns ERR_INVALID_STATE (409) and leaves the offering's counters untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker, one ENROLLED patient, one ACTIVE organization with a FOOD_BOX offering of capacity_total 3."
            - "One Referral in status SENT holding 1 unit."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-009" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C09", full_name: "State Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 3 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /chw/referrals/${r1}/deliver"
              payload: {}
              as: ResourcePartner
              as_user_id: "${org1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Referral.${r1}.status == SENT"
            - "Referral.${r1}.delivered_at == null"
            - "ResourceOffering.${off1}.allocated_units == 1 and delivered_units == 0"

      - name: referral_close_twice_second_call_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Referral.SERVICE_DELIVERED_to_CLOSED
          - validations[priority=16]
        distinguishing_aspect: "CLOSED is terminal: a second close on the same referral returns ERR_INVALID_STATE and outcome_note keeps its original value."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker, one ENROLLED patient, one ACTIVE organization with a FOOD_BOX offering of capacity_total 3."
            - "One Referral already CLOSED after acceptance and delivery."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-010" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C10", full_name: "Loop Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 3 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
            - call: "POST /chw/referrals/${r1}/respond"
              payload: { decision: "ACCEPTED" }
              as: ResourcePartner
              as_user_id: "${org1}"
            - call: "POST /chw/referrals/${r1}/deliver"
              payload: {}
              as: ResourcePartner
              as_user_id: "${org1}"
            - call: "POST /chw/referrals/${r1}/close"
              payload: { outcome_note: "Food box delivered and confirmed" }
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/referrals/${r1}/close"
              payload: { outcome_note: "Duplicate closure attempt" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Referral.${r1}.status == CLOSED"
            - "Referral.${r1}.outcome_note == Food box delivered and confirmed"
            - "ResourceOffering.${off1}.delivered_units == 1 and available_units == 2 and allocated_units == 0"
            - "ResourceOffering.${off1}.capacity_total == 3 == available_units + allocated_units + delivered_units"

      - name: goal_close_not_met_then_reopen_increments_reopen_count
        claim_type: cyclic
        grounds:
          - state_machines.CarePlanGoal.ACTIVE_to_NOT_MET
          - state_machines.CarePlanGoal.NOT_MET_to_ACTIVE
          - entities.CarePlanGoal.fields.reopen_count
          - entities.Escalation.fields.source_flag
        distinguishing_aspect: "Closing a goal NOT_MET opens a GOAL_NOT_MET Escalation and stamps closed_at; reopening returns the goal to ACTIVE, clears closed_at, sets reopen_count to 1 and re-bases review_due_at on the current clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, later advanced to 2026-06-15T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "One CarePlanGoal in the FOOD domain, direction INCREASE_GOOD, baseline 2, target 10, review_cycle_days 30, closed NOT_MET."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-011" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C11", full_name: "Goal Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/goals"
              payload: { patient_id: "${p1}", domain: "FOOD", direction: "INCREASE_GOOD", baseline_value: 2, target_value: 10, review_cycle_days: 30 }
              as: CHW
              as_user_id: "${w1}"
              captures: { g1: $.data.id }
            - call: "POST /chw/goals/${g1}/close"
              payload: { outcome: "NOT_MET" }
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/goals/${g1}/reopen"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "CarePlanGoal.${g1}.status == ACTIVE"
            - "CarePlanGoal.${g1}.closed_at == null"
            - "CarePlanGoal.${g1}.reopen_count == 1"
            - "CarePlanGoal.${g1}.review_due_at == 2026-07-15T00:00:00.000Z"
            - "CarePlanGoal.${g1}.progress_pct == 0.0"
            - "GET /chw/escalations with patient_id=${p1} returns total_count == 1 and that row's source_flag == GOAL_NOT_MET"

      - name: escalation_tier3_is_the_promotion_ceiling
        claim_type: cyclic
        grounds:
          - state_machines.Escalation.OPEN_TIER_1_to_OPEN_TIER_2
          - state_machines.Escalation.OPEN_TIER_2_to_OPEN_TIER_3
          - calculations.escalation_tier_deadline
        distinguishing_aspect: "Two promotion sweeps drive OPEN_TIER_1 to OPEN_TIER_3 with promotion_count 2 and ack_deadline_at re-based on each tier's SLA; a third sweep past the tier-3 deadline changes nothing because MAX_ESCALATION_TIER is 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, advanced across three sweeps."
