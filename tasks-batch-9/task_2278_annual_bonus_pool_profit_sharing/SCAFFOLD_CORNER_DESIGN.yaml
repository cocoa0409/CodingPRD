        excluded_because:
          difficulty_instance: combinatorial_formula / burden_tier_selected_from_pre_burden_cumulative_not_loaded_total
          rationale: "The tiered_pricing boundary claim (tier chosen from the pre-burden cumulative, 7.65% not 9.25%) is asserted there with both readings computed."

