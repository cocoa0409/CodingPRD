      - name: stockout_forward_looking_counts_on_order
        claim_type: input_set_filtering
        grounds:
          - calculations.stockout_status
          - entities.InventoryBalance.fields.on_order
        distinguishing_aspect: "Forward-looking inclusion set: with on_hand 2, on_order 0, min_par_level 5 the balance is in stockout; placing a 5-unit replenish order flips stockout off WITHOUT any on_hand movement — the input set includes vendor-committed units."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A; SKU-CHIPS balance seeded to 2 with min_par_level 5."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 5 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 2, reason: "opening" }
              as: SiteOps
          trigger:
            - call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-PAR", lines: [ { product_id: "${prod_chips}", qty: 5, unit_cost_cents: 200 } ], expected_at: "2026-09-11T08:00:00Z", idempotency_key: "po-par-key" }
              as: SiteOps
              captures: { ro_par: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_par}/place"
              payload: {}
              as: SiteOps
            - call: "GET /mfc/inventory-balances/${bal_chips}"
              payload: {}
              as: SiteOps
              captures: { oh_par: $.data.on_hand, oo_par: $.data.on_order }
          assert:
            - "Before place: on_hand + on_order == 2 < 5 (stockout posture true)"
            - "After place: on_hand == 2 and on_order == 5, so 2 + 5 >= 5 clears the stockout flag with zero physical receipt"

      - name: perishable_pick_requires_fresh_cover_not_just_on_hand
        claim_type: input_set_filtering
        grounds:
          - calculations.stockout_status
          - entities.StockLot.fields.status
          - errors.ERR_PRODUCT_UNSELLABLE
        distinguishing_aspect: "The perishable gate filters StockLots to status FRESH: a product with on_hand 3 whose only lot is EXPIRING cannot be appended to a batch — 422 ERR_PRODUCT_UNSELLABLE even though the raw balance suffices."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A (horizon 2 days); PERISHABLE SKU-MILK with one lot of 3 expiring 2026-09-11T14:00:00Z (inside horizon -> EXPIRING); adult customer; order of 1 milk PLACED."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
