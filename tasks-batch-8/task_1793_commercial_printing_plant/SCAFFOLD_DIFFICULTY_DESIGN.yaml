            - "Job.${j1}.allocated_make_ready_cents == 48000 after re-lock"

  - rule_id: transitive_cascade
    instances:
      - name: claim_credit_to_invoice_job_customer_cascade
        grounds:
          - state_machines.ReprintClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.Invoice.DISPUTED_to_PAID
          - state_machines.JobBilling.INVOICED_to_SETTLED
          - state_machines.Job.FULFILLED_to_CLOSED
          - calculations.customer_credit_exposure
        distinguishing_aspect: |
          Depth-3 cascade from a single approve: ReprintClaim APPROVED (CREDIT,
          100% liability, full quantity) -> Invoice credit_applied 1065179 ->
          amount_outstanding 0 -> PAID (hop 1); invoice PAID -> Job
          billing_status SETTLED and production FULFILLED -> CLOSED (hop 2);
          job/invoice mutations -> Customer exposure recomputed 1065179 -> 0 and
          posture flips CREDIT_HOLD -> ACTIVE (hop 3). Each hop is caused by the
          previous hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 500000 (posture flips HOLD once exposure exceeds it)"
            - "MAIL job (Q=10002 standard two-signature spec) driven to FULFILLED via a 10502-piece drop; invoice base 811923 + postage 253256 = 1065179 ISSUED; customer exposure 1065179 > 500000 -> CREDIT_HOLD"
            - "Claim defect_qty 10502 (full delivery), reviewed by pm-1"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Cascade Cust", credit_limit_cents: 500000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
