        grounds:
          - calculations.audit_notice_window
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = pairwise half-open [start, end) overlap on the AuditExercise
          resource of one ThirdParty: a new window starting exactly at the previous window's
          end (2026-05-30) is adjacency and ALLOWED, while [2026-05-29, 2026-06-05) collides.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80; ThirdParty fully APPROVED (LOW)"
            - "Audit A NOTICED with window [2026-05-15, 2026-05-30) (notice 2026-05-01 + 10d = 2026-05-11 <= start)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
