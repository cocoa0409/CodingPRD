        distinguishing_aspect: "Branching path SUBMITTED -> UNDER_REVIEW -> ESCALATED -> RESOLVED all succeed in order; a CRITICAL grievance deducts 5 from the scorecard while unresolved (including ESCALATED) and the deduction is restored on RESOLVE."
