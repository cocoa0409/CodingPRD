      - name: loaner_selector_serial_tiebreak
        claim_type: selector_policy
        grounds: ["state_machines.LoanerUnit.AVAILABLE_to_RESERVED", "entities.LoanerUnit.fields.status"]
        distinguishing_aspect: "Loaner selector determinism: two AVAILABLE units of the right model created at the same logical instant tie on created_at and the serial_number ASC tie-break picks LN-100 over LN-200 even though LN-200 was registered first."
        test_recipe:
          setup: ["GOLD-contracted instrument; HIGH BREAK_FIX request; two AVAILABLE SEQ-5000 units registered in order LN-200 then LN-100 (same logical clock, so created_at ties)."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Loaner Select Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
