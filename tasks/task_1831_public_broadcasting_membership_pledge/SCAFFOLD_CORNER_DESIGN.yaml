        distinguishing_aspect: "Write-off is MembershipCoordinator-exclusive; a PhoneVolunteer attempting it gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR; pledge 6000 captured; clock +61 days"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
