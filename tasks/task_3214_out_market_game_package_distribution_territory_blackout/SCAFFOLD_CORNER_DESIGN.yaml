- section: cross_cutting_layers
  instances:
  - name: derived_slate_fields_reconciled_on_game_add_and_reopen
    claim_type: derived_field_reconciliation
    grounds:
    - entities.WeekSlate.fields.package_game_count
    - entities.WeekSlate.fields.finalized_game_ids
    distinguishing_aspect: "The derived package_game_count tracks game creation (a new game in the slate's week bumps the live count) and reopening clears finalized_game_ids back to [] \u2014 derived fields\
      \ reconcile on both source-entity growth and posture transitions, not just on finalize."
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; week-4 slate created BEFORE its games (count 0); two games then added; slate finalized then reopened.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      - call: POST /seasons
        payload:
          rights_grant_id: ${rg_id}
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          season_id: $.data.id
      - call: POST /markets
        payload:
          code: DAL
          name: Dallas
          zip_prefixes:
          - '750'
          home_team_codes:
          - DAL
        as: LeagueOps
      - call: POST /week-slates
        payload:
          season_id: ${season_id}
          week_index: 4
        as: LeagueOps
        captures:
          slate_id: $.data.id
          cnt0: $.data.package_game_count
          slate_v0: $.data.version
      - call: POST /games
        payload:
          season_id: ${season_id}
          week_index: 4
          away_team_code: KC
          home_team_code: DAL
          kickoff_at: '2026-08-30T17:00:00Z'
