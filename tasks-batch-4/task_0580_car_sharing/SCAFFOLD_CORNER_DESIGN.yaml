        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_OWNERSHIP_VIOLATION]"]
        distinguishing_aspect: "A host editing a vehicle owned by a different host (X-User-ID != vehicle.host_id) returns ERR_OWNERSHIP_VIOLATION (403)."
        test_recipe:
          setup: ["Two hosts; host1 owns a vehicle."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host DA1", email: "hda1@x.com" }, as: Anonymous, captures: { host1_id: "$.data.id" } }
            - { call: "POST /hosts", payload: { name: "Host DA2", email: "hda2@x.com" }, as: Anonymous, captures: { host2_id: "$.data.id" } }
