        distinguishing_aspect: "After a first quote advances EventOrder.version, a second quote carrying the pre-advance expected_event_order_version is rejected with ERR_STALE_ORDER_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["Order with one line; version captured BEFORE the first quote generation."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_ORDER_VERSION"
            - "response.http_status == 412"

      - name: occ_correct_version_requote_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-create-stale-order]", entities.EventOrder.fields.version]
        distinguishing_aspect: "A quote carrying the current expected_event_order_version succeeds and increments EventOrder.version by 1 (create v1 -> +line v2 -> +quote v3)."
        test_recipe:
          setup: ["Order with one line (version 2 after the line)."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { q_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "EventOrder.${oid}.version == 3"
            - "EventOrder.${oid}.status == QUOTED"

      - name: cascade_order_cancel_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.EventOrder.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_run_cancel_ingredient_release
          rationale: "End-to-end cancel cascade is the named §1.8 instance."

      - name: overtime_threshold_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.staff_labor]
        excluded_because:
          difficulty_instance: boundary_precision_check / overtime_at_exactly_eight_hours
          rationale: "Overtime boundary at 8.0h is the named §1.8 instance; the >8h path is exercised by staff_labor_scheduled_vs_actual_window."

  # ===================== Consistency Model =====================
  - section: consistency_model
    instances:
      - name: quote_generation_visible_in_same_response
        claim_type: immediate
        grounds: [calculations.event_estimate]
        distinguishing_aspect: "immediate consistency: POST /event-orders/{id}/quotes returns the computed food_revenue_cents in the same response, and the order's status is QUOTED on immediate re-read."
        test_recipe:
          setup: ["Order with one line."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 10, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { q_food: $.data.food_revenue_cents }
          assert:
            - "response.data.food_revenue_cents == 10000"
            - "EventOrder.${oid}.status == QUOTED"
