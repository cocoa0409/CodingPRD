  - rule_id: resource_temporal_overlap
    instances:
      - name: hold_on_ancestor_space_rejected_when_closed_intervals_share_one_endpoint
        grounds:
          - validations[priority=74]
          - errors.ERR_SPACE_DATE_CONFLICT
          - calculations.hold_rank_assignment
          - entities.SpaceUnit.fields.parent_space_id
          - entities.SpaceHold.fields.interval_start_date
        distinguishing_aspect: |
          Interval semantics: SpaceUnit occupancy over a CLOSED interval that propagates up
          and down the parent_space_id tree. Hall A1's CONFIRMED hold covers
          2027-10-01 through 2027-10-05; a hold on the ancestor Hall A starting exactly on
          2027-10-05 shares one endpoint and must be refused, while a hold starting
          2027-10-06 is clear. A half-open reading, or one that ignores the space hierarchy,
          admits the first request.
        test_recipe:
          setup:
            - "Hall A is a top-level HALL and Hall A1 is its child with parent_space_id pointing at Hall A"
            - "Sunbelt's CONSUMER_SHOW booking on Hall A1 runs move-in 2027-10-01 through move-out 2027-10-05 and its hold has been confirmed as first option"
            - "Riverbend holds two further CONSUMER_SHOW bookings on the ancestor Hall A: one running 2027-10-05 through 2027-10-09 and one running 2027-10-06 through 2027-10-10, both without holds"
