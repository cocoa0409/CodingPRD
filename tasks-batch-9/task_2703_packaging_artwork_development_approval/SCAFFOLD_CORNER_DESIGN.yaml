      - name: three_individually_affordable_plate_orders_exhaust_the_budget_for_the_fourth
        claim_type: aggregate_validation
        grounds:
          - validations[priority=55]
          - errors[ERR_PLATE_BUDGET_EXCEEDED]
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
