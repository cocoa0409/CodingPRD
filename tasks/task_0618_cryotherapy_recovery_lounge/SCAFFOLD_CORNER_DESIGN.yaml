  # ===========================================================================
  - section: state_machines
    instances:
      - name: book_then_complete_keeps_credits_excluded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_COMPLETED
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_branching_to_completed_no_show_cancelled
          rationale: "The COMPLETED branch's no-fee/keep-credits semantics are exercised alongside NO_SHOW within the named §1.8 branching instance."

      - name: room_overlap_rejection_excluded
        claim_type: invalid_transition
        grounds:
          - validations[priority=15]
          - errors[ERR_ROOM_UNAVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_overlap_with_cleaning_buffer
          rationale: "ERR_ROOM_UNAVAILABLE is asserted as the failure path of the named §1.8 overlap instance."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_contraindication_block_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRAINDICATION_BLOCK]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / location_closed_beats_contraindication_on_booking
          rationale: "ERR_CONTRAINDICATION_BLOCK is the lower-priority arm of the named §1.8 priority-conflict instance; its standalone trigger is reachable by opening the location in that same setup."

      - name: error_stale_version_excluded
