  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
          - "validations[priority=1]"
        distinguishing_aspect: "Request without X-User-Role header fails with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
          trigger:
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: close_nominations_without_candidate_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ELECTION_NO_CANDIDATE]"
          - "state_machines.BoardElection.NOMINATION_OPEN_to_NOMINATION_CLOSED"
        distinguishing_aspect: "close-nominations with an empty candidate_names list fails with ERR_ELECTION_NO_CANDIDATE."
        test_recipe:
          setup: ["Election in NOMINATION_OPEN"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
          trigger:
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: [] }
              as: BoardSecretary
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ELECTION_NO_CANDIDATE"

      - name: reinstate_blocked_by_unpaid_final_invoice
        claim_type: violation_to_error
        grounds:
