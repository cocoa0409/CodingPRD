# §1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml §1.1-§1.7.
# Nine sections from references/claim-extraction-guide.md. Names are unique across this file
# and SCAFFOLD_DIFFICULTY_DESIGN.yaml. Literal values are pre-computed from §1.3.
scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_create_returns_envelope_and_declared_defaults
        claim_type: creation
        grounds:
          - entities.Facility
          - response_envelope.success
        distinguishing_aspect: "A create returns 201 with the §1.0 success envelope and every §1.1 Facility field, including the system fields the client never sent: approval_status APPROVED and resident_sire_count 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/facilities"
              payload: { code: "F-CR-01", country_code: "US", housing_capacity: 6, bench_capacity: 2, approved_export_countries: ["CA", "MX"] }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
          assert:
            - "HTTP 201; the envelope carries meta.api_request_id and meta.api_request_timestamp, and response_type == \"object\""
            - "data.code == \"F-CR-01\", data.country_code == \"US\", data.housing_capacity == 6, data.bench_capacity == 2, data.approved_export_countries == [\"CA\", \"MX\"]"
            - "data.approval_status == \"APPROVED\", data.suspension_reason == null, data.resident_sire_count == 0"
            - "data.version == 1; data.id is a bare UUID with no type prefix; data.created_at == data.updated_at with exactly three fractional digits"

      - name: sire_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Sire
          - endpoints.GET_/genetics/sires/{id}
        distinguishing_aspect: "A by-id read returns exactly what creation stored, with the initial values of both status dimensions (PROSPECT / NOT_HOUSED) and the zeroed published_* block."
        test_recipe:
          setup:
            - "One Sire REG-R1 exists, created with acquisition_cost_cents 750000 and no pedigree parents."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-R1", breed: "JERSEY", birth_date: "2021-11-02", acquisition_cost_cents: 750000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "GET /genetics/sires/${s_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "HTTP 200 with response_type == \"object\" and data.id == ${s_id}"
            - "data.registration_code == \"REG-R1\", data.breed == \"JERSEY\", data.birth_date == \"2021-11-02\", data.acquisition_cost_cents == 750000"
            - "data.acquisition_status == \"PROSPECT\", data.collection_status == \"NOT_HOUSED\", data.housing_facility_id == null, data.contract_price_cents == null"
            - "data.published_production_index == 0.00, data.published_health_index == 0.00, data.published_composite_index == 0.00, data.published_evaluation_effective_at == null, data.progeny_daughter_count == 0"
            - "data.pedigree_depth == 0 (both parents null), data.collection_count == 0, data.version == 1"

      - name: sires_list_paginates_and_filters_by_breed
        claim_type: listing
        grounds:
          - endpoints.GET_/genetics/sires
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint reports total_count over the FILTERED set and has_more relative to limit+offset, with the declared defaults limit 10 / offset 0; response_type is \"array\"."
        test_recipe:
          setup:
            - "Three sires exist: REG-L1 and REG-L2 are ANGUS, REG-L3 is HOLSTEIN. No sire is housed."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-L1", breed: "ANGUS", birth_date: "2021-01-01", acquisition_cost_cents: 100000 }
              as: ProgramDirector
              captures: { l1: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-L2", breed: "ANGUS", birth_date: "2021-02-01", acquisition_cost_cents: 100000 }
              as: ProgramDirector
              captures: { l2: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-L3", breed: "HOLSTEIN", birth_date: "2021-03-01", acquisition_cost_cents: 100000 }
              as: ProgramDirector
              captures: { l3: "$.data.id" }
          trigger:
            - call: "GET /genetics/sires"
              payload: { breed: "ANGUS", limit: 1, offset: 0 }
              as: ProgramDirector
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP 200, response_type == \"array\", exactly 1 row returned, total_count == 2 (the ANGUS subset, not 3) and has_more == true"
            - "${first_id} == ${l1}: with no sort parameter the list is ordered created_at ASC, never by id"
            - "GET /genetics/sires?breed=ANGUS&limit=1&offset=1 returns 1 row (${l2}), total_count == 2, has_more == false"
            - "GET /genetics/sires with no query parameters returns 3 rows, total_count == 3, has_more == false, applying the declared defaults limit 10 and offset 0"
            - "GET /genetics/sires?limit=101 returns HTTP 400 with error_id ERR_VALIDATION, because limit is bounded to 1-100"

      - name: sire_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_8_ERR_RESOURCE_NOT_FOUND
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no stored row is a 404 with ERR_RESOURCE_NOT_FOUND, not a 200 with an empty body and not a 400."
        test_recipe:
          setup:
            - "One unrelated Sire exists, so the table is non-empty."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-N1", breed: "ANGUS", birth_date: "2021-01-01", acquisition_cost_cents: 100000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "GET /genetics/sires/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err} == \"ERR_RESOURCE_NOT_FOUND\" and response_type == \"error\""
            - "data.message is a non-empty string; the envelope still carries meta.api_request_id"
            - "The same 404 answers GET /genetics/tanks/00000000-0000-4000-8000-000000000000 and GET /genetics/straw-lots/00000000-0000-4000-8000-000000000000"

      - name: sire_create_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - validations.priority_1_ERR_VALIDATION
          - entities.Sire.fields.registration_code
        distinguishing_aspect: "Every non-optional §1.5 input must be present and non-null; omission is ERR_VALIDATION (400) at priority 1, ahead of the uniqueness rule at priority 10 and every state rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /genetics/sires"
              payload: { breed: "ANGUS", birth_date: "2021-01-01", acquisition_cost_cents: 100000 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with ${err} == \"ERR_VALIDATION\"; no Sire row was created, so GET /genetics/sires returns total_count == 0"
            - "The same 400 is returned when registration_code is present but null"
            - "Each remaining required input behaves identically: omitting breed, birth_date or acquisition_cost_cents each returns ERR_VALIDATION"
            - "Optional inputs are genuinely optional: the same body WITH registration_code and WITHOUT sire_id or dam_sire_id returns HTTP 201"

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.approved_export_countries
          - entities.Tank.fields.service_interval_days
          - endpoints.POST_/genetics/tanks
        distinguishing_aspect: "Omitted optional inputs take the values §1.1/§1.5 declare - approved_export_countries [], service_interval_days 60, initial_fill_pct 95.0 - rather than null; the tank's derived fields are computed from those defaults on the spot."
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Distributor D-DEF (US) exists."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/facilities"
              payload: { code: "F-DEF-01", country_code: "US", housing_capacity: 2, bench_capacity: 1 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-DEF", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-DEF", capacity_straws: 400 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
          assert:
            - "Facility.${fac_id}.approved_export_countries == [] (the declared default, not null)"
            - "HTTP 201; Tank.${tank_id}.service_interval_days == 60 and last_service_fill_pct == 95.0 (initial_fill_pct default)"
            - "Tank.${tank_id}.last_service_at == \"2026-08-01T00:00:00.000Z\", ln2_level_pct == 95.0, next_service_due_at == \"2026-09-30T00:00:00.000Z\", service_count == 0, straws_on_hand == 0, tank_status == \"IN_SERVICE\""
            - "Tank.${tank_id}.assigned_technician_name == null and technician_cert_expiry_at == null - optional inputs with no declared default stay null"

      - name: ejaculate_theoretical_doses_computed_with_floor_not_rounding
        claim_type: computed_fields
        grounds:
          - calculations.ejaculate_theoretical_doses
          - entities.Ejaculate.fields.total_doses_theoretical
          - validations.priority_41_ERR_DOSE_CAP_EXCEEDED
        distinguishing_aspect: "total_doses_theoretical is floor(volume_ml * concentration_m_per_ml / 15), not a rounded quotient: 5.5 ml at 1150 M/ml gives 421.666..., so the stored value must be 421 and a 422-straw lot must be refused."
        test_recipe:
          setup:
            - "Facility F-CF-01 (US, APPROVED) hosts Sire REG-CF, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01."
            - "A SCHEDULED booking spans 2026-09-01T08:00:00Z - 2026-09-01T10:00:00Z and the logical clock stands at 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/collection-bookings"
              payload: { status: "SCHEDULED" }
              as: ProgramDirector
              captures: { bk_id: "$.data[0].id", fac_id: "$.data[0].facility_id" }
          trigger:
            - call: "POST /genetics/collection-bookings/${bk_id}/complete"
              payload: { volume_ml: 5.5, concentration_m_per_ml: 1150, motility_pct: 68.0 }
              as: FacilityManager
              as_user_id: "${fac_id}"
          assert:
            - "HTTP 200; CollectionBooking.${bk_id}.status == \"COMPLETED\" and completed_at == \"2026-09-01T08:00:00.000Z\""
            - "Exactly one Ejaculate row was created: GET /genetics/ejaculates?booking_id=${bk_id} returns total_count == 1 with qc_status \"PENDING_QC\""
            - "That row's total_doses_theoretical == 421, because floor(5.5 * 1150 / 15) == floor(421.666...) == 421 - a rounded value of 422 is wrong"
            - "volume_ml, concentration_m_per_ml and motility_pct are copied verbatim as 5.5, 1150 and 68.0; post_thaw_motility_pct, morphology_normal_pct and evaluated_by_user_id are null until the QC call"
            - "The cap binds on lots: after an ACCEPTED qc-evaluation, a lot with straw_count 422 returns HTTP 422 with error_id ERR_DOSE_CAP_EXCEEDED, while straw_count 421 returns HTTP 201"
            - "Sire.collection_count was incremented by 1 by the completion"

      - name: facility_create_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Facility.fields.approval_status
          - validations.priority_1_ERR_VALIDATION
        distinguishing_aspect: "Unknown body keys are ignored, never an error (priority 1), and system/computed fields are minted server-side: a client-supplied id, version, approval_status and resident_sire_count must all be discarded rather than honoured or rejected."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /genetics/facilities"
              payload: { code: "F-SYS-01", country_code: "US", housing_capacity: 3, bench_capacity: 1, id: "11111111-1111-4111-8111-111111111111", version: 99, approval_status: "SUSPENDED", resident_sire_count: 7 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
          assert:
            - "HTTP 201 - the unknown keys are ignored, so this is NOT an ERR_VALIDATION"
            - "${fac_id} != \"11111111-1111-4111-8111-111111111111\": the id is server-minted"
            - "data.version == 1, data.approval_status == \"APPROVED\", data.resident_sire_count == 0"
            - "data.created_at and data.updated_at are server-minted from the logical clock, not from any client value"

      - name: enum_and_range_constraints_rejected_at_priority_two_and_three
        claim_type: type_constraints
        grounds:
          - validations.priority_2_ERR_VALIDATION
          - validations.priority_3_ERR_VALIDATION
          - entities.HealthTest.fields.test_type
        distinguishing_aspect: "Closed enum sets and numeric bounds are rejected as shape errors (400) before any existence or state rule, so a bad enum on an otherwise perfect request never reaches the state machine."
        test_recipe:
          setup:
            - "Facility F-TC-01 (US, APPROVED) hosts Sire REG-TC, which is RESIDENT and in ISOLATION."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ISOLATION" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "RABIES", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with ${err} == \"ERR_VALIDATION\": RABIES is not in the declared test_type set"
            - "No HealthTest row was created: GET /genetics/health-tests?sire_id=${s_id} returns total_count == 0"
            - "breed is equally closed: POST /genetics/sires with breed \"WAGYU\" returns HTTP 400 ERR_VALIDATION"
            - "range bounds are priority 3: POST /genetics/facilities with housing_capacity 0 returns ERR_VALIDATION, as does country_code \"USA\" (exactly two uppercase letters) and validity_days -1"
            - "The shape rules outrank existence: POST /genetics/sires/00000000-0000-4000-8000-000000000000/health-tests with test_type \"RABIES\" returns ERR_VALIDATION (400), not ERR_RESOURCE_NOT_FOUND"

      - name: booking_window_must_be_well_formed_and_future_dated
        claim_type: type_constraints
        grounds:
          - validations.priority_36_ERR_INVALID_WINDOW
          - entities.CollectionBooking.fields.start_at
        distinguishing_aspect: "A different constraint family on the same table: the interval itself must satisfy start_at < end_at and start_at >= the logical clock. Unlike the enum checks this is a business_temporal rule (422), so it is evaluated after existence and state."
        test_recipe:
          setup:
            - "Facility F-TC-02 (US, APPROVED, bench_capacity 2) hosts Sire REG-TW, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01 and no prior booking."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${s_id}", facility_id: "${fac_id}", start_at: "2026-09-10T10:00:00Z", end_at: "2026-09-10T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_INVALID_WINDOW\": a zero-length window fails start_at < end_at"
            - "end_at before start_at fails identically: start_at \"2026-09-10T12:00:00Z\" with end_at \"2026-09-10T10:00:00Z\" returns ERR_INVALID_WINDOW"
            - "past-dated fails too: start_at \"2026-08-31T23:59:59Z\" with end_at \"2026-09-01T02:00:00Z\" returns ERR_INVALID_WINDOW, because start_at must be >= the logical clock"
            - "at the clock exactly: start_at \"2026-09-01T00:00:00Z\" with end_at \"2026-09-01T02:00:00Z\" returns HTTP 201 - the >= boundary is closed"
            - "No booking row exists for any of the three refused windows: GET /genetics/collection-bookings?sire_id=${s_id} counts only the accepted one"

      - name: unknown_path_and_body_foreign_keys_return_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_8_ERR_RESOURCE_NOT_FOUND
          - validations.priority_9_ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "Both FK surfaces are guarded: an unresolvable {id} path segment (priority 8) and an unresolvable FK in the body (priority 9). The body-FK case is the one an implementation typically forgets, and it must fire before any state or business rule."
        test_recipe:
          setup:
            - "Facility F-FK-01 (US, APPROVED) and Sire REG-FK exist; REG-FK is RESIDENT and in ISOLATION at F-FK-01."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ISOLATION" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/health-tests"
              payload: { facility_id: "00000000-0000-4000-8000-000000000000", test_type: "IBR", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err} == \"ERR_RESOURCE_NOT_FOUND\" - the body FK facility_id does not resolve"
            - "path segment case: POST /genetics/sires/00000000-0000-4000-8000-000000000000/health-tests with a valid facility_id returns HTTP 404 ERR_RESOURCE_NOT_FOUND"
            - "the same guard covers every declared body FK: distributor_id on POST /genetics/tanks, tank_id on a transfer request, country_requirement_id on POST /genetics/export-certificates and each entry of excluded_sire_ids"
            - "No HealthTest row was created by either refused call"

      - name: pedigree_amendment_that_closes_a_cycle_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations.priority_33_ERR_PEDIGREE_CYCLE
          - entities.Sire.fields.sire_id
          - entities.Sire.fields.pedigree_depth
          - endpoints.POST_/genetics/sires/{id}/pedigree
        distinguishing_aspect: "The graph topology's only integrity rule: the self-referential pedigree must stay a DAG. Creation alone can never close a cycle (the child's id does not exist yet), so the reachable trigger is the parentage-correction endpoint, and both the self-edge and the two-hop cycle must be refused."
        test_recipe:
          setup:
            - "Sire REG-P1 is a pedigree root (both parents null, pedigree_depth 0)."
            - "Sire REG-P2 has sire_id REG-P1, so pedigree_depth is 1; Sire REG-P3 is another root."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-P1", breed: "HOLSTEIN", birth_date: "2019-01-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { p1: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-P2", breed: "HOLSTEIN", birth_date: "2022-01-01", sire_id: "${p1}", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { p2: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-P3", breed: "HOLSTEIN", birth_date: "2018-01-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { p3: "$.data.id" }
          trigger:
            - call: "POST /genetics/sires/${p1}/pedigree"
              payload: { sire_id: "${p2}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_PEDIGREE_CYCLE\": REG-P2 already descends from REG-P1, so the edge would close a two-hop cycle"
            - "Sire.${p1}.sire_id is still null and Sire.${p1}.version is unchanged - a refused amendment writes nothing"
            - "self-edge: POST /genetics/sires/${p1}/pedigree with sire_id ${p1} returns HTTP 422 ERR_PEDIGREE_CYCLE"
            - "positive control: POST /genetics/sires/${p2}/pedigree with sire_id ${p3} returns HTTP 200 with sire_id == ${p3}, pedigree_depth == 1 and version incremented by 1"
            - "GET /genetics/sires?sire_id=${p3} then returns total_count == 1, and GET /genetics/sires?sire_id=${p1} returns total_count == 0 - the reverse-reachability filter follows the amendment"

  - section: state_machines
    instances:
      - name: house_call_advances_both_dimensions_and_sets_isolation_end
        claim_type: valid_transition
        grounds:
          - state_machines.Sire.CONTRACTED_to_RESIDENT
          - state_machines.Sire.NOT_HOUSED_to_ISOLATION
          - endpoints.POST_/genetics/sires/{id}/house
        distinguishing_aspect: "One call drives one transition on each dimension and derives isolation_ends_at from the logical clock plus isolation_days * 86400; the facility's resident_sire_count is the ledger side effect."
        test_recipe:
          setup:
            - "Facility F-SM-01 (US, APPROVED, housing_capacity 2) exists with resident_sire_count 0."
            - "Sire REG-SM1 is CONTRACTED (contract posted) and NOT_HOUSED."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/facilities"
              payload: { code: "F-SM-01", country_code: "US", housing_capacity: 2, bench_capacity: 1 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-SM1", breed: "HOLSTEIN", birth_date: "2022-02-02", acquisition_cost_cents: 800000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id" }
            - call: "POST /genetics/sires/${s_id}/contract"
              payload: { contract_price_cents: 800000 }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/sires/${s_id}/house"
              payload: { facility_id: "${fac_id}", isolation_days: 30 }
              as: FacilityManager
              as_user_id: "${fac_id}"
          assert:
            - "HTTP 200; data.acquisition_status == \"RESIDENT\" and data.collection_status == \"ISOLATION\" - one call, one transition on each dimension"
            - "data.housing_facility_id == ${fac_id}, data.isolation_days_applied == 30, data.isolation_ends_at == \"2026-08-31T00:00:00.000Z\""
            - "Facility.${fac_id}.resident_sire_count == 1"
            - "data.version == 3 (create, contract, house) and data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "Housing without a contract is refused: the same call on a PROSPECT sire returns HTTP 409 with error_id ERR_SIRE_ACQUISITION_STATE"

      - name: collection_clearance_before_isolation_ends_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Sire.ISOLATION_to_ELIGIBLE
          - validations.priority_24_ERR_ISOLATION_INCOMPLETE
        distinguishing_aspect: "The ISOLATION -> ELIGIBLE precondition is a clock comparison against isolation_ends_at with a closed boundary: one day early is ERR_ISOLATION_INCOMPLETE, and the exact instant is admissible."
        test_recipe:
          setup:
            - "Sire REG-SM2 is RESIDENT and in ISOLATION at F-SM-02, housed at clock 2026-08-01T00:00:00Z with isolation_days 30, so isolation_ends_at is 2026-08-31T00:00:00.000Z."
            - "All four required tests are NEGATIVE with valid_until 2027-08-01T00:00:00.000Z, so the health rule at priority 25 is satisfied."
            - "The clock is then moved to 2026-08-30T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ISOLATION" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", ends: "$.data[0].isolation_ends_at" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/sires/${s_id}/collection-clearance"
              payload: { clearance_note: "early attempt" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "${ends} == \"2026-08-31T00:00:00.000Z\""
            - "HTTP 422 with ${err} == \"ERR_ISOLATION_INCOMPLETE\"; Sire.${s_id}.collection_status is still \"ISOLATION\""
            - "at the boundary: after POST /genetics/_clock/set_current_utc with 2026-08-31T00:00:00Z the same call returns HTTP 200 with collection_status \"ELIGIBLE\" and suspension_reason null"
            - "the other precondition is independent: with the clock at 2026-08-31 but one required test still PENDING, the call returns HTTP 422 with error_id ERR_HEALTH_TESTS_NOT_CURRENT (priority 25 fires after 24)"

      - name: ejaculate_qc_evaluation_writes_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.Ejaculate.PENDING_QC_to_ACCEPTED
          - endpoints.POST_/genetics/ejaculates/{id}/qc-evaluation
          - validations.priority_27_ERR_QC_BELOW_THRESHOLD
        distinguishing_aspect: "Every field the transition promises is written in one call - qc_status, post_thaw_motility_pct, morphology_normal_pct, evaluated_by_user_id and qc_decided_at - and evaluated_by_user_id is the value the segregation-of-duties rule later reads at release."
        test_recipe:
          setup:
            - "One Ejaculate exists in PENDING_QC from a booking completed at clock 2026-09-01T08:00:00Z, with volume_ml 6.0, concentration_m_per_ml 1200 and total_doses_theoretical 480."
            - "The logical clock stands at 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "PENDING_QC" }
              as: LabTechnician
              captures: { ej_id: "$.data[0].id", doses: "$.data[0].total_doses_theoretical" }
          trigger:
            - call: "POST /genetics/ejaculates/${ej_id}/qc-evaluation"
              payload: { post_thaw_motility_pct: 55.0, morphology_normal_pct: 82.0, verdict: "ACCEPTED" }
              as: LabTechnician
              as_user_id: "lab-1"
          assert:
            - "${doses} == 480 (floor(6.0 * 1200 / 15))"
            - "HTTP 200; data.qc_status == \"ACCEPTED\", data.post_thaw_motility_pct == 55.0, data.morphology_normal_pct == 82.0"
            - "data.evaluated_by_user_id == \"lab-1\" and data.qc_decided_at == \"2026-09-01T08:00:00.000Z\""
            - "The stored evaluator gates release: POST /genetics/straw-lots/{id}/release as LabTechnician with X-User-ID lab-1 on a lot cut from this ejaculate returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES, while lab-2 succeeds"
            - "Below-threshold QC is a separate outcome: post_thaw_motility_pct 39.0 with verdict ACCEPTED returns HTTP 422 with error_id ERR_QC_BELOW_THRESHOLD and leaves qc_status PENDING_QC"

      - name: booking_transitions_from_terminal_states_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.CollectionBooking
          - validations.priority_17_ERR_BOOKING_STATE
        distinguishing_aspect: "From each of the booking's three terminal states every trigger not in the transition list is refused with ERR_BOOKING_STATE (409) - including the trigger that would have been legal from SCHEDULED."
        test_recipe:
          setup:
            - "Sire REG-SM3 is RESIDENT and ELIGIBLE at F-SM-03 with all four tests NEGATIVE until 2027-08-01."
            - "Booking B1 spans 2026-09-01T08:00:00Z - 2026-09-01T10:00:00Z and has been COMPLETED at clock 2026-09-01T08:00:00Z."
            - "Booking B2 spans 2026-09-20T08:00:00Z - 2026-09-20T10:00:00Z and has been CANCELLED."
          setup_api_calls:
            - call: "GET /genetics/collection-bookings"
              payload: { status: "COMPLETED" }
              as: ProgramDirector
              captures: { b1: "$.data[0].id", fac_id: "$.data[0].facility_id" }
            - call: "GET /genetics/collection-bookings"
              payload: { status: "CANCELLED" }
              as: ProgramDirector
              captures: { b2: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/collection-bookings/${b1}/cancel"
              payload: { cancel_reason: "OPERATOR_ERROR" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_BOOKING_STATE\": COMPLETED is terminal, so cancel is not available"
            - "CollectionBooking.${b1}.status == \"COMPLETED\" and cancel_reason == null - the refused call wrote nothing"
            - "the mirror case: POST /genetics/collection-bookings/${b2}/complete with a valid body returns HTTP 409 ERR_BOOKING_STATE"
            - "cancelling an already CANCELLED booking returns HTTP 409 ERR_BOOKING_STATE"
            - "No Ejaculate row was created by the refused complete: GET /genetics/ejaculates?booking_id=${b2} returns total_count == 0"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Facility
          - state_machines.Sire
          - state_machines.Tank
          - state_machines.GenomicEvaluation
        distinguishing_aspect: "Each entity's first observable status is the §1.2 initial_state and nothing further: a Facility is APPROVED, a Sire is PROSPECT on one dimension and NOT_HOUSED on the other, a Tank is IN_SERVICE, and a freshly created evaluation is DRAFT with no effect on the sire's published proof."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/facilities"
              payload: { code: "F-IS-01", country_code: "US", housing_capacity: 2, bench_capacity: 1 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-IS", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-IS", capacity_straws: 300, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-IS", breed: "ANGUS", birth_date: "2022-05-05", acquisition_cost_cents: 400000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id", s_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/genomic-evaluations"
              payload: { milk_kg: 700, fat_kg: 30, protein_kg: 24, somatic_cell_score: 2.95, fertility_pct: 1.0, longevity_months: 1.0, reliability_pct: 60, progeny_daughter_count: 0, effective_at: "2026-07-15T00:00:00Z", expected_sire_version: "${s_ver}" }
              as: ProgramDirector
              captures: { ev_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.status == \"DRAFT\" and data.published_at == null"
            - "Facility.${fac_id}.approval_status == \"APPROVED\"; Tank.${tank_id}.tank_status == \"IN_SERVICE\"; Sire.${s_id}.acquisition_status == \"PROSPECT\" and collection_status == \"NOT_HOUSED\""
            - "A DRAFT evaluation changes nothing on the sire: Sire.${s_id}.published_composite_index == 0.00 and published_evaluation_effective_at == null"
            - "GET /genetics/genomic-evaluations?sire_id=${s_id}&status=DRAFT returns total_count == 1"

      - name: retired_and_withdrawn_sire_accepts_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Sire.RESIDENT_to_RETIRED
          - state_machines.Sire.ELIGIBLE_to_WITHDRAWN
          - validations.priority_14_ERR_SIRE_ACQUISITION_STATE
          - validations.priority_15_ERR_SIRE_COLLECTION_STATE
        distinguishing_aspect: "One retire call lands both dimensions on their terminal states (RETIRED and WITHDRAWN) and every subsequent trigger on either dimension is refused - with the acquisition error for acquisition triggers and the collection error for collection triggers."
        test_recipe:
          setup:
            - "Sire REG-SM4 is RESIDENT and ELIGIBLE at F-SM-04 (resident_sire_count 1) with all four tests NEGATIVE until 2027-08-01."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/retire"
              payload: { retirement_reason: "AGE" }
              as: ProgramDirector
          assert:
            - "HTTP 200; data.acquisition_status == \"RETIRED\" and data.collection_status == \"WITHDRAWN\""
            - "data.housing_facility_id is retained for audit while Facility.${fac_id}.resident_sire_count == 0"
            - "acquisition lockdown: a second POST /genetics/sires/${s_id}/retire returns HTTP 409 ERR_SIRE_ACQUISITION_STATE, and POST /genetics/sires/${s_id}/house returns HTTP 409 ERR_SIRE_ACQUISITION_STATE"
            - "collection lockdown: POST /genetics/sires/${s_id}/collection-status with collection_status ELIGIBLE returns HTTP 409 ERR_SIRE_COLLECTION_STATE, and so does collection_status SUSPENDED"
            - "downstream lockdown: POST /genetics/collection-bookings for ${s_id} returns HTTP 409 ERR_SIRE_COLLECTION_STATE"
            - "Existing straw inventory is untouched by retirement: every RELEASED lot of this sire keeps distribution_status RELEASED and its dose buckets"

      - name: second_release_of_the_same_lot_returns_lot_state
        claim_type: idempotency
        grounds:
          - state_machines.StrawLot.QUARANTINE_to_RELEASED
          - validations.priority_19_ERR_LOT_STATE
        distinguishing_aspect: "Repeating a successful transition is an error, not a no-op: the second release is refused by the state rule at priority 19 - ahead of the segregation-of-duties rule at 22 - and no field, not even released_by_user_id, is overwritten."
        test_recipe:
          setup:
            - "One StrawLot of 200 straws is in QUARANTINE, cut from an ACCEPTED Ejaculate whose evaluated_by_user_id is lab-1."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "QUARANTINE" }
              as: LabTechnician
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /genetics/straw-lots/${lot_id}/release"
              payload: {}
              as: LabTechnician
              as_user_id: "lab-2"
          trigger:
            - call: "POST /genetics/straw-lots/${lot_id}/release"
              payload: {}
              as: LabTechnician
              as_user_id: "lab-3"
              captures: { err: "$.data.error_id" }
          assert:
            - "The setup release returned HTTP 200 with distribution_status \"RELEASED\" and released_by_user_id \"lab-2\""
            - "HTTP 409 with ${err} == \"ERR_LOT_STATE\" on the repeat"
            - "StrawLot.${lot_id}.released_by_user_id is still \"lab-2\" and version is unchanged by the refused call"
            - "priority order: the repeat is answered by the state rule even though lab-3 would also have passed the segregation check, and a repeat by lab-1 also returns ERR_LOT_STATE rather than ERR_SEGREGATION_OF_DUTIES"
            - "reject after release is refused too: POST /genetics/straw-lots/${lot_id}/reject returns HTTP 409 ERR_LOT_STATE"

      - name: facility_retire_keeps_resident_count_in_step
        claim_type: ledger_sync
        grounds:
          - entities.Facility.fields.resident_sire_count
          - endpoints.POST_/genetics/sires/{id}/house
          - endpoints.POST_/genetics/sires/{id}/retire
        distinguishing_aspect: "resident_sire_count is a derived ancestor field, not a stored counter the client sets: it rises on each house call, falls on each retire, and must reconcile exactly with the number of RESIDENT sires reachable by GET /genetics/sires?housing_facility_id=."
        test_recipe:
          setup:
            - "Facility F-LS-01 (US, APPROVED, housing_capacity 3) exists; sires REG-LS1 and REG-LS2 are CONTRACTED and NOT_HOUSED."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/facilities"
              payload: { code: "F-LS-01", country_code: "US", housing_capacity: 3, bench_capacity: 1 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-LS1", breed: "ANGUS", birth_date: "2022-01-01", acquisition_cost_cents: 300000 }
              as: ProgramDirector
              captures: { s1: "$.data.id" }
            - call: "POST /genetics/sires/${s1}/contract"
              payload: { contract_price_cents: 300000 }
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-LS2", breed: "ANGUS", birth_date: "2022-06-01", acquisition_cost_cents: 300000 }
              as: ProgramDirector
              captures: { s2: "$.data.id" }
            - call: "POST /genetics/sires/${s2}/contract"
              payload: { contract_price_cents: 300000 }
              as: ProgramDirector
            - call: "POST /genetics/sires/${s1}/house"
              payload: { facility_id: "${fac_id}", isolation_days: 21 }
              as: FacilityManager
              as_user_id: "${fac_id}"
            - call: "POST /genetics/sires/${s2}/house"
              payload: { facility_id: "${fac_id}", isolation_days: 21 }
              as: FacilityManager
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /genetics/sires/${s1}/retire"
              payload: { retirement_reason: "SOLD" }
              as: ProgramDirector
          assert:
            - "After the two house calls Facility.${fac_id}.resident_sire_count == 2"
            - "HTTP 200; Facility.${fac_id}.resident_sire_count == 1 after the trigger"
            - "The count reconciles with the rows: GET /genetics/sires?housing_facility_id=${fac_id}&acquisition_status=RESIDENT returns total_count == 1, and the same filter with RETIRED returns total_count == 1"
            - "The capacity rule reads the derived count: a third and fourth house call succeed and fail respectively, the fourth returning HTTP 422 ERR_FACILITY_AT_CAPACITY against housing_capacity 3"

      - name: facility_suspension_voids_only_non_terminal_bookings
        claim_type: conditional_cascade
        grounds:
          - state_machines.CollectionBooking.SCHEDULED_to_VOIDED
          - state_machines.Facility.APPROVED_to_SUSPENDED
        distinguishing_aspect: "The cascade is conditional on the child's state: SCHEDULED bookings are voided while COMPLETED and CANCELLED ones are left exactly as they are. A cascade that rewrites terminal children would be observable as a status change on the completed row."
        test_recipe:
          setup:
            - "Facility F-CC-01 (US, APPROVED, bench_capacity 2) hosts REG-CC1, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01."
            - "Booking BK-DONE spans 2026-09-01T08:00:00Z - 2026-09-01T10:00:00Z and is COMPLETED; booking BK-CANC spans 2026-09-08T08:00:00Z - 2026-09-08T10:00:00Z and is CANCELLED; booking BK-FUT spans 2026-09-20T08:00:00Z - 2026-09-20T10:00:00Z and is SCHEDULED."
            - "The logical clock stands at 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/collection-bookings"
              payload: { status: "SCHEDULED" }
              as: ProgramDirector
              captures: { bk_fut: "$.data[0].id", fac_id: "$.data[0].facility_id", s_id: "$.data[0].sire_id" }
            - call: "GET /genetics/collection-bookings"
              payload: { status: "COMPLETED" }
              as: ProgramDirector
              captures: { bk_done: "$.data[0].id" }
            - call: "GET /genetics/collection-bookings"
              payload: { status: "CANCELLED" }
              as: ProgramDirector
              captures: { bk_canc: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/facilities/${fac_id}/approval-status"
              payload: { approval_status: "SUSPENDED", suspension_reason: "REGULATOR_HOLD" }
              as: ProgramDirector
          assert:
            - "HTTP 200; CollectionBooking.${bk_fut}.status == \"VOIDED\""
            - "CollectionBooking.${bk_done}.status == \"COMPLETED\" and completed_at is unchanged; CollectionBooking.${bk_canc}.status == \"CANCELLED\" with its original cancel_reason"
            - "Sire.${s_id}.collection_status == \"SUSPENDED\" with suspension_reason FACILITY_SUSPENDED"
            - "reinstating the facility does not undo the void: POST /genetics/facilities/${fac_id}/approval-status with approval_status APPROVED leaves ${bk_fut} VOIDED and Sire.${s_id} SUSPENDED until an explicit collection-status call"
            - "after that explicit POST /genetics/sires/${s_id}/collection-status with collection_status ELIGIBLE, the sire is ELIGIBLE again and a fresh booking can be created"

      - name: straw_lot_becomes_depleted_when_every_dose_bucket_empties
        claim_type: bubble_up
        grounds:
          - state_machines.StrawLot.RELEASED_to_DEPLETED
          - calculations.lot_dose_ledger
          - calculations.plant_inventory_value
        distinguishing_aspect: "The parent lot's status is derived from its children's dose movements rather than from any operator call: once available, reserved and consigned all reach 0 through a report-usage, the lot flips to DEPLETED and drops out of the plant valuation source set."
        test_recipe:
          setup:
            - "A CONVENTIONAL StrawLot of 100 straws is RELEASED with unit_book_value_cents 1250 and doses_available 100."
            - "Distributor D-BU (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-BU (capacity_straws 300, IN_SERVICE)."
            - "The whole lot has been consigned: a 100-dose transfer at unit_price_cents 4000 is RECEIVED, so doses_consigned is 100 and doses_available is 0."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-BU", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-BU", capacity_straws: 300, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 100, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/dispatch"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/report-usage"
              payload: { doses_used: 100, doses_returned: 0 }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "Before the trigger: StrawLot.${lot_id}.distribution_status == \"RELEASED\", doses_available == 0, doses_consigned == 100 - not yet DEPLETED, because consigned doses still exist"
            - "HTTP 200; StrawLot.${lot_id}.distribution_status == \"DEPLETED\" with doses_available 0, doses_reserved 0, doses_consigned 0, doses_used 100, doses_destroyed 0"
            - "GET /genetics/inventory-valuation reports plant_inventory_value_cents == 0 and lot_count == 0 - a DEPLETED lot leaves the source set entirely"
            - "DEPLETED is terminal: a further consignment request against this lot returns HTTP 409 with error_id ERR_LOT_NOT_RELEASED"
            - "settlement figures are unaffected by the status flip: gross_cents == 400000, service_fee_cents == 0, rebate_cents == 0 and settlement_total_cents == 400000 (no ln2-service happened after dispatch, and 400000 is below the 500000 tier)"

      - name: parallel_dimensions_move_independently_on_the_sire
        claim_type: parallel
        grounds:
          - state_machines.Sire
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / sire_acquisition_and_collection_dimensions_move_independently
          rationale: "The named §1.8 instance drives both dimensions through independent trigger sequences and asserts each combined state, which is exactly this claim."

      - name: certificate_cycle_terminates_at_three_submission_rounds
        claim_type: cyclic
        grounds:
          - state_machines.ExportCertificate.REJECTED_to_SUBMITTED
          - validations.priority_48_ERR_RESUBMISSION_LIMIT
        excluded_because:
          difficulty_instance: non_linear_state_machine / certificate_reject_resubmit_cycle_capped_at_three_rounds
          rationale: "The named §1.8 instance walks the submit/reject loop to its cap and asserts the termination condition."

      - name: facility_suspension_cascades_down_to_sires_and_certificates
        claim_type: cascade_down
        grounds:
          - state_machines.Facility.APPROVED_to_SUSPENDED
          - state_machines.ExportCertificate.ISSUED_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / facility_suspension_sire_certificate_chain_depth_three
          rationale: "The named §1.8 instance asserts each hop of the same cascade, including the revocation_reason on the certificate."

      - name: evaluation_rollback_reverses_every_publication_side_effect
        claim_type: compensation
        grounds:
          - state_machines.GenomicEvaluation.PUBLISHED_to_ROLLED_BACK
        excluded_because:
          difficulty_instance: compensating_invariant / inventory_cents_conserved_across_publish_and_rollback
          rationale: "The named §1.8 instance asserts the restored snapshot field by field and the conserved plant valuation, with no drift."

      - name: proof_publication_updates_derived_inventory_values
        claim_type: cross_entity
        grounds:
          - state_machines.GenomicEvaluation.DRAFT_to_PUBLISHED
        excluded_because:
          difficulty_instance: transitive_cascade / proof_publication_revaluation_chain_depth_four
          rationale: "The named §1.8 instance verifies the state and fields of every downstream entity the publication touches."

  - section: calculations
    instances:
      - name: sire_index_weighted_scoring_computes_subindices_and_blend
        claim_type: correct_result
        grounds:
          - calculations.sire_genetic_index
          - entities.GenomicEvaluation.fields.composite_index
        distinguishing_aspect: "One fully specified trait payload exercises every constant in the weighted score at once: three production weights, three health terms, the reliability shrink and the genomic-only blend, with the pedigree parents absent so parent_average_index is 0.00 over a divisor of 2 rather than a skipped term."
        test_recipe:
          setup:
            - "One Sire REG-CALC1 exists with no sire_id and no dam_sire_id; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-CALC1", breed: "HOLSTEIN", birth_date: "2022-01-10", acquisition_cost_cents: 900000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id", s_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/genomic-evaluations"
              payload: { milk_kg: 1000, fat_kg: 40, protein_kg: 30, somatic_cell_score: 2.95, fertility_pct: 1.5, longevity_months: 2.0, reliability_pct: 80, progeny_daughter_count: 0, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${s_ver}" }
              as: ProgramDirector
              captures: { ev_id: "$.data.id" }
          assert:
            - "HTTP 201; data.production_index == 54.40 - production_raw = 0.02*1000 + 0.60*40 + 0.80*30 = 68.00, shrink = 80/100 = 0.80"
            - "data.health_index == 41.60 - health_raw = 8.0*(3.00-2.95)*100 + 6.0*1.5 + 1.5*2.0 = 40.00 + 9.00 + 3.00 = 52.00, times the same 0.80"
            - "data.evaluation_basis == \"GENOMIC_ONLY\" and data.parent_average_weight == 0.50 (progeny_daughter_count 0 is below the 50-daughter boundary)"
            - "data.parent_average_index == 0.00 - both parents are null, each contributing 0.00 over a divisor that stays 2"
            - "data.composite_index == 24.64 - 0.50 * (0.60*54.40 + 0.40*41.60) + 0.50 * 0.00 = 0.50 * 49.28"
            - "data.status == \"DRAFT\", data.revaluation_delta_cents == 0, data.published_at == null; Sire.${s_id}.published_composite_index is still 0.00"
            - "Sire.${s_id}.version == 2 - filing an evaluation increments the parent sire's version even though no published_* field moved"

      - name: sire_index_rounds_subindices_before_blending
        claim_type: precision
        grounds:
          - calculations.sire_genetic_index
          - calculations.sire_genetic_index.precision
        distinguishing_aspect: "The rounding order is observable: both sub-indices land exactly on a half-cent boundary, so composing the blend from the ROUNDED sub-indices yields 18.01 while composing it from the unrounded products yields 18.00. Only the pinned order gives 18.01."
        test_recipe:
          setup:
            - "One Sire REG-CALC2 exists with no pedigree parents; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-CALC2", breed: "JERSEY", birth_date: "2022-03-03", acquisition_cost_cents: 500000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id", s_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/genomic-evaluations"
              payload: { milk_kg: 1000.5, fat_kg: 100, protein_kg: 0, somatic_cell_score: 2.95, fertility_pct: 3.0, longevity_months: 1.34, reliability_pct: 50, progeny_daughter_count: 0, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${s_ver}" }
              as: ProgramDirector
          assert:
            - "HTTP 201; production_raw = 0.02*1000.5 + 0.60*100 + 0.80*0 = 20.01 + 60.00 = 80.01 and shrink = 0.50, so the unrounded product is exactly 40.005 and data.production_index == 40.01 (round_half_up, not 40.00)"
            - "health_raw = 8.0*(3.00-2.95)*100 + 6.0*3.0 + 1.5*1.34 = 40.00 + 18.00 + 2.01 = 60.01, so the unrounded product is exactly 30.005 and data.health_index == 30.01"
            - "data.composite_index == 18.01: 0.50 * (0.60*40.01 + 0.40*30.01) = 0.50 * (24.006 + 12.004) = 0.50 * 36.010 = 18.005, rounded half-up"
            - "An implementation that blends the unrounded 40.005 and 30.005 gets 0.50 * 36.005 = 18.0025 and reports 18.00 - that value is wrong"
            - "Every reported figure carries exactly 2 decimal places, including the trailing zero case: a payload with reliability_pct 50, milk_kg 1000, fat_kg 40, protein_kg 20, somatic_cell_score 2.90, fertility_pct 0, longevity_months 0 gives production_index 30.00, health_index 40.00 and composite_index 17.00"

      - name: market_revaluation_applies_product_multiplier_purity_and_floor
        claim_type: constants_applied
        grounds:
          - calculations.lot_unit_book_value.constants
          - endpoints.POST_/genetics/genomic-evaluations/{id}/publish
        distinguishing_aspect: "One publication values four lots of one sire, so the three PRODUCT_MULTIPLIER entries and the SEXED purity ratio are all read off the same published_composite_index; a second, weaker proof then drives the CONVENTIONAL lot under MARKET_FLOOR_CENTS so the floor is observable rather than inferred."
        test_recipe:
          setup:
            - "Sire REG-CALC3 is RESIDENT and ELIGIBLE with a completed booking whose Ejaculate is ACCEPTED with volume_ml 6.0 and concentration_m_per_ml 1200, so total_doses_theoretical is 480."
            - "Four QUARANTINE lots of 100 straws each were cut from it, every one with processing_cost_cents 250000: L-CONV (CONVENTIONAL), L-SX90 (SEXED, sexing_purity_pct 90.0), L-SX72 (SEXED, sexing_purity_pct 72.0) and L-EMB (EMBRYO)."
            - "A DRAFT GenomicEvaluation E1 for this sire carries composite_index 24.64 (the payload of sire_index_weighted_scoring_computes_subindices_and_blend); a second DRAFT E2 carries composite_index 17.00."
          setup_api_calls:
            - call: "GET /genetics/genomic-evaluations"
              payload: { status: "DRAFT", limit: 2 }
              as: ProgramDirector
              captures: { e1: "$.data[0].id", s_id: "$.data[0].sire_id" }
            - call: "GET /genetics/straw-lots"
              payload: { sire_id: "${s_id}", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { l_conv: "$.data[0].id", conv_unit: "$.data[0].unit_book_value_cents" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${e1}/publish"
              payload: { publication_note: "August proof run" }
              as: ProgramDirector
          assert:
            - "before the trigger ${conv_unit} == 2500 with valuation_basis STANDARD_COST - 250000 / 100 straws"
            - "HTTP 200; Sire.${s_id}.published_composite_index == 24.64"
            - "L-CONV: unit_book_value_cents == 1109 - round_half_up(45 * 24.64 * 1.00) = round_half_up(1108.80); valuation_basis == \"MARKET_REVALUED\"; pre_revaluation_unit_value_cents == 2500"
            - "L-SX90: unit_book_value_cents == 2051 - 1108.80 * 1.85 * (90.0/90.0) = 2051.28"
            - "L-SX72: unit_book_value_cents == 1641 - 1108.80 * 1.85 * (72.0/90.0) = 1641.024, so the purity ratio is applied and not ignored"
            - "L-EMB: unit_book_value_cents == 3770 - 1108.80 * 3.40 = 3769.92"
            - "the floor: publishing the weaker proof E2 (composite_index 17.00) revalues the same four lots to 800, 1415, 1132 and 2601 - the CONVENTIONAL raw 45*17.00 = 765 is lifted to MARKET_FLOOR_CENTS 800, while SEXED at 90.0 purity gives 765*1.85 = 1415.25 -> 1415, SEXED at 72.0 gives 765*1.85*0.8 = 1132.20 -> 1132 and EMBRYO 765*3.40 = 2601"

      - name: plant_valuation_source_set_excludes_rejected_lots
        claim_type: input_set_filtering
        grounds:
          - calculations.plant_inventory_value.input_set
          - endpoints.GET_/genetics/inventory-valuation
        distinguishing_aspect: "The aggregate is over QUARANTINE and RELEASED lots only, and it is correct both after an addition and after the reversal that a rejection represents: a condemned lot's stored unit_book_value_cents survives on the row but contributes nothing, because its doses have moved into doses_destroyed."
        test_recipe:
          setup:
            - "One ACCEPTED Ejaculate with total_doses_theoretical 480 has three lots cut from it, all CONVENTIONAL: L1 100 straws at processing_cost_cents 250000 (unit 2500), L2 200 straws at 250000 (unit 1250) and L3 100 straws at 100000 (unit 1000)."
            - "L2 has been released; L1 and L3 are still in QUARANTINE."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "QUARANTINE", limit: 10 }
              as: ProgramDirector
              captures: { l1: "$.data[0].id", l3: "$.data[1].id" }
            - call: "GET /genetics/inventory-valuation"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/straw-lots/${l3}/reject"
              payload: { rejected_reason: "TANK_EXCURSION" }
              as: LabTechnician
              as_user_id: "lab-4"
          assert:
            - "the setup read reports plant_inventory_value_cents == 600000 (2500*100 + 1250*200 + 1000*100), quarantine_value_cents == 350000, released_value_cents == 250000 and lot_count == 3"
            - "HTTP 200; StrawLot.${l3}.distribution_status == \"REJECTED\", doses_available == 0, doses_destroyed == 100 and unit_book_value_cents is still 1000 - the value is retained on the row"
            - "GET /genetics/inventory-valuation now reports plant_inventory_value_cents == 500000, quarantine_value_cents == 250000, released_value_cents == 250000 and lot_count == 2 - the fall is exactly the 100000 the rejected lot contributed"
            - "the split is by status, not by age: releasing L1 afterwards leaves plant_inventory_value_cents at 500000 while quarantine_value_cents becomes 0 and released_value_cents becomes 500000"
            - "consumed doses never count: after a 200-dose consignment of L2 is reconciled with 200 doses used, L2 leaves the set as DEPLETED and plant_inventory_value_cents falls to 250000"

      - name: tank_ln2_decay_floors_partial_days_and_restarts_on_service
        claim_type: decay_function
        grounds:
          - calculations.tank_ln2_level
          - endpoints.POST_/genetics/tanks/{id}/ln2-service
        distinguishing_aspect: "The decay is a whole-day step function, so a half day past a boundary reads the same as the boundary itself; and the calendar arm of the status rule can fire while the level arm is still comfortable, which distinguishes SERVICE_DUE-by-date from SERVICE_DUE-by-level."
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Distributor D-LN2 (US, credit_limit_cents 5000000, consignment_enabled true) owns Tank TK-LN2 with capacity_straws 500, service_interval_days 10 and initial_fill_pct 95.0."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/distributors"
              payload: { name: "D-LN2", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-LN2", capacity_straws: 500, service_interval_days: 10, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id", due: "$.data.next_service_due_at", lvl0: "$.data.ln2_level_pct" }
          trigger:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T12:00:00Z" }
              as: ProgramDirector
          assert:
            - "at creation ${lvl0} == 95.0, ${due} == \"2026-08-11T00:00:00.000Z\" (last_service_at + 10 * 86400) and tank_status == \"IN_SERVICE\" with service_count 0"
            - "HTTP 200; Tank.${tank_id}.ln2_level_pct == 75.0 - elapsed_days = floor(10.5) = 10, so 95.0 - 2.0*10; the extra 12 hours decay nothing"
            - "Tank.${tank_id}.tank_status == \"SERVICE_DUE\" because the clock has passed next_service_due_at, even though 75.0 is far above the 25.0 level threshold; ${tank_id} appears in the response's service_due_tank_ids"
            - "the curve restarts at the service, not at the old origin: POST /genetics/tanks/${tank_id}/ln2-service with fill_pct 60.0 at clock 2026-08-11T12:00:00Z gives ln2_level_pct 60.0, service_count 1, last_service_fill_pct 60.0, next_service_due_at 2026-08-21T12:00:00.000Z and tank_status IN_SERVICE"
            - "advancing the clock to 2026-08-14T12:00:00Z then gives ln2_level_pct 54.0 (60.0 - 2.0*3), not 67.0 and not 69.0 - the pre-service origin of 95.0 is gone"
            - "the floor at zero holds: advancing to 2026-09-11T12:00:00Z gives ln2_level_pct 0.0, never negative, and tank_status OUT_OF_SERVICE"

      - name: straw_lot_cutting_stops_at_the_theoretical_dose_cap
        claim_type: threshold
        grounds:
          - calculations.ejaculate_theoretical_doses
          - validations.priority_41_ERR_DOSE_CAP_EXCEEDED
        distinguishing_aspect: "The cap is a running sum over the ejaculate's lots including the row being created, so it is tested one straw below, exactly at and one straw above the ceiling - and the boundary is inclusive, which a strict comparison would get wrong."
        test_recipe:
          setup:
            - "One Ejaculate is ACCEPTED with volume_ml 6.0 and concentration_m_per_ml 1200, so total_doses_theoretical == floor(7200/15) == 480."
            - "A first CONVENTIONAL lot of 400 straws has already been cut from it, leaving 80 doses of headroom."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "ACCEPTED" }
              as: LabTechnician
              captures: { ej_id: "$.data[0].id", cap: "$.data[0].total_doses_theoretical" }
          trigger:
            - call: "POST /genetics/ejaculates/${ej_id}/straw-lots"
              payload: { product_line: "CONVENTIONAL", straw_count: 81, processing_cost_cents: 81000 }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "${cap} == 480"
            - "HTTP 422 with ${err} == \"ERR_DOSE_CAP_EXCEEDED\": 400 + 81 = 481 exceeds 480, and no StrawLot row was created"
            - "GET /genetics/straw-lots?ejaculate_id=${ej_id} still returns total_count == 1"
            - "exactly at the cap succeeds: the same call with straw_count 80 returns HTTP 201 with unit_book_value_cents == round_half_up(81000/80) == 1013 and the ejaculate's lots now sum to exactly 480"
            - "one straw past a filled cap fails: a further call with straw_count 1 returns HTTP 422 ERR_DOSE_CAP_EXCEEDED"
            - "the cap counts condemned straws too - rejecting the 80-straw lot does not restore headroom, so the straw_count 1 call still returns ERR_DOSE_CAP_EXCEEDED"

      - name: settlement_bills_only_ln2_services_performed_after_dispatch
        claim_type: waterfall_allocation
        grounds:
          - calculations.consignment_settlement
          - entities.ConsignmentTransfer.fields.tank_service_count_at_dispatch
        distinguishing_aspect: "service_fee_cents is keyed on the tank counter DELTA since dispatch, not on the tank's lifetime service_count: a top-up performed before dispatch is invisible to the invoice, and the two performed afterwards are billed once each."
        test_recipe:
          setup:
            - "Distributor D-STL (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-STL (capacity_straws 500, IN_SERVICE)."
            - "A RELEASED CONVENTIONAL lot of 200 straws with unit_book_value_cents 1250 exists, its sire's four required tests all NEGATIVE until 2027-08-01."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-STL", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-STL", capacity_straws: 500, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/tanks/${tank_id}/ln2-service"
              payload: { fill_pct: 98.0 }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { sc1: "$.data.service_count" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 100, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/dispatch"
              payload: {}
              as: ProgramDirector
              captures: { pinned: "$.data.tank_service_count_at_dispatch" }
            - call: "POST /genetics/tanks/${tank_id}/ln2-service"
              payload: { fill_pct: 97.0 }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /genetics/tanks/${tank_id}/ln2-service"
              payload: { fill_pct: 96.0 }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { sc3: "$.data.service_count" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/report-usage"
              payload: { doses_used: 100, doses_returned: 0 }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "${sc1} == 1, ${pinned} == 1 and ${sc3} == 3 - one service before dispatch and two after it"
            - "HTTP 200; data.gross_cents == 400000 (100 * 4000)"
            - "data.service_fee_cents == 24000 - 12000 * (3 - 1); the pre-dispatch service is excluded, so 36000 is wrong"
            - "the tier key is the pre-rebate subtotal 400000 + 24000 = 424000, which is below the 500000 tier, so data.rebate_cents == 0 and data.settlement_total_cents == 424000"
            - "Distributor.${dist_id}.outstanding_balance_cents == 424000, cumulative_doses_used == 100 and consignment_value_cents == 0 (a RECONCILED row carries no value)"
            - "the rebate never touches the fee: with doses_used 125 the subtotal is 500000 + 24000 = 524000, rebate_cents == round_half_up(500000 * 0.03) == 15000 and settlement_total_cents == 509000 - the fee is not discounted"

      - name: inbreeding_collapses_repeat_paths_and_truncates_at_depth_three
        claim_type: topological
        grounds:
          - calculations.inbreeding_coefficient
          - calculations.inbreeding_coefficient.constants.PEDIGREE_MAX_DEPTH
        distinguishing_aspect: "An ancestor reachable by two different paths is counted once at its SHORTEST distance, and an ancestor more than PEDIGREE_MAX_DEPTH edges from the candidate drops out even though it is still inside the dam's own three-generation window."
        test_recipe:
          setup:
            - "Sire REG-IBC is RESIDENT, ELIGIBLE, has a PUBLISHED proof and owns a RELEASED CONVENTIONAL lot with doses_available 100."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-G", breed: "HOLSTEIN", birth_date: "2012-01-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { g_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-A", breed: "HOLSTEIN", birth_date: "2016-01-01", sire_id: "${g_id}", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { a_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-B", breed: "HOLSTEIN", birth_date: "2016-06-01", sire_id: "${g_id}", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { b_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-D", breed: "HOLSTEIN", birth_date: "2017-01-01", sire_id: "${g_id}", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { d_id: "$.data.id" }
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { c_id: "$.data[0].id" }
            - call: "POST /genetics/sires/${c_id}/pedigree"
              payload: { sire_id: "${a_id}", dam_sire_id: "${b_id}" }
              as: ProgramDirector
              captures: { depth: "$.data.pedigree_depth" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-IBC", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/customer-herds"
              payload: { herd_name: "Willow Creek", distributor_id: "${dist_id}", country_code: "US", target_product_line: "CONVENTIONAL", max_inbreeding_pct: 10.0 }
              as: BreedingAdvisor
              captures: { herd_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/customer-herds/${herd_id}/mating-recommendations"
              payload: { dam_ref: "COW-4471", dam_sire_id: "${d_id}", requested_product_line: "CONVENTIONAL", doses_requested: 1 }
              as: BreedingAdvisor
              captures: { rec_id: "$.data.id", f_pct: "$.data.inbreeding_pct" }
          assert:
            - "the candidate's pedigree is a diamond: REG-G is reached both through REG-A and through REG-B, so ancestors(candidate) records it once at distance 2, and ${depth} == 3"
            - "HTTP 201; ${f_pct} == 3.13 - the only shared ancestor is REG-G with n1 = 2 and n2 = dam[G] + 1 = 2, giving 0.5^(2+2+1) = 0.03125 and round_half_up(3.125, 2)"
            - "counting REG-G once per path would give 6.25 and is wrong; the shortest-distance collapse is what makes the traversal order-independent"
            - "data.recommended_sire_id == ${c_id}, data.candidate_pool_size == 1 and data.status == \"PROPOSED\""
            - "depth truncation: after registering REG-GG (no parents) and amending REG-G with POST /genetics/sires/${g_id}/pedigree { sire_id: REG-GG }, a fresh recommendation on the same dam reports inbreeding_pct 3.91 - REG-GG sits 3 edges from the candidate and 2 from the dam's sire, adding 0.5^(3+3+1) = 0.0078125 for a total of 3.90625"
            - "one edge further is silent: giving REG-GG its own sire REG-GGG puts that animal 4 edges from the candidate, so a later recommendation still reports 3.91 even though REG-GGG is only 3 edges from the dam's sire"
            - "no maternal grandsire, no coefficient: the same call with dam_sire_id omitted reports inbreeding_pct 0.00"

      - name: mating_selector_ranks_by_index_then_breaks_ties_on_created_at
        claim_type: chronological
        grounds:
          - calculations.mating_sire_selector
          - endpoints.POST_/genetics/customer-herds/{id}/mating-recommendations
        distinguishing_aspect: "Two candidates with an identical published_composite_index and an identical inbreeding_pct are separated by Sire.created_at ASC and never by id; within the chosen sire the lot is picked by doses_available DESC and only then by created_at."
        test_recipe:
          setup:
            - "Sires REG-SEL1 (created first) and REG-SEL2 are both RESIDENT and ELIGIBLE and both carry a PUBLISHED proof with composite_index 24.64."
            - "REG-SEL1 owns two RELEASED CONVENTIONAL lots: L-A created first with doses_available 150, and L-B with doses_available 100. REG-SEL2 owns one RELEASED CONVENTIONAL lot with doses_available 200."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE", limit: 2, offset: 0 }
              as: ProgramDirector
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", idx1: "$.data[0].published_composite_index" }
            - call: "GET /genetics/straw-lots"
              payload: { sire_id: "${s1}", distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { la: "$.data[0].id", la_doses: "$.data[0].doses_available" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-SEL", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/customer-herds"
              payload: { herd_name: "Elm Ridge", distributor_id: "${dist_id}", country_code: "US", target_product_line: "CONVENTIONAL", max_inbreeding_pct: 5.0 }
              as: BreedingAdvisor
              captures: { herd_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/customer-herds/${herd_id}/mating-recommendations"
              payload: { dam_ref: "COW-1200", requested_product_line: "CONVENTIONAL", doses_requested: 10 }
              as: BreedingAdvisor
              captures: { rec_id: "$.data.id", picked: "$.data.recommended_sire_id", picked_lot: "$.data.straw_lot_id" }
          assert:
            - "${idx1} == 24.64 and ${la_doses} == 150"
            - "HTTP 201; data.candidate_pool_size == 2 - both sires clear residency, collection status, proof and stock"
            - "${picked} == ${s1}: the composite indices tie at 24.64 and both inbreeding_pct values are 0.00 (no dam_sire_id), so the earlier created_at wins"
            - "${picked_lot} == ${la}: within REG-SEL1 the lot with the most doses_available is chosen, not the earliest-created one"
            - "data.inbreeding_pct == 0.00 and data.doses_committed == 0 - nothing is reserved until the decision call"
            - "the exclusion list re-ranks: the same call with excluded_sire_ids [${s1}] returns recommended_sire_id ${s2} and candidate_pool_size 1"
            - "stock is part of eligibility, not a post-filter: the same call with doses_requested 160 returns recommended_sire_id ${s2} and candidate_pool_size 1, because no lot of REG-SEL1 holds 160 available doses"

      - name: certificate_expiry_is_the_intersection_of_satisfying_test_windows
        claim_type: interval_merge
        grounds:
          - calculations.certificate_export_compliance
          - endpoints.POST_/genetics/export-certificates/{id}/issue
        distinguishing_aspect: "Per required test_type the row with the LATEST valid_until is chosen, and expires_at is then the MINIMUM across those chosen rows - an intersection of windows, not the latest date on file and not the certificate's own issue date plus a fixed term."
        test_recipe:
          setup:
            - "Facility F-EXP (US, approved_export_countries [\"CA\"]) houses sire REG-EXP with isolation_days_applied 30; a RELEASED CONVENTIONAL lot of that sire was cut from a booking at F-EXP."
            - "CountryRequirement CA declares required_test_types [IBR, BVD], max_test_age_days 30, min_isolation_days 21, sexed_semen_allowed false, embryo_allowed false."
            - "HealthTest rows for REG-EXP, all NEGATIVE and all recorded by vet-1: IBR sampled 2026-08-01 with validity_days 365 (valid_until 2027-08-01T00:00:00.000Z), BVD sampled 2026-08-01 with validity_days 180 (valid_until 2027-01-28T00:00:00.000Z) and a second BVD sampled 2026-08-05 with validity_days 200 (valid_until 2027-02-21T00:00:00.000Z). BLUETONGUE and TRICHOMONIASIS are also NEGATIVE and current."
            - "A certificate binding REG-EXP, that lot and the CA requirement has been submitted, so it is SUBMITTED with submission_round 1. The logical clock stands at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/export-certificates"
              payload: { status: "SUBMITTED" }
              as: ExportCoordinator
              captures: { cert_id: "$.data[0].id", sire_id: "$.data[0].sire_id" }
            - call: "GET /genetics/health-tests"
              payload: { sire_id: "${sire_id}", test_type: "BVD", result: "NEGATIVE" }
              as: ExportCoordinator
              captures: { bvd1_until: "$.data[0].valid_until", bvd2_until: "$.data[1].valid_until" }
          trigger:
            - call: "POST /genetics/export-certificates/${cert_id}/issue"
              payload: { issue_note: "CA consignment" }
              as: StaffVeterinarian
              as_user_id: "vet-9"
          assert:
            - "${bvd1_until} == \"2027-01-28T00:00:00.000Z\" and ${bvd2_until} == \"2027-02-21T00:00:00.000Z\""
            - "HTTP 200; data.status == \"ISSUED\", data.issued_by_user_id == \"vet-9\" and data.issued_at == \"2026-08-20T00:00:00.000Z\""
            - "data.expires_at == \"2027-02-21T00:00:00.000Z\" - for BVD the later of the two windows is chosen, and that date is then the earlier of {IBR 2027-08-01, BVD 2027-02-21}"
            - "the IBR window never sets expires_at even though it is the latest date on file; and had the second BVD test not existed, expires_at would be 2027-01-28T00:00:00.000Z"
            - "age matters as well as expiry: a destination whose max_test_age_days is 10 leaves both BVD rows too old at the 2026-08-20 clock, and issue returns HTTP 422 with error_id ERR_COUNTRY_TEST_MISSING"
            - "the four base test types are not the destination's list: BLUETONGUE and TRICHOMONIASIS are irrelevant to expires_at, which stays 2027-02-21T00:00:00.000Z whatever their valid_until"

      - name: distributor_exposure_counts_only_received_and_reconciled_transfers
        claim_type: aggregation
        grounds:
          - calculations.distributor_exposure.input_set
          - entities.Distributor.fields.consignment_value_cents
        distinguishing_aspect: "The two exposure aggregates read disjoint status sets - carried value from RECEIVED rows and outstanding balance from RECONCILED rows - so a single transfer moves its contribution from one bucket to the other rather than counting in both, and REQUESTED, APPROVED and IN_TRANSIT rows contribute nothing at all."
        test_recipe:
          setup:
            - "A RELEASED CONVENTIONAL lot of 200 straws has unit_book_value_cents 1250; its sire's four required tests are NEGATIVE until 2027-08-01."
            - "Distributor D-EXPO (US, credit_limit_cents 365000, consignment_enabled true) owns Tank TK-EXPO (capacity_straws 500, IN_SERVICE)."
            - "A 100-dose transfer at unit_price_cents 4000 has been approved, dispatched and received; no liquid-nitrogen service has been performed on the tank since dispatch."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "RECEIVED" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", dist_id: "$.data[0].distributor_id", carried: "$.data[0].carried_value_cents" }
            - call: "GET /genetics/distributors/${dist_id}"
              payload: {}
              as: ProgramDirector
              captures: { cv: "$.data.consignment_value_cents", ob: "$.data.outstanding_balance_cents" }
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/report-usage"
              payload: { doses_used: 60, doses_returned: 40 }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "before the trigger ${carried} == 125000 (100 doses on hand * 1250), ${cv} == 125000 and ${ob} == 0"
            - "HTTP 200; data.status == \"RECONCILED\", data.doses_on_hand == 0, data.carried_value_cents == 0, data.gross_cents == 240000, data.service_fee_cents == 0, data.rebate_cents == 0 and data.settlement_total_cents == 240000"
            - "Distributor.${dist_id}.consignment_value_cents == 0, outstanding_balance_cents == 240000 and cumulative_doses_used == 60 - the contribution moved buckets instead of being counted twice"
            - "the lot conserves its straws: doses_available == 140, doses_consigned == 0, doses_used == 60, doses_reserved == 0, doses_destroyed == 0, summing to 200"
            - "pending statuses are invisible: a fresh 100-dose request against the same lot leaves consignment_value_cents at 0 while it is REQUESTED, and still 0 once APPROVED and once IN_TRANSIT"
            - "the credit gate is inclusive at the limit: approving that fresh 100-dose request projects 240000 + 100*1250 == 365000, exactly credit_limit_cents, and succeeds - while a 101-dose request projects 366250 and is refused with HTTP 422 ERR_CREDIT_LIMIT_EXCEEDED"

      - name: conception_rate_clamped_to_the_floor_after_multiplication
        claim_type: threshold
        grounds:
          - calculations.expected_conception_rate
          - calculations.expected_conception_rate.constants
        distinguishing_aspect: "The clamp is applied AFTER the whole product and BEFORE the 4-dp rounding, so a genuinely computed 0.1697 is reported as the floor 0.2000 while an unclamped mid-range case rounds normally - clamping the individual factors instead would produce neither figure."
        test_recipe:
          setup:
            - "Sire REG-CR is RESIDENT, ELIGIBLE and carries a PUBLISHED proof with composite_index 24.64."
            - "Two ejaculates of that sire are ACCEPTED: E-LOW with post_thaw_motility_pct 40.0 and E-MID with post_thaw_motility_pct 60.0."
            - "A RELEASED EMBRYO lot of 100 straws was cut from E-LOW and a RELEASED CONVENTIONAL lot of 100 straws from E-MID."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { product_line: "EMBRYO", distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { emb_lot: "$.data[0].id", s_id: "$.data[0].sire_id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-CR", country_code: "US", credit_limit_cents: 5000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/customer-herds"
              payload: { herd_name: "Cedar Hollow", distributor_id: "${dist_id}", country_code: "US", target_product_line: "EMBRYO", max_inbreeding_pct: 6.25 }
              as: BreedingAdvisor
              captures: { herd_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/customer-herds/${herd_id}/mating-recommendations"
              payload: { dam_ref: "COW-88", requested_product_line: "EMBRYO", doses_requested: 1 }
              as: BreedingAdvisor
              captures: { cr: "$.data.expected_conception_rate", lot: "$.data.straw_lot_id" }
          assert:
            - "HTTP 201; ${lot} == ${emb_lot} and data.recommended_sire_id == ${s_id}"
            - "the raw product is 0.42 * (1 + 0.0004*24.64) * (40.0/100) * (1 - 0.012*0.00) = 0.42 * 1.009856 * 0.40 = 0.169655808"
            - "${cr} == 0.2000 - below CR_FLOOR, so the clamp fires; 0.1697 would mean the clamp was skipped and 0.2 with fewer digits would mean the 4-dp precision was skipped"
            - "the mid-range case is not clamped: the same herd asking for CONVENTIONAL gets the E-MID lot and expected_conception_rate 0.3635 - 0.60 * 1.009856 * 0.60 = 0.36354816 rounded to 4 dp"
            - "the inbreeding penalty is the only term that can pull a mid-range figure down, and it reads the computed inbreeding_pct rather than the herd's ceiling"

      - name: sire_index_variants_diverge_on_identical_trait_data
        claim_type: variant_divergence
        grounds:
          - calculations.sire_genetic_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / sire_index_genomic_only_vs_progeny_blended
          rationale: "The named §1.8 instance files two evaluations with identical traits either side of the 50-daughter boundary and asserts both composites and their delta."

      - name: lot_value_switches_variant_and_reconciles_downstream_value
        claim_type: reconciliation
        grounds:
          - calculations.lot_unit_book_value.variants
          - entities.StrawLot.fields.pre_revaluation_unit_value_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_value_standard_cost_vs_market_revalued
          rationale: "The named §1.8 instance asserts the STANDARD_COST value, the MARKET_REVALUED value, the snapshot field and the carried-value delta that flows to the distributor."

      - name: dose_buckets_propagate_without_creating_or_destroying_doses
        claim_type: constraint_propagation
        grounds:
          - calculations.lot_dose_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / dose_ledger_conserved_across_approve_dispatch_receive_return
          rationale: "The named §1.8 instance walks every bucket movement and asserts the conservation identity after each hop."

      - name: settlement_rebate_tier_boundaries_are_inclusive
        claim_type: tiered_pricing
        grounds:
          - calculations.consignment_settlement.constants.REBATE_TIERS
        excluded_because:
          difficulty_instance: boundary_precision_check / rebate_tier_at_exact_five_hundred_thousand_cent_subtotal
          rationale: "The named §1.8 instance tests the 500000-cent tier one cent below, exactly at and above the boundary."

      - name: reliability_shrink_clamps_at_both_ends
        claim_type: constants_applied
        grounds:
          - calculations.sire_genetic_index.constants.SHRINK_MIN
          - calculations.sire_genetic_index.constants.SHRINK_MAX
        excluded_because:
          difficulty_instance: combinatorial_formula / sire_index_nested_clamp_and_paw_decay_nonlinearity
          rationale: "The named §1.8 instance drives reliability_pct below 30 and above 95 and asserts that the shrink factor stops moving at each clamp."

  - section: validations
    instances:
      - name: unique_codes_are_enforced_on_all_four_registries
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_ERR_DUPLICATE_CODE
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Uniqueness is per entity and global within it - Facility.code, Sire.registration_code, Tank.serial and CountryRequirement.country_code - and it is checked after the shape rules, so a request that is both malformed and duplicated answers with the shape error."
        test_recipe:
          setup:
            - "Facility F-UQ-01 (US), Sire REG-UQ, Distributor D-UQ with Tank TK-UQ and CountryRequirement CA all exist."
          setup_api_calls:
            - call: "POST /genetics/facilities"
              payload: { code: "F-UQ-01", country_code: "US", housing_capacity: 4, bench_capacity: 2 }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/country-requirements"
              payload: { country_code: "CA", required_test_types: ["IBR", "BVD"], max_test_age_days: 30, min_isolation_days: 21, sexed_semen_allowed: true, embryo_allowed: false }
              as: ExportCoordinator
              captures: { cr_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/facilities"
              payload: { code: "F-UQ-01", country_code: "MX", housing_capacity: 9, bench_capacity: 3 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_DUPLICATE_CODE\"; the differing country_code and capacities do not make it a distinct facility"
            - "GET /genetics/facilities/${fac_id} still reports country_code \"US\", housing_capacity 4 and version 1 - the refused call wrote nothing"
            - "the same rule covers the other three registries: a second POST /genetics/country-requirements with country_code \"CA\" returns 409 ERR_DUPLICATE_CODE, and so do a repeated Sire registration_code and a repeated Tank serial"
            - "shape outranks uniqueness: POST /genetics/facilities with code \"F-UQ-01\" and bench_capacity omitted returns HTTP 400 ERR_VALIDATION, not 409"
            - "uniqueness does not leak across entities: a Tank whose serial equals \"F-UQ-01\" is accepted"

      - name: fully_compliant_booking_creation_passes_every_rule
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_15_ERR_SIRE_COLLECTION_STATE
          - validations.priority_25_ERR_HEALTH_TESTS_NOT_CURRENT
          - validations.priority_40_ERR_BENCH_CAPACITY_EXCEEDED
          - endpoints.POST_/genetics/collection-bookings
        distinguishing_aspect: "The positive control for the booking path: the sire is ELIGIBLE and resident at the facility, all four required tests are current, the window is future and well-formed, the rest buffer is clear and the bench has room, so all fifty-one rules are silent and the row is created."
        test_recipe:
          setup:
            - "Facility F-OK (US, APPROVED, bench_capacity 2) houses sire REG-OK, RESIDENT and ELIGIBLE with isolation served."
            - "All four required tests for REG-OK are NEGATIVE with valid_until 2027-08-01T00:00:00.000Z; the sire has no other booking."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${s_id}", facility_id: "${fac_id}", start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { b_id: "$.data.id" }
          assert:
            - "HTTP 201; data.status == \"SCHEDULED\", data.sire_id == ${s_id}, data.facility_id == ${fac_id}, data.version == 1"
            - "data.start_at == \"2026-09-10T08:00:00.000Z\" and data.end_at == \"2026-09-10T10:00:00.000Z\" - three fractional digits on the way out whatever the input precision"
            - "data.completed_at == null and data.cancel_reason == null"
            - "GET /genetics/collection-bookings?sire_id=${s_id} returns total_count == 1 and GET /genetics/collection-bookings?facility_id=${fac_id} the same row"
            - "the same window is bookable a second time for a different resident sire because bench_capacity is 2, which proves the 201 was not luck"

      - name: role_check_is_unauthorized_before_existence_and_state
        claim_type: priority_ordering
        grounds:
          - validations.priority_4_ERR_UNAUTHORIZED
          - validations.priority_8_ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The auth rule at priority 4 answers before the existence rule at 8 and before every state rule, so a caller with the wrong role learns nothing about whether the id exists - the same 403 comes back for a real row and for a fabricated one."
        test_recipe:
          setup:
            - "One Sire REG-AUTH exists in PROSPECT / NOT_HOUSED. One Distributor D-AUTH exists."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-AUTH", breed: "ANGUS", birth_date: "2022-04-04", acquisition_cost_cents: 200000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-AUTH", country_code: "US", credit_limit_cents: 100000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
          trigger:
            - call: "GET /genetics/sires/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with ${err} == \"ERR_UNAUTHORIZED\" - not 404, even though the id resolves to nothing"
            - "the same 403 answers GET /genetics/sires/${s_id} for the Distributor role, so the two cases are indistinguishable to an unauthorised caller"
            - "state rules are equally invisible: POST /genetics/sires/${s_id}/retire as Distributor returns 403 ERR_UNAUTHORIZED rather than 409 ERR_SIRE_ACQUISITION_STATE"
            - "a missing X-User-Role header is answered the same way, with 403 ERR_UNAUTHORIZED"
            - "the shape rules still come first: POST /genetics/sires as Distributor with no body at all returns HTTP 400 ERR_VALIDATION"

      - name: stale_lot_version_outranks_the_lot_state_precondition
        claim_type: priority_conflict
        grounds:
          - validations.priority_12_ERR_STALE_STRAW_LOT_VERSION
          - validations.priority_13_ERR_LOT_NOT_RELEASED
          - concurrency_rules.transfer-create-stale-lot
        distinguishing_aspect: "The concurrency rule at priority 12 sits between existence and the state preconditions, so a request that is wrong on BOTH counts - stale pin and unreleasable lot - answers 412, and only once the pin is refreshed does the 409 surface."
        test_recipe:
          setup:
            - "A QUARANTINE CONVENTIONAL lot of 100 straws exists with unit_book_value_cents 2500 and version 1, cut from an ACCEPTED ejaculate of sire REG-OCC."
            - "A DRAFT GenomicEvaluation for REG-OCC is ready to publish; publishing it revalues the lot and bumps its version."
            - "Distributor D-OCC (US, credit_limit_cents 10000000, consignment_enabled true) owns Tank TK-OCC."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "QUARANTINE" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", stale_ver: "$.data[0].version", s_id: "$.data[0].sire_id" }
            - call: "GET /genetics/genomic-evaluations"
              payload: { sire_id: "${s_id}", status: "DRAFT" }
              as: ProgramDirector
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /genetics/genomic-evaluations/${ev_id}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/distributors"
              payload: { name: "D-OCC", country_code: "US", credit_limit_cents: 10000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-OCC", capacity_straws: 500 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 10, unit_price_cents: 4000, expected_straw_lot_version: "${stale_ver}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the publication bumped the lot: GET /genetics/straw-lots/${lot_id} now reports version 2 with valuation_basis MARKET_REVALUED, so ${stale_ver} is one revision behind"
            - "HTTP 412 with ${err} == \"ERR_STALE_STRAW_LOT_VERSION\" - the lot is also un-consignable because it is still in QUARANTINE, but priority 12 answers first"
            - "refreshing the pin exposes the state error: the same call with expected_straw_lot_version 2 returns HTTP 409 with error_id ERR_LOT_NOT_RELEASED"
            - "no ConsignmentTransfer row was created by either refused call: GET /genetics/consignment-transfers?straw_lot_id=${lot_id} returns total_count == 0"
            - "existence still outranks the pin: the same stale pin against a fabricated lot id returns HTTP 404 ERR_RESOURCE_NOT_FOUND"

      - name: cross_border_transfer_requires_an_issued_matching_certificate
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_30_ERR_CERTIFICATE_NOT_APPLICABLE
          - entities.ExportCertificate
        distinguishing_aspect: "Validity depends on another entity's state and on three of its fields at once: the certificate must be ISSUED and its sire_id and straw_lot_id must match the shipment. A DRAFT certificate for the right lot and an ISSUED certificate for the wrong lot fail identically, while a domestic consignee needs no certificate at all."
        test_recipe:
          setup:
            - "Facility F-XB (US, approved_export_countries [\"CA\"]) hosted the booking behind two RELEASED CONVENTIONAL lots of sire REG-XB: L-1 and L-2, each 100 straws."
            - "Distributor D-CA has country_code CA (a cross-border consignee) with credit_limit_cents 10000000, consignment_enabled true, and owns Tank TK-CA."
            - "Certificate C-DRAFT binds REG-XB and L-1 to the CA requirement and is still DRAFT; certificate C-ISSUED binds REG-XB and L-2 and is ISSUED."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", limit: 2 }
              as: ProgramDirector
              captures: { l1: "$.data[0].id", l1_ver: "$.data[0].version", l2: "$.data[1].id" }
            - call: "GET /genetics/export-certificates"
              payload: { status: "ISSUED" }
              as: ExportCoordinator
              captures: { c_issued: "$.data[0].id" }
            - call: "GET /genetics/tanks"
              payload: { tank_status: "IN_SERVICE" }
              as: ProgramDirector
              captures: { tank_id: "$.data[0].id", dist_id: "$.data[0].distributor_id" }
          trigger:
            - call: "POST /genetics/straw-lots/${l1}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 10, unit_price_cents: 4000, export_certificate_id: "${c_issued}", expected_straw_lot_version: "${l1_ver}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_CERTIFICATE_NOT_APPLICABLE\": C-ISSUED covers lot ${l2}, not the lot being shipped, even though both lots belong to the same sire"
            - "omitting export_certificate_id altogether for the CA consignee returns the same 422 ERR_CERTIFICATE_NOT_APPLICABLE"
            - "supplying C-DRAFT for ${l1} returns the same 422 - the right lot with the wrong status is no better than the wrong lot"
            - "the matching pair succeeds: shipping ${l2} with C-ISSUED and the lot's current version returns HTTP 201 with status REQUESTED"
            - "domestic shipments are exempt: the same 10-dose request for ${l1} to a US distributor with no export_certificate_id returns HTTP 201"

      - name: future_dated_operations_are_refused_against_the_logical_clock
        claim_type: temporal_validation
        grounds:
          - validations.priority_37_ERR_BOOKING_NOT_STARTED
          - validations.priority_38_ERR_SAMPLE_DATE_FUTURE
          - validations.priority_35_ERR_CLOCK_REWIND
        distinguishing_aspect: "Three independent temporal rules read the same logical clock rather than wall time: a booking cannot be completed before its start_at, a sample cannot be dated ahead of the clock, and the clock itself refuses to move backwards or stand still."
        test_recipe:
          setup:
            - "Facility F-TM (US, APPROVED) houses sire REG-TM, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01."
            - "Booking B-TM spans 2026-09-10T08:00:00Z - 2026-09-10T10:00:00Z and is SCHEDULED."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/collection-bookings"
              payload: { status: "SCHEDULED" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].facility_id", s_id: "$.data[0].sire_id" }
          trigger:
            - call: "POST /genetics/collection-bookings/${b_id}/complete"
              payload: { volume_ml: 6.0, concentration_m_per_ml: 1200, motility_pct: 70.0 }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_BOOKING_NOT_STARTED\" - the clock has not reached start_at; the booking stays SCHEDULED and no Ejaculate row exists"
            - "at the boundary the same call succeeds: after the clock moves to 2026-09-10T08:00:00Z the completion returns HTTP 200 with completed_at 2026-09-10T08:00:00.000Z"
            - "sample dates cannot lead the clock: POST /genetics/sires/${s_id}/health-tests with sample_date 2026-09-15 at a clock of 2026-09-10T08:00:00Z returns HTTP 422 ERR_SAMPLE_DATE_FUTURE, while sample_date 2026-09-10 is accepted"
            - "the clock is strictly monotonic: POST /genetics/_clock/set_current_utc with 2026-09-10T08:00:00Z (the stored value) returns HTTP 422 ERR_CLOCK_REWIND, and so does any earlier instant"
            - "a refused clock move changes nothing: no HealthTest expires, no sire is suspended and every Tank keeps the ln2_level_pct it had"

      - name: tank_capacity_is_an_aggregate_over_open_transfers
        claim_type: aggregate_validation
        grounds:
          - validations.priority_43_ERR_TANK_CAPACITY_EXCEEDED
          - entities.Tank.fields.straws_on_hand
        distinguishing_aspect: "Each dispatch is individually within capacity_straws; it is the running sum of doses_on_hand over the tank's IN_TRANSIT and RECEIVED transfers that breaks the cap - and reconciling a transfer removes it from that sum, so the previously refused dispatch then succeeds."
        test_recipe:
          setup:
            - "A RELEASED CONVENTIONAL lot of 200 straws with unit_book_value_cents 1250 exists; its sire's four required tests are NEGATIVE until 2027-08-01."
            - "Distributor D-CAP (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-CAP with capacity_straws 150."
            - "Two 100-dose transfers T1 and T2 at unit_price_cents 4000 have both been approved; T1 has been dispatched."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "APPROVED" }
              as: ProgramDirector
              captures: { t2: "$.data[0].id", tank_id: "$.data[0].tank_id", dist_id: "$.data[0].distributor_id" }
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "IN_TRANSIT" }
              as: ProgramDirector
              captures: { t1: "$.data[0].id" }
            - call: "GET /genetics/tanks/${tank_id}"
              payload: {}
              as: ProgramDirector
              captures: { on_hand: "$.data.straws_on_hand", cap: "$.data.capacity_straws" }
          trigger:
            - call: "POST /genetics/consignment-transfers/${t2}/dispatch"
              payload: {}
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "${on_hand} == 100 and ${cap} == 150 - T1 alone is legal, since 100 <= 150"
            - "HTTP 422 with ${err} == \"ERR_TANK_CAPACITY_EXCEEDED\": 100 + 100 = 200 exceeds 150; T2 stays APPROVED and tank_service_count_at_dispatch is still null on it"
            - "the lot's buckets are untouched by the refusal: doses_reserved == 200 and doses_consigned == 0"
            - "the aggregate shrinks when a transfer closes: after receiving T1 and reporting 100 doses used, Tank.${tank_id}.straws_on_hand == 0 and the same dispatch of T2 returns HTTP 200"
            - "a RECONCILED or RETURNED transfer contributes nothing to straws_on_hand, while IN_TRANSIT and RECEIVED both do"

      - name: product_line_fields_and_destination_flags_are_conditional
        claim_type: conditional_validation
        grounds:
          - validations.priority_44_ERR_PRODUCT_LINE_FIELDS
          - validations.priority_46_ERR_PRODUCT_NOT_PERMITTED
        distinguishing_aspect: "Two rules that only exist for some configurations: sexing_purity_pct is required for SEXED and forbidden for the other two product lines (a supplied value is an error, not an ignored key), and the destination flags gate SEXED and EMBRYO shipments while never touching CONVENTIONAL."
        test_recipe:
          setup:
            - "One ACCEPTED Ejaculate with total_doses_theoretical 480 exists."
            - "CountryRequirement CA declares sexed_semen_allowed false and embryo_allowed true; CountryRequirement MX declares both true."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "ACCEPTED" }
              as: LabTechnician
              captures: { ej_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/ejaculates/${ej_id}/straw-lots"
              payload: { product_line: "CONVENTIONAL", straw_count: 100, processing_cost_cents: 250000, sexing_purity_pct: 90.0 }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_PRODUCT_LINE_FIELDS\": a CONVENTIONAL lot must omit sexing_purity_pct, and the key is rejected rather than dropped"
            - "the mirror omission fails too: product_line SEXED with no sexing_purity_pct returns the same 422, as does an EMBRYO lot that supplies one"
            - "the SEXED range is part of the same rule: sexing_purity_pct 49.9 returns 422 ERR_PRODUCT_LINE_FIELDS, while 50.0 and 99.9 are both accepted"
            - "flags gate submission, not creation: a certificate for a SEXED lot bound to the CA requirement returns HTTP 422 ERR_PRODUCT_NOT_PERMITTED on submit, while the same lot bound to MX submits successfully"
            - "CONVENTIONAL is never gated: a CONVENTIONAL certificate submits to CA even though sexed_semen_allowed is false"
            - "an EMBRYO certificate submits to CA because embryo_allowed is true - the two flags are read independently"

      - name: destination_approval_resolves_the_lot_to_its_origin_facility
        claim_type: cascading_validation
        grounds:
          - validations.priority_45_ERR_DESTINATION_NOT_APPROVED
          - validations.priority_16_ERR_FACILITY_SUSPENDED
        distinguishing_aspect: "The destination rule cannot be evaluated until an earlier resolution has run: certificate -> lot -> ejaculate -> booking -> facility, and only then is approved_export_countries readable. The facility rule at priority 16 depends on the same resolution and, being earlier, wins when both fail."
        test_recipe:
          setup:
            - "Facility F-CAS (US, APPROVED, approved_export_countries [\"CA\"]) hosted the booking behind a RELEASED CONVENTIONAL lot of sire REG-CAS, whose isolation_days_applied is 30."
            - "CountryRequirement MX declares required_test_types [IBR], max_test_age_days 60, min_isolation_days 21, sexed_semen_allowed true, embryo_allowed true."
            - "Certificate C-MX binds REG-CAS, that lot and the MX requirement and is DRAFT with submission_round 0."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/export-certificates"
              payload: { status: "DRAFT" }
              as: ExportCoordinator
              captures: { cert_id: "$.data[0].id", lot_id: "$.data[0].straw_lot_id" }
            - call: "GET /genetics/straw-lots/${lot_id}"
              payload: {}
              as: ExportCoordinator
              captures: { s_id: "$.data.sire_id" }
          trigger:
            - call: "POST /genetics/export-certificates/${cert_id}/submit"
              payload: { submission_note: "MX attempt" }
              as: ExportCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_DESTINATION_NOT_APPROVED\": MX is not in the origin facility's approved_export_countries, which is only discoverable by walking the lot back to its collecting facility"
            - "the certificate did not move: status is still DRAFT and submission_round is still 0, so the round budget was not consumed by a refused submit"
            - "adding MX to the facility's approved list is not testable through this endpoint, so the positive control is the CA requirement: a certificate bound to CA for the same lot submits successfully with submission_round 1"
            - "US is always permitted: a domestic consignment of the same lot to a US distributor passes priority 45 even when approved_export_countries is empty"
            - "the earlier dependent rule wins: with the facility SUSPENDED, submitting the CA certificate returns HTTP 409 ERR_FACILITY_SUSPENDED rather than any priority-45 or priority-47 error"
            - "isolation length is checked after the destination: a sire with isolation_days_applied 14 against min_isolation_days 21 returns HTTP 422 ERR_ISOLATION_TOO_SHORT once the destination is approved"

      - name: pending_test_uniqueness_and_retest_targets_are_enforced
        claim_type: violation_to_error
        grounds:
          - validations.priority_11_ERR_DUPLICATE_PENDING_TEST
          - validations.priority_32_ERR_INVALID_RETEST_TARGET
        distinguishing_aspect: "Two rules on the same endpoint with different answers: an outstanding PENDING test of the same type is a 409 conflict, while a retest pointed at a row that is not POSITIVE or INCONCLUSIVE of the same type on the same sire is a 422 referential error."
        test_recipe:
          setup:
            - "Sire REG-HT is RESIDENT at Facility F-HT and has one PENDING IBR test, one NEGATIVE BVD test and one POSITIVE BLUETONGUE test."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/health-tests"
              payload: { result: "PENDING", test_type: "IBR" }
              as: StaffVeterinarian
              captures: { pend_id: "$.data[0].id", s_id: "$.data[0].sire_id", fac_id: "$.data[0].facility_id" }
            - call: "GET /genetics/health-tests"
              payload: { sire_id: "${s_id}", result: "NEGATIVE", test_type: "BVD" }
              as: StaffVeterinarian
              captures: { neg_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "IBR", sample_date: "2026-09-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_DUPLICATE_PENDING_TEST\"; GET /genetics/health-tests?sire_id=${s_id}&test_type=IBR still returns total_count == 1"
            - "resulting the outstanding row clears the conflict: after POST /genetics/health-tests/${pend_id}/result with result INCONCLUSIVE, the same creation returns HTTP 201"
            - "a different test_type is never in conflict: a PENDING TRICHOMONIASIS test can be ordered while the IBR one is outstanding"
            - "retest targets are checked: a new BVD test with retest_of_test_id ${neg_id} returns HTTP 422 ERR_INVALID_RETEST_TARGET, because a NEGATIVE row is not a retestable outcome"
            - "type and ownership are part of that rule: pointing a BVD retest at the sire's POSITIVE BLUETONGUE row returns the same 422, and so does pointing at another sire's POSITIVE BVD row"
            - "the legal retest works: a BLUETONGUE test with retest_of_test_id set to this sire's POSITIVE BLUETONGUE row returns HTTP 201 in PENDING"

      - name: lot_state_is_answered_before_tank_ownership
        claim_type: priority_conflict
        grounds:
          - validations.priority_13_ERR_LOT_NOT_RELEASED
          - validations.priority_29_ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lot_state_outranks_tank_ownership_on_transfer_create
          rationale: "The named §1.8 instance violates both rules in one request and asserts that the state error is returned, then isolates each rule on its own."

      - name: health_currency_is_answered_before_the_credit_limit
        claim_type: priority_conflict
        grounds:
          - validations.priority_25_ERR_HEALTH_TESTS_NOT_CURRENT
          - validations.priority_51_ERR_CREDIT_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / health_safety_outranks_credit_limit_on_transfer_approve
          rationale: "The named §1.8 instance approves a transfer that is both health-blocked and over the limit and asserts the safety error, then each rule alone."

      - name: facility_residency_is_answered_before_the_rest_buffer
        claim_type: priority_conflict
        grounds:
          - validations.priority_28_ERR_SIRE_NOT_AT_FACILITY
          - validations.priority_34_ERR_SIRE_REST_BUFFER
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / facility_residency_outranks_rest_buffer_on_booking_create
          rationale: "The named §1.8 instance books a sire at the wrong facility inside its rest window and asserts the referential error wins."

      - name: booking_creation_depends_on_the_target_facility_state
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_16_ERR_FACILITY_SUSPENDED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_blocked_by_target_facility_suspension
          rationale: "The named §1.8 instance blocks a booking on a suspended facility while the sire itself is ELIGIBLE, then reinstates and re-books."

      - name: rest_buffer_is_measured_on_both_sides_of_the_new_window
        claim_type: temporal_validation
        grounds:
          - validations.priority_34_ERR_SIRE_REST_BUFFER
        excluded_because:
          difficulty_instance: resource_temporal_overlap / sire_rest_buffer_closed_forty_eight_hour_spacing_both_sides
          rationale: "The named §1.8 instance tests the closed 48-hour boundary before and after an existing booking, at exactly 48 hours and one second inside it."

  - section: endpoints
    instances:
      - name: country_requirement_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/genetics/country-requirements
          - endpoints.GET_/genetics/country-requirements/{id}
          - entities.CountryRequirement
        distinguishing_aspect: "The destination rule set is a create-and-read registry: what comes back from the by-id GET is byte-for-byte what creation stored, including the array field and the two booleans, and the scaffold declares no update or delete surface for it."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/country-requirements"
              payload: { country_code: "MX", required_test_types: ["IBR", "BVD", "TRICHOMONIASIS"], max_test_age_days: 45, min_isolation_days: 28, sexed_semen_allowed: true, embryo_allowed: false }
              as: ExportCoordinator
              captures: { cr_id: "$.data.id" }
          assert:
            - "HTTP 201; data.country_code == \"MX\", data.max_test_age_days == 45, data.min_isolation_days == 28, data.sexed_semen_allowed == true, data.embryo_allowed == false, data.version == 1"
            - "data.required_test_types == [\"IBR\", \"BVD\", \"TRICHOMONIASIS\"] - order preserved as supplied, and the array is not silently expanded to the four base types"
            - "GET /genetics/country-requirements/${cr_id} as StaffVeterinarian returns the identical field values"
            - "the row is also creatable by a ProgramDirector (shared operation) and readable by ProgramDirector and ExportCoordinator"
            - "a second POST with country_code \"MX\" returns HTTP 409 ERR_DUPLICATE_CODE, so the country code is the natural key"

      - name: contract_action_moves_only_the_acquisition_dimension
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/genetics/sires/{id}/contract
          - state_machines.Sire.PROSPECT_to_CONTRACTED
        distinguishing_aspect: "An action endpoint with a single, narrowly scoped side effect: contract_price_cents is stored and the acquisition dimension advances, while the collection dimension, the published proof block and the housing fields all stay exactly as they were."
        test_recipe:
          setup:
            - "One Sire REG-CT exists in PROSPECT / NOT_HOUSED with acquisition_cost_cents 600000; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-CT", breed: "HOLSTEIN", birth_date: "2022-02-14", acquisition_cost_cents: 600000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/contract"
              payload: { contract_price_cents: 655000 }
              as: ProgramDirector
          assert:
            - "HTTP 200; data.acquisition_status == \"CONTRACTED\" and data.contract_price_cents == 655000"
            - "data.collection_status is still \"NOT_HOUSED\", data.housing_facility_id == null, data.isolation_ends_at == null"
            - "data.acquisition_cost_cents is still 600000 - the contract price does not overwrite the acquisition cost"
            - "data.version == 2 and data.updated_at == \"2026-08-01T00:00:00.000Z\"; published_composite_index is still 0.00"
            - "the action is not repeatable: a second POST /genetics/sires/${s_id}/contract returns HTTP 409 ERR_SIRE_ACQUISITION_STATE and leaves contract_price_cents at 655000"
            - "collection-clearance is still unreachable: POST /genetics/sires/${s_id}/collection-clearance returns HTTP 409 ERR_SIRE_COLLECTION_STATE because the collection dimension never left NOT_HOUSED"

      - name: tank_read_returns_derived_level_status_and_straws_on_hand
        claim_type: computed_read
        grounds:
          - endpoints.GET_/genetics/tanks/{id}
          - entities.Tank.fields.straws_on_hand
          - calculations.tank_ln2_level
        distinguishing_aspect: "A plain by-id read returns four separately derived figures - ln2_level_pct from the decay curve, tank_status from the two threshold arms, next_service_due_at from the interval and straws_on_hand from the tank's open transfers - none of which is a stored client input."
        test_recipe:
          setup:
            - "A RELEASED CONVENTIONAL lot of 200 straws with unit_book_value_cents 1250 exists; its sire's four required tests are NEGATIVE until 2027-08-01."
            - "Distributor D-TK (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-RD (capacity_straws 500, service_interval_days 60, initial_fill_pct 95.0) created at clock 2026-08-01T00:00:00Z."
            - "A 100-dose transfer at unit_price_cents 4000 has been approved and dispatched into TK-RD at that same clock."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "IN_TRANSIT" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", tank_id: "$.data[0].tank_id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /genetics/tanks/${tank_id}"
              payload: {}
              as: ProgramDirector
              captures: { lvl: "$.data.ln2_level_pct", oh: "$.data.straws_on_hand" }
          assert:
            - "HTTP 200; ${lvl} == 55.0 - 95.0 - 2.0 * floor((2026-08-21 - 2026-08-01)/86400) with elapsed_days 20"
            - "data.tank_status == \"IN_SERVICE\": 55.0 is above the 25.0 threshold and the clock has not reached next_service_due_at"
            - "data.next_service_due_at == \"2026-09-30T00:00:00.000Z\" - last_service_at plus 60 days"
            - "${oh} == 100 - the dispatched transfer is IN_TRANSIT, so its doses_on_hand counts against capacity_straws 500"
            - "data.service_count == 0 and data.last_service_fill_pct == 95.0 - creation is not a service"
            - "the derived figures track the source rows: after the transfer is received and 100 doses are reported used, straws_on_hand is 0 while ln2_level_pct is unchanged"

      - name: certificate_creation_links_sire_lot_and_destination
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/genetics/export-certificates
          - validations.priority_31_ERR_LOT_SIRE_MISMATCH
          - validations.priority_9_ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "Three foreign keys are joined in one call and the pair among them must be coherent: the lot's sire_id has to equal the certificate's sire_id, so a lot belonging to a different sire is a 422 rather than a silently accepted link."
        test_recipe:
          setup:
            - "Sires REG-LK1 and REG-LK2 each own one RELEASED CONVENTIONAL lot, cut at Facility F-LK (US, approved_export_countries [\"CA\"])."
            - "CountryRequirement CA exists with required_test_types [IBR], max_test_age_days 30, min_isolation_days 21, sexed_semen_allowed true, embryo_allowed true."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", limit: 2, offset: 0 }
              as: ExportCoordinator
              captures: { lot1: "$.data[0].id", sire1: "$.data[0].sire_id", lot2: "$.data[1].id", sire2: "$.data[1].sire_id" }
            - call: "GET /genetics/country-requirements/00000000-0000-4000-8000-0000000000ca"
              payload: {}
              as: ExportCoordinator
              captures: { err0: "$.data.error_id" }
            - call: "POST /genetics/country-requirements"
              payload: { country_code: "CA", required_test_types: ["IBR"], max_test_age_days: 30, min_isolation_days: 21, sexed_semen_allowed: true, embryo_allowed: true }
              as: ExportCoordinator
              captures: { cr_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/export-certificates"
              payload: { sire_id: "${sire1}", straw_lot_id: "${lot2}", country_requirement_id: "${cr_id}" }
              as: ExportCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "${err0} == \"ERR_RESOURCE_NOT_FOUND\" - the fabricated country-requirement id is a 404, which fixes the fixture's expectation that ${cr_id} must be discovered from a real row"
            - "HTTP 422 with ${err} == \"ERR_LOT_SIRE_MISMATCH\": ${lot2} belongs to ${sire2}, so it cannot be certified under ${sire1}"
            - "no ExportCertificate row was created: GET /genetics/export-certificates?sire_id=${sire1} returns total_count == 0"
            - "an unknown FK is answered earlier: the same call with a fabricated country_requirement_id returns HTTP 404 ERR_RESOURCE_NOT_FOUND at priority 9, before the mismatch rule at 31"
            - "the coherent link works: sire_id ${sire1} with straw_lot_id ${lot1} returns HTTP 201 with status DRAFT, submission_round 0, expires_at null and destination_country_code \"CA\" copied from the requirement"
            - "both directions are reachable afterwards: GET /genetics/export-certificates?straw_lot_id=${lot1} and ?country_requirement_id=${cr_id} each return that row"

      - name: transfer_approval_is_conditional_on_the_consignment_flag
        claim_type: conditional_action
        grounds:
          - validations.priority_49_ERR_CONSIGNMENT_DISABLED
          - endpoints.POST_/genetics/consignment-transfers/{id}/approve
        distinguishing_aspect: "The flag gates approval only: the request may be created against a disabled distributor and sits in REQUESTED, and the refusal is independent of exposure - a distributor with an enormous credit limit and a disabled flag is still refused."
        test_recipe:
          setup:
            - "A RELEASED CONVENTIONAL lot of 200 straws with unit_book_value_cents 1250 exists; its sire's four required tests are NEGATIVE until 2027-08-01."
            - "Distributor D-OFF (US, credit_limit_cents 100000000, consignment_enabled false) owns Tank TK-OFF (capacity_straws 500, IN_SERVICE)."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-OFF", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: false }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-OFF", capacity_straws: 500 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 20, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: { approval_note: "attempt on a disabled partner" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the creation in setup returned HTTP 201 with status REQUESTED - the flag is not read at request time"
            - "HTTP 422 with ${err} == \"ERR_CONSIGNMENT_DISABLED\"; the transfer stays REQUESTED with approved_by_user_id null"
            - "no dose moved: StrawLot.${lot_id}.doses_available is still 200 and doses_reserved == 0"
            - "the flag outranks nothing but is outranked by the safety rules: with the sire's IBR test expired as well, the same call returns HTTP 422 ERR_HEALTH_TESTS_NOT_CURRENT at priority 25"
            - "an enabled partner with the same fixture approves cleanly: the identical request against a distributor created with consignment_enabled true returns HTTP 200 with status APPROVED and moves 20 doses from doses_available to doses_reserved"
            - "the flag defaults to enabled: a distributor created without consignment_enabled behaves as the enabled case"

      - name: clock_advance_sweeps_every_affected_row_and_reports_the_ids
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/genetics/_clock/set_current_utc
          - calculations.sire_required_test_compliance
          - calculations.tank_ln2_level
        distinguishing_aspect: "One call performs a multi-row sweep with per-row outcomes: the response's five id arrays name exactly the rows that moved, and rows that did not qualify are absent rather than reported as no-ops - a partial-outcome contract rather than all-or-nothing."
        test_recipe:
          setup:
            - "Sire REG-SW1 is RESIDENT and ELIGIBLE at Facility F-SW with an IBR test whose valid_until is 2026-09-15T00:00:00.000Z; its other three required tests run to 2027-08-01."
            - "Sire REG-SW2 is RESIDENT and ELIGIBLE at the same facility with all four tests valid until 2027-08-01."
            - "REG-SW1 has a SCHEDULED booking spanning 2026-09-20T08:00:00Z - 2026-09-20T10:00:00Z and a COMPLETED booking from 2026-09-01."
            - "Tank TK-SW was created at clock 2026-08-01T00:00:00Z with initial_fill_pct 95.0 and service_interval_days 60."
            - "The logical clock stands at 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE", limit: 2, offset: 0 }
              as: ProgramDirector
              captures: { s1: "$.data[0].id", s2: "$.data[1].id" }
            - call: "GET /genetics/collection-bookings"
              payload: { sire_id: "${s1}", status: "SCHEDULED" }
              as: ProgramDirector
              captures: { b_fut: "$.data[0].id" }
            - call: "GET /genetics/health-tests"
              payload: { sire_id: "${s1}", test_type: "IBR", result: "NEGATIVE" }
              as: StaffVeterinarian
              captures: { t_ibr: "$.data[0].id", until: "$.data[0].valid_until" }
          trigger:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ProgramDirector
          assert:
            - "${until} == \"2026-09-15T00:00:00.000Z\", so at the new clock the test is expired - the comparison is valid_until <= clock on the sweep and strictly greater-than in the compliance predicate"
            - "HTTP 200; data.expired_health_test_ids contains ${t_ibr} and HealthTest.${t_ibr}.result == \"EXPIRED\""
            - "data.suspended_sire_ids contains ${s1} and NOT ${s2}; Sire.${s1}.collection_status == \"SUSPENDED\" with suspension_reason REQUIRED_TEST_EXPIRED while Sire.${s2} is still ELIGIBLE"
            - "data.voided_booking_ids contains ${b_fut} and CollectionBooking.${b_fut}.status == \"VOIDED\"; the COMPLETED booking is absent from the array and unchanged"
            - "data.service_due_tank_ids contains TK-SW - 45 elapsed days leave ln2_level_pct at 5.0, at or below the 25.0 threshold - and data.out_of_service_tank_ids is empty because the level has not reached 0"
            - "data.current_utc == \"2026-09-15T00:00:00.000Z\""
            - "the sweep is not a rollback trigger: no StrawLot value, no ConsignmentTransfer status and no ExportCertificate status changes"

      - name: completion_cascade_creates_an_ejaculate_reachable_only_by_list
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/genetics/collection-bookings/{id}/complete
          - entities.Ejaculate
        distinguishing_aspect: "The cascade-created child is deliberately absent from the completing response, so the only way to reach it is the filtered list - and its frozen dose ceiling is computed from the completion payload, not supplied by the caller."
        test_recipe:
          setup:
            - "Facility F-CC (US, APPROVED) houses sire REG-CC, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01 and collection_count 0."
            - "Booking B-CC spans 2026-09-10T08:00:00Z - 2026-09-10T10:00:00Z and is SCHEDULED; the logical clock stands at 2026-09-10T08:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/collection-bookings"
              payload: { status: "SCHEDULED" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].facility_id", s_id: "$.data[0].sire_id" }
          trigger:
            - call: "POST /genetics/collection-bookings/${b_id}/complete"
              payload: { volume_ml: 5.5, concentration_m_per_ml: 1150, motility_pct: 68.0, collected_by_ref: "TECH-7" }
              as: FacilityManager
              as_user_id: "${fac_id}"
          assert:
            - "HTTP 200; data.status == \"COMPLETED\", data.completed_at == \"2026-09-10T08:00:00.000Z\" and the response body carries no ejaculate id at all"
            - "GET /genetics/ejaculates?booking_id=${b_id} returns total_count == 1 - the only discovery channel for the cascade child"
            - "that row has qc_status \"PENDING_QC\", sire_id ${s_id}, volume_ml 5.5, concentration_m_per_ml 1150 and total_doses_theoretical == 421 - floor(5.5 * 1150 / 15) == floor(421.666...), not 422"
            - "its post_thaw_motility_pct, morphology_normal_pct, evaluated_by_user_id and qc_decided_at are all null until QC runs; motility_pct 68.0 from the collection payload is a separate field"
            - "Sire.${s_id}.collection_count == 1"
            - "GET /genetics/ejaculates?sire_id=${s_id} reaches the same row, and a second completion of the booking returns HTTP 409 ERR_BOOKING_STATE without creating a second ejaculate"

      - name: recommendation_decision_reserves_doses_only_when_accepted
        claim_type: action_endpoint
        grounds:
          - state_machines.MatingRecommendation
          - endpoints.POST_/genetics/mating-recommendations/{id}/decision
          - validations.priority_42_ERR_INSUFFICIENT_DOSES
        distinguishing_aspect: "The same endpoint has two outcomes with different ledger consequences: ACCEPTED moves doses_requested into doses_reserved and bumps the lot's version, while WITHDRAWN touches no bucket and decrements the herd's recommendation_count."
        test_recipe:
          setup:
            - "Sire REG-DEC is RESIDENT, ELIGIBLE and carries a PUBLISHED proof; it owns one RELEASED CONVENTIONAL lot with straw_count 150 and doses_available 150."
            - "Customer herd H-DEC under Distributor D-DEC has two PROPOSED recommendations for that lot, R1 and R2, each with doses_requested 10."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/mating-recommendations"
              payload: { status: "PROPOSED", limit: 2, offset: 0 }
              as: BreedingAdvisor
              captures: { r1: "$.data[0].id", r2: "$.data[1].id", lot_id: "$.data[0].straw_lot_id", herd_id: "$.data[0].customer_herd_id" }
            - call: "GET /genetics/customer-herds/${herd_id}"
              payload: {}
              as: BreedingAdvisor
              captures: { rc: "$.data.recommendation_count" }
          trigger:
            - call: "POST /genetics/mating-recommendations/${r1}/decision"
              payload: { decision: "ACCEPTED" }
              as: BreedingAdvisor
          assert:
            - "${rc} == 2 - PROPOSED and ACCEPTED rows both count toward recommendation_count"
            - "HTTP 200; data.status == \"ACCEPTED\", data.doses_committed == 10 and data.decided_at == \"2026-09-01T00:00:00.000Z\""
            - "StrawLot.${lot_id}.doses_available == 140 and doses_reserved == 10, conserving straw_count 150, and the lot's version incremented by exactly 1"
            - "CustomerHerd.${herd_id}.recommendation_count is still 2 - an acceptance does not change the count"
            - "withdrawal is ledger-neutral: POST /genetics/mating-recommendations/${r2}/decision with decision WITHDRAWN returns status WITHDRAWN, doses_committed 0, doses_available still 140, and recommendation_count 1"
            - "stock is re-checked at decision time, not only at proposal: had a consignment reserved 145 of the 150 doses in between, accepting a 10-dose recommendation returns HTTP 422 ERR_INSUFFICIENT_DOSES and moves nothing"

      - name: publish_endpoint_side_effects_are_verified_end_to_end
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/genetics/genomic-evaluations/{id}/publish
        excluded_because:
          difficulty_instance: transitive_cascade / proof_publication_revaluation_chain_depth_four
          rationale: "The named §1.8 instance asserts all four declared hops of the publish endpoint plus revaluation_delta_cents, which is this endpoint's complete side-effect list."

  - section: errors
    instances:
      - name: input_shape_and_header_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_VALIDATION
          - errors.ERR_USER_ID_REQUIRED
        distinguishing_aspect: "The two 400-family codes split cleanly: ERR_VALIDATION covers all four shape defects (missing field, bad enum, out-of-range number, malformed instant) while a missing X-User-ID is its own code and only on the four duty-tracked endpoints."
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z; one PENDING_QC ejaculate and one QUARANTINE lot exist for a housed, eligible sire."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-BAD", breed: "HOLSTEIN", acquisition_cost_cents: 500000 }
              as: ProgramDirector
          assert:
            - "HTTP 400 ERR_VALIDATION - birth_date is a required input with no default, and no Sire row is created"
            - "the enum arm: POST /genetics/ejaculates/{id}/qc-evaluation with verdict \"MAYBE\" returns HTTP 400 ERR_VALIDATION, not a state error"
            - "the range arm: POST /genetics/tanks with initial_fill_pct 140.0 returns HTTP 400 ERR_VALIDATION; 100.0 is accepted"
            - "the instant arm: POST /genetics/_clock/set_current_utc with current_utc \"2026-09-01\" returns HTTP 400 ERR_VALIDATION rather than being coerced to midnight"
            - "the header arm: POST /genetics/straw-lots/{id}/release with X-User-Role LabTechnician and no X-User-ID returns HTTP 400 ERR_USER_ID_REQUIRED; the same omission on the health-test result, qc-evaluation and certificate issue endpoints returns the same code"
            - "an untracked endpoint is unaffected: POST /genetics/sires/{id}/contract with no X-User-ID succeeds, so ERR_USER_ID_REQUIRED is not a blanket header check"

      - name: role_scope_and_duty_codes_are_forbidden
        claim_type: triggerable
        grounds:
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_DISTRIBUTOR_SCOPE
          - errors.ERR_FACILITY_SCOPE
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_CERTIFIER_TESTED_SIRE
        distinguishing_aspect: "All five 403 codes are distinct and each has its own fixture: role membership, two entity_backed ownership scopes, and two duty-separation rules keyed on X-User-ID history rather than on role."
        test_recipe:
          setup:
            - "Distributors D-A and D-B each own a tank; D-A has one RECEIVED consignment transfer."
            - "Facilities F-1 and F-2 are both APPROVED; F-1 houses an eligible sire with a SCHEDULED booking."
            - "One ACCEPTED ejaculate QC-evaluated by user vet-or-tech U-1 has a QUARANTINE lot; sire REG-SC has a NEGATIVE IBR test recorded by user U-VET."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /genetics/inventory-valuation"
              payload: {}
              as: Distributor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with ${err} == \"ERR_UNAUTHORIZED\" - Distributor is not in the roles list for the valuation read, and the same code answers a missing X-User-Role"
            - "ERR_DISTRIBUTOR_SCOPE: POST /genetics/consignment-transfers/{id}/receive as Distributor with X-User-ID D-B against D-A's transfer returns HTTP 403; the same call with D-A's id succeeds"
            - "the scope code also guards tanks, customer herds and mating recommendations addressed by the wrong distributor"
            - "ERR_FACILITY_SCOPE: POST /genetics/collection-bookings/{id}/complete as FacilityManager with X-User-ID F-2 against F-1's booking returns HTTP 403"
            - "ERR_SEGREGATION_OF_DUTIES: POST /genetics/straw-lots/{id}/release as LabTechnician with X-User-ID U-1 returns HTTP 403 because U-1 QC-evaluated the parent ejaculate; any other technician id releases the lot"
            - "ERR_CERTIFIER_TESTED_SIRE: POST /genetics/export-certificates/{id}/issue as StaffVeterinarian with X-User-ID U-VET on a certificate for REG-SC returns HTTP 403; a vet who recorded no result for that sire issues it"

      - name: identity_uniqueness_and_version_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_DUPLICATE_PENDING_TEST
          - errors.ERR_STALE_SIRE_VERSION
          - errors.ERR_STALE_STRAW_LOT_VERSION
        distinguishing_aspect: "One 404 code serves every entity type and both reference positions (path {id} and body foreign key), while uniqueness and optimistic-concurrency each keep their own codes and their own HTTP statuses - 409 for identity collisions, 412 for version mismatches."
        test_recipe:
          setup:
            - "Facility F-DUP, Sire REG-DUP, Tank TK-DUP and CountryRequirement CA all exist; REG-DUP has one PENDING IBR test and one RELEASED lot."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /genetics/sires/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err} == \"ERR_RESOURCE_NOT_FOUND\"; the same code answers a fabricated body foreign key, e.g. POST /genetics/tanks with an unknown distributor_id"
            - "ERR_DUPLICATE_CODE fires on all four natural keys: a second Facility with code F-DUP, a second Sire with registration_code REG-DUP, a second Tank with serial TK-DUP and a second CountryRequirement with country_code CA each return HTTP 409"
            - "ERR_DUPLICATE_PENDING_TEST: ordering a second IBR test for REG-DUP while the first is PENDING returns HTTP 409; ordering BLUETONGUE instead succeeds, and IBR becomes orderable again once the first result is filed"
            - "ERR_STALE_SIRE_VERSION: POST /genetics/sires/{id}/genomic-evaluations with expected_sire_version one below current returns HTTP 412 and files nothing"
            - "ERR_STALE_STRAW_LOT_VERSION: POST /genetics/straw-lots/{id}/consignment-transfers with a stale expected_straw_lot_version returns HTTP 412 and moves no dose"
            - "both 412 codes are precondition-only: re-reading the parent for its current version and retrying the identical body succeeds"

      - name: sire_facility_and_booking_state_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_SIRE_ACQUISITION_STATE
          - errors.ERR_SIRE_COLLECTION_STATE
          - errors.ERR_FACILITY_SUSPENDED
          - errors.ERR_BOOKING_STATE
        distinguishing_aspect: "The sire's two dimensions raise two different 409 codes, so a caller can tell which dimension refused; the facility's own status and the booking's status are separate codes again."
        test_recipe:
          setup:
            - "Sire REG-PS is PROSPECT / NOT_HOUSED; Facility F-SUSP is SUSPENDED; Facility F-OK is APPROVED and houses an eligible sire with one COMPLETED booking."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /genetics/sires"
              payload: { acquisition_status: "PROSPECT" }
              as: ProgramDirector
              captures: { s_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/retire"
              payload: { retirement_reason: "premature" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_SIRE_ACQUISITION_STATE\" - retire is only legal from RESIDENT; the same code answers house outside CONTRACTED and contract outside PROSPECT"
            - "ERR_SIRE_COLLECTION_STATE: POST /genetics/sires/${s_id}/collection-clearance returns HTTP 409 with the collection-dimension code, not the acquisition one"
            - "the collection code also covers suspension outside ELIGIBLE, reinstatement outside SUSPENDED, any move out of WITHDRAWN, and booking a non-ELIGIBLE sire"
            - "ERR_FACILITY_SUSPENDED: housing a CONTRACTED sire into F-SUSP returns HTTP 409, as does booking a bench slot there and submitting a certificate for a lot cut there"
            - "ERR_BOOKING_STATE: cancelling or completing the COMPLETED booking returns HTTP 409, and so does a second completion"
            - "each refusal leaves the addressed row byte-identical, including its version and updated_at"

      - name: production_chain_state_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_EJACULATE_STATE
          - errors.ERR_LOT_STATE
          - errors.ERR_LOT_NOT_RELEASED
          - errors.ERR_EVALUATION_STATE
        distinguishing_aspect: "The lot has two separate 409 codes for two different questions - ERR_LOT_STATE for its own QC gate and ERR_LOT_NOT_RELEASED for its distribution readiness - and confusing them is the obvious implementation slip."
        test_recipe:
          setup:
            - "One PENDING_QC ejaculate E-P and one ACCEPTED ejaculate E-A exist; E-A has a QUARANTINE lot L-Q and a RELEASED lot L-R."
            - "Sire REG-PC has one PUBLISHED evaluation and one DRAFT evaluation."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "PENDING_QC" }
              as: LabTechnician
              captures: { e_p: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/ejaculates/${e_p}/straw-lots"
              payload: { product_line: "CONVENTIONAL", straw_count: 100, processing_cost_cents: 50000 }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_EJACULATE_STATE\" - lots are only cuttable from an ACCEPTED ejaculate, and the same code answers a second QC evaluation of E-A"
            - "ERR_LOT_STATE: releasing or rejecting L-R (already RELEASED) returns HTTP 409; L-Q accepts either verdict exactly once"
            - "ERR_LOT_NOT_RELEASED: POST /genetics/straw-lots/L-Q/consignment-transfers returns HTTP 409 with this code, distinct from ERR_LOT_STATE, and the same call on L-R succeeds"
            - "ERR_EVALUATION_STATE: publishing the already-PUBLISHED evaluation returns HTTP 409, and so does rolling back the DRAFT one"
            - "the code is state-specific, not endpoint-specific: a SUPERSEDED evaluation is publishable again, so the publish arm accepts DRAFT and SUPERSEDED only"
            - "no lot, ejaculate or evaluation field moves on any of these refusals"

      - name: distribution_chain_state_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_CERTIFICATE_STATE
          - errors.ERR_TRANSFER_STATE
          - errors.ERR_TANK_OUT_OF_SERVICE
        distinguishing_aspect: "Each of the two long distribution machines collapses all its wrong-source-state refusals into one code, while the tank's derived OUT_OF_SERVICE status raises a third code from a field no client ever wrote."
        test_recipe:
          setup:
            - "Certificate C-D is DRAFT for a RELEASED lot with an approved CA destination; transfer T-R is REQUESTED; Tank TK-DEAD was created at clock 2026-08-01T00:00:00Z with initial_fill_pct 40.0 and the clock now stands at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/export-certificates"
              payload: { status: "DRAFT" }
              as: ExportCoordinator
              captures: { c_d: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/export-certificates/${c_d}/issue"
              payload: { issue_note: "out of order" }
              as: StaffVeterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == \"ERR_CERTIFICATE_STATE\" - issue requires SUBMITTED; the same code answers reject outside SUBMITTED, revoke outside ISSUED and submit outside {DRAFT, REJECTED}"
            - "ERR_TRANSFER_STATE: dispatching T-R (still REQUESTED) returns HTTP 409, as do receive outside IN_TRANSIT and report-usage or return outside RECEIVED"
            - "ERR_TANK_OUT_OF_SERVICE: TK-DEAD's ln2_level_pct has decayed past 0 after 61 days at 2.0 percent per day, so receiving a transfer into it returns HTTP 409 with this code"
            - "the tank code is recoverable without any state endpoint: POST /genetics/tanks/TK-DEAD/ln2-service with fill_pct 90.0 restarts the curve and the same receive then succeeds"
            - "ERR_TANK_OUT_OF_SERVICE is answered at receive, not at request or dispatch, so a transfer can legitimately be in transit toward a tank that has since gone out of service"

      - name: health_currency_and_qc_gate_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_ISOLATION_INCOMPLETE
          - errors.ERR_HEALTH_TESTS_NOT_CURRENT
          - errors.ERR_COUNTRY_TEST_MISSING
          - errors.ERR_QC_BELOW_THRESHOLD
          - errors.ERR_INVALID_RETEST_TARGET
          - errors.ERR_SAMPLE_DATE_FUTURE
        distinguishing_aspect: "Two different health-currency codes coexist: the four base tests raise ERR_HEALTH_TESTS_NOT_CURRENT on operational gates, while the destination's own list raises ERR_COUNTRY_TEST_MISSING at issuance with a stricter age window."
        test_recipe:
          setup:
            - "Sire REG-ISO was housed at clock 2026-08-01T00:00:00Z with isolation_days 28, so isolation_ends_at is 2026-08-29T00:00:00Z; the clock still stands at 2026-08-01T00:00:00Z."
            - "Sire REG-CUR is RESIDENT and ELIGIBLE but its IBR test lapsed at 2026-07-30; REG-AGE has a NEGATIVE IBR test sampled 2026-05-01 with validity_days 365 and a destination requiring max_test_age_days 30."
            - "Ejaculate E-QC is PENDING_QC; test T-NEG on REG-ISO is NEGATIVE."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ISOLATION" }
              as: StaffVeterinarian
              captures: { s_iso: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/sires/${s_iso}/collection-clearance"
              payload: { clearance_note: "too early" }
              as: StaffVeterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_ISOLATION_INCOMPLETE\"; the same call at clock 2026-08-29T00:00:00Z succeeds, so the comparison is clock >= isolation_ends_at"
            - "ERR_HEALTH_TESTS_NOT_CURRENT: booking REG-CUR returns HTTP 422, and so do clearance, reinstatement and consignment approval for that sire - a valid_until exactly equal to the clock does not count as current"
            - "ERR_COUNTRY_TEST_MISSING: issuing REG-AGE's certificate returns HTTP 422 because the sample_date is older than max_test_age_days even though valid_until is far in the future"
            - "ERR_QC_BELOW_THRESHOLD: POST /genetics/ejaculates/E-QC/qc-evaluation with verdict ACCEPTED and post_thaw_motility_pct 34.9 returns HTTP 422; 35.0 with morphology 70.0 is accepted, and a REJECTED verdict at 34.9 is allowed"
            - "ERR_INVALID_RETEST_TARGET: ordering a test with retest_of_test_id T-NEG returns HTTP 422 - the target must be POSITIVE or INCONCLUSIVE, the same sire and the same test_type"
            - "ERR_SAMPLE_DATE_FUTURE: ordering a test with sample_date 2026-08-02 at clock 2026-08-01 returns HTTP 422; the clock date itself is accepted"

      - name: cross_reference_coherence_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_SIRE_NOT_AT_FACILITY
          - errors.ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR
          - errors.ERR_CERTIFICATE_NOT_APPLICABLE
          - errors.ERR_LOT_SIRE_MISMATCH
          - errors.ERR_PEDIGREE_CYCLE
        distinguishing_aspect: "Every one of these codes fires on a pair of rows that individually exist and are individually valid - the defect is only in their relationship, which is why none of them can be answered by a 404."
        test_recipe:
          setup:
            - "Facilities F-H (housing sire REG-XR, eligible) and F-OTHER are both APPROVED."
            - "Distributors D-1 and D-2 each own one tank; REG-XR has a RELEASED lot and a second sire REG-YR has its own RELEASED lot."
            - "Sires REG-P1, REG-P2 and REG-P3 form the pedigree chain P3 -> P2 -> P1."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: FacilityManager
              captures: { s_id: "$.data[0].id", fac_h: "$.data[0].housing_facility_id" }
            - call: "GET /genetics/facilities/${fac_h}"
              payload: {}
              as: FacilityManager
              captures: { code_h: "$.data.code" }
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${s_id}", facility_id: "00000000-0000-4000-8000-00000000f0f0", start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T10:00:00Z" }
              as: FacilityManager
              captures: { err: "$.data.error_id" }
          assert:
            - "${code_h} is F-H, confirming the sire's housing facility, and the fabricated facility_id above returns HTTP 404 ERR_RESOURCE_NOT_FOUND at priority 9 - existence precedes coherence"
            - "ERR_SIRE_NOT_AT_FACILITY: the same booking against the real F-OTHER returns HTTP 422; against ${fac_h} it succeeds"
            - "ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR: requesting a consignment for D-1 into D-2's tank returns HTTP 422"
            - "ERR_CERTIFICATE_NOT_APPLICABLE: a cross-border consignment with export_certificate_id omitted, or citing a DRAFT certificate, or citing an ISSUED certificate whose straw_lot_id is REG-YR's lot, all return HTTP 422 with this code"
            - "ERR_LOT_SIRE_MISMATCH: creating a certificate for REG-XR citing REG-YR's lot returns HTTP 422"
            - "ERR_PEDIGREE_CYCLE: POST /genetics/sires/P1/pedigree with sire_id P3 returns HTTP 422 because it would close the P3 -> P2 -> P1 chain, and a self-edge sire_id P1 returns the same code"

      - name: temporal_window_and_clock_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_CLOCK_REWIND
          - errors.ERR_INVALID_WINDOW
          - errors.ERR_BOOKING_NOT_STARTED
          - errors.ERR_SIRE_REST_BUFFER
        distinguishing_aspect: "Four separate codes all read the same logical clock from different sides - one guards the clock itself, one the shape of a window, one earliness of completion and one the spacing between two windows of the same sire."
        test_recipe:
          setup:
            - "Sire REG-TW is RESIDENT and ELIGIBLE at Facility F-TW (bench_capacity 4) with all four tests NEGATIVE until 2027-08-01."
            - "REG-TW has a SCHEDULED booking spanning 2026-09-10T08:00:00Z - 2026-09-10T10:00:00Z."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          assert:
            - "HTTP 422 ERR_CLOCK_REWIND - the clock is monotonic and rejects its own current value, so equality is a rewind; 2026-09-01T00:00:01Z is accepted"
            - "ERR_INVALID_WINDOW: a booking with start_at 2026-09-12T10:00:00Z and end_at 2026-09-12T08:00:00Z returns HTTP 422, and so does an equal pair; a start_at of 2026-08-31T23:00:00Z (before the clock) returns the same code"
            - "ERR_BOOKING_NOT_STARTED: completing the 2026-09-10T08:00:00Z booking at the current clock returns HTTP 422; the same call once the clock reaches start_at succeeds"
            - "ERR_SIRE_REST_BUFFER: a new booking starting 2026-09-12T09:00:00Z is within 48 hours of the existing end_at 2026-09-10T10:00:00Z and returns HTTP 422; 2026-09-12T10:00:00Z is exactly 48 hours later and is accepted"
            - "the buffer is symmetric: a new booking ending 2026-09-08T09:00:00Z is refused because it is less than 48 hours before the existing start_at, while ending 2026-09-08T08:00:00Z is accepted"
            - "the buffer is per sire, not per facility: a different sire may book the same window subject only to bench capacity"

      - name: capacity_and_quantity_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_FACILITY_AT_CAPACITY
          - errors.ERR_BENCH_CAPACITY_EXCEEDED
          - errors.ERR_DOSE_CAP_EXCEEDED
          - errors.ERR_INSUFFICIENT_DOSES
          - errors.ERR_TANK_CAPACITY_EXCEEDED
        distinguishing_aspect: "Five aggregate limits over five different populations - resident sires, overlapping bookings, an ejaculate's cut lots, a lot's dose buckets and a tank's straws on hand - and each is inclusive of the limit and exclusive only beyond it."
        test_recipe:
          setup:
            - "Facility F-FULL has housing_capacity 1 and bench_capacity 1 and already houses eligible sire REG-F1; CONTRACTED sire REG-F2 is waiting."
            - "Ejaculate E-CAP is ACCEPTED with total_doses_theoretical 480 and one lot of 400 straws already cut."
            - "A RELEASED lot L-CAP has doses_available 50; Tank TK-CAP has capacity_straws 60 and straws_on_hand 0."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { acquisition_status: "CONTRACTED" }
              as: ProgramDirector
              captures: { s_f2: "$.data[0].id" }
            - call: "GET /genetics/facilities/00000000-0000-4000-8000-00000000fu11"
              payload: {}
              as: ProgramDirector
              captures: { err0: "$.data.error_id" }
          trigger:
            - call: "POST /genetics/sires/${s_f2}/house"
              payload: { facility_id: "00000000-0000-4000-8000-00000000fu11", isolation_days: 30 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "${err0} == \"ERR_RESOURCE_NOT_FOUND\", so the placeholder id must be replaced with F-FULL's discovered id for the capacity arm to be reached at all"
            - "against the real F-FULL the call returns HTTP 422 ERR_FACILITY_AT_CAPACITY: resident_sire_count 1 plus one would exceed housing_capacity 1, and raising the capacity to 2 lets the identical call through"
            - "ERR_BENCH_CAPACITY_EXCEEDED: a second SCHEDULED booking whose half-open window overlaps an existing one at F-FULL returns HTTP 422; a window that merely touches at the boundary is accepted"
            - "ERR_DOSE_CAP_EXCEEDED: cutting a further 81 straws from E-CAP returns HTTP 422 because 400 + 81 exceeds 480, while 80 exactly reaches the cap and is accepted"
            - "ERR_INSUFFICIENT_DOSES: requesting 51 doses from L-CAP returns HTTP 422 and so does a usage report whose doses_used plus doses_returned exceeds the transfer's doses; 50 is accepted"
            - "ERR_TANK_CAPACITY_EXCEEDED: dispatching 61 straws into TK-CAP returns HTTP 422 at dispatch time - not at request time - while 60 is accepted"

      - name: export_eligibility_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_PRODUCT_LINE_FIELDS
          - errors.ERR_DESTINATION_NOT_APPROVED
          - errors.ERR_PRODUCT_NOT_PERMITTED
          - errors.ERR_ISOLATION_TOO_SHORT
          - errors.ERR_RESUBMISSION_LIMIT
        distinguishing_aspect: "The product line is policed twice with two different codes at two different times: its own field shape at lot creation, and the destination's permission at certificate submission."
        test_recipe:
          setup:
            - "Ejaculate E-PL is ACCEPTED with total_doses_theoretical 500 and no lots cut."
            - "Facility F-CA has approved_export_countries [\"CA\"]; CountryRequirement CA has sexed_semen_allowed false, embryo_allowed true and min_isolation_days 30; CountryRequirement MX has both product flags true and min_isolation_days 21."
            - "The sire behind E-PL was housed with isolation_days 21 and holds all four base tests NEGATIVE until 2027-08-01."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "ACCEPTED" }
              as: LabTechnician
              captures: { e_pl: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/ejaculates/${e_pl}/straw-lots"
              payload: { product_line: "SEXED", straw_count: 100, processing_cost_cents: 60000 }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_PRODUCT_LINE_FIELDS\" - a SEXED lot must carry sexing_purity_pct; supplying 90.0 succeeds, 49.9 or 99.95 are refused, and supplying it on a CONVENTIONAL or EMBRYO lot is refused too"
            - "ERR_DESTINATION_NOT_APPROVED: submitting a certificate for a lot cut at F-CA toward MX returns HTTP 422, because MX is absent from approved_export_countries"
            - "ERR_PRODUCT_NOT_PERMITTED: submitting a SEXED lot's certificate toward CA returns HTTP 422 while the EMBRYO lot's certificate for CA passes that rule"
            - "ERR_ISOLATION_TOO_SHORT: the sire's isolation_days_applied 21 is below CA's min_isolation_days 30, so the same submission returns HTTP 422; the MX requirement at 21 is satisfied inclusively"
            - "ERR_RESUBMISSION_LIMIT: after three submit-reject rounds the certificate's submission_round is 3 and a fourth submit returns HTTP 422 without changing the round"
            - "all four submission-time codes leave status at DRAFT or REJECTED and submission_round untouched"

      - name: commercial_and_advisory_codes_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_CONSIGNMENT_DISABLED
          - errors.ERR_NO_ELIGIBLE_SIRE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: "These are the only three codes raised by commercial policy rather than by physical or health state, and the credit rule is the one limit in the catalog that is explicitly inclusive - a projection landing exactly on the limit is allowed."
        test_recipe:
          setup:
            - "Customer herd H-NONE (target_product_line CONVENTIONAL, max_inbreeding_pct 0.00) belongs to Distributor D-CM and its base_sire_id is the only sire with RELEASED CONVENTIONAL stock, related to every candidate."
            - "Distributor D-OFF has consignment_enabled false; Distributor D-TIGHT has credit_limit_cents 100000 and no open exposure."
          setup_api_calls:
            - call: "GET /genetics/customer-herds"
              payload: { limit: 1, offset: 0 }
              as: BreedingAdvisor
              captures: { h_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/customer-herds/${h_id}/mating-recommendations"
              payload: { dam_ref: "DAM-001", requested_product_line: "CONVENTIONAL", doses_requested: 5 }
              as: BreedingAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == \"ERR_NO_ELIGIBLE_SIRE\" - the candidate pool is empty once the herd's 0.00 inbreeding ceiling removes the only sire with matching stock, and no MatingRecommendation row is created"
            - "the same call succeeds once an unrelated sire with RELEASED CONVENTIONAL stock exists, so the code reports emptiness of the pool and not a missing input"
            - "excluding that unrelated sire via excluded_sire_ids empties the pool again and returns the same code"
            - "ERR_CONSIGNMENT_DISABLED: approving a transfer for D-OFF returns HTTP 422 while the request itself was accepted"
            - "ERR_CREDIT_LIMIT_EXCEEDED: with the lot's unit_book_value_cents at 4000, approving a 26-dose transfer for D-TIGHT projects 26 * 4000 == 104000 against the 100000 limit and returns HTTP 422, while 25 doses project exactly 100000 and are approved - the projection uses the lot's book value, never the transfer's unit_price_cents"
            - "CustomerHerd.recommendation_count and Distributor exposure are unchanged after each refusal"

  - section: rbac
    instances:
      - name: program_director_holds_the_clock_and_the_commercial_gates
        claim_type: allowed_operations
        grounds:
          - roles.ProgramDirector.exclusive_operations
          - roles.ProgramDirector.shared_operations
        distinguishing_aspect: "The director is the only opaque role with write authority over the clock, the registries and the consignment gates, yet it is still shut out of every operational speciality - it cannot book a bench slot, order a test, cut a lot, draft a certificate or ask for a mating."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/facilities"
              payload: { code: "F-PD", country_code: "US", housing_capacity: 10, bench_capacity: 3, approved_export_countries: ["CA"] }
              as: ProgramDirector
              captures: { f_id: "$.data.id" }
          assert:
            - "HTTP 201 - the clock call in setup and this facility creation are both ProgramDirector-exclusive and both succeed"
            - "the rest of the exclusive set also succeeds for this role: facility approval-status, sire creation, contract, retire, pedigree, genomic-evaluation filing, publish, rollback, distributor creation and consignment approve / reject / dispatch"
            - "the shared set succeeds too: house, collection-status, country-requirements, booking cancel, certificate reject and revoke, tank creation and ln2-service, transfer return, and GET /genetics/inventory-valuation"
            - "POST /genetics/collection-bookings as ProgramDirector returns HTTP 403 ERR_UNAUTHORIZED - booking creation is FacilityManager-exclusive even though cancellation is shared"
            - "POST /genetics/sires/${f_id}/health-tests, POST /genetics/ejaculates/{id}/qc-evaluation, POST /genetics/straw-lots/{id}/release, POST /genetics/export-certificates and POST /genetics/customer-herds/{id}/mating-recommendations all return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "the role is opaque: none of its calls needs an X-User-ID and none can raise a scope error"

      - name: facility_manager_is_scoped_to_its_own_bench
        claim_type: allowed_operations
        grounds:
          - roles.FacilityManager.exclusive_operations
          - errors.ERR_FACILITY_SCOPE
        distinguishing_aspect: "This role's identity is a Facility row, so authority is not just an operation list but an ownership test: the same call with the same role succeeds or fails purely on which facility the X-User-ID names."
        test_recipe:
          setup:
            - "Facilities F-1 and F-2 are APPROVED with bench_capacity 3; F-1 houses sire REG-FM, RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: FacilityManager
              captures: { s_id: "$.data[0].id", f1: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${s_id}", facility_id: "${f1}", start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${f1}"
              captures: { b_id: "$.data.id" }
          assert:
            - "HTTP 201 - booking creation is FacilityManager-exclusive and the caller's X-User-ID equals the target facility"
            - "completion is allowed for the same identity once the clock reaches start_at, and the shared cancel and house operations are allowed too"
            - "the same booking call with X-User-ID F-2 returns HTTP 403 ERR_FACILITY_SCOPE, and so does completing F-1's booking as F-2"
            - "the scope test also applies to housing: housing a sire into F-1 as the F-2 manager is refused"
            - "cross-role denials: POST /genetics/ejaculates/{id}/qc-evaluation, POST /genetics/sires/{id}/health-tests, POST /genetics/straw-lots/{id}/release and every certificate endpoint return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "its reads are narrower than the director's: GET /genetics/collection-bookings/${b_id} and GET /genetics/ejaculates succeed, while GET /genetics/straw-lots and GET /genetics/inventory-valuation return HTTP 403 ERR_UNAUTHORIZED"

      - name: staff_veterinarian_owns_health_and_the_signature
        claim_type: allowed_operations
        grounds:
          - roles.StaffVeterinarian.exclusive_operations
          - roles.StaffVeterinarian.shared_operations
        distinguishing_aspect: "The vet is the only role that may sign a certificate but may not create or submit one, so the export workflow deliberately needs two roles end to end."
        test_recipe:
          setup:
            - "Sire REG-VT is RESIDENT at APPROVED Facility F-VT; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { acquisition_status: "RESIDENT" }
              as: StaffVeterinarian
              captures: { s_id: "$.data[0].id", f_id: "$.data[0].housing_facility_id" }
          trigger:
            - call: "POST /genetics/sires/${s_id}/health-tests"
              payload: { facility_id: "${f_id}", test_type: "IBR", sample_date: "2026-07-28", validity_days: 365 }
              as: StaffVeterinarian
              captures: { t_id: "$.data.id" }
          assert:
            - "HTTP 201 with status PENDING - ordering a test is StaffVeterinarian-exclusive"
            - "the rest of the exclusive set succeeds: POST /genetics/health-tests/${t_id}/result, collection-clearance and export-certificate issue"
            - "the shared set succeeds: collection-status (suspend and reinstate) and certificate reject and revoke"
            - "POST /genetics/export-certificates and POST /genetics/export-certificates/{id}/submit return HTTP 403 ERR_UNAUTHORIZED - drafting and submitting belong to the ExportCoordinator"
            - "POST /genetics/ejaculates/{id}/qc-evaluation, POST /genetics/straw-lots/{id}/release and POST /genetics/collection-bookings return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "the role is opaque, but the four duty-tracked endpoints it owns (test result and certificate issue) still require an X-User-ID"

      - name: lab_technician_owns_processing_and_release
        claim_type: allowed_operations
        grounds:
          - roles.LabTechnician.exclusive_operations
          - roles.LabTechnician.shared_operations
        distinguishing_aspect: "The technician holds the whole processing chain from QC verdict to release, and the valuation read - a director-level report - is deliberately shared with it, while every distribution endpoint is closed."
        test_recipe:
          setup:
            - "One PENDING_QC ejaculate E-LT exists with total_doses_theoretical 480."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "PENDING_QC" }
              as: LabTechnician
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/ejaculates/${e_id}/qc-evaluation"
              payload: { post_thaw_motility_pct: 52.0, morphology_normal_pct: 82.0, verdict: "ACCEPTED" }
              as: LabTechnician
              captures: { qc: "$.data.qc_status" }
          assert:
            - "HTTP 200 with ${qc} == \"ACCEPTED\" - QC evaluation is LabTechnician-exclusive"
            - "the rest of the exclusive set succeeds: cutting straw lots from ${e_id}, releasing a lot and rejecting a lot"
            - "the shared read succeeds: GET /genetics/inventory-valuation returns HTTP 200 for this role as well as for the director"
            - "POST /genetics/straw-lots/{id}/consignment-transfers returns HTTP 403 ERR_UNAUTHORIZED - requesting a consignment belongs to the director and the distributor"
            - "POST /genetics/export-certificates/{id}/issue, POST /genetics/sires/{id}/health-tests and POST /genetics/genomic-evaluations/{id}/publish return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "GET /genetics/tanks and GET /genetics/consignment-transfers return HTTP 403 ERR_UNAUTHORIZED - the technician sees inventory value but not the field network"

      - name: export_coordinator_drafts_but_never_signs
        claim_type: allowed_operations
        grounds:
          - roles.ExportCoordinator.exclusive_operations
          - roles.ExportCoordinator.shared_operations
        distinguishing_aspect: "A role defined as much by what it cannot do: it owns the two certificate write steps that precede the signature and is refused every step from the signature onward, including revocation."
        test_recipe:
          setup:
            - "A RELEASED lot cut at Facility F-EC (approved_export_countries [\"CA\"]) exists; the sire holds all four tests NEGATIVE until 2027-08-01 with isolation_days_applied 30."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED" }
              as: ExportCoordinator
              captures: { lot_id: "$.data[0].id", sire_id: "$.data[0].sire_id" }
            - call: "POST /genetics/country-requirements"
              payload: { country_code: "CA", required_test_types: ["IBR"], max_test_age_days: 30, min_isolation_days: 30, sexed_semen_allowed: true, embryo_allowed: true }
              as: ExportCoordinator
              captures: { cr_ca: "$.data.id", cc: "$.data.country_code" }
          trigger:
            - call: "POST /genetics/export-certificates"
              payload: { sire_id: "${sire_id}", straw_lot_id: "${lot_id}", country_requirement_id: "${cr_ca}" }
              as: ExportCoordinator
              captures: { c_id: "$.data.id" }
          assert:
            - "${cc} == \"CA\", confirming the discovered requirement row; HTTP 201 with status DRAFT - certificate creation is ExportCoordinator-exclusive"
            - "POST /genetics/export-certificates/${c_id}/submit also succeeds, and the shared country-requirements creation succeeds"
            - "POST /genetics/export-certificates/${c_id}/issue returns HTTP 403 ERR_UNAUTHORIZED - the signature is the veterinarian's alone"
            - "POST /genetics/export-certificates/${c_id}/reject and /revoke also return HTTP 403 ERR_UNAUTHORIZED - both are shared between director and vet, and the coordinator is in neither list"
            - "POST /genetics/sires, POST /genetics/straw-lots/{id}/release and POST /genetics/consignment-transfers/{id}/approve return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "its reads are broad on the export path - facilities, sires, health-tests, straw-lots, certificates and consignment-transfers all return HTTP 200 - but GET /genetics/tanks and GET /genetics/inventory-valuation are refused"

      - name: distributor_acts_only_inside_its_own_network
        claim_type: allowed_operations
        grounds:
          - roles.Distributor.exclusive_operations
          - errors.ERR_DISTRIBUTOR_SCOPE
        distinguishing_aspect: "The second entity_backed role, and the one with the widest ownership surface: four different entity types (transfers, tanks, herds, recommendations) are all scope-checked against the same X-User-ID."
        test_recipe:
          setup:
            - "Distributors D-A and D-B each own one IN_SERVICE tank; D-A has one IN_TRANSIT transfer of 40 doses and one customer herd."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "IN_TRANSIT" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", d_a: "$.data[0].distributor_id" }
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: { receipt_note: "received into the home tank" }
              as: Distributor
              as_user_id: "${d_a}"
              captures: { st: "$.data.status" }
          assert:
            - "HTTP 200 with ${st} == \"RECEIVED\" - receipt is Distributor-exclusive and the X-User-ID matches the transfer's distributor"
            - "report-usage is allowed for the same identity, and the shared set succeeds: tank creation, ln2-service, consignment request, return, customer-herd creation and the mating decision"
            - "the same receive call with X-User-ID D-B returns HTTP 403 ERR_DISTRIBUTOR_SCOPE; so does servicing D-A's tank, reading D-A's herd or deciding D-A's recommendation as D-B"
            - "POST /genetics/consignment-transfers/${tr_id}/approve and /dispatch return HTTP 403 ERR_UNAUTHORIZED - the commercial gates stay with the director even for the receiving partner"
            - "GET /genetics/sires/{id} and GET /genetics/inventory-valuation return HTTP 403 ERR_UNAUTHORIZED: the distributor may read the lots it can buy but not the sire registry or the plant's book value"
            - "scope and role are separate checks in a fixed order: a Distributor calling an endpoint it is not listed on gets ERR_UNAUTHORIZED, never ERR_DISTRIBUTOR_SCOPE, even when the addressed row belongs to someone else"

      - name: breeding_advisor_advises_without_inventory_authority
        claim_type: allowed_operations
        grounds:
          - roles.BreedingAdvisor.exclusive_operations
          - roles.BreedingAdvisor.shared_operations
        distinguishing_aspect: "The advisor triggers the heaviest calculation in the scaffold - the selector with its inbreeding screen - yet holds no authority over any row it selects from, and being opaque it may advise every distributor's herds."
        test_recipe:
          setup:
            - "Customer herd H-BA (target_product_line CONVENTIONAL, max_inbreeding_pct 6.25) belongs to Distributor D-BA; two unrelated sires hold PUBLISHED proofs and RELEASED CONVENTIONAL stock."
          setup_api_calls:
            - call: "GET /genetics/customer-herds"
              payload: { limit: 1, offset: 0 }
              as: BreedingAdvisor
              captures: { h_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/customer-herds/${h_id}/mating-recommendations"
              payload: { dam_ref: "DAM-BA-1", requested_product_line: "CONVENTIONAL", doses_requested: 8 }
              as: BreedingAdvisor
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP 201 with status PROPOSED - asking for a recommendation is BreedingAdvisor-exclusive"
            - "the shared set succeeds: customer-herd creation and POST /genetics/mating-recommendations/${r_id}/decision"
            - "its reads succeed on sires, straw-lots, genomic-evaluations, customer-herds and mating-recommendations"
            - "POST /genetics/straw-lots/{id}/consignment-transfers, POST /genetics/straw-lots/{id}/release, POST /genetics/sires/{id}/health-tests, POST /genetics/collection-bookings and every certificate endpoint return HTTP 403 ERR_UNAUTHORIZED for this role"
            - "GET /genetics/inventory-valuation, GET /genetics/tanks and GET /genetics/consignment-transfers return HTTP 403 ERR_UNAUTHORIZED"
            - "the role is opaque, not entity_backed: the same advisor may create and decide recommendations for herds under any distributor without ever raising ERR_DISTRIBUTOR_SCOPE"

      - name: every_exclusive_operation_is_closed_to_the_other_six_roles
        claim_type: denied_operations
        grounds:
          - roles
          - errors.ERR_UNAUTHORIZED
          - validations.priority_4_ERR_UNAUTHORIZED
        distinguishing_aspect: "The denial matrix is exhaustive and uniform: every exclusive operation answers ERR_UNAUTHORIZED to all six other roles with the same 403, and the check runs at priority 4 - before existence, so a wrong role addressing a fabricated id still gets 403 rather than 404."
        test_recipe:
          setup:
            - "One sire, one facility, one ejaculate, one lot, one certificate, one transfer, one herd and one recommendation exist so that every exclusive path has a real target."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/sires/00000000-0000-4000-8000-00000000beef/genomic-evaluations"
              payload: { milk_kg: 900, fat_kg: 34.0, protein_kg: 28.0, somatic_cell_score: 2.85, fertility_pct: 1.5, longevity_months: 32.0, reliability_pct: 78.0, progeny_daughter_count: 60, effective_at: "2026-09-01T00:00:00Z", expected_sire_version: "${sire_ver}" }
              as: BreedingAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with ${err} == \"ERR_UNAUTHORIZED\" - the role check at priority 4 precedes the 404 at priority 8 and the version check at 12, so the fabricated sire id is never even looked up"
            - "the matrix holds in both directions for each exclusive family: clock, facility and sire writes (ProgramDirector); booking create and complete (FacilityManager); health-test order and result, clearance and certificate issue (StaffVeterinarian); qc-evaluation, lot cutting, release and reject (LabTechnician); certificate create and submit (ExportCoordinator); transfer receive and report-usage (Distributor); mating-recommendation creation (BreedingAdvisor)"
            - "each of those endpoints returns HTTP 403 ERR_UNAUTHORIZED for all six roles not on its list, and HTTP 2xx for the role that owns it under an otherwise valid fixture"
            - "an absent X-User-Role is the same code: the same call with no role header returns HTTP 403 ERR_UNAUTHORIZED"
            - "an unrecognised role string is also ERR_UNAUTHORIZED rather than ERR_VALIDATION, since role membership is a list test and not an enum field"
            - "no denial writes anything: after sweeping the whole matrix, every entity's version and updated_at are unchanged"

      - name: shared_operations_admit_exactly_their_declared_roles
        claim_type: denied_operations
        grounds:
          - roles.ProgramDirector.shared_operations
          - roles.Distributor.shared_operations
          - roles.BreedingAdvisor.shared_operations
        distinguishing_aspect: "Shared operations are pairwise, never open: each admits exactly the two roles named in §1.7 and refuses the remaining five, and a pair that shares one step of a workflow does not thereby share its neighbours."
        test_recipe:
          setup:
            - "A RELEASED lot, an enabled Distributor D-SH with an IN_SERVICE tank, and a customer herd under D-SH all exist; the logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "GET /genetics/tanks"
              payload: { tank_status: "IN_SERVICE" }
              as: ProgramDirector
              captures: { tank_id: "$.data[0].id", dist_id: "$.data[0].distributor_id" }
          trigger:
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 10, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with ${err} == \"ERR_UNAUTHORIZED\" - the consignment request is shared by ProgramDirector and Distributor only, and the technician who cut the lot is not on the list"
            - "the identical body succeeds as ProgramDirector, and as Distributor with X-User-ID ${dist_id}"
            - "tank creation and ln2-service admit ProgramDirector and Distributor and refuse the other five; the transfer return admits the same pair"
            - "customer-herd creation and the mating decision admit BreedingAdvisor and Distributor and refuse the other five, including ProgramDirector - the director may read recommendations but never decide one"
            - "country-requirements creation admits ProgramDirector and ExportCoordinator; certificate reject and revoke admit ProgramDirector and StaffVeterinarian; collection-status admits ProgramDirector and StaffVeterinarian; booking cancel admits ProgramDirector and FacilityManager; house admits ProgramDirector and FacilityManager; the valuation read admits ProgramDirector and LabTechnician"
            - "sharing one step does not leak the next: the Distributor shares the consignment request but is refused approve and dispatch, and the FacilityManager shares cancel but owns create exclusively"

      - name: lot_release_is_barred_to_the_technician_who_evaluated_the_ejaculate
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_22_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The bar is per-ejaculate and asymmetric: the evaluating technician may still condemn the lot, only release is closed to them, so the rule separates approval from approval rather than blocking the user outright."
        test_recipe:
          setup:
            - "Two PENDING_QC ejaculates E-1 and E-2 exist for eligible sires; the logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "PENDING_QC", limit: 2, offset: 0 }
              as: LabTechnician
              captures: { e1: "$.data[0].id", e2: "$.data[1].id" }
            - call: "POST /genetics/ejaculates/${e1}/qc-evaluation"
              payload: { post_thaw_motility_pct: 55.0, morphology_normal_pct: 85.0, verdict: "ACCEPTED" }
              as: LabTechnician
              as_user_id: "tech-1"
              captures: { qc: "$.data.qc_status" }
            - call: "POST /genetics/ejaculates/${e1}/straw-lots"
              payload: { product_line: "CONVENTIONAL", straw_count: 120, processing_cost_cents: 48000 }
              as: LabTechnician
              as_user_id: "tech-1"
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /genetics/straw-lots/${lot_id}/release"
              payload: { release_note: "self-release attempt" }
              as: LabTechnician
              as_user_id: "tech-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "${qc} == \"ACCEPTED\" and the lot exists in QUARANTINE, so the fixture reaches the duty check rather than a state error"
            - "HTTP 403 with ${err} == \"ERR_SEGREGATION_OF_DUTIES\" - tech-1 QC-evaluated the parent ejaculate ${e1}"
            - "the same call with X-User-ID tech-2 returns HTTP 200 and the lot becomes RELEASED, so the refusal is about the individual and not the role"
            - "cutting the lot is not restricted: tech-1 legitimately cut ${lot_id} in setup, so the bar attaches only to release"
            - "condemnation is still open to tech-1: POST /genetics/straw-lots/{id}/reject as tech-1 on a sibling lot of ${e1} succeeds"
            - "the bar is per-ejaculate: tech-1 may release a lot cut from ${e2} once another technician evaluates it"
            - "state outranks duty: releasing an already-RELEASED lot as tech-1 returns HTTP 409 ERR_LOT_STATE at priority 19, not the 403 at priority 22"

      - name: certificate_signature_is_barred_to_the_vet_who_resulted_the_tests
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_CERTIFIER_TESTED_SIRE
          - validations.priority_23_ERR_CERTIFIER_TESTED_SIRE
        distinguishing_aspect: "The second duty rule reaches further back than the first: it looks not at the certificate at all but at whether this individual ever filed a result for that sire, so a single unrelated test result filed months earlier permanently disqualifies the signer."
        test_recipe:
          setup:
            - "Sire REG-SG is RESIDENT with four NEGATIVE base tests, all resulted by X-User-ID vet-1, and isolation_days_applied 30."
            - "A RELEASED lot of REG-SG cut at Facility F-SG (approved_export_countries [\"CA\"]) has a SUBMITTED certificate toward CountryRequirement CA (required_test_types [IBR], max_test_age_days 400, min_isolation_days 30)."
          setup_api_calls:
            - call: "GET /genetics/export-certificates"
              payload: { status: "SUBMITTED" }
              as: StaffVeterinarian
              captures: { c_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/export-certificates/${c_id}/issue"
              payload: { issue_note: "self-signature attempt" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with ${err} == \"ERR_CERTIFIER_TESTED_SIRE\" - vet-1 recorded results for REG-SG, and one result is enough"
            - "the same call as vet-2 returns HTTP 200, the certificate becomes ISSUED and expires_at is set from the satisfying test windows"
            - "the disqualifying history is per sire, not per certificate: vet-1 may issue a certificate for a different sire whose tests it never resulted"
            - "ordering a test does not disqualify: a vet that only created the PENDING row and never filed the result may still sign"
            - "the header is mandatory here: the same issue call with no X-User-ID returns HTTP 400 ERR_USER_ID_REQUIRED at priority 5, before any duty check"
            - "state outranks duty again: issuing a DRAFT certificate as vet-1 returns HTTP 409 ERR_CERTIFICATE_STATE at priority 21, not the 403 at priority 23"
            - "the two duty rules are independent: the technician bar and the certifier bar can be violated by different users in the same fixture without interfering"

  - section: cross-cutting complexity layers
    instances:
      - name: stale_sire_version_refuses_the_evaluation_and_the_fresh_one_lands
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.evaluation-create-stale-sire
          - errors.ERR_STALE_SIRE_VERSION
        distinguishing_aspect: "The §1.2.1 rule for the sire is an exact-equality pin, not a floor: a version below current and a version above current are both refused, and the refusal is a pure precondition that leaves no evaluation row behind."
        test_recipe:
          setup:
            - "Sires REG-OC1 and REG-OC2 are both RESIDENT; the logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { acquisition_status: "RESIDENT", limit: 2, offset: 0 }
              as: ProgramDirector
              captures: { s1: "$.data[0].id", v0: "$.data[0].version", s2: "$.data[1].id" }
            - call: "POST /genetics/sires/${s1}/pedigree"
              payload: { dam_sire_id: "${s2}" }
              as: ProgramDirector
              captures: { v1: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${s1}/genomic-evaluations"
              payload: { milk_kg: 900, fat_kg: 34.0, protein_kg: 28.0, somatic_cell_score: 2.85, fertility_pct: 1.5, longevity_months: 32.0, reliability_pct: 78.0, progeny_daughter_count: 60, effective_at: "2026-09-01T00:00:00Z", expected_sire_version: "${v0}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "${v1} == ${v0} + 1 - the pedigree write advanced the sire, so the pin captured before it is now stale"
            - "HTTP 412 with ${err} == \"ERR_STALE_SIRE_VERSION\" - the declared occ_field expected_sire_version must equal the sire's current version"
            - "nothing was written: GET /genetics/genomic-evaluations?sire_id=${s1} returns total_count == 0 and Sire.${s1}.version is still ${v1}"
            - "a version above current is refused with the same code, so the comparison is equality and not a monotonic floor"
            - "the retry with the fresh version succeeds: the identical body with expected_sire_version ${v1} returns HTTP 201 with status DRAFT"
            - "the pin is checked at priority 12, after the 404s at 8 and 9: a fabricated sire id with a stale pin returns ERR_RESOURCE_NOT_FOUND, not the 412"
            - "the pin guards the sire only - the evaluation's own row has no expected_* input, and publishing it later needs no pin"

      - name: lot_version_pins_the_consignment_request_and_advances_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transfer-create-stale-lot
          - errors.ERR_STALE_STRAW_LOT_VERSION
        distinguishing_aspect: "The lot's pin is the one guarding a dose ledger, so the stale case must prove not only the 412 but that no bucket moved - and the version that invalidates the pin is bumped by a completely different actor's accepted mating recommendation."
        test_recipe:
          setup:
            - "Sire REG-OC3 is RESIDENT with a PUBLISHED proof and owns a RELEASED CONVENTIONAL lot of 150 straws, doses_available 150."
            - "Customer herd H-OC under enabled Distributor D-OC (credit_limit_cents 100000000) holds a PROPOSED recommendation for that lot with doses_requested 10; D-OC owns an IN_SERVICE tank of capacity_straws 500."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lv0: "$.data[0].version" }
            - call: "GET /genetics/tanks"
              payload: { tank_status: "IN_SERVICE" }
              as: ProgramDirector
              captures: { tank_id: "$.data[0].id", dist_id: "$.data[0].distributor_id" }
            - call: "GET /genetics/mating-recommendations"
              payload: { straw_lot_id: "${lot_id}", status: "PROPOSED" }
              as: BreedingAdvisor
              captures: { r_id: "$.data[0].id" }
            - call: "POST /genetics/mating-recommendations/${r_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: BreedingAdvisor
            - call: "GET /genetics/straw-lots/${lot_id}"
              payload: {}
              as: ProgramDirector
              captures: { lv1: "$.data.version", avail: "$.data.doses_available" }
          trigger:
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 20, unit_price_cents: 4000, expected_straw_lot_version: "${lv0}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "${lv1} == ${lv0} + 1 and ${avail} == 140 - the acceptance reserved 10 doses and advanced the lot by exactly one version"
            - "HTTP 412 with ${err} == \"ERR_STALE_STRAW_LOT_VERSION\" and no ConsignmentTransfer row exists for ${lot_id}"
            - "the ledger is untouched by the refusal: doses_available is still 140, doses_reserved 10, doses_consigned 0, and the version is still ${lv1}"
            - "the retry with ${lv1} returns HTTP 201 with status REQUESTED - and creation alone still moves no dose, since reservation happens at approval"
            - "the version advances on every accepted write to the lot: release, an accepted recommendation, an approval, a dispatch, a receipt, a usage report and a proof revaluation each add exactly 1"
            - "reads never advance it: any number of GET /genetics/straw-lots/${lot_id} calls leave the version unchanged"

      - name: version_is_system_owned_and_never_moves_on_a_refusal
        claim_type: optimistic_concurrency
        grounds:
          - entities.Sire.fields.version
          - errors.ERR_VALIDATION
        distinguishing_aspect: "The version counter is proved to be a system field from both sides: a client-supplied version at creation is ignored rather than honoured, and every rejected write - 400, 403, 404, 409, 412 or 422 - leaves the counter exactly where it was."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-VS", breed: "JERSEY", birth_date: "2021-06-01", acquisition_cost_cents: 400000 }
              as: ProgramDirector
              captures: { s_id: "$.data.id", v: "$.data.version" }
          assert:
            - "HTTP 201 with ${v} == 1 - every entity with common fields starts at version 1"
            - "the counter advances by exactly 1 per accepted write: after contract it is 2, after house 3, after collection-clearance 4"
            - "refusals never advance it: a second contract (409), a clearance before isolation ends (422), an unauthorized call (403) and a fabricated-id call (404) all leave the version at its last accepted value"
            - "the same holds for the two 400 families and for the 412 pins, so version is a function of accepted writes only"
            - "created_at is frozen while updated_at tracks the logical clock at each accepted write, so a write at an unchanged clock still moves the version"
            - "immutable rows have no counter at all: the Ejaculate, HealthTest and MatingRecommendation-style rows declared without common fields expose no version field and no update endpoint"

      - name: revaluation_cascade_is_order_sensitive_and_a_refusal_writes_nothing
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/genetics/genomic-evaluations/{id}/publish
          - calculations.lot_unit_book_value.input_set
          - errors.ERR_EVALUATION_STATE
        distinguishing_aspect: "Two claims that only a cascade can make: the stored unit value of a condemned lot depends on whether it was rejected before or after the publication, and a publication refused at the state gate must leave all four hops unexecuted rather than half-applied."
        test_recipe:
          setup:
            - "Sire REG-CS is RESIDENT and owns two QUARANTINE CONVENTIONAL lots A and B, each 100 straws at processing_cost_cents 50000, so both carry unit_book_value_cents 500 with valuation_basis STANDARD_COST."
            - "A DRAFT evaluation E-CS for REG-CS computes composite_index 40.00; a second evaluation E-OLD is already PUBLISHED."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { acquisition_status: "RESIDENT" }
              as: ProgramDirector
              captures: { s_cs: "$.data[0].id" }
            - call: "GET /genetics/straw-lots"
              payload: { sire_id: "${s_cs}", distribution_status: "QUARANTINE", limit: 2, offset: 0 }
              as: LabTechnician
              captures: { lot_a: "$.data[0].id", lot_b: "$.data[1].id" }
            - call: "POST /genetics/straw-lots/${lot_b}/reject"
              payload: { rejected_reason: "condemned before the proof update" }
              as: LabTechnician
            - call: "GET /genetics/genomic-evaluations"
              payload: { sire_id: "${s_cs}", status: "DRAFT" }
              as: ProgramDirector
              captures: { e_cs: "$.data[0].id", ci: "$.data[0].composite_index" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${e_cs}/publish"
              payload: { publication_note: "September proof run" }
              as: ProgramDirector
              captures: { delta: "$.data.revaluation_delta_cents" }
          assert:
            - "${ci} == 40.00, so the market unit value is max(800, round_half_up(45 * 40.00 * 1.00)) == 1800"
            - "HTTP 200; lot A is MARKET_REVALUED at 1800 with pre_revaluation_unit_value_cents 500, while lot B - rejected first - is still 500 with valuation_basis STANDARD_COST and pre_revaluation_unit_value_cents null"
            - "${delta} == 130000: the source set holds only lot A, so the plant value moved from 100 * 500 == 50000 to 100 * 1800 == 180000"
            - "order matters: with the rejection performed after the publication instead, lot B ends at 1800 rather than 500 - the same two operations in the other order leave a different stored unit value"
            - "the refusal writes nothing: POST /genetics/genomic-evaluations/${e_cs}/publish a second time returns HTTP 409 ERR_EVALUATION_STATE, and lot A's unit value, its snapshot, E-OLD's status, every transfer's carried_value_cents and every distributor's consignment_value_cents are unchanged"
            - "hop 1 is not partially applied on that refusal either: the sire's published_composite_index is still 40.00 from the accepted publication and no third evaluation moved to SUPERSEDED"

      - name: index_variant_selection_flips_at_the_daughter_threshold
        claim_type: dual_variant_calculation
        grounds:
          - calculations.sire_genetic_index.variants
        excluded_because:
          difficulty_instance: dual_variant / sire_index_genomic_only_vs_progeny_blended
          rationale: "The named §1.8 instance runs identical trait inputs through both GENOMIC_ONLY and PROGENY_BLENDED, verifies the divergent composite_index and the recorded parent_average_weight for each, so both variants and their selection rule are already asserted."

      - name: lot_value_variant_switch_delta_reaches_the_distributor
        claim_type: reconciliation
        grounds:
          - calculations.lot_unit_book_value.variants
          - entities.Distributor.fields.consignment_value_cents
          - entities.ConsignmentTransfer.fields.carried_value_cents
        distinguishing_aspect: "The variant switch is not confined to the lot: the same publication that changes the basis re-derives the value carried by an already-received consignment and the distributor's own exposure figure, so the delta has to travel two hops past the row that owns the variant."
        test_recipe:
          setup:
            - "Sire REG-VD owns one RELEASED CONVENTIONAL lot of 100 straws at processing_cost_cents 50000, so unit_book_value_cents is 500 on the STANDARD_COST basis."
            - "Distributor D-VD (enabled, credit_limit_cents 100000000) has received a 40-dose consignment of that lot at unit_price_cents 4000 into an IN_SERVICE tank, so 60 doses remain available and 40 are consigned."
            - "A DRAFT evaluation for REG-VD computes composite_index 40.00; the logical clock stands at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "RECEIVED" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", cv0: "$.data[0].carried_value_cents", d_id: "$.data[0].distributor_id" }
            - call: "GET /genetics/genomic-evaluations"
              payload: { status: "DRAFT" }
              as: ProgramDirector
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${e_id}/publish"
              payload: { publication_note: "variant switch" }
              as: ProgramDirector
              captures: { delta: "$.data.revaluation_delta_cents" }
          assert:
            - "${cv0} == 20000 before the publication - 40 doses on hand at the STANDARD_COST unit value of 500, not at the 4000 sale price"
            - "HTTP 200; the lot is now MARKET_REVALUED at 1800 and ${delta} == 130000, moving the plant figure from 50000 to 1800 * (60 + 40) == 180000"
            - "hop 3 landed: ConsignmentTransfer.${tr_id}.carried_value_cents == 72000 == 40 * 1800"
            - "hop 4 landed: Distributor.${d_id}.consignment_value_cents == 72000, and its exposure moved by the same 52000 while credit_limit_cents and outstanding_balance_cents are untouched"
            - "the transfer's commercial fields are basis-independent: doses, unit_price_cents, gross_cents and settlement_total_cents are unchanged by the revaluation"
            - "the switch is reversible in one call: POST /genetics/genomic-evaluations/${e_id}/rollback restores the lot to 500 with pre_revaluation_unit_value_cents cleared to null, carried_value_cents to 20000 and consignment_value_cents to 20000"

      - name: plant_valuation_reconciles_after_create_release_revalue_and_removal
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.plant_inventory_value
          - endpoints.GET_/genetics/inventory-valuation
        distinguishing_aspect: "The derived report must track four different kinds of source change - a new row, a status move between its two buckets, a unit-value change and a row leaving the set entirely - and consumption has to reduce the figure without removing the lot from lot_count."
        test_recipe:
          setup:
            - "Sire REG-RV owns one ACCEPTED ejaculate with total_doses_theoretical 480 and no lots; the plant is otherwise empty."
            - "A DRAFT evaluation for REG-RV computes composite_index 40.00; enabled Distributor D-RV owns an IN_SERVICE tank of capacity_straws 500."
          setup_api_calls:
            - call: "GET /genetics/ejaculates"
              payload: { qc_status: "ACCEPTED" }
              as: LabTechnician
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "GET /genetics/inventory-valuation"
              payload: {}
              as: LabTechnician
              captures: { total: "$.data.plant_inventory_value_cents", n: "$.data.lot_count" }
          assert:
            - "before any lot exists ${total} == 0 and ${n} == 0, with quarantine_value_cents and released_value_cents both 0"
            - "after cutting a 100-straw CONVENTIONAL lot at processing_cost_cents 50000: lot_count 1, quarantine_value_cents 50000, released_value_cents 0, total 50000"
            - "after release the same cents move buckets rather than changing: quarantine_value_cents 0, released_value_cents 50000, total 50000, lot_count still 1"
            - "after publishing the proof the unit value becomes 1800 and the read returns released_value_cents 180000 without any further write"
            - "consumption reduces the figure but not the count: once 40 doses are consigned, received and reported used, the contributing buckets are 60 available plus 0 consigned, so released_value_cents == 108000 while lot_count stays 1"
            - "removal drops the row entirely: rejecting the lot returns total 0 and lot_count 0 even though StrawLot.unit_book_value_cents is still stored as 1800"

      - name: distributor_exposure_reconciles_across_the_transfer_lifecycle
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.distributor_exposure
          - entities.Distributor.fields.outstanding_balance_cents
        distinguishing_aspect: "The two halves of exposure hand over to each other at exactly one transition: the same transfer that stops contributing consignment value starts contributing an outstanding balance, and the total must not double-count during the handover."
        test_recipe:
          setup:
            - "A RELEASED CONVENTIONAL lot with unit_book_value_cents 500 and 150 doses available exists for a sire whose four base tests are NEGATIVE until 2027-08-01."
            - "Distributor D-EX (enabled, credit_limit_cents 100000000) owns an IN_SERVICE tank of capacity_straws 500; one liquid-nitrogen service is performed after dispatch."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/consignment-transfers"
              payload: { status: "RECEIVED" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", d_ex: "$.data[0].distributor_id", oh: "$.data[0].doses_on_hand" }
            - call: "GET /genetics/distributors/${d_ex}"
              payload: {}
              as: ProgramDirector
              captures: { cv0: "$.data.consignment_value_cents", ob0: "$.data.outstanding_balance_cents" }
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/report-usage"
              payload: { doses_used: 25, doses_returned: 15 }
              as: Distributor
              as_user_id: "${d_ex}"
              captures: { st: "$.data.status", total: "$.data.settlement_total_cents" }
          assert:
            - "${oh} == 40 and ${cv0} == 20000 == 40 * 500 at RECEIVED, while ${ob0} == 0 - the consignment half is live and the balance half is still empty"
            - "the earlier statuses contributed nothing: the same distributor read while the transfer was REQUESTED, APPROVED or IN_TRANSIT returned consignment_value_cents 0"
            - "HTTP 200 with ${st} == \"RECONCILED\" and ${total} == 112000: gross_cents 100000 == 25 * 4000, service_fee_cents 12000 for the one post-dispatch service, rebate_cents 0 below the first tier"
            - "the handover is complete in that same request: doses_on_hand is 0, so Distributor.${d_ex}.consignment_value_cents falls to 0 and outstanding_balance_cents becomes 112000"
            - "exposure never double-counts: consignment_value_cents + outstanding_balance_cents == 112000 immediately after the handover, and cumulative_doses_used == 25"
            - "a REJECTED or RETURNED transfer contributes nothing to either half, so the same fixture ending in a rejection leaves both figures at 0"

  - section: consistency model
    instances:
      - name: every_accepted_write_is_fully_visible_in_its_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/genetics/genomic-evaluations/{id}/publish
        distinguishing_aspect: "The heaviest write in the scaffold is also the proof of immediacy: revaluation_delta_cents is a difference between two plant valuations, so the publishing response can only be correct if all four cascade hops are already committed when it is serialised."
        test_recipe:
          setup:
            - "Sire REG-IM owns one RELEASED CONVENTIONAL lot of 100 straws at processing_cost_cents 50000 (unit 500) with 100 doses available; a DRAFT evaluation computes composite_index 40.00."
            - "The logical clock stands at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/genomic-evaluations"
              payload: { status: "DRAFT" }
              as: ProgramDirector
              captures: { e_id: "$.data[0].id", s_id: "$.data[0].sire_id" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${e_id}/publish"
              payload: { publication_note: "immediacy check" }
              as: ProgramDirector
              captures: { st: "$.data.status", delta: "$.data.revaluation_delta_cents", pub: "$.data.published_at" }
          assert:
            - "HTTP 200 with ${st} == \"PUBLISHED\", ${pub} == \"2026-09-15T00:00:00.000Z\" and ${delta} == 130000 - the delta already reflects the revalued lot, so hop 2 committed before the response was built"
            - "a following GET /genetics/genomic-evaluations/${e_id} returns exactly the same three values - the response is not a provisional projection"
            - "the sire is current in the very next read: GET /genetics/sires/${s_id} returns published_composite_index 40.00 and published_evaluation_effective_at set"
            - "GET /genetics/inventory-valuation in the next request returns plant_inventory_value_cents 180000, matching before + ${delta}"
            - "no field anywhere is still carrying a pre-write value after the response: the lot's valuation_basis is MARKET_REVALUED and its pre_revaluation_unit_value_cents is 500"
            - "the same immediacy holds for the small writes: a sire creation response already carries version 1, created_at and updated_at, and its by-id read matches byte for byte"

      - name: derived_reads_recompute_from_current_state_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.tank_ln2_level
          - calculations.plant_inventory_value
        distinguishing_aspect: "Immediate consistency here includes clock-derived figures: the tank's level and status change with nothing but a clock advance, so a cached or write-time-only derivation would be visibly stale even though no row was written."
        test_recipe:
          setup:
            - "Tank TK-IM was created at clock 2026-08-01T00:00:00Z with initial_fill_pct 95.0 and service_interval_days 60; one QUARANTINE lot of 100 straws at unit 500 exists."
          setup_api_calls:
            - call: "GET /genetics/tanks"
              payload: { tank_status: "IN_SERVICE" }
              as: ProgramDirector
              captures: { tk: "$.data[0].id", l0: "$.data[0].ln2_level_pct" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /genetics/tanks/${tk}"
              payload: {}
              as: ProgramDirector
              captures: { l1: "$.data.ln2_level_pct" }
          assert:
            - "${l0} == 95.0 at the creation clock and ${l1} == 75.0 after ten elapsed days, with no write to the tank in between"
            - "two consecutive reads at the same clock return the identical figure, so the derivation is a pure function of stored state plus the clock"
            - "GET /genetics/inventory-valuation is equally live: releasing the lot in one request changes released_value_cents in the very next read"
            - "a refused write changes no derived read: a rejected consignment request leaves plant_inventory_value_cents and the distributor aggregates exactly as the previous read returned them"
            - "derived reads never lag behind their source rows by a request: every assertion in this scaffold's recipes reads the final value on the first attempt, with no retry or delay"

      - name: no_step_is_deferred_and_compensation_is_an_explicit_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/genetics/genomic-evaluations/{id}/rollback
          - endpoints.POST_/genetics/_clock/set_current_utc
        distinguishing_aspect: "There is no saga and no background worker: the only two multi-row sweeps in the system - the clock advance and the rollback - are ordinary client calls whose full effect is complete when they return, so nothing in the scaffold is ever eventually consistent."
        test_recipe:
          setup:
            - "One PUBLISHED evaluation has revalued a single lot from 500 to 1800; a sire holds an IBR test whose valid_until is 2026-09-15T00:00:00.000Z and one SCHEDULED future booking."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/genomic-evaluations"
              payload: { status: "PUBLISHED" }
              as: ProgramDirector
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${e_id}/rollback"
              payload: { rollback_reason: "proof withdrawn by the evaluation body" }
              as: ProgramDirector
              captures: { st: "$.data.status" }
          assert:
            - "HTTP 200 with ${st} == \"ROLLED_BACK\"; the lot is already back at 500 with pre_revaluation_unit_value_cents null when the response arrives"
            - "compensation is client-driven, not automatic: nothing rolls the publication back on its own, and the rollback is a declared endpoint with its own role and its own required reason"
            - "the clock advance is the other sweep and is equally synchronous: its response lists the expired tests, suspended sires, voided bookings and service-due tanks, and every listed row already reads in its new state"
            - "there is no partial visibility window: a failed sweep step would have to fail the whole call, and no fixture in this scaffold ever observes a half-swept state"
            - "no operation returns 202 or a job handle - every write returns its final entity representation with the codes declared in §1.5"
