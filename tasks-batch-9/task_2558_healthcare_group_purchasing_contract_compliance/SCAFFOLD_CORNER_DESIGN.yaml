      - name: suspended_contract_cannot_be_reactivated_or_reused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.terminal_states
          - errors.ERR_CONTRACT_NOT_ACTIVE
        distinguishing_aspect: "SUSPENDED is terminal with no reinstatement endpoint: activate, a second suspend, a new commitment election, a new distributor file and a new price activation all return ERR_CONTRACT_NOT_ACTIVE, and the contract's version does not move for any of the five refusals."
