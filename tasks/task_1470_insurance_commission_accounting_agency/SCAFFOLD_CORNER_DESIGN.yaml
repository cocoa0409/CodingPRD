              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "P-TA", reported_amount_cents: 1200100 }, { line_ref: "P-TB", reported_amount_cents: 1200101 } ] }
              as: AgencyAdmin
