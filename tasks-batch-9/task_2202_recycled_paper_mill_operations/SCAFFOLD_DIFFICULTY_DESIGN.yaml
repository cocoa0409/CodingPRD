          assert:
            - "ProductionRun.${run_a}.provisional_quality_index == 85.00 AND off_spec_reel_count == 0"
            - "the first trigger call returns HTTP 200 and ProductionRun.${run_a}.quality_status == CERTIFIED"
            - "ProductionRun.${run_a}.certified_quality_index == 85.00"
            - "ProductionRun.${run_b}.provisional_quality_index == 84.97 AND off_spec_reel_count == 0"
            - "the second trigger call returns HTTP 200 and ProductionRun.${run_b}.quality_status == HELD"
            - "ProductionRun.${run_b}.certified_quality_index == 84.97"
            - "both runs keep run_status == COMPLETED, so the 0.01 gsm reel difference is the sole cause of the divergent quality outcomes"

  # ===========================================================================
  # Rule 7 — cross-entity state dependencies over four distinct entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_start_gated_by_effluent_permit_posture_and_released_by_void
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - state_machines.EffluentPermit.compliance_posture
          - calculations.effluent_rolling_compliance
          - validations.priority_40
          - errors.ERR_PERMIT_EXCEEDANCE_BLOCK
        distinguishing_aspect: |
          Entity pair ProductionRun <-> EffluentPermit: the run's own two status axes are both
          legal and its pulp is sufficient, yet /start is refused because a wholly unrelated
          environmental aggregate on another entity reads EXCEEDANCE; voiding a single
          EffluentReading re-anchors the rolling window, drops the permit to WATCH, and the
          byte-identical /start then succeeds — so the gate depends on the other entity's
          DERIVED posture at request time, not on anything stored on the run.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 / OCC_11, PaperGradeSpec TL_140, PaperMachine PM1 RUNNABLE."
            - "An APPROVED PulpBatch with available_tons 25.500 and run R1 with pulp_draw_tons 20.000, so the fiscal gate is comfortably satisfied."
            - "EffluentPermit MILL-NPDES-01 receives three readings dated 2026-07-28 / 07-29 / 07-30 with 90.00 / 110.00 / 130.00 kg BOD, giving rolling_bod_kg_per_day 110.000 and posture EXCEEDANCE; the newest reading's id is captured so it can be voided."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-machines", payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 20.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.400 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_id: "$.data.id", pm1_v1: "$.data.version" } }
            - { call: "POST /effluent-permits", payload: { permit_number: "MILL-NPDES-01", bod_limit_kg_per_day: 100.00, tss_limit_kg_per_day: 200.00, flow_limit_m3_per_day: 5000.00, rolling_window_days: 7 }, as: EnvironmentalOfficer, as_user_id: "eo_log", captures: { permit_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
