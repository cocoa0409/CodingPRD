            - "After SUSPEND: Trainee.${t1_id}.currency_status == LAPSED"
            - "After SUSPEND: Trainee.${t1_id}.enrollment_status == GRADUATED - unchanged by the currency axis"
            - "After REINSTATE: Credential.${cred1_id}.status == ACTIVE and Trainee.${t1_id}.currency_status == CURRENT"
            - "After REINSTATE: Credential.${cred1_id}.reinstatement_count == 0 - REINSTATE never increments it"
