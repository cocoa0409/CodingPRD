      - name: prepare_sweeps_only_delivered_accrued_loads_and_approved_claims
        claim_type: input_set_filtering
        grounds:
          - calculations.settlement_period_accrual
          - calculations.settlement_line_generation
          - entities.Load.fields.pay_status
          - entities.AccessorialClaim.fields.status
        distinguishing_aspect: |
          The accrual filter is a conjunction: a TENDERED load in the window is invisible because
          movement_status is not DELIVERED and pay_status is not ACCRUED, and a REJECTED claim in the window is
          invisible because its status is not APPROVED. Only the delivered load (46080) and the approved TARPING
          claim (7500) may reach the statement, so gross is 53580 - a handler that swept on the date window alone
          would also pick up the other two rows.
        test_recipe:
