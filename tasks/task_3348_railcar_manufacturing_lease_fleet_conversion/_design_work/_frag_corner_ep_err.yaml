            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${po_ws}", component_id: "${ws_id}", qty_received: 100, receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { rc_ws: $.data.id }
            - call: "POST /api/v1/component-receipts/${rc_ws}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 2, order_date: "2026-09-01", required_delivery_date: "2026-10-01" }
              as: ProductionPlanner
              captures: { po_ok: $.data.id }
          trigger:
            - call: "POST /api/v1/production-orders/${po_short}/reserve-components"
