# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Livestock Transport & Hauling — 20 instances across the 9 Difficulty Rules
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverge_on_excess_shrink
        grounds:
          - calculations.provisional_settlement
          - calculations.final_settlement
          - entities.Settlement.fields.provisional_amount_cents
          - entities.Settlement.fields.final_amount_cents
        distinguishing_aspect: |
          Dual-variant on the Settlement (fiscal domain): identical contract inputs
          (rate 300 cents/mi x 500 mi, declared 40000 lb, shrink 2.0%) yield
          provisional_amount_cents == 150000 at depart, while final_amount_cents ==
          149000 after delivery at 38800 lb because the final variant applies the
          excess-shrink penalty branch (excess 400 lb x 2.5 cents = 1000) that the
          provisional variant structurally ignores.
        test_recipe:
          setup:
            - "Cattle load 40 head / 40000 lb, rate 300 c/mi, 500 mi, shipper default shrink 2.0%, trailer washed, driver assigned; load IN_TRANSIT after departing at 2026-08-02T08:00:00Z"
            - "DELIVERY ticket net 38800 lb recorded; delivered at 2026-08-02T16:30:00Z"
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/drivers", payload: { name: "Dan", license_no: "CDL-D1" }, as: CarrierAdmin, captures: { dr: $.data.id, dr_v: $.data.version } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-1", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 20, max_weight_lb: 26000 }, { compartment_index: 2, max_head_count: 20, max_weight_lb: 26000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:30:00Z", method: "HIGH_PRESSURE" }, as: WashoutOperator }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "Guymon OK", destination: "Dodge City KS", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 20, avg_weight_lb: 2000, expected_load_version: "${ld_v}" }, as: Dispatcher }
            - { call: "GET /haul/loads/${ld}", as: Any, captures: { ld_v2: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c2}", head_count: 20, avg_weight_lb: 2000, expected_load_version: "${ld_v2}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/finalize-plan", payload: {}, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/health-papers", payload: { cert_number: "CVI-1", species: "CATTLE", head_count_listed: 40, issued_at: "2026-07-30T00:00:00Z", expires_at: "2026-08-29T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hp: $.data.id } }
            - { call: "POST /haul/health-papers/${hp}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/brand-inspections", payload: { inspection_no: "BI-1", inspected_at: "2026-08-01T06:30:00Z", brand_owner: "Ranchco", head_count_inspected: 40 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { bi: $.data.id } }
            - { call: "POST /haul/brand-inspections/${bi}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${ld}/verify-paperwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${ld}/assign-driver", payload: { driver_id: "${dr}", expected_driver_version: "${dr_v}" }, as: Dispatcher }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/depart", payload: { origin_temperature_f: 70 }, as: Driver, as_user_id: "${dr}" }
            - { call: "GET /haul/loads/${ld}/settlement", as: Any, captures: { s_id: "$.data[0].id", s_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/arrive", payload: {}, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/loads/${ld}/weight-tickets", payload: { ticket_type: "DELIVERY", gross_lb: 44800, tare_lb: 6000, weighed_at: "2026-08-02T15:30:00Z" }, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/deliver", payload: {}, as: ConsigneeAgent }
          trigger:
            - { call: "GET /haul/settlements/${s_id}", as: Any }
          assert:
            - "Settlement.${s_id}.provisional_amount_cents == 150000"
            - "Settlement.${s_id}.base_amount_cents == 150000"
            - "Settlement.${s_id}.shrink_allowance_lb == 800"
            - "Settlement.${s_id}.shrink_lb == 1200"
            - "Settlement.${s_id}.excess_shrink_lb == 400"
            - "Settlement.${s_id}.shrink_penalty_cents == 1000"
            - "Settlement.${s_id}.final_amount_cents == 149000"
            - "Settlement.${s_id}.final_amount_cents != Settlement.${s_id}.provisional_amount_cents (variant divergence == 1000)"
            - "Settlement.${s_id}.status == PENDING and dispute_deadline_at == 2026-08-04T16:30:00Z"

      - name: driver_session_vs_calendar_day_driving_minutes_diverge_across_midnight
        grounds:
          - calculations.driver_hos_replay
          - entities.Driver.fields.session_driving_minutes
          - entities.Driver.fields.calendar_day_driving_minutes
        distinguishing_aspect: |
          Dual-variant on the Driver (safety/HOS domain, distinct from Settlement):
          one continuous 90-minute drive straddling UTC midnight yields
          session_driving_minutes == 90 (session-based variant) but
          calendar_day_driving_minutes == 30 (calendar-day variant clips the
          23:00-24:00 portion to the prior day).
        test_recipe:
          setup:
            - "Driver exists; logical clock at 2026-08-05T01:00:00Z; duty events: DUTY_ON 2026-08-04T22:00, DRIVING_ON 2026-08-04T23:00, DRIVING_OFF 2026-08-05T00:30"
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers", payload: { name: "Nora", license_no: "CDL-D2" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-04T22:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DRIVING_ON", occurred_at: "2026-08-04T23:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DRIVING_OFF", occurred_at: "2026-08-05T00:30:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "GET /haul/drivers/${dr}", as: Any }
          assert:
            - "Driver.${dr}.session_driving_minutes == 90"
            - "Driver.${dr}.calendar_day_driving_minutes == 30"
            - "Driver.${dr}.session_driving_minutes != Driver.${dr}.calendar_day_driving_minutes (variant divergence == 60)"
            - "Driver.${dr}.hos_status == ELIGIBLE"

  - rule_id: combinatorial_formula
    instances:
      - name: settlement_final_combines_backhaul_shrink_welfare_branches
        grounds:
          - calculations.final_settlement
          - calculations.provisional_settlement
          - calculations.backhaul_eligibility
          - calculations.welfare_fine
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 4 inputs with non-linear interaction — the
          backhaul conditional branch (round(150000 x 0.85) = 127500 base), the
          nested max() excess-shrink branch (excess 1200 lb -> 3000 cents), and the
          welfare branch (ESCAPE/MINOR/head 1 -> round(25000 x 1.5) = 37500 cents)
          compose to final 87000; any single-branch reading yields a different number.
        test_recipe:
          setup:
            - "Prior load L0 (Guymon OK -> Dodge City KS) DELIVERED at 2026-08-01T12:00:00Z on trailer T by driver D"
            - "Trailer T re-washed at 2026-08-01T13:00:00Z (valid until 2026-08-05T13:00:00Z)"
            - "Load L1 origin Dodge City KS == L0.destination, planned departure 2026-08-02T08:00:00Z (20h after L0 delivery, within 72h), backhaul_of_load_id = L0, 40 head / 40000 lb, rate 300 c/mi x 500 mi, shrink default 2.0%"
            - "L1 departs at 2026-08-02T08:00:00Z; ESCAPE MINOR incident (1 head) reported at 09:00; delivered 2026-08-02T18:30 at net 38000 lb; incident then closed with fine"
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/drivers", payload: { name: "Dan", license_no: "CDL-D3" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-3", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 20, max_weight_lb: 26000 }, { compartment_index: 2, max_head_count: 20, max_weight_lb: 26000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:00:00Z", method: "HIGH_PRESSURE" }, as: WashoutOperator }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 20, declared_weight_lb: 20000, origin: "Guymon OK", destination: "Dodge City KS", planned_departure_at: "2026-08-01T06:00:00Z", planned_duration_hours: 6, rate_per_loaded_mile_cents: 300, loaded_miles: 400 }, as: Dispatcher, captures: { l0: $.data.id, l0_v: $.data.version } }
            - { call: "POST /haul/loads/${l0}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 20, avg_weight_lb: 1000, expected_load_version: "${l0_v}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${l0}/finalize-plan", payload: {}, as: Dispatcher }
            - { call: "POST /haul/loads/${l0}/health-papers", payload: { cert_number: "CVI-30", species: "CATTLE", head_count_listed: 20, issued_at: "2026-07-28T00:00:00Z", expires_at: "2026-08-27T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hp0: $.data.id } }
            - { call: "POST /haul/health-papers/${hp0}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${l0}/brand-inspections", payload: { inspection_no: "BI-30", inspected_at: "2026-08-01T00:15:00Z", brand_owner: "Ranchco", head_count_inspected: 20 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { bi0: $.data.id } }
            - { call: "POST /haul/brand-inspections/${bi0}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${l0}/verify-paperwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /haul/drivers/${dr}", as: Any, captures: { dr_v: $.data.version } }
            - { call: "POST /haul/loads/${l0}/assign-driver", payload: { driver_id: "${dr}", expected_driver_version: "${dr_v}" }, as: Dispatcher }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l0}/depart", payload: { origin_temperature_f: 70 }, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l0}/arrive", payload: {}, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/loads/${l0}/weight-tickets", payload: { ticket_type: "DELIVERY", gross_lb: 26000, tare_lb: 6000, weighed_at: "2026-08-01T10:30:00Z" }, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l0}/deliver", payload: {}, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T13:00:00Z", method: "STEAM" }, as: WashoutOperator }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "Dodge City KS", destination: "Amarillo TX", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500, backhaul_of_load_id: "${l0}" }, as: Dispatcher, captures: { l1: $.data.id, l1_v: $.data.version } }
            - { call: "POST /haul/loads/${l1}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 20, avg_weight_lb: 2000, expected_load_version: "${l1_v}" }, as: Dispatcher }
            - { call: "GET /haul/loads/${l1}", as: Any, captures: { l1_v2: $.data.version } }
            - { call: "POST /haul/loads/${l1}/allocations", payload: { trailer_compartment_id: "${c2}", head_count: 20, avg_weight_lb: 2000, expected_load_version: "${l1_v2}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${l1}/finalize-plan", payload: {}, as: Dispatcher }
            - { call: "POST /haul/loads/${l1}/health-papers", payload: { cert_number: "CVI-31", species: "CATTLE", head_count_listed: 40, issued_at: "2026-07-30T00:00:00Z", expires_at: "2026-08-29T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hp1: $.data.id } }
            - { call: "POST /haul/health-papers/${hp1}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T20:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l1}/brand-inspections", payload: { inspection_no: "BI-31", inspected_at: "2026-08-01T19:30:00Z", brand_owner: "Ranchco", head_count_inspected: 40 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { bi1: $.data.id } }
            - { call: "POST /haul/brand-inspections/${bi1}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${l1}/verify-paperwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /haul/drivers/${dr}", as: Any, captures: { dr_v2: $.data.version } }
            - { call: "POST /haul/loads/${l1}/assign-driver", payload: { driver_id: "${dr}", expected_driver_version: "${dr_v2}" }, as: Dispatcher }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l1}/depart", payload: { origin_temperature_f: 70 }, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/incidents", payload: { load_id: "${l1}", incident_type: "ESCAPE", severity: "MINOR", head_count_affected: 1, occurred_at: "2026-08-02T09:00:00Z" }, as: Driver, as_user_id: "${dr}", captures: { inc: $.data.id } }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T18:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l1}/arrive", payload: {}, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/loads/${l1}/weight-tickets", payload: { ticket_type: "DELIVERY", gross_lb: 44000, tare_lb: 6000, weighed_at: "2026-08-02T17:30:00Z" }, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T18:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${l1}/deliver", payload: {}, as: ConsigneeAgent }
            - { call: "GET /haul/loads/${l1}/settlement", as: Any, captures: { s_id: "$.data[0].id" } }
            - { call: "POST /haul/incidents/${inc}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/incidents/${inc}/close", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "GET /haul/settlements/${s_id}", as: Any }
          assert:
            - "Load.${l1}.is_backhaul == true"
            - "Settlement.${s_id}.base_amount_cents == 127500"
            - "Settlement.${s_id}.provisional_amount_cents == 127500"
            - "Settlement.${s_id}.excess_shrink_lb == 1200"
            - "Settlement.${s_id}.shrink_penalty_cents == 3000"
            - "WelfareIncident.${inc}.fine_cents == 37500"
            - "Settlement.${s_id}.welfare_deduction_cents == 37500"
            - "Settlement.${s_id}.final_amount_cents == 87000"

      - name: welfare_fine_aggregates_per_incident_rounded_values
        grounds:
          - calculations.welfare_fine
          - calculations.final_settlement
          - entities.WelfareIncident.fields.fine_cents
          - entities.Settlement.fields.welfare_deduction_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (nested rounding order, distinct from mode (a) above):
          two INJURY/MINOR/head=1 incidents each round to 50000 cents
          (round_half_up(33333 x 1.5) = round_half_up(49999.5)); the pinned
          round-per-incident-then-sum order yields welfare_deduction_cents == 100000,
          while the forbidden sum-then-round order would yield 99999.
        test_recipe:
          setup:
            - "Standard cattle load 40 head / 40000 lb, rate 300 c/mi x 500 mi, IN_TRANSIT from 2026-08-02T08:00:00Z; two INJURY MINOR incidents (1 head each) at 09:00 and 09:30; delivered at 16:30 with net 40000 lb (no shrink penalty); both incidents then closed without waiver"
