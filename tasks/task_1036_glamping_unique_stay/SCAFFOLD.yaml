scenario: |
  Glamping & Unique-Stay Booking (Hipcamp style): host listing & site type
  (yurt/cabin/treehouse), availability & seasonal rate, amenity & experience
  add-on, host payout & fee, review & rules, cancellation, land-use/permit,
  messaging.

domain_name: glamping-unique-stay
# Flat, peer-entity topology: every resource is addressable at the API root
# (`/listings`, `/bookings`, `/hosts`, ...) and entities link by foreign key.
# api_prefix is therefore the root; downstream generators mount collections at
# top level rather than under a single nested prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Listing.version for booking-create supersede
    - cascading_side_effects        # delist / permit-reject / cancel propagation
    - dual_variant_calculation      # booking quote-vs-final; payout estimated-vs-final
    - rate_threshold_triggers       # cancellation refund tiers by days-before-check-in
  entity_topology: flat
  state_machine_shape: branching    # + parallel payment dimension + cyclic listing/permit
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles            # Host owns listings, Guest owns bookings, +operational reviewer/admin
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Host public name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: payout_method, type: enum, source: input, description: "BANK | PAYPAL", default: BANK, constraints: "one of BANK, PAYPAL" }
      - { name: pending_payout_cents, type: integer, source: computed, description: "Sum of estimated_amount_cents over this host's Payouts in SCHEDULED status; conserved ledger quantity", default: 0 }
      - { name: paid_out_cents, type: integer, source: computed, description: "Sum of final_amount_cents over this host's Payouts in PAID or PARTIAL status", default: 0 }
      - { name: completed_stays_count, type: integer, source: computed, description: "Count of this host's Bookings in COMPLETED status", default: 0 }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Guest public name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund credits accrued from cancellations; increases on cancel refunds", default: 0 }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; owning host" }
      - { name: title, type: string, source: input, description: "Listing title" }
      - { name: site_type, type: enum, source: input, description: "YURT | CABIN | TREEHOUSE | DOME | AIRSTREAM", constraints: "one of YURT, CABIN, TREEHOUSE, DOME, AIRSTREAM" }
      - { name: max_guests, type: integer, source: input, description: "Maximum guest_count per booking", constraints: ">= 1" }
      - { name: min_nights, type: integer, source: input, description: "Default minimum nights per booking unless a covering SeasonalRate sets min_nights_override", default: 1, constraints: ">= 1" }
      - { name: base_nightly_rate_cents, type: integer, source: input, description: "Reference nightly rate metadata; pricing always uses covering SeasonalRate windows, and a night not covered by any window is rejected with ERR_NO_RATE_FOR_DATES", constraints: ">= 0" }
      - { name: cleaning_fee_cents, type: integer, source: input, description: "Flat per-stay cleaning fee snapshotted onto each Booking", default: 0, constraints: ">= 0" }
      - { name: cancellation_policy, type: enum, source: input, description: "FLEXIBLE | MODERATE | STRICT", default: MODERATE, constraints: "one of FLEXIBLE, MODERATE, STRICT" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_PERMIT | LISTED | SUSPENDED | DELISTED", default: DRAFT, constraints: "one of DRAFT, PENDING_PERMIT, LISTED, SUSPENDED, DELISTED" }
      - { name: reserved_nights_count, type: integer, source: computed, description: "Sum of nights over this listing's Bookings in CONFIRMED or CHECKED_IN status; conserved occupancy quantity", default: 0 }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; land-use permit is filed for this listing" }
      - { name: permit_type, type: enum, source: input, description: "CAMPING | STRUCTURE | SPECIAL_USE", constraints: "one of CAMPING, STRUCTURE, SPECIAL_USE" }
      - { name: authority_name, type: string, source: input, description: "Issuing jurisdiction / authority" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED", default: DRAFT, constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED" }
      - { name: review_notes, type: string, source: system, description: "Reviewer notes attached on decision; null until decided", default: null }
      - { name: valid_until, type: datetime, source: input, description: "Optional permit validity expiry (ISO 8601); null if perpetual", default: null }

  - name: SeasonalRate
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; rate window belongs to this listing" }
      - { name: start_date, type: datetime, source: input, description: "Window start date (inclusive), ISO 8601 date at 00:00:00Z" }
      - { name: end_date, type: datetime, source: input, description: "Window end date (exclusive), ISO 8601 date at 00:00:00Z; a night dated D is covered when start_date <= D < end_date" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Nightly rate applied to each night whose date falls in this window", constraints: ">= 0" }
      - { name: min_nights_override, type: integer, source: input, description: "If set, overrides Listing.min_nights for bookings whose check_in falls in this window", default: null }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; add-on offered on this listing" }
      - { name: name, type: string, source: input, description: "Add-on display name (e.g. Firewood Bundle, Guided Sunrise Hike)" }
      - { name: category, type: enum, source: input, description: "AMENITY | EXPERIENCE", constraints: "one of AMENITY, EXPERIENCE" }
      - { name: pricing_unit, type: enum, source: input, description: "PER_STAY | PER_NIGHT | PER_GUEST", constraints: "one of PER_STAY, PER_NIGHT, PER_GUEST" }
      - { name: price_cents, type: integer, source: input, description: "Unit price in cents per the pricing_unit", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED add-ons cannot be attached to new bookings", default: ACTIVE, constraints: "one of ACTIVE, RETIRED" }

  - name: ExperienceSlot
    parent: null
    common_fields: true
    fields:
      - { name: add_on_id, type: string, source: input, description: "FK -> AddOn.id; slot belongs to an EXPERIENCE add-on" }
      - { name: slot_date, type: datetime, source: input, description: "Calendar date this experience runs, ISO 8601 date at 00:00:00Z" }
      - { name: max_participants, type: integer, source: input, description: "Aggregate capacity for the slot", constraints: ">= 1" }
      - { name: reserved_participants, type: integer, source: computed, description: "Sum of participant_count over add_ons lines referencing this slot on Bookings in REQUESTED, CONFIRMED, CHECKED_IN, or COMPLETED status", default: 0 }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the stay's listing" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id; the booking guest" }
      - { name: check_in, type: datetime, source: input, description: "Check-in date (inclusive), ISO 8601 date at 00:00:00Z" }
      - { name: check_out, type: datetime, source: input, description: "Check-out date (exclusive), ISO 8601 date at 00:00:00Z; occupancy interval is half-open [check_in, check_out)" }
      - { name: guest_count, type: integer, source: input, description: "Number of guests; must be <= Listing.max_guests", constraints: ">= 1" }
      - { name: nights, type: integer, source: computed, description: "(check_out - check_in) in whole days" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | COMPLETED | DECLINED | CANCELLED", default: REQUESTED, constraints: "one of REQUESTED, CONFIRMED, CHECKED_IN, COMPLETED, DECLINED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension: PENDING | PAID | REFUNDED | PARTIALLY_REFUNDED", default: PENDING, constraints: "one of PENDING, PAID, REFUNDED, PARTIALLY_REFUNDED" }
      - { name: add_ons, type: array, source: system, description: "Array of line objects {add_on_id, experience_slot_id, participant_count, unit_price_snapshot_cents, line_total_cents}; experience_slot_id null for AMENITY lines", default: [] }
      - { name: cleaning_fee_snapshot_cents, type: integer, source: system, description: "Listing.cleaning_fee_cents captured at request time" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional guest total computed at REQUEST time from rates/prices then in effect" }
      - { name: final_total_cents, type: integer, source: computed, description: "Guest total re-computed and locked at ACCEPT time; null until CONFIRMED", default: null }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Cents refunded to guest wallet on cancellation; null until CANCELLED", default: null }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; payout for one booking" }
      - { name: estimated_amount_cents, type: integer, source: computed, description: "Host net earnings projected at SCHEDULED time assuming the stay completes" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Actual host earnings settled at PAID/PARTIAL/VOIDED; null until settled", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAID | PARTIAL | VOIDED", default: SCHEDULED, constraints: "one of SCHEDULED, PAID, PARTIAL, VOIDED" }

  - name: Review
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; review of a completed stay (append-only, immutable)" }
      - { name: rating, type: integer, source: input, description: "Star rating 1..5", constraints: ">= 1 and <= 5" }
      - { name: comment, type: string, source: input, description: "Free-text review body", default: null }

  - name: Message
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; message thread is scoped to a booking (append-only, immutable)" }
      - { name: sender_role, type: enum, source: input, description: "HOST | GUEST", constraints: "one of HOST, GUEST" }
      - { name: sender_id, type: string, source: system, description: "Identity of the sender taken from X-User-ID (Host.id or Guest.id); identity only, not a business-decision input" }
      - { name: body, type: string, source: input, description: "Message text" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    field: status
    initial_state: DRAFT
    terminal_states: [DELISTED]
    note: "Cyclic: LISTED <-> SUSPENDED. Publishing gates on an APPROVED Permit (cross-entity)."
    transitions:
      - from: DRAFT
        to: PENDING_PERMIT
        trigger: "POST /permits/{permit_id}/submit (side effect on parent listing)"
        actor: Host
        preconditions:
          - "Listing.status == DRAFT"
          - "A Permit for this listing exists"
        side_effects:
          - "Listing.status -> PENDING_PERMIT"

      - from: PENDING_PERMIT
        to: LISTED
        trigger: "POST /listings/{listing_id}/publish"
        actor: Host
        preconditions:
          - "Listing.status == PENDING_PERMIT"
          - "The listing's Permit.status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
          - "At least one SeasonalRate exists on the listing"
        side_effects:
          - "Listing.status -> LISTED"

      - from: LISTED
        to: SUSPENDED
        trigger: "POST /listings/{listing_id}/suspend, or system on Permit REJECTED"
        actor: "Host or system"
        preconditions:
          - "Listing.status == LISTED"
        side_effects:
          - "Listing.status -> SUSPENDED"
          - "Cascade: each Booking on this listing in REQUESTED status -> DECLINED (releases nothing; no payout was scheduled)"

      - from: SUSPENDED
        to: LISTED
        trigger: "POST /listings/{listing_id}/reinstate"
        actor: Host
        preconditions:
          - "Listing.status == SUSPENDED"
          - "The listing's Permit.status == APPROVED"
        side_effects:
          - "Listing.status -> LISTED"

      - from: [DRAFT, PENDING_PERMIT, LISTED, SUSPENDED]
        to: DELISTED
        trigger: "POST /listings/{listing_id}/delist"
        actor: Host
        preconditions:
          - "Listing.status != DELISTED"
        side_effects:
          - "Listing.status -> DELISTED"
          - "Cascade L1: each Booking on this listing in CONFIRMED or CHECKED_IN status -> CANCELLED (full-refund, host retains 0)"
          - "Cascade L2 (per cancelled booking): its scheduled Payout -> VOIDED, final_amount_cents = 0"
          - "Cascade L3 (per voided payout): Host.pending_payout_cents decremented by that payout's estimated_amount_cents; booking.refund_amount_cents credited to Guest.wallet_credit_cents; payment_status -> REFUNDED; Listing.reserved_nights_count decremented by that booking's nights"

  - entity: Permit
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    note: "Branching decision with revision cycle: REJECTED -> SUBMITTED (resubmit)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{permit_id}/submit"
        actor: Host
        preconditions:
          - "Permit.status == DRAFT"
        side_effects:
          - "Permit.status -> SUBMITTED"
          - "If parent Listing.status == DRAFT: Listing.status -> PENDING_PERMIT"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permits/{permit_id}/decision with outcome=APPROVE"
        actor: PermitReviewer
        preconditions:
          - "Permit.status == SUBMITTED (else ERR_PERMIT_ALREADY_DECIDED)"
        side_effects:
          - "Permit.status -> APPROVED"
          - "review_notes set from request"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /permits/{permit_id}/decision with outcome=REJECT"
        actor: PermitReviewer
        preconditions:
          - "Permit.status == SUBMITTED (else ERR_PERMIT_ALREADY_DECIDED)"
        side_effects:
          - "Permit.status -> REJECTED"
          - "review_notes set from request"
          - "Cascade P1: if parent Listing.status == LISTED, Listing.status -> SUSPENDED"
          - "Cascade P2 (from that suspension): each Booking on the listing in REQUESTED status -> DECLINED"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /permits/{permit_id}/submit (resubmit after revisions)"
        actor: Host
        preconditions:
          - "Permit.status == REJECTED"
        side_effects:
          - "Permit.status -> SUBMITTED"
          - "review_notes cleared to null"

  - entity: Booking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    note: "Branching at REQUESTED (accept vs decline) with divergent side-effects; CANCELLED reachable from CONFIRMED/CHECKED_IN."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/accept"
        actor: Host
        preconditions:
          - "Booking.status == REQUESTED"
          - "Listing.status == LISTED (cross-entity; else ERR_LISTING_NOT_LISTED)"
          - "No Booking on the listing in CONFIRMED or CHECKED_IN status overlaps [check_in, check_out) (else ERR_DATES_UNAVAILABLE)"
        side_effects:
          - "Booking.status -> CONFIRMED"
          - "final_total_cents locked via booking_final_total (re-snapshot of current rates/add-on prices)"
          - "Creates a Payout {status: SCHEDULED, estimated_amount_cents = payout_estimated}"
          - "Host.pending_payout_cents += Payout.estimated_amount_cents"
          - "Listing.reserved_nights_count += nights"

      - from: [REQUESTED]
        to: DECLINED
        trigger: "POST /bookings/{booking_id}/decline, or system cascade (listing suspend/permit reject)"
        actor: "Host or system"
        preconditions:
          - "Booking.status == REQUESTED"
        side_effects:
          - "Booking.status -> DECLINED"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{booking_id}/check-in"
        actor: Host
        preconditions:
          - "Booking.status == CONFIRMED"
          - "current clock date >= check_in (else ERR_CHECKIN_TOO_EARLY)"
        side_effects:
          - "Booking.status -> CHECKED_IN"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bookings/{booking_id}/complete"
        actor: Host
        preconditions:
          - "Booking.status == CHECKED_IN"
        side_effects:
          - "Booking.status -> COMPLETED"
          - "payment_status -> PAID"
          - "Payout.status -> PAID; Payout.final_amount_cents = payout_final (= estimated_amount_cents on a clean completed stay)"
          - "Host.pending_payout_cents -= estimated_amount_cents; Host.paid_out_cents += final_amount_cents"
          - "Host.completed_stays_count += 1"

      - from: [CONFIRMED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel, or system cascade (listing delist)"
        actor: "Guest or system"
        preconditions:
          - "Booking.status in {CONFIRMED, CHECKED_IN} (else ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "refund_amount_cents = cancellation_refund (policy tier x days-before-check-in)"
          - "Booking.status -> CANCELLED"
          - "payment_status -> REFUNDED if refund_amount_cents == cleaning_plus_stay base (full) else PARTIALLY_REFUNDED"
          - "Guest.wallet_credit_cents += refund_amount_cents"
          - "Payout.status -> VOIDED if final_amount_cents == 0 else PARTIAL; Payout.final_amount_cents = payout_on_cancel"
          - "Host.pending_payout_cents -= estimated_amount_cents; Host.paid_out_cents += Payout.final_amount_cents"
          - "Listing.reserved_nights_count -= nights"

  - entity: Booking
    field: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED]
    note: "Parallel dimension evolving independently of status: charge captured on complete, reversed on cancel."
    transitions:
      - from: PENDING
        to: PAID
        trigger: "system on booking complete"
        actor: system
        preconditions:
          - "Booking.status transition CHECKED_IN -> COMPLETED"
        side_effects: []
      - from: [PENDING, PAID]
        to: PARTIALLY_REFUNDED
        trigger: "system on booking cancel with partial refund"
        actor: system
        preconditions:
          - "0 < refund_amount_cents < refundable_base_cents"
        side_effects: []
      - from: [PENDING, PAID]
        to: REFUNDED
        trigger: "system on booking cancel with full refund"
        actor: system
        preconditions:
          - "refund_amount_cents == refundable_base_cents"
        side_effects: []

  - entity: Payout
    field: status
    initial_state: SCHEDULED
    terminal_states: [PAID, PARTIAL, VOIDED]
    note: "Settlement outcome mirrors booking terminal outcome."
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "system on booking complete"
        actor: system
        preconditions:
          - "parent Booking.status -> COMPLETED"
        side_effects:
          - "final_amount_cents = estimated_amount_cents"
      - from: SCHEDULED
        to: PARTIAL
        trigger: "system on booking cancel retaining host share"
        actor: system
        preconditions:
          - "payout_on_cancel > 0"
        side_effects:
          - "final_amount_cents = payout_on_cancel"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system on booking cancel with full refund or listing delist"
        actor: system
        preconditions:
          - "payout_on_cancel == 0"
        side_effects:
          - "final_amount_cents = 0"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /listings/{listing_id}/bookings"
    occ_field: "expected_listing_version"
    description: |
      Creating a Booking request against a Listing whose version has advanced
      since the guest last observed it is rejected. A guest quotes a stay off a
      given Listing snapshot; if another booking request was accepted or the host
      published a new SeasonalRate in the meantime (either legitimately bumps
      Listing.version and changes the availability/price surface the quote relied
      on), the guest's view is stale and the create is refused so the guest cannot
      commit against an outdated price/availability projection.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_quote_total
    trigger: "POST /listings/{listing_id}/bookings (provisional, at REQUEST time); recomputed by booking_final_total at ACCEPT"
    algorithm: tiered_pricing
    formula: |
      # Provisional guest total using rates/add-on prices in effect at request time.
      nights = days(check_out - check_in)                    # half-open
      for each night date D in [check_in, check_out):
        rate_D = nightly_rate_cents of the SeasonalRate on this listing whose
                 [start_date, end_date) contains D            # else ERR_NO_RATE_FOR_DATES
      nightly_subtotal = sum(rate_D for all nights)
      discount_pct = MONTHLY_DISCOUNT_PCT if nights >= 28
                     else WEEKLY_DISCOUNT_PCT if nights >= 7
                     else 0                                    # tier selection (max applicable)
      discounted_nightly = round(nightly_subtotal * (1 - discount_pct))   # ROUND-ORDER: discount the SUM, then round once
      addons_subtotal = sum over add_ons lines of line_total_cents where
                        PER_STAY -> price_cents
                        PER_NIGHT -> price_cents * nights
                        PER_GUEST -> price_cents * guest_count
      subtotal = discounted_nightly + addons_subtotal + cleaning_fee_snapshot_cents
      guest_fee = round(subtotal * GUEST_FEE_RATE)             # rounded AFTER subtotal is summed
      quoted_total_cents = subtotal + guest_fee
    input_set: "Nights covered by SeasonalRate windows on the listing; ACTIVE add-on lines attached to the booking."
    constants:
      GUEST_FEE_RATE: 0.12
      WEEKLY_DISCOUNT_PCT: 0.10
      MONTHLY_DISCOUNT_PCT: 0.28
    precision: "cents, round_half_up"
    variants:
      - name: provisional_quote
        when: "at REQUEST time"
        difference: "Uses rates/add-on prices then in effect; stored as quoted_total_cents; never re-read for settlement."
      - name: final_lock
        when: "at ACCEPT time (booking_final_total)"
        difference: "Re-snapshots the same formula against rates/prices in effect at accept; stored as final_total_cents and used for all downstream settlement."

  - name: booking_final_total
    trigger: "POST /bookings/{booking_id}/accept (locks the number used for settlement)"
    algorithm: tiered_pricing
    formula: |
      Identical formula to booking_quote_total but evaluated against SeasonalRate
      and AddOn prices in effect at ACCEPT time. Result stored as final_total_cents.
      final_total_cents differs from quoted_total_cents whenever the host changed a
      covering SeasonalRate.nightly_rate_cents or an AddOn.price_cents between request
      and accept.
    input_set: "Same night/add-on set, re-priced at accept time."
    constants:
      GUEST_FEE_RATE: 0.12
      WEEKLY_DISCOUNT_PCT: 0.10
      MONTHLY_DISCOUNT_PCT: 0.28
    precision: "cents, round_half_up"

  - name: payout_estimated
    trigger: "POST /bookings/{booking_id}/accept (Payout created SCHEDULED)"
    algorithm: aggregation
    formula: |
      # Host net projected assuming the stay completes. Uses final_total_cents inputs.
      stay_and_addons = discounted_nightly + addons_subtotal          # excludes cleaning + guest_fee
      host_fee = round(stay_and_addons * HOST_FEE_RATE)
      estimated_amount_cents = discounted_nightly + addons_subtotal
                               + cleaning_fee_snapshot_cents - host_fee
      # Host keeps cleaning fee; platform takes GUEST_FEE_RATE from guest and HOST_FEE_RATE from host's stay revenue.
    input_set: "The confirmed booking's locked components."
    constants:
      HOST_FEE_RATE: 0.03
    precision: "cents, round_half_up"
    variants:
      - name: estimated
        when: "at ACCEPT / Payout SCHEDULED"
        difference: "Full projected earnings; drives Host.pending_payout_cents."
      - name: final
        when: "at COMPLETE or CANCEL (payout_final / payout_on_cancel)"
        difference: "Actual settled earnings; equals estimated on clean completion, but is host's retained share on cancellation and 0 on delist/full-refund."

  - name: payout_final
    trigger: "POST /bookings/{booking_id}/complete"
    algorithm: aggregation
    formula: |
      final_amount_cents = estimated_amount_cents   # clean completion pays the full estimate
    input_set: "The completed booking's scheduled payout."
    precision: "cents, round_half_up"

  - name: cancellation_refund
    trigger: "POST /bookings/{booking_id}/cancel, or system on listing delist"
    algorithm: threshold
    formula: |
      refundable_base_cents = discounted_nightly + addons_subtotal + cleaning_fee_snapshot_cents
      # (the guest_fee component of the total is platform revenue and is NEVER refundable)
      days_before = (date(check_in) - date(current_clock_utc)) in whole days
      policy = Listing.cancellation_policy
      refund_pct =
        FLEXIBLE: 1.00 if days_before >= 1 else 0.00
        MODERATE: 1.00 if days_before >= 7 else (0.50 if days_before >= 1 else 0.00)
        STRICT:   0.50 if days_before >= 14 else 0.00
      refund_amount_cents = round(refundable_base_cents * refund_pct)
      # Delist cascade forces refund_pct = 1.00 (host-fault full refund) regardless of policy.
    input_set: "The cancelling booking; clock position relative to check_in; listing policy."
    constants:
      FLEXIBLE_FULL_MIN_DAYS: 1
      MODERATE_FULL_MIN_DAYS: 7
      MODERATE_HALF_MIN_DAYS: 1
      STRICT_HALF_MIN_DAYS: 14
    precision: "cents, round_half_up"

  - name: payout_on_cancel
    trigger: "POST /bookings/{booking_id}/cancel"
    algorithm: aggregation
    formula: |
      host_retained_gross = refundable_base_cents - refund_amount_cents
      host_fee_on_retained = round(host_retained_gross * HOST_FEE_RATE)
      payout_on_cancel = host_retained_gross - host_fee_on_retained
      # Payout -> VOIDED when payout_on_cancel == 0, else PARTIAL.
    input_set: "The cancelling booking after cancellation_refund is computed."
    constants:
      HOST_FEE_RATE: 0.03
    precision: "cents, round_half_up"

  - name: experience_slot_reserved
    trigger: "POST /bookings/{booking_id}/add-ons (attach EXPERIENCE line); recomputed on booking decline/cancel"
    algorithm: aggregation
    formula: |
      reserved_participants(slot) = sum(participant_count) over add_ons lines that
        reference this slot on Bookings in {REQUESTED, CONFIRMED, CHECKED_IN, COMPLETED}
      # Attaching is rejected when reserved_participants + participant_count > max_participants.
    input_set: "All non-terminal-decline/cancel bookings' add-on lines on the slot."
    precision: "integer"

  - name: money_conservation_invariant
    trigger: "invariant checked at every booking terminal outcome (complete / cancel / delist)"
    algorithm: aggregation
    formula: |
      # Named conserved quantity: per-booking money split.
      guest_charged = final_total_cents            # what the guest is on the hook for at CONFIRMED
      platform_revenue = guest_fee + host_fee_component_realized
      INVARIANT: guest_charged == guest_wallet_refund + host_earnings + platform_revenue
        where on COMPLETE: guest_wallet_refund=0, host_earnings=payout_final,      platform_revenue=guest_fee+host_fee
              on CANCEL:    guest_wallet_refund=refund_amount_cents,
                            host_earnings=payout_on_cancel,
                            platform_revenue=guest_fee + host_fee_on_retained
    input_set: "Single booking ledger."
    precision: "cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc is admin-only but still authed"

  - priority: 2
    category: auth
    check: "Role is authorized for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Acting entity_backed user owns the target resource (Host owns listing/permit/rate/add-on/booking-side host ops; Guest owns own booking)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-guarded mutations"

  - priority: 4
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range, rating 1..5, dates parse and check_out > check_in"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 400
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Permit decision/submit target is in the required permit state"
    error_id: ERR_PERMIT_ALREADY_DECIDED
    http_status: 400
    applies_to: "POST /permits/{permit_id}/decision"

  - priority: 8
    category: state
    check: "Cancel target booking is CONFIRMED or CHECKED_IN"
    error_id: ERR_BOOKING_NOT_CANCELLABLE
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/cancel"

  - priority: 9
    category: business_safety
    check: "Listing is LISTED when requesting a booking against it and when accepting it (cross-entity gate)"
    error_id: ERR_LISTING_NOT_LISTED
    http_status: 400
    applies_to: "POST /listings/{listing_id}/bookings, POST /bookings/{booking_id}/accept"

  - priority: 10
    category: business_safety
    check: "Publish requires the listing's Permit.status == APPROVED"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 400
    applies_to: "POST /listings/{listing_id}/publish, POST /listings/{listing_id}/reinstate"

  - priority: 11
    category: business_referential
    check: "Attached add-on belongs to the booking's listing and is ACTIVE"
    error_id: ERR_ADDON_NOT_OFFERED
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/add-ons"

  - priority: 12
    category: business_referential
    check: "Referenced experience_slot belongs to the referenced add-on"
    error_id: ERR_ADDON_LISTING_MISMATCH
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/add-ons"

  - priority: 13
    category: business_referential
    check: "EXPERIENCE add-on line must reference an experience_slot_id; AMENITY must not"
    error_id: ERR_EXPERIENCE_SLOT_REQUIRED
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/add-ons"

  - priority: 14
    category: business_temporal
    check: "Every night of the stay is covered by a SeasonalRate window on the listing"
    error_id: ERR_NO_RATE_FOR_DATES
    http_status: 400
    applies_to: "POST /listings/{listing_id}/bookings"

  - priority: 15
    category: business_temporal
    check: "New SeasonalRate window does not overlap an existing window on the listing (half-open [start,end))"
    error_id: ERR_RATE_OVERLAP
    http_status: 409
    applies_to: "POST /listings/{listing_id}/seasonal-rates"

  - priority: 16
    category: business_temporal
    check: "Booking interval [check_in, check_out) does not overlap any CONFIRMED/CHECKED_IN booking on the listing"
    error_id: ERR_DATES_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/accept"

  - priority: 17
    category: business_temporal
    check: "experience_slot.slot_date falls within [check_in, check_out) of the booking"
    error_id: ERR_SLOT_DATE_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/add-ons"

  - priority: 18
    category: business_constraint
    check: "Stay length nights >= effective min_nights (SeasonalRate.min_nights_override on check_in window else Listing.min_nights)"
    error_id: ERR_MIN_NIGHTS_NOT_MET
    http_status: 400
    applies_to: "POST /listings/{listing_id}/bookings"

  - priority: 19
    category: business_constraint
    check: "guest_count <= Listing.max_guests"
    error_id: ERR_MAX_GUESTS_EXCEEDED
    http_status: 400
    applies_to: "POST /listings/{listing_id}/bookings"

  - priority: 20
    category: business_constraint
    check: "reserved_participants(slot) + participant_count <= slot.max_participants"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/add-ons"

  - priority: 21
    category: business_constraint
    check: "Review allowed only when the booking is COMPLETED, and at most one review per booking"
    error_id: ERR_REVIEW_NOT_ALLOWED
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/reviews"

  - priority: 22
    category: business_constraint
    check: "check-in only when current clock date >= check_in"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 400
    applies_to: "POST /bookings/{booking_id}/check-in"

  - priority: 23
    category: business_constraint
    check: "One review per booking (duplicate rejected)"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/reviews"

  - priority: 24
    category: business_fiscal
    check: "expected_listing_version matches Listing.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /listings/{listing_id}/bookings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set to the given instant; governs days_before and check-in gating"]

  # --- Host ---
  - method: POST
    path: "/hosts"
    description: "Onboard a host"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email, "payout_method?"]
    output: Host
    side_effects: ["pending_payout_cents=0, paid_out_cents=0, completed_stays_count=0"]

  - method: GET
    path: "/hosts/{id}"
    description: "Get a host (includes payout ledger fields)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Host
    side_effects: []

  # --- Guest ---
  - method: POST
    path: "/guests"
    description: "Onboard a guest"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email]
    output: Guest
    side_effects: ["wallet_credit_cents=0"]

  - method: GET
    path: "/guests/{id}"
    description: "Get a guest (includes wallet_credit_cents)"
    roles: [Guest, Host, PlatformAdmin]
    code: 200
    input: []
    output: Guest
    side_effects: []

  # --- Listing ---
  - method: POST
    path: "/listings"
    description: "Create a listing (DRAFT)"
    roles: [Host]
    code: 201
    input: [host_id, title, site_type, max_guests, "min_nights?", base_nightly_rate_cents, "cleaning_fee_cents?", "cancellation_policy?"]
    output: Listing
    side_effects: ["status=DRAFT, reserved_nights_count=0, version=1"]

  - method: GET
    path: "/listings/{id}"
    description: "Get a listing"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List/filter listings (also FK reverse-reachability for Listing.host_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: ["host_id?", "status?", "site_type?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/listings/{id}/publish"
    description: "Publish a listing PENDING_PERMIT -> LISTED"
    roles: [Host]
    code: 200
    input: []
    output: Listing
    side_effects: ["Requires Permit APPROVED and >=1 SeasonalRate; status -> LISTED"]

  - method: POST
    path: "/listings/{id}/suspend"
    description: "Suspend a listing LISTED -> SUSPENDED"
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["status -> SUSPENDED; REQUESTED bookings on listing -> DECLINED"]

  - method: POST
    path: "/listings/{id}/reinstate"
    description: "Reinstate a listing SUSPENDED -> LISTED"
    roles: [Host]
    code: 200
    input: []
    output: Listing
    side_effects: ["Requires Permit APPROVED; status -> LISTED"]

  - method: POST
    path: "/listings/{id}/delist"
    description: "Permanently delist; cascades to bookings/payouts"
    roles: [Host]
    code: 200
    input: []
    output: Listing
    side_effects:
      - "status -> DELISTED"
      - "CONFIRMED/CHECKED_IN bookings -> CANCELLED (full refund), payouts -> VOIDED, host ledger + guest wallet + reserved_nights_count reconciled"

  # --- Permit ---
  - method: POST
    path: "/listings/{id}/permits"
    description: "File a land-use permit for a listing (DRAFT)"
    roles: [Host]
    code: 201
    input: [listing_id, permit_type, authority_name, "valid_until?"]
    output: Permit
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/listings/{id}/permits"
    description: "List a listing's permits (FK reverse-reachability for Permit.listing_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit or resubmit a permit for review"
    roles: [Host]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> SUBMITTED; DRAFT listing -> PENDING_PERMIT; review_notes cleared on resubmit"]

  - method: POST
    path: "/permits/{id}/decision"
    description: "Reviewer approves or rejects a submitted permit"
    roles: [PermitReviewer]
    code: 200
    input: [outcome, "review_notes?"]
    output: Permit
    side_effects:
      - "outcome=APPROVE -> APPROVED; outcome=REJECT -> REJECTED"
      - "REJECT cascade: LISTED listing -> SUSPENDED, REQUESTED bookings -> DECLINED"

  # --- SeasonalRate ---
  - method: POST
    path: "/listings/{id}/seasonal-rates"
    description: "Add a seasonal rate window (bumps Listing.version)"
    roles: [Host]
    code: 201
    input: [listing_id, start_date, end_date, nightly_rate_cents, "min_nights_override?"]
    output: SeasonalRate
    side_effects: ["Rejects overlap with existing window; increments Listing.version by 1"]

  - method: GET
    path: "/listings/{id}/seasonal-rates"
    description: "List a listing's seasonal rates (FK reverse-reachability for SeasonalRate.listing_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: SeasonalRate[]
    side_effects: []

  - method: PATCH
    path: "/seasonal-rates/{id}"
    description: "Reprice an existing seasonal-rate window (bumps Listing.version); does not change dates"
    roles: [Host]
    code: 200
    input: ["nightly_rate_cents?", "min_nights_override?"]
    output: SeasonalRate
    side_effects: ["Updates nightly_rate_cents/min_nights_override; increments the parent Listing.version by 1"]

  # --- AddOn ---
  - method: POST
    path: "/listings/{id}/add-ons"
    description: "Create an amenity/experience add-on"
    roles: [Host]
    code: 201
    input: [listing_id, name, category, pricing_unit, price_cents]
    output: AddOn
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/listings/{id}/add-ons"
    description: "List a listing's add-ons (FK reverse-reachability for AddOn.listing_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: AddOn[]
    side_effects: []

  - method: GET
    path: "/add-ons/{id}"
    description: "Get an add-on"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # --- ExperienceSlot ---
  - method: POST
    path: "/add-ons/{id}/slots"
    description: "Create an experience slot (EXPERIENCE add-ons only)"
    roles: [Host]
    code: 201
    input: [add_on_id, slot_date, max_participants]
    output: ExperienceSlot
    side_effects: ["reserved_participants=0"]

  - method: GET
    path: "/add-ons/{id}/slots"
    description: "List an add-on's slots (FK reverse-reachability for ExperienceSlot.add_on_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: ExperienceSlot[]
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/listings/{id}/bookings"
    description: "Guest requests a booking (REQUESTED). OCC on Listing.version."
    roles: [Guest]
    code: 201
    input: [listing_id, guest_id, check_in, check_out, guest_count, expected_listing_version]
    output: Booking
    side_effects:
      - "status=REQUESTED, payment_status=PENDING, cleaning_fee_snapshot_cents captured, quoted_total_cents computed"
      - "Validates listing LISTED, rate coverage, min_nights, max_guests, OCC version"
      - "increments Listing.version by 1"

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List/filter bookings (FK reverse-reachability for Booking.guest_id and Booking.listing_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: ["guest_id?", "listing_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/add-ons"
    description: "Attach an amenity/experience line to a REQUESTED booking"
    roles: [Guest]
    code: 200
    input: [add_on_id, "experience_slot_id?", "participant_count?"]
    output: Booking
    side_effects:
      - "Appends an add_ons line with unit_price_snapshot_cents and line_total_cents; re-computes quoted_total_cents"
      - "EXPERIENCE lines reserve slot capacity (experience_slot_reserved)"

  - method: POST
    path: "/bookings/{id}/accept"
    description: "Host accepts REQUESTED -> CONFIRMED"
    roles: [Host]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Locks final_total_cents; creates SCHEDULED Payout; Host.pending_payout_cents += estimated; Listing.reserved_nights_count += nights"

  - method: POST
    path: "/bookings/{id}/decline"
    description: "Host declines REQUESTED -> DECLINED"
    roles: [Host]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> DECLINED; releases any reserved experience-slot participants"]

  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Host checks a guest in CONFIRMED -> CHECKED_IN"
    roles: [Host]
    code: 200
    input: []
    output: Booking
    side_effects: ["Requires clock date >= check_in; status -> CHECKED_IN"]

  - method: POST
    path: "/bookings/{id}/complete"
    description: "Host completes CHECKED_IN -> COMPLETED"
    roles: [Host]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "payment_status -> PAID; Payout -> PAID; host ledger settled; Host.completed_stays_count += 1"

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Guest cancels CONFIRMED/CHECKED_IN -> CANCELLED"
    roles: [Guest]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "refund_amount_cents computed by policy tier; wallet credited; Payout -> PARTIAL/VOIDED; ledger + reserved_nights_count reconciled"

  # --- Payout ---
  - method: GET
    path: "/bookings/{id}/payout"
    description: "Get the payout for a booking (FK reverse-reachability for Payout.booking_id; array of 0..1)"
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Payout[]
    side_effects: []

  # --- Review ---
  - method: POST
    path: "/bookings/{id}/reviews"
    description: "Guest reviews a COMPLETED stay"
    roles: [Guest]
    code: 201
    input: [booking_id, rating, "comment?"]
    output: Review
    side_effects: ["Rejected unless booking COMPLETED and no existing review"]

  - method: GET
    path: "/bookings/{id}/reviews"
    description: "List a booking's reviews (FK reverse-reachability for Review.booking_id; array of 0..1)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Review[]
    side_effects: []

  # --- Message ---
  - method: POST
    path: "/bookings/{id}/messages"
    description: "Post a message to a booking thread (host or guest party)"
    roles: [Host, Guest]
    code: 201
    input: [booking_id, sender_role, body]
    output: Message
    side_effects: ["Appends immutable message; sender_id taken from X-User-ID"]

  - method: GET
    path: "/bookings/{id}/messages"
    description: "List a booking thread (FK reverse-reachability for Message.booking_id)"
    roles: [Host, Guest, PlatformAdmin]
    code: 200
    input: []
    output: Message[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range integer, check_out <= check_in, rating outside 1..5" }
  - { id: ERR_INVALID_STATE, http: 400, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PERMIT_ALREADY_DECIDED, http: 400, condition: "Permit decision attempted on a permit not in SUBMITTED" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 400, condition: "Cancel on a booking not in CONFIRMED/CHECKED_IN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_listing_version does not match Listing.version (OCC)" }
  - { id: ERR_LISTING_NOT_LISTED, http: 400, condition: "Accepting a booking whose listing is not LISTED" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 400, condition: "Publish/reinstate requires the listing's Permit APPROVED" }
  - { id: ERR_NO_RATE_FOR_DATES, http: 400, condition: "A night of the requested stay is not covered by any SeasonalRate window" }
  - { id: ERR_RATE_OVERLAP, http: 409, condition: "New SeasonalRate window overlaps an existing window on the listing" }
  - { id: ERR_DATES_UNAVAILABLE, http: 409, condition: "Booking interval overlaps a CONFIRMED/CHECKED_IN booking on the listing" }
  - { id: ERR_MIN_NIGHTS_NOT_MET, http: 400, condition: "Stay shorter than effective minimum nights" }
  - { id: ERR_MAX_GUESTS_EXCEEDED, http: 400, condition: "guest_count exceeds Listing.max_guests" }
  - { id: ERR_ADDON_NOT_OFFERED, http: 400, condition: "Add-on not on the booking's listing or not ACTIVE" }
  - { id: ERR_ADDON_LISTING_MISMATCH, http: 400, condition: "Referenced experience_slot does not belong to the referenced add-on" }
  - { id: ERR_EXPERIENCE_SLOT_REQUIRED, http: 400, condition: "EXPERIENCE line missing slot, or AMENITY line supplied a slot" }
  - { id: ERR_SLOT_DATE_OUT_OF_RANGE, http: 400, condition: "experience_slot.slot_date outside the booking stay window" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Slot reservation would exceed max_participants" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 400, condition: "Check-in before the clock reaches check_in date" }
  - { id: ERR_REVIEW_NOT_ALLOWED, http: 400, condition: "Review on a non-COMPLETED booking" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "A review already exists for the booking" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Host
    description: "Owns listings and everything under them (permits, rates, add-ons, slots) and drives host-side booking lifecycle for own listings."
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /listings"
      - "POST /listings/{id}/publish"
      - "POST /listings/{id}/reinstate"
      - "POST /listings/{id}/delist"
      - "POST /listings/{id}/permits"
      - "POST /permits/{id}/submit"
      - "POST /listings/{id}/seasonal-rates"
      - "POST /listings/{id}/add-ons"
      - "POST /add-ons/{id}/slots"
      - "POST /bookings/{id}/accept"
      - "POST /bookings/{id}/decline"
      - "POST /bookings/{id}/check-in"
      - "POST /bookings/{id}/complete"
    shared_operations:
      - "POST /listings/{id}/suspend (with PlatformAdmin)"
      - "POST /bookings/{id}/messages (with Guest)"
      - "GET endpoints (with Guest, PlatformAdmin)"

  - name: Guest
    description: "Owns bookings; requests/attaches/cancels/reviews own stays."
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /listings/{id}/bookings"
      - "POST /bookings/{id}/add-ons"
      - "POST /bookings/{id}/cancel"
      - "POST /bookings/{id}/reviews"
    shared_operations:
      - "POST /bookings/{id}/messages (with Host)"
      - "GET endpoints (with Host, PlatformAdmin)"

  - name: PermitReviewer
    description: "Operational land-use reviewer; the only role that decides permits."
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/{id}/decision"
    shared_operations: []

  - name: PlatformAdmin
    description: "Operational platform staff; onboarding, clock control, and reads."
    identity: "opaque"
    exclusive_operations:
      - "POST /hosts"
      - "POST /guests"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /listings/{id}/suspend (with Host)"
      - "GET endpoints (with Host, Guest)"
