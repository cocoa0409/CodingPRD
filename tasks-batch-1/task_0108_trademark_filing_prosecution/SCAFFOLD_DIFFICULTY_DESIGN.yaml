scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: filing_fee_use_vs_intent_diverges
        grounds:
          - calculations.application_filing_fee
          - entities.TrademarkApplication.fields.filing_fee_cents
          - entities.TrademarkApplication.fields.filing_basis
          - state_machines.TrademarkApplication.DRAFT_to_FILED
        distinguishing_aspect: |
          Two USE-vs-INTENT applications with identical TEAS_PLUS tier and identical 2 distinct
          Nice classes produce different filing_fee_cents (USE=50000, INTENT=70000) because the
          INTENT variant adds INTENT_SURCHARGE_PER_CLASS_CENTS per class; this is fee accounting on
          TrademarkApplication.
        test_recipe:
          setup:
            - "clock set to 2026-01-01"
            - "Nice classes 9 and 25 seeded; one ACTIVE Attorney; one US Applicant"
            - "App-USE: TEAS_PLUS, USE, two pre_approved items in classes 9 and 25, FILED"
            - "App-INTENT: TEAS_PLUS, INTENT, two pre_approved items in classes 9 and 25, FILED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /nice-classes"
              payload: { class_number: 25, title: "Clothing" }
              as: Examiner
              captures: { nc25: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-100", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "ZEPHYR", filing_basis: "USE", filing_tier: "TEAS_PLUS" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_use: $.data.id }
            - call: "POST /applications/${app_use}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_use}/goods-services"
              payload: { nice_class_id: "${nc25}", description: "t-shirts", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_use}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "ZEPHYR PRO", filing_basis: "INTENT", filing_tier: "TEAS_PLUS" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_intent: $.data.id }
            - call: "POST /applications/${app_intent}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_intent}/goods-services"
              payload: { nice_class_id: "${nc25}", description: "t-shirts", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /applications/${app_intent}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
              captures: { intent_fee: $.data.filing_fee_cents }
          assert:
            - "TrademarkApplication.${app_use}.filing_fee_cents == 50000"
            - "TrademarkApplication.${app_intent}.filing_fee_cents == 70000"

      - name: risk_score_snapshot_vs_projected_diverges
        grounds:
          - calculations.prosecution_risk_score
          - entities.Applicant.fields.open_application_count
          - endpoints[GET /applicants/{id}/risk-score]
          - state_machines.TrademarkApplication.UNDER_EXAMINATION_to_OFFICE_ACTION_ISSUED
        distinguishing_aspect: |
          For an applicant with one OUTSTANDING OfficeAction whose mirrored DocketDeadline due_at is
          already in the past (clock advanced past it), the snapshot risk_score is 15 (W_OPEN_OA once)
          but the projected score is 30 (W_OPEN_OA again for the blown-but-unswept PENDING deadline);
          this is risk scoring on the Applicant domain, distinct from the fee accounting on Application.
        test_recipe:
          setup:
            - "clock 2026-01-01; Nice class 9; Attorney; US Applicant; one application filed, examined"
            - "one OUTSTANDING non-final OfficeAction issued 2026-01-01 (response_deadline 2026-04-01)"
            - "clock advanced to 2026-04-02 (past the response_deadline, deadline still PENDING)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-101", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "ORBIT", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", ground: "MERELY_DESCRIPTIVE", is_final: false }
              as: Examiner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "GET /applicants/${acme_id}/risk-score"
              payload: {}
              as: Examiner
              captures: { snap: $.data.risk_score }
            - call: "GET /applicants/${acme_id}/risk-score?include_pending_deadlines=true"
              payload: {}
              as: Examiner
              captures: { proj: $.data.risk_score }
          assert:
            - "snapshot GET /applicants/${acme_id}/risk-score returns data.risk_score == 15"
            - "projected GET /applicants/${acme_id}/risk-score?include_pending_deadlines=true returns data.risk_score == 30"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_fee_three_input_branch_mode_a
        grounds:
          - calculations.maintenance_fee
          - entities.MaintenanceFiling.fields.fee_cents
          - entities.MaintenanceFiling.fields.filing_type
          - entities.MaintenanceFiling.fields.in_grace_period
        distinguishing_aspect: |
          Mode (a): fee_cents depends non-linearly on three inputs — filing_type (adds the §9
          component only for SECTION_8_AND_9), class_count (per-class multiplier), and in_grace_period
          (adds the grace surcharge); a SECTION_8_AND_9 filing on a 2-class registration in grace =
          125000, while the timely 2-class SECTION_8 alone would be 45000.
        test_recipe:
          setup:
            - "a 2-class registration exists (registered 2026-01-01) whose §8&9 window opened and a grace-period §8&9 filing is made"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /nice-classes"
              payload: { class_number: 25, title: "Clothing" }
              as: Examiner
              captures: { nc25: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-102", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "NIMBUS", filing_basis: "USE", filing_tier: "TEAS_PLUS" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc25}", description: "t-shirts", pre_approved: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/register"
              payload: {}
              as: Examiner
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-03-01T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "POST /maintenance-filings"
              payload: { registration_id: "${reg_id}", filing_type: "SECTION_8_AND_9", expected_registration_version: "${reg_v}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { mf_fee: $.data.fee_cents, in_grace: $.data.in_grace_period }
          assert:
            - "MaintenanceFiling.fee_cents == 125000"
            - "MaintenanceFiling.in_grace_period == true"

      - name: filing_fee_surcharge_then_multiply_order_mode_c
        grounds:
          - calculations.application_filing_fee
          - entities.TrademarkApplication.fields.filing_fee_cents
          - state_machines.TrademarkApplication.DRAFT_to_FILED
        distinguishing_aspect: |
          Mode (c): evaluation order is pinned — the INTENT surcharge is added to per_class BEFORE
          multiplying by class_count, so an INTENT TEAS_STANDARD 3-class app = (35000+10000)*3 = 135000;
          the wrong order (35000*3)+10000 = 115000, a different value, which the pinned order excludes.
        test_recipe:
          setup:
            - "clock 2026-01-01; classes 9,25,35 seeded; Attorney; US Applicant; INTENT TEAS_STANDARD app with three classes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /nice-classes"
              payload: { class_number: 25, title: "Clothing" }
              as: Examiner
              captures: { nc25: $.data.id }
            - call: "POST /nice-classes"
              payload: { class_number: 35, title: "Advertising" }
              as: Examiner
              captures: { nc35: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-103", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "VANTAGE", filing_basis: "INTENT", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "software services" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc25}", description: "apparel" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc35}", description: "retail services" }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
              captures: { fee: $.data.filing_fee_cents }
          assert:
            - "TrademarkApplication.${app_id}.filing_fee_cents == 135000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_office_action_revision_loop_cycle
        grounds:
          - state_machines.TrademarkApplication.UNDER_EXAMINATION_to_OFFICE_ACTION_ISSUED
          - state_machines.TrademarkApplication.OFFICE_ACTION_ISSUED_to_UNDER_EXAMINATION
          - entities.TrademarkApplication.fields.office_action_round
        distinguishing_aspect: |
          The application cycles UNDER_EXAMINATION -> OFFICE_ACTION_ISSUED -> UNDER_EXAMINATION ->
          OFFICE_ACTION_ISSUED, returning to the same state twice; office_action_round increments to 2
          across the loop — a genuine cycle on TrademarkApplication (distinct entity from the TTAB
          parallel machine).
        test_recipe:
          setup:
            - "clock 2026-01-01; class 9; Attorney; US Applicant; USE TEAS_STANDARD app filed and examined"
            - "first non-final OfficeAction issued then responded (back to UNDER_EXAMINATION)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-104", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "LOOPER", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", ground: "IDENTIFICATION_INDEFINITE", is_final: false }
              as: Examiner
              captures: { oa1: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${oa1}", argument_text: "amended identification", amends_identification: true }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", ground: "IDENTIFICATION_INDEFINITE", is_final: true }
              as: Examiner
              captures: { oa2_round: $.data.round_number }
          assert:
            - "OfficeAction.${app_id}.latest.round_number == 2"
            - "TrademarkApplication.${app_id}.status == OFFICE_ACTION_ISSUED"
            - "TrademarkApplication.${app_id}.office_action_round == 2"

      - name: ttab_parallel_claim_and_defense_dimensions
        grounds:
          - state_machines.TTABProceeding.defense_status=AWAITING_ANSWER_to_defense_status=ANSWERED
          - state_machines.TTABProceeding.claim_status=PLEADED_to_claim_status=TRIAL
          - entities.TTABProceeding.fields.claim_status
          - entities.TTABProceeding.fields.defense_status
        distinguishing_aspect: |
          The proceeding's defense_status advances AWAITING_ANSWER -> ANSWERED independently of
          claim_status, and claim_status advances PLEADED -> TRIAL only after defense_status==ANSWERED;
          the two dimensions evolve on the same TTABProceeding row (parallel state machine), a distinct
          entity from the TrademarkApplication cycle.
        test_recipe:
          setup:
            - "clock 2026-01-01; a published application opposed by a second applicant; proceeding PLEADED/AWAITING_ANSWER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-105", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Owner Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { owner_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Rival Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { rival_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${owner_id}", attorney_id: "${att_id}", mark_text: "PARALLEL", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /ttab-proceedings"
              payload: { proceeding_type: "OPPOSITION", target_application_id: "${app_id}", petitioner_applicant_id: "${rival_id}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /ttab-proceedings/${proc_id}/answer"
              payload: {}
              as: Applicant
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /ttab-proceedings/${proc_id}/set-for-trial"
              payload: {}
              as: TTABClerk
              captures: { claim: $.data.claim_status, defense: $.data.defense_status }
          assert:
            - "TTABProceeding.${proc_id}.defense_status == ANSWERED"
            - "TTABProceeding.${proc_id}.claim_status == TRIAL"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancellation_sustained_cascades_registration_then_madrid
        grounds:
          - state_machines.TTABProceeding.claim_status=TRIAL_to_claim_status=SUSTAINED
          - state_machines.Registration.transitions
          - state_machines.MadridApplication.CERTIFIED_to_CEASED
          - entities.MadridApplication.fields.dependency_end_at
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger: decide(SUSTAIN) on a CANCELLATION sets
          Registration.status=CANCELLED (link 1), and that registration cancellation within the
          dependency period ceases the dependent MadridApplication to CEASED (link 2 caused by link 1) —
          three distinct entities (TTABProceeding -> Registration -> MadridApplication).
        test_recipe:
          setup:
            - "clock 2026-01-01; a USE app registered; a CERTIFIED Madrid app based on it (dependency_end_at 2031-01-01)"
            - "a cancellation proceeding instituted by a rival, answered, set for trial"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-106", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Owner Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { owner_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Rival Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { rival_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${owner_id}", attorney_id: "${att_id}", mark_text: "CENTRAL", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/register"
              payload: {}
              as: Examiner
              captures: { reg_id: $.data.id }
            - call: "POST /madrid-applications"
              payload: { basic_application_id: "${app_id}", designated_countries: ["FR", "DE", "JP"] }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { madrid_id: $.data.id }
            - call: "POST /madrid-applications/${madrid_id}/certify"
              payload: {}
              as: Examiner
            - call: "POST /ttab-proceedings"
              payload: { proceeding_type: "CANCELLATION", target_registration_id: "${reg_id}", petitioner_applicant_id: "${rival_id}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /ttab-proceedings/${proc_id}/answer"
              payload: {}
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "POST /ttab-proceedings/${proc_id}/set-for-trial"
              payload: {}
              as: TTABClerk
          trigger:
            - call: "POST /ttab-proceedings/${proc_id}/decide"
              payload: { decision: "SUSTAIN" }
              as: TTABClerk
          assert:
            - "TTABProceeding.${proc_id}.claim_status == SUSTAINED"
