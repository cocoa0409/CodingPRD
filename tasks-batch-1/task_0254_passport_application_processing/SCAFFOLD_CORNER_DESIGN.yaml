        test_recipe:
          setup:
            - "Adult RENEWAL BOOK ROUTINE application (no name change), PASS photo, IDENTITY+CITIZENSHIP docs attached, submitted."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Renew", date_of_birth: "1985-01-01", email: "renew@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "RENEWAL", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version", rex: "$.data.requires_execution" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
