            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_b}", term_id: "${t1}", attempted_credits: 50 }, as: Registrar, captures: { e_b1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_b1}/post", payload: { earned_credits: 40, quality_points: 150.0, gpa_hours: 50 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_a}", term_id: "${t2}", attempted_credits: 50 }, as: Registrar, captures: { e_a2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_a2}/post", payload: { earned_credits: 27, quality_points: 81.0, gpa_hours: 50 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_b}", term_id: "${t2}", attempted_credits: 50 }, as: Registrar, captures: { e_b2: $.data.id } }
