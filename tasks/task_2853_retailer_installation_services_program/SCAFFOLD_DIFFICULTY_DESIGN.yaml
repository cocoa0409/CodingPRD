            - "Project.${p2_id}.fulfillment_status == MEASURED (no assignment was created)"
            - "GET /projects/${p2_id} shows version == ${p2_version} — the rejected write did not bump it"
            - "Installer.${inst_id}.committed_minutes == 480 — still only the P1 assignment"

      - name: unknown_installer_with_stale_version_returns_installer_not_found
        grounds:
          - validations[priority 7].ERR_<ENTITY>_NOT_FOUND
          - validations[priority 10].ERR_STALE_PROJECT_VERSION
          - concurrency_rules.assignment-create-stale-project
          - errors.ERR_INSTALLER_NOT_FOUND
          - errors.ERR_STALE_PROJECT_VERSION
        distinguishing_aspect: |
          A THIRD category pair — existence (priority 7) vs state (priority 10).
          The body carries an installer_id that resolves to nothing AND an
          expected_project_version one behind the stored version, so the
          existence rule must win with ERR_INSTALLER_NOT_FOUND (404) rather than
          the OCC rule's ERR_STALE_PROJECT_VERSION (412). Implementations that
          run the cheap OCC comparison first return 412 and fail.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-DIRECT and Jurisdiction METRO-01."
            - "One Customer and one Project with estimated_units 420.00, deposit 59002 paid so the project is assignment-ready."
