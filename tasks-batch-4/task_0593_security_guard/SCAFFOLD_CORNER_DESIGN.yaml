            - "IncidentReport.${inc_id}.escalated_by_user_id == 'sup-1'"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_shift_version_on_reassignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shift-assign-stale-shift]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /shifts/{id}/assignments]
        distinguishing_aspect: "Reassignment is legitimate (SCHEDULED→SCHEDULED supersedes), so only OCC catches a stale writer: replaying the ORIGINAL expected_shift_version after a successful assignment returns 412 ERR_STALE_VERSION, while using the post-assignment version succeeds."
        test_recipe:
          setup: ["Two ACTIVE, LICENSED guards (Ada, Bram) and one OPEN_UNFILLED shift 2026-05-04T08:00Z→16:00Z; the client has observed CoverageShift.version == 1."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "OCC Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "OCC Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "OCC Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Ada Stone", employee_code: "C-280", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { ada_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${ada_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-280", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ada_lic: $.data.id }
            - call: "POST /credentials/${ada_lic}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${ada_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /guards"
              payload: { full_name: "Bram Lowe", employee_code: "C-281", pay_rate_cents_per_hour: 2400 }
              as: ComplianceOfficer
              captures: { bram_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${bram_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-281", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { bram_lic: $.data.id }
            - call: "POST /credentials/${bram_lic}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${bram_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v1: $.data.version }
          trigger:
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${ada_id}", expected_shift_version: "${shift_v1}" }
              as: Scheduler
              captures: { shift_v2: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${bram_id}", expected_shift_version: "${shift_v1}" }
              as: Scheduler
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${bram_id}", expected_shift_version: "${shift_v2}" }
              as: Scheduler
          assert:
            - "First assignment: HTTP status == 200 and CoverageShift.${shift_id}.guard_id == ${ada_id}"
            - "Second assignment (stale version): HTTP status == 412 and data.error_id == 'ERR_STALE_VERSION'"
            - "After the stale attempt: CoverageShift.${shift_id}.guard_id == ${ada_id} and pay_rate_cents_per_hour == 2200"
            - "Third assignment (fresh version): HTTP status == 200"
            - "CoverageShift.${shift_id}.guard_id == ${bram_id}"
            - "CoverageShift.${shift_id}.pay_rate_cents_per_hour == 2400"
            - "Guard.${ada_id}.committed_hours == 0.0"
            - "Guard.${bram_id}.committed_hours == 7.5"

      - name: occ_stale_post_version_on_post_order_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[post-order-create-stale-post]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /post-orders]
        distinguishing_aspect: "A second POST /post-orders replaying the original expected_post_version (1) after the first create bumped Post.version to 2 returns 412 ERR_STALE_VERSION; only one PostOrder exists on the post afterwards."
        test_recipe:
          setup: ["A post exists with version == 1."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "PO OCC Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "PO OCC Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "PO OCC Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v1: $.data.version }
          trigger:
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v1}", body_text: "Revision A.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po1_id: $.data.id }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v1}", body_text: "Revision B.", revision_label: "REV-B" }
              as: AccountManager
          assert:
            - "First create: HTTP status == 201 and PostOrder.${po1_id}.status == DRAFT"
            - "Second create (stale version): HTTP status == 412 and data.error_id == 'ERR_STALE_VERSION'"
            - "GET /post-orders?post_id=${post_id} returns total_count == 1"
            - "GET /posts?site_id=${site_id} returns data[0].version == 2"

      - name: cascading_release_on_termination_recomputes_site_and_hours
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Guard.employment_status IN {ACTIVE, SUSPENDED}_to_employment_status=TERMINATED
          - calculations.guard_committed_hours
          - calculations.site_coverage_status
        distinguishing_aspect: "TERMINATE releases only FUTURE SCHEDULED/CONFIRMED shifts: a shift starting before the clock stays assigned, while the future one flips to OPEN_UNFILLED, dropping committed_hours from 15.0 to 7.5 and flipping the site to AT_RISK."
        test_recipe:
          setup:
            - "Guard Ola is ACTIVE and LICENSED with two SCHEDULED shifts on a capacity-2 post: past shift 2026-05-04T08:00Z→16:00Z and future shift 2026-05-06T08:00Z→16:00Z (7.5 scheduled hours each, committed_hours 15.0)."
            - "The clock has been advanced to 2026-05-05T00:00:00Z, so only the 2026-05-06 shift is in the future."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Term Cascade Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Cascade Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Cascade Post", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 2 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Ola Reid", employee_code: "C-290", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-290", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { past_id: $.data.id, past_v: $.data.version }
            - call: "POST /shifts/${past_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${past_v}" }
              as: Scheduler
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-06T08:00:00Z", scheduled_end_at: "2026-05-06T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { fut_id: $.data.id, fut_v: $.data.version }
            - call: "POST /shifts/${fut_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${fut_v}" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "TERMINATE" }
              as: ComplianceOfficer
          assert:
            - "Before TERMINATE: Guard.${guard_id}.committed_hours == 15.0"
            - "Guard.${guard_id}.employment_status == TERMINATED"
            - "CoverageShift.${fut_id}.status == OPEN_UNFILLED and CoverageShift.${fut_id}.guard_id == null"
            - "CoverageShift.${past_id}.status == SCHEDULED and CoverageShift.${past_id}.guard_id == ${guard_id}"
            - "Guard.${guard_id}.committed_hours == 7.5"
            - "Site.${site_id}.coverage_status == AT_RISK"

