      - name: allocation_blocked_while_the_pickup_branch_is_in_count_freeze
        grounds:
          - validations[priority=9]
          - state_machines.PartOrder.DRAFT_to_ALLOCATED
          - entities.Branch.fields.branch_status
          - errors[ERR_BRANCH_NOT_OPEN]
        distinguishing_aspect: |
          A third entity pair, PartOrder -> Branch, gated on a warehouse-operations state rather
          than a credit or competence state: COUNT_FREEZE blocks the reservation with
          ERR_BRANCH_NOT_OPEN even though the account is ACTIVE and the stock is present, and
          reopening the branch lets the identical request through.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL created OPEN with will_call_enabled true; Part P1 (12999 MECHANICAL); InventoryRecord (STL, P1) with on_hand_units 10."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL, account_status ACTIVE."
            - "A WILL_CALL order at STL holds one line for 2 units of P1 (20798) and is credit-approved."
            - "STL is then put into COUNT_FREEZE for a physical inventory."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
