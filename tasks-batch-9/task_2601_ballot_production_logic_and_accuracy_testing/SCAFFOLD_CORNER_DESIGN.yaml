              payload: {}
              as: ElectionsDirector
            - call: "POST /candidates/${c_bro}/disqualify"
              payload: { disqualified_reason: "Residency requirement not met" }
              as: ElectionsDirector
          trigger:
            - call: "GET /ballot-styles/${st}/layout"
              payload: {}
              as: BallotCoordinator
              captures: { b0: $.data.basis, cc0: $.data.candidate_count, ct0: $.data.contest_count, rev0: $.data.revision, seed0: $.data.rotation_seed_index, pol0: $.data.rotation_policy }
            - call: "GET /ballot-styles/${st}/layout"
