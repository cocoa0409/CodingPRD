scenario: |
  2840. Construction Manager at Risk & Guaranteed Maximum Price Administration (construction manager at risk firm): preconstruction services with progressive estimating and design milestone reconciliation, guaranteed maximum price establishment with assumptions, allowances and clarifications log, contingency structure separating owner contingency from construction contingency with draw approval rules, self-performed work bidding and open-book cost transparency, change event classification between scope change and contingency use, shared savings calculation at closeout with audit rights, subcontractor default and bond claim within the guaranteed price, monthly cost report reconciliation and buyout savings tracking

domain_name: cmar-gmp-administration
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Ten peer collections at the URL root; every relationship is expressed as a
  # foreign key in the request body, never as URL nesting. Action segments
  # (/estimates/{id}/submit) are verbs on a peer resource, not hierarchy.

  state_machine_shape: parallel
  # WorkPackage carries two independent state axes (procurement_status x
  # transparency_status) and Subcontract carries two (contract_status x
  # bond_claim_status). ChangeEvent and GmpProposal additionally branch
  # (fork with divergent side-effect sets) and cycle (revision loops), and
  # CmarProject.contingency_posture is a derived aggregate that gates child
  # operations.

  relationship_patterns:
    - one_to_many          # CmarProject -> ProgressiveEstimate / WorkPackage / ChangeEvent / ContingencyDraw / CostReport
    - self_referential     # ProgressiveEstimate.prior_estimate_id / superseded_by_estimate_id; GmpProposal.superseded_by_proposal_id
    - cross_aggregate      # CostReport.lines[].work_package_id, ContingencyDraw.source_subcontract_id, ChangeEvent.qualification_item_id

  role_model: segregation_of_duties
  # Five operator roles. Two duties are separated at the X-User-ID level, not
  # merely at the role level: the operator who prepared a self-perform bid may
  # not open it, and the operator who submitted a change event may not classify
  # it. Auditing is reserved to an outside role that cannot touch cost data.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  MILESTONE_RANK: { SD: 1, DD: 2, CD_50: 3, CD_100: 4, GMP_BASIS: 5 }
  MILESTONE_VARIANCE_THRESHOLD_PCT: 0.0500        # strict `>` breach
  DRAW_OWNER_APPROVAL_THRESHOLD: 50000.00         # strict `>` breach
  CONSTRAINED_POSTURE_PCT: 0.10                   # `<=` triggers CONSTRAINED
  REPLACEMENT_PREMIUM_MULTIPLIER: 1.15
  MOBILIZATION_BUFFER_HOURS: 72
  SAVINGS_TIER_1_MAX_PCT: 0.02                    # `<=` stays in tier 1
  SAVINGS_TIER_2_MAX_PCT: 0.05                    # `<=` stays in tier 2
  SAVINGS_TIER_1_CM_RATE: 0.25
  SAVINGS_TIER_2_CM_RATE: 0.35
  SAVINGS_TIER_3_CM_RATE: 0.50
  CM_SHARE_CAP_OF_FEE_PCT: 0.25
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MONEY_PRECISION: "2 decimal places, ROUND_HALF_UP"
  RATIO_PRECISION: "4 decimal places, ROUND_HALF_UP"

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: CmarProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: project name
        constraints: "1..200 chars"
      - name: owner_org
        type: string
        source: input
        description: name of the owner organization holding the CMAR contract
        constraints: "1..200 chars"
      - name: cm_fee_pct
        type: number
        source: input
        description: construction manager's fee rate applied per calculations.gmp_establishment_pricing
        constraints: "> 0 and <= 0.1500; 4 decimal places"
      - name: insurance_rate
        type: number
        source: input
        description: builder's-risk/insurance rate applied per calculations.gmp_establishment_pricing
        constraints: ">= 0 and <= 0.0500; 4 decimal places"
      - name: precon_fee_amount
        type: number
        source: input
        description: lump-sum preconstruction services fee, invoiced outside the guaranteed maximum price
        default: 0.00
        constraints: ">= 0; 2 decimal places"
      - name: gmp_status
        type: enum
        source: computed
        description: lifecycle of the guaranteed maximum price itself
        default: PRECONSTRUCTION
        constraints: "PRECONSTRUCTION | GMP_UNDER_REVIEW | EXECUTED | CLOSED"
      - name: gmp_amount
        type: number
        source: computed
        description: executed guaranteed maximum price; set by the BASE GmpProposal EXECUTE transition and adjusted by every executed AMENDMENT proposal
        default: 0.00
      - name: proposed_gmp_amount
        type: number
        source: computed
        description: "gmp_amount plus the amount_delta of every AMENDMENT GmpProposal whose status is in {DRAFT, OWNER_REVIEW}; see calculations.proposed_gmp_rollup"
        default: 0.00
      - name: cost_of_work_budget_total
        type: number
        source: computed
        description: budgeted cost of work inside the guaranteed maximum price
        default: 0.00
      - name: general_conditions_total
        type: number
        source: computed
        description: budgeted general conditions inside the guaranteed maximum price
        default: 0.00
      - name: insurance_amount
        type: number
        source: computed
        description: insurance component pinned at GMP execution by calculations.gmp_establishment_pricing step 2
        default: 0.00
      - name: cm_fee_amount
        type: number
        source: computed
        description: construction manager fee pinned at GMP execution by calculations.gmp_establishment_pricing step 3
        default: 0.00
      - name: owner_contingency_original
        type: number
        source: computed
        description: owner contingency funded at GMP execution
        default: 0.00
      - name: owner_contingency_remaining
        type: number
        source: computed
        description: owner contingency not yet consumed by POSTED ContingencyDraw rows of contingency_type OWNER
        default: 0.00
      - name: construction_contingency_original
        type: number
        source: computed
        description: construction (CM-held) contingency funded at GMP execution
        default: 0.00
      - name: construction_contingency_remaining
        type: number
        source: computed
        description: construction contingency not yet consumed by POSTED ContingencyDraw rows of contingency_type CONSTRUCTION
        default: 0.00
      - name: contingency_drawn_to_cost_total
        type: number
        source: computed
        description: "sum of ContingencyDraw.amount over draws of this project whose status == POSTED; the third term that keeps calculations.gmp_price_conservation balanced"
        default: 0.00
      - name: contingency_posture
        type: enum
        source: computed
        description: derived aggregate gate over construction contingency depletion; see calculations.contingency_posture_derivation
        default: OPEN
        constraints: "OPEN | CONSTRAINED | FROZEN"
      - name: pending_amendment_count
        type: integer
        source: computed
        description: "count of AMENDMENT GmpProposal rows for this project whose status is in {DRAFT, OWNER_REVIEW}"
        default: 0
      - name: buyout_savings_trade_level
        type: number
        source: computed
        description: gross per-package buyout savings; TRADE_LEVEL variant of calculations.buyout_savings_tracking
        default: 0.00
      - name: buyout_savings_project_net
        type: number
        source: computed
        description: net buyout savings after overruns offset underruns; PROJECT_NET variant of calculations.buyout_savings_tracking
        default: 0.00
      - name: audit_status
        type: enum
        source: computed
        description: owner audit-rights engagement state
        default: NOT_REQUESTED
        constraints: "NOT_REQUESTED | IN_PROGRESS | CLOSED"
      - name: audit_adjustment_total
        type: number
        source: computed
        description: signed sum of every adjustment_amount posted by the IndependentAuditor while audit_status == IN_PROGRESS
        default: 0.00
      - name: closeout_status
        type: enum
        source: computed
        description: shared-savings closeout progress
        default: NOT_STARTED
        constraints: "NOT_STARTED | PROVISIONAL_COMPUTED | FINAL_COMPUTED | SETTLEMENT_EXECUTED"
      - name: provisional_savings_pool
        type: number
        source: computed
        description: PRE_AUDIT_PROVISIONAL savings pool from calculations.shared_savings_split
        default: 0.00
      - name: provisional_cm_savings_share
        type: number
        source: computed
        description: CM share of the PRE_AUDIT_PROVISIONAL pool
        default: 0.00
      - name: provisional_owner_savings_share
        type: number
        source: computed
        description: owner share of the PRE_AUDIT_PROVISIONAL pool
        default: 0.00
      - name: final_savings_pool
        type: number
        source: computed
        description: POST_AUDIT_FINAL savings pool from calculations.shared_savings_split
        default: 0.00
      - name: final_cm_savings_share
        type: number
        source: computed
        description: CM share of the POST_AUDIT_FINAL pool
        default: 0.00
      - name: final_owner_savings_share
        type: number
        source: computed
        description: owner share of the POST_AUDIT_FINAL pool
        default: 0.00

  - name: ProgressiveEstimate
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CmarProject.id; the project this design-milestone estimate belongs to"
      - name: prior_estimate_id
        type: string
        source: input
        description: "FK -> ProgressiveEstimate.id; optional client-declared predecessor; when supplied it must belong to the same project and carry a strictly lower milestone_rank"
        default: null
      - name: milestone_code
        type: enum
        source: input
        description: design milestone this estimate prices
        constraints: "SD | DD | CD_50 | CD_100 | GMP_BASIS"
      - name: milestone_rank
        type: integer
        source: computed
        description: global_constants.MILESTONE_RANK lookup of milestone_code
      - name: submitted_cost_of_work
        type: number
        source: input
        description: estimated cost of work at this milestone
        constraints: "> 0; 2 decimal places"
      - name: variance_pct
        type: number
        source: computed
        description: signed ratio against the reconciliation basis; see calculations.estimate_milestone_variance
        default: 0.0000
      - name: variance_basis
        type: enum
        source: computed
        description: which basis calculations.estimate_milestone_variance selected
        default: NO_BASIS
        constraints: "NO_BASIS | DECLARED_PRIOR | HIGHEST_RECONCILED_MILESTONE"
      - name: variance_basis_estimate_id
        type: string
        source: computed
        description: "FK -> ProgressiveEstimate.id; the server-selected basis estimate, null when variance_basis == NO_BASIS"
        default: null
      - name: justification_note
        type: string
        source: input
        description: written justification, required at submit time when the variance breaches global_constants.MILESTONE_VARIANCE_THRESHOLD_PCT
        default: null
      - name: status
        type: enum
        source: computed
        description: milestone reconciliation lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RECONCILED | RETURNED | SUPERSEDED"
      - name: reconciliation_stale
        type: boolean
        source: computed
        description: set true by the SCOPE_CHANGE classification cascade on every RECONCILED estimate of the project
        default: false
      - name: reconciliation_note
        type: string
        source: computed
        description: note recorded by the OwnerRepresentative on the reconcile decision
        default: null
      - name: superseded_by_estimate_id
        type: string
        source: computed
        description: "FK -> ProgressiveEstimate.id; set when a newer estimate for the same milestone_code supersedes this row"
        default: null

  - name: GmpProposal
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CmarProject.id; the project being priced"
      - name: proposal_type
        type: enum
        source: computed
        description: "BASE for proposals created through POST /gmp-proposals; AMENDMENT for rows synthesized by the SCOPE_CHANGE classification cascade"
        default: BASE
        constraints: "BASE | AMENDMENT"
      - name: based_on_estimate_id
        type: string
        source: input
        description: "FK -> ProgressiveEstimate.id; the RECONCILED estimate this BASE proposal is priced from; null on AMENDMENT rows"
        default: null
      - name: change_event_id
        type: string
        source: computed
        description: "FK -> ChangeEvent.id; set by the SCOPE_CHANGE classification cascade on AMENDMENT rows, null on BASE rows"
        default: null
      - name: cost_of_work_total
        type: number
        source: input
        description: cost-of-work component of the proposed guaranteed maximum price
        constraints: "> 0 on BASE rows; 0.00 on AMENDMENT rows"
      - name: general_conditions_total
        type: number
        source: input
        description: general-conditions component of the proposed guaranteed maximum price
        constraints: ">= 0; 2 decimal places"
      - name: owner_contingency_amount
        type: number
        source: input
        description: owner contingency requested inside the guaranteed maximum price
        constraints: ">= 0; 2 decimal places"
      - name: construction_contingency_amount
        type: number
        source: input
        description: construction (CM-held) contingency requested inside the guaranteed maximum price
        constraints: "> 0 on BASE rows; 2 decimal places"
      - name: amount_delta
        type: number
        source: computed
        description: "signed change to CmarProject.gmp_amount on execution; equals ChangeEvent.estimated_amount on AMENDMENT rows, 0.00 on BASE rows"
        default: 0.00
      - name: provisional_fee_amount
        type: number
        source: computed
        description: step-1 output of calculations.gmp_establishment_pricing, retained so the pinned evaluation order is observable
        default: 0.00
      - name: insurance_amount
        type: number
        source: computed
        description: step-2 output of calculations.gmp_establishment_pricing
        default: 0.00
      - name: cm_fee_amount
        type: number
        source: computed
        description: step-3 output of calculations.gmp_establishment_pricing
        default: 0.00
      - name: gmp_amount
        type: number
        source: computed
        description: step-4 output of calculations.gmp_establishment_pricing on BASE rows; on AMENDMENT rows the project's gmp_amount at creation time plus amount_delta
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: owner-side negotiation lifecycle with a revision loop
        default: DRAFT
        constraints: "DRAFT | OWNER_REVIEW | RETURNED_FOR_REVISION | EXECUTED | REJECTED | SUPERSEDED"
      - name: owner_decision_note
        type: string
        source: computed
        description: note recorded by the OwnerRepresentative on the decide call
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of times this proposal has been returned for revision
        default: 0
      - name: superseded_by_proposal_id
        type: string
        source: computed
        description: "FK -> GmpProposal.id; set when a newer BASE proposal supersedes this non-executed BASE row"
        default: null

  - name: QualificationItem
    parent: null
    common_fields: true
    fields:
      - name: gmp_proposal_id
        type: string
        source: input
        description: "FK -> GmpProposal.id; the proposal whose assumptions/allowances/clarifications log this entry belongs to"
      - name: item_type
        type: enum
        source: input
        description: kind of qualification recorded against the guaranteed maximum price
        constraints: "ASSUMPTION | ALLOWANCE | CLARIFICATION | EXCLUSION"
      - name: text
        type: string
        source: input
        description: qualification language as written into the GMP exhibit
        constraints: "1..1000 chars"
      - name: allowance_amount
        type: number
        source: input
        description: carried allowance dollars; required when item_type == ALLOWANCE, must be null otherwise
        default: null
        constraints: "> 0 when present; 2 decimal places"
      - name: allocated_units
        type: number
        source: input
        description: allowance quantity carried in the GMP; required when item_type == ALLOWANCE, must be null otherwise
        default: null
        constraints: "> 0 when present; 2 decimal places"
      - name: unit_of_measure
        type: string
        source: input
        description: unit label for allocated_units, e.g. SF or EA; required when item_type == ALLOWANCE
        default: null
      - name: allowance_unit_rate
        type: number
        source: computed
        description: "round(allowance_amount / allocated_units, 4); 0.0000 for non-ALLOWANCE items"
        default: 0.0000
      - name: remaining_units
        type: number
        source: computed
        description: allowance units not yet consumed; the conserved half of calculations.allowance_unit_conservation
        default: 0.00
      - name: reconciled_units
        type: number
        source: computed
        description: allowance units consumed by RECONCILE actions net of REVERSE actions
        default: 0.00
      - name: reconciled_amount
        type: number
        source: computed
        description: actual dollars booked against this allowance
        default: 0.00
      - name: variance_amount
        type: number
        source: computed
        description: "reconciled_amount minus round(reconciled_units * allowance_unit_rate, 2); positive means allowance overrun"
        default: 0.00
      - name: reconciliation_seq
        type: integer
        source: computed
        description: count of RECONCILE actions ever posted against this item; a REVERSE action names the seq it undoes
        default: 0
      - name: last_action
        type: enum
        source: computed
        description: most recent allowance-ledger action applied
        default: NONE
        constraints: "NONE | RECONCILE | REVERSE"
      - name: status
        type: enum
        source: computed
        description: "OPEN while reconciled_units == 0; PARTIALLY_RECONCILED while 0 < reconciled_units < allocated_units; FULLY_RECONCILED when reconciled_units == allocated_units; always OPEN for non-ALLOWANCE items"
        default: OPEN
        constraints: "OPEN | PARTIALLY_RECONCILED | FULLY_RECONCILED"

  - name: WorkPackage
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CmarProject.id; the project this trade package is bought out under"
      - name: trade_division
        type: string
        source: input
        description: "CSI trade division label, e.g. 03-CONCRETE"
        constraints: "1..60 chars"
      - name: budget_amount
        type: number
        source: input
        description: buyout budget carried for this package inside the cost of work
        constraints: "> 0; 2 decimal places"
      - name: self_perform_intent
        type: boolean
        source: input
        description: true when the CM intends to bid this package with its own forces
        default: false
      - name: procurement_status
        type: enum
        source: computed
        description: "first independent state axis: buyout progress"
        default: BUDGETED
        constraints: "BUDGETED | SOLICITING | AWARDED | REPROCUREMENT | CLOSED"
      - name: transparency_status
        type: enum
        source: computed
        description: "second independent state axis: open-book disclosure progress; evolves without regard to procurement_status"
        default: SEALED
        constraints: "SEALED | DISCLOSED | AUDITED"
      - name: solicitation_opens_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the bid solicitation opened, set by the solicit transition
        default: null
      - name: solicitation_closes_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the bid solicitation closes, set by the solicit transition
        default: null
      - name: awarded_bid_id
        type: string
        source: computed
        description: "FK -> SelfPerformBid.id; the winning bid recorded by the award transition"
        default: null
      - name: awarded_amount
        type: number
        source: computed
        description: contracted amount for the package including any replacement premium added by a default cascade
        default: 0.00
      - name: committed_amount
        type: number
        source: computed
        description: sum of contract_amount over Subcontract rows of this package whose contract_status is not TERMINATED_FOR_DEFAULT, less amounts released by termination
        default: 0.00
      - name: replacement_reserve_amount
        type: number
        source: computed
        description: replacement exposure booked by the most recent TERMINATE_FOR_DEFAULT cascade on this package
        default: 0.00
      - name: bid_count
        type: integer
        source: computed
        description: number of SelfPerformBid rows submitted against this package
        default: 0

  - name: SelfPerformBid
    parent: null
    common_fields: true
    fields:
      - name: work_package_id
        type: string
        source: input
        description: "FK -> WorkPackage.id; the package this sealed bid answers"
      - name: bidder_type
        type: enum
        source: input
        description: whether the bid comes from the construction manager's own forces or from the open market
        constraints: "CM_SELF_PERFORM | THIRD_PARTY"
      - name: bidder_name
        type: string
        source: input
        description: legal name of the bidding entity
        constraints: "1..200 chars"
      - name: base_bid_amount
        type: number
        source: input
        description: lump-sum base bid
        constraints: "> 0; 2 decimal places"
      - name: open_book_cost_breakdown
        type: object
        source: input
        description: "open-book components { labor, material, equipment, overhead, profit }; required when bidder_type == CM_SELF_PERFORM and must sum exactly to base_bid_amount, must be null when bidder_type == THIRD_PARTY"
        default: null
      - name: prepared_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ConstructionManager operator that submitted this sealed bid; the segregation-of-duties comparand at open time
      - name: opened_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator that opened the bid
        default: null
      - name: opened_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the sealed bid was opened
        default: null
      - name: status
        type: enum
        source: computed
        description: sealed-bid lifecycle
        default: SEALED
        constraints: "SEALED | OPENED | AWARDED | NOT_AWARDED"

  - name: Subcontract
    parent: null
    common_fields: true
    fields:
      - name: work_package_id
        type: string
        source: input
        description: "FK -> WorkPackage.id; the package this subcontract executes"
      - name: awarded_bid_id
        type: string
        source: input
        description: "FK -> SelfPerformBid.id; the OPENED bid this subcontract is written from"
      - name: subcontractor_name
        type: string
        source: input
        description: legal name of the subcontractor
        constraints: "1..200 chars"
      - name: contract_amount
        type: number
        source: input
        description: subcontract value inside the guaranteed maximum price
        constraints: "> 0; 2 decimal places"
      - name: performance_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the on-site performance window (closed interval, inclusive)
      - name: performance_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the on-site performance window (closed interval, inclusive); must be strictly after performance_start
      - name: bond_required
        type: boolean
        source: input
        description: whether a performance bond is required for this subcontract
        default: false
      - name: bond_amount
        type: number
        source: input
        description: face amount of the performance bond
        default: 0.00
        constraints: "> 0 when bond_required == true, else 0.00"
      - name: paid_to_date
        type: number
        source: computed
        description: sum of progress payments applied to this subcontract
        default: 0.00
      - name: unpaid_committed_amount
        type: number
        source: computed
        description: "contract_amount - paid_to_date, frozen by the TERMINATE_FOR_DEFAULT transition"
        default: 0.00
      - name: replacement_cost_amount
        type: number
        source: computed
        description: "round(unpaid_committed_amount * REPLACEMENT_PREMIUM_MULTIPLIER, 2) booked at termination"
        default: 0.00
      - name: contract_status
        type: enum
        source: computed
        description: "first independent state axis: contract performance, with a DEFAULT_NOTICED -> ACTIVE cure loop"
        default: ACTIVE
        constraints: "ACTIVE | DEFAULT_NOTICED | TERMINATED_FOR_DEFAULT | COMPLETED"
      - name: bond_claim_status
        type: enum
        source: computed
        description: "second independent state axis: surety claim, initialized NOT_APPLICABLE when bond_required == false and NONE when bond_required == true"
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | NONE | FILED | ACKNOWLEDGED | SETTLED | DENIED"
      - name: bond_claim_amount
        type: number
        source: computed
        description: amount claimed against the surety
        default: 0.00
      - name: bond_recovered_amount
        type: number
        source: computed
        description: amount actually recovered on settlement; credits construction contingency back per calculations.bond_recovery_credit
        default: 0.00
      - name: default_notice_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the default notice was issued
        default: null
      - name: cure_count
        type: integer
        source: computed
        description: number of times a default notice on this subcontract has been cured
        default: 0

  - name: ChangeEvent
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CmarProject.id; the project the change event is logged against"
      - name: qualification_item_id
        type: string
        source: input
        description: "FK -> QualificationItem.id; the assumption, allowance, clarification or exclusion the event relies on; must belong to a GmpProposal of the same project when supplied"
        default: null
      - name: source_subcontract_id
        type: string
        source: input
        description: "FK -> Subcontract.id; the defaulted subcontract this event arises from; must belong to a WorkPackage of the same project when supplied"
        default: null
      - name: description
        type: string
        source: input
        description: narrative of the change event
        constraints: "1..1000 chars"
      - name: estimated_amount
        type: number
        source: input
        description: CM's estimated cost impact; becomes the ContingencyDraw.amount or GmpProposal.amount_delta produced by classification
        constraints: "> 0; 2 decimal places"
      - name: origin
        type: enum
        source: input
        description: what gave rise to the change event
        constraints: "OWNER_DIRECTIVE | DESIGN_DEVELOPMENT | FIELD_CONDITION | SUBCONTRACTOR_DEFAULT | ALLOWANCE_OVERRUN"
      - name: classification
        type: enum
        source: computed
        description: the reviewed determination of who bears the cost; null until CLASSIFIED
        default: null
        constraints: "SCOPE_CHANGE | CONTINGENCY_USE_OWNER | CONTINGENCY_USE_CONSTRUCTION"
      - name: status
        type: enum
        source: computed
        description: review lifecycle with a revision loop and a three-way terminal fork
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | CLASSIFIED | REJECTED"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator that most recently submitted this event; the segregation-of-duties comparand at classify time
        default: null
      - name: classified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator that classified this event
        default: null
      - name: classified_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of classification
        default: null
      - name: review_note
        type: string
        source: computed
        description: note recorded on the most recent review action
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of times this event has been returned for revision
        default: 0

  - name: ContingencyDraw
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: computed
        description: "FK -> CmarProject.id; the project whose contingency is drawn"
      - name: change_event_id
        type: string
        source: computed
        description: "FK -> ChangeEvent.id; the classified event that produced this draw; null on SUBCONTRACTOR_DEFAULT_PREMIUM draws"
        default: null
      - name: source_subcontract_id
        type: string
        source: computed
        description: "FK -> Subcontract.id; the defaulted subcontract that produced this draw; null on CHANGE_EVENT_CLASSIFICATION draws"
        default: null
      - name: contingency_type
        type: enum
        source: computed
        description: which contingency pot is drawn
        constraints: "OWNER | CONSTRUCTION"
      - name: origin
        type: enum
        source: computed
        description: which cascade minted this draw
        constraints: "CHANGE_EVENT_CLASSIFICATION | SUBCONTRACTOR_DEFAULT_PREMIUM"
      - name: amount
        type: number
        source: computed
        description: dollars moved from the contingency pot into contingency_drawn_to_cost_total when POSTED
      - name: requires_owner_approval
        type: boolean
        source: computed
        description: see calculations.draw_approval_requirement
        default: false
      - name: status
        type: enum
        source: computed
        description: draw approval lifecycle
        default: REQUESTED
        constraints: "REQUESTED | OWNER_APPROVED | POSTED | VOIDED | DENIED"
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the OwnerRepresentative that approved the draw
        default: null
      - name: posted_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the draw hit the contingency ledger
        default: null
      - name: voided_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the posted draw was compensated
        default: null
      - name: void_reason
        type: string
        source: computed
        description: reason recorded on the void action
        default: null

  - name: CostReport
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CmarProject.id; the project this monthly cost report covers"
      - name: period_start
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of the reporting period (half-open interval start)
      - name: period_end
        type: datetime
        source: input
        description: ISO 8601 UTC exclusive end of the reporting period (half-open interval end); must be strictly after period_start
      - name: status
        type: enum
        source: computed
        description: monthly reconciliation lifecycle with an OPEN -> RECONCILIATION_HELD -> OPEN loop
        default: OPEN
        constraints: "OPEN | RECONCILED | DISPUTED | RECONCILIATION_HELD"
      - name: lines
        type: array
        source: computed
        description: "append-only array of cost line objects { line_seq, work_package_id, quantity, unit_rate, markup_pct, line_amount, disputed }; work_package_id must reference a WorkPackage of the same project"
        default: []
      - name: line_count
        type: integer
        source: computed
        description: number of entries in lines
        default: 0
      - name: reported_cost_total
        type: number
        source: computed
        description: "sum of lines[].line_amount over every line; per-line rounding first per calculations.cost_report_line_reconciliation"
        default: 0.00
      - name: undisputed_cost_total
        type: number
        source: computed
        description: "sum of lines[].line_amount over lines where disputed == false"
        default: 0.00
      - name: disputed_cost_total
        type: number
        source: computed
        description: "sum of lines[].line_amount over lines where disputed == true"
        default: 0.00
      - name: buyout_savings_to_date
        type: number
        source: computed
        description: snapshot of CmarProject.buyout_savings_trade_level taken at the moment this report reached RECONCILED or DISPUTED
        default: 0.00
      - name: held_reason
        type: string
        source: computed
        description: reason recorded when the contingency-posture cascade pushed this report to RECONCILIATION_HELD
        default: null
      - name: reconciled_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of the reconcile decision
        default: null
      - name: reconciliation_note
        type: string
        source: computed
        description: note recorded on the reconcile decision
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: CmarProject
    state_field: gmp_status
    initial_state: PRECONSTRUCTION
    terminal_states: [CLOSED]
    transitions:
      - from: PRECONSTRUCTION
        to: GMP_UNDER_REVIEW
        trigger: "POST /gmp-proposals/{id}/submit on a proposal whose proposal_type == BASE"
        actor: ConstructionManager
        preconditions:
          - "project.gmp_status == PRECONSTRUCTION"
        side_effects:
          - "increments CmarProject.version by 1"
      - from: GMP_UNDER_REVIEW
        to: PRECONSTRUCTION
        trigger: "POST /gmp-proposals/{id}/decide with decision == RETURN on a BASE proposal"
        actor: OwnerRepresentative
        side_effects:
          - "increments CmarProject.version by 1"
        note: "the project falls back to preconstruction while the CM revises the proposal"
      - from: GMP_UNDER_REVIEW
        to: EXECUTED
        trigger: "POST /gmp-proposals/{id}/decide with decision == EXECUTE on a BASE proposal"
        actor: OwnerRepresentative
        preconditions:
          - "proposal.status == OWNER_REVIEW"
          - "proposal.proposal_type == BASE"
          - "project.gmp_status == GMP_UNDER_REVIEW"
        side_effects:
          - "CmarProject.gmp_amount := proposal.gmp_amount"
          - "CmarProject.cost_of_work_budget_total := proposal.cost_of_work_total"
          - "CmarProject.general_conditions_total := proposal.general_conditions_total"
          - "CmarProject.insurance_amount := proposal.insurance_amount"
          - "CmarProject.cm_fee_amount := proposal.cm_fee_amount"
          - "CmarProject.owner_contingency_original := CmarProject.owner_contingency_remaining := proposal.owner_contingency_amount"
          - "CmarProject.construction_contingency_original := CmarProject.construction_contingency_remaining := proposal.construction_contingency_amount"
          - "CmarProject.proposed_gmp_amount := proposal.gmp_amount (calculations.proposed_gmp_rollup with no pending amendments)"
          - "recompute CmarProject.contingency_posture per calculations.contingency_posture_derivation (yields OPEN)"
          - "increments CmarProject.version by 1"
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == true"
        actor: OwnerRepresentative
        preconditions:
          - "project.closeout_status == FINAL_COMPUTED"
        side_effects:
          - "CmarProject.closeout_status := SETTLEMENT_EXECUTED"
          - "CmarProject.contingency_posture := FROZEN (closeout branch of calculations.contingency_posture_derivation)"
          - "every WorkPackage of this project whose procurement_status == AWARDED transitions to CLOSED"
          - "increments CmarProject.version by 1"

  - entity: CmarProject
    state_field: contingency_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONSTRAINED
        trigger: "system: recomputation of calculations.contingency_posture_derivation after any ContingencyDraw reaches POSTED or VOIDED, after a bond-claim SETTLE credit, or after GMP execution"
        actor: system
        preconditions:
          - "construction_contingency_original > 0"
          - "construction_contingency_remaining / construction_contingency_original <= 0.10"
          - "closeout_status != SETTLEMENT_EXECUTED"
        side_effects:
          - "every CostReport of this project whose status == OPEN transitions to RECONCILIATION_HELD with held_reason := 'CONSTRUCTION_CONTINGENCY_CONSTRAINED'"
          - "increments CmarProject.version by 1"
      - from: CONSTRAINED
        to: OPEN
        trigger: "system: recomputation of calculations.contingency_posture_derivation after a POSTED draw is VOIDED or a bond-claim SETTLE credits the construction contingency back"
        actor: system
        preconditions:
          - "construction_contingency_remaining / construction_contingency_original > 0.10"
          - "closeout_status != SETTLEMENT_EXECUTED"
        side_effects:
          - "CostReport rows already in RECONCILIATION_HELD are NOT auto-released; they require POST /cost-reports/{id}/release-hold"
          - "increments CmarProject.version by 1"
        note: "asymmetric compensation: the freeze cascades automatically, the thaw does not"
      - from: OPEN
        to: FROZEN
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == true"
        actor: OwnerRepresentative
        side_effects:
          - "increments CmarProject.version by 1"
      - from: CONSTRAINED
        to: FROZEN
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == true"
        actor: OwnerRepresentative
        side_effects:
          - "increments CmarProject.version by 1"

  - entity: CmarProject
    state_field: audit_status
    initial_state: NOT_REQUESTED
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_REQUESTED
        to: IN_PROGRESS
        trigger: "POST /projects/{id}/audit-request"
        actor: OwnerRepresentative
        preconditions:
          - "project.gmp_status == EXECUTED"
          - "at least one CostReport of this project has status == RECONCILED"
        side_effects:
          - "increments CmarProject.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /projects/{id}/audit-actions with action == CLOSE"
        actor: IndependentAuditor
        preconditions:
          - "project.audit_status == IN_PROGRESS"
        side_effects:
          - "CmarProject.audit_adjustment_total is frozen at its accumulated value"
          - "increments CmarProject.version by 1"

  - entity: CmarProject
    state_field: closeout_status
    initial_state: NOT_STARTED
    terminal_states: [SETTLEMENT_EXECUTED]
    transitions:
      - from: NOT_STARTED
        to: PROVISIONAL_COMPUTED
        trigger: "POST /projects/{id}/shared-savings with basis == PRE_AUDIT_PROVISIONAL"
        actor: OwnerRepresentative
        preconditions:
          - "project.gmp_status == EXECUTED"
          - "at least one CostReport of this project has status == RECONCILED"
        side_effects:
          - "CmarProject.provisional_savings_pool / provisional_cm_savings_share / provisional_owner_savings_share written from calculations.shared_savings_split variant PRE_AUDIT_PROVISIONAL"
          - "increments CmarProject.version by 1"
      - from: PROVISIONAL_COMPUTED
        to: PROVISIONAL_COMPUTED
        trigger: "POST /projects/{id}/shared-savings with basis == PRE_AUDIT_PROVISIONAL (recompute after more cost reports reconcile)"
        actor: OwnerRepresentative
        side_effects:
          - "provisional_* fields overwritten with the fresh calculation"
          - "increments CmarProject.version by 1"
      - from: NOT_STARTED
        to: FINAL_COMPUTED
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == false"
        actor: OwnerRepresentative
        preconditions:
          - "project.audit_status == CLOSED"
          - "no CostReport of this project has status in {OPEN, DISPUTED, RECONCILIATION_HELD}"
          - "at least one CostReport of this project has status == RECONCILED"
        side_effects:
          - "same as the PROVISIONAL_COMPUTED -> FINAL_COMPUTED transition; the provisional figures are simply never computed and stay 0.00"
          - "increments CmarProject.version by 1"
        note: "the provisional pass is optional: an owner may go straight to the audited final figure"
      - from: PROVISIONAL_COMPUTED
        to: FINAL_COMPUTED
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == false"
        actor: OwnerRepresentative
        preconditions:
          - "project.audit_status == CLOSED"
          - "no CostReport of this project has status in {OPEN, DISPUTED, RECONCILIATION_HELD}"
          - "at least one CostReport of this project has status == RECONCILED"
        side_effects:
          - "CmarProject.final_savings_pool / final_cm_savings_share / final_owner_savings_share written from calculations.shared_savings_split variant POST_AUDIT_FINAL"
          - "increments CmarProject.version by 1"
      - from: FINAL_COMPUTED
        to: SETTLEMENT_EXECUTED
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == true"
        actor: OwnerRepresentative
        preconditions:
          - "project.closeout_status == FINAL_COMPUTED"
        side_effects:
          - "CmarProject.gmp_status := CLOSED"
          - "CmarProject.contingency_posture := FROZEN"
          - "every WorkPackage of this project whose procurement_status == AWARDED transitions to CLOSED"
          - "increments CmarProject.version by 1"

  - entity: ProgressiveEstimate
    state_field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /estimates/{id}/submit"
        actor: ConstructionManager
        preconditions:
          - "estimate.status in {DRAFT, RETURNED}"
          - "when abs(estimate.variance_pct) > 0.0500, estimate.justification_note is a non-empty string"
        side_effects:
          - "increments ProgressiveEstimate.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /estimates/{id}/submit (revision loop)"
        actor: ConstructionManager
        preconditions:
          - "estimate.status == RETURNED"
          - "when abs(estimate.variance_pct) > 0.0500, estimate.justification_note is a non-empty string"
        side_effects:
          - "increments ProgressiveEstimate.version by 1"
        note: "cycle: RETURNED -> SUBMITTED -> RETURNED may repeat without bound"
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /estimates/{id}/reconcile with decision == ACCEPT"
        actor: OwnerRepresentative
        preconditions:
          - "estimate.status == SUBMITTED"
        side_effects:
          - "ProgressiveEstimate.reconciliation_note := payload.reconciliation_note"
          - "ProgressiveEstimate.reconciliation_stale := false"
          - "increments ProgressiveEstimate.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /estimates/{id}/reconcile with decision == RETURN"
        actor: OwnerRepresentative
        preconditions:
          - "estimate.status == SUBMITTED"
        side_effects:
          - "ProgressiveEstimate.reconciliation_note := payload.reconciliation_note"
          - "increments ProgressiveEstimate.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /estimates creates a newer estimate with the same project_id and milestone_code"
        actor: system
        preconditions:
          - "the prior estimate's status is in {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "ProgressiveEstimate.superseded_by_estimate_id := the new estimate's id"
          - "increments ProgressiveEstimate.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: POST /estimates creates a newer estimate with the same project_id and milestone_code"
        actor: system
        side_effects:
          - "ProgressiveEstimate.superseded_by_estimate_id := the new estimate's id"
          - "increments ProgressiveEstimate.version by 1"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system: POST /estimates creates a newer estimate with the same project_id and milestone_code"
        actor: system
        side_effects:
          - "ProgressiveEstimate.superseded_by_estimate_id := the new estimate's id"
          - "increments ProgressiveEstimate.version by 1"
        note: "RECONCILED estimates are never superseded; they remain the reconciliation basis"

  - entity: GmpProposal
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: OWNER_REVIEW
        trigger: "POST /gmp-proposals/{id}/submit"
        actor: ConstructionManager
        preconditions:
          - "proposal.status in {DRAFT, RETURNED_FOR_REVISION}"
          - "for BASE proposals: the based_on_estimate_id estimate has status == RECONCILED"
          - "for AMENDMENT proposals: the linked ChangeEvent.status == CLASSIFIED with classification == SCOPE_CHANGE"
        side_effects:
          - "for BASE proposals: CmarProject.gmp_status PRECONSTRUCTION -> GMP_UNDER_REVIEW"
          - "increments GmpProposal.version by 1"
      - from: RETURNED_FOR_REVISION
        to: OWNER_REVIEW
        trigger: "POST /gmp-proposals/{id}/submit (revision loop)"
        actor: ConstructionManager
        side_effects:
          - "increments GmpProposal.version by 1"
        note: "cycle: OWNER_REVIEW -> RETURNED_FOR_REVISION -> OWNER_REVIEW may repeat without bound"
      - from: OWNER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /gmp-proposals/{id}/decide with decision == RETURN"
        actor: OwnerRepresentative
        preconditions:
          - "proposal.status == OWNER_REVIEW"
        side_effects:
          - "GmpProposal.revision_count += 1"
          - "GmpProposal.owner_decision_note := payload.decision_note"
          - "for BASE proposals: CmarProject.gmp_status GMP_UNDER_REVIEW -> PRECONSTRUCTION"
          - "increments GmpProposal.version by 1"
      - from: OWNER_REVIEW
        to: EXECUTED
        trigger: "POST /gmp-proposals/{id}/decide with decision == EXECUTE"
        actor: OwnerRepresentative
        preconditions:
          - "proposal.status == OWNER_REVIEW"
          - "for BASE proposals: CmarProject.gmp_status == GMP_UNDER_REVIEW"
          - "for AMENDMENT proposals: CmarProject.gmp_status == EXECUTED"
        side_effects:
          - "for BASE proposals: the full CmarProject GMP_UNDER_REVIEW -> EXECUTED side-effect set fires"
          - "for AMENDMENT proposals: CmarProject.gmp_amount += amount_delta; CmarProject.cost_of_work_budget_total += amount_delta; CmarProject.pending_amendment_count -= 1; CmarProject.proposed_gmp_amount recomputed"
          - "increments GmpProposal.version by 1"
      - from: OWNER_REVIEW
        to: REJECTED
        trigger: "POST /gmp-proposals/{id}/decide with decision == REJECT"
        actor: OwnerRepresentative
        preconditions:
          - "proposal.status == OWNER_REVIEW"
          - "proposal.proposal_type == AMENDMENT"
        side_effects:
          - "CmarProject.pending_amendment_count -= 1; CmarProject.proposed_gmp_amount recomputed"
          - "the linked ChangeEvent keeps status CLASSIFIED; no contingency is drawn"
          - "increments GmpProposal.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /gmp-proposals creates a newer BASE proposal for the same project"
        actor: system
        side_effects:
          - "GmpProposal.superseded_by_proposal_id := the new proposal's id"
          - "increments GmpProposal.version by 1"
      - from: OWNER_REVIEW
        to: SUPERSEDED
        trigger: "system: POST /gmp-proposals creates a newer BASE proposal for the same project"
        actor: system
        side_effects:
          - "GmpProposal.superseded_by_proposal_id := the new proposal's id"
          - "increments GmpProposal.version by 1"
      - from: RETURNED_FOR_REVISION
        to: SUPERSEDED
        trigger: "system: POST /gmp-proposals creates a newer BASE proposal for the same project"
        actor: system
        side_effects:
          - "GmpProposal.superseded_by_proposal_id := the new proposal's id"
          - "increments GmpProposal.version by 1"

  - entity: QualificationItem
    state_field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PARTIALLY_RECONCILED
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == RECONCILE"
        actor: ConstructionManager
        preconditions:
          - "item.item_type == ALLOWANCE"
          - "payload.units <= item.remaining_units"
          - "0 < resulting reconciled_units < item.allocated_units"
        side_effects:
          - "item.remaining_units -= units; item.reconciled_units += units (calculations.allowance_unit_conservation)"
          - "item.reconciled_amount += round(units * actual_unit_cost, 2); item.variance_amount recomputed"
          - "item.reconciliation_seq += 1; item.last_action := RECONCILE"
          - "increments QualificationItem.version by 1"
      - from: PARTIALLY_RECONCILED
        to: FULLY_RECONCILED
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == RECONCILE consuming the last remaining units"
        actor: ConstructionManager
        preconditions:
          - "resulting reconciled_units == item.allocated_units"
        side_effects:
          - "same ledger side effects as the OPEN -> PARTIALLY_RECONCILED transition"
          - "increments QualificationItem.version by 1"
      - from: OPEN
        to: FULLY_RECONCILED
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == RECONCILE consuming every allocated unit in one call"
        actor: ConstructionManager
        side_effects:
          - "same ledger side effects as the OPEN -> PARTIALLY_RECONCILED transition"
          - "increments QualificationItem.version by 1"
      - from: PARTIALLY_RECONCILED
        to: OPEN
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == REVERSE (compensating action)"
        actor: ConstructionManager
        preconditions:
          - "item.last_action == RECONCILE"
          - "item.reconciliation_seq >= 1"
        side_effects:
          - "item.remaining_units += reversed units; item.reconciled_units -= reversed units (calculations.allowance_unit_conservation restored)"
          - "item.reconciled_amount -= the reversed booking; item.variance_amount recomputed"
          - "item.last_action := REVERSE (item.reconciliation_seq is NOT decremented)"
          - "increments QualificationItem.version by 1"
      - from: FULLY_RECONCILED
        to: PARTIALLY_RECONCILED
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == REVERSE when earlier RECONCILE actions remain"
        actor: ConstructionManager
        side_effects:
          - "same compensating side effects as the PARTIALLY_RECONCILED -> OPEN transition"
          - "increments QualificationItem.version by 1"
      - from: FULLY_RECONCILED
        to: OPEN
        trigger: "POST /qualification-items/{id}/allowance-reconciliation with action == REVERSE undoing the only RECONCILE action"
        actor: ConstructionManager
        side_effects:
          - "same compensating side effects as the PARTIALLY_RECONCILED -> OPEN transition"
          - "increments QualificationItem.version by 1"
        note: "cycle: OPEN -> FULLY_RECONCILED -> OPEN is reachable and MUST leave allocated_units == remaining_units + reconciled_units intact"

  - entity: WorkPackage
    state_field: procurement_status
    initial_state: BUDGETED
    terminal_states: [CLOSED]
    transitions:
      - from: BUDGETED
        to: SOLICITING
        trigger: "POST /work-packages/{id}/solicit"
        actor: ConstructionManager
        preconditions:
          - "package.procurement_status == BUDGETED"
          - "CmarProject.gmp_status in {GMP_UNDER_REVIEW, EXECUTED}"
          - "payload.solicitation_closes_at is strictly after payload.solicitation_opens_at"
        side_effects:
          - "WorkPackage.solicitation_opens_at / solicitation_closes_at written from the payload"
          - "increments WorkPackage.version by 1"
      - from: SOLICITING
        to: AWARDED
        trigger: "POST /work-packages/{id}/award"
        actor: ProcurementOfficer
        preconditions:
          - "package.procurement_status == SOLICITING"
          - "the winning SelfPerformBid.status == OPENED and its work_package_id == package.id"
          - "logical clock >= package.solicitation_closes_at"
        side_effects:
          - "WorkPackage.awarded_bid_id := payload.winning_bid_id; awarded_amount := winning bid.base_bid_amount"
          - "the winning SelfPerformBid transitions SEALED-or-OPENED -> AWARDED; every other OPENED bid of this package transitions to NOT_AWARDED"
          - "CmarProject.buyout_savings_trade_level and buyout_savings_project_net recomputed per calculations.buyout_savings_tracking"
          - "increments WorkPackage.version by 1"
      - from: AWARDED
        to: REPROCUREMENT
        trigger: "POST /subcontracts/{id}/status-action with action == TERMINATE_FOR_DEFAULT on a Subcontract of this package"
        actor: ConstructionManager
        preconditions:
          - "package.procurement_status == AWARDED"
        side_effects:
          - "WorkPackage.committed_amount -= subcontract.unpaid_committed_amount"
          - "WorkPackage.replacement_reserve_amount := subcontract.replacement_cost_amount"
          - "WorkPackage.awarded_amount += (subcontract.replacement_cost_amount - subcontract.unpaid_committed_amount)"
          - "this awarded_amount change itself triggers recomputation of CmarProject.buyout_savings_trade_level and buyout_savings_project_net"
          - "this awarded_amount change itself triggers minting of a ContingencyDraw (origin SUBCONTRACTOR_DEFAULT_PREMIUM, status POSTED) for the premium delta"
          - "increments WorkPackage.version by 1"
      - from: REPROCUREMENT
        to: AWARDED
        trigger: "POST /work-packages/{id}/award naming a replacement bid"
        actor: ProcurementOfficer
        preconditions:
          - "package.procurement_status == REPROCUREMENT"
          - "the replacement SelfPerformBid.status == OPENED"
        side_effects:
          - "WorkPackage.awarded_bid_id := payload.winning_bid_id"
          - "WorkPackage.replacement_reserve_amount := 0.00"
          - "CmarProject.buyout_savings_* recomputed"
          - "increments WorkPackage.version by 1"
        note: "cycle: AWARDED -> REPROCUREMENT -> AWARDED may repeat for each successive default"
      - from: AWARDED
        to: CLOSED
        trigger: "POST /projects/{id}/shared-savings with basis == POST_AUDIT_FINAL and execute == true"
        actor: OwnerRepresentative
        side_effects:
          - "increments WorkPackage.version by 1"

  - entity: WorkPackage
    state_field: transparency_status
    initial_state: SEALED
    terminal_states: [AUDITED]
    transitions:
      - from: SEALED
        to: DISCLOSED
        trigger: "POST /work-packages/{id}/transparency with target_status == DISCLOSED"
        actor: ProcurementOfficer
        preconditions:
          - "package.transparency_status == SEALED"
          - "package.bid_count >= 1"
        side_effects:
          - "increments WorkPackage.version by 1"
        note: "independent of procurement_status: a package may be DISCLOSED while still BUDGETED or already CLOSED"
      - from: DISCLOSED
        to: AUDITED
        trigger: "POST /work-packages/{id}/transparency with target_status == AUDITED"
        actor: IndependentAuditor
        preconditions:
          - "package.transparency_status == DISCLOSED"
        side_effects:
          - "increments WorkPackage.version by 1"

  - entity: SelfPerformBid
    state_field: status
    initial_state: SEALED
    terminal_states: [AWARDED, NOT_AWARDED]
    transitions:
      - from: SEALED
        to: OPENED
        trigger: "POST /self-perform-bids/{id}/open"
        actor: ProcurementOfficer
        preconditions:
          - "bid.status == SEALED"
          - "logical clock >= WorkPackage.solicitation_closes_at"
          - "when bid.bidder_type == CM_SELF_PERFORM: WorkPackage.transparency_status in {DISCLOSED, AUDITED}"
          - "X-User-ID != bid.prepared_by_user_id"
        side_effects:
          - "SelfPerformBid.opened_by_user_id := X-User-ID; opened_at := logical clock"
          - "increments SelfPerformBid.version by 1"
      - from: OPENED
        to: AWARDED
        trigger: "POST /work-packages/{id}/award naming this bid"
        actor: ProcurementOfficer
        side_effects:
          - "increments SelfPerformBid.version by 1"
      - from: OPENED
        to: NOT_AWARDED
        trigger: "POST /work-packages/{id}/award naming a different bid on the same package"
        actor: ProcurementOfficer
        side_effects:
          - "increments SelfPerformBid.version by 1"

  - entity: Subcontract
    state_field: contract_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED_FOR_DEFAULT, COMPLETED]
    transitions:
      - from: ACTIVE
        to: DEFAULT_NOTICED
        trigger: "POST /subcontracts/{id}/status-action with action == NOTICE_DEFAULT"
        actor: ConstructionManager
        preconditions:
          - "subcontract.contract_status == ACTIVE"
        side_effects:
          - "Subcontract.default_notice_at := logical clock"
          - "increments Subcontract.version by 1"
      - from: DEFAULT_NOTICED
        to: ACTIVE
        trigger: "POST /subcontracts/{id}/status-action with action == CURE"
        actor: ConstructionManager
        preconditions:
          - "subcontract.contract_status == DEFAULT_NOTICED"
        side_effects:
          - "Subcontract.cure_count += 1; default_notice_at := null"
          - "increments Subcontract.version by 1"
        note: "cycle: ACTIVE -> DEFAULT_NOTICED -> ACTIVE may repeat without bound; cure_count records the loop count"
      - from: DEFAULT_NOTICED
        to: TERMINATED_FOR_DEFAULT
        trigger: "POST /subcontracts/{id}/status-action with action == TERMINATE_FOR_DEFAULT"
        actor: ConstructionManager
        preconditions:
          - "subcontract.contract_status == DEFAULT_NOTICED"
          - "CmarProject.gmp_status == EXECUTED"
        side_effects:
          - "Subcontract.unpaid_committed_amount := contract_amount - paid_to_date"
          - "Subcontract.replacement_cost_amount := round(unpaid_committed_amount * 1.15, 2) per calculations.default_replacement_exposure"
          - "when bond_required == true: Subcontract.bond_claim_status NONE -> NONE (unchanged); the claim must still be filed explicitly"
          - "this Subcontract mutation itself drives the parent WorkPackage AWARDED -> REPROCUREMENT transition, which in turn mints the premium ContingencyDraw, which in turn moves CmarProject.contingency_posture, which in turn holds every OPEN CostReport"
          - "increments Subcontract.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /subcontracts/{id}/status-action with action == COMPLETE"
        actor: ConstructionManager
        preconditions:
          - "subcontract.contract_status == ACTIVE"
          - "subcontract.paid_to_date == subcontract.contract_amount"
        side_effects:
          - "increments Subcontract.version by 1"

  - entity: Subcontract
    state_field: bond_claim_status
    initial_state: NONE
    terminal_states: [NOT_APPLICABLE, SETTLED, DENIED]
    transitions:
      - from: NONE
        to: FILED
        trigger: "POST /subcontracts/{id}/bond-claim with action == FILE"
        actor: ConstructionManager
        preconditions:
          - "subcontract.bond_required == true (bond_claim_status == NONE, not NOT_APPLICABLE)"
          - "subcontract.contract_status == TERMINATED_FOR_DEFAULT"
          - "payload.claim_amount <= subcontract.bond_amount"
        side_effects:
          - "Subcontract.bond_claim_amount := payload.claim_amount"
          - "increments Subcontract.version by 1"
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /subcontracts/{id}/bond-claim with action == ACKNOWLEDGE"
        actor: OwnerRepresentative
        preconditions:
          - "subcontract.bond_claim_status == FILED"
        side_effects:
          - "increments Subcontract.version by 1"
      - from: ACKNOWLEDGED
        to: SETTLED
        trigger: "POST /subcontracts/{id}/bond-claim with action == SETTLE"
        actor: OwnerRepresentative
        preconditions:
          - "subcontract.bond_claim_status == ACKNOWLEDGED"
          - "payload.recovered_amount <= subcontract.bond_claim_amount"
        side_effects:
          - "Subcontract.bond_recovered_amount := payload.recovered_amount"
          - "CmarProject.construction_contingency_remaining += credit and CmarProject.contingency_drawn_to_cost_total -= credit, where credit = min(recovered_amount, sum of ContingencyDraw.amount over draws with source_subcontract_id == this subcontract and status == POSTED) per calculations.bond_recovery_credit"
          - "that contingency movement itself triggers recomputation of CmarProject.contingency_posture, which may move CONSTRAINED -> OPEN"
          - "increments Subcontract.version by 1"
      - from: ACKNOWLEDGED
        to: DENIED
        trigger: "POST /subcontracts/{id}/bond-claim with action == DENY"
        actor: OwnerRepresentative
        preconditions:
          - "subcontract.bond_claim_status == ACKNOWLEDGED"
        side_effects:
          - "no contingency credit; construction contingency stays depleted"
          - "increments Subcontract.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /subcontracts/{id}/bond-claim with action == DENY"
        actor: OwnerRepresentative
        preconditions:
          - "subcontract.bond_claim_status == FILED"
        side_effects:
          - "increments Subcontract.version by 1"
    note: |
      Initialization branches on the creation payload: bond_required == false mints the
      subcontract at NOT_APPLICABLE (a terminal dead axis), bond_required == true mints it
      at NONE. This axis moves independently of contract_status: a DENIED claim leaves the
      contract TERMINATED_FOR_DEFAULT, and a SETTLED claim does not resurrect the contract.

  - entity: ChangeEvent
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLASSIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-events/{id}/submit"
        actor: ConstructionManager
        preconditions:
          - "event.status in {DRAFT, REVISION_REQUESTED}"
          - "CmarProject.gmp_status == EXECUTED"
          - "when event.origin == ALLOWANCE_OVERRUN: event.qualification_item_id names a QualificationItem with item_type == ALLOWANCE"
        side_effects:
          - "ChangeEvent.submitted_by_user_id := X-User-ID (overwritten on every resubmission)"
          - "increments ChangeEvent.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /change-events/{id}/submit (revision loop)"
        actor: ConstructionManager
        preconditions:
          - "event.status == REVISION_REQUESTED"
        side_effects:
          - "ChangeEvent.submitted_by_user_id := X-User-ID"
          - "increments ChangeEvent.version by 1"
        note: "cycle: SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED may repeat without bound"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /change-events/{id}/review with action == BEGIN_REVIEW"
        actor: OwnerRepresentative
        preconditions:
          - "event.status == SUBMITTED"
        side_effects:
          - "ChangeEvent.review_note := payload.review_note"
          - "increments ChangeEvent.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /change-events/{id}/review with action == REQUEST_REVISION"
        actor: OwnerRepresentative
        preconditions:
          - "event.status == UNDER_REVIEW"
        side_effects:
          - "ChangeEvent.revision_count += 1"
          - "increments ChangeEvent.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /change-events/{id}/review with action == REJECT"
        actor: OwnerRepresentative
        preconditions:
          - "event.status == UNDER_REVIEW"
        side_effects:
          - "no GmpProposal and no ContingencyDraw are minted"
          - "increments ChangeEvent.version by 1"
      - from: UNDER_REVIEW
        to: CLASSIFIED
        trigger: "POST /change-events/{id}/classify with classification == SCOPE_CHANGE"
        actor: OwnerRepresentative | ConstructionManager
        preconditions:
          - "event.status == UNDER_REVIEW"
          - "CmarProject.gmp_status == EXECUTED"
          - "X-User-ID != event.submitted_by_user_id"
        side_effects:
          - "ChangeEvent.classification := SCOPE_CHANGE; classified_by_user_id := X-User-ID; classified_at := logical clock"
          - "a GmpProposal is minted with proposal_type AMENDMENT, status DRAFT, change_event_id := event.id, amount_delta := event.estimated_amount, gmp_amount := CmarProject.gmp_amount + amount_delta"
          - "that AMENDMENT row's creation itself increments CmarProject.pending_amendment_count by 1 and rewrites CmarProject.proposed_gmp_amount per calculations.proposed_gmp_rollup"
          - "that proposed_gmp_amount rewrite itself sets reconciliation_stale := true on every ProgressiveEstimate of the project whose status == RECONCILED"
          - "no contingency is drawn on this branch"
          - "increments ChangeEvent.version by 1"
        note: "SCOPE_CHANGE branch: the owner pays via an amendment to the guaranteed maximum price"
      - from: UNDER_REVIEW
        to: CLASSIFIED
        trigger: "POST /change-events/{id}/classify with classification == CONTINGENCY_USE_OWNER"
        actor: OwnerRepresentative | ConstructionManager
        preconditions:
          - "event.status == UNDER_REVIEW"
          - "CmarProject.gmp_status == EXECUTED"
          - "X-User-ID != event.submitted_by_user_id"
        side_effects:
          - "ChangeEvent.classification := CONTINGENCY_USE_OWNER; classified_by_user_id := X-User-ID; classified_at := logical clock"
          - "a ContingencyDraw is minted with contingency_type OWNER, origin CHANGE_EVENT_CLASSIFICATION, status REQUESTED, amount := event.estimated_amount, requires_owner_approval := true (calculations.draw_approval_requirement always requires approval on the OWNER pot)"
          - "no GmpProposal is minted; CmarProject.pending_amendment_count and proposed_gmp_amount are untouched"
          - "increments ChangeEvent.version by 1"
        note: "divergent side-effect set from the SCOPE_CHANGE branch"
      - from: UNDER_REVIEW
        to: CLASSIFIED
        trigger: "POST /change-events/{id}/classify with classification == CONTINGENCY_USE_CONSTRUCTION"
        actor: OwnerRepresentative | ConstructionManager
        preconditions:
          - "event.status == UNDER_REVIEW"
          - "CmarProject.gmp_status == EXECUTED"
          - "X-User-ID != event.submitted_by_user_id"
        side_effects:
          - "ChangeEvent.classification := CONTINGENCY_USE_CONSTRUCTION; classified_by_user_id := X-User-ID; classified_at := logical clock"
          - "a ContingencyDraw is minted with contingency_type CONSTRUCTION, origin CHANGE_EVENT_CLASSIFICATION, status REQUESTED, amount := event.estimated_amount, requires_owner_approval per calculations.draw_approval_requirement"
          - "no GmpProposal is minted; the guaranteed maximum price does not move"
          - "increments ChangeEvent.version by 1"
        note: "divergent side-effect set: the CM absorbs the cost inside the guaranteed price"

  - entity: ContingencyDraw
    state_field: status
    initial_state: REQUESTED
    terminal_states: [VOIDED, DENIED]
    transitions:
      - from: REQUESTED
        to: OWNER_APPROVED
        trigger: "POST /contingency-draws/{id}/approve"
        actor: OwnerRepresentative
        preconditions:
          - "draw.status == REQUESTED"
          - "CmarProject.gmp_status == EXECUTED"
        side_effects:
          - "ContingencyDraw.approved_by_user_id := X-User-ID"
          - "increments ContingencyDraw.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /contingency-draws/{id}/approve with approve == false"
        actor: OwnerRepresentative
        preconditions:
          - "draw.status == REQUESTED"
        side_effects:
          - "no contingency movement"
          - "increments ContingencyDraw.version by 1"
      - from: REQUESTED
        to: POSTED
        trigger: "POST /contingency-draws/{id}/post on a draw that does not require owner approval"
        actor: ConstructionManager
        preconditions:
          - "draw.status == REQUESTED"
          - "draw.requires_owner_approval == false"
          - "CmarProject.gmp_status == EXECUTED"
          - "CmarProject.contingency_posture != FROZEN"
          - "CmarProject.contingency_posture != CONSTRAINED (a CONSTRAINED posture forces the OWNER_APPROVED path)"
          - "draw.amount <= the remaining balance of draw.contingency_type's pot"
        side_effects:
          - "the drawn pot's *_remaining decreases by draw.amount; CmarProject.contingency_drawn_to_cost_total increases by draw.amount (calculations.gmp_price_conservation preserved)"
          - "ContingencyDraw.posted_at := logical clock"
          - "that contingency movement itself triggers recomputation of CmarProject.contingency_posture, which when it lands on CONSTRAINED itself holds every OPEN CostReport of the project"
          - "increments ContingencyDraw.version by 1"
      - from: OWNER_APPROVED
        to: POSTED
        trigger: "POST /contingency-draws/{id}/post on an approved draw"
        actor: ConstructionManager
        preconditions:
          - "draw.status == OWNER_APPROVED"
          - "CmarProject.gmp_status == EXECUTED"
          - "CmarProject.contingency_posture != FROZEN"
          - "draw.amount <= the remaining balance of draw.contingency_type's pot"
        side_effects:
          - "identical ledger side effects to the REQUESTED -> POSTED transition"
          - "increments ContingencyDraw.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "POST /contingency-draws/{id}/void (compensating action)"
        actor: OwnerRepresentative
        preconditions:
          - "draw.status == POSTED"
          - "CmarProject.closeout_status != SETTLEMENT_EXECUTED"
        side_effects:
          - "the drawn pot's *_remaining increases by draw.amount; CmarProject.contingency_drawn_to_cost_total decreases by draw.amount, restoring both fields to their pre-post values"
          - "ContingencyDraw.voided_at := logical clock; void_reason := payload.void_reason"
          - "that contingency movement itself triggers recomputation of CmarProject.contingency_posture, which may move CONSTRAINED -> OPEN without releasing held CostReport rows"
          - "increments ContingencyDraw.version by 1"

  - entity: CostReport
    state_field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /cost-reports/{id}/reconcile with decision == RECONCILE"
        actor: OwnerRepresentative
        preconditions:
          - "report.status in {OPEN, DISPUTED}"
          - "report.line_count >= 1"
        side_effects:
          - "CostReport.reconciled_at := logical clock; reconciliation_note := payload.reconciliation_note"
          - "CostReport.buyout_savings_to_date := CmarProject.buyout_savings_trade_level"
          - "increments CostReport.version by 1"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /cost-reports/{id}/reconcile with decision == DISPUTE"
        actor: OwnerRepresentative
        preconditions:
          - "report.status == OPEN"
          - "report.disputed_cost_total > 0.00"
        side_effects:
          - "CostReport.buyout_savings_to_date := CmarProject.buyout_savings_trade_level"
          - "increments CostReport.version by 1"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /cost-reports/{id}/reconcile with decision == RECONCILE after the dispute is resolved"
        actor: OwnerRepresentative
        preconditions:
          - "report.status == DISPUTED"
        side_effects:
          - "CostReport.reconciled_at := logical clock"
          - "increments CostReport.version by 1"
      - from: OPEN
        to: RECONCILIATION_HELD
        trigger: "system: CmarProject.contingency_posture moves OPEN -> CONSTRAINED"
        actor: system
        preconditions:
          - "report.status == OPEN"
        side_effects:
          - "CostReport.held_reason := 'CONSTRUCTION_CONTINGENCY_CONSTRAINED'"
          - "increments CostReport.version by 1"
      - from: RECONCILIATION_HELD
        to: OPEN
        trigger: "POST /cost-reports/{id}/release-hold"
        actor: OwnerRepresentative
        preconditions:
          - "report.status == RECONCILIATION_HELD"
          - "CmarProject.contingency_posture == OPEN"
        side_effects:
          - "CostReport.held_reason := null"
          - "increments CostReport.version by 1"
        note: "cycle: OPEN -> RECONCILIATION_HELD -> OPEN; the release is manual and gated on the posture having recovered"

# =====================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-project
    parent_entity: CmarProject
    write_endpoint: "POST /estimates"
    occ_field: "expected_project_version"
    description: |
      Creating a ProgressiveEstimate against a CmarProject whose version has
      advanced past the value the client last observed is rejected. A new
      estimate for a milestone_code legitimately supersedes the prior
      non-reconciled estimate for that same milestone, so the second write is
      not blocked by any state precondition; the stale-version check is what
      makes the supersede decision safe.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: gmp-proposal-create-stale-project
    parent_entity: CmarProject
    write_endpoint: "POST /gmp-proposals"
    occ_field: "expected_project_version"
    description: |
      Creating a BASE GmpProposal against a CmarProject whose version has
      advanced past the value the client last observed is rejected. A new BASE
      proposal legitimately supersedes the prior DRAFT / OWNER_REVIEW /
      RETURNED_FOR_REVISION proposal, so a stale writer would otherwise
      silently discard pricing it never saw.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: subcontract-create-stale-work-package
    parent_entity: WorkPackage
    write_endpoint: "POST /subcontracts"
    occ_field: "expected_work_package_version"
    description: |
      Creating a Subcontract against a WorkPackage whose version has advanced
      past the value the client last observed is rejected. A replacement
      subcontract written after a default legitimately supersedes the
      terminated one's committed scope, and the termination cascade rewrites
      WorkPackage.awarded_amount, committed_amount and replacement_reserve_amount
      behind the client's back, so the version the client holds is the only
      evidence it priced against the current package.
    error_id: ERR_STALE_WORK_PACKAGE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules
# =====================================================================
calculations:
  - name: gmp_establishment_pricing
    trigger: "on POST /gmp-proposals (BASE rows, at creation) and re-evaluated on every POST /gmp-proposals/{id}/decide with decision == EXECUTE, which copies the four outputs onto CmarProject"
    algorithm: constraint_propagation
    formula: |
      # The construction manager's fee is contractually a percentage of "the cost of the
      # work including insurance", and the insurance premium is a rate on "the contract
      # sum including fee". Read literally the two definitions are mutually recursive.
      # The contract resolves this by pinning ONE evaluation order, and the pinned order
      # is NOT the naive one. Evaluate in exactly these four steps, rounding at EVERY step:
      base = proposal.cost_of_work_total + proposal.general_conditions_total

      # step 1 - a provisional fee on the bare base, used ONLY to gross up the insurance base
      provisional_fee_amount = round_half_up(project.cm_fee_pct * base, 2)

      # step 2 - insurance on (base + provisional fee)
      insurance_amount = round_half_up(project.insurance_rate * (base + provisional_fee_amount), 2)

      # step 3 - the BINDING fee: the rate applied to (base + insurance), NOT to
      #          (base + provisional_fee) and NOT to (base + insurance + provisional_fee).
      #          The provisional fee is consumed by step 2 and then discarded; it is
      #          never itself a component of the guaranteed maximum price.
      cm_fee_amount = round_half_up(project.cm_fee_pct * (base + insurance_amount), 2)

      # step 4 - the guaranteed maximum price
      gmp_amount = base
                 + insurance_amount
                 + cm_fee_amount
                 + proposal.owner_contingency_amount
                 + proposal.construction_contingency_amount
    input_set: "the four money inputs of the GmpProposal row being priced, plus cm_fee_pct and insurance_rate from its CmarProject. No other proposal, estimate, work package or contingency draw participates."
    constants:
      MONEY_PRECISION: 2
    precision: "2 decimal places, round_half_up, applied independently at each of steps 1, 2 and 3; step 4 is an exact sum of already-rounded terms"
    worked_example: |
      cost_of_work_total = 40000000.00, general_conditions_total = 2500000.00,
      cm_fee_pct = 0.0375, insurance_rate = 0.0125,
      owner_contingency_amount = 1200000.00, construction_contingency_amount = 240000.00
        base                  = 42500000.00
        provisional_fee_amount= round(0.0375 * 42500000.00, 2)              = 1593750.00
        insurance_amount      = round(0.0125 * 44093750.00, 2)              =  551171.88
        cm_fee_amount         = round(0.0375 * 43051171.88, 2)              = 1614418.95
        gmp_amount            = 42500000.00 + 551171.88 + 1614418.95 + 1200000.00 + 240000.00
                              = 46105590.83
      A collapsed single-pass reading that omits insurance from the fee base yields
      46084921.88 - a 20668.95 divergence that is the whole point of pinning the order.
    note: "AMENDMENT rows do not run this rule; their gmp_amount is project.gmp_amount + amount_delta and their fee/insurance components stay 0.00."

  - name: proposed_gmp_rollup
    trigger: "whenever an AMENDMENT GmpProposal is minted, decided, or superseded, and on every BASE EXECUTE"
    algorithm: aggregation
    formula: |
      project.proposed_gmp_amount =
        project.gmp_amount
        + sum(p.amount_delta for p in GmpProposal
              where p.project_id == project.id
                and p.proposal_type == 'AMENDMENT'
                and p.status in {DRAFT, OWNER_REVIEW, RETURNED_FOR_REVISION})
      project.pending_amendment_count =
        count(those same rows)
    input_set: "AMENDMENT proposals in the three non-terminal statuses only. EXECUTED amendments are excluded because their delta has already been folded into gmp_amount; REJECTED and WITHDRAWN amendments are excluded because they will never be folded in."
    constants: {}
    precision: "2 decimal places, round_half_up (the sum is exact over already-rounded deltas)"
    note: "Recomputing this field is itself the cascade step that sets reconciliation_stale := true on every RECONCILED ProgressiveEstimate of the project."

  - name: estimate_milestone_variance
    trigger: "on POST /estimates (at creation) and re-evaluated on POST /estimates/{id}/submit"
    algorithm: threshold
    formula: |
      # basis selection, in this exact order:
      if estimate.prior_estimate_id is not null:
          basis = ProgressiveEstimate[estimate.prior_estimate_id]
          variance_basis = 'DECLARED_PRIOR'
      else:
          candidates = [e for e in ProgressiveEstimate
                        where e.project_id == estimate.project_id
                          and e.id != estimate.id
                          and e.status == 'RECONCILED'
                          and e.milestone_rank < estimate.milestone_rank]
          if candidates is empty:
              basis = null
              variance_basis = 'NO_BASIS'
          else:
              # highest milestone_rank wins; ties broken by LATEST created_at
              basis = max(candidates, key=(milestone_rank, created_at))
              variance_basis = 'HIGHEST_RECONCILED_MILESTONE'

      if basis is null:
          variance_pct = 0.0000
          variance_basis_estimate_id = null
      else:
          variance_basis_estimate_id = basis.id
          variance_pct = round_half_up(
              (estimate.submitted_cost_of_work - basis.submitted_cost_of_work)
              / basis.submitted_cost_of_work, 4)

      # the gate, at submit time only:
      justification_required = variance_pct > MILESTONE_VARIANCE_THRESHOLD_PCT   # STRICT >
      # variance_pct exactly equal to 0.0500 does NOT require justification.
      # A NEGATIVE variance (the milestone came in under the basis) never requires it.
    input_set: "prior estimates of the same project whose status is RECONCILED and whose milestone_rank is strictly lower. DRAFT, SUBMITTED, REJECTED and SUPERSEDED estimates are never a basis, even when their milestone_rank is lower."
    constants:
      MILESTONE_VARIANCE_THRESHOLD_PCT: 0.0500
    precision: "4 decimal places, round_half_up, on the ratio"
    worked_example: |
      SD estimate reconciled at submitted_cost_of_work = 38000000.00 (milestone_rank 1).
      DD estimate submitted at 39900000.00 (milestone_rank 2), prior_estimate_id omitted.
        basis          = the SD estimate (variance_basis = HIGHEST_RECONCILED_MILESTONE)
        variance_pct   = round(1900000.00 / 38000000.00, 4) = 0.0500
        0.0500 > 0.0500 is FALSE, so justification_note may be omitted and the submit succeeds.
      Raising the DD estimate to 39905000.00 gives round(0.05013..., 4) = 0.0501 > 0.0500,
      and an omitted justification_note then fails with ERR_VARIANCE_JUSTIFICATION_REQUIRED.

  - name: cost_report_line_reconciliation
    trigger: "on every POST /cost-reports/{id}/lines"
    algorithm: aggregation
    formula: |
      # Per line, the extended amount is rounded BEFORE it enters any total.
      # Rounding the products first and summing the rounded values is NOT the same
      # number as summing the exact products and rounding once at the end.
      line_amount = round_half_up(
          line.quantity * line.unit_rate * (1 + line.markup_pct), 2)

      report.reported_cost_total    = sum(l.line_amount for l in report.lines)
      report.undisputed_cost_total  = sum(l.line_amount for l in report.lines if l.disputed == false)
      report.disputed_cost_total    = sum(l.line_amount for l in report.lines if l.disputed == true)
      report.line_count             = count(report.lines)
      # invariant: reported_cost_total == undisputed_cost_total + disputed_cost_total
    input_set: "every line ever appended to this report (the lines array is append-only; there is no line deletion endpoint)"
    constants:
      MONEY_PRECISION: 2
    precision: "2 decimal places, round_half_up, applied PER LINE before summation"
    worked_example: |
      three lines appended to one report:
        (quantity 3,  unit_rate 101.005,  markup_pct 0.050) -> round( 318.16575,  2) =  318.17
        (quantity 7,  unit_rate  12.345,  markup_pct 0.075) -> round(  92.896125, 2) =   92.90
        (quantity 1,  unit_rate 1000.001, markup_pct 0.000) -> round(1000.001,    2) = 1000.00
      reported_cost_total = 318.17 + 92.90 + 1000.00 = 1411.07
      Summing the exact products first gives 318.16575 + 92.896125 + 1000.001 =
      1411.062875, which rounds once to 1411.06 - one cent LOWER. The pinned answer is
      1411.07, and every subtotal (undisputed / disputed) must be a sum of the SAME
      rounded line_amount values the response exposes, so marking line 2 disputed yields
      undisputed 318.17 + 1000.00 = 1318.17 and disputed 92.90, which still add back to
      1411.07 exactly.

  - name: buyout_savings_tracking
    trigger: "recomputed on every POST /work-packages/{id}/award, every POST /subcontracts, and every TERMINATE_FOR_DEFAULT cascade that rewrites WorkPackage.awarded_amount"
    algorithm: aggregation
    formula: |
      per_package_delta(wp) = wp.budget_amount - wp.awarded_amount   # positive == underrun
      packages = [wp for wp in WorkPackage
                  where wp.project_id == project.id
                    and wp.procurement_status in {AWARDED, REPROCUREMENT, CLOSED}]
      # BUDGETED and SOLICITING packages are excluded: nothing has been bought out yet.
    input_set: "work packages of the project whose procurement_status is AWARDED, REPROCUREMENT or CLOSED"
    constants:
      MONEY_PRECISION: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: TRADE_LEVEL
        when: "written to CmarProject.buyout_savings_trade_level, and snapshotted onto CostReport.buyout_savings_to_date at reconcile/dispute time"
        difference: |
          Only underrunning packages contribute; overruns are floored at zero per package.
          buyout_savings_trade_level =
            sum(max(per_package_delta(wp), 0.00) for wp in packages)
          This is the number the CM reports to the owner trade by trade: a package that came
          in over budget is a separate problem, not a reduction of the savings already banked
          on the packages that came in under.
      - name: PROJECT_NET
        when: "written to CmarProject.buyout_savings_project_net, and it is this variant - never TRADE_LEVEL - that the shared-savings settlement audits against"
        difference: |
          Every package contributes signed, so overruns offset underruns and the result
          may be negative.
          buyout_savings_project_net =
            sum(per_package_delta(wp) for wp in packages)
    worked_example: |
      WP-A budget 5000000.00 awarded 4600000.00 -> delta +400000.00
      WP-B budget 3000000.00 awarded 3250000.00 -> delta -250000.00
        TRADE_LEVEL = 400000.00 + 0.00      =  400000.00
        PROJECT_NET = 400000.00 - 250000.00 =  150000.00
      Identical data, two different published savings figures.

  - name: draw_approval_requirement
    trigger: "at ContingencyDraw creation, inside every cascade that mints a draw"
    algorithm: threshold
    formula: |
      if draw.contingency_type == 'OWNER':
          requires_owner_approval = true            # unconditional: it is the owner's money
      else:  # CONSTRUCTION
          requires_owner_approval =
              (draw.amount > DRAW_OWNER_APPROVAL_THRESHOLD)      # STRICT >
              or (project.contingency_posture == 'CONSTRAINED')
              or (draw.origin == 'SUBCONTRACTOR_DEFAULT_PREMIUM')
    input_set: "the draw being minted plus its project's contingency_posture at mint time"
    constants:
      DRAW_OWNER_APPROVAL_THRESHOLD: 50000.00
    precision: "boolean output; the comparison is on 2-decimal money"
    worked_example: |
      CONSTRUCTION draw of exactly 50000.00 on an OPEN-posture project, origin
      CHANGE_EVENT_CLASSIFICATION: 50000.00 > 50000.00 is FALSE and neither disjunct holds,
      so requires_owner_approval == false and POST /contingency-draws/{id}/post succeeds
      straight from REQUESTED. A draw of 50000.01 sets the flag and the same post is
      rejected with ERR_OWNER_APPROVAL_REQUIRED.

  - name: contingency_posture_derivation
    trigger: "after every contingency ledger movement: draw post, draw void, bond-claim settlement credit, and GMP execution"
    algorithm: threshold
    formula: |
      if project.construction_contingency_original == 0.00:
          remaining_pct = 0.0000
      else:
          remaining_pct = round_half_up(
              project.construction_contingency_remaining
              / project.construction_contingency_original, 4)

      if project.closeout_status == 'SETTLEMENT_EXECUTED':
          contingency_posture = 'FROZEN'
      elif remaining_pct <= CONSTRAINED_POSTURE_PCT:            # NON-strict <=
          # a fully exhausted pot yields remaining_pct 0.0000, which lands here:
          # there is no separate EXHAUSTED posture, exhaustion is the limit case of
          # CONSTRAINED and is reported as CONSTRAINED.
          contingency_posture = 'CONSTRAINED'
      else:
          contingency_posture = 'OPEN'
    input_set: "the project's own two construction-contingency fields plus its closeout_status; the OWNER pot never influences the posture"
    constants:
      CONSTRAINED_POSTURE_PCT: 0.10
    precision: "4 decimal places, round_half_up, on the ratio"
    worked_example: |
      construction_contingency_original 240000.00, remaining 15000.00
        remaining_pct = round(0.0625, 4) = 0.0625 <= 0.10 -> CONSTRAINED
      A move to exactly 24000.00 remaining gives 0.1000 <= 0.10, still CONSTRAINED
      (the boundary is inclusive); 24000.01 gives 0.1000 as well after 4dp rounding of
      0.10000041..., so the posture stays CONSTRAINED - the rounding happens BEFORE the
      comparison, not after.

  - name: gmp_price_conservation
    trigger: "asserted after every write that touches a money field of CmarProject: GMP execution, draw post, draw void, bond-claim settlement, amendment execution"
    algorithm: aggregation
    formula: |
      # The guaranteed maximum price is a closed envelope. Contingency dollars never
      # leave it; they only move between the two unspent pots and the spent bucket.
      project.gmp_amount ==
          project.cost_of_work_budget_total
        + project.general_conditions_total
        + project.insurance_amount
        + project.cm_fee_amount
        + project.owner_contingency_remaining
        + project.construction_contingency_remaining
        + project.contingency_drawn_to_cost_total
      # therefore, for any single posted draw of amount A against pot P:
      #   P_remaining decreases by exactly A  AND  contingency_drawn_to_cost_total
      #   increases by exactly A, and gmp_amount does not move at all.
      # Voiding that draw restores both fields to their pre-post values exactly;
      # after post-then-void every one of the seven terms is byte-identical to its
      # value before the post, with no residue in either direction.
    input_set: "the seven money fields of the single CmarProject row"
    constants:
      MONEY_PRECISION: 2
    precision: "2 decimal places, exact equality (no tolerance band)"
    worked_example: |
      cost_of_work_budget_total 3000000.00 + general_conditions_total 200000.00
      + insurance_amount 33280.00 + cm_fee_amount 129331.20
      + owner_contingency_remaining 100000.00 + construction_contingency_remaining 15000.00
      + contingency_drawn_to_cost_total 225000.00
      = 3702611.20 == gmp_amount 3702611.20
    note: "An AMENDMENT execution moves gmp_amount AND cost_of_work_budget_total by the same amount_delta, so the identity survives amendments too."

  - name: default_replacement_exposure
    trigger: "on POST /subcontracts/{id}/status-action with action == TERMINATE_FOR_DEFAULT"
    algorithm: aggregation
    formula: |
      sub.unpaid_committed_amount  = sub.contract_amount - sub.paid_to_date
      sub.replacement_cost_amount  = round_half_up(
          REPLACEMENT_PREMIUM_MULTIPLIER * sub.unpaid_committed_amount, 2)
      replacement_premium          = sub.replacement_cost_amount - sub.unpaid_committed_amount

      # the premium - NOT the whole replacement cost - is what the guaranteed price must
      # absorb, because the unpaid committed amount was already inside the cost of work.
      # It is minted as a CONSTRUCTION ContingencyDraw with origin SUBCONTRACTOR_DEFAULT_PREMIUM.
      wp.replacement_reserve_amount = sub.replacement_cost_amount
      wp.awarded_amount             = wp.awarded_amount + replacement_premium
      wp.committed_amount           = sum(s.contract_amount for s in wp.subcontracts
                                          if s.contract_status in {ACTIVE, DEFAULT_NOTICED, COMPLETED})
                                    + sum(s.paid_to_date   for s in wp.subcontracts
                                          if s.contract_status == 'TERMINATED_FOR_DEFAULT')
    input_set: "the single terminated Subcontract row, plus every sibling Subcontract of its WorkPackage for the committed_amount recount"
    constants:
      REPLACEMENT_PREMIUM_MULTIPLIER: 1.15
    precision: "2 decimal places, round_half_up"
    worked_example: |
      contract_amount 1900000.00, paid_to_date 400000.00
        unpaid_committed_amount = 1500000.00
        replacement_cost_amount = round(1.15 * 1500000.00, 2) = 1725000.00
        replacement_premium     = 225000.00   -> the CONSTRUCTION draw amount
      On a package with budget_amount 2000000.00 and awarded_amount 1900000.00:
        awarded_amount   -> 2125000.00
        committed_amount ->  400000.00
        the package now overruns by 125000.00, so buyout_savings_trade_level contributes
        0.00 for it while buyout_savings_project_net contributes -125000.00.

  - name: bond_recovery_credit
    trigger: "on POST /subcontracts/{id}/bond-claim with action == SETTLE"
    algorithm: aggregation
    formula: |
      sub.bond_recovered_amount = min(payload.recovered_amount, sub.bond_claim_amount)
      default_draw = the ContingencyDraw of this project whose
                     source_subcontract_id == sub.id and origin == 'SUBCONTRACTOR_DEFAULT_PREMIUM'
                     and status == 'POSTED'   (at most one exists)
      if default_draw is null:
          credit = 0.00
      else:
          credit = min(sub.bond_recovered_amount, default_draw.amount)

      project.construction_contingency_remaining += credit
      project.contingency_drawn_to_cost_total    -= credit
      # gmp_price_conservation is therefore preserved; the surety's money refills the
      # CM's contingency, it does not reduce the guaranteed maximum price.
      # recompute contingency_posture afterwards: this is the ONLY path other than a
      # void that can move CONSTRAINED -> OPEN.
    input_set: "the settling Subcontract plus the at-most-one POSTED SUBCONTRACTOR_DEFAULT_PREMIUM draw that names it"
    constants:
      MONEY_PRECISION: 2
    precision: "2 decimal places, round_half_up"
    note: "The credit is capped by the posted draw amount so an over-recovery can never manufacture contingency the project never spent."

  - name: allowance_unit_conservation
    trigger: "on every POST /qualification-items/{id}/allowance-reconciliation (both RECONCILE and REVERSE actions)"
    algorithm: aggregation
    formula: |
      item.allowance_unit_rate = round_half_up(item.allowance_amount / item.allocated_units, 4)

      on action == RECONCILE with payload.units U and payload.actual_unit_cost C:
          require U <= item.remaining_units          else ERR_ALLOWANCE_UNITS_EXCEEDED
          booked   = round_half_up(U * C, 2)
          expected = round_half_up(U * item.allowance_unit_rate, 2)
          item.reconciled_units   += U
          item.remaining_units    -= U
          item.reconciled_amount  += booked
          item.variance_amount     = item.reconciled_amount
                                     - round_half_up(item.reconciled_units * item.allowance_unit_rate, 2)
          item.reconciliation_seq += 1
          item.last_action         = 'RECONCILE'

      on action == REVERSE (compensating, reverses the LAST RECONCILE only):
          require item.last_action == 'RECONCILE'    else ERR_ALLOWANCE_REVERSAL_INVALID
          undo exactly the four field movements of that last RECONCILE
          item.reconciliation_seq is NOT decremented (it counts RECONCILE actions ever posted)
          item.last_action = 'REVERSE'

      # THE INVARIANT, asserted after every action of either kind:
      item.allocated_units == item.remaining_units + item.reconciled_units
      # and item.status is re-derived: OPEN when reconciled_units == 0,
      # FULLY_RECONCILED when reconciled_units == allocated_units,
      # PARTIALLY_RECONCILED otherwise.
    input_set: "the single QualificationItem row; only item_type == ALLOWANCE rows accept this action"
    constants:
      MONEY_PRECISION: 2
      RATIO_PRECISION: 4
    precision: "units are exact decimals; money 2dp round_half_up; unit rate 4dp round_half_up"
    worked_example: |
      allowance_amount 60000.00 over allocated_units 1200 -> allowance_unit_rate 50.0000
      RECONCILE units 500 at actual_unit_cost 58.00:
        booked            = 29000.00
        reconciled_amount = 29000.00
        expected at rate  = round(500 * 50.0000, 2) = 25000.00
        variance_amount   = 4000.00
        remaining_units   = 700, reconciled_units = 500, 1200 == 700 + 500
        status = PARTIALLY_RECONCILED, reconciliation_seq = 1
      REVERSE:
        reconciled_amount = 0.00, variance_amount = 0.00
        remaining_units   = 1200, reconciled_units = 0, 1200 == 1200 + 0
        status = OPEN, reconciliation_seq stays 1, last_action = REVERSE

  - name: shared_savings_split
    trigger: "on POST /projects/{id}/shared-savings; the variant is chosen by the request's `basis` field, and `execute: true` writes the settlement"
    algorithm: tiered_pricing
    formula: |
      # the envelope available to be underrun (fee and insurance are earned regardless
      # and are therefore carved out of both the numerator and the denominator base):
      recoverable_base = project.gmp_amount - project.cm_fee_amount - project.insurance_amount

      settled_cost = <variant-specific, see variants>

      savings_pool = recoverable_base - settled_cost
      if savings_pool <= 0.00:
          savings_pool = 0.00; cm_share = 0.00; owner_share = 0.00; STOP

      savings_pct = round_half_up(savings_pool / project.gmp_amount, 4)
      # tier selection - both boundaries NON-strict on the upper edge:
      if   savings_pct <= SAVINGS_TIER_1_MAX_PCT: cm_rate = SAVINGS_TIER_1_CM_RATE
      elif savings_pct <= SAVINGS_TIER_2_MAX_PCT: cm_rate = SAVINGS_TIER_2_CM_RATE
      else:                                       cm_rate = SAVINGS_TIER_3_CM_RATE

      uncapped_cm = round_half_up(cm_rate * savings_pool, 2)
      cm_cap      = round_half_up(CM_SHARE_CAP_OF_FEE_PCT * project.cm_fee_amount, 2)
      cm_share    = min(uncapped_cm, cm_cap)
      owner_share = savings_pool - cm_share      # the owner absorbs the capped remainder
    input_set: "CostReport rows of the project, filtered per variant; plus project.audit_adjustment_total for the final variant. A project with zero RECONCILED cost reports is rejected with ERR_NO_RECONCILED_COST_REPORT rather than settling a full-GMP savings pool."
    constants:
      SAVINGS_TIER_1_MAX_PCT: 0.02
      SAVINGS_TIER_2_MAX_PCT: 0.05
      SAVINGS_TIER_1_CM_RATE: 0.25
      SAVINGS_TIER_2_CM_RATE: 0.35
      SAVINGS_TIER_3_CM_RATE: 0.50
      CM_SHARE_CAP_OF_FEE_PCT: 0.25
    precision: "money 2dp round_half_up; savings_pct 4dp round_half_up, rounded BEFORE tier comparison"
    variants:
      - name: PRE_AUDIT_PROVISIONAL
        when: "basis == PRE_AUDIT_PROVISIONAL; permitted while audit_status is any of NOT_REQUESTED, IN_PROGRESS or CLOSED, and while cost reports remain OPEN, DISPUTED or held; writes provisional_savings_pool / provisional_cm_savings_share / provisional_owner_savings_share and moves closeout_status to PROVISIONAL_COMPUTED"
        difference: |
          settled_cost = sum(r.reported_cost_total for r in CostReport
                             where r.project_id == project.id
                               and r.status in {RECONCILED, DISPUTED})
          Disputed dollars are counted AGAINST the CM (they are treated as real cost), and
          project.audit_adjustment_total is ignored entirely. This is deliberately the
          conservative reading: it understates the savings the CM may claim.
      - name: POST_AUDIT_FINAL
        when: "basis == POST_AUDIT_FINAL; permitted only when audit_status == CLOSED and no CostReport of the project is in OPEN, DISPUTED or RECONCILIATION_HELD; writes final_savings_pool / final_cm_savings_share / final_owner_savings_share and moves closeout_status to FINAL_COMPUTED when execute == false or to SETTLEMENT_EXECUTED when execute == true"
        difference: |
          settled_cost = sum(r.undisputed_cost_total for r in CostReport
                             where r.project_id == project.id
                               and r.status == 'RECONCILED')
                       + project.audit_adjustment_total
          Disputed line amounts drop out of the cost base entirely, and the auditor's signed
          adjustment total is added back in. Because both the pool AND therefore the tier can
          move, the two variants can select different cm_rate values from the same project.
    worked_example: |
      project: gmp_amount 1245897.60, cm_fee_amount 44457.60, insurance_amount 11440.00
        recoverable_base = 1190000.00
        cm_cap           = round(0.25 * 44457.60, 2) = 11114.40
      cost reports: CR1 RECONCILED reported 1000000.00 / undisputed 1000000.00
                    CR2 RECONCILED reported  165100.00 / undisputed  140000.00
      audit_adjustment_total = 5000.00
      PRE_AUDIT_PROVISIONAL:
        settled_cost = 1165100.00
        savings_pool =   24900.00
        savings_pct  = round(24900.00 / 1245897.60, 4) = 0.0200  <= 0.02 -> cm_rate 0.25
        uncapped_cm  = round(0.25 * 24900.00, 2) = 6225.00 ; 6225.00 < 11114.40, cap idle
        cm_share     =    6225.00 ; owner_share = 18675.00
      POST_AUDIT_FINAL:
        settled_cost = 1140000.00 + 5000.00 = 1145000.00
        savings_pool =   45000.00
        savings_pct  = round(45000.00 / 1245897.60, 4) = 0.0361  (> 0.02, <= 0.05) -> cm_rate 0.35
        uncapped_cm  = round(0.35 * 45000.00, 2) = 15750.00 ; cap BINDS
        cm_share     =   11114.40 ; owner_share = 33885.60
      Same project, same reports: two different pools, two different tiers, and the cap
      binds on exactly one of the two variants.

# =====================================================================
# §1.4 Validation Rules (ordered by priority; lowest number wins)
# =====================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the authenticated role is permitted to invoke this endpoint per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 21
    category: auth
    check: "action-level authority on the two endpoints §1.7 shares between roles: on POST /work-packages/{id}/transparency, target_status DISCLOSED is ProcurementOfficer-only and target_status AUDITED is IndependentAuditor-only; on POST /subcontracts/{id}/bond-claim, action FILE is ConstructionManager-only while ACKNOWLEDGE, SETTLE and DENY are OwnerRepresentative-only"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /work-packages/{id}/transparency, POST /subcontracts/{id}/bond-claim"
    note: "the endpoint-level role list at priority 20 admits both holders because the endpoint is shared; without this row the disclosure step the CM competes under could be certified by the same party that published it, and the surety settlement could be recorded by the party that filed the claim"

  - priority: 30
    category: business_constraint
    check: "request-shape validation: every field the endpoint declares required is present; enums take declared values; money fields are non-negative decimals with at most 2 decimal places; unit-rate fields (a cost line's unit_rate, an allowance's actual_unit_cost) are non-negative decimals with at most 4 decimal places; ratio fields (cm_fee_pct, insurance_rate, markup_pct) are decimals with at most 4 decimal places; datetime fields parse as ISO 8601 UTC instants; a closed/half-open interval's start is strictly before its end; conditionally-required fields are present when their condition holds (allowance_amount / allocated_units / unit_of_measure when item_type == ALLOWANCE, bond_amount when bond_required == true, void_reason on void, recovered_amount on bond-claim SETTLE, adjustment_amount on audit POST_ADJUSTMENT)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 41
    category: existence
    check: "a project id appearing in the path resolves to a CmarProject"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /projects/{id}/audit-request, POST /projects/{id}/audit-actions, POST /projects/{id}/shared-savings, GET /projects/{id}"

  - priority: 42
    category: existence
    check: "a work package id appearing in the path resolves to a WorkPackage"
    error_id: ERR_WORK_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /work-packages/{id}/solicit, POST /work-packages/{id}/award, POST /work-packages/{id}/transparency, GET /work-packages/{id}"

  - priority: 43
    category: existence
    check: "a subcontract id appearing in the path resolves to a Subcontract"
    error_id: ERR_SUBCONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /subcontracts/{id}/progress-payment, POST /subcontracts/{id}/status-action, POST /subcontracts/{id}/bond-claim, GET /subcontracts/{id}"

  - priority: 44
    category: existence
    check: "a change event id appearing in the path resolves to a ChangeEvent"
    error_id: ERR_CHANGE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /change-events/{id}/submit, POST /change-events/{id}/review, POST /change-events/{id}/classify, GET /change-events/{id}"

  - priority: 45
    category: existence
    check: "any other id appearing in the path (estimate, gmp proposal, qualification item, self-perform bid, contingency draw, cost report) resolves to a row of that entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /estimates/{id}/submit, POST /estimates/{id}/reconcile, POST /gmp-proposals/{id}/submit, POST /gmp-proposals/{id}/decide, POST /qualification-items/{id}/allowance-reconciliation, POST /self-perform-bids/{id}/open, POST /contingency-draws/{id}/approve, POST /contingency-draws/{id}/post, POST /contingency-draws/{id}/void, POST /cost-reports/{id}/lines, POST /cost-reports/{id}/reconcile, POST /cost-reports/{id}/release-hold, and the six remaining GET /<collection>/{id} reads"

  - priority: 50
    category: existence
    check: "a project_id supplied in a request body resolves to a CmarProject"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /estimates, POST /gmp-proposals, POST /work-packages, POST /change-events, POST /cost-reports"

  - priority: 51
    category: existence
    check: "a work_package_id supplied in a request body resolves to a WorkPackage"
    error_id: ERR_WORK_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /self-perform-bids, POST /subcontracts"

  - priority: 52
    category: existence
    check: "any other id supplied in a request body (prior_estimate_id, based_on_estimate_id, gmp_proposal_id, awarded_bid_id, bid_id, qualification_item_id, source_subcontract_id, work_package_id on a cost report line) resolves to a row of that entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /estimates, POST /gmp-proposals, POST /qualification-items, POST /work-packages/{id}/award, POST /subcontracts, POST /change-events, POST /cost-reports/{id}/lines"

  - priority: 55
    category: state
    check: "expected_project_version equals the current CmarProject.version (optimistic concurrency, §1.2.1)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /estimates, POST /gmp-proposals"

  - priority: 56
    category: state
    check: "expected_work_package_version equals the current WorkPackage.version (optimistic concurrency, §1.2.1)"
    error_id: ERR_STALE_WORK_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /subcontracts"

  - priority: 60
    category: state
    check: "the project's gmp_status == EXECUTED for operations that only exist under an executed guaranteed maximum price"
    error_id: ERR_GMP_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /work-packages/{id}/solicit, POST /work-packages/{id}/award, POST /subcontracts, POST /change-events/{id}/submit, POST /change-events/{id}/classify, POST /contingency-draws/{id}/approve, POST /contingency-draws/{id}/post, POST /cost-reports, POST /projects/{id}/shared-savings"

  - priority: 61
    category: state
    check: "the project's gmp_status is not yet EXECUTED for operations that establish the base price"
    error_id: ERR_GMP_ALREADY_EXECUTED
    http_status: 409
    applies_to: "POST /gmp-proposals with proposal_type BASE, POST /gmp-proposals/{id}/decide with decision EXECUTE on a BASE proposal"

  - priority: 62
    category: state
    check: "the ProgressiveEstimate is in a status the requested action permits (submit from DRAFT or RETURNED; reconcile from SUBMITTED)"
    error_id: ERR_ESTIMATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /estimates/{id}/submit, POST /estimates/{id}/reconcile, POST /gmp-proposals (based_on_estimate_id must name a RECONCILED estimate)"

  - priority: 63
    category: state
    check: "the GmpProposal is in a status the requested action permits (submit from DRAFT or RETURNED_FOR_REVISION; decide from OWNER_REVIEW)"
    error_id: ERR_PROPOSAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /gmp-proposals/{id}/submit, POST /gmp-proposals/{id}/decide, POST /qualification-items (the parent proposal must be DRAFT or RETURNED_FOR_REVISION)"

  - priority: 64
    category: state
    check: "the WorkPackage's procurement_status permits the action (solicit from BUDGETED or REPROCUREMENT; award from SOLICITING) and its transparency_status permits the requested disclosure step (SEALED -> DISCLOSED -> AUDITED, no skipping and no regression)"
    error_id: ERR_PACKAGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /work-packages/{id}/solicit, POST /work-packages/{id}/award, POST /work-packages/{id}/transparency, POST /self-perform-bids"

  - priority: 65
    category: state
    check: "the SelfPerformBid is in a status the requested action permits (open from SEALED; award requires the named bid to be OPENED; POST /subcontracts requires the named awarded_bid_id to be a bid whose status is already AWARDED, so a losing NOT_AWARDED bid on the same package is rejected)"
    error_id: ERR_BID_STATE_INVALID
    http_status: 409
    applies_to: "POST /self-perform-bids/{id}/open, POST /work-packages/{id}/award, POST /subcontracts"

  - priority: 66
    category: state
    check: "the Subcontract's contract_status permits the action (progress-payment from ACTIVE or DEFAULT_NOTICED; NOTICE_DEFAULT from ACTIVE; CURE from DEFAULT_NOTICED; TERMINATE_FOR_DEFAULT from DEFAULT_NOTICED; COMPLETE from ACTIVE)"
    error_id: ERR_SUBCONTRACT_STATE_INVALID
    http_status: 409
    applies_to: "POST /subcontracts/{id}/progress-payment, POST /subcontracts/{id}/status-action"

  - priority: 67
    category: state
    check: "the Subcontract's bond_claim_status permits the action (FILE from NONE; ACKNOWLEDGE from FILED; SETTLE or DENY from ACKNOWLEDGED) and the axis is not NOT_APPLICABLE"
    error_id: ERR_BOND_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /subcontracts/{id}/bond-claim"

  - priority: 68
    category: state
    check: "the ChangeEvent's status permits the action (submit from DRAFT or REVISION_REQUESTED; review from SUBMITTED for BEGIN_REVIEW and from UNDER_REVIEW for REQUEST_REVISION or REJECT; classify from UNDER_REVIEW)"
    error_id: ERR_CHANGE_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /change-events/{id}/submit, POST /change-events/{id}/review, POST /change-events/{id}/classify"

  - priority: 69
    category: state
    check: "the ContingencyDraw's status permits the action (approve from REQUESTED; post from REQUESTED when requires_owner_approval is false or from OWNER_APPROVED; void from POSTED)"
    error_id: ERR_DRAW_STATE_INVALID
    http_status: 409
    applies_to: "POST /contingency-draws/{id}/approve, POST /contingency-draws/{id}/post, POST /contingency-draws/{id}/void"

  - priority: 70
    category: state
    check: "the CostReport's status permits the action (append line from OPEN or DISPUTED; reconcile from OPEN or DISPUTED; release-hold from RECONCILIATION_HELD). A report in RECONCILIATION_HELD accepts neither lines nor a reconcile decision."
    error_id: ERR_COST_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /cost-reports/{id}/lines, POST /cost-reports/{id}/reconcile, POST /cost-reports/{id}/release-hold"

  - priority: 71
    category: state
    check: "the project's audit_status permits the action (audit-request from NOT_REQUESTED; POST_ADJUSTMENT from IN_PROGRESS; CLOSE from IN_PROGRESS)"
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /projects/{id}/audit-request, POST /projects/{id}/audit-actions"

  - priority: 72
    category: state
    check: "the project's closeout_status is not already SETTLEMENT_EXECUTED for any operation that would move money inside the guaranteed maximum price"
    error_id: ERR_CLOSEOUT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /projects/{id}/shared-savings with execute true, POST /cost-reports, POST /cost-reports/{id}/lines, POST /change-events/{id}/classify"
    note: "the two contingency-draw endpoints are deliberately NOT listed: a settled project always carries contingency_posture == FROZEN, so those two paths are owned by priority 73 and report ERR_CONTINGENCY_FROZEN instead. Listing them here would make ERR_CONTINGENCY_FROZEN unreachable."

  - priority: 73
    category: state
    check: "the project's contingency_posture is not FROZEN when a contingency draw is posted or voided"
    error_id: ERR_CONTINGENCY_FROZEN
    http_status: 409
    applies_to: "POST /contingency-draws/{id}/post, POST /contingency-draws/{id}/void"

  - priority: 74
    category: state
    check: "release-hold on a cost report requires the project's contingency_posture to have recovered to OPEN; a report may not be released while the posture is still CONSTRAINED or FROZEN"
    error_id: ERR_POSTURE_NOT_RECOVERED
    http_status: 409
    applies_to: "POST /cost-reports/{id}/release-hold"

  - priority: 80
    category: business_safety
    check: "segregation of duties on X-User-ID: the operator opening a sealed bid must not be the operator that prepared it (SelfPerformBid.prepared_by_user_id), and the operator classifying a change event must not be the operator that most recently submitted it (ChangeEvent.submitted_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /self-perform-bids/{id}/open, POST /change-events/{id}/classify"

  - priority: 81
    category: business_safety
    check: "open-book transparency gate: a SelfPerformBid whose bidder_type == CM_SELF_PERFORM may only be opened once its WorkPackage.transparency_status is DISCLOSED or AUDITED. Third-party bids are exempt - the gate exists because the CM is bidding against the trades it also administers."
    error_id: ERR_OPEN_BOOK_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: "POST /self-perform-bids/{id}/open"

  - priority: 82
    category: business_safety
    check: "open-book arithmetic: the five components of open_book_cost_breakdown (labor, material, equipment, overhead, profit) must sum exactly to base_bid_amount"
    error_id: ERR_OPEN_BOOK_BREAKDOWN_MISMATCH
    http_status: 422
    applies_to: "POST /self-perform-bids"

  - priority: 90
    category: business_referential
    check: "cross-project reference integrity: every referenced row must belong to the same CmarProject as the row being written (prior_estimate_id and based_on_estimate_id's project, gmp_proposal_id's project, qualification_item_id's proposal's project, source_subcontract_id's package's project, a cost report line's work_package_id project)"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: "POST /estimates, POST /gmp-proposals, POST /qualification-items, POST /change-events, POST /cost-reports/{id}/lines"

  - priority: 91
    category: business_referential
    check: "a Subcontract's awarded_bid_id must name a SelfPerformBid whose work_package_id equals the Subcontract's work_package_id, and the award call's bid_id must belong to the package in the path"
    error_id: ERR_WORK_PACKAGE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /subcontracts, POST /work-packages/{id}/award"

  - priority: 92
    category: business_referential
    check: "a declared prior_estimate_id must have a strictly lower milestone_rank than the estimate being created; a milestone may not be priced against a later or equal design milestone"
    error_id: ERR_MILESTONE_RANK_REGRESSION
    http_status: 422
    applies_to: "POST /estimates"

  - priority: 100
    category: business_temporal
    check: "a sealed bid may not be opened before its WorkPackage.solicitation_closes_at; the comparison is against the logical clock and the boundary is inclusive (clock exactly equal to solicitation_closes_at is permitted)"
    error_id: ERR_SOLICITATION_STILL_OPEN
    http_status: 409
    applies_to: "POST /self-perform-bids/{id}/open"

  - priority: 101
    category: business_temporal
    check: "a new CostReport's half-open period [period_start, period_end) must not overlap the period of any existing CostReport of the same project in any status. Adjacency is allowed: a period whose period_start equals another period's period_end is not an overlap."
    error_id: ERR_COST_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /cost-reports"

  - priority: 102
    category: business_temporal
    check: "a new Subcontract's closed performance window [performance_start, performance_end] must be separated from every blocking sibling window on the same WorkPackage by at least MOBILIZATION_BUFFER_HOURS of clear time on whichever side it falls. Blocking siblings are those whose contract_status is ACTIVE, DEFAULT_NOTICED or COMPLETED; TERMINATED_FOR_DEFAULT siblings are non-blocking so that reprocurement can reuse the window."
    error_id: ERR_PERFORMANCE_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /subcontracts"

  - priority: 110
    category: business_constraint
    check: "justification_note must be present and non-empty at submit time when calculations.estimate_milestone_variance yields variance_pct strictly greater than MILESTONE_VARIANCE_THRESHOLD_PCT"
    error_id: ERR_VARIANCE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /estimates/{id}/submit"

  - priority: 111
    category: business_constraint
    check: "an allowance RECONCILE action's units must not exceed QualificationItem.remaining_units"
    error_id: ERR_ALLOWANCE_UNITS_EXCEEDED
    http_status: 422
    applies_to: "POST /qualification-items/{id}/allowance-reconciliation"

  - priority: 112
    category: business_constraint
    check: "an allowance RECONCILE whose actual_unit_cost exceeds allowance_unit_rate must carry overrun_authorized true, acknowledging that the difference will be routed through a change event"
    error_id: ERR_ALLOWANCE_OVERRUN_UNAUTHORIZED
    http_status: 422
    applies_to: "POST /qualification-items/{id}/allowance-reconciliation"

  - priority: 113
    category: business_constraint
    check: "a REVERSE action requires QualificationItem.last_action == RECONCILE; a reversal cannot be reversed and an untouched allowance cannot be reversed"
    error_id: ERR_ALLOWANCE_REVERSAL_INVALID
    http_status: 422
    applies_to: "POST /qualification-items/{id}/allowance-reconciliation"

  - priority: 114
    category: business_constraint
    check: "a shared-savings calculation of either basis requires at least one CostReport of the project in status RECONCILED; an empty reconciled set is rejected rather than treated as zero settled cost. The same rule gates POST /projects/{id}/audit-request, whose NOT_REQUESTED -> IN_PROGRESS transition also requires at least one RECONCILED cost report to audit."
    error_id: ERR_NO_RECONCILED_COST_REPORT
    http_status: 422
    applies_to: "POST /projects/{id}/shared-savings, POST /projects/{id}/audit-request"

  - priority: 115
    category: business_constraint
    check: "basis POST_AUDIT_FINAL requires that no CostReport of the project is in OPEN, DISPUTED or RECONCILIATION_HELD"
    error_id: ERR_COST_REPORTS_NOT_RECONCILED
    http_status: 422
    applies_to: "POST /projects/{id}/shared-savings"

  - priority: 116
    category: business_constraint
    check: "basis POST_AUDIT_FINAL requires the project's audit_status == CLOSED"
    error_id: ERR_AUDIT_NOT_CLOSED
    http_status: 422
    applies_to: "POST /projects/{id}/shared-savings"

  - priority: 120
    category: business_fiscal
    check: "a ContingencyDraw whose requires_owner_approval is true may not be posted directly from REQUESTED, and a draw on a CONSTRAINED-posture project always requires the owner-approved path"
    error_id: ERR_OWNER_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /contingency-draws/{id}/post"

  - priority: 121
    category: business_fiscal
    check: "the draw amount must not exceed the remaining balance of its contingency_type's pot (owner_contingency_remaining for OWNER, construction_contingency_remaining for CONSTRUCTION); the guaranteed maximum price may not be breached by overdrawing a pot"
    error_id: ERR_CONTINGENCY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /contingency-draws/{id}/post"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary ISO 8601 UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every deadline, solicitation window, mobilization buffer and reporting period in this scaffold is evaluated against this logical clock."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock; no entity is written and no state machine advances"

  # ---------------- CmarProject ----------------
  - method: POST
    path: "/projects"
    description: "Registers a CMAR project with its fee and insurance rates. gmp_status starts PRECONSTRUCTION, contingency_posture OPEN, audit_status NOT_REQUESTED, closeout_status NOT_STARTED, and every money field 0.00."
    roles: [ProgramAdmin]
    code: 201
    input: [name, owner_org, cm_fee_pct, insurance_rate, "precon_fee_amount?"]
    output: CmarProject
    side_effects:
      - "creates the CmarProject at version 1 with all four state axes at their initial states"

  - method: POST
    path: "/projects/{id}/audit-request"
    description: "The owner exercises its audit rights over the open-book records. Moves audit_status NOT_REQUESTED -> IN_PROGRESS."
    roles: [OwnerRepresentative]
    code: 200
    input: ["audit_scope_note?"]
    output: CmarProject
    side_effects:
      - "audit_status := IN_PROGRESS"
      - "increments CmarProject.version by 1"

  - method: POST
    path: "/projects/{id}/audit-actions"
    description: "The independent auditor posts a signed cost adjustment (action POST_ADJUSTMENT, adjustment_amount may be negative) or closes the engagement (action CLOSE). Only POST_AUDIT_FINAL shared savings consumes audit_adjustment_total."
    roles: [IndependentAuditor]
    code: 200
    input: [action, "adjustment_amount?", "adjustment_note?"]
    output: CmarProject
    side_effects:
      - "on POST_ADJUSTMENT: audit_adjustment_total += adjustment_amount (signed)"
      - "on CLOSE: audit_status := CLOSED"
      - "increments CmarProject.version by 1"

  - method: POST
    path: "/projects/{id}/shared-savings"
    description: "Runs calculations.shared_savings_split under the requested basis. execute == false computes and stores the figures only; execute == true additionally executes the settlement, which freezes the contingency, closes the guaranteed maximum price and closes every AWARDED work package."
    roles: [OwnerRepresentative]
    code: 200
    input: [basis, execute]
    output: CmarProject
    side_effects:
      - "on basis PRE_AUDIT_PROVISIONAL: writes provisional_savings_pool, provisional_cm_savings_share, provisional_owner_savings_share; closeout_status := PROVISIONAL_COMPUTED"
      - "on basis POST_AUDIT_FINAL: writes final_savings_pool, final_cm_savings_share, final_owner_savings_share; closeout_status := FINAL_COMPUTED when execute is false"
      - "on basis POST_AUDIT_FINAL with execute true: closeout_status := SETTLEMENT_EXECUTED, contingency_posture := FROZEN, gmp_status := CLOSED, and every WorkPackage of the project whose procurement_status == AWARDED moves to CLOSED"
      - "increments CmarProject.version by 1"

  - method: GET
    path: "/projects"
    description: "Lists CMAR projects."
    roles: [ProgramAdmin, ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor]
    code: 200
    input: ["gmp_status?", "contingency_posture?", "closeout_status?", "limit?", "offset?"]
    output: CmarProject[]
    side_effects: []

  - method: GET
    path: "/projects/{id}"
    description: "Reads one CMAR project including every derived contingency, buyout and savings figure."
    roles: [ProgramAdmin, ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor]
    code: 200
    input: []
    output: CmarProject
    side_effects: []

  # ---------------- ProgressiveEstimate ----------------
  - method: POST
    path: "/estimates"
    description: "Creates a design-milestone estimate and immediately evaluates calculations.estimate_milestone_variance. Creating a newer estimate for the same project_id and milestone_code supersedes the previous non-terminal one, so the write carries expected_project_version for optimistic-concurrency protection."
    roles: [ConstructionManager]
    code: 201
    input: [project_id, milestone_code, submitted_cost_of_work, expected_project_version, "prior_estimate_id?", "justification_note?"]
    output: ProgressiveEstimate
    side_effects:
      - "milestone_rank := global_constants.MILESTONE_RANK[milestone_code]"
      - "runs calculations.estimate_milestone_variance, writing variance_pct, variance_basis and variance_basis_estimate_id"
      - "any prior ProgressiveEstimate of the same project_id and milestone_code whose status is DRAFT, SUBMITTED or RETURNED moves to SUPERSEDED with superseded_by_estimate_id := the new row's id"
      - "increments CmarProject.version by 1"

  - method: POST
    path: "/estimates/{id}/submit"
    description: "Submits the estimate for owner reconciliation. Re-evaluates the milestone variance against the current reconciled basis and enforces the justification gate."
    roles: [ConstructionManager]
    code: 200
    input: ["justification_note?"]
    output: ProgressiveEstimate
    side_effects:
      - "status := SUBMITTED"
      - "re-runs calculations.estimate_milestone_variance"
      - "justification_note := payload.justification_note when supplied"
      - "increments ProgressiveEstimate.version by 1"

  - method: POST
    path: "/estimates/{id}/reconcile"
    description: "The owner accepts (decision ACCEPT) or returns (decision RETURN) a submitted milestone estimate."
    roles: [OwnerRepresentative]
    code: 200
    input: [decision, "reconciliation_note?"]
    output: ProgressiveEstimate
    side_effects:
      - "on ACCEPT: status := RECONCILED, reconciliation_stale := false"
      - "on RETURN: status := RETURNED"
      - "reconciliation_note := payload.reconciliation_note"
      - "increments ProgressiveEstimate.version by 1"

  - method: GET
    path: "/estimates"
    description: "Lists progressive estimates, filterable by any of its foreign keys."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "prior_estimate_id?", "variance_basis_estimate_id?", "superseded_by_estimate_id?", "status?", "milestone_code?", "limit?", "offset?"]
    output: ProgressiveEstimate[]
    side_effects: []

  - method: GET
    path: "/estimates/{id}"
    description: "Reads one progressive estimate including its computed variance and staleness flag."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: ProgressiveEstimate
    side_effects: []

  # ---------------- GmpProposal ----------------
  - method: POST
    path: "/gmp-proposals"
    description: "Creates a BASE guaranteed-maximum-price proposal from a RECONCILED estimate and prices it through calculations.gmp_establishment_pricing. A newer BASE proposal supersedes the previous non-terminal one, so the write carries expected_project_version."
    roles: [ConstructionManager]
    code: 201
    input: [project_id, based_on_estimate_id, cost_of_work_total, general_conditions_total, owner_contingency_amount, construction_contingency_amount, expected_project_version]
    output: GmpProposal
    side_effects:
      - "proposal_type := BASE, status := DRAFT, amount_delta := 0.00"
      - "runs calculations.gmp_establishment_pricing, writing provisional_fee_amount, insurance_amount, cm_fee_amount and gmp_amount"
      - "any prior BASE proposal of the same project whose status is DRAFT, OWNER_REVIEW or RETURNED_FOR_REVISION moves to SUPERSEDED with superseded_by_proposal_id := the new row's id"
      - "increments CmarProject.version by 1"

  - method: POST
    path: "/gmp-proposals/{id}/submit"
    description: "Submits the proposal to the owner. A BASE submission also moves the project's gmp_status PRECONSTRUCTION -> GMP_UNDER_REVIEW."
    roles: [ConstructionManager]
    code: 200
    input: ["cover_note?"]
    output: GmpProposal
    side_effects:
      - "status := OWNER_REVIEW"
      - "on a BASE proposal: CmarProject.gmp_status := GMP_UNDER_REVIEW and CmarProject.version increments by 1"
      - "increments GmpProposal.version by 1"

  - method: POST
    path: "/gmp-proposals/{id}/decide"
    description: "The owner executes (EXECUTE), returns (RETURN) or rejects (REJECT) a proposal under review. EXECUTE on a BASE proposal establishes the guaranteed maximum price and funds both contingency pots; EXECUTE on an AMENDMENT folds amount_delta into the executed price."
    roles: [OwnerRepresentative]
    code: 200
    input: [decision, "owner_decision_note?"]
    output: GmpProposal
    side_effects:
      - "on RETURN: status := RETURNED_FOR_REVISION, revision_count += 1, and for a BASE proposal CmarProject.gmp_status := PRECONSTRUCTION"
      - "on REJECT: status := REJECTED"
      - "on EXECUTE of a BASE proposal: status := EXECUTED; CmarProject.gmp_status := EXECUTED; gmp_amount, insurance_amount, cm_fee_amount, cost_of_work_budget_total, general_conditions_total, owner_contingency_original, owner_contingency_remaining, construction_contingency_original and construction_contingency_remaining are all copied from the proposal; contingency_drawn_to_cost_total := 0.00"
      - "on EXECUTE of an AMENDMENT: status := EXECUTED; CmarProject.gmp_amount += amount_delta and cost_of_work_budget_total += amount_delta, preserving calculations.gmp_price_conservation"
      - "runs calculations.proposed_gmp_rollup and calculations.contingency_posture_derivation afterwards"
      - "increments GmpProposal.version by 1 and CmarProject.version by 1"

  - method: GET
    path: "/gmp-proposals"
    description: "Lists guaranteed-maximum-price proposals, filterable by any of its foreign keys. This is the only discovery channel for an AMENDMENT proposal minted by the SCOPE_CHANGE classification cascade."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "based_on_estimate_id?", "change_event_id?", "superseded_by_proposal_id?", "proposal_type?", "status?", "limit?", "offset?"]
    output: GmpProposal[]
    side_effects: []

  - method: GET
    path: "/gmp-proposals/{id}"
    description: "Reads one guaranteed-maximum-price proposal including all four pricing outputs."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: GmpProposal
    side_effects: []

  # ---------------- QualificationItem ----------------
  - method: POST
    path: "/qualification-items"
    description: "Records an assumption, allowance, clarification or exclusion against a proposal that is still editable. ALLOWANCE rows additionally carry a unit ledger."
    roles: [ConstructionManager]
    code: 201
    input: [gmp_proposal_id, item_type, text, "allowance_amount?", "allocated_units?", "unit_of_measure?"]
    output: QualificationItem
    side_effects:
      - "for item_type ALLOWANCE: allowance_unit_rate := round(allowance_amount / allocated_units, 4), remaining_units := allocated_units, reconciled_units := 0, reconciled_amount := 0.00, variance_amount := 0.00, status := OPEN, last_action := NONE"
      - "for every other item_type: the allowance ledger fields are 0 and the row accepts no reconciliation action"

  - method: POST
    path: "/qualification-items/{id}/allowance-reconciliation"
    description: "Books actual quantities against a carried allowance (action RECONCILE) or compensates the most recent booking (action REVERSE). Runs calculations.allowance_unit_conservation."
    roles: [ConstructionManager]
    code: 200
    input: [action, "units?", "actual_unit_cost?", "overrun_authorized?"]
    output: QualificationItem
    side_effects:
      - "runs calculations.allowance_unit_conservation, rewriting remaining_units, reconciled_units, reconciled_amount, variance_amount, last_action and status"
      - "on RECONCILE: reconciliation_seq += 1"
      - "on REVERSE: reconciliation_seq is unchanged"
      - "increments QualificationItem.version by 1"

  - method: GET
    path: "/qualification-items"
    description: "Lists qualification items, filterable by parent proposal."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["gmp_proposal_id?", "item_type?", "status?", "limit?", "offset?"]
    output: QualificationItem[]
    side_effects: []

  - method: GET
    path: "/qualification-items/{id}"
    description: "Reads one qualification item including its allowance unit ledger."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: QualificationItem
    side_effects: []

  # ---------------- WorkPackage ----------------
  - method: POST
    path: "/work-packages"
    description: "Creates a trade buyout package under an executed guaranteed maximum price. procurement_status starts BUDGETED and transparency_status starts SEALED; the two axes move independently."
    roles: [ConstructionManager]
    code: 201
    input: [project_id, trade_division, budget_amount, "self_perform_intent?"]
    output: WorkPackage
    side_effects:
      - "procurement_status := BUDGETED, transparency_status := SEALED, awarded_amount := 0.00, committed_amount := 0.00, replacement_reserve_amount := 0.00, bid_count := 0"

  - method: POST
    path: "/work-packages/{id}/solicit"
    description: "Opens (or reopens, from REPROCUREMENT) the sealed bid solicitation window. Bids may be submitted at any time; they may only be OPENED once the logical clock reaches solicitation_closes_at."
    roles: [ConstructionManager]
    code: 200
    input: [solicitation_opens_at, solicitation_closes_at]
    output: WorkPackage
    side_effects:
      - "procurement_status := SOLICITING"
      - "solicitation_opens_at and solicitation_closes_at are recorded from the payload"
      - "increments WorkPackage.version by 1"

  - method: POST
    path: "/work-packages/{id}/transparency"
    description: "Advances the open-book disclosure axis: target_status DISCLOSED (ProcurementOfficer) publishes the cost breakdowns to the owner, target_status AUDITED (IndependentAuditor) certifies them. A CM self-perform bid cannot be opened until this axis reaches DISCLOSED or AUDITED."
    roles: [ProcurementOfficer, IndependentAuditor]
    code: 200
    input: [target_status, "disclosure_note?"]
    output: WorkPackage
    side_effects:
      - "transparency_status := payload.target_status"
      - "procurement_status is NOT touched"
      - "increments WorkPackage.version by 1"

  - method: POST
    path: "/work-packages/{id}/award"
    description: "Awards the package to an OPENED bid. Every other OPENED bid on the package moves to NOT_AWARDED. Recomputes both variants of calculations.buyout_savings_tracking."
    roles: [ProcurementOfficer]
    code: 200
    input: [bid_id, "award_note?"]
    output: WorkPackage
    side_effects:
      - "procurement_status := AWARDED, awarded_bid_id := payload.bid_id, awarded_amount := that bid's base_bid_amount"
      - "the named SelfPerformBid moves OPENED -> AWARDED; every other OPENED bid on the package moves to NOT_AWARDED"
      - "runs calculations.buyout_savings_tracking, rewriting CmarProject.buyout_savings_trade_level and buyout_savings_project_net"
      - "increments WorkPackage.version by 1 and CmarProject.version by 1"

  - method: GET
    path: "/work-packages"
    description: "Lists trade packages, filterable by project and by awarded bid."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "awarded_bid_id?", "procurement_status?", "transparency_status?", "trade_division?", "limit?", "offset?"]
    output: WorkPackage[]
    side_effects: []

  - method: GET
    path: "/work-packages/{id}"
    description: "Reads one trade package including both state axes and its committed / awarded / reserve figures."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: WorkPackage
    side_effects: []

  # ---------------- SelfPerformBid ----------------
  - method: POST
    path: "/self-perform-bids"
    description: "Submits a sealed bid against a SOLICITING package. bidder_type CM_SELF_PERFORM marks the construction manager's own forces; open_book_cost_breakdown must sum exactly to base_bid_amount. prepared_by_user_id is taken from X-User-ID and is the anchor of the open-bid segregation-of-duties rule."
    roles: [ConstructionManager]
    code: 201
    input: [work_package_id, bidder_type, bidder_name, base_bid_amount, open_book_cost_breakdown]
    output: SelfPerformBid
    side_effects:
      - "status := SEALED, prepared_by_user_id := X-User-ID"
      - "WorkPackage.bid_count += 1 and WorkPackage.version increments by 1"

  - method: POST
    path: "/self-perform-bids/{id}/open"
    description: "Opens a sealed bid after the solicitation closes. A CM_SELF_PERFORM bid additionally requires the package's transparency_status to be DISCLOSED or AUDITED, and the opener must not be the operator that prepared the bid."
    roles: [ProcurementOfficer]
    code: 200
    input: ["open_note?"]
    output: SelfPerformBid
    side_effects:
      - "status := OPENED, opened_by_user_id := X-User-ID, opened_at := logical clock"
      - "increments SelfPerformBid.version by 1"

  - method: GET
    path: "/self-perform-bids"
    description: "Lists sealed and opened bids, filterable by package. open_book_cost_breakdown is only populated in the response for bids whose status is OPENED, AWARDED or NOT_AWARDED; for SEALED bids it reads as null."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["work_package_id?", "status?", "bidder_type?", "limit?", "offset?"]
    output: SelfPerformBid[]
    side_effects: []

  - method: GET
    path: "/self-perform-bids/{id}"
    description: "Reads one bid. The same sealed-breakdown suppression applies as on the list endpoint."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: SelfPerformBid
    side_effects: []

  # ---------------- Subcontract ----------------
  - method: POST
    path: "/subcontracts"
    description: "Writes a subcontract from the AWARDED bid on the same package. The closed performance window must clear every blocking sibling window by MOBILIZATION_BUFFER_HOURS. A replacement subcontract written after a default supersedes the terminated one's committed scope, so the write carries expected_work_package_version."
    roles: [ConstructionManager]
    code: 201
    input: [work_package_id, awarded_bid_id, subcontractor_name, contract_amount, performance_start, performance_end, bond_required, expected_work_package_version, "bond_amount?"]
    output: Subcontract
    side_effects:
      - "contract_status := ACTIVE; bond_claim_status := NONE when bond_required is true, otherwise NOT_APPLICABLE"
      - "paid_to_date := 0.00, unpaid_committed_amount := contract_amount, replacement_cost_amount := 0.00, cure_count := 0"
      - "WorkPackage.committed_amount is recomputed per calculations.default_replacement_exposure's committed_amount clause"
      - "increments WorkPackage.version by 1"

  - method: POST
    path: "/subcontracts/{id}/progress-payment"
    description: "Applies a monthly progress payment against the subcontract, reducing the unpaid committed exposure that a default would have to replace."
    roles: [ConstructionManager]
    code: 200
    input: [payment_amount]
    output: Subcontract
    side_effects:
      - "paid_to_date += payment_amount; unpaid_committed_amount := contract_amount - paid_to_date"
      - "increments Subcontract.version by 1"

  - method: POST
    path: "/subcontracts/{id}/status-action"
    description: "Drives the contract-performance axis. action NOTICE_DEFAULT, CURE, TERMINATE_FOR_DEFAULT or COMPLETE. TERMINATE_FOR_DEFAULT is the head of the five-level default cascade."
    roles: [ConstructionManager]
    code: 200
    input: [action, "default_reason?", "cure_note?"]
    output: Subcontract
    side_effects:
      - "on NOTICE_DEFAULT: contract_status := DEFAULT_NOTICED, default_notice_at := logical clock"
      - "on CURE: contract_status := ACTIVE, cure_count += 1, default_notice_at := null"
      - "on COMPLETE: contract_status := COMPLETED"
      - "on TERMINATE_FOR_DEFAULT: contract_status := TERMINATED_FOR_DEFAULT and calculations.default_replacement_exposure runs, freezing unpaid_committed_amount and writing replacement_cost_amount"
      - "on TERMINATE_FOR_DEFAULT: the WorkPackage moves AWARDED -> REPROCUREMENT, its replacement_reserve_amount and awarded_amount and committed_amount are rewritten, and both buyout variants are recomputed"
      - "on TERMINATE_FOR_DEFAULT: a CONSTRUCTION ContingencyDraw with origin SUBCONTRACTOR_DEFAULT_PREMIUM is minted at status POSTED for the replacement premium, moving construction_contingency_remaining and contingency_drawn_to_cost_total"
      - "on TERMINATE_FOR_DEFAULT: calculations.contingency_posture_derivation runs, and if the posture lands on CONSTRAINED every CostReport of the project whose status is OPEN moves to RECONCILIATION_HELD"
      - "increments Subcontract.version by 1, WorkPackage.version by 1 and CmarProject.version by 1"

  - method: POST
    path: "/subcontracts/{id}/bond-claim"
    description: "Drives the surety axis independently of the contract axis. action FILE (ConstructionManager) or ACKNOWLEDGE / SETTLE / DENY (OwnerRepresentative). SETTLE runs calculations.bond_recovery_credit."
    roles: [ConstructionManager, OwnerRepresentative]
    code: 200
    input: [action, "claim_amount?", "recovered_amount?", "denial_reason?"]
    output: Subcontract
    side_effects:
      - "on FILE: bond_claim_status := FILED, bond_claim_amount := payload.claim_amount"
      - "on ACKNOWLEDGE: bond_claim_status := ACKNOWLEDGED"
      - "on DENY: bond_claim_status := DENIED, bond_recovered_amount := 0.00"
      - "on SETTLE: bond_claim_status := SETTLED and calculations.bond_recovery_credit runs, crediting construction_contingency_remaining, debiting contingency_drawn_to_cost_total and re-deriving contingency_posture"
      - "contract_status is never touched by this endpoint"
      - "increments Subcontract.version by 1; on SETTLE also increments CmarProject.version by 1"

  - method: GET
    path: "/subcontracts"
    description: "Lists subcontracts, filterable by package and by the bid they were written from."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["work_package_id?", "awarded_bid_id?", "contract_status?", "bond_claim_status?", "limit?", "offset?"]
    output: Subcontract[]
    side_effects: []

  - method: GET
    path: "/subcontracts/{id}"
    description: "Reads one subcontract including both independent state axes and its default-exposure figures."
    roles: [ConstructionManager, ProcurementOfficer, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: Subcontract
    side_effects: []

  # ---------------- ChangeEvent ----------------
  - method: POST
    path: "/change-events"
    description: "Logs a change event against an executed guaranteed maximum price. origin declares what gave rise to it; classification is deliberately absent at creation because who bears the cost is the reviewed determination."
    roles: [ConstructionManager]
    code: 201
    input: [project_id, description, estimated_amount, origin, "qualification_item_id?", "source_subcontract_id?"]
    output: ChangeEvent
    side_effects:
      - "status := DRAFT, classification := null, revision_count := 0"

  - method: POST
    path: "/change-events/{id}/submit"
    description: "Submits (or resubmits after a revision request) the change event for owner review. submitted_by_user_id is overwritten from X-User-ID on every submission and anchors the classification segregation-of-duties rule."
    roles: [ConstructionManager]
    code: 200
    input: ["submit_note?"]
    output: ChangeEvent
    side_effects:
      - "status := SUBMITTED, submitted_by_user_id := X-User-ID"
      - "increments ChangeEvent.version by 1"

  - method: POST
    path: "/change-events/{id}/review"
    description: "Owner review actions that do not decide cost responsibility: BEGIN_REVIEW, REQUEST_REVISION, REJECT."
    roles: [OwnerRepresentative]
    code: 200
    input: [action, "review_note?"]
    output: ChangeEvent
    side_effects:
      - "on BEGIN_REVIEW: status := UNDER_REVIEW, review_note := payload.review_note"
      - "on REQUEST_REVISION: status := REVISION_REQUESTED, revision_count += 1"
      - "on REJECT: status := REJECTED with no downstream row minted"
      - "increments ChangeEvent.version by 1"

  - method: POST
    path: "/change-events/{id}/classify"
    description: "The cost-responsibility fork. classification SCOPE_CHANGE mints an AMENDMENT GmpProposal and moves the proposed guaranteed maximum price; CONTINGENCY_USE_OWNER and CONTINGENCY_USE_CONSTRUCTION mint a ContingencyDraw against the matching pot and leave the guaranteed price untouched. The classifier must not be the operator that submitted the event."
    roles: [OwnerRepresentative, ConstructionManager]
    code: 200
    input: [classification, "classification_note?"]
    output: ChangeEvent
    side_effects:
      - "status := CLASSIFIED, classification := payload.classification, classified_by_user_id := X-User-ID, classified_at := logical clock"
      - "on SCOPE_CHANGE: an AMENDMENT GmpProposal is minted (status DRAFT, change_event_id := this event, amount_delta := estimated_amount, gmp_amount := project.gmp_amount + amount_delta); calculations.proposed_gmp_rollup runs; every RECONCILED ProgressiveEstimate of the project gets reconciliation_stale := true"
      - "on CONTINGENCY_USE_OWNER: a ContingencyDraw is minted at status REQUESTED with contingency_type OWNER, origin CHANGE_EVENT_CLASSIFICATION, amount := estimated_amount, requires_owner_approval := true"
      - "on CONTINGENCY_USE_CONSTRUCTION: a ContingencyDraw is minted at status REQUESTED with contingency_type CONSTRUCTION, origin CHANGE_EVENT_CLASSIFICATION, amount := estimated_amount, requires_owner_approval per calculations.draw_approval_requirement"
      - "increments ChangeEvent.version by 1 and CmarProject.version by 1"

  - method: GET
    path: "/change-events"
    description: "Lists change events, filterable by project, by the qualification item they arise from and by the defaulted subcontract they arise from."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "qualification_item_id?", "source_subcontract_id?", "status?", "classification?", "origin?", "limit?", "offset?"]
    output: ChangeEvent[]
    side_effects: []

  - method: GET
    path: "/change-events/{id}"
    description: "Reads one change event including its classification and the operator identities behind the segregation-of-duties rule."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: ChangeEvent
    side_effects: []

  # ---------------- ContingencyDraw ----------------
  - method: POST
    path: "/contingency-draws/{id}/approve"
    description: "The owner approves (approve true) or denies (approve false) a requested draw. There is no creation endpoint for a draw: every ContingencyDraw is minted by a cascade, and GET /contingency-draws is its only discovery channel."
    roles: [OwnerRepresentative]
    code: 200
    input: [approve, "approval_note?"]
    output: ContingencyDraw
    side_effects:
      - "on approve true: status := OWNER_APPROVED, approved_by_user_id := X-User-ID"
      - "on approve false: status := DENIED with no contingency movement"
      - "increments ContingencyDraw.version by 1"

  - method: POST
    path: "/contingency-draws/{id}/post"
    description: "Posts the draw to the contingency ledger. Permitted from REQUESTED only when requires_owner_approval is false, otherwise from OWNER_APPROVED. Rejected outright while the posture is FROZEN, and rejected on insufficient pot balance."
    roles: [ConstructionManager]
    code: 200
    input: ["post_note?"]
    output: ContingencyDraw
    side_effects:
      - "status := POSTED, posted_at := logical clock"
      - "the draw's pot *_remaining decreases by amount; CmarProject.contingency_drawn_to_cost_total increases by amount; gmp_amount does not move"
      - "calculations.contingency_posture_derivation runs; a move to CONSTRAINED holds every OPEN CostReport of the project at RECONCILIATION_HELD"
      - "increments ContingencyDraw.version by 1 and CmarProject.version by 1"

  - method: POST
    path: "/contingency-draws/{id}/void"
    description: "Compensating action: reverses a posted draw exactly, restoring both the pot balance and the drawn-to-cost total to their pre-post values. Held cost reports are not automatically released."
    roles: [OwnerRepresentative]
    code: 200
    input: [void_reason]
    output: ContingencyDraw
    side_effects:
      - "status := VOIDED, voided_at := logical clock, void_reason := payload.void_reason"
      - "the draw's pot *_remaining increases by amount; CmarProject.contingency_drawn_to_cost_total decreases by amount"
      - "calculations.contingency_posture_derivation runs and may move CONSTRAINED -> OPEN; CostReport rows stay at RECONCILIATION_HELD until released explicitly"
      - "increments ContingencyDraw.version by 1 and CmarProject.version by 1"

  - method: GET
    path: "/contingency-draws"
    description: "Lists contingency draws, filterable by project, by the classified change event that produced them and by the defaulted subcontract that produced them. This is the only discovery channel for cascade-minted draws."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "change_event_id?", "source_subcontract_id?", "contingency_type?", "origin?", "status?", "limit?", "offset?"]
    output: ContingencyDraw[]
    side_effects: []

  - method: GET
    path: "/contingency-draws/{id}"
    description: "Reads one contingency draw including its approval requirement flag and ledger timestamps."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: ContingencyDraw
    side_effects: []

  # ---------------- CostReport ----------------
  - method: POST
    path: "/cost-reports"
    description: "Opens a monthly cost report over the half-open period [period_start, period_end). Periods of the same project may abut but may never overlap."
    roles: [ConstructionManager]
    code: 201
    input: [project_id, period_start, period_end]
    output: CostReport
    side_effects:
      - "status := OPEN, lines := [], line_count := 0, and all three cost totals := 0.00"

  - method: POST
    path: "/cost-reports/{id}/lines"
    description: "Appends an open-book cost line. The extended amount is rounded to 2 decimal places per line before it enters any subtotal, per calculations.cost_report_line_reconciliation. Lines are append-only; there is no line deletion."
    roles: [ConstructionManager]
    code: 201
    input: [cost_code, quantity, unit_rate, markup_pct, "work_package_id?", "qualification_item_id?", "disputed?"]
    output: CostReport
    side_effects:
      - "a line object is appended with line_seq := line_count + 1 and line_amount := round(quantity * unit_rate * (1 + markup_pct), 2)"
      - "line_count, reported_cost_total, undisputed_cost_total and disputed_cost_total are all recomputed from the rounded line amounts"
      - "increments CostReport.version by 1"

  - method: POST
    path: "/cost-reports/{id}/reconcile"
    description: "The owner reconciles (decision RECONCILE) or disputes (decision DISPUTE) the monthly report. Either decision snapshots the project's TRADE_LEVEL buyout savings onto the report."
    roles: [OwnerRepresentative]
    code: 200
    input: [decision, "reconciliation_note?"]
    output: CostReport
    side_effects:
      - "on RECONCILE: status := RECONCILED, reconciled_at := logical clock"
      - "on DISPUTE: status := DISPUTED"
      - "buyout_savings_to_date := CmarProject.buyout_savings_trade_level"
      - "reconciliation_note := payload.reconciliation_note"
      - "increments CostReport.version by 1"

  - method: POST
    path: "/cost-reports/{id}/release-hold"
    description: "Releases a report that the contingency-posture cascade pushed to RECONCILIATION_HELD. Permitted only once the project's contingency_posture has recovered to OPEN."
    roles: [OwnerRepresentative]
    code: 200
    input: ["release_note?"]
    output: CostReport
    side_effects:
      - "status := OPEN, held_reason := null"
      - "increments CostReport.version by 1"

  - method: GET
    path: "/cost-reports"
    description: "Lists monthly cost reports, filterable by project."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: CostReport[]
    side_effects: []

  - method: GET
    path: "/cost-reports/{id}"
    description: "Reads one monthly cost report including its embedded lines array and all three rounded subtotals."
    roles: [ConstructionManager, OwnerRepresentative, IndependentAuditor, ProgramAdmin]
    code: 200
    input: []
    output: CostReport
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles, or the role is listed but does not own the specific action requested on one of the two role-partitioned shared endpoints (validation priority 21)"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, malformed ISO 8601 instant, negative or over-precise money (2dp) / unit rate (4dp) / ratio (4dp), interval whose start is not strictly before its end, or a conditionally-required field absent when its condition holds"
  # --- existence ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "a CmarProject id in the path or in a request body does not resolve"
  - id: ERR_WORK_PACKAGE_NOT_FOUND
    http: 404
    condition: "a WorkPackage id in the path or in a request body does not resolve"
  - id: ERR_SUBCONTRACT_NOT_FOUND
    http: 404
    condition: "a Subcontract id in the path does not resolve"
  - id: ERR_CHANGE_EVENT_NOT_FOUND
    http: 404
    condition: "a ChangeEvent id in the path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "any other referenced id (ProgressiveEstimate, GmpProposal, QualificationItem, SelfPerformBid, ContingencyDraw, CostReport) does not resolve, whether in the path or in the body"
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current CmarProject.version on POST /estimates or POST /gmp-proposals"
  - id: ERR_STALE_WORK_PACKAGE_VERSION
    http: 412
    condition: "expected_work_package_version does not equal the current WorkPackage.version on POST /subcontracts"
  # --- state ---
  - id: ERR_GMP_NOT_EXECUTED
    http: 409
    condition: "an operation that only exists under an executed guaranteed maximum price was attempted while gmp_status is PRECONSTRUCTION, GMP_UNDER_REVIEW or CLOSED"
  - id: ERR_GMP_ALREADY_EXECUTED
    http: 409
    condition: "a BASE proposal was created or executed on a project whose gmp_status is already EXECUTED or CLOSED"
  - id: ERR_ESTIMATE_STATE_INVALID
    http: 409
    condition: "the ProgressiveEstimate is not in a status that permits the requested action, or a proposal's based_on_estimate_id names an estimate whose status is not RECONCILED"
  - id: ERR_PROPOSAL_STATE_INVALID
    http: 409
    condition: "the GmpProposal is not in a status that permits the requested action, including adding a qualification item to a proposal that is no longer editable"
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "the WorkPackage's procurement_status or transparency_status does not permit the requested action, including a transparency step that skips or regresses"
  - id: ERR_BID_STATE_INVALID
    http: 409
    condition: "the SelfPerformBid is not SEALED when opened, or an award or subcontract names a bid that is not OPENED"
  - id: ERR_BOND_CLAIM_STATE_INVALID
    http: 409
    condition: "the requested bond-claim action is not permitted from the current bond_claim_status, including any action on a NOT_APPLICABLE axis"
  - id: ERR_SUBCONTRACT_STATE_INVALID
    http: 409
    condition: "the requested contract action is not permitted from the current contract_status, including a progress payment against a terminated or completed subcontract"
  - id: ERR_CHANGE_EVENT_STATE_INVALID
    http: 409
    condition: "the requested submit, review or classify action is not permitted from the current ChangeEvent.status"
  - id: ERR_DRAW_STATE_INVALID
    http: 409
    condition: "the requested approve, post or void action is not permitted from the current ContingencyDraw.status"
  - id: ERR_COST_REPORT_STATE_INVALID
    http: 409
    condition: "the requested line append, reconcile or release-hold action is not permitted from the current CostReport.status"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "the requested audit action is not permitted from the current audit_status"
  - id: ERR_CLOSEOUT_ALREADY_SETTLED
    http: 409
    condition: "an operation that would move money inside the guaranteed maximum price was attempted after closeout_status reached SETTLEMENT_EXECUTED"
  - id: ERR_CONTINGENCY_FROZEN
    http: 409
    condition: "a contingency draw post or void was attempted while contingency_posture is FROZEN"
  - id: ERR_POSTURE_NOT_RECOVERED
    http: 409
    condition: "a held cost report's release was attempted while the project's contingency_posture is still CONSTRAINED or FROZEN"
  # --- business: safety and compliance ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same operator that prepared the bid being opened, or the same operator that most recently submitted the change event being classified"
  - id: ERR_OPEN_BOOK_DISCLOSURE_REQUIRED
    http: 422
    condition: "a CM_SELF_PERFORM bid was opened while its WorkPackage.transparency_status is still SEALED"
  - id: ERR_OPEN_BOOK_BREAKDOWN_MISMATCH
    http: 422
    condition: "the five open_book_cost_breakdown components do not sum exactly to base_bid_amount"
  # --- business: referential integrity ---
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 422
    condition: "a referenced row belongs to a different CmarProject than the row being written"
  - id: ERR_WORK_PACKAGE_PROJECT_MISMATCH
    http: 422
    condition: "a bid referenced by an award or a subcontract does not belong to the work package in question"
  - id: ERR_MILESTONE_RANK_REGRESSION
    http: 422
    condition: "a declared prior_estimate_id has a milestone_rank greater than or equal to the new estimate's milestone_rank"
  # --- business: temporal ---
  - id: ERR_SOLICITATION_STILL_OPEN
    http: 409
    condition: "a sealed bid was opened before the logical clock reached its WorkPackage.solicitation_closes_at"
  - id: ERR_COST_PERIOD_OVERLAP
    http: 409
    condition: "a new cost report's half-open period overlaps an existing cost report period of the same project; abutting periods are not an overlap"
  - id: ERR_PERFORMANCE_WINDOW_BUFFER_VIOLATION
    http: 409
    condition: "a new subcontract's closed performance window is separated from a blocking sibling window on the same package by less than MOBILIZATION_BUFFER_HOURS, overlap included"
  # --- business: constraint ---
  - id: ERR_VARIANCE_JUSTIFICATION_REQUIRED
    http: 422
    condition: "an estimate whose variance_pct strictly exceeds MILESTONE_VARIANCE_THRESHOLD_PCT was submitted without a justification_note"
  - id: ERR_ALLOWANCE_UNITS_EXCEEDED
    http: 422
    condition: "an allowance RECONCILE requested more units than QualificationItem.remaining_units"
  - id: ERR_ALLOWANCE_OVERRUN_UNAUTHORIZED
    http: 422
    condition: "an allowance RECONCILE whose actual_unit_cost exceeds allowance_unit_rate omitted overrun_authorized true"
  - id: ERR_ALLOWANCE_REVERSAL_INVALID
    http: 422
    condition: "a REVERSE action was requested on a QualificationItem whose last_action is not RECONCILE, or on a non-ALLOWANCE item"
  - id: ERR_NO_RECONCILED_COST_REPORT
    http: 422
    condition: "a shared-savings calculation or an audit request was made on a project with zero CostReport rows in status RECONCILED"
  - id: ERR_COST_REPORTS_NOT_RECONCILED
    http: 422
    condition: "basis POST_AUDIT_FINAL was requested while some CostReport of the project is OPEN, DISPUTED or RECONCILIATION_HELD"
  - id: ERR_AUDIT_NOT_CLOSED
    http: 422
    condition: "basis POST_AUDIT_FINAL was requested while audit_status is not CLOSED"
  # --- business: fiscal ---
  - id: ERR_OWNER_APPROVAL_REQUIRED
    http: 422
    condition: "a draw whose requires_owner_approval is true was posted directly from REQUESTED, or a draw was posted from REQUESTED while the posture is CONSTRAINED"
  - id: ERR_CONTINGENCY_INSUFFICIENT
    http: 422
    condition: "the draw amount exceeds the remaining balance of its contingency_type's pot"

# =====================================================================
# §1.7 RBAC Matrix  (segregation_of_duties)
# =====================================================================
roles:
  - name: ProgramAdmin
    description: "Owner-side program administrator. Registers CMAR projects and controls the logical clock. Has no authority over pricing, procurement or the contingency ledger."
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET read across all ten collections"

  - name: ConstructionManager
    description: "The construction manager at risk. Produces progressive estimates and guaranteed-maximum-price proposals with their qualification log, buys out trade packages, submits sealed bids, writes subcontracts, administers defaults and bond claims, logs change events, posts contingency draws and files monthly cost reports."
    identity: opaque
    exclusive_operations:
      - "POST /estimates"
      - "POST /estimates/{id}/submit"
      - "POST /gmp-proposals"
      - "POST /gmp-proposals/{id}/submit"
      - "POST /qualification-items"
      - "POST /qualification-items/{id}/allowance-reconciliation"
      - "POST /work-packages"
      - "POST /work-packages/{id}/solicit"
      - "POST /self-perform-bids"
      - "POST /subcontracts"
      - "POST /subcontracts/{id}/progress-payment"
      - "POST /subcontracts/{id}/status-action"
      - "POST /contingency-draws/{id}/post"
      - "POST /cost-reports"
      - "POST /cost-reports/{id}/lines"
    shared_operations:
      - "POST /change-events (creation is CM-only in practice but the classify fork is shared)"
      - "POST /change-events/{id}/submit"
      - "POST /change-events/{id}/classify (shared with OwnerRepresentative)"
      - "POST /subcontracts/{id}/bond-claim with action FILE (shared endpoint with OwnerRepresentative, which owns the remaining actions)"
      - "every GET read across all ten collections"

  - name: ProcurementOfficer
    description: "Independent procurement officer. Holds the sealed-bid opening and award authority, and publishes open-book breakdowns to the owner. Deliberately separated from the ConstructionManager so the CM cannot open the bids it competes against - and separated from the OwnerRepresentative so procurement is not the same hand that approves contingency."
    identity: opaque
    exclusive_operations:
      - "POST /self-perform-bids/{id}/open"
      - "POST /work-packages/{id}/award"
    shared_operations:
      - "POST /work-packages/{id}/transparency with target_status DISCLOSED (shared endpoint with IndependentAuditor, which owns target_status AUDITED)"
      - "GET reads on projects, work-packages, self-perform-bids and subcontracts"

  - name: OwnerRepresentative
    description: "The owner's contract administrator. Reconciles design-milestone estimates, decides guaranteed-maximum-price proposals and amendments, reviews and classifies change events, approves and voids contingency draws, reconciles monthly cost reports, exercises audit rights and settles shared savings."
    identity: opaque
    exclusive_operations:
      - "POST /estimates/{id}/reconcile"
      - "POST /gmp-proposals/{id}/decide"
      - "POST /change-events/{id}/review"
      - "POST /contingency-draws/{id}/approve"
      - "POST /contingency-draws/{id}/void"
      - "POST /cost-reports/{id}/reconcile"
      - "POST /cost-reports/{id}/release-hold"
      - "POST /projects/{id}/audit-request"
      - "POST /projects/{id}/shared-savings"
    shared_operations:
      - "POST /change-events/{id}/classify (shared with ConstructionManager)"
      - "POST /subcontracts/{id}/bond-claim with actions ACKNOWLEDGE, SETTLE and DENY (shared endpoint with ConstructionManager, which owns action FILE)"
      - "every GET read across all ten collections"

  - name: IndependentAuditor
    description: "Third-party auditor engaged under the owner's audit rights. Posts signed cost adjustments, certifies open-book breakdowns and closes the engagement. Cannot itself settle the shared savings it audits."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/audit-actions"
    shared_operations:
      - "POST /work-packages/{id}/transparency with target_status AUDITED (shared endpoint with ProcurementOfficer, which owns target_status DISCLOSED)"
      - "every GET read across all ten collections"

segregation_of_duties_rules:
  - name: bid-opener-is-not-bid-preparer
    check: "on POST /self-perform-bids/{id}/open, X-User-ID must not equal SelfPerformBid.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    note: "the ProcurementOfficer role gate alone is insufficient: a single operator id could hold both roles, so the check is on the identifier, not the role"
  - name: classifier-is-not-submitter
    check: "on POST /change-events/{id}/classify, X-User-ID must not equal ChangeEvent.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    note: "classify is shared between ConstructionManager and OwnerRepresentative precisely so either side may make the determination - but never the operator that asked for it"
