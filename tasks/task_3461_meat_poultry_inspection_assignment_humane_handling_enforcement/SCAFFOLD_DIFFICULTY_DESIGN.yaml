# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3461 meat & poultry inspection — 9 rules, 19 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_gap_provisional_vs_final_divergence
        grounds:
          - calculations.shift_coverage_gap
          - state_machines.ShiftWindow.PLANNED_to_COVERAGE_GAP_FLAGGED
          - endpoints.POST_/inspection/shift-windows/{id}/verify-coverage
        distinguishing_aspect: "Dual variant on the ShiftWindow domain: identical assignment rows yield provisional_gap_minutes == 0 (SCHEDULED counts) but final_gap_minutes == 480 (only CONFIRMED counts); the sibling instance computes risk on the Establishment domain instead."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted (GRANTED x ACTIVE), one CATTLE-qualified inspector, one SLAUGHTER window 2026-09-02 06:00-14:00 (480 minutes, 1 line), one SCHEDULED-but-never-confirmed assignment covering the whole window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D1 Beef Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-1001", species_qualifications: ["CATTLE", "SWINE", "POULTRY", "SHEEP"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/shift-windows"
              payload: { establishment_id: "${est_id}", start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T14:00:00Z", shift_type: "SLAUGHTER", planned_line_count: 1 }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { sw_id: $.data.id, sw_v: $.data.version }
            - call: "POST /inspection/shift-windows/${sw_id}/assignments"
              payload: { inspector_id: "${insp_id}", line_index: 1, start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T14:00:00Z", expected_shift_window_version: "${sw_v}" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /inspection/shift-windows/${sw_id}/verify-coverage"
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "the response status is 200"
            - "ShiftWindow.${sw_id}.provisional_gap_minutes == 0"
            - "ShiftWindow.${sw_id}.final_gap_minutes == 480"
            - "ShiftWindow.${sw_id}.status == COVERAGE_GAP_FLAGGED"
            - "GET /inspection/noncompliance-records?establishment_id=${est_id} returns exactly 1 row with regulation_family == \"OTHER\" and status == \"OPEN\""

      - name: risk_score_rolling_vs_lifetime_divergence
        grounds:
          - calculations.establishment_risk_score
          - entities.Establishment.fields.rolling_risk_score
          - entities.Establishment.fields.lifetime_risk_score
        distinguishing_aspect: "Dual variant on the Establishment domain: the same two NR rows give rolling_risk_score == 9 (90-day window + recency bands) but lifetime_risk_score == 8 (unwindowed, unweighted); the sibling instance computes coverage on the ShiftWindow domain instead."
        test_recipe:
          setup:
            - "Establishment granted. NR1 (HUMANE, weight 5) issued with the clock at 2026-09-01; NR2 (HACCP, weight 3) issued with the clock at 2026-12-10; read performed with the clock at 2026-12-15, so NR1 is 105 days old (outside the 90-day window) and NR2 is 5 days old (recency factor 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D2 Pork Plant", species_classes: ["SWINE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-2001", species_qualifications: ["SWINE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "HUMANE", description: "stunning pen gate drag", observed_at: "2026-08-30T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { nr1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "HACCP", description: "ccp monitoring lapse", observed_at: "2026-12-09T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { nr2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
          assert:
            - "Establishment.${est_id}.rolling_risk_score == 9"
            - "Establishment.${est_id}.lifetime_risk_score == 8"
            - "Establishment.${est_id}.rolling_risk_score != Establishment.${est_id}.lifetime_risk_score"
            - "Establishment.${est_id}.open_nr_count == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pathogen_categorization_tiered_thresholds
        grounds:
          - calculations.pathogen_categorization
          - state_machines.PathogenSample.PENDING_to_NEGATIVE
          - state_machines.PathogenSample.PENDING_to_POSITIVE
        distinguishing_aspect: "Mode (a) combinatorial: 4 inputs (positive_count, resulted_count, MIN_SAMPLES, STANDARD_RATE) with nested branches — insufficient data leaves category null, then tiered CAT selection fires once the 10th result lands."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted. Inspector collects 10 SALMONELLA samples; 9 results are recorded (1 POSITIVE + 8 NEGATIVE) which is below MIN_SAMPLES_FOR_CATEGORIZATION=10, so category is still null."
