            - "GET cycle after fam-3 accept: aid_committed_cents == 7220000 and pacing_cap_cents == 7220000"
            - "fam-4 accept is rejected: captured error_id == ERR_AID_PACING_CAP_EXCEEDED (HTTP 402); committed stays 7220000"

      - name: test_session_capacity_exact_then_full
        grounds:
          - errors[ERR_TEST_SESSION_FULL]
          - entities.TestSession.fields.booked_count
          - validations[priority=6]
        distinguishing_aspect: |
          Count-metric boundary on evaluation creation (distinct metric and endpoint
          from the money boundary instance): the 2nd booking into a room_capacity 2
          session succeeds (booked == capacity is the last legal state), the 3rd is
          rejected with ERR_TEST_SESSION_FULL.
        test_recipe:
          setup:
