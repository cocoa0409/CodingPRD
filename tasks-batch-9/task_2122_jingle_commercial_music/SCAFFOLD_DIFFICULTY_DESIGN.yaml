          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Project budget_cents 4000000 in IN_PRODUCTION"
            - "StudioRoom 'Room A' ACTIVE holding one SessionCall 2026-09-10T09:00Z-13:00Z in SCHEDULED"
