  - { method: GET, path: "/mro/customers/{customerId}", description: "Get customer (exposure, credit_hold)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Part catalog & directives ---
  - { method: POST, path: "/mro/part-catalog", description: "Create catalog part", roles: [ShopManager], code: 201, input: [part_number, ata_chapter, is_rotable, cmm_reference, replacement_value_cents, "ber_threshold_pct?", warranty_cycle_limit, warranty_month_limit, flat_overhaul_price_cents], output: PartCatalogEntry, side_effects: [] }
  - { method: GET, path: "/mro/part-catalog/{partId}", description: "Get catalog part", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: PartCatalogEntry, side_effects: [] }
  - { method: POST, path: "/mro/part-catalog/{id}/directives", description: "Register AD/SB against a part", roles: [ShopManager], code: 201, input: [directive_type, directive_number, mandatory, description], output: DirectiveRecord, side_effects: [] }
  - { method: GET, path: "/mro/part-catalog/{id}/directives", description: "List directives for part (reverse of DirectiveRecord.part_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "DirectiveRecord[]", side_effects: [] }
  - { method: GET, path: "/mro/part-catalog/{id}/units", description: "List units of part (reverse of ComponentUnit.part_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "ComponentUnit[]", side_effects: [] }

  # --- Component units ---
  - { method: POST, path: "/mro/units", description: "Register serialized unit (birth record). CUSTOMER ownership requires owner_customer_id and custody OFF_SITE; SHOP ownership requires custody IN_POOL or IN_SHOP and no owner", roles: [CustomerServiceRep], code: 201, input: [part_id, serial_number, ownership, "owner_customer_id?", condition_status, custody_status, total_cycles, cycles_since_overhaul, manufactured_at], output: ComponentUnit, side_effects: ["TraceabilityRecord BIRTH appended", "ERR_INVALID_REQUEST on ownership/custody combination violations", "ERR_DUPLICATE_SERIAL on serial reuse"] }
  - { method: GET, path: "/mro/units/{unitId}", description: "Get unit (both parallel status dimensions, version)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: ComponentUnit, side_effects: [] }
  - { method: GET, path: "/mro/units", description: "Filtered unit list (reverse of owner_customer_id; pool queries)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: ["part_id?", "owner_customer_id?", "ownership?", "custody_status?", "condition_status?", "limit?", "offset?"], output: "ComponentUnit[]", side_effects: [] }
  - { method: GET, path: "/mro/customers/{id}/units", description: "List units owned by customer", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "ComponentUnit[]", side_effects: [] }
  - { method: GET, path: "/mro/units/{id}/traceability", description: "Back-to-birth event list (reverse of TraceabilityRecord.unit_id), chronological ascending by event_at then created_at", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "TraceabilityRecord[]", side_effects: [] }

  # --- Work orders ---
  - { method: POST, path: "/mro/work-orders", description: "Induct unit: create work order", roles: [CustomerServiceRep], code: 201, input: [customer_id, unit_id, work_scope], output: WorkOrder, side_effects: ["status=TEARDOWN_IN_PROGRESS; received_at=clock; unit custody OFF_SITE->IN_SHOP; TraceabilityRecord INDUCT; DirectiveCompliance PENDING created for each DirectiveRecord of the unit's part; ERR_UNIT_OWNER_MISMATCH; ERR_UNIT_NOT_AVAILABLE unless custody OFF_SITE"] }
  - { method: GET, path: "/mro/work-orders/{workOrderId}", description: "Get work order", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/mro/customers/{id}/work-orders", description: "List customer work orders (reverse of customer_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/mro/units/{id}/work-orders", description: "List unit work orders (reverse of unit_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/teardown-complete", description: "Finish teardown", roles: [Technician], code: 200, input: [], output: WorkOrder, side_effects: ["TEARDOWN_IN_PROGRESS->AWAITING_QUOTE"] }
  - { method: POST, path: "/mro/work-orders/{id}/discrepancies", description: "File discrepancy card", roles: [Technician], code: 201, input: [finding_text, severity], output: DiscrepancyCard, side_effects: ["card OPEN; WorkOrder.open_discrepancy_count += 1"] }
  - { method: GET, path: "/mro/work-orders/{id}/discrepancies", description: "List cards (reverse of work_order_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "DiscrepancyCard[]", side_effects: [] }
  - { method: POST, path: "/mro/discrepancies/{discrepancyId}/disposition", description: "Disposition an OPEN card", roles: [Technician], code: 200, input: [disposition_text], output: DiscrepancyCard, side_effects: ["OPEN->DISPOSITIONED; WorkOrder.open_discrepancy_count -= 1"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/quote", description: "Submit or supersede quote (AWAITING_QUOTE or QUOTE_SUBMITTED)", roles: [CustomerServiceRep], code: 200, input: [labor_estimate_cents, parts_estimate_cents, "scrap_option_ack?"], output: WorkOrder, side_effects: ["ber_flag recomputed; quote_submitted_at=clock; promised_return_at computed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/quote-approval", description: "Customer approves quote (OCC)", roles: [Customer], code: 200, input: [expected_work_order_version], output: WorkOrder, side_effects: ["QUOTE_SUBMITTED->REPAIR_IN_PROGRESS; accumulated_delay_hours += clock-quote_submitted_at; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/quote-decline", description: "Customer declines quote: disposition RETURN_UNREPAIRED | SCRAP", roles: [Customer], code: 200, input: [disposition], output: WorkOrder, side_effects: ["-> CANCELLED or BER_SCRAPPED with scrap cascade (unit SCRAPPED + trace)"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/complete-repair", description: "Repair complete; request test", roles: [Technician], code: 200, input: [], output: WorkOrder, side_effects: ["REPAIR_IN_PROGRESS->READY_FOR_TEST; cards DISPOSITIONED->CLOSED; technician_user_id=X-User-ID; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/test-results", description: "Record ATP result (pass/fail)", roles: [Inspector], code: 200, input: [result, atp_reference], output: WorkOrder, side_effects: ["PASS->TEST_PASSED / FAIL->REPAIR_IN_PROGRESS (+OPEN ATP-FAILURE card, open_discrepancy_count += 1); covering booking COMPLETED; test_attempt_count += 1; cycle reset on OVERHAUL/WARRANTY_REWORK pass"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/release", description: "Issue 8130 release certificate", roles: [Inspector], code: 200, input: [], output: WorkOrder, side_effects: ["TEST_PASSED->RELEASED; ReleaseCertificate ISSUED; unit SERVICEABLE + AWAITING_SHIPMENT (or IN_POOL when SHOP-owned); trace RELEASE_*; released_at=clock; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/mro/work-orders/{workOrderId}/close", description: "Close after shipment; requires work-order invoice", roles: [CustomerServiceRep], code: 200, input: [], output: WorkOrder, side_effects: ["RELEASED->CLOSED; unit custody SHIPPED (CUSTOMER); warranty claim ACCEPTED->SETTLED bubble-up on rework close"] }

  # --- Directive compliance ---
  - { method: POST, path: "/mro/work-orders/{workOrderId}/directive-compliance", description: "Record AD/SB compliance", roles: [Technician], code: 201, input: [directive_number, result, "note?"], output: DirectiveCompliance, side_effects: ["PENDING->COMPLIED | NOT_APPLICABLE"] }
  - { method: GET, path: "/mro/work-orders/{id}/directive-compliances", description: "List compliance records (reverse of work_order_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "DirectiveCompliance[]", side_effects: [] }

