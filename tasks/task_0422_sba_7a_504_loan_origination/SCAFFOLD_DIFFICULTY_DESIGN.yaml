          A DIFFERENT metric (cumulative disbursed vs requested) on the DISBURSEMENT POST
          endpoint: a second draw of exactly the remaining 20000000 (disbursed 30000000 +
          20000000 == requested 50000000) is allowed (<=), proving the boundary is inclusive,
          whereas 20000001 would trip ERR_OVER_DISBURSEMENT.
        test_recipe:
          setup:
            - "AUTHORIZED loan requested 50000000, first draw of 30000000 already POSTED (disbursed 30000000), window [0,30)."
            - "A second REQUESTED draw of exactly 20000000 with non-overlapping window [30,60)."
          setup_api_calls:
