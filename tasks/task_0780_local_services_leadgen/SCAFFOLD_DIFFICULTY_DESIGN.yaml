scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lead_charge_pay_per_lead_vs_subscription_divergence
        grounds:
          - calculations.lead_charge
          - entities.Lead.fields.charge_cents
          - entities.Lead.fields.credits_consumed
          - state_machines.ServiceRequest.OPEN_to_DISTRIBUTED
        distinguishing_aspect: "Identical gross price 5000: the pay-per-lead pro's lead lands charge_cents==5000 while the subscription pro's lead lands charge_cents==0 with credits_consumed==1 — same lead_charge calc, divergent result on the Lead billing domain."
        test_recipe:
          setup:
            - "Category HouseCleaning base 5000, max_leads 2, demand_high_threshold 5 (normal x1.0), min_rating 0.0."
            - "SubscriptionPlan PLUS included 8 overage 4000."
            - "Pro P1 PAY_PER_LEAD, VERIFIED, wallet 20000; Pro P2 SUBSCRIPTION, VERIFIED, subscribed (remaining 8). P1 created before P2."
            - "One OPEN request in the category; distribute twice so P1 gets lead1 and P2 gets lead2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "c1@x.com", full_name: "C One" }, as: PlatformAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "HouseCleaning", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 9900, included_lead_credits: 8, overage_price_cents: 4000 }, as: PlatformAdmin, captures: { plan: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "p1@x.com", business_name: "P1", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /pros/${p1}/submit-verification", payload: {}, as: Pro, as_user_id: "${p1}" }
            - { call: "POST /pros/${p1}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${p1}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /pros", payload: { email: "p2@x.com", business_name: "P2", billing_mode: "SUBSCRIPTION", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /pros/${p2}/submit-verification", payload: {}, as: Pro, as_user_id: "${p2}" }
            - { call: "POST /pros/${p2}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${p2}/subscribe", payload: { subscription_plan_id: "${plan}" }, as: Pro, as_user_id: "${p2}" }
            - { call: "POST /service-requests", payload: { customer_id: "${cust}", category_id: "${cat}", zip_code: "94016", description: "clean 2br", budget_cents: 15000 }, as: Customer, as_user_id: "${cust}", captures: { sr: "$.data.id", sr_v1: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v1}" }, as: PlatformAdmin, captures: { sr_v2: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v2}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${p1}" }, as: PlatformAdmin, captures: { lead1: "$.data[0].id" } }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${p2}" }, as: PlatformAdmin, captures: { lead2: "$.data[0].id" } }
          assert:
            - "Lead.${lead1}.charge_cents == 5000"
            - "Lead.${lead1}.credits_consumed == 0"
            - "Lead.${lead2}.charge_cents == 0"
            - "Lead.${lead2}.credits_consumed == 1"
            - "Pro.${p1}.credit_balance_cents == 15000"
            - "Pro.${p2}.remaining_lead_credits == 7"

      - name: pro_rating_published_vs_provisional_divergence
        grounds:
          - calculations.pro_rating
          - entities.Pro.fields.rating_avg
          - entities.Pro.fields.provisional_rating
          - state_machines.Review.PENDING_to_PUBLISHED
        distinguishing_aspect: "Same pro, one PUBLISHED review(5) and one PENDING review(1): rating_avg==5.00 over PUBLISHED-only while provisional_rating==3.00 over PENDING+PUBLISHED — divergent variant on the Pro reputation domain (different entity domain from lead_charge)."
        test_recipe:
          setup:
            - "Pro PR VERIFIED with two COMPLETED bookings from two customers; review A(rating 5) PUBLISHED, review B(rating 1) left PENDING."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "ca@x.com", full_name: "CA" }, as: PlatformAdmin, captures: { ca: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "cb@x.com", full_name: "CB" }, as: PlatformAdmin, captures: { cb: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Plumbing", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pr@x.com", business_name: "PR", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /pros/${pr}/submit-verification", payload: {}, as: Pro, as_user_id: "${pr}" }
            - { call: "POST /pros/${pr}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pr}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /availability-slots", payload: { pro_id: "${pr}", start_utc: "2026-03-05T08:00:00Z", end_utc: "2026-03-05T20:00:00Z" }, as: Pro, as_user_id: "${pr}", captures: { slotA: "$.data.id" } }
            - { call: "POST /availability-slots", payload: { pro_id: "${pr}", start_utc: "2026-03-06T08:00:00Z", end_utc: "2026-03-06T20:00:00Z" }, as: Pro, as_user_id: "${pr}", captures: { slotB: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${ca}", category_id: "${cat}", zip_code: "94016", description: "leak", budget_cents: 15000 }, as: Customer, as_user_id: "${ca}", captures: { srA: "$.data.id", srA_v: "$.data.version" } }
            - { call: "POST /service-requests/${srA}/distribute", payload: { expected_service_request_version: "${srA_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${srA}", pro_id: "${pr}" }, as: PlatformAdmin, captures: { leadA: "$.data[0].id" } }
            - { call: "POST /leads/${leadA}/contact", payload: {}, as: Pro, as_user_id: "${pr}" }
            - { call: "POST /quotes", payload: { lead_id: "${leadA}", amount_cents: 10000, message: "quote A" }, as: Pro, as_user_id: "${pr}", captures: { qA: "$.data.id" } }
            - { call: "POST /bookings", payload: { quote_id: "${qA}", availability_slot_id: "${slotA}", scheduled_start: "2026-03-05T10:00:00Z", scheduled_end: "2026-03-05T11:00:00Z" }, as: Customer, as_user_id: "${ca}", captures: { bkA: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bkA}/complete", payload: {}, as: Pro, as_user_id: "${pr}" }
            - { call: "POST /reviews", payload: { booking_id: "${bkA}", rating: 5, text: "great" }, as: Customer, as_user_id: "${ca}", captures: { revA: "$.data.id" } }
            - { call: "POST /reviews/${revA}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cb}", category_id: "${cat}", zip_code: "94016", description: "leak2", budget_cents: 15000 }, as: Customer, as_user_id: "${cb}", captures: { srB: "$.data.id", srB_v: "$.data.version" } }
            - { call: "POST /service-requests/${srB}/distribute", payload: { expected_service_request_version: "${srB_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${srB}", pro_id: "${pr}" }, as: PlatformAdmin, captures: { leadB: "$.data[0].id" } }
            - { call: "POST /leads/${leadB}/contact", payload: {}, as: Pro, as_user_id: "${pr}" }
            - { call: "POST /quotes", payload: { lead_id: "${leadB}", amount_cents: 10000, message: "quote B" }, as: Pro, as_user_id: "${pr}", captures: { qB: "$.data.id" } }
            - { call: "POST /bookings", payload: { quote_id: "${qB}", availability_slot_id: "${slotB}", scheduled_start: "2026-03-06T10:00:00Z", scheduled_end: "2026-03-06T11:00:00Z" }, as: Customer, as_user_id: "${cb}", captures: { bkB: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-06T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bkB}/complete", payload: {}, as: Pro, as_user_id: "${pr}" }
          trigger:
            - { call: "POST /reviews", payload: { booking_id: "${bkB}", rating: 1, text: "meh" }, as: Customer, as_user_id: "${cb}", captures: { revB: "$.data.id" } }
          assert:
            - "Review.${revB}.status == PENDING"
            - "Pro.${pr}.rating_avg == 5.00"
            - "Pro.${pr}.rating_count == 1"
            - "Pro.${pr}.provisional_rating == 3.00"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lead_charge_demand_threshold_nonlinear_mode_a
        grounds:
          - calculations.lead_charge
          - entities.ServiceCategory.fields.demand_high_threshold
          - entities.ServiceCategory.fields.demand_multiplier_high
          - state_machines.ServiceRequest.OPEN_to_DISTRIBUTED
        distinguishing_aspect: "Mode (a) non-linear: with base 5000 and demand_high_threshold 1, the first lead charges 5000 (open_leads 0) but the second lead charges 7500 (open_leads 1 >= threshold -> x1.5) — a >=3-input formula whose demand branch flips the result."
        test_recipe:
          setup:
            - "Category base 5000, demand_high_threshold 1, demand_multiplier_high 1.5, max_leads 2. Pro PC PAY_PER_LEAD VERIFIED wallet 30000. Two requests A,B in category."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "cc@x.com", full_name: "CC" }, as: PlatformAdmin, captures: { cc: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Electrician", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 1, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pc@x.com", business_name: "PC", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pc: "$.data.id" } }
            - { call: "POST /pros/${pc}/submit-verification", payload: {}, as: Pro, as_user_id: "${pc}" }
            - { call: "POST /pros/${pc}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pc}/credit-topup", payload: { amount_cents: 30000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cc}", category_id: "${cat}", zip_code: "94016", description: "reqA", budget_cents: 15000 }, as: Customer, as_user_id: "${cc}", captures: { srA: "$.data.id", srA_v: "$.data.version" } }
            - { call: "POST /service-requests/${srA}/distribute", payload: { expected_service_request_version: "${srA_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${srA}", pro_id: "${pc}" }, as: PlatformAdmin, captures: { leadA: "$.data[0].id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cc}", category_id: "${cat}", zip_code: "94016", description: "reqB", budget_cents: 15000 }, as: Customer, as_user_id: "${cc}", captures: { srB: "$.data.id", srB_v: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${srB}/distribute", payload: { expected_service_request_version: "${srB_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${srB}", pro_id: "${pc}" }, as: PlatformAdmin, captures: { leadB: "$.data[0].id" } }
          assert:
            - "Lead.${leadA}.charge_cents == 5000"
            - "Lead.${leadB}.charge_cents == 7500"
            - "Pro.${pc}.credit_balance_cents == 17500"

      - name: booking_payout_independent_fee_rounding_mode_b
        grounds:
          - calculations.booking_payout
          - entities.Booking.fields.payout_cents
          - state_machines.Booking.CONFIRMED_to_COMPLETED
        distinguishing_aspect: "Mode (b) rounding order: for price 10000, commission=round(1500.0)=1500 and processing=round(320.0)=320 are each rounded to whole cents BEFORE subtraction, giving payout_cents==8180 (order pinned; never round(amount*(0.15+0.029)+30))."
        test_recipe:
          setup:
            - "One COMPLETED booking with price_cents 10000 for a VERIFIED pro."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "cd@x.com", full_name: "CD" }, as: PlatformAdmin, captures: { cd: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Painting", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pd@x.com", business_name: "PD", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pd: "$.data.id" } }
            - { call: "POST /pros/${pd}/submit-verification", payload: {}, as: Pro, as_user_id: "${pd}" }
            - { call: "POST /pros/${pd}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pd}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /availability-slots", payload: { pro_id: "${pd}", start_utc: "2026-03-05T08:00:00Z", end_utc: "2026-03-05T20:00:00Z" }, as: Pro, as_user_id: "${pd}", captures: { slot: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cd}", category_id: "${cat}", zip_code: "94016", description: "paint", budget_cents: 15000 }, as: Customer, as_user_id: "${cd}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pd}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${pd}" }
            - { call: "POST /quotes", payload: { lead_id: "${lead}", amount_cents: 10000, message: "q" }, as: Pro, as_user_id: "${pd}", captures: { q: "$.data.id" } }
            - { call: "POST /bookings", payload: { quote_id: "${q}", availability_slot_id: "${slot}", scheduled_start: "2026-03-05T10:00:00Z", scheduled_end: "2026-03-05T11:00:00Z" }, as: Customer, as_user_id: "${cd}", captures: { bk: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookings/${bk}/complete", payload: {}, as: Pro, as_user_id: "${pd}", captures: { payout: "$.data.payout_cents" } }
          assert:
            - "Booking.${bk}.status == COMPLETED"
            - "Booking.${bk}.payout_cents == 8180"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_revision_sent
        grounds:
          - state_machines.Quote.SENT_to_REVISION_REQUESTED
          - state_machines.Quote.REVISION_REQUESTED_to_SENT
          - entities.Quote.fields.revision_count
        distinguishing_aspect: "Quote traverses SENT -> REVISION_REQUESTED -> SENT (cyclic negotiation loop on the Quote entity): after one round-trip status==SENT again and revision_count==1."
        test_recipe:
          setup:
            - "A SENT quote on a contacted lead for VERIFIED pro PE and customer CE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "ce@x.com", full_name: "CE" }, as: PlatformAdmin, captures: { ce: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Roofing", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pe@x.com", business_name: "PE", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pe: "$.data.id" } }
            - { call: "POST /pros/${pe}/submit-verification", payload: {}, as: Pro, as_user_id: "${pe}" }
            - { call: "POST /pros/${pe}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pe}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${ce}", category_id: "${cat}", zip_code: "94016", description: "roof", budget_cents: 15000 }, as: Customer, as_user_id: "${ce}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pe}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${pe}" }
            - { call: "POST /quotes", payload: { lead_id: "${lead}", amount_cents: 10000, message: "v1" }, as: Pro, as_user_id: "${pe}", captures: { q: "$.data.id" } }
          trigger:
            - { call: "POST /quotes/${q}/request-revision", payload: {}, as: Customer, as_user_id: "${ce}" }
            - { call: "POST /quotes/${q}/send", payload: { amount_cents: 9000 }, as: Pro, as_user_id: "${pe}" }
          assert:
            - "Quote.${q}.status == SENT"
            - "Quote.${q}.revision_count == 1"
            - "Quote.${q}.amount_cents == 9000"

      - name: lead_parallel_contact_and_billing_dimensions_evolve_independently
        grounds:
          - state_machines.Lead.DISTRIBUTED_to_CONTACTED
          - entities.Lead.fields.contact_status
          - entities.Lead.fields.billing_status
        distinguishing_aspect: "Lead carries two parallel state dimensions: after contact then dispute, contact_status==CONTACTED and billing_status==DISPUTED changed independently on the same Lead row (parallel machine, distinct entity from Quote)."
        test_recipe:
          setup:
            - "A distributed CHARGED lead for VERIFIED pro PF."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "cf@x.com", full_name: "CF" }, as: PlatformAdmin, captures: { cf: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Landscaping", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pf@x.com", business_name: "PF", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pf: "$.data.id" } }
            - { call: "POST /pros/${pf}/submit-verification", payload: {}, as: Pro, as_user_id: "${pf}" }
            - { call: "POST /pros/${pf}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pf}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cf}", category_id: "${cat}", zip_code: "94016", description: "lawn", budget_cents: 15000 }, as: Customer, as_user_id: "${cf}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pf}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
          trigger:
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${pf}" }
            - { call: "POST /disputes", payload: { lead_id: "${lead}", reason: "WRONG_NUMBER" }, as: Pro, as_user_id: "${pf}", captures: { disp: "$.data.id" } }
          assert:
            - "Lead.${lead}.contact_status == CONTACTED"
            - "Lead.${lead}.billing_status == DISPUTED"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cascade_quote_lead_sibling_request_slot_depth3
        grounds:
          - state_machines.Booking.initial_state
          - state_machines.Quote.SENT_to_ACCEPTED
          - state_machines.Lead.QUOTED_to_CONVERTED
          - state_machines.ServiceRequest.DISTRIBUTED_to_BOOKED
          - state_machines.AvailabilitySlot.OPEN_to_BOOKED
        distinguishing_aspect: "POST /bookings triggers a depth-3 chain: booking creation -> Quote SENT->ACCEPTED -> Lead1 QUOTED->CONVERTED -> (sibling Lead2 -> CLOSED AND ServiceRequest -> BOOKED AND slot -> BOOKED); each hop caused by the previous."
        test_recipe:
          setup:
            - "Category max_leads 2. Two VERIFIED pros PG1(first),PG2 both eligible. One request distributed twice (Lead1->PG1, Lead2->PG2). Lead1 contacted+quoted; PG1 has an OPEN slot."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "cg@x.com", full_name: "CG" }, as: PlatformAdmin, captures: { cg: "$.data.id" } }
