      - name: outbreak_resolve_restores_full_chain
        claim_type: side_effect_execution
        grounds:
          - state_machines.OutbreakZone.CONTAINED_to_RESOLVED
          - state_machines.Certificate.ENTRY_BLOCKED_to_TRANSMITTED
          - state_machines.MovementPermit.SUSPENDED_to_ISSUED
          - entities.Certificate.fields.pre_block_status
        distinguishing_aspect: |
          The resolve restore cascade is the exact inverse of escalation:
          premises QUARANTINE_HOLD -> MONITORED, certificate ENTRY_BLOCKED ->
          its saved pre_block_status (TRANSMITTED here, not ISSUED), permit
          SUSPENDED -> ISSUED; contain in between releases NOTHING.
