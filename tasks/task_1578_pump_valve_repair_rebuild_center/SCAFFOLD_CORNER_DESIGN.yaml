      - name: mark_obsolete_supersede_target_must_be_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPERSEDES_NOT_ACTIVE]", state_machines.Part.ACTIVE_to_OBSOLETE]
        distinguishing_aspect: "superseded_by_id pointing at an already-OBSOLETE part is rejected, keeping the supersession chain acyclic by construction."
        test_recipe:
          setup: ["P2 already OBSOLETE"]
          setup_api_calls:
            - { call: "POST /parts", payload: { part_number: "GSK-1", description: "Gasket v1", unit_price_cents: 900 }, as: ServiceManager, captures: { p1: $.data.id } }
