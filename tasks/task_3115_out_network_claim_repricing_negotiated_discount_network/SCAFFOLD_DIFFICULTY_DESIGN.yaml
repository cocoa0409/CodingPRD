              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "M1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-01T00:00:00Z", patient_responsibility_cents: 0, nsa_flag: true }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_m_id: $.data.id, claim_m_v: $.data.version }
            - call: "POST /claims/${claim_m_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_m_id}/reprice"
              payload: { expected_claim_version: "${claim_m_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
