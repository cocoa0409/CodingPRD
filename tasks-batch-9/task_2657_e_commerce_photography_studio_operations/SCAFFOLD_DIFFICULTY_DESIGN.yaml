      - name: return_exactly_at_due_instant_is_not_late_but_one_second_past_is_one_day
        grounds:
          - calculations.sample_return_lateness
          - entities.Sample.fields.due_return_at
          - entities.Sample.fields.return_days_late
          - entities.Vendor.fields.late_return_count
          - endpoints[POST /studio/samples/{sample_id}/return]
        distinguishing_aspect: |
          Lateness is measured in whole seconds and then ceilinged, so the boundary is an instant,
          not a date: returning at exactly due_return_at gives return_days_late 0 and no vendor
          strike, while returning one second later gives ceil(1/86400) = 1 whole day late and one
          strike - the same calendar day on both sides of the line.
        test_recipe:
          setup:
            - "Vendor NRTH with sample_sla_days 14. Two samples SMP-2001 and SMP-2002 are RECEIVED at clock 2026-08-01T00:00:00Z, so both carry due_return_at 2026-08-15T00:00:00Z."
            - "Both are moved RECEIVED -> RETURN_PENDING (no match needed on that edge); Vendor.outstanding_sample_count is 2."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-2001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smpA_id: $.data.id }
            - call: "POST /studio/samples/${smpA_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpA_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-2002", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
              captures: { smpB_id: $.data.id }
            - call: "POST /studio/samples/${smpB_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpB_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
          trigger:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/samples/${smpA_id}/return"
              payload: { condition_note: "on time to the second" }
              as: SampleCoordinator
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:01Z" }
              as: StudioAdmin
            - call: "POST /studio/samples/${smpB_id}/return"
              payload: { condition_note: "one second past due" }
              as: SampleCoordinator
          assert:
            - "Sample.${smpA_id}.due_return_at == \"2026-08-15T00:00:00.000Z\""
            - "Sample.${smpA_id}.custody_state == \"RETURNED\""
            - "Sample.${smpA_id}.return_days_late == 0"
            - "Sample.${smpB_id}.due_return_at == \"2026-08-15T00:00:00.000Z\""
            - "Sample.${smpB_id}.return_days_late == 1"
            - "Vendor.${v_id}.outstanding_sample_count == 0"
            - "Vendor.${v_id}.late_return_count == 1"
            - "Vendor.${v_id}.coordination_hold == false"

      - name: station_day_capacity_accepts_the_exact_total_and_rejects_it_by_one_minute
        grounds:
          - validations[priority=53].ERR_STATION_CAPACITY_EXCEEDED
          - entities.Station.fields.daily_capacity_minutes
          - entities.Station.fields.committed_minutes_today
          - endpoints[POST /studio/shoot-sessions]
        distinguishing_aspect: |
          The daily capacity check sums same-date planned minutes inclusively: on a 480-minute
          station, 240 + 240 is accepted at exact equality, and a further one-minute session -
          481 total - is rejected. The boundary is crossed by the smallest representable unit and
          the rejected minute must leave committed_minutes_today untouched at 480.
        test_recipe:
          setup:
            - "Station SL-1: station_type STILL_LIFE, daily_capacity_minutes 480, buffer_minutes 0, max_concurrent_sessions 1, calibrated to 2026-12-31. Clock 2026-08-03T08:00:00Z."
            - "Sessions 09:00-13:00 (240 min) and 13:00-17:00 (240 min) are booked back to back; exact adjacency is legal at buffer 0 and the day is exactly full."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "SL-1", station_type: "STILL_LIFE", daily_capacity_minutes: 480, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses1_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T17:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses2_id: $.data.id }
          trigger:
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T17:00:00Z", scheduled_end: "2026-08-03T17:01:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
          assert:
            - "the two setup session creations both returned HTTP 201 (480 == 480 is accepted)"
            - "response status == 409"
            - "response error_id == \"ERR_STATION_CAPACITY_EXCEEDED\""
            - "Station.${st_id}.committed_minutes_today == 480"
            - "ShootSession.${ses1_id}.planned_minutes == 240"
            - "ShootSession.${ses2_id}.planned_minutes == 240"

