      - name: appeal_counter_round_trip_invariant
        grounds:
          - entities.RegisteredEntity.fields.unresolved_appeal_count
          - state_machines.Appeal
        distinguishing_aspect: |
          Different conserved quantity: unresolved_appeal_count. Invariant:
          count == (appeals opened) - (appeals reaching a level-final state
          without further review request); deny -> federal-review -> deny round
          trip must return it to 0, never negative.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; violation V1 OPEN"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo AppCnt", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/appeals", payload: { grounds: "g", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { ap1: $.data.id } }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { cnt1: $.data.unresolved_appeal_count } }
          trigger:
            - { call: "POST /compliance/appeals/${ap1}/deny", payload: {}, as: RegionalEntityReviewer }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { cnt_after_deny: $.data.unresolved_appeal_count } }
            - { call: "POST /compliance/appeals/${ap1}/request-federal-review", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { cnt_after_fed: $.data.unresolved_appeal_count } }
            - { call: "POST /compliance/appeals/${ap1}/deny", payload: {}, as: FederalReviewer }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { cnt_final: $.data.unresolved_appeal_count } }
          assert:
            - "captured cnt1 == 1"
            - "captured cnt_after_deny == 0"
            - "captured cnt_after_fed == 1"
            - "captured cnt_final == 0"
            - "Violation.${v1}.status == OPEN"
