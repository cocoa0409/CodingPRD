  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: val_role_check_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A FarmManager calling approve on a NON-EXISTENT farm id gets ERR_FORBIDDEN (role, priority 2), never a 404 - role precedence over existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /f2s/farms/00000000-0000-0000-0000-000000000000/approve", payload: {}, as: FarmManager, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (not ERR_FARM_NOT_FOUND)"

      - name: val_existence_precedes_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: "Approving a non-existent invoice returns ERR_INVOICE_NOT_FOUND (existence, priority 3) before any state check would apply."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /f2s/invoices/00000000-0000-0000-0000-000000000000/approve", payload: {}, as: DistrictProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_NOT_FOUND"

      - name: val_duplicate_forecast_line
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORECAST_LINE_EXISTS]
        distinguishing_aspect: "Uniqueness on (program_year_id, product_id, week_number): the second identical line fails ERR_FORECAST_LINE_EXISTS."
        test_recipe:
          setup: ["OPEN year; ACTIVE product; one existing forecast line week 6"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
          trigger:
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 100 }, as: DistrictProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORECAST_LINE_EXISTS"

      - name: val_invoice_uniqueness_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVOICE_EXISTS_FOR_DELIVERY]
          - errors[ERR_DUPLICATE_INVOICE_NUMBER]
        distinguishing_aspect: "Two uniqueness axes: a second invoice on the same delivery fails ERR_INVOICE_EXISTS_FOR_DELIVERY; reusing the same invoice_number on a DIFFERENT delivery of the same farm fails ERR_DUPLICATE_INVOICE_NUMBER."
