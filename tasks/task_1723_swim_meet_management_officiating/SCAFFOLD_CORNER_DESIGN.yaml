      - name: seeding_heat_lane_order_and_rejected_exclusion
        claim_type: input_set_filtering
        grounds: [calculations.meet_seeding, entities.LaneAssignment.fields.heat_number, entities.LaneAssignment.fields.lane_number]
        distinguishing_aspect: "7 VERIFIED timed entries (2400..2460) seed into 2 heats under the pinned algorithm: fastest 6 in heat 2 with middle-out lanes [3,4,2,5,1,6], remainder [2460] alone in heat 1 lane 3; the NT entry and the over-cut entry are both REJECTED by verify, receive no lane, and stay ENTERED."
        test_recipe:
          setup: ["meet ENTRIES_CLOSED with 9 entries on a cut-3000 event: seeds 2400..2460 (7 timed), one NT (null), one seed 3001"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "SD1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
