  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_delivery_create_gated_on_student_enrolled
        grounds:
          - state_machines.ServiceDelivery
          - entities.Student.fields.enrollment_status
        distinguishing_aspect: |
          Pair (ServiceDelivery -> Student): creating a ServiceDelivery
          requires the referenced Student to be ENROLLED (an ELIGIBLE or
          APPLIED student cannot receive special-ed services). Tests the
          cross-entity dependency that ServiceDelivery creation is gated on
          Student.enrollment_status.
        test_recipe:
          setup:
            - "District D; special-ed student S created but only ELIGIBLE (not yet ENROLLED)"
            - "Provider teacher T certified in CA"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-060", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Paul", date_of_birth: "2012-09-09T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}", special_education_flag: true }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
            - call: "POST /vks/teachers"
              payload: { full_name: "Ms. Ray", certification_state_codes: ["CA"], caseload_cap: 30 }
              as: AcademicDirector
              captures: { teacher_id: $.data.id }
          trigger:
            - call: "POST /vks/service-deliveries"
              payload: { student_id: "${student_id}", service_type: "COUNSELING", scheduled_at: "2026-08-10T10:00:00Z", duration_minutes: 30, provider_id: "${teacher_id}" }
              as: SpecialEdCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
      - name: proctor_assignment_completion_gated_on_window_open
        grounds:
          - state_machines.ProctorAssignment.BOOKED_to_COMPLETED
          - entities.AssessmentWindow.fields.window_status
        distinguishing_aspect: |
          Pair (ProctorAssignment -> AssessmentWindow): a BOOKED
          ProctorAssignment can only transition to COMPLETED when its
          AssessmentWindow is OPEN. Attempting mark-completed while the
          window is SCHEDULED is rejected. Different entity pair than
          ServiceDelivery -> Student.
        test_recipe:
          setup:
            - "Student S enrolled; TestSite TS capacity 5; AssessmentWindow W with window_start in the future (SCHEDULED)"
            - "ProctorAssignment PA booked for S at TS in W (booking is allowed pre-open)"
