# Scaffold Corner Design (SKILL.md 1.9) - breadth probe over every testable claim
# the scaffold's 1.1-1.7 surface declares that 1.8 does not already cover.
scaffold_corner_design:
- section: entities
  instances:
  - name: create_venue_returns_201_with_declared_and_default_fields
    claim_type: creation
    grounds:
    - entities.Venue
    - endpoints[POST /venues]
    distinguishing_aspect: POST /venues with only name and city returns 201 and a Venue carrying id, created_at, updated_at, version 1, straight_time_start_hhmm 08:00, straight_time_end_hhmm 16:30, max_forklift_capacity_lbs 6000, dock_count 4 and status
      ACTIVE.
    test_recipe:
      setup:
      - Empty database with the logical clock left at its 2026-08-01T00:00:00Z default
      setup_api_calls: []
      trigger:
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
        as: ShowOperations
        as_user_id: ops-1
        captures:
          v_id: $.data.id
          v_ver: $.data.version
      assert:
      - HTTP status is 201
      - Venue.${v_id}.status == ACTIVE
      - ${v_ver} == 1
      - Venue.${v_id}.straight_time_start_hhmm == 08:00
      - Venue.${v_id}.straight_time_end_hhmm == 16:30
      - Venue.${v_id}.max_forklift_capacity_lbs == 6000
      - Venue.${v_id}.dock_count == 4
      - response_type == object and meta.api_request_id is present
  - name: get_show_by_id_returns_stored_calendar_and_derived_fields
    claim_type: retrieval
    grounds:
    - entities.Show
    - endpoints[GET /shows/{id}]
    distinguishing_aspect: GET /shows/{id} echoes back all seven calendar timestamps exactly as stored and reports committed_labor_hours 0 and cancelled_labor_call_count 0 on a fresh show.
    test_recipe:
      setup:
      - One DRAFT show at a venue
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
          max_forklift_capacity_lbs: 6000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          venue_id: $.data.id
      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      trigger:
      - call: GET /shows/${show_id}
        payload: {}
        as: ShowOperations
        as_user_id: ops-1
        captures:
          st: $.data.status
          clh: $.data.committed_labor_hours
      assert:
      - HTTP status is 200
      - ${st} == DRAFT
      - ${clh} == 0
      - Show.${show_id}.discount_deadline == 2026-09-01T00:00:00Z
      - Show.${show_id}.move_out_end == 2026-09-25T18:00:00Z
  - name: list_booths_paginated_reports_total_count_and_has_more
    claim_type: listing
    grounds:
    - entities.Booth
    - endpoints[GET /booths]
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /booths?show_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and the same query at offset 2 returns 1 row with has_more false.
    test_recipe:
      setup:
      - One show carrying three booths for the same exhibitor
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
          max_forklift_capacity_lbs: 6000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          venue_id: $.data.id
      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      - call: POST /shows/${show_id}/status
        payload:
          to_status: OPEN_FOR_ORDERS
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1024'
          sqft: 400
          booth_type: ISLAND
        as: ShowOperations
        as_user_id: ops-1
        captures:
          booth_id: $.data.id
          booth_v: $.data.version
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1026'
          sqft: 400
          booth_type: INLINE
        as: ShowOperations
        as_user_id: ops-1
        captures:
          booth_b_id: $.data.id
          booth_b_v: $.data.version
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1028'
          sqft: 400
          booth_type: CORNER
        as: ShowOperations
        as_user_id: ops-1
        captures:
          booth_c_id: $.data.id
          booth_c_v: $.data.version
      trigger:
      - call: GET /booths?show_id=${show_id}&limit=2&offset=0
        payload:
          show_id: ${show_id}
          limit: 2
          offset: 0
        as: ShowOperations
        as_user_id: ops-1
      assert:
      - HTTP status is 200
      - response_type == array
      - data holds exactly 2 Booth rows
      - meta pagination reports total_count == 3 and has_more == true
      - GET /booths?show_id=${show_id}&limit=2&offset=2 returns 1 row with has_more == false
  - name: get_exhibitor_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_EXHIBITOR_NOT_FOUND]
    - endpoints[GET /exhibitors/{id}]
    distinguishing_aspect: GET /exhibitors/{unknown-uuid} returns HTTP 404 with error_id ERR_EXHIBITOR_NOT_FOUND and an error response envelope.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /exhibitors/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ShowOperations
        as_user_id: ops-1
        captures:
          err: $.data.error_id
      assert:
      - HTTP status is 404
      - ${err} == ERR_EXHIBITOR_NOT_FOUND
      - response_type == error
  - name: create_service_order_missing_required_lines_returns_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=6]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /service-orders]
    distinguishing_aspect: Omitting the required lines field entirely from POST /service-orders returns ERR_INVALID_REQUEST at HTTP 400, which is a different code from the ERR_EMPTY_COLLECTION raised when lines is present but empty.
    test_recipe:
      setup:
      - A show OPEN_FOR_ORDERS with an exhibitor and an OPEN booth
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
          max_forklift_capacity_lbs: 6000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          venue_id: $.data.id
      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      - call: POST /shows/${show_id}/status
        payload:
          to_status: OPEN_FOR_ORDERS
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1024'
          sqft: 400
          booth_type: ISLAND
        as: ShowOperations
        as_user_id: ops-1
        captures:
          booth_id: $.data.id
          booth_v: $.data.version
      trigger:
      - call: POST /service-orders
        payload:
          booth_id: ${booth_id}
          service_type: ELECTRICAL
          expected_booth_version: ${booth_v}
        as: Exhibitor
        as_user_id: ${ex_id}
        captures:
          err: $.data.error_id
      assert:
      - HTTP status is 400
      - ${err} == ERR_INVALID_REQUEST
      - ${err} != ERR_EMPTY_COLLECTION
      - GET /service-orders?booth_id=${booth_id} returns 0 rows
  - name: create_warehouse_applies_free_days_and_rate_defaults
    claim_type: defaults
    grounds:
    - entities.Warehouse.fields.free_days
    - entities.Warehouse.fields.storage_rate_cents_per_cwt_per_month
    - entities.Warehouse.fields.dock_capacity_cwt
    distinguishing_aspect: Omitting free_days, storage_rate_cents_per_cwt_per_month and dock_capacity_cwt on POST /warehouses yields 30, 2200 and 300 respectively, with committed_cwt 0 and status ACCEPTING.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /warehouses
        payload:
          name: Chicago Advance WH
          city: Chicago
          capacity_cwt: 1000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          w_id: $.data.id
      assert:
      - HTTP status is 201
      - Warehouse.${w_id}.free_days == 30
      - Warehouse.${w_id}.storage_rate_cents_per_cwt_per_month == 2200
      - Warehouse.${w_id}.dock_capacity_cwt == 300
      - Warehouse.${w_id}.committed_cwt == 0
      - Warehouse.${w_id}.status == ACCEPTING
  - name: drayage_computed_pricing_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.DrayageShipment.fields.drayage_charge_cents
    - calculations.drayage_charge
    - endpoints[POST /drayage-shipments]
    distinguishing_aspect: 'Supplying drayage_charge_cents, billable_cwt or gross_weight_lbs in the POST /drayage-shipments body never reaches the stored row: the server recomputes 13 cwt and 127400 cents from the crate list regardless of what the client
      sent.'
    test_recipe:
      setup:
      - A warehouse, a show and one registered 1250 lb crate
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
          max_forklift_capacity_lbs: 6000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          venue_id: $.data.id
      - call: POST /warehouses
        payload:
          name: Chicago Advance WH
          city: Chicago
          capacity_cwt: 1000
          dock_capacity_cwt: 300
          free_days: 30
          storage_rate_cents_per_cwt_per_month: 2200
        as: ShowOperations
        as_user_id: ops-1
        captures:
          wh_id: $.data.id
          wh_v: $.data.version
      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      - call: POST /crates
        payload:
          exhibitor_id: ${ex_id}
          crate_label: ACME-C1
          crate_type: WOOD_CRATE
          weight_lbs: 1250
        as: Exhibitor
        as_user_id: ${ex_id}
        captures:
          crate_id: $.data.id
      trigger:
      - call: POST /drayage-shipments
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          channel: ADVANCE_WAREHOUSE
          warehouse_id: ${wh_id}
          crate_ids:
          - ${crate_id}
          received_at: '2026-09-08T10:00:00Z'
          dock_window_start: '2026-09-08T08:00:00Z'
          dock_window_end: '2026-09-08T12:00:00Z'
          declared_value_coverage: false
          drayage_charge_cents: 1
          billable_cwt: 1
          gross_weight_lbs: 1
        as: WarehouseAgent
        as_user_id: ${wh_id}
        captures:
          s_id: $.data.id
      assert:
      - DrayageShipment.${s_id}.gross_weight_lbs == 2080 is NOT expected; the correct value is 1250
      - DrayageShipment.${s_id}.gross_weight_lbs == 1250
      - DrayageShipment.${s_id}.billable_cwt == 13
      - DrayageShipment.${s_id}.drayage_charge_cents == 127400
  - name: crate_system_fields_generated_and_client_values_ignored
    claim_type: system_fields
    grounds:
    - entities.Crate.fields.status
    - entities.Crate.fields.stored_since
    - entities.Crate.fields.warehouse_id
    distinguishing_aspect: A newly created Crate always comes back with status REGISTERED, warehouse_id null, shipment_id null, stored_since null, storage_charge_cents 0 and version 1, no matter what the client body contained.
    test_recipe:
      setup:
      - One exhibitor
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      trigger:
      - call: POST /crates
        payload:
          exhibitor_id: ${ex_id}
          crate_label: ACME-C1
          crate_type: FIBER_CASE
          weight_lbs: 640
        as: Exhibitor
        as_user_id: ${ex_id}
        captures:
          c_id: $.data.id
          c_ver: $.data.version
      assert:
      - HTTP status is 201
      - Crate.${c_id}.status == REGISTERED
      - Crate.${c_id}.warehouse_id == null
      - Crate.${c_id}.shipment_id == null
      - Crate.${c_id}.stored_since == null
      - Crate.${c_id}.storage_charge_cents == 0
      - ${c_ver} == 1
      - Crate.${c_id}.created_at is an ISO 8601 UTC timestamp with three fractional digits
  - name: create_booth_invalid_enum_booth_type_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - validations[priority=6]
    - entities.Booth.fields.booth_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /booths with booth_type PERIMETER, which is not one of INLINE, CORNER, PENINSULA or ISLAND, returns ERR_INVALID_REQUEST at HTTP 400 and creates nothing.
