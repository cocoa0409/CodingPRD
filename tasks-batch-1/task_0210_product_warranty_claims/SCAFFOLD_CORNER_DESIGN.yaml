        claim_type: Priority conflict
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_safety_invalid_state_over_defect_not_covered
          rationale: "ERR_INVALID_STATE (priority 4) beating ERR_DEFECT_NOT_COVERED (priority 7) is the named §1.8 instance."

