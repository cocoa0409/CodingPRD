              as_user_id: "${mfr_id}"
              captures: { host_event_id: "$.data.id" }
          trigger:
            - call: "POST /_inject/assignment-history"
              payload: { demonstrator_id: "${dem_id}", demo_event_id: "${host_event_id}", entries: [ { scheduled_start_utc: "2026-07-06T08:15:00Z", scheduled_end_utc: "2026-07-06T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-07-06T08:15:00Z", check_out_at: "2026-07-06T13:15:00Z" }, { scheduled_start_utc: "2026-07-13T08:15:00Z", scheduled_end_utc: "2026-07-13T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-07-13T08:15:00Z", check_out_at: "2026-07-13T13:15:00Z" } ] }
              as: ProgramAdmin
