      - name: certification_windows_touching_at_one_day_collide_for_the_same_technician
        grounds:
          - validations[priority 150]
          - errors[ERR_CERTIFICATION_WINDOW_OVERLAP]
          - entities.TrainingCertification.fields.valid_until
        distinguishing_aspect: |
          The contended resource is a (technician_user_id, course_code) certification slot and the
          interval semantics are CLOSED on BOTH bounds, so a new window whose valid_from equals an
          ACTIVE certification's valid_until (2026-12-31) collides, while valid_from 2027-01-01
          is accepted — the exact opposite of the half-open compatibility windows.
        test_recipe:
          setup:
            - "Region profile US-CA exists."
            - "RepairProvider with technician_count 8 (required_cert_count 2) is TRAINING_IN_PROGRESS with 10 granted training credits."
            - "One ACTIVE certification exists for u_tech_1 / CRS_BATTERY_SAFETY over the closed window 2026-07-01..2026-12-31, leaving training_credit_balance 8."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Northgate Device Service", region_code: "US-CA", requested_access_tier: "TIER_2_SAFETY", technician_count: 8 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 10 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_BATTERY_SAFETY", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", exam_score: 90 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert1: $.data.id }
          trigger:
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_BATTERY_SAFETY", valid_from: "2026-12-31T00:00:00Z", valid_until: "2027-06-30T00:00:00Z", exam_score: 88 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_BATTERY_SAFETY", valid_from: "2027-01-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", exam_score: 88 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert3: $.data.id }
          assert:
            - "${err} == ERR_CERTIFICATION_WINDOW_OVERLAP"
            - "the touching attempt returns HTTP 409 and consumes no credit"
            - "${cert3} is created with HTTP 201"
            - "RepairProvider.${provider_id}.training_credit_balance == 6"
            - "RepairProvider.${provider_id}.active_cert_count == 2"
            - "TrainingCertification.${cert1}.status == ACTIVE"

      - name: abutting_compatibility_windows_are_accepted_under_half_open_semantics
        grounds:
          - validations[priority 148]
          - errors[ERR_COMPATIBILITY_WINDOW_OVERLAP]
          - entities.PartModelCompatibility.fields.effective_until
        distinguishing_aspect: |
          The contended resource is a (part_id, model_id) compatibility slot and the interval
          semantics are HALF-OPEN [effective_from, effective_until): a new window opening
          2024-12-01 inside an existing [2024-03-01, 2025-01-01) window is rejected, but one
          opening exactly at 2025-01-01 abuts and is accepted.
        test_recipe:
          setup:
            - "Region profile US-CA exists; ProductModel CRX-9600 is TIER_B_GUIDED with market_release_date 2024-01-01."
            - "DRAFT COMPONENT part SKU-HINGE-2 exists."
            - "One PartModelCompatibility row already covers the half-open window 2024-03-01..2025-01-01."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
