- rule_id: compensating_invariant
  instances:
  - name: ci_replay_refund_restores_account_task_count
    grounds:
    - state_machines.WorkflowAction.HELD_to_RUNNING
    - state_machines.WorkflowAction.PENDING_to_HELD
    - calculations.charge_task
    - entities.RefundGrant.fields.kind
    distinguishing_aspect: 'A conserved task count on TeamAccount: a HELD run charge raises tasks_used_current by 8, and the compensating replay that consumes the REFUND grant lowers it by exactly 8, so the named quantity tasks_used_current returns to its pre-charge value with zero drift.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 100 (no overage), one activated POLLING workflow
      - recorded pre-charge tasks_used_current is 0
      setup_api_calls:
      - call: POST /zapier/accounts
