  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Instance 1: state (ACCOUNT_SUSPENDED, prio 7) vs business_safety (AFTER_HOURS, prio 8)
      - name: suspended_beats_after_hours_on_answer
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - errors[ERR_AFTER_HOURS_BLOCKED]
        distinguishing_aspect: |
          A single answer request violates BOTH priority-7 (account SUSPENDED,
          category state) AND priority-8 (after-hours not routable, category
          business_safety). The lower-numbered priority wins: ERR_ACCOUNT_SUSPENDED
          (409), not ERR_AFTER_HOURS_BLOCKED. Error-category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "Account SUSPENDED (overage past hard cap). Its script has business hours [09:00,17:00) and after_hours_action VOICEMAIL (not routable)."
            - "Clock at 18:00 (after-hours). A RINGING call exists (intaken while business-hours earlier path is awkward; we intake before suspend)."
            - "We construct: clock 10:00 intake -> call RINGING; then drive overage to SUSPEND the account; then move clock to 18:00; then attempt answer."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PMcap2", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 100, hard_cap_overage_cents: 300, included_minutes: 0, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Iota", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 540, business_close_minute: 1020, after_hours_action: "VOICEMAIL" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # Drive a billed call to suspend the account (separate call, completed)
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { biller: $.data.id }
            - call: "POST /va/calls/${biller}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${biller}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:02:01Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${biller}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${biller}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # account now SUSPENDED. Intake the call-under-test at after-hours (18:00).
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5559999", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { target_call: $.data.id, target_h: $.data.handling_status, target_afterhours: $.data.is_after_hours }
          trigger:
            - call: "POST /va/calls/${target_call}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ClientAccount.${acct_id}.status == \"SUSPENDED\" before the answer attempt"
            - "Call.${target_call}.is_after_hours == true (intaken at 18:00, after [09:00,17:00))"
            - "answer response status == 409"
            - "answer error_id == \"ERR_ACCOUNT_SUSPENDED\" (priority 7 beats priority-8 ERR_AFTER_HOURS_BLOCKED)"

      # ---- Instance 2: business_temporal (SLOT_OVERLAP, prio 10) vs business_constraint (SLOT_FULL, prio 12)
      - name: slot_overlap_beats_slot_full_on_booking
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_SLOT_OVERLAP]
          - errors[ERR_SLOT_FULL]
        distinguishing_aspect: |
          A booking against a slot that is BOTH at capacity (priority-12
          business_constraint ERR_SLOT_FULL) AND whose requested interval overlaps
          the existing appointment (priority-10 business_temporal ERR_SLOT_OVERLAP)
          returns the lower-numbered priority-10 error ERR_SLOT_OVERLAP. Pair:
          business_temporal vs business_constraint.
        test_recipe:
          setup:
            - "OPEN slot capacity 1, buffer 0; one CONFIRMED appointment 10:00-10:30 (slot now full, available_count 0)."
            - "A new booking requests 10:15-10:45 (overlaps) into the same already-full slot."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PCslot", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Kappa", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 0, capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt1: $.data.id }
            - call: "POST /va/appointments/${appt1}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /va/calendar-slots/${slot_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_v1: $.data.version, avail: $.data.available_count }
          trigger:
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:15:00Z", end_at: "2026-03-02T10:45:00Z", expected_slot_version: "${slot_v1}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CalendarSlot.${slot_id}.available_count == 0 before the second booking (slot full)"
            - "second booking response status == 409"
            - "second booking error_id == \"ERR_SLOT_OVERLAP\" (priority 10 beats priority-12 ERR_SLOT_FULL)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- Instance 1: hard-cap >= boundary on overage_charge_cents (POST .../complete)
      - name: hard_cap_suspend_at_exact_threshold
        grounds:
          - state_machines.ClientAccount.status.ACTIVE_to_SUSPENDED
          - entities.ServicePlan.fields.hard_cap_overage_cents
          - entities.BillingPeriod.fields.overage_charge_cents
          - calculations.billing_overage
        distinguishing_aspect: |
          The hard-cap uses >= : overage_charge_cents EXACTLY equal to
          hard_cap_overage_cents (300 == 300) suspends the account, reached via
          POST /va/calls/{callId}/complete. Metric: a monetary threshold crossing.
        test_recipe:
          setup:
