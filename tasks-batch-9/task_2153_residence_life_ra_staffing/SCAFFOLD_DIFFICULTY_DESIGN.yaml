            - "Kerr Hall floor 2 with a CERTIFIED, ACTIVE RA assigned to it."
            - "Floor 2 has programming_budget_cents 40000."
            - "ProgramEvent 'Study Jam' (EDUCATIONAL, requested_amount_cents 40000) is APPROVED, so encumbered is 40000 and programming_available_cents is 0."
