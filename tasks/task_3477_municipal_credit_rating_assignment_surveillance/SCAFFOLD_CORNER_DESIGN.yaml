              as_user_id: "${iss}"
              captures: { appeal_id: $.data.id }
            - call: "POST /muni/appeals/${appeal_id}/decide"
              payload: { decision: "DENIED", rationale: "information not material" }
              as: CommitteeChair
              as_user_id: "chair-1"
          trigger:
            - call: "POST /muni/appeals/${appeal_id}/decide"
              payload: { decision: "UPHELD", rationale: "second thoughts" }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { decide_err: "$.data.error_id" }
          assert:
            - "response status 409 and error_id == ERR_APPEAL_STATE_INVALID"
            - "appeal remains DENIED; rating remains ASSIGNED (no REMANDED flip)"

      - name: obligation_submit_from_defaulted_becomes_submitted_late
        claim_type: Valid Transition
        grounds:
          - state_machines.DisclosureObligation.DEFAULTED_to_SUBMITTED_LATE
          - entities.Issuer.fields.delinquent_flag
        distinguishing_aspect: "A DEFAULTED obligation still accepts a late submission (the cure path that enables reinstatement): submit lands SUBMITTED_LATE, clears the issuer's delinquent_flag, but does NOT by itself reinstate the withdrawn rating."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED 2026-09-08T00:00:00Z; clock jumped to 2028-03-27T00:00:00Z so obligation period 1 is DEFAULTED and the rating WITHDRAWN (NON_DISCLOSURE)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - &c_publish
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - &publish_std
              call: "POST /muni/ratings/${rating_id}/publish"
              payload: { outlook: "STABLE", rationale: "Stable credit profile" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
            - &get_obls
              call: "GET /muni/ratings/${rating_id}/disclosure-obligations"
              payload: {}
              as: SurveillanceOfficer
              captures: { ob1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-27T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /muni/disclosure-obligations/${ob1}/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss}"
              captures: { ob1_status: $.data.status }
            - call: "GET /muni/issuers/${iss}"
              payload: {}
              as: PlatformAdmin
              captures: { flag_after: $.data.delinquent_flag }
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { r_status: $.data.status }
          assert:
            - "obligation ${ob1} -> SUBMITTED_LATE (submission is accepted even from DEFAULTED)"
            - "Issuer.delinquent_flag == false after the cure"
            - "Rating remains WITHDRAWN — curing the obligation does not reinstate; only POST /muni/ratings/{id}/reinstate does"
            - "no next-period obligation is created while the rating is WITHDRAWN (obligations list still has length 1)"

      - name: rating_withdraw_then_reinstate_restores_notch
        claim_type: Valid Transition
        grounds:
          - state_machines.Rating.WITHDRAWN_to_PUBLISHED
          - entities.Rating.fields.notch_at_withdrawal
        distinguishing_aspect: "The WITHDRAWN -> PUBLISHED reinstatement cycle restores the exact notch frozen at withdrawal (A), recomputes posture to CURRENT, appends a REINSTATEMENT history entry, and resumes the annual obligation chain with period_index 2."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED with notch A; clock at 2028-03-28T00:00:00Z; obligation period 1 DEFAULTED then cured to SUBMITTED_LATE at 2028-03-28T00:00:00Z; rating WITHDRAWN (NON_DISCLOSURE, withdrawn_at 2028-03-27T00:00:00Z inside the sweep)."
