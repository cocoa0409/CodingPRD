              captures: { reg_cy_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_dee_id}", list_id: "${g3_id}" }
              as: Dispatcher
              captures: { reg_dee_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Vantage Builders", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { vantage_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
