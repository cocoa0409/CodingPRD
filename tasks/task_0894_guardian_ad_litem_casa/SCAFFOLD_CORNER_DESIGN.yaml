          assert: ["response error_id == ERR_UNAUTHORIZED (HTTP 403)"]

      - name: foreign_supervisor_cannot_review_report_unauthorized
        claim_type: ownership_denial
        grounds: [roles.Supervisor, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Supervisor who is not the case's supervisor_id calling review on that case's report returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Clock 2026-06-01; S1 owns C1, V1 sworn+assigned; hearing H1; report R1 SUBMITTED. S2 is a different supervisor."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /supervisors", payload: { full_name: "Sup Two", email: "s2@casa.org" }, as: ProgramAdmin, captures: { s2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/hearings", payload: { hearing_type: "STATUS", scheduled_at: "2026-07-20T09:00:00Z" }, as: Supervisor, as_user_id: "${s1_id}", captures: { h1_id: "$.data.id" } }
            - { call: "POST /cases/${c1_id}/court-reports", payload: { hearing_id: "${h1_id}", content_summary: "s", recommendation: "r" }, as: Volunteer, as_user_id: "${v1_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /court-reports/${r1_id}/submit", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /court-reports/${r1_id}/review", payload: { decision: "APPROVE" }, as: Supervisor, as_user_id: "${s2_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_UNAUTHORIZED (HTTP 403)"]

      - name: supervisor_cannot_register_volunteer_unauthorized
        claim_type: rbac_denial
        grounds: [roles.ProgramAdmin, roles.Supervisor, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Supervisor calling POST /volunteers (ProgramAdmin-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One supervisor S1 exists."]
          setup_api_calls:
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /volunteers", payload: { full_name: "Sneaky", email: "x@casa.org", home_zip: "94601" }, as: Supervisor, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_UNAUTHORIZED (HTTP 403)"]

  # ------------------------------------------------------- Cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_case_version_on_assignment_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "After a first assignment bumps Case.version, a second assignment carrying the pre-bump expected_case_version is rejected with ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-06-01; S1; two ACTIVE volunteers V1, V2; Case C1 (INTAKE). c1_v0 captured at case creation (before any assignment)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Val Two", email: "v2@casa.org", home_zip: "94602" }, as: ProgramAdmin, captures: { v2_id: "$.data.id" } }
