        distinguishing_aspect: "200000 points of in-flight transfers give 200000 // 50000 = 4 velocity steps worth 40 points, which is exactly VELOCITY_TERM_CAP, so review_score is 30 + 40 - 0 = 70 rather than an uncapped 40; crossing POSTURE_LOCK_SCORE 60 then rejects all four SUBMITTED transfers and the TRANSFER_REVERSAL entries restore the balance to 200000."
        test_recipe:
