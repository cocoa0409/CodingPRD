              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d3_id: $.data.id }
            - call: "POST /motor-designs/${d3_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d3_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d3_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d3_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o_boundary_id: $.data.id }
            - call: "POST /customer-orders/${o_boundary_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d3_id}", order_type: "MADE_TO_ORDER", quantity: 11, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o_below_id: $.data.id }
            - call: "POST /customer-orders/${o_below_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
          trigger:
            - call: "POST /work-orders"
              payload: { order_id: "${o_boundary_id}", design_id: "${d3_id}", unit_count: 12, expected_design_version: "${d3_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo_boundary_id: $.data.id, boundary_band: $.data.overhead_band, boundary_direct: $.data.direct_cost_cents, boundary_overhead: $.data.overhead_cents, boundary_standard: $.data.standard_cost_cents }
            - call: "GET /motor-designs/${d3_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { d3_v2: $.data.version }
            - call: "POST /work-orders"
              payload: { order_id: "${o_below_id}", design_id: "${d3_id}", unit_count: 11, expected_design_version: "${d3_v2}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo_below_id: $.data.id, below_band: $.data.overhead_band, below_direct: $.data.direct_cost_cents, below_overhead: $.data.overhead_cents, below_standard: $.data.standard_cost_cents }
