            - call: "POST /wind-ops/fault-events/${fe1}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-7002", raised_at: "2026-08-01T04:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe2: $.data.id }
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:30:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/fault-events/${fe2}/triage"
