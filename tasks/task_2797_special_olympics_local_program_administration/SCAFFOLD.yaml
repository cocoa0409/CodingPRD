scenario: |
  2797. Special Olympics Local Program Administration (Special Olympics local program): athlete
  registration with medical form requirements, eligibility criteria and periodic renewal, coach and
  volunteer credentialing with background screening and protective behaviors training, sport season
  structure with practice minimums required before competition eligibility, divisioning by ability
  and age to create equitable competition groups, unified partner recruitment and team composition
  rules, competition entry with skill scores, qualifying performance and advancement to state or
  national games, health screening program integration at events with referral follow-up,
  fundraising, in-kind support and family engagement programs
domain_name: special-olympics-local-program
api_prefix: ""           # flat top-level collections: /programs, /athletes, /volunteers, /credentials, /seasons, /practice-sessions, /divisions, /competition-entries, /unified-teams, /health-screenings, /contributions

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  difficulty_level: expert_plus
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - ops_run_checkpoint
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a peer addressed at a top-level collection (/athletes/{id}, /credentials/{id},
  # /competition-entries/{id}); parentage is expressed by FK fields in the request body, never by
  # nested resource paths beyond one create/sub-list segment. Division.merged_into_division_id makes
  # the topology self-referential; CompetitionEntry.participant_id makes it polymorphic.

  state_machine_shape: parallel
  # Athlete carries two independent state dimensions (registration_status x medical_status).
  # Credential is a branching fork-join (screening branch + training branch converge on
  # READY_TO_CERTIFY) with a renewal cycle. MedicalForm, CompetitionEntry and HealthScreening are
  # cyclic. SportSeason is linear-with-revert. Division is compound (status derived from live
  # entry_count).

  relationship_patterns:
    - one_to_many          # Program -> Athlete/Volunteer/SportSeason/Contribution
    - many_to_many         # Athlete <-> PracticeSession via AttendanceRecord
    - self_referential     # Division.merged_into_division_id -> Division.id
    - polymorphic          # CompetitionEntry.participant_id -> Athlete.id | UnifiedTeam.id
    - cross_aggregate      # PracticeSession.coach_credential_id crosses the volunteer aggregate

  role_model: segregation_of_duties
  # The CredentialingOfficer who records a screening or training artifact may not be the user who
  # certifies that credential; a FLAGGED screening can only be certified by ProgramManager.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Local program display name.
        constraints: 3..120 chars
      - name: region_code
        type: string
        source: input
        description: Two-letter uppercase US state/region code the accredited program serves.
        constraints: exactly 2 chars, A-Z
      - name: compliance_posture
        type: enum
        source: computed
        description: >-
          Derived credentialing/health posture that gates child operations. Recomputed by
          calculations.program_compliance_posture after every mutation that can change
          certified_coach_count, expired_credential_count, credential_denominator_count or
          unresolved_urgent_referral_count, and at the end of every compliance sweep.
        default: FROZEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: certified_coach_count
        type: integer
        source: computed
        description: Count of Credential rows of this program with role_class == COACH, status == CERTIFIED and expires_on >= clock date.
        default: 0
      - name: credential_denominator_count
        type: integer
        source: computed
        description: Count of Credential rows of this program with status IN {INITIATED, SCREENING_CLEARED, TRAINING_COMPLETE, READY_TO_CERTIFY, CERTIFIED, EXPIRED, RENEWAL_IN_PROGRESS} (DENIED excluded).
        default: 0
      - name: expired_credential_count
        type: integer
        source: computed
        description: Count of Credential rows of this program with status IN {EXPIRED, RENEWAL_IN_PROGRESS}.
        default: 0
      - name: expired_credential_ratio
        type: number
        source: computed
        description: expired_credential_count / credential_denominator_count, round_half_up to 4 decimals; exactly 0.0000 when credential_denominator_count == 0.
        default: 0
        constraints: 4 decimal places
      - name: unresolved_urgent_referral_count
        type: integer
        source: computed
        description: Count of HealthScreening rows whose athlete belongs to this program with finding_severity == URGENT and referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}.
        default: 0
      - name: active_athlete_count
        type: integer
        source: computed
        description: Count of Athlete rows of this program with registration_status == ACTIVE.
        default: 0
      - name: program_practice_minutes
        type: integer
        source: computed
        description: >-
          Program-wide practice-minute ledger. Invariant pinned by
          calculations.program_practice_minute_ledger - equals the sum of AttendanceRecord.counted_minutes
          over every AttendanceRecord with status == COUNTED whose athlete belongs to this program.
        default: 0
      - name: recognized_support_cents
        type: integer
        source: computed
        description: Sum of Contribution.recognized_value_cents over this program's Contribution rows with status == RECEIVED.
        default: 0
      - name: pledged_support_cents
        type: integer
        source: computed
        description: Sum of Contribution.recognized_value_cents over this program's Contribution rows with status == PLEDGED.
        default: 0
      - name: family_engagement_credit_cents
        type: integer
        source: computed
        description: >-
          Per-contribution-rounded 10% match credit; see calculations.family_engagement_match_credit
          (round each contribution's match to whole cents FIRST, then sum).
        default: 0
      - name: sweep_epoch
        type: integer
        source: system
        description: Incremented by one on every successful compliance sweep.
        default: 0
      - name: last_sweep_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent compliance sweep; null before the first sweep.

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; set from the create path segment and immutable afterwards.
      - name: legal_name
        type: string
        source: input
        description: Athlete legal name as printed on the medical form.
        constraints: 2..120 chars
      - name: birth_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) of birth; drives age_group divisioning and unified age-span checks.
      - name: sport
        type: enum
        source: input
        description: Primary sport the athlete trains in.
        constraints: "one of {ATHLETICS, BOCCE, BASKETBALL, SWIMMING}"
      - name: down_syndrome_flag
        type: boolean
        source: input
        description: When true, every submitted MedicalForm must carry attestation_atlantoaxial_screen == true.
        default: false
      - name: registration_status
        type: enum
        source: system
        description: Registration dimension of the athlete's parallel state machine.
        default: PENDING_MEDICAL
        constraints: "one of {PENDING_MEDICAL, ACTIVE, LAPSED, WITHDRAWN}"
      - name: medical_status
        type: enum
        source: system
        description: Medical-clearance dimension of the athlete's parallel state machine; evolves independently of registration_status.
        default: NONE
        constraints: "one of {NONE, PENDING_REVIEW, CLEARED, RESTRICTED, HOLD}"
      - name: registration_expires_on
        type: string
        source: computed
        description: >-
          ISO date; min(approved medical form expires_on, approval clock date + REGISTRATION_VALIDITY_DAYS)
          per calculations.athlete_registration_expiry. Null while registration_status == PENDING_MEDICAL.
      - name: current_medical_form_id
        type: string
        source: computed
        description: >-
          Denormalised pointer to the id of this athlete's MedicalForm whose status == APPROVED (null when
          none). Deliberately NOT a foreign-key declaration - forms are discovered through
          GET /athletes/{id}/medical-forms.
      - name: cumulative_practice_minutes
        type: integer
        source: computed
        description: Sum of AttendanceRecord.counted_minutes over this athlete's AttendanceRecord rows with status == COUNTED (all seasons).
        default: 0
      - name: counted_session_count
        type: integer
        source: computed
        description: Count of this athlete's AttendanceRecord rows with status == COUNTED (all seasons).
        default: 0
      - name: withdrawal_reason_code
        type: enum
        source: system
        description: Reason captured at withdrawal; null unless registration_status == WITHDRAWN.
        constraints: "one of {MOVED_AWAY, MEDICAL, FAMILY_REQUEST, AGED_OUT, INACTIVE}"

  - name: MedicalForm
    parent: null
    common_fields: true
    fields:
      - name: athlete_id
        type: string
        source: input
        description: FK -> Athlete.id; set from the create path segment.
      - name: exam_date
        type: string
        source: input
        description: ISO date of the physician examination; must be <= clock date and within MEDICAL_FORM_VALIDITY_DAYS of it.
      - name: physician_name
        type: string
        source: input
        description: Examining physician name.
        constraints: 2..120 chars
      - name: physician_license_id
        type: string
        source: input
        description: Examining physician licence identifier.
        constraints: 4..32 chars
      - name: attestation_cardiac_clearance
        type: boolean
        source: input
        description: Physician attestation that cardiac screening was performed; must be true for the form to be reviewable.
      - name: attestation_seizure_history
        type: boolean
        source: input
        description: Physician attestation that seizure history was captured (true or false are both acceptable values).
      - name: attestation_atlantoaxial_screen
        type: boolean
        source: input
        description: Physician attestation that atlantoaxial instability screening was performed; mandatory when the athlete's down_syndrome_flag is true.
      - name: restrictions
        type: array
        source: input
        description: Participation restrictions carried onto the athlete record; array of enum values.
        constraints: "non-empty array of {NONE, NO_CONTACT, HEAT_SENSITIVE, NO_SWIMMING}; NONE may not be combined with other values"
      - name: status
        type: enum
        source: system
        description: Review lifecycle state; REJECTED forms cycle back to SUBMITTED through resubmission.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, SUPERSEDED, EXPIRED}"
      - name: revision_count
        type: integer
        source: system
        description: Number of resubmissions applied to this form; MEDICAL_FORM_MAX_REVISIONS caps it.
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalReviewer who last decided this form; null before first review.
      - name: rejection_reason_code
        type: enum
        source: input
        description: Reason recorded on rejection; null unless status == REJECTED.
        constraints: "one of {INCOMPLETE_ATTESTATION, STALE_EXAM, ILLEGIBLE, PHYSICIAN_UNVERIFIED}"
      - name: expires_on
        type: string
        source: computed
        description: ISO date = exam_date + MEDICAL_FORM_VALIDITY_DAYS; recomputed on every resubmission.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval; null unless the form has ever been APPROVED.

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; set from the create path segment.
      - name: full_name
        type: string
        source: input
        description: Volunteer legal name.
        constraints: 2..120 chars
      - name: email
        type: string
        source: input
        description: Contact email; unique within the program.
        constraints: must contain '@'
      - name: date_of_birth
        type: string
        source: input
        description: ISO date of birth; drives is_minor and unified-team age-span checks.
      - name: volunteer_class
        type: enum
        source: input
        description: The single credentialing track this volunteer may hold; Credential.role_class must equal it.
        constraints: "one of {COACH, UNIFIED_PARTNER, GENERAL_VOLUNTEER}"
      - name: status
        type: enum
        source: computed
        description: >-
          CREDENTIALED while the volunteer holds at least one Credential with status == CERTIFIED and
          expires_on >= clock date; INACTIVE once every Credential is DENIED, EXPIRED or
          RENEWAL_IN_PROGRESS; PROSPECT before any credential reaches CERTIFIED.
        default: PROSPECT
        constraints: "one of {PROSPECT, CREDENTIALED, INACTIVE}"
      - name: is_minor
        type: boolean
        source: computed
        description: True when floor(years between date_of_birth and clock date) < ADULT_AGE_YEARS; minors may not hold a COACH credential.
        default: false

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: FK -> Volunteer.id; set from the create path segment.
      - name: role_class
        type: enum
        source: input
        description: Credential track; must equal the volunteer's volunteer_class.
        constraints: "one of {COACH, UNIFIED_PARTNER, GENERAL_VOLUNTEER}"
      - name: status
        type: enum
        source: system
        description: Fork-join credentialing state; the screening branch and the training branch converge on READY_TO_CERTIFY.
        default: INITIATED
        constraints: "one of {INITIATED, SCREENING_CLEARED, TRAINING_COMPLETE, READY_TO_CERTIFY, CERTIFIED, DENIED, EXPIRED, RENEWAL_IN_PROGRESS}"
      - name: screening_result
        type: enum
        source: input
        description: Background-screening adjudication; null until a screening is recorded.
        constraints: "one of {CLEAR, FLAGGED, DISQUALIFYING}"
      - name: screening_completed_on
        type: string
        source: input
        description: ISO date the background screening completed; must be <= clock date.
      - name: screening_expires_on
        type: string
        source: computed
        description: ISO date = screening_completed_on + SCREENING_VALIDITY_DAYS; null until a screening is recorded.
      - name: screening_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the screening; the certifying user must differ from it.
      - name: screening_vendor_reference
        type: string
        source: input
        description: Vendor case reference for the screening record.
      - name: training_completed_on
        type: string
        source: input
        description: ISO date the protective-behaviours training completed; must be <= clock date.
      - name: training_expires_on
        type: string
        source: computed
        description: ISO date = training_completed_on + TRAINING_VALIDITY_DAYS_BY_ROLE[role_class]; null until training is recorded.
      - name: training_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the training; the certifying user must differ from it.
      - name: training_curriculum_code
        type: string
        source: input
        description: Curriculum identifier of the protective-behaviours course taken.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the credential; null until CERTIFIED.
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent certification; null until CERTIFIED.
      - name: flag_override_reason
        type: string
        source: input
        description: Free-text justification required when certifying a credential whose screening_result == FLAGGED.
      - name: expires_on
        type: string
        source: computed
        description: >-
          ISO date, per calculations.credential_effective_expiry -
          min(screening_expires_on, training_expires_on, and when screening_result == FLAGGED also
          certified_at date + FLAGGED_REVIEW_DAYS). Null until CERTIFIED.
      - name: denial_reason_code
        type: enum
        source: system
        description: Set when status == DENIED.
        constraints: "one of {DISQUALIFYING_SCREENING, MINOR_AS_COACH}"

  - name: SportSeason
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; set from the create path segment.
      - name: sport
        type: enum
        source: input
        description: Sport contested this season; selects the scoring direction variant.
        constraints: "one of {ATHLETICS, BOCCE, BASKETBALL, SWIMMING}"
      - name: season_name
        type: string
        source: input
        description: Season display name.
        constraints: 3..120 chars
      - name: practice_minimum_sessions
        type: integer
        source: input
        description: Minimum COUNTED attendance records in this season required before a competition entry is accepted.
        constraints: 0..40
      - name: practice_minimum_minutes
        type: integer
        source: input
        description: Minimum summed counted_minutes in this season required before a competition entry is accepted.
        constraints: 0..3000
      - name: registration_deadline
        type: string
        source: input
        description: ISO date; entries are accepted while clock date <= this value, divisioning requires clock date >= this value.
      - name: divisioning_date
        type: string
        source: input
        description: ISO date the divisioning committee meets; must be >= registration_deadline.
      - name: competition_date
        type: string
        source: input
        description: ISO date of the games; must be > divisioning_date.
      - name: games_level
        type: enum
        source: input
        description: Level of these games; selects the advancement target of qualifying entries.
        constraints: "one of {LOCAL, STATE, NATIONAL}"
      - name: entry_slot_budget
        type: integer
        source: input
        description: Maximum number of non-VOID CompetitionEntry rows this season accepts.
        constraints: 1..500
      - name: advancement_slots_per_division
        type: integer
        source: input
        description: Number of advancement slots each division may fill.
        constraints: 1..8
      - name: status
        type: enum
        source: system
        description: Season lifecycle; DIVISIONED reverts to PRACTICE_OPEN on redivision.
        default: PLANNING
        constraints: "one of {PLANNING, PRACTICE_OPEN, DIVISIONED, ENTRIES_LOCKED, COMPLETED}"
      - name: divisioning_run_count
        type: integer
        source: system
        description: Number of completed divisioning runs; incremented on every divisioning call.
        default: 0
      - name: entry_count
        type: integer
        source: computed
        description: Count of CompetitionEntry rows of this season with status != VOIDED.
        default: 0
      - name: divisioned_entry_count
        type: integer
        source: computed
        description: Count of CompetitionEntry rows of this season with status IN {DIVISIONED, LOCKED, RESULTED, ADVANCED, DISQUALIFIED} and division_id IS NOT NULL.
        default: 0

  - name: PracticeSession
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> SportSeason.id.
      - name: coach_credential_id
        type: string
        source: input
        description: FK -> Credential.id; the coaching credential that occupies this time interval.
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start instant; must be >= clock at creation.
      - name: duration_minutes
        type: integer
        source: input
        description: Session length in minutes; sessions shorter than MIN_QUALIFYING_SESSION_MINUTES never produce COUNTED attendance.
        constraints: 30..240
      - name: capacity_slots
        type: integer
        source: input
        description: Maximum number of non-VOIDED attendance records this session accepts.
        constraints: 1..60
      - name: scheduled_end
        type: datetime
        source: computed
        description: scheduled_start + duration_minutes.
      - name: counts_toward_minimum
        type: boolean
        source: computed
        description: True when duration_minutes >= MIN_QUALIFYING_SESSION_MINUTES and status != VOIDED.
      - name: recorded_attendance_count
        type: integer
        source: computed
        description: Count of this session's AttendanceRecord rows with status IN {COUNTED, NOT_COUNTED}.
        default: 0
      - name: status
        type: enum
        source: system
        description: HELD once the first attendance record is filed; VOIDED by cancellation or by a credential DENIED/EXPIRED cascade.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, VOIDED}"
      - name: void_reason_code
        type: enum
        source: system
        description: Reason the session was voided; null while status != VOIDED.
        constraints: "one of {COACH_UNAVAILABLE, WEATHER, VENUE_LOST, CREDENTIAL_DENIED, CREDENTIAL_EXPIRED}"

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK -> PracticeSession.id; set from the create path segment.
      - name: athlete_id
        type: string
        source: input
        description: FK -> Athlete.id.
      - name: minutes_present
        type: integer
        source: input
        description: Minutes the athlete was present; may not exceed the session's duration_minutes.
        constraints: 0..240
      - name: required_minutes
        type: integer
        source: computed
        description: ceil(session.duration_minutes * ATTENDANCE_COUNT_FRACTION), stored at creation so later duration edits cannot rewrite history.
      - name: status
        type: enum
        source: system
        description: COUNTED when the session qualifies and minutes_present >= required_minutes, NOT_COUNTED otherwise, VOIDED once reversed.
        constraints: "one of {COUNTED, NOT_COUNTED, VOIDED}"
      - name: counted_minutes
        type: integer
        source: computed
        description: minutes_present when status == COUNTED, otherwise 0; the conserved quantity behind Program.program_practice_minutes.
        default: 0
      - name: season_id
        type: string
        source: computed
        description: >-
          Denormalised copy of the parent session's season_id so per-season practice aggregation does not
          re-read PracticeSession. Not a foreign-key declaration - the session FK above is authoritative.

  - name: Division
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> SportSeason.id.
      - name: merged_into_division_id
        type: string
        source: computed
        description: FK -> Division.id; self-referential pointer set when this undersized division is merged away (status becomes VOIDED). Null otherwise.
      - name: event_code
        type: string
        source: computed
        description: Event this division contests, copied from the entries that formed it.
      - name: participant_type
        type: enum
        source: computed
        description: Divisions never mix individual athletes with unified teams.
        constraints: "one of {ATHLETE, UNIFIED_TEAM}"
      - name: age_group
        type: enum
        source: computed
        description: Age band of the entries that formed this division.
        constraints: "one of {U12, AGE_12_15, AGE_16_21, AGE_22_29, AGE_30_PLUS}"
      - name: ability_band_high
        type: number
        source: computed
        description: Highest skill_score among this division's live entries (the banding anchor).
      - name: ability_band_low
        type: number
        source: computed
        description: Lowest skill_score among this division's live entries.
      - name: ability_spread_ratio
        type: number
        source: computed
        description: round_half_up(ability_band_high / ability_band_low, 4); must stay <= ABILITY_SPREAD_MAX_RATIO.
      - name: entry_count
        type: integer
        source: computed
        description: Count of CompetitionEntry rows whose division_id == this division and status != VOIDED.
        default: 0
      - name: merged_source_count
        type: integer
        source: computed
        description: Number of divisions merged into this one during the divisioning run.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Compound state derived from live entry_count - VALID at >= DIVISION_MIN_ENTRIES, UNDERSIZED below it, VOIDED when merged away or discarded by redivision.
        default: DRAFT
        constraints: "one of {DRAFT, VALID, UNDERSIZED, VOIDED}"

  - name: CompetitionEntry
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> SportSeason.id.
      - name: division_id
        type: string
        source: computed
        description: FK -> Division.id; null until divisioning assigns it, reset to null by redivision.
      - name: participant_type
        type: enum
        source: input
        description: Selects which table participant_id resolves against.
        constraints: "one of {ATHLETE, UNIFIED_TEAM}"
      - name: participant_id
        type: string
        source: input
        description: >-
          Polymorphic participant reference - resolves to Athlete.id when participant_type == ATHLETE and to
          UnifiedTeam.id when participant_type == UNIFIED_TEAM. Deliberately not a single-target foreign key;
          the server resolves it by participant_type only and never probes the other table.
      - name: event_code
        type: string
        source: input
        description: Event contested, e.g. 100M_DASH; part of the divisioning partition key.
        constraints: 3..32 chars
      - name: skill_score
        type: number
        source: input
        description: Declared qualifying skill score used for ability banding and for the maxing check.
        constraints: "> 0"
      - name: age_on_competition_date
        type: integer
        source: computed
        description: Whole years between the participant's birth date (athlete) or youngest athlete member (unified team) and season.competition_date.
      - name: age_group
        type: enum
        source: computed
        description: Age band derived from age_on_competition_date.
        constraints: "one of {U12, AGE_12_15, AGE_16_21, AGE_22_29, AGE_30_PLUS}"
      - name: seed_rank
        type: integer
        source: computed
        description: Rank inside the assigned division ordered by skill_score DESC, tie-break created_at ASC; null while division_id is null.
      - name: result_value
        type: number
        source: input
        description: Recorded performance - seconds for time-scored sports, points for point-scored sports; null until a result is filed.
      - name: performance_ratio
        type: number
        source: computed
        description: >-
          round_half_up of skill_score / result_value for TIME_LOWER_BETTER sports and of
          result_value / skill_score for POINTS_HIGHER_BETTER sports, 4 decimals; see
          calculations.entry_performance_ratio.
      - name: placement
        type: integer
        source: computed
        description: Direction-aware rank among the division's RESULTED/ADVANCED entries; null until a result is filed.
      - name: advancement_status
        type: enum
        source: computed
        description: Outcome of the advancement waterfall; recomputed for the whole division after every result.
        default: NOT_ADVANCED
        constraints: "one of {NOT_ADVANCED, ADVANCED_STATE, ADVANCED_NATIONAL, INELIGIBLE_MAXING}"
      - name: status
        type: enum
        source: system
        description: Entry lifecycle; DIVISIONED reverts to SUBMITTED on redivision and ADVANCED reverts to RESULTED when a later result takes its slot.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, DIVISIONED, LOCKED, RESULTED, ADVANCED, DISQUALIFIED, VOIDED}"
      - name: disqualification_reason_code
        type: enum
        source: input
        description: Reason recorded when the entry is disqualified at result time.
        constraints: "one of {FALSE_START, LANE_VIOLATION, UNSPORTSMANLIKE, NO_SHOW}"
      - name: void_reason_code
        type: enum
        source: system
        description: Reason the entry was voided by a cascade.
        constraints: "one of {ATHLETE_MEDICAL_HOLD, ATHLETE_WITHDRAWN, ROSTER_NON_COMPLIANT}"

  - name: UnifiedTeam
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> SportSeason.id; set from the create path segment.
      - name: team_name
        type: string
        source: input
        description: Team display name; unique within the season.
        constraints: 3..80 chars
      - name: athlete_ids
        type: array
        source: system
        description: >-
          Array of Athlete.id values in insertion order, appended by POST /unified-teams/{id}/members.
          Not a foreign-key declaration - each element is validated against Athlete on append and the roster is
          read back through this field.
        default: []
      - name: partner_volunteer_ids
        type: array
        source: system
        description: >-
          Array of Volunteer.id values (unified partners) in insertion order, appended by
          POST /unified-teams/{id}/members. Each element must hold a CERTIFIED UNIFIED_PARTNER Credential
          at append time.
        default: []
      - name: athlete_count
        type: integer
        source: computed
        description: Length of athlete_ids.
        default: 0
      - name: partner_count
        type: integer
        source: computed
        description: Length of partner_volunteer_ids.
        default: 0
      - name: age_span_years
        type: integer
        source: computed
        description: max(member age) - min(member age) computed at season.competition_date over all athletes and partners; 0 for an empty or single-member roster.
        default: 0
      - name: roster_status
        type: enum
        source: computed
        description: See calculations.unified_team_composition; only COMPLIANT rosters may hold a competition entry.
        default: FORMING
        constraints: "one of {FORMING, COMPLIANT, NON_COMPLIANT}"

  - name: HealthScreening
    parent: null
    common_fields: true
    fields:
      - name: athlete_id
        type: string
        source: input
        description: FK -> Athlete.id.
      - name: event_name
        type: string
        source: input
        description: Name of the games or health event where the screening happened.
        constraints: 3..120 chars
      - name: discipline
        type: enum
        source: input
        description: Healthy Athletes discipline that performed the screening.
        constraints: "one of {FUNFITNESS, OPENING_EYES, HEALTHY_HEARING, SPECIAL_SMILES, STRONG_MINDS}"
      - name: screened_on
        type: string
        source: input
        description: ISO date of the screening; must be <= clock date.
      - name: finding_severity
        type: enum
        source: input
        description: URGENT findings place the athlete on medical HOLD until the referral is resolved.
        constraints: "one of {ROUTINE, ADVISORY, URGENT}"
      - name: finding_note
        type: string
        source: input
        description: Clinician note recorded with the finding.
        constraints: 0..500 chars
      - name: referral_status
        type: enum
        source: system
        description: Referral follow-up state; FOLLOW_UP_LOGGED can cycle back to REFERRED on re-referral.
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, REFERRED, FOLLOW_UP_LOGGED, ESCALATED, RESOLVED}"
      - name: referral_due_on
        type: string
        source: computed
        description: ISO date = screened_on + URGENT_REFERRAL_DUE_DAYS for URGENT findings and + ADVISORY_REFERRAL_DUE_DAYS for ADVISORY findings; null for ROUTINE. Re-referral resets it to clock date + URGENT_REFERRAL_DUE_DAYS.
      - name: followup_count
        type: integer
        source: system
        description: Number of follow-up actions logged against this referral.
        default: 0
      - name: last_followup_note
        type: string
        source: input
        description: Note recorded with the most recent follow-up action.

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; set from the create path segment.
      - name: donor_name
        type: string
        source: input
        description: Donor or in-kind provider name.
        constraints: 2..120 chars
      - name: contribution_type
        type: enum
        source: input
        description: Selects the recognition algorithm in calculations.contribution_recognized_value.
        constraints: "one of {CASH_PLEDGE, CASH_RECEIPT, IN_KIND_GOODS, IN_KIND_SERVICES, VOLUNTEER_HOURS}"
      - name: designation
        type: enum
        source: input
        description: Restricted purpose; FAMILY_ENGAGEMENT contributions accrue the program match credit.
        constraints: "one of {GENERAL, COMPETITION, HEALTH_SCREENING, FAMILY_ENGAGEMENT}"
      - name: stated_value_cents
        type: integer
        source: input
        description: Donor-stated value in cents; ignored for VOLUNTEER_HOURS where the standard rate applies.
        constraints: 0..100000000
      - name: volunteer_hours
        type: number
        source: input
        description: Hours donated; required when contribution_type == VOLUNTEER_HOURS, otherwise must be omitted.
        constraints: "> 0 when present"
      - name: recognized_value_cents
        type: integer
        source: computed
        description: Recognised value in whole cents per calculations.contribution_recognized_value.
        default: 0
      - name: match_credit_cents
        type: integer
        source: computed
        description: round_half_up(recognized_value_cents * FAMILY_ENGAGEMENT_MATCH_RATE) when designation == FAMILY_ENGAGEMENT and status == RECEIVED, else 0. Rounded per contribution BEFORE summation.
        default: 0
      - name: received_on
        type: string
        source: input
        description: ISO date the pledge was fulfilled; null while status == PLEDGED.
      - name: status
        type: enum
        source: system
        description: PLEDGED only for CASH_PLEDGE; every other type is RECEIVED at creation. VOID is the compensating terminal state.
        constraints: "one of {PLEDGED, RECEIVED, VOID}"
      - name: void_reason_code
        type: enum
        source: input
        description: Reason recorded when the contribution is voided.
        constraints: "one of {DONOR_RESCINDED, DUPLICATE_ENTRY, VALUATION_ERROR, PLEDGE_LAPSED}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # -- Athlete: parallel dimensions. registration_status and medical_status evolve on the same row
  #    from different triggers and are never functions of one another.
  - entity: Athlete
    state_field: registration_status
    initial_state: PENDING_MEDICAL
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_MEDICAL
        to: ACTIVE
        trigger: "POST /medical-forms/{id}/review with decision == APPROVE"
        actor: MedicalReviewer
        preconditions:
          - "form.status == SUBMITTED"
          - "athlete.registration_status == PENDING_MEDICAL"
        side_effects:
          - "sets athlete.registration_expires_on per calculations.athlete_registration_expiry"
          - "sets athlete.current_medical_form_id to the approved form id"
          - "increments Program.active_athlete_count by 1, then recomputes Program.compliance_posture"
        note: "medical_status moves independently in the same request; see the medical_status machine."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /programs/{id}/compliance-sweep (system, step 3)"
        actor: system
        preconditions:
          - "athlete.registration_expires_on < clock date OR the athlete's APPROVED MedicalForm expires_on < clock date"
        side_effects:
          - "decrements Program.active_athlete_count by 1, then recomputes Program.compliance_posture"
          - "athlete keeps cumulative_practice_minutes and counted_session_count unchanged"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /medical-forms/{id}/review with decision == APPROVE on a newer form"
        actor: MedicalReviewer
        preconditions:
          - "form.status == SUBMITTED"
          - "athlete.registration_status == LAPSED"
        side_effects:
          - "recomputes athlete.registration_expires_on from the new form"
          - "sets the previously APPROVED form status to SUPERSEDED"
          - "increments Program.active_athlete_count by 1, then recomputes Program.compliance_posture"
        note: "renewal cycle - LAPSED -> ACTIVE closes the loop opened by ACTIVE -> LAPSED."
      - from: PENDING_MEDICAL
        to: WITHDRAWN
        trigger: "POST /athletes/{id}/withdraw"
        actor: ProgramManager
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "sets athlete.withdrawal_reason_code from the request"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /athletes/{id}/withdraw"
        actor: ProgramManager
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "sets athlete.withdrawal_reason_code from the request"
          - "every CompetitionEntry with participant_type == ATHLETE, participant_id == athlete.id and status IN {SUBMITTED, DIVISIONED, LOCKED} becomes VOIDED with void_reason_code == ATHLETE_WITHDRAWN"
          - "each division that lost an entry recomputes entry_count, ability_band_high, ability_band_low, ability_spread_ratio and status (VALID -> UNDERSIZED when entry_count < DIVISION_MIN_ENTRIES)"
          - "every UnifiedTeam whose athlete_ids contains this athlete recomputes roster_status (COMPLIANT -> NON_COMPLIANT)"
          - "decrements Program.active_athlete_count by 1, then recomputes Program.compliance_posture"
      - from: LAPSED
        to: WITHDRAWN
        trigger: "POST /athletes/{id}/withdraw"
        actor: ProgramManager
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "sets athlete.withdrawal_reason_code from the request"
          - "every CompetitionEntry with participant_id == athlete.id and status IN {SUBMITTED, DIVISIONED, LOCKED} becomes VOIDED with void_reason_code == ATHLETE_WITHDRAWN"

  - entity: Athlete
    state_field: medical_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING_REVIEW
        trigger: "POST /athletes/{id}/medical-forms"
        actor: ProgramManager | Coach
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
          - "athlete has no MedicalForm with status == SUBMITTED"
        side_effects:
          - "creates the MedicalForm in SUBMITTED"
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "POST /medical-forms/{id}/review with decision == APPROVE and restrictions == [NONE]"
        actor: MedicalReviewer
        preconditions:
          - "form.status == SUBMITTED"
          - "form.attestation_cardiac_clearance == true"
        side_effects:
          - "sets form.status = APPROVED, form.approved_at = clock, form.reviewed_by_user_id = X-User-ID"
      - from: PENDING_REVIEW
        to: RESTRICTED
        trigger: "POST /medical-forms/{id}/review with decision == APPROVE and restrictions containing any value other than NONE"
        actor: MedicalReviewer
        preconditions:
          - "form.status == SUBMITTED"
          - "form.attestation_cardiac_clearance == true"
        side_effects:
          - "sets form.status = APPROVED, form.approved_at = clock"
        note: "RESTRICTED athletes are competition-eligible; only HOLD blocks participation."
      - from: PENDING_REVIEW
        to: NONE
        trigger: "POST /medical-forms/{id}/review with decision == REJECT"
        actor: MedicalReviewer
        preconditions:
          - "form.status == SUBMITTED"
        side_effects:
          - "sets form.status = REJECTED and form.rejection_reason_code from the request"
          - "athlete.registration_status is NOT changed by a rejection"
      - from: CLEARED
        to: HOLD
        trigger: "POST /health-screenings with finding_severity == URGENT"
        actor: HealthScreeningLead
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "creates the HealthScreening in REFERRED"
          - "every CompetitionEntry with participant_id == athlete.id and status IN {SUBMITTED, DIVISIONED, LOCKED} becomes VOIDED with void_reason_code == ATHLETE_MEDICAL_HOLD"
          - "each affected division recomputes entry_count, bands and status"
          - "increments Program.unresolved_urgent_referral_count, then recomputes Program.compliance_posture"
      - from: RESTRICTED
        to: HOLD
        trigger: "POST /health-screenings with finding_severity == URGENT"
        actor: HealthScreeningLead
        preconditions:
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "identical cascade to the CLEARED -> HOLD transition"
      - from: HOLD
        to: CLEARED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "screening.referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}"
          - "after this resolution the athlete has zero HealthScreening rows with finding_severity == URGENT and referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}"
          - "the athlete's current_medical_form_id form carries restrictions == [NONE]"
        side_effects:
          - "decrements Program.unresolved_urgent_referral_count, then recomputes Program.compliance_posture"
        note: "compensating transition - voided entries are NOT restored; the coach must file new entries."
      - from: HOLD
        to: RESTRICTED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "same as HOLD -> CLEARED except the athlete's approved form carries at least one restriction other than NONE"
        side_effects:
          - "decrements Program.unresolved_urgent_referral_count, then recomputes Program.compliance_posture"
      - from: HOLD
        to: NONE
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "same as HOLD -> CLEARED except athlete.current_medical_form_id IS NULL (the approved form expired while the athlete was on hold)"
        side_effects:
          - "decrements Program.unresolved_urgent_referral_count, then recomputes Program.compliance_posture"
        note: "the athlete must be re-cleared by a fresh medical form before competing again."
      - from: CLEARED
        to: NONE
        trigger: "POST /programs/{id}/compliance-sweep (system, step 2)"
        actor: system
        preconditions:
          - "the athlete's APPROVED MedicalForm has expires_on < clock date"
        side_effects:
          - "sets that MedicalForm.status = EXPIRED and athlete.current_medical_form_id = null"
      - from: RESTRICTED
        to: NONE
        trigger: "POST /programs/{id}/compliance-sweep (system, step 2)"
        actor: system
        preconditions:
          - "the athlete's APPROVED MedicalForm has expires_on < clock date"
        side_effects:
          - "sets that MedicalForm.status = EXPIRED and athlete.current_medical_form_id = null"

  - entity: MedicalForm
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /medical-forms/{id}/review with decision == APPROVE"
        actor: MedicalReviewer
        preconditions:
          - "form.attestation_cardiac_clearance == true"
          - "athlete.down_syndrome_flag == false OR form.attestation_atlantoaxial_screen == true"
          - "form.exam_date >= clock date - MEDICAL_FORM_VALIDITY_DAYS"
        side_effects:
          - "sets approved_at, reviewed_by_user_id; drives the Athlete medical_status and registration_status transitions"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /medical-forms/{id}/review with decision == REJECT"
        actor: MedicalReviewer
        preconditions:
          - "rejection_reason_code is present in the request"
        side_effects:
          - "sets reviewed_by_user_id; athlete.medical_status returns to NONE"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /medical-forms/{id}/resubmit"
        actor: ProgramManager | Coach
        preconditions:
          - "form.revision_count < MEDICAL_FORM_MAX_REVISIONS"
          - "athlete.registration_status != WITHDRAWN"
        side_effects:
          - "increments revision_count by 1, overwrites the exam/attestation/restriction fields, recomputes expires_on, clears rejection_reason_code"
          - "athlete.medical_status returns to PENDING_REVIEW"
        note: "revision cycle REJECTED -> SUBMITTED -> REJECTED; capped at MEDICAL_FORM_MAX_REVISIONS resubmissions."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /medical-forms/{id}/review approving a newer form for the same athlete (system)"
        actor: system
        preconditions:
          - "a different MedicalForm of the same athlete transitions SUBMITTED -> APPROVED"
        side_effects:
          - "athlete.current_medical_form_id repoints to the newer form"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /programs/{id}/compliance-sweep (system, step 2)"
        actor: system
        preconditions:
          - "expires_on < clock date"
        side_effects:
          - "athlete.medical_status -> NONE and athlete.registration_status ACTIVE -> LAPSED"

  - entity: Credential
    state_field: status
    initial_state: INITIATED
    terminal_states: [DENIED]
    transitions:
      - from: INITIATED
        to: SCREENING_CLEARED
        trigger: "POST /credentials/{id}/screening with result IN {CLEAR, FLAGGED}"
        actor: CredentialingOfficer
        preconditions:
          - "credential.screening_result IS NULL"
          - "completed_on <= clock date"
        side_effects:
          - "stores screening_result, screening_completed_on, screening_vendor_reference, screening_recorded_by_user_id = X-User-ID"
          - "computes screening_expires_on = screening_completed_on + SCREENING_VALIDITY_DAYS"
        note: "screening branch of the fork; the training branch is independent."
      - from: INITIATED
        to: TRAINING_COMPLETE
        trigger: "POST /credentials/{id}/training"
        actor: CredentialingOfficer
        preconditions:
          - "credential.training_completed_on IS NULL"
          - "completed_on <= clock date"
        side_effects:
          - "stores training_completed_on, training_curriculum_code, training_recorded_by_user_id = X-User-ID"
          - "computes training_expires_on = training_completed_on + TRAINING_VALIDITY_DAYS_BY_ROLE[role_class]"
        note: "training branch of the fork."
      - from: SCREENING_CLEARED
        to: READY_TO_CERTIFY
        trigger: "POST /credentials/{id}/training"
        actor: CredentialingOfficer
        preconditions:
          - "credential.training_completed_on IS NULL"
        side_effects:
          - "same training side effects; the fork joins here"
      - from: TRAINING_COMPLETE
        to: READY_TO_CERTIFY
        trigger: "POST /credentials/{id}/screening with result IN {CLEAR, FLAGGED}"
        actor: CredentialingOfficer
        preconditions:
          - "credential.screening_result IS NULL"
        side_effects:
          - "same screening side effects; the fork joins here"
      - from: INITIATED
        to: DENIED
        trigger: "POST /credentials/{id}/screening with result == DISQUALIFYING"
        actor: CredentialingOfficer
        preconditions:
          - "credential.screening_result IS NULL"
        side_effects:
          - "sets denial_reason_code = DISQUALIFYING_SCREENING"
          - "because the credential is DENIED, Volunteer.status becomes INACTIVE when the volunteer holds no other CERTIFIED non-expired credential"
          - "because the credential is DENIED, every PracticeSession with coach_credential_id == credential.id and status IN {SCHEDULED, HELD} becomes VOIDED with void_reason_code == CREDENTIAL_DENIED"
          - "because those sessions are VOIDED, each of their AttendanceRecord rows with status IN {COUNTED, NOT_COUNTED} becomes VOIDED and counted_minutes is set to 0"
          - "because those attendance rows are VOIDED, each affected Athlete decrements cumulative_practice_minutes by the reversed counted_minutes and counted_session_count by the number of reversed COUNTED rows"
          - "because the athlete ledgers changed, Program.program_practice_minutes is recomputed, then Program.compliance_posture is recomputed"
        note: "divergent branch - DISQUALIFYING carries the full reversal cascade that CLEAR/FLAGGED never trigger."
      - from: TRAINING_COMPLETE
        to: DENIED
        trigger: "POST /credentials/{id}/screening with result == DISQUALIFYING"
        actor: CredentialingOfficer
        preconditions:
          - "credential.screening_result IS NULL"
        side_effects:
          - "identical cascade to the INITIATED -> DENIED transition"
      - from: READY_TO_CERTIFY
        to: CERTIFIED
        trigger: "POST /credentials/{id}/certify"
        actor: CredentialingOfficer | ProgramManager
        preconditions:
          - "X-User-ID differs from both screening_recorded_by_user_id and training_recorded_by_user_id"
          - "screening_result != FLAGGED OR flag_override_reason is present and non-empty"
          - "volunteer.is_minor == false OR role_class != COACH"
          - "screening_expires_on >= clock date AND training_expires_on >= clock date"
        side_effects:
          - "sets certified_by_user_id, certified_at = clock and expires_on per calculations.credential_effective_expiry"
          - "Volunteer.status becomes CREDENTIALED"
          - "increments Program.certified_coach_count when role_class == COACH, then recomputes Program.compliance_posture (FROZEN -> OPEN once the first coach is certified)"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /programs/{id}/compliance-sweep (system, step 3)"
        actor: system
        preconditions:
          - "expires_on < clock date"
        side_effects:
          - "Volunteer.status becomes INACTIVE when no other CERTIFIED non-expired credential remains"
          - "because the credential expired, every PracticeSession with this coach_credential_id and status == SCHEDULED whose scheduled_start > clock becomes VOIDED with void_reason_code == CREDENTIAL_EXPIRED"
          - "because those sessions are VOIDED, their AttendanceRecord rows become VOIDED and the athlete/program practice ledgers are decremented accordingly"
          - "decrements Program.certified_coach_count when role_class == COACH; increments Program.expired_credential_count; recomputes Program.compliance_posture"
      - from: EXPIRED
        to: RENEWAL_IN_PROGRESS
        trigger: "POST /credentials/{id}/screening or POST /credentials/{id}/training on an EXPIRED credential"
        actor: CredentialingOfficer
        preconditions:
          - "completed_on > the corresponding previous completion date"
        side_effects:
          - "overwrites the refreshed branch's completion date, expiry and recorded_by user; leaves the other branch untouched"
          - "recomputes Program.expired_credential_count (RENEWAL_IN_PROGRESS still counts as expired) and Program.compliance_posture"
        note: "renewal cycle entry point; both branches must be non-expired before re-certification."
      - from: RENEWAL_IN_PROGRESS
        to: CERTIFIED
        trigger: "POST /credentials/{id}/certify"
        actor: CredentialingOfficer | ProgramManager
        preconditions:
          - "screening_expires_on >= clock date AND training_expires_on >= clock date"
          - "X-User-ID differs from both screening_recorded_by_user_id and training_recorded_by_user_id"
        side_effects:
          - "same as READY_TO_CERTIFY -> CERTIFIED; closes the CERTIFIED -> EXPIRED -> RENEWAL_IN_PROGRESS -> CERTIFIED cycle"
          - "decrements Program.expired_credential_count, recomputes Program.compliance_posture"

  - entity: SportSeason
    state_field: status
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: PRACTICE_OPEN
        trigger: "POST /seasons/{id}/open-practice"
        actor: ProgramManager
        preconditions:
          - "Program.compliance_posture != FROZEN"
          - "Program.certified_coach_count >= 1"
          - "clock date <= season.competition_date"
        side_effects:
          - "increments SportSeason.version by 1"
      - from: PRACTICE_OPEN
        to: DIVISIONED
        trigger: "POST /seasons/{id}/divisioning"
        actor: CompetitionDirector
        preconditions:
          - "Program.compliance_posture == OPEN"
          - "clock date >= season.registration_deadline"
          - "at least one CompetitionEntry of this season has status == SUBMITTED"
        side_effects:
          - "creates Division rows and assigns division_id + seed_rank per calculations.division_assignment"
          - "runs calculations.undersized_division_merge, setting merged_into_division_id / status = VOIDED on merged sources"
          - "every participating CompetitionEntry moves SUBMITTED -> DIVISIONED"
          - "increments divisioning_run_count by 1 and recomputes entry_count / divisioned_entry_count"
          - "increments SportSeason.version by 1"
      - from: DIVISIONED
        to: PRACTICE_OPEN
        trigger: "POST /seasons/{id}/redivision"
        actor: CompetitionDirector
        preconditions:
          - "season.status == DIVISIONED (never from ENTRIES_LOCKED)"
        side_effects:
          - "every Division of this season with status IN {DRAFT, VALID, UNDERSIZED} becomes VOIDED and keeps merged_into_division_id unchanged"
          - "because those divisions are VOIDED, every CompetitionEntry with status == DIVISIONED returns to SUBMITTED with division_id = null and seed_rank = null"
          - "season.divisioned_entry_count becomes 0 while season.entry_count is unchanged (the conserved entry population)"
          - "increments SportSeason.version by 1"
        note: "revert branch of the season pipeline; the compensating counterpart of divisioning."
      - from: DIVISIONED
        to: ENTRIES_LOCKED
        trigger: "POST /seasons/{id}/lock-entries"
        actor: CompetitionDirector
        preconditions:
          - "no Division of this season has status == UNDERSIZED"
          - "every CompetitionEntry of this season with status == DIVISIONED has a non-null division_id"
          - "clock date <= season.competition_date"
        side_effects:
          - "every CompetitionEntry with status == DIVISIONED moves to LOCKED"
          - "increments SportSeason.version by 1"
      - from: ENTRIES_LOCKED
        to: COMPLETED
        trigger: "POST /programs/{id}/compliance-sweep (system, step 5)"
        actor: system
        preconditions:
          - "clock date > season.competition_date"
          - "every CompetitionEntry of this season with status != VOIDED is in {RESULTED, ADVANCED, DISQUALIFIED}"
        side_effects:
          - "increments SportSeason.version by 1"
        note: "auto-transition - there is no operator endpoint that completes a season."

  - entity: PracticeSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /practice-sessions/{id}/attendance-records (first record on the session)"
        actor: Coach | ProgramManager
        preconditions:
          - "session.scheduled_start <= clock"
          - "session.recorded_attendance_count == 0"
        side_effects:
          - "creates the AttendanceRecord and increments recorded_attendance_count"
          - "increments PracticeSession.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /practice-sessions/{id}/cancel"
        actor: ProgramManager | Coach
        preconditions:
          - "session.status IN {SCHEDULED, HELD}"
        side_effects:
          - "sets void_reason_code from the request"
          - "increments PracticeSession.version by 1"
      - from: HELD
        to: VOIDED
        trigger: "POST /practice-sessions/{id}/cancel"
        actor: ProgramManager | Coach
        preconditions:
          - "session.status IN {SCHEDULED, HELD}"
        side_effects:
          - "every AttendanceRecord of this session with status IN {COUNTED, NOT_COUNTED} becomes VOIDED and its counted_minutes is set to 0"
          - "because those records are VOIDED, each Athlete decrements cumulative_practice_minutes by the reversed counted_minutes and counted_session_count by the number of reversed COUNTED rows"
          - "because the athlete ledgers changed, Program.program_practice_minutes is recomputed so that calculations.program_practice_minute_ledger still holds"
          - "increments PracticeSession.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "Credential DENIED or EXPIRED cascade (system)"
        actor: system
        preconditions:
          - "the session's coach_credential_id transitioned to DENIED, or to EXPIRED while scheduled_start > clock"
        side_effects:
          - "sets void_reason_code = CREDENTIAL_DENIED or CREDENTIAL_EXPIRED"
      - from: HELD
        to: VOIDED
        trigger: "Credential DENIED cascade (system)"
        actor: system
        preconditions:
          - "the session's coach_credential_id transitioned to DENIED"
        side_effects:
          - "the same attendance reversal and ledger decrements as an operator cancellation"

  - entity: AttendanceRecord
    state_field: status
    initial_state: "COUNTED or NOT_COUNTED per calculations.attendance_counting_threshold"
    terminal_states: [VOIDED]
    transitions:
      - from: NOT_COUNTED
        to: VOIDED
        trigger: "POST /practice-sessions/{id}/cancel, or a Credential DENIED/EXPIRED cascade (system)"
        actor: ProgramManager | Coach | system
        preconditions:
          - "the parent session transitions to VOIDED"
        side_effects:
          - "no ledger change - counted_minutes was already 0"
      - from: COUNTED
        to: VOIDED
        trigger: "POST /practice-sessions/{id}/cancel, or a Credential DENIED/EXPIRED cascade (system)"
        actor: ProgramManager | Coach | system
        preconditions:
          - "the parent session transitions to VOIDED"
        side_effects:
          - "sets counted_minutes = 0"
          - "decrements Athlete.cumulative_practice_minutes by the pre-void counted_minutes and Athlete.counted_session_count by 1"
          - "recomputes Program.program_practice_minutes"

  - entity: Division
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: VALID
        trigger: "POST /seasons/{id}/divisioning (system, banding pass)"
        actor: system
        preconditions:
          - "live entry_count >= DIVISION_MIN_ENTRIES"
        side_effects:
          - "sets ability_band_high, ability_band_low, ability_spread_ratio, age_group, event_code, participant_type"
      - from: DRAFT
        to: UNDERSIZED
        trigger: "POST /seasons/{id}/divisioning (system, banding pass)"
        actor: system
        preconditions:
          - "live entry_count < DIVISION_MIN_ENTRIES"
        side_effects:
          - "the division becomes a merge candidate for calculations.undersized_division_merge"
      - from: UNDERSIZED
        to: VALID
        trigger: "POST /seasons/{id}/divisioning (system, merge pass - this division is the merge target)"
        actor: system
        preconditions:
          - "an undersized source division is merged into this one and the resulting live entry_count >= DIVISION_MIN_ENTRIES"
        side_effects:
          - "increments merged_source_count and recomputes bands, ability_spread_ratio and entry_count from live entries"
        note: "a division that received a merge is not re-evaluated as a merge source in the same run."
      - from: UNDERSIZED
        to: VOIDED
        trigger: "POST /seasons/{id}/divisioning (system, merge pass - this division is the merge source)"
        actor: system
        preconditions:
          - "a merge target was selected for this division"
        side_effects:
          - "sets merged_into_division_id to the target division id"
          - "because this division is voided, each of its entries repoints division_id to the target and the target recomputes entry_count/bands/status"
      - from: VALID
        to: UNDERSIZED
        trigger: "Athlete withdrawal or urgent-referral cascade (system)"
        actor: system
        preconditions:
          - "an entry of this division became VOIDED and live entry_count dropped below DIVISION_MIN_ENTRIES"
        side_effects:
          - "recomputes bands and ability_spread_ratio from the remaining live entries"
          - "blocks POST /seasons/{id}/lock-entries until the season is redivisioned"
      - from: VALID
        to: VOIDED
        trigger: "POST /seasons/{id}/redivision"
        actor: CompetitionDirector
        preconditions:
          - "season.status == DIVISIONED"
        side_effects:
          - "its entries return to SUBMITTED with division_id = null"
      - from: UNDERSIZED
        to: VOIDED
        trigger: "POST /seasons/{id}/redivision"
        actor: CompetitionDirector
        preconditions:
          - "season.status == DIVISIONED"
        side_effects:
          - "its entries return to SUBMITTED with division_id = null"

  - entity: CompetitionEntry
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DISQUALIFIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: DIVISIONED
        trigger: "POST /seasons/{id}/divisioning"
        actor: CompetitionDirector
        preconditions:
          - "entry.status == SUBMITTED and entry.division_id IS NULL"
        side_effects:
          - "sets division_id, seed_rank"
      - from: DIVISIONED
        to: SUBMITTED
        trigger: "POST /seasons/{id}/redivision"
        actor: CompetitionDirector
        preconditions:
          - "season.status == DIVISIONED"
        side_effects:
          - "clears division_id and seed_rank"
        note: "divisioning cycle SUBMITTED -> DIVISIONED -> SUBMITTED."
      - from: DIVISIONED
        to: LOCKED
        trigger: "POST /seasons/{id}/lock-entries"
        actor: CompetitionDirector
        preconditions:
          - "entry.division_id IS NOT NULL and its division.status == VALID"
        side_effects: []
      - from: LOCKED
        to: RESULTED
        trigger: "POST /competition-entries/{id}/result with disqualified == false"
        actor: CompetitionDirector
        preconditions:
          - "season.status == ENTRIES_LOCKED"
          - "clock date >= season.competition_date"
          - "result_value > 0"
        side_effects:
          - "computes performance_ratio per calculations.entry_performance_ratio"
          - "recomputes placement for every entry of the division with status IN {RESULTED, ADVANCED}"
          - "recomputes advancement_status for the whole division per calculations.advancement_waterfall"
      - from: LOCKED
        to: DISQUALIFIED
        trigger: "POST /competition-entries/{id}/result with disqualified == true"
        actor: CompetitionDirector
        preconditions:
          - "disqualification_reason_code is present"
        side_effects:
          - "performance_ratio and placement stay null; the entry is excluded from placement and from the advancement waterfall"
          - "recomputes placement and advancement_status for the division's remaining RESULTED/ADVANCED entries"
      - from: RESULTED
        to: ADVANCED
        trigger: "POST /competition-entries/{id}/result (system, advancement waterfall over the division)"
        actor: system
        preconditions:
          - "advancement_status IN {ADVANCED_STATE, ADVANCED_NATIONAL} after the waterfall"
        side_effects: []
      - from: ADVANCED
        to: RESULTED
        trigger: "POST /competition-entries/{id}/result on a sibling entry (system, waterfall recompute)"
        actor: system
        preconditions:
          - "the sibling's result pushes this entry's placement beyond season.advancement_slots_per_division"
        side_effects:
          - "resets advancement_status to NOT_ADVANCED"
        note: "advancement cycle RESULTED -> ADVANCED -> RESULTED; slots are never over-allocated."
      - from: SUBMITTED
        to: VOIDED
        trigger: "Athlete HOLD / withdrawal cascade (system)"
        actor: system
        preconditions:
          - "the participating athlete moved to medical_status HOLD or registration_status WITHDRAWN"
        side_effects:
          - "sets void_reason_code and decrements season.entry_count"
      - from: DIVISIONED
        to: VOIDED
        trigger: "Athlete HOLD / withdrawal cascade (system)"
        actor: system
        preconditions:
          - "the participating athlete moved to medical_status HOLD or registration_status WITHDRAWN"
        side_effects:
          - "sets void_reason_code, clears nothing else, and forces the division to recompute entry_count/bands/status"
      - from: LOCKED
        to: VOIDED
        trigger: "Athlete HOLD / withdrawal cascade (system)"
        actor: system
        preconditions:
          - "the participating athlete moved to medical_status HOLD or registration_status WITHDRAWN"
        side_effects:
          - "sets void_reason_code and forces the division to recompute entry_count/bands/status"

  - entity: HealthScreening
    state_field: referral_status
    initial_state: "NOT_REQUIRED for ROUTINE findings, REFERRED for ADVISORY and URGENT findings"
    terminal_states: [NOT_REQUIRED, RESOLVED]
    transitions:
      - from: REFERRED
        to: FOLLOW_UP_LOGGED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == LOGGED"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status IN {REFERRED, ESCALATED}"
        side_effects:
          - "increments followup_count and stores last_followup_note"
      - from: ESCALATED
        to: FOLLOW_UP_LOGGED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == LOGGED"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status IN {REFERRED, ESCALATED}"
        side_effects:
          - "increments followup_count and stores last_followup_note"
      - from: FOLLOW_UP_LOGGED
        to: REFERRED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == REREFER"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status == FOLLOW_UP_LOGGED"
        side_effects:
          - "increments followup_count and resets referral_due_on = clock date + URGENT_REFERRAL_DUE_DAYS"
        note: "referral cycle REFERRED -> FOLLOW_UP_LOGGED -> REFERRED; the athlete stays on HOLD throughout."
      - from: REFERRED
        to: ESCALATED
        trigger: "POST /programs/{id}/compliance-sweep (system, step 4)"
        actor: system
        preconditions:
          - "referral_due_on < clock date"
        side_effects:
          - "the screening still counts toward Program.unresolved_urgent_referral_count"
      - from: REFERRED
        to: RESOLVED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}"
        side_effects:
          - "when finding_severity == URGENT and no other unresolved urgent screening remains, Athlete.medical_status leaves HOLD and Program.unresolved_urgent_referral_count is decremented, then Program.compliance_posture is recomputed"
      - from: FOLLOW_UP_LOGGED
        to: RESOLVED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}"
        side_effects:
          - "same release cascade as REFERRED -> RESOLVED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /health-screenings/{id}/referral-followup with outcome == RESOLVED"
        actor: HealthScreeningLead
        preconditions:
          - "referral_status IN {REFERRED, FOLLOW_UP_LOGGED, ESCALATED}"
        side_effects:
          - "same release cascade as REFERRED -> RESOLVED"

  - entity: Contribution
    state_field: status
    initial_state: "PLEDGED for contribution_type == CASH_PLEDGE, RECEIVED for every other type"
    terminal_states: [VOID]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /contributions/{id}/fulfill"
        actor: ProgramManager
        preconditions:
          - "status == PLEDGED"
          - "received_on <= clock date"
        side_effects:
          - "decrements Program.pledged_support_cents by recognized_value_cents and increments Program.recognized_support_cents by the same amount (total committed support is conserved)"
          - "when designation == FAMILY_ENGAGEMENT sets match_credit_cents = round_half_up(recognized_value_cents * FAMILY_ENGAGEMENT_MATCH_RATE) and adds exactly that integer to Program.family_engagement_credit_cents"
      - from: PLEDGED
        to: VOID
        trigger: "POST /contributions/{id}/void"
        actor: ProgramManager
        preconditions:
          - "status IN {PLEDGED, RECEIVED}"
        side_effects:
          - "decrements Program.pledged_support_cents by recognized_value_cents"
      - from: RECEIVED
        to: VOID
        trigger: "POST /contributions/{id}/void"
        actor: ProgramManager
        preconditions:
          - "status IN {PLEDGED, RECEIVED}"
        side_effects:
          - "decrements Program.recognized_support_cents by recognized_value_cents"
          - "decrements Program.family_engagement_credit_cents by this row's stored match_credit_cents (the same integer that was added), then sets match_credit_cents = 0 - no rounding drift is possible"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: attendance-create-stale-session
    parent_entity: PracticeSession
    write_endpoint: "POST /practice-sessions/{id}/attendance-records"
    occ_field: "expected_session_version"
    description: |
      Filing an attendance record against a PracticeSession whose version has advanced since the
      client last observed it is rejected. Two different athletes may both legitimately be recorded
      on the same session, so a request that carries a stale session version is not covered by any
      state precondition - the writer's view of the session (its capacity consumption and its
      SCHEDULED/HELD status) is simply out of date and must be re-read.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
  - rule_id: team-member-add-stale-team
    parent_entity: UnifiedTeam
    write_endpoint: "POST /unified-teams/{id}/members"
    occ_field: "expected_team_version"
    description: |
      Appending a member to a UnifiedTeam whose version has advanced since the client last observed
      it is rejected. Adding a second athlete or a second partner is legitimate on its own, so no
      state precondition covers the case; the stale version signals that the roster the writer
      reasoned about (its counts, its age span and therefore its roster_status) no longer exists.
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: credential_effective_expiry
    trigger: "POST /credentials/{id}/certify (transitions READY_TO_CERTIFY -> CERTIFIED and RENEWAL_IN_PROGRESS -> CERTIFIED); writes Credential.expires_on"
    algorithm: threshold
    formula: |
      screening_expires_on = screening_completed_on + SCREENING_VALIDITY_DAYS
      training_expires_on   = training_completed_on  + TRAINING_VALIDITY_DAYS_BY_ROLE[credential.role_class]
      base_expiry = min(screening_expires_on, training_expires_on)
      if credential.screening_result == "FLAGGED":
          expires_on = min(base_expiry, date(certified_at) + FLAGGED_REVIEW_DAYS)
      else:
          expires_on = base_expiry
      # all three inputs are calendar dates; day arithmetic only, no time-of-day component.
    input_set: >-
      Exactly the two branch completion dates stored on this Credential plus its role_class and
      screening_result. Screening/training dates recorded on other credentials of the same volunteer are
      never consulted.
    constants:
      SCREENING_VALIDITY_DAYS: 1095
      TRAINING_VALIDITY_DAYS_BY_ROLE: { COACH: 365, UNIFIED_PARTNER: 730, GENERAL_VOLUNTEER: 1095 }
      FLAGGED_REVIEW_DAYS: 365
    precision: "whole calendar days; no rounding"
    variants:
      - name: coach_track
        when: "role_class == COACH - annual protective-behaviours refresh"
        difference: "training validity is 365 days, so the training branch almost always dominates the min()"
      - name: unified_partner_track
        when: "role_class == UNIFIED_PARTNER"
        difference: "training validity is 730 days; with identical completion dates the credential expires 365 days later than a COACH credential"
      - name: flagged_screening_track
        when: "screening_result == FLAGGED"
        difference: "a third term (certification date + 365) enters the min(), shortening the credential regardless of the branch dates"

  - name: athlete_registration_expiry
    trigger: "POST /medical-forms/{id}/review with decision == APPROVE; writes Athlete.registration_expires_on"
    algorithm: threshold
    formula: |
      medical_expires_on      = form.exam_date + MEDICAL_FORM_VALIDITY_DAYS
      registration_expires_on = min(medical_expires_on, date(clock_at_approval) + REGISTRATION_VALIDITY_DAYS)
    input_set: "The single MedicalForm being approved and the logical clock at approval time. SUPERSEDED and EXPIRED forms are ignored."
    constants:
      MEDICAL_FORM_VALIDITY_DAYS: 1095
      REGISTRATION_VALIDITY_DAYS: 365
    precision: "whole calendar days; no rounding"

  - name: attendance_counting_threshold
    trigger: "POST /practice-sessions/{id}/attendance-records; writes AttendanceRecord.required_minutes, status and counted_minutes"
    algorithm: threshold
    formula: |
      required_minutes = ceil(session.duration_minutes * ATTENDANCE_COUNT_FRACTION)
      qualifies        = session.duration_minutes >= MIN_QUALIFYING_SESSION_MINUTES
      if qualifies and minutes_present >= required_minutes:   # inclusive lower bound
          status = "COUNTED";     counted_minutes = minutes_present
      else:
          status = "NOT_COUNTED"; counted_minutes = 0
    input_set: "Only the parent session's duration_minutes and this request's minutes_present. required_minutes is frozen on the row at creation."
    constants:
      MIN_QUALIFYING_SESSION_MINUTES: 45
      ATTENDANCE_COUNT_FRACTION: 0.75
    precision: "integer minutes; ceil() on the product, comparison is >= (a 50-minute session requires exactly 38 minutes, 37 is NOT_COUNTED)"

  - name: season_practice_eligibility
    trigger: "POST /competition-entries (validation gate for participant_type == ATHLETE); not persisted"
    algorithm: aggregation
    formula: |
      rows = AttendanceRecord where
                 athlete_id == athlete.id
             AND status == "COUNTED"                      # VOIDED and NOT_COUNTED excluded
             AND season_id == season.id                   # denormalised season pointer
             AND session.status == "HELD"                 # VOIDED sessions excluded
             AND session.scheduled_start <= clock         # inclusive upper bound
      counted_sessions = count(rows)
      counted_minutes  = sum(rows.counted_minutes)
      eligible = counted_sessions >= season.practice_minimum_sessions
             AND counted_minutes  >= season.practice_minimum_minutes
    input_set: >-
      (a) source entity AttendanceRecord filtered to status == COUNTED and parent session status == HELD;
      (b) window: sessions of this season with scheduled_start <= clock (upper bound inclusive, no lower
      bound beyond the season pointer); (c) order-insensitive - count and sum need no tie-break.
    constants: {}
    precision: "integer minutes and counts; both comparisons are >= so hitting the minimum exactly is eligible"

  - name: program_practice_minute_ledger
    trigger: "every AttendanceRecord create, every AttendanceRecord VOIDED cascade, and step 6 of the compliance sweep; writes Athlete.cumulative_practice_minutes, Athlete.counted_session_count and Program.program_practice_minutes"
    algorithm: aggregation
    formula: |
      # per athlete
      athlete.cumulative_practice_minutes = sum(r.counted_minutes for r in AttendanceRecord
                                                where r.athlete_id == athlete.id and r.status == "COUNTED")
      athlete.counted_session_count       = count(r for r in AttendanceRecord
                                                where r.athlete_id == athlete.id and r.status == "COUNTED")
      # per program - the conserved quantity
      program.program_practice_minutes    = sum(a.cumulative_practice_minutes
                                                for a in Athlete where a.program_id == program.id)
      # invariant that every forward action and its compensating action must preserve:
      program.program_practice_minutes == sum(r.counted_minutes for r in AttendanceRecord
                                              where r.status == "COUNTED"
                                                and r.athlete.program_id == program.id)
    input_set: "AttendanceRecord rows with status == COUNTED only; WITHDRAWN athletes still contribute their historical minutes."
    constants: {}
    precision: "integer minutes; increments and decrements are exact, never recomputed from wall-clock"

  - name: program_compliance_posture
    trigger: "every mutation that changes a Credential status, a HealthScreening referral_status, or an Athlete registration_status, and step 6 of the compliance sweep; writes Program.compliance_posture and its four input counters"
    algorithm: threshold
    formula: |
      certified_coach_count = count(c in Credential where c.volunteer.program_id == program.id
                                    and c.role_class == "COACH" and c.status == "CERTIFIED"
                                    and c.expires_on >= date(clock))
      denominator = count(c in Credential where c.volunteer.program_id == program.id
                          and c.status in {INITIATED, SCREENING_CLEARED, TRAINING_COMPLETE,
                                           READY_TO_CERTIFY, CERTIFIED, EXPIRED, RENEWAL_IN_PROGRESS})
      expired = count(c in that same set where c.status in {EXPIRED, RENEWAL_IN_PROGRESS})
      expired_credential_ratio = 0.0000 if denominator == 0
                                 else round_half_up(expired / denominator, 4)
      urgent = count(h in HealthScreening where h.athlete.program_id == program.id
                     and h.finding_severity == "URGENT"
                     and h.referral_status in {REFERRED, FOLLOW_UP_LOGGED, ESCALATED})
      if certified_coach_count == 0 or expired_credential_ratio >= POSTURE_FROZEN_EXPIRED_RATIO:
          posture = "FROZEN"
      elif expired_credential_ratio >= POSTURE_RESTRICTED_EXPIRED_RATIO or urgent >= 1:
          posture = "RESTRICTED"
      else:
          posture = "OPEN"
    input_set: >-
      Credential rows reached through Volunteer.program_id with the status sets spelled out above (DENIED
      credentials are excluded from both numerator and denominator) and HealthScreening rows reached
      through Athlete.program_id.
    constants:
      POSTURE_RESTRICTED_EXPIRED_RATIO: 0.20
      POSTURE_FROZEN_EXPIRED_RATIO: 0.50
    precision: "ratio rounded half-up to 4 decimals BEFORE comparison; both comparisons are >= (1 expired of 5 = 0.2000 is RESTRICTED, 2 of 9 = 0.2222 is RESTRICTED, 1 of 6 = 0.1667 is not)"

  - name: division_assignment
    trigger: "POST /seasons/{id}/divisioning (banding pass); creates Division rows and writes CompetitionEntry.division_id and seed_rank"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter - the candidate set
      candidates = CompetitionEntry where season_id == season.id
                                      and status == "SUBMITTED"
                                      and division_id IS NULL
      # (b) partition key - divisions never mix these three axes
      for each partition in group_by(candidates, (participant_type, event_code, age_group)):
          # (c) ranking expression, (d) tie-break
          ordered = sort(partition, key=(-skill_score, created_at))     # skill_score DESC, created_at ASC
          open_division = None
          for entry in ordered:
              if open_division is None:
                  open_division = new Division(anchor=entry.skill_score)   # ability_band_high = anchor
                  band_floor = round_half_up(anchor / ABILITY_SPREAD_MAX_RATIO, 4)
              if entry.skill_score >= band_floor and open_division.entry_count < DIVISION_MAX_ENTRIES:
                  assign entry to open_division
              else:
                  close(open_division)          # ability_band_low = lowest assigned skill_score
                  open_division = new Division(anchor=entry.skill_score)
                  band_floor = round_half_up(anchor / ABILITY_SPREAD_MAX_RATIO, 4)
                  assign entry to open_division
          close(open_division)
      # (e) status from live count
      division.status = "VALID" if division.entry_count >= DIVISION_MIN_ENTRIES else "UNDERSIZED"
      # (f) seeding, applied after the merge pass has settled
      for division in live divisions:
          seed_rank = rank of entry within division by (skill_score DESC, created_at ASC), starting at 1
    input_set: >-
      Only SUBMITTED entries with a null division_id. VOIDED entries and entries already carrying a
      division are excluded. age_group comes from the entry's frozen age_on_competition_date.
    constants:
      ABILITY_SPREAD_MAX_RATIO: 1.15
      DIVISION_MIN_ENTRIES: 3
      DIVISION_MAX_ENTRIES: 8
    precision: >-
      band_floor rounded half-up to 4 decimals then compared with >=, so an entry whose
      anchor/skill_score ratio is exactly 1.15 stays in the division (anchor 20.0 gives band_floor
      17.3913 and a 17.3913 entry is admitted). Empty candidate set is rejected upstream with
      ERR_NO_ELIGIBLE_ENTRIES rather than producing zero divisions.

  - name: undersized_division_merge
    trigger: "POST /seasons/{id}/divisioning (merge pass, immediately after the banding pass); writes Division.merged_into_division_id, Division.status, Division.merged_source_count and CompetitionEntry.division_id"
    algorithm: constraint_propagation
    formula: |
      snapshot = the (entry_count, ability_band_high, ability_band_low, status) of every division
                 produced by the banding pass, captured BEFORE any merge in this run mutates them
      sources  = divisions with snapshot.status == "UNDERSIZED",
                 processed in ascending (AGE_GROUP_ORDINAL[age_group], ability_band_low, created_at)
      received_a_merge = empty set
      for source in sources:
          if source in received_a_merge: continue        # never a source after being a target
          # eligibility filter over targets
          targets = divisions t where t.id != source.id
                    and t.season_id == source.season_id
                    and t.participant_type == source.participant_type
                    and t.event_code == source.event_code
                    and t.status in {VALID, UNDERSIZED}            # VOIDED targets excluded
                    and abs(AGE_GROUP_ORDINAL[t.age_group] - AGE_GROUP_ORDINAL[source.age_group]) <= 1
                    and t.live_entry_count + source.live_entry_count <= DIVISION_MAX_ENTRIES
                    and round_half_up(max(t.ability_band_high, source.ability_band_high)
                                      / min(t.ability_band_low, source.ability_band_low), 4)
                        <= ABILITY_SPREAD_MAX_RATIO
          # ranking expression, then tie-breaks
          target = first of sort(targets, key=(abs(t.ability_band_high - source.ability_band_high),
                                               abs(AGE_GROUP_ORDINAL[t.age_group]
                                                   - AGE_GROUP_ORDINAL[source.age_group]),
                                               t.created_at))
          if target is None:                              # empty-pool fallback
              source keeps status "UNDERSIZED"             # no error here; lock-entries rejects later
              continue
          move every live entry of source to target
          source.status = "VOIDED"; source.merged_into_division_id = target.id
          target.merged_source_count += 1
          recompute target.entry_count / ability_band_high / ability_band_low /
                    ability_spread_ratio from its LIVE entries
          target.status = "VALID" if target.entry_count >= DIVISION_MIN_ENTRIES else "UNDERSIZED"
          received_a_merge.add(target)
    input_set: >-
      Divisions of this season only. Target eligibility is evaluated against LIVE counts and bands (so a
      target that already absorbed a merge in this run is measured post-merge), while the SOURCE LIST and
      each source's own counts come from the pre-merge snapshot - this pins the otherwise circular
      dependency between "which divisions are undersized" and "which merges happened".
    constants:
      ABILITY_SPREAD_MAX_RATIO: 1.15
      DIVISION_MIN_ENTRIES: 3
      DIVISION_MAX_ENTRIES: 8
      AGE_GROUP_ORDINAL: { U12: 0, AGE_12_15: 1, AGE_16_21: 2, AGE_22_29: 3, AGE_30_PLUS: 4 }
    precision: "spread ratio rounded half-up to 4 decimals then compared with <=; a merged ratio of exactly 1.1500 is allowed"

  - name: entry_performance_ratio
    trigger: "POST /competition-entries/{id}/result with disqualified == false; writes CompetitionEntry.performance_ratio"
    algorithm: weighted_scoring
    formula: |
      direction = "TIME_LOWER_BETTER"   if season.sport in {ATHLETICS, SWIMMING}
                  else "POINTS_HIGHER_BETTER"     # BOCCE, BASKETBALL
      if direction == "TIME_LOWER_BETTER":
          performance_ratio = round_half_up(entry.skill_score / entry.result_value, 4)
      else:
          performance_ratio = round_half_up(entry.result_value / entry.skill_score, 4)
      # in both directions a ratio > 1 means the athlete outperformed the declared score
    input_set: "The single entry's skill_score and result_value plus the season's sport. Sibling entries never enter this formula."
    constants: {}
    precision: "round_half_up to 4 decimals"
    variants:
      - name: time_lower_better
        when: "season.sport IN {ATHLETICS, SWIMMING} - result_value is seconds"
        difference: "ratio is skill_score / result_value; skill_score 40 with result_value 44 yields 0.9091"
      - name: points_higher_better
        when: "season.sport IN {BOCCE, BASKETBALL} - result_value is points"
        difference: "ratio is result_value / skill_score; the same 40/44 pair yields 1.1000, a different number from identical inputs"

  - name: advancement_waterfall
    trigger: "POST /competition-entries/{id}/result (after the ratio is computed, for every entry of the division); writes CompetitionEntry.placement, advancement_status and status"
    algorithm: waterfall_allocation
    formula: |
      pool = entries of this division with status in {RESULTED, ADVANCED}    # DISQUALIFIED excluded
      if direction == "TIME_LOWER_BETTER":
          ordered = sort(pool, key=(result_value ASC, created_at ASC))
      else:
          ordered = sort(pool, key=(result_value DESC, created_at ASC))
      placement = 1..n in that order
      # maxing check comes first and is strict
      for e in ordered:
          e.advancement_status = "INELIGIBLE_MAXING" if e.performance_ratio > MAXING_RATIO_THRESHOLD
                                 else "NOT_ADVANCED"
      slots = season.advancement_slots_per_division
      for e in ordered:                      # waterfall - a maxed entry never consumes a slot
          if slots == 0: break
          if e.advancement_status == "INELIGIBLE_MAXING": continue
          e.advancement_status = ADVANCEMENT_TARGET[season.games_level]
          e.status = "ADVANCED"
          slots -= 1
      for e in pool where e.advancement_status == "NOT_ADVANCED" and e.status == "ADVANCED":
          e.status = "RESULTED"              # slot revoked by a better sibling result
    input_set: >-
      All entries of the same division with status IN {RESULTED, ADVANCED}; LOCKED entries with no result
      yet and DISQUALIFIED entries are excluded from both the ordering and the slot allocation.
    constants:
      MAXING_RATIO_THRESHOLD: 1.20
      ADVANCEMENT_TARGET: { LOCAL: ADVANCED_STATE, STATE: ADVANCED_NATIONAL, NATIONAL: NOT_ADVANCED }
    precision: >-
      the maxing comparison is strictly greater-than on the 4-decimal ratio, so exactly 1.2000 is NOT
      maxing and still advances; ADVANCEMENT_TARGET[NATIONAL] is NOT_ADVANCED because national games are
      the terminal level, and such entries consume no slot.

  - name: unified_team_composition
    trigger: "POST /unified-teams/{id}/members and any cascade that changes a member athlete's status; writes UnifiedTeam.athlete_count, partner_count, age_span_years and roster_status"
    algorithm: aggregation
    formula: |
      athlete_count = len(athlete_ids)
      partner_count = len(partner_volunteer_ids)
      ages = [whole_years(a.birth_date,      season.competition_date) for a in athletes]
           + [whole_years(v.date_of_birth,   season.competition_date) for v in partners]
      age_span_years = 0 if len(ages) <= 1 else max(ages) - min(ages)
      if athlete_count == 0 or partner_count == 0:
          roster_status = "FORMING"
      elif athlete_count == partner_count
           and athlete_count >= UNIFIED_MIN_ATHLETES
           and age_span_years <= UNIFIED_AGE_SPAN_MAX_YEARS
           and every athlete has registration_status == "ACTIVE"
                                and medical_status in {CLEARED, RESTRICTED}
           and every partner holds a Credential with role_class == "UNIFIED_PARTNER",
                                status == "CERTIFIED" and expires_on >= date(clock):
          roster_status = "COMPLIANT"
      else:
          roster_status = "NON_COMPLIANT"
    input_set: "The team's own two id arrays resolved against Athlete and Volunteer/Credential; ages are measured at the season's competition_date, never at the clock."
    constants:
      UNIFIED_MIN_ATHLETES: 2
      UNIFIED_AGE_SPAN_MAX_YEARS: 5
    precision: "whole years (birthday-aware floor); age_span comparison is <= so a span of exactly 5 years is compliant"

  - name: contribution_recognized_value
    trigger: "POST /programs/{id}/contributions; writes Contribution.recognized_value_cents"
    algorithm: tiered_pricing
    formula: |
      if contribution_type in {CASH_PLEDGE, CASH_RECEIPT}:
          recognized_value_cents = stated_value_cents
      elif contribution_type == "IN_KIND_GOODS":
          recognized_value_cents = min(stated_value_cents, IN_KIND_GOODS_CAP_CENTS)
      elif contribution_type == "IN_KIND_SERVICES":
          recognized_value_cents = round_half_up(stated_value_cents * IN_KIND_SERVICES_RECOGNITION_RATE)
      else:   # VOLUNTEER_HOURS - stated_value_cents is ignored entirely
          recognized_value_cents = round_half_up(volunteer_hours * VOLUNTEER_HOUR_RATE_CENTS)
    input_set: "The single contribution being created; no aggregation."
    constants:
      IN_KIND_GOODS_CAP_CENTS: 500000
      IN_KIND_SERVICES_RECOGNITION_RATE: 0.80
      VOLUNTEER_HOUR_RATE_CENTS: 3348
    precision: "whole cents, round_half_up"
    variants:
      - name: in_kind_goods_cap
        when: "contribution_type == IN_KIND_GOODS"
        difference: "value is capped, not discounted - stated 600000 recognises 500000"
      - name: in_kind_services_discount
        when: "contribution_type == IN_KIND_SERVICES"
        difference: "value is discounted 20% with no cap - the same stated 600000 recognises 480000, a different number from identical input"

  - name: family_engagement_match_credit
    trigger: "POST /programs/{id}/contributions, POST /contributions/{id}/fulfill and POST /contributions/{id}/void; writes Contribution.match_credit_cents and Program.family_engagement_credit_cents"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each contribution's match to whole cents FIRST, then sum.
      per_row_match(c) = round_half_up(c.recognized_value_cents * FAMILY_ENGAGEMENT_MATCH_RATE)
                         if c.designation == "FAMILY_ENGAGEMENT" and c.status == "RECEIVED" else 0
      c.match_credit_cents = per_row_match(c)
      program.family_engagement_credit_cents = sum(c.match_credit_cents
                                                   for c in program contributions where c.status == "RECEIVED")
      # REJECTED alternative (must NOT be implemented):
      #   round_half_up(sum(c.recognized_value_cents) * FAMILY_ENGAGEMENT_MATCH_RATE)
      # Three RECEIVED family-engagement contributions of 12345 cents each give
      #   round-then-sum = 1235 * 3 = 3705      (correct)
      #   sum-then-round = round(37035 * 0.10) = 3704   (wrong, off by one cent)
    input_set: "Contribution rows of this program with designation == FAMILY_ENGAGEMENT and status == RECEIVED; PLEDGED and VOID rows contribute 0."
    constants:
      FAMILY_ENGAGEMENT_MATCH_RATE: 0.10
    precision: "whole cents, round_half_up, applied per contribution BEFORE summation"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
# Priority bands
#   1        authentication
#   2        role authorization
#   3        path/body existence, left-to-right
#   4        request schema, enums, numeric ranges
#   5        ownership and segregation of duties
#   6        state preconditions of the target resource
#   7        program compliance posture gate
#   8        business_safety   - medical, health, protective behaviours
#   9        business_temporal - deadlines, windows, overlaps
#   10       business_referential - cross-entity credential/roster integrity
#   11       business_constraint  - composition, spread, uniqueness
#   12       business_fiscal      - slots, budgets, capacity
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and naming a role declared in §1.7; X-User-ID present on every write"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the X-Role value appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path id resolves, checked left to right; body FKs checked after path ids in declaration order"
    error_id: ERR_PROGRAM_NOT_FOUND | ERR_ATHLETE_NOT_FOUND | ERR_MEDICAL_FORM_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_DIVISION_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_CONTRIBUTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters or body foreign keys"

  - priority: 3
    category: existence
    check: "for POST /competition-entries the polymorphic participant_id resolves in the collection named by participant_type (ATHLETE -> Athlete, UNIFIED_TEAM -> UnifiedTeam) and belongs to the same program as the season"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /competition-entries"

  - priority: 4
    category: business_constraint
    check: >-
      request body parses, required inputs present, unknown enum members rejected, numbers inside their
      declared ranges (duration_minutes 30..240, capacity_slots >= 1, minutes_present >= 0,
      skill_score > 0, result_value > 0, stated_value_cents >= 0, volunteer_hours >= 0,
      practice_minimum_* >= 0, entry_slot_budget >= 1, advancement_slots_per_division >= 0),
      dates are ISO-8601, and system/computed fields present in the body are ignored rather than honoured
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "POST /programs/{id}/contributions with contribution_type == VOLUNTEER_HOURS supplies volunteer_hours > 0"
    error_id: ERR_VOLUNTEER_HOURS_REQUIRED
    http_status: 400
    applies_to: "POST /programs/{id}/contributions"

  - priority: 4
    category: business_temporal
    check: "POST /programs/{id}/seasons requires registration_deadline < divisioning_date < competition_date"
    error_id: ERR_SEASON_DATE_ORDER
    http_status: 400
    applies_to: "POST /programs/{id}/seasons"

  - priority: 5
    category: auth
    check: >-
      the X-User-ID that recorded a credential's background screening or protective-behaviours training
      may not be the X-User-ID that certifies it, and a single user may not record both the screening and
      the training for the same credential
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credentials/{id}/screening, POST /credentials/{id}/training, POST /credentials/{id}/certify"

  - priority: 5
    category: auth
    check: >-
      when X-Role is Coach the acting volunteer (resolved from X-User-ID) must hold the CERTIFIED COACH
      credential named by coach_credential_id on the session being created or cancelled
    error_id: ERR_NOT_CREDENTIAL_OWNER
    http_status: 403
    applies_to: "POST /practice-sessions, POST /practice-sessions/{id}/cancel, POST /practice-sessions/{id}/attendance-records"

  - priority: 6
    category: state
    check: "stale expected_session_version on attendance creation"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /practice-sessions/{id}/attendance-records"

  - priority: 6
    category: state
    check: "stale expected_team_version on unified team member add"
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412
    applies_to: "POST /unified-teams/{id}/members"

  - priority: 6
    category: state
    check: "the MedicalForm is in SUBMITTED for review, or in REJECTED for resubmit"
    error_id: ERR_MEDICAL_FORM_STATE_INVALID
    http_status: 409
    applies_to: "POST /medical-forms/{id}/review, POST /medical-forms/{id}/resubmit"

  - priority: 6
    category: state
    check: "revision_count < MEDICAL_FORM_MAX_REVISIONS (3) before a resubmit is accepted"
    error_id: ERR_RESUBMIT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /medical-forms/{id}/resubmit"

  - priority: 6
    category: state
    check: "the Credential is in INITIATED or TRAINING_COMPLETE (screening) / INITIATED or SCREENING_CLEARED (training) / EXPIRED or RENEWAL_IN_PROGRESS (either branch, renewal cycle); a branch already recorded in the current cycle cannot be recorded again"
    error_id: ERR_CREDENTIAL_STEP_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /credentials/{id}/screening, POST /credentials/{id}/training"

  - priority: 6
    category: state
    check: "the Credential is in READY_TO_CERTIFY (both branches recorded) before certification"
    error_id: ERR_CREDENTIAL_NOT_READY_TO_CERTIFY
    http_status: 409
    applies_to: "POST /credentials/{id}/certify"

  - priority: 6
    category: state
    check: "the SportSeason is in PLANNING before open-practice, PRACTICE_OPEN before divisioning, DIVISIONED before lock-entries, DIVISIONED before redivision"
    error_id: ERR_SEASON_STATE_INVALID
    http_status: 409
    applies_to: "POST /seasons/{id}/open-practice, POST /seasons/{id}/divisioning, POST /seasons/{id}/redivision, POST /seasons/{id}/lock-entries"

  - priority: 6
    category: state
    check: "the SportSeason is in PRACTICE_OPEN before a practice session, a unified team or a competition entry may be created"
    error_id: ERR_SEASON_NOT_PRACTICE_OPEN
    http_status: 409
    applies_to: "POST /practice-sessions, POST /seasons/{id}/unified-teams, POST /unified-teams/{id}/members, POST /competition-entries"

  - priority: 6
    category: state
    check: "the PracticeSession is in SCHEDULED or HELD (never VOIDED) before attendance may be recorded, and in SCHEDULED or HELD before it may be cancelled"
    error_id: ERR_SESSION_NOT_OPEN_FOR_ATTENDANCE
    http_status: 409
    applies_to: "POST /practice-sessions/{id}/attendance-records, POST /practice-sessions/{id}/cancel"

  - priority: 6
    category: state
    check: "the CompetitionEntry is in LOCKED before a result may be posted, and not already RESULTED, ADVANCED, DISQUALIFIED or VOIDED"
    error_id: ERR_ENTRY_STATE_INVALID
    http_status: 409
    applies_to: "POST /competition-entries/{id}/result"

  - priority: 6
    category: state
    check: "the HealthScreening referral_status is REFERRED, FOLLOW_UP_LOGGED or ESCALATED before a follow-up may be logged (NOT_REQUIRED and RESOLVED reject)"
    error_id: ERR_SCREENING_STATE_INVALID
    http_status: 409
    applies_to: "POST /health-screenings/{id}/referral-followup"

  - priority: 6
    category: state
    check: "the Contribution is PLEDGED before fulfil, and PLEDGED or RECEIVED before void"
    error_id: ERR_CONTRIBUTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /contributions/{id}/fulfill, POST /contributions/{id}/void"

  - priority: 6
    category: state
    check: "the Athlete is not already WITHDRAWN when withdraw is called"
    error_id: ERR_ATHLETE_ALREADY_WITHDRAWN
    http_status: 409
    applies_to: "POST /athletes/{id}/withdraw"

  - priority: 7
    category: business_safety
    check: >-
      Program.compliance_posture is not RESTRICTED for the competition-facing operations it gates
      (divisioning, redivision, lock-entries, competition-entry creation). Remediation traffic - athletes,
      medical forms, volunteers, credentials, screening, training, certification, contributions, health
      screenings, the compliance sweep and the clock - is never posture-gated.
    error_id: ERR_PROGRAM_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /seasons/{id}/divisioning, POST /seasons/{id}/redivision, POST /seasons/{id}/lock-entries, POST /competition-entries"

  - priority: 7
    category: business_safety
    check: >-
      Program.compliance_posture is not FROZEN for anything a RESTRICTED posture blocks and additionally
      not FROZEN for open-practice, practice-session creation, attendance recording and unified team
      formation
    error_id: ERR_PROGRAM_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /seasons/{id}/open-practice, POST /practice-sessions, POST /practice-sessions/{id}/attendance-records, POST /seasons/{id}/unified-teams, POST /unified-teams/{id}/members, POST /seasons/{id}/divisioning, POST /seasons/{id}/redivision, POST /seasons/{id}/lock-entries, POST /competition-entries"

  - priority: 8
    category: business_safety
    check: "a submitted MedicalForm carries attestation_cardiac_clearance == true and attestation_seizure_history != null"
    error_id: ERR_MEDICAL_ATTESTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /athletes/{id}/medical-forms, POST /medical-forms/{id}/resubmit"

  - priority: 8
    category: business_safety
    check: "when the athlete's down_syndrome_flag is true the form must carry attestation_atlantoaxial_screen == true"
    error_id: ERR_ATLANTOAXIAL_SCREEN_MISSING
    http_status: 422
    applies_to: "POST /athletes/{id}/medical-forms, POST /medical-forms/{id}/resubmit"

  - priority: 8
    category: business_temporal
    check: "exam_date is not in the future relative to the logical clock"
    error_id: ERR_EXAM_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /athletes/{id}/medical-forms, POST /medical-forms/{id}/resubmit"

  - priority: 8
    category: business_temporal
    check: "exam_date + MEDICAL_FORM_VALIDITY_DAYS (1095) is on or after the logical clock date, i.e. the exam has not already expired at submission"
    error_id: ERR_MEDICAL_EXAM_STALE
    http_status: 422
    applies_to: "POST /athletes/{id}/medical-forms, POST /medical-forms/{id}/resubmit"

  - priority: 8
    category: business_safety
    check: >-
      the athlete's medical_status is not HOLD and not PENDING_REVIEW and not NONE for any operation that
      puts the athlete on a field of play - attendance recording, unified team membership and competition
      entry creation. RESTRICTED clears this gate but is caught by the restriction-compatibility rule.
    error_id: ERR_ATHLETE_MEDICAL_HOLD
    http_status: 422
    applies_to: "POST /practice-sessions/{id}/attendance-records, POST /unified-teams/{id}/members, POST /competition-entries"

  - priority: 8
    category: business_safety
    check: >-
      the athlete's registration_status is ACTIVE (not PENDING_MEDICAL, LAPSED or WITHDRAWN) for
      attendance, unified team membership and competition entry
    error_id: ERR_ATHLETE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /practice-sessions/{id}/attendance-records, POST /unified-teams/{id}/members, POST /competition-entries"

  - priority: 8
    category: business_referential
    check: >-
      a MedicalForm whose restrictions include NO_SWIMMING blocks entry into a SWIMMING season, and
      restrictions including NO_CONTACT block entry into a BASKETBALL season
    error_id: ERR_MEDICAL_RESTRICTION_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /competition-entries"

  - priority: 8
    category: business_safety
    check: "a volunteer whose age at credential creation is below ADULT_AGE_YEARS (18) cannot be credentialed with role_class COACH"
    error_id: ERR_MINOR_CANNOT_BE_COACH
    http_status: 422
    applies_to: "POST /volunteers/{id}/credentials"

  - priority: 8
    category: business_safety
    check: "certifying a credential whose screening_result is FLAGGED requires a non-empty flag_override_reason; DISQUALIFYING can never be certified at all"
    error_id: ERR_FLAG_OVERRIDE_REQUIRED
    http_status: 422
    applies_to: "POST /credentials/{id}/certify"

  - priority: 9
    category: business_temporal
    check: "the practice session's scheduled_start is on or after the logical clock"
    error_id: ERR_SESSION_START_IN_PAST
    http_status: 422
    applies_to: "POST /practice-sessions"

  - priority: 9
    category: business_temporal
    check: "attendance may only be recorded once the logical clock has reached the session's scheduled_start"
    error_id: ERR_ATTENDANCE_BEFORE_SESSION_START
    http_status: 422
    applies_to: "POST /practice-sessions/{id}/attendance-records"

  - priority: 9
    category: business_temporal
    check: >-
      the coach credential has no other SCHEDULED or HELD session whose half-open interval
      [scheduled_start - COACH_SESSION_BUFFER_MINUTES, scheduled_end + COACH_SESSION_BUFFER_MINUTES)
      overlaps the new session's half-open interval [scheduled_start, scheduled_end), where
      COACH_SESSION_BUFFER_MINUTES = 15; a gap of exactly 15 minutes is therefore allowed because the
      buffered interval is closed on the left and open on the right
    error_id: ERR_COACH_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /practice-sessions"

  - priority: 9
    category: business_temporal
    check: >-
      the athlete has no other COUNTED or NOT_COUNTED attendance on a SCHEDULED or HELD session whose
      CLOSED interval [scheduled_start, scheduled_end] intersects this session's closed interval - no
      buffer applies, but touching endpoints do conflict
    error_id: ERR_ATHLETE_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /practice-sessions/{id}/attendance-records"

  - priority: 9
    category: business_temporal
    check: "the logical clock date is on or after season.registration_deadline before divisioning may run"
    error_id: ERR_REGISTRATION_STILL_OPEN
    http_status: 409
    applies_to: "POST /seasons/{id}/divisioning"

  - priority: 9
    category: business_temporal
    check: "the logical clock date is on or before season.registration_deadline when a competition entry is created"
    error_id: ERR_REGISTRATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /competition-entries"

  - priority: 9
    category: business_temporal
    check: "the logical clock date is on or after season.competition_date before a result may be posted"
    error_id: ERR_COMPETITION_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /competition-entries/{id}/result"

  - priority: 10
    category: business_referential
    check: >-
      the referenced coach_credential_id names a Credential with role_class COACH, status CERTIFIED and
      expires_on on or after the logical clock date
    error_id: ERR_COACH_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /practice-sessions"

  - priority: 10
    category: business_referential
    check: "the credential's role_class matches the volunteer's volunteer_class"
    error_id: ERR_ROLE_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /volunteers/{id}/credentials"

  - priority: 10
    category: business_referential
    check: >-
      every partner_volunteer_id added to a unified team holds a CERTIFIED, unexpired credential with
      role_class UNIFIED_PARTNER
    error_id: ERR_PARTNER_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /unified-teams/{id}/members"

  - priority: 10
    category: business_referential
    check: "a UNIFIED_TEAM participant's roster_status is COMPLIANT when its competition entry is created"
    error_id: ERR_ROSTER_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /competition-entries"

  - priority: 10
    category: business_safety
    check: >-
      an ATHLETE participant has met both practice minimums for the season per
      calculations.season_practice_eligibility
    error_id: ERR_PRACTICE_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /competition-entries"

  - priority: 11
    category: business_constraint
    check: "the athlete has no existing COUNTED or NOT_COUNTED attendance record on this session"
    error_id: ERR_DUPLICATE_ATTENDANCE
    http_status: 409
    applies_to: "POST /practice-sessions/{id}/attendance-records"

  - priority: 11
    category: business_constraint
    check: "the athlete or volunteer is not already listed on this unified team's roster"
    error_id: ERR_DUPLICATE_TEAM_MEMBER
    http_status: 409
    applies_to: "POST /unified-teams/{id}/members"

  - priority: 11
    category: business_constraint
    check: >-
      adding this member would not push athlete_count and partner_count out of the 1:1 unified ratio in a
      way that can no longer be repaired, i.e. neither side may exceed the other by more than one
    error_id: ERR_UNIFIED_RATIO_VIOLATION
    http_status: 422
    applies_to: "POST /unified-teams/{id}/members"

  - priority: 11
    category: business_constraint
    check: "adding this member would not push the roster's age_span_years above UNIFIED_AGE_SPAN_MAX_YEARS (5), measured at the season's competition_date"
    error_id: ERR_UNIFIED_AGE_SPAN_EXCEEDED
    http_status: 422
    applies_to: "POST /unified-teams/{id}/members"

  - priority: 11
    category: business_constraint
    check: "the same participant_id has no live (non-VOIDED, non-DISQUALIFIED) entry for the same season and event_code"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /competition-entries"

  - priority: 11
    category: business_constraint
    check: "the divisioning run produced at least one candidate entry (status SUBMITTED with a null division_id)"
    error_id: ERR_NO_ELIGIBLE_ENTRIES
    http_status: 422
    applies_to: "POST /seasons/{id}/divisioning, POST /seasons/{id}/redivision"

  - priority: 11
    category: business_constraint
    check: "no division of the season is still UNDERSIZED when entries are locked"
    error_id: ERR_UNDERSIZED_DIVISION_PRESENT
    http_status: 409
    applies_to: "POST /seasons/{id}/lock-entries"

  - priority: 12
    category: business_fiscal
    check: "the session's recorded_attendance_count is below capacity_slots"
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /practice-sessions/{id}/attendance-records"

  - priority: 12
    category: business_fiscal
    check: "the season's live entry_count is below entry_slot_budget"
    error_id: ERR_SEASON_ENTRY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /competition-entries"

