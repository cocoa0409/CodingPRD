# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1211 Marine Salvage & Wreck Removal.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: casualty_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Casualty]
        distinguishing_aspect: "POST /casualties returns 201 with lifecycle_status REPORTED, env_posture ENV_CLEAR, version 1, server-minted id, and created_at/updated_at populated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /casualties", payload: { vessel_name: "MV Tern", casualty_type: GROUNDING, declared_salved_value_cents: 100000000, position: "40N 10W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, st: $.data.lifecycle_status, ep: $.data.env_posture, v: $.data.version } }
          assert:
            - "status code 201 and lifecycle_status == REPORTED and env_posture == ENV_CLEAR"
            - "version == 1 and id is a server-minted UUID"
      - name: casualty_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Casualty, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /casualties without declared_salved_value_cents fails at priority 0 with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /casualties", payload: { vessel_name: "MV Tern", casualty_type: GROUNDING, position: "40N 10W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: casualty_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Casualty.fields.casualty_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "casualty_type 'ORBITAL' is outside the declared enum and fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /casualties", payload: { vessel_name: "MV Tern", casualty_type: ORBITAL, declared_salved_value_cents: 100000000, position: "40N 10W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: contract_fixed_price_conditional_field_rejected
        claim_type: type_constraints
        grounds: [entities.SalvageContract.fields.fixed_price_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "FIXED_PRICE without fixed_price_cents fails; NO_CURE_NO_PAY carrying fixed_price_cents also fails — conditional field rule is bidirectional."
        test_recipe:
          setup: ["casualty with APPROVED assessment and APPROVED plan"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
          trigger:
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: FIXED_PRICE }, as: ContractsOfficer, as_user_id: "co-01", captures: { err1: $.data.error_id } }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, fixed_price_cents: 1000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (FIXED_PRICE requires fixed_price_cents)"
            - "err2 == ERR_INVALID_REQUEST (fixed_price_cents forbidden on NO_CURE_NO_PAY)"
      - name: contract_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /contracts/{uuid} with a well-formed but unknown id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
      - name: doc_entry_immutable_record_shape
        claim_type: immutability
        grounds: [entities.DocEntry]
        distinguishing_aspect: "DocEntry has common_fields false: creation response carries id and created_at but no version or updated_at; the endpoint surface exposes no entry mutation."
        test_recipe:
          setup: ["NCNP contract ACTIVE; one REPORTED pollution event exists; doc pack COMPILING"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: DEBRIS, tier: TIER_1, est_volume_m3: 2 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
            - { call: "POST /doc-packs", payload: { contract_id: "${ct_id}" }, as: SalvageMaster, as_user_id: "sm-01", captures: { pack_id: $.data.id } }
          trigger:
            - { call: "POST /doc-packs/${pack_id}/entries", payload: { entry_type: POLLUTION_REPORT, ref_id: "${ev_id}", entry_date: "2026-05-10T00:00:00Z", summary: "debris sweep logged" }, as: SalvageMaster, as_user_id: "sm-01", captures: { entry_id: $.data.id } }
          assert:
            - "201 with id and created_at present; response has no version field and no updated_at field (common_fields false)"
            - "GET /doc-packs/${pack_id}/entries returns the entry with ref_id == ${ev_id}"
      - name: casualties_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /casualties without params applies pagination defaults (limit 10, offset 0) and echoes total_count/has_more in the envelope."
        test_recipe:
          setup: ["one casualty exists"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Tern", casualty_type: GROUNDING, declared_salved_value_cents: 100000000, position: "40N 10W" }, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "GET /casualties", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
          assert:
            - "response envelope contains pagination fields with limit == 10, offset == 0, total_count == 1, has_more == false"

  - section: state_machines
    instances:
      - name: plan_revision_loop_reject_returns_to_draft
        claim_type: valid_transition
        grounds: [state_machines.SalvagePlan.SUBMITTED_to_DRAFT]
        distinguishing_aspect: "Cyclic revision loop: SUBMITTED --reject--> DRAFT --submit--> SUBMITTED again; the plan is reusable and version increments each hop."
        test_recipe:
          setup: ["casualty with APPROVED assessment; plan DRAFT"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "POST /plans/${plan_id}/reject", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01", captures: { st1: $.data.status } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01", captures: { st2: $.data.status } }
          assert:
            - "after reject: status == DRAFT (loop back, not a terminal REJECTED state)"
            - "after re-submit: status == SUBMITTED"
      - name: assessment_superseded_by_newer_submission
        claim_type: side_effect_execution
        grounds: [state_machines.Assessment.SUBMITTED_to_SUPERSEDED, "concurrency_rules[assessment-create-stale-casualty]"]
        distinguishing_aspect: "Creating a second assessment for the same casualty (with current casualty version) flips the first from SUBMITTED to SUPERSEDED and bumps Casualty.version by 1."
        test_recipe:
          setup: ["casualty with one SUBMITTED assessment A1"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { a1: $.data.id, cas_v2: $.data.version } }
          trigger:
            - { call: "GET /casualties/${cas_id}", payload: {}, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { cas_v_now: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v_now}", pollution_risk_tier: TIER_2, wreck_removal_required: true, estimated_cost_cents: 2000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { a2: $.data.id, a2_seq: $.data.casualty_seq } }
          assert:
            - "GET /assessments/${a1} shows status == SUPERSEDED"
            - "A2.casualty_seq > A1.casualty_seq (deterministic recency ordering, never id-based)"
            - "Casualty.version advanced by exactly 1 per assessment creation"
      - name: terminal_assessment_approve_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Assessment, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Approving a SUPERSEDED assessment is rejected with ERR_ALREADY_TERMINAL (409); no reviewer_id is written."
        test_recipe:
          setup: ["casualty with assessment A1 SUPERSEDED by A2"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { a1: $.data.id } }
            - { call: "GET /casualties/${cas_id}", payload: {}, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { cas_v_now: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v_now}", pollution_risk_tier: TIER_2, wreck_removal_required: true, estimated_cost_cents: 2000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /assessments/${a1}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL, http 409"
            - "A1.reviewer_id remains null"
      - name: contract_sign_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SalvageContract, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "sign is only valid from OFFERED or COUNTERED; from DRAFT it fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["casualty assessed+planned; contract DRAFT"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; contract remains DRAFT and provisional_award_cents is not computed"
      - name: phase_complete_from_planned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.OperationPhase, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "complete is valid only from ACTIVE; a PLANNED phase rejects with ERR_INVALID_STATE_TRANSITION and no bubble-up fires."
        test_recipe:
          setup: ["NCNP contract ACTIVE; phase PLANNED (never activated)"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: REFLOAT, planned_duration_hours: 96 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
          trigger:
            - { call: "POST /phases/${ph_id}/complete", payload: {}, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; contract remains ACTIVE (no PERFORMANCE_COMPLETE bubble)"
      - name: double_verify_clean_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PollutionEvent, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "verify-clean on an already VERIFIED_CLEAN event returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["casualty with one VERIFIED_CLEAN event"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id } }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: DEBRIS, tier: TIER_1, est_volume_m3: 2 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
            - { call: "POST /pollution-events/${ev_id}/contain", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /pollution-events/${ev_id}/verify-clean", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
          trigger:
            - { call: "POST /pollution-events/${ev_id}/verify-clean", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL, http 409"

      - name: no_cure_termination_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.SalvageContract.ACTIVE_to_TERMINATED, state_machines.OperationPhase, state_machines.EquipmentCharter]
        distinguishing_aspect: "NO_CURE termination of an ACTIVE NCNP contract cascades: ACTIVE phase -> ABORTED, ON_HIRE charter -> OFF_HIRE (cost computed at current clock), BOOKED charter -> CANCELLED; award compute afterwards is a state error (no cure, no pay)."
        test_recipe:
          setup:
            - "NCNP contract ACTIVE; REFLOAT phase ACTIVE with charter A ON_HIRE (on-hire 2026-05-10, booked 10 days, rate 2,000,000); charter B BOOKED later window"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Kara", casualty_type: SUNK, declared_salved_value_cents: 800000000, position: "32N 64W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 5000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG, PONTOON] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 120000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
