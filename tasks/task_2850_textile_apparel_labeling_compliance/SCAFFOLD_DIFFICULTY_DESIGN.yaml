            - "ImportShipment.${sh_id}.penalty_ad_valorem_usd != 112.51"
            - "ImportShipment.${sh_id}.penalty_statutory_usd == 800.08"
            - "ImportShipment.${sh_id}.assessment_basis == \"AD_VALOREM\""
            - "ImportShipment.${sh_id}.penalty_assessed_usd == 112.52"
            - "Brand.${brand_id}.outstanding_penalty_usd == 112.52"
            - "Brand.${brand_id}.posture == \"RESTRICTED\""

      - name: penalty_and_posture_circularity_resolved_by_excluding_the_shipment_itself
        grounds:
          - calculations.marking_penalty_assessment
          - calculations.brand_penalty_ledger
          - calculations.brand_posture
          - entities.ImportShipment.fields.posture_at_review
          - entities.Brand.fields.outstanding_penalty_usd
          - entities.Brand.fields.posture
        distinguishing_aspect: |
          brand_posture depends on the penalty ledger and the penalty depends on brand_posture, so the formula pins the fixed point by evaluating step 1 with exclude_shipment_id set to the shipment under review: posture_at_review is OPEN (multiplier 1.00) giving 30000.00, and only afterwards does the same 30000.00 enter the ledger and flip Brand.posture to SUSPENDED - an implementation that lets the shipment see its own penalty would instead escalate to 60000.00 or switch to the statutory basis 15000.00.
        test_recipe:
          setup:
            - "Market US is registered with marking_duty_rate 0.100."
            - "Brand Northline Apparel Co exists with outstanding_penalty_usd 0.00 and posture OPEN, and owns style S1 targeting [US]."
            - "Entry ENT-3001 of 12000 units at 300000.00 USD sits in state ENTRY_FILED; its own ad valorem penalty of 30000.00 would by itself exceed PENALTY_SUSPEND_LEDGER_USD 25000.00."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
