              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # priority 5 state beats priority 7 business_safety"

      - name: temporal_before_fiscal_on_treasury_approve
        grounds:
          - validations[priority=12]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair (state vs business_fiscal, a different category pair than instance 1): approving a
          treasury reimbursement that is already APPROVED (state violation) AND would overdraw the
          club treasury (business_fiscal violation) must return ERR_INVALID_STATE (priority 5)
          before ERR_INSUFFICIENT_TREASURY (priority 12).
        test_recipe:
          setup:
            - "Club with treasury_balance_cents == 200 (1000 dues minus one approved 800 reimbursement) and that same EXPENSE_REIMBURSEMENT of 800 already APPROVED; a second approve would overdraw (200 - 800 < 0)"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Chestnut 4-H", county_code: "CH" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
