        grounds: ["state_machines.Payment.CLEARED_to_REFUNDED", "errors[ERR_REFUND_EXCEEDS_CLEARED]"]
        distinguishing_aspect: "Partial refunds accumulate: refund 400 of a cleared 1000 succeeds (payment stays CLEARED, order drops to PARTIALLY_PAID); a further 601 exceeds the remaining cleared value."
        test_recipe:
          setup: ["campaign OPEN; submitted order total 1000 with a cleared 1000 CHECK payment"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o1: $.data.id }
            - { call: "POST /fundraiser/orders/${o1}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/payments"
              payload: { order_id: "${o1}", amount_cents: 1000, method: "CHECK" }
              as: Treasurer
              as_user_id: "treas-1"
              captures: { pay1: $.data.id }
            - { call: "POST /fundraiser/payments/${pay1}/clear", payload: {}, as: Treasurer, as_user_id: "treas-1" }
          trigger:
            - call: "POST /fundraiser/payments/${pay1}/refund"
              payload: { amount_cents: 400 }
              as: Treasurer
              as_user_id: "treas-2"
              captures: { pay1_st: $.data.status, pay1_refunded: $.data.refunded_amount_cents }
            - call: "GET /fundraiser/orders/${o1}"
              payload: {}
              as: Treasurer
              captures: { o1_ps: $.data.payment_status }
            - call: "POST /fundraiser/payments/${pay1}/refund"
              payload: { amount_cents: 601 }
              as: Treasurer
              as_user_id: "treas-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "pay1_st == CLEARED and pay1_refunded == 400 (partial refund keeps CLEARED)"
            - "o1_ps == PARTIALLY_PAID (cleared contribution dropped to 600)"
            - "err_id == ERR_REFUND_EXCEEDS_CLEARED for 601 > remaining 600 — 422"

