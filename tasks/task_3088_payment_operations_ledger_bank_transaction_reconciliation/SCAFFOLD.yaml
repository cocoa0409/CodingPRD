  - PaymentOpsApprover
  - PaymentApprover
  - PaymentInitiator
  - Auditor
  code: 200
  input: []
  output: PaymentOrder
  side_effects: []
- method: GET
  path: /payment-orders
  description: List payment orders with filtering
  roles:
