      - name: checkin_requires_session_started_enrollment_to_session
        grounds:
          - state_machines.Enrollment.RESERVED_to_CHECKED_IN
          - entities.Session.fields.starts_at
          - entities.Session.fields.status
        distinguishing_aspect: "Enrollment's RESERVED->CHECKED_IN transition depends on the parent Session having reached starts_at on the clock; a check-in attempted before session.starts_at is rejected ERR_INVALID_STATE — an Enrollment->Session dependency on a different entity pair than the ShowcaseEntry->Showcase one."
