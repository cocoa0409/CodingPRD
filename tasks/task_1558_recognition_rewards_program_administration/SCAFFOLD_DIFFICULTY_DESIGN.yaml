# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Recognition & Rewards Program Administration
# Every instance: structured test_recipe, replayed against SCAFFOLD.yaml §1.5.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gross_up_provisional_vs_final_divergence
        grounds:
          - calculations.gross_up_calculation
          - entities.TaxRecord.fields.estimated_gross_up_cents
          - entities.TaxRecord.fields.final_gross_up_cents
          - state_machines.TaxRecord.ESTIMATED_to_FINALIZED
        distinguishing_aspect: |
          Tax domain (TaxRecord of a delivered RedemptionOrder): the PROVISIONAL
          variant at delivery uses ytd_supplemental_wages_cents=90000000 (fed 0.22),
          the FINAL variant at tax-year finalization uses the adjusted 120000000
          (fed 0.37), so identical taxable value 25000 yields 15950 vs 29289 —
          a divergence driven by the supplemental-wage tier boundary.
        test_recipe:
          setup:
            - "Program grossup_enabled with CA rate 0.093; employee in CA with ytd_supplemental_wages_cents=90000000 at delivery"
            - "Delivered order of a 25000-cent item; TaxRecord ESTIMATED with provisional gross-up"
            - "Compensation adjustment to 120000000 before finalization; all 12 monthly AccrualRuns of 2026 CLOSED"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093, TX: 0.0 }, grossup_enabled: true, anniversary_milestones: [ { years: 1, points: 500 } ], velocity_limit_per_7_days: 5, duplicate_window_days: 30, nomination_review_sla_days: 14, accrual_method: STRAIGHT_LINE }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 1000000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr One", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp One", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees/${emp}/compensation-adjustments", payload: { ytd_supplemental_wages_cents: 90000000 }, as: PayrollSpecialist }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 8000, reason_code: DELIVERY, message: "shipped the release", idempotency_key: "dv1-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, restocking_fee_percent: 20, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "WATCH1", name: "Watch", category: "MERCH", point_cost: 8000, cash_value_cents: 25000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "dv1-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-delivered", payload: {}, as: VendorOps, captures: { tr: $.data.tax_record_id } }
            - { call: "POST /api/employees/${emp}/compensation-adjustments", payload: { ytd_supplemental_wages_cents: 120000000 }, as: PayrollSpecialist }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 1 }, as: FinanceAdmin, captures: { run1: $.data.id } }
            - { call: "POST /api/accrual-runs/${run1}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run1}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 2 }, as: FinanceAdmin, captures: { run2: $.data.id } }
            - { call: "POST /api/accrual-runs/${run2}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run2}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 3 }, as: FinanceAdmin, captures: { run3: $.data.id } }
            - { call: "POST /api/accrual-runs/${run3}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run3}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 4 }, as: FinanceAdmin, captures: { run4: $.data.id } }
            - { call: "POST /api/accrual-runs/${run4}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run4}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 5 }, as: FinanceAdmin, captures: { run5: $.data.id } }
            - { call: "POST /api/accrual-runs/${run5}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run5}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 6 }, as: FinanceAdmin, captures: { run6: $.data.id } }
            - { call: "POST /api/accrual-runs/${run6}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run6}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 7 }, as: FinanceAdmin, captures: { run7: $.data.id } }
            - { call: "POST /api/accrual-runs/${run7}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run7}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 8 }, as: FinanceAdmin, captures: { run8: $.data.id } }
            - { call: "POST /api/accrual-runs/${run8}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run8}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 9 }, as: FinanceAdmin, captures: { run9: $.data.id } }
            - { call: "POST /api/accrual-runs/${run9}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run9}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 10 }, as: FinanceAdmin, captures: { run10: $.data.id } }
            - { call: "POST /api/accrual-runs/${run10}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run10}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 11 }, as: FinanceAdmin, captures: { run11: $.data.id } }
            - { call: "POST /api/accrual-runs/${run11}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run11}/close", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 12 }, as: FinanceAdmin, captures: { run12: $.data.id } }
            - { call: "POST /api/accrual-runs/${run12}/reconcile", payload: {}, as: FinanceAdmin }
            - { call: "POST /api/accrual-runs/${run12}/close", payload: {}, as: FinanceAdmin }
          trigger:
            - { call: "POST /api/programs/${prog}/finalize-tax-year", payload: { tax_year: 2026 }, as: PayrollSpecialist }
          assert:
            - "TaxRecord.${tr}.status == FINALIZED"
            - "TaxRecord.${tr}.estimated_gross_up_cents == 15950"
            - "TaxRecord.${tr}.final_gross_up_cents == 29289"
            - "TaxRecord.${tr}.delta_cents == 13339"
            - "finalize-tax-year response finalized_count == 1 and total_delta_cents == 13339"

      - name: accrual_straight_line_vs_utilization_weighted
        grounds:
          - calculations.budget_accrual
          - entities.AccrualRun.fields.accrual_method_used
          - entities.AccrualRun.fields.department_breakdown
        distinguishing_aspect: |
          Finance domain (AccrualRun over PointBudget, a different entity domain
          from the TaxRecord gross-up instance): the SAME annual allocation
          (120000 points x 0.5 cents) and SAME period month yield accrual_cents
          5000 under STRAIGHT_LINE but 4200 under UTILIZATION_WEIGHTED.
        test_recipe:
          setup:
            - "Two programs identical except accrual_method; one department with a 120000-point budget (rate 0.5) in each"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "ProgSL", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, accrual_method: STRAIGHT_LINE }, as: HRAdmin, captures: { progA: $.data.id } }
            - { call: "POST /api/programs/${progA}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/programs", payload: { name: "ProgUW", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, accrual_method: UTILIZATION_WEIGHTED }, as: HRAdmin, captures: { progB: $.data.id } }
            - { call: "POST /api/programs/${progB}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${progA}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 120000 }, as: FinanceAdmin }
            - { call: "POST /api/budgets", payload: { program_id: "${progB}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 120000 }, as: FinanceAdmin }
          trigger:
            - { call: "POST /api/accrual-runs", payload: { program_id: "${progA}", period_year: 2026, period_month: 8 }, as: FinanceAdmin, captures: { runA_accrual: "$.data.department_breakdown[0].accrual_cents", runA_method: "$.data.accrual_method_used" } }
            - { call: "POST /api/accrual-runs", payload: { program_id: "${progB}", period_year: 2026, period_month: 8 }, as: FinanceAdmin, captures: { runB_accrual: "$.data.department_breakdown[0].accrual_cents", runB_method: "$.data.accrual_method_used" } }
          assert:
            - "${runA_accrual} == 5000"
            - "${runB_accrual} == 4200"
            - "${runA_method} == STRAIGHT_LINE and ${runB_method} == UTILIZATION_WEIGHTED"
            - "the two variants diverge for identical allocation and month: 5000 != 4200"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances, modes (c), (b), (a))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: gross_up_tax_on_tax_closed_form
        grounds:
          - calculations.gross_up_calculation
          - entities.TaxRecord.fields.employer_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the gross-up is itself taxable,
          so the tax depends on the gross-up which depends on the tax. The
          scaffold pins the closed-form evaluation order (single division by
          1 - combined_rate, one final rounding). A naive single-pass
          multiplication (25000 x 0.3895 = 9737.5 -> 9738) is a DIFFERENT
          number, proving the recursion was resolved.
        test_recipe:
          setup:
            - "Program grossup_enabled, state_rate_map {CA: 0.093, TX: 0.0}; two employees (CA and TX) each granted 8000 points and each redeeming one 25000-cent item"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093, TX: 0.0 }, grossup_enabled: true }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr One", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMPCA", full_name: "Emp CA", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { empCA: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMPTX", full_name: "Emp TX", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2022-01-10", state_code: "TX" }, as: HRAdmin, captures: { empTX: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${empCA}", type: MANAGER, points_requested: 8000, reason_code: DELIVERY, message: "ca grant", idempotency_key: "cf1-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nomCA: $.data.id, nomCA_v: $.data.version } }
            - { call: "POST /api/nominations/${nomCA}/approve", payload: { expected_nomination_version: "${nomCA_v}" }, as: HRAdmin }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${empTX}", type: MANAGER, points_requested: 8000, reason_code: DELIVERY, message: "tx grant", idempotency_key: "cf1-n2" }, as: Manager, as_user_id: "${mgr}", captures: { nomTX: $.data.id, nomTX_v: $.data.version } }
            - { call: "POST /api/nominations/${nomTX}/approve", payload: { expected_nomination_version: "${nomTX_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "WATCH1", name: "Watch", category: "MERCH", point_cost: 8000, cash_value_cents: 25000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "cf1-r1" }, as: Employee, as_user_id: "${empCA}", captures: { ordCA: $.data.id } }
            - { call: "POST /api/redemption-orders/${ordCA}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ordCA}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ordCA}/mark-delivered", payload: {}, as: VendorOps, captures: { trCA: $.data.tax_record_id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "cf1-r2" }, as: Employee, as_user_id: "${empTX}", captures: { ordTX: $.data.id } }
            - { call: "POST /api/redemption-orders/${ordTX}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ordTX}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ordTX}/mark-delivered", payload: {}, as: VendorOps, captures: { trTX: $.data.tax_record_id } }
          trigger:
            - { call: "GET /api/tax-records/${trCA}", payload: {}, as: HRAdmin }
            - { call: "GET /api/tax-records/${trTX}", payload: {}, as: HRAdmin }
          assert:
            - "TaxRecord.${trCA}.taxable_value_cents == 25000"
            - "TaxRecord.${trCA}.estimated_gross_up_cents == 15950"
            - "TaxRecord.${trCA}.estimated_gross_up_cents != 9738"
            - "TaxRecord.${trCA}.employer_cost_cents == 40950"
            - "TaxRecord.${trTX}.estimated_gross_up_cents == 10537"
            - "TaxRecord.${trTX}.federal_rate_applied == 0.22 and TaxRecord.${trTX}.state_rate_applied == 0.0"

      - name: chargeback_per_line_then_sum_rounding
        grounds:
          - calculations.chargeback_calculation
          - entities.AccrualRun.fields.department_breakdown
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: two settled orders of
          101 and 103 points at 0.5 cents/point. Pinned order rounds PER ORDER
          LINE then sums (51 + 52 = 103); the forbidden sum-then-round order
          gives 102. One cent of difference is the entire testable claim.
        test_recipe:
          setup:
            - "Program rate 0.5, grossup disabled; one employee holding awards of 101 and 103 points; two items of matching point cost, both delivered in August 2026"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, grossup_enabled: false }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr One", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp One", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 101, reason_code: TEAMWORK, message: "g1", idempotency_key: "cf2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom1: $.data.id, nom1_v: $.data.version } }
            - { call: "POST /api/nominations/${nom1}/approve", payload: { expected_nomination_version: "${nom1_v}" }, as: HRAdmin }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 103, reason_code: INNOVATION, message: "g2", idempotency_key: "cf2-n2" }, as: Manager, as_user_id: "${mgr}", captures: { nom2: $.data.id, nom2_v: $.data.version } }
            - { call: "POST /api/nominations/${nom2}/approve", payload: { expected_nomination_version: "${nom2_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "MUG", name: "Mug", category: "MERCH", point_cost: 101, cash_value_cents: 1000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { itemA: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "SHIRT", name: "Shirt", category: "MERCH", point_cost: 103, cash_value_cents: 1000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { itemB: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${itemA}", quantity: 1, idempotency_key: "cf2-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord1: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord1}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord1}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord1}/mark-delivered", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${itemB}", quantity: 1, idempotency_key: "cf2-r2" }, as: Employee, as_user_id: "${emp}", captures: { ord2: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord2}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord2}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord2}/mark-delivered", payload: {}, as: VendorOps }
          trigger:
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 8 }, as: FinanceAdmin, captures: { cb_cost: "$.data.department_breakdown[0].redemption_cost_cents", cb_net: "$.data.department_breakdown[0].net_chargeback_cents" } }
          assert:
            - "${cb_cost} == 103"
            - "${cb_cost} != 102"
            - "${cb_net} == 103"

      - name: restricted_posture_nested_min_cap
        grounds:
          - calculations.nomination_submission_gate
          - calculations.budget_posture
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction: the
          accepted amount is min(points_requested, allocated - reserved -
          committed, RESTRICTED_APPROVAL_CAP_POINTS=500) with the third term
          conditional on posture == RESTRICTED. At 8500/10000 utilization a
          501-point submission is rejected by the posture cap even though 1500
          points of raw capacity remain.
        test_recipe:
          setup:
            - "Budget allocated 10000; reservations of 8000 then 500 push utilization to exactly 8500 bp (RESTRICTED)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP0", full_name: "Nominator", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 8000, reason_code: TEAMWORK, message: "n1", idempotency_key: "cf3-n1" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 500, reason_code: INNOVATION, message: "n2", idempotency_key: "cf3-n2" }, as: Employee, as_user_id: "${n8r}" }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 501, reason_code: CUSTOMER_SAVE, message: "n3 over cap", idempotency_key: "cf3-n3" }, as: Employee, as_user_id: "${n8r}", captures: { err3: $.data.error_id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 500, reason_code: DELIVERY, message: "n4 at cap", idempotency_key: "cf3-n4" }, as: Employee, as_user_id: "${n8r}", captures: { nom4: $.data.id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { bud_reserved: $.data.reserved_points, bud_posture: $.data.posture } }
          assert:
            - "${err3} == ERR_BUDGET_RESTRICTED_AMOUNT"
            - "Nomination.${nom4}.status == PENDING_REVIEW"
            - "${bud_reserved} == 9000 and ${bud_posture} == RESTRICTED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nomination_revision_cycle_with_version_bump
        grounds:
          - state_machines.Nomination.PENDING_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Nomination.RETURNED_FOR_REVISION_to_PENDING_REVIEW
          - entities.Nomination.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on Nomination: PENDING_REVIEW -> RETURNED_FOR_REVISION
          -> PENDING_REVIEW loops with revision_count incrementing; the THIRD
          return-for-revision auto-REJECTS (200 with status REJECTED), and the
          budget reservation follows each hop (delta on resubmit, release on
          auto-reject).
        test_recipe:
          setup:
            - "Program, department, 50000-point budget; peer nominator and nominee in the same department; one manager"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 5000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 50000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 500, reason_code: TEAMWORK, message: "v1", idempotency_key: "nl1-n1" }, as: Employee, as_user_id: "${n8r}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /api/nominations/${nom}/return-for-revision", payload: { feedback: "add detail" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /api/nominations/${nom}/resubmit", payload: { points_requested: 600, message: "v2" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations/${nom}/return-for-revision", payload: { feedback: "still not enough" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /api/nominations/${nom}/resubmit", payload: { message: "v3" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations/${nom}/return-for-revision", payload: { feedback: "final" }, as: Manager, as_user_id: "${mgr}", captures: { final_status: $.data.status } }
            - { call: "GET /api/nominations/${nom}", payload: {}, as: HRAdmin, captures: { nom_version: $.data.version, nom_revisions: $.data.revision_count } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { bud_reserved: $.data.reserved_points } }
          assert:
            - "Nomination.${nom} traversed PENDING_REVIEW -> RETURNED_FOR_REVISION -> PENDING_REVIEW -> RETURNED_FOR_REVISION -> PENDING_REVIEW -> REJECTED"
            - "${final_status} == REJECTED"
            - "${nom_revisions} == 2 and ${nom_version} == 6"
            - "${bud_reserved} == 0"

      - name: redemption_parallel_fulfillment_escrow
        grounds:
          - state_machines.RedemptionOrder."fulfillment=PENDING_SUBMISSION (escrow=HELD)"_to_"fulfillment=SUBMITTED (escrow=HELD)"
          - state_machines.RedemptionOrder."fulfillment=SUBMITTED (escrow=HELD)"_to_"fulfillment=CANCELLED (escrow=REFUNDED)"
          - entities.RedemptionOrder.fields.escrow_status
        distinguishing_aspect: |
          Parallel state dimensions on RedemptionOrder: fulfillment_status
          advances PENDING_SUBMISSION -> SUBMITTED while escrow_status stays
          HELD; a cancel from SUBMITTED flips ONLY escrow to REFUNDED and
          fulfillment straight to CANCELLED, proving the two dimensions evolve
          independently rather than as one linear pipeline.
        test_recipe:
          setup:
            - "Employee granted 2000 points; catalog item costing 1000 points"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 2000, reason_code: DELIVERY, message: "g", idempotency_key: "nl2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "BAG", name: "Bag", category: "MERCH", point_cost: 1000, cash_value_cents: 5000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "nl2-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id, f0: $.data.fulfillment_status, e0: $.data.escrow_status } }
            - { call: "POST /api/redemption-orders/${ord}/submit", payload: {}, as: VendorOps, captures: { f1: $.data.fulfillment_status, e1: $.data.escrow_status } }
            - { call: "POST /api/redemption-orders/${ord}/cancel", payload: {}, as: Employee, as_user_id: "${emp}", captures: { f2: $.data.fulfillment_status, e2: $.data.escrow_status } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { avail: $.data.available_points, held: $.data.held_points } }
          assert:
            - "${f0} == PENDING_SUBMISSION and ${e0} == HELD"
            - "${f1} == SUBMITTED and ${e1} == HELD"
            - "${f2} == CANCELLED and ${e2} == REFUNDED"
            - "${avail} == 2000 and ${held} == 0"

      - name: budget_posture_compound_gating
        grounds:
          - calculations.budget_posture
          - state_machines.PointBudget.OPEN_to_RESTRICTED
          - state_machines.PointBudget.RESTRICTED_to_OPEN
          - entities.PointBudget.fields.posture
        distinguishing_aspect: |
          Posture-driven machine on PointBudget: posture is re-derived from the
          AGGREGATE of child actions (submit 8400 keeps OPEN at 8400 bp; submit
          100 more crosses to RESTRICTED at exactly 8500 bp; approving the
          8400-point nomination moves reserved->committed but leaves posture
          RESTRICTED; rejecting the 100-point nomination drops back to OPEN) —
          state is a pure function of children, not of any direct transition call.
        test_recipe:
          setup:
            - "Budget allocated 10000; two nominations (8400, 100) from one peer nominator to one nominee"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 8400, reason_code: TEAMWORK, message: "big", idempotency_key: "nl3-n1" }, as: Employee, as_user_id: "${n8r}", captures: { nom1: $.data.id, nom1_v: $.data.version } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 100, reason_code: INNOVATION, message: "small", idempotency_key: "nl3-n2" }, as: Employee, as_user_id: "${n8r}", captures: { nom2: $.data.id } }
          trigger:
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { p1: $.data.posture } }
            - { call: "POST /api/nominations/${nom1}/approve", payload: { expected_nomination_version: "${nom1_v}" }, as: HRAdmin }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { p2: $.data.posture } }
            - { call: "POST /api/nominations/${nom2}/reject", payload: { reason: "not now" }, as: HRAdmin }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { p3: $.data.posture } }
          assert:
            - "${p1} == RESTRICTED"
            - "${p2} == RESTRICTED"
            - "${p3} == OPEN"
            - "posture crossed at exactly 8500 bp (inclusive >=) and reverted below it on release"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: nomination_approval_tier_promotion_chain
        grounds:
          - state_machines.Nomination.PENDING_REVIEW_to_APPROVED
          - calculations.tier_assignment
          - entities.Employee.fields.recognition_tier
        distinguishing_aspect: |
          Depth-4 chain from the approve trigger: approve(A) creates the
          Award(B); the award grant posts the GRANT_NOMINATION ledger entry and
          recomputes lifetime_granted_points(C); the lifetime total crossing
          1000 promotes recognition_tier BRONZE -> SILVER(D). Each hop is
          caused by the previous mutation, not by the approve call directly.
        test_recipe:
          setup:
            - "Employee with 0 lifetime points (BRONZE); budget with room; MANAGER nomination for 1000 points"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1000, reason_code: DELIVERY, message: "g", idempotency_key: "tc1-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { award: $.data.award_id } }
            - { call: "GET /api/awards/${award}", payload: {}, as: HRAdmin, captures: { aw_points: $.data.points, aw_status: $.data.status, aw_source: $.data.source } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { e_avail: $.data.available_points, e_lifetime: $.data.lifetime_granted_points, e_tier: $.data.recognition_tier } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_res: $.data.reserved_points, b_com: $.data.committed_points } }
          assert:
            - "${aw_points} == 1000 and ${aw_status} == ACTIVE and ${aw_source} == NOMINATION"
            - "GET /api/employees/${emp}/ledger-entries returns exactly 1 entry of entry_type GRANT_NOMINATION with points == 1000"
            - "${e_avail} == 1000 and ${e_lifetime} == 1000"
            - "${e_tier} == SILVER"
            - "${b_res} == 0 and ${b_com} == 1000"

      - name: abuse_confirm_suspension_clawback_chain
        grounds:
          - state_machines.AbuseFlag.OPEN_to_CONFIRMED
          - state_machines.Employee.ELIGIBLE_to_SUSPENDED
          - state_machines.Award.ACTIVE_to_REVOKED
          - calculations.tier_assignment
        distinguishing_aspect: |
          Depth-4 chain from a DIFFERENT trigger (abuse confirm, not approve):
          confirm(A) suspends the employee(B); suspension cancels the
          PENDING_SUBMISSION order (refund 500) and revokes both ACTIVE awards
          (clawbacks of 2000 and 500)(C); the clawbacks drop lifetime_granted
          to 0, demoting the tier to BRONZE, and release 2500 committed points
          back to the budget(D).
        test_recipe:
          setup:
            - "Employee holds two ACTIVE awards (2000, 500) and one PENDING_SUBMISSION redemption order holding 500 points"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 2000, reason_code: TEAMWORK, message: "g1", idempotency_key: "tc2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom1: $.data.id, nom1_v: $.data.version } }
            - { call: "POST /api/nominations/${nom1}/approve", payload: { expected_nomination_version: "${nom1_v}" }, as: HRAdmin, captures: { award1: $.data.award_id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 500, reason_code: INNOVATION, message: "g2", idempotency_key: "tc2-n2" }, as: Manager, as_user_id: "${mgr}", captures: { nom2: $.data.id, nom2_v: $.data.version } }
            - { call: "POST /api/nominations/${nom2}/approve", payload: { expected_nomination_version: "${nom2_v}" }, as: HRAdmin, captures: { award2: $.data.award_id } }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "MUG", name: "Mug", category: "MERCH", point_cost: 500, cash_value_cents: 2500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "tc2-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "POST /api/abuse-flags", payload: { employee_id: "${emp}", program_id: "${prog}", rule_code: MANUAL_REVIEW, details: { note: "audit hit" } }, as: HRAdmin, captures: { flag: $.data.id } }
          trigger:
            - { call: "POST /api/abuse-flags/${flag}/confirm", payload: {}, as: HRAdmin }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { e_status: $.data.program_status, e_avail: $.data.available_points, e_held: $.data.held_points, e_tier: $.data.recognition_tier } }
            - { call: "GET /api/awards/${award1}", payload: {}, as: HRAdmin, captures: { a1: $.data.status } }
            - { call: "GET /api/awards/${award2}", payload: {}, as: HRAdmin, captures: { a2: $.data.status } }
            - { call: "GET /api/redemption-orders/${ord}", payload: {}, as: HRAdmin, captures: { o_f: $.data.fulfillment_status, o_e: $.data.escrow_status } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_com: $.data.committed_points } }
          assert:
            - "${e_status} == SUSPENDED"
            - "${a1} == REVOKED and ${a2} == REVOKED"
            - "${o_f} == CANCELLED and ${o_e} == REFUNDED"
            - "${e_avail} == 0 and ${e_held} == 0"
            - "${e_tier} == BRONZE"
            - "${b_com} == 0"
            - "GET /api/employees/${emp}/ledger-entries contains exactly 2 CLAWBACK entries (2000 then 500) and 1 REFUND entry (500)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (3 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: program_state_beats_budget_fiscal_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_PROGRAM_NOT_ACTIVE]
          - errors[ERR_BUDGET_EXHAUSTED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal on POST /api/nominations: the
          program is SUSPENDED (priority 7) AND the budget is EXHAUSTED at
          100/100 (priority 16); the single returned error MUST be
          ERR_PROGRAM_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Program ACTIVE with a 100-point budget fully reserved by one nomination, then program SUSPENDED"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "fills budget", idempotency_key: "pp1-n1" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/programs/${prog}/suspend", payload: {}, as: HRAdmin }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 1, reason_code: INNOVATION, message: "blocked twice", idempotency_key: "pp1-n2" }, as: Employee, as_user_id: "${n8r}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PROGRAM_NOT_ACTIVE"
            - "no second nomination row is created (GET /api/nominations?nominee_id=${emp} returns 1 row)"

      - name: suspension_beats_scope_on_nominate
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_EMPLOYEE_SUSPENDED]
          - errors[ERR_NOMINEE_NOT_IN_SCOPE]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential on
          POST /api/nominations: a SUSPENDED nominator (priority 8) targets a
          PEER nominee in a DIFFERENT department (priority 11 scope violation);
          the single returned error MUST be ERR_EMPLOYEE_SUSPENDED.
        test_recipe:
          setup:
            - "Two departments with budgets; nominator in dept A suspended via confirmed abuse flag; nominee in dept B"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { deptA: $.data.id } }
            - { call: "POST /api/departments", payload: { name: "Sales", chargeback_account_code: "GL-SALES" }, as: HRAdmin, captures: { deptB: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${deptA}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${deptB}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Bad Actor", department_id: "${deptA}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominee", department_id: "${deptB}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/abuse-flags", payload: { employee_id: "${n8r}", program_id: "${prog}", rule_code: MANUAL_REVIEW, details: { note: "investigation" } }, as: HRAdmin, captures: { flag: $.data.id } }
            - { call: "POST /api/abuse-flags/${flag}/confirm", payload: {}, as: HRAdmin }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "cross dept", idempotency_key: "pp2-n1" }, as: Employee, as_user_id: "${n8r}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EMPLOYEE_SUSPENDED"

      - name: window_beats_balance_on_redeem
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - errors[ERR_CATALOG_ITEM_UNAVAILABLE]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal on
          POST /api/redemption-orders: the item's availability window opens
          2026-09-01 (clock is 2026-08-01, priority 13) AND the employee's
          balance is 0 (priority 17); the single returned error MUST be
          ERR_CATALOG_ITEM_UNAVAILABLE.
        test_recipe:
          setup:
            - "Employee with zero balance; catalog item whose window has not opened yet"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "FUTURE", name: "Future Item", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-09-01T00:00:00Z", active_window_end: "2026-10-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "pp3-r1" }, as: Employee, as_user_id: "${emp}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CATALOG_ITEM_UNAVAILABLE"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (4 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: budget_full_at_exact_allocation
        grounds:
          - calculations.nomination_submission_gate
          - calculations.budget_posture
          - errors[ERR_BUDGET_EXHAUSTED]
        distinguishing_aspect: |
          Metric: budget utilization via POST /api/nominations. Reservations of
          6000 + 4000 bring reserved+committed to EXACTLY allocated (10000);
          the boundary is inclusive-allowed (<=), so both submissions succeed
          and posture becomes EXHAUSTED, while the next 1-point submission is
          rejected ERR_BUDGET_EXHAUSTED.
        test_recipe:
          setup:
            - "Budget 10000; one nominator, one nominee; program max_points_per_nomination 10000"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 6000, reason_code: TEAMWORK, message: "b1", idempotency_key: "bp1-n1" }, as: Employee, as_user_id: "${n8r}", captures: { n1: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 4000, reason_code: INNOVATION, message: "b2", idempotency_key: "bp1-n2" }, as: Employee, as_user_id: "${n8r}", captures: { n2: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 1, reason_code: DELIVERY, message: "b3 over", idempotency_key: "bp1-n3" }, as: Employee, as_user_id: "${n8r}", captures: { err: $.data.error_id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_res: $.data.reserved_points, b_posture: $.data.posture } }
          assert:
            - "Nomination.${n1}.status == PENDING_REVIEW and Nomination.${n2}.status == PENDING_REVIEW"
            - "${err} == ERR_BUDGET_EXHAUSTED"
            - "${b_res} == 10000 and ${b_posture} == EXHAUSTED"

      - name: redemption_at_exact_balance
        grounds:
          - validations[priority=17]
          - entities.Employee.fields.available_points
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Metric: points balance via POST /api/redemption-orders. An order
          costing EXACTLY the available balance (1000 == 1000) succeeds and
          leaves available_points == 0; a follow-up 1-point order against the
          zero balance is rejected ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "Employee granted exactly 1000 points; items costing 1000 and 1 point"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1000, reason_code: DELIVERY, message: "g", idempotency_key: "bp2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "BIG", name: "Big", category: "MERCH", point_cost: 1000, cash_value_cents: 5000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item1: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "TINY", name: "Tiny", category: "MERCH", point_cost: 1, cash_value_cents: 5, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item2: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item1}", quantity: 1, idempotency_key: "bp2-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { avail: $.data.available_points, held: $.data.held_points } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item2}", quantity: 1, idempotency_key: "bp2-r2" }, as: Employee, as_user_id: "${emp}", captures: { err: $.data.error_id } }
          assert:
            - "RedemptionOrder.${ord}.fulfillment_status == PENDING_SUBMISSION"
            - "${avail} == 0 and ${held} == 1000"
            - "${err} == ERR_INSUFFICIENT_POINTS"

      - name: vendor_capacity_rollover
        grounds:
          - calculations.vendor_ship_date_assignment
          - entities.RedemptionOrder.fields.ship_date
        distinguishing_aspect: |
          Metric: per-vendor per-day order count via
          POST /api/redemption-orders/{id}/submit. With capacity 2 and 1
          business day lead from Monday 2026-08-03, the first two submits land
          ship_date 2026-08-04; the third EXACTLY at capacity rolls to
          2026-08-05 — the >= comparison (count >= capacity) decides.
        test_recipe:
          setup:
            - "Clock pinned to Monday 2026-08-03; vendor capacity 2 lead 1; employee with 10000 points and three 100-point orders"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 10000, reason_code: DELIVERY, message: "g", idempotency_key: "bp3-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 2, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "MUG", name: "Mug", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "bp3-r1" }, as: Employee, as_user_id: "${emp}", captures: { o1: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "bp3-r2" }, as: Employee, as_user_id: "${emp}", captures: { o2: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "bp3-r3" }, as: Employee, as_user_id: "${emp}", captures: { o3: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders/${o1}/submit", payload: {}, as: VendorOps, captures: { s1: $.data.ship_date } }
            - { call: "POST /api/redemption-orders/${o2}/submit", payload: {}, as: VendorOps, captures: { s2: $.data.ship_date } }
            - { call: "POST /api/redemption-orders/${o3}/submit", payload: {}, as: VendorOps, captures: { s3: $.data.ship_date } }
          assert:
            - "${s1} == 2026-08-04"
            - "${s2} == 2026-08-04"
            - "${s3} == 2026-08-05"

      - name: velocity_sixth_nomination_flagged
        grounds:
          - calculations.velocity_check
          - validations[priority=9]
          - errors[ERR_VELOCITY_LIMIT_EXCEEDED]
          - entities.AbuseFlag.fields.rule_code
        distinguishing_aspect: |
          Metric: rolling 7-day nomination count via POST /api/nominations.
          The 5th submission inside the window succeeds (count >= 5 is false
          for the 5th); the 6th is rejected ERR_VELOCITY_LIMIT_EXCEEDED AND
          auto-creates an OPEN AbuseFlag with rule_code VELOCITY_EXCEEDED.
        test_recipe:
          setup:
            - "Program velocity_limit_per_7_days=5; one nominator, six distinct nominees in the same department; ample budget"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, velocity_limit_per_7_days: 5 }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP0", full_name: "Nominator", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "N1", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "N2", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP3", full_name: "N3", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e3: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP4", full_name: "N4", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e4: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP5", full_name: "N5", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e5: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP6", full_name: "N6", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e6: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e1}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "1", idempotency_key: "bp4-n1" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "2", idempotency_key: "bp4-n2" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e3}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "3", idempotency_key: "bp4-n3" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e4}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "4", idempotency_key: "bp4-n4" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e5}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "5", idempotency_key: "bp4-n5" }, as: Employee, as_user_id: "${n8r}" }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e6}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "6", idempotency_key: "bp4-n6" }, as: Employee, as_user_id: "${n8r}", captures: { err: $.data.error_id } }
            - { call: "GET /api/abuse-flags?employee_id=${n8r}&rule_code=VELOCITY_EXCEEDED", payload: {}, as: HRAdmin, captures: { flag0: "$.data[0].status", flag0_rule: "$.data[0].rule_code" } }
          assert:
            - "${err} == ERR_VELOCITY_LIMIT_EXCEEDED"
            - "${flag0} == OPEN and ${flag0_rule} == VELOCITY_EXCEEDED"
            - "the five in-window nominations remain PENDING_REVIEW (no cascade cancellation)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: nomination_submit_gated_by_budget_posture
        grounds:
          - validations[priority=15]
          - state_machines.PointBudget.RESTRICTED_to_OPEN
          - errors[ERR_BUDGET_RESTRICTED_AMOUNT]
        distinguishing_aspect: |
          Pair Nomination -> PointBudget: the SAME 600-point submission is
          rejected while the budget's derived posture is RESTRICTED and
          accepted after a rejection releases 500 reserved points and the
          posture recomputes to OPEN — the nomination's valid outcome depends
          on a different entity's computed state.
        test_recipe:
          setup:
            - "Budget 10000 with 8000 + 500 reserved (RESTRICTED at 8500 bp)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Nominee", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-10", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 8000, reason_code: TEAMWORK, message: "n1", idempotency_key: "ce1-n1" }, as: Employee, as_user_id: "${n8r}" }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 500, reason_code: INNOVATION, message: "n2", idempotency_key: "ce1-n2" }, as: Employee, as_user_id: "${n8r}", captures: { nom2: $.data.id } }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 600, reason_code: CUSTOMER_SAVE, message: "n3 blocked", idempotency_key: "ce1-n3" }, as: Employee, as_user_id: "${n8r}", captures: { err: $.data.error_id } }
            - { call: "POST /api/nominations/${nom2}/reject", payload: { reason: "free the pool" }, as: HRAdmin }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 600, reason_code: CUSTOMER_SAVE, message: "n4 allowed", idempotency_key: "ce1-n4" }, as: Employee, as_user_id: "${n8r}", captures: { nom4: $.data.id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_res: $.data.reserved_points, b_posture: $.data.posture } }
          assert:
            - "${err} == ERR_BUDGET_RESTRICTED_AMOUNT"
            - "Nomination.${nom4}.status == PENDING_REVIEW"
            - "at submission time posture was OPEN (8000 bp) so no cap applied; after landing, ${b_res} == 8600 and ${b_posture} == RESTRICTED (8600 >= 8500)"

      - name: redemption_gated_by_employee_suspension
        grounds:
          - validations[priority=8]
          - state_machines.Employee.ELIGIBLE_to_SUSPENDED
          - state_machines.Employee.SUSPENDED_to_ELIGIBLE
          - errors[ERR_EMPLOYEE_SUSPENDED]
        distinguishing_aspect: |
          Pair RedemptionOrder -> Employee: redemption creation is gated by the
          EMPLOYEE's program_status, not by anything on the order — a suspended
          employee is rejected ERR_EMPLOYEE_SUSPENDED even when the balance
          check would also fail, and after reinstate plus a points adjustment
          the same redemption succeeds.
        test_recipe:
          setup:
            - "Employee granted 5000, then suspended (confirmed flag -> awards revoked), then reinstated and refunded 1000 via points adjustment"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 5000, reason_code: DELIVERY, message: "g", idempotency_key: "ce2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "MUG", name: "Mug", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/abuse-flags", payload: { employee_id: "${emp}", program_id: "${prog}", rule_code: MANUAL_REVIEW, details: { note: "audit" } }, as: HRAdmin, captures: { flag: $.data.id } }
            - { call: "POST /api/abuse-flags/${flag}/confirm", payload: {}, as: HRAdmin }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "ce2-r1" }, as: Employee, as_user_id: "${emp}", captures: { err: $.data.error_id } }
            - { call: "POST /api/abuse-flags/${flag}/dismiss", payload: {}, as: HRAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /api/employees/${emp}/reinstate", payload: {}, as: HRAdmin, captures: { err3: $.data.error_id } }
            - { call: "POST /api/employees/${emp}/points-adjustments", payload: { program_id: "${prog}", points: 1000, reason: "restore after investigation" }, as: HRAdmin }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "ce2-r2" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { e_avail: $.data.available_points, e_status: $.data.program_status } }
          assert:
            - "${err} == ERR_EMPLOYEE_SUSPENDED"
            - "${err2} == ERR_INVALID_STATE_TRANSITION"
            - "reinstate succeeds (200): the CONFIRMED flag is resolved, so no OPEN/UNDER_REVIEW flag blocks it, and ${err3} is null"
            - "RedemptionOrder.${ord}.fulfillment_status == PENDING_SUBMISSION"
            - "${e_avail} == 900 and ${e_status} == ELIGIBLE"

      - name: tax_finalize_gated_by_accrual_closure
        grounds:
          - state_machines.TaxRecord.ESTIMATED_to_FINALIZED
          - state_machines.AccrualRun.OPEN_to_RECONCILED
          - errors[ERR_PERIODS_NOT_CLOSED]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair TaxRecord -> AccrualRun: tax-year finalization is gated on a
          DIFFERENT entity's lifecycle — every monthly AccrualRun of 2026 must
          be CLOSED or VOIDED; with month 8 still OPEN the finalize is
          rejected ERR_PERIODS_NOT_CLOSED, and after closing month 8 the same
          call finalizes the record with delta_cents == 0 (no intervening
          compensation change).
