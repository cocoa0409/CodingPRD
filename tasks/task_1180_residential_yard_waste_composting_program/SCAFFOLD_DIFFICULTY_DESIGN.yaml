          assert:
            - "capture ${err} == ERR_LOAD_SAFETY_LIMIT_EXCEEDED"
            - "CollectionRoute.${route_a}.status == ARCHIVED"
            - "FacilityDelivery.${del}.status == SCHEDULED"

  - rule_id: boundary_precision_check
