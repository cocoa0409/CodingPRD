              payload: { notice_code: "NB-2026-02", change_type: "BENEFIT_REMOVAL", effective_at: "2026-12-01T00:00:00Z", grandfather_window_days: 30, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
