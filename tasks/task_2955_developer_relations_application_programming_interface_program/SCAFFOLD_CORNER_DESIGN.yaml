              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "STANDARD", requested_scopes: ["catalog.read"], requested_monthly_calls: 200000, justification_text: "Our storefront widget reads the public catalogue hourly." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { app1_id: $.data.id }
          trigger:
            - call: "GET /access-applications/${app1_id}"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "GET /access-applications/${app1_id}"
              payload: {}
              as: Developer
              as_user_id: "${d2_id}"
