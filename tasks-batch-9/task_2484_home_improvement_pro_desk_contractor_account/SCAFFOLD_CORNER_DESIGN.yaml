  - section: rbac
    instances:

      - name: missing_or_undeclared_headers_are_rejected_before_any_lookup
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication outranks even existence: with no X-User-Role header, with no X-User-ID header, or with a role string outside the declared six, the call is ERR_UNAUTHENTICATED 401 — including a call whose path id does not exist, which would otherwise be a 404."
        is_negative_trigger: true
        test_recipe:
          setup:
            - "One store exists so the happy-path read has a real target."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "GET /pro/stores/${store_id}"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { e_no_role: "$.data.error_id" }
            - call: "GET /pro/stores/${store_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "(no X-User-ID header sent)"
              captures: { e_no_id: "$.data.error_id" }
            - call: "GET /pro/stores/${store_id}"
              payload: {}
              as: "RegionalVicePresident"
              as_user_id: "rvp-1"
              captures: { e_bad_role: "$.data.error_id" }
            - call: "GET /pro/stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "RegionalVicePresident"
              as_user_id: "rvp-1"
              captures: { e_bad_role_unknown_id: "$.data.error_id" }
            - call: "GET /pro/stores/${store_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ok_store_code: "$.data.store_code" }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED and ${e_no_id} == ERR_UNAUTHENTICATED"
            - "${e_bad_role} == ERR_UNAUTHENTICATED"
            - "${e_bad_role_unknown_id} == ERR_UNAUTHENTICATED"
            - "all four rejected calls http_status == 401"
            - "the unknown-id call returns 401, not 404 (priority 1 precedes priority 3)"
            - "${ok_store_code} == HD-101 and the authenticated read http_status == 200"

      - name: exclusive_operations_reject_every_other_declared_role
        claim_type: role_restriction
        grounds:
          - validations[priority=2]
          - roles.PlatformAdmin.exclusive_operations
          - roles.CreditManager.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Each exclusive operation is closed to the other five roles and nothing is written on the way out: ContractorAdmin cannot POST /pro/stores, PlatformAdmin cannot open a credit line, StoreOperations cannot submit an order and TaxComplianceOfficer cannot read a pro order — all ERR_FORBIDDEN_ROLE 403, while the rightful role succeeds."
