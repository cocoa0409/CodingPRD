  # ===================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: period_close_requires_contract_active
        grounds:
          - state_machines.SalesPeriod.OPEN_to_CLOSED
          - entities.Contract.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair SalesPeriod->Contract: a SalesPeriod cannot move OPEN->CLOSED unless its owning Contract.status
          == ACTIVE; against a DRAFT contract the close is rejected (ERR_INVALID_STATE) — the period's valid transition
          depends on the contract's state.
        test_recipe:
          setup:
            - "DRAFT (not yet activated) contract C with a tier, title, format, and a period seq1 created while DRAFT."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Twelve", email: "a12@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Twelve" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "SalesPeriod.${p1_id}.status == OPEN (unchanged)"

      - name: sales_record_requires_active_format
        grounds:
          - validations[priority=10]
          - entities.Format.fields.active
          - state_machines.Title.PUBLISHED_to_OUT_OF_PRINT
        distinguishing_aspect: |
          Entity pair SalesRecord->Format (a different pair than SalesPeriod->Contract): posting a SalesRecord is
          rejected when the target Format.active == false, which is itself a consequence of the owning Title being
          retired to OUT_OF_PRINT — sales posting depends on the format's derived active state.
        test_recipe:
          setup:
            - "ACTIVE contract C, title T retired to OUT_OF_PRINT (so its format F.active=false), OPEN period seq1."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Thirteen", email: "a13@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Thirteen" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/retire"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 5, units_returned: 0 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PERIOD_NOT_OPEN"
            - "Format.${format_id}.active == false"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: period_sequence_point_occupation_collision
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_PERIOD_SEQUENCE]
          - entities.SalesPeriod.fields.sequence
        distinguishing_aspect: |
          Interval semantics = zero-width POINT occupation on the SalesPeriod resource: a contract's accounting
          timeline assigns each sequence integer exactly once; creating a second period at sequence=1 collides with
          the existing point and is rejected ERR_DUPLICATE_PERIOD_SEQUENCE (point identity, no buffers, no ranges).
        test_recipe:
          setup:
            - "ACTIVE contract C with an existing SalesPeriod at sequence=1."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Fourteen", email: "a14@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Fourteen" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1-dup", sequence: 1 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_PERIOD_SEQUENCE"

      - name: royalty_tier_range_overlap_collision_on_activate
        grounds:
          - validations[priority=7]
          - errors[ERR_TIER_COVERAGE_INVALID]
          - entities.RoyaltyTier.fields.lower_unit
          - entities.RoyaltyTier.fields.upper_unit
        distinguishing_aspect: |
          Interval semantics = INCLUSIVE 1-D range overlap on the RoyaltyTier resource (a different resource and
          different arithmetic than the period point-collision): tiers [1..5000] and [5000..10000] share unit 5000,
          so their closed ranges intersect and activation is rejected ERR_TIER_COVERAGE_INVALID (overlap, not adjacency).
        test_recipe:
          setup:
            - "DRAFT contract C with overlapping tiers [1..5000]@0.10 and [5000..10000]@0.125 (note: 5000 in both) plus open top [10001..]@0.15, one title+format."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Fifteen", email: "a15@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, upper_unit: 5000, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 5000, upper_unit: 10000, rate: 0.125 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 10001, rate: 0.15 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Fifteen" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_TIER_COVERAGE_INVALID"
            - "Contract.${contract_id}.status == DRAFT (activation rejected)"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_conservation_held_equals_released_plus_consumed
        grounds:
          - state_machines.ReturnsReserve.HELD_to_LIQUIDATED
          - calculations.reserve_liquidation
          - entities.ReturnsReserve.fields.reserve_held_cents
          - entities.ReturnsReserve.fields.released_cents
          - entities.ReturnsReserve.fields.consumed_cents
        distinguishing_aspect: |
          Conserved quantity = reserve dollars. The forward action (withhold reserve at finalize) and its
          compensating action (liquidate at a later finalize) MUST satisfy reserve_held_cents == released_cents +
          consumed_cents exactly (468750 == 281250 + 187500); no cent drifts out of the reserve.
        test_recipe:
          setup:
            - "Same build as finalize_cascades_reserve_liquidation_then_author_credit_depth3 up to S3 finalize: reserve R1 held=468750 liquidates with 600 cohort returns."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Sixteen", email: "a16@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, upper_unit: 5000, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 5001, upper_unit: 10000, rate: 0.125 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 10001, rate: 0.15 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Sixteen" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 6000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P2", sequence: 2 }
              as: Publisher
              captures: { p2_id: $.data.id }
            - call: "POST /sales-periods/${p2_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 2000, units_returned: 400 }
              as: Publisher
            - call: "POST /sales-periods/${p2_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p2_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s2_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv2: $.data.version }
            - call: "POST /statements/${s2_id}/finalize"
              payload: { expected_contract_version: "${cv2}" }
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P3", sequence: 3 }
              as: Publisher
              captures: { p3_id: $.data.id }
            - call: "POST /sales-periods/${p3_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 1000, units_returned: 200 }
              as: Publisher
            - call: "POST /sales-periods/${p3_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p3_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s3_id: $.data.id }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv3: $.data.version }
            - call: "POST /statements/${s3_id}/finalize"
              payload: { expected_contract_version: "${cv3}" }
              as: Publisher
            - call: "GET /statements/${s1_id}/reserves"
              payload: {}
              as: Publisher
              captures: { r1_held: $.data.0.reserve_held_cents, r1_released: $.data.0.released_cents, r1_consumed: $.data.0.consumed_cents }
          assert:
            - "the reserve from ${s1_id} has reserve_held_cents == 468750"
            - "released_cents == 281250 and consumed_cents == 187500"
            - "released_cents + consumed_cents == reserve_held_cents (468750), no drift"

      - name: subsidiary_void_conserves_author_income_baseline
        grounds:
          - state_machines.SubsidiaryRight.REGISTERED_to_VOID
          - calculations.subsidiary_author_income
          - entities.AuthorStatement.fields.subsidiary_income_cents
          - entities.SubsidiaryRight.fields.author_income_cents
        distinguishing_aspect: |
          Conserved quantity = author subsidiary income credited on a statement (a different conserved quantity than
          reserve dollars). Registering a FOREIGN right (author_income 500000) then voiding it leaves the statement's
          subsidiary_income_cents identical to a never-registered baseline (0); the would-be credit is fully reversed.
        test_recipe:
          setup:
            - "ACTIVE contract C, period seq1 net 100, one FOREIGN right (proceeds 1000000, share 0.50 -> income 500000) REGISTERED then VOIDED before finalize."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Seventeen", email: "a17@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Seventeen" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "FOREIGN", proceeds_cents: 1000000, author_share_pct: 0.50 }
              as: Publisher
              captures: { right_id: $.data.id, right_income: $.data.author_income_cents }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 100, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /subsidiary-rights/${right_id}/void"
              payload: {}
              as: Publisher
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
              captures: { sub_income: $.data.subsidiary_income_cents }
          assert:
            - "SubsidiaryRight.${right_id}.author_income_cents == 500000 (computed at registration)"
            - "SubsidiaryRight.${right_id}.status == VOID"
            - "AuthorStatement.${s1_id}.subsidiary_income_cents == 0 (void reversed the would-be credit, baseline conserved)"
