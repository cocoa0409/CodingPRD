      - call: POST /comics/retailer-orders/${o1}/submit
        payload: {}
        as: Retailer
        as_user_id: ${r1}
      trigger:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-09-23T00:00:00Z'}
        as: SalesDirector
      - call: POST /comics/issues/${i1}/foc-lock
        payload: {}
        as: SalesDirector
      - call: GET /comics/retailers/${r1}
        payload: {}
        as: SalesDirector
      - call: GET /comics/retailer-orders/${o1}
        payload: {}
        as: SalesDirector
      - call: POST /comics/retailer-orders/${o1}/invoice
