  - rule_id: cross_entity_state_dependency
    instances:

      - name: authorization_approval_blocked_by_suspended_rep_returns_409
        grounds:
          - state_machines.CaseRepAuthorization.REQUESTED_to_APPROVED
          - validations.priority_11_ERR_REP_ACCESS_SUSPENDED
          - validations.priority_24_ERR_REP_CREDENTIALS_NOT_COMPLIANT
          - entities.VendorRep.fields.access_status
          - entities.Vendor.fields.authorizations_used_epoch
          - calculations.case_vendor_coverage_status
        distinguishing_aspect: |
          The guarded transition reads a DIFFERENT aggregate than the row being written: approving a
          CaseRepAuthorization depends on VendorRep.access_status, which was mutated by a sweep after
          the request was created. The request itself never changed, so an implementation that
          validates only the authorization row admits the approval. Because the rep is both SUSPENDED
          and LAPSED, the state check (priority 11, 409) must win over the credential-posture check
          (priority 24, 422), and none of the three approval counters may move.
