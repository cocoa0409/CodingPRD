        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_FLEET_SIZE]"]
        distinguishing_aspect: "fleet_size must be >= 1 at creation (the measure divides by it): 0 -> ERR_INVALID_FLEET_SIZE."
