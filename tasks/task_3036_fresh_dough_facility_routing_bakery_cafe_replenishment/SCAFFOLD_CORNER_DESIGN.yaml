            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops/${s1_id}/arrive"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/close"
              payload: {}
              as: FacilityPlanner
            - call: "GET /dough-ops/cafes/${c1_id}"
