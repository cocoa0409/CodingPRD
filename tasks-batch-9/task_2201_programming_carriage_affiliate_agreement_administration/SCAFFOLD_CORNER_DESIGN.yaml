# =============================================================================
# 1.9 Scaffold Corner Design — Programming Carriage & Affiliate Agreement
#     Administration (task 2201)
#
# Breadth probe over §1.1-§1.7. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the
# depth probe; every corner already asserted there appears here only as an
# `excluded_because:` stub citing the §1.8 instance by `name`.
#
# `section:` values are the nine sections of references/claim-extraction-guide.md;
# `claim_type:` values are that guide's per-section claim-type rows, snake_cased.
#
# Canonical actor ids (identical to §1.8):
#   u-admin-1   NetworkAdmin          u-sales-1 / u-sales-2  AffiliateSalesExec
#   u-rev-1 / u-rev-2  RevenueAccountant     u-audit-1       AuditManager
#   u-rights-1  RightsAdministrator
#   DistributorLiaison is entity_backed:Distributor, so its X-User-ID is the
#   Distributor.id itself and appears as as_user_id: "${dN_id}".
#
# The logical clock starts at exactly 2026-08-01T00:00:00Z in every recipe below
# unless the recipe advances it with POST /_clock/set_current_utc.
# The error envelope is { data: { error_id, message } }, so every negative
# assertion pins data.error_id.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:

      - name: distributor_create_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Distributor.fields.credit_limit_cents
          - entities.Distributor.fields.status
          - entities.Distributor.fields.credit_hold_reason
          - entities.Distributor.fields.executed_agreement_count
          - endpoints[POST /carriage/distributors]
        distinguishing_aspect: >-
          Creating a Distributor with credit_limit_cents omitted must apply the
          declared default of 100,000,000 rather than 0 or null, and every
          computed/system field must arrive at its declared default in the same
          response — status ACTIVE, credit_hold_reason NONE, all three balances 0
          and version 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
          assert:
            - "response status code == 201"
            - "response body response_type == \"object\" and meta.api_request_id is a non-empty string"
            - "response body data.credit_limit_cents == 100000000 (the declared default, applied because the field was omitted)"
            - "response body data.status == \"ACTIVE\" and data.credit_hold_reason == \"NONE\""
            - "response body data.receivable_balance_cents == 0, data.audit_recovery_balance_cents == 0 and data.executed_agreement_count == 0"
            - "response body data.version == 1 and data.id, data.created_at, data.updated_at are all non-null"

      - name: distributor_get_returns_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /carriage/distributors/{distributorId}]
          - entities.Distributor.fields.total_subscribers
        distinguishing_aspect: >-
          A single-resource GET returns exactly what was stored, including the
          explicitly supplied credit_limit_cents of 250,000,000 (not the default)
          and an unchanged version of 1 — a read must not bump version.
        test_recipe:
          setup:
            - "One Distributor created with an explicit credit_limit_cents of 250,000,000."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Harbor Satellite"
                distributor_type: "DBS"
                rate_card_class: "CLASS_B"
                total_subscribers: 800000
                credit_limit_cents: 250000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dh_id: "id"
          trigger:
            - call: "GET /carriage/distributors/${dh_id}"
              payload: {}
              as: AuditManager
              as_user_id: "u-audit-1"
          assert:
            - "response status code == 200"
            - "response body data.id == ${dh_id} and data.legal_name == \"Harbor Satellite\""
            - "response body data.distributor_type == \"DBS\", data.rate_card_class == \"CLASS_B\" and data.total_subscribers == 800000"
            - "response body data.credit_limit_cents == 250000000 — the supplied value, not the 100,000,000 default"
            - "response body data.version == 1 (a GET never increments version)"

      - name: agreement_listing_filters_and_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /carriage/agreements]
          - entities.CarriageAgreement.fields.lifecycle_status
        distinguishing_aspect: >-
          Three agreements exist on one distributor, one of them EXECUTED. With
          limit=2 and offset=0 the envelope reports total_count 3, has_more true
          and exactly 2 rows; with offset=2 it reports has_more false and 1 row;
          adding lifecycle_status=EXECUTED narrows total_count to 1 — so
          total_count reflects the FILTERED population, not the table size.
        test_recipe:
          setup:
            - "One Distributor with three DRAFT agreements; the third is executed so exactly one row is EXECUTED."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-A"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_a_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-B"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_b_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-C"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_c_id: "id"
            - call: "POST /carriage/agreements/${ag_c_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ag_c_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
          trigger:
            - call: "GET /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                limit: 2
                offset: 0
              as: NetworkAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response status code == 200 and response body response_type == \"array\""
            - "response body data has exactly 2 elements"
            - "response body total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the same call with offset=2 returns exactly 1 element with total_count == 3 and has_more == false"
            - "the same call with lifecycle_status=\"EXECUTED\" and limit=10 returns exactly 1 element whose id == ${ag_c_id}, with total_count == 1 and has_more == false"
            - "the same call with no limit or offset supplied returns limit == 10 and offset == 0, the declared pagination defaults"

      - name: report_get_with_unknown_id_returns_report_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_REPORT_NOT_FOUND]
          - endpoints[GET /carriage/subscriber-reports/{reportId}]
        distinguishing_aspect: >-
          A path id that names nothing returns 404 with the entity-specific
          ERR_REPORT_NOT_FOUND — not a generic ERR_NOT_FOUND and not 400 — and the
          error travels in the declared envelope at data.error_id.
        test_recipe:
          setup:
            - "Empty database; no SubscriberReport has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /carriage/subscriber-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          assert:
            - "response status code == 404"
            - "response body response_type == \"error\""
            - "response body data.error_id == \"ERR_REPORT_NOT_FOUND\" and data.message is a non-empty string"
            - "response body meta.api_request_id and meta.api_request_timestamp are both present"

      - name: agreement_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /carriage/agreements]
        distinguishing_aspect: >-
          penetration_floor_pct carries no default and is not marked optional in
          the endpoint's input list, so omitting it is 400 ERR_INVALID_REQUEST at
          priority 5 — before any 404 existence check on the supplied
          distributor_id, which is why the bogus distributor in the same payload
          does NOT surface as ERR_DISTRIBUTOR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database — no Distributor exists, so the payload's distributor_id names nothing."
          setup_api_calls: []
          trigger:
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "00000000-0000-4000-8000-0000000000ff"
                contract_code: "MB-NOFLOOR"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
          assert:
            - "response status code == 400"
            - "response body data.error_id == \"ERR_INVALID_REQUEST\""
            - "response body data.error_id is NOT \"ERR_DISTRIBUTOR_NOT_FOUND\" — priority 5 precedes priority 11"
            - "GET /carriage/agreements with limit=10 returns total_count == 0"

      - name: distributor_create_rejects_client_supplied_computed_field
        claim_type: computed_fields
        grounds:
          - entities.Distributor.fields.receivable_balance_cents
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /carriage/distributors]
        distinguishing_aspect: >-
          receivable_balance_cents is source: computed and therefore absent from
          the endpoint's input list, so supplying it is an unknown field and is
          rejected 400 ERR_INVALID_REQUEST rather than silently stored or silently
          dropped; the legal call leaves the field at 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
                receivable_balance_cents: 999
              as: NetworkAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response status code == 400"
            - "response body data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /carriage/distributors with limit=10 returns total_count == 0 — nothing was created"
            - "the identical payload WITHOUT receivable_balance_cents returns 201 with data.receivable_balance_cents == 0"

      - name: rights_window_enum_and_range_constraints_enforced
        claim_type: type_constraints
        grounds:
          - entities.RightsWindow.fields.platform
          - entities.RightsWindow.fields.window_end
          - entities.RightsWindow.fields.territory_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          Three separate shape failures on one endpoint all land as 400
          ERR_INVALID_REQUEST and create nothing: an undeclared platform member
          (MOBILE), a window_end equal to window_start (the constraint is strictly
          greater), and a territory_code that is not exactly two uppercase letters.
        test_recipe:
          setup:
            - "One executed agreement and one registered ContentTitle exist, so both foreign keys in the payload resolve and only the shape can fail."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-A"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_a_id: "id"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Harbor Nights"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                tt_id: "id"
          trigger:
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${ag_a_id}"
                content_title_id: "${tt_id}"
                platform: "MOBILE"
                territory_code: "US"
                window_start: "2026-09-01T00:00:00Z"
                window_end: "2026-09-30T00:00:00Z"
                exclusivity: "EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
          assert:
            - "response status code == 400"
            - "response body data.error_id == \"ERR_INVALID_REQUEST\""
            - "the same call with platform=\"VOD\" but window_start and window_end both 2026-09-01T00:00:00Z returns 400 ERR_INVALID_REQUEST (window_end must be strictly greater)"
            - "the same call with platform=\"VOD\" and territory_code=\"usa\" returns 400 ERR_INVALID_REQUEST"
            - "GET /carriage/rights-windows with content_title_id=${tt_id} returns total_count == 0 after all three attempts"

      - name: rate_card_entry_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.RateCardEntry.fields.id
          - endpoints[POST /carriage/rate-card-entries]
          - endpoints[GET /carriage/rate-card-entries/{rateCardEntryId}]
        distinguishing_aspect: >-
          RateCardEntry declares common_fields: false, so its create response and
          its GET both carry an id and the published values but NO created_at,
          updated_at or version key at all — and §1.5 exposes no PATCH, PUT or
          DELETE for the resource, so a published card row can never be amended.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /carriage/rate-card-entries"
              payload:
                rate_card_class: "CLASS_A"
                tier: "EXPANDED_BASIC"
                published_rate_cents_per_sub: 44.5000
                effective_from: "2026-01-01T00:00:00Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                rc_id: "id"
          assert:
            - "response status code == 201"
            - "response body data.id is a non-empty string and data.published_rate_cents_per_sub == 44.5000"
            - "response body data.min_subscribers == 0 (declared default) and data.effective_to == null"
            - "response body data contains NO version, created_at or updated_at key"
            - "GET /carriage/rate-card-entries/${rc_id} returns the same body and likewise no version key"
            - "the §1.5 endpoint table declares no PATCH, PUT or DELETE for /carriage/rate-card-entries or /carriage/rate-card-entries/{rateCardEntryId}"

      - name: window_body_foreign_keys_checked_in_declaration_order
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: >-
          With BOTH agreement_id and content_title_id bogus, the response is
          ERR_AGREEMENT_NOT_FOUND, because priority 11 resolves body foreign keys
          in declaration order (distributor_id, agreement_id, content_title_id,
          ...); fixing only agreement_id then surfaces ERR_TITLE_NOT_FOUND.
        test_recipe:
          setup:
            - "One executed agreement exists so the second half of the test can supply a real agreement_id; no ContentTitle exists."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-A"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_a_id: "id"
          trigger:
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "00000000-0000-4000-8000-0000000000a1"
                content_title_id: "00000000-0000-4000-8000-0000000000b2"
                platform: "VOD"
                territory_code: "US"
                window_start: "2026-09-01T00:00:00Z"
                window_end: "2026-09-30T00:00:00Z"
                exclusivity: "NON_EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
          assert:
            - "response status code == 404"
            - "response body data.error_id == \"ERR_AGREEMENT_NOT_FOUND\""
            - "the same call with agreement_id=${ag_a_id} and the bogus content_title_id returns 404 with data.error_id == \"ERR_TITLE_NOT_FOUND\""
            - "GET /carriage/rights-windows with agreement_id=${ag_a_id} returns total_count == 0"

      - name: subscriber_report_create_stamps_provisional_fee_and_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /carriage/subscriber-reports]
          - entities.SubscriberReport.fields.provisional_fee_cents
          - entities.SubscriberReport.fields.invoice_id
          - entities.SubscriberReport.fields.audit_adjustment_cents
        distinguishing_aspect: >-
          A freshly filed report is SUBMITTED with penetration_pct 0.6500 and
          provisional_fee_cents 5,200,000 already stamped, while the acceptance-only
          fields are still null — billable_subscribers, rate_applied_cents_per_sub
          and license_fee_due_cents — and invoice_id is null with
          audit_adjustment_cents 0.
        test_recipe:
          setup:
            - "Cliffside Telco (200,000 homes) holds an executed flat-rate agreement at 40.0000 cents with a 50% penetration floor; nothing has been reported yet."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dc_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dc_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_id: "id"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_version: "version"
          trigger:
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${ac_version}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
              captures:
                rc_report_id: "id"
          assert:
            - "response status code == 201"
            - "response body data.status == \"SUBMITTED\" and data.version == 1"
            - "response body data.penetration_pct == 0.6500 and data.provisional_fee_cents == 5200000"
            - "response body data.billable_subscribers == null, data.rate_applied_cents_per_sub == null and data.license_fee_due_cents == null"
            - "response body data.invoice_id == null, data.audit_adjustment_cents == 0, data.restatement_of_report_id == null and data.accepted_at == null"
            - "GET /carriage/agreements/${ac_id} returns recognized_revenue_cents == 0 — filing alone recognizes nothing"

  # ===========================================================================
  # SECTION 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: agreement_initial_states_are_draft_and_not_due
        claim_type: initial_state
        grounds:
          - entities.CarriageAgreement.fields.lifecycle_status
          - entities.CarriageAgreement.fields.renewal_status
          - entities.CarriageAgreement.fields.penetration_compliance_status
          - endpoints[POST /carriage/agreements]
        distinguishing_aspect: >-
          A newly created agreement starts on BOTH state machines at once —
          lifecycle_status DRAFT (SM1) and renewal_status NOT_DUE (SM2) — with
          penetration_compliance_status UNKNOWN, suspension_reason NONE and
          executed_at still null.
        test_recipe:
          setup:
            - "One Distributor exists; the clock sits at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
          trigger:
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-INIT"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_id: "id"
          assert:
            - "response status code == 201"
            - "response body data.lifecycle_status == \"DRAFT\" and data.renewal_status == \"NOT_DUE\""
            - "response body data.penetration_compliance_status == \"UNKNOWN\" and data.suspension_reason == \"NONE\""
            - "response body data.executed_at == null, data.penetration_breach_count == 0 and data.consecutive_compliant_periods == 0"
            - "response body data.mfn_capped == false and data.recognized_revenue_cents == 0"
