              as: LabTechnician
              captures: { b: $.data.id }
            - call: "POST /dna/lab-batches/${b}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${b}/finalize"
              payload: { sample_results: [ { sample_id: "${s}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
