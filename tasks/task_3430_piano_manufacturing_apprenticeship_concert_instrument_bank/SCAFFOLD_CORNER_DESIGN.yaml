        claim_type: conditional_validation
        grounds: ["validations[priority=5]", "errors[ERR_SOD_ASSESSOR_IS_SUPERVISOR]"]
        distinguishing_aspect: "Segregation of duties: the craftsman who supervised all 600 hours cannot endorse; a different master craftsman can, and becomes endorsed_by_craftsman_id."
