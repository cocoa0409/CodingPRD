scaffold_corner_design:

  - section: entities
    instances:
      - name: host_store_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - "entities.HostStore.fields.pos_integration_status"
          - "entities.HostStore.fields.pos_terminal_count"
          - "entities.HostStore.fields.last_attested_on"
          - "entities.HostStore.fields.space_compliance_state"
          - "calculations.space_obligation_compliance"
        distinguishing_aspect: |
          A HostStore created with only its eight input fields comes back with pos_integration_status NOT_CONNECTED, pos_terminal_count 0, last_attested_on null and space_compliance_state UNVERIFIED — every system and computed field takes its declared default rather than anything the client could have supplied.
        test_recipe:
          setup:
            - "an empty database"
            - "clock at 2026-08-03T11:00:00Z"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
          trigger:
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_new_id: $.data.id, hs_new_state: $.data.space_compliance_state }
          assert:
            - "the response status is 201 and response_type is \"object\""
            - "meta.api_request_id and meta.api_request_timestamp are both present on the envelope"
            - "HostStore.${hs_new_id}.pos_integration_status == NOT_CONNECTED"
            - "HostStore.${hs_new_id}.pos_terminal_count == 0"
            - "HostStore.${hs_new_id}.attested_sushi_space_sqft == null and attested_case_linear_ft == null"
            - "HostStore.${hs_new_id}.last_attested_on == null"
            - "HostStore.${hs_new_id}.space_compliance_state == UNVERIFIED"
            - "HostStore.${hs_new_id}.weekly_traffic_count == 63000 and refrigerated_case_capacity_packs == 400"
            - "HostStore.${hs_new_id}.version == 1 and created_at == updated_at"
      - name: license_agreement_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - "entities.LicenseAgreement.fields.status"
          - "entities.LicenseAgreement.fields.revenue_share_model"
          - "entities.LicenseAgreement.fields.space_shortfall_sqft"
          - "entities.LicenseAgreement.fields.active_kiosk_count"
          - "entities.LicenseAgreement.fields.lifetime_share_accrued_cents"
        distinguishing_aspect: |
          GET /kiosk-ops/license-agreements/{id} returns exactly the row the create-and-activate chain produced: status ACTIVE, revenue_share_model GROSS_SALES, space_shortfall_sqft 0 (240 attested against a 220 obligation) and active_kiosk_count 1 for the single commissioned kiosk.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z (the mandatory logical clock default is 2026-08-01T00:00:00Z)"
            - "one HostStore 'Northgate Market 418' with pos_integration_status CONNECTED and an attestation of 240 sqft / 20.0 case linear ft, so space_compliance_state is COMPLIANT"
            - "one ACTIVE LicenseAgreement (GROSS_SALES, PRORATED_REMAINING_LIFE, min 220 sqft / 18.0 ft, 1250 cents per shortfall sqft, term 2026-08-01..2027-07-31)"
            - "one CERTIFIED chef with 30 logged training hours plus VALID FOOD_HANDLER and HACCP_RICE_ACIDIFICATION certifications"
            - "one kiosk K-418-A commissioned on 2026-08-03, so operational_state is OPERATING, sanitation_posture is CLEAR and certified_chef_count is 1"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
            - call: "POST /kiosk-ops/host-stores/${hs_id}/pos-integration"
              payload: { pos_integration_status: "CONNECTED", pos_terminal_count: 6 }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/host-stores/${hs_id}/space-attestation"
              payload: { attested_sushi_space_sqft: 240, attested_case_linear_ft: 20.0, attested_on: "2026-08-01" }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/license-agreements"
              payload: { host_store_id: "${hs_id}", revenue_share_model: "GROSS_SALES", markdown_policy: "PRORATED_REMAINING_LIFE", min_space_sqft_obligation: 220, min_case_linear_ft_obligation: 18.0, space_credit_cents_per_sqft: 1250, effective_from: "2026-08-01", effective_to: "2027-07-31" }
              as: FranchisorOps
              captures: { la_id: $.data.id }
            - call: "POST /kiosk-ops/license-agreements/${la_id}/activate"
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs"
              payload: { full_name: "Kenji Arai" }
              as: FranchisorOps
              captures: { chef_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/training"
              payload: { hours: 30, curriculum_code: "HS-CORE-24" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", exam_score: 92, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_fh_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "HACCP_RICE_ACIDIFICATION", exam_score: 95, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_hc_id: $.data.id }
            - call: "POST /kiosk-ops/kiosks"
              payload: { license_agreement_id: "${la_id}", kiosk_code: "K-418-A", case_footprint_sqft: 230 }
              as: FranchisorOps
              captures: { kiosk_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/placement"
              payload: { assigned_kiosk_id: "${kiosk_id}", as_lead_chef: true }
              as: FranchisorOps
            - call: "POST /kiosk-ops/kiosks/${kiosk_id}/commission"
              payload: { commissioned_on: "2026-08-03" }
              as: FranchisorOps
          trigger:
            - call: "GET /kiosk-ops/license-agreements/${la_id}"
              as: FranchisorOps
              captures: { la_status: $.data.status, la_kiosks: $.data.active_kiosk_count }
          assert:
            - "the response status is 200 and response_type is \"object\""
            - "LicenseAgreement.${la_id}.status == ACTIVE"
            - "LicenseAgreement.${la_id}.revenue_share_model == GROSS_SALES"
            - "LicenseAgreement.${la_id}.markdown_policy == PRORATED_REMAINING_LIFE"
            - "LicenseAgreement.${la_id}.min_space_sqft_obligation == 220 and min_case_linear_ft_obligation == 18.0"
            - "LicenseAgreement.${la_id}.space_credit_cents_per_sqft == 1250"
            - "LicenseAgreement.${la_id}.space_shortfall_sqft == 0"
            - "LicenseAgreement.${la_id}.active_kiosk_count == 1"
            - "LicenseAgreement.${la_id}.lifetime_share_accrued_cents == 0"
            - "LicenseAgreement.${la_id}.suspension_reason == null"
      - name: kiosk_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "entities.Kiosk.fields.kiosk_code"
          - "entities.Kiosk.fields.operational_state"
          - "entities.LicenseAgreement.fields.active_kiosk_count"
        distinguishing_aspect: |
          With two commissioned kiosks under one agreement, GET /kiosk-ops/kiosks?limit=1&offset=0 returns a one-element data array with total_count 2 and has_more true, and the same query at offset=1 returns has_more false — the pagination envelope reports the full filtered set, not the page.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z (the mandatory logical clock default is 2026-08-01T00:00:00Z)"
            - "one HostStore 'Northgate Market 418' with pos_integration_status CONNECTED and an attestation of 240 sqft / 20.0 case linear ft, so space_compliance_state is COMPLIANT"
            - "one ACTIVE LicenseAgreement (GROSS_SALES, PRORATED_REMAINING_LIFE, min 220 sqft / 18.0 ft, 1250 cents per shortfall sqft, term 2026-08-01..2027-07-31)"
            - "one CERTIFIED chef with 30 logged training hours plus VALID FOOD_HANDLER and HACCP_RICE_ACIDIFICATION certifications"
            - "one kiosk K-418-A commissioned on 2026-08-03, so operational_state is OPERATING, sanitation_posture is CLEAR and certified_chef_count is 1"
            - "a second kiosk K-418-B under the SAME license agreement, commissioned with its own CERTIFIED lead chef"
            - "so the agreement's active_kiosk_count is 2"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
