        claim_type: action_endpoint
        grounds: ["state_machines.EscheatmentRecord.DORMANT_to_DUE_DILIGENCE_SENT", "state_machines.EscheatmentRecord.DUE_DILIGENCE_SENT_to_REMITTED", "validations[priority=23]", "validations[priority=33]", "errors[ERR_DUE_DILIGENCE_TOO_EARLY]", "errors[ERR_ESCHEATMENT_ALREADY_EXISTS]", "errors[ERR_ESCHEATMENT_INVALID_STATE]"]
        distinguishing_aspect: "The escheat action chain is gated on three separate dates: a second record for the same check is refused with ERR_ESCHEATMENT_ALREADY_EXISTS, due-diligence before 2029-04-21 is refused with ERR_DUE_DILIGENCE_TOO_EARLY, a repeat due-diligence after the letter is refused with ERR_ESCHEATMENT_INVALID_STATE, and the remit at 2029-08-19 remits 11720 cents while driving the check to ESCHEATED and the credit balance to ESCHEATED."
