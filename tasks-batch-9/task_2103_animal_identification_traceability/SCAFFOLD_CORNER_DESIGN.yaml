        distinguishing_aspect: "POST /premises/{id}/approve is exclusive to StateAnimalHealthOfficial; a Producer calling it - even on its own premises - gets ERR_FORBIDDEN_ROLE (403) at priority 2, before the state check."
        test_recipe:
