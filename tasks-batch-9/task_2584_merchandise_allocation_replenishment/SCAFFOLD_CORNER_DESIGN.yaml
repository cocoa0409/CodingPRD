              captures: { ex1: $.data.error_id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-LOW", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1499 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { ex2: $.data.error_id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-HIGH", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1501 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { ex3: $.data.error_id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-9001", style_code: "ST-900", item_class: "APPAREL_BOTTOM", item_type: "BASIC", size_profile_id: "${sp_id}", unit_cost_usd: 11.00, retail_price_usd: 29.00 }
              as: PlanningAdmin
