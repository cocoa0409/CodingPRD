          assert:
            - "HTTP 409 with error_id ERR_INVALID_DISPATCH_STATE"
            - "the response is NOT HTTP 402 and the error_id is NOT ERR_CASH_LIMIT_REACHED, even though Driver.${drv_id}.cash_posture == DROP_REQUIRED at the moment of the call"
            - "Dispatch.${dsp_id}.status == RETURNED, unchanged"
            - "Driver.${drv_id}.cash_on_hand_cents == 2900, unchanged"
            - "isolation control: a NEW dispatch for the same driver with planned_depart_at 2026-08-05T14:00:00Z, one fresh READY disclosed order stacked on it and locked, does return HTTP 402 ERR_CASH_LIMIT_REACHED on depart, proving priority 38 is implemented and was merely outranked here"

      - name: driver_qualification_error_outranks_stop_free_dispatch_error_on_lock
        grounds:
          - validations.priority_13
          - validations.priority_25
