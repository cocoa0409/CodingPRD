      - name: errors_obligated_award_family_rejected
        claim_type: triggerability
        grounds:
          - validations.ERR_AWARD_NOT_FOUND
          - validations.ERR_MILESTONE_NOT_FOUND
          - validations.ERR_AUDIT_NOT_FOUND
          - validations.ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND
          - validations.ERR_AWARD_STATE_INVALID
