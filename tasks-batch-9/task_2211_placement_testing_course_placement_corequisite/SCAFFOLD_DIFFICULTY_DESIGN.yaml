              captures: { reg_y_prereq_after: $.data.prerequisite_status }
            - call: "POST /registrations/${reg_x}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_confirm_expired: $.data.error_id }
          assert:
            - "${reg_x_prereq} == \"OVERRIDDEN\" and ${reg_y_prereq} == \"OVERRIDDEN\" and ${reg_z_state} == \"ENROLLED\" and ${oz_state_before} == \"CONSUMED\" (setup)"
            - "ONE SECOND BELOW: ${ox_before} == \"ISSUED\" — expires_at > clock, so the sweep does not touch it"
            - "AT THE BOUNDARY: ${ox_at} == \"EXPIRED\" — expires_at == the new clock value satisfies the INCLUSIVE precondition"
            - "AT THE BOUNDARY: ${oy_at} == \"ISSUED\" — one second of headroom is enough to survive"
            - "AT THE BOUNDARY: ${oz_at} == \"CONSUMED\" and ${oz_consumer} == \"${reg_z}\" — the sweep only touches ISSUED rows, so a redeemed grant outlives its own expiry date"
            - "CASCADE: ${reg_x_prereq_at} == \"UNMET\" while ${reg_x_state_at} == \"PENDING\" — the expiry re-derives prerequisite_status without moving the registration's state"
            - "CASCADE: ${reg_y_prereq_at} == \"OVERRIDDEN\" — the sibling is untouched, which is what makes this a boundary and not a blanket sweep"
            - "ONE SECOND ABOVE: ${oy_after} == \"EXPIRED\" and ${reg_y_prereq_after} == \"UNMET\""
            - "${err_confirm_expired} == \"ERR_PREREQUISITE_NOT_MET\" with HTTP 422 — the downstream confirm now fails on the re-derived closure, not on any stored flag"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: attempt_check_in_and_booking_gated_by_administration_status
        entity_pair: "TestAttempt (child) depends on TestAdministration (parent)"
        grounds:
          - state_machines.TestAttempt.BOOKED_to_CHECKED_IN
          - state_machines.TestAdministration.OPEN_to_CLOSED
          - validations[priority=9].ERR_ADMINISTRATION_NOT_OPEN
          - endpoints[POST /test-attempts/{attempt_id}/check-in]
        distinguishing_aspect: |
          The attempt's own state is BOOKED and every intrinsic precondition holds,
          yet check-in must be refused because the PARENT session has not been
          opened. The same parent-state dependency then reappears on a different
          endpoint with a different error: once the session is CLOSED, booking a
          new seat is refused with ERR_ADMINISTRATION_NOT_BOOKABLE. And the close
          itself reaches back down the dependency to move a child that nobody
          touched: a still-BOOKED attempt becomes NO_SHOW, without consuming the
          student's retake budget.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Session D1: room T13, proctor-11, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, left SCHEDULED — the window brackets the clock, so the ONLY unmet check-in precondition is the parent's status."
            - "Students SD and SE, no transcript and no pathway; both book a seat in D1 while it is still SCHEDULED (booking is allowed in SCHEDULED)."
            - "No PlacementDetermination exists for either student, so no cascade beyond the attempt layer can confuse the observation."
          setup_api_calls:
            - call: "POST /test-administrations"
