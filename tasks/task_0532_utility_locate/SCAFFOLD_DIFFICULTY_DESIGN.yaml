              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: Admin
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { s1: $.data.status, p1: $.data.response_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:01Z" }
              as: Admin
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: Excavator
