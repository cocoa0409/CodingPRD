            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "EN2", full_name: "En Two", dob: "2009-01-02", home_language: "en" }, captures: { s_en2: $.data.id, s_en2_v: $.data.version } }
