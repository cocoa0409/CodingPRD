            - { call: "POST /peer-review/committee-members/${m_b}/conflict-declarations", payload: { provider_id: "${p_sub}", conflict_type: "PRIOR_TREATING" }, as: CommitteeMember, as_user_id: "${m_b}", captures: { cd1: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "conflict case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
            - { call: "DELETE /peer-review/conflict-declarations/${cd1}", as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
          assert:
            - "first attempt: error_id == 'ERR_REVIEWER_CONFLICT_DECLARED' with HTTP 422"
            - "after the member rescinds the declaration (DELETE 204), the identical assignment succeeds (HTTP 201)"
            - "the blocked first attempt created no assignment: sequence of the successful one == 1"

