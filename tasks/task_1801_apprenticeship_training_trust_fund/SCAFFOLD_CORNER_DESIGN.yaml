  # ===========================================================================
  # Section: endpoints — side effects and action semantics
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_default_is_fixed_epoch
        claim_type: conditional_action
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is fixed at 2026-08-01T00:00:00Z, so a (2026,9) report is rejected without any clock manipulation."
        test_recipe:
          setup: ["Fresh server; no clock call has been made."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 9, lines: [{ apprentice_id: "${app_id}", ojt_hours: 10 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_PERIOD"

      - name: pay_claim_pay_disburses_fund
        claim_type: side_effect_execution
        grounds: ["endpoints[POST /pay-claims/{id}/pay]", "state_machines.InstructorPayClaim.APPROVED_to_PAID"]
        distinguishing_aspect: "Paying an APPROVED claim of 12000 cents raises fund disbursed_cents by 12000 and stamps paid_at."
        test_recipe:
          setup: ["Completed class; claim APPROVED with payable 12000."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 5, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /classes/${cls_id}/complete"
              payload: { attended_enrollment_ids: [] }
              as: TrustAdmin
            - call: "POST /pay-claims"
              payload: { class_id: "${cls_id}", pay_basis: "SCHEDULED" }
              as: Instructor
              as_user_id: "inst-1"
              captures: { clm_id: $.data.id }
            - call: "POST /pay-claims/${clm_id}/approve"
              payload: {}
              as: CommitteeMember
          trigger:
            - call: "POST /pay-claims/${clm_id}/pay"
              payload: {}
              as: TrustAdmin
          assert:
            - "InstructorPayClaim.${clm_id}.status == PAID"
            - "InstructorPayClaim.${clm_id}.paid_at != null"
            - "TrustFund.${fund_id}.disbursed_cents == 12000"

