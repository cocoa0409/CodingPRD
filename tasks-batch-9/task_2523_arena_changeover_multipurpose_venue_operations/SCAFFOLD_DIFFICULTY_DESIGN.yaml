      - name: three_parallel_changeover_dimensions_advance_independently_and_rework_resets_only_one_axis
        grounds:
          - state_machines.ChangeoverOrder.PLANNED_to_IN_PROGRESS
          - state_machines.ChangeoverOrder.IN_PROGRESS_to_READY_FOR_SIGNOFF
          - state_machines.ChangeoverOrder.READY_FOR_SIGNOFF_to_REWORK
          - entities.ChangeoverOrder.fields.floor_stage
          - entities.ChangeoverOrder.fields.seating_stage
          - entities.ChangeoverOrder.fields.infra_stage
          - entities.ChangeoverOrder.fields.rework_count
          - entities.ChangeoverOrder.fields.started_at_utc
          - entities.ChangeoverOrder.fields.completed_at_utc
        distinguishing_aspect: |
          The order's `status` is not a single position on a path but a projection of three
          independent axes: advancing SEATING to RETRACTING leaves floor_stage at STRIKING and
          infra_stage at NOT_STARTED, a FLOOR jump from STRIKING straight to FLOOR_COMPLETE is
          rejected as a non-successor with ERR_INVALID_ORDER_STATE, and the rework loop drives the
          row BACK from READY_FOR_SIGNOFF to REWORK resetting only floor_stage to NOT_STARTED while
          seating_stage stays SEATING_COMPLETE, infra_stage stays BROADCAST_READY, completed_at_utc
          is cleared to null and started_at_utc survives at 2026-09-10T04:00:00.000Z.
