              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Mina Okafor", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { p1_id: $.data.id }
            - call: "POST /prize-distributions"
              payload: { organization_id: "${org_id}", league_id: "${league_id}", tournament_name: "Summer Invitational", placement: 1, gross_prize_cents: 10000000, tournament_end_at: "2026-08-20T00:00:00Z" }
              as: FinanceOfficer
