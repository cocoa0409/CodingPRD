        claim_type: precondition_enforcement
        grounds:
          - state_machines.Establishment.transitions.OPERATING_to_PERMANENTLY_CLOSED
          - validations[priority=42]
          - errors[ERR_UNIT_HAS_OPEN_ENFORCEMENT]
        distinguishing_aspect: "The closure precondition is scoped to the PERMANENTLY_CLOSED target only: with an OPEN EnforcementAction on the unit, PERMANENTLY_CLOSED returns ERR_UNIT_HAS_OPEN_ENFORCEMENT (409) while TEMPORARILY_CLOSED on the very same unit still succeeds."
