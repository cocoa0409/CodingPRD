          - state_machines.Athlete.SCREENED_RESTRICTED_to_CLEARED_BY_APPEAL
          - entities.Athlete.fields.registration_status
          - entities.Athlete.fields.medical_status
        distinguishing_aspect: |
          NON-LINEARITY = PARALLEL STATE DIMENSIONS on the Athlete row: registration_status and
          medical_status are two independent machines over the same row, and this instance moves
          each one while the other is pinned - the screening advances medical_status to
          SCREENED_RESTRICTED with registration_status still PENDING_PAYMENT, then payment advances
          registration_status to REGISTERED with medical_status unchanged, then the granted appeal
          advances medical_status to CLEARED_BY_APPEAL with registration_status still REGISTERED.
