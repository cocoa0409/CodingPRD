            - "the GO_INACTIVE returns 200 with Licensee.${rae_id}.license_status == INACTIVE and inactive_since == 2026-08-01T00:00:00Z"
            - "the same GO_INACTIVE retroactively sets AdvertisingName.${adv_id}.status == REVOKED with rejection_reason == TEAM_LEAD_INELIGIBLE, without any call against the advertising name"
            - "the new submission naming the INACTIVE lead returns 422 ERR_TEAM_LEAD_NOT_AFFILIATED and no AdvertisingName row is created for RAEFIELDGROUP"
            - "GET /commission/advertising-names with brokerage_id ${bkg_id} returns exactly one row"
            - "Brokerage.${bkg_id}.affiliated_licensee_count == 1 after the lead went inactive (only the designated broker remains)"
      - name: brokerage_activation_gated_on_an_open_escrow_trust_account_of_the_right_type
        grounds:
          - validations[priority=28]
          - errors.ERR_TRUST_ACCOUNT_REQUIRED
          - state_machines.Brokerage.PENDING_to_ACTIVE
          - entities.TrustAccount.fields.account_type
        distinguishing_aspect: |
          A third entity pair - Brokerage against TrustAccount - where the gate is not merely existence
          but the child's TYPE and STATE together: a SECURITY_DEPOSIT account in OPEN status does not
          satisfy a brokerage that declared trust_account_required, and only an ESCROW account in OPEN
          status unlocks the PENDING -> ACTIVE transition, which is also what finally issues the
          designated broker's licence.
        test_recipe:
          setup:
            - "broker Cal Broker is EXAM_PASSED and unaffiliated"
            - "brokerage Cove Realty is PENDING with trust_account_required == true and no trust accounts at all"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Cal Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { cal_id: $.data.id }
            - call: "POST /commission/licensees/${cal_id}/exam-results"
              payload: { score: 87, taken_on: "2026-07-02" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Cove Realty", designated_broker_id: "${cal_id}", trust_account_required: true, record_retention_years: 7 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
          trigger:
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no accounts yet" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Cove Savings", account_type: "SECURITY_DEPOSIT" }
              as: LicensingAnalyst
              captures: { sd_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "security deposit account only" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Cove Savings", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { esc_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
          assert:
            - "the first activation returns 409 ERR_TRUST_ACCOUNT_REQUIRED and Brokerage.${bkg_id}.status stays PENDING"
            - "the second activation still returns 409 ERR_TRUST_ACCOUNT_REQUIRED: TrustAccount.${sd_id} is OPEN but its account_type is SECURITY_DEPOSIT, so the type half of the gate fails"
            - "Licensee.${cal_id}.license_status is still EXAM_PASSED after both refusals - the licence issuance rides on the activation and must not leak out early"
            - "TrustAccount.${esc_id}.status == OPEN with account_type == ESCROW, shortage_cents == 0 and book_available_cents == 0"
            - "the third activation returns 200 with Brokerage.${bkg_id}.status == ACTIVE and supervision_posture == COMPLIANT"
            - "the same response shows the cross-entity consequence: Licensee.${cal_id}.license_status == ACTIVE with sponsoring_brokerage_id == ${bkg_id}, supervising_broker_id == ${cal_id} and license_expires_at == 2028-07-31T00:00:00Z (2026-08-01 plus 730 days)"
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_room_buffered_exclusion_rejects_adjacency_and_a_29_minute_gap
        grounds:
          - validations[priority=40]
          - errors.ERR_HEARING_ROOM_CONFLICT
          - entities.Hearing.fields.hearing_room
          - entities.Hearing.fields.scheduled_start_at
        distinguishing_aspect: |
          The resource is a physical room and the interval semantics are buffered exclusion: two slots
          conflict unless the gap between them is at least 30 minutes on whichever side they meet.
          Adjacency (gap 0) is a conflict, a 29-minute gap is still a conflict, exactly 30 minutes is
          clean, and the buffer applies symmetrically - a slot that ENDS exactly 30 minutes before the
          sitting hearing starts is also accepted.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker; salespersons Rae Field, Ken Ito and Lin Ozu are ACTIVE and affiliated"
            - "complaint CMP-A against Rae Field is at HEARING_SCHEDULED with hearing H1 in ROOM-A from 2026-08-10T09:00:00Z to 2026-08-10T11:00:00Z chaired by chair-01"
