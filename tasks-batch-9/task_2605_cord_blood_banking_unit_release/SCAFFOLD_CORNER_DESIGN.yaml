      - name: corner_excursion_resolve_before_acknowledge_and_acknowledge_after_resolve_are_both_refused
        claim_type: error_triggerable
        grounds: "§1.4 priority 9 -> ERR_INVALID_EXCURSION_STATE 'the excursion is not OPEN or ESCALATED at acknowledge time, or not ACKNOWLEDGED or ESCALATED at resolve time'; §1.2 the TemperatureExcursion axis OPEN -> ACKNOWLEDGED -> RESOLVED."
        distinguishing_aspect: "Both ends of the same state code on one row: resolving while still OPEN (too early) and acknowledging after RESOLVED (too late), with the legal middle transitions asserted in between so the row's own progress is proven."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "One ONLINE STANDARD tank TANK-A with capacity_slots 4 and no units."
            - "A temperature reading of -140.0 C at 2026-08-01T01:00:00Z drives the tank to ALARM and opens an excursion."
            - "No unit is stored, so no quarantine cascade can interfere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-A", tank_class: "STANDARD", capacity_slots: 4 }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
              captures: { tank_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks/${tank_id}/temperature-readings"
              payload: { reading_c: -140.0, reading_at: "2026-08-01T01:00:00Z" }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "GET /cbb/storage-tanks/${tank_id}/temperature-excursions"
              as: FacilitiesEngineer
              as_user_id: "fe-001"
              captures: { exc_id: "$.data[0].id" }
          trigger:
            - call: "POST /cbb/temperature-excursions/${exc_id}/resolve"
              payload: { disposition: "NO_IMPACT", peak_temperature_c: -140.0 }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:20:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/temperature-excursions/${exc_id}/acknowledge"
              payload: { acknowledgement_note: "engineer on site" }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:40:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/temperature-excursions/${exc_id}/resolve"
              payload: { disposition: "NO_IMPACT", peak_temperature_c: -140.0 }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/temperature-excursions/${exc_id}/acknowledge"
              payload: { acknowledgement_note: "second look" }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "GET /cbb/storage-tanks/${tank_id}"
              as: FacilitiesEngineer
              as_user_id: "fe-001"
          assert:
            - "call 1 returns HTTP 409 with error_id ERR_INVALID_EXCURSION_STATE — resolve requires ACKNOWLEDGED or ESCALATED and the row is still OPEN"
            - "the acknowledge at 2026-08-01T01:20:00Z returns HTTP 200 with status == ACKNOWLEDGED and acknowledged_at == 2026-08-01T01:20:00Z"
            - "the resolve at 2026-08-01T01:40:00Z returns HTTP 200 with status == RESOLVED, resolved_at == 2026-08-01T01:40:00Z and duration_minutes == 40"
            - "the final acknowledge returns HTTP 409 ERR_INVALID_EXCURSION_STATE again — RESOLVED admits no acknowledgement"
            - "tank read: status == ONLINE, cumulative_excursion_minutes_30d == 40, last_temperature_c == -140.0"

      - name: corner_payment_against_a_paid_invoice_is_a_state_error_not_a_balance_error
