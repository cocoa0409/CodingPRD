              as: PayrollAdmin
            - *c_batch
          trigger:
            - *c_close
            - call: "GET /payroll/pay-lines"
              payload: { pay_batch_id: "${bat}" }
              as: PayrollClerk
              captures: { ln_tax: "$.data[0].tax_cents", ln_garn: "$.data[0].garnished_cents", ln_net: "$.data[0].net_cents", ln_phw: "$.data[0].phw_cents" }
          assert:
            - "PayLine.tax_cents == 0 and garnished_cents == 0 (loan-out gross payment, garnishment-exempt)"
            - "PayLine.net_cents == 149375 == gross_cents (no deductions at all)"
            - "PayLine.phw_cents == 23453 (PHW employer contributions still accrue on gross for loan-outs)"

  - section: validations
    instances:
      - name: flag_nonexistent_timecard_returns_404_not_state_error
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
