scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: design_rental_vs_purchase_quote_divergence
        grounds:
          - calculations.exhibit_acquisition_quote
          - entities.ExhibitDesign.fields.rental_quote_cents
          - entities.ExhibitDesign.fields.purchase_quote_cents
          - entities.ExhibitDesign.fields.breakeven_show_count
          - state_machines.ExhibitDesign.DRAFT_to_QUOTED
        distinguishing_aspect: |
          On the ExhibitDesign entity domain, one quote run evaluates the same geometry under
          two algorithms and stores both: RENTAL_QUOTE yields 1842400 cents while
          PURCHASE_QUOTE yields 5577500 cents, and the amortization arm additionally produces
          a breakeven_show_count of 3 that the rental arm has no analogue for.
        test_recipe:
          setup:
            - "A venue that permits hanging signs on ISLAND booths, a show OPEN_FOR_ORDERS, an exhibitor with a 5000000 cent credit limit and an OPEN 400 sqft ISLAND booth"
            - "A DRAFT ExhibitDesign of 400 sqft, 40 linear feet, with a hanging sign, expected to be reused across 3 shows, with RENTAL selected"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", straight_time_start_hhmm: "08:00", straight_time_end_hhmm: "16:30", max_forklift_capacity_lbs: 6000, hanging_sign_booth_types: ["ISLAND", "PENINSULA"], dock_count: 4 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "1024", sqft: 400, booth_type: "ISLAND" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id }
            - call: "POST /exhibit-designs"
              payload: { exhibitor_id: "${ex_id}", booth_id: "${booth_id}", sqft: 400, linear_feet: 40, selected_acquisition_mode: "RENTAL", has_hanging_sign: true, expected_show_count: 3 }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { design_id: $.data.id }
          trigger:
            - call: "POST /exhibit-designs/${design_id}/quote"
              payload: {}
              as: Exhibitor
              as_user_id: "${ex_id}"
          assert:
            - "ExhibitDesign.${design_id}.status == QUOTED"
            - "ExhibitDesign.${design_id}.rental_quote_cents == 1842400"
            - "ExhibitDesign.${design_id}.purchase_quote_cents == 5577500"
            - "ExhibitDesign.${design_id}.rental_per_show_cents == 1842400"
            - "ExhibitDesign.${design_id}.purchase_per_show_cents == 1532333"
            - "ExhibitDesign.${design_id}.breakeven_show_count == 3"
            - "ExhibitDesign.${design_id}.quoted_price_cents == 1842400"
            - "ExhibitDesign.${design_id}.rental_quote_cents != ExhibitDesign.${design_id}.purchase_quote_cents"

      - name: claim_tariff_vs_declared_value_divergence
        grounds:
          - calculations.claim_settlement
          - entities.DamageClaim.fields.settlement_cents
          - entities.DamageClaim.fields.coverage_basis
          - state_machines.DamageClaim.UNDER_INVESTIGATION_to_APPROVED
        distinguishing_aspect: |
          On the DamageClaim entity domain, two claims with byte-identical inputs (1250 lb crate,
          900000 cent declared value, grade B asset worth 1500000) settle at 37500 cents under
          TARIFF_LIABILITY and at 785000 cents under DECLARED_VALUE, because one arm is capped by
          crate weight and the other by depreciated list value less a deductible.
        setup_note: "Two identical assets and crates are used so that each claim is adjudicated exactly once."
        test_recipe:
          setup:
            - "A show OPEN_FOR_ORDERS at a venue, an exhibitor, and two identical grade-B assets each worth 1500000 cents"
            - "Two identical 1250 lb wood crates, one packed with each asset, received on one ADVANCE_WAREHOUSE shipment that carries declared-value coverage"
            - "Two DAMAGE claims of 900000 cents declared value, each UNDER_INVESTIGATION, one citing each crate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /warehouses"
              payload: { name: "Chicago Advance WH", city: "Chicago", capacity_cwt: 1000, storage_rate_cents_per_cwt_per_month: 2200, free_days: 30, dock_capacity_cwt: 300 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { wh_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /exhibit-assets"
              payload: { exhibitor_id: "${ex_id}", acquisition_mode: "PURCHASE", list_value_cents: 1500000, shipping_weight_lbs: 1400, condition_grade: "B" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { asset_a_id: $.data.id }
            - call: "POST /exhibit-assets"
              payload: { exhibitor_id: "${ex_id}", acquisition_mode: "PURCHASE", list_value_cents: 1500000, shipping_weight_lbs: 1400, condition_grade: "B" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { asset_b_id: $.data.id }
            - call: "POST /crates"
              payload: { exhibitor_id: "${ex_id}", crate_label: "ACME-C1", crate_type: "WOOD_CRATE", weight_lbs: 1250, asset_id: "${asset_a_id}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { crate_a_id: $.data.id }
            - call: "POST /crates"
              payload: { exhibitor_id: "${ex_id}", crate_label: "ACME-C2", crate_type: "WOOD_CRATE", weight_lbs: 1250, asset_id: "${asset_b_id}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { crate_b_id: $.data.id }
            - call: "POST /drayage-shipments"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", channel: "ADVANCE_WAREHOUSE", warehouse_id: "${wh_id}", crate_ids: ["${crate_a_id}", "${crate_b_id}"], received_at: "2026-09-08T10:00:00Z", dock_window_start: "2026-09-08T08:00:00Z", dock_window_end: "2026-09-08T12:00:00Z", declared_value_coverage: true }
              as: WarehouseAgent
              as_user_id: "${wh_id}"
              captures: { ship_id: $.data.id }
            - call: "POST /damage-claims"
              payload: { exhibitor_id: "${ex_id}", asset_id: "${asset_a_id}", claim_type: "DAMAGE", declared_value_cents: 900000, incident_at: "2026-09-09T12:00:00Z", crate_id: "${crate_a_id}", shipment_id: "${ship_id}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /damage-claims"
              payload: { exhibitor_id: "${ex_id}", asset_id: "${asset_b_id}", claim_type: "DAMAGE", declared_value_cents: 900000, incident_at: "2026-09-09T12:00:00Z", crate_id: "${crate_b_id}", shipment_id: "${ship_id}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { claim_b_id: $.data.id }
            - call: "POST /damage-claims/${claim_a_id}/investigation"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /damage-claims/${claim_b_id}/investigation"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /damage-claims/${claim_a_id}/adjudication"
              payload: { decision: "APPROVE", coverage_basis: "DECLARED_VALUE" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /damage-claims/${claim_b_id}/adjudication"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "DamageClaim.${claim_a_id}.coverage_basis == DECLARED_VALUE"
            - "DamageClaim.${claim_a_id}.settlement_cents == 785000"
            - "DamageClaim.${claim_b_id}.coverage_basis == TARIFF_LIABILITY"
            - "DamageClaim.${claim_b_id}.settlement_cents == 37500"
            - "ExhibitAsset.${asset_a_id}.condition_grade == C"
            - "ExhibitAsset.${asset_b_id}.condition_grade == C"

      - name: service_order_creation_tier_vs_apply_time_tier
        grounds:
          - calculations.service_order_deadline_tier
          - calculations.service_order_total
          - entities.ServiceOrder.fields.deadline_tier
          - entities.ChangeOrder.fields.price_delta_cents
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
        distinguishing_aspect: |
          On the ServiceOrder entity domain, the very same order is priced twice by the same
          formula against two different clock positions: 193858 cents at the ADVANCE tier fixed
          at creation, and 421995 cents once an on-site change order reprices every line at the
          ONSITE tier in force at apply time, a delta of 228137 cents.
        test_recipe:
          setup:
            - "A show that has advanced to ON_SITE, an exhibitor with a 5000000 cent credit limit, and an OPEN booth"
            - "A ServiceOrder placed at 2026-08-10T09:00:00Z with two lines, priced at the ADVANCE tier"
            - "An APPROVED ChangeOrder raising line 1 by 2 units, created by operator ops-1 and approved by operator ops-2, with the clock repositioned to 2026-09-21T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "1024", sqft: 400, booth_type: "ISLAND" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /service-orders"
              payload: { booth_id: "${booth_id}", service_type: "ELECTRICAL", lines: [{ line_seq: 1, catalog_item_code: "ELEC-20A", unit_qty: 4, unit_rate_cents: 32500, discount_pct: 0 }, { line_seq: 2, catalog_item_code: "ELEC-LBR", unit_qty: 3, unit_rate_cents: 21750, discount_pct: 0.10 }], expected_booth_version: "${booth_v}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { so_id: $.data.id, so_tier: $.data.deadline_tier, so_total_pre: $.data.total_cents }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "ADVANCE_CLOSED" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "MOVE_IN" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "ON_SITE" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T10:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /change-orders"
              payload: { booth_id: "${booth_id}", target_type: "SERVICE_ORDER", target_id: "${so_id}", delta_kind: "QTY_INCREASE", delta_qty: 2, reason: "Two extra 20A drops requested on the floor" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /change-orders/${co_id}/review"
              payload: { decision: "START_REVIEW" }
              as: ShowOperations
              as_user_id: "ops-2"
            - call: "POST /change-orders/${co_id}/review"
              payload: { decision: "APPROVE" }
              as: ShowOperations
              as_user_id: "ops-2"
            - call: "GET /service-orders/${so_id}"
              payload: {}
              as: ShowOperations
              as_user_id: "ops-2"
              captures: { so_v_pre: $.data.version }
          trigger:
            - call: "POST /change-orders/${co_id}/apply"
              payload: { expected_service_order_version: "${so_v_pre}" }
              as: ShowOperations
              as_user_id: "ops-2"
          assert:
            - "${so_tier} == ADVANCE"
            - "${so_total_pre} == 193858"
            - "ServiceOrder.${so_id}.deadline_tier == ONSITE"
            - "ServiceOrder.${so_id}.tier_multiplier == 1.65"
            - "ServiceOrder.${so_id}.subtotal_cents == 418646"
            - "ServiceOrder.${so_id}.total_cents == 421995"
            - "ChangeOrder.${co_id}.price_delta_cents == 228137"
            - "ChangeOrder.${co_id}.status == APPLIED"

  - rule_id: combinatorial_formula
    instances:
      - name: line_rounding_order_pinned_round_per_line_then_sum
        grounds:
          - calculations.service_order_line_pricing
          - entities.ServiceOrderLine.fields.line_total_cents
          - entities.ServiceOrder.fields.subtotal_cents
          - entities.ServiceOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b), nested rounding where order matters: three lines whose gross each ends in 5
          cents land on exactly .5 of a cent after the 1.30 STANDARD multiplier, so rounding per
          line then summing gives subtotal 390021 and total 393141, while the forbidden
          sum-then-round-once reading gives 390020 and 393140 - a one cent divergence that
          survives both the volume-discount and the fee-tier steps.
        test_recipe:
          setup:
            - "A show OPEN_FOR_ORDERS with discount_deadline 2026-09-01T00:00:00Z and move_in_start 2026-09-19T08:00:00Z"
            - "The logical clock parked at 2026-09-05T12:00:00Z, inside the STANDARD tier band"
            - "An exhibitor with a 5000000 cent credit limit holding an OPEN booth"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "1024", sqft: 400, booth_type: "ISLAND" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /service-orders"
              payload: { booth_id: "${booth_id}", service_type: "CLEANING", lines: [{ line_seq: 1, catalog_item_code: "CLN-VAC", unit_qty: 3, unit_rate_cents: 33335, discount_pct: 0 }, { line_seq: 2, catalog_item_code: "CLN-PORT", unit_qty: 5, unit_rate_cents: 20001, discount_pct: 0 }, { line_seq: 3, catalog_item_code: "CLN-SHAMP", unit_qty: 1, unit_rate_cents: 100005, discount_pct: 0 }], expected_booth_version: "${booth_v}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { so_id: $.data.id }
          assert:
            - "ServiceOrder.${so_id}.deadline_tier == STANDARD"
            - "ServiceOrder.${so_id}.tier_multiplier == 1.30"
            - "GET /service-orders/${so_id}/lines returns three lines whose line_total_cents are 130007, 130007 and 130007 in ascending line_seq order"
            - "ServiceOrder.${so_id}.subtotal_cents == 390021"
            - "ServiceOrder.${so_id}.subtotal_cents != 390020"
            - "ServiceOrder.${so_id}.volume_discount_cents == 15601"
            - "ServiceOrder.${so_id}.discounted_base_cents == 374420"
            - "ServiceOrder.${so_id}.service_fee_cents == 18721"
            - "ServiceOrder.${so_id}.total_cents == 393141"

      - name: fee_tier_keyed_on_discounted_base_not_subtotal
        grounds:
          - calculations.service_order_total
          - entities.ServiceOrder.fields.discounted_base_cents
          - entities.ServiceOrder.fields.service_fee_cents
          - entities.ServiceOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (c), a circular-looking dependency resolved by a pinned evaluation order: a
          subtotal of exactly 200000 cents sits in the 4 percent volume band, which drops the
          discounted base to 192000 and therefore into the 7 percent fee band, producing
          total 205440 - whereas keying the fee band off the subtotal would have selected 5
          percent and produced 201600.
        test_recipe:
          setup:
            - "A show OPEN_FOR_ORDERS, the clock at 2026-08-10T09:00:00Z inside the ADVANCE band so the tier multiplier is exactly 1.00"
            - "An exhibitor with a 5000000 cent credit limit holding an OPEN booth"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Borealis Robotics", contact_email: "ap@borealis.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "2210", sqft: 200, booth_type: "PENINSULA" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id, booth_v: $.data.version }
          trigger:
            - call: "POST /service-orders"
              payload: { booth_id: "${booth_id}", service_type: "MATERIAL_HANDLING", lines: [{ line_seq: 1, catalog_item_code: "MH-FORK", unit_qty: 2, unit_rate_cents: 100000, discount_pct: 0 }], expected_booth_version: "${booth_v}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { so_id: $.data.id }
          assert:
            - "ServiceOrder.${so_id}.deadline_tier == ADVANCE"
