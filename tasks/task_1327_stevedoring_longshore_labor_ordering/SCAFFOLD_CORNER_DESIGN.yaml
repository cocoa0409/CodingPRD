# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Stevedoring & Longshore Labor Ordering
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: vessel_create_applies_system_defaults
        claim_type: creation
        grounds: [entities.VesselCall]
        distinguishing_aspect: "A vessel create returns 201 with system fields: status SCHEDULED, work_posture NORMAL, actual_moves 0, actual_tons 0, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Defaults", voyage_number: "D-001", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
          assert:
            - "VesselCall.${v}: status == SCHEDULED, work_posture == NORMAL, actual_moves == 0, actual_tons == 0, version == 1"

      - name: vessel_create_zero_cargo_plan_returns_400
        claim_type: type_constraints
        grounds: [entities.VesselCall.fields.planned_moves, "errors[ERR_CARGO_PLAN_REQUIRED]"]
        distinguishing_aspect: "planned_moves == 0 AND planned_tons == 0 together violate the cargo-plan rule; either one alone being positive passes."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Empty", voyage_number: "D-002", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 0, planned_tons: 0, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CARGO_PLAN_REQUIRED, HTTP 400"

      - name: shift_window_end_not_after_start_returns_400
        claim_type: type_constraints
        grounds: [entities.ShiftWindow.fields.end_utc, "errors[ERR_SHIFT_WINDOW_INVALID]"]
        distinguishing_aspect: "end_utc equal to start_utc is rejected (strict >); a 16-hour-plus-1-minute window is also rejected (<= 960 minute cap)."
        test_recipe:
          setup: ["Vessel BERTHED"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV ShiftVal", voyage_number: "D-003", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T08:00:00Z" }
              as: StevedoreSuperintendent
              captures: { err1: $.data.error_id }
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-11T00:01:00Z" }
              as: StevedoreSuperintendent
              captures: { err2: $.data.error_id }
          assert:
            - "zero-length window: error_id == ERR_SHIFT_WINDOW_INVALID, HTTP 400"
            - "961-minute window: error_id == ERR_SHIFT_WINDOW_INVALID, HTTP 400"

      - name: worker_duplicate_registration_returns_409
        claim_type: type_constraints
        grounds: [entities.Worker.fields.registration_number, "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "registration_number is unique across ALL workers regardless of classification."
        test_recipe:
          setup: ["Worker W1 registered with registration_number R001"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /api/workers"
              payload: { full_name: "W Other", registration_number: "R001", classification: "DRIVER", registered_on: "2020-01-01", base_hourly_rate_cents: 3800 }
              as: StevedoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_REGISTRATION, HTTP 409 (different classification does not rescue the duplicate)"

      - name: gang_order_get_with_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but non-existent UUID on a detail GET yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/gang-orders/00000000-0000-0000-0000-000000000000"
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: gang_order_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.GangOrder.fields.required_headcount, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required_headcount (source: input, no default) fails schema validation before any state or business rule runs."
        test_recipe:
          setup: ["Vessel BERTHED with shift OPEN_FOR_ORDERS"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Req", voyage_number: "D-004", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400"

      - name: vessel_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "With 3 vessels, limit=2 returns total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup: ["Three vessel calls exist"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV P1", voyage_number: "PG-1", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV P2", voyage_number: "PG-2", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV P3", voyage_number: "PG-3", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
          trigger:
            - call: "GET /api/vessel-calls?limit=2&offset=0"
              as: BillingClerk
            - call: "GET /api/vessel-calls?limit=2&offset=2"
              as: BillingClerk
          assert:
            - "Page 1: data has 2 items, total_count == 3, has_more == true"
            - "Page 2: data has 1 item, total_count == 3, has_more == false"
            - "Both responses carry meta.api_request_id and response_type == 'array'"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: gang_complete_from_placed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GangOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is defined only from WORKING; a PLACED gang rejects it with ERR_INVALID_STATE 409 and no side effects fire."
        test_recipe:
          setup: ["Vessel BERTHED, shift OPEN_FOR_ORDERS, gang PLACED"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV BadTrans", voyage_number: "S-101", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /api/gang-orders/${g}/complete"
              as: GangForeman
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "GangOrder.${g}.status remains PLACED"

      - name: cancelled_gang_is_terminal_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GangOrder]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel (and any other action) is rejected; no transition list includes CANCELLED as a from-state."
        test_recipe:
          setup: ["Gang G already CANCELLED"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Term", voyage_number: "S-102", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id }
            - call: "POST /api/gang-orders/${g}/cancel"
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/gang-orders/${g}/cancel"
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; status remains CANCELLED"

      - name: gang_cancel_cascades_to_assignments_and_equipment
        claim_type: side_effect_execution
        grounds: [state_machines.GangOrder.DISPATCHING_to_CANCELLED, state_machines.DispatchAssignment, state_machines.EquipmentAssignment]
        distinguishing_aspect: "Cancelling a mid-dispatch gang cancels OFFERED and CHECKED_IN assignments and releases its RESERVED equipment, returning the unit to AVAILABLE — one trigger, three entity types mutate."
        test_recipe:
          setup: ["Gang G DISPATCHING (headcount 2: W1 CHECKED_IN, W2 still OFFERED), RTG-1 RESERVED"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Cancel", voyage_number: "S-103", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "CRANE_GANG", required_classification: "CRANE_OPERATOR", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "C One", registration_number: "R010", classification: "CRANE_OPERATOR", registered_on: "2010-01-01", base_hourly_rate_cents: 5000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "C Two", registration_number: "R011", classification: "CRANE_OPERATOR", registered_on: "2015-01-01", base_hourly_rate_cents: 5000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/equipment-units"
              payload: { unit_code: "RTG-1", equipment_type: "RTG" }
              as: StevedoreAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { ea1: $.data.id }
            - call: "GET /api/gang-orders/${g}"
              as: StevedoreSuperintendent
              captures: { g_v_now: $.data.version }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v_now}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
          trigger:
            - call: "POST /api/gang-orders/${g}/cancel"
              as: StevedoreSuperintendent
          assert:
            - "DispatchAssignment.${a1} (was CHECKED_IN) -> CANCELLED"
            - "DispatchAssignment.${a2} (was OFFERED) -> CANCELLED"
            - "EquipmentAssignment.${ea1} (was RESERVED) -> RELEASED and EquipmentUnit.${e1}.status == AVAILABLE"
            - "GangOrder.${g}.filled_headcount == 0"

      - name: shift_closes_automatically_when_last_gang_completes
        claim_type: side_effect_execution
        grounds: [state_machines.ShiftWindow.IN_PROGRESS_to_CLOSED, state_machines.GangOrder.WORKING_to_COMPLETED]
        distinguishing_aspect: "Bubble-up: the shift has no explicit close endpoint; completing its only gang order flips it IN_PROGRESS -> CLOSED in the same request chain."
        test_recipe:
          setup: ["Gang G (headcount 1, no equipment) WORKING with W1"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Bubble", voyage_number: "S-104", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/gang-orders/${g}/complete"
              as: GangForeman
              as_user_id: "${w1}"
          assert:
            - "GangOrder.${g}.status == COMPLETED"
            - "ShiftWindow.${s}.status == CLOSED (automatic bubble-up; no explicit close call was made)"
            - "DispatchAssignment.${a1}.status == COMPLETED"

      - name: clearing_incident_does_not_auto_resume_suspended_gangs
        claim_type: side_effect_execution
        grounds: [state_machines.SafetyIncident.REPORTED_to_CLEARED, state_machines.GangOrder.WORKING_to_SUSPENDED]
        distinguishing_aspect: "The posture gate lifts on clear, but the SUSPENDED gang order stays SUSPENDED — resume is an explicit foreman action, never an automatic compensation."
        test_recipe:
          setup: ["Gang G WORKING, then CRITICAL VESSEL incident suspends it"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV NoAuto", voyage_number: "S-105", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/safety-incidents"
              payload: { vessel_call_id: "${v}", scope: "VESSEL", severity: "CRITICAL", description: "Fire" }
              as: StevedoreSuperintendent
              captures: { inc: $.data.id }
          trigger:
            - call: "POST /api/safety-incidents/${inc}/clear"
              as: StevedoreSuperintendent
          assert:
            - "VesselCall.${v}.work_posture == NORMAL after clear"
            - "GangOrder.${g}.status remains SUSPENDED (no automatic resume)"
            - "GangOrder.${g}.suspension_count == 1"

      - name: claim_second_decide_rejected
        claim_type: idempotency
        grounds: [state_machines.DamageClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide is a one-shot transition from REPORTED; repeating it on an ACCEPTED claim is rejected rather than silently re-applied."
        test_recipe:
          setup: ["Claim on gang G already ACCEPTED with fault_pct 40"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Idem", voyage_number: "S-106", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
