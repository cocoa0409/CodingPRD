          assert:
            - "${est_state} == 'CERTIFIED', ${est_cc} == 222601.86 (round(120001 * 1.855, 2)), ${est_pc} == 4519664.50 and ${est_req} == 4742266.36"
            - "${est_short} == 4742266.36 and ${fas1} == 'SHORTFALL_REVIEW' — certifying with an empty instrument is not FUNDED"
            - "${est_short2} == 0.00, ${fas2} == 'FUNDED' and ${funded} == 4742266.36"
            - "Cell.${c1_id}.status == 'QA_CERTIFIED' is the only cell in the cost basis; a DESIGN cell would have been excluded"

      - name: qa_approve_skips_cascade_links_three_and_four_when_no_estimate_is_certified
        claim_type: conditional_cascade
        grounds:
          - state_machines.Cell.QA_REVIEW_to_QA_CERTIFIED
          - state_machines.ClosureCostEstimate.CERTIFIED_to_STALE
        distinguishing_aspect: "Links 3 and 4 of the QA-approve cascade are conditional on a CERTIFIED estimate existing. With only a DRAFT estimate on file the first two links must still run (cell certified, landfill airspace recomputed) while the estimate stays DRAFT and financial_assurance_status stays UNFUNDED."
        test_recipe:
          setup:
            - "Landfill LF, Cell C-1 in QA_REVIEW with a package under review, and a DRAFT (never certified) estimate for 2026."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id, lf_v1: $.data.version }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v1}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
          trigger:
            - call: "POST /liner-qa-packages/${qa_id}/approve"
              payload: { certification_reference: "CQA-2026-01" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { qa_state: $.data.status }
            - call: "GET /cells/${c1_id}"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { c1_state: $.data.status }
            - call: "GET /closure-cost-estimates/${est_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_state: $.data.status }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_cert: $.data.certified_airspace_cy, lf_life: $.data.remaining_life_years, lf_fas: $.data.financial_assurance_status }
          assert:
            - "${qa_state} == 'APPROVED' and ${c1_state} == 'QA_CERTIFIED' — links 1 and 2 fired"
            - "${lf_cert} == 1000000 and ${lf_life} == 3.00 (1000000 * 0.90 / 300000, ledger_based because no survey exists)"
            - "${est_state} == 'DRAFT' — link 3 has no CERTIFIED estimate to stale"
            - "${lf_fas} == 'UNFUNDED' — link 4 does not fire, so the site is NOT put into SHORTFALL_REVIEW"

      - name: liner_qa_revision_loop_terminates_at_the_third_round
        claim_type: cyclic
        grounds:
          - state_machines.LinerQaPackage.RETURNED_to_SUBMITTED
          - state_machines.LinerQaPackage.UNDER_REVIEW_to_REJECTED
        excluded_because:
          difficulty_instance: liner_qa_return_resubmit_cycle_rejects_cell_on_third_round   # §1.8 rule: non_linear_state_machine
          rationale: "That §1.8 instance walks the SUBMITTED -> UNDER_REVIEW -> RETURNED -> SUBMITTED loop twice and shows the third return taking the REJECTED branch instead, which is exactly the cyclic-shape claim (loop works, termination condition respected)."

      - name: waste_load_screening_and_billing_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.WasteLoad.UNBILLED_to_PROVISIONAL
          - state_machines.WasteLoad.PROVISIONAL_to_FINALIZED
        excluded_because:
          difficulty_instance: waste_load_screening_and_billing_dimensions_advance_independently   # §1.8 rule: non_linear_state_machine
          rationale: "That §1.8 instance drives screening_status and billing_status through different edges on the same row and asserts every combined state, covering the parallel-dimension claim."

      - name: gas_well_connect_is_guarded_by_the_parent_cell_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.GasWell.DRILLED_to_CONNECTED
        excluded_because:
          difficulty_instance: gas_well_connect_requires_cell_past_authorization   # §1.8 rule: cross_entity_state_dependency
          rationale: "That §1.8 instance attempts connect against a cell in each of DESIGN, UNDER_CONSTRUCTION, QA_REVIEW, QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL and CLOSED, which is the cross-entity guard claim in full."

      - name: day_close_cascades_downward_through_cell_landfill_and_approvals
        claim_type: cascade_down
        grounds:
          - state_machines.OperatingDay.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: day_close_cascades_four_links_to_special_waste_suspension   # §1.8 rule: transitive_cascade
          rationale: "That §1.8 instance verifies all four downward links of the day-close cascade end to end, including that only non-terminal special-waste approvals are suspended."

      - name: the_last_active_cell_going_full_bubbles_up_to_site_suspension
        claim_type: bubble_up
        grounds:
          - state_machines.Cell.ACTIVE_to_FULL
        excluded_because:
          difficulty_instance: cell_full_at_exactly_98_00_percent_and_not_at_97_94   # §1.8 rule: boundary_precision_check
          rationale: "That §1.8 instance shows the cell reaching FULL at exactly the 0.98 fraction and the landfill auto-transitioning to SUSPENDED_NO_AIRSPACE once active_cell_count reaches 0, which is the bubble-up claim."

      - name: a_surface_exceedance_reaches_across_to_the_wellfield
        claim_type: cross_entity
        grounds:
          - state_machines.SurfaceEmissionScan.PASSED_to_EXCEEDANCE_OPEN
          - state_machines.GasWell.ONLINE_to_TUNING_REQUIRED
        excluded_because:
          difficulty_instance: surface_exceedance_cascade_survives_empty_candidate_pool   # §1.8 rule: transitive_cascade
          rationale: "That §1.8 instance asserts the selected well's new state, the scan's corrective_well_id and the landfill's gas_collection_status, both with a populated and with an empty candidate pool."

      - name: day_close_and_amend_keep_the_airspace_ledger_reconciled
        claim_type: ledger_sync
        grounds:
          - state_machines.OperatingDay.CLOSED_to_AMENDED
        excluded_because:
          difficulty_instance: day_amend_reverses_airspace_billing_and_posture_with_no_drift   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance records the pre-close ledger, closes, amends and asserts byte-equal restoration of Cell.consumed_airspace_cy and every Landfill airspace field, i.e. the before/after ledger reconciliation."

      - name: voiding_a_survey_reverses_its_projection_side_effects
        claim_type: compensation
        grounds:
          - state_machines.AerialSurvey.RECORDED_to_VOID
          - state_machines.AerialSurvey.SUPERSEDED_to_RECORDED
        excluded_because:
          difficulty_instance: survey_void_restores_prior_survey_or_falls_back_to_the_ledger   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance voids the newest survey, asserts the ranked SUPERSEDED survey returns to RECORDED, and asserts the projection falls back to ledger_based when the candidate set is empty — undo with no drift."

  - section: calculations
    instances:

      - name: closure_cost_basis_includes_only_cells_in_the_declared_state_set
        claim_type: input_set_filtering
        grounds:
          - calculations.closure_and_post_closure_cost
          - entities.ClosureCostEstimate.fields.closure_cost_total
        distinguishing_aspect: "Two cells of the same landfill with the same liner type differ only in status: the QA_CERTIFIED one enters the closure basis and the DESIGN one does not. The whole required_assurance_amount therefore moves by exactly one cell's area cost while post_closure_cost_total, which does not depend on cells at all, stays put."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 (120001 sf) driven to QA_CERTIFIED and Cell C-2 (45001 sf) left in DESIGN."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa_id}/approve"
              payload: { certification_reference: "CQA-2026-01" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v2: $.data.version }
          trigger:
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id, est_cc: $.data.closure_cost_total, est_pc: $.data.post_closure_cost_total, est_req: $.data.required_assurance_amount }
            - call: "GET /cells"
              payload: { landfill_id: "${lf_id}", status: "DESIGN" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
          assert:
            - "${est_cc} == 222601.86 — only C-1 contributes: round(120001 * 1.855, 2). Including C-2 would give 306078.72, and summing the two areas before rounding would give the forbidden 306078.71"
            - "${est_pc} == 4519664.50 — the post-closure leg is cell-independent (30 years of 95000.00 inflated at 0.03, each year rounded to cents before summing; the forbidden single-rounding answer is 4519664.49)"
            - "${est_req} == 4742266.36 == round(222601.86 + 4519664.50, 2)"
            - "trigger 2 still shows C-2 in DESIGN with total_count 1, confirming the excluded cell exists and was skipped for its state, not for absence"

      - name: loads_finalize_in_pinned_chronological_order_not_clearing_order
        claim_type: chronological
        grounds:
          - calculations.host_community_royalty_waterfall
          - state_machines.WasteLoad.PROVISIONAL_to_FINALIZED
          - calculations.load_tipping_charge
        distinguishing_aspect: "Three loads are cleared and weighed in exactly the reverse of their creation order, so any implementation that finalizes in clearing order (or in id order) assigns the tier-1 allowance to the wrong loads. The pinned order is OperatingDay.operating_date ASC then WasteLoad.created_at ASC, which makes the tier-1 allowance run out inside the SECOND load."
        test_recipe:
          setup:
