      - name: occ_stale_project_version_on_change_order_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-create-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "A different OCC parent and a different write endpoint from occ_stale_property_version_on_project_create: creating one ChangeOrder advances AduProject.version 1 -> 2, so a second create still carrying expected_adu_project_version 1 is rejected with 412 ERR_STALE_PROJECT_VERSION."
        test_recipe:
