  - name: ComplianceOfficer
    description: "Compliance authority. Decides cross-sell eligibility, reconciles entitlements, approves overrides. Must not be the requester of any override it approves."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/cross-sell-checks/{check_id}/decide"
      - "POST /benefits/members/{member_id}/entitlements/reconcile"
      - "POST /benefits/benefit-entitlements/{entitlement_id}/approve-override"
    shared_operations:
      - "GET /benefits/members"
      - "GET /benefits/members/{member_id}"
      - "GET /benefits/members/{member_id}/churn-breakdown"
      - "GET /benefits/members/{member_id}/benefit-summary"
      - "GET /benefits/holdings"
      - "GET /benefits/holdings/{holding_id}"
      - "GET /benefits/loan-accounts"
      - "GET /benefits/loan-accounts/{loan_account_id}"
      - "GET /benefits/applications"
      - "GET /benefits/applications/{application_id}"
      - "GET /benefits/rate-discount-rules"
      - "GET /benefits/rate-discount-rules/{rule_id}"
      - "GET /benefits/deposit-enrollments"
      - "GET /benefits/deposit-enrollments/{enrollment_id}"
      - "GET /benefits/benefit-entitlements"
      - "GET /benefits/benefit-entitlements/{entitlement_id}"
      - "GET /benefits/requalification-cycles"
      - "GET /benefits/requalification-cycles/{cycle_id}"
      - "GET /benefits/churn-notices"
      - "GET /benefits/churn-notices/{notice_id}"
      - "GET /benefits/cross-sell-checks"
      - "GET /benefits/cross-sell-checks/{check_id}"

  - name: PlatformAdmin
    description: "Operational administrator. Runs the logical clock, drives deposit postings and enrolments, advances churn detection and cycle lifecycle. Not a business-decision authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /benefits/members/{member_id}/deposits"
      - "POST /benefits/members/{member_id}/deposits/reverse"
      - "POST /benefits/deposit-enrollments/{enrollment_id}/activate"
      - "POST /benefits/deposit-enrollments/{enrollment_id}/lapse"
      - "POST /benefits/members/{member_id}/requalification-cycles"
      - "POST /benefits/requalification-cycles/{cycle_id}/evaluate"
      - "POST /benefits/requalification-cycles/{cycle_id}/open-remediation"
      - "POST /benefits/requalification-cycles/{cycle_id}/close"
      - "POST /benefits/members/{member_id}/detect-churn"
