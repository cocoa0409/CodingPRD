              payload: { agreement_id: "${a_id}", article_ref: "1.1", title: "Recognition", body_text: "x" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"

      - name: lradmin_cannot_tally_vote
        claim_type: rbac_denial
        grounds: [roles.UnionRepresentative, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Tally submission is exclusive to the UnionRepresentative of the voting union: LRAdmin is rejected with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["union U; DRAFT agreement A; vote V exists (any state)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union RC", union_code: "URC-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA RC", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 10, ballot_close_at: "2026-06-01T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v_id}/tally"
              payload: { votes_for: 5, votes_against: 0 }
              as: LRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"

      - name: lrmanager_cannot_record_interpretation
        claim_type: rbac_denial
        grounds: [roles.LegalCounsel, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Per-action RBAC inside the interpretation endpoint: LRManager may OPEN_REVIEW but the RECORD action is exclusive to LegalCounsel, failing with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["union U; DRAFT agreement A; clause C in UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union RD", union_code: "URD-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA RD", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a_id}", article_ref: "3.4", title: "Posting", body_text: "x" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { c_id: $.data.id }
            - call: "POST /labor-relations/clauses/${c_id}/interpretation"
              payload: { action: "OPEN_REVIEW" }
              as: LRManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /labor-relations/clauses/${c_id}/interpretation"
              payload: { action: "RECORD", interpretation_text: "Manager overreach" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"
            - "Clause.${c_id}.interpretation_status == UNDER_REVIEW (no ruling recorded)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: agreement_extend_occ_stale_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-extend-stale-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "Extend is OCC-guarded because re-extension is legitimate: a second extend carrying the pre-first-extend version is rejected with 412 ERR_STALE_AGREEMENT_VERSION while a fresh version succeeds."
        test_recipe:
          setup: ["union U; agreement A ACTIVE (expiration 2026-06-30)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union LA", union_code: "ULA-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA LA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-06-30T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/agreements/${a_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: LRAdmin
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /labor-relations/agreements/${a_id}/extend"
              payload: { new_expiration_date: "2026-12-31T00:00:00Z", expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/agreements/${a_id}/extend"
              payload: { new_expiration_date: "2027-06-30T00:00:00Z", expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err: $.data.error_id }
          assert:
            - "first extend: status == EXTENDED and expiration_date == 2026-12-31T00:00:00Z and extension_count == 1"
            - "err == ERR_STALE_AGREEMENT_VERSION with http 412 on the stale second extend"

      - name: extend_recomputes_task_due_dates
        claim_type: derived_field_reconciliation
        grounds: [calculations.expiration_task_due_date, state_machines.CollectiveAgreement.ACTIVE_to_EXTENDED]
        distinguishing_aspect: "Extension propagates into derived task state: a PENDING task with due_offset_days -60 moves its due_date from 2026-04-01 to 2026-07-02 when expiration moves 2026-05-31 -> 2026-08-31, stays PENDING (new due is future), and the agreement posture recomputes CRITICAL -> SUNSET."
        test_recipe:
          setup: ["union U; agreement A ACTIVE (expiration 2026-05-31, posture CRITICAL at default clock); task T PENDING with offset -60 (due 2026-04-01)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union LB", union_code: "ULB-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA LB", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/agreements/${a_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /labor-relations/expiration-tasks"
              payload: { agreement_id: "${a_id}", title: "Notice", task_type: "NOTICE_DEADLINE", due_offset_days: -60, assignee_user_id: "mgr-1" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: LRAdmin
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /labor-relations/agreements/${a_id}/extend"
              payload: { new_expiration_date: "2026-08-31T00:00:00Z", expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "GET /labor-relations/expiration-tasks/${t_id}"
              payload: {}
              as: LRManager
              as_user_id: "mgr-1"
              captures: { new_due: $.data.due_date }
          assert:
            - "ExpirationTask.${t_id}.due_date was 2026-04-01T00:00:00Z before the extend"
            - "new_due == 2026-07-02T00:00:00Z (recomputed from the new expiration in the same request)"
            - "ExpirationTask.${t_id}.status == PENDING (recomputed due date is in the future)"
            - "CollectiveAgreement.${a_id}.posture == SUNSET (122 days left) and extension_count == 1"

      - name: clock_sweep_is_checkpoint_driven
        claim_type: ops_run_checkpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]", state_machines.BargainingSession.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "The system epoch advances only at the checkpoint endpoint: a session whose end_at already precedes the startup default clock (2026-05-01T00:00:00Z) remains SCHEDULED until the first explicit set_current_utc call runs the sweep."
        test_recipe:
          setup: ["union U; DRAFT agreement A; session S with window 2026-04-30 10:00-11:00 (already past at the default clock)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union LC", union_code: "ULC-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA LC", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-z", lead_negotiator_id: "ln-z", location: "Room 1", start_at: "2026-04-30T10:00:00Z", end_at: "2026-04-30T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "GET /labor-relations/sessions/${s_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { before_sweep: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: LRAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "before_sweep == SCHEDULED (no sweep runs without a clock-set call, even though end_at is past the default clock)"
            - "now == 2026-05-01T00:00:00Z (explicitly settable to the default instant)"
            - "BargainingSession.${s_id}.status == NO_SHOW after the checkpoint"

      - name: rejected_vote_reverts_accepted_package   # covered by §1.8 -> stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Proposal.ACCEPTED_to_ON_TABLE]
        excluded_because:
          difficulty_instance: boundary_precision_check / ratification_quorum_approval_boundary
          rationale: "The ACCEPTED -> ON_TABLE revert is asserted between the V1 rejection and V2 re-acceptance in the named §1.8 instance."

      - name: ratification_cascade_end_to_end   # covered by §1.8 -> stub
        claim_type: cascading_side_effects
        grounds: [state_machines.RatificationVote.OPEN_to_RATIFIED]
        excluded_because:
          difficulty_instance: transitive_cascade / ratification_depth5_cascade
          rationale: "The depth-5 RATIFIED cascade is asserted hop-by-hop in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Mutations are visible in the very next read within the same test: a union created moments earlier is fully readable with its computed defaults, with no reconciliation lag."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union IM", union_code: "UIM-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
          trigger:
            - call: "GET /labor-relations/unions/${u_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-9"
          assert:
            - "GET returns name == Union IM, union_code == UIM-1, status == ACTIVE, open_information_request_count == 0 immediately after creation"

  # ---------------------------------------------------------------------------
  # validations (supplementary) — completes per-error trigger coverage
  - section: validations
    instances:
      - name: side_letter_invalid_effective_range
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_EFFECTIVE_RANGE]", "validations[priority=9]"]
        distinguishing_aspect: "A side letter whose effective_start (2027-01-01) is after its effective_end (2026-06-30) is rejected at create with ERR_INVALID_EFFECTIVE_RANGE."
        test_recipe:
          setup: ["union U; DRAFT agreement A; clause C"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union VS", union_code: "UVS-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA VS", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a_id}", article_ref: "4.1", title: "Transfers", body_text: "x" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/side-letters"
              payload: { agreement_id: "${a_id}", clause_id: "${c_id}", letter_type: "MOU", title: "Backwards letter", effective_start: "2027-01-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_EFFECTIVE_RANGE and no SideLetter is persisted"

      - name: lead_negotiator_buffer_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_NEGOTIATOR_BUFFER_CONFLICT]", "validations[priority=10]"]
        distinguishing_aspect: "The lead-negotiator rule is a buffered interval semantics (distinct from the mediator's half-open rule): a 30-minute gap after a 10:00-11:00 session conflicts (ERR_NEGOTIATOR_BUFFER_CONFLICT), while a gap of exactly 45 minutes is allowed."
        test_recipe:
          setup: ["union U; DRAFT agreement A; session S1 with lead ln-b 2026-06-01 10:00-11:00 (mediator med-b1)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union VT", union_code: "UVT-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA VT", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-b1", lead_negotiator_id: "ln-b", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-b2", lead_negotiator_id: "ln-b", location: "Room 2", start_at: "2026-06-01T11:30:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-b3", lead_negotiator_id: "ln-b", location: "Room 3", start_at: "2026-06-01T11:45:00Z", end_at: "2026-06-01T12:30:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s3_id: $.data.id }
          assert:
            - "err == ERR_NEGOTIATOR_BUFFER_CONFLICT (30-minute gap < 45-minute buffer)"
            - "BargainingSession.${s3_id} created (gap of exactly 45 minutes is not < 45)"

      - name: accept_economic_without_locked_costing
        claim_type: violation_to_error
        grounds: ["errors[ERR_COSTING_NOT_LOCKED]", "validations[priority=12]"]
        distinguishing_aspect: "Accepting an ON_TABLE ECONOMIC proposal with no LOCKED scenario covering it fails with ERR_COSTING_NOT_LOCKED (state is valid, so the referential gate is the one that fires)."
        test_recipe:
          setup: ["union U; DRAFT agreement A; ECONOMIC proposal P ON_TABLE; no costing scenario exists"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union VU", union_code: "UVU-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA VU", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Uncosted ask", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COSTING_NOT_LOCKED"
            - "Proposal.${p_id}.status == ON_TABLE"

      - name: session_invalid_time_range
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_TIME_RANGE]", "validations[priority=9]"]
        distinguishing_aspect: "A session with start_at equal to end_at is rejected with ERR_INVALID_TIME_RANGE before any overlap logic runs."
        test_recipe:
          setup: ["union U; DRAFT agreement A"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union VV", union_code: "UVV-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA VV", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-t", lead_negotiator_id: "ln-t", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T10:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_TIME_RANGE and no BargainingSession is persisted"
