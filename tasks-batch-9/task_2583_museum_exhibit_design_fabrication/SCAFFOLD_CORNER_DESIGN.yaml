      - name: advance_to_fabrication_requires_every_objective_code_to_be_carried_by_a_case_or_an_interactive
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExhibitProject.DESIGN_DEV_to_FABRICATION
          - validations.priority_80
          - errors.ERR_OBJECTIVE_NOT_ADDRESSED
          - entities.ExhibitProject.fields.objective_codes
        distinguishing_aspect: |
          The check is a set-coverage test in one direction only: every code in
          project.objective_codes must be carried by something buildable, but a case
          or interactive is free to carry a code that is not on the project's list.
          The two-element objective list is covered halfway by the case, so the
          refusal must survive the creation of an interactive that carries an
          UNLISTED code - a naive implementation that compares counts, or that tests
          "every interactive's objective_code is in the project's list", passes at
          the wrong moment. The gate also runs after the package precondition, so the
          APPROVED DESIGN_DEV package is never the objection.
        test_recipe:
          setup:
            - "project with objective_codes [OBJ-STRATA, OBJ-EXTINCTION] in DESIGN_DEV with both stage packages APPROVED, and case C-01 carrying OBJ-EXTINCTION only"
