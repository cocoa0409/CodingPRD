        claim_type: Input Set Filtering
        grounds: [calculations.itinerary_total_estimate]
        distinguishing_aspect: "The estimate input set includes only PENDING/CONFIRMED/COMPLETED visits; after one of two held visits is cancelled (slot released), the itinerary totals drop to the single remaining visit's price — the cancelled visit contributes nothing."
        test_recipe:
          setup: ["Two held visits at 200000 each (domestic, 2 visits -> 0% tier)."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
