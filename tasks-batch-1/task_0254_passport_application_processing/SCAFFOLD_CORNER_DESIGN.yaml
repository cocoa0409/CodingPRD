        distinguishing_aspect: "A RENEWAL application with name_change_requested true but no NAME_CHANGE_EVIDENCE document is rejected at submit with ERR_NAME_CHANGE_EVIDENCE_REQUIRED (422); the requirement is conditional on name_change_requested."
        test_recipe:
          setup:
            - "Adult RENEWAL BOOK application, name_change_requested true, PASS photo, but NO name-change evidence document."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "NoEvid", date_of_birth: "1985-01-01", email: "noevid@x.com" }
