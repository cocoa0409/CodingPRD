  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fit_test_result_requires_current_clearance
        grounds:
          - state_machines.RespiratorFitTest.SCHEDULED_to_PASSED
          - state_machines.MedicalClearance.CLEARED_to_EXPIRED
          - errors[ERR_MEDICAL_CLEARANCE_NOT_CURRENT]
        distinguishing_aspect: |
          Entity pair RespiratorFitTest->MedicalClearance: PASS is recordable only while the
          LINKED clearance is CLEARED and unexpired. Before expiry the PASS succeeds; after the
          clock sweeps the clearance to EXPIRED (which also expires the already-PASSED fit test),
          a second fit test's PASS is rejected with ERR_MEDICAL_CLEARANCE_NOT_CURRENT.
        test_recipe:
          setup:
            - "Employee E1; clearance CLEARED at 2026-08-01 (expiry 2027-08-01); fit tests FT1 and FT2 both linked to it"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/medical-clearances", payload: { employee_id: "${e1}" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { clr: $.data.id } }
            - { call: "POST /ih/medical-clearances/${clr}/decide", payload: { decision: "CLEARED" }, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/fit-tests", payload: { employee_id: "${e1}", medical_clearance_id: "${clr}", respirator_model: "3M-6800", test_date: "2026-08-03" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { ft1: $.data.id } }
            - { call: "POST /ih/fit-tests", payload: { employee_id: "${e1}", medical_clearance_id: "${clr}", respirator_model: "3M-6800", test_date: "2026-08-04" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { ft2: $.data.id } }
            - { call: "POST /ih/fit-tests/${ft1}/record-result", payload: { result: "PASS" }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: FirmAdmin, as_user_id: u_admin }
          trigger:
            - { call: "POST /ih/fit-tests/${ft2}/record-result", payload: { result: "PASS" }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "Before expiry: RespiratorFitTest.${ft1}.status == PASSED with expiry_date 2027-08-03"
            - "After clock 2027-08-02: MedicalClearance.${clr}.status == EXPIRED and RespiratorFitTest.${ft1}.status == EXPIRED (clearance cascade)"
            - "trigger returns http 422 with error_id ERR_MEDICAL_CLEARANCE_NOT_CURRENT; RespiratorFitTest.${ft2}.status remains SCHEDULED"

