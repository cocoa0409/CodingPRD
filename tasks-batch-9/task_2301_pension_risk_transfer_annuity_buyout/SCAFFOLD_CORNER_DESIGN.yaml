        distinguishing_aspect: |
          Three elections priced at 2400000, 2858400 and 1200000 are walked against a
          5000000 cap in elected_at order: the first is honoured, the second breaches
          and is deferred, and the third must STILL be honoured out of the remaining
          headroom for an approved total of 3600000. A stop-at-first-breach
