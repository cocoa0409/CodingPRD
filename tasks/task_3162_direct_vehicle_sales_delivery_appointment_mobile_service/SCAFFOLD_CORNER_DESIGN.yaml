              as: PlatformAdmin
              captures: { jur_wa_id: $.data.id }
            - call: "POST /v1/jurisdictions/${jur_wa_id}/enact"
              payload: {}
              as: PlatformAdmin
            - &c_gallery_wa
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Seattle Gallery", center_kind: "GALLERY", state_code: "WA", bay_count: 0, home_delivery_radius_miles: 0, van_count: 0 }
              as: PlatformAdmin
              captures: { gal_wa_id: $.data.id }
            - *c_cfg
            - &c_buyer_wa
              call: "POST /v1/buyers"
              payload: { full_name: "Wren Washington", email: "wren.washington@example.com", residency_state_code: "WA" }
              as: Anonymous
              captures: { byr_wa_id: $.data.id }
            - call: "POST /v1/buyers/${byr_wa_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - &c_order_wa
              call: "POST /v1/orders"
              payload: { buyer_id: "${byr_wa_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_wa_id}", delivery_center_id: "${gal_wa_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { ord_wa_id: $.data.id, ord_wa_v: $.data.version }
            - call: "POST /v1/orders/${ord_wa_id}/place"
              payload: { expected_order_version: "${ord_wa_v}" }
              as: Buyer
              as_user_id: "${byr_wa_id}"
              captures: { ord_wa_v: $.data.version }
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${ord_wa_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${ord_wa_id}/lock-configuration"
              payload: { expected_order_version: "${ord_wa_v}" }
              as: PlatformAdmin
              captures: { ord_wa_v: $.data.version }
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - &c_unit_wa
              call: "POST /v1/production-batches/${bch_id}/allocation-units"
