              as: ExternalSurveyor
              captures: { v19_err: $.data.error_id }
          assert:
            - "${v19_follow1} == false (no condition-level finding on the window)"
            - "${v19_err} == ERR_NOT_CONDITION_LEVEL with HTTP 422"
            - "SurveyFinding.${v19_f}.state == RESPONSE_PENDING and Standard.${v19_s1}.compliance_state == MAPPED (not DEFICIENT)"
            - "SurveyWindow.${v19_sw}.follow_up_required == false and follow_up_due_at == null"

      - name: ppr_attest_while_reassessment_required_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_PPR_REASSESSMENT_REQUIRED]
          - entities.PprSelfAssessment.fields.requires_reassessment
        distinguishing_aspect: "A PPR returned for reassessment cannot be attested: the attest returns ERR_PPR_REASSESSMENT_REQUIRED with HTTP 409, which is a different error from the ERR_PPR_ALREADY_ATTESTED branch of the same rule."
        test_recipe:
          setup:
            - "Chapter PC with one MAPPED standard and two flagged PPRs, so both are RETURNED_FOR_REASSESSMENT with requires_reassessment true."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { v20_ch: $.data.id }
            - call: "POST /accreditation/chapters/${v20_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { v20_s1: $.data.id }
            - call: "POST /accreditation/standards/${v20_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/chapters/${v20_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H1", self_ratings: [{ standard_id: "${v20_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { v20_p1: $.data.id }
            - call: "POST /accreditation/chapters/${v20_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H2", self_ratings: [{ standard_id: "${v20_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { v20_p2: $.data.id, v20_p2_state: $.data.state, v20_p2_req: $.data.requires_reassessment }
          trigger:
            - call: "POST /accreditation/ppr-self-assessments/${v20_p2}/attest"
              payload: { attestation_note: "Attempting to sign off" }
              as: AccreditationDirector
              as_user_id: "dir-1"
              captures: { v20_err: $.data.error_id }
          assert:
            - "${v20_p2_state} == RETURNED_FOR_REASSESSMENT and ${v20_p2_req} == true"
            - "${v20_err} == ERR_PPR_REASSESSMENT_REQUIRED with HTTP 409"
            - "PprSelfAssessment.${v20_p2}.state == RETURNED_FOR_REASSESSMENT and attested_by_user_id == null"

      - name: esc_submission_all_rules_satisfied_succeeds
        claim_type: satisfaction_pass
        grounds:
          - state_machines.SurveyFinding.RESPONSE_PENDING_to_RESPONSE_SUBMITTED
          - endpoints[POST /accreditation/survey-findings/{id}/esc-submissions]
          - entities.EscSubmission
        distinguishing_aspect: "With every rule satisfied the submission is created with submission_round 1 and decision PENDING, the finding moves to RESPONSE_SUBMITTED and its version increments, proving none of the priority 20/26/33/37/41 rules fire on the happy path."
        test_recipe:
          setup:
            - "Same closed-survey fixture: LIMITED/LOW finding in RESPONSE_PENDING, standard owned by owner-1 as PRIMARY, clock 2026-09-25T00:00:00Z (inside response_due_at 2026-11-24)."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LD", name: "Leadership", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { v21_ch: $.data.id }
            - call: "POST /accreditation/chapters/${v21_ch}/standards"
              payload: { standard_code: "LD.04.01.05", title: "Contracted services oversight", risk_tier: "SITUATIONAL_DECISION_RULE" }
              as: AccreditationDirector
              captures: { v21_s1: $.data.id }
            - call: "POST /accreditation/standards/${v21_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-12", unit_type: "MED_SURG", bed_count: 26 }
              as: AccreditationDirector
              captures: { v21_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { v21_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v21_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v21_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v21_sw}/findings"
              payload: { standard_id: "${v21_s1}", unit_id: "${v21_u}", observed_noncompliance_count: 2, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { v21_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v21_sw}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${v21_f}"
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { v21_f_v: $.data.version }
          trigger:
            - call: "POST /accreditation/survey-findings/${v21_f}/esc-submissions"
              payload: { corrective_action_summary: "Quarterly contract scorecards", measure_of_success: "100% of contracts scored by 2027-01-31", leadership_signoff: true, expected_finding_version: "${v21_f_v}" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { v21_sub: $.data.id, v21_round: $.data.submission_round, v21_dec: $.data.decision, v21_by: $.data.submitted_by_user_id }
            - call: "GET /accreditation/survey-findings/${v21_f}"
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { v21_f_state: $.data.state, v21_f_count: $.data.submission_count, v21_f_v2: $.data.version }
          assert:
            - "${v21_round} == 1, ${v21_dec} == PENDING, ${v21_by} == owner-1"
            - "${v21_f_state} == RESPONSE_SUBMITTED and ${v21_f_count} == 1"
            - "${v21_f_v2} is exactly one greater than ${v21_f_v}"
            - "EscSubmission.${v21_sub} exposes no version field (common_fields false) and response_due_at is unchanged at 2026-11-24T00:00:00.000Z"

      - name: unit_posture_error_precedes_tracer_window_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority=23]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_posture_state_error_precedes_tracer_window_temporal_conflict
          rationale: "That instance violates both rules at once and asserts ERR_UNIT_POSTURE_RESTRICTED wins."

