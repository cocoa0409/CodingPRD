      - name: freight_tier_above_two_million
        claim_type: threshold_boundary
        grounds: ["calculations.freight_fee_schedule"]
        distinguishing_aspect: "Freight high tier: merchandise 2585620 cents (> 2000000) selects the 3% band -> 77569; just below the boundary the 4% band would apply — asserts the upper tier switch."
        test_recipe:
          setup: ["WALNUT TEMPLATE_PREP MIN_90 order with one 30-leaf MIN_90 opening (30 leaves -> finish tier 1.07); drawing approved."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CT-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-F90", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
