    triggered_by: "V-AUTH-1 on any endpoint"
    message: "Authentication headers are missing or invalid."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    triggered_by: "V-RBAC-1 and V-RBAC-2"
    message: "This role may not perform the requested operation."
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    triggered_by: "V-OWN-1, V-OWN-2"
    message: "The addressed resource belongs to another distributor."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    triggered_by: "V-REQ-1, V-REQ-2, V-REQ-3, V-CON-10"
    message: "The request body or query is malformed."
  - error_id: ERR_CLAIM_DATES_INVALID
