            - { call: "POST /api/contracts/${contract_id}/disburse-advance", payload: {}, as: FinanceController }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-T2", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TT2", duration_seconds: 200, isrc: "USRC10000042" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-T2", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-T2", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_id: "$.data[0].id" } }
