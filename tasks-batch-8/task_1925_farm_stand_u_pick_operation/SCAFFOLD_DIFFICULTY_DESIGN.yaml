            - { call: "GET /farm/harvest-lines", payload: { session_id: "${vs_id}" }, as: FarmManager, captures: { ln_count: $.meta.total_count } }
          assert:
            - "error_id == ERR_SESSION_NOT_ACTIVE, HTTP 409 (session is CHECKED_IN, not FIELD_ACTIVE)"
            - "No line is persisted: GET /farm/harvest-lines?session_id=${vs_id} reports total_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: window_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=82]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.FieldDayWindow.fields.open_time
        distinguishing_aspect: |
          Resource: Field; semantics: half-open point intervals
          [open_time, close_time) on (field_id, date). A 11:00-13:00 window
          colliding with 09:00-12:00 is rejected, while a 12:00-15:00 window
          touching at exactly 12:00 is accepted (adjacency is not overlap).
        test_recipe:
          setup:
            - "Weekday 2026-08-04; field OPEN; SalesDay staff_on_duty 3 (ceil(60/25)=3 slots-staff exactly satisfiable); window A 09:00-12:00 capacity 30 exists"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "12:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_a: $.data.id } }
          trigger:
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "11:00", close_time: "13:00", picking_capacity_slots: 10 }, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "12:00", close_time: "15:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_c: $.data.id } }
            - { call: "GET /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04" }, as: FarmManager, captures: { win_count: $.meta.total_count } }
          assert:
            - "11:00-13:00 rejected: error_id == ERR_WINDOW_OVERLAP, HTTP 422 (intersects 09:00-12:00)"
            - "12:00-15:00 created successfully (A.close_time == C.open_time is adjacency, allowed under half-open semantics)"
            - "Staffing passed for A+C: ceil((30+30)/25) = 3 <= staff_on_duty 3"
            - "GET /farm/field-day-windows?field_id&date lists exactly 2 non-cancelled windows"

      - name: addon_slot_aggregate_capacity_pool
        grounds:
          - calculations.addon_slot_capacity
          - errors[ERR_ADDON_SLOT_FULL]
          - entities.AddonBooking.fields.qty
        distinguishing_aspect: |
          Resource: AddonProduct slot pool; semantics: aggregate capacity
          (sum of qty over BOOKED+REDEEMED against a discrete
          (product, date, slot_time) key) — NOT point-interval geometry like
          the window instance. Filling a wagon slot to exactly 20 succeeds;
          unit 21 overflows; a different slot_time is an independent pool.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; wagon product price 900 slot_capacity 20; sessions A and B (each party 1 containers 0, admission 650 paid, CHECKED_IN)"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/addon-products", payload: { season_id: "${s_id}", kind: "WAGON_RIDE", name: "Orchard Wagon", price_cents: 900, slot_capacity: 20 }, as: FarmManager, captures: { wagon_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_a: $.data.id } }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Bob", signer_email: "bob@x.com", party_member_names: ["Bob"] }, as: Anonymous, captures: { wv_b: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_a}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_a: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_b}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_b: $.data.id } }
          trigger:
            - { call: "POST /farm/addon-bookings", payload: { session_id: "${vs_a}", addon_product_id: "${wagon_id}", booking_date: "2026-08-04", slot_time: "11:00", qty: 12 }, as: GateStaff, captures: { bk_a1: $.data.id, bk_a1_val: $.data.booked_value_cents } }
            - { call: "POST /farm/addon-bookings", payload: { session_id: "${vs_b}", addon_product_id: "${wagon_id}", booking_date: "2026-08-04", slot_time: "11:00", qty: 8 }, as: GateStaff, captures: { bk_b1: $.data.id, bk_b1_val: $.data.booked_value_cents } }
            - { call: "POST /farm/addon-bookings", payload: { session_id: "${vs_a}", addon_product_id: "${wagon_id}", booking_date: "2026-08-04", slot_time: "11:00", qty: 1 }, as: GateStaff, captures: { err: $.data.error_id } }
            - { call: "POST /farm/addon-bookings", payload: { session_id: "${vs_a}", addon_product_id: "${wagon_id}", booking_date: "2026-08-04", slot_time: "12:00", qty: 1 }, as: GateStaff, captures: { bk_a2: $.data.id } }
          assert:
            - "AddonBooking.${bk_a1}.booked_value_cents == 10800 (12 * 900)"
            - "AddonBooking.${bk_b1}.booked_value_cents == 7200 (8 * 900); pool now exactly full at 20 == 20"
            - "qty 1 more on (wagon, 2026-08-04, 11:00): error_id == ERR_ADDON_SLOT_FULL, HTTP 422 (20 + 1 > 20)"
            - "qty 1 on (wagon, 2026-08-04, 12:00) succeeds — slot_time defines an independent pool"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_money_conservation
        grounds:
          - state_machines.Payment.PENDING_to_SETTLED
          - state_machines.Payment.SETTLED_to_REFUNDED
          - entities.VisitSession.fields.total_paid_cents
          - entities.SalesDay.fields.revenue_cents
          - calculations.payment_status_derive
        distinguishing_aspect: |
          Conserved quantity: cents. Forward (settle 850) paired with its
          compensating action (refund exactly 850) leaves
          session.total_paid_cents - total_refunded_cents == 0 and
          SalesDay.revenue_cents == 0 — exactly the pre-payment position, no drift.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; session party 1 containers 1 (admission 850), CHECKED_IN"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 1, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 850, idempotency_key: "k1" }, as: GateStaff, captures: { pay_id: $.data.id } }
            - { call: "GET /farm/sales-days/${day_id}", payload: {}, as: FarmManager, captures: { rev_after_pay: $.data.revenue_cents } }
          trigger:
            - { call: "POST /farm/payments/${pay_id}/refund", payload: { amount_cents: 850 }, as: FarmManager, captures: { pay_status: $.data.status, pay_refunded: $.data.refunded_amount_cents } }
            - { call: "GET /farm/visit-sessions/${vs_id}", payload: {}, as: FarmManager, captures: { vs_paid: $.data.total_paid_cents, vs_refunded: $.data.total_refunded_cents, vs_payst: $.data.payment_status, vs_visit: $.data.visit_status } }
            - { call: "GET /farm/sales-days/${day_id}", payload: {}, as: FarmManager, captures: { rev_after_refund: $.data.revenue_cents } }
          assert:
            - "After settle: SalesDay.${day_id}.revenue_cents == 850"
            - "Payment.${pay_id}.status == REFUNDED at exact full-amount boundary (refunded 850 == amount 850)"
            - "Invariant: VisitSession.${vs_id}.total_paid_cents - total_refunded_cents == 0 (850 - 850)"
            - "SalesDay.${day_id}.revenue_cents == 0 after the compensating refund"
            - "VisitSession.${vs_id}.payment_status == REFUNDED while visit_status stays CHECKED_IN (refund alone does not cancel)"

      - name: finalize_void_harvest_oz_conservation
        grounds:
          - state_machines.HarvestLine.PROVISIONAL_to_FINALIZED
          - state_machines.HarvestLine.FINALIZED_to_VOIDED
          - calculations.field_remaining_oz
          - entities.Crop.fields.season_picked_oz
        distinguishing_aspect: |
          Conserved quantity: ounces (distinct from the cents instance).
          Finalize (+300 oz committed) paired with its compensating void
          (-300 oz) restores field.committed_picked_oz == 0,
          crop.season_picked_oz == 0, and projected_remaining_oz == 1000 —
          the exact pre-finalize position.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; crop 480 c/lb; field estimated 1000 oz OPEN; session FIELD_ACTIVE (party 1, containers 0, admission 650 paid)"
            - "Offline batch uploads HARVEST_LINE L9 (gross 316, containers 4 -> net 300) against the FIELD_ACTIVE session, creating a PROVISIONAL line"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 650, idempotency_key: "k1" }, as: GateStaff }
            - { call: "POST /farm/visit-sessions/${vs_id}/enter-field", payload: {}, as: FieldStaff }
            - { call: "POST /farm/offline-batches", payload: { device_id: "DEV1", batch_id: "B9", records: [ { record_type: "HARVEST_LINE", sequence_index: 1, offline_ref: "L9", payload: { session_ref: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 316, container_count: 4 } } ] }, as: KioskDevice, captures: { b9_id: $.data.id } }
            - { call: "GET /farm/harvest-lines", payload: { session_id: "${vs_id}" }, as: FarmManager, captures: { ln9_id: $.data.0.id, ln9_status0: $.data.0.status } }
            - { call: "POST /farm/harvest-lines/${ln9_id}/finalize", payload: {}, as: FieldStaff }
            - { call: "GET /farm/fields/${f_id}", payload: {}, as: FarmManager, captures: { committed_mid: $.data.committed_picked_oz, projected_mid: $.data.projected_remaining_oz } }
            - { call: "GET /farm/crops/${crop_id}", payload: {}, as: FarmManager, captures: { crop_mid: $.data.season_picked_oz } }
          trigger:
            - { call: "POST /farm/harvest-lines/${ln9_id}/void", payload: {}, as: FieldStaff, captures: { ln9_status: $.data.status } }
            - { call: "GET /farm/fields/${f_id}", payload: {}, as: FarmManager, captures: { committed_end: $.data.committed_picked_oz, projected_end: $.data.projected_remaining_oz } }
            - { call: "GET /farm/crops/${crop_id}", payload: {}, as: FarmManager, captures: { crop_end: $.data.season_picked_oz } }
          assert:
            - "While PROVISIONAL: line status was PROVISIONAL (committed basis untouched)"
            - "After finalize: Field.committed_picked_oz == 300, projected_remaining_oz == 700, Crop.season_picked_oz == 300"
            - "After the compensating void: HarvestLine.${ln9_id}.status == VOIDED"
            - "Invariant: Field.committed_picked_oz == 0 and Crop.season_picked_oz == 0 (finalize+void conserves ounces)"
            - "Field.projected_remaining_oz == 1000 (provisional weight also released)"
