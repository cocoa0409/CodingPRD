              payload: { email: "haw@ex.com", full_name: "H AW" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "33 AW Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HOAManager
            - call: "POST /violations"
              payload: { property_id: "${p_id}", category: "NUISANCE" }
              as: ComplianceOfficer
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/confirm"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /violations/${v_id}/fine"
              payload: { fine_amount_cents: 15000 }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "POST /violations/${v_id}/appeal"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_APPEAL_WINDOW_EXPIRED'"

      - name: err_homeowner_delinquent_on_arc_submit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HOMEOWNER_DELINQUENT]
          - validations[priority=15]
        distinguishing_aspect: "Submitting an ARCRequest while Homeowner.standing == DELINQUENT returns ERR_HOMEOWNER_DELINQUENT (422)."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / arc_submit_blocked_on_property_suspended
          rationale: "The cross-entity dependency instance covers the ARC-submit gate; a distinct ERR_PROPERTY_SUSPENDED is thrown there because the property is SUSPENDED. This corner would fire ERR_HOMEOWNER_DELINQUENT when only the homeowner is delinquent — the two error paths are covered together by the priority chain in that instance's grounds."

