scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: package_dimensional_vs_actual_weight_diverge
        grounds:
          - calculations.package_billable_weight
          - calculations.package_acceptance_fee
          - entities.MailItem.fields.billable_weight_lb
          - entities.CarrierRule.fields.dim_divisor
        distinguishing_aspect: |
          Two valid readings of "the parcel's weight" — the scale weight and the dimensional weight —
          price the SAME acceptance differently on the MailItem entity domain: a 2.0 lb bulky box
          bills at 28 lb while a 30.0 lb compact box bills at 30 lb, so the variant that wins is the
          max() branch and not the field the requester supplied.
        test_recipe:
          setup:
            - "An ACTIVE box on a PLUS tier with one AUTHORIZED, RELEASABLE recipient."
            - "A UPS CarrierRule with dim_divisor 139, acceptance_fee_cents 300, base_rate_cents_per_lb 40."
            - "Two matched PACKAGE pieces: A is 20x16x12 in weighing 2.0 lb, B is 10x8x6 in weighing 30.0 lb."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /carrier-rules"
              payload: { carrier_code: "UPS", dim_divisor: 139, max_length_plus_girth_in: 130.0, max_actual_weight_lb: 70.0, accepts_signature_required: true, acceptance_fee_cents: 300, base_rate_cents_per_lb: 40 }
              as: PlatformAdmin
              captures: { ups_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "A-101", plan_tier_id: "${plan_id}", holder_name: "Ann Holder", holder_email: "ann@example.com", security_deposit_cents: 5000, extra_recipient_slots: 0, prepaid_balance_cents: 12000 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Ann Holder", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: true }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "12 Main St, Springfield" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Ann Holder", item_class: "PACKAGE", carrier_rule_id: "${ups_id}", signature_required: false, actual_weight_lb: 2.0, length_in: 20.0, width_in: 16.0, height_in: 12.0, interior_scan_consent: false }
              as: CmraOperator
              captures: { pkg_a: "$.data.id" }
            - call: "POST /mail-items/${pkg_a}/match"
              payload: { recipient_id: "${rec_id}" }
              as: CmraOperator
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Ann Holder", item_class: "PACKAGE", carrier_rule_id: "${ups_id}", signature_required: false, actual_weight_lb: 30.0, length_in: 10.0, width_in: 8.0, height_in: 6.0, interior_scan_consent: false }
              as: CmraOperator
              captures: { pkg_b: "$.data.id" }
            - call: "POST /mail-items/${pkg_b}/match"
              payload: { recipient_id: "${rec_id}" }
              as: CmraOperator
          trigger:
            - call: "POST /mail-items/${pkg_a}/package-acceptance"
              payload: {}
              as: CmraOperator
            - call: "POST /mail-items/${pkg_b}/package-acceptance"
              payload: {}
              as: CmraOperator
          assert:
            - "MailItem.${pkg_a}.billable_weight_lb == 28"
            - "MailItem.${pkg_a}.package_acceptance_fee_cents == 1420"
            - "MailItem.${pkg_b}.billable_weight_lb == 30.0"
            - "MailItem.${pkg_b}.package_acceptance_fee_cents == 1500"
            - "MailItem.${pkg_a}.billable_weight_lb != MailItem.${pkg_a}.actual_weight_lb"
            - "MailItem.${pkg_b}.billable_weight_lb == MailItem.${pkg_b}.actual_weight_lb"

      - name: plan_change_upgrade_vs_downgrade_proration
        grounds:
          - calculations.plan_change_proration
          - entities.Box.fields.pending_plan_tier_id
          - entities.BillingCycle.fields.proration_charge_cents
          - entities.BillingCycle.fields.proration_credit_cents
          - concurrency_rules[plan-change-stale-box]
        distinguishing_aspect: |
          The SAME plan-change request body produces two different money outcomes on the Box /
          BillingCycle domain (a different entity domain from the MailItem pricing above): the
          upgrade variant books credit 1100 and charge 2237 and moves plan_tier_id at once, while the
          downgrade variant books 0 and 0 and moves nothing but pending_plan_tier_id.
        test_recipe:
          setup:
            - "Two tiers: BASIC rank 1 at 3000 cents and PLUS rank 2 at 6100 cents."
            - "Box X starts on BASIC, box Y starts on PLUS, both activated on 2026-05-01 so period_start is 2026-05-01."
            - "The logical clock is moved to 2026-05-20, giving days_elapsed 19 and days_remaining 11."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "BASIC", name: "Basic", rank: 1, monthly_fee_cents: 3000, included_recipients: 2, included_scan_pages: 20, included_forwards: 1, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { basic_id: "$.data.id" }
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6100, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plus_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "B-201", plan_tier_id: "${basic_id}", holder_name: "Up Grader", holder_email: "up@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_x: "$.data.id" }
            - call: "POST /boxes/${box_x}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes"
              payload: { box_number: "B-202", plan_tier_id: "${plus_id}", holder_name: "Down Grader", holder_email: "down@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_y: "$.data.id" }
            - call: "POST /boxes/${box_y}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /boxes/${box_x}"
              payload: {}
              as: CmraOperator
              captures: { box_x_v: "$.data.version" }
            - call: "GET /boxes/${box_y}"
              payload: {}
              as: CmraOperator
              captures: { box_y_v: "$.data.version" }
          trigger:
            - call: "POST /boxes/${box_x}/plan-change"
              payload: { new_plan_tier_id: "${plus_id}", expected_box_version: "${box_x_v}" }
              as: BoxHolder
              as_user_id: "${box_x}"
            - call: "POST /boxes/${box_y}/plan-change"
              payload: { new_plan_tier_id: "${basic_id}", expected_box_version: "${box_y_v}" }
              as: BoxHolder
              as_user_id: "${box_y}"
            - call: "GET /boxes/${box_x}/billing-cycles"
              payload: {}
              as: CmraOperator
              captures: { cycle_x: "$.data[0].id" }
            - call: "GET /boxes/${box_y}/billing-cycles"
              payload: {}
              as: CmraOperator
              captures: { cycle_y: "$.data[0].id" }
          assert:
            - "Box.${box_x}.plan_tier_id == ${plus_id}"
            - "Box.${box_x}.pending_plan_tier_id == null"
            - "BillingCycle.${cycle_x}.proration_credit_cents == 1100"
            - "BillingCycle.${cycle_x}.proration_charge_cents == 2237"
            - "Box.${box_y}.plan_tier_id == ${plus_id}"
            - "Box.${box_y}.pending_plan_tier_id == ${basic_id}"
            - "BillingCycle.${cycle_y}.proration_credit_cents == 0"
            - "BillingCycle.${cycle_y}.proration_charge_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: forward_price_rounds_per_item_before_summing
        grounds:
          - calculations.forward_item_price
          - calculations.consolidation_discount
          - entities.ForwardShipment.fields.base_price_cents
          - entities.ForwardShipment.fields.total_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER decides the cents. Three PRIORITY pieces at bracket
          1750 give round_half_up(2537.5) == 2538 each, summing to 7614 under the pinned
          round-per-item-then-sum order, versus 7613 under sum-then-round; the scaffold pins 7614.
        test_recipe:
          setup:
            - "An ACTIVE box on PLUS with one AUTHORIZED, RELEASABLE recipient."
            - "Three FLAT pieces of 3.0 lb each, matched, each carrying a PENDING FORWARD disposition."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
