# =============================================================================
# SCAFFOLD — Fishery Observer & Catch Monitoring Program
# (§1.0–§1.7; difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Fishery Observer & Catch Monitoring Program (NOAA fisheries observer program): coverage requirement calculation & vessel selection, observer deployment logistics & sea-day scheduling, data collection protocol & sample verification, safety check of vessel before boarding, debriefing & data validation, harassment/interference reporting, cost recovery fee to industry, electronic monitoring alternative & video review

domain_name: fishery-observer-program
api_prefix: /observer-program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: Fishery
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique fishery code, e.g. BSAI-PLK", constraints: "unique across Fishery" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: region, type: string, source: input, description: "Management region" }
      - { name: coverage_target_pct, type: number, source: input, description: "Target observer coverage fraction of fleet effort days, inclusive range [0.02, 1.00]" }
      - { name: priority_gear, type: enum, source: input, description: "TRAWL | LONGLINE | POT | GILLNET — gear type receiving the 1.25 selection multiplier" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: VesselOperator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Operator legal name" }
      - { name: license_number, type: string, source: input, description: "Unique operator license number", constraints: "unique across VesselOperator" }
      - { name: contact_person_ref, type: string, source: input, description: "Natural-person reference for the primary contact" }
      - { name: payment_standing, type: enum, source: system, default: GOOD, description: "GOOD | DELINQUENT — set DELINQUENT by the overdue-invoice cascade, restored to GOOD when no OVERDUE invoices remain" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> VesselOperator.id; owning operator" }
      - { name: fishery_id, type: string, source: input, description: "FK -> Fishery.id; permitted fishery" }
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: permit_number, type: string, source: input, description: "Unique federal permit number", constraints: "unique across Vessel" }
      - { name: home_port, type: string, source: input, description: "Home port" }
      - { name: length_ft, type: number, source: input, description: "Overall length in feet, > 0; < 40 qualifies for SMALL_VESSEL fee variant" }
      - { name: gear_type, type: enum, source: input, description: "TRAWL | LONGLINE | POT | GILLNET" }
      - { name: declared_annual_revenue_cents, type: integer, source: input, required: false, description: "Optional declared ex-vessel revenue; when present caps invoice total at 0.5%" }
      - { name: prior_last_observed_end_date, type: datetime, source: input, required: false, description: "Pre-program observed-history seed; copied into last_observed_end_date at creation" }
      - { name: prior_harassment_points, type: integer, source: input, required: false, default: 0, description: "Pre-program penalty seed; copied into selection_penalty_points at creation" }
      - { name: monitoring_mode, type: enum, source: system, default: HUMAN_OBSERVER, description: "HUMAN_OBSERVER | ELECTRONIC_MONITORING — flipped by EMEnrollment activate/terminate cascades" }
      - { name: selection_penalty_points, type: integer, source: system, default: 0, description: "Penalty points from substantiated harassment (+3) and defaulted notices (+2)" }
      - { name: substantiated_harassment_count, type: integer, source: system, default: 0, description: "Count of substantiated harassment reports (first substantiation only)" }
      - { name: last_observed_end_date, type: datetime, source: system, description: "Actual return date of the most recent CLOSED human-observer deployment; null if never observed" }
      - { name: sea_days_observed_ytd, type: integer, source: system, default: 0, description: "Sum of actual_sea_days over this vessel's CLOSED deployments" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | ACTIVE | SUSPENDED" }

  - name: Observer
    parent: null
    common_fields: true
    fields:
      - { name: person_ref, type: string, source: input, description: "Natural-person identity reference; unique; basis for debriefing segregation of duties", constraints: "unique across Observer" }
      - { name: full_name, type: string, source: input, description: "Observer name" }
      - { name: home_port, type: string, source: input, description: "Home port" }
      - { name: certification_level, type: enum, source: input, description: "TRAINEE | CERTIFIED | LEAD" }
      - { name: max_consecutive_sea_days, type: integer, source: computed, description: "Derived from certification_level: TRAINEE=20, CERTIFIED=30, LEAD=45" }
      - { name: sea_days_used_ytd, type: integer, source: system, default: 0, description: "Sum of actual_sea_days over this observer's CLOSED deployments" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | DECERTIFIED" }

  - name: Debriefer
    parent: null
    common_fields: true
    fields:
      - { name: person_ref, type: string, source: input, description: "Natural-person identity reference; unique; compared to Observer.person_ref for segregation of duties", constraints: "unique across Debriefer" }
      - { name: full_name, type: string, source: input, description: "Debriefer name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: EMReviewer
    parent: null
    common_fields: true
    fields:
      - { name: person_ref, type: string, source: input, description: "Natural-person identity reference; unique", constraints: "unique across EMReviewer" }
      - { name: full_name, type: string, source: input, description: "Reviewer name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: CoveragePlan
    parent: null
    common_fields: true
    fields:
      - { name: fishery_id, type: string, source: input, description: "FK -> Fishery.id" }
      - { name: period_start, type: datetime, source: input, description: "Plan period start date (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Plan period end date (inclusive, must be > period_start)" }
      - { name: projected_fleet_effort_days, type: integer, source: input, description: "Projected total fleet fishing days in period, > 0" }
      - { name: projected_em_effort_days, type: integer, source: input, description: "Projected EM-covered effort days, >= 0" }
      - { name: required_observer_sea_days, type: integer, source: computed, description: "Provisional coverage requirement computed at publish" }
      - { name: actual_fleet_effort_days, type: integer, source: input, required: false, description: "Actual fleet effort days, supplied at plan close" }
      - { name: final_required_observer_sea_days, type: integer, source: computed, description: "Final coverage requirement computed at close from actuals; null until CLOSED" }
      - { name: actual_observer_sea_days, type: integer, source: system, default: 0, description: "Sum of actual_sea_days over CLOSED deployments under this plan" }
      - { name: actual_em_sea_days, type: integer, source: system, default: 0, description: "Sum of trip_sea_days over ACCEPTED EM trips credited to this plan" }
      - { name: coverage_attainment_pct, type: number, source: computed, description: "actual_observer_sea_days / final_required_observer_sea_days, 4 decimals round_half_up; null until CLOSED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SELECTION_COMPLETED | CLOSED" }

  - name: SelectionRun
    parent: null
    common_fields: true
    fields:
      - { name: coverage_plan_id, type: string, source: system, description: "FK -> CoveragePlan.id (path)" }
      - { name: run_index, type: integer, source: system, description: "1-based sequence of runs within the plan, ordered by created_at ASC" }
      - { name: notice_response_deadline, type: datetime, source: input, description: "Timestamp after which ISSUED notices of this run may be expired by ops run" }
      - { name: vessels_evaluated, type: integer, source: system, description: "Count of eligible vessels scored" }
      - { name: vessels_selected, type: integer, source: system, description: "Count of notices created" }
      - { name: selection_deficit_sea_days, type: integer, source: system, description: "required_observer_sea_days minus 30*vessels_selected, floored at 0" }

  - name: SelectionNotice
    parent: null
    common_fields: true
    fields:
      - { name: selection_run_id, type: string, source: system, description: "FK -> SelectionRun.id" }
      - { name: coverage_plan_id, type: string, source: system, description: "FK -> CoveragePlan.id (denormalized from run)" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: allocated_sea_days, type: integer, source: system, default: 30, description: "Sea-day obligation allocated to this notice (NOTICE_ALLOCATION_DAYS)" }
      - { name: reserved_sea_days, type: integer, source: system, default: 0, description: "Planned days of open deployments against this notice" }
      - { name: consumed_sea_days, type: integer, source: system, default: 0, description: "Actual days consumed (credited at deployment return / early termination)" }
      - { name: remaining_sea_days, type: integer, source: system, description: "= allocated - reserved - consumed; invariant allocated == remaining + reserved + consumed holds at all times" }
      - { name: selection_score, type: number, source: system, description: "Weighted selection score, 4 decimals" }
      - { name: rank, type: integer, source: system, description: "1-based rank within the run (score DESC, tie-breaks per selection calc)" }
      - { name: response_deadline, type: datetime, source: system, description: "Copied from SelectionRun.notice_response_deadline" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACCEPTED | DECLINED | EXPIRED | FULFILLED | DEFAULTED | VOIDED" }

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - { name: selection_notice_id, type: string, source: input, description: "FK -> SelectionNotice.id" }
      - { name: coverage_plan_id, type: string, source: system, description: "FK -> CoveragePlan.id (denormalized from notice)" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id (copied from notice)" }
      - { name: observer_id, type: string, source: input, description: "FK -> Observer.id" }
      - { name: assigned_debriefer_id, type: string, source: system, description: "FK -> Debriefer.id; set by assign-debriefer; null until assigned" }
      - { name: scheduled_departure_date, type: datetime, source: input, description: "Scheduled departure date" }
      - { name: scheduled_return_date, type: datetime, source: input, description: "Scheduled return date, > departure" }
      - { name: planned_sea_days, type: integer, source: computed, description: "(scheduled_return_date - scheduled_departure_date).days + 1 (inclusive)" }
      - { name: actual_return_date, type: datetime, source: system, description: "Set at return or early termination; null before" }
      - { name: actual_sea_days, type: integer, source: computed, description: "(actual_return_date - scheduled_departure_date).days + 1; null before return" }
      - { name: latest_safety_result, type: enum, source: computed, description: "PASS | FAIL | null — result of the most recent SafetyInspection" }
      - { name: early_termination_reason, type: enum, source: system, description: "HARASSMENT | null — set by the harassment substantiation cascade" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of latest data submission; null until first submit-data" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | SAFETY_HOLD | READY_TO_DEPLOY | AT_SEA | RETURNED | EARLY_TERMINATED | DEBRIEFING | DATA_REJECTED | DATA_VALIDATED | CLOSED | CANCELLED" }

  - name: SafetyInspection
    parent: null
    common_fields: false
    fields:
      - { name: deployment_id, type: string, source: system, description: "FK -> Deployment.id (path)" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id (copied from deployment)" }
      - { name: observer_id, type: string, source: system, description: "FK -> Observer.id (acting observer)" }
      - { name: life_raft_certified, type: boolean, source: input, description: "Life raft certification current" }
      - { name: epirb_registered, type: boolean, source: input, description: "EPIRB registered" }
      - { name: immersion_suits_adequate, type: boolean, source: input, description: "Immersion suits adequate for crew+observer" }
      - { name: fire_suppression_ok, type: boolean, source: input, description: "Fire suppression equipment functional" }
      - { name: comms_equipment_ok, type: boolean, source: input, description: "Communications equipment functional" }
      - { name: deficiency_notes, type: string, source: input, required: false, description: "Notes; required when result is FAIL" }
      - { name: supersedes_inspection_id, type: string, source: input, required: false, description: "FK -> SafetyInspection.id; mandatory when the deployment is in SAFETY_HOLD (re-inspection must reference the failed inspection)" }
      - { name: result, type: enum, source: computed, description: "PASS when all five checklist booleans are true, else FAIL" }

  - name: HaulSample
    parent: null
    common_fields: true
    fields:
      - { name: deployment_id, type: string, source: system, description: "FK -> Deployment.id (path)" }
      - { name: haul_date, type: datetime, source: input, description: "Date of haul; must be within [scheduled_departure_date, scheduled_return_date]" }
      - { name: haul_number, type: integer, source: input, description: ">= 1; unique within the deployment" }
      - { name: species_code, type: string, source: input, description: "Species code, e.g. PLCK" }
      - { name: sampled_weight_kg, type: number, source: input, description: "Sampled weight, > 0, 2 decimals" }
      - { name: total_haul_weight_kg, type: number, source: input, description: "Total haul weight, >= sampled_weight_kg, 2 decimals" }
      - { name: sampling_ratio, type: number, source: computed, description: "sampled_weight_kg / total_haul_weight_kg, 4 decimals round_half_up; must be in [0.2000, 1.0000]" }
      - { name: flagged_reason, type: string, source: system, description: "Reason recorded when debriefer flags the sample" }
      - { name: verified_by_debriefer_id, type: string, source: system, description: "FK -> Debriefer.id; set on verify/discard" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | FLAGGED | VERIFIED | DISCARDED" }

  - name: HarassmentReport
    parent: null
    common_fields: true
    fields:
      - { name: deployment_id, type: string, source: system, description: "FK -> Deployment.id (path)" }
      - { name: observer_id, type: string, source: system, description: "FK -> Observer.id (filing observer)" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id (from deployment)" }
      - { name: report_type, type: enum, source: input, description: "HARASSMENT | INTERFERENCE | SAFETY_COERCION" }
      - { name: narrative, type: string, source: input, description: "Free-text account" }
      - { name: incident_date, type: datetime, source: input, description: "Date of incident" }
      - { name: penalty_applied, type: boolean, source: system, default: false, description: "True once the first substantiation has applied vessel penalties; prevents double penalty on re-affirmation after appeal and gates compensation on dismissal" }
      - { name: resolution_notes, type: string, source: system, description: "Notes at substantiate/dismiss/resolve" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | SUBSTANTIATED | APPEALED | DISMISSED | RESOLVED" }

  - name: EMEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: equipment_vendor, type: string, source: input, description: "EM equipment vendor" }
      - { name: equipment_install_date, type: datetime, source: input, description: "Date equipment installed" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque ProgramAdmin user id that approved/rejected" }
      - { name: rejection_reason, type: string, source: system, description: "Reason when REJECTED" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | APPROVED | REJECTED | ACTIVE | SUSPENDED | TERMINATED" }

  - name: EMTrip
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: em_enrollment_id, type: string, source: system, description: "FK -> EMEnrollment.id (vessel's ACTIVE enrollment at creation)" }
      - { name: assigned_reviewer_id, type: string, source: system, description: "FK -> EMReviewer.id; set by assign-reviewer" }
      - { name: departure_date, type: datetime, source: input, description: "Trip departure date" }
      - { name: return_date, type: datetime, source: input, description: "Trip return date, > departure" }
      - { name: trip_sea_days, type: integer, source: computed, description: "(return_date - departure_date).days + 1 (inclusive)" }
      - { name: video_hours, type: number, source: system, description: "Declared footage hours, set at submit-footage, > 0, 2 decimals" }
      - { name: reviewed_hours, type: number, source: system, default: 0, description: "Accumulated reviewed hours from record-review calls" }
      - { name: reviewed_pct, type: number, source: computed, description: "reviewed_hours / video_hours, 4 decimals round_half_up; null until footage submitted" }
      - { name: sampled_catch_kg, type: number, source: system, default: 0, description: "Accumulated sampled catch from record-review calls" }
      - { name: estimated_total_catch_kg, type: number, source: computed, description: "Extrapolated at accept: round(sampled_catch_kg * video_hours / reviewed_hours, 2); null until ACCEPTED" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED | FOOTAGE_SUBMITTED | IN_REVIEW | REVIEWED | ACCEPTED | REJECTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: coverage_plan_id, type: string, source: system, description: "FK -> CoveragePlan.id" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: operator_id, type: string, source: system, description: "FK -> VesselOperator.id (from vessel)" }
      - { name: fee_variant, type: enum, source: system, description: "STANDARD | SMALL_VESSEL (vessel.length_ft < 40)" }
      - { name: sea_days_billed, type: integer, source: system, description: "Sum of actual_sea_days over billed CLOSED deployments" }
      - { name: line_items, type: array, source: system, description: "Per-deployment lines: {deployment_id, days, tier1_days, tier2_days, line_subtotal_cents, line_total_cents}; line_total_cents = round_half_up(line_subtotal_cents * 1.037)" }
      - { name: amount_due_cents, type: integer, source: system, description: "Sum of line_total_cents, then capped at floor(declared_annual_revenue_cents * 0.005) when declared revenue present" }
      - { name: fee_cap_applied, type: boolean, source: system, default: false, description: "True when the revenue cap reduced amount_due_cents" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Sum of applied payments" }
      - { name: amount_adjusted_cents, type: integer, source: system, default: 0, description: "Net signed adjustments (negative reduces the debt)" }
      - { name: amount_outstanding_cents, type: integer, source: computed, description: "= amount_due_cents + amount_adjusted_cents - amount_paid_cents; always >= 0" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque ProgramCoordinator user id that issued; basis for adjustment segregation of duties" }
      - { name: issue_date, type: datetime, source: system, description: "Clock date at issue" }
      - { name: due_date, type: datetime, source: system, description: "issue_date + 30 days" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | DISPUTED | OVERDUE | WAIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Fishery
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "PATCH /observer-program/fisheries/{id} (status: SUSPENDED)", actor: ProgramAdmin, preconditions: [], side_effects: ["Increments Fishery.version by 1"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "PATCH /observer-program/fisheries/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: [], side_effects: ["Increments Fishery.version by 1"] }

  - entity: VesselOperator
    initial_state: GOOD
    terminal_states: []
    transitions:
      - { from: GOOD, to: DELINQUENT, trigger: "system (ops run marks an invoice of this operator OVERDUE)", actor: system, preconditions: ["An Invoice of this operator transitions to OVERDUE during the ops run"], side_effects: ["Cascade hop 2: every Vessel with operator_id == this operator and status ACTIVE -> SUSPENDED (hop 3); each such vessel suspension cancels its Deployments in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY (hop 4, releasing reserved sea days back to each notice: reserved_sea_days -= planned_sea_days, remaining_sea_days += planned_sea_days)"] }
      - { from: DELINQUENT, to: GOOD, trigger: "system (invoice payment or waiver leaves operator with zero OVERDUE invoices)", actor: system, preconditions: ["No Invoice of this operator remains in OVERDUE after the transition"], side_effects: ["Vessels stay SUSPENDED; reactivation is manual via PATCH /observer-program/vessels/{id}"] }

  - entity: Vessel
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - { from: REGISTERED, to: ACTIVE, trigger: "PATCH /observer-program/vessels/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: ["VesselOperator.status == ACTIVE"], side_effects: ["Increments Vessel.version by 1"] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "PATCH /observer-program/vessels/{id} (status: SUSPENDED) OR system (operator delinquency cascade)", actor: ProgramAdmin, preconditions: [], side_effects: ["Increments Vessel.version by 1"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "PATCH /observer-program/vessels/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: ["VesselOperator.status == ACTIVE"], side_effects: ["Increments Vessel.version by 1"] }

  - entity: Observer
    initial_state: ACTIVE
    terminal_states: [DECERTIFIED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "PATCH /observer-program/observers/{id} (status: SUSPENDED)", actor: ProgramAdmin, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "PATCH /observer-program/observers/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: DECERTIFIED, trigger: "PATCH /observer-program/observers/{id} (status: DECERTIFIED)", actor: ProgramAdmin, preconditions: ["No Deployment of this observer in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA"], side_effects: [] }
      - { from: SUSPENDED, to: DECERTIFIED, trigger: "PATCH /observer-program/observers/{id} (status: DECERTIFIED)", actor: ProgramAdmin, preconditions: ["No Deployment of this observer in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA"], side_effects: [] }

  - entity: Debriefer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "PATCH /observer-program/debriefers/{id} (status: SUSPENDED)", actor: ProgramAdmin, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "PATCH /observer-program/debriefers/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: [], side_effects: [] }

  - entity: EMReviewer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "PATCH /observer-program/em-reviewers/{id} (status: SUSPENDED)", actor: ProgramAdmin, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "PATCH /observer-program/em-reviewers/{id} (status: ACTIVE)", actor: ProgramAdmin, preconditions: [], side_effects: [] }

  - entity: CoveragePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /observer-program/coverage-plans/{id}/publish"
        actor: ProgramCoordinator
        preconditions:
          - "Fishery.status == ACTIVE (ERR_FISHERY_NOT_ACTIVE)"
        side_effects:
          - "Runs coverage_requirement_calculation PROVISIONAL variant; sets required_observer_sea_days"
          - "Increments CoveragePlan.version by 1"
      - from: PUBLISHED
        to: SELECTION_COMPLETED
        trigger: "POST /observer-program/coverage-plans/{id}/selection-runs (first run)"
        actor: ProgramCoordinator
        preconditions:
          - "Fishery.status == ACTIVE (ERR_FISHERY_NOT_ACTIVE)"
          - "OCC: expected_coverage_plan_version == CoveragePlan.version (ERR_STALE_VERSION)"
        side_effects:
          - "Runs vessel_selection_scoring + selection_run_sizing; creates SelectionNotice rows (status ISSUED, allocated_sea_days=30, remaining_sea_days=30)"
          - "Increments CoveragePlan.version by 1"
      - from: SELECTION_COMPLETED
        to: SELECTION_COMPLETED
        trigger: "POST /observer-program/coverage-plans/{id}/selection-runs (backfill run)"
        actor: ProgramCoordinator
        preconditions:
          - "Fishery.status == ACTIVE (ERR_FISHERY_NOT_ACTIVE)"
          - "OCC: expected_coverage_plan_version == CoveragePlan.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same scoring run; vessels holding an open notice (ISSUED|ACCEPTED) under this plan are excluded from eligibility"
          - "Increments CoveragePlan.version by 1"
      - from: SELECTION_COMPLETED
        to: CLOSED
        trigger: "POST /observer-program/coverage-plans/{id}/close"
        actor: ProgramCoordinator
        preconditions:
          - "No Deployment under this plan in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA|RETURNED|EARLY_TERMINATED|DEBRIEFING|DATA_REJECTED|DATA_VALIDATED (ERR_PLAN_HAS_OPEN_DEPLOYMENTS)"
        side_effects:
          - "Runs coverage_requirement_calculation FINAL variant using actual_fleet_effort_days (input) and actual_em_sea_days; sets final_required_observer_sea_days and coverage_attainment_pct"
          - "Cascade: notices ISSUED -> EXPIRED; notices ACCEPTED with remaining_sea_days > 0 -> DEFAULTED and their Vessel.selection_penalty_points += 2; notices ACCEPTED with remaining_sea_days == 0 -> FULFILLED"
          - "Increments CoveragePlan.version by 1"

  - entity: SelectionNotice
    initial_state: ISSUED
    terminal_states: [DECLINED, EXPIRED, FULFILLED, DEFAULTED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /observer-program/selection-notices/{id}/accept"
        actor: VesselOperator
        preconditions:
          - "Acting operator owns the notice's vessel (Vessel.operator_id == X-User-ID)"
          - "Current clock timestamp <= response_deadline (ERR_NOTICE_EXPIRED)"
        side_effects: ["Increments SelectionNotice.version by 1"]
      - from: ISSUED
        to: DECLINED
        trigger: "POST /observer-program/selection-notices/{id}/decline"
        actor: VesselOperator
        preconditions: ["Acting operator owns the notice's vessel"]
        side_effects: ["Increments SelectionNotice.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (ops run when response_deadline < current clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (automatic at deployment close when remaining_sea_days == 0 and no open deployments reference this notice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: DEFAULTED
        trigger: "system (plan close cascade with remaining_sea_days > 0)"
        actor: system
        preconditions: []
        side_effects: ["Vessel.selection_penalty_points += 2"]
      - from: ISSUED
        to: VOIDED
        trigger: "system (EM enrollment activation cascade on the notice's vessel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: VOIDED
        trigger: "system (EM enrollment activation cascade on the notice's vessel)"
        actor: system
        preconditions: []
        side_effects: ["Cascade: each Deployment of this notice in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY -> CANCELLED with day release (reserved -= planned, remaining += planned)"]

  - entity: Deployment
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: READY_TO_DEPLOY
        trigger: "POST /observer-program/deployments/{id}/safety-inspections with result PASS"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "All five checklist booleans present (ERR_SAFETY_CHECKLIST_INCOMPLETE)"]
        side_effects: ["Creates SafetyInspection (result PASS); latest_safety_result = PASS", "Increments Deployment.version by 1"]
      - from: SCHEDULED
        to: SAFETY_HOLD
        trigger: "POST /observer-program/deployments/{id}/safety-inspections with result FAIL"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "deficiency_notes required on FAIL (ERR_SAFETY_CHECKLIST_INCOMPLETE)"]
        side_effects: ["Creates SafetyInspection (result FAIL); latest_safety_result = FAIL", "Increments Deployment.version by 1"]
      - from: SAFETY_HOLD
        to: READY_TO_DEPLOY
        trigger: "POST /observer-program/deployments/{id}/safety-inspections with result PASS"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "supersedes_inspection_id must reference the most recent FAIL SafetyInspection of this deployment (ERR_SAFETY_SUPERSESSION_REQUIRED)"]
        side_effects: ["Creates SafetyInspection (result PASS); latest_safety_result = PASS", "Increments Deployment.version by 1"]
      - from: SAFETY_HOLD
        to: SCHEDULED
        trigger: "POST /observer-program/deployments/{id}/reschedule"
        actor: ProgramCoordinator
        preconditions: ["New dates re-validated (range, length, observer overlap, vessel turnaround, observer caps, notice allocation)"]
        side_effects: ["Notice reconciliation: remaining_sea_days -= (new_planned - old_planned); reserved_sea_days += (new_planned - old_planned)", "latest_safety_result reset to null", "Increments Deployment.version by 1"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /observer-program/deployments/{id}/reschedule"
        actor: ProgramCoordinator
        preconditions: ["New dates re-validated as above"]
        side_effects: ["Notice reconciliation by planned-days delta", "Increments Deployment.version by 1"]
      - from: READY_TO_DEPLOY
        to: AT_SEA
        trigger: "POST /observer-program/deployments/{id}/board"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "Status must be READY_TO_DEPLOY; from SCHEDULED|SAFETY_HOLD the error is ERR_SAFETY_CHECK_REQUIRED"]
        side_effects: ["Increments Deployment.version by 1"]
      - from: AT_SEA
        to: RETURNED
        trigger: "POST /observer-program/deployments/{id}/return"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "scheduled_departure_date <= actual_return_date <= scheduled_return_date (ERR_DATE_RANGE_INVALID)"]
        side_effects:
          - "actual_sea_days computed (inclusive); notice reconciliation: reserved_sea_days -= planned_sea_days; consumed_sea_days += actual_sea_days; remaining_sea_days += (planned_sea_days - actual_sea_days)"
          - "Increments Deployment.version by 1"
      - from: AT_SEA
        to: EARLY_TERMINATED
        trigger: "system (harassment substantiation cascade on a linked report)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_return_date = current clock date; actual_sea_days = clamp((clock_date - scheduled_departure_date).days + 1, 1, planned_sea_days)"
          - "early_termination_reason = HARASSMENT; same notice reconciliation as a normal return"
          - "Increments Deployment.version by 1"
      - from: RETURNED
        to: DEBRIEFING
        trigger: "POST /observer-program/deployments/{id}/submit-data"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "At least one HaulSample exists for the deployment (ERR_INVALID_REQUEST)"]
        side_effects: ["submitted_at = current clock", "Increments Deployment.version by 1"]
      - from: EARLY_TERMINATED
        to: DEBRIEFING
        trigger: "POST /observer-program/deployments/{id}/submit-data"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id", "At least one HaulSample exists (ERR_INVALID_REQUEST)"]
        side_effects: ["submitted_at = current clock", "Increments Deployment.version by 1"]
      - from: DATA_REJECTED
        to: DEBRIEFING
        trigger: "POST /observer-program/deployments/{id}/submit-data (resubmission)"
        actor: Observer
        preconditions: ["Acting observer == Deployment.observer_id"]
        side_effects: ["submitted_at = current clock", "Increments Deployment.version by 1"]
      - from: DEBRIEFING
        to: DATA_VALIDATED
        trigger: "POST /observer-program/deployments/{id}/validate-data"
        actor: Debriefer
        preconditions:
          - "assigned_debriefer_id set (ERR_DEBRIEFER_NOT_ASSIGNED) and acting debriefer == assigned_debriefer_id (ERR_FORBIDDEN)"
          - "Every HaulSample of the deployment in VERIFIED|DISCARDED (ERR_SAMPLES_NOT_RESOLVED)"
          - "sample_verification_gate: count(VERIFIED) >= 1 and verified coverage ratio >= 0.2000 (ERR_SAMPLE_COVERAGE_INSUFFICIENT)"
        side_effects: ["Increments Deployment.version by 1"]
      - from: DEBRIEFING
        to: DATA_REJECTED
        trigger: "POST /observer-program/deployments/{id}/reject-data"
        actor: Debriefer
        preconditions: ["assigned_debriefer_id set (ERR_DEBRIEFER_NOT_ASSIGNED) and acting debriefer == assigned_debriefer_id (ERR_FORBIDDEN)"]
        side_effects: ["Increments Deployment.version by 1"]
      - from: DATA_VALIDATED
        to: CLOSED
        trigger: "POST /observer-program/deployments/{id}/close"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Observer.sea_days_used_ytd += actual_sea_days; Vessel.sea_days_observed_ytd += actual_sea_days; Vessel.last_observed_end_date = actual_return_date; CoveragePlan.actual_observer_sea_days += actual_sea_days"
          - "If notice.remaining_sea_days == 0 and no other open deployments reference the notice: notice -> FULFILLED"
          - "Increments Deployment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /observer-program/deployments/{id}/cancel OR system (delinquency / EM activation cascades)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Day release: notice.reserved_sea_days -= planned_sea_days; notice.remaining_sea_days += planned_sea_days", "Increments Deployment.version by 1"]
      - from: SAFETY_HOLD
        to: CANCELLED
        trigger: "POST /observer-program/deployments/{id}/cancel OR system cascade"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Day release as above", "Increments Deployment.version by 1"]
      - from: READY_TO_DEPLOY
        to: CANCELLED
        trigger: "POST /observer-program/deployments/{id}/cancel OR system cascade"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Day release as above", "Increments Deployment.version by 1"]

  - entity: HaulSample
    initial_state: RECORDED
    terminal_states: [VERIFIED, DISCARDED]
    transitions:
      - { from: RECORDED, to: FLAGGED, trigger: "POST /observer-program/haul-samples/{id}/flag", actor: Debriefer, preconditions: ["Deployment.status == DEBRIEFING", "Acting debriefer == Deployment.assigned_debriefer_id"], side_effects: ["flagged_reason set from input", "verified_by_debriefer_id = acting debriefer"] }
      - { from: RECORDED, to: VERIFIED, trigger: "POST /observer-program/haul-samples/{id}/verify", actor: Debriefer, preconditions: ["Deployment.status == DEBRIEFING", "Acting debriefer == Deployment.assigned_debriefer_id"], side_effects: ["verified_by_debriefer_id = acting debriefer"] }
      - { from: FLAGGED, to: VERIFIED, trigger: "POST /observer-program/haul-samples/{id}/verify", actor: Debriefer, preconditions: ["Deployment.status == DEBRIEFING", "Acting debriefer == Deployment.assigned_debriefer_id"], side_effects: ["verified_by_debriefer_id = acting debriefer"] }
      - { from: FLAGGED, to: DISCARDED, trigger: "POST /observer-program/haul-samples/{id}/discard", actor: Debriefer, preconditions: ["Deployment.status == DEBRIEFING", "Acting debriefer == Deployment.assigned_debriefer_id"], side_effects: ["verified_by_debriefer_id = acting debriefer"] }

  - entity: HarassmentReport
    initial_state: FILED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - { from: FILED, to: UNDER_REVIEW, trigger: "POST /observer-program/harassment-reports/{id}/start-review", actor: ProgramCoordinator, preconditions: [], side_effects: ["Increments HarassmentReport.version by 1"] }
      - { from: APPEALED, to: UNDER_REVIEW, trigger: "POST /observer-program/harassment-reports/{id}/start-review", actor: ProgramCoordinator, preconditions: [], side_effects: ["Increments HarassmentReport.version by 1"] }
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /observer-program/harassment-reports/{id}/substantiate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Cascade hop 1: if Deployment.status == AT_SEA, deployment -> EARLY_TERMINATED (computes actual_sea_days from clock, reconciles notice days)"
          - "Cascade hop 2 (only when penalty_applied == false): Vessel.selection_penalty_points += 3 and Vessel.substantiated_harassment_count += 1; sets penalty_applied = true"
          - "resolution_notes set from input; Increments HarassmentReport.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /observer-program/harassment-reports/{id}/dismiss"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Compensation (only when penalty_applied == true, i.e. dismissal after appeal): Vessel.selection_penalty_points -= 3 and Vessel.substantiated_harassment_count -= 1; sets penalty_applied = false"
          - "resolution_notes set from input; Increments HarassmentReport.version by 1"
      - { from: SUBSTANTIATED, to: APPEALED, trigger: "POST /observer-program/harassment-reports/{id}/appeal", actor: VesselOperator, preconditions: ["Acting operator owns the report's vessel"], side_effects: ["Increments HarassmentReport.version by 1"] }
      - { from: SUBSTANTIATED, to: RESOLVED, trigger: "POST /observer-program/harassment-reports/{id}/resolve", actor: ProgramAdmin, preconditions: [], side_effects: ["resolution_notes set from input"] }

  - entity: EMEnrollment
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - { from: PENDING_REVIEW, to: APPROVED, trigger: "POST /observer-program/em-enrollments/{id}/approve", actor: ProgramAdmin, preconditions: [], side_effects: ["reviewed_by_user_id = X-User-ID"] }
      - { from: PENDING_REVIEW, to: REJECTED, trigger: "POST /observer-program/em-enrollments/{id}/reject", actor: ProgramAdmin, preconditions: [], side_effects: ["reviewed_by_user_id = X-User-ID; rejection_reason set from input"] }
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /observer-program/em-enrollments/{id}/activate"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Cascade hop 1: Vessel.monitoring_mode -> ELECTRONIC_MONITORING"
          - "Cascade hop 2: every SelectionNotice of this vessel in ISSUED|ACCEPTED -> VOIDED"
          - "Cascade hop 3: each Deployment of a voided notice in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY -> CANCELLED with day release (reserved -= planned, remaining += planned)"
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /observer-program/em-enrollments/{id}/activate", actor: ProgramCoordinator, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /observer-program/em-enrollments/{id}/suspend", actor: ProgramAdmin, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: TERMINATED, trigger: "POST /observer-program/em-enrollments/{id}/terminate", actor: ProgramAdmin, preconditions: ["No EMTrip of this enrollment in DECLARED|FOOTAGE_SUBMITTED|IN_REVIEW|REVIEWED"], side_effects: ["Vessel.monitoring_mode -> HUMAN_OBSERVER"] }
      - { from: SUSPENDED, to: TERMINATED, trigger: "POST /observer-program/em-enrollments/{id}/terminate", actor: ProgramAdmin, preconditions: ["No EMTrip of this enrollment in DECLARED|FOOTAGE_SUBMITTED|IN_REVIEW|REVIEWED"], side_effects: ["Vessel.monitoring_mode -> HUMAN_OBSERVER"] }

  - entity: EMTrip
    initial_state: DECLARED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - { from: DECLARED, to: FOOTAGE_SUBMITTED, trigger: "POST /observer-program/em-trips/{id}/submit-footage", actor: VesselOperator, preconditions: ["Acting operator owns the vessel", "video_hours > 0 (ERR_INVALID_REQUEST)"], side_effects: ["video_hours set; reviewed_pct recomputed"] }
      - { from: FOOTAGE_SUBMITTED, to: IN_REVIEW, trigger: "POST /observer-program/em-trips/{id}/assign-reviewer", actor: ProgramCoordinator, preconditions: ["EMReviewer.status == ACTIVE"], side_effects: ["assigned_reviewer_id set"] }
      - { from: IN_REVIEW, to: IN_REVIEW, trigger: "POST /observer-program/em-trips/{id}/record-review (below threshold)", actor: EMReviewer, preconditions: ["Acting reviewer == assigned_reviewer_id"], side_effects: ["reviewed_hours += additional_reviewed_hours; sampled_catch_kg += sampled_catch_kg_delta; reviewed_pct recomputed"] }
      - { from: IN_REVIEW, to: REVIEWED, trigger: "system (automatic on record-review when reviewed_pct >= 0.3000)", actor: system, preconditions: [], side_effects: [] }
      - from: REVIEWED
        to: ACCEPTED
        trigger: "POST /observer-program/em-trips/{id}/accept"
        actor: ProgramCoordinator
        preconditions: ["A unique CoveragePlan exists with fishery_id == Vessel.fishery_id, period containing [departure_date, return_date], status SELECTION_COMPLETED (ERR_NO_COVERAGE_PLAN_FOR_TRIP)"]
        side_effects:
          - "estimated_total_catch_kg = round_half_up(sampled_catch_kg * video_hours / reviewed_hours, 2)"
          - "CoveragePlan.actual_em_sea_days += trip_sea_days"
      - { from: REVIEWED, to: REJECTED, trigger: "POST /observer-program/em-trips/{id}/reject", actor: ProgramCoordinator, preconditions: [], side_effects: ["No coverage credit is granted"] }

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, WAIVED]
    transitions:
      - { from: DRAFT, to: ISSUED, trigger: "POST /observer-program/invoices/{id}/issue", actor: ProgramCoordinator, preconditions: [], side_effects: ["issued_by_user_id = X-User-ID; issue_date = current clock date; due_date = issue_date + 30 days", "Increments Invoice.version by 1"] }
      - { from: ISSUED, to: PARTIALLY_PAID, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents < amount_outstanding_cents", actor: VesselOperator, preconditions: ["Acting operator owns the invoice", "amount_cents > 0 (ERR_PAYMENT_NOT_POSITIVE)", "amount_cents <= amount_outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING)"], side_effects: ["amount_paid_cents += amount_cents", "Increments Invoice.version by 1"] }
      - { from: PARTIALLY_PAID, to: PARTIALLY_PAID, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents < amount_outstanding_cents", actor: VesselOperator, preconditions: ["as above"], side_effects: ["amount_paid_cents += amount_cents", "Increments Invoice.version by 1"] }
      - { from: ISSUED, to: PAID, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents == amount_outstanding_cents", actor: VesselOperator, preconditions: ["as above"], side_effects: ["amount_paid_cents += amount_cents; amount_outstanding_cents = 0", "If operator has no remaining OVERDUE invoices: payment_standing -> GOOD", "Increments Invoice.version by 1"] }
      - { from: PARTIALLY_PAID, to: PAID, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents == amount_outstanding_cents", actor: VesselOperator, preconditions: ["as above"], side_effects: ["as above"] }
      - { from: OVERDUE, to: OVERDUE, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents < amount_outstanding_cents", actor: VesselOperator, preconditions: ["as above"], side_effects: ["amount_paid_cents += amount_cents", "Increments Invoice.version by 1"] }
      - { from: OVERDUE, to: PAID, trigger: "POST /observer-program/invoices/{id}/payments with amount_cents == amount_outstanding_cents", actor: VesselOperator, preconditions: ["as above"], side_effects: ["amount_outstanding_cents = 0", "If operator has no remaining OVERDUE invoices: payment_standing -> GOOD (vessels remain SUSPENDED until manual reactivation)", "Increments Invoice.version by 1"] }
      - { from: ISSUED, to: DISPUTED, trigger: "POST /observer-program/invoices/{id}/dispute", actor: VesselOperator, preconditions: ["Acting operator owns the invoice"], side_effects: ["Increments Invoice.version by 1"] }
      - { from: DISPUTED, to: ISSUED, trigger: "POST /observer-program/invoices/{id}/resolve-dispute", actor: ProgramCoordinator, preconditions: [], side_effects: ["Increments Invoice.version by 1"] }
      - { from: ISSUED, to: OVERDUE, trigger: "system (ops run when due_date < current clock and amount_outstanding_cents > 0)", actor: system, preconditions: [], side_effects: ["Cascade hop 1 of the delinquency cascade: operator payment_standing -> DELINQUENT, then vessels -> SUSPENDED, then their open deployments -> CANCELLED (see VesselOperator machine)"] }
      - { from: PARTIALLY_PAID, to: OVERDUE, trigger: "system (ops run as above)", actor: system, preconditions: [], side_effects: ["Same delinquency cascade"] }
      - { from: ISSUED, to: ISSUED, trigger: "POST /observer-program/invoices/{id}/adjustments", actor: ProgramAdmin, preconditions: ["SoD: X-User-ID != issued_by_user_id (ERR_INVOICE_ADJUSTMENT_FORBIDDEN)", "OCC: expected_invoice_version == Invoice.version (ERR_STALE_VERSION)", "amount_outstanding_cents + adjustment_cents >= 0 (ERR_ADJUSTMENT_WOULD_UNDERFLOW)"], side_effects: ["amount_adjusted_cents += adjustment_cents; amount_outstanding_cents recomputed", "Increments Invoice.version by 1"] }
      - { from: OVERDUE, to: OVERDUE, trigger: "POST /observer-program/invoices/{id}/adjustments", actor: ProgramAdmin, preconditions: ["as above"], side_effects: ["as above"] }
      - { from: DISPUTED, to: DISPUTED, trigger: "POST /observer-program/invoices/{id}/adjustments", actor: ProgramAdmin, preconditions: ["as above"], side_effects: ["as above"] }
      - { from: ISSUED, to: WAIVED, trigger: "POST /observer-program/invoices/{id}/waive", actor: ProgramAdmin, preconditions: ["SoD: X-User-ID != issued_by_user_id (ERR_INVOICE_ADJUSTMENT_FORBIDDEN)"], side_effects: ["amount_adjusted_cents set so that amount_outstanding_cents == 0 (amount_adjusted_cents = amount_paid_cents - amount_due_cents)", "If operator has no remaining OVERDUE invoices: payment_standing -> GOOD", "Increments Invoice.version by 1"] }
      - { from: DISPUTED, to: WAIVED, trigger: "POST /observer-program/invoices/{id}/waive", actor: ProgramAdmin, preconditions: ["SoD as above"], side_effects: ["as above"] }
      - { from: OVERDUE, to: WAIVED, trigger: "POST /observer-program/invoices/{id}/waive", actor: ProgramAdmin, preconditions: ["SoD as above"], side_effects: ["as above; standing recompute applies"] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: deployment-create-stale-notice
    parent_entity: SelectionNotice
    write_endpoint: "POST /observer-program/deployments"
    occ_field: "expected_selection_notice_version"
    description: |
      Creating a Deployment against a SelectionNotice whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created or cancelled a deployment against the same
      notice (mutating reserved/remaining sea days and bumping the version), so
      the current writer's view of the notice's allocation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: selection-run-stale-plan
    parent_entity: CoveragePlan
    write_endpoint: "POST /observer-program/coverage-plans/{id}/selection-runs"
    occ_field: "expected_coverage_plan_version"
    description: |
      Launching a selection run against a CoveragePlan whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just published the plan or completed an earlier run,
      changing required_observer_sea_days or the eligibility base the client used.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-adjust-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /observer-program/invoices/{id}/adjustments"
    occ_field: "expected_invoice_version"
    description: |
      Posting an adjustment against an Invoice whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      payment or a prior adjustment has just changed amount_outstanding_cents,
      so the current writer's outstanding-balance basis is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coverage_requirement_calculation
    trigger: "CoveragePlan publish (PROVISIONAL variant) and CoveragePlan close (FINAL variant)"
    algorithm: threshold
    formula: |
      Evaluation order is pinned (steps must be applied in this sequence):
        1. em_cap_days     = floor(effort_days * EM_SHARE_CAP)
        2. em_credited     = min(em_days, em_cap_days)
        3. covered_base    = max(0, effort_days - em_credited)
        4. required_days   = ceil(covered_base * coverage_target_pct)   # exact integer stays unchanged
      PROVISIONAL: effort_days = projected_fleet_effort_days, em_days = projected_em_effort_days.
      FINAL:       effort_days = actual_fleet_effort_days,   em_days = actual_em_sea_days.
      coverage_attainment_pct = round_half_up(actual_observer_sea_days / final_required_observer_sea_days, 4)
      (0 when final_required_observer_sea_days == 0 and actual_observer_sea_days == 0).
    input_set: "The CoveragePlan row; Fishery.coverage_target_pct frozen into the plan at publish time is NOT frozen — the fishery's current coverage_target_pct at the moment of the calculation is used"
    constants:
      EM_SHARE_CAP: 0.40
    precision: "required days are integers via ceil; attainment is 4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "POST /observer-program/coverage-plans/{id}/publish"
        difference: "Uses projected_fleet_effort_days / projected_em_effort_days; result stored in required_observer_sea_days"
      - name: FINAL
        when: "POST /observer-program/coverage-plans/{id}/close"
        difference: "Uses actual_fleet_effort_days (close input) / actual_em_sea_days (system); result stored in final_required_observer_sea_days; for the same plan PROVISIONAL and FINAL diverge whenever actuals differ from projections"

  - name: selection_run_sizing
    trigger: "POST /observer-program/coverage-plans/{id}/selection-runs"
    algorithm: threshold
    formula: |
      vessels_to_select = ceil(required_observer_sea_days / NOTICE_ALLOCATION_DAYS)
      selected = the top min(vessels_to_select, |eligible_pool|) vessels by ranking rule
      each selected vessel receives one SelectionNotice with allocated_sea_days = NOTICE_ALLOCATION_DAYS
      selection_deficit_sea_days = max(0, required_observer_sea_days - NOTICE_ALLOCATION_DAYS * vessels_selected)
      An empty eligible pool is NOT an error: the run completes with vessels_selected = 0 and
      selection_deficit_sea_days = required_observer_sea_days.
    input_set: "CoveragePlan.required_observer_sea_days and the eligible vessel pool from vessel_selection_scoring"
    constants:
      NOTICE_ALLOCATION_DAYS: 30
    precision: "integers via ceil"

  - name: vessel_selection_scoring
    trigger: "POST /observer-program/coverage-plans/{id}/selection-runs"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (all must hold):
        Vessel.status == ACTIVE AND Vessel.monitoring_mode == HUMAN_OBSERVER
        AND Vessel.fishery_id == CoveragePlan.fishery_id
        AND VesselOperator.payment_standing == GOOD (operator of the vessel)
        AND vessel holds no SelectionNotice in ISSUED|ACCEPTED under this CoveragePlan
      Score per eligible vessel:
        recency_days = (CoveragePlan.period_start - Vessel.last_observed_end_date).days;
                       when last_observed_end_date IS NULL, recency_days = 365
        recency_component    = min(recency_days, 365) / 365 * W_RECENCY
        compliance_component = 30 if substantiated_harassment_count == 0
                               else max(0, 30 - COMPLIANCE_STEP * substantiated_harassment_count)
        penalty_component    = PENALTY_WEIGHT * selection_penalty_points
        raw = recency_component + compliance_component - penalty_component
        if Vessel.gear_type == Fishery.priority_gear: raw = raw * GEAR_PRIORITY_MULTIPLIER
        selection_score = round_half_up(raw, 4)
      Ranking: selection_score DESC; tie-break 1: last_observed_end_date ASC NULLS FIRST;
      tie-break 2: Vessel.created_at ASC. (Vessel.id MUST NOT be used for ranking.)
    input_set: "All Vessel rows passing the eligibility filter, with their VesselOperator rows"
    constants:
      W_RECENCY: 50
      COMPLIANCE_STEP: 10
      PENALTY_WEIGHT: 5
      GEAR_PRIORITY_MULTIPLIER: 1.25
      RECENCY_NULL_DAYS: 365
    precision: "4 decimal places, round_half_up"

  - name: sea_day_accounting
    trigger: "Deployment create, reschedule, return, and early termination"
    algorithm: chronological
    formula: |
      planned_sea_days = (scheduled_return_date - scheduled_departure_date).days + 1   # inclusive both ends
      actual_sea_days  = (actual_return_date - scheduled_departure_date).days + 1
      Early termination (harassment cascade):
        actual_sea_days = clamp((current_clock_date - scheduled_departure_date).days + 1, 1, planned_sea_days)
      Notice reconciliation:
        create:     remaining -= planned; reserved += planned
        reschedule: delta = new_planned - old_planned; remaining -= delta; reserved += delta
                    (remaining must stay >= 0 else ERR_SEA_DAY_ALLOCATION_EXCEEDED)
        cancel:     reserved -= planned; remaining += planned
        return:     reserved -= planned; consumed += actual; remaining += (planned - actual)
      Invariant (must hold after every mutation): allocated_sea_days == remaining_sea_days + reserved_sea_days + consumed_sea_days
    input_set: "The Deployment row and its SelectionNotice row"
    constants:
      MAX_DEPLOYMENT_SEA_DAYS: 45
    precision: "whole days; dates are calendar days (no partial days)"

  - name: observer_capacity_check
    trigger: "Deployment create and reschedule (before notice reconciliation)"
    algorithm: aggregation
    formula: |
      Consecutive cap: planned_sea_days > Observer.max_consecutive_sea_days
        -> ERR_OBSERVER_CONSECUTIVE_CAP_EXCEEDED   (equality is ALLOWED)
      Commitment cap: let S = sum(planned_sea_days) over the observer's deployments in
        SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA (excluding the deployment being rescheduled);
        if S + planned_sea_days > OBSERVER_MAX_COMMITTED_SEA_DAYS
        -> ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED   (equality is ALLOWED)
    input_set: "Observer row plus its non-terminal Deployment rows"
    constants:
      OBSERVER_MAX_COMMITTED_SEA_DAYS: 90
      TRAINEE_MAX_CONSECUTIVE: 20
      CERTIFIED_MAX_CONSECUTIVE: 30
      LEAD_MAX_CONSECUTIVE: 45
    precision: "whole days"

  - name: cost_recovery_fee_calculation
    trigger: "POST /observer-program/coverage-plans/{id}/invoices/generate"
    algorithm: tiered_pricing
    formula: |
      Input set: CLOSED Deployments whose notice's coverage_plan_id == this plan, grouped by vessel,
      ordered within each vessel by scheduled_departure_date ASC, tie-break created_at ASC.
      One Invoice per vessel with >= 1 such deployment; skipped if a non-terminal-status Invoice
      already exists for (coverage_plan_id, vessel).
      Tier allocation is CUMULATIVE per vessel across the ordered deployments:
        cumulative day index i (1-based across all billed days of the vessel in this plan):
        day i uses RATE_TIER1_CENTS when i <= TIER1_LIMIT_DAYS, else RATE_TIER2_CENTS.
      Per deployment line:
        line_subtotal_cents = (tier1_days * rate1 + tier2_days * rate2) * variant_factor
        line_total_cents    = round_half_up(line_subtotal_cents * (1 + SURCHARGE_PCT))
      ROUNDING ORDER IS PINNED: round each line to cents first, then sum the rounded lines.
      (Summing subtotals first and rounding once yields different cents and is NON-CONFORMANT.)
      amount_due_cents = sum(line_total_cents)
      Revenue cap: when Vessel.declared_annual_revenue_cents is present,
        fee_cap_cents = floor(declared_annual_revenue_cents * FEE_CAP_PCT);
        amount_due_cents = min(amount_due_cents, fee_cap_cents); fee_cap_applied = true when capped.
      sea_days_billed = sum(actual_sea_days of billed deployments).
      EM-covered trips are NOT billed (electronic monitoring carries no cost-recovery fee here).
    input_set: "CLOSED Deployment rows linked through SelectionNotice.coverage_plan_id; Vessel rows for length/variant/revenue"
    constants:
      RATE_TIER1_CENTS: 39900
      RATE_TIER2_CENTS: 49900
      TIER1_LIMIT_DAYS: 20
      SURCHARGE_PCT: 0.037
      SMALL_VESSEL_LENGTH_FT: 40
      SMALL_VESSEL_RATE_FACTOR: 0.5
      FEE_CAP_PCT: 0.005
      INVOICE_DUE_DAYS: 30
    precision: "integer cents; line rounding round_half_up; cap via floor"
    variants:
      - name: STANDARD
        when: "Vessel.length_ft >= SMALL_VESSEL_LENGTH_FT"
        difference: "variant_factor = 1"
      - name: SMALL_VESSEL
        when: "Vessel.length_ft < SMALL_VESSEL_LENGTH_FT"
        difference: "variant_factor = 0.5 applied to the line subtotal before the surcharge; produces a materially different total for identical day patterns"

  - name: em_review_progress_calculation
    trigger: "EMTrip record-review (progress + threshold) and accept (extrapolation)"
    algorithm: threshold
    formula: |
      reviewed_pct = round_half_up(reviewed_hours / video_hours, 4)
      Automatic transition IN_REVIEW -> REVIEWED fires exactly when reviewed_pct >= EM_REVIEW_MIN_PCT
      (0.2999 stays IN_REVIEW; 0.3000 promotes).
      At accept: estimated_total_catch_kg = round_half_up(sampled_catch_kg * video_hours / reviewed_hours, 2).
    input_set: "The EMTrip row's accumulated reviewed_hours / sampled_catch_kg"
    constants:
      EM_REVIEW_MIN_PCT: 0.30
    precision: "reviewed_pct 4 decimals round_half_up; catch estimate 2 decimals round_half_up"

  - name: sample_verification_gate
    trigger: "POST /observer-program/deployments/{id}/validate-data"
    algorithm: aggregation
    formula: |
      Let V = HaulSamples of the deployment with status VERIFIED, D = status DISCARDED.
      Gate 1: every HaulSample of the deployment is in VERIFIED|DISCARDED (else ERR_SAMPLES_NOT_RESOLVED).
      Gate 2: count(V) >= 1 (else ERR_SAMPLE_COVERAGE_INSUFFICIENT).
      Gate 3: verified_coverage = round_half_up(sum(V.sampled_weight_kg) / sum(V.total_haul_weight_kg), 4);
              verified_coverage >= MIN_VERIFIED_COVERAGE else ERR_SAMPLE_COVERAGE_INSUFFICIENT
              (0.2000 passes; 0.1999 fails).
    input_set: "All HaulSample rows of the Deployment"
    constants:
      MIN_SAMPLE_RATIO: 0.20
      MIN_VERIFIED_COVERAGE: 0.20
    precision: "4 decimals, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; for entity_backed roles X-User-ID must identify an existing entity of that type", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for endpoint; ownership (acting Observer == Deployment.observer_id; acting Debriefer == assigned_debriefer_id; acting EMReviewer == assigned_reviewer_id; acting VesselOperator owns the vessel/invoice); segregation of duties (assign-debriefer: Debriefer.person_ref != Deployment observer's person_ref -> ERR_DEBRIEFER_CONFLICT_OF_INTEREST; invoice adjustments/waive: X-User-ID != issued_by_user_id -> ERR_INVOICE_ADJUSTMENT_FORBIDDEN); entity_backed actors must be in non-suspended status", error_id: "ERR_FORBIDDEN / ERR_DEBRIEFER_CONFLICT_OF_INTEREST / ERR_INVOICE_ADJUSTMENT_FORBIDDEN", http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK references exist, validated left-to-right (path first, then body)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "Request schema: required fields present, types valid, enum values valid, value ranges valid (coverage_target_pct in [0.02,1.00] -> ERR_COVERAGE_TARGET_OUT_OF_RANGE; video_hours > 0; amount_cents integer)", error_id: "ERR_INVALID_REQUEST / ERR_COVERAGE_TARGET_OUT_OF_RANGE", http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /observer-program/deployments, POST /observer-program/coverage-plans/{id}/selection-runs, POST /observer-program/invoices/{id}/adjustments" }
  - { priority: 6, category: state, check: "Target entity in a valid from-state for the transition (includes ERR_NOTICE_NOT_ACCEPTED, ERR_PLAN_NOT_PUBLISHED, ERR_PLAN_HAS_OPEN_DEPLOYMENTS, ERR_INVOICE_NOT_ISSUED, ERR_SAFETY_CHECK_REQUIRED, ERR_DEBRIEFER_NOT_ASSIGNED, ERR_REVIEWER_NOT_ASSIGNED, ERR_EM_REVIEW_MIN_NOT_MET, ERR_SAMPLES_NOT_RESOLVED)", error_id: "ERR_INVALID_STATE and domain state errors", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Safety protocol: all five checklist booleans required and deficiency_notes required on FAIL (ERR_SAFETY_CHECKLIST_INCOMPLETE); re-inspection from SAFETY_HOLD must supersede the latest FAIL inspection (ERR_SAFETY_SUPERSESSION_REQUIRED)", error_id: "ERR_SAFETY_CHECKLIST_INCOMPLETE / ERR_SAFETY_SUPERSESSION_REQUIRED", http_status: 422, applies_to: "POST /observer-program/deployments/{id}/safety-inspections" }
  - { priority: 8, category: business_temporal, check: "Date and window rules: return > departure (ERR_DATE_RANGE_INVALID); planned_sea_days <= 45 (ERR_DEPLOYMENT_TOO_LONG); actual return within scheduled window (ERR_DATE_RANGE_INVALID); observer closed-interval overlap (ERR_OBSERVER_OVERLAP); vessel one-full-day turnaround (ERR_VESSEL_TURNAROUND_VIOLATION); EM trip overlap (ERR_EM_TRIP_OVERLAP); notice accept before response_deadline (ERR_NOTICE_EXPIRED); haul_date within deployment window (ERR_DATE_RANGE_INVALID)", error_id: "ERR_DATE_RANGE_INVALID / ERR_DEPLOYMENT_TOO_LONG / ERR_OBSERVER_OVERLAP / ERR_VESSEL_TURNAROUND_VIOLATION / ERR_EM_TRIP_OVERLAP / ERR_NOTICE_EXPIRED", http_status: 422, applies_to: "date-carrying endpoints" }
  - { priority: 9, category: business_referential, check: "Cross-entity state: Fishery ACTIVE for publish/runs (ERR_FISHERY_NOT_ACTIVE); Vessel ACTIVE (ERR_VESSEL_NOT_ACTIVE); vessel mode HUMAN_OBSERVER for deployments (ERR_VESSEL_NOT_HUMAN_MODE) / ELECTRONIC_MONITORING for EM trips (ERR_VESSEL_NOT_EM_MODE); Observer ACTIVE (ERR_OBSERVER_NOT_AVAILABLE); operator payment_standing GOOD for new deployments (ERR_OPERATOR_DELINQUENT); vessel's EM enrollment ACTIVE for EM trips (ERR_EM_ENROLLMENT_NOT_ACTIVE); unique open EM enrollment per vessel (ERR_EM_ENROLLMENT_OPEN_EXISTS); unique permit/license/code (ERR_UNIQUE_CONSTRAINT)", error_id: "referential error family", http_status: 409, applies_to: "creation and scheduling endpoints" }
  - { priority: 10, category: business_constraint, check: "Caps and uniqueness: observer consecutive and commitment caps (ERR_OBSERVER_CONSECUTIVE_CAP_EXCEEDED / ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED); sample ratio in [0.2,1.0] (ERR_SAMPLE_RATIO_OUT_OF_RANGE); haul_number unique per deployment (ERR_DUPLICATE_HAUL_NUMBER); verified coverage gate (ERR_SAMPLE_COVERAGE_INSUFFICIENT)", error_id: "constraint error family", http_status: 422, applies_to: "creation, scheduling, sampling, validation endpoints" }
  - { priority: 11, category: business_fiscal, check: "Money/allocation rules: sea-day allocation (ERR_SEA_DAY_ALLOCATION_EXCEEDED); payment positive (ERR_PAYMENT_NOT_POSITIVE); payment <= outstanding (ERR_PAYMENT_EXCEEDS_OUTSTANDING); adjustment must not drive outstanding negative (ERR_ADJUSTMENT_WOULD_UNDERFLOW)", error_id: "fiscal error family", http_status: 422, applies_to: "deployment scheduling, invoice payments/adjustments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Fishery ---
  - { method: POST, path: "/observer-program/fisheries", description: "Create a fishery", roles: [ProgramAdmin], code: 201, input: [code, name, region, coverage_target_pct, priority_gear], output: Fishery, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/observer-program/fisheries", description: "List fisheries", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["status?", "limit?", "offset?"], output: "Fishery[]", side_effects: [] }
  - { method: GET, path: "/observer-program/fisheries/{id}", description: "Get a fishery", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Fishery, side_effects: [] }
  - { method: PATCH, path: "/observer-program/fisheries/{id}", description: "Update fishery config or status (ACTIVE<->SUSPENDED)", roles: [ProgramAdmin], code: 200, input: ["status?", "coverage_target_pct?", "priority_gear?", "name?"], output: Fishery, side_effects: ["Increments Fishery.version by 1"] }

  # --- VesselOperator ---
  - { method: POST, path: "/observer-program/vessel-operators", description: "Register a vessel operator", roles: [ProgramAdmin], code: 201, input: [legal_name, license_number, contact_person_ref], output: VesselOperator, side_effects: ["payment_standing=GOOD, status=ACTIVE"] }
  - { method: GET, path: "/observer-program/vessel-operators", description: "List operators", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["payment_standing?", "status?", "limit?", "offset?"], output: "VesselOperator[]", side_effects: [] }
  - { method: GET, path: "/observer-program/vessel-operators/{id}", description: "Get an operator", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: VesselOperator, side_effects: [] }

  # --- Vessel ---
  - { method: POST, path: "/observer-program/vessels", description: "Register a vessel (operator_id must equal acting operator)", roles: [VesselOperator], code: 201, input: [operator_id, fishery_id, vessel_name, permit_number, home_port, length_ft, gear_type, "declared_annual_revenue_cents?", "prior_last_observed_end_date?", "prior_harassment_points?"], output: Vessel, side_effects: ["status=REGISTERED, monitoring_mode=HUMAN_OBSERVER, last_observed_end_date seeded from prior_last_observed_end_date, selection_penalty_points seeded from prior_harassment_points"] }
  - { method: GET, path: "/observer-program/vessels", description: "List vessels", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["operator_id?", "fishery_id?", "status?", "monitoring_mode?", "limit?", "offset?"], output: "Vessel[]", side_effects: [] }
  - { method: GET, path: "/observer-program/vessels/{id}", description: "Get a vessel", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Vessel, side_effects: [] }
  - { method: PATCH, path: "/observer-program/vessels/{id}", description: "Update vessel attributes or status (REGISTERED->ACTIVE, ACTIVE<->SUSPENDED)", roles: [ProgramAdmin], code: 200, input: ["status?", "length_ft?", "gear_type?", "home_port?", "declared_annual_revenue_cents?"], output: Vessel, side_effects: ["Increments Vessel.version by 1"] }

  # --- Observer / Debriefer / EMReviewer registries ---
  - { method: POST, path: "/observer-program/observers", description: "Create an observer", roles: [ProgramAdmin], code: 201, input: [person_ref, full_name, home_port, certification_level], output: Observer, side_effects: ["status=ACTIVE; max_consecutive_sea_days derived (TRAINEE=20, CERTIFIED=30, LEAD=45)"] }
  - { method: GET, path: "/observer-program/observers", description: "List observers", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["status?", "certification_level?", "limit?", "offset?"], output: "Observer[]", side_effects: [] }
  - { method: GET, path: "/observer-program/observers/{id}", description: "Get an observer", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Observer, side_effects: [] }
  - { method: PATCH, path: "/observer-program/observers/{id}", description: "Update observer attributes/status (ACTIVE<->SUSPENDED, ->DECERTIFIED)", roles: [ProgramAdmin], code: 200, input: ["status?", "home_port?", "certification_level?"], output: Observer, side_effects: ["Increments Observer.version by 1; certification_level change recomputes max_consecutive_sea_days"] }
  - { method: POST, path: "/observer-program/debriefers", description: "Create a debriefer", roles: [ProgramAdmin], code: 201, input: [person_ref, full_name], output: Debriefer, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/observer-program/debriefers", description: "List debriefers", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["status?", "limit?", "offset?"], output: "Debriefer[]", side_effects: [] }
  - { method: GET, path: "/observer-program/debriefers/{id}", description: "Get a debriefer", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Debriefer, side_effects: [] }
  - { method: PATCH, path: "/observer-program/debriefers/{id}", description: "Update debriefer status (ACTIVE<->SUSPENDED)", roles: [ProgramAdmin], code: 200, input: ["status?"], output: Debriefer, side_effects: ["Increments Debriefer.version by 1"] }
  - { method: POST, path: "/observer-program/em-reviewers", description: "Create an EM reviewer", roles: [ProgramAdmin], code: 201, input: [person_ref, full_name], output: EMReviewer, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/observer-program/em-reviewers", description: "List EM reviewers", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["status?", "limit?", "offset?"], output: "EMReviewer[]", side_effects: [] }
  - { method: GET, path: "/observer-program/em-reviewers/{id}", description: "Get an EM reviewer", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: EMReviewer, side_effects: [] }
  - { method: PATCH, path: "/observer-program/em-reviewers/{id}", description: "Update EM reviewer status (ACTIVE<->SUSPENDED)", roles: [ProgramAdmin], code: 200, input: ["status?"], output: EMReviewer, side_effects: ["Increments EMReviewer.version by 1"] }

  # --- CoveragePlan ---
  - { method: POST, path: "/observer-program/coverage-plans", description: "Create a coverage plan (DRAFT)", roles: [ProgramCoordinator], code: 201, input: [fishery_id, period_start, period_end, projected_fleet_effort_days, projected_em_effort_days], output: CoveragePlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/observer-program/coverage-plans", description: "List coverage plans", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["fishery_id?", "status?", "limit?", "offset?"], output: "CoveragePlan[]", side_effects: [] }
  - { method: GET, path: "/observer-program/coverage-plans/{id}", description: "Get a coverage plan", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: CoveragePlan, side_effects: [] }
  - { method: POST, path: "/observer-program/coverage-plans/{id}/publish", description: "Publish plan; computes PROVISIONAL required_observer_sea_days", roles: [ProgramCoordinator], code: 200, input: [], output: CoveragePlan, side_effects: ["coverage_requirement_calculation PROVISIONAL", "status -> PUBLISHED", "Increments CoveragePlan.version by 1"] }
  - { method: POST, path: "/observer-program/coverage-plans/{id}/close", description: "Close plan; computes FINAL requirement + attainment; cascades notices", roles: [ProgramCoordinator], code: 200, input: [actual_fleet_effort_days], output: CoveragePlan, side_effects: ["coverage_requirement_calculation FINAL", "notice cascade (ISSUED->EXPIRED; ACCEPTED->DEFAULTED with +2 penalty or ->FULFILLED)", "status -> CLOSED", "Increments CoveragePlan.version by 1"] }

  # --- SelectionRun / SelectionNotice ---
  - { method: POST, path: "/observer-program/coverage-plans/{id}/selection-runs", description: "Run vessel selection; creates SelectionNotice rows", roles: [ProgramCoordinator], code: 201, input: [notice_response_deadline, expected_coverage_plan_version], output: SelectionRun, side_effects: ["vessel_selection_scoring + selection_run_sizing", "creates notices (ISSUED, allocated/remaining 30)", "plan -> SELECTION_COMPLETED", "increments CoveragePlan.version by 1"] }
  - { method: GET, path: "/observer-program/coverage-plans/{id}/selection-runs", description: "List runs of a plan", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["limit?", "offset?"], output: "SelectionRun[]", side_effects: [] }
  - { method: GET, path: "/observer-program/selection-runs/{id}", description: "Get a selection run", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: SelectionRun, side_effects: [] }
  - { method: GET, path: "/observer-program/selection-notices", description: "List selection notices", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["selection_run_id?", "coverage_plan_id?", "vessel_id?", "status?", "limit?", "offset?"], output: "SelectionNotice[]", side_effects: [] }
  - { method: GET, path: "/observer-program/selection-notices/{id}", description: "Get a selection notice", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: SelectionNotice, side_effects: [] }
  - { method: POST, path: "/observer-program/selection-notices/{id}/accept", description: "Operator accepts the selection notice", roles: [VesselOperator], code: 200, input: [], output: SelectionNotice, side_effects: ["status -> ACCEPTED", "Increments SelectionNotice.version by 1"] }
  - { method: POST, path: "/observer-program/selection-notices/{id}/decline", description: "Operator declines the selection notice", roles: [VesselOperator], code: 200, input: [], output: SelectionNotice, side_effects: ["status -> DECLINED", "Increments SelectionNotice.version by 1"] }

  # --- Deployment ---
  - { method: POST, path: "/observer-program/deployments", description: "Create and schedule a deployment against an ACCEPTED notice", roles: [ProgramCoordinator], code: 201, input: [selection_notice_id, observer_id, scheduled_departure_date, scheduled_return_date, expected_selection_notice_version], output: Deployment, side_effects: ["sea_day_accounting create reconciliation (notice.remaining -= planned, notice.reserved += planned)", "increments SelectionNotice.version by 1", "status=SCHEDULED"] }
  - { method: GET, path: "/observer-program/deployments", description: "List deployments", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["selection_notice_id?", "coverage_plan_id?", "vessel_id?", "observer_id?", "assigned_debriefer_id?", "status?", "limit?", "offset?"], output: "Deployment[]", side_effects: [] }
  - { method: GET, path: "/observer-program/deployments/{id}", description: "Get a deployment", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Deployment, side_effects: [] }
  - { method: POST, path: "/observer-program/deployments/{id}/reschedule", description: "Change scheduled dates (SCHEDULED stays, SAFETY_HOLD returns to SCHEDULED)", roles: [ProgramCoordinator], code: 200, input: [scheduled_departure_date, scheduled_return_date], output: Deployment, side_effects: ["sea_day_accounting reschedule reconciliation by planned-days delta", "latest_safety_result reset to null", "increments SelectionNotice.version by 1", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/cancel", description: "Cancel a pre-boarding deployment", roles: [ProgramCoordinator], code: 200, input: [], output: Deployment, side_effects: ["sea_day_accounting cancel reconciliation (reserved -= planned, remaining += planned)", "increments SelectionNotice.version by 1", "status -> CANCELLED", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/board", description: "Observer boards the vessel", roles: [Observer], code: 200, input: [], output: Deployment, side_effects: ["status -> AT_SEA", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/return", description: "Observer records return", roles: [Observer], code: 200, input: [actual_return_date], output: Deployment, side_effects: ["sea_day_accounting return reconciliation", "status -> RETURNED", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/submit-data", description: "Observer submits trip data (also resubmission from DATA_REJECTED)", roles: [Observer], code: 200, input: [], output: Deployment, side_effects: ["status -> DEBRIEFING", "submitted_at set", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/assign-debriefer", description: "Assign debriefer; segregation of duties enforced", roles: [ProgramCoordinator], code: 200, input: [debriefer_id], output: Deployment, side_effects: ["assigned_debriefer_id set", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/validate-data", description: "Debriefer validates trip data", roles: [Debriefer], code: 200, input: [], output: Deployment, side_effects: ["status -> DATA_VALIDATED", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/reject-data", description: "Debriefer rejects trip data for rework", roles: [Debriefer], code: 200, input: [rejection_reason], output: Deployment, side_effects: ["status -> DATA_REJECTED", "Increments Deployment.version by 1"] }
  - { method: POST, path: "/observer-program/deployments/{id}/close", description: "Close a validated deployment; credits observer/vessel/plan sea days", roles: [ProgramCoordinator], code: 200, input: [], output: Deployment, side_effects: ["Observer.sea_days_used_ytd += actual", "Vessel.sea_days_observed_ytd += actual", "Vessel.last_observed_end_date = actual_return_date", "CoveragePlan.actual_observer_sea_days += actual", "notice auto-FULFILLED when remaining == 0 and no open deployments", "status -> CLOSED", "Increments Deployment.version by 1"] }

  # --- SafetyInspection ---
  - { method: POST, path: "/observer-program/deployments/{id}/safety-inspections", description: "Record a pre-boarding safety inspection", roles: [Observer], code: 201, input: [life_raft_certified, epirb_registered, immersion_suits_adequate, fire_suppression_ok, comms_equipment_ok, "deficiency_notes?", "supersedes_inspection_id?"], output: SafetyInspection, side_effects: ["result computed (PASS iff all five booleans true)", "Deployment -> READY_TO_DEPLOY on PASS, -> SAFETY_HOLD on FAIL", "Increments Deployment.version by 1"] }
  - { method: GET, path: "/observer-program/safety-inspections", description: "List safety inspections", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["deployment_id?", "observer_id?", "vessel_id?", "supersedes_inspection_id?", "result?", "limit?", "offset?"], output: "SafetyInspection[]", side_effects: [] }
  - { method: GET, path: "/observer-program/safety-inspections/{id}", description: "Get a safety inspection", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: SafetyInspection, side_effects: [] }

  # --- HaulSample ---
  - { method: POST, path: "/observer-program/deployments/{id}/haul-samples", description: "Record a haul sample (deployment must be AT_SEA)", roles: [Observer], code: 201, input: [haul_date, haul_number, species_code, sampled_weight_kg, total_haul_weight_kg], output: HaulSample, side_effects: ["sampling_ratio computed", "status=RECORDED"] }
  - { method: GET, path: "/observer-program/haul-samples", description: "List haul samples", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["deployment_id?", "verified_by_debriefer_id?", "status?", "limit?", "offset?"], output: "HaulSample[]", side_effects: [] }
  - { method: GET, path: "/observer-program/haul-samples/{id}", description: "Get a haul sample", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: HaulSample, side_effects: [] }
  - { method: POST, path: "/observer-program/haul-samples/{id}/verify", description: "Debriefer verifies a sample", roles: [Debriefer], code: 200, input: [], output: HaulSample, side_effects: ["status -> VERIFIED", "verified_by_debriefer_id set"] }
  - { method: POST, path: "/observer-program/haul-samples/{id}/flag", description: "Debriefer flags a sample", roles: [Debriefer], code: 200, input: [reason], output: HaulSample, side_effects: ["status -> FLAGGED", "flagged_reason set", "verified_by_debriefer_id set"] }
  - { method: POST, path: "/observer-program/haul-samples/{id}/discard", description: "Debriefer discards a flagged sample", roles: [Debriefer], code: 200, input: [reason], output: HaulSample, side_effects: ["status -> DISCARDED", "verified_by_debriefer_id set"] }

  # --- HarassmentReport ---
  - { method: POST, path: "/observer-program/deployments/{id}/harassment-reports", description: "Observer files a harassment/interference report", roles: [Observer], code: 201, input: [report_type, narrative, incident_date], output: HarassmentReport, side_effects: ["status=FILED"] }
  - { method: GET, path: "/observer-program/harassment-reports", description: "List harassment reports", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["deployment_id?", "observer_id?", "vessel_id?", "status?", "limit?", "offset?"], output: "HarassmentReport[]", side_effects: [] }
  - { method: GET, path: "/observer-program/harassment-reports/{id}", description: "Get a harassment report", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: HarassmentReport, side_effects: [] }
  - { method: POST, path: "/observer-program/harassment-reports/{id}/start-review", description: "Open review (from FILED or APPEALED)", roles: [ProgramCoordinator], code: 200, input: [], output: HarassmentReport, side_effects: ["status -> UNDER_REVIEW", "Increments HarassmentReport.version by 1"] }
  - { method: POST, path: "/observer-program/harassment-reports/{id}/substantiate", description: "Substantiate a report; terminates at-sea deployment and penalizes vessel (first time only)", roles: [ProgramAdmin], code: 200, input: [resolution_notes], output: HarassmentReport, side_effects: ["status -> SUBSTANTIATED", "harassment cascade (deployment early termination; vessel penalty when penalty_applied was false)", "Increments HarassmentReport.version by 1"] }
  - { method: POST, path: "/observer-program/harassment-reports/{id}/dismiss", description: "Dismiss a report; compensates vessel penalties when dismissing after appeal", roles: [ProgramAdmin], code: 200, input: [resolution_notes], output: HarassmentReport, side_effects: ["status -> DISMISSED", "penalty compensation when penalty_applied was true", "Increments HarassmentReport.version by 1"] }
  - { method: POST, path: "/observer-program/harassment-reports/{id}/appeal", description: "Operator appeals a substantiated report", roles: [VesselOperator], code: 200, input: [], output: HarassmentReport, side_effects: ["status -> APPEALED", "Increments HarassmentReport.version by 1"] }
  - { method: POST, path: "/observer-program/harassment-reports/{id}/resolve", description: "Resolve a substantiated report after remediation", roles: [ProgramAdmin], code: 200, input: [resolution_notes], output: HarassmentReport, side_effects: ["status -> RESOLVED"] }

  # --- EMEnrollment ---
  - { method: POST, path: "/observer-program/em-enrollments", description: "Apply for EM enrollment (one open enrollment per vessel)", roles: [VesselOperator], code: 201, input: [vessel_id, equipment_vendor, equipment_install_date], output: EMEnrollment, side_effects: ["status=PENDING_REVIEW"] }
  - { method: GET, path: "/observer-program/em-enrollments", description: "List EM enrollments", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["vessel_id?", "status?", "limit?", "offset?"], output: "EMEnrollment[]", side_effects: [] }
  - { method: GET, path: "/observer-program/em-enrollments/{id}", description: "Get an EM enrollment", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: EMEnrollment, side_effects: [] }
  - { method: POST, path: "/observer-program/em-enrollments/{id}/approve", description: "Approve an enrollment", roles: [ProgramAdmin], code: 200, input: [], output: EMEnrollment, side_effects: ["status -> APPROVED", "reviewed_by_user_id set"] }
  - { method: POST, path: "/observer-program/em-enrollments/{id}/reject", description: "Reject an enrollment", roles: [ProgramAdmin], code: 200, input: [rejection_reason], output: EMEnrollment, side_effects: ["status -> REJECTED", "reviewed_by_user_id set"] }
  - { method: POST, path: "/observer-program/em-enrollments/{id}/activate", description: "Activate an approved (or reactivate a suspended) enrollment; flips vessel to EM mode and voids its open notices", roles: [ProgramCoordinator], code: 200, input: [], output: EMEnrollment, side_effects: ["status -> ACTIVE", "on APPROVED->ACTIVE: vessel mode cascade (notices VOIDED, deployments CANCELLED with day release)"] }
  - { method: POST, path: "/observer-program/em-enrollments/{id}/suspend", description: "Suspend an active enrollment", roles: [ProgramAdmin], code: 200, input: [], output: EMEnrollment, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/observer-program/em-enrollments/{id}/terminate", description: "Terminate an enrollment; flips vessel back to HUMAN_OBSERVER", roles: [ProgramAdmin], code: 200, input: [], output: EMEnrollment, side_effects: ["status -> TERMINATED", "Vessel.monitoring_mode -> HUMAN_OBSERVER"] }

  # --- EMTrip ---
  - { method: POST, path: "/observer-program/em-trips", description: "Declare an EM trip", roles: [VesselOperator], code: 201, input: [vessel_id, departure_date, return_date], output: EMTrip, side_effects: ["trip_sea_days computed", "status=DECLARED"] }
  - { method: GET, path: "/observer-program/em-trips", description: "List EM trips", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["vessel_id?", "em_enrollment_id?", "assigned_reviewer_id?", "status?", "limit?", "offset?"], output: "EMTrip[]", side_effects: [] }
  - { method: GET, path: "/observer-program/em-trips/{id}", description: "Get an EM trip", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: EMTrip, side_effects: [] }
  - { method: POST, path: "/observer-program/em-trips/{id}/submit-footage", description: "Submit video footage declaration", roles: [VesselOperator], code: 200, input: [video_hours], output: EMTrip, side_effects: ["status -> FOOTAGE_SUBMITTED", "video_hours set", "reviewed_pct recomputed"] }
  - { method: POST, path: "/observer-program/em-trips/{id}/assign-reviewer", description: "Assign an EM reviewer", roles: [ProgramCoordinator], code: 200, input: [reviewer_id], output: EMTrip, side_effects: ["status -> IN_REVIEW", "assigned_reviewer_id set"] }
  - { method: POST, path: "/observer-program/em-trips/{id}/record-review", description: "Reviewer records reviewed hours and sampled catch; auto-promotes to REVIEWED at >= 0.3000", roles: [EMReviewer], code: 200, input: [additional_reviewed_hours, sampled_catch_kg_delta], output: EMTrip, side_effects: ["reviewed_hours += additional_reviewed_hours", "sampled_catch_kg += sampled_catch_kg_delta", "reviewed_pct recomputed", "status -> REVIEWED when reviewed_pct >= 0.3000"] }
  - { method: POST, path: "/observer-program/em-trips/{id}/accept", description: "Accept reviewed trip; extrapolates catch and credits plan EM sea days", roles: [ProgramCoordinator], code: 200, input: [], output: EMTrip, side_effects: ["status -> ACCEPTED", "estimated_total_catch_kg computed", "CoveragePlan.actual_em_sea_days += trip_sea_days"] }
  - { method: POST, path: "/observer-program/em-trips/{id}/reject", description: "Reject reviewed trip (no coverage credit)", roles: [ProgramCoordinator], code: 200, input: [rejection_reason], output: EMTrip, side_effects: ["status -> REJECTED"] }

  # --- Invoice ---
  - { method: POST, path: "/observer-program/coverage-plans/{id}/invoices/generate", description: "Generate DRAFT cost-recovery invoices (one per vessel with CLOSED deployments under the plan)", roles: [ProgramCoordinator], code: 201, input: [], output: "{ created_invoice_ids: array, skipped_vessel_ids: array }", side_effects: ["cost_recovery_fee_calculation per vessel", "plan must be SELECTION_COMPLETED or CLOSED (ERR_PLAN_NOT_PUBLISHED)"] }
  - { method: GET, path: "/observer-program/invoices", description: "List invoices", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: ["coverage_plan_id?", "vessel_id?", "operator_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/observer-program/invoices/{id}", description: "Get an invoice", roles: [ProgramAdmin, ProgramCoordinator, Observer, Debriefer, VesselOperator, EMReviewer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/observer-program/invoices/{id}/issue", description: "Issue a DRAFT invoice", roles: [ProgramCoordinator], code: 200, input: [], output: Invoice, side_effects: ["status -> ISSUED", "issued_by_user_id = X-User-ID", "issue_date/due_date set from clock (+30 days)", "Increments Invoice.version by 1"] }
  - { method: POST, path: "/observer-program/invoices/{id}/payments", description: "Apply a payment", roles: [VesselOperator], code: 201, input: [amount_cents], output: Invoice, side_effects: ["amount_paid_cents += amount_cents", "status transitions per outstanding", "standing recompute on full payment", "Increments Invoice.version by 1"] }
  - { method: POST, path: "/observer-program/invoices/{id}/adjustments", description: "Post a signed adjustment (segregation of duties vs issuer)", roles: [ProgramAdmin], code: 201, input: [adjustment_cents, reason, expected_invoice_version], output: Invoice, side_effects: ["amount_adjusted_cents += adjustment_cents", "outstanding recomputed", "Increments Invoice.version by 1"] }
  - { method: POST, path: "/observer-program/invoices/{id}/dispute", description: "Operator disputes an issued invoice", roles: [VesselOperator], code: 200, input: [reason], output: Invoice, side_effects: ["status -> DISPUTED", "Increments Invoice.version by 1"] }
  - { method: POST, path: "/observer-program/invoices/{id}/resolve-dispute", description: "Resolve a dispute back to ISSUED", roles: [ProgramCoordinator], code: 200, input: [], output: Invoice, side_effects: ["status -> ISSUED", "Increments Invoice.version by 1"] }
  - { method: POST, path: "/observer-program/invoices/{id}/waive", description: "Waive the outstanding balance (segregation of duties vs issuer)", roles: [ProgramAdmin], code: 200, input: [reason], output: Invoice, side_effects: ["status -> WAIVED", "amount_adjusted_cents set so outstanding becomes 0", "standing recompute", "Increments Invoice.version by 1"] }

  # --- Ops checkpoint & logical clock ---
  - { method: POST, path: "/observer-program/ops/run", description: "Operations checkpoint: expires ISSUED notices past response_deadline; marks ISSUED/PARTIALLY_PAID invoices past due_date OVERDUE and runs the delinquency cascade (operator DELINQUENT -> vessels SUSPENDED -> open deployments CANCELLED with day release)", roles: [ProgramAdmin, ProgramCoordinator], code: 200, input: [], output: "{ expired_notice_count: integer, overdue_invoice_count: integer, delinquent_operator_count: integer, suspended_vessel_count: integer, cancelled_deployment_count: integer }", side_effects: ["notice expiry sweep", "invoice overdue sweep + delinquency cascade"] }
  - { method: POST, path: "/observer-program/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock updated"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or entity_backed role id does not resolve" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or ownership check failed (observer/debriefer/reviewer/operator acting on another's resource), or entity_backed actor suspended" }
  - { id: ERR_DEBRIEFER_CONFLICT_OF_INTEREST, http: 403, condition: "assign-debriefer: Debriefer.person_ref equals the deployment Observer's person_ref (segregation of duties)" }
  - { id: ERR_INVOICE_ADJUSTMENT_FORBIDDEN, http: 403, condition: "Invoice adjustments/waive attempted by the same user who issued the invoice (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed type, invalid enum value, non-integer cents, or submit-data with zero haul samples" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a valid from-state for the requested transition; terminal-state mutation attempt" }
  - { id: ERR_NOTICE_NOT_ACCEPTED, http: 409, condition: "Deployment creation against a notice not in ACCEPTED status" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "Selection run or invoice generation against a plan in the wrong status" }
  - { id: ERR_PLAN_HAS_OPEN_DEPLOYMENTS, http: 409, condition: "Plan close while any deployment is non-terminal" }
  - { id: ERR_SAFETY_CHECK_REQUIRED, http: 409, condition: "Boarding attempted from SCHEDULED or SAFETY_HOLD (no current PASS inspection)" }
  - { id: ERR_SAFETY_CHECKLIST_INCOMPLETE, http: 422, condition: "Missing checklist booleans, or deficiency_notes absent on a FAIL result" }
  - { id: ERR_SAFETY_SUPERSESSION_REQUIRED, http: 422, condition: "Re-inspection from SAFETY_HOLD without supersedes_inspection_id referencing the latest FAIL inspection" }
  - { id: ERR_DATE_RANGE_INVALID, http: 422, condition: "return not after departure; actual return outside scheduled window; haul_date outside deployment window; plan period_end <= period_start" }
  - { id: ERR_DEPLOYMENT_TOO_LONG, http: 422, condition: "planned_sea_days > 45" }
  - { id: ERR_OBSERVER_OVERLAP, http: 409, condition: "Observer has another deployment in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA whose closed [departure, return] interval intersects (touching dates count as overlap)" }
  - { id: ERR_VESSEL_TURNAROUND_VIOLATION, http: 409, condition: "Vessel has another deployment in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA without at least one full in-port calendar day between return and next departure: gap = (new_departure - existing_return).days - 1 must be >= 1" }
  - { id: ERR_EM_TRIP_OVERLAP, http: 409, condition: "Vessel has another EMTrip (DECLARED|FOOTAGE_SUBMITTED|IN_REVIEW|REVIEWED) or a Deployment (SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|AT_SEA) whose closed date interval intersects" }
  - { id: ERR_NOTICE_EXPIRED, http: 409, condition: "Accept after response_deadline" }
  - { id: ERR_FISHERY_NOT_ACTIVE, http: 409, condition: "Plan publish/selection run while fishery is SUSPENDED" }
  - { id: ERR_VESSEL_NOT_ACTIVE, http: 409, condition: "Deployment creation while vessel status != ACTIVE" }
  - { id: ERR_OBSERVER_NOT_AVAILABLE, http: 409, condition: "Deployment creation with observer status != ACTIVE" }
  - { id: ERR_VESSEL_NOT_HUMAN_MODE, http: 409, condition: "Deployment creation for a vessel in ELECTRONIC_MONITORING mode" }
  - { id: ERR_VESSEL_NOT_EM_MODE, http: 409, condition: "EM trip declaration for a vessel in HUMAN_OBSERVER mode" }
  - { id: ERR_EM_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "EM trip declaration while the vessel's enrollment is not ACTIVE (PENDING_REVIEW, APPROVED, or SUSPENDED)" }
  - { id: ERR_OPERATOR_DELINQUENT, http: 409, condition: "Deployment creation for a vessel whose operator payment_standing == DELINQUENT" }
  - { id: ERR_DEBRIEFER_NOT_ASSIGNED, http: 409, condition: "validate-data/reject-data before assign-debriefer" }
  - { id: ERR_REVIEWER_NOT_ASSIGNED, http: 409, condition: "record-review before assign-reviewer" }
  - { id: ERR_OBSERVER_CONSECUTIVE_CAP_EXCEEDED, http: 422, condition: "planned_sea_days > observer.max_consecutive_sea_days (equality allowed)" }
  - { id: ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED, http: 422, condition: "Sum of planned days across the observer's non-terminal deployments would exceed 90 (equality allowed)" }
  - { id: ERR_SAMPLE_RATIO_OUT_OF_RANGE, http: 422, condition: "sampling_ratio outside [0.2000, 1.0000]" }
  - { id: ERR_DUPLICATE_HAUL_NUMBER, http: 409, condition: "haul_number already used within the deployment" }
  - { id: ERR_EM_ENROLLMENT_OPEN_EXISTS, http: 409, condition: "Vessel already has an EMEnrollment in PENDING_REVIEW|APPROVED|ACTIVE|SUSPENDED" }
  - { id: ERR_COVERAGE_TARGET_OUT_OF_RANGE, http: 422, condition: "coverage_target_pct outside [0.02, 1.00]" }
  - { id: ERR_SAMPLES_NOT_RESOLVED, http: 409, condition: "validate-data while any HaulSample is RECORDED or FLAGGED" }
  - { id: ERR_SAMPLE_COVERAGE_INSUFFICIENT, http: 422, condition: "Zero VERIFIED samples or verified coverage ratio < 0.2000" }
  - { id: ERR_EM_REVIEW_MIN_NOT_MET, http: 409, condition: "accept while EMTrip is not in REVIEWED (reviewed_pct < 0.3000)" }
  - { id: ERR_NO_COVERAGE_PLAN_FOR_TRIP, http: 409, condition: "EM trip accept without a unique SELECTION_COMPLETED plan of the vessel's fishery containing the trip dates" }
  - { id: ERR_UNIQUE_CONSTRAINT, http: 409, condition: "Duplicate Fishery.code, VesselOperator.license_number, Vessel.permit_number, or person_ref within a registry" }
  - { id: ERR_SEA_DAY_ALLOCATION_EXCEEDED, http: 422, condition: "Deployment planned days exceed notice remaining_sea_days (create or reschedule delta)" }
  - { id: ERR_PAYMENT_NOT_POSITIVE, http: 422, condition: "Payment amount_cents <= 0" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "Payment amount_cents > amount_outstanding_cents" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Payment against an invoice not in ISSUED|PARTIALLY_PAID|OVERDUE" }
  - { id: ERR_ADJUSTMENT_WOULD_UNDERFLOW, http: 422, condition: "Adjustment would drive amount_outstanding_cents below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "NOAA program administrator: registries, fishery config, EM adjudication, harassment adjudication, invoice adjustments/waivers, ops checkpoint, clock"
    identity: opaque
