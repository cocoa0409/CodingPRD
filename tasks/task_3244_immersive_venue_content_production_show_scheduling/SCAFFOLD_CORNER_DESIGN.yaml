  # ================================================================= Endpoints
  - section: endpoints
    instances:
      - name: show_confirm_occ_stale_version_rejected
        claim_type: conditional_action
        grounds: ["concurrency_rules[show-confirm-stale-production]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirming a show with a stale expected_production_version (version - 1) returns ERR_STALE_VERSION 412; correct version succeeds."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S REHEARSAL; client holds Production.version V."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "OP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { op_id: $.data.id }
            - call: "POST /venue/productions/${op_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${op_id}", title: "OA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { oa: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${oa}"] }
              as: ContentProducer
              captures: { ob: $.data.id }
            - call: "POST /venue/render-batches/${ob}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ob}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${oa}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${op_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { os_id: $.data.id }
            - call: "POST /venue/shows/${os_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/productions/${op_id}"
              payload: {}
              as: ProductionDirector
              captures: { op_v: $.data.version }
          trigger:
            - call: "POST /venue/shows/${os_id}/confirm"
