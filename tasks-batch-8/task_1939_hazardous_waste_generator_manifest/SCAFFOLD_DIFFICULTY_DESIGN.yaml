          trigger:
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "wc-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MANIFEST_NOT_DRAFT (p7 state beats p8 SoD even though the signer IS the creator)"
            - "HTTP status == 409, not 403"
            - "Manifest.${man_id}.status == GENERATOR_SIGNED (unchanged)"

      - name: manifest_create_referential_beats_temporal
        grounds:
          - validations[priority=16]
          - validations[priority=25]
          - errors[ERR_CROSS_SITE_REFERENCE]
          - errors[ERR_PARTNER_AUDIT_STALE]
        distinguishing_aspect: |
          Category pair business_referential x business_temporal: the create
          fails BOTH the same-site container check (p16) and the transporter
          audit-currency check (p25, coverage ended 2026-06-01 with the clock at
          2026-08-01); the p16 ERR_CROSS_SITE_REFERENCE must win. Disjoint pair
          from state x business_safety.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z"
            - "Site B holds the ACTIVE stream and a STAGED container (site B's own chain is internally consistent)"
            - "Site A is the manifest's site"
            - "Transporter APPROVED but audit coverage [2026-01-01, 2026-06-01) is stale at the default clock"
            - "TSDF APPROVED, audit current to 2027-01-01, permits D001"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_a: "$.data.id" } }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site B", epa_id_number: "EPA-SITE-B" }, as: EHSManager, captures: { site_b: "$.data.id" } }
