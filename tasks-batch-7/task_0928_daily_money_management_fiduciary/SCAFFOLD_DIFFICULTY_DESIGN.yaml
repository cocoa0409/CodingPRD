  # =======================================================================
  # Rule 9 — compensating-action invariants over different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:

      - name: schedule_then_cancel_conserves_account_available_balance
        grounds:
          - calculations.account_available_balance
          - state_machines.Payment.settlement_status.SCHEDULED_to_CANCELLED
          - entities.ClientAccount.fields.available_balance_cents
        distinguishing_aspect: |
          Conserved quantity 1 - ClientAccount.available_balance_cents, an
          account-scoped money identity. Scheduling commits 80500 cents and
          cancelling releases exactly 80500, returning the identity
          cleared - holds - committed to its pre-scheduling value with zero
          drift and zero ledger entries written.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond with ample coverage"
            - "one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents and one 120000-cent withdrawal hold"
            - "one RECURRING_BILLER payee and a UTILITIES budget line for 2026-06 allocated 300000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9025" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-30", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/accounts/${acct_id}/adjustments"
              payload: { adjustment_type: "WITHDRAWAL_HOLD", amount_cents: 120000, value_date: "2026-06-01", memo: "Pending debit-card authorisation." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/payees"
