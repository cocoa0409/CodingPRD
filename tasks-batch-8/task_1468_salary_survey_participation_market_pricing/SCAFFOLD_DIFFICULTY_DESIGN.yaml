  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: submission_cyclic_rework_loop
        grounds:
          - state_machines.SurveySubmission
          - state_machines.SurveySubmission.RETURNED_to_DRAFT
        distinguishing_aspect: |
          SurveySubmission has a cycle: DRAFT→READY→SUBMITTED→RETURNED→DRAFT.
          The rework transition rewinds the entity to DRAFT and clears all
          vendor-feedback fields (rejection_reason, prepared_at, submitted_at).
        test_recipe:
          setup:
            - "Org, job, employees, strategy, vendor, OPEN survey"
            - "Submission has been returned once (RETURNED)"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/return", payload: { reason: "incomplete_geo" }, as: VendorAdmin }
          trigger:
            - { call: "POST /submissions/${sub_id}/rework", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { status_after: $.data.status, rej: $.data.rejection_reason, prep: $.data.prepared_at, sub_at: $.data.submitted_at } }
          assert:
            - "SurveySubmission.${sub_id}.status == DRAFT"
            - "SurveySubmission.${sub_id}.rejection_reason IS null"
            - "SurveySubmission.${sub_id}.prepared_at IS null"
            - "SurveySubmission.${sub_id}.submitted_at IS null"

      - name: cycle_open_locked_open_branching
        grounds:
          - state_machines.MarketAdjustmentCycle
          - state_machines.MarketAdjustmentCycle.LOCKED_to_OPEN
        distinguishing_aspect: |
          MarketAdjustmentCycle has a bi-directional cycle: OPEN→LOCKED→OPEN.
          Unlike linear pipelines, the cycle supports unlock (revert) — a
          branching structure where LOCKED is not terminal and can loop back.
        test_recipe:
          setup:
            - "Org with ACTIVE strategy"
            - "Cycle in OPEN status with no PENDING_APPROVAL adjustments"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "2026-Q3", effective_date: "2026-09-01", budget_cents: 1000000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { cycle_id: $.data.id } }
            - { call: "POST /cycles/${cycle_id}/lock", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { status_locked: $.data.status } }
          trigger:
            - { call: "POST /cycles/${cycle_id}/unlock", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { status_open: $.data.status } }
          assert:
            - "MarketAdjustmentCycle.${cycle_id}.status == OPEN after unlock (cycled back from LOCKED)"
            - "MarketAdjustmentCycle.${cycle_id}.version == 3 (create=1, lock=2, unlock=3)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: vendor_terminate_cascade_depth3
        grounds:
          - state_machines.SurveyVendor.ACTIVE_to_TERMINATED
          - state_machines.Survey.OPEN_to_REJECTED
          - state_machines.SurveySubmission.READY_to_RETURNED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /vendors/{id}/terminate:
          Vendor terminate → Survey (OPEN) transitions to REJECTED → that
          Survey's Submission (READY) transitions to RETURNED with
          rejection_reason='VENDOR_TERMINATED'. Each link is caused by the
          previous link's mutation, not by the original terminate action.
        test_recipe:
          setup:
            - "Vendor ACTIVE with one OPEN survey"
            - "Survey has one Submission in READY status (not yet SUBMITTED)"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
