            - call: "POST /apportionment/registration-applications/${appc27_id}/distance-schedule"
              payload: { jurisdiction_code: "IL", reported_distance_miles: 80000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appc27_id}/distance-schedule"
              payload: { jurisdiction_code: "IN", reported_distance_miles: 20000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appc27_id}/submit"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appc27_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/registration-applications/${appc27_id}/issue-credentials"
              payload: { valid_from_date: "2026-07-02", valid_to_date: "2027-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /apportionment/credentials?vehicle_id=${vc21_id}&credential_type=DECAL_SET"
              payload: {}
              as: ComplianceOfficer
              captures: { cr21_decal_id: "$.data[0].id" }
            - call: "GET /apportionment/credentials?vehicle_id=${vc22_id}&credential_type=DECAL_SET"
              payload: {}
              as: ComplianceOfficer
              captures: { cr22_decal_id: "$.data[0].id" }
            - call: "GET /apportionment/credentials?vehicle_id=${vc22_id}&credential_type=CAB_CARD"
              payload: {}
              as: ComplianceOfficer
              captures: { cr22_cab_id: "$.data[0].id" }
            - call: "POST /apportionment/credentials/${cr21_decal_id}/distribute"
              payload: { distributed_to_driver_id: "${d3_id}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /apportionment/credentials/${cr22_decal_id}/distribute"
              payload: { distributed_to_driver_id: "${d3_id}" }
              as: ComplianceOfficer
            - call: "POST /apportionment/credentials/${cr22_cab_id}/distribute"
              payload: { distributed_to_driver_id: "${d3_id}" }
              as: ComplianceOfficer
          assert:
            - "Credential.${cr21_decal_id} has valid_from_date 2026-01-01 and valid_to_date 2026-06-29 and is DISTRIBUTED to ${d3_id}"
            - "Credential.${cr22_decal_id} has valid_from_date 2026-07-02 and valid_to_date 2027-06-30"
            - "the first trigger call returns 409 with error_id ERR_DRIVER_CREDENTIAL_WINDOW_CONFLICT: 2026-07-02 minus 2 days is 2026-06-30, which is not after 2026-06-29 plus 2 days (2026-07-01), so the buffered windows touch"
            - "Credential.${cr22_decal_id}.credential_status is still ISSUED with distributed_to_driver_id null, and Vehicle.${vc22_id}.credential_status is still ISSUED"
            - "the second trigger call succeeds with 200: the conflict is scoped per credential_type and D3 holds no DISTRIBUTED CAB_CARD, so the identical window is accepted"
            - "GET /apportionment/credentials?distributed_to_driver_id=${d3_id} returns exactly 2 rows, one DECAL_SET and one CAB_CARD"
            - "control at five clear days: had the 2027 credentials been issued with valid_from_date 2026-07-05, the DECAL_SET distribution would succeed, because 2026-07-03 is after 2026-07-01"

  - rule_id: compensating_invariant
    instances:
      - name: carrier_tax_paid_gallons_ytd_restored_exactly_by_purchase_disallow
        conserved_quantity: Carrier.tax_paid_gallons_ytd
        grounds:
          - calculations.tax_paid_gallons_by_jurisdiction
          - state_machines.FuelPurchase.ACCEPTED_to_DISALLOWED
          - state_machines.FuelPurchase.RECORDED_to_DISALLOWED
          - entities.Carrier.fields.tax_paid_gallons_ytd
        distinguishing_aspect: |
          The conserved quantity is a gallons running total maintained incrementally at
          GALLON_SCALE 3, and the compensation is exact rather than approximate: adding 175.000
          then 80.000 gallons and then disallowing the 80.000 returns the total to exactly
          175.000, with no drift from re-deriving the sum a different way. The RECORDED branch is
          the asymmetric case that proves the ledger is not naive — a purchase that never entered
          the total (tax_paid_flag false) is disallowed with no change at all, so the undo is
          keyed to whether the gallons were counted, not to the fact that a row changed state.
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY declared; carrier cD1 with one power unit and tax_paid_gallons_ytd 0.000."
            - "Purchase P1: IL, 2026-04-11, 175.000 gallons, tax_paid_flag true with a receipt, so it is ACCEPTED and the carrier total becomes 175.000."
            - "Purchase P2: IN, 2026-05-06, 80.000 gallons, tax_paid_flag true with a receipt, so it is ACCEPTED and the total becomes 255.000."
            - "Purchase P3: KY, 2026-06-03, 40.000 gallons, tax_paid_flag false, so it stays RECORDED and the total stays 255.000."
            - "No return has been filed for Q2-2026, so the purchases are not locked."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Reversible Gallons Fuel Co", usdot_number: "USDOT-2637160", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { cd1_id: $.data.id, cd1_ytd0: $.data.tax_paid_gallons_ytd }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cd1_id}", unit_number: "U-1601", vin: "1FUJA6CK21LA01601", weight_group_code: "W80", factory_price_amount: 144000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { vd1_id: $.data.id }
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${cd1_id}", vehicle_id: "${vd1_id}", jurisdiction_code: "IL", purchase_date: "2026-04-11", gallons: 175.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-D1-0411" }
              as: MileageAnalyst
              captures: { pd1_id: $.data.id }
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${cd1_id}", vehicle_id: "${vd1_id}", jurisdiction_code: "IN", purchase_date: "2026-05-06", gallons: 80.000, tax_paid_flag: true, receipt_reference: "RCPT-IN-D1-0506" }
              as: MileageAnalyst
              captures: { pd2_id: $.data.id }
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${cd1_id}", vehicle_id: "${vd1_id}", jurisdiction_code: "KY", purchase_date: "2026-06-03", gallons: 40.000, tax_paid_flag: false }
              as: MileageAnalyst
              captures: { pd3_id: $.data.id }
            - call: "GET /apportionment/carriers/${cd1_id}"
              payload: {}
              as: MileageAnalyst
              captures: { cd1_ytd_peak: $.data.tax_paid_gallons_ytd, cd1_v_peak: $.data.version }
          trigger:
            - call: "POST /apportionment/fuel-purchases/${pd2_id}/disallow"
              payload: { disallow_reason_code: "RECEIPT_ILLEGIBLE" }
              as: MileageAnalyst
            - call: "POST /apportionment/fuel-purchases/${pd3_id}/disallow"
              payload: { disallow_reason_code: "NOT_TAX_PAID" }
              as: MileageAnalyst
          assert:
            - "before the trigger, ${cd1_ytd_peak} == 255.000 (175.000 + 80.000; the RECORDED 40.000 was never counted)"
            - "FuelPurchase.${pd3_id}.purchase_status was RECORDED before the trigger because tax_paid_flag is false and no receipt_reference was supplied"
            - "after the first disallow, Carrier.${cd1_id}.tax_paid_gallons_ytd == 175.000 — exactly the pre-P2 value, to all three decimals"
            - "after the second disallow, Carrier.${cd1_id}.tax_paid_gallons_ytd is still 175.000, because disallowing a RECORDED purchase moves no gallons"
            - "FuelPurchase.${pd2_id}.purchase_status == DISALLOWED with disallow_reason_code RECEIPT_ILLEGIBLE, and FuelPurchase.${pd1_id} is untouched at ACCEPTED"
            - "Carrier.${cd1_id}.version > ${cd1_v_peak} after the first disallow and unchanged by the second, so the version trail records only the write that actually moved gallons"
            - "the compensation is not a re-entry point: a second disallow of ${pd2_id} returns 409 ERR_INVALID_PURCHASE_STATE and the total stays 175.000"
            - "preparing a Q2-2026 return now settles on 175.000 total_tax_paid_gallons, so the ledger and the settlement input set agree after the undo"

      - name: application_total_apportioned_fee_restored_exactly_by_approve_reverse
        conserved_quantity: RegistrationApplication.total_apportioned_fee
        grounds:
          - calculations.fleet_change_fee_delta
          - state_machines.FleetChangeRequest.APPROVED_to_REVERSED
          - state_machines.Vehicle.ACTIVE_to_PENDING
          - entities.RegistrationApplication.fields.apportioned_vehicle_count
        distinguishing_aspect: |
          A money invariant on a different entity and with a rounded delta in the middle, which is
          what makes the exactness non-trivial: the prorated addition adds round(2308.50 * 6 / 12,
          2) == 1154.25 to lift total_apportioned_fee from 4617.00 to 5771.25, and the reversal
          recomputes the total as base_fee_total plus the sum of the still-APPROVED deltas, so it
          lands back on exactly 4617.00 instead of subtracting a re-derived figure. fee_delta is
          retained on the reversed row as an audit trail while apportioned_vehicle_count and the
          vehicle's own status both return to their pre-approval values.
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY with the W80 chart IL 2790.00 / IN 1692.00 / KY 1410.00."
            - "Carrier cD2 with two W80 units for 2026; an ACTUAL_DISTANCE_BASIS application with schedule IL 60000.0 / IN 25000.0 / KY 15000.0 is INVOICED, so base_fee_total is 4617.00, apportioned_vehicle_count is 2 and the frozen percentages are 0.600000 / 0.250000 / 0.150000 (per-vehicle full year 2308.50)."
            - "A third unit VD23 is enrolled and stays PENDING, and an ADDITION change request for it effective 2026-07-15 is filed against the application."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IL", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 2790.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IN", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 1692.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "KY", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 1410.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Exact Restore Registration Inc", usdot_number: "USDOT-2637170", base_jurisdiction_code: "IL", bond_ceiling_amount: 9000.00 }
              as: ComplianceOfficer
              captures: { cd2_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cd2_id}", unit_number: "U-1701", vin: "1FUJA6CK21LA01701", weight_group_code: "W80", factory_price_amount: 162000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { vd21_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cd2_id}", unit_number: "U-1702", vin: "1FUJA6CK21LA01702", weight_group_code: "W80", factory_price_amount: 162000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { vd22_id: $.data.id }
            - call: "POST /apportionment/registration-applications"
              payload: { carrier_id: "${cd2_id}", registration_year: 2026, weight_group_code: "W80", distance_basis: "ACTUAL_DISTANCE_BASIS" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { appd2_id: $.data.id }
            - call: "POST /apportionment/registration-applications/${appd2_id}/distance-schedule"
              payload: { jurisdiction_code: "IL", reported_distance_miles: 60000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appd2_id}/distance-schedule"
              payload: { jurisdiction_code: "IN", reported_distance_miles: 25000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appd2_id}/distance-schedule"
              payload: { jurisdiction_code: "KY", reported_distance_miles: 15000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appd2_id}/submit"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appd2_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cd2_id}", unit_number: "U-1703", vin: "1FUJA6CK21LA01703", weight_group_code: "W80", factory_price_amount: 162000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { vd23_id: $.data.id }
            - call: "GET /apportionment/registration-applications/${appd2_id}"
              payload: {}
              as: TaxPreparer
              captures: { appd2_v: $.data.version, appd2_fee0: $.data.total_apportioned_fee }
            - call: "POST /apportionment/fleet-change-requests"
              payload: { registration_application_id: "${appd2_id}", vehicle_id: "${vd23_id}", change_type: "ADDITION", effective_date: "2026-07-15", expected_registration_application_version: "${appd2_v}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { fcd2_id: $.data.id }
          trigger:
            - call: "POST /apportionment/fleet-change-requests/${fcd2_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Unit delivered mid-July." }
              as: ComplianceOfficer
              as_user_id: "officer-2"
            - call: "POST /apportionment/fleet-change-requests/${fcd2_id}/reverse"
              payload: { reversal_reason_code: "SALE_UNWOUND" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          assert:
            - "before the trigger, ${appd2_fee0} == 4617.00 with base_fee_total 4617.00 and apportioned_vehicle_count 2"
            - "after the APPROVE, FleetChangeRequest.${fcd2_id}.prorate_months == 6 and fee_delta == 1154.25 (2308.50 * 6 / 12, the month of entry is charged)"
            - "after the APPROVE, RegistrationApplication.${appd2_id}.total_apportioned_fee == 5771.25 with apportioned_vehicle_count 3 and Vehicle.${vd23_id}.vehicle_status ACTIVE with activated_on_date 2026-07-15"
            - "after the REVERSE, RegistrationApplication.${appd2_id}.total_apportioned_fee == 4617.00 — exactly the pre-approval value, and identical to base_fee_total because no other APPROVED supplement remains"
            - "after the REVERSE, apportioned_vehicle_count == 2 and Vehicle.${vd23_id}.vehicle_status == PENDING with activated_on_date null"
            - "FleetChangeRequest.${fcd2_id}.change_status == REVERSED and fee_delta is still 1154.25 on the row, retained as an audit trail and no longer counted"
            - "RegistrationApplication.${appd2_id}.version increased by exactly 2 across the trigger (one write per decision), so the restoration is a forward write and not a rollback of history"
            - "GET /apportionment/registration-applications/${appd2_id}/distance-schedule still returns apportion_percent 0.600000 / 0.250000 / 0.150000 and jurisdiction_fee_amount 3348.00 / 846.00 / 423.00, untouched by the approve-reverse pair"
            - "the reversal is terminal: a second reverse of ${fcd2_id} returns 409 ERR_CHANGE_REQUEST_NOT_PENDING and the fee total stays 4617.00"
