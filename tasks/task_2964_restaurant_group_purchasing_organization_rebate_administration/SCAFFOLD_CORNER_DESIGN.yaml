  - section: calculations
    instances:

      - name: percent_of_spend_gross_rounds_half_up_at_the_half_cent
        claim_type: precision
        grounds:
          - calculations.rebate_gross
          - calculations.rebate_split
          - entities.RateCard.fields.percent_bps
        distinguishing_aspect: |
          A PERCENT_OF_SPEND card at 275 bps is engineered so that one line lands
          on an exact half cent (274200 * 275 / 10000 = 7540.5 -> 7541) while the
          sibling line is exact (365600 * 275 / 10000 = 10054.0 -> 10054). Both
          then re-round inside rebate_split, so a truncating implementation is
          wrong in four places on the same batch and the two lines cannot both be
          right by accident.
        test_recipe:
          setup:
