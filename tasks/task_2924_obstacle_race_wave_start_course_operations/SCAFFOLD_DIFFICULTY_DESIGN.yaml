# =====================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2924 — Obstacle Race Wave Start & Course Operations
# Nine §0.5 rules x 2 differentiated instances = 18 instances.
# Every setup_api_calls / trigger entry resolves to a §1.5 endpoint of
# SCAFFOLD.yaml; every ${var} is bound by an earlier captures block.
# The logical clock starts at 2026-08-01T00:00:00Z unless a chain moves it.
# =====================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: entry_elapsed_provisional_gun_reading_vs_official_chip_reading
        grounds:
          - calculations.entry_elapsed_time
          - entities.Entry.fields.provisional_elapsed_seconds
          - entities.Entry.fields.official_elapsed_seconds
          - state_machines.Wave.STARTED_to_CLOSED
        distinguishing_aspect: |
          The two variants of entry_elapsed_time diverge on BOTH the base instant and the
          penalty set: provisional_gun_to_mat measures from the wave gun and charges all
          three recorded penalties, while official_adjudicated measures from the runner's
          own mat crossing and suppresses the SKIPPED_UNMARSHALED penalty, so the same
          attempt card yields 3042 provisional and 2915 official seconds.
        test_recipe:
          setup:
            - "One venue with an APPROVED land-use permit; one PUBLISHED 3-obstacle course fully marshaled (2+2+1), 2 water-safety and 1 medic."
            - "One COMPETITIVE division scored on CHIP_TIME; wave A1 at 2026-09-12T08:00:00Z with capacity 112, roster LOCKED, one entry checked in with a 37-second mat offset."
            - "Wave A1 released and started at exactly 08:00:00, so actual_start_utc == 2026-09-12T08:00:00Z and the entry's chip_start_utc == 2026-09-12T08:00:37Z."
            - "Attempt card: station 1 COMPLETED (0s), station 2 FAILED_PENALTY (120s), station 3 SKIPPED_UNMARSHALED (90s) recorded after that station's only marshal was vacated."
            - "Finish recorded at 08:47:12, so gun_base == 2832s and chip_base == 2795s; the entry sits at result_status PROVISIONAL with provisional_elapsed_seconds 3042."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "P-2924-01", water_use_allowed: true, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-09-20T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/validate"
              payload: {}
              as: CourseDesigner
            - call: "POST /ocr/courses/${course_id}/publish"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-1", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-2", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-3", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-4", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-5", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o3_id}" }
              as: SafetyOfficer
              captures: { sa_o3_marshal_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-6", staff_role: "WATER_SAFETY", certification_level: "LIFEGUARD", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-7", staff_role: "WATER_SAFETY", certification_level: "LIFEGUARD", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-8", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z" }
              as: SafetyOfficer
            - call: "POST /ocr/divisions"
              payload: { name: "Elite Competitive", division_type: "COMPETITIVE", bypass_policy: "DQ_ON_BYPASS", scoring_mode: "CHIP_TIME", min_age: 18, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_comp_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "A1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 112 }
              as: RaceDirector
              captures: { wave_a_id: $.data.id }
            - call: "POST /ocr/participants"
              payload: { full_name: "Ada Rock", birth_year: 2008, email: "ada@example.com", chip_id: "CHIP-001" }
              as: SiteOpsLead
              captures: { p1_id: $.data.id }
            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Ada Rock" }
              as: Participant
              as_user_id: "${p1_id}"
            - call: "POST /ocr/waves/${wave_a_id}/entries"
              payload: { participant_id: "${p1_id}", bib_number: 101 }
              as: SiteOpsLead
              captures: { e1_id: $.data.id }
            - call: "POST /ocr/entries/${e1_id}/check-in"
              payload: { bag_tag_code: "BAG-101", chip_start_offset_seconds: 37 }
              as: SiteOpsLead
            - call: "POST /ocr/waves/${wave_a_id}/lock-roster"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_a_id}/release"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:00:00Z" }
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_a_id}/start"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:05:00Z" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e1_id}/attempts"
              payload: { obstacle_id: "${o1_id}", outcome: "COMPLETED" }
              as: ObstacleMarshal
              as_user_id: "marshal-1"
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:20:00Z" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e1_id}/attempts"
              payload: { obstacle_id: "${o2_id}", outcome: "FAILED_PENALTY" }
              as: ObstacleMarshal
              as_user_id: "marshal-1"
              captures: { att_o2_id: $.data.id }
            - call: "POST /ocr/staff-assignments/${sa_o3_marshal_id}/vacate"
              payload: { reason: "Marshal pulled for heat illness" }
              as: SafetyOfficer
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:35:00Z" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e1_id}/attempts"
              payload: { obstacle_id: "${o3_id}", outcome: "SKIPPED_UNMARSHALED" }
              as: ObstacleMarshal
              as_user_id: "marshal-1"
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:47:12Z" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e1_id}/finish"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /ocr/waves/${wave_a_id}/close"
              payload: {}
              as: RaceDirector
          assert:
            - "Entry.${e1_id}.provisional_penalty_seconds == 210"
            - "Entry.${e1_id}.provisional_elapsed_seconds == 3042"
            - "Entry.${e1_id}.official_penalty_seconds == 120"
            - "Entry.${e1_id}.official_elapsed_seconds == 2915"
            - "Entry.${e1_id}.provisional_elapsed_seconds - Entry.${e1_id}.official_elapsed_seconds == 127"
            - "Entry.${e1_id}.result_status == OFFICIAL"
            - "Entry.${e1_id}.progress_status == FINISHED"
            - "Wave.${wave_a_id}.release_status == CLOSED"
            - "Course.${course_id}.status == COMPLETED"

      - name: restoration_bond_per_task_rounding_vs_final_closeout_rounding
        grounds:
          - calculations.restoration_bond_release
          - entities.Venue.fields.bond_released_cents
          - entities.RestorationTask.fields.bond_release_cents
          - state_machines.Venue.OPEN_to_CLOSED_OUT
        distinguishing_aspect: |
          The two variants of restoration_bond_release diverge purely on ROUNDING ORDER over the
          same money and the same areas: per_task_provisional rounds each 1/3 share to 333333 and
          sums to 999999 (one cent stranded in bond_held_cents), while final_closeout sums the
          areas first, rounds once to 1000000, and books the 1-cent remainder onto the
          largest-area task, which is a different divergence mechanism from the timing variants.
        test_recipe:
          setup:
            - "One venue with restoration_bond_cents 1000000 and an APPROVED permit whose restoration_deadline_utc is 2026-09-20T00:00:00Z."
            - "A single 4500 sqm spectator zone makes Venue.disturbed_area_sqm exactly 4500."
            - "Three remediation tasks of 1500 sqm each, all inspected VERIFIED, so each carries bond_release_cents 333333."
            - "The per-task provisional reading has released 999999 cents and stranded 1 cent: bond_released_cents 999999, bond_held_cents 1, bond_forfeited_cents 0."
            - "The logical clock is still at its 2026-08-01T00:00:00Z default, well before the restoration deadline, so no late penalty applies."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Cedar Flats", terrain_type: "FIELD", water_access: "NONE", land_use_zone: "RU-1", protected_acreage_sqm: 0, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "P-2924-02", water_use_allowed: false, max_disturbed_area_sqm: 6000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-09-20T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/festival-services"
              payload: { service_type: "SPECTATOR_ZONE", footprint_sqm: 4500, capacity: 3000 }
              as: SiteOpsLead
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "RESEED", area_sqm: 1500 }
              as: PermitOfficer
              captures: { task1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "DECOMPACT", area_sqm: 1500 }
              as: PermitOfficer
              captures: { task2_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "DEBRIS_SWEEP", area_sqm: 1500 }
              as: PermitOfficer
              captures: { task3_id: $.data.id }
            - call: "POST /ocr/restoration-tasks/${task1_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Reseed established" }
              as: PermitOfficer
            - call: "POST /ocr/restoration-tasks/${task2_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Compaction relieved" }
              as: PermitOfficer
            - call: "POST /ocr/restoration-tasks/${task3_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Debris cleared" }
              as: PermitOfficer
            - call: "GET /ocr/venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_version: $.data.version }
          trigger:
            - call: "POST /ocr/venues/${venue_id}/bond-releases"
              payload: { settlement_type: "FINAL", expected_venue_version: "${venue_version}" }
              as: PermitOfficer
          assert:
            - "Before the trigger: Venue.${venue_id}.bond_released_cents == 999999 and Venue.${venue_id}.bond_held_cents == 1"
            - "Before the trigger: RestorationTask.${task1_id}.bond_release_cents == 333333 and RestorationTask.${task3_id}.bond_release_cents == 333333"
            - "After the trigger: Venue.${venue_id}.bond_released_cents == 1000000"
            - "After the trigger: Venue.${venue_id}.bond_forfeited_cents == 0"
            - "After the trigger: Venue.${venue_id}.bond_held_cents == 0"
            - "After the trigger: RestorationTask.${task1_id}.bond_release_cents == 333334"
            - "After the trigger: RestorationTask.${task2_id}.bond_release_cents == 333333"
            - "After the trigger: RestorationTask.${task3_id}.bond_release_cents == 333333"
            - "Venue.${venue_id}.site_posture == CLOSED_OUT"

  - rule_id: combinatorial_formula
    instances:
      - name: obstacle_effective_rate_step_staffing_inside_nested_min_with_corral_cap
        grounds:
          - calculations.obstacle_effective_clearance_rate
          - calculations.obstacle_design_clearance_rate
          - calculations.course_bottleneck_capacity
          - entities.Obstacle.fields.staffing_state
          - state_machines.StaffAssignment.CONFIRMED_to_VACATED
        distinguishing_aspect: |
          One field is produced by four interacting inputs through a step function nested inside
          two min() clamps: lane_count x service_rate_per_min, the PARTIAL_STAFFING_FACTOR step on
          marshal headcount vs marshals_required, the bypass relief term with its own cap, and the
          course corral_release_rate_per_min ceiling - so station 3 reads 12.00 (its uncapped
          13.50 clipped by the corral) and station 2 drops 7.50 -> 4.50 on a single vacate.
        test_recipe:
          setup:
            - "One venue with an APPROVED permit; one DRAFT course with corral_release_rate_per_min 12.00."
            - "Station 1: 4 lanes x 3.00/min, 2 marshals required, bypass NONE -> design 12.00 (lane rate 12.00, no relief, exactly at the corral ceiling)."
            - "Station 2: 3 lanes x 2.50/min, 2 marshals required, bypass MANDATORY -> design 7.50 (no relief for MANDATORY)."
            - "Station 3: 3 lanes x 3.00/min, 1 marshal required, bypass TIMED_PENALTY -> lane rate 9.00 plus relief min(4.50, 8.00) = 13.50, clipped by the corral to 12.00."
            - "Course.design_capacity_pph == floor(60 * 7.50) == 450, so the design gate on wave capacity is floor(450 * 15 / 60) == 112."
            - "All five marshal slots confirmed (2 + 2 + 1) plus 2 water-safety, so every obstacle is MARSHALED, every effective rate equals its design rate and bottleneck_capacity_pph == 450."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "P-2924-03", water_use_allowed: true, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-09-20T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-1", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-2", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-3", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-4", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
              captures: { sa_o2_second_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-5", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o3_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-6", staff_role: "WATER_SAFETY", certification_level: "LIFEGUARD", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-7", staff_role: "WATER_SAFETY", certification_level: "LIFEGUARD", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
          trigger:
            - call: "POST /ocr/staff-assignments/${sa_o2_second_id}/vacate"
              payload: { reason: "Marshal reassigned to the festival area" }
              as: SafetyOfficer
          assert:
            - "Before the trigger: Obstacle.${o1_id}.design_clearance_rate_per_min == 12.00"
            - "Before the trigger: Obstacle.${o2_id}.design_clearance_rate_per_min == 7.50"
            - "Before the trigger: Obstacle.${o3_id}.design_clearance_rate_per_min == 12.00"
            - "Before the trigger: Course.${course_id}.design_capacity_pph == 450 and Course.${course_id}.bottleneck_capacity_pph == 450"
            - "Before the trigger: Obstacle.${o2_id}.staffing_state == MARSHALED and Obstacle.${o2_id}.effective_clearance_rate_per_min == 7.50"
            - "After the trigger: Obstacle.${o2_id}.confirmed_marshal_count == 1 and Obstacle.${o2_id}.staffing_state == PARTIAL"
            - "After the trigger: Obstacle.${o2_id}.effective_clearance_rate_per_min == 4.50"
            - "After the trigger: Obstacle.${o3_id}.effective_clearance_rate_per_min == 12.00 (still clipped by the corral ceiling, not 13.50)"
            - "After the trigger: Course.${course_id}.bottleneck_capacity_pph == 270 while Course.${course_id}.design_capacity_pph is unchanged at 450"
            - "After the trigger: Course.${course_id}.readiness_posture == OPEN (PARTIAL staffing lowers throughput but does not restrict the course)"
            - "StaffAssignment.${sa_o2_second_id}.status == VACATED"

      - name: final_closeout_late_penalty_composes_ceil_days_min_cap_and_remainder
        grounds:
          - calculations.restoration_bond_release
          - entities.Venue.fields.bond_forfeited_cents
          - entities.LandUsePermit.fields.restoration_deadline_utc
          - state_machines.Venue.OPEN_to_CLOSED_OUT
        distinguishing_aspect: |
          The settled figure composes five inputs through a different operator stack than the
          clearance-rate instance: a single rounding of bond x verified_area / disturbed_area,
          a ceil() of fractional hours into whole late days (54h -> 3 days, not 2), a min() cap of
          the per-day penalty against the gross, and a signed remainder (-74999) pushed onto the
          largest-area task, so released 925000 / forfeited 75000 / held 0 still sum to the bond.
        test_recipe:
          setup:
            - "One venue with restoration_bond_cents 1000000, an APPROVED permit with restoration_deadline_utc 2026-09-20T00:00:00Z and valid_until_utc 2026-12-31T00:00:00Z."
            - "A single 4500 sqm spectator zone makes Venue.disturbed_area_sqm exactly 4500."
            - "Three 1500 sqm remediation tasks, all VERIFIED, so the per-task provisional reading has released 999999 cents."
            - "The logical clock is moved to 2026-09-22T06:00:00Z: 54 hours past the restoration deadline, which is 2.25 days and therefore ceil() -> 3 late days."
