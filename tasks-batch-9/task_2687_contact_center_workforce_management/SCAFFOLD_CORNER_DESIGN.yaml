      - name: bid_submission_to_unopened_round_rejected
        claim_type: triggerability
        grounds:
          - validations[priority=80]
          - errors.ERR_BID_ROUND_NOT_OPEN
        distinguishing_aspect: |
          ERR_BID_ROUND_NOT_OPEN is raised on BOTH sides of the OPEN window and on two different
          endpoints: submitting into a DRAFT round, submitting into a round already moved to
          SCORING, and withdrawing a bid after the round left OPEN. The specific id must be used
          rather than the generic ERR_INVALID_STATE, and the successful middle submission proves the
          window itself works.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; OPEN cycle W37-ROUND with one Monday VOICE_EN template."
            - "Two VOICE_EN agents A1 and A2; one DRAFT bid round R-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SchedulingManager
            - call: "POST /planning-cycles"
              payload: { name: "W37-ROUND", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /labor-agreements"
