        claim_type: conditional_action
        grounds:
          - endpoints[POST /submissions/{submission_id}/issue-credential]
          - endpoints[POST /listings]
          - endpoints[GET /listings]
          - endpoints[POST /listings/{listing_id}/withdraw]
          - validations[priority=35]
          - validations[priority=36]
        distinguishing_aspect: >
          Credential issuance is a conditional action gated on a globally unique dac_serial: the serial
          taken by the first device makes the second device's issuance fail with ERR_DUPLICATE_DAC_SERIAL
          without touching its escrow, re-issuing to the already CERTIFIED device fails on state, and only
          the accepted calls move money from escrowed_credit_cents into credits_consumed_cents. The public
