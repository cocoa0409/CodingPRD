  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lender_balance_conserved_across_lend_and_refund
        grounds:
          - state_machines.LoanApplication.PRIVATE_FUNDRAISING_to_EXPIRED_PRIVATE
          - state_machines.Endorsement.ACTIVE_to_REFUNDED
          - endpoints.POST_/lenders/{id}/deposits
        distinguishing_aspect: |
          Conserved quantity: Lender.lending_balance_cents. The forward action
          (endorsement debits amount_cents) paired with its compensating
          action (expiry refund credits amount_cents) MUST return the balance
          to the pre-endorsement value exactly — deposit D, endorse A, expire:
          final balance == D for every endorsing lender.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Approved self-endorsed application 500000 / 6 months, private opened 2026-09-01 (deadline 2026-09-16). Lender deposits 100000 then endorses 40000."
