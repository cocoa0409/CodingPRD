            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
          trigger:
            - { call: "POST /api/hives", payload: { site_id: "00000000-0000-4000-8000-000000000000", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_NOT_FOUND (404) for the missing site_id"

      - name: waiver_boundary_365d_satisfaction
        claim_type: satisfaction_pass
