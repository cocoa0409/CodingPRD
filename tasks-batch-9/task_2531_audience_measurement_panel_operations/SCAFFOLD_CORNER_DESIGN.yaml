            - "Trigger call 2: data.state is still EDITED and data.contributing_household_count is still 1 - the counter was written by the edit pass and retirement does not revise it, which is what lets priority 40 pass"
            - "Trigger call 3: HTTP 409 with ${e60} == ERR_DESIGN_DENOMINATOR_EMPTY (priority 41), because the DESIGN denominator counts Household rows in {RECRUITED, INSTALL_SCHEDULED, ENUM_PENDING, ACTIVE, FAULT_HOLD, NONCOMPLIANT_HOLD} and the cell now holds none; the run stays EDITED with weight_variant null"
            - "Trigger call 4: HTTP 200 with data.state == WEIGHTED and data.weight_variant == FINAL - the FINAL denominator counts contributors to THIS run without re-filtering on current status, so it is 1 and base_weight == 100000.0000"
            - "Trigger call 4: data.projected_average_audience == round_half_up(round_half_up(100000.0000 * 350 / 1440, 2), 0) == round_half_up(24305.56, 0) == 24306 and data.total_weight_mass == 100000.0000"
            - "Trigger call 5: total_count == 1 - a weight row exists for the RETIRED household, because the weighting input set is the set of households holding usable records of the run, not the set of currently ACTIVE households"

