  # =====================================================================
  # RULE 5 - priority_pair_validation_conflict
  # Three instances covering three DIFFERENT declared category pairs:
  # business_safety vs business_fiscal (PAIR 4), existence vs state
  # (PAIR 2) and auth vs existence (PAIR 1).
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: caseload_cap_beats_cycle_frozen_after_posture_override_expires
        grounds:
          - validations[priority=26]
          - validations[priority=34]
          - calculations.cycle_capacity_posture
          - state_machines.CaseAssignment.PROPOSED_to_ACTIVE
          - entities.ProgramCapacityCycle.fields.posture_override_until_utc
        distinguishing_aspect: |
          CONFLICT PAIR 4: the single ACTIVATE of a PROPOSED CO_COUNSEL assignment breaks
          priority 26 (the representative sits at active_case_load 1 == max_case_load 1) AND
          priority 34 (the cycle is back to FROZEN at 2/2 because the director override
          expired when the clock moved from 2026-09-01 to 2026-09-06), and the response must
          be ERR_CASELOAD_CAP_EXCEEDED / 422, never ERR_CYCLE_CAPACITY_FROZEN / 409; a
          control call in the same recipe that breaks ONLY priority 34 proves the frozen
          condition really was live, so an implementation cannot pass by ignoring p34.
        test_recipe:
          setup:
            - "Cycle with total_case_slots 2 and reserved_detained_slots 0; two non-detained matters are accepted, driving utilization_ratio to 1.0000 and capacity_posture to FROZEN."
            - "A director posture-override valid until 2026-09-05T00:00:00.000Z downgrades FROZEN to RESTRICTED so the setup writes are legal at clock 2026-09-01."
            - "Representative atty_c has max_case_load 1. Its PROPOSED CO_COUNSEL assignment on M2 is created BEFORE its LEAD on M1 is activated, because priority 26 also guards POST /case-assignments."
            - "Representative atty_d has max_case_load 5 and active_case_load 0 and is used as the single-violation control."
            - "The clock is then moved to 2026-09-06T00:00:00.000Z, past the override instant, so the effective posture is FROZEN again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "TIGHT2", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 2, reserved_detained_slots: 0 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-900001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 1, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-900002" }
              as: ProgramDirector
              captures: { atty_c_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Rina Castellanos", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 5, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-900003" }
              as: ProgramDirector
              captures: { atty_d_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Client One", preferred_language_code: "en", country_of_birth_code: "MX", date_of_birth: "1985-01-05", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { c1_id: "$.data.id" }
            - call: "PATCH /clients/${c1_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${c1_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i1_id: "$.data.id" }
            - call: "POST /intake-screenings/${i1_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i1_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_d_id}"
            - call: "POST /clients"
              payload: { full_name: "Client Two", preferred_language_code: "en", country_of_birth_code: "HN", date_of_birth: "1986-02-06", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { c2_id: "$.data.id" }
            - call: "PATCH /clients/${c2_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${c2_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i2_id: "$.data.id" }
            - call: "POST /intake-screenings/${i2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i2_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_d_id}"
            - call: "POST /capacity-cycles/${cycle_id}/posture-override"
              payload: { posture_override_until_utc: "2026-09-05T00:00:00.000Z", override_reason_code: "DIRECTOR_SURGE_AUTHORIZATION" }
              as: ProgramDirector
            - call: "GET /case-matters"
              payload: { intake_id: "${i2_id}" }
              as: ProgramDirector
              captures: { m2_id: "$.data[0].id", m2_ver: "$.data[0].version" }
            - call: "POST /case-assignments"
