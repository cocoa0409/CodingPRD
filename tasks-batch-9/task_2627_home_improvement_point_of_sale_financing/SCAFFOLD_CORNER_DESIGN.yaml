          assert:
            - "SETUP: both cases carry opened_on == 2026-08-01 and response_due_at == 2026-08-11T00:00:00Z (opened_on + 10 days at midnight)"
            - "TRIGGER 2: HTTP 200 — 2026-08-10T00:00:00Z is strictly before response_due_at; DisputeCase.${case_a}.response_type == WORK_COMPLETE_EVIDENCE, evidence_ref == SIGNED-COC-A, merchant_responded_at == 2026-08-10T00:00:00Z"
