  # ==========================================================================
  # RULE 9 - compensating_invariant
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_match_restores_certified_pins_and_handicaps_exactly
        grounds:
          - calculations.certified_pin_conservation
          - state_machines.Match.CERTIFIED_to_VOID
          - state_machines.Protest.UNDER_REVIEW_to_UPHELD
          - calculations.bowler_average
          - calculations.team_handicap_per_game
        distinguishing_aspect: |
          POST /matches/{id}/certify and a protest remedy of VOID_MATCH form a compensating pair
          under certified_pin_conservation: certify moves the four memberships from
          (0 games, 0 pins, null average, handicaps 36/22/45/54) to (3 games, 540/720/480/450
          pins, averages 180/199/169/159, handicaps 36/18/45/54), and the VOID must land back on
          the pre-certify integers exactly - while certified_week_high_water deliberately does
          NOT revert, because VOID counts as settled in its own definition.
        test_recipe:
          setup:
            - "One league on CONFIG-B, IN_SEASON, week 1 CERTIFIED at 2026-08-12T01:00:00Z with scores 170/180/190, 230/240/250, 150/160/170 and 140/150/160."
            - "Before the certify call every Membership held certified_games 0, certified_pins 0, current_average null, average_status PROVISIONAL and handicap_per_game 36, 22, 45 and 54 respectively."
