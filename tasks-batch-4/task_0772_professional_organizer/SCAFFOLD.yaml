# =============================================================================
# Task 0772 — Professional Organizer & Decluttering Service
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  772. Professional Organizer & Decluttering Service: in-home assessment &
  scope/rooms, project plan & session packages, hauling/donation & inventory,
  product (bins/systems) sourcing & markup, before/after & maintenance plan,
  hourly vs project billing, move/downsizing add-on, follow-up

domain_name: professional-organizer
api_prefix: "/"

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation      # hourly vs project billing; provisional vs appraised donation value
    - optimistic_concurrency        # OCC on Project.version at invoice creation
    - cascading_side_effects        # project cancel / invoice pay cascade 3+ entities
    - derived_field_reconciliation  # Project ledger fields (labor hours, product cost, haul cost, donation credit)

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Client and
  # Organizer are shared across many Projects, so a tree does not fit.

  state_machine_shape: branching
  # InventoryItem forks by disposition into divergent side-effect sets;
  # Invoice cycles ISSUED<->DISPUTED. Project/Session are forward pipelines
  # with compensating reverts.

  relationship_patterns:
    - one_to_many        # Project has many Sessions / InventoryItems / ProductLines / Invoices
    - flat_with_references
    - cross_aggregate    # Invoice references Session states; Session references Project state

  role_model: peer_roles
  # OperationsManager owns lifecycle, Organizer owns fieldwork, BillingAdmin owns
  # invoicing, Client owns read + pay/dispute. Non-overlapping write surfaces.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: home_address, type: string, source: input, description: "Service address (identifies the home for whole-day scheduling exclusivity)" }
      - { name: access_notes, type: string, source: input, default: "", description: "Free-text entry/access instructions" }

  - name: Organizer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Organizer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor rate in cents per hour", constraints: "> 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the organizer can be assigned to new sessions" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client this engagement serves" }
      - { name: lead_organizer_id, type: string, source: input, description: "FK -> Organizer.id; the organizer leading this project" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: billing_mode, type: enum, source: input, description: "HOURLY | PROJECT — selects the labor billing algorithm", constraints: "HOURLY | PROJECT" }
      - { name: flat_price_cents, type: integer, source: input, default: 0, description: "Fixed labor price used when billing_mode=PROJECT; ignored when HOURLY", constraints: ">= 0" }
      - { name: scope_rooms, type: array, source: input, default: "[]", description: "Array of room-scope strings captured during in-home assessment (e.g. [\"Garage\",\"Primary Closet\"])" }
      - { name: move_addon_requested, type: boolean, source: input, default: false, description: "Whether the move/downsizing add-on is included" }
      - { name: move_box_count, type: integer, source: input, default: 0, description: "Number of packing boxes for the move add-on; drives packing charge", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "SCOPING | ACTIVE | WRAP_UP | CLOSED | CANCELLED" }
      - { name: accrued_labor_hours, type: number, source: computed, default: 0, description: "Ledger: sum of logged_hours over this project's Sessions in COMPLETED (see calc project_labor_hours_ledger)" }
      - { name: projected_product_cost_cents, type: integer, source: computed, default: 0, description: "Ledger: sum of client_price_cents over ProductLines in {QUOTED,ORDERED,DELIVERED} (see calc project_product_cost_ledger)" }
      - { name: projected_haul_cost_cents, type: integer, source: computed, default: 0, description: "Ledger: sum of haul_fee_cents over InventoryItems in {SCHEDULED_HAUL,HAULED}" }
      - { name: donation_credit_cents, type: integer, source: computed, default: 0, description: "Ledger: sum of final donation credits over InventoryItems in DONATED (see calc inventory_donation_value final variant)" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project this session belongs to" }
      - { name: organizer_id, type: string, source: input, description: "FK -> Organizer.id; the assigned organizer (resource for double-booking)" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC session start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC session end; must be > scheduled_start" }
      - { name: logged_hours, type: number, source: input, default: 0, description: "Actual hours logged at completion; provided to POST /sessions/{id}/complete", constraints: ">= 0" }
      - { name: labor_cost_cents, type: integer, source: computed, default: 0, description: "Computed at completion (see calc session_labor_cost); reversed on void" }
      - { name: is_overtime, type: boolean, source: computed, default: false, description: "True when logged_hours strictly exceeds OVERTIME_THRESHOLD_HOURS" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project the item was removed from" }
      - { name: room_label, type: string, source: input, description: "Scope room the item came from (free text)" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: disposition, type: enum, source: input, description: "KEEP | HAUL | DONATE | SELL — set at creation, drives the disposition fork", constraints: "KEEP | HAUL | DONATE | SELL" }
      - { name: estimated_value_cents, type: integer, source: input, default: 0, description: "Provisional fair-market value estimate captured at logging", constraints: ">= 0" }
      - { name: final_value_cents, type: integer, source: computed, default: 0, description: "Appraised value supplied at donation confirmation (final variant of inventory_donation_value)" }
      - { name: haul_fee_cents, type: integer, source: computed, default: 0, description: "Flat haul fee applied when scheduled for hauling (see calc inventory_haul_fee)" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "LOGGED | SCHEDULED_HAUL | SCHEDULED_DONATION | HAULED | DONATED | KEPT" }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project the products are sourced for" }
      - { name: product_name, type: string, source: input, description: "Product (bins/systems) name" }
      - { name: category, type: enum, source: input, description: "BIN | SHELVING | SYSTEM | LABELING", constraints: "BIN | SHELVING | SYSTEM | LABELING" }
      - { name: wholesale_cost_cents, type: integer, source: input, description: "Per-unit wholesale cost in cents", constraints: "> 0" }
      - { name: quantity, type: integer, source: input, description: "Number of units", constraints: ">= 1" }
      - { name: markup_pct, type: number, source: input, description: "Markup as a fraction (0.35 = 35%)", constraints: ">= 0" }
      - { name: client_price_cents, type: integer, source: computed, description: "Marked-up total billed to client (see calc product_line_client_price; round per-unit then multiply)" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "QUOTED | ORDERED | DELIVERED | CANCELLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project being billed" }
      - { name: expected_project_version, type: integer, source: input, description: "OCC guard: the Project.version the client last observed; rejected if stale" }
      - { name: billing_mode, type: enum, source: system, description: "Copied from Project.billing_mode at issue time", constraints: "HOURLY | PROJECT" }
      - { name: labor_subtotal_cents, type: integer, source: computed, description: "Labor component (see calc invoice_billing_subtotal, dual variant)" }
      - { name: product_subtotal_cents, type: integer, source: computed, description: "Sum of client_price_cents over ProductLines in {ORDERED,DELIVERED}" }
      - { name: haul_subtotal_cents, type: integer, source: computed, description: "Sum of haul_fee_cents over InventoryItems in {SCHEDULED_HAUL,HAULED}" }
      - { name: donation_credit_cents, type: integer, source: computed, description: "Sum of final donation credits over InventoryItems in DONATED (subtracted from subtotal)" }
      - { name: move_addon_cents, type: integer, source: computed, description: "Packing charge = move_box_count * MOVE_PACK_RATE_CENTS when move_addon_requested else 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "labor + product + haul + move_addon - donation_credit (see calc invoice_grand_total step 1)" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount keyed on subtotal tier (see calc invoice_grand_total step 2)" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on (subtotal - discount) at TAX_PCT" }
      - { name: grand_total_cents, type: integer, source: computed, description: "(subtotal - discount) + tax" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "ISSUED | DISPUTED | PAID" }

  - name: MaintenancePlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project this before/after maintenance plan follows (1:1)" }
      - { name: cadence, type: enum, source: input, description: "MONTHLY | QUARTERLY | BIANNUAL", constraints: "MONTHLY | QUARTERLY | BIANNUAL" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring maintenance fee in cents", constraints: ">= 0" }
      - { name: visits_per_year, type: integer, source: computed, description: "Derived from cadence (MONTHLY=12, QUARTERLY=4, BIANNUAL=2)" }
      - { name: next_followup_note, type: string, source: input, default: "", description: "Free-text note for the first before/after follow-up visit" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "DRAFT | ACTIVE | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: SCOPING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCOPING
        to: ACTIVE
        trigger: "POST /projects/{id}/activate"
        actor: OperationsManager
        preconditions:
          - "Project.scope_rooms is non-empty (ERR_SCOPE_EMPTY) — an in-home assessment must have captured at least one room"
          - "If billing_mode=PROJECT then flat_price_cents > 0 (ERR_FLAT_PRICE_REQUIRED)"
        side_effects:
          - "Enables Session / InventoryItem / ProductLine creation"

      - from: ACTIVE
        to: WRAP_UP
        trigger: "POST /invoices (invoice creation)"
        actor: BillingAdmin
        preconditions:
          - "No Session in {SCHEDULED, IN_PROGRESS} (ERR_UNRESOLVED_SESSIONS) — business_constraint"
          - "Billable work exists per billing_mode (ERR_NO_BILLABLE_WORK) — business_fiscal"
          - "expected_project_version matches Project.version (ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "Freezes further Session creation for the project"
          - "increments Project.version by 1"

      - from: WRAP_UP
        to: CLOSED
        trigger: "POST /invoices/{id}/pay (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE STEP B: caused by Invoice ISSUED->PAID"
          - "If the project has a MaintenancePlan in DRAFT, transition it DRAFT->ACTIVE (CASCADE STEP C)"

      - from: [SCOPING, ACTIVE, WRAP_UP]
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "Project not already terminal (ERR_PROJECT_TERMINAL)"
        side_effects:
          - "CASCADE STEP A (origin)."
          - "All Sessions in {SCHEDULED, IN_PROGRESS} -> CANCELLED (fan-out; each reverses its own labor if it had any)"
          - "All ProductLines in {QUOTED, ORDERED} -> CANCELLED (CASCADE STEP B)"
          - "Each ProductLine CANCELLED subtracts its client_price_cents from Project.projected_product_cost_cents (CASCADE STEP C, ledger sync)"
          - "Any MaintenancePlan in {DRAFT, ACTIVE} -> CANCELLED"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "PATCH /sessions/{id} { status: IN_PROGRESS }"
        actor: Organizer
        preconditions:
          - "CROSS-ENTITY: parent Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete { logged_hours }"
        actor: Organizer
        preconditions:
          - "CROSS-ENTITY: parent Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "logged_hours >= 0 (ERR_VALIDATION)"
        side_effects:
          - "Compute labor_cost_cents and is_overtime (calc session_labor_cost)"
          - "Add logged_hours to Project.accrued_labor_hours (calc project_labor_hours_ledger)"

      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "PATCH /sessions/{id} { status: CANCELLED }"
        actor: [OperationsManager, Organizer]
        preconditions: []
        side_effects:
          - "No labor accrued yet; nothing to reverse"

      - from: COMPLETED
        to: CANCELLED
        trigger: "PATCH /sessions/{id} { status: CANCELLED }"
        actor: [OperationsManager, Organizer]
        preconditions: []
        side_effects:
          - "COMPENSATING: subtract this session's logged_hours from Project.accrued_labor_hours"
          - "Reset labor_cost_cents to 0; INVARIANT: Project.accrued_labor_hours == sum(logged_hours over COMPLETED sessions) holds after the reversal"

  - entity: InventoryItem
    initial_state: LOGGED
    terminal_states: [HAULED, DONATED, KEPT]
    transitions:
      - from: LOGGED
        to: KEPT
        trigger: "system (at creation when disposition=KEEP)"
        actor: system
        preconditions: []
        note: "Items created with disposition KEEP are terminal immediately; all others start LOGGED."
        side_effects: []

      - from: LOGGED
        to: SCHEDULED_HAUL
        trigger: "POST /inventory-items/{id}/schedule"
        actor: Organizer
        preconditions:
          - "disposition IN {HAUL, SELL} (ERR_DISPOSITION_MISMATCH)"
        side_effects:
          - "BRANCH A: compute haul_fee_cents (calc inventory_haul_fee)"
          - "Add haul_fee_cents to Project.projected_haul_cost_cents"

      - from: LOGGED
        to: SCHEDULED_DONATION
        trigger: "POST /inventory-items/{id}/schedule"
        actor: Organizer
        preconditions:
          - "disposition == DONATE (ERR_DISPOSITION_MISMATCH)"
        side_effects:
          - "BRANCH B: no haul fee; provisional donation value = estimated_value_cents (calc inventory_donation_value provisional variant)"

      - from: SCHEDULED_HAUL
        to: HAULED
        trigger: "POST /inventory-items/{id}/confirm"
        actor: Organizer
        preconditions: []
        side_effects:
          - "haul_fee_cents remains booked in Project.projected_haul_cost_cents"

      - from: SCHEDULED_DONATION
        to: DONATED
        trigger: "POST /inventory-items/{id}/confirm { final_value_cents }"
        actor: Organizer
        preconditions:
          - "final_value_cents >= 0 (ERR_VALIDATION)"
        side_effects:
          - "Set final_value_cents; compute final donation credit = round(final_value_cents * DONATION_CREDIT_PCT) (calc inventory_donation_value final variant)"
          - "Add final donation credit to Project.donation_credit_cents"

  - entity: ProductLine
    initial_state: QUOTED
    terminal_states: [CANCELLED]
    transitions:
      - from: QUOTED
        to: ORDERED
        trigger: "PATCH /product-lines/{id} { status: ORDERED }"
        actor: [Organizer, OperationsManager]
        preconditions: []
        side_effects: []

      - from: ORDERED
        to: DELIVERED
        trigger: "PATCH /product-lines/{id} { status: DELIVERED }"
        actor: [Organizer, OperationsManager]
        preconditions: []
        side_effects: []

      - from: [QUOTED, ORDERED]
        to: CANCELLED
        trigger: "PATCH /product-lines/{id} { status: CANCELLED }"
        actor: [Organizer, OperationsManager]
        preconditions: []
        side_effects:
          - "COMPENSATING: subtract client_price_cents from Project.projected_product_cost_cents"
          - "INVARIANT: Project.projected_product_cost_cents == sum(client_price_cents over ProductLines in {QUOTED,ORDERED,DELIVERED})"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "PATCH /invoices/{id} { status: DISPUTED }"
        actor: [Client, BillingAdmin]
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: ISSUED
        trigger: "PATCH /invoices/{id} { status: ISSUED }"
        actor: [Client, BillingAdmin]
        preconditions: []
        note: "CYCLE: dispute resolution returns the invoice to ISSUED for re-review."
        side_effects: []

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: [Client, BillingAdmin]
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_NOT_PAYABLE) — a DISPUTED invoice must be resolved to ISSUED first"
        side_effects:
          - "CASCADE STEP A (origin): parent Project WRAP_UP -> CLOSED"

  - entity: MaintenancePlan
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (cascade when parent Project -> CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE STEP C: activated when the project closes on invoice payment"

      - from: [DRAFT, ACTIVE]
        to: CANCELLED
        trigger: "PATCH /maintenance-plans/{id} { status: CANCELLED } | cascade from Project cancel"
        actor: [OperationsManager, system]
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /invoices"
    occ_field: "expected_project_version"
    description: |
      Creating an Invoice against a Project whose version has advanced since the
      client last observed it is rejected. A second issue attempt carrying the
      previously observed version is stale because the first successful issue
      (which legitimately moves the project ACTIVE->WRAP_UP and supersedes any
      draft billing view) has already advanced Project.version.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_labor_cost
    trigger: "POST /sessions/{id}/complete (IN_PROGRESS -> COMPLETED)"
    algorithm: threshold
    formula: |
      rate = organizer.hourly_rate_cents            # cents per hour
      base_hours = min(logged_hours, OVERTIME_THRESHOLD_HOURS)
      ot_hours   = max(logged_hours - OVERTIME_THRESHOLD_HOURS, 0)
      is_overtime = (logged_hours > OVERTIME_THRESHOLD_HOURS)      # STRICT >
      regular_cents  = round_half_up(base_hours * rate)
      overtime_cents = round_half_up(ot_hours * rate * OVERTIME_MULTIPLIER)
      subtotal = regular_cents + overtime_cents
      # weekend surcharge keyed on the weekday of scheduled_start (UTC)
      if weekday(scheduled_start) in {SATURDAY, SUNDAY}:
          labor_cost_cents = round_half_up(subtotal * (1 + WEEKEND_SURCHARGE_PCT))
      else:
          labor_cost_cents = subtotal
    input_set: "This session only; organizer rate from its assigned Organizer."
    constants:
      OVERTIME_THRESHOLD_HOURS: 8.0
      OVERTIME_MULTIPLIER: 1.5
      WEEKEND_SURCHARGE_PCT: 0.20
    precision: "round_half_up per component (regular, overtime) then sum; weekend multiplier rounded last"

  - name: product_line_client_price
    trigger: "POST /product-lines (creation)"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round the per-unit marked price FIRST,
      # THEN multiply by quantity. (round-then-multiply, NOT multiply-then-round.)
      per_unit_marked_cents = round_half_up(wholesale_cost_cents * (1 + markup_pct))
      client_price_cents    = per_unit_marked_cents * quantity
    input_set: "Single product line at creation."
    constants: {}
    precision: "round_half_up on per-unit price only; the multiply is exact integer arithmetic"
    note: |
      Combinatorial mode (b): 'round per-unit then multiply' vs 'multiply then round'
      produce different cents (e.g. wholesale=1099, markup=0.35, qty=3 -> 1484*3=4452
      pinned, vs round(1099*1.35*3)=4451). This scaffold pins the per-unit-first order.

  - name: inventory_donation_value
    trigger: "InventoryItem schedule (provisional) and confirm (final)"
    algorithm: aggregation
    formula: |
      DUAL VARIANT on the same InventoryItem:
      provisional_credit_cents = round_half_up(estimated_value_cents * DONATION_CREDIT_PCT)
      final_credit_cents       = round_half_up(final_value_cents     * DONATION_CREDIT_PCT)
      Project.donation_credit_cents = sum(final_credit_cents over InventoryItems in DONATED)
    input_set: "Provisional uses estimated_value_cents at scheduling; final uses appraised final_value_cents at DONATED confirmation."
    constants:
      DONATION_CREDIT_PCT: 0.10
    variants:
      - name: provisional
        when: "InventoryItem is SCHEDULED_DONATION (not yet confirmed)"
        difference: "Credit computed from client-supplied estimated_value_cents; used only for planning, NOT added to the invoice"
      - name: final
        when: "InventoryItem transitions SCHEDULED_DONATION -> DONATED with appraised final_value_cents"
        difference: "Credit computed from final_value_cents and IS added to Project.donation_credit_cents and the invoice"

  - name: inventory_haul_fee
    trigger: "POST /inventory-items/{id}/schedule (LOGGED -> SCHEDULED_HAUL)"
    algorithm: aggregation
    formula: |
      haul_fee_cents = HAUL_FLAT_CENTS      # flat per item scheduled for hauling
    input_set: "Single item; only HAUL/SELL dispositions."
    constants:
      HAUL_FLAT_CENTS: 2500

  - name: invoice_billing_subtotal
    trigger: "POST /invoices (creation)"
    algorithm: forward_looking
    formula: |
      DUAL VARIANT on the Project (labor component):
      product_subtotal = sum(client_price_cents over ProductLines in {ORDERED, DELIVERED})
      haul_subtotal    = sum(haul_fee_cents over InventoryItems in {SCHEDULED_HAUL, HAULED})
      donation_credit  = sum(final_credit for InventoryItems in DONATED)  # calc inventory_donation_value final
      move_addon_cents = move_box_count * MOVE_PACK_RATE_CENTS if move_addon_requested else 0

      if billing_mode == HOURLY:
          labor_subtotal = sum(labor_cost_cents over Sessions in COMPLETED)
      elif billing_mode == PROJECT:
          labor_subtotal = flat_price_cents      # actual logged hours IGNORED
    input_set: "COMPLETED sessions (HOURLY only); ProductLines {ORDERED,DELIVERED}; InventoryItems by status."
    constants:
      MOVE_PACK_RATE_CENTS: 500
    variants:
      - name: hourly
        when: "Project.billing_mode == HOURLY"
        difference: "labor_subtotal = sum of per-session labor_cost_cents over COMPLETED sessions"
      - name: project
        when: "Project.billing_mode == PROJECT"
        difference: "labor_subtotal = flat_price_cents, independent of actual sessions/hours"

  - name: invoice_grand_total
    trigger: "POST /invoices (creation, after invoice_billing_subtotal)"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING: discount depends on subtotal tier, subtotal feeds total.
      # PINNED EVALUATION ORDER: subtotal -> discount(subtotal) -> taxable -> tax -> total.
      subtotal_cents = labor_subtotal + product_subtotal + haul_subtotal + move_addon_cents - donation_credit
      if subtotal_cents >= DISCOUNT_TIER_2_MIN:   discount_pct = 0.10
      elif subtotal_cents >= DISCOUNT_TIER_1_MIN: discount_pct = 0.05
      else:                                       discount_pct = 0.0
      discount_cents = round_half_up(subtotal_cents * discount_pct)
      taxable_cents  = subtotal_cents - discount_cents
      tax_cents      = round_half_up(taxable_cents * TAX_PCT)
      grand_total_cents = taxable_cents + tax_cents
    input_set: "Outputs of invoice_billing_subtotal for this project."
    constants:
      DISCOUNT_TIER_1_MIN: 200000
      DISCOUNT_TIER_2_MIN: 500000
      TAX_PCT: 0.08
    precision: "round_half_up on discount and tax; tier comparison uses >= (inclusive)"

  - name: project_labor_hours_ledger
    trigger: "Session completion and compensating void"
    algorithm: aggregation
    formula: |
      Project.accrued_labor_hours = sum(logged_hours over Sessions where status == COMPLETED)
      # Incremental: +logged_hours on COMPLETED; -logged_hours on COMPLETED->CANCELLED void.
    input_set: "Sessions in COMPLETED for this project."
    constants: {}

  - name: project_product_cost_ledger
    trigger: "ProductLine creation and cancellation"
    algorithm: aggregation
    formula: |
      Project.projected_product_cost_cents = sum(client_price_cents over ProductLines where status IN {QUOTED, ORDERED, DELIVERED})
      # Incremental: +client_price_cents on create; -client_price_cents on ->CANCELLED.
    input_set: "ProductLines in {QUOTED,ORDERED,DELIVERED} for this project."
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for this operation per §1.7; entity_backed roles acting on owned resources match X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges honored, scheduled_end > scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids exist (validated left-to-right)"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_ORGANIZER_NOT_FOUND / ERR_PROJECT_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_ITEM_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: business_referential
    check: "Foreign keys in request body reference existing resources (client_id, lead_organizer_id, project_id, organizer_id)"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_ORGANIZER_NOT_FOUND / ERR_PROJECT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /projects, POST /sessions, POST /inventory-items, POST /product-lines, POST /invoices, POST /maintenance-plans"

  - priority: 6
    category: state
    check: "Target/parent resource is in a valid state for the operation. Session CREATION is allowed while the parent Project is in {SCOPING, ACTIVE} (rejected with ERR_PROJECT_NOT_ACTIVE when WRAP_UP, ERR_PROJECT_TERMINAL when CLOSED/CANCELLED); starting or completing a session requires Project ACTIVE. Project SCOPING for activate; Invoice ISSUED for pay."
    error_id: "ERR_PROJECT_NOT_ACTIVE / ERR_PROJECT_NOT_IN_SCOPING / ERR_PROJECT_TERMINAL / ERR_INVALID_SESSION_TRANSITION / ERR_INVALID_ITEM_TRANSITION / ERR_INVALID_PRODUCT_TRANSITION / ERR_INVALID_INVOICE_TRANSITION / ERR_INVOICE_NOT_PAYABLE / ERR_DISPOSITION_MISMATCH / ERR_SCOPE_EMPTY / ERR_FLAT_PRICE_REQUIRED"
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_project_version equals current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /invoices"

  - priority: 8
    category: business_temporal
    check: "Organizer double-booking: no other non-cancelled Session for the same organizer_id whose [scheduled_start, scheduled_end) comes within TRAVEL_BUFFER_MINUTES (=30) of this one (i.e. gap between adjacent sessions must be >= 30 minutes). Half-open interval arithmetic plus a symmetric buffer."
    error_id: ERR_ORGANIZER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 9
    category: business_temporal
    check: "Client home whole-day exclusivity: no other non-cancelled Session belonging to a Project of the same client on the same UTC calendar date as scheduled_start"
    error_id: ERR_CLIENT_HOME_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 10
    category: business_constraint
    check: "Invoice creation requires no Session in {SCHEDULED, IN_PROGRESS} for the project"
    error_id: ERR_UNRESOLVED_SESSIONS
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 11
    category: business_fiscal
    check: "Invoice creation requires billable work: HOURLY needs >= 1 COMPLETED Session; PROJECT needs flat_price_cents > 0"
    error_id: ERR_NO_BILLABLE_WORK
    http_status: 422
    applies_to: "POST /invoices"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- Client ---
  - { method: POST, path: "/clients", description: "Create a client", roles: [OperationsManager], code: 201, input: [full_name, email, home_address, "access_notes?"], output: Client, side_effects: [] }
  - { method: GET,  path: "/clients/{id}", description: "Get a client", roles: [OperationsManager, Organizer, BillingAdmin, Client], code: 200, input: [], output: Client, side_effects: [] }

  # --- Organizer ---
  - { method: POST, path: "/organizers", description: "Create an organizer", roles: [OperationsManager], code: 201, input: [full_name, email, hourly_rate_cents, "active?"], output: Organizer, side_effects: [] }
  - { method: GET,  path: "/organizers/{id}", description: "Get an organizer", roles: [OperationsManager, Organizer, BillingAdmin], code: 200, input: [], output: Organizer, side_effects: [] }

  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a project (starts in SCOPING; scope_rooms captured from the in-home assessment)"
    roles: [OperationsManager]
    code: 201
    input: [client_id, lead_organizer_id, title, billing_mode, "flat_price_cents?", "scope_rooms?", "move_addon_requested?", "move_box_count?"]
    output: Project
    side_effects: ["status=SCOPING", "ledger fields initialized to 0"]
  - method: GET
    path: "/projects"
    description: "List projects; filter by client, lead organizer, or status"
    roles: [OperationsManager, Organizer, BillingAdmin, Client]
    code: 200
    input: ["client_id?", "lead_organizer_id?", "status?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []
  - { method: GET, path: "/projects/{id}", description: "Get a project (includes ledger fields)", roles: [OperationsManager, Organizer, BillingAdmin, Client], code: 200, input: [], output: Project, side_effects: [] }
  - method: POST
    path: "/projects/{id}/activate"
    description: "Activate a project (SCOPING -> ACTIVE)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> ACTIVE", "increments Project.version by 1"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project; cascades to sessions, product lines, ledgers, maintenance plan"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "status -> CANCELLED"
      - "Cascade: non-terminal Sessions -> CANCELLED; QUOTED/ORDERED ProductLines -> CANCELLED with product-cost ledger reversal; MaintenancePlan -> CANCELLED"
      - "increments Project.version by 1"

  # --- Session ---
  - method: POST
    path: "/sessions"
    description: "Schedule a session for a project/organizer"
    roles: [OperationsManager, Organizer]
    code: 201
    input: [project_id, organizer_id, scheduled_start, scheduled_end]
    output: Session
    side_effects: ["status=SCHEDULED", "Organizer double-booking + client whole-day checks run"]
    note: "Allowed while parent Project is in {SCOPING, ACTIVE}. Sessions may be pre-scheduled during SCOPING but cannot be started/completed until the project is ACTIVE (cross-entity dependency)."
  - method: GET
    path: "/sessions"
    description: "List sessions; filter by project, organizer, or status"
    roles: [OperationsManager, Organizer, BillingAdmin, Client]
    code: 200
    input: ["project_id?", "organizer_id?", "status?", "limit?", "offset?"]
    output: "Session[]"
    side_effects: []
  - { method: GET, path: "/sessions/{id}", description: "Get a session", roles: [OperationsManager, Organizer, BillingAdmin, Client], code: 200, input: [], output: Session, side_effects: [] }
  - method: POST
    path: "/sessions/{id}/complete"
    description: "Complete an in-progress session and log hours"
    roles: [Organizer]
    code: 200
    input: [logged_hours]
    output: Session
    side_effects: ["status -> COMPLETED", "compute labor_cost_cents + is_overtime (session_labor_cost)", "add logged_hours to Project.accrued_labor_hours"]
  - method: PATCH
    path: "/sessions/{id}"
    description: "Transition a session (start=IN_PROGRESS, cancel=CANCELLED including compensating void of a COMPLETED session)"
    roles: [OperationsManager, Organizer]
    code: 200
    input: [status]
    output: Session
    side_effects: ["On COMPLETED -> CANCELLED: reverse labor_cost_cents and subtract logged_hours from Project.accrued_labor_hours"]

  # --- InventoryItem ---
  - method: POST
    path: "/inventory-items"
    description: "Log an inventory item removed from a room"
    roles: [Organizer]
    code: 201
    input: [project_id, room_label, description, disposition, "estimated_value_cents?"]
    output: InventoryItem
    side_effects: ["status=KEPT if disposition=KEEP else LOGGED"]
  - method: GET
    path: "/inventory-items"
    description: "List inventory items; filter by project or disposition"
    roles: [OperationsManager, Organizer, BillingAdmin, Client]
    code: 200
    input: ["project_id?", "disposition?", "status?", "limit?", "offset?"]
    output: "InventoryItem[]"
    side_effects: []
  - { method: GET, path: "/inventory-items/{id}", description: "Get an inventory item", roles: [OperationsManager, Organizer, BillingAdmin, Client], code: 200, input: [], output: InventoryItem, side_effects: [] }
  - method: POST
    path: "/inventory-items/{id}/schedule"
    description: "Schedule item disposition (forks to SCHEDULED_HAUL or SCHEDULED_DONATION by disposition)"
    roles: [Organizer]
    code: 200
    input: []
    output: InventoryItem
    side_effects: ["HAUL/SELL: compute haul_fee_cents + add to Project.projected_haul_cost_cents", "DONATE: set provisional donation value"]
  - method: POST
    path: "/inventory-items/{id}/confirm"
    description: "Confirm disposition (SCHEDULED_HAUL->HAULED or SCHEDULED_DONATION->DONATED with appraised value)"
    roles: [Organizer]
    code: 200
    input: ["final_value_cents?"]
    output: InventoryItem
    side_effects: ["DONATED: set final_value_cents + add final donation credit to Project.donation_credit_cents"]

  # --- ProductLine ---
  - method: POST
    path: "/product-lines"
    description: "Add a product (bins/systems) line with markup"
    roles: [Organizer]
    code: 201
    input: [project_id, product_name, category, wholesale_cost_cents, quantity, markup_pct]
    output: ProductLine
    side_effects: ["status=QUOTED", "compute client_price_cents (product_line_client_price)", "add client_price_cents to Project.projected_product_cost_cents"]
  - method: GET
    path: "/product-lines"
    description: "List product lines; filter by project or status"
    roles: [OperationsManager, Organizer, BillingAdmin, Client]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "ProductLine[]"
    side_effects: []
  - { method: GET, path: "/product-lines/{id}", description: "Get a product line", roles: [OperationsManager, Organizer, BillingAdmin, Client], code: 200, input: [], output: ProductLine, side_effects: [] }
  - method: PATCH
    path: "/product-lines/{id}"
    description: "Transition a product line (ORDERED, DELIVERED, CANCELLED)"
    roles: [Organizer, OperationsManager]
    code: 200
    input: [status]
    output: ProductLine
    side_effects: ["On ->CANCELLED: subtract client_price_cents from Project.projected_product_cost_cents"]

  # --- Invoice ---
  - method: POST
    path: "/invoices"
    description: "Issue an invoice for a project (OCC-guarded; computes subtotals, discount, tax, total; moves project ACTIVE->WRAP_UP)"
    roles: [BillingAdmin]
    code: 201
    input: [project_id, expected_project_version]
    output: Invoice
    side_effects:
      - "status=ISSUED"
      - "compute labor/product/haul/move/donation subtotals (invoice_billing_subtotal), then discount+tax+grand_total (invoice_grand_total)"
      - "Project ACTIVE -> WRAP_UP"
      - "increments Project.version by 1"
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by project or status"
    roles: [OperationsManager, BillingAdmin, Client]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - { method: GET, path: "/invoices/{id}", description: "Get an invoice", roles: [OperationsManager, BillingAdmin, Client], code: 200, input: [], output: Invoice, side_effects: [] }
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an issued invoice (cascades project close and maintenance-plan activation)"
    roles: [BillingAdmin, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID", "Cascade: Project WRAP_UP -> CLOSED -> MaintenancePlan DRAFT -> ACTIVE"]
  - method: PATCH
    path: "/invoices/{id}"
    description: "Transition an invoice (dispute=DISPUTED, resolve=ISSUED)"
    roles: [BillingAdmin, Client]
    code: 200
    input: [status]
    output: Invoice
    side_effects: []

  # --- MaintenancePlan ---
  - method: POST
    path: "/maintenance-plans"
    description: "Create the before/after maintenance plan for a project (1:1, starts DRAFT)"
    roles: [OperationsManager]
    code: 201
    input: [project_id, cadence, monthly_fee_cents, "next_followup_note?"]
    output: MaintenancePlan
    side_effects: ["status=DRAFT", "compute visits_per_year from cadence"]
  - method: GET
    path: "/maintenance-plans"
    description: "List maintenance plans; filter by project"
    roles: [OperationsManager, BillingAdmin, Client]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "MaintenancePlan[]"
    side_effects: []
  - { method: GET, path: "/maintenance-plans/{id}", description: "Get a maintenance plan", roles: [OperationsManager, BillingAdmin, Client], code: 200, input: [], output: MaintenancePlan, side_effects: [] }
  - method: PATCH
    path: "/maintenance-plans/{id}"
    description: "Transition a maintenance plan (CANCELLED)"
    roles: [OperationsManager]
    code: 200
    input: [status]
    output: MaintenancePlan
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed owner mismatch" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, or scheduled_end <= scheduled_start" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Referenced Client id does not exist" }
  - { id: ERR_ORGANIZER_NOT_FOUND, http: 404, condition: "Referenced Organizer id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Referenced Project id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Referenced Session id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Referenced InventoryItem id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Referenced ProductLine id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced Invoice id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced MaintenancePlan id does not exist" }
  - { id: ERR_PROJECT_NOT_IN_SCOPING, http: 409, condition: "activate requires Project in SCOPING" }
  - { id: ERR_SCOPE_EMPTY, http: 409, condition: "activate requires scope_rooms to be non-empty" }
  - { id: ERR_FLAT_PRICE_REQUIRED, http: 409, condition: "activate of a PROJECT-billed project requires flat_price_cents > 0" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Session work requires the parent Project to be ACTIVE" }
  - { id: ERR_PROJECT_TERMINAL, http: 409, condition: "Operation not allowed on a CLOSED or CANCELLED project" }
  - { id: ERR_INVALID_SESSION_TRANSITION, http: 409, condition: "Requested Session status transition not allowed from current state" }
  - { id: ERR_INVALID_ITEM_TRANSITION, http: 409, condition: "Requested InventoryItem transition not allowed from current state" }
  - { id: ERR_DISPOSITION_MISMATCH, http: 409, condition: "schedule target state does not match the item disposition (e.g. DONATE scheduled as haul)" }
  - { id: ERR_INVALID_PRODUCT_TRANSITION, http: 409, condition: "Requested ProductLine transition not allowed from current state" }
  - { id: ERR_INVALID_INVOICE_TRANSITION, http: 409, condition: "Requested Invoice transition not allowed from current state" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "pay requires Invoice in ISSUED (a DISPUTED invoice must be resolved first)" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not equal current Project.version at invoice creation" }
  - { id: ERR_ORGANIZER_DOUBLE_BOOKED, http: 409, condition: "Organizer has an overlapping session within the travel buffer" }
  - { id: ERR_CLIENT_HOME_DOUBLE_BOOKED, http: 409, condition: "Client already has a session on that calendar date" }
  - { id: ERR_UNRESOLVED_SESSIONS, http: 409, condition: "Invoice creation blocked by SCHEDULED/IN_PROGRESS sessions" }
  - { id: ERR_NO_BILLABLE_WORK, http: 422, condition: "Invoice creation has no billable work (HOURLY: zero COMPLETED sessions; PROJECT: flat_price_cents == 0)" }
  - { id: ERR_INVALID_PLAN_TRANSITION, http: 409, condition: "Requested MaintenancePlan transition not allowed from current state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Owns client/organizer setup and project lifecycle (create, activate, cancel, maintenance plan)"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /organizers"
      - "POST /projects"
      - "POST /projects/{id}/activate"
      - "POST /projects/{id}/cancel"
      - "POST /maintenance-plans"
      - "PATCH /maintenance-plans/{id}"
    shared_operations:
      - "POST /sessions (with Organizer)"
      - "PATCH /sessions/{id} (with Organizer)"
      - "PATCH /product-lines/{id} (with Organizer)"
      - "GET reads"

  - name: Organizer
    description: "Field organizer; runs sessions, logs inventory, sources products"
    identity: "entity_backed:Organizer"
    exclusive_operations:
      - "POST /sessions/{id}/complete (must be the assigned organizer)"
      - "POST /inventory-items"
      - "POST /inventory-items/{id}/schedule"
      - "POST /inventory-items/{id}/confirm"
      - "POST /product-lines"
    shared_operations:
      - "POST /sessions (with OperationsManager)"
      - "PATCH /sessions/{id} (with OperationsManager)"
      - "PATCH /product-lines/{id} (with OperationsManager)"
      - "GET reads"

  - name: BillingAdmin
    description: "Owns invoicing"
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices"
    shared_operations:
      - "POST /invoices/{id}/pay (with Client)"
      - "PATCH /invoices/{id} (with Client)"
      - "GET reads"

  - name: Client
    description: "The paying client; reads own resources, pays and disputes invoices"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /invoices/{id}/pay (with BillingAdmin)"
      - "PATCH /invoices/{id} (with BillingAdmin)"
      - "GET reads"
