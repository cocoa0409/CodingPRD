        - ${e_brandcode} == 'ERR_DUPLICATE_RESOURCE_CODE' at HTTP 409 - brand_code is globally unique even with a different name
        - ${e_empcode} == 'ERR_DUPLICATE_RESOURCE_CODE' at HTTP 409 - employee_code is globally unique
        - ${e_store} == 'ERR_DUPLICATE_RESOURCE_CODE' at HTTP 409 - store_number SKWR-014 is already taken inside brand SKWR
        - 'the second brand accepts the same store_number: HTTP 201 with ${l2_store} == ''SKWR-014'' and ${l2} != the first location''s id'
        - GET /locations?brand_id=${brand_id} returns total_count 1 and GET /locations?brand_id=${b2} returns total_count 1
