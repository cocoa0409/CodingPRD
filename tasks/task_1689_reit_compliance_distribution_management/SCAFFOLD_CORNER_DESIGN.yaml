              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "NON_QUALIFYING", amount_cents: 100000, source_is_trs: false, accrued_at: "2026-02-01" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { itr_id: $.data.id }
            - call: "POST /reit-compliance/income-test-reports/${itr_id}/lock"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv_now: $.data.version }
          trigger:
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 1000, declaration_date: "2026-04-01", record_date: "2026-04-10", payable_date: "2026-04-20", expected_reit_version: "${rv_now}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REIT_SUSPENDED (http 409)"

      - name: requirement_close_with_open_dividends_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_DECLARATIONS_OPEN]"]
        distinguishing_aspect: "Closing a POSTED requirement while a sibling dividend is still APPROVED (non-terminal) returns ERR_DECLARATIONS_OPEN; after the dividend is paid the close succeeds with deficiency frozen."
        test_recipe:
          setup: ["Reit R1 ACTIVE with E&P 600000; requirement 2026 POSTED (ti 500000, ncg 0 -> required 450000); dividend 450000 DECLARED (ordinary 450000) but not yet paid"]
