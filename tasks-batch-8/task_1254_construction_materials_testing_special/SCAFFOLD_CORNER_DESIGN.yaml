  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: ssi_approve_occ_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[ssi-approve-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Optimistic concurrency on Project.version: an approve carrying the version observed before another approval advanced it (version 1, now 2) fails 412 ERR_STALE_VERSION; re-reading and resubmitting with version 2 succeeds and supersedes R1."
        test_recipe:
          setup: ["project (version 1) with revisions R1 and R2 both SUBMITTED; client observed version 1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "OCC", permit_number: "P-OCC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, pv1: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: WELD_VISUAL, description: "frames r1", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {r1: $.data.id}
            - call: "POST /api/ssi-revisions/${r1}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4500, scope_items: [ { test_method: WELD_VISUAL, description: "frames r2", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {r2: $.data.id}
            - call: "POST /api/ssi-revisions/${r2}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/ssi-revisions/${r1}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pv1}" }
              as: EngineerOfRecord
              captures: {r1_stat: $.data.status}
            - call: "POST /api/ssi-revisions/${r2}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pv1}" }
              as: EngineerOfRecord
              captures: {err: $.data.error_id}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {pv2: $.data.version}
            - call: "POST /api/ssi-revisions/${r2}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pv2}" }
              as: EngineerOfRecord
              captures: {r2_stat: $.data.status}
          assert:
            - "R1 approve with expected_project_version 1 succeeds (R1 APPROVED, project.version now 2)"
            - "R2 approve with the stale expected_project_version 1: http 412 and error_id == ERR_STALE_VERSION"
            - "R2 approve with the fresh version 2 succeeds: R2 APPROVED and R1 SUPERSEDED"

