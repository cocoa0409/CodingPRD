          The shortest chain in the scaffold and the only one that starts at a CREATE endpoint on
          an unrelated aggregate: pouring a lot increments the pattern wear counter, which trips
          the threshold and marks the pattern WORN (hop 1), which constrains the whole PumpModel
          (hop 2), which then makes an otherwise valid POST /selections fail with
          ERR_MODEL_NOT_ORDERABLE. Nothing in the selection payload is invalid, so the failure is
          only reachable through both hops.
