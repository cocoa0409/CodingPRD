          - errors[ERR_TITLE_NOT_CLEAR]
        distinguishing_aspect: >
          The lot is CATALOG_READY inside a CATALOGED consignment, so only the
          title axis is failing: assignment returns ERR_TITLE_NOT_CLEAR while
          title_status is LIEN_ENCUMBERED and succeeds unchanged once
          lien-release moves it to LIEN_RELEASED.
