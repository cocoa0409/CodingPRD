  # ===========================================================================
  - section: validations
    instances:

      - name: existence_check_runs_before_period_close_check_and_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=30]
          - validations[priority=102]
          - errors[ERR_CONTRACT_NOT_FOUND]
        distinguishing_aspect: "Priority 30 existence beats priority 102 period-closed: assessing an unknown contract for a still-open month returns 404 ERR_CONTRACT_NOT_FOUND, never 422 ERR_PENALTY_PERIOD_NOT_CLOSED."
        test_recipe:
          setup:
            - "One real DRAFT contract exists so a genuine version value can be observed and carried into the request."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so 2026-08 is NOT closed."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Val One", building_address: "1 Val St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-v1", contractor_user_id: "sc-v1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { v1_real_id: $.data.id, v1_real_v: $.data.version }
          trigger:
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", period_month: "2026-08", expected_contract_version: "${v1_real_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_v1: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${e_v1} == \"ERR_CONTRACT_NOT_FOUND\""
            - "${e_v1} != \"ERR_PENALTY_PERIOD_NOT_CLOSED\""
            - "ServiceContract.${v1_real_id}.penalty_lifetime_assessed_cents == 0"

      - name: state_inspector_cannot_create_a_contract_returns_unauthorized
        claim_type: Priority Ordering
        grounds:
          - validations[priority=20]
          - validations[priority=50]
          - errors[ERR_UNAUTHORIZED]
          - roles.StateInspector
        distinguishing_aspect: "Priority 20 authorization beats priority 50 payload validation: a StateInspector posting a contract body that is also missing monthly_base_fee_cents gets 403 ERR_UNAUTHORIZED, not 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Val Two", building_address: "2 Val St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-v2", contractor_user_id: "sc-v2", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: StateInspector
              as_user_id: "si-1"
              captures: { e_v2: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${e_v2} == \"ERR_UNAUTHORIZED\""
            - "${e_v2} != \"ERR_VALIDATION\""
            - "GET /elevator-program/contracts returns an empty array with total_count == 0"

      - name: zero_quantity_beats_the_occ_version_check_on_part_orders
        claim_type: Priority Ordering
        grounds:
          - validations[priority=55]
          - validations[priority=60]
          - errors[ERR_INVALID_QUANTITY]
          - errors[ERR_STALE_CAR_VERSION]
        distinguishing_aspect: "Priority 55 quantity beats priority 60 OCC: a part order with quantity 0 AND a deliberately stale expected_car_version returns 422 ERR_INVALID_QUANTITY, not 412 ERR_STALE_CAR_VERSION."
        test_recipe:
          setup: ["One ACTIVE FULL_MAINTENANCE contract with one car (version 1) and one ACTIVE part."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Val Three", building_address: "3 Val St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-v3", contractor_user_id: "sc-v3", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { v3_id: $.data.id }
            - call: "POST /elevator-program/contracts/${v3_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${v3_id}", car_code: "CAR-V3", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_v3: $.data.id, car_v3_v: $.data.version }
            - call: "POST /elevator-program/parts"
              payload: { part_number: "V3-P", description_text: "Guide shoe", part_class: "WEAR_ITEM", unit_price_cents: 15000, lead_time_days: 6 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { p_v3: $.data.id }
          trigger:
            - call: "POST /elevator-program/part-orders"
              payload: { car_id: "${car_v3}", part_id: "${p_v3}", quantity: 0, expected_car_version: "${car_v3_v} - 1" }
              as: ServiceContractor
              as_user_id: "sc-v3"
              captures: { e_v3: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${e_v3} == \"ERR_INVALID_QUANTITY\""
            - "${e_v3} != \"ERR_STALE_CAR_VERSION\""
            - "ElevatorCar.${car_v3}.open_part_order_count == 0"

      - name: oil_and_grease_contract_cannot_order_a_component_part
        claim_type: Conditional validation
        grounds:
          - validations[priority=90]
          - errors[ERR_SCOPE_EXCLUDES_REPAIR]
          - entities.ServiceContract.fields.scope_type
        distinguishing_aspect: "Under scope_type OIL_AND_GREASE only LUBRICATION-class parts are in scope; a COMPONENT part order returns 422 ERR_SCOPE_EXCLUDES_REPAIR, while the same order under FULL_MAINTENANCE would succeed."
        test_recipe:
          setup: ["One ACTIVE OIL_AND_GREASE contract with one car, one ACTIVE COMPONENT part and one ACTIVE LUBRICATION part."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Val Four", building_address: "4 Val St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-v4", contractor_user_id: "sc-v4", scope_type: "OIL_AND_GREASE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 200000, callback_response_minutes: 90, entrapment_response_minutes: 45, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { v4_id: $.data.id }
            - call: "POST /elevator-program/contracts/${v4_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${v4_id}", car_code: "CAR-V4", car_type: "HYDRAULIC", capacity_lbs: 2000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_v4: $.data.id }
            - call: "POST /elevator-program/parts"
              payload: { part_number: "V4-COMP", description_text: "Selector board", part_class: "COMPONENT", unit_price_cents: 180000, lead_time_days: 15 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { p_v4c: $.data.id }
            - call: "POST /elevator-program/parts"
              payload: { part_number: "V4-LUBE", description_text: "Rail lubricant", part_class: "LUBRICATION", unit_price_cents: 8000, lead_time_days: 4 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { p_v4l: $.data.id }
            - call: "GET /elevator-program/cars/${car_v4}"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-v4"
              captures: { car_v4_v1: $.data.version }
          trigger:
            - call: "POST /elevator-program/part-orders"
              payload: { car_id: "${car_v4}", part_id: "${p_v4c}", quantity: 1, expected_car_version: "${car_v4_v1}" }
              as: ServiceContractor
              as_user_id: "sc-v4"
              captures: { e_v4: $.data.error_id }
            - call: "POST /elevator-program/part-orders"
              payload: { car_id: "${car_v4}", part_id: "${p_v4l}", quantity: 3, expected_car_version: "${car_v4_v1}" }
              as: ServiceContractor
              as_user_id: "sc-v4"
              captures: { o_v4: $.data.id }
          assert:
            - "trigger[0] HTTP status == 422"
            - "${e_v4} == \"ERR_SCOPE_EXCLUDES_REPAIR\""
            - "trigger[1] HTTP status == 201"
            - "PartOrder.${o_v4}.subtotal_cents == 24000"
            - "PartOrder.${o_v4}.promised_date == \"2026-08-05\""
            - "ElevatorCar.${car_v4}.open_part_order_count == 1"

      - name: second_visit_for_the_same_car_and_month_is_rejected_as_duplicate
        claim_type: Violation → Error
        grounds:
          - validations[priority=96]
          - errors[ERR_VISIT_MONTH_DUPLICATE]
