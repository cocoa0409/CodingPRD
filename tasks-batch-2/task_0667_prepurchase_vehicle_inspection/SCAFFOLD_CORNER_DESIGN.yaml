  - section: cross_cutting_concerns
    instances:
      - name: occ_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-order]
          - errors[ERR_STALE_VERSION]
          - endpoints
        distinguishing_aspect: "First assignment-create with expected_order_version=1 succeeds (order version -> 2); a second create still carrying expected_order_version=1 is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A DRAFT order at version 1 (captured); first dispatch offer succeeds and bumps order version to 2."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
