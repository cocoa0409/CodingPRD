  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_redemption_disburse
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FISCAL]
        distinguishing_aspect: |
          Priority conflict between `state` (priority 6, ERR_INVALID_STATE) and
          `business_fiscal` (priority 11, ERR_FISCAL): a disburse call against a
          RedemptionRequest whose status is PENDING (not APPROVED) AND whose
          requested_amount exceeds sum(outstanding) MUST yield ERR_INVALID_STATE,
          not ERR_FISCAL, because state preconditions run first.
        test_recipe:
          setup:
            - "District DIST-I, Member M12, FY9 CLOSED_FINAL with 1 ACTIVE cert C1 face 10000c"
            - "RedemptionRequest R2 for M12 kind=RETIREMENT amount=99999c (exceeds outstanding), still in PENDING"
