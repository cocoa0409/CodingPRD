# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2519 — Offsite Modular Construction Factory & Site Set
#
# Every instance grounds in §1.1–§1.7 of the sibling SCAFFOLD.yaml. Nothing here
# introduces behavior; deleting this file would leave the declared contract
# identical. All nine §0.5 Difficulty Rules are covered with two differentiated
# instances each (18 instances total).
#
# Fixture conventions shared by every recipe below:
#   * the logical clock starts at 2026-08-01T00:00:00Z and is moved to
#     2026-09-01T08:00:00Z as the first setup call
#   * Factory: takt_minutes 90, station_count 6, parallel_station_capacity 2,
#     wip_unit_value_cents 8_750_000, shift window [06:00, 24:00) UTC
#   * Project: WA / SEA, planned_module_count 4, deposit_pct 0.20,
#     retainage_pct 0.05, crane chart 60ft/150000lb, 90ft/96000lb, 120ft/60000lb,
#     crane_rigging_buffer_minutes 45, weather_exposure_limit_hours 8.0
#   * DesignEngineer user ids: eng-001 submits, eng-002 reviews (segregation of duties)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: draw_basis_variant_divergence_wip_deposit_vs_milestone_set
        grounds:
          - calculations.module_wip_earned_cents
          - calculations.draw_certification_amount
          - entities.DrawRequest.fields.basis_mode
          - entities.ModuleUnit.fields.wip_earned_cents
          - endpoints[POST /modular/draw-requests]
        distinguishing_aspect: |
          This is the money-basis dual variant: over one identical module population the
          station_progress variant pro-rates factory work in progress by completed stations and
          then applies the 20% deposit rate, while the milestone_delivered variant ignores
          station_index entirely and pays 100% of unit value for delivered modules only — so the
          same two modules yield 2_333_333 under WIP_DEPOSIT and 8_750_000 under MILESTONE_SET.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z"
            - "Factory PMP1 (takt 90, 6 stations, capacity 2, unit value 8_750_000 cents)"
            - "Project Rainier Flats in WA with a FROZEN design package and a live STATE_MODULAR_PROGRAM / PLAN_REVIEW approval"
            - "module M-01 LINE_COMPLETE (station 6), QC RELEASED, shipped and DELIVERED to site"
            - "module M-02 IN_LINE at station 2, still AT_FACTORY"
            - "InspectionAgency CIS accredited in WA"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 60, capacity_lb: 150000 }, { radius_ft: 90, capacity_lb: 96000 }, { radius_ft: 120, capacity_lb: 60000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE", open_connection_conflicts: 0, field_scope_items_open: 2 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1 released for freeze review" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE", review_note: "factory compatible" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/agencies"
              payload: { name: "Cascade Inspection Services", agency_code: "CIS", accredited_state_codes: ["WA"], per_inspection_fee_cents: 120000 }
              as: ProgramAdmin
              captures: { agency: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600, connection_scope_owner: "FACTORY" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules/${m1}/advance-station"
              payload: { stations_advanced: 6 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-02", set_sequence_index: 2, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600, connection_scope_owner: "FACTORY" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m2: "$.data.id" }
            - call: "POST /modular/modules/${m2}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-03T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules/${m2}/advance-station"
              payload: { stations_advanced: 2 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "IN_PLANT" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { insp_plant: "$.data.id" }
            - call: "POST /modular/inspections/${insp_plant}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "FINAL_FACTORY" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { insp_final: "$.data.id" }
            - call: "POST /modular/inspections/${insp_final}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "HVY-1", route_state_codes: ["WA"], planned_departure_at: "2026-09-05T06:00:00Z", planned_arrival_at: "2026-09-05T16:00:00Z" }
              as: TransportCoordinator
              captures: { ship: "$.data.id", shipv: "$.data.version" }
            - call: "POST /modular/shipments/${ship}/load-module"
              payload: { module_id: "${m1}", expected_shipment_version: "${shipv}" }
              as: TransportCoordinator
            - call: "POST /modular/shipments/${ship}/route-survey"
              payload: { survey_completed_at: "2026-09-04T12:00:00Z", permit_expires_at: "2026-09-20T00:00:00Z", escort_confirmed: false }
              as: TransportCoordinator
            - call: "POST /modular/shipments/${ship}/dispatch"
              payload: { departed_at: "2026-09-05T06:00:00Z" }
              as: TransportCoordinator
            - call: "POST /modular/shipments/${ship}/deliver"
              payload: { arrived_at: "2026-09-05T16:00:00Z" }
              as: TransportCoordinator
          trigger:
            - call: "POST /modular/draw-requests"
              payload: { project_id: "${proj}", draw_index: 1, basis_mode: "WIP_DEPOSIT", certifying_agency_id: "${agency}" }
              as: LenderDrawAdministrator
              captures: { draw_wip: "$.data.id", basis_wip: "$.data.basis_earned_cents", req_wip: "$.data.requested_cents" }
            - call: "POST /modular/draw-requests"
              payload: { project_id: "${proj}", draw_index: 2, basis_mode: "MILESTONE_SET", certifying_agency_id: "${agency}" }
              as: LenderDrawAdministrator
              captures: { draw_ms: "$.data.id", basis_ms: "$.data.basis_earned_cents", req_ms: "$.data.requested_cents" }
          assert:
            - "${basis_wip} == 11666667 — round_half_up(8750000*6/6)=8750000 for M-01 plus round_half_up(8750000*2/6)=2916667 for M-02"
            - "${req_wip} == 2333333 — round_half_up(11666667 * 0.20)"
            - "draw ${draw_wip} basis_module_count == 2"
            - "${basis_ms} == 8750000 — only the DELIVERED module M-01 qualifies, at 100% of unit value"
            - "${req_ms} == 8750000 — milestone draws carry no deposit rate"
            - "draw ${draw_ms} basis_module_count == 1"
            - "the variant delta is 8750000 - 2333333 == 6416667 over identical module data"
            - "GET /modular/modules/${m2} still reports wip_earned_cents == 2916667 — the milestone variant is never written back to the module row"

      - name: defect_allocation_variant_divergence_presumption_vs_evidence
        grounds:
          - calculations.defect_responsibility_allocation
          - state_machines.DefectClaim.ADJUDICATED_to_DISPUTED
          - state_machines.DefectClaim.DISPUTED_to_ADJUDICATED
          - entities.DefectClaim.fields.adjudication_round
          - endpoints[POST /modular/defect-claims/{claimId}/adjudicate]
        distinguishing_aspect: |
          This is the responsibility dual variant, and it diverges on a different axis than the
          money variant: the first pass reads only discovered_phase against a fixed presumption
          table (TRANSIT -> 50/50 SPLIT), while the post-dispute pass discards that table and
          derives the split from an additive evidence score over inspection result, severity and
          connection scope ownership, flipping the same claim to 100/0 FACTORY_WARRANTY.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; Factory PMP1 and Project Rainier Flats as in the shared fixture"
            - "module M-01 LINE_COMPLETE, connection_scope_owner FACTORY"
            - "IN_PLANT inspection PASS, FINAL_FACTORY inspection CONDITIONAL with severity_max 4 (qc_status CONDITIONAL_RELEASE)"
            - "M-01 loaded, permitted and dispatched, so site_status == IN_TRANSIT"
            - "a DefectClaim of 1_234_567 cents discovered in phase TRANSIT, referencing the FINAL_FACTORY inspection"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 60, capacity_lb: 150000 }, { radius_ft: 90, capacity_lb: 96000 }, { radius_ft: 120, capacity_lb: 60000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE", open_connection_conflicts: 0, field_scope_items_open: 2 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1 released for freeze review" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/agencies"
              payload: { name: "Cascade Inspection Services", agency_code: "CIS", accredited_state_codes: ["WA"], per_inspection_fee_cents: 120000 }
              as: ProgramAdmin
              captures: { agency: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600, connection_scope_owner: "FACTORY" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules/${m1}/advance-station"
              payload: { stations_advanced: 6 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "IN_PLANT" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { insp_plant: "$.data.id" }
            - call: "POST /modular/inspections/${insp_plant}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "FINAL_FACTORY" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { insp_final: "$.data.id" }
            - call: "POST /modular/inspections/${insp_final}/record-result"
              payload: { result: "CONDITIONAL", defect_count: 2, severity_max: 4, corrective_note: "sealant rework at marriage wall" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "HVY-1", route_state_codes: ["WA"], planned_departure_at: "2026-09-05T06:00:00Z", planned_arrival_at: "2026-09-05T16:00:00Z" }
              as: TransportCoordinator
              captures: { ship: "$.data.id", shipv: "$.data.version" }
            - call: "POST /modular/shipments/${ship}/load-module"
              payload: { module_id: "${m1}", expected_shipment_version: "${shipv}" }
              as: TransportCoordinator
            - call: "POST /modular/shipments/${ship}/route-survey"
              payload: { survey_completed_at: "2026-09-04T12:00:00Z", permit_expires_at: "2026-09-20T00:00:00Z", escort_confirmed: false }
              as: TransportCoordinator
            - call: "POST /modular/shipments/${ship}/dispatch"
              payload: { departed_at: "2026-09-05T06:00:00Z" }
              as: TransportCoordinator
            - call: "POST /modular/defect-claims"
              payload: { module_id: "${m1}", inspection_id: "${insp_final}", discovered_phase: "TRANSIT", description: "corner shear panel cracked", repair_cost_cents: 1234567 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { claim: "$.data.id" }
          trigger:
            - call: "POST /modular/defect-claims/${claim}/adjudicate"
              payload: { adjudication_note: "phase presumption applied" }
              as: WarrantyAdjudicator
              captures: { r1_factory_pct: "$.data.factory_share_pct", r1_factory_cents: "$.data.factory_charge_cents", r1_field_cents: "$.data.field_charge_cents", r1_bucket: "$.data.warranty_bucket" }
            - call: "POST /modular/defect-claims/${claim}/dispute"
              payload: { dispute_note: "final inspection already flagged this panel CONDITIONAL" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/defect-claims/${claim}/adjudicate"
              payload: { adjudication_note: "evidence weighted" }
              as: WarrantyAdjudicator
              captures: { r2_factory_pct: "$.data.factory_share_pct", r2_field_pct: "$.data.field_share_pct", r2_factory_cents: "$.data.factory_charge_cents", r2_field_cents: "$.data.field_charge_cents", r2_bucket: "$.data.warranty_bucket", r2_round: "$.data.adjudication_round" }
          assert:
            - "${r1_factory_pct} == 50.00 and ${r1_factory_cents} == 617284 and ${r1_field_cents} == 617283 — round_half_up(1234567*50/100)=617284, the field side absorbs the remainder"
            - "${r1_bucket} == 'SPLIT' and responsibility == 'SHARED' after round 1"
            - "${r2_factory_pct} == 100.00 and ${r2_field_pct} == 0.00 — evidence score factory 9 (CONDITIONAL +6, severity_max 4 >= 3 +3) versus field 0"
            - "${r2_factory_cents} == 1234567 and ${r2_field_cents} == 0"
            - "${r2_bucket} == 'FACTORY_WARRANTY' and responsibility == 'FACTORY' and ${r2_round} == 2"
            - "GET /modular/modules/${m1} reports defect_count_factory == 1 and defect_count_field == 0 — counters are stamped after the allocation, never inside it"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_crane_chart_lookup_then_derate_then_cross_multiplication
        grounds:
          - calculations.crane_pick_feasibility
          - entities.Project.fields.crane_capacity_chart
          - entities.ModuleUnit.fields.crane_utilization_pct
          - validations[priority=62]
          - endpoints[POST /modular/modules/{moduleId}/schedule-pick]
        distinguishing_aspect: |
          Mode a is discrete table selection followed by a conditional multiplicative derate: the
          formula picks the SMALLEST chart radius that still covers the pick radius, optionally
          scales that capacity by 0.75, and only then compares an integer cross-product. Its
          difficulty is lookup-plus-derate, not multi-stage rounding (mode b) and not a
          state-dependent parameter (mode c).
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z"
            - "Project with crane chart 60ft/150000lb, 90ft/96000lb, 120ft/60000lb and calm weather (forecast_wind_gust_mph 0)"
            - "module M-01 at 76_600 lb gross, still AT_FACTORY (a pick may be planned before transport)"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 60, capacity_lb: 150000 }, { radius_ft: 90, capacity_lb: 96000 }, { radius_ft: 120, capacity_lb: 60000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /modular/modules/${m1}/schedule-pick"
              payload: { pick_window_start: "2026-09-10T09:00:00Z", pick_window_end: "2026-09-10T09:45:00Z", pick_radius_ft: 75, rigging_weight_lb: 5000 }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { util: "$.data.crane_utilization_pct" }
          assert:
            - "HTTP 200 — a 75 ft radius selects the 90 ft chart row (the smallest radius >= 75), not the 60 ft row"
            - "${util} == 85.00 — (76600 + 5000) * 100 / 96000 rounded half-up to two decimals"
            - "the pick is admitted because 81600 * 100 == 85 * 96000 exactly, and the gate is strict >"
            - "GET /modular/modules/${m1} reports pick_radius_ft == 75 and rigging_weight_lb == 5000"

      - name: mode_b_draw_amount_three_stage_rounding_order
        grounds:
          - calculations.draw_certification_amount
          - calculations.module_wip_earned_cents
          - entities.Project.fields.deposit_pct
          - entities.DrawRequest.fields.retainage_held_cents
          - endpoints[POST /modular/draw-requests/{drawId}/certify]
        distinguishing_aspect: |
          Mode b is a fixed three-stage rounding pipeline — round each module, sum, apply the
          deposit rate and round, apply retainage and round. The observable signature is that the
          per-module rounding remainder survives into the basis: three modules at station 1 give
          3 * 1_458_333 == 4_374_999, one cent below the 4_375_000 a sum-then-round implementation
          produces. No table lookup and no state-dependent parameter is involved.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN design package and live STATE_MODULAR_PROGRAM / PLAN_REVIEW approval"
            - "InspectionAgency CIS, ACCREDITED in WA"
            - "modules M-01, M-02, M-03 each IN_LINE at station 1 on non-overlapping line slots"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 60, capacity_lb: 150000 }, { radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/agencies"
