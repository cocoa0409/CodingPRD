# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Clock default = 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_estimate_vs_reconcile
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.permit_fee_cents
          - entities.PermitApplication.fields.fee_basis
          - state_machines.PostEventReport
        distinguishing_aspect: "Same application; ESTIMATED variant (expected 151/250050c) yields permit_fee 13789, RECONCILED variant (actual 200/300000c) yields 16250, posting a 2461 FEE_ADJUSTMENT — divergent results on the PermitApplication domain."
        test_recipe:
          setup:
            - "Application driven to PERMIT_ISSUED with estimated permit_fee_cents=13789, deposit 20000, balance paid to 0; clock advanced past event_end."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200, indoor: true }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant, captures: { ins: $.data.id } }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter + ID", has_medical_staff: false }, as: Applicant, captures: { sp: $.data.id } }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk, captures: { av0: $.data.version } }
            - { call: "GET /permits/agency-reviews?application_id=${a}", payload: {}, as: PermitClerk, captures: { r0: "$.data[0].id", r1: "$.data[1].id", r2: "$.data[2].id" } }
            - { call: "POST /permits/agency-reviews/${r0}/decide", payload: { decision: "APPROVE", expected_application_version: "${av0}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av1: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r1}/decide", payload: { decision: "APPROVE", expected_application_version: "${av1}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av2: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r2}/decide", payload: { decision: "APPROVE", expected_application_version: "${av2}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
            - { call: "POST /permits/insurance-policies/${ins}/accept", payload: {}, as: PermitClerk }
            - { call: "POST /permits/security-plans/${sp}/approve", payload: {}, as: PermitClerk }
            - { call: "POST /permits/applications/${a}/approve", payload: {}, as: PermitClerk, as_user_id: "clerk-1" }
            - { call: "POST /permits/inspectors", payload: { name: "Ivy Fire", badge_number: "B-1", agency: "FIRE" }, as: PermitClerk, captures: { insp: $.data.id } }
            - { call: "POST /permits/inspections", payload: { application_id: "${a}", inspector_id: "${insp}", scheduled_start: "2026-06-14T10:00:00Z", scheduled_end: "2026-06-14T11:00:00Z" }, as: PermitClerk, captures: { inspn: $.data.id } }
            - { call: "POST /permits/inspections/${inspn}/record-result", payload: { result: "PASSED" }, as: Inspector, as_user_id: "${insp}" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: Applicant, captures: { pv: $.data.version } }
            - { call: "POST /permits/applications/${a}/payments", payload: { amount_cents: 33789, expected_application_version: "${pv}" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/issue-permit", payload: {}, as: PermitClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-16T00:00:00Z" }, as: PermitClerk }
          trigger:
            - { call: "POST /permits/reports", payload: { application_id: "${a}", actual_attendance: 200, gross_sales_cents: 300000, incident_count: 0 }, as: Applicant, captures: { rep: $.data.id } }
          assert:
            - "PostEventReport.${rep}.status == FILED"
            - "PermitApplication.${a}.fee_basis == RECONCILED"
            - "PermitApplication.${a}.permit_fee_cents == 16250"
            - "PermitApplication.${a}.status == EVENT_COMPLETE"
            - "A LedgerEntry with entry_type == FEE_ADJUSTMENT and amount_cents == 2461 exists for application ${a}"
            - "PermitApplication.${a}.balance_due_cents == 2461"

      - name: fine_standard_vs_repeat
        grounds:
          - calculations.violation_penalty
          - entities.Violation.fields.fine_cents
          - entities.Violation.fields.penalty_variant
          - state_machines.Violation
        distinguishing_aspect: "Two CRITICAL violations on the same application: first is STANDARD fine 25000, second is REPEAT fine round_half_up(25000*1.5)=37500 — dual-variant on the Violation domain (distinct entity from the fee dual-variant on PermitApplication)."
        test_recipe:
          setup:
            - "Application APPROVED with one inspection SCHEDULED; ready for the inspector to issue violations."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant, captures: { ins: $.data.id } }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant, captures: { sp: $.data.id } }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk, captures: { av0: $.data.version } }
            - { call: "GET /permits/agency-reviews?application_id=${a}", payload: {}, as: PermitClerk, captures: { r0: "$.data[0].id", r1: "$.data[1].id", r2: "$.data[2].id" } }
            - { call: "POST /permits/agency-reviews/${r0}/decide", payload: { decision: "APPROVE", expected_application_version: "${av0}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av1: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r1}/decide", payload: { decision: "APPROVE", expected_application_version: "${av1}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av2: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r2}/decide", payload: { decision: "APPROVE", expected_application_version: "${av2}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
            - { call: "POST /permits/insurance-policies/${ins}/accept", payload: {}, as: PermitClerk }
            - { call: "POST /permits/security-plans/${sp}/approve", payload: {}, as: PermitClerk }
            - { call: "POST /permits/applications/${a}/approve", payload: {}, as: PermitClerk, as_user_id: "clerk-1" }
            - { call: "POST /permits/inspectors", payload: { name: "Ivy Fire", badge_number: "B-1", agency: "FIRE" }, as: PermitClerk, captures: { insp: $.data.id } }
            - { call: "POST /permits/inspections", payload: { application_id: "${a}", inspector_id: "${insp}", scheduled_start: "2026-06-14T10:00:00Z", scheduled_end: "2026-06-14T11:00:00Z" }, as: PermitClerk, captures: { inspn: $.data.id } }
          trigger:
            - { call: "POST /permits/violations", payload: { inspection_id: "${inspn}", severity: "CRITICAL", description: "Serving after hours" }, as: Inspector, as_user_id: "${insp}", captures: { vio1: $.data.id } }
            - { call: "POST /permits/violations", payload: { inspection_id: "${inspn}", severity: "CRITICAL", description: "Overserving" }, as: Inspector, as_user_id: "${insp}", captures: { vio2: $.data.id } }
          assert:
            - "Violation.${vio1}.penalty_variant == STANDARD"
            - "Violation.${vio1}.fine_cents == 25000"
            - "Violation.${vio2}.penalty_variant == REPEAT"
            - "Violation.${vio2}.fine_cents == 37500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_round_then_sum
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.permit_fee_cents
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (b) nested rounding order: attendance_line=round(151*37.5)=5663 and sales_line=round(250050*0.0125)=3126 rounded per-line then summed with base 5000 gives 13789; sum-then-round of 5000+5662.5+3125.625=13788.125->13788 differs by 1 cent."
        test_recipe:
          setup:
            - "Draft application with expected_attendance=151, requested_sales_limit_cents=250050 and the three required documents present."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
          trigger:
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          assert:
            - "PermitApplication.${a}.permit_fee_cents == 13789"
            - "PermitApplication.${a}.fee_basis == ESTIMATED"
            - "PermitApplication.${a}.deposit_cents == 20000"
            - "PermitApplication.${a}.balance_due_cents == 33789"

      - name: security_guards_multifactor
        grounds:
          - calculations.required_security_guards
          - entities.SecurityPlan.fields.required_guard_count
          - entities.PermitApplication.fields.expected_attendance
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: base=ceil(180/75)=3, duration_bonus(6>5)=1, high_occupancy_bonus(180>=200*0.90)=1, max(2, 3+1+1)=5 — combines ceil, two conditionals, and a floor, unlike the round-then-sum fee (mode b)."
        test_recipe:
          setup:
            - "Venue occupancy_limit=200; application expects 180 attendees over 6 alcohol-service hours."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Big Barn", address: "9 Barn Ln", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rodeo Co", event_name: "Hoedown", event_start: "2026-07-01T16:00:00Z", event_end: "2026-07-01T22:00:00Z", alcohol_service_hours: 6, expected_attendance: 180, requested_sales_limit_cents: 400000 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 5, plan_summary: "Barn perimeter" }, as: Applicant, captures: { sp: $.data.id } }
          assert:
            - "SecurityPlan.${sp}.required_guard_count == 5"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISIONS_REQUESTED
          - state_machines.PermitApplication.REVISIONS_REQUESTED_to_UNDER_REVIEW
          - entities.PermitApplication.fields.status
        distinguishing_aspect: "PermitApplication is cyclic: UNDER_REVIEW -> REVISIONS_REQUESTED -> UNDER_REVIEW returns to an already-visited state (a genuine cycle, not a linear pipeline)."
        test_recipe:
          setup:
            - "Application in UNDER_REVIEW with 3 PENDING agency reviews."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk }
          trigger:
            - { call: "POST /permits/applications/${a}/request-revisions", payload: {}, as: PermitClerk }
            - { call: "POST /permits/applications/${a}/resubmit", payload: {}, as: Applicant }
          assert:
            - "PermitApplication.${a}.status == UNDER_REVIEW"
            - "PermitApplication.${a}.pending_review_count == 3"

      - name: agency_review_conditional_branch
        grounds:
          - state_machines.AgencyReview.PENDING_to_APPROVED_WITH_CONDITIONS
          - entities.AgencyReview.fields.conditions
          - entities.PermitApplication.fields.has_conditions
        distinguishing_aspect: "AgencyReview forks PENDING -> {APPROVED, REJECTED, APPROVED_WITH_CONDITIONS}; the APPROVE_WITH_CONDITIONS branch has a divergent side-effect set (sets application.has_conditions=true and stores conditions text) absent from plain APPROVE — a different entity from the cyclic PermitApplication."
        test_recipe:
          setup:
            - "Application UNDER_REVIEW with 3 PENDING reviews; version captured from open-review."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk, captures: { av0: $.data.version } }
            - { call: "GET /permits/agency-reviews?application_id=${a}", payload: {}, as: PermitClerk, captures: { r0: "$.data[0].id" } }
          trigger:
            - { call: "POST /permits/agency-reviews/${r0}/decide", payload: { decision: "APPROVE_WITH_CONDITIONS", conditions: "No glass bottles", expected_application_version: "${av0}" }, as: AgencyReviewer, as_user_id: "rev-1" }
          assert:
            - "AgencyReview.${r0}.status == APPROVED_WITH_CONDITIONS"
            - "AgencyReview.${r0}.conditions == 'No glass bottles'"
            - "PermitApplication.${a}.has_conditions == true"
            - "PermitApplication.${a}.approved_review_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_revokes_and_forfeits
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.PermitApplication.APPROVED_to_REVOKED
          - entities.PermitApplication.fields.deposit_status
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "Depth-3 cascade: record-result FAILED mutates Inspection (link1) -> Inspection FAILED drives application APPROVED->REVOKED (link2) -> the REVOKED transition posts a DEPOSIT_FORFEIT LedgerEntry that flips deposit_status to FORFEITED (link3); each link is caused by the prior one."
        test_recipe:
          setup:
            - "Application APPROVED, balance fully paid (deposit held), inspection SCHEDULED."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant, captures: { ins: $.data.id } }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant, captures: { sp: $.data.id } }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk, captures: { av0: $.data.version } }
            - { call: "GET /permits/agency-reviews?application_id=${a}", payload: {}, as: PermitClerk, captures: { r0: "$.data[0].id", r1: "$.data[1].id", r2: "$.data[2].id" } }
            - { call: "POST /permits/agency-reviews/${r0}/decide", payload: { decision: "APPROVE", expected_application_version: "${av0}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av1: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r1}/decide", payload: { decision: "APPROVE", expected_application_version: "${av1}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av2: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r2}/decide", payload: { decision: "APPROVE", expected_application_version: "${av2}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
            - { call: "POST /permits/insurance-policies/${ins}/accept", payload: {}, as: PermitClerk }
            - { call: "POST /permits/security-plans/${sp}/approve", payload: {}, as: PermitClerk }
            - { call: "POST /permits/applications/${a}/approve", payload: {}, as: PermitClerk, as_user_id: "clerk-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: Applicant, captures: { pv: $.data.version } }
            - { call: "POST /permits/applications/${a}/payments", payload: { amount_cents: 33789, expected_application_version: "${pv}" }, as: Applicant }
            - { call: "POST /permits/inspectors", payload: { name: "Ivy Fire", badge_number: "B-1", agency: "FIRE" }, as: PermitClerk, captures: { insp: $.data.id } }
            - { call: "POST /permits/inspections", payload: { application_id: "${a}", inspector_id: "${insp}", scheduled_start: "2026-06-14T10:00:00Z", scheduled_end: "2026-06-14T11:00:00Z" }, as: PermitClerk, captures: { inspn: $.data.id } }
          trigger:
            - { call: "POST /permits/inspections/${inspn}/record-result", payload: { result: "FAILED" }, as: Inspector, as_user_id: "${insp}" }
          assert:
            - "Inspection.${inspn}.result == FAILED"
            - "PermitApplication.${a}.status == REVOKED"
