      - name: event_disclosure_requires_an_approved_current_report_document_on_the_same_cycle
        grounds:
          - state_machines.MaterialEvent.REPORTABLE_to_DISCLOSED
          - state_machines.DraftDocument.IN_REVIEW_to_APPROVED
          - calculations.material_event_severity_and_deadline
          - validations[priority=36]
          - errors.ERR_FILING_DOCUMENT_INVALID
