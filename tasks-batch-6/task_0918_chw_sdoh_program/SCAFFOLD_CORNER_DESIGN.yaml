              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/en-route"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/complete"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-02", direct_minutes: 60, indirect_minutes: 0, travel_minutes: 0, documentation_minutes: 0 }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { err_bill: $.data.error_id }
            - call: "GET /chw/reports/program-summary"
              payload: { service_month: "2026-06", denominator_basis: "ENROLLED_ONLY" }
              as: ResourcePartner
              as_user_id: "${org1}"
              captures: { err_partner: $.data.error_id }
            - call: "POST /chw/home-visits/${v1}/attest"
              payload: { visit_note: "Attempted by an administrator" }
              as: ProgramAdmin
              captures: { err_admin: $.data.error_id }
          assert:
            - "${err_bill} == ERR_FORBIDDEN_ROLE with HTTP status 403"
            - "${err_partner} == ERR_FORBIDDEN_ROLE with HTTP status 403"
            - "${err_admin} == ERR_FORBIDDEN_ROLE with HTTP status 403"
            - "GET /chw/encounters with patient_id=${p1} returns total_count == 0"
            - "HomeVisit.${v1}.documentation_status == DRAFT"

  # =========================================================================
  # SECTION: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: patient_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Patient.fields.enrollment_status
          - entities.Patient.fields.gate_status
          - concurrency_rules[screening-create-stale-patient]
        distinguishing_aspect: "Patient.version starts at 1 and advances by exactly one on each mutation: PATCH ENROLL takes it to 2, records-hold PLACE to 3, records-hold RELEASE to 4 — which is what makes expected_patient_version a usable OCC token."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one freshly created Patient at version 1."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-064" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C64", full_name: "Version Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, v_create: $.data.version }
          trigger:
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { v_enroll: $.data.version }
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "PLACE", reason: "Consent withdrawn" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { v_hold: $.data.version }
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "RELEASE" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { v_release: $.data.version }
          assert:
            - "${v_create} == 1"
            - "${v_enroll} == 2"
            - "${v_hold} == 3"
            - "${v_release} == 4"
            - "Patient.${p1}.gate_status == OPEN"
            - "Patient.${p1}.gate_reason == null"
            - "Patient.${p1}.enrollment_status == ENROLLED"

      - name: cm_extended_code_at_exactly_120_minutes
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.billable_minutes_monthly_rollup
          - entities.PayerClaim.fields.billing_code
        distinguishing_aspect: "The extended code threshold is >= 120: two 60-minute encounters sum to exactly 120 and select CM-120 with units 8 and allowed_amount_cents 17200, whereas 78 minutes in the same month would have selected CM-60."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "Two SUBMITTED June encounters, each with billable_minutes 60."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-065" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C65", full_name: "Extended Code Case", household_size: 1, monthly_income_cents: 80000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-05", direct_minutes: 45, indirect_minutes: 10, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-06", direct_minutes: 45, indirect_minutes: 10, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e2: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e2}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${p1}", service_month: "2026-06", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl: $.data.id }
          assert:
            - "PayerClaim.${cl}.claimed_minutes == 120"
            - "PayerClaim.${cl}.billing_code == CM-120"
            - "PayerClaim.${cl}.units == 8"
            - "PayerClaim.${cl}.allowed_amount_cents == 17200"
            - "PayerClaim.${cl}.claimed_encounter_count == 2"
            - "Encounter.${e1}.status == LOCKED and Encounter.${e2}.status == LOCKED"

      - name: offering_version_advances_on_every_inventory_movement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[referral-create-stale-offering]
          - entities.ResourceOffering.fields.allocated_units
        excluded_because:
          difficulty_instance: stale_offering_version_on_referral_create_rejected
          rationale: "That corner instance is itself the OCC probe; the version advance is what makes its second create fail with 412."

  # =========================================================================
  # SECTION: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - state_machines.Patient.OPEN_to_RECORDS_HOLD
          - conservation_invariants.offering_unit_conservation
        excluded_because:
          difficulty_instance: records_hold_depth_five_cascade_to_escalation_auto_resolution
          rationale: "Every one of that instance's five cascade links is asserted immediately after the single triggering request, with no intermediate call, which is exactly the immediate-consistency claim."

      - name: compensating_action_leaves_no_drift_in_derived_totals
        claim_type: immediate
        grounds:
          - conservation_invariants.grant_budget_conservation
        excluded_because:
          difficulty_instance: grant_line_post_then_reverse_conserves_budget_cents
          rationale: "That instance asserts committed_cents 0 and remaining_budget_cents 200000 immediately after the reversal call returns."
