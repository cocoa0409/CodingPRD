# =============================================================================
# PRD Benchmark Scaffold — task_2259_teaching_artist_roster_school_residencies
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2259. Teaching Artist Roster & School Residencies (arts education organization): teaching artist recruitment with portfolio review, teaching demonstration and background screening, roster management with discipline, grade level and language capability tagging, school partnership development with residency scope, session counts and classroom teacher collaboration expectations, curriculum alignment to state arts standards with lesson plan review and adaptation, scheduling across school calendars with substitute coverage and make-up session policies, artist payment structure per session with travel and materials reimbursement, program evaluation through student work, teacher surveys and observation rubrics, funder reporting on students served and demographic reach

domain_name: teaching-artist-residencies

# Flat topology: every entity is a peer collection at the API root. Nested paths
# appear only as read sub-resources and as action verbs on a single resource.
api_prefix: "/"

complexity_profile:
  difficulty_level: expert_plus   # 12 entities / 46 endpoints / 54 errors / 16 calculations / 7 state-machine axes — deliberately above the §0.4 Expert band caps (15 / 32 / 30)
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Residency.version, Session.version, PaymentVoucher.version (§1.2.1)
    - cascading_side_effects        # 4-hop screening cascade and 4-hop no-show cascade (§1.2)
    - dual_variant_calculation      # residency cost outlook, artist reliability, funder headcount basis
    - derived_field_reconciliation  # residency ledgers, staffing_status, school partnership_health, report staleness

  entity_topology: flat
  state_machine_shape: parallel
  # TeachingArtist carries two independent axes (vetting_status × roster_status);
  # PaymentVoucher carries two independent review tracks that join into APPROVED;
  # LessonPlan and Session both contain revision cycles.

  relationship_patterns:
    - one_to_many          # SchoolPartner→Residency, Residency→Session, Session→EvaluationRecord
    - many_to_many         # PaymentVoucher.session_ids, FunderReport.scope_residency_ids
    - self_referential     # Session.makeup_for_session_id -> Session.id
    - cross_aggregate      # PaymentVoucher spans TeachingArtist + Residency + Session

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: SchoolPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School name", constraints: "1..120 chars" }
      - { name: district_name, type: string, source: input, description: "District the school belongs to" }
      - { name: grade_span, type: string, source: input, description: "Human-readable grade span label, e.g. 'K-8'" }
      - { name: concurrent_session_capacity, type: integer, source: input, description: "Number of arts-capable rooms; maximum number of residency sessions whose time intervals may overlap at this school", constraints: ">= 1" }
      - { name: total_enrollment, type: integer, source: input, description: "Total student enrollment, used for funder demographic reach", constraints: ">= 1" }
      - { name: frl_pct, type: number, source: input, description: "Free/reduced lunch share of enrollment", constraints: "0.00..1.00, 2 decimals" }
      - { name: ell_pct, type: number, source: input, description: "English-language-learner share of enrollment", constraints: "0.00..1.00, 2 decimals" }
      - { name: iep_pct, type: number, source: input, description: "IEP share of enrollment", constraints: "0.00..1.00, 2 decimals" }
      - { name: partnership_health, type: enum, source: computed, description: "HEALTHY | WATCH | INTAKE_SUSPENDED — recomputed from this school's residencies by calculations.school_partnership_health", default: HEALTHY, constraints: "HEALTHY | WATCH | INTAKE_SUSPENDED" }
      - { name: open_residency_count, type: integer, source: computed, description: "Count of residencies of this school with status IN {DRAFT, APPROVED, ACTIVE, SUSPENDED}", default: 0 }

  - name: CalendarBlackout
    parent: SchoolPartner
    common_fields: false
    fields:
      - { name: school_partner_id, type: string, source: system, description: "FK -> SchoolPartner.id; taken from the path, never from the body" }
      - { name: blackout_type, type: enum, source: input, description: "HOLIDAY | TESTING_WINDOW | PROFESSIONAL_DEVELOPMENT | CLOSURE", constraints: "HOLIDAY | TESTING_WINDOW | PROFESSIONAL_DEVELOPMENT | CLOSURE" }
      - { name: start_date, type: string, source: input, description: "First blacked-out instructional date (ISO 8601 date)", constraints: "YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last blacked-out instructional date, INCLUSIVE (closed interval [start_date, end_date])", constraints: "YYYY-MM-DD, >= start_date" }
      - { name: note, type: string, source: input, description: "Free-text note", default: null }

  - name: TeachingArtist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Artist full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across TeachingArtist" }
      - { name: primary_discipline, type: enum, source: input, description: "VISUAL_ARTS | DANCE | MUSIC | THEATER | MEDIA_ARTS | LITERARY_ARTS", constraints: "VISUAL_ARTS | DANCE | MUSIC | THEATER | MEDIA_ARTS | LITERARY_ARTS" }
      - { name: secondary_disciplines, type: array, source: input, description: "Additional disciplines the artist may teach; same enum domain as primary_discipline", default: [] }
      - { name: grade_bands, type: array, source: input, description: "Grade bands the artist is rostered for; elements from K_2 | G3_5 | G6_8 | G9_12", constraints: "non-empty" }
      - { name: languages, type: array, source: input, description: "ISO 639-1 codes the artist can deliver instruction in; MUST contain 'en' or the instruction language of any residency they are assigned to", constraints: "non-empty, lowercase 2-letter codes" }
      - { name: roster_tier_assigned, type: enum, source: input, description: "Juried roster placement set at intake: APPRENTICE | TEACHING_ARTIST | MASTER", default: TEACHING_ARTIST, constraints: "APPRENTICE | TEACHING_ARTIST | MASTER" }
      - { name: roster_tier_effective, type: enum, source: computed, description: "Tier actually used by calculations.session_fee; see calculations.artist_roster_tier", default: TEACHING_ARTIST, constraints: "APPRENTICE | TEACHING_ARTIST | MASTER" }
      - { name: vetting_status, type: enum, source: system, description: "Recruitment axis: APPLIED | PORTFOLIO_REVIEW | DEMO_SCHEDULED | DEMO_FAILED | DEMO_PASSED | SCREENING_PENDING | CLEARED | DECLINED | SCREEN_FAILED", default: APPLIED }
      - { name: roster_status, type: enum, source: system, description: "Roster axis, independent of vetting_status: NOT_LISTED | ACTIVE | PROBATION | SUSPENDED | RETIRED", default: NOT_LISTED }
      - { name: portfolio_review_count, type: integer, source: computed, description: "Count of PortfolioReview rows for this artist from distinct reviewer_user_id values", default: 0 }
      - { name: portfolio_mean_composite, type: number, source: computed, description: "Mean of PortfolioReview.composite_score over all reviews of this artist, round_half_up to 2 decimals; null when no reviews exist", default: null }
      - { name: demo_attempt_count, type: integer, source: computed, description: "Number of times vetting_status has entered DEMO_SCHEDULED", default: 0 }
      - { name: demo_rubric_score, type: number, source: system, description: "Score of the most recent teaching demonstration, 1.0..5.0", default: null }
      - { name: demo_evaluator_user_id, type: string, source: system, description: "X-User-ID of the operator who recorded the most recent demonstration outcome; opaque operator id, not an entity id", default: null }
      - { name: clearance_status, type: enum, source: computed, description: "NONE | CLEARED | EXPIRED — see calculations.artist_clearance_window", default: NONE, constraints: "NONE | CLEARED | EXPIRED" }
      - { name: clearance_expires_on, type: string, source: computed, description: "Earliest expires_on among the latest CLEARED screening of each required screening_type; null when the set is incomplete", default: null }
      - { name: lifetime_delivered_count, type: integer, source: computed, description: "Count of Session rows with assigned_artist_id = this artist and status = DELIVERED", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of Session rows with status = CANCELLED_ARTIST and cancel_reason = ARTIST_NO_SHOW whose vacated_artist_id or assigned_artist_id is this artist", default: 0 }
      - { name: reliability_bps_rolling, type: integer, source: computed, description: "Reliability in basis points over the RELIABILITY_WINDOW most recent terminal sessions (variant rolling_window of calculations.artist_reliability_score)", default: 10000 }
      - { name: reliability_bps_program_year, type: integer, source: computed, description: "Reliability in basis points over every terminal session in the current program year (variant program_year_cumulative)", default: 10000 }

  - name: PortfolioReview
    parent: TeachingArtist
    common_fields: false
    fields:
      - { name: teaching_artist_id, type: string, source: system, description: "FK -> TeachingArtist.id; taken from the path" }
      - { name: reviewer_user_id, type: string, source: input, description: "Opaque operator id of the panelist who scored the portfolio; MUST be distinct per review for a given artist" }
      - { name: artistic_quality_score, type: number, source: input, description: "Panel score for artistic quality", constraints: "1.0..5.0 in 0.1 steps" }
      - { name: pedagogical_clarity_score, type: number, source: input, description: "Panel score for pedagogical clarity", constraints: "1.0..5.0 in 0.1 steps" }
      - { name: cultural_responsiveness_score, type: number, source: input, description: "Panel score for cultural responsiveness", constraints: "1.0..5.0 in 0.1 steps" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite, see calculations.portfolio_composite; 2 decimals" }
      - { name: recommendation, type: enum, source: computed, description: "ADVANCE when composite_score >= PORTFOLIO_ADVANCE_THRESHOLD, else DECLINE", constraints: "ADVANCE | DECLINE" }

  - name: BackgroundScreening
    parent: TeachingArtist
    common_fields: false
    fields:
      - { name: teaching_artist_id, type: string, source: system, description: "FK -> TeachingArtist.id; taken from the path" }
      - { name: screening_type, type: enum, source: input, description: "STATE_CRIMINAL | FBI_FINGERPRINT | CHILD_ABUSE_REGISTRY", constraints: "STATE_CRIMINAL | FBI_FINGERPRINT | CHILD_ABUSE_REGISTRY" }
      - { name: outcome, type: enum, source: input, description: "CLEARED | FAILED", constraints: "CLEARED | FAILED" }
      - { name: effective_on, type: string, source: input, description: "Date the screening result took effect (ISO 8601 date)", constraints: "YYYY-MM-DD" }
      - { name: expires_on, type: string, source: input, description: "Date the clearance lapses, INCLUSIVE; required when outcome = CLEARED, MUST be null when outcome = FAILED", default: null, constraints: "YYYY-MM-DD, > effective_on" }
      - { name: adjudication_note, type: string, source: input, description: "Adjudication note recorded by the roster coordinator", default: null }
      - { name: superseded, type: boolean, source: computed, description: "true when a later screening of the same screening_type exists for this artist (later = greater effective_on, created_at ASC as tie-break)", default: false }

  - name: ArtsStandard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "State arts standard code, unique across ArtsStandard, e.g. 'DA:Cr1.1.4'", constraints: "unique, 3..24 chars" }
      - { name: discipline, type: enum, source: input, description: "Discipline the standard belongs to; same enum domain as TeachingArtist.primary_discipline" }
      - { name: grade_band, type: enum, source: input, description: "K_2 | G3_5 | G6_8 | G9_12", constraints: "K_2 | G3_5 | G6_8 | G9_12" }
      - { name: strand, type: enum, source: input, description: "CREATING | PERFORMING | RESPONDING | CONNECTING", constraints: "CREATING | PERFORMING | RESPONDING | CONNECTING" }
      - { name: description, type: string, source: input, description: "Standard text" }

  - name: Residency
    parent: null
    common_fields: true
    fields:
      - { name: school_partner_id, type: string, source: input, description: "FK -> SchoolPartner.id; the host school" }
      - { name: lead_artist_id, type: string, source: system, description: "FK -> TeachingArtist.id; lead teaching artist, set by POST /residencies/{id}/lead-artist, cleared to null when that artist is suspended", default: null }
      - { name: title, type: string, source: input, description: "Residency title" }
      - { name: discipline, type: enum, source: input, description: "Residency discipline; same enum domain as TeachingArtist.primary_discipline" }
      - { name: grade_band, type: enum, source: input, description: "K_2 | G3_5 | G6_8 | G9_12", constraints: "K_2 | G3_5 | G6_8 | G9_12" }
      - { name: instruction_language, type: string, source: input, description: "ISO 639-1 code instruction is delivered in", default: "en", constraints: "lowercase 2-letter code" }
      - { name: contracted_session_count, type: integer, source: input, description: "Total sessions the partnership agreement obliges; upper bound of the session ledger", constraints: "1..60" }
      - { name: session_length_minutes, type: integer, source: input, description: "Scheduled length of one session", constraints: "30..120, multiple of 5" }
      - { name: budget_cents, type: integer, source: input, description: "Total residency budget in cents; upper bound of the money ledger", constraints: ">= 1" }
      - { name: materials_stipend_cents, type: integer, source: input, description: "Materials stipend earmarked for the residency (informational; per-session reimbursement is capped by MATERIALS_CAP_CENTS_PER_SESSION)", default: 0 }
      - { name: collaboration_expectation, type: enum, source: input, description: "CO_TEACH | OBSERVE | PLANNING_ONLY — classroom-teacher collaboration expectation", constraints: "CO_TEACH | OBSERVE | PLANNING_ONLY" }
      - { name: co_planning_hours_required, type: integer, source: input, description: "Co-planning hours the classroom teacher owes per residency", default: 0, constraints: "0..20" }
      - { name: required_strands, type: array, source: input, description: "Strands the aligned lesson plan set MUST cover; elements from CREATING | PERFORMING | RESPONDING | CONNECTING", constraints: "non-empty" }
      - { name: term_start_date, type: string, source: input, description: "First date a session may be scheduled on (inclusive)", constraints: "YYYY-MM-DD" }
      - { name: term_end_date, type: string, source: input, description: "Last date a session may be scheduled on (inclusive)", constraints: "YYYY-MM-DD, >= term_start_date" }
      - { name: enrolled_student_count, type: integer, source: input, description: "Unduplicated students enrolled in the residency; the UNDUPLICATED headcount basis of funder reporting", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | ACTIVE | SUSPENDED | COMPLETED | CLOSED | CANCELLED", default: DRAFT }
      - { name: staffing_status, type: enum, source: computed, description: "STAFFED | AT_RISK | LEAD_VACANT — see calculations.residency_staffing_status", default: LEAD_VACANT, constraints: "STAFFED | AT_RISK | LEAD_VACANT" }
      - { name: sessions_unscheduled_count, type: integer, source: computed, description: "Remaining contracted allotment not yet turned into a Session row; decremented by REGULAR session creation, restored to 0 on COMPLETED", default: 0 }
      - { name: sessions_open_count, type: integer, source: computed, description: "Count of this residency's sessions with status IN {PLANNED, CONFIRMED, VACATED}", default: 0 }
      - { name: sessions_delivered_count, type: integer, source: computed, description: "Count of this residency's sessions with status = DELIVERED", default: 0 }
      - { name: sessions_forfeited_count, type: integer, source: computed, description: "Count of this residency's cancelled sessions with makeup_eligible = false, plus allotment forfeited at COMPLETED", default: 0 }
      - { name: makeup_credits_outstanding, type: integer, source: computed, description: "Count of this residency's cancelled sessions with makeup_eligible = true AND makeup_consumed = false", default: 0 }
      - { name: vacated_session_count, type: integer, source: computed, description: "Count of this residency's sessions with status = VACATED", default: 0 }
      - { name: encumbered_cents, type: integer, source: computed, description: "Money committed but not disbursed; see calculations.residency_budget_ledger", default: 0 }
      - { name: disbursed_cents, type: integer, source: computed, description: "Money paid out through APPROVED payment vouchers", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "= budget_cents - encumbered_cents - disbursed_cents", default: 0 }
      - { name: earned_to_date_cents, type: integer, source: computed, description: "Variant earned_to_date of calculations.residency_cost_outlook", default: 0 }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Variant projected_completion of calculations.residency_cost_outlook", default: 0 }
      - { name: evaluation_index, type: number, source: computed, description: "Program evaluation index 0.0..100.0, see calculations.residency_evaluation_index; null when no evaluation data exists", default: null }

  - name: LessonPlan
    parent: Residency
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id" }
      - { name: author_artist_id, type: string, source: system, description: "FK -> TeachingArtist.id; the artist credited as author (X-User-ID when authored by a TeachingArtist, otherwise the residency's lead_artist_id)" }
      - { name: title, type: string, source: input, description: "Lesson plan title" }
      - { name: session_sequence_no, type: integer, source: input, description: "Position of this plan in the residency arc; unique per residency", constraints: "1..60" }
      - { name: standard_codes, type: array, source: input, description: "State arts standards covered; each element MUST equal the code of an existing ArtsStandard row (ArtsStandard.code is unique); duplicates within the array are rejected", constraints: "non-empty" }
      - { name: materials_list, type: string, source: input, description: "Materials the plan requires", default: null }
      - { name: adaptation_summary, type: string, source: input, description: "How the plan was adapted after the last review round", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CHANGES_REQUESTED | ALIGNED | ARCHIVED", default: SUBMITTED }
      - { name: revision_round, type: integer, source: computed, description: "Number of completed review rounds; incremented when a review returns CHANGES_REQUESTED", default: 0 }
      - { name: covered_strands, type: array, source: computed, description: "Distinct ArtsStandard.strand values of the rows whose code appears in standard_codes" }
      - { name: reviewer_note, type: string, source: system, description: "Note left by the curriculum specialist on the most recent review", default: null }
      - { name: reviewer_user_id, type: string, source: system, description: "Opaque operator id of the most recent reviewer", default: null }
      - { name: aligned_on, type: datetime, source: system, description: "Logical-clock timestamp when status became ALIGNED", default: null }

  - name: Session
    parent: Residency
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id" }
      - { name: assigned_artist_id, type: string, source: input, description: "FK -> TeachingArtist.id; set to null when the session is VACATED", default: null }
      - { name: vacated_artist_id, type: string, source: system, description: "FK -> TeachingArtist.id; the artist who held the session before it was vacated", default: null }
      - { name: lesson_plan_id, type: string, source: input, description: "FK -> LessonPlan.id; the plan taught in this session", default: null }
      - { name: makeup_for_session_id, type: string, source: input, description: "FK -> Session.id; set only when session_type = MAKEUP, pointing at the cancelled session whose credit this session consumes", default: null }
      - { name: payment_voucher_id, type: string, source: system, description: "FK -> PaymentVoucher.id; set when a voucher claims this session, cleared when that voucher is REJECTED or VOIDED", default: null }
      - { name: session_type, type: enum, source: input, description: "REGULAR | MAKEUP", default: REGULAR, constraints: "REGULAR | MAKEUP" }
      - { name: is_substitute, type: boolean, source: system, description: "true once POST /sessions/{id}/reassign has swapped the artist; drives SUBSTITUTE_RATE_PCT in calculations.session_fee", default: false }
      - { name: session_date, type: string, source: input, description: "Instructional date (ISO 8601 date)", constraints: "YYYY-MM-DD" }
      - { name: start_time, type: string, source: input, description: "Local start time, half-open interval start", constraints: "HH:MM, 24h, minute multiple of 5" }
      - { name: end_time, type: string, source: input, description: "Local end time, EXCLUSIVE bound of the half-open interval [start_time, end_time)", constraints: "HH:MM, > start_time" }
      - { name: classroom_teacher_name, type: string, source: system, description: "Collaborating classroom teacher recorded at confirmation", default: null }
      - { name: co_planning_completed, type: boolean, source: system, description: "Whether co-planning happened before confirmation", default: false }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | VACATED | DELIVERED | CANCELLED_SCHOOL | CANCELLED_ARTIST", default: PLANNED }
      - { name: cancel_reason, type: enum, source: system, description: "SCHOOL_CLOSURE | TESTING_CONFLICT | LOW_ENROLLMENT | ARTIST_ILLNESS | ARTIST_NO_SHOW | RESIDENCY_DESCOPED", default: null }
      - { name: makeup_eligible, type: boolean, source: computed, description: "true when cancel_reason IN {SCHOOL_CLOSURE, TESTING_CONFLICT, ARTIST_ILLNESS, ARTIST_NO_SHOW}; false when cancel_reason IN {LOW_ENROLLMENT, RESIDENCY_DESCOPED}", default: false }
      - { name: makeup_consumed, type: boolean, source: computed, description: "true once a MAKEUP session with makeup_for_session_id = this id has been created", default: false }
      - { name: students_present_count, type: integer, source: system, description: "Headcount recorded at delivery", default: null }
      - { name: minutes_delivered, type: integer, source: system, description: "Minutes actually taught, recorded at delivery", default: null }
      - { name: travel_miles, type: number, source: system, description: "One-way-adjusted reimbursable mileage recorded at delivery, 1 decimal", default: null }
      - { name: materials_spend_cents, type: integer, source: system, description: "Out-of-pocket materials spend recorded at delivery", default: null }
      - { name: encumbered_cents, type: integer, source: computed, description: "Amount this session currently holds against Residency.encumbered_cents", default: 0 }
      - { name: fee_cents, type: integer, source: computed, description: "Artist session fee, see calculations.session_fee; set at delivery", default: null }
      - { name: travel_reimbursement_cents, type: integer, source: computed, description: "Per-session travel reimbursement, see calculations.session_reimbursement", default: null }
      - { name: materials_reimbursement_cents, type: integer, source: computed, description: "Per-session materials reimbursement, capped at MATERIALS_CAP_CENTS_PER_SESSION", default: null }
      - { name: payable_cents, type: integer, source: computed, description: "= fee_cents + travel_reimbursement_cents + materials_reimbursement_cents", default: null }

  - name: EvaluationRecord
    parent: Session
    common_fields: false
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id; taken from the path" }
      - { name: evaluation_type, type: enum, source: input, description: "OBSERVATION_RUBRIC | TEACHER_SURVEY | STUDENT_WORK_SAMPLE", constraints: "OBSERVATION_RUBRIC | TEACHER_SURVEY | STUDENT_WORK_SAMPLE" }
      - { name: evaluator_user_id, type: string, source: input, description: "Opaque operator id of the evaluator" }
      - { name: rubric_engagement_score, type: integer, source: input, description: "Observation rubric — student engagement; required when evaluation_type = OBSERVATION_RUBRIC, else MUST be null", default: null, constraints: "1..4" }
      - { name: rubric_craft_score, type: integer, source: input, description: "Observation rubric — artistic craft; required when evaluation_type = OBSERVATION_RUBRIC, else MUST be null", default: null, constraints: "1..4" }
      - { name: rubric_standards_evidence_score, type: integer, source: input, description: "Observation rubric — evidence of standards; required when evaluation_type = OBSERVATION_RUBRIC, else MUST be null", default: null, constraints: "1..4" }
      - { name: teacher_survey_score, type: integer, source: input, description: "Classroom teacher satisfaction; required when evaluation_type = TEACHER_SURVEY, else MUST be null", default: null, constraints: "1..5" }
      - { name: student_work_artifact_count, type: integer, source: input, description: "Number of student work artifacts collected; required when evaluation_type = STUDENT_WORK_SAMPLE, else MUST be null", default: null, constraints: ">= 0" }
      - { name: rubric_composite, type: number, source: computed, description: "round_half_up((rubric_engagement_score + rubric_craft_score + rubric_standards_evidence_score) / 3, 2); null for non-OBSERVATION_RUBRIC rows" , default: null }

  - name: PaymentVoucher
    parent: null
    common_fields: true
    fields:
      - { name: teaching_artist_id, type: string, source: input, description: "FK -> TeachingArtist.id; the payee" }
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id; the residency being charged" }
      - { name: session_ids, type: array, source: input, description: "FK -> Session.id; the delivered sessions claimed by this voucher (many-to-one association array)", constraints: "non-empty, no duplicates" }
      - { name: period_start, type: string, source: input, description: "First date of the pay period (inclusive)", constraints: "YYYY-MM-DD" }
      - { name: period_end, type: string, source: input, description: "Last date of the pay period (inclusive)", constraints: "YYYY-MM-DD, >= period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED", default: DRAFT }
      - { name: fiscal_review_status, type: enum, source: system, description: "Independent review axis: PENDING | PASSED | FAILED", default: PENDING }
      - { name: program_review_status, type: enum, source: system, description: "Independent review axis: PENDING | PASSED | FAILED", default: PENDING }
      - { name: fiscal_reviewed_by, type: string, source: system, description: "Opaque operator id that closed the fiscal track", default: null }
      - { name: program_reviewed_by, type: string, source: system, description: "Opaque operator id that closed the program track", default: null }
      - { name: session_fee_subtotal_cents, type: integer, source: computed, description: "Sum of Session.fee_cents over session_ids", default: 0 }
      - { name: travel_reimbursement_cents, type: integer, source: computed, description: "Sum of Session.travel_reimbursement_cents over session_ids (round per session, then sum)", default: 0 }
      - { name: materials_reimbursement_cents, type: integer, source: computed, description: "Sum of Session.materials_reimbursement_cents over session_ids", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "= session_fee_subtotal_cents + travel_reimbursement_cents + materials_reimbursement_cents", default: 0 }
      - { name: void_reason, type: string, source: system, description: "Reason recorded when the voucher was voided", default: null }

  - name: FunderReport
    parent: null
    common_fields: true
    fields:
      - { name: funder_name, type: string, source: input, description: "Funder the report is prepared for" }
      - { name: grant_code, type: string, source: input, description: "Grant identifier" }
      - { name: period_start, type: string, source: input, description: "First date of the reporting period (inclusive)", constraints: "YYYY-MM-DD" }
      - { name: period_end, type: string, source: input, description: "Last date of the reporting period (inclusive)", constraints: "YYYY-MM-DD, >= period_start" }
      - { name: scope_residency_ids, type: array, source: input, description: "FK -> Residency.id; the residencies in reporting scope (many-to-many association array)", constraints: "non-empty, no duplicates" }
      - { name: headcount_basis, type: enum, source: input, description: "UNDUPLICATED | ENCOUNTERS — selects the variant of calculations.funder_report_metrics", constraints: "UNDUPLICATED | ENCOUNTERS" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPILED | CERTIFIED", default: DRAFT }
      - { name: compiled_by_user_id, type: string, source: system, description: "Opaque operator id that compiled the current snapshot", default: null }
      - { name: certified_by_user_id, type: string, source: system, description: "Opaque operator id that certified the report", default: null }
      - { name: attestation_text, type: string, source: system, description: "Attestation captured at certification", default: null }
      - { name: invalidated_reason, type: enum, source: system, description: "SCOPE_DELIVERY_CHANGED — why a COMPILED snapshot was pushed back to DRAFT", default: null, constraints: "SCOPE_DELIVERY_CHANGED" }
      - { name: sessions_delivered_total, type: integer, source: computed, description: "Delivered sessions in scope whose session_date falls inside [period_start, period_end]", default: 0 }
      - { name: students_served, type: integer, source: computed, description: "Headcount under the selected headcount_basis variant", default: 0 }
      - { name: frl_students_reached, type: integer, source: computed, description: "round_half_up(students_served * school.frl_pct) summed per scope residency", default: 0 }
      - { name: ell_students_reached, type: integer, source: computed, description: "round_half_up(students_served * school.ell_pct) summed per scope residency", default: 0 }
      - { name: iep_students_reached, type: integer, source: computed, description: "round_half_up(students_served * school.iep_pct) summed per scope residency", default: 0 }
      - { name: direct_cost_cents, type: integer, source: computed, description: "Sum of PaymentVoucher.total_cents over APPROVED vouchers in scope and period", default: 0 }
      - { name: indirect_cost_cents, type: integer, source: computed, description: "Indirect cost from the bracket pinned in calculations.funder_report_metrics", default: 0 }
      - { name: total_spend_cents, type: integer, source: computed, description: "= direct_cost_cents + indirect_cost_cents", default: 0 }
      - { name: cost_per_student_cents, type: integer, source: computed, description: "round_half_up(total_spend_cents / students_served), or 0 when students_served = 0", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # TeachingArtist carries TWO independent state axes on the same row.
  # Axis 1: vetting_status (recruitment). Axis 2: roster_status (assignability).
  # ---------------------------------------------------------------------------
  - entity: TeachingArtist
    axis: vetting_status
    initial_state: APPLIED
    terminal_states: [DECLINED, SCREEN_FAILED]
    transitions:
      - from: APPLIED
        to: PORTFOLIO_REVIEW
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=PORTFOLIO_REVIEW"
        actor: RosterCoordinator
        preconditions: ["vetting_status == APPLIED"]
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: PORTFOLIO_REVIEW
        to: DEMO_SCHEDULED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DEMO_SCHEDULED"
        actor: RosterCoordinator
        preconditions:
          - "vetting_status == PORTFOLIO_REVIEW or vetting_status == DEMO_FAILED"
          - "portfolio_review_count >= PORTFOLIO_MIN_REVIEWS (else ERR_INSUFFICIENT_PORTFOLIO_REVIEWS)"
          - "portfolio_mean_composite >= PORTFOLIO_ADVANCE_THRESHOLD, inclusive (else ERR_PORTFOLIO_THRESHOLD_NOT_MET)"
          - "demo_attempt_count < DEMO_ATTEMPT_LIMIT (else ERR_DEMO_ATTEMPT_LIMIT_REACHED)"
        side_effects:
          - "demo_attempt_count += 1"
          - "increments TeachingArtist.version by 1"

      - from: DEMO_FAILED
        to: DEMO_SCHEDULED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DEMO_SCHEDULED (re-demonstration round)"
        actor: RosterCoordinator
        preconditions:
          - "demo_attempt_count < DEMO_ATTEMPT_LIMIT (else ERR_DEMO_ATTEMPT_LIMIT_REACHED)"
        side_effects:
          - "demo_attempt_count += 1"
          - "demo_rubric_score := null, demo_evaluator_user_id := null"
          - "increments TeachingArtist.version by 1"
        note: "Cycle DEMO_SCHEDULED → DEMO_FAILED → DEMO_SCHEDULED, bounded by DEMO_ATTEMPT_LIMIT."

      - from: DEMO_SCHEDULED
        to: DEMO_PASSED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DEMO_PASSED and demo_rubric_score"
        actor: RosterCoordinator
        preconditions:
          - "demo_rubric_score present and >= DEMO_PASS_SCORE (else ERR_INVALID_REQUEST when absent)"
          - "X-User-ID is NOT any reviewer_user_id of this artist's PortfolioReview rows (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "demo_rubric_score := payload value; demo_evaluator_user_id := X-User-ID"
          - "increments TeachingArtist.version by 1"

      - from: DEMO_SCHEDULED
        to: DEMO_FAILED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DEMO_FAILED and demo_rubric_score"
        actor: RosterCoordinator
        preconditions:
          - "demo_rubric_score present and < DEMO_PASS_SCORE"
          - "X-User-ID is NOT any reviewer_user_id of this artist's PortfolioReview rows (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "demo_rubric_score := payload value; demo_evaluator_user_id := X-User-ID"
          - "increments TeachingArtist.version by 1"

      - from: PORTFOLIO_REVIEW
        to: DECLINED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DECLINED and decline_reason"
        actor: RosterCoordinator
        preconditions: ["vetting_status IN {PORTFOLIO_REVIEW, DEMO_FAILED}"]
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: DEMO_FAILED
        to: DECLINED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=DECLINED and decline_reason"
        actor: RosterCoordinator
        preconditions: []
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: DEMO_PASSED
        to: SCREENING_PENDING
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=SCREENING_PENDING"
        actor: RosterCoordinator
        preconditions: []
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: SCREENING_PENDING
        to: CLEARED
        trigger: "POST /teaching-artists/{id}/vetting with to_vetting_status=CLEARED"
        actor: RosterCoordinator
        preconditions:
          - "clearance_status == CLEARED per calculations.artist_clearance_window: a non-superseded CLEARED BackgroundScreening exists for EVERY value of REQUIRED_SCREENING_TYPES and min(expires_on) >= clock date (else ERR_ARTIST_NOT_CLEARED)"
        side_effects:
          - "roster_status NOT_LISTED → ACTIVE on the roster axis (auto-transition)"
          - "recompute roster_tier_effective per calculations.artist_roster_tier"
          - "increments TeachingArtist.version by 1"

      - from: SCREENING_PENDING
        to: SCREEN_FAILED
        trigger: "system — POST /teaching-artists/{id}/screenings with outcome=FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 1: roster_status → SUSPENDED on the roster axis"
          - "increments TeachingArtist.version by 1"

      - from: CLEARED
        to: SCREEN_FAILED
        trigger: "system — POST /teaching-artists/{id}/screenings with outcome=FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 1: roster_status → SUSPENDED on the roster axis"
          - "clearance_status := NONE, clearance_expires_on := null"
          - "increments TeachingArtist.version by 1"

  - entity: TeachingArtist
    axis: roster_status
    initial_state: NOT_LISTED
    terminal_states: [RETIRED]
    transitions:
      - from: NOT_LISTED
        to: ACTIVE
        trigger: "system — vetting axis reaches CLEARED"
        actor: system
        preconditions: ["vetting_status == CLEARED"]
        side_effects: ["recompute roster_tier_effective"]

      - from: ACTIVE
        to: PROBATION
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=PROBATION, OR system via CASCADE B link 3"
        actor: ProgramDirector | system
        preconditions: ["roster_status == ACTIVE"]
        side_effects:
          - "CASCADE B link 4: roster_tier_effective := min_tier(roster_tier_assigned, TEACHING_ARTIST), which changes calculations.session_fee projections"
          - "for every Residency with an open session assigned to this artist: recompute Residency.projected_cost_cents"
          - "increments TeachingArtist.version by 1"

      - from: PROBATION
        to: ACTIVE
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=ACTIVE"
        actor: ProgramDirector
        preconditions:
          - "reliability_bps_rolling >= RELIABILITY_PROBATION_FLOOR_BPS (else ERR_RELIABILITY_BELOW_FLOOR)"
          - "clearance_status == CLEARED (else ERR_ARTIST_NOT_CLEARED)"
        side_effects:
          - "recompute roster_tier_effective (probation cap lifted)"
          - "increments TeachingArtist.version by 1"
        note: "Cycle ACTIVE → PROBATION → ACTIVE."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=SUSPENDED, OR system via CASCADE A link 1"
        actor: ProgramDirector | system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: every Session of this artist with status IN {PLANNED, CONFIRMED} → VACATED (assigned_artist_id := null, vacated_artist_id := artist.id); each CONFIRMED session releases its encumbrance (Residency.encumbered_cents -= session.encumbered_cents, session.encumbered_cents := 0, available_cents recomputed)"
          - "CASCADE A link 3: for every residency touched by link 2, vacated_session_count += 1 and staffing_status recomputed; if the artist was lead_artist_id, lead_artist_id := null so staffing_status becomes LEAD_VACANT"
          - "CASCADE A link 4: for every school owning a residency touched by link 3, partnership_health recomputed per calculations.school_partnership_health"
          - "increments TeachingArtist.version by 1"

      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=SUSPENDED, OR system via CASCADE A link 1"
        actor: ProgramDirector | system
        preconditions: []
        side_effects: ["identical cascade to ACTIVE → SUSPENDED (links 2, 3, 4)", "increments TeachingArtist.version by 1"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=ACTIVE"
        actor: ProgramDirector
        preconditions:
          - "clearance_status == CLEARED (else ERR_ARTIST_NOT_CLEARED)"
          - "vetting_status == CLEARED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "recompute roster_tier_effective"
          - "increments TeachingArtist.version by 1"
        note: "Reinstatement does NOT re-staff sessions vacated by the suspension; they stay VACATED until reassigned."

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=RETIRED"
        actor: ProgramDirector
        preconditions: ["no Session of this artist has status IN {PLANNED, CONFIRMED} (else ERR_ARTIST_HAS_OPEN_SESSIONS)"]
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: PROBATION
        to: RETIRED
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=RETIRED"
        actor: ProgramDirector
        preconditions: ["no Session of this artist has status IN {PLANNED, CONFIRMED} (else ERR_ARTIST_HAS_OPEN_SESSIONS)"]
        side_effects: ["increments TeachingArtist.version by 1"]

      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /teaching-artists/{id}/roster-status with to_roster_status=RETIRED"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["increments TeachingArtist.version by 1"]

  # ---------------------------------------------------------------------------
  - entity: Residency
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /residencies/{id}/status with to_status=APPROVED"
        actor: ProgramDirector
        preconditions:
          - "lead_artist_id != null (else ERR_INVALID_STATE_TRANSITION)"
          - "the lead artist has vetting_status == CLEARED, roster_status == ACTIVE (else ERR_ARTIST_NOT_ON_ACTIVE_ROSTER)"
          - "SchoolPartner.partnership_health != INTAKE_SUSPENDED (else ERR_PARTNERSHIP_INTAKE_SUSPENDED)"
        side_effects:
          - "sessions_unscheduled_count := contracted_session_count"
          - "available_cents := budget_cents (encumbered_cents = 0, disbursed_cents = 0)"
          - "increments Residency.version by 1"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /residencies/{id}/status with to_status=ACTIVE"
        actor: ProgramDirector
        preconditions:
          - "at least one LessonPlan of this residency has status == ALIGNED (else ERR_NO_ALIGNED_LESSON_PLAN)"
          - "the union of covered_strands over this residency's ALIGNED lesson plans is a superset of required_strands (else ERR_STANDARDS_COVERAGE_INCOMPLETE)"
        side_effects: ["increments Residency.version by 1"]
        note: "Cross-entity guard: Residency advancement depends on LessonPlan state (Rule 7)."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /residencies/{id}/status with to_status=SUSPENDED and reason"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "every Session of this residency with status IN {PLANNED, CONFIRMED, VACATED} → CANCELLED_SCHOOL with cancel_reason = RESIDENCY_DESCOPED, makeup_eligible = false; each releases its encumbrance and increments sessions_forfeited_count"
          - "SchoolPartner.partnership_health recomputed → INTAKE_SUSPENDED"
          - "increments Residency.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /residencies/{id}/status with to_status=ACTIVE"
        actor: ProgramDirector
        preconditions: ["staffing_status != LEAD_VACANT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "SchoolPartner.partnership_health recomputed"
          - "increments Residency.version by 1"
        note: "Cycle ACTIVE → SUSPENDED → ACTIVE."

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /residencies/{id}/status with to_status=COMPLETED"
        actor: ProgramDirector
        preconditions:
          - "sessions_open_count == 0 (else ERR_RESIDENCY_HAS_OPEN_SESSIONS)"
        side_effects:
          - "sessions_forfeited_count += sessions_unscheduled_count + makeup_credits_outstanding"
          - "every unconsumed makeup credit is closed out: makeup_consumed := true on the cancelled origin sessions, makeup_credits_outstanding := 0"
          - "sessions_unscheduled_count := 0"
          - "session-ledger invariant of calculations.residency_session_ledger still holds after the sweep"
          - "increments Residency.version by 1"

      - from: COMPLETED
        to: CLOSED
        trigger: "POST /residencies/{id}/status with to_status=CLOSED"
        actor: ProgramDirector
        preconditions:
          - "no PaymentVoucher of this residency has status IN {DRAFT, SUBMITTED} (else ERR_RESIDENCY_HAS_OPEN_VOUCHERS)"
          - "encumbered_cents == 0 (else ERR_RESIDENCY_HAS_OPEN_VOUCHERS)"
        side_effects:
          - "every LessonPlan of this residency with status IN {SUBMITTED, CHANGES_REQUESTED, ALIGNED} → ARCHIVED"
          - "increments Residency.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /residencies/{id}/status with to_status=CANCELLED and reason"
        actor: ProgramDirector
        preconditions: ["sessions_open_count == 0"]
        side_effects:
          - "every LessonPlan of this residency → ARCHIVED"
          - "increments Residency.version by 1"

  # ---------------------------------------------------------------------------
  - entity: LessonPlan
    initial_state: SUBMITTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: SUBMITTED
        to: ALIGNED
        trigger: "POST /lesson-plans/{id}/review with decision=ALIGN"
        actor: CurriculumSpecialist
        preconditions:
          - "every code in standard_codes resolves to an ArtsStandard row (else ERR_UNKNOWN_STANDARD_CODE)"
          - "every resolved standard has discipline == Residency.discipline (else ERR_DISCIPLINE_MISMATCH)"
          - "every resolved standard has grade_band == Residency.grade_band (else ERR_GRADE_BAND_MISMATCH)"
          - "covered_strands is non-empty; a single plan is NOT required to cover every required_strand — strand coverage is checked at the residency level on APPROVED → ACTIVE, over the union of the residency's ALIGNED plans"
        side_effects:
          - "aligned_on := logical clock now; reviewer_user_id := X-User-ID"
          - "increments LessonPlan.version by 1"

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /lesson-plans/{id}/review with decision=REQUEST_CHANGES and reviewer_note"
        actor: CurriculumSpecialist
        preconditions: ["revision_round < ADAPTATION_ROUND_LIMIT (else ERR_ADAPTATION_ROUND_LIMIT)"]
        side_effects:
          - "revision_round += 1; reviewer_note := payload note; reviewer_user_id := X-User-ID"
          - "increments LessonPlan.version by 1"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /lesson-plans/{id}/revisions with adaptation_summary"
        actor: TeachingArtist | RosterCoordinator
        preconditions:
          - "revision_round < ADAPTATION_ROUND_LIMIT (else ERR_ADAPTATION_ROUND_LIMIT)"
          - "acting TeachingArtist's X-User-ID == author_artist_id (else ERR_ACTOR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "standard_codes / title replaced when supplied; adaptation_summary := payload value; covered_strands recomputed"
          - "increments LessonPlan.version by 1"
        note: "Revision cycle SUBMITTED → CHANGES_REQUESTED → SUBMITTED, bounded by ADAPTATION_ROUND_LIMIT."

      - from: ALIGNED
        to: CHANGES_REQUESTED
        trigger: "POST /lesson-plans/{id}/review with decision=REQUEST_CHANGES and reviewer_note"
        actor: CurriculumSpecialist
        preconditions:
          - "revision_round < ADAPTATION_ROUND_LIMIT (else ERR_ADAPTATION_ROUND_LIMIT)"
          - "no Session with lesson_plan_id = this plan has status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "revision_round += 1; aligned_on := null"
          - "if the residency has no other ALIGNED plan covering required_strands, Residency.staffing_status is unaffected but POST /residencies/{id}/status → ACTIVE becomes blocked again"
          - "increments LessonPlan.version by 1"

      - from: ALIGNED
        to: ARCHIVED
        trigger: "system — Residency reaches CLOSED or CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["increments LessonPlan.version by 1"]

      - from: SUBMITTED
        to: ARCHIVED
        trigger: "system — Residency reaches CLOSED or CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["increments LessonPlan.version by 1"]

      - from: CHANGES_REQUESTED
        to: ARCHIVED
        trigger: "system — Residency reaches CLOSED or CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["increments LessonPlan.version by 1"]

  # ---------------------------------------------------------------------------
  - entity: Session
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED_SCHOOL, CANCELLED_ARTIST]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /sessions/{id}/confirm with classroom_teacher_name and co_planning_completed"
        actor: SchoolLiaison | RosterCoordinator
        preconditions:
          - "Residency.status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "assigned_artist_id != null and that artist has vetting_status == CLEARED (else ERR_ARTIST_NOT_CLEARED)"
          - "that artist has roster_status == ACTIVE (else ERR_ARTIST_NOT_ON_ACTIVE_ROSTER)"
          - "artist.clearance_expires_on >= session_date, inclusive (else ERR_CLEARANCE_EXPIRED)"
          - "lesson_plan_id != null and that LessonPlan.status == ALIGNED (else ERR_NO_ALIGNED_LESSON_PLAN)"
          - "when Residency.collaboration_expectation == CO_TEACH, co_planning_completed == true (else ERR_CO_PLANNING_INCOMPLETE)"
          - "session_date is not inside any CalendarBlackout of the residency's school (closed interval, else ERR_CALENDAR_BLACKOUT)"
        side_effects:
          - "classroom_teacher_name, co_planning_completed persisted"
          - "encumbers the projected full-length fee: session.encumbered_cents := calculations.session_fee with minutes_delivered := Residency.session_length_minutes; Residency.encumbered_cents += that amount; Residency.available_cents recomputed"
          - "if Residency.available_cents would go negative the transition is rejected with ERR_RESIDENCY_BUDGET_EXCEEDED"
          - "Residency.projected_cost_cents recomputed; increments Session.version by 1 and Residency.version by 1"

      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /sessions/{id}/deliver with students_present_count, minutes_delivered, travel_miles, materials_spend_cents"
        actor: TeachingArtist
        preconditions:
          - "X-User-ID == assigned_artist_id (else ERR_ACTOR_NOT_RESOURCE_OWNER)"
          - "Residency.status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "minutes_delivered >= ceil(MIN_DELIVERY_FRACTION * Residency.session_length_minutes) (else ERR_SESSION_UNDERDELIVERED)"
          - "artist.clearance_expires_on >= session_date, inclusive (else ERR_CLEARANCE_EXPIRED)"
          - "payable_cents - session.encumbered_cents <= Residency.available_cents (else ERR_RESIDENCY_BUDGET_EXCEEDED)"
        side_effects:
          - "fee_cents, travel_reimbursement_cents, materials_reimbursement_cents, payable_cents computed per calculations.session_fee and calculations.session_reimbursement"
          - "encumbrance swap: Residency.encumbered_cents += (payable_cents - session.encumbered_cents); session.encumbered_cents := payable_cents; available_cents recomputed"
          - "Residency.sessions_open_count -= 1, sessions_delivered_count += 1, earned_to_date_cents and projected_cost_cents recomputed"
          - "artist.lifetime_delivered_count += 1; reliability_bps_rolling and reliability_bps_program_year recomputed; roster_tier_effective recomputed"
          - "Residency.evaluation_index recomputed"
          - "every FunderReport with status == COMPILED whose scope_residency_ids contains this residency and whose [period_start, period_end] contains session_date → status DRAFT with invalidated_reason = SCOPE_DELIVERY_CHANGED"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: PLANNED
        to: VACATED
        trigger: "system — CASCADE A link 2 (assigned artist's roster_status → SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "vacated_artist_id := assigned_artist_id; assigned_artist_id := null"
          - "Residency.vacated_session_count += 1 and staffing_status recomputed (CASCADE A link 3)"
          - "increments Session.version by 1"

      - from: CONFIRMED
        to: VACATED
        trigger: "system — CASCADE A link 2 (assigned artist's roster_status → SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "vacated_artist_id := assigned_artist_id; assigned_artist_id := null"
          - "encumbrance released: Residency.encumbered_cents -= session.encumbered_cents; session.encumbered_cents := 0; available_cents recomputed"
          - "Residency.vacated_session_count += 1 and staffing_status recomputed (CASCADE A link 3)"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: VACATED
        to: CONFIRMED
        trigger: "POST /sessions/{id}/reassign with substitute_artist_id and expected_session_version"
        actor: RosterCoordinator
        preconditions:
          - "substitute artist has vetting_status == CLEARED and roster_status == ACTIVE (else ERR_ARTIST_NOT_ON_ACTIVE_ROSTER)"
          - "substitute capability match: Residency.discipline IN (primary_discipline + secondary_disciplines), Residency.grade_band IN grade_bands, Residency.instruction_language IN languages (else ERR_DISCIPLINE_MISMATCH / ERR_GRADE_BAND_MISMATCH / ERR_LANGUAGE_CAPABILITY_MISSING)"
          - "no artist-schedule conflict for the substitute per calculations.session_interval_conflict (else ERR_ARTIST_SCHEDULE_CONFLICT / ERR_TRAVEL_BUFFER_VIOLATION)"
          - "expected_session_version == Session.version (else ERR_STALE_SESSION_VERSION)"
        side_effects:
          - "assigned_artist_id := substitute_artist_id; is_substitute := true"
          - "re-encumbers at the substitute's rate: session.encumbered_cents := calculations.session_fee(full length, is_substitute=true); Residency.encumbered_cents and available_cents recomputed"
          - "Residency.vacated_session_count -= 1 and staffing_status recomputed; owning school's partnership_health recomputed"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /sessions/{id}/reassign with substitute_artist_id and expected_session_version (substitute swap without vacating)"
        actor: RosterCoordinator
        preconditions:
          - "substitute_artist_id != assigned_artist_id (else ERR_INVALID_REQUEST)"
          - "same capability, roster and interval preconditions as VACATED → CONFIRMED"
          - "expected_session_version == Session.version (else ERR_STALE_SESSION_VERSION)"
        side_effects:
          - "vacated_artist_id := previous assigned_artist_id; assigned_artist_id := substitute_artist_id; is_substitute := true"
          - "encumbrance swap at the substitute rate; Residency.encumbered_cents and available_cents recomputed; projected_cost_cents recomputed"
          - "increments Session.version by 1 and Residency.version by 1"
        note: "Self-loop on CONFIRMED: substitute coverage without ever vacating the slot."

      - from: PLANNED
        to: CANCELLED_SCHOOL
        trigger: "POST /sessions/{id}/cancel with cancel_reason IN {SCHOOL_CLOSURE, TESTING_CONFLICT, LOW_ENROLLMENT}"
        actor: SchoolLiaison | RosterCoordinator
        preconditions: ["cancel_reason permitted for the acting role (else ERR_CANCEL_REASON_NOT_PERMITTED)"]
        side_effects:
          - "makeup_eligible := (cancel_reason IN MAKEUP_ELIGIBLE_REASONS)"
          - "Residency.sessions_open_count -= 1; makeup_credits_outstanding += 1 when makeup_eligible else sessions_forfeited_count += 1"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: CONFIRMED
        to: CANCELLED_SCHOOL
        trigger: "POST /sessions/{id}/cancel with cancel_reason IN {SCHOOL_CLOSURE, TESTING_CONFLICT, LOW_ENROLLMENT}"
        actor: SchoolLiaison | RosterCoordinator
        preconditions: ["cancel_reason permitted for the acting role (else ERR_CANCEL_REASON_NOT_PERMITTED)"]
        side_effects:
          - "encumbrance released: Residency.encumbered_cents -= session.encumbered_cents; session.encumbered_cents := 0; available_cents recomputed"
          - "makeup_eligible := (cancel_reason IN MAKEUP_ELIGIBLE_REASONS)"
          - "Residency.sessions_open_count -= 1; makeup_credits_outstanding += 1 when makeup_eligible else sessions_forfeited_count += 1"
          - "Residency.projected_cost_cents recomputed"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: VACATED
        to: CANCELLED_SCHOOL
        trigger: "POST /sessions/{id}/cancel with cancel_reason IN {SCHOOL_CLOSURE, TESTING_CONFLICT, LOW_ENROLLMENT}"
        actor: SchoolLiaison | RosterCoordinator
        preconditions: ["cancel_reason permitted for the acting role"]
        side_effects:
          - "makeup_eligible := (cancel_reason IN MAKEUP_ELIGIBLE_REASONS)"
          - "Residency.sessions_open_count -= 1, vacated_session_count -= 1, staffing_status recomputed, owning school's partnership_health recomputed"
          - "makeup_credits_outstanding += 1 when makeup_eligible else sessions_forfeited_count += 1"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: CONFIRMED
        to: CANCELLED_ARTIST
        trigger: "POST /sessions/{id}/cancel with cancel_reason IN {ARTIST_ILLNESS, ARTIST_NO_SHOW}"
        actor: TeachingArtist | RosterCoordinator
        preconditions:
          - "cancel_reason permitted for the acting role: a TeachingArtist may only submit ARTIST_ILLNESS for their own session (else ERR_CANCEL_REASON_NOT_PERMITTED / ERR_ACTOR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "CASCADE B link 1: status := CANCELLED_ARTIST, makeup_eligible := true, encumbrance released, Residency.sessions_open_count -= 1, makeup_credits_outstanding += 1"
          - "CASCADE B link 2: caused by the CANCELLED_ARTIST outcome — artist.no_show_count += 1 when cancel_reason == ARTIST_NO_SHOW; reliability_bps_rolling and reliability_bps_program_year recomputed"
          - "CASCADE B link 3: caused by reliability_bps_rolling falling below RELIABILITY_PROBATION_FLOOR_BPS with at least RELIABILITY_MIN_TERMINAL terminal sessions — artist.roster_status ACTIVE → PROBATION"
          - "CASCADE B link 4: caused by entering PROBATION — roster_tier_effective := min_tier(roster_tier_assigned, TEACHING_ARTIST) and Residency.projected_cost_cents recomputed for every residency with an open session of this artist"
          - "increments Session.version by 1 and Residency.version by 1"

      - from: PLANNED
        to: CANCELLED_ARTIST
        trigger: "POST /sessions/{id}/cancel with cancel_reason IN {ARTIST_ILLNESS, ARTIST_NO_SHOW}"
        actor: TeachingArtist | RosterCoordinator
        preconditions: ["cancel_reason permitted for the acting role"]
        side_effects: ["identical to CONFIRMED → CANCELLED_ARTIST except there is no encumbrance to release"]

  # ---------------------------------------------------------------------------
  # PaymentVoucher: fork-join. SUBMITTED opens two independent review tracks
  # (fiscal, program); the join auto-transitions the voucher.
  # ---------------------------------------------------------------------------
  - entity: PaymentVoucher
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /payment-vouchers/{id}/submit"
        actor: TeachingArtist | RosterCoordinator
        preconditions:
          - "every session in session_ids has status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
          - "every session in session_ids has at least one EvaluationRecord with evaluation_type == OBSERVATION_RUBRIC and all three rubric scores present (else ERR_EVALUATION_MISSING)"
          - "every session's session_date is inside [period_start, period_end] (else ERR_VOUCHER_PERIOD_MISMATCH)"
          - "total_cents <= Residency.encumbered_cents (else ERR_RESIDENCY_BUDGET_EXCEEDED)"
        side_effects:
          - "fiscal_review_status := PENDING, program_review_status := PENDING"
          - "session_fee_subtotal_cents, travel_reimbursement_cents, materials_reimbursement_cents, total_cents recomputed per calculations.voucher_total"
          - "increments PaymentVoucher.version by 1"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /payment-vouchers/{id}/submit (resubmission after correction)"
        actor: TeachingArtist | RosterCoordinator
        preconditions:
          - "same preconditions as DRAFT → SUBMITTED"
          - "every session in session_ids has payment_voucher_id == null or == this voucher id (else ERR_SESSION_ALREADY_VOUCHERED)"
        side_effects:
          - "fiscal_review_status := PENDING, program_review_status := PENDING, fiscal_reviewed_by := null, program_reviewed_by := null"
          - "session.payment_voucher_id := this voucher id for every session in session_ids"
          - "increments PaymentVoucher.version by 1"
        note: "Cycle SUBMITTED → REJECTED → SUBMITTED."

      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /payment-vouchers/{id}/review with review_track and decision=PASS (only one of the two tracks closed)"
        actor: FiscalOfficer | ProgramDirector
        preconditions:
          - "the addressed track is PENDING (else ERR_INVALID_STATE_TRANSITION)"
          - "review_track == FISCAL requires role FiscalOfficer; review_track == PROGRAM requires role ProgramDirector (else ERR_UNAUTHORIZED)"
          - "X-User-ID differs from the other track's reviewer id when that track is already closed (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_payment_voucher_version == PaymentVoucher.version (else ERR_STALE_VOUCHER_VERSION)"
        side_effects:
          - "the addressed track's status := PASSED and its reviewed_by := X-User-ID"
          - "increments PaymentVoucher.version by 1"
        note: "Fork branch. The join fires only when both tracks are PASSED."

      - from: SUBMITTED
        to: APPROVED
        trigger: "system — join: POST /payment-vouchers/{id}/review closes the second track with decision=PASS"
        actor: system
        preconditions: ["fiscal_review_status == PASSED and program_review_status == PASSED"]
        side_effects:
          - "Residency.disbursed_cents += total_cents; Residency.encumbered_cents -= sum(session.encumbered_cents over session_ids); each session.encumbered_cents := 0; available_cents recomputed"
          - "money-ledger invariant of calculations.residency_budget_ledger holds"
          - "increments PaymentVoucher.version by 1 and Residency.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /payment-vouchers/{id}/review with decision=FAIL on either track"
        actor: FiscalOfficer | ProgramDirector
        preconditions:
          - "the addressed track is PENDING (else ERR_INVALID_STATE_TRANSITION)"
          - "expected_payment_voucher_version == PaymentVoucher.version (else ERR_STALE_VOUCHER_VERSION)"
        side_effects:
          - "the addressed track's status := FAILED and its reviewed_by := X-User-ID; the other track keeps its own value"
          - "session.payment_voucher_id := null for every session in session_ids so the sessions can be re-vouchered; encumbrances are NOT released (the work is still owed)"
          - "increments PaymentVoucher.version by 1"
        note: "Divergent branch side-effect set: FAIL releases the session claim, PASS does not."

      - from: APPROVED
        to: VOIDED
        trigger: "POST /payment-vouchers/{id}/void with void_reason"
        actor: FiscalOfficer
        preconditions:
          - "Residency.status != CLOSED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "compensating action: Residency.disbursed_cents -= total_cents; Residency.encumbered_cents += total_cents; each session.encumbered_cents restored to its payable_cents; available_cents recomputed"
          - "session.payment_voucher_id := null for every session in session_ids"
          - "money-ledger invariant holds: available_cents + encumbered_cents + disbursed_cents == budget_cents, unchanged from before the APPROVED transition"
          - "increments PaymentVoucher.version by 1 and Residency.version by 1"

      - from: REJECTED
        to: VOIDED
        trigger: "POST /payment-vouchers/{id}/void with void_reason"
        actor: FiscalOfficer
        preconditions: []
        side_effects: ["increments PaymentVoucher.version by 1"]

  # ---------------------------------------------------------------------------
  - entity: FunderReport
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: COMPILED
        trigger: "POST /funder-reports/{id}/compile"
        actor: ProgramDirector
        preconditions:
          - "every id in scope_residency_ids resolves to a Residency (else ERR_RESIDENCY_NOT_FOUND)"
        side_effects:
          - "all computed metrics recomputed per calculations.funder_report_metrics; compiled_by_user_id := X-User-ID; invalidated_reason := null"
          - "increments FunderReport.version by 1"

      - from: COMPILED
        to: DRAFT
        trigger: "system — a session in a scope residency reaches DELIVERED inside the report period"
        actor: system
        preconditions: []
        side_effects:
          - "invalidated_reason := SCOPE_DELIVERY_CHANGED; computed metrics keep their last compiled values until the next compile"
          - "increments FunderReport.version by 1"
        note: "Cycle DRAFT → COMPILED → DRAFT: snapshot staleness invalidation."

      - from: COMPILED
        to: COMPILED
        trigger: "POST /funder-reports/{id}/compile (recompile in place)"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["metrics recomputed; compiled_by_user_id := X-User-ID", "increments FunderReport.version by 1"]

      - from: COMPILED
        to: CERTIFIED
        trigger: "POST /funder-reports/{id}/certify with certifier_user_id and attestation_text"
        actor: FiscalOfficer
        preconditions:
          - "every residency in scope_residency_ids has status IN {COMPLETED, CLOSED} (else ERR_RESIDENCY_NOT_FINALIZED)"
          - "certifier_user_id != compiled_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "invalidated_reason == null"
        side_effects:
          - "certified_by_user_id := certifier_user_id; attestation_text persisted"
          - "increments FunderReport.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: session-create-stale-residency
    parent_entity: Residency
    write_endpoint: "POST /sessions"
    occ_field: "expected_residency_version"
    description: |
      Creating a Session against a Residency whose version has advanced since
      the client last read it is rejected as a stale write. A second create
      carrying the earlier version is legitimate product behaviour on its own
      (two distinct sessions may exist), so no state precondition catches it;
      the stale version is the only signal that the client scheduled against an
      out-of-date session ledger (allotment, encumbrance, staffing_status).
    error_id: ERR_STALE_RESIDENCY_VERSION
    http_status: 412

  - rule_id: reassign-stale-session
    parent_entity: Session
    write_endpoint: "POST /sessions/{id}/reassign"
    occ_field: "expected_session_version"
    description: |
      Reassigning a Session supersedes whatever artist assignment the client
      last observed. A reassignment issued against a stale Session.version is
      rejected, because the assignment it intends to supersede is no longer the
      one on the row; the transition itself (CONFIRMED → CONFIRMED, VACATED →
      CONFIRMED) would otherwise succeed and silently overwrite a newer
      substitute.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: voucher-review-stale-voucher
    parent_entity: PaymentVoucher
    write_endpoint: "POST /payment-vouchers/{id}/review"
    occ_field: "expected_payment_voucher_version"
    description: |
      The two review tracks are independent, so a reviewer closing the PROGRAM
      track from the same observed version that another reviewer used to close
      the FISCAL track would legitimately succeed under the state machine. The
      OCC check on PaymentVoucher.version forces the second reviewer to re-read
      the voucher (and therefore the first track's outcome and the recomputed
      total) before closing their own track.
    error_id: ERR_STALE_VOUCHER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: portfolio_composite
    trigger: "POST /teaching-artists/{id}/portfolio-reviews (per review), and TeachingArtist.portfolio_mean_composite after each review"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(
          0.40 * artistic_quality_score
        + 0.35 * pedagogical_clarity_score
        + 0.25 * cultural_responsiveness_score, 2)
      recommendation = ADVANCE if composite_score >= PORTFOLIO_ADVANCE_THRESHOLD else DECLINE

      # Artist-level roll-up (source entity PortfolioReview, no status filter —
      # every review of the artist counts; ordering is irrelevant to a mean):
      portfolio_review_count      = count(distinct reviewer_user_id)
      portfolio_mean_composite    = round_half_up(mean(composite_score over ALL reviews of the artist), 2)
                                    # null when the artist has zero reviews
    input_set: "All PortfolioReview rows of the artist; no state filter (PortfolioReview is immutable)"
    constants:
      W_ARTISTIC: 0.40
      W_PEDAGOGICAL: 0.35
      W_CULTURAL: 0.25
      PORTFOLIO_ADVANCE_THRESHOLD: 3.50
      PORTFOLIO_MIN_REVIEWS: 2
    precision: "2 decimal places, round_half_up; the >= comparison against 3.50 is made on the ROUNDED mean"

  - name: artist_clearance_window
    trigger: "POST /teaching-artists/{id}/screenings; re-evaluated on every read of clearance_status and on POST /sessions/{id}/confirm and /deliver"
    algorithm: interval_merge
    formula: |
      for each t in REQUIRED_SCREENING_TYPES:
        latest[t] = the BackgroundScreening row of this artist with screening_type == t
                    ordered by effective_on DESC, created_at ASC as tie-break, take first
        # every other row of that type has superseded = true
      if any t has no latest[t], or any latest[t].outcome == FAILED:
        clearance_status = NONE ; clearance_expires_on = null
      else:
        clearance_expires_on = min(latest[t].expires_on for t in REQUIRED_SCREENING_TYPES)
        clearance_status = CLEARED if clearance_expires_on >= clock_date() else EXPIRED
      # Session-level gate is INCLUSIVE of the expiry date:
      #   allowed  iff  clearance_expires_on >= session_date
    input_set: "All BackgroundScreening rows of the artist; the latest per screening_type wins, the rest are marked superseded"
    constants:
      REQUIRED_SCREENING_TYPES: [STATE_CRIMINAL, FBI_FINGERPRINT, CHILD_ABUSE_REGISTRY]
    precision: "date granularity; both comparisons are inclusive (>=)"

  - name: artist_roster_tier
    trigger: "artist creation, every DELIVERED session, every roster_status transition"
    algorithm: threshold
    formula: |
      tier_order = [APPRENTICE, TEACHING_ARTIST, MASTER]        # ascending
      if roster_status == PROBATION:
        roster_tier_effective = min_tier(roster_tier_assigned, TEACHING_ARTIST)
      elif lifetime_delivered_count >= MASTER_PROMOTION_DELIVERIES
           and reliability_bps_program_year >= MASTER_PROMOTION_RELIABILITY_BPS:
        roster_tier_effective = MASTER
      else:
        roster_tier_effective = roster_tier_assigned
      # min_tier compares by position in tier_order, never by string ordering.
    input_set: "The artist row only"
    constants:
      MASTER_PROMOTION_DELIVERIES: 25
      MASTER_PROMOTION_RELIABILITY_BPS: 9500

  - name: vetting_and_adaptation_gates
    trigger: "POST /teaching-artists/{id}/vetting, POST /lesson-plans/{id}/review, POST /lesson-plans/{id}/revisions, POST /sessions/{id}/cancel"
    algorithm: threshold
    formula: |
      # Bounded-loop counters for the two cyclic state machines, plus the
      # make-up eligibility partition used by the session ledger.
      demo_scheduling_allowed  = demo_attempt_count < DEMO_ATTEMPT_LIMIT
      demo_outcome             = DEMO_PASSED if demo_rubric_score >= DEMO_PASS_SCORE else DEMO_FAILED
      adaptation_round_allowed = revision_round < ADAPTATION_ROUND_LIMIT
      makeup_eligible          = cancel_reason IN MAKEUP_ELIGIBLE_REASONS
    input_set: "The TeachingArtist row (demo counters) or the LessonPlan row (revision_round) or the Session row being cancelled"
    constants:
      DEMO_ATTEMPT_LIMIT: 2
      DEMO_PASS_SCORE: 3.5
      ADAPTATION_ROUND_LIMIT: 3
      MAKEUP_ELIGIBLE_REASONS: [SCHOOL_CLOSURE, TESTING_CONFLICT, ARTIST_ILLNESS, ARTIST_NO_SHOW]
    precision: "integer counters; demo_rubric_score compared at 1 decimal, inclusive >="

  - name: artist_reliability_score
    trigger: "every Session transition into DELIVERED, CANCELLED_ARTIST, or CANCELLED_SCHOOL"
    algorithm: chronological
    formula: |
      terminal_sessions(artist) = Session rows where
          (assigned_artist_id == artist.id OR vacated_artist_id == artist.id)
          AND status IN {DELIVERED, CANCELLED_ARTIST}
        # CANCELLED_SCHOOL is NOT the artist's fault and is excluded from both variants
      ordered by session_date DESC, created_at DESC as tie-break
      credited(s) = 1 if s.status == DELIVERED else 0
      bps(set) = 0 if |set| == 0 else round_half_up(10000 * sum(credited) / |set|)
    input_set: "Terminal artist-attributable sessions; CANCELLED_SCHOOL excluded; ordering pinned by session_date DESC then created_at DESC"
    constants:
      RELIABILITY_WINDOW: 4
      RELIABILITY_PROBATION_FLOOR_BPS: 8000
      RELIABILITY_MIN_TERMINAL: 4
      PROGRAM_YEAR_START_MONTH: 7
    precision: "integer basis points, round_half_up"
    variants:
      - name: rolling_window
        when: "written to reliability_bps_rolling; the ONLY variant that drives the CASCADE B probation trigger"
        difference: "input set is the first RELIABILITY_WINDOW rows of the ordered list (the 4 most recent terminal sessions), regardless of program year"
      - name: program_year_cumulative
        when: "written to reliability_bps_program_year; used by artist_roster_tier MASTER promotion and by funder reporting"
        difference: "input set is every terminal session whose session_date falls in the current program year [July 1 of year Y .. June 30 of year Y+1], unbounded in count; identical data therefore yields a different number whenever more than RELIABILITY_WINDOW terminal sessions exist in the year"

  - name: session_fee
    trigger: "POST /sessions/{id}/confirm (projection, minutes_delivered := Residency.session_length_minutes), POST /sessions/{id}/reassign (re-projection), POST /sessions/{id}/deliver (actual)"
    algorithm: tiered_pricing
    formula: |
      base      = DISCIPLINE_BASE_RATE_CENTS[Residency.discipline]
      graded    = round_half_up(base   * GRADE_BAND_MULTIPLIER[Residency.grade_band])
      tiered    = round_half_up(graded * ROSTER_TIER_MULTIPLIER[artist.roster_tier_effective])
      premium   = round_half_up(tiered * LEAD_ARTIST_PREMIUM_PCT)
                  if session.assigned_artist_id == Residency.lead_artist_id else 0
      language  = BILINGUAL_PREMIUM_CENTS
                  if Residency.instruction_language != "en"
                     and Residency.instruction_language IN artist.languages else 0
      raw       = tiered + premium + language
      typed     = round_half_up(raw * (SUBSTITUTE_RATE_PCT if session.is_substitute else 1.00))

      # STEP ORDER IS PINNED: cap FIRST, prorate SECOND. The opposite order
      # (prorate then cap) yields a different number whenever the uncapped fee
      # exceeds MAX_SESSION_FEE_CENTS and minutes_delivered < session_length.
      capped    = min(MAX_SESSION_FEE_CENTS, max(MIN_SESSION_FEE_CENTS, typed))
      billed_minutes = ceil(minutes_delivered / 5) * 5          # round UP to a 5-minute block
      proration = min(1.00, billed_minutes / Residency.session_length_minutes)
      fee_cents = round_half_up(capped * proration)
    input_set: "One Session plus its Residency and the artist referenced by assigned_artist_id; roster_tier_effective is read at the moment of the call (delivery-time tier, excluding the current session from lifetime_delivered_count)"
    constants:
      DISCIPLINE_BASE_RATE_CENTS: { VISUAL_ARTS: 11000, DANCE: 12000, MUSIC: 12500, THEATER: 11500, MEDIA_ARTS: 13000, LITERARY_ARTS: 10500 }
      GRADE_BAND_MULTIPLIER: { K_2: 1.00, G3_5: 1.05, G6_8: 1.10, G9_12: 1.15 }
      ROSTER_TIER_MULTIPLIER: { APPRENTICE: 0.90, TEACHING_ARTIST: 1.00, MASTER: 1.20 }
      LEAD_ARTIST_PREMIUM_PCT: 0.10
      BILINGUAL_PREMIUM_CENTS: 1500
      SUBSTITUTE_RATE_PCT: 0.85
      MIN_SESSION_FEE_CENTS: 9000
      MAX_SESSION_FEE_CENTS: 19000
      MIN_DELIVERY_FRACTION: 0.50
    precision: "integer cents; round_half_up applied at EACH step shown above, not only at the end"

  - name: session_reimbursement
    trigger: "POST /sessions/{id}/deliver"
    algorithm: aggregation
    formula: |
      billable_miles                = max(0.0, travel_miles - FREE_MILEAGE_PER_SESSION)
      travel_reimbursement_cents    = round_half_up(billable_miles * MILEAGE_RATE_CENTS_PER_MILE)
      materials_reimbursement_cents = min(materials_spend_cents, MATERIALS_CAP_CENTS_PER_SESSION)
      payable_cents                 = fee_cents + travel_reimbursement_cents + materials_reimbursement_cents

      # ROUNDING ORDER IS PINNED: round PER SESSION, then sum at the voucher
      # level. Summing billable_miles across sessions first and rounding once
      # produces a different total (e.g. 10.5 mi + 4.5 mi at 67 c/mi gives
      # 704 + 302 = 1006 per-session, versus 1005 when summed first).
    input_set: "One delivered Session"
    constants:
      MILEAGE_RATE_CENTS_PER_MILE: 67
      FREE_MILEAGE_PER_SESSION: 10.0
      MATERIALS_CAP_CENTS_PER_SESSION: 2500
    precision: "travel_miles has 1 decimal; cents are integers, round_half_up per session"

  - name: voucher_total
    trigger: "POST /payment-vouchers/{id}/submit"
    algorithm: aggregation
    formula: |
      S = the Session rows named by session_ids, all with status == DELIVERED
      session_fee_subtotal_cents    = sum(s.fee_cents                    for s in S)
      travel_reimbursement_cents    = sum(s.travel_reimbursement_cents   for s in S)   # already rounded per session
      materials_reimbursement_cents = sum(s.materials_reimbursement_cents for s in S)
      total_cents = session_fee_subtotal_cents + travel_reimbursement_cents + materials_reimbursement_cents
    input_set: "Exactly the sessions listed in session_ids, all required to be DELIVERED and to belong to residency_id and teaching_artist_id"
    precision: "integer cents; no further rounding — the per-session rounding of session_reimbursement is final"

  - name: residency_session_ledger
    trigger: "every Session creation and every Session state transition; and the COMPLETED sweep"
    algorithm: aggregation
    formula: |
      sessions_open_count       = count(sessions of R with status IN {PLANNED, CONFIRMED, VACATED})
      sessions_delivered_count  = count(sessions of R with status == DELIVERED)
      vacated_session_count     = count(sessions of R with status == VACATED)
      makeup_credits_outstanding= count(sessions of R with status IN {CANCELLED_SCHOOL, CANCELLED_ARTIST}
                                        AND makeup_eligible == true AND makeup_consumed == false)
      sessions_forfeited_count  = count(sessions of R with status IN {CANCELLED_SCHOOL, CANCELLED_ARTIST}
                                        AND makeup_eligible == false)
                                  + allotment forfeited by the COMPLETED sweep
      sessions_unscheduled_count: stored counter, initialised to contracted_session_count on DRAFT → APPROVED,
                                  -1 on each REGULAR session creation, unchanged on MAKEUP session creation,
                                  set to 0 by the COMPLETED sweep

      # CONSERVED QUANTITY — "session obligation". MUST hold after every request:
      INVARIANT_SESSIONS:
        sessions_unscheduled_count + sessions_open_count + sessions_delivered_count
        + sessions_forfeited_count + makeup_credits_outstanding == contracted_session_count
      # Compensating pair: cancel(makeup_eligible=true) moves 1 from open to
      # makeup_credits_outstanding; creating the MAKEUP session moves it back to
      # open. Neither leg touches contracted_session_count.
    input_set: "All Session rows of the residency, partitioned by status with the explicit filters above"
    precision: "integer counts"

  - name: residency_budget_ledger
    trigger: "session confirm / reassign / cancel / vacate / deliver, voucher approve / void"
    algorithm: aggregation
    formula: |
      encumbered_cents = sum(s.encumbered_cents for s in sessions of R)
      disbursed_cents  = sum(v.total_cents for v in vouchers of R with status == APPROVED)
      available_cents  = budget_cents - encumbered_cents - disbursed_cents

      # CONSERVED QUANTITY — "money". MUST hold after every request:
      INVARIANT_MONEY:
        available_cents + encumbered_cents + disbursed_cents == budget_cents
      # Compensating pair: voucher APPROVED moves total_cents from encumbered to
      # disbursed; VOIDED moves exactly the same total_cents back from disbursed
      # to encumbered and restores each session.encumbered_cents to its
      # payable_cents. Neither leg touches budget_cents.
    input_set: "All Session rows of the residency (for encumbrance) and all its APPROVED vouchers (for disbursement)"
    precision: "integer cents"

  - name: residency_cost_outlook
    trigger: "session confirm / reassign / cancel / deliver, voucher approve / void, lead artist assignment, artist tier change"
    algorithm: forward_looking
    formula: |
      earned_to_date_cents = sum(s.payable_cents for s in sessions of R with status == DELIVERED)

      projected_fee(s) = session_fee(s) evaluated with
                           minutes_delivered := R.session_length_minutes,
                           artist            := s.assigned_artist_id, or R.lead_artist_id when s is VACATED
      lead_projection  = session_fee evaluated for a hypothetical REGULAR full-length session of
                         R taught by R.lead_artist_id with the lead premium applied; when
                         lead_artist_id is null, evaluated at ROSTER_TIER_MULTIPLIER[TEACHING_ARTIST]
                         with no lead premium and no language premium

      projected_cost_cents = earned_to_date_cents
        + sum(projected_fee(s) for s in sessions of R with status IN {PLANNED, CONFIRMED, VACATED})
        + (sessions_unscheduled_count + makeup_credits_outstanding) * lead_projection
    input_set: "DELIVERED sessions for the earned leg; PLANNED/CONFIRMED/VACATED sessions plus the unscheduled allotment and outstanding makeup credits for the projected leg; CANCELLED_* sessions are excluded from both"
    precision: "integer cents"
    variants:
      - name: earned_to_date
        when: "written to Residency.earned_to_date_cents; the only figure a PaymentVoucher may draw against"
        difference: "chronological — includes ONLY sessions already DELIVERED, at the actual fee and reimbursements recorded at delivery (prorated minutes, real mileage)"
      - name: projected_completion
        when: "written to Residency.projected_cost_cents; the figure the program director watches against budget_cents"
        difference: "forward-looking — adds full-length fee projections for open sessions, unscheduled allotment and outstanding makeup credits, at today's tier multipliers and with no reimbursement component; identical data therefore yields a strictly different number whenever any allotment remains"

  - name: residency_staffing_status
    trigger: "lead artist assignment, session vacate / reassign / cancel, artist suspension"
    algorithm: threshold
    formula: |
      if lead_artist_id is null:            staffing_status = LEAD_VACANT
      elif vacated_session_count >= 1:      staffing_status = AT_RISK
      else:                                 staffing_status = STAFFED
      # Precedence is exactly LEAD_VACANT > AT_RISK > STAFFED.
    input_set: "The residency row plus the count of its VACATED sessions"

  - name: school_partnership_health
    trigger: "any residency status change or staffing_status change at the school"
    algorithm: aggregation
    formula: |
      R = residencies of the school with status IN {DRAFT, APPROVED, ACTIVE, SUSPENDED}
      if any r in R has status == SUSPENDED:                        INTAKE_SUSPENDED
      elif any r in R has staffing_status IN {AT_RISK, LEAD_VACANT}: WATCH
      else:                                                         HEALTHY
      open_residency_count = |R|
      # Gate: INTAKE_SUSPENDED blocks POST /residencies, residency APPROVED and
      # POST /sessions at this school. WATCH blocks POST /sessions unless the
      # target residency has staffing_status == STAFFED or session_type == MAKEUP.
    input_set: "Residencies of the school filtered to status IN {DRAFT, APPROVED, ACTIVE, SUSPENDED}; COMPLETED / CLOSED / CANCELLED residencies never affect health"

  - name: residency_evaluation_index
    trigger: "POST /sessions/{id}/evaluations and POST /sessions/{id}/deliver"
    algorithm: weighted_scoring
    formula: |
      D = sessions of R with status == DELIVERED
      E = EvaluationRecord rows whose session_id IN D

      observation_mean = round_half_up(mean(e.rubric_composite
                           for e in E with evaluation_type == OBSERVATION_RUBRIC), 2)      # null if none
      survey_mean      = round_half_up(mean(e.teacher_survey_score
                           for e in E with evaluation_type == TEACHER_SURVEY), 2)          # null if none
      artifact_rate    = min(1, sum(e.student_work_artifact_count for e in E with
                           evaluation_type == STUDENT_WORK_SAMPLE) / sum(s.students_present_count for s in D))
                         # null if E has no STUDENT_WORK_SAMPLE row or sum(students_present_count) == 0

      components = [ (0.50, observation_mean / 4), (0.30, survey_mean / 5), (0.20, artifact_rate) ]
                   restricted to the entries whose value is not null
      # WEIGHT REDISTRIBUTION IS PINNED: missing components do NOT count as
      # zero; the surviving weights are renormalised by their own sum.
      if components is empty: evaluation_index = null
      else: evaluation_index = round_half_up(100 * sum(w/W * v for (w, v) in components), 1)
            where W = sum(w for (w, _) in components)
    input_set: "EvaluationRecord rows attached to DELIVERED sessions of the residency only; evaluations on cancelled sessions are excluded"
    constants:
      W_OBSERVATION: 0.50
      W_SURVEY: 0.30
      W_ARTIFACT: 0.20
      OBSERVATION_SCALE_MAX: 4
      SURVEY_SCALE_MAX: 5
    precision: "component means at 2 decimals, artifact_rate kept exact, final index round_half_up to 1 decimal"

  - name: funder_report_metrics
    trigger: "POST /funder-reports/{id}/compile"
    algorithm: aggregation
    formula: |
      SCOPE = the Residency rows named by scope_residency_ids
      DELIV(r) = sessions of r with status == DELIVERED and
                 period_start <= session_date <= period_end          # closed interval
      QUALIFYING = { r in SCOPE : |DELIV(r)| >= 1 }                  # explicit filter

      sessions_delivered_total = sum(|DELIV(r)| for r in SCOPE)

      # --- headcount: two variants over identical data (headcount_basis) ---
      students_served =
        UNDUPLICATED -> sum(r.enrolled_student_count for r in QUALIFYING)
        ENCOUNTERS   -> sum(s.students_present_count for r in SCOPE, s in DELIV(r))

      # --- demographic reach: per-residency, then summed (round per residency) ---
      frl_students_reached = sum(round_half_up(served(r) * school(r).frl_pct) for r in QUALIFYING)
      ell_students_reached = sum(round_half_up(served(r) * school(r).ell_pct) for r in QUALIFYING)
      iep_students_reached = sum(round_half_up(served(r) * school(r).iep_pct) for r in QUALIFYING)
        where served(r) = r.enrolled_student_count under UNDUPLICATED,
                          sum(s.students_present_count for s in DELIV(r)) under ENCOUNTERS

      # --- cost: bracket lookup is pinned to direct cost, NOT to total spend ---
      direct_cost_cents = sum(v.total_cents for v in PaymentVoucher
                              where v.status == APPROVED
                                and v.residency_id IN scope_residency_ids
                                and period_start <= v.period_end <= period_end)
      bracket_rate = 0.15 if direct_cost_cents <  500000
                     else 0.12 if direct_cost_cents < 1500000
                     else 0.10
      # The prose "indirect cost rate by grant spend bracket" reads as if the
      # bracket depended on total_spend_cents, which itself contains the
      # indirect cost. Evaluation order is pinned: bracket from
      # direct_cost_cents, THEN indirect, THEN total.
      indirect_cost_cents  = round_half_up(direct_cost_cents * bracket_rate)
      total_spend_cents    = direct_cost_cents + indirect_cost_cents
      cost_per_student_cents = 0 if students_served == 0
                               else round_half_up(total_spend_cents / students_served)
    input_set: "DELIVERED sessions inside the closed reporting period for delivery counts; residencies with >= 1 such session for the unduplicated headcount and demographic reach; APPROVED vouchers whose period_end falls inside the reporting period for cost"
    constants:
      INDIRECT_BRACKET_LOW_MAX_CENTS: 500000
      INDIRECT_BRACKET_MID_MAX_CENTS: 1500000
      INDIRECT_RATE_LOW: 0.15
      INDIRECT_RATE_MID: 0.12
      INDIRECT_RATE_HIGH: 0.10
    precision: "integer cents / integer headcounts, round_half_up; empty scope yields zeros, never a division error"
    variants:
      - name: unduplicated
        when: "headcount_basis == UNDUPLICATED"
        difference: "counts each residency's enrolled_student_count exactly once, and only for residencies with at least one delivered session in the period; a student attending 6 sessions counts once"
      - name: encounters
        when: "headcount_basis == ENCOUNTERS"
        difference: "sums students_present_count across every delivered session in the period; the same student counts once per session attended, so the number is strictly larger than the unduplicated figure whenever any residency delivered more than one session"

  - name: session_interval_conflict
    trigger: "POST /sessions, POST /sessions/{id}/reassign, POST /sessions/{id}/confirm"
    algorithm: interval_merge
    formula: |
      Sessions occupy the HALF-OPEN local interval [start_time, end_time) on session_date.
      BLOCKING = sessions with status IN {PLANNED, CONFIRMED, DELIVERED}

      # (1) ARTIST resource — pairwise, buffer-aware:
      for each other BLOCKING session o of the same artist on the same session_date:
        if [start,end) overlaps [o.start,o.end)                      -> ERR_ARTIST_SCHEDULE_CONFLICT
        elif residency(o).school_partner_id != residency(s).school_partner_id
             and gap_minutes(s, o) < TRAVEL_BUFFER_MINUTES           -> ERR_TRAVEL_BUFFER_VIOLATION
        # gap_minutes is the non-negative distance between the two intervals;
        # abutting sessions (gap 0) at the SAME school are allowed.

      # (2) SCHOOL resource — aggregate capacity, not pairwise:
      for each boundary instant b in the sorted set of start/end times of the
      candidate plus every BLOCKING session of the SAME SCHOOL on that date:
        load(b) = count of those intervals containing b (half-open, so an
                  interval ending exactly at b does NOT count)
        if load(b) > school.concurrent_session_capacity               -> ERR_SCHOOL_CAPACITY_EXCEEDED

      # (3) SCHOOL CALENDAR resource — closed date interval:
      if any CalendarBlackout of the school has start_date <= session_date <= end_date
                                                                     -> ERR_CALENDAR_BLACKOUT
    input_set: "BLOCKING sessions (PLANNED, CONFIRMED, DELIVERED) only; VACATED and CANCELLED_* sessions never block; the candidate session itself is excluded when re-checking on reassign"
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "minute granularity; interval arithmetic is half-open for times and closed for blackout dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the request PATH resolves, validated left-to-right"
    error_id: "ERR_SCHOOL_PARTNER_NOT_FOUND | ERR_TEACHING_ARTIST_NOT_FOUND | ERR_RESIDENCY_NOT_FOUND | ERR_LESSON_PLAN_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_FUNDER_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Every required body field exists; every supplied value satisfies its declared type, enum domain, numeric range, date format and array constraints (including array non-emptiness and no-duplicates)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST / PATCH endpoints"

  - priority: 5
    category: existence
    check: "Every id supplied in the BODY resolves (school_partner_id, lead_artist_id/teaching_artist_id, residency_id, lesson_plan_id, assigned_artist_id, substitute_artist_id, makeup_for_session_id, session_ids[], scope_residency_ids[]) and every standard_codes[] element resolves to an ArtsStandard.code"
    error_id: "ERR_SCHOOL_PARTNER_NOT_FOUND | ERR_TEACHING_ARTIST_NOT_FOUND | ERR_RESIDENCY_NOT_FOUND | ERR_LESSON_PLAN_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_UNKNOWN_STANDARD_CODE"
    http_status: "404 (ids) / 422 (ERR_UNKNOWN_STANDARD_CODE)"
    applies_to: "all endpoints with body-supplied references"

  - priority: 6
    category: auth
    check: "Resource ownership for entity_backed roles: TeachingArtist acts only on rows whose artist reference equals X-User-ID (session.assigned_artist_id, lesson_plan.author_artist_id, voucher.teaching_artist_id); SchoolLiaison acts only on rows whose residency's school_partner_id equals X-User-ID"
    error_id: ERR_ACTOR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sessions/{id}/confirm, /deliver, /cancel, /evaluations, POST /lesson-plans, POST /lesson-plans/{id}/revisions, POST /payment-vouchers, POST /payment-vouchers/{id}/submit"

  - priority: 7
    category: state
    check: "expected_<parent>_version equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_RESIDENCY_VERSION | ERR_STALE_SESSION_VERSION | ERR_STALE_VOUCHER_VERSION"
    http_status: 412
    applies_to: "POST /sessions, POST /sessions/{id}/reassign, POST /payment-vouchers/{id}/review"

  - priority: 8
    category: state
    check: "The target row is in a `from:` state that has the requested transition in §1.2 (including axis-specific checks and the reason/decision enum being legal for that transition)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_safety
    check: "Child-safety screening gate: the artist involved has vetting_status == CLEARED and clearance_status == CLEARED"
    error_id: ERR_ARTIST_NOT_CLEARED
    http_status: 403
    applies_to: "POST /sessions, POST /sessions/{id}/confirm, POST /sessions/{id}/reassign, POST /residencies/{id}/lead-artist, POST /residencies/{id}/status (APPROVED), POST /teaching-artists/{id}/roster-status (ACTIVE)"

  - priority: 10
    category: business_safety
    check: "Clearance must still be valid ON the session date, inclusive: artist.clearance_expires_on >= session.session_date"
    error_id: ERR_CLEARANCE_EXPIRED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/confirm, POST /sessions/{id}/reassign, POST /sessions/{id}/deliver"

  - priority: 11
    category: business_safety
    check: "The artist's roster_status permits the operation: assignment, confirmation and reassignment require ACTIVE (PROBATION artists may still deliver sessions confirmed before the probation)"
    error_id: ERR_ARTIST_NOT_ON_ACTIVE_ROSTER
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/confirm, POST /sessions/{id}/reassign, POST /residencies/{id}/lead-artist"

  - priority: 12
    category: business_safety
    check: "School partnership_health gate per calculations.school_partnership_health: INTAKE_SUSPENDED blocks residency creation, residency APPROVED and session creation; WATCH blocks session creation unless the target residency is STAFFED or session_type == MAKEUP"
    error_id: "ERR_PARTNERSHIP_INTAKE_SUSPENDED | ERR_PARTNERSHIP_HEALTH_GATE"
    http_status: 403
    applies_to: "POST /residencies, POST /residencies/{id}/status (APPROVED), POST /sessions"

  - priority: 13
    category: business_referential
    check: "Curriculum linkage completeness: a session may only be confirmed against an ALIGNED lesson plan; a residency may only be activated when the UNION of covered_strands over its ALIGNED plans includes every required_strand (a single plan need not cover all of them); alignment of one plan requires every standard code it names to match the residency's discipline and grade_band"
    error_id: "ERR_NO_ALIGNED_LESSON_PLAN | ERR_STANDARDS_COVERAGE_INCOMPLETE"
    http_status: 409
    applies_to: "POST /sessions/{id}/confirm, POST /residencies/{id}/status (ACTIVE), POST /lesson-plans/{id}/review"

  - priority: 14
    category: business_referential
    check: "Evaluation linkage: every session on a voucher carries an OBSERVATION_RUBRIC EvaluationRecord with all three rubric scores; and no session on the voucher is already claimed by another voucher"
    error_id: "ERR_EVALUATION_MISSING | ERR_SESSION_ALREADY_VOUCHERED"
    http_status: 409
    applies_to: "POST /payment-vouchers, POST /payment-vouchers/{id}/submit"

  - priority: 15
    category: business_referential
    check: "Funder-report linkage: every residency in scope is COMPLETED or CLOSED before certification, and the compiled snapshot has not been invalidated"
    error_id: ERR_RESIDENCY_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /funder-reports/{id}/certify"

  - priority: 16
    category: business_referential
    check: "Segregation of duties: the demonstration evaluator is not a portfolio reviewer of the same artist; the two voucher review tracks are closed by different operator ids; the report certifier is not its compiler"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /teaching-artists/{id}/vetting (DEMO_PASSED / DEMO_FAILED), POST /payment-vouchers/{id}/review, POST /funder-reports/{id}/certify"

  - priority: 17
    category: business_constraint
    check: "Capability tagging match between residency and artist: residency.discipline IN (primary_discipline + secondary_disciplines); residency.grade_band IN grade_bands; residency.instruction_language IN languages"
    error_id: "ERR_DISCIPLINE_MISMATCH | ERR_GRADE_BAND_MISMATCH | ERR_LANGUAGE_CAPABILITY_MISSING"
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{id}/reassign, POST /residencies/{id}/lead-artist, POST /lesson-plans/{id}/review"

  - priority: 18
    category: business_constraint
    check: "Vetting gate counters: PORTFOLIO_MIN_REVIEWS distinct reviewers, portfolio_mean_composite >= PORTFOLIO_ADVANCE_THRESHOLD, demo_attempt_count < DEMO_ATTEMPT_LIMIT, revision_round < ADAPTATION_ROUND_LIMIT, reliability_bps_rolling >= RELIABILITY_PROBATION_FLOOR_BPS on reinstatement"
    error_id: "ERR_INSUFFICIENT_PORTFOLIO_REVIEWS | ERR_PORTFOLIO_THRESHOLD_NOT_MET | ERR_DEMO_ATTEMPT_LIMIT_REACHED | ERR_ADAPTATION_ROUND_LIMIT | ERR_RELIABILITY_BELOW_FLOOR"
    http_status: 409
    applies_to: "POST /teaching-artists/{id}/vetting, POST /teaching-artists/{id}/roster-status, POST /lesson-plans/{id}/review, POST /lesson-plans/{id}/revisions"

  - priority: 19
    category: business_constraint
    check: "Uniqueness and shape constraints: TeachingArtist.email unique; ArtsStandard.code unique; LessonPlan.session_sequence_no unique per residency; standard_codes has no duplicates; a MAKEUP session names an unconsumed makeup-eligible cancelled session of the SAME residency; delivered minutes reach MIN_DELIVERY_FRACTION; PortfolioReview.reviewer_user_id not reused for the same artist"
    error_id: "ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_STANDARD_CODE | ERR_DUPLICATE_SEQUENCE_NO | ERR_MAKEUP_CREDIT_UNAVAILABLE | ERR_SESSION_UNDERDELIVERED | ERR_DUPLICATE_REVIEWER"
    http_status: "409 / 422"
    applies_to: "POST /teaching-artists, POST /arts-standards, POST /lesson-plans, POST /sessions, POST /sessions/{id}/deliver, POST /teaching-artists/{id}/portfolio-reviews"

  - priority: 20
    category: business_constraint
    check: "Cancellation reason is permitted for the acting role: SchoolLiaison may use SCHOOL_CLOSURE / TESTING_CONFLICT / LOW_ENROLLMENT; TeachingArtist may use ARTIST_ILLNESS only; RosterCoordinator may use any reason except RESIDENCY_DESCOPED, which is system-only"
    error_id: ERR_CANCEL_REASON_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /sessions/{id}/cancel"

  - priority: 21
    category: business_constraint
    check: "Classroom-teacher collaboration expectation: when residency.collaboration_expectation == CO_TEACH, confirmation requires co_planning_completed == true"
    error_id: ERR_CO_PLANNING_INCOMPLETE
    http_status: 409
    applies_to: "POST /sessions/{id}/confirm"

  - priority: 22
    category: business_temporal
    check: "session_date lies inside the residency term [term_start_date, term_end_date], inclusive; voucher and report periods are well-ordered and every claimed session_date lies inside the voucher period"
    error_id: "ERR_SESSION_OUTSIDE_RESIDENCY_TERM | ERR_VOUCHER_PERIOD_MISMATCH"
    http_status: "409 / 422"
    applies_to: "POST /sessions, POST /payment-vouchers, POST /payment-vouchers/{id}/submit"

  - priority: 23
    category: business_temporal
    check: "School calendar blackout: session_date is not inside any CalendarBlackout closed interval of the residency's school"
    error_id: ERR_CALENDAR_BLACKOUT
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/confirm"

  - priority: 24
    category: business_temporal
    check: "Artist resource occupation per calculations.session_interval_conflict (1): half-open overlap on the same artist and date, plus TRAVEL_BUFFER_MINUTES between sessions at different schools"
    error_id: "ERR_ARTIST_SCHEDULE_CONFLICT | ERR_TRAVEL_BUFFER_VIOLATION"
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/reassign"

  - priority: 25
    category: business_temporal
    check: "School resource occupation per calculations.session_interval_conflict (2): aggregate concurrent load at any boundary instant must not exceed concurrent_session_capacity"
    error_id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/reassign"

  - priority: 26
    category: business_fiscal
    check: "Session allotment: a REGULAR session requires sessions_unscheduled_count >= 1; a MAKEUP session requires makeup_credits_outstanding >= 1 with a matching unconsumed origin session"
    error_id: ERR_SESSION_ALLOTMENT_EXHAUSTED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 27
    category: business_fiscal
    check: "Residency budget: encumbrance at confirmation, the encumbrance swap at delivery, and voucher submission must all keep available_cents >= 0"
    error_id: ERR_RESIDENCY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions/{id}/confirm, POST /sessions/{id}/reassign, POST /sessions/{id}/deliver, POST /payment-vouchers/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- SchoolPartner -----------------------------------------------------
  - method: POST
    path: "/school-partners"
    description: "Register a school partner"
