scaffold_corner_design:
- section: entities
  instances:
  - name: case_creation_defaults_and_computed_fields
    claim_type: creation_defaults_computed
    grounds:
    - entities.Case
    - calculations.case_priority_score
    - calculations.preservation_completeness_ratio
    distinguishing_aspect: A fresh case starts in INTAKE with version 1, case_number INV-2026-0001 (first creation), pattern_escalated false, ratio 1.00 (vacuous), counters 0, and priority raw 30 / tier
      ELEVATED for severity HIGH.
    test_recipe:
      setup:
      - empty database; logical clock at default
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /api/cases
        payload:
          title: First Case
          allegation_category: FRAUD
          severity: HIGH
          department: Finance
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          cid: $.data.id
          cnum: $.data.case_number
          cstat: $.data.status
          cv: $.data.version
          cps: $.data.case_priority_score
          ctier: $.data.priority_tier
      assert:
      - response 201; Case.status == INTAKE and version == 1
      - Case.case_number == INV-2026-0001 (first case in creation order)
      - Case.pattern_escalated == false, active_privileged_artifact_count == 0, open_remediation_count == 0
      - Case.preservation_completeness_ratio == 1.00 (empty set rule)
      - Case.case_priority_score == 30 and priority_tier == ELEVATED (10*3, no boosts)
  - name: case_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.Case.fields.title
    - errors[ERR_MISSING_REQUIRED_FIELD]
    distinguishing_aspect: POST /api/cases without title is rejected with ERR_MISSING_REQUIRED_FIELD (400); no row is persisted.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/cases
        payload:
          allegation_category: FRAUD
          severity: HIGH
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_MISSING_REQUIRED_FIELD and HTTP 400
      - GET /api/cases afterwards returns total_count == 0
  - name: case_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.Case.fields.severity
    - errors[ERR_VALIDATION]
    distinguishing_aspect: severity=EXTREME is not in {LOW, MEDIUM, HIGH, CRITICAL} and is rejected with ERR_VALIDATION.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/cases
        payload:
          title: Bad Enum
          allegation_category: FRAUD
          severity: EXTREME
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and HTTP 400
  - name: get_case_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: GET on a well-formed but nonexistent case id returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /api/cases/00000000-0000-0000-0000-000000000000
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and HTTP 404
  - name: system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Case
    distinguishing_aspect: 'Client-supplied id/version/created_at in the create payload are ignored: the server mints id (UUID without type prefix), stamps created_at from the logical clock, and sets version
      1.'
    test_recipe:
      setup:
      - clock fixed at 2026-05-01T00:00:00Z
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /api/cases
        payload:
          title: SysFields
          allegation_category: BRIBERY
          severity: LOW
          department: Sales
          lead_investigator_id: inv-lead-1
          id: client-supplied
          version: 99
        as: IntakeCoordinator
        captures:
          cid: $.data.id
          cv: $.data.version
      assert:
      - Case.id != client-supplied (server-minted UUID)
      - Case.version == 1 (client version ignored)
      - Case.created_at == 2026-05-01T00:00:00Z (logical clock stamp)
  - name: allegation_anonymous_with_reporter_ref_rejected
    claim_type: conditional_validation
    grounds:
    - entities.Allegation.fields.is_anonymous
    - entities.Allegation.fields.reporter_ref
    - errors[ERR_VALIDATION]
    distinguishing_aspect: is_anonymous=true together with a non-null reporter_ref violates the anonymity invariant and is rejected with ERR_VALIDATION.
    test_recipe:
      setup:
      - one case in INTAKE
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: Anon Case
          allegation_category: HARASSMENT
          severity: MEDIUM
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      trigger:
      - call: POST /api/cases/${case_id}/allegations
        payload:
          reporter_channel: ANONYMOUS_PORTAL
          is_anonymous: true
          reporter_ref: rep-9
          narrative: x
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and HTTP 400
  - name: evidence_custodian_mismatch_rejected
    claim_type: cross_entity_validation
    grounds:
    - entities.EvidenceItem.fields.custodian_ref
    - errors[ERR_VALIDATION]
    distinguishing_aspect: An evidence item whose custodian_ref differs from its scope's custodian_ref is rejected with ERR_VALIDATION at creation.
    test_recipe:
      setup:
      - Case FIELDWORK; notice ACKNOWLEDGED for EMP-100; scope IN_PROGRESS for custodian EMP-100
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: EvCase
          allegation_category: FRAUD
          severity: HIGH
          department: Finance
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: HIGH
          department: Finance
        as: IntakeCoordinator
      - call: GET /api/cases/${case_id}
        as: Investigator
        captures:
          case_v: $.data.version
      - call: POST /api/cases/${case_id}/plans
        payload:
          scope_statement: s
          planned_start: '2026-05-02T00:00:00Z'
          planned_end: '2026-05-20T00:00:00Z'
          expected_case_version: ${case_v}
        as: Investigator
        captures:
          plan_id: $.data.id
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: SUBMITTED
        as: Investigator
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/cases/${case_id}/preservation-notices
        payload:
          custodian_ref: EMP-100
          scope: ALL_DATA
          is_regulator_ordered: false
        as: GeneralCounsel
        captures:
          n1: $.data.id
      - call: POST /api/preservation-notices/${n1}/transition
        payload:
          to_status: ACKNOWLEDGED
        as: GeneralCounsel
      - call: POST /api/cases/${case_id}/collection-scopes
        payload:
          custodian_ref: EMP-100
          data_source: EMAIL
          planned_start: '2026-05-05T00:00:00Z'
          planned_end: '2026-05-10T00:00:00Z'
          preservation_notice_id: ${n1}
        as: Investigator
        captures:
          s1: $.data.id
      - call: POST /api/collection-scopes/${s1}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/collection-scopes/${s1}/transition
        payload:
          to_status: IN_PROGRESS
        as: Investigator
      trigger:
      - call: POST /api/collection-scopes/${s1}/evidence-items
        payload:
          custodian_ref: EMP-999
          hash_value: hx
          size_bytes: 1000
          captured_at: '2026-05-06T00:00:00Z'
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (custodian_ref EMP-999 != scope custodian EMP-100)
- section: state_machines
  instances:
  - name: case_dismissed_terminal_lockdown_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Case.INTAKE_to_DISMISSED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'DISMISSED is terminal: any further transition attempt on a dismissed case fails with ERR_INVALID_STATE and changes nothing.'
    test_recipe:
      setup:
      - case created and dismissed with a rationale
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: Dismiss Me
          allegation_category: POLICY_VIOLATION
          severity: LOW
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: DISMISSED
          rationale: frivolous
        as: IntakeCoordinator
      trigger:
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: LOW
          department: Ops
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE and Case remains DISMISSED
  - name: allegation_skip_triaged_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Allegation
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Allegation cannot jump SUBMITTED->LINKED; it must pass TRIAGED first. Direct LINKED from SUBMITTED returns ERR_INVALID_STATE.
    test_recipe:
      setup:
      - case TRIAGED (triage auto-moved the allegation SUBMITTED->TRIAGED does not apply here because the allegation is filed after triage, so it sits in SUBMITTED)
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: Alg Skip
          allegation_category: FRAUD
          severity: MEDIUM
          department: Finance
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: MEDIUM
          department: Finance
        as: IntakeCoordinator
      - call: POST /api/cases/${case_id}/allegations
        payload:
          reporter_channel: EMAIL
          is_anonymous: false
          reporter_ref: rep-1
          narrative: late allegation
        as: IntakeCoordinator
        captures:
          alg_id: $.data.id
      trigger:
      - call: POST /api/allegations/${alg_id}/transition
        payload:
          to_status: LINKED
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (SUBMITTED->LINKED not a declared transition)
      - Allegation.${alg_id}.status remains SUBMITTED
  - name: interview_complete_without_upjohn_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.WitnessInterview.UPJOHN_DELIVERED_to_COMPLETED
    - errors[ERR_INVALID_STATE]
    - errors[ERR_UPJOHN_REQUIRED]
    distinguishing_aspect: 'A SCHEDULED interview cannot be COMPLETED directly: the from-state precondition fails first with ERR_INVALID_STATE (Upjohn delivery is itself a prior state, not just a flag).'
    test_recipe:
      setup:
      - Case FIELDWORK; interview SCHEDULED for 2026-05-08T14:00-15:00Z, never Upjohn-delivered
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: Upjohn
          allegation_category: HARASSMENT
          severity: MEDIUM
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: MEDIUM
          department: Ops
        as: IntakeCoordinator
      - call: GET /api/cases/${case_id}
        as: Investigator
        captures:
          case_v: $.data.version
      - call: POST /api/cases/${case_id}/plans
        payload:
          scope_statement: s
          planned_start: '2026-05-02T00:00:00Z'
          planned_end: '2026-05-20T00:00:00Z'
          expected_case_version: ${case_v}
        as: Investigator
        captures:
          plan_id: $.data.id
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: SUBMITTED
        as: Investigator
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/cases/${case_id}/interviews
        payload:
          witness_ref: W-1
          interviewer_id: inv-9
          scheduled_start: '2026-05-08T14:00:00Z'
          scheduled_end: '2026-05-08T15:00:00Z'
        as: Investigator
        captures:
          i1: $.data.id
      trigger:
      - call: POST /api/interviews/${i1}/transition
        payload:
          to_status: COMPLETED
          completion_note: memo
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (SCHEDULED has no direct COMPLETED transition)
      - WitnessInterview.${i1}.status remains SCHEDULED and upjohn_delivered_at is null
  - name: upjohn_after_window_end_rejected
    claim_type: temporal_validation
    grounds:
    - state_machines.WitnessInterview.SCHEDULED_to_UPJOHN_DELIVERED
    - errors[ERR_INTERVIEW_WINDOW_EXPIRED]
    distinguishing_aspect: Upjohn delivery at current_utc > scheduled_end is rejected with ERR_INTERVIEW_WINDOW_EXPIRED.
    test_recipe:
      setup:
      - Case FIELDWORK; interview window 2026-05-02T14:00-15:00Z; clock advanced to 2026-05-03
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: Window
          allegation_category: HARASSMENT
          severity: MEDIUM
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: MEDIUM
          department: Ops
        as: IntakeCoordinator
      - call: GET /api/cases/${case_id}
        as: Investigator
        captures:
          case_v: $.data.version
      - call: POST /api/cases/${case_id}/plans
        payload:
          scope_statement: s
          planned_start: '2026-05-02T00:00:00Z'
          planned_end: '2026-05-20T00:00:00Z'
          expected_case_version: ${case_v}
        as: Investigator
        captures:
          plan_id: $.data.id
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: SUBMITTED
        as: Investigator
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/cases/${case_id}/interviews
        payload:
          witness_ref: W-1
          interviewer_id: inv-9
          scheduled_start: '2026-05-02T14:00:00Z'
          scheduled_end: '2026-05-02T15:00:00Z'
        as: Investigator
        captures:
          i1: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-03T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /api/interviews/${i1}/transition
        payload:
          to_status: UPJOHN_DELIVERED
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INTERVIEW_WINDOW_EXPIRED
  - name: no_show_too_early_and_schedule_in_past_rejected
    claim_type: temporal_validation
    grounds:
    - state_machines.WitnessInterview.SCHEDULED_to_NO_SHOW
    - state_machines.WitnessInterview.NO_SHOW_to_SCHEDULED
    - errors[ERR_NO_SHOW_TOO_EARLY]
    - errors[ERR_SCHEDULE_IN_PAST]
    distinguishing_aspect: NO_SHOW before the window has elapsed fails with ERR_NO_SHOW_TOO_EARLY; after a legitimate NO_SHOW, rescheduling to a past start fails with ERR_SCHEDULE_IN_PAST.
    test_recipe:
      setup:
      - Case FIELDWORK; interview I window 2026-05-02T14:00-15:00Z; clock at 2026-05-02T13:00Z (before end)
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: NoShow
          allegation_category: HARASSMENT
          severity: MEDIUM
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: TRIAGED
          severity: MEDIUM
          department: Ops
        as: IntakeCoordinator
      - call: GET /api/cases/${case_id}
        as: Investigator
        captures:
          case_v: $.data.version
      - call: POST /api/cases/${case_id}/plans
        payload:
          scope_statement: s
          planned_start: '2026-05-02T00:00:00Z'
          planned_end: '2026-05-20T00:00:00Z'
          expected_case_version: ${case_v}
        as: Investigator
        captures:
          plan_id: $.data.id
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: SUBMITTED
        as: Investigator
      - call: POST /api/plans/${plan_id}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/cases/${case_id}/interviews
        payload:
          witness_ref: W-1
          interviewer_id: inv-9
          scheduled_start: '2026-05-02T14:00:00Z'
          scheduled_end: '2026-05-02T15:00:00Z'
        as: Investigator
        captures:
          i1: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T13:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /api/interviews/${i1}/transition
        payload:
          to_status: NO_SHOW
        as: Investigator
        captures:
          err1: $.data.error_id
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-03T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/interviews/${i1}/transition
        payload:
          to_status: NO_SHOW
        as: Investigator
      - call: POST /api/interviews/${i1}/transition
        payload:
          to_status: SCHEDULED
          new_start: '2026-05-02T10:00:00Z'
          new_end: '2026-05-02T11:00:00Z'
        as: Investigator
        captures:
          err2: $.data.error_id
      assert:
      - first NO_SHOW returns ERR_NO_SHOW_TOO_EARLY (clock 13:00 <= end 15:00)
      - second NO_SHOW (clock past end) succeeds and no_show_count == 1
      - reschedule with new_start in the past returns ERR_SCHEDULE_IN_PAST
  - name: evidence_admit_blocked_by_pending_designation_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.EvidenceItem.UNDER_REVIEW_to_ADMITTED
    - errors[ERR_PRIVILEGE_PENDING]
    distinguishing_aspect: Admitting evidence while a PrivilegeDesignation on it is still DESIGNATED (unconfirmed) fails with ERR_PRIVILEGE_PENDING; after the designation is CONFIRMED the admit succeeds.
    test_recipe:
