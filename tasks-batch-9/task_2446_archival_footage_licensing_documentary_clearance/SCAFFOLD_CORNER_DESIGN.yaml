        grounds:
          - state_machines.License.transitions.COUNTERED_to_QUOTED
          - state_machines.Asset.transitions.PENDING_to_OBTAINED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / asset_parallel_dimensions_advance_independently"
          rationale: "The independence of Asset dimensions A and B is asserted end-to-end by the named §1.8 instance, and its sibling non_linear_state_machine / license_negotiation_cycle_revisits_quoted_and_caps_at_six_rounds covers the six-round cyclic ceiling (ERR_NEGOTIATION_ROUND_LIMIT)."

      - name: license_expiry_cascade_and_ledger_sync
        claim_type: ledger_sync
        grounds:
          - state_machines.License.transitions.ACTIVE_to_EXPIRED
