        distinguishing_aspect: |
          A different metric (variance_count, a set-difference cardinality rather than a
          time delta) on a different endpoint (the audit submission rather than the markdown
          epoch). The interesting boundary is 0 versus 1: at exactly 0 the audit must
          short-circuit all the way to RECONCILED with write_off_total_cents 0 and
