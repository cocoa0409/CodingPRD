            - {call: "GET /injury-analyses/${ia_over}", as: WaterRightsAnalyst}
          assert:
            - "Over-credited row: gross_depletion_af 78.00, return_flow_credit_af 100.00, net_injury_af 0.00 — the max(0.00, ...) floor holds and no negative value is stored."
