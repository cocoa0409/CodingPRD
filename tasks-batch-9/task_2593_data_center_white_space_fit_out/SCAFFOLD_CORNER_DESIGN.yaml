              payload: { abort_reason: "Late cancellation attempt." }
              as: CommissioningAgent
              captures: { err_late: $.data.error_id }
          assert:
            - "the first complete returns 409 with ${err_early} == ERR_INVALID_STATE and LoadBankTest.${lbt1_id}.status == SCHEDULED, measured_kw null, result null"
            - "start returns 200 and LoadBankTest.${lbt1_id}.status == RUNNING"
            - "the second complete returns 200 with status == COMPLETED, measured_kw == 10.00, measured_return_delta_t_f == 12.0 and result == PASS"
            - "CommissioningPackage.${pkg_l4_id}.measured_load_kw == 10.00"
            - "abort returns 409 with ${err_late} == ERR_INVALID_STATE and LoadBankTest.${lbt1_id}.status is still COMPLETED with result == PASS and abort_reason null"

      - name: mop_approvals_after_reject_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MethodOfProcedure.UNDER_REVIEW_to_REJECTED
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECTED is terminal for a method of procedure: a second POST /mops/{mop_id}/approvals after a REJECT decision returns ERR_INVALID_STATE 409, approval_count stays 1 and no second MopApproval row is appended."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall CX39 is in PLANNING and owns PDU-A1 with busway BW-A1."
            - "MOP MOP-1 (target BUSWAY BW-A1, risk_class MEDIUM, window 2026-08-10T02:00:00Z .. 2026-08-10T06:00:00Z) was authored by u-elec-1, submitted, and rejected by ChangeManager u-cm-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Corner Hall 39", code: "CX39", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "Trunk torque check", risk_class: "MEDIUM", backout_plan: "Re-torque and re-close the tap box.", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop_id: $.data.id }
            - call: "POST /mops/${mop_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop_id}/approvals"
              payload: { decision: "REJECT", comment: "Backout plan does not cover the B feed." }
              as: ChangeManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /mops/${mop_id}/approvals"
              payload: { decision: "APPROVE", comment: "Reconsidered." }
              as: OperationsManager
              as_user_id: "u-om-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_INVALID_STATE"
            - "MethodOfProcedure.${mop_id}.status == REJECTED and approval_count == 1"
            - "GET /mops/${mop_id}/approvals returns exactly 1 row with decision == REJECT and sequence == 1"
            - "Hall.${hall_id}.open_mop_count == 0 and Hall.${hall_id}.release_posture == OPEN"

      - name: mop_branching_fork_between_approval_and_revision
        claim_type: branching
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MethodOfProcedure.UNDER_REVIEW_to_REVISION_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / mop_revision_cycle_returns_to_under_review
          rationale: "That §1.8 instance drives both forks of the UNDER_REVIEW join — REQUEST_REVISION back to DRAFT-equivalent REVISION_REQUESTED and then APPROVE to APPROVED — and asserts the approval round restarting after the revision."

      - name: commissioning_package_parallel_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.CommissioningPackage
        excluded_because:
          difficulty_instance: non_linear_state_machine / commissioning_package_parallel_script_and_witness_dimensions
          rationale: "That §1.8 instance walks script_status and witness_status independently through a REJECTED witness decision and the script rollback, asserting the derived package_state at every step."

      - name: mop_execute_cascades_down_to_feeds_racks_and_cage
        claim_type: cascade_down
        grounds:
          - state_machines.MethodOfProcedure.SCHEDULED_to_IN_EXECUTION
          - state_machines.Busway.ENERGIZED_to_ISOLATED
        excluded_because:
          difficulty_instance: transitive_cascade / mop_execute_busway_isolation_cascade_depth_four
          rationale: "That §1.8 instance asserts the whole depth-four chain MOP -> Busway ISOLATED -> RackFeed DERATED -> Rack AT_RISK -> Cage DEGRADED plus the hall's release_posture flip in one response."

      - name: mop_close_compensates_every_isolation_side_effect
        claim_type: compensation
        grounds:
          - state_machines.MethodOfProcedure.IN_EXECUTION_to_CLOSED
          - state_machines.MethodOfProcedure.IN_EXECUTION_to_BACKED_OUT
        excluded_because:
          difficulty_instance: compensating_invariant / mop_execute_then_back_out_conserves_rack_custody_counts
          rationale: "That §1.8 instance reverses the isolation cascade through back-out and asserts every custody counter and pre_risk_status returns to its pre-execution value with no drift."

      - name: rack_feed_release_syncs_the_hall_power_ledger
        claim_type: ledger_sync
