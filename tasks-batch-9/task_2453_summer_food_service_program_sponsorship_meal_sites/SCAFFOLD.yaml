# =============================================================================
# PRD Benchmark Seed Tables — SFSP Sponsorship & Meal Sites
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2453. Summer Food Service Program Sponsorship & Meal Sites (USDA Summer Food Service Program
  sponsor): site eligibility determination by area income data and site type, sponsor application,
  budget approval and advance payments, meal pattern compliance and vended versus self-prep meal
  production, point-of-service meal counts by category with first-meal/second-meal rules, site
  monitoring visit schedule and corrective actions, meal claim submission, edit checks and
  disallowed meals, food safety and holding time at open-air sites, outreach and attendance
  forecasting for waste minimization

domain_name: sfsp-sponsor-meal-sites
api_prefix: "/sfsp"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - waterfall_allocation

  entity_topology: graph
  # graph: Sponsor / Site / MealClaim are peers linked by FK; ClaimLineItem is a
  # junction between MealClaim and Site (many-to-many); CorrectiveAction and
  # MealCountEntry are self-referential (follow-up chains, reversal chains);
  # CorrectiveAction cross-references both MonitoringVisit and Site.

  state_machine_shape: cyclic
  # cyclic: SponsorBudget (REVISION_REQUESTED -> SUBMITTED), MealClaim
  # (EDIT_CHECK_FAILED -> DRAFT -> SUBMITTED; PAID -> REVISION_OPENED -> DRAFT),
  # CorrectiveAction (REJECTED -> RESPONSE_SUBMITTED). Site additionally carries
  # two independent parallel state dimensions (approval_status x operating_status).

  relationship_patterns:
    - one_to_many          # Sponsor -> Site, Sponsor -> MealClaim, MealServiceDay -> MealCountEntry
    - many_to_many         # MealClaim <-> Site through ClaimLineItem
    - self_referential     # CorrectiveAction.follow_up_of_corrective_action_id, MealCountEntry.reversal_of_entry_id
    - cross_aggregate      # CorrectiveAction references MonitoringVisit and Site; ClaimLineItem reads MealServiceDay aggregates

  role_model: segregation_of_duties
  # The FieldMonitor who filed the report that opened a CorrectiveAction may not
  # review/close it; the SponsorAdmin who submits a claim can never validate or
  # pay it; SiteSupervisor records counts but cannot finalize a service day.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities, 60 endpoints, 65 error codes, 10 calculations (3 with variants),
  # 8 state machines (2 cyclic, 1 parallel-dimension, 1 branching fork).

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the sponsoring organization.
      - name: sponsor_type
        type: enum
        source: input
        description: Organization category that drives advance eligibility.
        constraints: "one of {SCHOOL_FOOD_AUTHORITY, GOVERNMENT, NONPROFIT, CAMP_OPERATOR}"
      - name: experience_status
        type: enum
        source: input
        description: Whether the sponsor operated SFSP in a prior program year.
        constraints: "one of {NEW, EXPERIENCED}"
      - name: program_year
        type: integer
        source: input
        description: Program year this sponsorship record covers.
        constraints: ">= 2020"
      - name: advance_eligible
        type: boolean
        source: input
        default: false
        description: State-agency flag permitting advance payment requests.
      - name: application_status
        type: enum
        source: system
        default: DRAFT
        description: Sponsor application lifecycle state (see §1.2 Sponsor).
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, DENIED, TERMINATED}"
      - name: application_decision_reason
        type: string
        source: system
        default: null
        description: Reviewer-supplied reason recorded on DENIED or TERMINATED.
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the application was approved.
      - name: advance_paid_cents
        type: integer
        source: computed
        default: 0
        description: Lifetime sum of approved_amount_cents over AdvancePayment rows that reached DISBURSED.
      - name: advance_recovered_cents
        type: integer
        source: computed
        default: 0
        description: Lifetime sum of recovered_amount_cents over this sponsor's AdvancePayment rows.
      - name: advance_outstanding_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: advance_paid_cents - advance_recovered_cents (see calculations.advance_recovery_waterfall)."
      - name: reimbursement_paid_cents
        type: integer
        source: computed
        default: 0
        description: Sum of net_payable_cents over this sponsor's MealClaim rows currently in status PAID.

  - name: AreaEligibilityRecord
    parent: null
    common_fields: false      # immutable append-only row: carries id and created_at, but no updated_at and no version
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted identifier. Never used in any business decision or ordering.
      - name: created_at
        type: datetime
        source: system
        description: Server-stamped creation time from the logical clock; the only sanctioned tie-break ordering key.
      - name: area_code
        type: string
        source: input
        description: Census tract or school attendance-area identifier.
        constraints: "unique across AreaEligibilityRecord rows with the same data_source"
      - name: data_source
        type: enum
        source: input
        description: Which income dataset the percentage came from.
        constraints: "one of {SCHOOL_DATA, CENSUS_ACS}"
      - name: free_reduced_pct
        type: number
        source: input
        description: For SCHOOL_DATA, percent of children approved for free/reduced-price meals; for CENSUS_ACS, percent of children in households below 185% of the federal poverty line.
        constraints: "0 <= free_reduced_pct <= 100, at most 2 decimal places"
      - name: determination_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the percentage was determined.
      - name: valid_through_date
        type: string
        source: input
        description: Last date (YYYY-MM-DD) on which this record may support an area-eligibility determination.

  - name: SponsorBudget
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; the sponsor whose program-year budget this is.
      - name: program_year
        type: integer
        source: input
        description: Program year the budget covers; must equal Sponsor.program_year.
      - name: operating_cost_budget_cents
        type: integer
        source: input
        description: Requested operating-cost line (food, labor, delivery).
        constraints: "> 0"
      - name: admin_cost_budget_cents
        type: integer
        source: input
        description: Requested administrative-cost line.
        constraints: ">= 0"
      - name: projected_total_meals
        type: integer
        source: input
        description: Sponsor's projected reimbursable meal count for the season.
        constraints: "> 0"
      - name: admin_cost_ratio
        type: number
        source: computed
        description: "admin_cost_budget_cents / (operating_cost_budget_cents + admin_cost_budget_cents), 4 decimal places, round_half_up."
      - name: approved_operating_cost_cents
        type: integer
        source: system
        default: null
        description: Operating ceiling written by the state agency on APPROVED.
      - name: approved_admin_cost_cents
        type: integer
        source: system
        default: null
        description: Administrative ceiling written by the state agency on APPROVED.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Budget lifecycle state (see §1.2 SponsorBudget).
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REVISION_REQUESTED, AMENDMENT_PENDING, WITHDRAWN}"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: Increments by 1 each time the budget re-enters SUBMITTED from REVISION_REQUESTED.
      - name: decision_reason
        type: string
        source: system
        default: null
        description: Reviewer note stored on REVISION_REQUESTED or WITHDRAWN.

  - name: AdvancePayment
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; sponsor receiving the advance.
      - name: request_month
        type: string
        source: input
        description: Operating month the advance covers (YYYY-MM).
        constraints: "matches ^\\d{4}-(06|07|08)$"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount requested by the sponsor.
        constraints: "> 0"
      - name: approved_amount_cents
        type: integer
        source: system
        default: null
        description: Amount the state agency approved; may be lower than requested.
      - name: recovered_amount_cents
        type: integer
        source: system
        default: 0
        description: Cumulative amount recovered from paid claims by the recovery waterfall.
      - name: outstanding_cents
        type: integer
        source: computed
        default: 0
        description: "approved_amount_cents - recovered_amount_cents for statuses in {DISBURSED, PARTIALLY_RECOVERED, DEMAND_ISSUED}; 0 otherwise."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Advance lifecycle state (see §1.2 AdvancePayment).
        constraints: "one of {REQUESTED, APPROVED, DENIED, DISBURSED, PARTIALLY_RECOVERED, RECOVERED, DEMAND_ISSUED}"
      - name: disbursed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of disbursement.
      - name: demand_issued_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant a recovery demand was issued; retains its value through recovery reversal so status can be restored deterministically.
      - name: decision_reason
        type: string
        source: system
        default: null
        description: Reason recorded on DENIED or DEMAND_ISSUED.

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; sponsor operating this meal site.
      - name: area_eligibility_record_id
        type: string
        source: input
        default: null
        description: FK -> AreaEligibilityRecord.id; null when the site's eligibility basis is enrollment documentation or camp individual eligibility.
      - name: name
        type: string
        source: input
        description: Site name as it appears on the sponsor application.
      - name: site_type
        type: enum
        source: input
        description: SFSP site category.
        constraints: "one of {OPEN, RESTRICTED_OPEN, CLOSED_ENROLLED, CAMP, MIGRANT}"
      - name: production_mode
        type: enum
        source: input
        description: Whether meals are produced on site or bought from a food-service vendor.
        constraints: "one of {SELF_PREP, VENDED}"
      - name: is_open_air
        type: boolean
        source: input
        default: false
        description: True when service occurs outdoors with no climate-controlled holding; enables holding-time enforcement.
      - name: is_rural
        type: boolean
        source: input
        default: false
        description: True when the site is in a rural area; selects the rate class together with production_mode.
      - name: approved_meal_types
        type: array
        source: input
        description: Meal types the site may serve.
        constraints: "non-empty subset of {BREAKFAST, AM_SNACK, LUNCH, PM_SNACK, SUPPER}; at most 2 elements unless site_type in {CAMP, MIGRANT} (then at most 3 with at least one of {AM_SNACK, PM_SNACK})"
      - name: approved_max_attendance
        type: integer
        source: input
        description: Approved per-meal-type attendance cap used as the first-meal reimbursable ceiling.
        constraints: "> 0"
      - name: enrolled_free_reduced_pct
        type: number
        source: input
        default: null
        description: Percent of enrolled children documented as free/reduced eligible; required for CLOSED_ENROLLED sites.
        constraints: "0 <= value <= 100 when present"
      - name: operating_start_date
        type: string
        source: input
        description: First date (YYYY-MM-DD) the site may serve meals.
      - name: operating_end_date
        type: string
        source: input
        description: Last date (YYYY-MM-DD) the site may serve meals; must be >= operating_start_date.
      - name: eligibility_basis
        type: enum
        source: computed
        default: UNDETERMINED
        description: Output of calculations.site_eligibility_determination.
        constraints: "one of {UNDETERMINED, AREA_ELIGIBLE, ENROLLED_DOCUMENTATION, CAMP_INDIVIDUAL, NOT_ELIGIBLE}"
      - name: eligibility_pct_used
        type: number
        source: computed
        default: null
        description: The percentage the determination compared against the 50.00 threshold.
      - name: approval_status
        type: enum
        source: system
        default: PENDING_REVIEW
        description: Approval dimension of the Site parallel state machine (see §1.2 Site).
        constraints: "one of {PENDING_REVIEW, APPROVED, DENIED, SUSPENDED}"
      - name: operating_status
        type: enum
        source: system
        default: NOT_STARTED
        description: Operating dimension of the Site parallel state machine; evolves independently of approval_status.
        constraints: "one of {NOT_STARTED, OPERATING, CLOSED_FOR_SEASON}"
      - name: first_operating_date
        type: string
        source: computed
        default: null
        description: Earliest service_date among this site's MealServiceDay rows whose status has ever reached OPEN; null before the first day opens.
      - name: claim_hold
        type: boolean
        source: system
        default: false
        description: True while a CRITICAL corrective action or a compliance-flag threshold breach blocks this site's meals from being claimed.
      - name: compliance_flag_count
        type: integer
        source: system
        default: 0
        description: Number of edit-check disallowances attributed to this site; at 2 the system opens a MAJOR corrective action.
      - name: voided_day_count
        type: integer
        source: system
        default: 0
        description: Count of this site's MealServiceDay rows voided by suspension cascade.
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: Reason recorded when approval_status becomes SUSPENDED or DENIED.

  - name: MealServiceDay
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site serving meals on this date.
      - name: service_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of service; unique per site.
      - name: meal_services
        type: array
        source: input
        description: "Planned services for the day: objects {meal_type, planned_meals, service_start (HH:MM), service_end (HH:MM)}."
        constraints: "non-empty; each meal_type unique within the array and present in Site.approved_meal_types; service_start < service_end"
      - name: production_mode
        type: enum
        source: system
        description: Copied from Site.production_mode at creation and frozen thereafter.
        constraints: "one of {SELF_PREP, VENDED}"
      - name: production_counts
        type: object
        source: system
        default: null
        description: "Map meal_type -> meals prepared (SELF_PREP) or delivered (VENDED), written by POST /open."
      - name: food_received_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant food became ready/was delivered; holding-time baseline. Written by POST /open.
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Service-day lifecycle state (see §1.2 MealServiceDay).
        constraints: "one of {PLANNED, OPEN, CLOSED, FINALIZED, VOIDED}"
      - name: food_safety_status
        type: enum
        source: system
        default: OK
        description: Set to BREACH by the first breaching HoldingLogEntry.
        constraints: "one of {OK, BREACH}"
      - name: breach_at
        type: datetime
        source: system
        default: null
        description: measured_at of the first breaching HoldingLogEntry.
      - name: counted_first_meals
        type: integer
        source: computed
        default: 0
        description: Net sum of first_meals over this day's MealCountEntry rows (ORIGINAL minus REVERSAL).
      - name: counted_second_meals
        type: integer
        source: computed
        default: 0
        description: Net sum of second_meals over this day's MealCountEntry rows (ORIGINAL minus REVERSAL).
      - name: counted_adult_meals
        type: integer
        source: computed
        default: 0
        description: Net sum of adult_meals over this day's MealCountEntry rows (ORIGINAL minus REVERSAL).
      - name: reimbursable_meals
        type: integer
        source: computed
        default: 0
        description: Output of calculations.point_of_service_meal_classification for the whole day.
      - name: non_reimbursable_meals
        type: integer
        source: computed
        default: 0
        description: "Conserved complement: counted_first_meals + counted_second_meals + counted_adult_meals - reimbursable_meals."
      - name: discarded_meals
        type: integer
        source: computed
        default: 0
        description: Meals removed from service by a food-safety breach (unserved production at breach_at).
      - name: leftover_meals
        type: integer
        source: computed
        default: 0
        description: "sum(production_counts) - counted_first_meals - counted_second_meals - counted_adult_meals - discarded_meals, floored at 0."
      - name: void_reason
        type: string
        source: system
        default: null
        description: Reason recorded when status becomes VOIDED.

  - name: MealCountEntry
    parent: MealServiceDay
    common_fields: false      # immutable append-only row: carries id and created_at, but no updated_at and no version
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted identifier. Never used in any business decision or ordering.
      - name: created_at
        type: datetime
        source: system
        description: Server-stamped creation time from the logical clock; the only sanctioned tie-break ordering key.
      - name: meal_service_day_id
        type: string
        source: input
        description: FK -> MealServiceDay.id; the service day this point-of-service count belongs to.
      - name: reversal_of_entry_id
        type: string
        source: input
        default: null
        description: FK -> MealCountEntry.id; set when this row reverses an earlier ORIGINAL entry, null otherwise.
      - name: meal_type
        type: enum
        source: input
        description: Meal category counted at the point of service.
        constraints: "one of {BREAKFAST, AM_SNACK, LUNCH, PM_SNACK, SUPPER}"
      - name: first_meals
        type: integer
        source: input
        description: Number of first meals served to children.
        constraints: ">= 0"
      - name: second_meals
        type: integer
        source: input
        description: Number of second meals served to children.
        constraints: ">= 0"
      - name: adult_meals
        type: integer
        source: input
        description: Number of meals served to adults; never reimbursable.
        constraints: ">= 0"
      - name: entry_kind
        type: enum
        source: computed
        description: ORIGINAL when reversal_of_entry_id is null, REVERSAL otherwise.
        constraints: "one of {ORIGINAL, REVERSAL}"
      - name: reimbursable_first_meals
        type: integer
        source: computed
        description: This entry's contribution to the day's reimbursable first meals after the attendance cap and production waterfall.
      - name: reimbursable_second_meals
        type: integer
        source: computed
        description: This entry's contribution to the day's reimbursable second meals (non-zero only for CAMP sites within the 2% allowance).
      - name: non_reimbursable_meals
        type: integer
        source: computed
        description: first_meals + second_meals + adult_meals - reimbursable_first_meals - reimbursable_second_meals.
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the count was posted.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the SiteSupervisor who posted the count.

  - name: HoldingLogEntry
    parent: MealServiceDay
    common_fields: false      # immutable append-only row: carries id and created_at, but no updated_at and no version
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted identifier. Never used in any business decision or ordering.
      - name: created_at
        type: datetime
        source: system
        description: Server-stamped creation time from the logical clock; the only sanctioned tie-break ordering key.
      - name: meal_service_day_id
        type: string
        source: input
        description: FK -> MealServiceDay.id; the service day being temperature-logged.
      - name: meal_type
        type: enum
        source: input
        description: Meal category the reading applies to.
        constraints: "one of {BREAKFAST, AM_SNACK, LUNCH, PM_SNACK, SUPPER}"
      - name: temperature_class
        type: enum
        source: input
        description: Whether the item is held cold or hot; selects the safe band.
        constraints: "one of {COLD, HOT}"
      - name: temperature_f
        type: number
        source: input
        description: Measured temperature in degrees Fahrenheit.
        constraints: "-20 <= value <= 250, at most 1 decimal place"
      - name: measured_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the reading; must be >= MealServiceDay.food_received_at.
      - name: holding_minutes
        type: integer
        source: computed
        description: Whole minutes from MealServiceDay.food_received_at to measured_at, truncated toward zero.
      - name: breach_flag
        type: boolean
        source: computed
        description: Output of calculations.holding_time_breach_evaluation.
      - name: breach_reason
        type: enum
        source: computed
        default: null
        description: Why the reading breached; null when breach_flag is false.
        constraints: "one of {TEMP_OUT_OF_BAND, HOLDING_TIME_EXCEEDED, null}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who logged the reading.

  - name: MonitoringVisit
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site being monitored.
      - name: monitor_user_id
        type: string
        source: input
        description: Opaque FieldMonitor identifier who owns the visit; the scheduling resource for overlap checks.
      - name: visit_type
        type: enum
        source: input
        description: Monitoring obligation this visit satisfies.
        constraints: "one of {FIRST_WEEK, FULL_REVIEW, FOLLOW_UP}"
      - name: scheduled_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the visit.
      - name: window_start
        type: string
        source: input
        description: Planned on-site window start (HH:MM, 24h).
      - name: window_end
        type: string
        source: input
        description: Planned on-site window end (HH:MM, 24h); must be > window_start.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Visit lifecycle state (see §1.2 MonitoringVisit).
        constraints: "one of {SCHEDULED, CONDUCTED, REPORT_FILED, CLOSED, CANCELLED}"
      - name: conducted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the visit was marked conducted.
      - name: findings
        type: array
        source: system
        default: null
        description: "Objects {finding_code, severity} written by POST /report."
      - name: highest_severity
        type: enum
        source: computed
        default: NONE
        description: Maximum severity across findings under the order MINOR < MAJOR < CRITICAL.
        constraints: "one of {NONE, MINOR, MAJOR, CRITICAL}"
      - name: due_date
        type: string
        source: computed
        default: null
        description: Output of calculations.monitoring_schedule_compliance; null until Site.first_operating_date is known.
      - name: is_late
        type: boolean
        source: computed
        default: false
        description: True when conducted_at's UTC date is after due_date, or when due_date has passed while status is still SCHEDULED.
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: Reason recorded on CANCELLED.

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site that must correct the deficiency.
      - name: monitoring_visit_id
        type: string
        source: input
        default: null
        description: FK -> MonitoringVisit.id; the visit whose finding opened this action, null when origin is COMPLIANCE_FLAG.
      - name: follow_up_of_corrective_action_id
        type: string
        source: input
        default: null
        description: FK -> CorrectiveAction.id; set on the action created when a prior action's response is rejected, null on first-round actions.
      - name: origin
        type: enum
        source: system
        description: What created the action.
        constraints: "one of {VISIT_FINDING, COMPLIANCE_FLAG}"
      - name: finding_code
        type: string
        source: system
        description: Deficiency code copied from the finding, or COMPLIANCE_FLAG_THRESHOLD for system-generated actions.
      - name: severity
        type: enum
        source: system
        description: Severity inherited from the finding; COMPLIANCE_FLAG origin is always MAJOR.
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Corrective-action lifecycle state (see §1.2 CorrectiveAction).
        constraints: "one of {OPEN, RESPONSE_SUBMITTED, REJECTED, CLOSED, ESCALATED}"
      - name: due_date
        type: string
        source: computed
        description: "Response deadline: opened date + 5 days for CRITICAL, + 15 days for MAJOR, + 30 days for MINOR."
      - name: rejection_count
        type: integer
        source: system
        default: 0
        description: Number of times a submitted response was rejected on this action.
      - name: response_note
        type: string
        source: system
        default: null
        description: Latest sponsor response text.
      - name: evidence_ref
        type: string
        source: system
        default: null
        description: Latest sponsor evidence reference.
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldMonitor who filed the originating report, or "SYSTEM" for COMPLIANCE_FLAG origin.
      - name: closed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FieldMonitor who closed the action; must differ from opened_by_user_id.

  - name: MealClaim
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; sponsor submitting the monthly claim.
      - name: claim_month
        type: string
        source: input
        description: Operating month claimed (YYYY-MM).
        constraints: "matches ^\\d{4}-(06|07|08)$"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Claim lifecycle state (see §1.2 MealClaim).
        constraints: "one of {DRAFT, SUBMITTED, EDIT_CHECK_FAILED, VALIDATED, PAID, REVISION_OPENED}"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: Increments by 1 on each re-entry into DRAFT from EDIT_CHECK_FAILED or REVISION_OPENED.
      - name: claimed_operating_cost_cents
        type: integer
        source: system
        default: null
        description: Net allowable operating cost asserted at submit.
      - name: claimed_admin_cost_cents
        type: integer
        source: system
        default: null
        description: Net allowable administrative cost asserted at submit.
      - name: meals_rate_value_cents
        type: integer
        source: computed
        default: 0
        description: Sum of ClaimLineItem.meals_rate_value_cents over this claim's line items (see calculations.claim_meals_rate_value).
      - name: preliminary_reimbursement_cents
        type: integer
        source: computed
        default: null
        description: PRELIMINARY variant of calculations.claim_reimbursement, written at submit.
      - name: final_reimbursement_cents
        type: integer
        source: computed
        default: null
        description: FINAL variant of calculations.claim_reimbursement, written at edit-check.
      - name: advance_offset_cents
        type: integer
        source: computed
        default: null
        description: Amount of final_reimbursement_cents applied to outstanding advances at pay time.
      - name: net_payable_cents
        type: integer
        source: computed
        default: null
        description: final_reimbursement_cents - advance_offset_cents.
      - name: disallowed_meal_count
        type: integer
        source: computed
        default: 0
        description: Sum of ClaimLineItem.disallowed_meal_count over this claim's line items.
      - name: blocking_hold_count
        type: integer
        source: computed
        default: 0
        description: Number of this claim's line items whose hold_flag is true.
      - name: edit_check_failure_codes
        type: array
        source: system
        default: null
        description: Distinct ClaimLineItem.disallow_reason values that caused EDIT_CHECK_FAILED, sorted ascending.
      - name: deadline_date
        type: string
        source: computed
        description: Last day of the second month after claim_month (60-day claim deadline).
      - name: is_late
        type: boolean
        source: computed
        default: false
        description: True when the submit occurred after deadline_date.
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent submit.
      - name: paid_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of payment.

  - name: ClaimLineItem
    parent: MealClaim
    common_fields: true
    fields:
      - name: meal_claim_id
        type: string
        source: input
        description: FK -> MealClaim.id; the claim this per-site line belongs to.
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the site whose finalized service days this line aggregates.
      - name: rate_class
        type: enum
        source: computed
        description: "RURAL_OR_SELF_PREP when Site.is_rural is true or Site.production_mode is SELF_PREP; OTHER otherwise."
        constraints: "one of {RURAL_OR_SELF_PREP, OTHER}"
      - name: finalized_day_count
        type: integer
        source: computed
        description: Number of the site's MealServiceDay rows with status FINALIZED whose service_date falls in claim_month.
      - name: claimed_first_meals_by_type
        type: object
        source: computed
        description: "Map meal_type -> summed MealServiceDay reimbursable first meals over the finalized days in claim_month."
      - name: claimed_second_meals_by_type
        type: object
        source: computed
        description: "Map meal_type -> summed MealServiceDay reimbursable second meals over the finalized days in claim_month."
      - name: disallowed_counts_by_type
        type: object
        source: computed
        default: null
        description: "Map meal_type -> meals removed by edit check; null before edit check runs."
      - name: meals_rate_value_cents
        type: integer
        source: computed
        description: Per-line meals-times-rates value with rounding pinned at (line, meal_type) granularity (see calculations.claim_meals_rate_value).
      - name: disallowed_meal_count
        type: integer
        source: computed
        default: 0
        description: Total meals removed from this line by edit check.
      - name: edit_check_status
        type: enum
        source: computed
        default: PENDING
        description: Result of the edit check for this line.
        constraints: "one of {PENDING, PASSED, FAILED}"
      - name: disallow_reason
        type: enum
        source: computed
        default: NONE
        description: Why meals on this line were disallowed.
        constraints: "one of {NONE, MISSING_MONITORING, FOOD_SAFETY_BREACH, EXCEEDS_PRODUCTION}"
      - name: hold_flag
        type: boolean
        source: system
        default: false
        description: True when the referenced Site has claim_hold true; blocks claim submission.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Sponsor
    state_field: application_status
    initial_state: DRAFT
    terminal_states: [DENIED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sfsp/sponsors/{sponsor_id}/application-submit"
        actor: SponsorAdmin
        preconditions:
          - "Sponsor.application_status == DRAFT"
          - "X-User-ID == Sponsor.id"
        side_effects:
          - "Sponsor.version += 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sfsp/sponsors/{sponsor_id}/application-decision with decision=APPROVED"
        actor: StateAgencyReviewer
        preconditions:
          - "Sponsor.application_status == SUBMITTED"
        side_effects:
          - "Sponsor.approved_at = logical clock now"
          - "Sponsor.version += 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /sfsp/sponsors/{sponsor_id}/application-decision with decision=DENIED"
        actor: StateAgencyReviewer
        preconditions:
          - "Sponsor.application_status == SUBMITTED"
          - "reason is present in the request body"
        side_effects:
          - "Sponsor.application_decision_reason = reason"
          - "Sponsor.version += 1"

      - from: APPROVED
        to: TERMINATED
        trigger: "POST /sfsp/sponsors/{sponsor_id}/application-decision with decision=TERMINATED"
        actor: StateAgencyReviewer
        preconditions:
          - "Sponsor.application_status == APPROVED"
          - "reason is present in the request body"
        side_effects:
          - "Sponsor.application_decision_reason = reason"
          - "cascade hop 1: every Site with sponsor_id == Sponsor.id and approval_status IN {PENDING_REVIEW, APPROVED, SUSPENDED} moves to approval_status DENIED with suspension_reason = 'SPONSOR_TERMINATED'"
          - "cascade hop 2: because those Sites became DENIED, each of their MealServiceDay rows with status IN {PLANNED, OPEN} moves to VOIDED with void_reason = 'SITE_DENIED' and Site.voided_day_count increments per voided day"
          - "Sponsor.version += 1"

  - entity: SponsorBudget
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "Cyclic: REVISION_REQUESTED -> SUBMITTED -> REVISION_REQUESTED (revision loop) and APPROVED -> AMENDMENT_PENDING -> APPROVED (amendment loop). Both loops reuse the same submit/decision endpoint pair."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/submit"
        actor: SponsorAdmin
        preconditions:
          - "SponsorBudget.status == DRAFT"
          - "Sponsor.application_status == APPROVED"
          - "SponsorBudget.admin_cost_ratio <= 0.2000"
        side_effects:
          - "SponsorBudget.version += 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=APPROVED"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == SUBMITTED"
          - "approved_operating_cost_cents <= SponsorBudget.operating_cost_budget_cents"
          - "approved_admin_cost_cents <= SponsorBudget.admin_cost_budget_cents"
        side_effects:
          - "SponsorBudget.approved_operating_cost_cents / approved_admin_cost_cents written from the request"
          - "SponsorBudget.version += 1"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=REVISION_REQUESTED"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == SUBMITTED"
          - "reason is present in the request body"
        side_effects:
          - "SponsorBudget.decision_reason = reason"
          - "SponsorBudget.version += 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/submit (revision loop)"
        actor: SponsorAdmin
        preconditions:
          - "SponsorBudget.status == REVISION_REQUESTED"
          - "SponsorBudget.admin_cost_ratio <= 0.2000"
        side_effects:
          - "SponsorBudget.revision_round += 1"
          - "SponsorBudget.decision_reason = null"
          - "SponsorBudget.version += 1"

      - from: APPROVED
        to: AMENDMENT_PENDING
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/submit (amendment loop)"
        actor: SponsorAdmin
        preconditions:
          - "SponsorBudget.status == APPROVED"
          - "SponsorBudget.admin_cost_ratio <= 0.2000"
        side_effects:
          - "SponsorBudget.version += 1"
        note: "Approved ceilings remain in force while the amendment is pending, so claims may still be submitted."

      - from: AMENDMENT_PENDING
        to: APPROVED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=APPROVED"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == AMENDMENT_PENDING"
          - "approved_operating_cost_cents <= SponsorBudget.operating_cost_budget_cents"
          - "approved_admin_cost_cents <= SponsorBudget.admin_cost_budget_cents"
        side_effects:
          - "approved ceilings overwritten from the request"
          - "SponsorBudget.revision_round += 1"
          - "SponsorBudget.version += 1"

      - from: AMENDMENT_PENDING
        to: REVISION_REQUESTED
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=REVISION_REQUESTED"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == AMENDMENT_PENDING"
          - "reason is present in the request body"
        side_effects:
          - "SponsorBudget.decision_reason = reason"
          - "SponsorBudget.approved_operating_cost_cents and approved_admin_cost_cents are cleared to null"
          - "SponsorBudget.version += 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=WITHDRAWN"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == SUBMITTED"
          - "reason is present in the request body"
        side_effects:
          - "SponsorBudget.decision_reason = reason"
          - "SponsorBudget.version += 1"

      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /sfsp/sponsor-budgets/{budget_id}/decision with decision=WITHDRAWN"
        actor: StateAgencyReviewer
        preconditions:
          - "SponsorBudget.status == REVISION_REQUESTED"
          - "reason is present in the request body"
        side_effects:
          - "SponsorBudget.decision_reason = reason"
          - "SponsorBudget.version += 1"

  - entity: Site
    state_field: "approval_status x operating_status (two independent parallel dimensions on the same row)"
    initial_state: "approval_status=PENDING_REVIEW, operating_status=NOT_STARTED"
    terminal_states: ["approval_status=DENIED", "operating_status=CLOSED_FOR_SEASON"]
    note: "Parallel dimensions: a suspension on the approval axis never changes operating_status, and closing the season never changes approval_status. Reimbursability requires a specific pair of values on both axes."
    transitions:
      - dimension: approval_status
        from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /sfsp/sites/{site_id}/approval-decision with decision=APPROVED"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.approval_status == PENDING_REVIEW"
          - "Site.eligibility_basis IN {AREA_ELIGIBLE, ENROLLED_DOCUMENTATION, CAMP_INDIVIDUAL}"
          - "Sponsor.application_status == APPROVED"
        side_effects:
          - "Site.version += 1"

      - dimension: approval_status
        from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /sfsp/sites/{site_id}/approval-decision with decision=DENIED"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.approval_status == PENDING_REVIEW"
          - "reason is present in the request body"
        side_effects:
          - "Site.suspension_reason = reason"
          - "Site.version += 1"

      - dimension: approval_status
        from: APPROVED
        to: SUSPENDED
        trigger: "POST /sfsp/sites/{site_id}/approval-decision with decision=SUSPENDED"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.approval_status == APPROVED"
          - "reason is present in the request body"
        side_effects:
          - "Site.suspension_reason = reason; Site.claim_hold = true"
          - "every MealServiceDay of this site with status IN {PLANNED, OPEN} and service_date >= logical clock date moves to VOIDED with void_reason = 'SITE_SUSPENDED'; Site.voided_day_count increments per voided day"
          - "every ClaimLineItem whose site_id == Site.id and whose parent MealClaim.status IN {DRAFT, REVISION_OPENED} sets hold_flag = true, and each such MealClaim.blocking_hold_count is recomputed"
          - "Site.version += 1"

      - dimension: approval_status
        from: APPROVED
        to: SUSPENDED
        trigger: "system event: a CorrectiveAction with severity CRITICAL is created for this site (cascade hop 2 of the visit-report cascade)"
        actor: system
        preconditions:
          - "Site.approval_status == APPROVED"
          - "the newly created CorrectiveAction.severity == CRITICAL"
        side_effects:
          - "Site.suspension_reason = 'CRITICAL_FINDING:' + CorrectiveAction.finding_code; Site.claim_hold = true"
          - "cascade hop 3: because Site.approval_status became SUSPENDED, every MealServiceDay of this site with status IN {PLANNED, OPEN} and service_date >= logical clock date moves to VOIDED with void_reason = 'SITE_SUSPENDED' and Site.voided_day_count increments per voided day"
          - "cascade hop 4: because Site.claim_hold became true, every ClaimLineItem whose site_id == Site.id and whose parent MealClaim.status IN {DRAFT, REVISION_OPENED} sets hold_flag = true and each such MealClaim.blocking_hold_count is recomputed"
          - "Site.version += 1"

      - dimension: approval_status
        from: SUSPENDED
        to: APPROVED
        trigger: "POST /sfsp/sites/{site_id}/approval-decision with decision=APPROVED (reinstatement) OR system event: the last CorrectiveAction with severity CRITICAL for this site reaches CLOSED"
        actor: StateAgencyReviewer | system
        preconditions:
          - "Site.approval_status == SUSPENDED"
          - "no CorrectiveAction with site_id == Site.id has severity CRITICAL and status IN {OPEN, RESPONSE_SUBMITTED, REJECTED, ESCALATED}"
        side_effects:
          - "Site.suspension_reason = null; Site.claim_hold = false"
          - "every ClaimLineItem whose site_id == Site.id and whose parent MealClaim.status IN {DRAFT, REVISION_OPENED} sets hold_flag = false, and each such MealClaim.blocking_hold_count is recomputed"
          - "Site.version += 1"
        note: "Compensating transition for the suspension cascade: it reverses hop 4 (line-item holds) but never un-voids the MealServiceDay rows voided in hop 3."

      - dimension: approval_status
        from: SUSPENDED
        to: DENIED
        trigger: "POST /sfsp/sites/{site_id}/approval-decision with decision=DENIED"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.approval_status == SUSPENDED"
          - "reason is present in the request body"
        side_effects:
          - "Site.suspension_reason = reason"
          - "every MealServiceDay of this site with status IN {PLANNED, OPEN} moves to VOIDED with void_reason = 'SITE_DENIED'; Site.voided_day_count increments per voided day"
          - "Site.version += 1"

      - dimension: operating_status
        from: NOT_STARTED
        to: OPERATING
        trigger: "POST /sfsp/sites/{site_id}/operating-status with to_status=OPERATING"
        actor: SponsorAdmin
        preconditions:
          - "Site.operating_status == NOT_STARTED"
          - "Site.approval_status == APPROVED"
          - "X-User-ID == Site.sponsor_id"
        side_effects:
          - "Site.version += 1"

      - dimension: operating_status
        from: OPERATING
        to: CLOSED_FOR_SEASON
        trigger: "POST /sfsp/sites/{site_id}/operating-status with to_status=CLOSED_FOR_SEASON"
        actor: SponsorAdmin
        preconditions:
          - "Site.operating_status == OPERATING"
          - "X-User-ID == Site.sponsor_id"
          - "no MealServiceDay of this site has status OPEN"
        side_effects:
          - "every MealServiceDay of this site with status PLANNED and service_date >= logical clock date moves to VOIDED with void_reason = 'SEASON_CLOSED'; Site.voided_day_count increments per voided day"
          - "Site.version += 1"
        note: "Leaves approval_status untouched — a CLOSED_FOR_SEASON site is still APPROVED and its finalized days remain claimable."

  - entity: MealServiceDay
    state_field: status
    initial_state: PLANNED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /sfsp/meal-service-days/{day_id}/open"
        actor: SiteSupervisor
        preconditions:
          - "MealServiceDay.status == PLANNED"
          - "Site.approval_status == APPROVED"
          - "Site.operating_status == OPERATING"
          - "X-User-ID == MealServiceDay.site_id"
          - "production_counts keys are exactly the meal_type values in MealServiceDay.meal_services"
        side_effects:
          - "MealServiceDay.production_counts and food_received_at written from the request"
          - "Site.first_operating_date = min(Site.first_operating_date, MealServiceDay.service_date)"
          - "every MonitoringVisit of this site with visit_type IN {FIRST_WEEK, FULL_REVIEW} has due_date and is_late recomputed from the new Site.first_operating_date"
          - "MealServiceDay.version += 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /sfsp/meal-service-days/{day_id}/close"
        actor: SiteSupervisor
        preconditions:
          - "MealServiceDay.status == OPEN"
          - "X-User-ID == MealServiceDay.site_id"
        side_effects:
          - "calculations.point_of_service_meal_classification runs over the day's MealCountEntry rows, writing reimbursable_meals, non_reimbursable_meals and leftover_meals"
          - "MealServiceDay.version += 1"

      - from: CLOSED
        to: FINALIZED
        trigger: "POST /sfsp/meal-service-days/{day_id}/finalize"
        actor: SponsorAdmin
        preconditions:
          - "MealServiceDay.status == CLOSED"
          - "X-User-ID == Site.sponsor_id"
          - "Site.claim_hold == false"
        side_effects:
          - "the day becomes eligible for inclusion in a ClaimLineItem"
          - "MealServiceDay.version += 1"

      - from: PLANNED
        to: VOIDED
        trigger: "POST /sfsp/meal-service-days/{day_id}/void"
        actor: SponsorAdmin
        preconditions:
          - "MealServiceDay.status == PLANNED"
          - "X-User-ID == Site.sponsor_id"
        side_effects:
          - "MealServiceDay.void_reason = reason; Site.voided_day_count += 1"
          - "MealServiceDay.version += 1"

      - from: OPEN
        to: VOIDED
        trigger: "POST /sfsp/meal-service-days/{day_id}/void"
        actor: SponsorAdmin
        preconditions:
          - "MealServiceDay.status == OPEN"
          - "X-User-ID == Site.sponsor_id"
        side_effects:
          - "MealServiceDay.void_reason = reason; Site.voided_day_count += 1"
          - "the day's meal counts are excluded from every ClaimLineItem aggregation"
          - "MealServiceDay.version += 1"

      - from: CLOSED
        to: VOIDED
        trigger: "POST /sfsp/meal-service-days/{day_id}/void"
        actor: SponsorAdmin
        preconditions:
          - "MealServiceDay.status == CLOSED"
          - "X-User-ID == Site.sponsor_id"
        side_effects:
          - "MealServiceDay.void_reason = reason; Site.voided_day_count += 1"
          - "MealServiceDay.version += 1"

      - from: PLANNED
        to: VOIDED
        trigger: "system event: Site.approval_status becomes SUSPENDED or DENIED, or Site.operating_status becomes CLOSED_FOR_SEASON"
        actor: system
        preconditions:
          - "MealServiceDay.status == PLANNED"
          - "MealServiceDay.service_date >= logical clock date (suspension and season-close cascades only; the DENIED cascade voids every PLANNED day regardless of date)"
        side_effects:
          - "MealServiceDay.void_reason = 'SITE_SUSPENDED' | 'SITE_DENIED' | 'SEASON_CLOSED'; Site.voided_day_count += 1"
          - "MealServiceDay.version += 1"

      - from: OPEN
        to: VOIDED
        trigger: "system event: Site.approval_status becomes SUSPENDED or DENIED"
        actor: system
        preconditions:
          - "MealServiceDay.status == OPEN"
        side_effects:
          - "MealServiceDay.void_reason = 'SITE_SUSPENDED' | 'SITE_DENIED'; Site.voided_day_count += 1"
          - "MealServiceDay.version += 1"

  - entity: MonitoringVisit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching fork on POST /report: an empty findings array closes the visit outright, a non-empty findings array files the report and opens a CorrectiveAction. The two branches have disjoint side-effect sets."
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /sfsp/monitoring-visits/{visit_id}/conduct"
        actor: FieldMonitor
        preconditions:
          - "MonitoringVisit.status == SCHEDULED"
          - "X-User-ID == MonitoringVisit.monitor_user_id"
          - "logical clock date >= MonitoringVisit.scheduled_date"
        side_effects:
          - "MonitoringVisit.conducted_at = logical clock now; is_late recomputed"
          - "MonitoringVisit.version += 1"

      - from: CONDUCTED
        to: CLOSED
        trigger: "POST /sfsp/monitoring-visits/{visit_id}/report with findings = [] (no-deficiency branch)"
        actor: FieldMonitor
        preconditions:
          - "MonitoringVisit.status == CONDUCTED"
          - "X-User-ID == MonitoringVisit.monitor_user_id"
        side_effects:
          - "MonitoringVisit.findings = []; highest_severity = NONE"
          - "no CorrectiveAction is created"
          - "MonitoringVisit.version += 1"

      - from: CONDUCTED
        to: REPORT_FILED
        trigger: "POST /sfsp/monitoring-visits/{visit_id}/report with a non-empty findings array (deficiency branch)"
        actor: FieldMonitor
        preconditions:
          - "MonitoringVisit.status == CONDUCTED"
          - "X-User-ID == MonitoringVisit.monitor_user_id"
        side_effects:
          - "MonitoringVisit.findings written; highest_severity = max severity under MINOR < MAJOR < CRITICAL"
          - "cascade hop 1: exactly one CorrectiveAction is created with origin VISIT_FINDING, status OPEN, site_id = MonitoringVisit.site_id, monitoring_visit_id = MonitoringVisit.id, severity = highest_severity, finding_code = the finding_code of the highest-severity finding (ties broken by ascending finding_code), opened_by_user_id = X-User-ID, due_date per calculations.corrective_action_due_date"
          - "cascade hop 2: because that CorrectiveAction was created with severity CRITICAL, Site.approval_status moves APPROVED -> SUSPENDED (see the Site machine, which itself fires hops 3 and 4)"
          - "MonitoringVisit.version += 1"

      - from: REPORT_FILED
        to: CLOSED
        trigger: "system event: every CorrectiveAction with monitoring_visit_id == MonitoringVisit.id has status CLOSED"
        actor: system
        preconditions:
          - "MonitoringVisit.status == REPORT_FILED"
          - "count of CorrectiveAction rows with monitoring_visit_id == MonitoringVisit.id and status != CLOSED is 0"
        side_effects:
          - "MonitoringVisit.version += 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sfsp/monitoring-visits/{visit_id}/cancel"
        actor: FieldMonitor
        preconditions:
          - "MonitoringVisit.status == SCHEDULED"
          - "X-User-ID == MonitoringVisit.monitor_user_id"
        side_effects:
          - "MonitoringVisit.cancel_reason = reason"
          - "MonitoringVisit.version += 1"

  - entity: CorrectiveAction
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED, ESCALATED]
    note: "Cyclic: RESPONSE_SUBMITTED -> REJECTED -> RESPONSE_SUBMITTED. Each rejection also spawns a follow-up action one severity level higher, so the cycle is observable both as a loop on one row and as a chain across rows."
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /sfsp/corrective-actions/{action_id}/response"
        actor: SponsorAdmin
        preconditions:
          - "CorrectiveAction.status == OPEN"
          - "X-User-ID == Site.sponsor_id for the action's site_id"
        side_effects:
          - "CorrectiveAction.response_note and evidence_ref written"
          - "CorrectiveAction.version += 1"

      - from: REJECTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /sfsp/corrective-actions/{action_id}/response (rejection loop)"
        actor: SponsorAdmin
        preconditions:
          - "CorrectiveAction.status == REJECTED"
          - "X-User-ID == Site.sponsor_id for the action's site_id"
        side_effects:
          - "CorrectiveAction.response_note and evidence_ref overwritten"
          - "CorrectiveAction.version += 1"

      - from: RESPONSE_SUBMITTED
        to: CLOSED
        trigger: "POST /sfsp/corrective-actions/{action_id}/review with decision=CLOSED"
        actor: FieldMonitor
        preconditions:
          - "CorrectiveAction.status == RESPONSE_SUBMITTED"
          - "X-User-ID != CorrectiveAction.opened_by_user_id (segregation of duties)"
        side_effects:
          - "CorrectiveAction.closed_by_user_id = X-User-ID"
          - "if this was the last CorrectiveAction with severity CRITICAL and status IN {OPEN, RESPONSE_SUBMITTED, REJECTED, ESCALATED} for the site, Site.approval_status moves SUSPENDED -> APPROVED (which clears claim_hold and the line-item holds)"
          - "if every CorrectiveAction with the same monitoring_visit_id is now CLOSED, that MonitoringVisit moves REPORT_FILED -> CLOSED"
          - "CorrectiveAction.version += 1"

      - from: RESPONSE_SUBMITTED
        to: REJECTED
        trigger: "POST /sfsp/corrective-actions/{action_id}/review with decision=REJECTED"
        actor: FieldMonitor
        preconditions:
          - "CorrectiveAction.status == RESPONSE_SUBMITTED"
          - "X-User-ID != CorrectiveAction.opened_by_user_id (segregation of duties)"
          - "reason is present in the request body"
        side_effects:
          - "CorrectiveAction.rejection_count += 1"
          - "exactly one follow-up CorrectiveAction is created with follow_up_of_corrective_action_id = this action's id, site_id and monitoring_visit_id copied, origin VISIT_FINDING, status OPEN, severity = next level up under MINOR -> MAJOR -> CRITICAL (CRITICAL stays CRITICAL), finding_code copied, opened_by_user_id = X-User-ID, due_date per calculations.corrective_action_due_date"
          - "if the follow-up action's severity is CRITICAL, the Site suspension cascade fires from its creation"
          - "CorrectiveAction.version += 1"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /sfsp/corrective-actions/{action_id}/escalate"
        actor: StateAgencyReviewer
        preconditions:
          - "CorrectiveAction.status == OPEN"
          - "logical clock date > CorrectiveAction.due_date"
        side_effects:
          - "if Site.approval_status == APPROVED it moves to SUSPENDED with suspension_reason = 'CORRECTIVE_ACTION_ESCALATED' (firing the suspension cascade)"
          - "CorrectiveAction.version += 1"

      - from: REJECTED
        to: ESCALATED
        trigger: "POST /sfsp/corrective-actions/{action_id}/escalate"
        actor: StateAgencyReviewer
        preconditions:
          - "CorrectiveAction.status == REJECTED"
          - "CorrectiveAction.rejection_count >= 2 OR logical clock date > CorrectiveAction.due_date"
        side_effects:
          - "if Site.approval_status == APPROVED it moves to SUSPENDED with suspension_reason = 'CORRECTIVE_ACTION_ESCALATED' (firing the suspension cascade)"
          - "CorrectiveAction.version += 1"

  - entity: MealClaim
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    note: "Two independent cycles plus a branching fork. Cycle A: SUBMITTED -> EDIT_CHECK_FAILED -> DRAFT -> SUBMITTED. Cycle B: VALIDATED -> PAID -> REVISION_OPENED -> SUBMITTED. Fork: POST /edit-check leads to VALIDATED or EDIT_CHECK_FAILED with disjoint side-effect sets. No state is terminal because a paid claim can always be reopened."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sfsp/meal-claims/{claim_id}/submit"
        actor: SponsorAdmin
        preconditions:
          - "MealClaim.status == DRAFT"
          - "X-User-ID == MealClaim.sponsor_id"
          - "count of ClaimLineItem rows with meal_claim_id == MealClaim.id is >= 1"
          - "MealClaim.blocking_hold_count == 0"
          - "the sponsor's SponsorBudget for MealClaim's program year has status IN {APPROVED, AMENDMENT_PENDING}"
          - "claimed_operating_cost_cents <= SponsorBudget.approved_operating_cost_cents"
          - "claimed_admin_cost_cents <= SponsorBudget.approved_admin_cost_cents"
        side_effects:
          - "MealClaim.claimed_operating_cost_cents and claimed_admin_cost_cents written from the request"
          - "MealClaim.submitted_at = logical clock now; is_late recomputed against deadline_date"
          - "every ClaimLineItem is re-aggregated from its site's FINALIZED days in claim_month and calculations.claim_meals_rate_value runs, writing ClaimLineItem.meals_rate_value_cents and MealClaim.meals_rate_value_cents"
          - "calculations.claim_reimbursement variant PRELIMINARY runs, writing MealClaim.preliminary_reimbursement_cents"
          - "MealClaim.version += 1"

      - from: REVISION_OPENED
        to: SUBMITTED
        trigger: "POST /sfsp/meal-claims/{claim_id}/submit (post-payment revision loop)"
        actor: SponsorAdmin
        preconditions:
          - "MealClaim.status == REVISION_OPENED"
          - "X-User-ID == MealClaim.sponsor_id"
          - "MealClaim.blocking_hold_count == 0"
          - "the sponsor's SponsorBudget for MealClaim's program year has status IN {APPROVED, AMENDMENT_PENDING}"
          - "claimed_operating_cost_cents <= SponsorBudget.approved_operating_cost_cents"
          - "claimed_admin_cost_cents <= SponsorBudget.approved_admin_cost_cents"
        side_effects:
          - "MealClaim.revision_round += 1"
          - "line items re-aggregated; calculations.claim_meals_rate_value and calculations.claim_reimbursement variant PRELIMINARY re-run"
          - "MealClaim.version += 1"

      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /sfsp/meal-claims/{claim_id}/edit-check with every line item passing (clean branch)"
        actor: StateAgencyReviewer
        preconditions:
          - "MealClaim.status == SUBMITTED"
          - "calculations.claim_edit_check finds no disallowance on any ClaimLineItem"
        side_effects:
          - "every ClaimLineItem.edit_check_status = PASSED, disallow_reason = NONE, disallowed_counts_by_type = {}"
          - "calculations.claim_reimbursement variant FINAL runs, writing MealClaim.final_reimbursement_cents"
          - "MealClaim.edit_check_failure_codes = []"
          - "MealClaim.version += 1"

      - from: SUBMITTED
        to: EDIT_CHECK_FAILED
        trigger: "POST /sfsp/meal-claims/{claim_id}/edit-check with at least one line item failing (disallowance branch)"
        actor: StateAgencyReviewer
        preconditions:
          - "MealClaim.status == SUBMITTED"
          - "calculations.claim_edit_check finds at least one disallowance"
        side_effects:
          - "each failing ClaimLineItem sets edit_check_status = FAILED, disallow_reason, disallowed_counts_by_type and disallowed_meal_count; passing lines set edit_check_status = PASSED"
          - "MealClaim.edit_check_failure_codes = sorted distinct disallow_reason values; MealClaim.disallowed_meal_count recomputed"
          - "calculations.claim_reimbursement variant FINAL runs on the surviving meals, writing MealClaim.final_reimbursement_cents"
          - "cascade hop 2: because a line item's disallow_reason became EXCEEDS_PRODUCTION or MISSING_MONITORING, that line's Site.compliance_flag_count += 1"
          - "cascade hop 3: because Site.compliance_flag_count reached COMPLIANCE_FLAG_THRESHOLD (2), the system creates one CorrectiveAction with origin COMPLIANCE_FLAG, severity MAJOR, status OPEN, monitoring_visit_id = null, finding_code = 'COMPLIANCE_FLAG_THRESHOLD', opened_by_user_id = 'SYSTEM' and sets Site.claim_hold = true"
          - "MealClaim.version += 1"

      - from: EDIT_CHECK_FAILED
        to: DRAFT
        trigger: "POST /sfsp/meal-claims/{claim_id}/open-revision"
        actor: StateAgencyReviewer
        preconditions:
          - "MealClaim.status == EDIT_CHECK_FAILED"
        side_effects:
          - "MealClaim.revision_round += 1; submitted_at = null; preliminary_reimbursement_cents = null; final_reimbursement_cents = null; edit_check_failure_codes = null"
          - "every ClaimLineItem resets edit_check_status = PENDING, disallow_reason = NONE, disallowed_counts_by_type = null, disallowed_meal_count = 0"
          - "MealClaim.version += 1"
        note: "Site.compliance_flag_count is NOT decremented — compliance flags are cumulative across revisions."

      - from: VALIDATED
        to: PAID
        trigger: "POST /sfsp/meal-claims/{claim_id}/pay"
        actor: StateAgencyReviewer
        preconditions:
          - "MealClaim.status == VALIDATED"
          - "MealClaim.final_reimbursement_cents is not null"
        side_effects:
          - "calculations.advance_recovery_waterfall runs, writing MealClaim.advance_offset_cents and net_payable_cents and updating each touched AdvancePayment.recovered_amount_cents and status"
          - "Sponsor.advance_recovered_cents and advance_outstanding_cents recomputed; Sponsor.reimbursement_paid_cents += MealClaim.net_payable_cents; Sponsor.version += 1"
          - "MealClaim.paid_at = logical clock now"
          - "MealClaim.version += 1"

      - from: PAID
        to: REVISION_OPENED
        trigger: "POST /sfsp/meal-claims/{claim_id}/open-revision"
        actor: StateAgencyReviewer
        preconditions:
          - "MealClaim.status == PAID"
          - "reason is present in the request body"
        side_effects:
          - "the advance recovery performed at payment is reversed exactly: every AdvancePayment touched by this claim has recovered_amount_cents decremented by the amount this claim recovered from it, and its status recomputed as DEMAND_ISSUED when demand_issued_at is not null and outstanding_cents > 0, else RECOVERED when outstanding_cents == 0, else PARTIALLY_RECOVERED when 0 < recovered_amount_cents, else DISBURSED"
          - "Sponsor.advance_recovered_cents and advance_outstanding_cents recomputed; Sponsor.reimbursement_paid_cents -= MealClaim.net_payable_cents; Sponsor.version += 1"
          - "MealClaim.advance_offset_cents = null; net_payable_cents = null; paid_at = null; final_reimbursement_cents = null"
          - "MealClaim.version += 1"
        note: "Compensating transition for VALIDATED -> PAID; the advance-ledger invariant must read identically before payment and after revision."

  - entity: AdvancePayment
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, RECOVERED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sfsp/advance-payments/{advance_id}/decision with decision=APPROVED"
        actor: StateAgencyReviewer
        preconditions:
          - "AdvancePayment.status == REQUESTED"
          - "Sponsor.advance_eligible == true AND Sponsor.experience_status == EXPERIENCED"
          - "the sponsor's SponsorBudget for the program year has status IN {APPROVED, AMENDMENT_PENDING}"
          - "approved_amount_cents <= AdvancePayment.requested_amount_cents"
          - "approved_amount_cents <= floor(0.25 * (SponsorBudget.approved_operating_cost_cents + SponsorBudget.approved_admin_cost_cents))"
        side_effects:
          - "AdvancePayment.approved_amount_cents written from the request"
          - "AdvancePayment.version += 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /sfsp/advance-payments/{advance_id}/decision with decision=DENIED"
        actor: StateAgencyReviewer
        preconditions:
          - "AdvancePayment.status == REQUESTED"
          - "reason is present in the request body"
        side_effects:
          - "AdvancePayment.decision_reason = reason"
          - "AdvancePayment.version += 1"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /sfsp/advance-payments/{advance_id}/disburse"
        actor: StateAgencyReviewer
        preconditions:
          - "AdvancePayment.status == APPROVED"
          - "at least one Site of the sponsor has approval_status == APPROVED"
        side_effects:
          - "AdvancePayment.disbursed_at = logical clock now; outstanding_cents = approved_amount_cents"
          - "Sponsor.advance_paid_cents += approved_amount_cents; Sponsor.advance_outstanding_cents recomputed; Sponsor.version += 1"
          - "AdvancePayment.version += 1"

      - from: DISBURSED
        to: PARTIALLY_RECOVERED
        trigger: "system event: calculations.advance_recovery_waterfall recovers a positive amount smaller than outstanding_cents during MealClaim VALIDATED -> PAID"
        actor: system
        preconditions:
          - "AdvancePayment.status == DISBURSED"
          - "0 < recovered amount < AdvancePayment.outstanding_cents"
        side_effects:
          - "AdvancePayment.recovered_amount_cents += recovered amount; outstanding_cents recomputed"
          - "AdvancePayment.version += 1"

      - from: DISBURSED
        to: RECOVERED
        trigger: "system event: calculations.advance_recovery_waterfall recovers the full outstanding_cents during MealClaim VALIDATED -> PAID"
        actor: system
        preconditions:
          - "AdvancePayment.status == DISBURSED"
          - "recovered amount == AdvancePayment.outstanding_cents"
        side_effects:
          - "AdvancePayment.recovered_amount_cents = approved_amount_cents; outstanding_cents = 0"
          - "AdvancePayment.version += 1"

      - from: PARTIALLY_RECOVERED
        to: RECOVERED
        trigger: "system event: calculations.advance_recovery_waterfall recovers the remaining outstanding_cents during MealClaim VALIDATED -> PAID"
        actor: system
        preconditions:
          - "AdvancePayment.status == PARTIALLY_RECOVERED"
          - "recovered amount == AdvancePayment.outstanding_cents"
        side_effects:
          - "AdvancePayment.recovered_amount_cents = approved_amount_cents; outstanding_cents = 0"
          - "AdvancePayment.version += 1"

      - from: DISBURSED
        to: DEMAND_ISSUED
        trigger: "POST /sfsp/advance-payments/{advance_id}/demand"
        actor: StateAgencyReviewer
        preconditions:
          - "AdvancePayment.status IN {DISBURSED, PARTIALLY_RECOVERED}"
          - "AdvancePayment.outstanding_cents > 0"
          - "logical clock date > last calendar day of the month following AdvancePayment.request_month"
        side_effects:
          - "AdvancePayment.demand_issued_at = logical clock now; decision_reason = reason"
          - "AdvancePayment.version += 1"

      - from: PARTIALLY_RECOVERED
        to: DEMAND_ISSUED
        trigger: "POST /sfsp/advance-payments/{advance_id}/demand"
        actor: StateAgencyReviewer
        preconditions:
          - "AdvancePayment.status == PARTIALLY_RECOVERED"
          - "AdvancePayment.outstanding_cents > 0"
          - "logical clock date > last calendar day of the month following AdvancePayment.request_month"
        side_effects:
          - "AdvancePayment.demand_issued_at = logical clock now; decision_reason = reason"
          - "AdvancePayment.version += 1"

      - from: DEMAND_ISSUED
        to: RECOVERED
        trigger: "system event: calculations.advance_recovery_waterfall recovers the remaining outstanding_cents during MealClaim VALIDATED -> PAID"
        actor: system
        preconditions:
          - "AdvancePayment.status == DEMAND_ISSUED"
          - "recovered amount == AdvancePayment.outstanding_cents"
        side_effects:
          - "AdvancePayment.recovered_amount_cents = approved_amount_cents; outstanding_cents = 0"
          - "AdvancePayment.version += 1"

      - from: RECOVERED
        to: PARTIALLY_RECOVERED
        trigger: "system event: MealClaim PAID -> REVISION_OPENED reverses a recovery that had fully retired this advance, leaving a positive recovered_amount_cents"
        actor: system
        preconditions:
          - "AdvancePayment.status == RECOVERED"
          - "after reversal 0 < recovered_amount_cents < approved_amount_cents"
          - "AdvancePayment.demand_issued_at IS NULL"
        side_effects:
          - "AdvancePayment.recovered_amount_cents decremented by the reversed amount; outstanding_cents recomputed"
          - "AdvancePayment.version += 1"

      - from: RECOVERED
        to: DISBURSED
        trigger: "system event: MealClaim PAID -> REVISION_OPENED reverses the entire recovery recorded against this advance"
        actor: system
        preconditions:
          - "AdvancePayment.status == RECOVERED"
          - "after reversal recovered_amount_cents == 0"
          - "AdvancePayment.demand_issued_at IS NULL"
        side_effects:
          - "AdvancePayment.recovered_amount_cents = 0; outstanding_cents = approved_amount_cents"
          - "AdvancePayment.version += 1"

      - from: RECOVERED
        to: DEMAND_ISSUED
        trigger: "system event: MealClaim PAID -> REVISION_OPENED reverses a recovery on an advance that had previously been demanded"
        actor: system
        preconditions:
          - "AdvancePayment.status == RECOVERED"
          - "AdvancePayment.demand_issued_at IS NOT NULL"
          - "after reversal outstanding_cents > 0"
        side_effects:
          - "AdvancePayment.recovered_amount_cents decremented by the reversed amount; outstanding_cents recomputed"
          - "AdvancePayment.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Sponsor.version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: advance-request-stale-sponsor
    parent_entity: Sponsor
    write_endpoint: "POST /sfsp/advance-payments"
    occ_field: "expected_sponsor_version"
    description: |
      Requesting an advance against a Sponsor whose version has advanced since
      the client last observed it is rejected. A new advance request legitimately
      supersedes the sponsor's prior advance position under §1.3
      advance_recovery_waterfall, so the request would otherwise succeed on a
      stale view of advance_outstanding_cents; the stale-version check forces the
      client to re-read the sponsor's advance ledger first.
    error_id: ERR_STALE_SPONSOR_VERSION
    http_status: 412

  - rule_id: claim-create-stale-sponsor
    parent_entity: Sponsor
    write_endpoint: "POST /sfsp/meal-claims"
    occ_field: "expected_sponsor_version"
    description: |
      Creating a MealClaim against a Sponsor whose version has advanced since the
      client last observed it is rejected. Because a claim's payment recovers
      outstanding advances and a newly disbursed advance legitimately changes what
      the next claim will net out to, a claim created on a stale sponsor view is
      refused with a stale-version error rather than being silently accepted.
    error_id: ERR_STALE_SPONSOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: site_eligibility_determination
    trigger: "POST /sfsp/sites/{site_id}/eligibility-determination"
    algorithm: threshold
    formula: |
      # Writes Site.eligibility_basis and Site.eligibility_pct_used.
      # Evaluation order is fixed; the first branch whose guard holds decides.
      if site.site_type == 'CAMP':
          basis = 'CAMP_INDIVIDUAL'; pct_used = null
      elif site.site_type == 'CLOSED_ENROLLED':
          pct_used = site.enrolled_free_reduced_pct
          basis = 'ENROLLED_DOCUMENTATION' if pct_used >= AREA_ELIGIBILITY_THRESHOLD_PCT else 'NOT_ELIGIBLE'
      else:                                   # OPEN, RESTRICTED_OPEN, MIGRANT
          rec = AreaEligibilityRecord[site.area_eligibility_record_id]
          pct_used = rec.free_reduced_pct
          if rec.valid_through_date < site.operating_start_date:
              basis = 'NOT_ELIGIBLE'          # stale income data
          elif rec.data_source == 'SCHOOL_DATA':
              basis = 'AREA_ELIGIBLE' if pct_used >= AREA_ELIGIBILITY_THRESHOLD_PCT else 'NOT_ELIGIBLE'
          else:                               # CENSUS_ACS carries a documentation surcharge
              basis = 'AREA_ELIGIBLE' if pct_used >= CENSUS_ACS_THRESHOLD_PCT else 'NOT_ELIGIBLE'
    input_set: "Exactly one AreaEligibilityRecord (the one referenced by Site.area_eligibility_record_id) for OPEN / RESTRICTED_OPEN / MIGRANT sites; Site.enrolled_free_reduced_pct for CLOSED_ENROLLED; no external data for CAMP."
    constants:
      AREA_ELIGIBILITY_THRESHOLD_PCT: 50.00
      CENSUS_ACS_THRESHOLD_PCT: 55.00
    precision: "percentages compared at 2 decimal places; comparison is inclusive (>=) at both thresholds — 50.00 with SCHOOL_DATA is eligible, 49.99 is not; 55.00 with CENSUS_ACS is eligible, 54.99 is not"

  - name: claim_meals_rate_value
    trigger: "MealClaim DRAFT|REVISION_OPENED -> SUBMITTED (POST /sfsp/meal-claims/{claim_id}/submit) and again on MealClaim SUBMITTED -> VALIDATED|EDIT_CHECK_FAILED (POST /sfsp/meal-claims/{claim_id}/edit-check)"
    algorithm: tiered_pricing
    formula: |
      # Rate class selection (per line item, from the Site):
      rate_class = 'RURAL_OR_SELF_PREP' if (site.is_rural or site.production_mode == 'SELF_PREP') else 'OTHER'

      # Per-line aggregation over the site's FINALIZED days whose service_date
      # falls inside claim_month, ordered by service_date ASC:
      for meal_type m in sorted(claimed_first_meals_by_type keys, ascending):
          net_m = claimed_first_meals_by_type[m] + claimed_second_meals_by_type[m]
                  - disallowed_counts_by_type.get(m, 0)          # 0 before edit check
          # ROUNDING ORDER IS PINNED: round the (line_item, meal_type) product to
          # whole cents FIRST, then sum. Summing counts across line items (or across
          # meal types) before rounding is WRONG and yields a different total.
          per_type_cents[m] = round_half_up(net_m * RATE_CENTS[rate_class][m])

      line_item.meals_rate_value_cents = sum(per_type_cents.values())
      claim.meals_rate_value_cents     = sum(line.meals_rate_value_cents for line in claim.line_items)
    input_set: "ClaimLineItem rows of the claim, each aggregating only MealServiceDay rows with status FINALIZED and service_date within claim_month; VOIDED, CLOSED, OPEN and PLANNED days are excluded."
    constants:
      RATE_CENTS:
        RURAL_OR_SELF_PREP: { BREAKFAST: 268.75, AM_SNACK: 126.25, LUNCH: 470.50, PM_SNACK: 126.25, SUPPER: 470.50 }
        OTHER: { BREAKFAST: 263.25, AM_SNACK: 123.00, LUNCH: 462.75, PM_SNACK: 123.00, SUPPER: 462.75 }
    precision: "rates are fractional cents with exactly 2 decimal places; each (line_item, meal_type) product is rounded to an integer number of cents with round_half_up, and only then summed"

  - name: claim_reimbursement
    trigger: "variant PRELIMINARY on MealClaim DRAFT|REVISION_OPENED -> SUBMITTED; variant FINAL on MealClaim SUBMITTED -> VALIDATED and SUBMITTED -> EDIT_CHECK_FAILED"
    algorithm: constraint_propagation
    formula: |
      # The administrative cap LOOKS circular: total = operating + admin, while the
      # admin ceiling is a percentage cap. The evaluation order below is PINNED so
      # the value is well defined and no fixed-point iteration is required. The
      # rejected reading — "admin cap = ADMIN_CAP_PCT * total_reimbursement", which
      # would require solving admin = min(claimed_admin, p*(operating+admin)) — is
      # explicitly NOT the rule.
      step 1: meals_value = claim.meals_rate_value_cents          # from claim_meals_rate_value
      step 2: operating_reimbursement = min(meals_value, claim.claimed_operating_cost_cents)
      step 3: admin_cap = floor(ADMIN_CAP_PCT * operating_reimbursement)   # keyed to STEP 2's output
      step 4: admin_reimbursement = min(claim.claimed_admin_cost_cents, admin_cap)
      step 5: gross = operating_reimbursement + admin_reimbursement
      step 6: (FINAL variant only) advance_offset = advance_recovery_waterfall(gross)
      step 7: (FINAL variant only) net_payable = gross - advance_offset
    input_set: "The claim's own line items (see claim_meals_rate_value input_set) plus the claim's asserted cost figures; the sponsor's advance ledger participates only in the FINAL variant at payment time."
    constants:
      ADMIN_CAP_PCT: 0.20
    precision: "all money is integer cents; the admin cap uses floor (never round) so the cap can never exceed 20% of the operating reimbursement by even one cent"
    variants:
      - name: PRELIMINARY
        when: "Written to MealClaim.preliminary_reimbursement_cents when the claim enters SUBMITTED, before any edit check has run."
        difference: "Uses the meals-times-rates value with NO disallowances applied and applies NO cost caps at all: preliminary = claim.meals_rate_value_cents + claim.claimed_admin_cost_cents. It is the sponsor's asserted entitlement, deliberately computable without the state agency's cost review."
      - name: FINAL
        when: "Written to MealClaim.final_reimbursement_cents when the claim enters VALIDATED or EDIT_CHECK_FAILED."
        difference: "Recomputes claim.meals_rate_value_cents with disallowed_counts_by_type subtracted, then applies steps 2-5 (operating cost cap and the floored administrative cap). For identical inputs FINAL is <= PRELIMINARY, and it is strictly smaller whenever claimed_admin_cost_cents exceeds floor(0.20 * operating_reimbursement) or any meal is disallowed."

  - name: point_of_service_meal_classification
    trigger: "POST /sfsp/meal-service-days/{day_id}/meal-counts (marginal delta for the new entry) and MealServiceDay OPEN -> CLOSED (whole-day recomputation)"
    algorithm: waterfall_allocation
    formula: |
      # Per meal_type m present in day.meal_services, in the order the meal_services
      # array declares them:
      net_first  = sum(e.first_meals  for e in ORIGINAL entries of m) - sum(e.first_meals  for e in REVERSAL entries of m)
      net_second = sum(e.second_meals for e in ORIGINAL entries of m) - sum(e.second_meals for e in REVERSAL entries of m)
      net_adult  = sum(e.adult_meals  for e in ORIGINAL entries of m) - sum(e.adult_meals  for e in REVERSAL entries of m)

      step 1 (attendance cap):   rf = min(net_first, site.approved_max_attendance)
      step 2 (second-meal rule): if site.site_type == 'CAMP':
                                     rs = min(net_second, floor(SECOND_MEAL_ALLOWANCE_PCT * rf))
                                 else:
                                     rs = 0                       # second meals are never reimbursable off-camp
      step 3 (production waterfall — SELF_PREP DAYS ONLY):
                                 if day.production_mode == 'SELF_PREP':
                                     avail = day.production_counts[m]
                                     rf = min(rf, avail)           # first meals fill the bucket first
                                     rs = min(rs, max(0, avail - rf))
                                 # VENDED days apply no production cap here; the
                                 # delivered-quantity reconciliation happens in
                                 # claim_edit_check instead.
      step 4 (adult meals):      never reimbursable, always counted as non-reimbursable

      day.reimbursable_meals     = sum over m of (rf + rs)
      day.non_reimbursable_meals = day.counted_first_meals + day.counted_second_meals
                                   + day.counted_adult_meals - day.reimbursable_meals
      day.leftover_meals         = max(0, sum(day.production_counts.values())
                                   - day.counted_first_meals - day.counted_second_meals
                                   - day.counted_adult_meals - day.discarded_meals)

      # Per-entry attribution is the MARGINAL DELTA: the day totals are recomputed
      # immediately before and immediately after the entry is inserted, and the
      # entry stores the differences. A REVERSAL entry therefore carries negative
      # or zero reimbursable_first_meals / reimbursable_second_meals.
    input_set: "All MealCountEntry rows of the day (both ORIGINAL and REVERSAL); entries on VOIDED days are retained but never enter any ClaimLineItem aggregation."
    constants:
      SECOND_MEAL_ALLOWANCE_PCT: 0.02
    precision: "integer meal counts only; the second-meal allowance uses floor, so a camp with 49 reimbursable first meals of a type gets an allowance of 0 second meals and one with 50 gets 1"

  - name: holding_time_breach_evaluation
    trigger: "POST /sfsp/meal-service-days/{day_id}/holding-logs"
    algorithm: threshold
    formula: |
      holding_minutes = floor((measured_at - day.food_received_at) / 60 seconds)

      if site.is_open_air == false:
          breach_flag = false; breach_reason = null          # climate-controlled holding is exempt
      elif (temperature_class == 'COLD' and temperature_f > COLD_MAX_F) or \
           (temperature_class == 'HOT'  and temperature_f < HOT_MIN_F):
          breach_flag = true;  breach_reason = 'TEMP_OUT_OF_BAND'
      elif holding_minutes > MAX_HOLDING_MINUTES:
          breach_flag = true;  breach_reason = 'HOLDING_TIME_EXCEEDED'
      else:
          breach_flag = false; breach_reason = null

      # First breaching reading only (day.food_safety_status is already BREACH -> no re-arming):
      if breach_flag and day.food_safety_status == 'OK':
          day.food_safety_status = 'BREACH'
          day.breach_at = measured_at
          day.discarded_meals = max(0, sum(day.production_counts.values())
                                    - day.counted_first_meals - day.counted_second_meals
                                    - day.counted_adult_meals)
          day.leftover_meals = 0
    input_set: "The single reading being posted, plus the day's production_counts and its net counted meals at the moment of the reading."
    constants:
      COLD_MAX_F: 41.0
      HOT_MIN_F: 135.0
      MAX_HOLDING_MINUTES: 240
    precision: "temperatures compared at 1 decimal place with strict inequalities (41.0 cold is compliant, 41.1 breaches; 135.0 hot is compliant, 134.9 breaches); holding_minutes is truncated whole minutes and the comparison is strict (240 is compliant, 241 breaches)"

  - name: monitoring_schedule_compliance
    trigger: "POST /sfsp/monitoring-visits (initial due_date), MealServiceDay PLANNED -> OPEN (recompute for the site's FIRST_WEEK and FULL_REVIEW visits), POST /sfsp/monitoring-visits/{visit_id}/conduct (is_late)"
    algorithm: interval_merge
    formula: |
      if site.first_operating_date is null:
          due_date = null; is_late = false                   # obligation has not started
      elif visit_type == 'FIRST_WEEK':
          due_date = site.first_operating_date + FIRST_WEEK_VISIT_DAYS days
      elif visit_type == 'FULL_REVIEW':
          due_date = site.first_operating_date + FULL_REVIEW_DAYS days
      else:                                                  # FOLLOW_UP
          due_date = visit.scheduled_date

      is_late = (status IN {CONDUCTED, REPORT_FILED, CLOSED} and utc_date(conducted_at) > due_date)
                or (status == 'SCHEDULED' and logical_clock_date > due_date)

      # Monitoring coverage test consumed by claim_edit_check:
      monitoring_satisfied(site, claim_month) =
          EXISTS MonitoringVisit v WHERE v.site_id == site.id
                 AND v.visit_type == 'FIRST_WEEK'
                 AND v.status IN {CONDUCTED, REPORT_FILED, CLOSED}
                 AND utc_date(v.conducted_at) <= v.due_date
    input_set: "All MonitoringVisit rows of the site with status IN {SCHEDULED, CONDUCTED, REPORT_FILED, CLOSED}; CANCELLED visits are ignored by both due_date recomputation and the coverage test."
    constants:
      FIRST_WEEK_VISIT_DAYS: 4
      FULL_REVIEW_DAYS: 28
    precision: "calendar-day arithmetic on UTC dates; both due-date comparisons are inclusive (a visit conducted exactly on due_date is on time)"

  - name: claim_edit_check
    trigger: "POST /sfsp/meal-claims/{claim_id}/edit-check"
    algorithm: chronological
    formula: |
      # Line items are examined in ascending ClaimLineItem.created_at. Each line
      # receives AT MOST ONE disallow_reason: the first rule below that fires wins,
      # and the disallowed counts are the ones that rule computes.
      for line in claim.line_items ordered by created_at ASC:
          site = Site[line.site_id]
          days = MealServiceDay rows of site with status FINALIZED and service_date in claim.claim_month

          # rule 1 — MISSING_MONITORING (whole line disallowed)
          if not monitoring_satisfied(site, claim.claim_month):
              disallowed[m] = claimed_first[m] + claimed_second[m] for every m
              reason = 'MISSING_MONITORING'

          # rule 2 — FOOD_SAFETY_BREACH (breaching days disallowed)
          elif any(d.food_safety_status == 'BREACH' for d in days):
              disallowed[m] = sum over breaching days d of the reimbursable meals of type m on d
              reason = 'FOOD_SAFETY_BREACH'

          # rule 3 — EXCEEDS_PRODUCTION (vended delivery reconciliation)
          elif site.production_mode == 'VENDED':
              excess = 0
              for d in days, for m in d.meal_services meal_types:
                  claimed_dm = reimbursable first + second meals of type m on d
                  excess_dm = max(0, claimed_dm - d.production_counts[m])
                  disallowed[m] += excess_dm; excess += excess_dm
              reason = 'EXCEEDS_PRODUCTION' if excess > 0 else 'NONE'

          else:
              reason = 'NONE'

          line.disallow_reason = reason
          line.edit_check_status = 'FAILED' if reason != 'NONE' else 'PASSED'
          line.disallowed_counts_by_type = disallowed (or {} when reason == 'NONE')
          line.disallowed_meal_count = sum(disallowed.values())

      claim.status = 'EDIT_CHECK_FAILED' if any line failed else 'VALIDATED'
      claim.edit_check_failure_codes = sorted(distinct failing reasons)
    input_set: "Only the claim's own ClaimLineItem rows and, through them, the referenced sites' FINALIZED MealServiceDay rows inside claim_month. Days in any other status never contribute meals or disallowances."
    constants:
      COMPLIANCE_FLAG_THRESHOLD: 2
    precision: "integer meal counts; per-line disallowance is exclusive (exactly one reason per line) and rule order is MISSING_MONITORING, then FOOD_SAFETY_BREACH, then EXCEEDS_PRODUCTION"

  - name: advance_recovery_waterfall
    trigger: "MealClaim VALIDATED -> PAID (forward) and MealClaim PAID -> REVISION_OPENED (exact reversal)"
    algorithm: waterfall_allocation
    formula: |
      # Ordered buckets: the sponsor's advances that still owe money, oldest first.
      candidates = AdvancePayment rows WHERE sponsor_id == claim.sponsor_id
                   AND status IN {DISBURSED, PARTIALLY_RECOVERED, DEMAND_ISSUED}
                   AND outstanding_cents > 0
      order by request_month ASC, then created_at ASC        # never by id

      remaining = claim.final_reimbursement_cents            # the FINAL gross
      offset = 0
      for adv in candidates:
          take = min(remaining, adv.outstanding_cents)
          adv.recovered_amount_cents += take
          remaining -= take; offset += take
          if remaining == 0: break

      claim.advance_offset_cents = offset
      claim.net_payable_cents    = claim.final_reimbursement_cents - offset

      # CONSERVED QUANTITY (must hold before and after any forward/reverse pair):
      #   Sponsor.advance_outstanding_cents
      #     == SUM(adv.approved_amount_cents - adv.recovered_amount_cents)
      #        over adv.status IN {DISBURSED, PARTIALLY_RECOVERED, DEMAND_ISSUED}
      # Reversal takes back exactly the per-advance `take` recorded by this claim,
      # in the reverse of the allocation order, and recomputes each status.
    input_set: "Only advances of the same sponsor whose status is DISBURSED, PARTIALLY_RECOVERED or DEMAND_ISSUED with a positive outstanding balance. REQUESTED, APPROVED, DENIED and RECOVERED advances are excluded from the bucket list."
    constants:
      MAX_RECOVERY_FRACTION: 1.00
    precision: "integer cents, no rounding is possible; when candidates is empty the offset is 0 and net_payable_cents == final_reimbursement_cents"

  - name: attendance_forecast
    trigger: "GET /sfsp/sites/{site_id}/attendance-forecast"
    algorithm: decay_function
    formula: |
      window = MealServiceDay rows of the site WHERE status == 'FINALIZED'
               AND service_date < requested service_date
               order by service_date DESC
               take first FORECAST_WINDOW_DAYS                # at most 5, may be fewer
      if window is empty: reject with ERR_INSUFFICIENT_FORECAST_HISTORY
      served[k] = window[k].counted_first_meals               # k = 0 is the most recent day
      cap = site.approved_max_attendance

      if method == 'PEAK_PROJECTION':
          forecast_meals = min(cap, ceil(max(served) * OUTREACH_UPLIFT_FACTOR))
      else:  # method == 'DECAY_WEIGHTED'
          w[k] = DECAY_FACTOR ** k
          forecast_meals = min(cap, round_half_up(sum(w[k]*served[k]) / sum(w[k])))

      most_recent_production = sum(window[0].production_counts.values())
      waste_risk_flag = (most_recent_production - forecast_meals)
                        > floor(WASTE_TOLERANCE_PCT * forecast_meals)
    input_set: "At most the 5 most recent FINALIZED MealServiceDay rows strictly before the requested service_date; VOIDED and CLOSED days never enter the window, so voiding a day changes the forecast."
    constants:
      FORECAST_WINDOW_DAYS: 5
      OUTREACH_UPLIFT_FACTOR: 1.10
      DECAY_FACTOR: 0.6
      WASTE_TOLERANCE_PCT: 0.10
    precision: "PEAK_PROJECTION uses ceil on the uplifted peak; DECAY_WEIGHTED uses round_half_up on the weighted mean; both are then clamped by the attendance cap with min()"
    variants:
      - name: PEAK_PROJECTION
        when: "method=PEAK_PROJECTION — outreach-driven planning, used when the sponsor is advertising the site and wants to avoid running out of meals."
        difference: "Takes the single highest attendance day in the window and inflates it by 10%, ignoring every other day. Recency is irrelevant."
      - name: DECAY_WEIGHTED
        when: "method=DECAY_WEIGHTED — waste-minimisation planning, used when the sponsor is trying to cut leftovers."
        difference: "Takes a recency-weighted mean with weight 0.6^k, so older days still pull the number down. On a declining attendance series it returns a materially smaller forecast than PEAK_PROJECTION for the identical window."

  - name: corrective_action_due_date
    trigger: "CorrectiveAction creation (visit-report cascade hop 1, rejection follow-up, or COMPLIANCE_FLAG threshold breach)"
    algorithm: threshold
    formula: |
      due_date = logical_clock_date + RESPONSE_DAYS_BY_SEVERITY[severity] days
      # Severity of a follow-up action escalates one level:
      #   MINOR -> MAJOR -> CRITICAL -> CRITICAL (saturates)
    input_set: "The single CorrectiveAction being created; severity comes from the originating finding (or MAJOR for COMPLIANCE_FLAG origin)."
    constants:
      RESPONSE_DAYS_BY_SEVERITY: { CRITICAL: 5, MAJOR: 15, MINOR: 30 }
    precision: "calendar-day arithmetic on the logical clock's UTC date; escalation is permitted only when logical_clock_date > due_date (strictly after)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Request body and query parameters are well formed: required fields present, enum members valid, integers non-negative where declared, dates ISO YYYY-MM-DD, times HH:MM, limit within 1..100, offset >= 0, decision/to_status/method values inside their declared sets."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Sponsor referenced by path {sponsor_id} or body sponsor_id exists."
    error_id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    applies_to: "POST/GET /sfsp/sponsors/{sponsor_id}*, POST /sfsp/sponsor-budgets, POST /sfsp/advance-payments, POST /sfsp/sites, POST /sfsp/meal-claims"

  - priority: 5
    category: existence
    check: "AreaEligibilityRecord referenced by path {record_id} or body area_eligibility_record_id exists."
    error_id: ERR_AREA_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/area-eligibility-records/{record_id}, POST /sfsp/sites"

  - priority: 6
    category: existence
    check: "SponsorBudget referenced by path {budget_id} exists."
    error_id: ERR_BUDGET_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/sponsor-budgets/{budget_id}, POST /sfsp/sponsor-budgets/{budget_id}/*"

  - priority: 7
    category: existence
    check: "AdvancePayment referenced by path {advance_id} exists."
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/advance-payments/{advance_id}, POST /sfsp/advance-payments/{advance_id}/*"

  - priority: 8
    category: existence
    check: "Site referenced by path {site_id} or body site_id exists."
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /sfsp/sites/{site_id}*, POST /sfsp/meal-service-days, POST /sfsp/monitoring-visits, POST /sfsp/meal-claims/{claim_id}/line-items"

  - priority: 9
    category: existence
    check: "MealServiceDay referenced by path {day_id} exists."
    error_id: ERR_SERVICE_DAY_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/meal-service-days/{day_id}, POST /sfsp/meal-service-days/{day_id}/*"

  - priority: 10
    category: existence
    check: "MealCountEntry referenced by path {entry_id} or body reversal_of_entry_id exists."
    error_id: ERR_COUNT_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/meal-count-entries/{entry_id}, POST /sfsp/meal-service-days/{day_id}/meal-counts"

  - priority: 11
    category: existence
    check: "HoldingLogEntry referenced by path {entry_id} exists."
    error_id: ERR_HOLDING_LOG_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/holding-log-entries/{entry_id}"

  - priority: 12
    category: existence
    check: "MonitoringVisit referenced by path {visit_id} exists."
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/monitoring-visits/{visit_id}, POST /sfsp/monitoring-visits/{visit_id}/*"

  - priority: 13
    category: existence
    check: "CorrectiveAction referenced by path {action_id} exists."
    error_id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/corrective-actions/{action_id}, POST /sfsp/corrective-actions/{action_id}/*"

  - priority: 14
    category: existence
    check: "MealClaim referenced by path {claim_id} exists."
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/meal-claims/{claim_id}*, POST /sfsp/meal-claims/{claim_id}/*"

  - priority: 15
    category: existence
    check: "ClaimLineItem referenced by path {line_item_id} exists."
    error_id: ERR_CLAIM_LINE_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /sfsp/claim-line-items/{line_item_id}"

  - priority: 16
    category: auth
    check: "Ownership for entity_backed roles: a SponsorAdmin's X-User-ID equals the Sponsor.id reached from the target resource (directly, or via Site.sponsor_id / MealClaim.sponsor_id / SponsorBudget.sponsor_id / CorrectiveAction.site_id -> Site.sponsor_id); a SiteSupervisor's X-User-ID equals the Site.id reached from the target resource (directly, or via MealServiceDay.site_id)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every SponsorAdmin and SiteSupervisor write endpoint"

  - priority: 17
    category: auth
    check: "Segregation of duties: the FieldMonitor reviewing a CorrectiveAction must have X-User-ID different from CorrectiveAction.opened_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sfsp/corrective-actions/{action_id}/review"

  - priority: 18
    category: state
    check: "Sponsor.application_status permits the requested transition (see §1.2 Sponsor)."
    error_id: ERR_SPONSOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/sponsors/{sponsor_id}/application-submit, POST /sfsp/sponsors/{sponsor_id}/application-decision"

  - priority: 19
    category: state
    check: "SponsorBudget.status permits the requested transition (see §1.2 SponsorBudget)."
    error_id: ERR_BUDGET_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit, POST /sfsp/sponsor-budgets/{budget_id}/decision"

  - priority: 20
    category: state
    check: "AdvancePayment.status permits the requested transition (see §1.2 AdvancePayment)."
    error_id: ERR_ADVANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision, .../disburse, .../demand"

  - priority: 21
    category: state
    check: "The Site dimension being moved permits the requested transition: approval_status for approval-decision, operating_status for operating-status."
    error_id: ERR_SITE_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision, POST /sfsp/sites/{site_id}/operating-status, POST /sfsp/sites/{site_id}/eligibility-determination"

  - priority: 22
    category: state
    check: "MealServiceDay.status permits the requested transition (see §1.2 MealServiceDay); meal counts and holding logs require status OPEN."
    error_id: ERR_SERVICE_DAY_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open, .../close, .../finalize, .../void, .../meal-counts, .../holding-logs"

  - priority: 23
    category: state
    check: "MonitoringVisit.status permits the requested transition (see §1.2 MonitoringVisit)."
    error_id: ERR_VISIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/monitoring-visits/{visit_id}/conduct, .../report, .../cancel"

  - priority: 24
    category: state
    check: "CorrectiveAction.status permits the requested transition (see §1.2 CorrectiveAction)."
    error_id: ERR_ACTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/corrective-actions/{action_id}/response, .../review, .../escalate"

  - priority: 25
    category: state
    check: "MealClaim.status permits the requested transition (see §1.2 MealClaim): submit needs DRAFT or REVISION_OPENED, edit-check needs SUBMITTED, pay needs VALIDATED, open-revision needs EDIT_CHECK_FAILED or PAID, line-items need DRAFT or REVISION_OPENED."
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit, .../edit-check, .../pay, .../open-revision, .../line-items"

  - priority: 26
    category: state
    check: "Cross-entity: Sponsor.application_status == APPROVED is required before a budget may be submitted, a site created, an advance requested or a claim created."
    error_id: ERR_SPONSOR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit, POST /sfsp/sites, POST /sfsp/advance-payments, POST /sfsp/meal-claims"

  - priority: 27
    category: state
    check: "Cross-entity: Site.approval_status is NOT one of {PENDING_REVIEW, DENIED} — i.e. the site has cleared review — before operating_status may move to OPERATING or a service day may be opened. SUSPENDED is deliberately excluded from this rule and handled by priority 28, so a suspended site reports ERR_SITE_SUSPENDED rather than ERR_SITE_NOT_APPROVED."
    error_id: ERR_SITE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sfsp/sites/{site_id}/operating-status, POST /sfsp/meal-service-days/{day_id}/open"

  - priority: 28
    category: state
    check: "Cross-entity: a Site with approval_status == SUSPENDED cannot open a service day, finalize a service day, or have its meals claimed (Site.claim_hold)."
    error_id: ERR_SITE_SUSPENDED
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open, POST /sfsp/meal-service-days/{day_id}/finalize"

  - priority: 29
    category: state
    check: "Cross-entity: Site.operating_status == OPERATING is required to open a service day."
    error_id: ERR_SITE_NOT_OPERATING
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open"

  - priority: 30
    category: state
    check: "Cross-entity: the sponsor's SponsorBudget for the relevant program year has status IN {APPROVED, AMENDMENT_PENDING} before a claim may be submitted or an advance approved."
    error_id: ERR_BUDGET_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit, POST /sfsp/advance-payments/{advance_id}/decision"

  - priority: 31
    category: state
    check: "Optimistic concurrency: expected_sponsor_version equals the current Sponsor.version (see §1.2.1)."
    error_id: ERR_STALE_SPONSOR_VERSION
    http_status: 412
    applies_to: "POST /sfsp/advance-payments, POST /sfsp/meal-claims"

  - priority: 32
    category: business_safety
    check: "MealServiceDay.food_safety_status == OK is required to record point-of-service meal counts."
    error_id: ERR_FOOD_SAFETY_BREACH
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days/{day_id}/meal-counts"

  - priority: 33
    category: business_safety
    check: "HoldingLogEntry.measured_at is greater than or equal to MealServiceDay.food_received_at."
    error_id: ERR_MEASURED_BEFORE_FOOD_RECEIVED
    http_status: 422
    applies_to: "POST /sfsp/meal-service-days/{day_id}/holding-logs"

  - priority: 34
    category: business_safety
    check: "Site.eligibility_basis != UNDETERMINED before an approval decision of APPROVED may be recorded."
    error_id: ERR_ELIGIBILITY_NOT_DETERMINED
    http_status: 409
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision"

  - priority: 35
    category: business_safety
    check: "Site.eligibility_basis != NOT_ELIGIBLE when the decision is APPROVED."
    error_id: ERR_SITE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision"

  - priority: 36
    category: business_referential
    check: "Every meal_type supplied is a member of Site.approved_meal_types (day creation, meal counts, holding logs)."
    error_id: ERR_MEAL_TYPE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /sfsp/meal-service-days, POST /sfsp/meal-service-days/{day_id}/meal-counts, POST /sfsp/meal-service-days/{day_id}/holding-logs"

  - priority: 37
    category: business_referential
    check: "reversal_of_entry_id, when present, references a MealCountEntry on the same MealServiceDay with entry_kind ORIGINAL, the same meal_type, and no existing REVERSAL pointing at it."
    error_id: ERR_REVERSAL_TARGET_INVALID
    http_status: 422
    applies_to: "POST /sfsp/meal-service-days/{day_id}/meal-counts"

  - priority: 38
    category: business_referential
    check: "The Site named by a claim line item belongs to the claim's sponsor (Site.sponsor_id == MealClaim.sponsor_id)."
    error_id: ERR_SITE_SPONSOR_MISMATCH
    http_status: 422
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"

  - priority: 39
    category: business_referential
    check: "area_eligibility_record_id is present when site_type IN {OPEN, RESTRICTED_OPEN, MIGRANT}."
    error_id: ERR_AREA_RECORD_REQUIRED
    http_status: 422
    applies_to: "POST /sfsp/sites"

  - priority: 40
    category: business_referential
    check: "enrolled_free_reduced_pct is present when site_type == CLOSED_ENROLLED."
    error_id: ERR_ENROLLED_PCT_REQUIRED
    http_status: 422
    applies_to: "POST /sfsp/sites"

  - priority: 41
    category: business_constraint
    check: "approved_meal_types has at most 2 members, or at most 3 members including at least one of {AM_SNACK, PM_SNACK} when site_type IN {CAMP, MIGRANT}."
    error_id: ERR_MEAL_TYPE_COUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /sfsp/sites"

  - priority: 42
    category: business_constraint
    check: "(area_code, data_source) is unique across AreaEligibilityRecord."
    error_id: ERR_DUPLICATE_AREA_RECORD
    http_status: 409
    applies_to: "POST /sfsp/area-eligibility-records"

  - priority: 43
    category: business_constraint
    check: "(site_id, service_date) is unique across MealServiceDay rows whose status != VOIDED."
    error_id: ERR_DUPLICATE_SERVICE_DAY
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days"

  - priority: 44
    category: business_constraint
    check: "(sponsor_id, claim_month) is unique across MealClaim rows."
    error_id: ERR_DUPLICATE_CLAIM_MONTH
    http_status: 409
    applies_to: "POST /sfsp/meal-claims"

  - priority: 45
    category: business_constraint
    check: "(meal_claim_id, site_id) is unique across ClaimLineItem rows."
    error_id: ERR_DUPLICATE_CLAIM_LINE_ITEM
    http_status: 409
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"

  - priority: 46
    category: business_constraint
    check: "The site has at least one MealServiceDay with status FINALIZED and service_date inside MealClaim.claim_month."
    error_id: ERR_NO_FINALIZED_DAYS
    http_status: 422
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"

  - priority: 47
    category: business_constraint
    check: "The claim has at least one ClaimLineItem before it may be submitted."
    error_id: ERR_CLAIM_HAS_NO_LINE_ITEMS
    http_status: 422
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"

  - priority: 48
    category: business_constraint
    check: "MealClaim.blocking_hold_count == 0 (no line item's site is on claim hold)."
    error_id: ERR_CLAIM_HOLD_BLOCKING
    http_status: 409
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"

  - priority: 49
    category: business_constraint
    check: "The forecast window contains at least one FINALIZED MealServiceDay strictly before the requested service_date."
    error_id: ERR_INSUFFICIENT_FORECAST_HISTORY
    http_status: 422
    applies_to: "GET /sfsp/sites/{site_id}/attendance-forecast"

  - priority: 50
    category: business_constraint
    check: "No MealServiceDay of the site has status OPEN when operating_status moves to CLOSED_FOR_SEASON."
    error_id: ERR_DAY_HAS_OPEN_SERVICE
    http_status: 409
    applies_to: "POST /sfsp/sites/{site_id}/operating-status"

  - priority: 51
    category: business_constraint
    check: "At least one Site of the sponsor has approval_status == APPROVED before an advance may be disbursed."
    error_id: ERR_NO_APPROVED_SITE
    http_status: 409
    applies_to: "POST /sfsp/advance-payments/{advance_id}/disburse"

  - priority: 52
    category: business_temporal
    check: "MealServiceDay.service_date is within [Site.operating_start_date, Site.operating_end_date] inclusive."
    error_id: ERR_SERVICE_DATE_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /sfsp/meal-service-days"

  - priority: 53
    category: business_temporal
    check: "Within one MealServiceDay, the meal_services windows are treated as half-open [service_start, service_end) intervals: no two may overlap, and consecutive windows ordered by service_start must satisfy next.service_start - previous.service_end >= MEAL_SERVICE_GAP_MINUTES (60). A gap of exactly 60 minutes is accepted; abutting windows (gap 0) are rejected."
    error_id: ERR_MEAL_SERVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sfsp/meal-service-days"

  - priority: 54
    category: business_temporal
    check: "For the same monitor_user_id and scheduled_date, visit windows are treated as CLOSED [window_start, window_end] intervals with no buffer: two windows collide when they share any instant, so a window starting exactly when another ends is rejected. CANCELLED visits are excluded from the candidate set."
    error_id: ERR_MONITOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /sfsp/monitoring-visits"

  - priority: 55
    category: business_constraint
    check: "A monitor_user_id has at most MAX_VISITS_PER_MONITOR_DAY (3) visits with status != CANCELLED on one scheduled_date."
    error_id: ERR_MONITOR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sfsp/monitoring-visits"

  - priority: 56
    category: business_temporal
    check: "The logical clock date is greater than or equal to MonitoringVisit.scheduled_date when conducting a visit."
    error_id: ERR_VISIT_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /sfsp/monitoring-visits/{visit_id}/conduct"

  - priority: 57
    category: business_temporal
    check: "The logical clock date is strictly after the last calendar day of the month following AdvancePayment.request_month, and outstanding_cents > 0, before a recovery demand may be issued."
    error_id: ERR_DEMAND_TOO_EARLY
    http_status: 409
    applies_to: "POST /sfsp/advance-payments/{advance_id}/demand"

  - priority: 58
    category: business_temporal
    check: "Escalation requires logical clock date strictly after CorrectiveAction.due_date, or (from REJECTED) rejection_count >= 2."
    error_id: ERR_ESCALATION_NOT_DUE
    http_status: 409
    applies_to: "POST /sfsp/corrective-actions/{action_id}/escalate"

  - priority: 59
    category: business_fiscal
    check: "SponsorBudget.admin_cost_ratio <= 0.2000 at submit time."
    error_id: ERR_ADMIN_RATIO_EXCEEDED
    http_status: 422
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit"

  - priority: 60
    category: business_fiscal
    check: "approved_operating_cost_cents <= operating_cost_budget_cents and approved_admin_cost_cents <= admin_cost_budget_cents; both are required when decision == APPROVED."
    error_id: ERR_APPROVED_CEILING_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/decision"

  - priority: 61
    category: business_fiscal
    check: "approved_amount_cents <= AdvancePayment.requested_amount_cents; required when decision == APPROVED."
    error_id: ERR_APPROVED_EXCEEDS_REQUESTED
    http_status: 422
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"

  - priority: 62
    category: business_fiscal
    check: "approved_amount_cents <= floor(0.25 * (SponsorBudget.approved_operating_cost_cents + SponsorBudget.approved_admin_cost_cents))."
    error_id: ERR_ADVANCE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"

  - priority: 63
    category: business_fiscal
    check: "Sponsor.advance_eligible == true AND Sponsor.experience_status == EXPERIENCED."
    error_id: ERR_SPONSOR_NOT_ADVANCE_ELIGIBLE
    http_status: 422
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"

  - priority: 64
    category: business_fiscal
    check: "claimed_operating_cost_cents <= SponsorBudget.approved_operating_cost_cents."
    error_id: ERR_OPERATING_COST_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"

  - priority: 65
    category: business_fiscal
    check: "claimed_admin_cost_cents <= SponsorBudget.approved_admin_cost_cents."
    error_id: ERR_ADMIN_COST_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"

# =============================================================================
# §1.5 API Endpoint Table (all paths under api_prefix /sfsp)
# =============================================================================
endpoints:
  # --- Sponsor ---------------------------------------------------------------
  - method: POST
    path: /sfsp/sponsors
    description: "Register a sponsor organization applying to operate SFSP sites. Starts in application_status DRAFT with version 1."
    roles: [StateAgencyReviewer]
    success_code: 201
    input: [legal_name, sponsor_type, experience_status, program_year, "advance_eligible?"]
    output: Sponsor
    side_effects:
      - "application_status = DRAFT; advance_paid_cents = advance_recovered_cents = advance_outstanding_cents = reimbursement_paid_cents = 0; version = 1"

  - method: GET
    path: /sfsp/sponsors/{sponsor_id}
    description: "Fetch one sponsor with its ledger fields."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: POST
    path: /sfsp/sponsors/{sponsor_id}/application-submit
    description: "Sponsor submits its program application (DRAFT -> SUBMITTED)."
    roles: [SponsorAdmin]
    success_code: 200
    input: []
    output: Sponsor
    side_effects: ["application_status = SUBMITTED; increments Sponsor.version by 1"]

  - method: POST
    path: /sfsp/sponsors/{sponsor_id}/application-decision
    description: "State agency approves, denies or terminates a sponsor. decision IN {APPROVED, DENIED, TERMINATED}. TERMINATED from APPROVED cascades to sites and service days per §1.2."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [decision, "reason?"]
    output: Sponsor
    side_effects:
      - "application_status = decision"
      - "on TERMINATED: cascade hop 1 — every Site with approval_status IN {PENDING_REVIEW, APPROVED, SUSPENDED} -> DENIED with claim_hold = true; cascade hop 2 — because those sites became DENIED, each of their MealServiceDay rows with status IN {PLANNED, OPEN} -> VOIDED with void_reason = 'SITE_DENIED' and Site.voided_day_count incremented per voided day"
      - "increments Sponsor.version by 1"

  # --- AreaEligibilityRecord -------------------------------------------------
  - method: POST
    path: /sfsp/area-eligibility-records
    description: "Record an immutable area income determination used for site area eligibility. (area_code, data_source) is unique."
    roles: [StateAgencyReviewer]
    success_code: 201
    input: [area_code, data_source, free_reduced_pct, determination_date, valid_through_date]
    output: AreaEligibilityRecord
    side_effects: []

  - method: GET
    path: /sfsp/area-eligibility-records/{record_id}
    description: "Fetch one area eligibility record."
    roles: [StateAgencyReviewer, SponsorAdmin]
    success_code: 200
    input: []
    output: AreaEligibilityRecord
    side_effects: []

  # --- SponsorBudget ---------------------------------------------------------
  - method: POST
    path: /sfsp/sponsor-budgets
    description: "Create a program-year budget in DRAFT. admin_cost_ratio is computed on every write."
    roles: [SponsorAdmin]
    success_code: 201
    input: [sponsor_id, program_year, operating_cost_budget_cents, admin_cost_budget_cents, projected_total_meals]
    output: SponsorBudget
    side_effects: ["status = DRAFT; revision_round = 0; admin_cost_ratio computed"]

  - method: GET
    path: /sfsp/sponsor-budgets/{budget_id}
    description: "Fetch one sponsor budget."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: []
    output: SponsorBudget
    side_effects: []

  - method: GET
    path: /sfsp/sponsor-budgets
    description: "List sponsor budgets, filterable by owning sponsor and status."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: ["sponsor_id?", "program_year?", "status?", "limit?", "offset?"]
    output: SponsorBudget[]
    side_effects: []

  - method: POST
    path: /sfsp/sponsor-budgets/{budget_id}/submit
    description: "Submit a budget for review (DRAFT -> SUBMITTED, REVISION_REQUESTED -> SUBMITTED, APPROVED -> AMENDMENT_PENDING)."
    roles: [SponsorAdmin]
    success_code: 200
    input: []
    output: SponsorBudget
    side_effects: ["status per §1.2 SponsorBudget; submitted_at = current logical clock"]

  - method: POST
    path: /sfsp/sponsor-budgets/{budget_id}/decision
    description: "Record a review decision. decision IN {APPROVED, REVISION_REQUESTED, WITHDRAWN}. REVISION_REQUESTED increments revision_round."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [decision, "approved_operating_cost_cents?", "approved_admin_cost_cents?", "reason?"]
    output: SponsorBudget
    side_effects:
      - "on APPROVED: approved_operating_cost_cents and approved_admin_cost_cents stored; decided_at set"
      - "on REVISION_REQUESTED: revision_round += 1"

  # --- AdvancePayment --------------------------------------------------------
  - method: POST
    path: /sfsp/advance-payments
    description: "Request a program advance against the approved budget. Guarded by optimistic concurrency on the sponsor (§1.2.1)."
    roles: [SponsorAdmin]
    success_code: 201
    input: [sponsor_id, request_month, requested_amount_cents, expected_sponsor_version]
    output: AdvancePayment
    side_effects: ["status = REQUESTED; recovered_amount_cents = 0; outstanding_cents = 0; increments Sponsor.version by 1"]

  - method: GET
    path: /sfsp/advance-payments/{advance_id}
    description: "Fetch one advance payment with its recovery ledger."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: []
    output: AdvancePayment
    side_effects: []

  - method: GET
    path: /sfsp/advance-payments
    description: "List advance payments, filterable by owning sponsor, status and request month."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: ["sponsor_id?", "status?", "request_month?", "limit?", "offset?"]
    output: AdvancePayment[]
    side_effects: []

  - method: POST
    path: /sfsp/advance-payments/{advance_id}/decision
    description: "Approve or deny an advance request. decision IN {APPROVED, DENIED}; approval enforces the 25 percent cap and sponsor advance eligibility."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [decision, "approved_amount_cents?", "reason?"]
    output: AdvancePayment
    side_effects: ["on APPROVED: approved_amount_cents stored; on DENIED: reason stored"]

  - method: POST
    path: /sfsp/advance-payments/{advance_id}/disburse
    description: "Disburse an approved advance (APPROVED -> DISBURSED); adds to the sponsor advance ledger."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: []
    output: AdvancePayment
    side_effects:
      - "outstanding_cents = approved_amount_cents; disbursed_at set"
      - "Sponsor.advance_paid_cents += approved_amount_cents; Sponsor.advance_outstanding_cents += approved_amount_cents; increments Sponsor.version by 1"

  - method: POST
    path: /sfsp/advance-payments/{advance_id}/demand
    description: "Issue a recovery demand for an advance still outstanding after the month following request_month."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [reason]
    output: AdvancePayment
    side_effects: ["status = DEMAND_ISSUED; demand_issued_at = current logical clock"]

  # --- Site ------------------------------------------------------------------
  - method: POST
    path: /sfsp/sites
    description: "Register a meal site under an approved sponsor. approval_status starts PENDING_REVIEW, operating_status starts NOT_STARTED, eligibility_basis starts UNDETERMINED."
    roles: [SponsorAdmin]
    success_code: 201
    input: [sponsor_id, name, site_type, production_mode, approved_meal_types, approved_max_attendance, operating_start_date, operating_end_date, "area_eligibility_record_id?", "enrolled_free_reduced_pct?", "is_open_air?", "is_rural?"]
    output: Site
    side_effects: ["approval_status = PENDING_REVIEW; operating_status = NOT_STARTED; eligibility_basis = UNDETERMINED; claim_hold = false; compliance_flag_count = 0; voided_day_count = 0"]

  - method: GET
    path: /sfsp/sites/{site_id}
    description: "Fetch one site with both status dimensions and its compliance counters."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: /sfsp/sites
    description: "List sites, filterable by owning sponsor, source area eligibility record, and either status dimension."
    roles: [StateAgencyReviewer, SponsorAdmin, FieldMonitor]
    success_code: 200
    input: ["sponsor_id?", "area_eligibility_record_id?", "approval_status?", "operating_status?", "site_type?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: POST
    path: /sfsp/sites/{site_id}/eligibility-determination
    description: "Run site_eligibility_determination and pin eligibility_basis plus eligibility_pct_used onto the site. Idempotent only in the sense that a second call recomputes from current data; allowed while approval_status == PENDING_REVIEW."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: []
    output: Site
    side_effects: ["eligibility_basis and eligibility_pct_used set per §1.3 site_eligibility_determination"]

  - method: POST
    path: /sfsp/sites/{site_id}/approval-decision
    description: "Approve, deny, suspend or reinstate a site along the approval_status dimension. decision IN {APPROVED, DENIED, SUSPENDED, REINSTATED}. Never touches operating_status."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [decision, "reason?"]
    output: Site
    side_effects:
      - "on SUSPENDED: claim_hold = true; suspension_reason = reason"
      - "on REINSTATED: approval_status = APPROVED; claim_hold = false; suspension_reason = null"

  - method: POST
    path: /sfsp/sites/{site_id}/operating-status
    description: "Move the operating_status dimension. to_status IN {OPERATING, CLOSED_FOR_SEASON}. Independent of approval_status except that OPERATING requires approval_status == APPROVED."
    roles: [SponsorAdmin]
    success_code: 200
    input: [to_status]
    output: Site
    side_effects: ["on OPERATING: first_operating_date = current logical clock date when previously null"]

  - method: GET
    path: /sfsp/sites/{site_id}/attendance-forecast
    description: "Computed read returning the outreach attendance forecast for a future service date. method IN {PEAK_PROJECTION, DECAY_WEIGHTED} selects the §1.3 attendance_forecast variant."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: [service_date, method]
    output: { site_id: string, service_date: string, method: string, forecast_meals: integer, prior_days_used: integer, most_recent_production_meals: integer, waste_risk_flag: boolean }
    side_effects: []

  # --- MealServiceDay --------------------------------------------------------
  - method: POST
    path: /sfsp/meal-service-days
    description: "Plan one service date at a site. meal_services is an array of { meal_type, planned_meals, service_start, service_end } validated for window separation."
    roles: [SiteSupervisor]
    success_code: 201
    input: [site_id, service_date, meal_services]
    output: MealServiceDay
    side_effects: ["status = PLANNED; production_mode copied from Site.production_mode; food_safety_status = OK; all counters 0"]

  - method: GET
    path: /sfsp/meal-service-days/{day_id}
    description: "Fetch one service day with its point-of-service totals and food safety status."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: []
    output: MealServiceDay
    side_effects: []

  - method: GET
    path: /sfsp/meal-service-days
    description: "List service days, filterable by site, service date and status."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: ["site_id?", "service_date?", "status?", "limit?", "offset?"]
    output: MealServiceDay[]
    side_effects: []

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/open
    description: "Open the service day for point-of-service counting. production_counts is a map meal_type -> integer of meals produced or delivered; food_received_at anchors holding-time evaluation."
    roles: [SiteSupervisor]
    success_code: 200
    input: [production_counts, food_received_at]
    output: MealServiceDay
    side_effects: ["status = OPEN; production_counts and food_received_at stored"]

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/close
    description: "Close counting for the day and run point_of_service_meal_classification over all MealCountEntry rows, then leftover and discard accounting."
    roles: [SiteSupervisor]
    success_code: 200
    input: []
    output: MealServiceDay
    side_effects:
      - "status = CLOSED"
      - "counted_first_meals, counted_second_meals, counted_adult_meals, reimbursable_meals, non_reimbursable_meals recomputed per §1.3 point_of_service_meal_classification"
      - "leftover_meals = max(0, sum(production_counts) - counted_first_meals - counted_second_meals - counted_adult_meals - discarded_meals)"

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/finalize
    description: "Sponsor-level sign-off making the day claimable (CLOSED -> FINALIZED)."
    roles: [SponsorAdmin]
    success_code: 200
    input: []
    output: MealServiceDay
    side_effects: ["status = FINALIZED"]

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/void
    description: "Void a service day so that none of its meals are claimable. Allowed from PLANNED, OPEN or CLOSED."
    roles: [SponsorAdmin]
    success_code: 200
    input: [reason]
    output: MealServiceDay
    side_effects: ["status = VOIDED; void_reason = reason; reimbursable_meals = 0; Site.voided_day_count += 1"]

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/meal-counts
    description: "Record a point-of-service meal count entry. entry_kind is REVERSAL when reversal_of_entry_id is supplied, in which case the counts must equal the target entry's counts and are applied as negatives."
    roles: [SiteSupervisor]
    success_code: 201
    input: [meal_type, first_meals, second_meals, adult_meals, "reversal_of_entry_id?"]
    output: MealCountEntry
    side_effects:
      - "entry_kind = REVERSAL when reversal_of_entry_id present else ORIGINAL"
      - "reimbursable_first_meals, reimbursable_second_meals and non_reimbursable_meals set to this entry's marginal attribution per §1.3 point_of_service_meal_classification"
      - "MealServiceDay running totals updated (a REVERSAL contributes negative deltas)"

  - method: GET
    path: /sfsp/meal-count-entries/{entry_id}
    description: "Fetch one point-of-service meal count entry with its attributed reimbursable split."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: []
    output: MealCountEntry
    side_effects: []

  - method: GET
    path: /sfsp/meal-count-entries
    description: "List meal count entries, filterable by service day, reversal target and meal type."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: ["meal_service_day_id?", "reversal_of_entry_id?", "meal_type?", "entry_kind?", "limit?", "offset?"]
    output: MealCountEntry[]
    side_effects: []

  - method: POST
    path: /sfsp/meal-service-days/{day_id}/holding-logs
    description: "Record a temperature and holding-time observation. Breach evaluation applies only when the site is open air (§1.3 holding_time_breach_evaluation)."
    roles: [SiteSupervisor]
    success_code: 201
    input: [meal_type, temperature_class, temperature_f, measured_at]
    output: HoldingLogEntry
    side_effects:
      - "holding_minutes = whole minutes between MealServiceDay.food_received_at and measured_at"
      - "breach_flag and breach_reason set per §1.3 holding_time_breach_evaluation"
      - "on the first breach of the day: MealServiceDay.food_safety_status = BREACH, breach_at = measured_at, discarded_meals += production_counts[meal_type]"

  - method: GET
    path: /sfsp/holding-log-entries/{entry_id}
    description: "Fetch one holding log entry."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: []
    output: HoldingLogEntry
    side_effects: []

  - method: GET
    path: /sfsp/holding-log-entries
    description: "List holding log entries, filterable by service day, meal type and breach flag."
    roles: [StateAgencyReviewer, SponsorAdmin, SiteSupervisor, FieldMonitor]
    success_code: 200
    input: ["meal_service_day_id?", "meal_type?", "breach_flag?", "limit?", "offset?"]
    output: HoldingLogEntry[]
    side_effects: []

  # --- MonitoringVisit -------------------------------------------------------
  - method: POST
    path: /sfsp/monitoring-visits
    description: "Schedule a monitoring visit for a site. Windows are closed intervals per monitor per date and are capped at 3 visits per monitor per date."
    roles: [FieldMonitor]
    success_code: 201
    input: [site_id, monitor_user_id, visit_type, scheduled_date, window_start, window_end]
    output: MonitoringVisit
    side_effects: ["status = SCHEDULED; is_late = false"]

  - method: GET
    path: /sfsp/monitoring-visits/{visit_id}
    description: "Fetch one monitoring visit with its findings."
    roles: [StateAgencyReviewer, SponsorAdmin, FieldMonitor]
    success_code: 200
    input: []
    output: MonitoringVisit
    side_effects: []

  - method: GET
    path: /sfsp/monitoring-visits
    description: "List monitoring visits, filterable by site, monitor, status, type and scheduled date."
    roles: [StateAgencyReviewer, SponsorAdmin, FieldMonitor]
    success_code: 200
    input: ["site_id?", "monitor_user_id?", "status?", "visit_type?", "scheduled_date?", "limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []

  - method: POST
    path: /sfsp/monitoring-visits/{visit_id}/conduct
    description: "Mark a scheduled visit as conducted; sets conducted_at and computes lateness against the §1.3 monitoring_schedule_compliance due date."
    roles: [FieldMonitor]
    success_code: 200
    input: []
    output: MonitoringVisit
    side_effects: ["status = CONDUCTED; conducted_at = current logical clock; is_late = conducted date > due_date"]

  - method: POST
    path: /sfsp/monitoring-visits/{visit_id}/report
    description: "File the visit report. findings is an array of { finding_code, severity }. An empty findings array closes the visit directly; a non-empty array files the report and opens one CorrectiveAction per finding."
    roles: [FieldMonitor]
    success_code: 200
    input: [findings]
    output: MonitoringVisit
    side_effects:
      - "findings and highest_severity stored"
      - "empty findings: status = CLOSED"
      - "non-empty findings: status = REPORT_FILED; one CorrectiveAction created per finding with origin VISIT_FINDING, due_date per §1.3 corrective_action_due_date, opened_by_user_id = monitor_user_id"
      - "any CRITICAL finding: Site.approval_status = SUSPENDED, Site.claim_hold = true, all that site's MealServiceDay rows in {PLANNED, OPEN} -> VOIDED, and every DRAFT or REVISION_OPENED ClaimLineItem of that site gets hold_flag = true with MealClaim.blocking_hold_count recomputed"

  - method: POST
    path: /sfsp/monitoring-visits/{visit_id}/cancel
    description: "Cancel a scheduled visit; frees its window and daily-cap slot."
    roles: [FieldMonitor]
    success_code: 200
    input: [reason]
    output: MonitoringVisit
    side_effects: ["status = CANCELLED; cancel_reason = reason"]

  # --- CorrectiveAction ------------------------------------------------------
  - method: GET
    path: /sfsp/corrective-actions/{action_id}
    description: "Fetch one corrective action."
    roles: [StateAgencyReviewer, SponsorAdmin, FieldMonitor]
    success_code: 200
    input: []
    output: CorrectiveAction
    side_effects: []

  - method: GET
    path: /sfsp/corrective-actions
    description: "List corrective actions, filterable by site, originating visit, parent action, status and severity."
    roles: [StateAgencyReviewer, SponsorAdmin, FieldMonitor]
    success_code: 200
    input: ["site_id?", "monitoring_visit_id?", "follow_up_of_corrective_action_id?", "status?", "severity?", "origin?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []

  - method: POST
    path: /sfsp/corrective-actions/{action_id}/response
    description: "Sponsor submits a corrective action response (OPEN -> RESPONSE_SUBMITTED, REJECTED -> RESPONSE_SUBMITTED)."
    roles: [SponsorAdmin]
    success_code: 200
    input: [response_note, "evidence_ref?"]
    output: CorrectiveAction
    side_effects: ["status = RESPONSE_SUBMITTED; response_note and evidence_ref stored"]

  - method: POST
    path: /sfsp/corrective-actions/{action_id}/review
    description: "Monitor accepts or rejects a submitted response. decision IN {CLOSED, REJECTED}. A reviewer may not be the user who opened the action."
    roles: [FieldMonitor]
    success_code: 200
    input: [decision, "reason?"]
    output: CorrectiveAction
    side_effects:
      - "on CLOSED: status = CLOSED, closed_by_user_id = actor; when every CorrectiveAction of the originating visit is CLOSED and the visit is REPORT_FILED, the visit bubbles up to CLOSED; when every CorrectiveAction of a SUSPENDED site is CLOSED, Site.approval_status = APPROVED and Site.claim_hold = false"
      - "on REJECTED: status = REJECTED, rejection_count += 1, and a follow-up CorrectiveAction is created one severity level higher (MINOR -> MAJOR -> CRITICAL, CRITICAL stays CRITICAL) with follow_up_of_corrective_action_id set"

  - method: POST
    path: /sfsp/corrective-actions/{action_id}/escalate
    description: "Escalate an overdue or twice-rejected corrective action."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [reason]
    output: CorrectiveAction
    side_effects: ["status = ESCALATED; Site.claim_hold = true"]

  # --- MealClaim -------------------------------------------------------------
  - method: POST
    path: /sfsp/meal-claims
    description: "Open a monthly reimbursement claim. Guarded by optimistic concurrency on the sponsor (§1.2.1)."
    roles: [SponsorAdmin]
    success_code: 201
    input: [sponsor_id, claim_month, expected_sponsor_version]
    output: MealClaim
    side_effects: ["status = DRAFT; revision_round = 0; deadline_date = last calendar day of the month after claim_month; increments Sponsor.version by 1"]

  - method: GET
    path: /sfsp/meal-claims/{claim_id}
    description: "Fetch one meal claim with its reimbursement and offset fields."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: []
    output: MealClaim
    side_effects: []

  - method: GET
    path: /sfsp/meal-claims
    description: "List meal claims, filterable by sponsor, claim month and status."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: ["sponsor_id?", "claim_month?", "status?", "limit?", "offset?"]
    output: MealClaim[]
    side_effects: []

  - method: POST
    path: /sfsp/meal-claims/{claim_id}/line-items
    description: "Add one site's finalized meals to the claim. rate_class and claimed counts are derived from the site's FINALIZED service days inside claim_month."
    roles: [SponsorAdmin]
    success_code: 201
    input: [site_id]
    output: ClaimLineItem
    side_effects:
      - "rate_class = RURAL_OR_SELF_PREP when Site.is_rural or Site.production_mode == SELF_PREP else OTHER"
      - "finalized_day_count, claimed_first_meals_by_type and claimed_second_meals_by_type aggregated from FINALIZED days in claim_month"
      - "meals_rate_value_cents computed per §1.3 claim_meals_rate_value; edit_check_status = PENDING; disallow_reason = NONE; hold_flag = Site.claim_hold"
      - "MealClaim.meals_rate_value_cents and blocking_hold_count recomputed"

  - method: GET
    path: /sfsp/claim-line-items/{line_item_id}
    description: "Fetch one claim line item with its rate class and disallowance state."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: []
    output: ClaimLineItem
    side_effects: []

  - method: GET
    path: /sfsp/claim-line-items
    description: "List claim line items, filterable by claim, site and edit-check status."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: ["meal_claim_id?", "site_id?", "edit_check_status?", "disallow_reason?", "limit?", "offset?"]
    output: ClaimLineItem[]
    side_effects: []

  - method: POST
    path: /sfsp/meal-claims/{claim_id}/submit
    description: "Submit the claim with its cost claim. Computes the PRELIMINARY reimbursement variant only; no disallowances and no caps are applied at this point."
    roles: [SponsorAdmin]
    success_code: 200
    input: [claimed_operating_cost_cents, claimed_admin_cost_cents]
    output: MealClaim
    side_effects:
      - "status = SUBMITTED; submitted_at = current logical clock; is_late = submitted date > deadline_date"
      - "preliminary_reimbursement_cents computed per §1.3 claim_reimbursement variant PRELIMINARY"

  - method: POST
    path: /sfsp/meal-claims/{claim_id}/edit-check
    description: "Run the state-agency edit checks over every line item, then either fail the claim or compute the FINAL reimbursement, the advance offset and the net payable."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: []
    output: MealClaim
    side_effects:
      - "each ClaimLineItem gets edit_check_status and at most one disallow_reason per §1.3 claim_edit_check"
      - "any FAILED line item: status = EDIT_CHECK_FAILED, edit_check_failure_codes populated, and every failed line item's Site.compliance_flag_count += 1; a site reaching COMPLIANCE_FLAG_THRESHOLD opens a COMPLIANCE_FLAG CorrectiveAction of severity MAJOR and sets Site.claim_hold = true"
      - "no FAILED line item: status = VALIDATED, final_reimbursement_cents per §1.3 claim_reimbursement variant FINAL, advance_offset_cents per §1.3 advance_recovery_waterfall, net_payable_cents = final_reimbursement_cents - advance_offset_cents"

  - method: POST
    path: /sfsp/meal-claims/{claim_id}/pay
    description: "Pay a validated claim: applies the advance recovery waterfall to the sponsor ledger and records the net payment."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: []
    output: MealClaim
    side_effects:
      - "status = PAID; paid_at = current logical clock"
      - "each recovered AdvancePayment.recovered_amount_cents and outstanding_cents updated per §1.3 advance_recovery_waterfall; Sponsor.advance_recovered_cents += advance_offset_cents; Sponsor.advance_outstanding_cents -= advance_offset_cents; Sponsor.reimbursement_paid_cents += net_payable_cents; increments Sponsor.version by 1"

  - method: POST
    path: /sfsp/meal-claims/{claim_id}/open-revision
    description: "Reopen a failed or paid claim for revision. Reopening a PAID claim reverses the advance recovery and the paid reimbursement exactly."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [reason]
    output: MealClaim
    side_effects:
      - "from EDIT_CHECK_FAILED: status = DRAFT; from PAID: status = REVISION_OPENED. In both branches revision_round += 1 and every ClaimLineItem returns to edit_check_status PENDING with disallow_reason NONE and disallowed_counts_by_type {}"
      - "from PAID: every AdvancePayment recovery attributed to this claim is reversed and its status restored per §1.2 AdvancePayment; Sponsor.advance_recovered_cents -= advance_offset_cents; Sponsor.advance_outstanding_cents += advance_offset_cents; Sponsor.reimbursement_paid_cents -= net_payable_cents; advance_offset_cents = 0; net_payable_cents = 0; increments Sponsor.version by 1"

  - method: GET
    path: /sfsp/meal-claims/{claim_id}/reimbursement-summary
    description: "Computed read exposing every intermediate step of §1.3 claim_reimbursement for the claim's current status, including the administrative cap that was applied."
    roles: [SponsorAdmin, StateAgencyReviewer]
    success_code: 200
    input: []
    output: { claim_id: string, status: string, variant: string, meals_rate_value_cents: integer, operating_reimbursement_cents: integer, admin_cap_cents: integer, admin_reimbursement_cents: integer, preliminary_reimbursement_cents: integer, final_reimbursement_cents: integer, advance_offset_cents: integer, net_payable_cents: integer, disallowed_meal_count: integer }
    side_effects: []

  # --- Test support ----------------------------------------------------------
  - method: POST
    path: /sfsp/_clock/set_current_utc
    description: "Set the server's logical clock, which is the only source of 'now' for due dates, lateness, holding minutes and demand timing. The logical clock defaults to 2026-08-01T00:00:00Z at startup and MUST be initialised to that value before any test sets it explicitly."
    roles: [StateAgencyReviewer]
    success_code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent date-dependent computations use this value"]

# =============================================================================
# §1.6 Error Code Catalog (one row per distinct error_id in §1.4; every code is
# reachable from at least one §1.8 or §1.9 instance)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles."
    applies_to: "all"
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "The acting role appears in the endpoint's roles list in §1.5."
    applies_to: "all"
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Request body and query parameters are well formed: required fields present, enum members valid, integers non-negative where declared, dates ISO YYYY-MM-DD, times HH:MM, limit within 1..100, offset >= 0, decision/to_status/method values inside their declared sets."
    applies_to: "all"
  - id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    condition: "Sponsor referenced by path {sponsor_id} or body sponsor_id exists."
    applies_to: "POST/GET /sfsp/sponsors/{sponsor_id}*, POST /sfsp/sponsor-budgets, POST /sfsp/advance-payments, POST /sfsp/sites, POST /sfsp/meal-claims"
  - id: ERR_AREA_RECORD_NOT_FOUND
    http_status: 404
    condition: "AreaEligibilityRecord referenced by path {record_id} or body area_eligibility_record_id exists."
    applies_to: "GET /sfsp/area-eligibility-records/{record_id}, POST /sfsp/sites"
  - id: ERR_BUDGET_NOT_FOUND
    http_status: 404
    condition: "SponsorBudget referenced by path {budget_id} exists."
    applies_to: "GET /sfsp/sponsor-budgets/{budget_id}, POST /sfsp/sponsor-budgets/{budget_id}/*"
  - id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    condition: "AdvancePayment referenced by path {advance_id} exists."
    applies_to: "GET /sfsp/advance-payments/{advance_id}, POST /sfsp/advance-payments/{advance_id}/*"
  - id: ERR_SITE_NOT_FOUND
    http_status: 404
    condition: "Site referenced by path {site_id} or body site_id exists."
    applies_to: "GET/POST /sfsp/sites/{site_id}*, POST /sfsp/meal-service-days, POST /sfsp/monitoring-visits, POST /sfsp/meal-claims/{claim_id}/line-items"
  - id: ERR_SERVICE_DAY_NOT_FOUND
    http_status: 404
    condition: "MealServiceDay referenced by path {day_id} exists."
    applies_to: "GET /sfsp/meal-service-days/{day_id}, POST /sfsp/meal-service-days/{day_id}/*"
  - id: ERR_COUNT_ENTRY_NOT_FOUND
    http_status: 404
    condition: "MealCountEntry referenced by path {entry_id} or body reversal_of_entry_id exists."
    applies_to: "GET /sfsp/meal-count-entries/{entry_id}, POST /sfsp/meal-service-days/{day_id}/meal-counts"
  - id: ERR_HOLDING_LOG_NOT_FOUND
    http_status: 404
    condition: "HoldingLogEntry referenced by path {entry_id} exists."
    applies_to: "GET /sfsp/holding-log-entries/{entry_id}"
  - id: ERR_VISIT_NOT_FOUND
    http_status: 404
    condition: "MonitoringVisit referenced by path {visit_id} exists."
    applies_to: "GET /sfsp/monitoring-visits/{visit_id}, POST /sfsp/monitoring-visits/{visit_id}/*"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http_status: 404
    condition: "CorrectiveAction referenced by path {action_id} exists."
    applies_to: "GET /sfsp/corrective-actions/{action_id}, POST /sfsp/corrective-actions/{action_id}/*"
  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "MealClaim referenced by path {claim_id} exists."
    applies_to: "GET /sfsp/meal-claims/{claim_id}*, POST /sfsp/meal-claims/{claim_id}/*"
  - id: ERR_CLAIM_LINE_ITEM_NOT_FOUND
    http_status: 404
    condition: "ClaimLineItem referenced by path {line_item_id} exists."
    applies_to: "GET /sfsp/claim-line-items/{line_item_id}"
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "Ownership for entity_backed roles: a SponsorAdmin's X-User-ID equals the Sponsor.id reached from the target resource (directly, or via Site.sponsor_id / MealClaim.sponsor_id / SponsorBudget.sponsor_id / CorrectiveAction.site_id -> Site.sponsor_id); a SiteSupervisor's X-User-ID equals the Site.id reached from the target resource (directly, or via MealServiceDay.site_id)."
    applies_to: "every SponsorAdmin and SiteSupervisor write endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "Segregation of duties: the FieldMonitor reviewing a CorrectiveAction must have X-User-ID different from CorrectiveAction.opened_by_user_id."
    applies_to: "POST /sfsp/corrective-actions/{action_id}/review"
  - id: ERR_SPONSOR_STATE_INVALID
    http_status: 409
    condition: "Sponsor.application_status permits the requested transition (see §1.2 Sponsor)."
    applies_to: "POST /sfsp/sponsors/{sponsor_id}/application-submit, POST /sfsp/sponsors/{sponsor_id}/application-decision"
  - id: ERR_BUDGET_STATE_INVALID
    http_status: 409
    condition: "SponsorBudget.status permits the requested transition (see §1.2 SponsorBudget)."
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit, POST /sfsp/sponsor-budgets/{budget_id}/decision"
  - id: ERR_ADVANCE_STATE_INVALID
    http_status: 409
    condition: "AdvancePayment.status permits the requested transition (see §1.2 AdvancePayment)."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision, .../disburse, .../demand"
  - id: ERR_SITE_STATE_INVALID
    http_status: 409
    condition: "The Site dimension being moved permits the requested transition: approval_status for approval-decision, operating_status for operating-status."
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision, POST /sfsp/sites/{site_id}/operating-status, POST /sfsp/sites/{site_id}/eligibility-determination"
  - id: ERR_SERVICE_DAY_STATE_INVALID
    http_status: 409
    condition: "MealServiceDay.status permits the requested transition (see §1.2 MealServiceDay); meal counts and holding logs require status OPEN."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open, .../close, .../finalize, .../void, .../meal-counts, .../holding-logs"
  - id: ERR_VISIT_STATE_INVALID
    http_status: 409
    condition: "MonitoringVisit.status permits the requested transition (see §1.2 MonitoringVisit)."
    applies_to: "POST /sfsp/monitoring-visits/{visit_id}/conduct, .../report, .../cancel"
  - id: ERR_ACTION_STATE_INVALID
    http_status: 409
    condition: "CorrectiveAction.status permits the requested transition (see §1.2 CorrectiveAction)."
    applies_to: "POST /sfsp/corrective-actions/{action_id}/response, .../review, .../escalate"
  - id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    condition: "MealClaim.status permits the requested transition (see §1.2 MealClaim): submit needs DRAFT or REVISION_OPENED, edit-check needs SUBMITTED, pay needs VALIDATED, open-revision needs EDIT_CHECK_FAILED or PAID, line-items need DRAFT or REVISION_OPENED."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit, .../edit-check, .../pay, .../open-revision, .../line-items"
  - id: ERR_SPONSOR_NOT_APPROVED
    http_status: 409
    condition: "Cross-entity: Sponsor.application_status == APPROVED is required before a budget may be submitted, a site created, an advance requested or a claim created."
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit, POST /sfsp/sites, POST /sfsp/advance-payments, POST /sfsp/meal-claims"
  - id: ERR_SITE_NOT_APPROVED
    http_status: 409
    condition: "Cross-entity: Site.approval_status == APPROVED is required to move operating_status to OPERATING and to open a service day."
    applies_to: "POST /sfsp/sites/{site_id}/operating-status, POST /sfsp/meal-service-days/{day_id}/open"
  - id: ERR_SITE_SUSPENDED
    http_status: 409
    condition: "Cross-entity: a Site with approval_status == SUSPENDED cannot open a service day, finalize a service day, or have its meals claimed (Site.claim_hold)."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open, POST /sfsp/meal-service-days/{day_id}/finalize"
  - id: ERR_SITE_NOT_OPERATING
    http_status: 409
    condition: "Cross-entity: Site.operating_status == OPERATING is required to open a service day."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/open"
  - id: ERR_BUDGET_NOT_APPROVED
    http_status: 409
    condition: "Cross-entity: the sponsor's SponsorBudget for the relevant program year has status IN {APPROVED, AMENDMENT_PENDING} before a claim may be submitted or an advance approved."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit, POST /sfsp/advance-payments/{advance_id}/decision"
  - id: ERR_STALE_SPONSOR_VERSION
    http_status: 412
    condition: "Optimistic concurrency: expected_sponsor_version equals the current Sponsor.version (see §1.2.1)."
    applies_to: "POST /sfsp/advance-payments, POST /sfsp/meal-claims"
  - id: ERR_FOOD_SAFETY_BREACH
    http_status: 409
    condition: "MealServiceDay.food_safety_status == OK is required to record point-of-service meal counts."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/meal-counts"
  - id: ERR_MEASURED_BEFORE_FOOD_RECEIVED
    http_status: 422
    condition: "HoldingLogEntry.measured_at is greater than or equal to MealServiceDay.food_received_at."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/holding-logs"
  - id: ERR_ELIGIBILITY_NOT_DETERMINED
    http_status: 409
    condition: "Site.eligibility_basis != UNDETERMINED before an approval decision of APPROVED may be recorded."
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision"
  - id: ERR_SITE_NOT_ELIGIBLE
    http_status: 409
    condition: "Site.eligibility_basis != NOT_ELIGIBLE when the decision is APPROVED."
    applies_to: "POST /sfsp/sites/{site_id}/approval-decision"
  - id: ERR_MEAL_TYPE_NOT_APPROVED
    http_status: 422
    condition: "Every meal_type supplied is a member of Site.approved_meal_types (day creation, meal counts, holding logs)."
    applies_to: "POST /sfsp/meal-service-days, POST /sfsp/meal-service-days/{day_id}/meal-counts, POST /sfsp/meal-service-days/{day_id}/holding-logs"
  - id: ERR_REVERSAL_TARGET_INVALID
    http_status: 422
    condition: "reversal_of_entry_id, when present, references a MealCountEntry on the same MealServiceDay with entry_kind ORIGINAL, the same meal_type, and no existing REVERSAL pointing at it."
    applies_to: "POST /sfsp/meal-service-days/{day_id}/meal-counts"
  - id: ERR_SITE_SPONSOR_MISMATCH
    http_status: 422
    condition: "The Site named by a claim line item belongs to the claim's sponsor (Site.sponsor_id == MealClaim.sponsor_id)."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"
  - id: ERR_AREA_RECORD_REQUIRED
    http_status: 422
    condition: "area_eligibility_record_id is present when site_type IN {OPEN, RESTRICTED_OPEN, MIGRANT}."
    applies_to: "POST /sfsp/sites"
  - id: ERR_ENROLLED_PCT_REQUIRED
    http_status: 422
    condition: "enrolled_free_reduced_pct is present when site_type == CLOSED_ENROLLED."
    applies_to: "POST /sfsp/sites"
  - id: ERR_MEAL_TYPE_COUNT_EXCEEDED
    http_status: 422
    condition: "approved_meal_types has at most 2 members, or at most 3 members including at least one of {AM_SNACK, PM_SNACK} when site_type IN {CAMP, MIGRANT}."
    applies_to: "POST /sfsp/sites"
  - id: ERR_DUPLICATE_AREA_RECORD
    http_status: 409
    condition: "(area_code, data_source) is unique across AreaEligibilityRecord."
    applies_to: "POST /sfsp/area-eligibility-records"
  - id: ERR_DUPLICATE_SERVICE_DAY
    http_status: 409
    condition: "(site_id, service_date) is unique across MealServiceDay rows whose status != VOIDED."
    applies_to: "POST /sfsp/meal-service-days"
  - id: ERR_DUPLICATE_CLAIM_MONTH
    http_status: 409
    condition: "(sponsor_id, claim_month) is unique across MealClaim rows."
    applies_to: "POST /sfsp/meal-claims"
  - id: ERR_DUPLICATE_CLAIM_LINE_ITEM
    http_status: 409
    condition: "(meal_claim_id, site_id) is unique across ClaimLineItem rows."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"
  - id: ERR_NO_FINALIZED_DAYS
    http_status: 422
    condition: "The site has at least one MealServiceDay with status FINALIZED and service_date inside MealClaim.claim_month."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/line-items"
  - id: ERR_CLAIM_HAS_NO_LINE_ITEMS
    http_status: 422
    condition: "The claim has at least one ClaimLineItem before it may be submitted."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"
  - id: ERR_CLAIM_HOLD_BLOCKING
    http_status: 409
    condition: "MealClaim.blocking_hold_count == 0 (no line item's site is on claim hold)."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"
  - id: ERR_INSUFFICIENT_FORECAST_HISTORY
    http_status: 422
    condition: "The forecast window contains at least one FINALIZED MealServiceDay strictly before the requested service_date."
    applies_to: "GET /sfsp/sites/{site_id}/attendance-forecast"
  - id: ERR_DAY_HAS_OPEN_SERVICE
    http_status: 409
    condition: "No MealServiceDay of the site has status OPEN when operating_status moves to CLOSED_FOR_SEASON."
    applies_to: "POST /sfsp/sites/{site_id}/operating-status"
  - id: ERR_NO_APPROVED_SITE
    http_status: 409
    condition: "At least one Site of the sponsor has approval_status == APPROVED before an advance may be disbursed."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/disburse"
  - id: ERR_SERVICE_DATE_OUTSIDE_SEASON
    http_status: 422
    condition: "MealServiceDay.service_date is within [Site.operating_start_date, Site.operating_end_date] inclusive."
    applies_to: "POST /sfsp/meal-service-days"
  - id: ERR_MEAL_SERVICE_WINDOW_CONFLICT
    http_status: 409
    condition: "Within one MealServiceDay, the meal_services windows are treated as half-open [service_start, service_end) intervals: no two may overlap, and consecutive windows ordered by service_start must satisfy next.service_start - previous.service_end >= MEAL_SERVICE_GAP_MINUTES (60). A gap of exactly 60 minutes is accepted; abutting windows (gap 0) are rejected."
    applies_to: "POST /sfsp/meal-service-days"
  - id: ERR_MONITOR_SCHEDULE_CONFLICT
    http_status: 409
    condition: "For the same monitor_user_id and scheduled_date, visit windows are treated as CLOSED [window_start, window_end] intervals with no buffer: two windows collide when they share any instant, so a window starting exactly when another ends is rejected. CANCELLED visits are excluded from the candidate set."
    applies_to: "POST /sfsp/monitoring-visits"
  - id: ERR_MONITOR_DAILY_CAP_EXCEEDED
    http_status: 409
    condition: "A monitor_user_id has at most MAX_VISITS_PER_MONITOR_DAY (3) visits with status != CANCELLED on one scheduled_date."
    applies_to: "POST /sfsp/monitoring-visits"
  - id: ERR_VISIT_DATE_NOT_REACHED
    http_status: 409
    condition: "The logical clock date is greater than or equal to MonitoringVisit.scheduled_date when conducting a visit."
    applies_to: "POST /sfsp/monitoring-visits/{visit_id}/conduct"
  - id: ERR_DEMAND_TOO_EARLY
    http_status: 409
    condition: "The logical clock date is strictly after the last calendar day of the month following AdvancePayment.request_month, and outstanding_cents > 0, before a recovery demand may be issued."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/demand"
  - id: ERR_ESCALATION_NOT_DUE
    http_status: 409
    condition: "Escalation requires logical clock date strictly after CorrectiveAction.due_date, or (from REJECTED) rejection_count >= 2."
    applies_to: "POST /sfsp/corrective-actions/{action_id}/escalate"
  - id: ERR_ADMIN_RATIO_EXCEEDED
    http_status: 422
    condition: "SponsorBudget.admin_cost_ratio <= 0.2000 at submit time."
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/submit"
  - id: ERR_APPROVED_CEILING_EXCEEDS_REQUEST
    http_status: 422
    condition: "approved_operating_cost_cents <= operating_cost_budget_cents and approved_admin_cost_cents <= admin_cost_budget_cents; both are required when decision == APPROVED."
    applies_to: "POST /sfsp/sponsor-budgets/{budget_id}/decision"
  - id: ERR_APPROVED_EXCEEDS_REQUESTED
    http_status: 422
    condition: "approved_amount_cents <= AdvancePayment.requested_amount_cents; required when decision == APPROVED."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"
  - id: ERR_ADVANCE_EXCEEDS_CAP
    http_status: 422
    condition: "approved_amount_cents <= floor(0.25 * (SponsorBudget.approved_operating_cost_cents + SponsorBudget.approved_admin_cost_cents))."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"
  - id: ERR_SPONSOR_NOT_ADVANCE_ELIGIBLE
    http_status: 422
    condition: "Sponsor.advance_eligible == true AND Sponsor.experience_status == EXPERIENCED."
    applies_to: "POST /sfsp/advance-payments/{advance_id}/decision"
  - id: ERR_OPERATING_COST_EXCEEDS_BUDGET
    http_status: 422
    condition: "claimed_operating_cost_cents <= SponsorBudget.approved_operating_cost_cents."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"
  - id: ERR_ADMIN_COST_EXCEEDS_BUDGET
    http_status: 422
    condition: "claimed_admin_cost_cents <= SponsorBudget.approved_admin_cost_cents."
    applies_to: "POST /sfsp/meal-claims/{claim_id}/submit"

# =============================================================================
# §1.7 RBAC Permission Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: StateAgencyReviewer
    description: "State agency program specialist. Owns sponsor and site approval, budget and advance decisions, edit checks, payment and revision. Not scoped to any single sponsor."
    identity: opaque
    exclusive_operations:
      - "POST /sfsp/sponsors"
      - "POST /sfsp/sponsors/{sponsor_id}/application-decision"
      - "POST /sfsp/area-eligibility-records"
      - "POST /sfsp/sponsor-budgets/{budget_id}/decision"
      - "POST /sfsp/advance-payments/{advance_id}/decision"
      - "POST /sfsp/advance-payments/{advance_id}/disburse"
      - "POST /sfsp/advance-payments/{advance_id}/demand"
      - "POST /sfsp/sites/{site_id}/eligibility-determination"
      - "POST /sfsp/sites/{site_id}/approval-decision"
      - "POST /sfsp/corrective-actions/{action_id}/escalate"
      - "POST /sfsp/meal-claims/{claim_id}/edit-check"
      - "POST /sfsp/meal-claims/{claim_id}/pay"
      - "POST /sfsp/meal-claims/{claim_id}/open-revision"
      - "POST /sfsp/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: SponsorAdmin
    description: "Sponsor-side program administrator. X-User-ID is the Sponsor.id it acts for; it may only touch resources that resolve to that sponsor."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /sfsp/sponsors/{sponsor_id}/application-submit"
      - "POST /sfsp/sponsor-budgets"
      - "POST /sfsp/sponsor-budgets/{budget_id}/submit"
      - "POST /sfsp/advance-payments"
      - "POST /sfsp/sites"
      - "POST /sfsp/sites/{site_id}/operating-status"
      - "POST /sfsp/meal-service-days/{day_id}/finalize"
      - "POST /sfsp/meal-service-days/{day_id}/void"
      - "POST /sfsp/corrective-actions/{action_id}/response"
      - "POST /sfsp/meal-claims"
      - "POST /sfsp/meal-claims/{claim_id}/line-items"
      - "POST /sfsp/meal-claims/{claim_id}/submit"
    shared_operations:
      - "GET /sfsp/sponsors/{sponsor_id}, GET /sfsp/area-eligibility-records/{record_id}, GET /sfsp/sponsor-budgets*, GET /sfsp/advance-payments*, GET /sfsp/sites*, GET /sfsp/meal-service-days*, GET /sfsp/meal-count-entries*, GET /sfsp/holding-log-entries*, GET /sfsp/monitoring-visits*, GET /sfsp/corrective-actions*, GET /sfsp/meal-claims*, GET /sfsp/claim-line-items*"

  - name: SiteSupervisor
    description: "On-site meal service supervisor. X-User-ID is the Site.id it acts for; it may only plan, open, count, log and close that site's service days."
    identity: "entity_backed:Site"
    exclusive_operations:
      - "POST /sfsp/meal-service-days"
      - "POST /sfsp/meal-service-days/{day_id}/open"
      - "POST /sfsp/meal-service-days/{day_id}/close"
      - "POST /sfsp/meal-service-days/{day_id}/meal-counts"
      - "POST /sfsp/meal-service-days/{day_id}/holding-logs"
    shared_operations:
      - "GET /sfsp/sponsors/{sponsor_id}, GET /sfsp/sites/{site_id}, GET /sfsp/meal-service-days*, GET /sfsp/meal-count-entries*, GET /sfsp/holding-log-entries*"

  - name: FieldMonitor
    description: "Independent monitoring reviewer. Schedules, conducts and reports monitoring visits and reviews corrective action responses, but may never review a corrective action it opened (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /sfsp/monitoring-visits"
      - "POST /sfsp/monitoring-visits/{visit_id}/conduct"
      - "POST /sfsp/monitoring-visits/{visit_id}/report"
      - "POST /sfsp/monitoring-visits/{visit_id}/cancel"
      - "POST /sfsp/corrective-actions/{action_id}/review"
    shared_operations:
      - "GET /sfsp/sponsors/{sponsor_id}, GET /sfsp/sites*, GET /sfsp/meal-service-days*, GET /sfsp/meal-count-entries*, GET /sfsp/holding-log-entries*, GET /sfsp/monitoring-visits*, GET /sfsp/corrective-actions*"
