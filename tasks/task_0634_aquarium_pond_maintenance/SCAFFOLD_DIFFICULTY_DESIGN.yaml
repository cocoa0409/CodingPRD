scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_billing_routine_vs_emergency_diverge
        grounds:
          - calculations.visit_billing
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - entities.ServiceVisit.fields.total_cents
        distinguishing_aspect: |
          On the ServiceVisit entity domain, identical labor_minutes and consumable_lines
          produce total_cents=12000 for a ROUTINE visit but total_cents=15000 for an
          EMERGENCY visit (the 0.25 surcharge on after_discount), proving two valid
          variants of the same formula diverge by 3000 cents.
        test_recipe:
          setup:
            - "BASIC-tier ACTIVE contract; ACTIVE FRESHWATER system (200 L); one technician."
            - "Two visits booked on the same system, same tech, non-overlapping windows: one ROUTINE, one EMERGENCY (via emergency dispatch)."
            - "Both completed with labor_minutes=75, no consumable lines."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech", certified_for_reef: false, active: true }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Display Tank", system_kind: "FRESHWATER", nominal_volume_l: 200, substrate_displacement_pct: 0.10 }
              as: AccountManager
              captures: { system_id: $.data.id, system_v: $.data.version }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v2: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T10:00:00Z", expected_system_version: "${system_v2}" }
              as: Dispatcher
              captures: { routine_visit_id: $.data.id }
            - call: "POST /aquatics/visits/${routine_visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${routine_visit_id}/complete"
              payload: { labor_minutes: 75 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { routine_total: $.data.total_cents }
            - call: "POST /aquatics/emergencies"
              payload: { system_id: "${system_id}", severity: "HIGH", reported_at: "2026-02-03T08:00:00Z", trip_fee_cents: 5000 }
              as: Dispatcher
              captures: { emergency_id: $.data.id }
            - call: "POST /aquatics/emergencies/${emergency_id}/dispatch"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Dispatcher
              captures: { dispatched_visit_id: $.data.dispatched_visit_id }
            - call: "POST /aquatics/visits/${dispatched_visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${dispatched_visit_id}/complete"
              payload: { labor_minutes: 75 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { emergency_total: $.data.total_cents }
          assert:
            - "ServiceVisit.${routine_visit_id}.total_cents == 12000"
            - "ServiceVisit.${dispatched_visit_id}.total_cents == 15000"
            - "emergency_total - routine_total == 3000"

      - name: install_billing_provisional_vs_final_diverge
        grounds:
          - calculations.install_billing
          - state_machines.InstallProject.QUOTED_to_APPROVED
          - state_machines.InstallProject.IN_BUILD_to_HANDED_OFF
          - entities.InstallProject.fields.deposit_cents
          - entities.InstallProject.fields.final_total_cents
        distinguishing_aspect: |
          On the InstallProject entity domain (distinct from ServiceVisit), the PROVISIONAL
          variant yields quote_total_cents=160000 and deposit_cents=48000 from estimates,
          while the FINAL variant yields final_total_cents=188000 from actuals+change order —
          same project, two algorithms, a 28000-cent divergence between quote and final.
        test_recipe:
          setup:
            - "ACTIVE contract owned by owner-1; PROVISIONING system; install quoted with labor_estimate 40000, equipment_estimate 120000."
            - "Project approved (deposit issued), build started, then handed off with actual_labor_minutes=360, actual_equipment_cents=135000, change_order_cents=5000."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "PLUS", route_day: "TUE" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "New Build", system_kind: "FRESHWATER", nominal_volume_l: 400 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/installs"
              payload: { contract_id: "${contract_id}", system_id: "${system_id}", labor_estimate_cents: 40000, equipment_estimate_cents: 120000 }
              as: AccountManager
              captures: { install_id: $.data.id }
            - call: "POST /aquatics/installs/${install_id}/approve"
              payload: {}
              as: CustomerOwner
              as_user_id: "owner-1"
              captures: { quote_total: $.data.quote_total_cents, deposit: $.data.deposit_cents }
            - call: "POST /aquatics/installs/${install_id}/start-build"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/installs/${install_id}/handoff"
              payload: { actual_labor_minutes: 360, actual_equipment_cents: 135000, change_order_cents: 5000 }
              as: AccountManager
              captures: { final_total: $.data.final_total_cents }
          assert:
            - "InstallProject.${install_id}.quote_total_cents == 160000"
            - "InstallProject.${install_id}.deposit_cents == 48000"
            - "InstallProject.${install_id}.final_total_cents == 188000"
            - "final_total - quote_total == 28000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: visit_billing_nonlinear_multi_input_mode_a
        grounds:
          - calculations.visit_billing
          - entities.ServiceVisit.fields.total_cents
        distinguishing_aspect: |
          Mode (a): visit_billing combines >=3 inputs with non-linear interaction —
          tier-selected base, ceil(overage/15)*PER_BLOCK labor blocks, and summed
          consumable_lines — so PLUS tier with labor 60 and a single 2500-cent line
          yields total_cents=12150 (base 9000 + 1 block 2000 + 2500 line, 10% discount).
        test_recipe:
          setup:
            - "PLUS-tier ACTIVE contract; ACTIVE system; one tech; one ROUTINE visit started."
            - "Visit completed with labor_minutes=60 and a single consumable line qty=1 unit_price_cents=2500."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Beta", customer_user_id: "owner-1", service_tier: "PLUS", route_day: "WED" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Reef A", system_kind: "FRESHWATER", nominal_volume_l: 250 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-04T09:00:00Z", scheduled_end: "2026-02-04T10:30:00Z", expected_system_version: "${system_v}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/complete"
              payload: { labor_minutes: 60, consumable_lines: [ { qty: 1, unit_price_cents: 2500 } ] }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { total: $.data.total_cents }
          assert:
            - "ServiceVisit.${visit_id}.total_cents == 12150"

      - name: visit_billing_discount_then_surcharge_order_mode_c
        grounds:
          - calculations.visit_billing
          - entities.ServiceVisit.fields.total_cents
        distinguishing_aspect: |
          Mode (c): visit_billing pins an explicit evaluation order — plan_discount is taken
          on subtotal FIRST, then the emergency surcharge is taken on the post-discount amount
          (after_discount), not on the raw subtotal. For PREMIUM tier, labor 90, line 5000,
          EMERGENCY, this fixed order yields total_cents=23375 (surcharge 4675 on after_discount
          18700), whereas surcharge-on-subtotal would give a different number.
        test_recipe:
          setup:
            - "PREMIUM-tier ACTIVE contract; ACTIVE system; reef-certified tech; EMERGENCY visit started."
            - "Visit completed with labor_minutes=90 and a single line qty=1 unit_price_cents=5000."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech", certified_for_reef: true }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Gamma", customer_user_id: "owner-1", service_tier: "PREMIUM", route_day: "THU" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Reef B", system_kind: "REEF", nominal_volume_l: 300 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/emergencies"
              payload: { system_id: "${system_id}", severity: "CRITICAL", reported_at: "2026-02-05T08:00:00Z", trip_fee_cents: 9000 }
              as: Dispatcher
              captures: { emergency_id: $.data.id }
            - call: "POST /aquatics/emergencies/${emergency_id}/dispatch"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-02-05T09:00:00Z", scheduled_end: "2026-02-05T11:00:00Z" }
              as: Dispatcher
              captures: { visit_id: $.data.dispatched_visit_id }
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/complete"
              payload: { labor_minutes: 90, consumable_lines: [ { qty: 1, unit_price_cents: 5000 } ] }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { total: $.data.total_cents }
          assert:
            - "ServiceVisit.${visit_id}.total_cents == 23375"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_dispute_rework_reissue_cycle
        grounds:
          - state_machines.ServiceVisit.COMPLETED_to_DISPUTED
          - state_machines.ServiceVisit.DISPUTED_to_IN_PROGRESS
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          ServiceVisit is cyclic: COMPLETED -> DISPUTED -> IN_PROGRESS -> COMPLETED returns the
          row to a state it already occupied, and the second completion issues a FRESH invoice
          (invoice_id changes), proving the loop is real and not a one-way pipeline.
        test_recipe:
          setup:
            - "BASIC ACTIVE contract owned by owner-1; ACTIVE system; tech; ROUTINE visit completed once (invoice issued), then disputed (invoice voided)."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Delta", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "FRI" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-06T09:00:00Z", scheduled_end: "2026-02-06T10:00:00Z", expected_system_version: "${system_v}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${visit_id}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { first_invoice: $.data.invoice_id }
            - call: "POST /aquatics/visits/${visit_id}/dispute"
              payload: {}
              as: CustomerOwner
              as_user_id: "owner-1"
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/rework"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
              captures: { reworked_status: $.data.status, cleared_invoice: $.data.invoice_id }
            - call: "POST /aquatics/visits/${visit_id}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { second_invoice: $.data.invoice_id }
          assert:
            - "ServiceVisit.${visit_id}.status == IN_PROGRESS after rework"
            - "ServiceVisit.${visit_id}.invoice_id == null immediately after rework"
            - "ServiceVisit.${visit_id}.status == COMPLETED after second complete"
            - "second_invoice != first_invoice"

      - name: repair_awaiting_parts_rediagnose_cycle
        grounds:
          - state_machines.RepairOrder.DIAGNOSED_to_AWAITING_PARTS
          - state_machines.RepairOrder.AWAITING_PARTS_to_DIAGNOSED
        distinguishing_aspect: |
          RepairOrder (a different entity from ServiceVisit) cycles DIAGNOSED -> AWAITING_PARTS
          -> DIAGNOSED, returning to DIAGNOSED a second time; the parts-arrived transition is a
          genuine back-edge, not a forward pipeline step.
        test_recipe:
          setup:
            - "A system with a FILTER device; a repair order opened (parts_needed=true) and diagnosed."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Eta", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/equipment"
              payload: { system_id: "${system_id}", device_kind: "FILTER", media_interval_days: 30 }
              as: AccountManager
              captures: { equipment_id: $.data.id }
            - call: "POST /aquatics/repairs"
              payload: { equipment_id: "${equipment_id}", reported_symptom: "leak", parts_needed: true }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { repair_id: $.data.id }
            - call: "POST /aquatics/repairs/${repair_id}/diagnose"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/repairs/${repair_id}/order-parts"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/repairs/${repair_id}/parts-arrived"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
              captures: { back_status: $.data.status }
          assert:
            - "RepairOrder.${repair_id}.status == DIAGNOSED after parts-arrived (back-edge from AWAITING_PARTS)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: terminate_contract_decommission_system_decease_livestock_depth3
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
          - state_machines.SystemProfile.ACTIVE_to_DECOMMISSIONED
          - entities.Livestock.fields.status
        distinguishing_aspect: |
          Depth-3 chain: terminate contract (A) flips its SystemProfile to DECOMMISSIONED (B),
          and that B-transition itself flips each ALIVE Livestock to DECEASED (C). The Livestock
          change is caused by the system decommission, not directly by the contract terminate.
        test_recipe:
          setup:
            - "ACTIVE contract; one ACTIVE system holding one ALIVE livestock; no in-flight visits."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Theta", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 300 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${system_id}", common_name: "Tetra", species_class: "COMMUNITY", adult_length_cm: 4 }
              as: AccountManager
              captures: { livestock_id: $.data.id }
          trigger:
            - call: "POST /aquatics/contracts/${contract_id}/terminate"
              payload: {}
              as: AccountManager
          assert:
            - "ServiceContract.${contract_id}.status == TERMINATED"
            - "SystemProfile.${system_id}.status == DECOMMISSIONED"
            - "Livestock.${livestock_id}.status == DECEASED"

      - name: complete_visit_issue_invoice_recompute_balance_depth2
        grounds:
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - calculations.account_balance
          - entities.ServiceContract.fields.account_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (visit complete): completing the visit (A)
          creates an ISSUED Invoice (B), and the Invoice creation itself recomputes the owning
          ServiceContract.account_balance_cents (C-as-derived-field) to 12000. The balance bump
          is caused by the invoice creation, not directly by the visit completion.
        test_recipe:
          setup:
            - "BASIC ACTIVE contract (account_balance_cents starts 0); ACTIVE system; tech; ROUTINE visit started."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Iota", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-07T09:00:00Z", scheduled_end: "2026-02-07T10:30:00Z", expected_system_version: "${system_v}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/complete"
              payload: { labor_minutes: 75 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { invoice_id: $.data.invoice_id }
          assert:
            - "Invoice.${invoice_id}.status == ISSUED"
            - "Invoice.${invoice_id}.total_cents == 12000"
            - "ServiceContract.${contract_id}.account_balance_cents == 12000"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: visit_book_double_book_beats_stale_version
        grounds:
          - validations[priority=9]
          - validations[priority=15]
        distinguishing_aspect: |
          On POST /aquatics/visits a single request both collides with an existing visit window
          for the same tech (business_temporal, priority 9, ERR_TECH_DOUBLE_BOOKED) AND carries a
          stale expected_system_version (business_constraint OCC, priority 15, ERR_STALE_VERSION).
          The lower-numbered temporal check wins, so the response is ERR_TECH_DOUBLE_BOOKED, not
          ERR_STALE_VERSION — pinning the business_temporal vs business_constraint(OCC) ordering.
        test_recipe:
          setup:
            - "ACTIVE contract; one tech; one ACTIVE system; an existing SCHEDULED visit [09:00,10:00) for the tech (which advanced the system version, making the client's earlier-captured version stale)."
            - "Trigger: book a second visit on the SAME system, SAME tech, overlapping window [09:30,10:30), carrying the now-stale expected_system_version."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia Tech" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Kappa", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Live", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { stale_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-08T09:00:00Z", scheduled_end: "2026-02-08T10:00:00Z", expected_system_version: "${stale_v}" }
              as: Dispatcher
              captures: { existing_visit_id: $.data.id }
          trigger:
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-08T09:30:00Z", scheduled_end: "2026-02-08T10:30:00Z", expected_system_version: "${stale_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TECH_DOUBLE_BOOKED (priority 9 beats the stale-version OCC at priority 15)"
            - "response error_id != ERR_STALE_VERSION"

      - name: visit_start_tech_mismatch_beats_reef_cert
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          On POST /aquatics/visits/{id}/start for a REEF system, a FieldTech who is NOT the
          assigned tech AND is not reef-certified violates both business_referential (priority 6,
          ERR_TECH_MISMATCH) and business_safety (priority 7, ERR_TECH_NOT_CERTIFIED); the
          lower-numbered referential check wins -> ERR_TECH_MISMATCH, a different category pair
          from the temporal-vs-OCC pair above.
        test_recipe:
          setup:
            - "ACTIVE contract; REEF system commissioned; assigned tech-1 (reef-certified); a second tech-2 who is NOT reef-certified; a visit booked for tech-1."
            - "Trigger: tech-2 (wrong tech, not reef-certified) tries to start the visit."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia", certified_for_reef: true }
              as: Dispatcher
              captures: { tech1_id: $.data.id }
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-2", full_name: "Tom", certified_for_reef: false }
              as: Dispatcher
              captures: { tech2_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Lambda", customer_user_id: "owner-1", service_tier: "PREMIUM", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Reef", system_kind: "REEF", nominal_volume_l: 300 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech1_id}", scheduled_start: "2026-02-09T09:00:00Z", scheduled_end: "2026-02-09T10:00:00Z", expected_system_version: "${system_v}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TECH_MISMATCH"
            - "ERR_TECH_NOT_CERTIFIED is NOT returned (priority 6 beats priority 7)"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bioload_overstock_strict_greater_than_100
        grounds:
          - calculations.bioload_index
          - validations[priority=8]
          - entities.SystemProfile.fields.stocking_posture
        distinguishing_aspect: |
          On POST /aquatics/livestock, bioload exactly 100.0 is NORMAL (allowed) but the next
          addition that makes the index 110.0 (> 100.0 strict) is rejected with ERR_OVERSTOCKED;
          the threshold is strict greater-than, tested on the bioload metric.
        test_recipe:
          setup:
            - "ACTIVE 100 L system, 0 displacement, holding two ALIVE PREDATOR (30cm and 10cm) -> bioload exactly 100.0."
            - "Trigger: add a third PREDATOR 4cm (would push to 110.0)."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Mu", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 100, substrate_displacement_pct: 0.0 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${system_id}", common_name: "Oscar", species_class: "PREDATOR", adult_length_cm: 30 }
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${system_id}", common_name: "Jack", species_class: "PREDATOR", adult_length_cm: 10 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { posture_at_100: $.data.id }
          trigger:
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${system_id}", common_name: "Fry", species_class: "PREDATOR", adult_length_cm: 4 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "SystemProfile.${system_id}.bioload_index == 100.0 before trigger (NORMAL, allowed)"
            - "SystemProfile.${system_id}.stocking_posture == NORMAL before trigger"
            - "trigger response error_id == ERR_OVERSTOCKED (110.0 > 100.0 strict)"

      - name: labor_included_minutes_boundary_zero_blocks
        grounds:
          - calculations.visit_billing
          - entities.ServiceVisit.fields.labor_minutes
        distinguishing_aspect: |
          On POST /aquatics/visits/{id}/complete (a different endpoint and metric than the
          bioload boundary), labor_minutes exactly at the BASIC included 30 bills 0 overage
          blocks (total 6000), but labor_minutes 31 bills 1 ceil block (total 8000) — the
          included-minutes boundary is exact (<= included = 0 blocks).
        test_recipe:
          setup:
            - "BASIC ACTIVE contract; ACTIVE system; tech; one visit started, completed at labor_minutes=30; a second visit started, completed at labor_minutes=31."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Nu", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { v1: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-10T09:00:00Z", scheduled_end: "2026-02-10T10:00:00Z", expected_system_version: "${v1}" }
              as: Dispatcher
              captures: { visit_a: $.data.id }
            - call: "GET /aquatics/systems/${system_id}"
              payload: {}
              as: AccountManager
              captures: { v_after_a: $.data.version }
            - call: "POST /aquatics/visits/${visit_a}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${visit_a}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { total_a: $.data.total_cents }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-11T09:00:00Z", scheduled_end: "2026-02-11T10:00:00Z", expected_system_version: "${v_after_a}" }
              as: Dispatcher
              captures: { visit_b: $.data.id }
            - call: "POST /aquatics/visits/${visit_b}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${visit_b}/complete"
              payload: { labor_minutes: 31 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { total_b: $.data.total_cents }
          assert:
            - "ServiceVisit.${visit_a}.total_cents == 6000 (labor 30 == included, 0 blocks)"
            - "ServiceVisit.${visit_b}.total_cents == 8000 (labor 31 > included, 1 block)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_start_requires_system_active
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_IN_PROGRESS
          - entities.SystemProfile.fields.status
        distinguishing_aspect: |
          ServiceVisit's SCHEDULED -> IN_PROGRESS transition depends on SystemProfile.status ==
          ACTIVE (the Visit->System pair). Suspending the system (via contract suspend cascade)
          before start blocks the start with ERR_INVALID_STATE even though the visit itself is
          a valid SCHEDULED.
        test_recipe:
          setup:
            - "ACTIVE contract; ACTIVE system; tech; a SCHEDULED visit; then the contract is suspended (account_balance>0) which cascades the system to SUSPENDED."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Xi", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { system_v: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-12T09:00:00Z", scheduled_end: "2026-02-12T10:00:00Z", expected_system_version: "${system_v}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /aquatics/emergencies"
              payload: { system_id: "${system_id}", severity: "LOW", reported_at: "2026-02-12T08:00:00Z", trip_fee_cents: 1000 }
              as: AccountManager
              captures: { emergency_id: $.data.id }
            - call: "POST /aquatics/emergencies/${emergency_id}/dispatch"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-02-12T11:00:00Z", scheduled_end: "2026-02-12T12:00:00Z" }
              as: Dispatcher
              captures: { em_visit: $.data.dispatched_visit_id }
            - call: "POST /aquatics/visits/${em_visit}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${em_visit}/complete"
