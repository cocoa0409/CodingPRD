  - method: GET
    path: "/api/service-tickets"
    description: "List service tickets"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "fire_status?", "allergen_review_status?", "limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []
  - method: GET
    path: "/api/service-tickets/{id}"
    description: "Get a service ticket"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: POST
    path: "/api/service-tickets/{id}/fire"
    description: "OPEN -> FIRED (allergen gate enforced)"
    roles: [LineCook]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: POST
    path: "/api/service-tickets/{id}/mark-ready"
    description: "FIRED -> READY; draws down PREPPED batches FIFO by expires_at ASC, created_at ASC"
    roles: [LineCook]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["station batch draw-down per components; DEPLETED cascades"]
  - method: POST
    path: "/api/service-tickets/{id}/serve"
    description: "READY -> SERVED"
    roles: [LineCook]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: POST
    path: "/api/service-tickets/{id}/void"
    description: "OPEN/FIRED/READY -> VOIDED"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: POST
    path: "/api/service-tickets/{id}/recall"
    description: "READY -> FIRED (recall loop; recall_count += 1)"
    roles: [LineCook]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["recall_count += 1"]
  - method: POST
    path: "/api/service-tickets/{id}/clear-allergen-review"
    description: "allergen_review_status PENDING -> CLEARED (fire_status unchanged)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["allergen_review_status -> CLEARED"]

