  - name: calc_overtime_iso_week_reset
    claim_type: correct_result
    grounds:
    - calculations.work_order_labor_cost
    distinguishing_aspect: 'The overtime accumulator is scoped to the ISO week of completed_at: a completion on Monday 2026-08-10 (next ISO week) restarts at cumulative_week_minutes_before == 0, so an identical
      120-minute stop bills 12000c again — the week boundary, not route or pole identity, resets the threshold.'
    test_recipe:
      setup:
      - Crew completed one COMPLEX stop in ISO week 2026-W32 (2026-08-03); second route window 2026-08-10 (W33) with one COMPLEX stop; clock 2026-08-10T09:00:00Z
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
