# =============================================================================
# task_2347 — Foreign Supplier Verification Program (food importer compliance office)
# Seed tables §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#                        Corner design    → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2347. Foreign Supplier Verification Program (food importer compliance office): supplier and food
  identification with hazard analysis for each food and foreign supplier combination, evaluation of
  supplier performance history, regulatory compliance status and hazard controls, verification activity
  selection across onsite audits, sampling and testing, and records review with frequency justification,
  qualified individual designation and program documentation requirements, corrective action when a
  supplier fails verification with import suspension decisions, importer identification submission at
  entry with unique identifiers, records retention, availability for inspection and reassessment
  triggers, exemptions and modified requirements analysis

domain_name: foreign-supplier-verification
api_prefix: /fsvp

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags

  entity_topology: graph
  # ForeignSupplier × Food form a many-to-many association through SupplierFoodPair (the FSVP unit of
  # compliance); HazardAnalysis/VerificationActivity/EntrySubmission hang off the association, and
  # QualifiedIndividual is referenced from four different aggregates (cross_aggregate edges).

  state_machine_shape: parallel
  # SupplierFoodPair carries THREE independent state dimensions on one row
  # (verification_status × entry_eligibility_status × exemption_status). Additionally:
  # VerificationActivity is cyclic (PROPOSED ↔ CHANGES_REQUESTED), QualifiedIndividual is cyclic
  # (ACTIVE ↔ LAPSED), CorrectiveAction is branching fork-join (OPEN → {SUPPLIER_REMEDIATION,
  # IMPORT_SUSPENSION} → CLOSED_RESOLVED), EntrySubmission is cyclic (ACCEPTED ↔ HELD).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The QI who proposes a verification activity may not review it; the QI who submits a verification
  # record may not attest it; regulatory compliance-status updates and import-suspension decisions are
  # reserved to the ComplianceOfficer, never to the QI who authored the technical judgement.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the Expert band of §0.4 (11 entities / 43 endpoints / 10 state machines /
  # 47 validation rows): the scenario carries four regulated workflows (hazard analysis, verification
  # selection, corrective action, entry submission) plus an exemption regime that conditionally
  # rewires the other four. Density, not padding: every entity participates in at least one cascade
  # and at least one cross-entity precondition.

# =============================================================================
# Table 0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Importer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the FSVP importer" }
      - { name: dnb_number, type: string, source: input, description: "Dun & Bradstreet DUNS number used as the importer identifier at entry", constraints: "exactly 9 ASCII digits; globally unique across Importer" }
      - { name: unique_facility_identifier, type: string, source: input, description: "Unique Facility Identifier (UFI) transmitted at entry", constraints: "1..32 chars; globally unique across Importer" }
      - { name: small_importer_flag, type: boolean, source: input, default: false, description: "True when the importer qualifies as a very small importer eligible for modified requirements" }
      - { name: record_retention_months, type: integer, source: input, default: 24, description: "Retention period applied to VerificationRecord.retained_until", constraints: "24..120" }
      - { name: blocked_pair_count, type: integer, source: computed, default: 0, description: "COUNT(SupplierFoodPair WHERE importer_id = this.id AND entry_eligibility_status = 'BLOCKED'); conserved quantity of compensating_invariant/blocked_pair_count_conservation" }
      - { name: open_corrective_action_count, type: integer, source: computed, default: 0, description: "COUNT(CorrectiveAction WHERE supplier.importer_id = this.id AND status IN {OPEN, SUPPLIER_REMEDIATION, IMPORT_SUSPENSION})" }
      - { name: qualified_individual_designated, type: boolean, source: computed, default: false, description: "True iff EXISTS QualifiedIndividual WHERE importer_id = this.id AND status = 'ACTIVE' AND training_valid_until >= clock_now" }
      - { name: program_status, type: enum, source: computed, description: "COMPLIANT | AT_RISK | NON_COMPLIANT — see calculations.importer_program_status", constraints: "COMPLIANT | AT_RISK | NON_COMPLIANT" }

  - name: QualifiedIndividual
    parent: Importer
    common_fields: true
    fields:
      - { name: importer_id, type: string, source: input, description: "FK -> Importer.id; the compliance office that designated this individual" }
      - { name: full_name, type: string, source: input, description: "Legal name of the designated qualified individual" }
      - { name: email, type: string, source: input, description: "Contact email; unique per importer_id" }
      - { name: qualification_summary, type: string, source: input, description: "Free-text training/experience record required by the program documentation rule", constraints: "min length 20" }
      - { name: training_completed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the individual completed FSVP/PCQI training" }
      - { name: training_valid_until, type: datetime, source: computed, description: "= training_completed_at + 36 calendar months" }
      - { name: concurrent_activity_capacity, type: integer, source: input, default: 2, description: "Maximum number of already-assigned VerificationActivity windows that may overlap a new assignment window", constraints: "1..6" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ACTIVE ↔ LAPSED → REVOKED", constraints: "PROPOSED | ACTIVE | LAPSED | REVOKED" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "COUNT(VerificationActivity WHERE assigned_qi_id = this.id AND status IN {PROPOSED, CHANGES_REQUESTED, APPROVED})" }

  - name: ForeignSupplier
    parent: Importer
    common_fields: true
    fields:
      - { name: importer_id, type: string, source: input, description: "FK -> Importer.id" }
      - { name: name, type: string, source: input, description: "Foreign supplier establishment name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the establishment", constraints: "exactly 2 uppercase letters" }
      - { name: facility_registration_number, type: string, source: input, description: "Food facility registration number", constraints: "unique per importer_id" }
      - { name: regulatory_compliance_status, type: enum, source: input, default: NO_ADVERSE_FINDINGS, description: "Latest FDA compliance posture of the establishment; drives calculations.pair_composite_hazard_risk supplier_penalty", constraints: "NO_ADVERSE_FINDINGS | WARNING_LETTER | IMPORT_ALERT | REGISTRATION_SUSPENDED" }
      - { name: compliance_status_source_reference, type: string, source: system, description: "Citation recorded by the last compliance-status update" }
      - { name: performance_score_provisional, type: number, source: computed, default: 100.00, description: "Variant PROVISIONAL of calculations.supplier_performance_score (records with record_status IN {RECEIVED, ATTESTED}); 2 decimals" }
      - { name: performance_score_final, type: number, source: computed, default: 100.00, description: "Variant FINAL of calculations.supplier_performance_score (record_status = ATTESTED only); the only variant that may suspend a supplier; 2 decimals" }
      - { name: performance_sample_weight_total, type: number, source: computed, default: 0.00, description: "Denominator of the FINAL variant = round_half_up(SUM(weight(R)) for ATTESTED records, 2); conserved quantity of compensating_invariant/performance_weight_conservation" }
      - { name: status, type: enum, source: system, description: "UNEVALUATED → APPROVED | CONDITIONALLY_APPROVED → SUSPENDED_PENDING_REVIEW → APPROVED | CONDITIONALLY_APPROVED, → DISQUALIFIED", constraints: "UNEVALUATED | APPROVED | CONDITIONALLY_APPROVED | SUSPENDED_PENDING_REVIEW | DISQUALIFIED" }
      - { name: last_evaluated_at, type: datetime, source: system, description: "Logical-clock instant of the last POST /fsvp/foreign-suppliers/{id}/evaluation" }
      - { name: open_corrective_action_count, type: integer, source: computed, default: 0, description: "COUNT(CorrectiveAction WHERE supplier_id = this.id AND status IN {OPEN, SUPPLIER_REMEDIATION, IMPORT_SUSPENSION})" }

  - name: Food
    parent: Importer
    common_fields: false
    fields:
      - { name: importer_id, type: string, source: input, description: "FK -> Importer.id" }
      - { name: food_name, type: string, source: input, description: "Food description as it appears on the entry line" }
      - { name: fda_product_code, type: string, source: input, description: "FDA product code for the food", constraints: "3..16 chars" }
      - { name: is_raw_agricultural_commodity, type: boolean, source: input, description: "True for a RAC; grants rac_relief = 0.85 to non-biological hazards" }
      - { name: intended_consumer_group, type: enum, source: input, description: "Selects exposure_multiplier in calculations.hazard_risk_score", constraints: "GENERAL | ELDERLY | IMMUNOCOMPROMISED | INFANT" }
      - { name: process_control_category, type: enum, source: input, default: NONE, description: "Regulatory process-control regime already covering this food; gates exemption_type applicability", constraints: "NONE | JUICE_HACCP | SEAFOOD_HACCP | LOW_ACID_CANNED | DIETARY_SUPPLEMENT | ALCOHOL_BEVERAGE" }
      - { name: ready_to_eat, type: boolean, source: input, default: false, description: "True when consumed without a kill step; grants rte_penalty = 1.15 to biological hazards" }

  - name: SupplierFoodPair
    parent: Importer
    common_fields: true
    fields:
      - { name: importer_id, type: string, source: input, description: "FK -> Importer.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> ForeignSupplier.id" }
      - { name: food_id, type: string, source: input, description: "FK -> Food.id; (supplier_id, food_id) is unique per importer_id" }
      - { name: designated_qi_id, type: string, source: input, description: "FK -> QualifiedIndividual.id; the only QI allowed to approve this pair's verification plan" }
      - { name: active_hazard_analysis_id, type: string, source: computed, description: "FK -> HazardAnalysis.id; the single APPROVED analysis whose hazards feed every calculation, null until first approval" }
      - { name: verification_status, type: enum, source: system, description: "Dimension 1: DRAFT → HAZARD_ANALYZED → VERIFICATION_APPROVED → {REASSESSMENT_REQUIRED, VERIFICATION_LAPSED} → VERIFICATION_APPROVED, → RETIRED", constraints: "DRAFT | HAZARD_ANALYZED | VERIFICATION_APPROVED | REASSESSMENT_REQUIRED | VERIFICATION_LAPSED | RETIRED" }
      - { name: entry_eligibility_status, type: enum, source: system, description: "Dimension 2: PENDING → ELIGIBLE ↔ BLOCKED", constraints: "PENDING | ELIGIBLE | BLOCKED" }
      - { name: exemption_status, type: enum, source: system, default: NONE, description: "Dimension 3: NONE → CLAIMED → {VERIFIED, REJECTED}; VERIFIED → REVOKED", constraints: "NONE | CLAIMED | VERIFIED | REJECTED | REVOKED" }
      - { name: exemption_type, type: enum, source: input, description: "Claimed exemption or modified-requirements basis; null while exemption_status = NONE", constraints: "JUICE_HACCP_CONTROL | SEAFOOD_HACCP_CONTROL | LOW_ACID_CANNED_MICROBIO | DIETARY_SUPPLEMENT_CGMP | ALCOHOL_BEVERAGE | RESEARCH_QUANTITY | US_CUSTOMER_WRITTEN_ASSURANCE | SMALL_IMPORTER_MODIFIED" }
      - { name: modified_requirements_only, type: boolean, source: computed, default: false, description: "True iff exemption_status = VERIFIED AND exemption_type IN {US_CUSTOMER_WRITTEN_ASSURANCE, SMALL_IMPORTER_MODIFIED}; lowers the adequacy floor from 60.00 to 30.00 and keeps supplier-approval gating in force" }
      - { name: hazard_analysis_count, type: integer, source: computed, default: 0, description: "COUNT(HazardAnalysis WHERE pair_id = this.id) — incremented by every analysis create, which is why the create bumps this row's version" }
      - { name: composite_hazard_risk, type: number, source: computed, default: 0.00, description: "Output of calculations.pair_composite_hazard_risk STEP 4; 2 decimals" }
      - { name: risk_tier, type: enum, source: computed, description: "Tier selected in calculations.pair_composite_hazard_risk STEP 2 from gross_risk, never re-derived from composite_hazard_risk", constraints: "LOW | MODERATE | HIGH" }
      - { name: required_annual_frequency, type: integer, source: computed, default: 0, description: "Output of calculations.pair_composite_hazard_risk STEP 5 (tier_frequency[risk_tier])" }
      - { name: required_coverage, type: number, source: computed, default: 0.00, description: "= round_half_up(composite_hazard_risk * 1.5, 2); denominator of both adequacy variants" }
      - { name: adequacy_score_planned, type: number, source: computed, default: 0.00, description: "Variant PLANNED of calculations.verification_adequacy_score (declared frequency_per_year); 2 decimals" }
      - { name: adequacy_score_realized, type: number, source: computed, default: 0.00, description: "Variant REALIZED of calculations.verification_adequacy_score (ATTESTED records in the trailing 365 days); 2 decimals" }
      - { name: uncontrolled_significant_hazard_count, type: integer, source: computed, default: 0, description: "COUNT(Hazard in active_hazard_analysis_id WHERE requires_control = true AND control_owner IN {FOREIGN_SUPPLIER, SUPPLIER_OF_SUPPLIER})" }
      - { name: last_reassessed_at, type: datetime, source: system, description: "Set to clock_now by verification-approval and by reassessment; null before first approval" }
      - { name: reassessment_due_at, type: datetime, source: computed, description: "= last_reassessed_at + 36 calendar months; null while last_reassessed_at is null" }

  - name: HazardAnalysis
    parent: SupplierFoodPair
    common_fields: true
    fields:
      - { name: pair_id, type: string, source: input, description: "FK -> SupplierFoodPair.id" }
      - { name: authored_by_qi_id, type: string, source: system, description: "FK -> QualifiedIndividual.id; copied from the X-User-ID of the creating QualifiedIndividual" }
      - { name: methodology_note, type: string, source: input, description: "Documented hazard-identification methodology; the 20-character minimum is enforced semantically by validation priority 42, not by the request-shape check" }
      - { name: pair_version_at_create, type: integer, source: system, description: "SupplierFoodPair.version observed by the accepted expected_pair_version at create time" }
      - { name: status, type: enum, source: system, description: "DRAFT → APPROVED → SUPERSEDED; DRAFT → WITHDRAWN", constraints: "DRAFT | APPROVED | SUPERSEDED | WITHDRAWN" }
      - { name: hazard_count, type: integer, source: computed, default: 0, description: "COUNT(Hazard WHERE hazard_analysis_id = this.id)" }
      - { name: significant_hazard_count, type: integer, source: computed, default: 0, description: "COUNT(Hazard WHERE hazard_analysis_id = this.id AND requires_control = true)" }
      - { name: risk_total, type: number, source: computed, default: 0.00, description: "Output of calculations.hazard_analysis_risk_total (round-per-hazard-then-sum, pinned); 2 decimals" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT → APPROVED transition" }

  - name: Hazard
    parent: HazardAnalysis
    common_fields: false
    fields:
      - { name: hazard_analysis_id, type: string, source: input, description: "FK -> HazardAnalysis.id" }
      - { name: hazard_type, type: enum, source: input, description: "Hazard family; BIOLOGICAL is the only family eligible for rte_penalty and is excluded from rac_relief", constraints: "BIOLOGICAL | CHEMICAL_INCL_RADIOLOGICAL | PHYSICAL" }
      - { name: hazard_name, type: string, source: input, description: "Named hazard (e.g. 'Salmonella spp.')" }
      - { name: severity, type: integer, source: input, description: "Severity of the health consequence; severity = 5 marks a SAHCODHA hazard", constraints: "1..5" }
      - { name: probability, type: integer, source: input, description: "Probability of occurrence absent control", constraints: "1..5" }
      - { name: control_owner, type: enum, source: input, description: "Entity applying the control; selects control_factor in calculations.hazard_risk_score", constraints: "FOREIGN_SUPPLIER | SUPPLIER_OF_SUPPLIER | IMPORTER | CUSTOMER_DOWNSTREAM" }
      - { name: risk_score, type: number, source: computed, description: "Output of calculations.hazard_risk_score; 2 decimals, clamped to [1.00, 25.00]" }
      - { name: requires_control, type: boolean, source: computed, description: "= (risk_score >= 12.00) — inclusive boundary" }

  - name: VerificationActivity
    parent: SupplierFoodPair
    common_fields: true
    fields:
      - { name: pair_id, type: string, source: input, description: "FK -> SupplierFoodPair.id" }
      - { name: proposed_by_qi_id, type: string, source: system, description: "FK -> QualifiedIndividual.id; X-User-ID of the creating QI" }
      - { name: assigned_qi_id, type: string, source: input, description: "FK -> QualifiedIndividual.id; the QI who will execute the activity inside [window_start, window_end)" }
      - { name: reviewed_by_qi_id, type: string, source: system, description: "FK -> QualifiedIndividual.id; X-User-ID of the last review decision, null while never reviewed" }
      - { name: activity_type, type: enum, source: input, description: "Selected verification activity; drives both type_weight tables", constraints: "ONSITE_AUDIT | SAMPLING_AND_TESTING | RECORDS_REVIEW | OTHER_SUPPLIER_EVALUATION" }
      - { name: frequency_per_year, type: integer, source: input, description: "Declared annual frequency; PLANNED adequacy input", constraints: "0..12" }
      - { name: justification_text, type: string, source: input, description: "Written frequency justification; shorter than 20 characters is rejected by validation priority 42, and shorter than 40 characters halves coverage_weight" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the planned execution window" }
      - { name: window_end, type: datetime, source: input, description: "EXCLUSIVE end of the planned execution window; QI capacity overlap uses half-open [start, end) semantics" }
      - { name: status, type: enum, source: system, description: "PROPOSED ↔ CHANGES_REQUESTED → APPROVED → CHANGES_REQUESTED (cascade), PROPOSED|CHANGES_REQUESTED → WITHDRAWN, APPROVED → RETIRED", constraints: "PROPOSED | CHANGES_REQUESTED | APPROVED | WITHDRAWN | RETIRED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of completed CHANGES_REQUESTED → PROPOSED loops" }
      - { name: coverage_weight, type: number, source: computed, default: 0.00, description: "Per-activity PLANNED contribution, rounded to 2 decimals BEFORE summation (see calculations.verification_adequacy_score)" }

  - name: VerificationRecord
    parent: VerificationActivity
    common_fields: true
    fields:
      - { name: activity_id, type: string, source: input, description: "FK -> VerificationActivity.id" }
      - { name: submitted_by_qi_id, type: string, source: system, description: "FK -> QualifiedIndividual.id; X-User-ID of the submitting QI" }
      - { name: attested_by_qi_id, type: string, source: system, description: "FK -> QualifiedIndividual.id; X-User-ID of the attesting QI, null until ATTESTED" }
      - { name: outcome, type: enum, source: input, description: "Verification outcome; selects outcome_points", constraints: "PASS | PASS_WITH_FINDINGS | FAIL" }
      - { name: performed_start, type: datetime, source: input, description: "Inclusive start of the performed window" }
      - { name: performed_end, type: datetime, source: input, description: "INCLUSIVE end of the performed window; onsite-audit separation uses closed [start, end] plus a 30-day cool-off" }
      - { name: findings_count, type: integer, source: input, default: 0, description: "Number of documented findings; each costs 5 points up to a 20-point cap", constraints: "0..50" }
      - { name: document_reference, type: string, source: input, description: "Retained document locator satisfying the records-availability requirement", constraints: "min length 4" }
      - { name: record_status, type: enum, source: system, description: "RECEIVED → ATTESTED → RESCINDED; RECEIVED → RESCINDED", constraints: "RECEIVED | ATTESTED | RESCINDED" }
      - { name: weight, type: number, source: computed, default: 0.00, description: "= round_half_up(record_type_weight * recency_factor, 2) per calculations.supplier_performance_score" }
      - { name: record_points, type: number, source: computed, default: 0.00, description: "= round_half_up(max(0.00, outcome_points - findings_penalty), 2)" }
      - { name: retained_until, type: datetime, source: computed, description: "= performed_end + Importer.record_retention_months calendar months" }
      - { name: available_for_inspection, type: boolean, source: computed, description: "= record_status IN {RECEIVED, ATTESTED} AND as_of <= retained_until (inclusive)" }

  - name: CorrectiveAction
    parent: ForeignSupplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> ForeignSupplier.id" }
      - { name: pair_id, type: string, source: system, description: "FK -> SupplierFoodPair.id; the pair whose verification lapsed when this action was synthesized" }
      - { name: trigger_reason, type: enum, source: system, description: "Why the action opened", constraints: "PERFORMANCE_SCORE_BREACH | REGULATORY_IMPORT_ALERT | ADEQUACY_SHORTFALL" }
      - { name: status, type: enum, source: system, description: "OPEN → {SUPPLIER_REMEDIATION, IMPORT_SUSPENSION} → {CLOSED_RESOLVED, CLOSED_SUPPLIER_DISQUALIFIED}", constraints: "OPEN | SUPPLIER_REMEDIATION | IMPORT_SUSPENSION | CLOSED_RESOLVED | CLOSED_SUPPLIER_DISQUALIFIED" }
      - { name: decision, type: enum, source: system, description: "Recorded branch decision, null while OPEN", constraints: "SUPPLIER_REMEDIATION | IMPORT_SUSPENSION" }
      - { name: rationale, type: string, source: system, description: "Decision rationale text supplied by the ComplianceOfficer" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the branch decision; reverification records must be performed strictly after it" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant of closure" }
      - { name: pre_action_blocked_pair_count, type: integer, source: system, description: "Importer.blocked_pair_count snapshotted immediately BEFORE the cascade that synthesized this action; closure must restore it exactly" }
      - { name: supplier_version_at_decision, type: integer, source: system, description: "ForeignSupplier.version observed by the accepted expected_supplier_version at decision time" }

  - name: EntrySubmission
    parent: SupplierFoodPair
    common_fields: true
    fields:
      - { name: pair_id, type: string, source: input, description: "FK -> SupplierFoodPair.id" }
      - { name: entry_number, type: string, source: input, description: "CBP entry number", constraints: "min length 6" }
      - { name: entry_line_number, type: integer, source: input, description: "Line number within the entry; (entry_number, entry_line_number) unique globally", constraints: "1..999" }
      - { name: dnb_number_submitted, type: string, source: input, description: "DUNS transmitted at entry; must equal Importer.dnb_number" }
      - { name: ufi_submitted, type: string, source: input, description: "UFI transmitted at entry; must equal Importer.unique_facility_identifier" }
      - { name: arrival_date, type: datetime, source: input, description: "Declared arrival instant of the shipment" }
      - { name: identifier_match, type: boolean, source: computed, description: "= (dnb_number_submitted == Importer.dnb_number AND ufi_submitted == Importer.unique_facility_identifier)" }
      - { name: filed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the EntryFiler that filed the line (never compared to any entity id)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → ACCEPTED ↔ HELD; HELD → REJECTED", constraints: "SUBMITTED | ACCEPTED | HELD | REJECTED" }
      - { name: held_reason, type: enum, source: system, description: "Why the line is held, null unless status = HELD", constraints: "PAIR_BLOCKED | SUPPLIER_DISQUALIFIED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: QualifiedIndividual
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = DESIGNATE"
        actor: ComplianceOfficer
        preconditions:
          - "qi.training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
        side_effects:
          - "Importer.qualified_individual_designated recomputed; Importer.program_status recomputed (calculations.importer_program_status)"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = LAPSE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Importer.qualified_individual_designated recomputed; Importer.program_status recomputed"
        note: "Lapse does NOT touch the VerificationActivity rows already assigned to this QI; those keep status APPROVED and only new operations are gated."
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = RENEW_TRAINING (training_completed_at required)"
        actor: ComplianceOfficer
        preconditions:
          - "body training_completed_at <= clock_now (ERR_INVALID_REQUEST)"
          - "training_completed_at + 36 months >= clock_now (ERR_QI_DESIGNATION_INVALID)"
        side_effects:
          - "training_completed_at overwritten; training_valid_until recomputed"
          - "Importer.qualified_individual_designated recomputed; Importer.program_status recomputed"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = RENEW_TRAINING"
        actor: ComplianceOfficer
        preconditions:
          - "body training_completed_at <= clock_now (ERR_INVALID_REQUEST)"
        side_effects:
          - "training_completed_at overwritten; training_valid_until recomputed"
        note: "Self-loop: renewing before lapse is permitted and only moves the expiry forward."
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = REVOKE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Importer.program_status recomputed"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = REVOKE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Importer.qualified_individual_designated recomputed; Importer.program_status recomputed"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /fsvp/qualified-individuals/{id}/designation with action = REVOKE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Importer.program_status recomputed"]

  - entity: ForeignSupplier
    initial_state: UNEVALUATED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNEVALUATED
        to: APPROVED
        trigger: "POST /fsvp/foreign-suppliers/{id}/evaluation with decision = APPROVE"
        actor: QualifiedIndividual
        preconditions:
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
          - "supplier.regulatory_compliance_status = NO_ADVERSE_FINDINGS (ERR_COMPLIANCE_STATUS_BLOCKS_APPROVAL)"
        side_effects:
          - "last_evaluated_at = clock_now"
          - "performance_score_provisional and performance_score_final recomputed (both 100.00 when no records exist)"
      - from: UNEVALUATED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /fsvp/foreign-suppliers/{id}/evaluation with decision = APPROVE_CONDITIONALLY"
        actor: QualifiedIndividual
        preconditions:
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
          - "supplier.regulatory_compliance_status IN {NO_ADVERSE_FINDINGS, WARNING_LETTER} (ERR_COMPLIANCE_STATUS_BLOCKS_APPROVAL)"
        side_effects: ["last_evaluated_at = clock_now"]
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /fsvp/foreign-suppliers/{id}/evaluation with decision = APPROVE"
        actor: QualifiedIndividual
        preconditions:
          - "supplier.regulatory_compliance_status = NO_ADVERSE_FINDINGS (ERR_COMPLIANCE_STATUS_BLOCKS_APPROVAL)"
        side_effects: ["last_evaluated_at = clock_now"]
      - from: APPROVED
        to: SUSPENDED_PENDING_REVIEW
        trigger: "system — cascade hop 2 of transitive_cascade/fail_attestation_suspension_chain, fired when performance_score_final drops below 60.00 during POST /fsvp/verification-records/{id}/attestation"
        actor: system
        preconditions:
          - "performance_score_final < 60.00 strictly (exactly 60.00 does NOT suspend)"
        side_effects:
          - "HOP 3 — because the supplier entered SUSPENDED_PENDING_REVIEW: every SupplierFoodPair of this supplier whose verification_status = VERIFICATION_APPROVED transitions to VERIFICATION_LAPSED, and one CorrectiveAction row is synthesized per lapsed pair with status OPEN, trigger_reason PERFORMANCE_SCORE_BREACH, pair_id set, and pre_action_blocked_pair_count = Importer.blocked_pair_count as read BEFORE this cascade began"
          - "supplier.open_corrective_action_count recomputed"
      - from: CONDITIONALLY_APPROVED
        to: SUSPENDED_PENDING_REVIEW
        trigger: "system — same cascade hop as above when the supplier was only conditionally approved"
        actor: system
        preconditions: ["performance_score_final < 60.00 strictly"]
        side_effects:
          - "identical HOP 3 side-effect set as the APPROVED → SUSPENDED_PENDING_REVIEW transition"
      - from: SUSPENDED_PENDING_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/decision with decision = SUPPLIER_REMEDIATION"
        actor: system
        preconditions: []
        side_effects:
          - "each SupplierFoodPair of this supplier with verification_status = VERIFICATION_LAPSED moves to REASSESSMENT_REQUIRED; entry_eligibility_status is left untouched by this branch"
      - from: SUSPENDED_PENDING_REVIEW
        to: APPROVED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: ["the closing CorrectiveAction is the last non-closed action on this supplier"]
        side_effects:
          - "see CorrectiveAction closure transition for the full compensating chain"
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: ["the closing CorrectiveAction is the last non-closed action on this supplier"]
        side_effects: ["see CorrectiveAction closure transition"]
      - from: SUSPENDED_PENDING_REVIEW
        to: DISQUALIFIED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_DISQUALIFY"
        actor: system
        preconditions: []
        side_effects:
          - "every SupplierFoodPair of this supplier moves verification_status → RETIRED and entry_eligibility_status → BLOCKED"
          - "every EntrySubmission of those pairs with status IN {SUBMITTED, ACCEPTED, HELD} moves to REJECTED with held_reason SUPPLIER_DISQUALIFIED"
          - "Importer.blocked_pair_count and Importer.program_status recomputed"

  - entity: SupplierFoodPair
    dimension: verification_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: HAZARD_ANALYZED
        trigger: "POST /fsvp/hazard-analyses/{id}/approval"
        actor: QualifiedIndividual
        preconditions:
          - "analysis.status = DRAFT AND analysis.hazard_count >= 1 (ERR_HAZARD_ANALYSIS_EMPTY)"
        side_effects:
          - "pair.active_hazard_analysis_id = analysis.id; any previously APPROVED analysis on this pair moves to SUPERSEDED"
          - "pair.uncontrolled_significant_hazard_count, composite_hazard_risk, risk_tier, required_annual_frequency, required_coverage, adequacy_score_planned, adequacy_score_realized all recomputed"
      - from: HAZARD_ANALYZED
        to: HAZARD_ANALYZED
        trigger: "POST /fsvp/hazard-analyses/{id}/approval for a newer analysis"
        actor: QualifiedIndividual
        preconditions: ["analysis.status = DRAFT AND analysis.hazard_count >= 1"]
        side_effects: ["same recompute set; prior APPROVED analysis → SUPERSEDED"]
      - from: HAZARD_ANALYZED
        to: VERIFICATION_APPROVED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"
        actor: QualifiedIndividual
        preconditions:
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID, priority 26 — evaluated BEFORE the designation-match check)"
          - "acting X-User-ID = pair.designated_qi_id (ERR_QI_NOT_DESIGNATED_FOR_PAIR, priority 48)"
          - "supplier.status IN {APPROVED, CONDITIONALLY_APPROVED} (ERR_SUPPLIER_NOT_APPROVED)"
          - "pair.active_hazard_analysis_id IS NOT NULL (ERR_HAZARD_ANALYSIS_REQUIRED)"
          - "at least one VerificationActivity on this pair with status = APPROVED (ERR_NO_VERIFICATION_ACTIVITY)"
          - "if any Hazard of the active analysis has severity = 5 AND requires_control = true AND control_owner = FOREIGN_SUPPLIER, then an APPROVED ONSITE_AUDIT activity with frequency_per_year >= 1 must exist (ERR_ONSITE_AUDIT_REQUIRED)"
          - "SUM(frequency_per_year of APPROVED activities) >= pair.required_annual_frequency (ERR_FREQUENCY_BELOW_REQUIRED)"
          - "pair.adequacy_score_planned >= (30.00 if pair.modified_requirements_only else 60.00) (ERR_ADEQUACY_BELOW_FLOOR)"
          - "pair.reassessment_due_at IS NULL OR pair.reassessment_due_at >= clock_now (ERR_REASSESSMENT_OVERDUE)"
        side_effects:
          - "pair.last_reassessed_at = clock_now; reassessment_due_at recomputed"
          - "entry_eligibility_status: PENDING → ELIGIBLE (dimension 2 transition)"
          - "Importer.program_status recomputed"
      - from: VERIFICATION_APPROVED
        to: REASSESSMENT_REQUIRED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/reassessment"
        actor: QualifiedIndividual | ComplianceOfficer
        preconditions: []
        side_effects:
          - "pair.last_reassessed_at = clock_now; reassessment_due_at recomputed"
          - "entry_eligibility_status deliberately unchanged — dimension 2 does not follow dimension 1 for a voluntary reassessment"
          - "Importer.program_status recomputed (AT_RISK while any pair is REASSESSMENT_REQUIRED)"
      - from: VERIFICATION_APPROVED
        to: REASSESSMENT_REQUIRED
        trigger: "system — cascade hop 2 of transitive_cascade/import_alert_replanning_chain, fired when PATCH /fsvp/foreign-suppliers/{id}/compliance-status raises the supplier penalty"
        actor: system
        preconditions:
          - "after the hop-1 recompute either SUM(frequency_per_year of APPROVED activities) < pair.required_annual_frequency OR pair.adequacy_score_planned < the pair's adequacy floor"
        side_effects:
          - "HOP 3 — because this pair entered REASSESSMENT_REQUIRED: every VerificationActivity on it with status = APPROVED moves to CHANGES_REQUESTED (the plan must be re-justified against the new frequency), and pair.adequacy_score_planned is recomputed from the now-empty APPROVED set to 0.00"
          - "Importer.program_status recomputed to AT_RISK"
      - from: VERIFICATION_APPROVED
        to: VERIFICATION_LAPSED
        trigger: "system — cascade hop 3 of transitive_cascade/fail_attestation_suspension_chain (supplier entered SUSPENDED_PENDING_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP 4 — because this pair's verification_status became VERIFICATION_LAPSED: entry_eligibility_status ELIGIBLE → BLOCKED"
          - "one CorrectiveAction row is synthesized for this pair (status OPEN, trigger_reason PERFORMANCE_SCORE_BREACH)"
      - from: REASSESSMENT_REQUIRED
        to: VERIFICATION_APPROVED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"
        actor: QualifiedIndividual
        preconditions: ["identical precondition list to HAZARD_ANALYZED → VERIFICATION_APPROVED"]
        side_effects: ["identical side-effect set; entry_eligibility_status BLOCKED is NOT cleared here — only CorrectiveAction closure clears a block"]
      - from: VERIFICATION_LAPSED
        to: REASSESSMENT_REQUIRED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/decision with decision = SUPPLIER_REMEDIATION"
        actor: system
        preconditions: []
        side_effects: ["Importer.program_status recomputed"]
      - from: VERIFICATION_LAPSED
        to: VERIFICATION_APPROVED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: []
        side_effects: ["see CorrectiveAction closure transition for the compensating chain"]
      - from: REASSESSMENT_REQUIRED
        to: VERIFICATION_APPROVED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: []
        side_effects: ["see CorrectiveAction closure transition"]
      - from: VERIFICATION_LAPSED
        to: RETIRED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_DISQUALIFY"
        actor: system
        preconditions: []
        side_effects: ["entry_eligibility_status → BLOCKED (a RETIRED pair is permanently ineligible)"]
      - from: REASSESSMENT_REQUIRED
        to: RETIRED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_DISQUALIFY"
        actor: system
        preconditions: []
        side_effects: ["entry_eligibility_status → BLOCKED"]

  - entity: SupplierFoodPair
    dimension: entry_eligibility_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system — side effect of POST /fsvp/supplier-food-pairs/{id}/verification-approval"
        actor: system
        preconditions: ["dimension 1 reached VERIFICATION_APPROVED in the same request"]
        side_effects: ["Importer.program_status recomputed"]
      - from: PENDING
        to: ELIGIBLE
        trigger: "system — side effect of POST /fsvp/supplier-food-pairs/{id}/exemption with action = VERIFY"
        actor: system
        preconditions: ["exemption_status became VERIFIED in the same request"]
        side_effects:
          - "dimension 1 (verification_status) is deliberately left at DRAFT — a verified exemption makes the pair entry-eligible without any hazard analysis or verification plan"
      - from: ELIGIBLE
        to: BLOCKED
        trigger: "system — cascade hop 4 of transitive_cascade/fail_attestation_suspension_chain (this pair's verification_status became VERIFICATION_LAPSED)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP 5 — because this pair's entry_eligibility_status became BLOCKED: every EntrySubmission on it with status IN {SUBMITTED, ACCEPTED} moves to HELD with held_reason PAIR_BLOCKED"
          - "HOP 6 — because the pair is now BLOCKED: Importer.blocked_pair_count is incremented and Importer.program_status recomputed to NON_COMPLIANT"
      - from: ELIGIBLE
        to: BLOCKED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/decision with decision = IMPORT_SUSPENSION, applied to EVERY pair of the supplier"
        actor: system
        preconditions: []
        side_effects:
          - "every EntrySubmission on the pair with status IN {SUBMITTED, ACCEPTED} moves to HELD with held_reason PAIR_BLOCKED"
          - "Importer.blocked_pair_count and Importer.program_status recomputed"
      - from: ELIGIBLE
        to: BLOCKED
        trigger: "system — side effect of POST /fsvp/supplier-food-pairs/{id}/exemption with action = REVOKE on a pair whose eligibility came from the exemption"
        actor: system
        preconditions: ["pair.verification_status != VERIFICATION_APPROVED (the pair has no independent basis for eligibility)"]
        side_effects:
          - "every EntrySubmission on the pair with status IN {SUBMITTED, ACCEPTED} moves to HELD with held_reason PAIR_BLOCKED"
          - "Importer.blocked_pair_count and Importer.program_status recomputed"
      - from: BLOCKED
        to: ELIGIBLE
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: ["pair.verification_status becomes VERIFICATION_APPROVED in the same request"]
        side_effects:
          - "every EntrySubmission on the pair with status = HELD moves back to ACCEPTED and held_reason is cleared to null"
          - "Importer.blocked_pair_count restored to CorrectiveAction.pre_action_blocked_pair_count; Importer.program_status recomputed"

  - entity: SupplierFoodPair
    dimension: exemption_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: CLAIMED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = CLAIM (exemption_type + basis_note required)"
        actor: QualifiedIndividual
        preconditions:
          - "exemption_type is applicable to the pair's food/importer per validations[priority=44] (ERR_EXEMPTION_NOT_APPLICABLE)"
          - "exemption_type = SMALL_IMPORTER_MODIFIED requires Importer.small_importer_flag = true (ERR_MODIFIED_REQUIREMENTS_NOT_AVAILABLE)"
        side_effects: ["pair.exemption_type recorded"]
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = VERIFY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "pair.modified_requirements_only recomputed (true only for US_CUSTOMER_WRITTEN_ASSURANCE and SMALL_IMPORTER_MODIFIED)"
          - "entry_eligibility_status PENDING → ELIGIBLE (dimension 2)"
          - "Importer.program_status recomputed"
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["entry_eligibility_status unchanged; the pair must reach eligibility through full verification"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = REVOKE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "pair.modified_requirements_only → false"
          - "HOP 2 — because the exemption no longer supports eligibility: entry_eligibility_status ELIGIBLE → BLOCKED when verification_status != VERIFICATION_APPROVED"
          - "HOP 3 — because the pair became BLOCKED: its SUBMITTED/ACCEPTED EntrySubmissions move to HELD (held_reason PAIR_BLOCKED) and Importer.blocked_pair_count / program_status are recomputed"
      - from: REJECTED
        to: CLAIMED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = CLAIM (new exemption_type)"
        actor: QualifiedIndividual
        preconditions: ["same applicability checks as NONE → CLAIMED"]
        side_effects: ["pair.exemption_type overwritten"]
      - from: REVOKED
        to: CLAIMED
        trigger: "POST /fsvp/supplier-food-pairs/{id}/exemption with action = CLAIM (new exemption_type)"
        actor: QualifiedIndividual
        preconditions: ["same applicability checks as NONE → CLAIMED"]
        side_effects: ["pair.exemption_type overwritten"]

  - entity: HazardAnalysis
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /fsvp/hazard-analyses/{id}/approval"
        actor: QualifiedIndividual
        preconditions:
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
          - "analysis.hazard_count >= 1 (ERR_HAZARD_ANALYSIS_EMPTY)"
        side_effects:
          - "approved_at = clock_now; risk_total recomputed"
          - "pair.active_hazard_analysis_id = this.id and pair.verification_status → HAZARD_ANALYZED (see SupplierFoodPair.verification_status)"
          - "the pair's previously APPROVED analysis, if any, moves to SUPERSEDED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a newer analysis on the same pair reached APPROVED"
        actor: system
        preconditions: []
        side_effects: ["no further hazards may be added; the row stays available for inspection"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system — POST /fsvp/hazard-analyses created a newer DRAFT analysis on the same pair (create-with-supersede)"
        actor: system
        preconditions: []
        side_effects: ["pair.hazard_analysis_count still counts the withdrawn row"]

  - entity: VerificationActivity
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, RETIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /fsvp/verification-activities/{id}/review with decision = APPROVE"
        actor: QualifiedIndividual
        preconditions:
          - "X-User-ID != activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
          - "pair.verification_status != RETIRED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reviewed_by_qi_id = X-User-ID; coverage_weight recomputed"
          - "pair.adequacy_score_planned and adequacy_score_realized recomputed"
      - from: PROPOSED
        to: CHANGES_REQUESTED
        trigger: "POST /fsvp/verification-activities/{id}/review with decision = REQUEST_CHANGES"
        actor: QualifiedIndividual
        preconditions:
          - "X-User-ID != activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["reviewed_by_qi_id = X-User-ID"]
      - from: CHANGES_REQUESTED
        to: PROPOSED
        trigger: "PATCH /fsvp/verification-activities/{id}"
        actor: QualifiedIndividual
        preconditions:
          - "X-User-ID = activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"
          - "if assigned_qi_id or window fields change, the QI capacity rule at validations[priority=40] re-runs"
        side_effects:
          - "revision_count incremented by 1 — this closes the CHANGES_REQUESTED → PROPOSED cycle"
          - "coverage_weight recomputed; pair.adequacy_score_planned recomputed"
      - from: PROPOSED
        to: PROPOSED
        trigger: "PATCH /fsvp/verification-activities/{id}"
        actor: QualifiedIndividual
        preconditions: ["X-User-ID = activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["fields overwritten; revision_count NOT incremented (no review loop was closed)"]
      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "system — cascade hop 3 of transitive_cascade/import_alert_replanning_chain (the parent pair entered REASSESSMENT_REQUIRED)"
        actor: system
        preconditions: []
        side_effects: ["pair.adequacy_score_planned recomputed over the remaining APPROVED activities"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /fsvp/verification-activities/{id}/review with decision = WITHDRAW"
        actor: QualifiedIndividual
        preconditions: ["X-User-ID != activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["assigned QI active_assignment_count recomputed"]
      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /fsvp/verification-activities/{id}/review with decision = WITHDRAW"
        actor: QualifiedIndividual
        preconditions: ["X-User-ID != activity.proposed_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["assigned QI active_assignment_count recomputed"]
      - from: APPROVED
        to: RETIRED
        trigger: "system — the parent pair reached verification_status RETIRED"
        actor: system
        preconditions: []
        side_effects: ["assigned QI active_assignment_count recomputed; no further records may be submitted"]

  - entity: VerificationRecord
    initial_state: RECEIVED
    terminal_states: [RESCINDED]
    transitions:
      - from: RECEIVED
        to: ATTESTED
        trigger: "POST /fsvp/verification-records/{id}/attestation"
        actor: QualifiedIndividual
        preconditions:
          - "acting QI status = ACTIVE AND training_valid_until >= clock_now (ERR_QI_DESIGNATION_INVALID)"
          - "X-User-ID != record.submitted_by_qi_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "HOP 1 — attested_by_qi_id set; supplier.performance_score_final and supplier.performance_sample_weight_total recomputed over ATTESTED records only"
          - "HOP 2 — because performance_score_final changed: pair.composite_hazard_risk / required_coverage / adequacy_score_planned / adequacy_score_realized recomputed for every pair of that supplier, and when performance_score_final < 60.00 the supplier transitions APPROVED|CONDITIONALLY_APPROVED → SUSPENDED_PENDING_REVIEW (see ForeignSupplier), which opens hops 3–6"
      - from: RECEIVED
        to: RESCINDED
        trigger: "POST /fsvp/verification-records/{id}/rescission"
        actor: QualifiedIndividual
        preconditions: []
        side_effects:
          - "supplier.performance_score_provisional recomputed; performance_score_final unchanged (the record was never in the FINAL input set)"
      - from: ATTESTED
        to: RESCINDED
        trigger: "POST /fsvp/verification-records/{id}/rescission"
        actor: QualifiedIndividual
        preconditions: []
        side_effects:
          - "compensating action: supplier.performance_sample_weight_total and performance_score_final recomputed with this record removed, restoring both to their pre-attestation values exactly (compensating_invariant/performance_weight_conservation)"
          - "pair.adequacy_score_realized recomputed for the record's pair"
          - "rescission NEVER reinstates a suspended supplier — reinstatement flows only through CorrectiveAction closure"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [CLOSED_RESOLVED, CLOSED_SUPPLIER_DISQUALIFIED]
    transitions:
      - from: OPEN
        to: SUPPLIER_REMEDIATION
        trigger: "POST /fsvp/corrective-actions/{id}/decision with decision = SUPPLIER_REMEDIATION"
        actor: ComplianceOfficer
        preconditions:
          - "expected_supplier_version = supplier.version (ERR_STALE_SUPPLIER_VERSION, 412)"
        side_effects:
          - "decision/decided_at/rationale recorded; supplier_version_at_decision recorded; supplier.version incremented by 1"
          - "BRANCH A side-effect set: supplier SUSPENDED_PENDING_REVIEW → CONDITIONALLY_APPROVED; the supplier's VERIFICATION_LAPSED pairs → REASSESSMENT_REQUIRED; entry_eligibility_status of every pair is left untouched, so Importer.blocked_pair_count does NOT move"
      - from: OPEN
        to: IMPORT_SUSPENSION
        trigger: "POST /fsvp/corrective-actions/{id}/decision with decision = IMPORT_SUSPENSION"
        actor: ComplianceOfficer
        preconditions:
          - "expected_supplier_version = supplier.version (ERR_STALE_SUPPLIER_VERSION, 412)"
        side_effects:
          - "decision/decided_at/rationale recorded; supplier_version_at_decision recorded; supplier.version incremented by 1"
          - "BRANCH B side-effect set: supplier stays SUSPENDED_PENDING_REVIEW; EVERY pair of the supplier with entry_eligibility_status = ELIGIBLE → BLOCKED; each newly blocked pair's SUBMITTED/ACCEPTED EntrySubmissions → HELD (held_reason PAIR_BLOCKED); Importer.blocked_pair_count and program_status recomputed"
      - from: SUPPLIER_REMEDIATION
        to: CLOSED_RESOLVED
        trigger: "POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: ComplianceOfficer
        preconditions:
          - "EXISTS VerificationRecord R on an activity of action.pair_id with R.record_status = ATTESTED AND R.outcome = PASS AND R.performed_end > action.decided_at (ERR_REVERIFICATION_MISSING)"
        side_effects:
          - "closed_at = clock_now; JOIN point — both branches converge here"
          - "action.pair_id verification_status {VERIFICATION_LAPSED, REASSESSMENT_REQUIRED} → VERIFICATION_APPROVED; last_reassessed_at = clock_now"
          - "action.pair_id entry_eligibility_status BLOCKED → ELIGIBLE and its HELD EntrySubmissions → ACCEPTED (held_reason cleared)"
          - "Importer.blocked_pair_count restored to pre_action_blocked_pair_count; supplier → APPROVED when this was the supplier's last non-closed action; Importer.program_status recomputed"
      - from: IMPORT_SUSPENSION
        to: CLOSED_RESOLVED
        trigger: "POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: ComplianceOfficer
        preconditions:
          - "EXISTS VerificationRecord R on an activity of action.pair_id with R.record_status = ATTESTED AND R.outcome = PASS AND R.performed_end > action.decided_at (ERR_REVERIFICATION_MISSING)"
        side_effects:
          - "identical compensating set to the SUPPLIER_REMEDIATION → CLOSED_RESOLVED transition, and additionally unblocks the pairs that BRANCH B blocked, so Importer.blocked_pair_count returns exactly to pre_action_blocked_pair_count"
      - from: IMPORT_SUSPENSION
        to: CLOSED_SUPPLIER_DISQUALIFIED
        trigger: "POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_DISQUALIFY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "closed_at = clock_now; supplier → DISQUALIFIED with its full cascade (pairs RETIRED + BLOCKED, entry lines REJECTED)"
      - from: SUPPLIER_REMEDIATION
        to: CLOSED_SUPPLIER_DISQUALIFIED
        trigger: "POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_DISQUALIFY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["same disqualification cascade as from IMPORT_SUSPENSION"]

  - entity: EntrySubmission
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system — same-request auto-transition inside POST /fsvp/entry-submissions once every validation passed"
        actor: system
        preconditions:
          - "identifier_match = true AND pair.entry_eligibility_status = ELIGIBLE"
        side_effects: ["the create response already carries status ACCEPTED"]
      - from: ACCEPTED
        to: HELD
        trigger: "system — the parent pair's entry_eligibility_status became BLOCKED (cascade hop 5, IMPORT_SUSPENSION branch, or exemption revocation)"
        actor: system
        preconditions: []
        side_effects: ["held_reason = PAIR_BLOCKED"]
      - from: SUBMITTED
        to: HELD
        trigger: "system — same triggers as ACCEPTED → HELD, for a line still in SUBMITTED"
        actor: system
        preconditions: []
        side_effects: ["held_reason = PAIR_BLOCKED"]
      - from: HELD
        to: ACCEPTED
        trigger: "system — side effect of POST /fsvp/corrective-actions/{id}/closure with action = CLOSE_RESOLVED"
        actor: system
        preconditions: ["the parent pair's entry_eligibility_status returned to ELIGIBLE in the same request"]
        side_effects: ["held_reason cleared to null"]
      - from: HELD
        to: REJECTED
        trigger: "system — the supplier reached DISQUALIFIED via closure action CLOSE_DISQUALIFY"
        actor: system
        preconditions: []
        side_effects: ["held_reason = SUPPLIER_DISQUALIFIED"]
      - from: ACCEPTED
        to: REJECTED
        trigger: "system — the supplier reached DISQUALIFIED via closure action CLOSE_DISQUALIFY"
        actor: system
        preconditions: []
        side_effects: ["held_reason = SUPPLIER_DISQUALIFIED"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: hazard-analysis-create-stale-pair
    parent_entity: SupplierFoodPair
    write_endpoint: "POST /fsvp/hazard-analyses"
    occ_field: "expected_pair_version"
    description: |
      Creating a HazardAnalysis against a SupplierFoodPair whose version has advanced since the client
      last observed it is rejected. A new analysis legitimately supersedes the pair's prior work (a prior
      DRAFT is withdrawn, and a prior APPROVED analysis is superseded once the new one is approved), so a
      second create is not blocked by any state precondition — the pair is still a valid target. The stale
      expected_pair_version is therefore the only signal that the author was reasoning about a hazard
      picture the pair no longer has.
    error_id: ERR_STALE_PAIR_VERSION
    http_status: 412

  - rule_id: corrective-action-decision-stale-supplier
    parent_entity: ForeignSupplier
    write_endpoint: "POST /fsvp/corrective-actions/{id}/decision"
    occ_field: "expected_supplier_version"
    description: |
      Recording an import-suspension or supplier-remediation decision against a ForeignSupplier whose
      version has advanced since the officer read it is rejected. One suspension cascade opens one
      CorrectiveAction per lapsed pair, and each decision legitimately rewrites the supplier's posture,
      so deciding a second OPEN action on the same supplier passes every state precondition — only the
      stale expected_supplier_version reveals that the officer's view of the supplier's status,
      performance score and block count predates the earlier decision.
    error_id: ERR_STALE_SUPPLIER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Table
# =============================================================================
calculations:
  - name: hazard_risk_score
    entity: Hazard
    algorithm_type: weighted_scoring
    trigger: "POST /fsvp/hazard-analyses/{id}/hazards (computed once at create, from the parent analysis's pair/food attributes)"
    formula: |
      raw = severity * probability
          * exposure_multiplier[food.intended_consumer_group]
          * rac_relief
          * rte_penalty
          * control_factor[hazard.control_owner]

      rac_relief  = 0.85 if (food.is_raw_agricultural_commodity = true AND hazard_type != 'BIOLOGICAL') else 1.00
      rte_penalty = 1.15 if (food.ready_to_eat = true AND hazard_type = 'BIOLOGICAL') else 1.00

      risk_score      = round_half_up(min(25.00, max(1.00, raw)), 2)
      requires_control = (risk_score >= 12.00)
    constants:
      exposure_multiplier: { GENERAL: 1.0, ELDERLY: 1.1, IMMUNOCOMPROMISED: 1.25, INFANT: 1.4 }
      control_factor: { FOREIGN_SUPPLIER: 1.00, SUPPLIER_OF_SUPPLIER: 1.10, IMPORTER: 0.70, CUSTOMER_DOWNSTREAM: 0.55 }
      significant_hazard_threshold: 12.00
      floor: 1.00
      cap: 25.00
    precision: "2 decimal places, ROUND_HALF_UP; clamp AFTER multiplication and BEFORE rounding"
    notes: |
      rac_relief and rte_penalty are mutually exclusive by construction only when the food is a RAC that is
      also ready-to-eat AND the hazard is biological — in that case rac_relief = 1.00 (the guard excludes
      BIOLOGICAL) and rte_penalty = 1.15, so the two factors never both apply. requires_control uses `>=`,
      so a score of exactly 12.00 IS a significant hazard requiring a control.

  - name: hazard_analysis_risk_total
    entity: HazardAnalysis
    algorithm_type: aggregation
    trigger: "recomputed on POST /fsvp/hazard-analyses/{id}/hazards and on approval"
    formula: |
      risk_total = round_half_up(SUM(h.risk_score for h in hazards of this analysis), 2)
      hazard_count = COUNT(hazards of this analysis)

      # ORDER IS PINNED: each Hazard.risk_score is rounded to 2dp at create time (see
      # hazard_risk_score) and the ALREADY-ROUNDED values are summed. Summing the unrounded raw
      # products and rounding once at the end is WRONG and produces a different total.
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP applied per-hazard first, then summed (round-then-sum)"

  - name: pair_composite_hazard_risk
    entity: SupplierFoodPair
    algorithm_type: threshold
    trigger: "recomputed on hazard-analysis approval, on PATCH /fsvp/foreign-suppliers/{id}/compliance-status, and whenever supplier.performance_score_final changes"
    formula: |
      STEP 1 — hazard load and gross risk:
        hazard_load = round_half_up(SUM(h.risk_score for h in hazards of pair.active_hazard_analysis_id
                                        WHERE h.requires_control = true), 2)
                      # 0.00 when active_hazard_analysis_id IS NULL
        gross = round_half_up(hazard_load + supplier_penalty[supplier.regulatory_compliance_status], 2)

      STEP 2 — risk_tier is derived from GROSS, never from the composite:
        risk_tier = 'HIGH'     if gross >= 40.00
                    'MODERATE' if gross >= 18.00
                    'LOW'      otherwise

      STEP 3 — performance relief, scaled by the FINAL performance variant:
        relief_base   = tier_relief[risk_tier]
        relief_factor = 1.0 if supplier.performance_score_final >= 85.00
                        0.5 if supplier.performance_score_final >= 70.00
                        0.0 otherwise
        relief = round_half_up(relief_base * relief_factor, 2)

      STEP 4 — composite:
        composite_hazard_risk = round_half_up(max(0.00, gross - relief), 2)

      STEP 5 — plan requirements read off the tier fixed in STEP 2 (NEVER re-derived from the composite):
        required_annual_frequency = tier_frequency[risk_tier]
        required_coverage         = round_half_up(composite_hazard_risk * 1.5, 2)
    constants:
      supplier_penalty: { NO_ADVERSE_FINDINGS: 0.00, WARNING_LETTER: 6.00, IMPORT_ALERT: 15.00, REGISTRATION_SUSPENDED: 25.00 }
      tier_boundaries: { HIGH: 40.00, MODERATE: 18.00 }
      tier_relief: { LOW: 0.00, MODERATE: 4.00, HIGH: 9.00 }
      tier_frequency: { LOW: 1, MODERATE: 2, HIGH: 4 }
      coverage_multiplier: 1.5
    precision: "2 decimal places, ROUND_HALF_UP at every STEP boundary; tier boundaries are inclusive (`>=`)"
    notes: |
      Only hazards with requires_control = true enter hazard_load, so a hazard that scored below 12.00
      contributes to HazardAnalysis.risk_total but NOT to the pair's composite risk. The STEP 2 → STEP 5
      ordering is the discriminator: relief can push the composite back under the tier boundary that
      produced it, and the frequency must still reflect the pre-relief tier.

  - name: verification_adequacy_score
    entity: SupplierFoodPair
    algorithm_type: weighted_scoring
    variants:
      - name: PLANNED
        input_set: "VerificationActivity rows on this pair with status = APPROVED"
        applied_when: "the pair is being verification-approved, or any activity's status/fields change; surfaced as pair.adequacy_score_planned"
      - name: REALIZED
        input_set: "VerificationActivity rows on this pair with status = APPROVED that have at least one VerificationRecord with record_status = ATTESTED"
        applied_when: "recomputed on record attestation and rescission; surfaced as pair.adequacy_score_realized"
    trigger: "activity review/patch/cascade, record attestation, record rescission, hazard-analysis approval, supplier compliance-status change"
    formula: |
      per activity a in the variant's input_set:
        justification_factor = 1.0 if len(a.justification_text) >= 40 else 0.5
        coverage_weight(a)   = round_half_up(type_weight[a.activity_type] * min(a.frequency_per_year, 4)
                                             * justification_factor, 2)

      adequacy_raw = SUM(coverage_weight(a) for a in input_set)      # round-then-sum: each
                                                                    # coverage_weight is already 2dp
      score = round_half_up(min(100.00, 100.00 * adequacy_raw / max(pair.required_coverage, 1.00)), 2)

      adequacy_floor = 30.00 if pair.modified_requirements_only = true else 60.00
    constants:
      type_weight: { ONSITE_AUDIT: 10.0, SAMPLING_AND_TESTING: 6.0, RECORDS_REVIEW: 3.0, OTHER_SUPPLIER_EVALUATION: 2.0 }
      frequency_cap: 4
      short_justification_chars: 40
      short_justification_factor: 0.5
      denominator_floor: 1.00
      adequacy_floor_standard: 60.00
      adequacy_floor_modified: 30.00
    precision: "2 decimal places, ROUND_HALF_UP per activity then once on the final score"
    notes: |
      The two variants share one formula and differ ONLY in input_set, so PLANNED >= REALIZED always.
      PLANNED gates verification approval (ERR_ADEQUACY_BELOW_FLOOR); REALIZED is reporting-only and never
      blocks a write. frequency_per_year above 4 is accepted as input but capped in the weight, so raising
      a frequency from 4 to 6 changes required-frequency arithmetic without changing the adequacy score.

  - name: supplier_performance_score
    entity: ForeignSupplier
    algorithm_type: weighted_scoring
    variants:
      - name: PROVISIONAL
        input_set: "VerificationRecord rows on this supplier's pairs with record_status IN {RECEIVED, ATTESTED}"
        applied_when: "surfaced as supplier.performance_score_provisional; recomputed on record submit, attest and rescind; NEVER gates a state transition"
      - name: FINAL
        input_set: "VerificationRecord rows on this supplier's pairs with record_status = ATTESTED"
        applied_when: "surfaced as supplier.performance_score_final; drives the suspension threshold and the pair_composite_hazard_risk relief factor"
    trigger: "POST /fsvp/verification-records, POST /fsvp/verification-records/{id}/attestation, POST /fsvp/verification-records/{id}/rescission"
    formula: |
      per record r in the variant's input_set:
        findings_penalty = min(20, 5 * r.findings_count)
        record_points    = round_half_up(max(0, outcome_points[r.outcome] - findings_penalty), 2)
        recency_factor   = 1.0 if (clock_now - r.performed_end) <= 365 days
                           0.5 if (clock_now - r.performed_end) <= 730 days
                           0.0 otherwise
        weight(r)        = round_half_up(record_type_weight[r.activity.activity_type] * recency_factor, 2)

      weight_total  = round_half_up(SUM(weight(r)), 2)
      weighted_sum  = round_half_up(SUM(record_points(r) * weight(r)), 2)

      score = 100.00                                   if weight_total = 0.00   # no evidence is not bad evidence
              round_half_up(weighted_sum / weight_total, 2)  otherwise

      performance_sample_weight_total = weight_total of the FINAL variant
    constants:
      outcome_points: { PASS: 100, PASS_WITH_FINDINGS: 75, FAIL: 20 }
      findings_penalty_per_finding: 5
      findings_penalty_cap: 20
      record_type_weight: { ONSITE_AUDIT: 3.0, SAMPLING_AND_TESTING: 2.0, RECORDS_REVIEW: 1.0, OTHER_SUPPLIER_EVALUATION: 0.5 }
      recency_full_days: 365
      recency_half_days: 730
      suspension_threshold: 60.00
    precision: "2 decimal places, ROUND_HALF_UP per record then once on the quotient"
    notes: |
      The suspension cascade fires only when the FINAL score is STRICTLY below 60.00; exactly 60.00 leaves
      the supplier approved. A record that is RECEIVED but not yet attested therefore moves the PROVISIONAL
      score (visible, advisory) without any state effect — attesting it is what can suspend the supplier.
      A record whose performed_end is more than 730 days before the clock has weight 0.00 and drops out of
      both variants entirely, which is how weight_total can return to 0.00 and the score to 100.00.

  - name: record_retention_and_availability
    entity: VerificationRecord
    algorithm_type: threshold
    trigger: "computed at POST /fsvp/verification-records; re-evaluated on every read and on GET /fsvp/importers/{id}/records-package"
    formula: |
      retained_until = performed_end + importer.record_retention_months calendar months

      as_of = body.as_of_iso8601 if supplied else clock_now
      available_for_inspection = (record_status != 'RESCINDED') AND (as_of <= retained_until)

      records-package aggregation for importer I, over every VerificationRecord reachable from I:
        retained_record_count         = COUNT(all records, whatever their status)
        available_for_inspection_count = COUNT(record_status != 'RESCINDED' AND as_of <= retained_until)
        expired_record_count           = COUNT(record_status != 'RESCINDED' AND as_of >  retained_until)
        rescinded_record_count         = COUNT(record_status = 'RESCINDED')
    constants:
      default_retention_months: 24
      reassessment_cycle_months: 36
    precision: "calendar-month arithmetic (clamp to last day of month on overflow); boundary is INCLUSIVE — as_of exactly equal to retained_until is still available"
    notes: |
      pair.reassessment_due_at = pair.last_reassessed_at + 36 calendar months, computed by the same
      calendar-month helper. A rescinded record is counted in retained_record_count but is neither
      available nor expired — the three status buckets are disjoint and only the first is a superset.

  - name: importer_program_status
    entity: Importer
    algorithm_type: threshold
    trigger: "recomputed as a side effect of every write that changes a QI designation, a pair status dimension, or a corrective action status"
    formula: |
      NON_COMPLIANT if blocked_pair_count > 0
                       OR qualified_individual_designated = false
                       OR EXISTS pair WHERE verification_status = 'VERIFICATION_LAPSED'
      AT_RISK       else if open_corrective_action_count > 0
                       OR EXISTS pair WHERE verification_status IN {'REASSESSMENT_REQUIRED'}
                       OR EXISTS pair WHERE reassessment_due_at IS NOT NULL AND reassessment_due_at < clock_now
      COMPLIANT     otherwise
    constants: {}
    precision: "n/a (enum)"
    notes: |
      Evaluated top-down and short-circuited: the NON_COMPLIANT clause wins over AT_RISK even when both
      hold. An importer with zero pairs and one ACTIVE QI is COMPLIANT; an importer with no ACTIVE QI is
      NON_COMPLIANT regardless of pair state, which is why a QI LAPSE alone flips the program status.

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule determines the response and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty, and X-User-Role header present with a value in the §1.7 role list"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body/query shape valid: required fields present, types correct, enums in range, integers within declared bounds, datetimes ISO 8601 UTC, string lengths within constraints, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "importer_id in path or body resolves to an Importer"
    error_id: ERR_IMPORTER_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/importers/{id}, GET /fsvp/importers/{id}/records-package, GET /fsvp/importers/{id}/qualified-individuals, GET /fsvp/importers/{id}/foreign-suppliers, GET /fsvp/importers/{id}/foods, POST /fsvp/qualified-individuals, POST /fsvp/foreign-suppliers, POST /fsvp/foods, POST /fsvp/supplier-food-pairs"

  - priority: 5
    category: existence
    check: "the {id} path segment, designated_qi_id or assigned_qi_id in body resolves to a QualifiedIndividual"
    error_id: ERR_QI_NOT_FOUND
    http_status: 404
    applies_to: "POST /fsvp/qualified-individuals/{id}/designation, POST /fsvp/supplier-food-pairs, POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}"

  - priority: 6
    category: existence
    check: "the {id} path segment or supplier_id in body resolves to a ForeignSupplier"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/foreign-suppliers/{id}, PATCH /fsvp/foreign-suppliers/{id}/compliance-status, POST /fsvp/foreign-suppliers/{id}/evaluation, POST /fsvp/supplier-food-pairs"

  - priority: 7
    category: existence
    check: "food_id in body resolves to a Food"
    error_id: ERR_FOOD_NOT_FOUND
    http_status: 404
    applies_to: "POST /fsvp/supplier-food-pairs"

  - priority: 8
    category: existence
    check: "the {id} path segment or pair_id in body resolves to a SupplierFoodPair"
    error_id: ERR_PAIR_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/supplier-food-pairs/{id}, POST /fsvp/supplier-food-pairs/{id}/verification-approval, POST /fsvp/supplier-food-pairs/{id}/reassessment, POST /fsvp/supplier-food-pairs/{id}/exemption, POST /fsvp/hazard-analyses, POST /fsvp/verification-activities, POST /fsvp/entry-submissions"

  - priority: 9
    category: existence
    check: "the {id} path segment resolves to a HazardAnalysis"
    error_id: ERR_HAZARD_ANALYSIS_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/hazard-analyses/{id}, POST /fsvp/hazard-analyses/{id}/approval, POST /fsvp/hazard-analyses/{id}/hazards, GET /fsvp/hazard-analyses/{id}/hazards"

  - priority: 10
    category: existence
    check: "the {id} path segment or activity_id in body resolves to a VerificationActivity"
    error_id: ERR_ACTIVITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/verification-activities/{id}, PATCH /fsvp/verification-activities/{id}, POST /fsvp/verification-activities/{id}/review, POST /fsvp/verification-records"

  - priority: 11
    category: existence
    check: "the {id} path segment resolves to a VerificationRecord"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/verification-records/{id}, POST /fsvp/verification-records/{id}/attestation, POST /fsvp/verification-records/{id}/rescission"

  - priority: 12
    category: existence
    check: "the {id} path segment resolves to a CorrectiveAction"
    error_id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/corrective-actions/{id}, POST /fsvp/corrective-actions/{id}/decision, POST /fsvp/corrective-actions/{id}/closure"

  - priority: 13
    category: existence
    check: "the {id} path segment resolves to an EntrySubmission"
    error_id: ERR_ENTRY_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /fsvp/entry-submissions/{id}"

  - priority: 14
    category: business_referential
    check: "every entity referenced in one request belongs to the SAME importer: supplier.importer_id = food.importer_id = body importer_id on pair create; designated_qi_id / assigned_qi_id .importer_id = pair.importer_id; activity.pair_id's importer matches the acting user's QI record on activity create"
    error_id: ERR_IMPORTER_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /fsvp/supplier-food-pairs, POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}, POST /fsvp/hazard-analyses"

  - priority: 15
    category: business_constraint
    check: "Importer.dnb_number is globally unique; Importer.unique_facility_identifier is globally unique; QualifiedIndividual.email is unique per importer_id; ForeignSupplier.facility_registration_number is unique per importer_id; Food.fda_product_code is unique per importer_id; EntrySubmission (entry_number, entry_line_number) is unique globally"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /fsvp/importers, POST /fsvp/qualified-individuals, POST /fsvp/foreign-suppliers, POST /fsvp/foods, POST /fsvp/entry-submissions"

  - priority: 16
    category: business_constraint
    check: "no existing SupplierFoodPair with the same (supplier_id, food_id) whose verification_status != RETIRED"
    error_id: ERR_DUPLICATE_SUPPLIER_FOOD_PAIR
    http_status: 409
    applies_to: "POST /fsvp/supplier-food-pairs"

  - priority: 17
    category: state
    check: "expected_pair_version equals the target SupplierFoodPair's current version (§1.2.1 hazard-analysis-create-stale-pair)"
    error_id: ERR_STALE_PAIR_VERSION
    http_status: 412
    applies_to: "POST /fsvp/hazard-analyses"

  - priority: 18
    category: state
    check: "expected_supplier_version equals the action's ForeignSupplier's current version (§1.2.1 corrective-action-decision-stale-supplier)"
    error_id: ERR_STALE_SUPPLIER_VERSION
    http_status: 412
    applies_to: "POST /fsvp/corrective-actions/{id}/decision"

  - priority: 19
    category: state
    check: "the requested (from-state, action) pair exists in the target entity's §1.2 transition list — covers QI designation actions, supplier evaluation, pair verification-approval / reassessment, exemption actions, corrective-action decision and closure, and any write against a terminal state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /fsvp/qualified-individuals/{id}/designation, POST /fsvp/foreign-suppliers/{id}/evaluation, POST /fsvp/supplier-food-pairs/{id}/verification-approval, POST /fsvp/supplier-food-pairs/{id}/reassessment, POST /fsvp/supplier-food-pairs/{id}/exemption, POST /fsvp/corrective-actions/{id}/decision, POST /fsvp/corrective-actions/{id}/closure, POST /fsvp/verification-activities/{id}/review"

  - priority: 20
    category: state
    check: "pair.entry_eligibility_status = ELIGIBLE"
    error_id: ERR_PAIR_ENTRY_BLOCKED
    http_status: 409
    applies_to: "POST /fsvp/entry-submissions"

  - priority: 21
    category: state
    check: "pair.verification_status IN {VERIFICATION_APPROVED} OR pair.exemption_status = VERIFIED — an entry line may not be filed against a pair whose compliance basis was never established"
    error_id: ERR_PAIR_VERIFICATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /fsvp/entry-submissions"

  - priority: 22
    category: state
    check: "target HazardAnalysis.status = DRAFT (hazards may only be added to, and approval only granted on, a draft)"
    error_id: ERR_ANALYSIS_NOT_DRAFT
    http_status: 409
    applies_to: "POST /fsvp/hazard-analyses/{id}/hazards, POST /fsvp/hazard-analyses/{id}/approval"

  - priority: 23
    category: state
    check: "target VerificationActivity.status IN {PROPOSED, CHANGES_REQUESTED} (an APPROVED, WITHDRAWN or RETIRED activity is frozen)"
    error_id: ERR_ACTIVITY_NOT_REVISABLE
    http_status: 409
    applies_to: "PATCH /fsvp/verification-activities/{id}"

  - priority: 24
    category: state
    check: "target VerificationRecord.record_status = RECEIVED for attestation, and IN {RECEIVED, ATTESTED} for rescission"
    error_id: ERR_RECORD_NOT_ATTESTABLE
    http_status: 409
    applies_to: "POST /fsvp/verification-records/{id}/attestation, POST /fsvp/verification-records/{id}/rescission"

  - priority: 25
    category: state
    check: "the activity named by activity_id has status = APPROVED — evidence may only be filed against an approved verification activity"
    error_id: ERR_ACTIVITY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /fsvp/verification-records"

  - priority: 26
    category: business_safety
    check: "the acting QualifiedIndividual (X-User-ID) has status = ACTIVE and training_valid_until >= clock_now; on a RENEW_TRAINING designation the submitted training_completed_at must itself still be within 36 months of the clock"
    error_id: ERR_QI_DESIGNATION_INVALID
    http_status: 422
    applies_to: "POST /fsvp/qualified-individuals/{id}/designation, POST /fsvp/foreign-suppliers/{id}/evaluation, POST /fsvp/hazard-analyses, POST /fsvp/hazard-analyses/{id}/approval, POST /fsvp/hazard-analyses/{id}/hazards, POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}, POST /fsvp/verification-activities/{id}/review, POST /fsvp/verification-records, POST /fsvp/verification-records/{id}/attestation, POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 27
    category: business_safety
    check: "supplier.status IN {APPROVED, CONDITIONALLY_APPROVED}; applies to pair verification-approval always, and to entry submission ONLY when the pair's eligibility rests on a modified-requirements exemption (pair.modified_requirements_only = true) or on full verification — a pair whose exemption_status = VERIFIED with modified_requirements_only = false skips this check entirely"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval, POST /fsvp/entry-submissions"

  - priority: 28
    category: business_safety
    check: "no CorrectiveAction on the pair's supplier with status = IMPORT_SUSPENSION"
    error_id: ERR_IMPORT_SUSPENSION_ACTIVE
    http_status: 422
    applies_to: "POST /fsvp/entry-submissions, POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 29
    category: business_safety
    check: "supplier.regulatory_compliance_status = NO_ADVERSE_FINDINGS for decision APPROVE, or IN {NO_ADVERSE_FINDINGS, WARNING_LETTER} for decision APPROVE_CONDITIONALLY"
    error_id: ERR_COMPLIANCE_STATUS_BLOCKS_APPROVAL
    http_status: 422
    applies_to: "POST /fsvp/foreign-suppliers/{id}/evaluation"

  - priority: 30
    category: business_safety
    check: "target HazardAnalysis.hazard_count >= 1 — an analysis with no hazard rows documents nothing and cannot be approved"
    error_id: ERR_HAZARD_ANALYSIS_EMPTY
    http_status: 422
    applies_to: "POST /fsvp/hazard-analyses/{id}/approval"

  - priority: 31
    category: business_safety
    check: "pair.active_hazard_analysis_id IS NOT NULL"
    error_id: ERR_HAZARD_ANALYSIS_REQUIRED
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval, POST /fsvp/verification-activities"

  - priority: 32
    category: business_safety
    check: "at least one VerificationActivity on the pair has status = APPROVED"
    error_id: ERR_NO_VERIFICATION_ACTIVITY
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 33
    category: business_safety
    check: "if any Hazard of the pair's active analysis has severity = 5 AND requires_control = true AND control_owner = FOREIGN_SUPPLIER (a SAHCODHA hazard controlled by the supplier), then an APPROVED ONSITE_AUDIT activity with frequency_per_year >= 1 must exist on the pair"
    error_id: ERR_ONSITE_AUDIT_REQUIRED
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 34
    category: business_safety
    check: "SUM(frequency_per_year of the pair's APPROVED activities) >= pair.required_annual_frequency"
    error_id: ERR_FREQUENCY_BELOW_REQUIRED
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 35
    category: business_safety
    check: "pair.adequacy_score_planned >= 30.00 when pair.modified_requirements_only = true, otherwise >= 60.00"
    error_id: ERR_ADEQUACY_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 36
    category: business_temporal
    check: "window_start < window_end for a verification activity, and performed_start <= performed_end for a verification record"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}, POST /fsvp/verification-records"

  - priority: 37
    category: business_temporal
    check: "the record's closed interval [performed_start, performed_end] lies inside the activity's half-open window [window_start, window_end): performed_start >= activity.window_start AND performed_end < activity.window_end"
    error_id: ERR_RECORD_OUTSIDE_ACTIVITY_WINDOW
    http_status: 422
    applies_to: "POST /fsvp/verification-records"

  - priority: 38
    category: business_temporal
    check: "performed_end <= clock_now — evidence cannot be filed for work that has not happened yet"
    error_id: ERR_RECORD_IN_FUTURE
    http_status: 422
    applies_to: "POST /fsvp/verification-records"

  - priority: 39
    category: business_temporal
    check: "for outcome-bearing ONSITE_AUDIT evidence on one ForeignSupplier: the new record's CLOSED interval [performed_start, performed_end], widened by a 30-day cool-off on each side, must not overlap any existing non-RESCINDED onsite-audit record's closed interval on the same supplier. Touching endpoints CONFLICT (closed intervals), and the comparison is pairwise against each existing record, never against a merged union."
    error_id: ERR_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fsvp/verification-records"

  - priority: 40
    category: business_temporal
    check: "for the assigned QualifiedIndividual: COUNT(existing VerificationActivity rows with the same assigned_qi_id, status IN {PROPOSED, CHANGES_REQUESTED, APPROVED}, whose HALF-OPEN window [window_start, window_end) overlaps the new half-open window) must be < qi.concurrent_activity_capacity. Adjacency (existing.window_end = new.window_start) does NOT overlap and is always allowed; the check is an aggregate count against capacity, not a pairwise veto."
    error_id: ERR_QI_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}"

  - priority: 41
    category: business_temporal
    check: "pair.reassessment_due_at IS NULL OR pair.reassessment_due_at >= clock_now — a pair past its 36-month reassessment date must be reassessed before it can be verification-approved again"
    error_id: ERR_REASSESSMENT_OVERDUE
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

  - priority: 42
    category: business_constraint
    check: "justification_text length >= 20 characters on activity create/patch, and methodology_note length >= 20 on hazard-analysis create — the frequency justification required by the program"
    error_id: ERR_JUSTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /fsvp/verification-activities, PATCH /fsvp/verification-activities/{id}, POST /fsvp/hazard-analyses"

  - priority: 43
    category: business_constraint
    check: "segregation of duties: the reviewing QI (X-User-ID) differs from activity.proposed_by_qi_id on review; the patching QI equals activity.proposed_by_qi_id on PATCH; the attesting QI differs from record.submitted_by_qi_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fsvp/verification-activities/{id}/review, PATCH /fsvp/verification-activities/{id}, POST /fsvp/verification-records/{id}/attestation"

  - priority: 44
    category: business_constraint
    check: "the claimed exemption_type is applicable: JUICE_HACCP_CONTROL requires food.process_control_category = JUICE_HACCP; SEAFOOD_HACCP_CONTROL requires SEAFOOD_HACCP; LOW_ACID_CANNED_MICROBIO requires LOW_ACID_CANNED; DIETARY_SUPPLEMENT_CGMP requires DIETARY_SUPPLEMENT; ALCOHOL_BEVERAGE requires ALCOHOL_BEVERAGE; RESEARCH_QUANTITY requires food.process_control_category = NONE (a research or evaluation quantity carries no regulated process control); US_CUSTOMER_WRITTEN_ASSURANCE and SMALL_IMPORTER_MODIFIED accept any process_control_category"
    error_id: ERR_EXEMPTION_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/exemption"

  - priority: 45
    category: business_constraint
    check: "exemption_type = SMALL_IMPORTER_MODIFIED requires importer.small_importer_flag = true"
    error_id: ERR_MODIFIED_REQUIREMENTS_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/exemption"

  - priority: 46
    category: business_referential
    check: "dnb_number_submitted = importer.dnb_number AND ufi_submitted = importer.unique_facility_identifier (importer identification at entry)"
    error_id: ERR_IDENTIFIER_MISMATCH
    http_status: 422
    applies_to: "POST /fsvp/entry-submissions"

  - priority: 47
    category: business_referential
    check: "closing a CorrectiveAction as CLOSE_RESOLVED requires an ATTESTED VerificationRecord with outcome = PASS on an activity of action.pair_id whose performed_end is strictly after action.decided_at"
    error_id: ERR_REVERIFICATION_MISSING
    http_status: 422
    applies_to: "POST /fsvp/corrective-actions/{id}/closure"

  - priority: 48
    category: business_referential
    check: "the acting X-User-ID equals pair.designated_qi_id — only the QI designated for this supplier-food combination may sign its verification approval"
    error_id: ERR_QI_NOT_DESIGNATED_FOR_PAIR
    http_status: 403
    applies_to: "POST /fsvp/supplier-food-pairs/{id}/verification-approval"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Importer -------------------------------------------------------------
  - method: POST
    path: "/fsvp/importers"
    description: "Register an FSVP importer (the compliance office of record)."
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, dnb_number, unique_facility_identifier, "small_importer_flag?", "record_retention_months?"]
    output: Importer
    side_effects:
      - "program_status computed as NON_COMPLIANT (no ACTIVE qualified individual exists yet)"
      - "blocked_pair_count = 0, open_corrective_action_count = 0, qualified_individual_designated = false"

  - method: GET
    path: "/fsvp/importers/{id}"
    description: "Read one importer with its live program roll-up fields."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: Importer
    side_effects: []

  - method: GET
    path: "/fsvp/importers/{id}/records-package"
    description: "Records-availability package for an FDA inspection: retention and availability counts over every verification record reachable from this importer, evaluated at as_of_iso8601 (defaults to the logical clock)."
    roles: [FdaInspector, ComplianceOfficer]
    code: 200
    input: ["record_type?", "as_of_iso8601?"]
    output: { importer_id: string, program_status: string, retained_record_count: integer, available_for_inspection_count: integer, expired_record_count: integer, rescinded_record_count: integer, qualified_individual_designated: boolean, generated_at: string }
    side_effects:
      - "no writes; recomputes calculations.record_retention_and_availability at as_of"

  # --- QualifiedIndividual --------------------------------------------------
  - method: POST
    path: "/fsvp/qualified-individuals"
    description: "Propose a qualified individual for the importer's FSVP program."
    roles: [ComplianceOfficer]
    code: 201
    input: [importer_id, full_name, email, qualification_summary, training_completed_at, "concurrent_activity_capacity?"]
    output: QualifiedIndividual
    side_effects:
      - "status = PROPOSED; training_valid_until = training_completed_at + 36 months"

  - method: GET
    path: "/fsvp/importers/{id}/qualified-individuals"
    description: "List the importer's qualified individuals (FK reverse-reachability for QualifiedIndividual.importer_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QualifiedIndividual[]
    side_effects: []

  - method: POST
    path: "/fsvp/qualified-individuals/{id}/designation"
    description: "Drive the designation lifecycle: action ∈ {DESIGNATE, RENEW_TRAINING, LAPSE, REVOKE}."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "training_completed_at?", "note?"]
    output: QualifiedIndividual
    side_effects:
      - "status transition per §1.2 QualifiedIndividual; training_valid_until recomputed on RENEW_TRAINING"
      - "Importer.qualified_individual_designated and Importer.program_status recomputed"

  # --- ForeignSupplier ------------------------------------------------------
  - method: POST
    path: "/fsvp/foreign-suppliers"
    description: "Identify a foreign supplier for this importer."
    roles: [ComplianceOfficer]
    code: 201
    input: [importer_id, name, country_code, facility_registration_number, "regulatory_compliance_status?"]
    output: ForeignSupplier
    side_effects:
      - "status = UNEVALUATED; performance_score_provisional = performance_score_final = 100.00; performance_sample_weight_total = 0.00"

  - method: GET
    path: "/fsvp/foreign-suppliers/{id}"
    description: "Read one foreign supplier with both performance-score variants and its version."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: ForeignSupplier
    side_effects: []

  - method: GET
    path: "/fsvp/importers/{id}/foreign-suppliers"
    description: "List the importer's foreign suppliers (FK reverse-reachability for ForeignSupplier.importer_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["status?", "regulatory_compliance_status?", "limit?", "offset?"]
    output: ForeignSupplier[]
    side_effects: []

  - method: PATCH
    path: "/fsvp/foreign-suppliers/{id}/compliance-status"
    description: "Record the supplier's regulatory compliance status (warning letter, import alert, registration suspension) as learned from FDA sources."
    roles: [ComplianceOfficer]
    code: 200
    input: [regulatory_compliance_status, source_reference]
    output: ForeignSupplier
    side_effects:
      - "supplier.version incremented by 1"
      - "CASCADE HOP 1 — every SupplierFoodPair of this supplier recomputes composite_hazard_risk, risk_tier, required_annual_frequency, required_coverage, adequacy_score_planned, adequacy_score_realized"
      - "CASCADE HOP 2 — a VERIFICATION_APPROVED pair whose plan no longer satisfies its frequency or adequacy floor moves to REASSESSMENT_REQUIRED"
      - "CASCADE HOP 3 — that pair's APPROVED activities move to CHANGES_REQUESTED; Importer.program_status recomputed"

  - method: POST
    path: "/fsvp/foreign-suppliers/{id}/evaluation"
    description: "Qualified-individual evaluation of the supplier's performance history, compliance status and hazard controls: decision ∈ {APPROVE, APPROVE_CONDITIONALLY}."
    roles: [QualifiedIndividual]
    code: 200
    input: [decision, performance_basis_note]
    output: ForeignSupplier
    side_effects:
      - "status → APPROVED or CONDITIONALLY_APPROVED; last_evaluated_at = clock_now"
      - "supplier.version incremented by 1"

  # --- Food -----------------------------------------------------------------
  - method: POST
    path: "/fsvp/foods"
    description: "Identify an imported food. Immutable once created (common_fields: false — no version, no update endpoint)."
    roles: [ComplianceOfficer]
    code: 201
    input: [importer_id, food_name, fda_product_code, is_raw_agricultural_commodity, intended_consumer_group, "process_control_category?", "ready_to_eat?"]
    output: Food
    side_effects: []

  - method: GET
    path: "/fsvp/importers/{id}/foods"
    description: "List the importer's foods (FK reverse-reachability for Food.importer_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["process_control_category?", "limit?", "offset?"]
    output: Food[]
    side_effects: []

  # --- SupplierFoodPair -----------------------------------------------------
  - method: POST
    path: "/fsvp/supplier-food-pairs"
    description: "Create the food × foreign-supplier combination that FSVP treats as the unit of compliance, and name the qualified individual designated for it."
    roles: [ComplianceOfficer]
    code: 201
    input: [importer_id, supplier_id, food_id, designated_qi_id]
    output: SupplierFoodPair
    side_effects:
      - "verification_status = DRAFT, entry_eligibility_status = PENDING, exemption_status = NONE"
      - "composite_hazard_risk / risk_tier / required_annual_frequency / required_coverage computed from an empty hazard set plus the supplier penalty"
      - "Importer.program_status recomputed"

  - method: GET
    path: "/fsvp/supplier-food-pairs/{id}"
    description: "Read one supplier-food pair: three status dimensions, risk fields, both adequacy variants, reassessment dates and version."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: SupplierFoodPair
    side_effects: []

  - method: GET
    path: "/fsvp/supplier-food-pairs"
    description: "Filtered list of supplier-food pairs (FK reverse-reachability for importer_id, supplier_id, food_id, designated_qi_id and active_hazard_analysis_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["importer_id?", "supplier_id?", "food_id?", "designated_qi_id?", "active_hazard_analysis_id?", "verification_status?", "entry_eligibility_status?", "exemption_status?", "risk_tier?", "limit?", "offset?"]
    output: SupplierFoodPair[]
    side_effects: []

  - method: POST
    path: "/fsvp/supplier-food-pairs/{id}/verification-approval"
    description: "The designated qualified individual signs off that the selected verification activities and their frequency justification are adequate for the hazards requiring control."
    roles: [QualifiedIndividual]
    code: 200
    input: [approval_note]
    output: SupplierFoodPair
    side_effects:
      - "verification_status → VERIFICATION_APPROVED; last_reassessed_at = clock_now; reassessment_due_at = clock_now + 36 months"
      - "entry_eligibility_status PENDING → ELIGIBLE (BLOCKED is not cleared here)"
      - "pair.version incremented by 1; Importer.program_status recomputed"

  - method: POST
    path: "/fsvp/supplier-food-pairs/{id}/reassessment"
    description: "Trigger a reassessment of the pair (new hazard information, supplier change, or the 36-month cycle)."
    roles: [ComplianceOfficer, QualifiedIndividual]
    code: 200
    input: [trigger_reason, "note?"]
    output: SupplierFoodPair
    side_effects:
      - "verification_status VERIFICATION_APPROVED → REASSESSMENT_REQUIRED; last_reassessed_at = clock_now; reassessment_due_at recomputed"
      - "entry_eligibility_status deliberately unchanged; pair.version incremented by 1; Importer.program_status recomputed"

  - method: POST
    path: "/fsvp/supplier-food-pairs/{id}/exemption"
    description: "Exemption / modified-requirements workflow for the pair: action ∈ {CLAIM, VERIFY, REJECT, REVOKE}."
    roles: [ComplianceOfficer, QualifiedIndividual]
    code: 200
    input: [action, "exemption_type?", "basis_note?", "determination_note?"]
    output: SupplierFoodPair
    side_effects:
      - "exemption_status transition per §1.2; exemption_type and modified_requirements_only recomputed"
      - "on VERIFY: entry_eligibility_status PENDING → ELIGIBLE without any hazard analysis"
      - "on REVOKE: entry_eligibility_status ELIGIBLE → BLOCKED when verification_status != VERIFICATION_APPROVED, its SUBMITTED/ACCEPTED entry lines → HELD, Importer.blocked_pair_count and program_status recomputed"
      - "pair.version incremented by 1"

  # --- HazardAnalysis / Hazard ---------------------------------------------
  - method: POST
    path: "/fsvp/hazard-analyses"
    description: "Open a hazard analysis for one food × foreign-supplier combination. expected_pair_version guards against authoring against a stale pair (§1.2.1)."
    roles: [QualifiedIndividual]
    code: 201
    input: [pair_id, expected_pair_version, methodology_note]
    output: HazardAnalysis
    side_effects:
      - "status = DRAFT; authored_by_qi_id = X-User-ID; pair_version_at_create recorded; risk_total = 0.00"
      - "any existing DRAFT analysis on the same pair → WITHDRAWN"
      - "pair.hazard_analysis_count incremented; pair.version incremented by 1"

  - method: GET
    path: "/fsvp/hazard-analyses/{id}"
    description: "Read one hazard analysis with its rolled-up risk_total and hazard_count."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: HazardAnalysis
    side_effects: []

  - method: GET
    path: "/fsvp/hazard-analyses"
    description: "Filtered list of hazard analyses (FK reverse-reachability for pair_id and authored_by_qi_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["pair_id?", "authored_by_qi_id?", "status?", "limit?", "offset?"]
    output: HazardAnalysis[]
    side_effects: []

  - method: POST
    path: "/fsvp/hazard-analyses/{id}/hazards"
    description: "Add one identified hazard (biological, chemical incl. radiological, physical, economically motivated) with severity, probability and the control owner."
    roles: [QualifiedIndividual]
    code: 201
    input: [hazard_type, hazard_name, severity, probability, control_owner]
    output: Hazard
    side_effects:
      - "risk_score and requires_control computed per calculations.hazard_risk_score (immutable row, common_fields: false)"
      - "analysis.risk_total and analysis.hazard_count recomputed"

  - method: GET
    path: "/fsvp/hazard-analyses/{id}/hazards"
    description: "List the hazards of one analysis (FK reverse-reachability for Hazard.hazard_analysis_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["hazard_type?", "requires_control?", "limit?", "offset?"]
    output: Hazard[]
    side_effects: []

  - method: POST
    path: "/fsvp/hazard-analyses/{id}/approval"
    description: "Approve the hazard analysis, making it the pair's active analysis."
    roles: [QualifiedIndividual]
    code: 200
    input: [approval_note]
    output: HazardAnalysis
    side_effects:
      - "status DRAFT → APPROVED; approved_at = clock_now; the pair's previous APPROVED analysis → SUPERSEDED"
      - "pair.active_hazard_analysis_id set; pair.verification_status → HAZARD_ANALYZED"
      - "pair.uncontrolled_significant_hazard_count, composite_hazard_risk, risk_tier, required_annual_frequency, required_coverage and both adequacy variants recomputed; pair.version incremented by 1"

  # --- VerificationActivity ------------------------------------------------
  - method: POST
    path: "/fsvp/verification-activities"
    description: "Select a verification activity for the pair (onsite audit, sampling and testing, records review, other supplier evaluation) with its frequency and written justification."
    roles: [QualifiedIndividual]
    code: 201
    input: [pair_id, activity_type, frequency_per_year, justification_text, window_start, window_end, assigned_qi_id]
    output: VerificationActivity
    side_effects:
      - "status = PROPOSED; proposed_by_qi_id = X-User-ID; revision_count = 0; coverage_weight computed"
      - "assigned QI active_assignment_count recomputed"

  - method: GET
    path: "/fsvp/verification-activities/{id}"
    description: "Read one verification activity with its coverage_weight and revision_count."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: VerificationActivity
    side_effects: []

  - method: GET
    path: "/fsvp/verification-activities"
    description: "Filtered list of verification activities (FK reverse-reachability for pair_id, proposed_by_qi_id, assigned_qi_id and reviewed_by_qi_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["pair_id?", "proposed_by_qi_id?", "assigned_qi_id?", "reviewed_by_qi_id?", "status?", "activity_type?", "limit?", "offset?"]
    output: VerificationActivity[]
    side_effects: []

  - method: PATCH
    path: "/fsvp/verification-activities/{id}"
    description: "Revise a proposed or changes-requested activity. Only the proposing qualified individual may revise it."
    roles: [QualifiedIndividual]
    code: 200
    input: ["frequency_per_year?", "justification_text?", "window_start?", "window_end?", "assigned_qi_id?"]
    output: VerificationActivity
    side_effects:
      - "CHANGES_REQUESTED → PROPOSED increments revision_count by 1; a PATCH on an already-PROPOSED row does not"
      - "coverage_weight recomputed; pair.adequacy_score_planned recomputed; QI capacity re-checked when the window or assignee changes"
      - "activity.version incremented by 1"

  - method: POST
    path: "/fsvp/verification-activities/{id}/review"
    description: "Second-qualified-individual review of a proposed activity: decision ∈ {APPROVE, REQUEST_CHANGES, WITHDRAW}."
    roles: [QualifiedIndividual]
    code: 200
    input: [decision, reviewer_note]
    output: VerificationActivity
    side_effects:
      - "status → APPROVED | CHANGES_REQUESTED | WITHDRAWN; reviewed_by_qi_id = X-User-ID"
      - "pair.adequacy_score_planned and adequacy_score_realized recomputed; activity.version incremented by 1"

  # --- VerificationRecord --------------------------------------------------
  - method: POST
    path: "/fsvp/verification-records"
    description: "File the documentary result of a performed verification activity (audit report, sampling result, records-review memo)."
    roles: [QualifiedIndividual]
    code: 201
    input: [activity_id, outcome, performed_start, performed_end, "findings_count?", document_reference]
    output: VerificationRecord
    side_effects:
      - "record_status = RECEIVED; submitted_by_qi_id = X-User-ID; weight, record_points and retained_until computed"
      - "supplier.performance_score_provisional recomputed (the FINAL variant is untouched until attestation)"

  - method: GET
    path: "/fsvp/verification-records/{id}"
    description: "Read one verification record with its retention and availability fields."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["as_of_iso8601?"]
    output: VerificationRecord
    side_effects: []

  - method: GET
    path: "/fsvp/verification-records"
    description: "Filtered list of verification records (FK reverse-reachability for activity_id, submitted_by_qi_id and attested_by_qi_id)."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["activity_id?", "submitted_by_qi_id?", "attested_by_qi_id?", "record_status?", "outcome?", "limit?", "offset?"]
    output: VerificationRecord[]
    side_effects: []

  - method: POST
    path: "/fsvp/verification-records/{id}/attestation"
    description: "A second qualified individual attests the record, admitting it into the supplier's FINAL performance score."
    roles: [QualifiedIndividual]
    code: 200
    input: [attestation_note]
    output: VerificationRecord
    side_effects:
      - "CASCADE HOP 1 — record_status RECEIVED → ATTESTED; attested_by_qi_id = X-User-ID; supplier.performance_score_final and performance_sample_weight_total recomputed"
      - "CASCADE HOP 2 — every pair of the supplier recomputes composite_hazard_risk / required_coverage / both adequacy variants; when performance_score_final < 60.00 the supplier moves to SUSPENDED_PENDING_REVIEW"
      - "CASCADE HOP 3 — the supplier's VERIFICATION_APPROVED pairs move to VERIFICATION_LAPSED and one OPEN CorrectiveAction (trigger_reason PERFORMANCE_SCORE_BREACH) is synthesized per lapsed pair with pre_action_blocked_pair_count snapshotted"
      - "CASCADE HOP 4 — each lapsed pair's entry_eligibility_status ELIGIBLE → BLOCKED"
      - "CASCADE HOP 5 — each blocked pair's SUBMITTED/ACCEPTED entry lines → HELD with held_reason PAIR_BLOCKED"
      - "CASCADE HOP 6 — Importer.blocked_pair_count, open_corrective_action_count and program_status recomputed; supplier.version incremented by 1"

  - method: POST
    path: "/fsvp/verification-records/{id}/rescission"
    description: "Withdraw a filed record (wrong document, wrong pair, superseded lab result). Compensating action: the supplier's score and sample weight return exactly to their pre-attestation values."
    roles: [QualifiedIndividual]
    code: 200
    input: [reason]
    output: VerificationRecord
    side_effects:
      - "record_status → RESCINDED; the record leaves both performance variants and drops out of the availability bucket"
      - "supplier.performance_sample_weight_total and performance_score_final restored to their pre-attestation values; supplier.version incremented by 1"
      - "pair.adequacy_score_realized recomputed; a suspended supplier is NOT reinstated by rescission"

  # --- CorrectiveAction ----------------------------------------------------
  - method: GET
    path: "/fsvp/corrective-actions/{id}"
    description: "Read one corrective action, including the blocked-pair count snapshot taken before it was opened."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []

  - method: GET
    path: "/fsvp/corrective-actions"
    description: "Filtered list of corrective actions (FK reverse-reachability for supplier_id and pair_id). Corrective actions are only ever created by cascade, so this is their sole discovery channel."
    roles: [ComplianceOfficer, QualifiedIndividual, FdaInspector]
    code: 200
    input: ["supplier_id?", "pair_id?", "status?", "trigger_reason?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []

  - method: POST
    path: "/fsvp/corrective-actions/{id}/decision"
    description: "Compliance-officer decision on a supplier that failed verification: decision ∈ {SUPPLIER_REMEDIATION, IMPORT_SUSPENSION}. expected_supplier_version guards against deciding on a stale supplier picture (§1.2.1)."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, rationale, expected_supplier_version]
    output: CorrectiveAction
    side_effects:
      - "status OPEN → SUPPLIER_REMEDIATION or IMPORT_SUSPENSION; decided_at = clock_now; supplier_version_at_decision recorded; supplier.version incremented by 1"
      - "SUPPLIER_REMEDIATION: supplier → CONDITIONALLY_APPROVED, its VERIFICATION_LAPSED pairs → REASSESSMENT_REQUIRED, entry eligibility untouched"
      - "IMPORT_SUSPENSION: every ELIGIBLE pair of the supplier → BLOCKED, their SUBMITTED/ACCEPTED entry lines → HELD, Importer.blocked_pair_count and program_status recomputed"

  - method: POST
    path: "/fsvp/corrective-actions/{id}/closure"
    description: "Close a corrective action: action ∈ {CLOSE_RESOLVED, CLOSE_DISQUALIFY}. CLOSE_RESOLVED is the compensating path and requires post-decision passing re-verification."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, closure_note]
    output: CorrectiveAction
    side_effects:
      - "status → CLOSED_RESOLVED or CLOSED_SUPPLIER_DISQUALIFIED; closed_at = clock_now"
      - "CLOSE_RESOLVED: the action's pair → VERIFICATION_APPROVED and ELIGIBLE, its HELD entry lines → ACCEPTED with held_reason cleared, Importer.blocked_pair_count restored to pre_action_blocked_pair_count, supplier → APPROVED when this was its last open action"
      - "CLOSE_DISQUALIFY: supplier → DISQUALIFIED, all its pairs → RETIRED + BLOCKED, all their live entry lines → REJECTED with held_reason SUPPLIER_DISQUALIFIED"
      - "supplier.version incremented by 1; Importer.open_corrective_action_count and program_status recomputed"

  # --- EntrySubmission -----------------------------------------------------
  - method: POST
    path: "/fsvp/entry-submissions"
    description: "Submit importer identification at entry: DUNS number and UFI transmitted on the entry line for one supplier-food combination."
    roles: [EntryFiler]
    code: 201
    input: [pair_id, entry_number, entry_line_number, dnb_number_submitted, ufi_submitted, arrival_date]
    output: EntrySubmission
    side_effects:
      - "identifier_match computed against the importer's dnb_number and unique_facility_identifier"
      - "status auto-advances SUBMITTED → ACCEPTED inside the same request once every validation passed"

  - method: GET
    path: "/fsvp/entry-submissions/{id}"
    description: "Read one entry line with its identifier-match result and hold reason."
    roles: [ComplianceOfficer, EntryFiler, FdaInspector]
    code: 200
    input: []
    output: EntrySubmission
    side_effects: []

  - method: GET
    path: "/fsvp/entry-submissions"
    description: "Filtered list of entry lines (FK reverse-reachability for EntrySubmission.pair_id)."
    roles: [ComplianceOfficer, EntryFiler, FdaInspector]
    code: 200
    input: ["pair_id?", "status?", "entry_number?", "held_reason?", "limit?", "offset?"]
    output: EntrySubmission[]
    side_effects: []

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every retention, recency, reassessment and window rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no entity writes; derived reads (record availability, recency factor, reassessment overdue, QI training currency) re-evaluate against the new instant"

# =============================================================================
# Table 6: Error Code Catalog (48 codes, one per §1.4 row; every code is
# triggerable through the §1.5 surface)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, empty, or role outside the §1.7 list" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body or query: missing required field, wrong type, unknown enum value, out-of-range integer, non-ISO datetime, string shorter than its constraint, limit outside 1..100, negative offset" }
  - { id: ERR_IMPORTER_NOT_FOUND, http: 404, condition: "the {id} path segment / importer_id does not resolve to an Importer" }
  - { id: ERR_QI_NOT_FOUND, http: 404, condition: "the {id} path segment / designated_qi_id / assigned_qi_id does not resolve to a QualifiedIndividual" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "the {id} path segment / supplier_id does not resolve to a ForeignSupplier" }
  - { id: ERR_FOOD_NOT_FOUND, http: 404, condition: "food_id does not resolve to a Food" }
  - { id: ERR_PAIR_NOT_FOUND, http: 404, condition: "the {id} path segment / pair_id does not resolve to a SupplierFoodPair" }
  - { id: ERR_HAZARD_ANALYSIS_NOT_FOUND, http: 404, condition: "the {id} path segment does not resolve to a HazardAnalysis" }
  - { id: ERR_ACTIVITY_NOT_FOUND, http: 404, condition: "the {id} path segment / activity_id does not resolve to a VerificationActivity" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "the {id} path segment does not resolve to a VerificationRecord" }
  - { id: ERR_CORRECTIVE_ACTION_NOT_FOUND, http: 404, condition: "the {id} path segment does not resolve to a CorrectiveAction" }
  - { id: ERR_ENTRY_SUBMISSION_NOT_FOUND, http: 404, condition: "the {id} path segment does not resolve to an EntrySubmission" }
  - { id: ERR_IMPORTER_SCOPE_MISMATCH, http: 409, condition: "entities referenced in one request belong to different importers (multi-tenancy boundary)" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "a uniqueness scope is violated: importer dnb_number or UFI globally, QI email / supplier facility_registration_number / food fda_product_code per importer, or (entry_number, entry_line_number) globally" }
  - { id: ERR_DUPLICATE_SUPPLIER_FOOD_PAIR, http: 409, condition: "a non-RETIRED SupplierFoodPair already exists for this (supplier_id, food_id)" }
  - { id: ERR_STALE_PAIR_VERSION, http: 412, condition: "expected_pair_version does not match the pair's current version on hazard-analysis create" }
  - { id: ERR_STALE_SUPPLIER_VERSION, http: 412, condition: "expected_supplier_version does not match the supplier's current version on a corrective-action decision" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the requested (from-state, action) pair is not in the entity's §1.2 transition list, including any write against a terminal state" }
  - { id: ERR_PAIR_ENTRY_BLOCKED, http: 409, condition: "the pair's entry_eligibility_status is not ELIGIBLE" }
  - { id: ERR_PAIR_VERIFICATION_INCOMPLETE, http: 409, condition: "the pair has neither VERIFICATION_APPROVED verification nor a VERIFIED exemption" }
  - { id: ERR_ANALYSIS_NOT_DRAFT, http: 409, condition: "hazards added to, or approval requested on, an analysis that is not DRAFT" }
  - { id: ERR_ACTIVITY_NOT_REVISABLE, http: 409, condition: "PATCH against an activity whose status is not PROPOSED or CHANGES_REQUESTED" }
  - { id: ERR_RECORD_NOT_ATTESTABLE, http: 409, condition: "attestation of a record that is not RECEIVED, or rescission of a record already RESCINDED" }
  - { id: ERR_ACTIVITY_NOT_APPROVED, http: 409, condition: "a verification record is filed against an activity whose status is not APPROVED" }
  - { id: ERR_QI_DESIGNATION_INVALID, http: 422, condition: "the acting qualified individual is not ACTIVE, or the individual's training expired (training_valid_until < clock), or a RENEW_TRAINING submits training older than 36 months" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 422, condition: "the supplier's status is outside {APPROVED, CONDITIONALLY_APPROVED} where supplier approval is required" }
  - { id: ERR_IMPORT_SUSPENSION_ACTIVE, http: 422, condition: "the supplier has a CorrectiveAction in status IMPORT_SUSPENSION" }
  - { id: ERR_COMPLIANCE_STATUS_BLOCKS_APPROVAL, http: 422, condition: "the supplier's regulatory compliance status is too adverse for the requested evaluation decision" }
  - { id: ERR_HAZARD_ANALYSIS_EMPTY, http: 422, condition: "approval requested on a hazard analysis with zero hazard rows" }
  - { id: ERR_HAZARD_ANALYSIS_REQUIRED, http: 422, condition: "the pair has no active (APPROVED) hazard analysis" }
  - { id: ERR_NO_VERIFICATION_ACTIVITY, http: 422, condition: "the pair has no APPROVED verification activity at all" }
  - { id: ERR_ONSITE_AUDIT_REQUIRED, http: 422, condition: "a SAHCODHA hazard (severity 5, requires_control, controlled by the foreign supplier) exists but no APPROVED onsite audit is planned" }
  - { id: ERR_FREQUENCY_BELOW_REQUIRED, http: 422, condition: "the summed annual frequency of APPROVED activities is below the pair's required_annual_frequency" }
  - { id: ERR_ADEQUACY_BELOW_FLOOR, http: 422, condition: "adequacy_score_planned is below the applicable floor (60.00 standard, 30.00 under modified requirements)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end, or performed_start > performed_end" }
  - { id: ERR_RECORD_OUTSIDE_ACTIVITY_WINDOW, http: 422, condition: "the record's closed interval is not contained in the activity's half-open window" }
  - { id: ERR_RECORD_IN_FUTURE, http: 422, condition: "performed_end is after the logical clock" }
  - { id: ERR_AUDIT_WINDOW_CONFLICT, http: 409, condition: "an onsite-audit record's closed interval, widened by the 30-day cool-off, touches or overlaps another onsite-audit record on the same supplier" }
  - { id: ERR_QI_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "the assigned qualified individual already has concurrent_activity_capacity live activities whose half-open windows overlap the requested window" }
  - { id: ERR_REASSESSMENT_OVERDUE, http: 422, condition: "the pair's reassessment_due_at is in the past at verification-approval time" }
  - { id: ERR_JUSTIFICATION_INSUFFICIENT, http: 422, condition: "justification_text or methodology_note shorter than 20 characters" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the same qualified individual attempts both sides of a separated duty (propose/review, submit/attest), or a non-proposer attempts to revise" }
  - { id: ERR_EXEMPTION_NOT_APPLICABLE, http: 422, condition: "the claimed exemption type does not match the food's process_control_category" }
  - { id: ERR_MODIFIED_REQUIREMENTS_NOT_AVAILABLE, http: 422, condition: "SMALL_IMPORTER_MODIFIED claimed by an importer whose small_importer_flag is false" }
  - { id: ERR_IDENTIFIER_MISMATCH, http: 422, condition: "the DUNS number or UFI transmitted at entry does not match the importer's registered identifiers" }
  - { id: ERR_REVERIFICATION_MISSING, http: 422, condition: "CLOSE_RESOLVED requested without an ATTESTED PASS record performed after the corrective action's decided_at" }
  - { id: ERR_QI_NOT_DESIGNATED_FOR_PAIR, http: 403, condition: "a qualified individual other than pair.designated_qi_id attempts the pair's verification approval" }

# =============================================================================
# Table 7: RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "The importer's FSVP compliance office: registers importers, suppliers and foods, designates qualified individuals, records regulatory compliance status, and decides corrective actions including import suspension. Never performs the technical FSVP judgements."
    identity: "opaque"
    exclusive_operations:
      - "POST /fsvp/importers"
      - "POST /fsvp/qualified-individuals"
      - "POST /fsvp/qualified-individuals/{id}/designation"
      - "POST /fsvp/foreign-suppliers"
      - "PATCH /fsvp/foreign-suppliers/{id}/compliance-status"
      - "POST /fsvp/foods"
      - "POST /fsvp/supplier-food-pairs"
      - "POST /fsvp/corrective-actions/{id}/decision"
      - "POST /fsvp/corrective-actions/{id}/closure"
    shared_operations:
      - "POST /fsvp/supplier-food-pairs/{id}/reassessment (with QualifiedIndividual)"
      - "POST /fsvp/supplier-food-pairs/{id}/exemption (with QualifiedIndividual)"
      - "GET /fsvp/importers/{id}/records-package (with FdaInspector)"
      - "all read endpoints under /fsvp"

  - name: QualifiedIndividual
    description: "The designated qualified individual: evaluates suppliers, authors and approves hazard analyses, selects verification activities with frequency justification, files and attests verification records, and signs the pair's verification approval. X-User-ID is the QualifiedIndividual row's id, so designation-match and segregation-of-duties checks compare against it directly."
    identity: "entity_backed:QualifiedIndividual"
    exclusive_operations:
      - "POST /fsvp/foreign-suppliers/{id}/evaluation"
      - "POST /fsvp/hazard-analyses"
      - "POST /fsvp/hazard-analyses/{id}/hazards"
      - "POST /fsvp/hazard-analyses/{id}/approval"
      - "POST /fsvp/verification-activities"
      - "PATCH /fsvp/verification-activities/{id}"
      - "POST /fsvp/verification-activities/{id}/review"
      - "POST /fsvp/verification-records"
      - "POST /fsvp/verification-records/{id}/attestation"
      - "POST /fsvp/verification-records/{id}/rescission"
      - "POST /fsvp/supplier-food-pairs/{id}/verification-approval"
    shared_operations:
      - "POST /fsvp/supplier-food-pairs/{id}/reassessment (with ComplianceOfficer)"
      - "POST /fsvp/supplier-food-pairs/{id}/exemption (with ComplianceOfficer)"
      - "all read endpoints under /fsvp except entry-submission reads"
    notes: |
      Segregation of duties inside this single role is enforced by X-User-ID, not by role: the proposer of
      an activity may not review it, the submitter of a record may not attest it, and only
      pair.designated_qi_id may sign that pair's verification approval.

  - name: EntryFiler
    description: "Customs broker or filer that transmits importer identification at entry. May create and read entry lines and nothing else."
    identity: "opaque"
    exclusive_operations:
      - "POST /fsvp/entry-submissions"
    shared_operations:
      - "GET /fsvp/entry-submissions/{id} (with ComplianceOfficer, FdaInspector)"
      - "GET /fsvp/entry-submissions (with ComplianceOfficer, FdaInspector)"

  - name: FdaInspector
    description: "Regulator performing an FSVP inspection. Strictly read-only across the importer's program, including the records-availability package."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /fsvp/importers/{id}/records-package (with ComplianceOfficer)"
      - "every GET endpoint under /fsvp"

  - name: PlatformAdmin
    description: "Operator of the benchmark harness. Only advances the logical clock; owns no business operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
