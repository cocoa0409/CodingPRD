          trigger:
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 2, valid_from: "2026-09-10T00:00:00Z", valid_to: "2026-09-20T00:00:00Z", expected_store_version: "${st1_v2}" }
