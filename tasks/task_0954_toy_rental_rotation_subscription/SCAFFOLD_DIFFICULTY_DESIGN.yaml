            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Big Beads", min_age_months: 24, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 5, retail_value_cents: 6000, replacement_value_cents: 5000 }
              as: PlatformAdmin
              captures: { ci_bad: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_bad}/copies"
              payload: { barcode: "BC-CONF2-BAD", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Soft Ball", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 2000, replacement_value_cents: 1500 }
              as: PlatformAdmin
              captures: { ci_ok: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_ok}/copies"
              payload: { barcode: "BC-CONF2-OK", condition_grade: "NEW" }
              as: PlatformAdmin
