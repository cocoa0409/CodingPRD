        grounds: ["state_machines.Complaint.RESPONSE_SUBMITTED_to_CLOSED_SANCTIONED"]
        excluded_because:
          difficulty_instance: sanction_close_cascades_appraiser_orders_appointments
          rationale: "Depth-3 cascade (complaint -> appraiser -> orders -> appointments) is asserted end-to-end in the named §1.8 instance."

      - name: layer_temporal_windowing_covered
        claim_type: temporal_windowing
        grounds: ["validations[priority=9]"]
        excluded_because:
          difficulty_instance: appointment_buffer_expanded_overlap_semantics
          rationale: "Buffer-expanded overlap including the exact-adjacency boundary is asserted in the named §1.8 instance; fee-schedule half-open semantics in fee_schedule_half_open_window_adjacency_vs_overlap."

      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: ["calculations.fee_quote"]
        excluded_because:
          difficulty_instance: fee_quote_provisional_vs_final_on_schedule_supersede
          rationale: "Variant divergence, selection context, and reconciliation across three domains are asserted by the three §1.8 dual_variant_calc instances."

      - name: layer_rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: ["calculations.turn_time_scorecard"]
        excluded_because:
          difficulty_instance: standing_boundary_07500_is_probation_not_suspension
          rationale: "Threshold boundary (0.7500 inclusive vs strict-below) and the MIN_COMPLETED_FOR_RATING gate are asserted in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_visibility
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: a suspend mutation is visible in the very next GET of the same client (no lag), and the subsequent order-create observes the new state."
        test_recipe:
          setup: ["client ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id }
          trigger:
            - { call: "POST /appraisal/clients/${c_id}/suspend", payload: {}, as: FirmAdmin }
            - call: "GET /appraisal/clients/${c_id}"
              as: FirmAdmin
              captures: { c_status: $.data.status }
          assert: ["GET immediately after suspend returns status == SUSPENDED (captured ${c_status})"]
