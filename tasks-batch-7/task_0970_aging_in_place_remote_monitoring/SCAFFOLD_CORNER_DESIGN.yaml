            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_oc}" }, as: PlatformAdmin, captures: { kit_oc: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_oc}/ship", payload: {}, as: PlatformAdmin }
