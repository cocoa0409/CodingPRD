            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${west_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { west_bundle_id: $.data.id, west_bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${west_bundle_id}/daypart-slots"
