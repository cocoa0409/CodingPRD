        distinguishing_aspect: "Server-minted quote_number follows Q-YYYYMMDD-NNN with the date segment taken from the logical clock (2026-05-01 -> prefix Q-20260501-)."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case ASSESSED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
