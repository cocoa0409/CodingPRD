            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cz}", service_item_id: "${iz}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cz}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fz}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyz: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fz}", publication_cycle_id: "${cyz}", service_item_id: "${iz}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { rz: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${rz}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyz}/freeze", as: TransparencyOfficer, captures: { cyz_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cyz}", file_format: "JSON", expected_publication_cycle_version: "${cyz_v}" }, as: TransparencyOfficer, captures: { fz1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${fz1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyz}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/facilities/${fz}/submit-attestation", payload: { attestation_year: 2026 }, as: ComplianceAuditor }
            - { call: "POST /transparency/facilities/${fz}/cms-decision", payload: { decision: "REJECT_ATTESTATION", plan_due_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /transparency/facilities/${fz}", as: ComplianceAuditor, captures: { pen: $.data.penalty_accrued_cents } }
          assert:
            - "penalty_accrued_cents == 40000 (1 day x 40000, TIERED tier-3 bracket for bed_count 200)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role header fails priority-1 authentication with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["empty DB; the trigger call is sent WITHOUT the X-User-ID and X-User-Role headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /transparency/facilities"
              payload: { name: "F", cms_certification_number: "CCN-H1", bed_count: 50 }
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"]

      - name: cash_exceeds_gross_rejected_at_record_create
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CASH_EXCEEDS_GROSS]"]
        distinguishing_aspect: "discounted_cash_cents (150000) > gross snapshot (100000) is rejected at creation with ERR_CASH_EXCEEDS_GROSS (422)."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI gross 100000; cycle CY OPEN"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-H2", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 150000 }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CASH_EXCEEDS_GROSS (http 422); no record persisted"]

      - name: contract_inverted_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "effective_start (2026-12-31) after effective_end (2026-01-01) fails ERR_INVALID_WINDOW at contract creation."
        test_recipe:
          setup: ["Facility F; payer PA"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-H3", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-12-31T00:00:00Z", effective_end: "2026-01-01T00:00:00Z" }, as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW (http 422)"]

      - name: cycle_inverted_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "period_start == period_end (empty half-open window) fails ERR_INVALID_WINDOW at cycle creation — equality is rejected for half-open periods."
        test_recipe:
          setup: ["Facility F"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-H4", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW (http 422)"]

      - name: record_create_cross_facility_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_CROSS_FACILITY_REFERENCE]"]
        distinguishing_aspect: "A record whose facility_id (F1) disagrees with its cycle's facility (F2) fails ERR_CROSS_FACILITY_REFERENCE even though every referenced id exists and the cycle is OPEN."
        test_recipe:
          setup: ["Facilities F1, F2; item SI1 at F1; cycle CY2 OPEN at F2"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F1", cms_certification_number: "CCN-H5A", bed_count: 50 }, as: PlatformAdmin, captures: { f1: $.data.id } }
            - { call: "POST /transparency/facilities", payload: { name: "F2", cms_certification_number: "CCN-H5B", bed_count: 50 }, as: PlatformAdmin, captures: { f2: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${f1}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${f2}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy2: $.data.id } }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${f1}", publication_cycle_id: "${cy2}", service_item_id: "${si1}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CROSS_FACILITY_REFERENCE (http 422)"]

      - name: discrepancy_record_cycle_mismatch_isolated
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_RECORD_CYCLE_MISMATCH]"]
        distinguishing_aspect: "With the cycle state check PASSING (CY_A is PUBLISHED), the referential mismatch alone fires: R_B belongs to CY_B, not CY_A -> ERR_RECORD_CYCLE_MISMATCH."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI; CY_A [2026-08-01, 2026-09-01) PUBLISHED with record R_A; CY_B [2026-09-01, 2026-10-01) OPEN with DRAFT record R_B"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-H6", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cya: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cya}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { ra: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${ra}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cya}/freeze", as: TransparencyOfficer, captures: { cya_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cya}", file_format: "JSON", expected_publication_cycle_version: "${cya_v}" }, as: TransparencyOfficer, captures: { fa: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${fa}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cya}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyb: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cyb}", service_item_id: "${si}", discounted_cash_cents: 51000 }, as: TransparencyOfficer, captures: { rb: $.data.id } }
          trigger:
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cya}", standard_charge_record_id: "${rb}", reporter_type: "CONSUMER", description: "mismatch" }, as: Consumer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_RECORD_CYCLE_MISMATCH (http 422) — CY_A is PUBLISHED so only the referential rule can fire"]

      - name: supersede_target_must_be_published_or_flagged
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SUPERSEDE_TARGET_INVALID]", "entities.StandardChargeRecord.fields.supersedes_id"]
        distinguishing_aspect: "supersedes_id referencing a DRAFT record (not PUBLISHED/FLAGGED) fails ERR_SUPERSEDE_TARGET_INVALID at record creation."
