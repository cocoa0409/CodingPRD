            - "Dispatch.${dsp_id}.status == DRAFT, route_minutes == null, estimated_reimbursement_cents == null"
            - "Driver.${drv_id}.qualification_status == SUSPENDED"
            - "isolation control: after a REINSTATE decision by ComplianceOfficer co-2 the same lock call returns HTTP 422 ERR_DISPATCH_HAS_NO_STOPS, proving priority 25 is implemented and was merely outranked here"

      - name: dispatcher_cannot_settle_so_authz_error_outranks_dispatch_state_error
        grounds:
          - validations.priority_3
          - validations.priority_12
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_DISPATCH_STATE
          - roles.Dispatcher
          - endpoints.POST_dispatch_settle
        distinguishing_aspect: |
          Settling is exclusive to StoreManager. A Dispatcher calling settle on a
          DRAFT dispatch violates priority 3 (authz, 403 ERR_UNAUTHORIZED) and
          priority 12 (state, 409 ERR_INVALID_DISPATCH_STATE). The authz rung
          must fire, which also means the caller learns nothing about the
          dispatch's state. This pair spans the widest gap in the ladder (3 vs
          12) and crosses the authz/business boundary, unlike the two sibling
          instances which pair rungs inside the business band.
        test_recipe:
          setup:
            - "A store, a CAR cost model, one QUALIFIED insured CAR driver, and a brand-new dispatch with no stops, still in DRAFT."
