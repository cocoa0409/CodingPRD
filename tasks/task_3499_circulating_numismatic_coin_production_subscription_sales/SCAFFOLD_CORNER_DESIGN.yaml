      - name: program_sales_window_opens_and_closes_on_clock
        claim_type: valid_transition
        grounds: ["state_machines.CommemorativeProgram.APPROVED_FOR_SALE_to_ON_SALE", "state_machines.CommemorativeProgram.ON_SALE_to_SALES_CLOSED"]
        distinguishing_aspect: "Time-based transitions fire only on clock-set sweeps: before window start the program stays APPROVED_FOR_SALE; at window start it flips ON_SALE; at window end it flips SALES_CLOSED."
        test_recipe:
          setup: ["approved program with window 2026-09-15T00:00:00Z to 2026-12-31T00:00:00Z"]
          setup_api_calls:
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Window Program", statute_reference: "PL 119-21", max_mintage_legal: 5000, surcharge_cents_per_unit: 500, beneficiary_name: "Window Fund", beneficiary_cap_cents: 100000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /mint/commemorative-programs/${prog_id}/decide-design"
              payload: { decision: "APPROVED" }
              as: MintDirector
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/commemorative-programs/${prog_id}"
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/commemorative-programs/${prog_id}"
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/commemorative-programs/${prog_id}"
              as: ProgramManager
          assert:
            - "at 2026-09-14: status == APPROVED_FOR_SALE (window not yet open)"
            - "at 2026-09-15: status == ON_SALE (inclusive window start)"
            - "at 2026-12-31: status == SALES_CLOSED (inclusive window end)"

