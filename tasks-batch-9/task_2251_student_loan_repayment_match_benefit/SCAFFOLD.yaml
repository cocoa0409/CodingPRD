scenario: "2251. Student Loan Repayment Match Benefit (employer retirement plan sponsor): employee certification of qualified student loan payments with annual claim procedures, match calculation mirroring elective deferral match formulas and limits, interaction with plan deferral match to prevent double counting, nondiscrimination testing treatment of the match contribution, payroll and recordkeeper data exchange for certification and funding, mid-year employment change, leave and forfeiture handling, plan document amendment and participant communication, audit documentation of certifications and correction of erroneous matches"
domain_name: student-loan-repayment-match-benefit
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Flat topology: every entity is a top-level collection linked by explicit FK
    fields; no nesting in URL paths except the two convenience sub-resource reads
    (`/loan-certifications/{id}/lines`, `/employees/{id}/audit-packet`).
    The core coupling is a single shared statutory tier space (3% at 100% +
    2% at 50% of eligible compensation, capped by the annual elective-deferral
    dollar limit) consumed by BOTH elective deferrals (ContributionRecord) and
    certified student-loan payments (LoanCertification). The same certified
    dollars produce two different match totals depending on whether they are
    mirrored per payroll period (PAY_PERIOD_MIRROR) or reconciled annually
    (ANNUAL_TRUE_UP) — that divergence is the benchmark's ledger-reconciliation
    core, and it propagates into ACP nondiscrimination testing, funding batches,
    vesting forfeiture and correction of erroneous matches.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: PlanYear
    parent: null
    common_fields: true
    fields:
      - name: year
        type: integer
        source: input
        description: Calendar plan year the QSLP match program covers
        constraints: "2024..2099; unique across PlanYear"
      - name: status
        type: enum
        source: system
        description: Plan-year lifecycle state
        default: DRAFT
        constraints: "DRAFT | OPEN | LOCKED | CLOSED"
      - name: period_start
        type: datetime
        source: input
        description: First instant of the plan year (inclusive)
      - name: period_end
        type: datetime
        source: input
        description: Last instant of the plan year (inclusive)
      - name: certification_window_open
        type: datetime
        source: input
        description: First instant at which a certification may be submitted (inclusive)
      - name: certification_deadline
        type: datetime
        source: input
        description: Last instant at which a certification may be submitted (inclusive)
      - name: compensation_cap_cents
        type: integer
        source: input
        description: Annual compensation ceiling counted for match purposes
        default: 34500000
      - name: annual_deferral_limit_cents
        type: integer
        source: input
        description: Statutory annual elective-deferral dollar limit; also caps certified QSLP amounts
        default: 2300000
      - name: hce_prior_comp_threshold_cents
        type: integer
        source: input
        description: Prior-year compensation above which an employee is a highly compensated employee
        default: 15500000
      - name: tier1_pct
        type: number
        source: input
        description: First match tier expressed as a fraction of counted compensation
        default: 0.03
      - name: tier1_match_rate
        type: number
        source: input
        description: Match rate applied to tier-1 contributions
        default: 1.00
      - name: tier2_pct
        type: number
        source: input
        description: Second match tier expressed as a fraction of counted compensation
        default: 0.02
      - name: tier2_match_rate
        type: number
        source: input
        description: Match rate applied to tier-2 contributions
        default: 0.50
      - name: nondiscrimination_test_method
        type: enum
        source: input
        description: Default ACP testing method for this plan year
        default: CURRENT_YEAR
        constraints: "CURRENT_YEAR | PRIOR_YEAR"
      - name: prior_year_nhce_acp
        type: number
        source: input
        description: Stored prior-year non-highly-compensated average contribution percentage (4 decimal places), used only by the PRIOR_YEAR test method
        default: 0.0000
      - name: unpaid_leave_day_cap
        type: integer
        source: input
        description: Maximum merged unpaid-leave days one employee may accrue inside the plan year
        default: 180
      - name: leave_merge_buffer_days
        type: integer
        source: input
        description: Buffer in days used by the leave-interval conflict rule and by unpaid-leave merging
        default: 14
      - name: total_deferral_match_funded_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.deferral_match_cents for periods of this plan year) + sum(CorrectionAdjustment.amount_cents where plan_year_id == this.id AND reason_code == ACP_CORRECTIVE_FORFEITURE)"
        default: 0
      - name: total_qslp_match_funded_cents
        type: integer
        source: computed
        description: "Derived conserved quantity Q1: sum(MatchAllocation.amount_cents where plan_year_id == this.id AND funding_status IN {SCHEDULED, FUNDED}) + sum(CorrectionAdjustment.amount_cents where plan_year_id == this.id AND reason_code == TRUE_UP_RECOUPMENT)"
        default: 0
      - name: forfeiture_balance_cents
        type: integer
        source: computed
        description: "Derived: unapplied forfeiture pool remaining after the forfeiture_offset_waterfall calculation distributes ForfeitureRecord amounts across PENDING FundingBatch rows of this plan year"
        default: 0
      - name: accepted_certification_count
        type: integer
        source: computed
        description: "Derived: count of LoanCertification rows with plan_year_id == this.id AND status IN {ACCEPTED, AUDIT_HOLD}"
        default: 0
      - name: true_up_completed
        type: boolean
        source: system
        description: Set true by the first successful annual true-up run for this plan year
        default: false
      - name: reopened_count
        type: integer
        source: system
        description: Number of LOCKED -> OPEN reopen transitions applied to this plan year
        default: 0

  - name: PlanAmendment
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; the plan year whose QSLP match feature this amendment authorizes"
      - name: document_ref
        type: string
        source: input
        description: Reference to the executed plan-document amendment page
      - name: effective_date
        type: datetime
        source: input
        description: Date on or after which the amendment may be declared EFFECTIVE
      - name: status
        type: enum
        source: system
        description: Amendment adoption and participant-communication state
        default: DRAFTED
        constraints: "DRAFTED | ADOPTED | NOTICE_SENT | EFFECTIVE | RESCINDED"
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFTED -> ADOPTED transition; null before it
      - name: notice_sent_at
        type: datetime
        source: system
        description: Logical-clock instant participant notice was recorded; null before it
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant of the NOTICE_SENT -> EFFECTIVE transition; null before it
      - name: notice_channel
        type: enum
        source: input
        description: Channel used for the participant communication; required on the NOTICE_SENT transition
        constraints: "EMAIL | MAIL | PORTAL"
      - name: rescinded_reason
        type: string
        source: input
        description: Free-text reason captured on a RESCINDED transition; null otherwise

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: external_id
        type: string
        source: input
        description: Sponsor payroll identifier
        constraints: "unique across Employee"
      - name: hire_date
        type: datetime
        source: input
        description: Original hire date
      - name: prior_year_compensation_cents
        type: integer
        source: input
        description: Prior plan-year compensation used solely for HCE determination
      - name: vesting_service_months
        type: integer
        source: input
        description: Completed months of vesting service as of the plan-year end
        default: 0
      - name: employment_status
        type: enum
        source: system
        description: Employment / leave state
        default: ACTIVE
        constraints: "ACTIVE | LEAVE_UNPAID | LEAVE_PAID | TERMINATED | REHIRED"
      - name: termination_date
        type: datetime
        source: system
        description: Effective date of the most recent TERMINATE employment event; null if never terminated
      - name: rehire_date
        type: datetime
        source: system
        description: Effective date of the most recent REHIRE employment event; null if never rehired
      - name: hce_flag
        type: boolean
        source: computed
        description: "Derived by calculations.hce_determination: true when prior_year_compensation_cents > OPEN PlanYear.hce_prior_comp_threshold_cents (strictly greater)"
        default: false
      - name: ytd_eligible_compensation_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.counted_compensation_cents for this employee across payroll periods of the unique OPEN PlanYear; null-safe zero when none)"
        default: 0
      - name: ytd_deferral_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.elective_deferral_cents for this employee in the unique OPEN PlanYear"
        default: 0
      - name: ytd_deferral_match_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.deferral_match_cents for this employee in the unique OPEN PlanYear"
        default: 0
      - name: ytd_qslp_match_cents
        type: integer
        source: computed
        description: "Derived: sum(MatchAllocation.amount_cents for this employee in the unique OPEN PlanYear where funding_status IN {SCHEDULED, FUNDED})"
        default: 0
      - name: remaining_qslp_space_cents
        type: integer
        source: computed
        description: "Derived conserved quantity Q2: max(OPEN PlanYear.annual_deferral_limit_cents - ytd_deferral_cents - sum(LoanCertification.certified_total_cents for this employee in that plan year with status IN {SUBMITTED, ACCEPTED, AUDIT_HOLD}), 0); null when no PlanYear has status == OPEN"
      - name: vested_pct
        type: number
        source: computed
        description: "Derived by calculations.vesting_and_forfeiture cliff schedule over vesting_service_months"
        default: 0.00
      - name: unpaid_leave_days_ytd
        type: integer
        source: computed
        description: "Derived by calculations.unpaid_leave_days: merged inclusive day count of LeaveEvent rows with leave_type == UNPAID intersecting the OPEN PlanYear window"
        default: 0

  - name: LeaveEvent
    parent: null
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee whose leave interval this row occupies"
      - name: leave_type
        type: enum
        source: input
        description: Leave category
        constraints: "UNPAID | PAID_FMLA | MILITARY"
      - name: start_date
        type: datetime
        source: input
        description: First day of leave (inclusive)
      - name: end_date
        type: datetime
        source: input
        description: Last day of leave (inclusive)
      - name: day_count
        type: integer
        source: computed
        description: "Derived: inclusive whole-day count between start_date and end_date"

  - name: PayrollPeriod
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year this payroll period belongs to"
      - name: period_number
        type: integer
        source: input
        description: Ordinal of the period inside the plan year; drives chronological processing order
        constraints: ">= 1; unique per plan_year_id"
      - name: start_date
        type: datetime
        source: input
        description: First instant of the pay period (inclusive)
      - name: end_date
        type: datetime
        source: input
        description: Last instant of the pay period (inclusive)
      - name: pay_date
        type: datetime
        source: input
        description: Date wages for this period are paid
      - name: status
        type: enum
        source: system
        description: Payroll-period state
        default: OPEN
        constraints: "OPEN | CLOSED | FUNDED"
      - name: reopen_count
        type: integer
        source: system
        description: Number of CLOSED -> OPEN reopen transitions applied to this period
        default: 0
      - name: total_eligible_compensation_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.counted_compensation_cents where payroll_period_id == this.id)"
        default: 0
      - name: total_deferral_match_cents
        type: integer
        source: computed
        description: "Derived: sum(ContributionRecord.deferral_match_cents where payroll_period_id == this.id)"
        default: 0

  - name: ContributionRecord
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee the payroll line belongs to"
      - name: payroll_period_id
        type: string
        source: input
        description: "FK -> PayrollPeriod.id; payroll period the line belongs to"
      - name: eligible_compensation_cents
        type: integer
        source: input
        description: Plan-eligible compensation paid in the period (0 allowed for unpaid-leave periods)
        constraints: ">= 0"
      - name: elective_deferral_cents
        type: integer
        source: input
        description: Elective deferral withheld in the period
        constraints: ">= 0"
      - name: counted_compensation_cents
        type: integer
        source: computed
        description: "Derived by calculations.deferral_match_per_period after applying the annual compensation cap accumulator"
      - name: deferral_match_cents
        type: integer
        source: computed
        description: "Derived by calculations.deferral_match_per_period tiered formula"
      - name: qslp_space_tier1_cents
        type: integer
        source: computed
        description: "Derived: tier-1 match space this period left unused by elective deferrals"
      - name: qslp_space_tier2_cents
        type: integer
        source: computed
        description: "Derived: tier-2 match space this period left unused by elective deferrals"

  - name: LoanAccount
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; borrower"
      - name: servicer_name
        type: string
        source: input
        description: Student-loan servicer name
      - name: account_last4
        type: string
        source: input
        description: Last four characters of the loan account number
        constraints: "exactly 4 digits"
      - name: original_principal_cents
        type: integer
        source: input
        description: Original principal balance
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Verification state of the loan as qualified education debt of the employee
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | DISQUALIFIED"
      - name: evidence_ref
        type: string
        source: input
        description: Reference to the servicer statement supporting verification; null while UNVERIFIED

  - name: LoanCertification
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; certifying employee"
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year the annual claim covers"
      - name: supersedes_certification_id
        type: string
        source: input
        description: "FK -> LoanCertification.id; self-referential link to the ACCEPTED certification this claim replaces; null for a first claim"
      - name: certification_method
        type: enum
        source: input
        description: Evidence standard used for the annual claim
        constraints: "SELF_CERTIFICATION | SERVICER_STATEMENT"
      - name: status
        type: enum
        source: system
        description: Annual claim lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | ACCEPTED | AUDIT_HOLD | VOIDED | SUPERSEDED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit; null while DRAFT
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent accept/return decision; null before it
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the BenefitsAdministrator who accepted the claim; anchors the segregation-of-duties rule
      - name: return_count
        type: integer
        source: system
        description: Number of ACCEPT-less RETURN decisions applied to this claim
        default: 0
      - name: certified_total_cents
        type: integer
        source: computed
        description: "Derived: sum(CertificationLine.amount_cents where certification_id == this.id)"
        default: 0
      - name: eligible_total_cents
        type: integer
        source: computed
        description: "Derived by calculations.qslp_eligible_amount at ACCEPT time after applying the statutory annual room; 0 while not yet accepted"
        default: 0
      - name: matched_total_cents
        type: integer
        source: computed
        description: "Derived: sum(MatchAllocation.amount_cents where certification_id == this.id AND funding_status IN {SCHEDULED, FUNDED})"
        default: 0
      - name: unmatched_eligible_cents
        type: integer
        source: computed
        description: "Derived: eligible_total_cents - sum(MatchAllocation.tier1_applied_cents + MatchAllocation.tier2_applied_cents where certification_id == this.id AND funding_status IN {SCHEDULED, FUNDED})"
        default: 0
      - name: capped_by_statutory_room
        type: boolean
        source: computed
        description: "Derived: true when eligible_total_cents < certified_total_cents after the ACCEPT-time statutory room cap"
        default: false
      - name: audit_hold_reason
        type: string
        source: input
        description: Reason recorded when a ComplianceAuditor places the claim on AUDIT_HOLD; null otherwise
      - name: void_reason
        type: string
        source: input
        description: Note recorded when an audit release voids the claim; null otherwise

  - name: CertificationLine
    parent: null
    common_fields: false
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> LoanCertification.id; annual claim this payment line belongs to"
      - name: loan_account_id
        type: string
        source: input
        description: "FK -> LoanAccount.id; loan the certified payment was made against"
      - name: payment_date
        type: datetime
        source: input
        description: Date the qualified payment was made
      - name: amount_cents
        type: integer
        source: input
        description: Certified payment amount
        constraints: "> 0"
      - name: covered_period_start
        type: datetime
        source: input
        description: First instant of the loan billing window the payment covers (inclusive)
      - name: covered_period_end
        type: datetime
        source: input
        description: End instant of the covered window (EXCLUSIVE — half-open [start, end))
        constraints: "> covered_period_start"

  - name: MatchAllocation
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee receiving the QSLP match"
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year the allocation belongs to"
      - name: certification_id
        type: string
        source: input
        description: "FK -> LoanCertification.id; claim that produced a MIRROR allocation; null for TRUE_UP allocations"
      - name: payroll_period_id
        type: string
        source: input
        description: "FK -> PayrollPeriod.id; period whose unused tier space the MIRROR allocation consumed; null for TRUE_UP allocations"
      - name: funding_batch_id
        type: string
        source: input
        description: "FK -> FundingBatch.id; batch carrying the allocation to the recordkeeper; null while no PENDING batch exists"
      - name: allocation_type
        type: enum
        source: system
        description: Which QSLP variant produced this allocation
        constraints: "MIRROR | TRUE_UP"
      - name: amount_cents
        type: integer
        source: computed
        description: "Derived by calculations.qslp_mirror_allocation (MIRROR) or calculations.qslp_annual_true_up (TRUE_UP)"
      - name: tier1_applied_cents
        type: integer
        source: computed
        description: "Derived: certified dollars this allocation consumed from tier-1 space (0 for TRUE_UP)"
        default: 0
      - name: tier2_applied_cents
        type: integer
        source: computed
        description: "Derived: certified dollars this allocation consumed from tier-2 space (0 for TRUE_UP)"
        default: 0
      - name: funding_status
        type: enum
        source: system
        description: First independent state dimension — money movement toward the recordkeeper
        default: UNFUNDED
        constraints: "UNFUNDED | SCHEDULED | FUNDED | REVERSED"
      - name: vesting_status
        type: enum
        source: system
        description: Second independent state dimension — vesting outcome of the same allocation
        default: UNVESTED
        constraints: "UNVESTED | PARTIALLY_VESTED | FULLY_VESTED | FORFEITED"
      - name: vested_cents
        type: integer
        source: computed
        description: "Derived by calculations.vesting_and_forfeiture: round_half_up(amount_cents * Employee.vested_pct)"
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: "Derived: amount_cents - vested_cents once vesting has been evaluated; 0 before"
        default: 0

  - name: FundingBatch
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year funded by this batch"
      - name: payroll_period_id
        type: string
        source: input
        description: "FK -> PayrollPeriod.id; payroll period the batch settles"
      - name: status
        type: enum
        source: system
        description: Recordkeeper data-exchange state
        default: PENDING
        constraints: "PENDING | TRANSMITTED | SETTLED | REJECTED"
      - name: total_allocated_cents
        type: integer
        source: computed
        description: "Derived: sum(MatchAllocation.amount_cents where funding_batch_id == this.id AND funding_status != REVERSED)"
        default: 0
      - name: allocation_count
        type: integer
        source: computed
        description: "Derived: count(MatchAllocation where funding_batch_id == this.id AND funding_status != REVERSED)"
        default: 0
      - name: forfeiture_offset_cents
        type: integer
        source: computed
        description: "Derived by calculations.forfeiture_offset_waterfall; always 0 unless status == PENDING"
        default: 0
      - name: net_funding_cents
        type: integer
        source: computed
        description: "Derived: total_allocated_cents - forfeiture_offset_cents"
        default: 0
      - name: transmitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent PENDING -> TRANSMITTED transition; null before it
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of the TRANSMITTED -> SETTLED transition; null otherwise
      - name: rejection_code
        type: string
        source: input
        description: Recordkeeper rejection code recorded on a TRANSMITTED -> REJECTED settlement; null otherwise
      - name: retransmit_count
        type: integer
        source: system
        description: Number of REJECTED -> PENDING -> TRANSMITTED retransmission cycles
        default: 0

  - name: ForfeitureRecord
    parent: null
    common_fields: false
    fields:
      - name: match_allocation_id
        type: string
        source: input
        description: "FK -> MatchAllocation.id; allocation whose unvested portion was forfeited"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee whose allocation was forfeited"
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year whose forfeiture pool receives the amount"
      - name: amount_cents
        type: integer
        source: computed
        description: "Derived: MatchAllocation.forfeited_cents at the moment vesting was evaluated"
      - name: reason_code
        type: enum
        source: system
        description: Why the forfeiture arose
        constraints: "TERMINATION_UNVESTED | TERMINATION_PARTIAL_VESTING"

  - name: CorrectionAdjustment
    parent: null
    common_fields: false
    fields:
      - name: match_allocation_id
        type: string
        source: input
        description: "FK -> MatchAllocation.id; allocation corrected; null for ACP corrective forfeitures and negative true-ups that reference no allocation"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee whose match ledger is adjusted"
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year whose funded totals the adjustment reconciles"
      - name: nondiscrimination_test_id
        type: string
        source: input
        description: "FK -> NondiscriminationTest.id; test whose correction produced this adjustment; null otherwise"
      - name: reason_code
        type: enum
        source: input
        description: Audit reason for the adjustment
        constraints: "ERRONEOUS_MATCH | CERTIFICATION_VOID | TRUE_UP_RECOUPMENT | ACP_CORRECTIVE_FORFEITURE"
      - name: amount_cents
        type: integer
        source: computed
        description: "Derived signed amount; negative values remove previously credited match"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that produced the adjustment (audit documentation)
      - name: note
        type: string
        source: input
        description: Free-text audit note; null when omitted

  - name: NondiscriminationTest
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year under test"
      - name: test_method
        type: enum
        source: input
        description: Which NHCE average the limit is built from
        constraints: "CURRENT_YEAR | PRIOR_YEAR"
      - name: include_qslp_match
        type: boolean
        source: input
        description: Whether QSLP match allocations enter each participant's contribution ratio; recorded on compute
        default: true
      - name: status
        type: enum
        source: system
        description: Test lifecycle state
        default: PENDING
        constraints: "PENDING | PASSED | FAILED | CORRECTED | STALE"
      - name: hce_acp
        type: number
        source: computed
        description: "Derived by calculations.acp_test: average of rounded HCE contribution ratios (4 dp)"
        default: 0.0000
      - name: nhce_acp
        type: number
        source: computed
        description: "Derived by calculations.acp_test: CURRENT_YEAR average of rounded NHCE ratios, or PlanYear.prior_year_nhce_acp under PRIOR_YEAR (4 dp)"
        default: 0.0000
      - name: limit_acp
        type: number
        source: computed
        description: "Derived by calculations.acp_test limit formula (4 dp)"
        default: 0.0000
      - name: hce_count
        type: integer
        source: computed
        description: "Derived: count of participants in the HCE group"
        default: 0
      - name: nhce_count
        type: integer
        source: computed
        description: "Derived: count of participants in the NHCE group"
        default: 0
      - name: computed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent compute; null while PENDING
      - name: correction_method
        type: enum
        source: input
        description: Correction technique applied to a FAILED test; null otherwise
        constraints: "QNEC | CORRECTIVE_FORFEITURE"
      - name: total_correction_cents
        type: integer
        source: computed
        description: "Derived: sum(CorrectionAdjustment.amount_cents where nondiscrimination_test_id == this.id)"
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PlanYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /plan-years/{plan_year_id}/status with to_status=OPEN"
        actor: BenefitsAdministrator
        preconditions:
          - "no other PlanYear has status == OPEN (else ERR_MULTIPLE_OPEN_PLAN_YEARS)"
          - "period_start < period_end and certification_window_open <= certification_deadline"
        side_effects:
          - "Employee.hce_flag recomputed for every Employee against this plan year's hce_prior_comp_threshold_cents"
          - "Employee.remaining_qslp_space_cents becomes non-null for every Employee"
          - "increments PlanYear.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /plan-years/{plan_year_id}/status with to_status=LOCKED"
        actor: BenefitsAdministrator
        preconditions:
          - "no LoanCertification with this plan_year_id has status IN {SUBMITTED, AUDIT_HOLD} (else ERR_CERTIFICATION_STATE_INVALID)"
        side_effects:
          - "certification submission is closed for the plan year"
          - "the annual true-up run becomes available"
          - "increments PlanYear.version by 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /plan-years/{plan_year_id}/status with to_status=OPEN"
        actor: BenefitsAdministrator
        preconditions:
          - "no NondiscriminationTest with this plan_year_id has status IN {PASSED, CORRECTED} (else ERR_TEST_ALREADY_FINAL)"
        side_effects:
          - "increments PlanYear.reopened_count by 1"
          - "sets PlanYear.true_up_completed = false so a corrected true-up may re-run"
          - "increments PlanYear.version by 1"
        note: "Revision loop: LOCKED -> OPEN -> LOCKED may repeat; each pass re-opens the true-up run."
      - from: LOCKED
        to: CLOSED
        trigger: "POST /plan-years/{plan_year_id}/status with to_status=CLOSED"
        actor: BenefitsAdministrator
        preconditions:
          - "no FundingBatch with this plan_year_id has status IN {PENDING, TRANSMITTED} (else ERR_BATCH_STATE_INVALID)"
        side_effects:
          - "Employee.remaining_qslp_space_cents becomes null once no PlanYear is OPEN"
          - "increments PlanYear.version by 1"

  - entity: PlanAmendment
    initial_state: DRAFTED
    terminal_states: [EFFECTIVE, RESCINDED]
    transitions:
      - from: DRAFTED
        to: ADOPTED
        trigger: "POST /plan-amendments/{amendment_id}/status with to_status=ADOPTED"
        actor: BenefitsAdministrator
        preconditions:
          - "referenced PlanYear.status IN {DRAFT, OPEN}"
        side_effects:
          - "sets PlanAmendment.adopted_at = current logical clock"
          - "increments PlanAmendment.version by 1"
      - from: ADOPTED
        to: NOTICE_SENT
        trigger: "POST /plan-amendments/{amendment_id}/status with to_status=NOTICE_SENT and notice_channel"
        actor: BenefitsAdministrator
        preconditions:
          - "notice_channel present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets PlanAmendment.notice_sent_at = current logical clock and stores notice_channel"
          - "increments PlanAmendment.version by 1"
      - from: NOTICE_SENT
        to: EFFECTIVE
        trigger: "POST /plan-amendments/{amendment_id}/status with to_status=EFFECTIVE"
        actor: BenefitsAdministrator
        preconditions:
          - "current logical clock >= PlanAmendment.effective_date (else ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE)"
          - "referenced PlanYear.status IN {DRAFT, OPEN}"
        side_effects:
          - "sets PlanAmendment.effective_at = current logical clock"
          - "unblocks LoanCertification SUBMITTED -> ACCEPTED for the plan year"
          - "increments PlanAmendment.version by 1"
      - from: ADOPTED
        to: RESCINDED
        trigger: "POST /plan-amendments/{amendment_id}/status with to_status=RESCINDED and rescinded_reason"
        actor: BenefitsAdministrator
        preconditions:
          - "rescinded_reason present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "stores rescinded_reason; the amendment can no longer become EFFECTIVE"
          - "increments PlanAmendment.version by 1"
      - from: NOTICE_SENT
        to: RESCINDED
        trigger: "POST /plan-amendments/{amendment_id}/status with to_status=RESCINDED and rescinded_reason"
        actor: BenefitsAdministrator
        preconditions:
          - "rescinded_reason present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "stores rescinded_reason; participant notice is retracted"
          - "increments PlanAmendment.version by 1"
        note: "Branching shape: ADOPTED and NOTICE_SENT each fork to EFFECTIVE (forward) or RESCINDED (abandon) with disjoint side-effect sets."

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LEAVE_UNPAID
        trigger: "POST /leave-events with leave_type=UNPAID whose [start_date, end_date] contains the current logical clock"
        actor: BenefitsAdministrator
        preconditions:
          - "employment_status != TERMINATED"
          - "no LeaveEvent conflict per validations[priority=42]"
          - "merged unpaid-leave days after this event <= OPEN PlanYear.unpaid_leave_day_cap"
        side_effects:
          - "sets Employee.employment_status = LEAVE_UNPAID"
          - "recomputes Employee.unpaid_leave_days_ytd"
          - "increments Employee.version by 1"
      - from: LEAVE_UNPAID
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc advancing past the leave end_date, observed on the next read of the employee"
        actor: system
        preconditions:
          - "current logical clock > LeaveEvent.end_date of every UNPAID leave of this employee"
        side_effects:
          - "sets Employee.employment_status = ACTIVE"
          - "increments Employee.version by 1"
        note: "Cycle: ACTIVE -> LEAVE_UNPAID -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /employees/{employee_id}/employment-events with event_type=TERMINATE"
        actor: BenefitsAdministrator
        preconditions:
          - "employment_status IN {ACTIVE, LEAVE_UNPAID, LEAVE_PAID, REHIRED}"
        side_effects:
          - "sets Employee.termination_date = effective_date"
          - "runs calculations.vesting_and_forfeiture over the employee's MatchAllocation rows (cascade link 1)"
          - "each partially/fully unvested allocation creates a ForfeitureRecord (cascade link 2)"
          - "PlanYear.forfeiture_balance_cents recomputed from the new ForfeitureRecord rows (cascade link 3)"
          - "calculations.forfeiture_offset_waterfall recomputes forfeiture_offset_cents and net_funding_cents on every PENDING FundingBatch of the plan year (cascade link 4)"
          - "increments Employee.version by 1"
      - from: TERMINATED
        to: REHIRED
        trigger: "POST /employees/{employee_id}/employment-events with event_type=REHIRE"
        actor: BenefitsAdministrator
        preconditions:
          - "employment_status == TERMINATED"
          - "effective_date > Employee.termination_date"
        side_effects:
          - "sets Employee.rehire_date = effective_date"
          - "vesting_service_months is preserved (no reset)"
          - "certification eligibility is restored (validations[priority=33] passes again)"
          - "increments Employee.version by 1"
      - from: REHIRED
        to: ACTIVE
        trigger: "POST /contribution-records for a payroll period whose start_date >= Employee.rehire_date"
        actor: PayrollOperator
        preconditions:
          - "employment_status == REHIRED"
        side_effects:
          - "sets Employee.employment_status = ACTIVE"
          - "increments Employee.version by 1"
        note: "Cycle: ACTIVE -> TERMINATED -> REHIRED -> ACTIVE closes the mid-year employment-change loop."

  - entity: PayrollPeriod
    initial_state: OPEN
    terminal_states: [FUNDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /payroll-periods/{payroll_period_id}/status with to_status=CLOSED"
        actor: PayrollOperator
        preconditions:
          - "PlanYear.status IN {OPEN, LOCKED}"
        side_effects:
          - "no further ContributionRecord may be created for the period"
          - "unblocks FundingBatch PENDING -> TRANSMITTED for the period"
          - "increments PayrollPeriod.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /payroll-periods/{payroll_period_id}/status with to_status=OPEN"
        actor: PayrollOperator
        preconditions:
          - "no FundingBatch with this payroll_period_id has status IN {TRANSMITTED, SETTLED} (else ERR_PERIOD_HAS_SETTLED_FUNDING)"
        side_effects:
          - "increments PayrollPeriod.reopen_count by 1"
          - "increments PayrollPeriod.version by 1"
        note: "Cycle: OPEN -> CLOSED -> OPEN for late payroll corrections."
      - from: CLOSED
        to: FUNDED
        trigger: "system event: the period's FundingBatch reaches SETTLED"
        actor: system
        preconditions:
          - "at least one FundingBatch with this payroll_period_id has status == SETTLED"
        side_effects:
          - "sets PayrollPeriod.status = FUNDED (terminal)"
          - "increments PayrollPeriod.version by 1"

  - entity: LoanCertification
    initial_state: DRAFT
    terminal_states: [VOIDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loan-certifications/{certification_id}/submit"
        actor: Employee
        preconditions:
          - "PlanYear.status == OPEN (else ERR_PLAN_YEAR_LOCKED)"
          - "Employee.employment_status != TERMINATED (else ERR_EMPLOYEE_NOT_ELIGIBLE)"
          - "certification_window_open <= current logical clock <= certification_deadline (else ERR_CERTIFICATION_WINDOW_CLOSED)"
          - "count(CertificationLine where certification_id == this.id) >= 1 (else ERR_NO_CERTIFIED_LINES)"
          - "max(PlanYear.annual_deferral_limit_cents - Employee.ytd_deferral_cents - sum(certified_total_cents of the employee's OTHER certifications in this plan year with status IN {SUBMITTED, ACCEPTED, AUDIT_HOLD}), 0) > 0 (else ERR_QSLP_SPACE_EXHAUSTED)"
        side_effects:
          - "sets LoanCertification.submitted_at = current logical clock"
          - "Employee.remaining_qslp_space_cents drops by certified_total_cents (this certification now counts in the reserved set)"
          - "increments Employee.version by 1"
          - "increments LoanCertification.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /loan-certifications/{certification_id}/decision with decision=RETURN"
        actor: BenefitsAdministrator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments LoanCertification.return_count by 1"
          - "sets decided_at = current logical clock"
          - "Employee.remaining_qslp_space_cents returns to its pre-submit value (RETURNED is outside the reserved status set) — conserved quantity Q2 restored"
          - "increments Employee.version by 1"
          - "increments LoanCertification.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /loan-certifications/{certification_id}/submit"
        actor: Employee
        preconditions:
          - "same preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "sets submitted_at = current logical clock"
          - "Employee.remaining_qslp_space_cents drops again by certified_total_cents"
          - "increments Employee.version by 1"
          - "increments LoanCertification.version by 1"
        note: "Cycle: SUBMITTED -> RETURNED -> SUBMITTED may repeat; return_count records the loop count."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /loan-certifications/{certification_id}/decision with decision=ACCEPT"
        actor: BenefitsAdministrator
        preconditions:
          - "status == SUBMITTED (else ERR_CERTIFICATION_STATE_INVALID)"
          - "a PlanAmendment for this plan_year_id has status == EFFECTIVE (else ERR_AMENDMENT_NOT_EFFECTIVE)"
          - "every CertificationLine of this certification references a LoanAccount with status == VERIFIED (else ERR_LOAN_NOT_VERIFIED)"
        side_effects:
          - "sets accepted_by_user_id = X-User-ID and decided_at = current logical clock"
          - "runs calculations.qslp_eligible_amount to set eligible_total_cents and capped_by_statutory_room"
          - "runs calculations.qslp_mirror_allocation which creates MatchAllocation rows with allocation_type=MIRROR (cascade link 1)"
          - "each new allocation attaches to the PENDING FundingBatch of its payroll period, setting funding_batch_id and funding_status=SCHEDULED, and recomputing FundingBatch.total_allocated_cents / allocation_count / net_funding_cents (cascade link 2)"
          - "PlanYear.total_qslp_match_funded_cents and accepted_certification_count recomputed from the batch-attached allocations (cascade link 3)"
          - "every NondiscriminationTest of this plan year with status IN {PASSED, FAILED} moves to STALE because the plan year's funded totals changed (cascade link 4)"
          - "if supersedes_certification_id is set, that certification moves ACCEPTED -> SUPERSEDED and its allocations are REVERSED"
          - "increments Employee.version by 1"
          - "increments PlanYear.version by 1"
          - "increments LoanCertification.version by 1"
      - from: ACCEPTED
        to: AUDIT_HOLD
        trigger: "POST /loan-certifications/{certification_id}/audit-hold"
        actor: ComplianceAuditor
        preconditions:
          - "status == ACCEPTED (else ERR_CERTIFICATION_STATE_INVALID)"
        side_effects:
          - "stores audit_hold_reason"
          - "allocations remain SCHEDULED/FUNDED; funded totals unchanged"
          - "increments LoanCertification.version by 1"
      - from: AUDIT_HOLD
        to: ACCEPTED
        trigger: "POST /loan-certifications/{certification_id}/audit-release with resolution=CLEAR"
        actor: ComplianceAuditor
        preconditions:
          - "status == AUDIT_HOLD (else ERR_CERTIFICATION_STATE_INVALID)"
        side_effects:
          - "clears audit_hold_reason"
          - "increments LoanCertification.version by 1"
        note: "Cycle: ACCEPTED -> AUDIT_HOLD -> ACCEPTED; audit review may repeat without changing money."
      - from: AUDIT_HOLD
        to: VOIDED
        trigger: "POST /loan-certifications/{certification_id}/audit-release with resolution=VOID"
        actor: ComplianceAuditor
        preconditions:
          - "status == AUDIT_HOLD (else ERR_CERTIFICATION_STATE_INVALID)"
          - "X-User-ID != LoanCertification.accepted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "stores void_reason"
          - "every MatchAllocation with this certification_id and funding_status IN {SCHEDULED, FUNDED} moves to REVERSED and detaches (funding_batch_id retained for audit, excluded from batch totals) (compensation link 1)"
          - "one CorrectionAdjustment per reversed allocation is created with reason_code=CERTIFICATION_VOID and amount_cents = -allocation.amount_cents (compensation link 2)"
          - "FundingBatch.total_allocated_cents / allocation_count / net_funding_cents recomputed (compensation link 3)"
          - "PlanYear.total_qslp_match_funded_cents returns to its pre-ACCEPT value — conserved quantity Q1 restored (compensation link 4)"
          - "Employee.remaining_qslp_space_cents returns to its pre-submit value"
          - "increments Employee.version by 1"
          - "increments PlanYear.version by 1"
          - "increments LoanCertification.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system event: a newer LoanCertification for the same employee and plan year is ACCEPTED with supersedes_certification_id == this.id"
        actor: system
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "every MatchAllocation of this certification with funding_status IN {SCHEDULED, FUNDED} moves to REVERSED"
          - "one CorrectionAdjustment per reversed allocation with reason_code=ERRONEOUS_MATCH and amount_cents = -allocation.amount_cents"
          - "FundingBatch and PlanYear derived totals recomputed"
          - "increments LoanCertification.version by 1"

  - entity: MatchAllocation
    initial_state: UNFUNDED
    terminal_states: [REVERSED]
    transitions:
      - from: UNFUNDED
        to: SCHEDULED
        trigger: "system event during POST /loan-certifications/{certification_id}/decision (ACCEPT) or POST /plan-years/{plan_year_id}/true-up when a PENDING FundingBatch exists for the target period"
        actor: system
        preconditions:
          - "a FundingBatch with status == PENDING exists for the allocation's plan year and target payroll period"
        side_effects:
          - "sets funding_batch_id and funding_status = SCHEDULED"
          - "recomputes FundingBatch.total_allocated_cents, allocation_count, net_funding_cents"
          - "recomputes PlanYear.total_qslp_match_funded_cents"
        note: "First state dimension (funding_status). When no PENDING batch exists the allocation stays UNFUNDED with funding_batch_id null."
      - from: SCHEDULED
        to: FUNDED
        trigger: "POST /funding-batches/{funding_batch_id}/settlement with outcome=SETTLED"
        actor: Recordkeeper
        preconditions:
          - "FundingBatch.status == TRANSMITTED"
        side_effects:
          - "sets funding_status = FUNDED for every SCHEDULED allocation of the batch"
          - "vesting_status is untouched by this transition (independent dimension)"
      - from: SCHEDULED
        to: REVERSED
        trigger: "POST /match-allocations/{allocation_id}/corrections, or a certification VOID/SUPERSEDE cascade"
        actor: BenefitsAdministrator
        preconditions:
          - "funding_status IN {SCHEDULED, FUNDED} (else ERR_CORRECTION_NOT_ALLOWED)"
        side_effects:
          - "creates a CorrectionAdjustment with amount_cents = -amount_cents"
          - "recomputes FundingBatch and PlanYear derived totals"
      - from: FUNDED
        to: REVERSED
        trigger: "POST /match-allocations/{allocation_id}/corrections"
        actor: BenefitsAdministrator
        preconditions:
          - "funding_status == FUNDED"
        side_effects:
          - "creates a CorrectionAdjustment with amount_cents = -amount_cents"
          - "recomputes FundingBatch and PlanYear derived totals"
      - from: UNVESTED
        to: FULLY_VESTED
        trigger: "system event at allocation creation when Employee.vested_pct == 1.00, or on TERMINATE evaluation with vested_pct == 1.00"
        actor: system
        preconditions:
          - "Employee.vested_pct == 1.00"
        side_effects:
          - "sets vesting_status = FULLY_VESTED and vested_cents = amount_cents"
        note: "Second, independent state dimension (vesting_status): it evolves on its own trigger set and never gates funding_status."
      - from: UNVESTED
        to: PARTIALLY_VESTED
        trigger: "POST /employees/{employee_id}/employment-events with event_type=TERMINATE when 0 < Employee.vested_pct < 1.00"
        actor: system
        preconditions:
          - "funding_status IN {SCHEDULED, FUNDED}"
          - "0 < Employee.vested_pct < 1.00"
        side_effects:
          - "sets vested_cents = round_half_up(amount_cents * vested_pct) and forfeited_cents = amount_cents - vested_cents"
          - "creates a ForfeitureRecord with reason_code = TERMINATION_PARTIAL_VESTING"
      - from: UNVESTED
        to: FORFEITED
        trigger: "POST /employees/{employee_id}/employment-events with event_type=TERMINATE when Employee.vested_pct == 0.00"
        actor: system
        preconditions:
          - "funding_status IN {SCHEDULED, FUNDED}"
          - "Employee.vested_pct == 0.00"
        side_effects:
          - "sets vested_cents = 0 and forfeited_cents = amount_cents"
          - "creates a ForfeitureRecord with reason_code = TERMINATION_UNVESTED"
          - "PlanYear.forfeiture_balance_cents and every PENDING FundingBatch offset recomputed"

  - entity: FundingBatch
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: TRANSMITTED
        trigger: "POST /funding-batches/{funding_batch_id}/transmit"
        actor: PayrollOperator
        preconditions:
          - "status == PENDING (else ERR_BATCH_STATE_INVALID)"
          - "the referenced PayrollPeriod.status == CLOSED (else ERR_PERIOD_NOT_CLOSED)"
          - "allocation_count >= 1 (else ERR_BATCH_EMPTY)"
        side_effects:
          - "sets transmitted_at = current logical clock"
          - "freezes forfeiture_offset_cents at its PENDING value (later forfeitures no longer offset this batch)"
          - "increments FundingBatch.version by 1"
      - from: TRANSMITTED
        to: SETTLED
        trigger: "POST /funding-batches/{funding_batch_id}/settlement with outcome=SETTLED"
        actor: Recordkeeper
        preconditions:
          - "status == TRANSMITTED (else ERR_BATCH_STATE_INVALID)"
        side_effects:
          - "sets settled_at = current logical clock"
          - "every SCHEDULED allocation of the batch moves to funding_status = FUNDED"
          - "the referenced PayrollPeriod moves CLOSED -> FUNDED"
          - "increments FundingBatch.version by 1"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /funding-batches/{funding_batch_id}/settlement with outcome=REJECTED and rejection_code"
        actor: Recordkeeper
        preconditions:
          - "status == TRANSMITTED (else ERR_BATCH_STATE_INVALID)"
          - "rejection_code present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "stores rejection_code; allocations stay SCHEDULED"
          - "increments FundingBatch.version by 1"
      - from: REJECTED
        to: PENDING
        trigger: "POST /funding-batches/{funding_batch_id}/transmit"
        actor: PayrollOperator
        preconditions:
          - "status == REJECTED"
        side_effects:
          - "increments retransmit_count by 1, clears rejection_code, then immediately re-enters TRANSMITTED in the same request"
          - "increments FundingBatch.version by 1"
        note: "Branching + cycle: PENDING -> TRANSMITTED -> {SETTLED | REJECTED}; REJECTED -> PENDING -> TRANSMITTED repeats."

  - entity: NondiscriminationTest
    initial_state: PENDING
    terminal_states: [CORRECTED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /nondiscrimination-tests/{test_id}/compute"
        actor: ComplianceAuditor
        preconditions:
          - "PlanYear.status IN {OPEN, LOCKED}"
          - "nhce_count >= 1 (else ERR_NO_NHCE_POPULATION)"
          - "computed hce_acp <= limit_acp"
        side_effects:
          - "stores hce_acp, nhce_acp, limit_acp, hce_count, nhce_count, include_qslp_match, computed_at"
          - "blocks PlanYear LOCKED -> OPEN (validations[priority=25] path via ERR_TEST_ALREADY_FINAL)"
          - "increments NondiscriminationTest.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /nondiscrimination-tests/{test_id}/compute"
        actor: ComplianceAuditor
        preconditions:
          - "PlanYear.status IN {OPEN, LOCKED}"
          - "nhce_count >= 1 (else ERR_NO_NHCE_POPULATION)"
          - "computed hce_acp > limit_acp"
        side_effects:
          - "stores the same computed fields as the PASSED branch"
          - "unblocks POST /nondiscrimination-tests/{test_id}/correction"
          - "increments NondiscriminationTest.version by 1"
        note: "Branching fork with divergent side-effect sets: PASSED locks the plan year against reopen, FAILED opens the correction path."
      - from: FAILED
        to: CORRECTED
        trigger: "POST /nondiscrimination-tests/{test_id}/correction"
        actor: ComplianceAuditor
        preconditions:
          - "status == FAILED (else ERR_TEST_ALREADY_FINAL)"
        side_effects:
          - "for every HCE participant whose rounded contribution ratio exceeds limit_acp, creates a CorrectionAdjustment with reason_code=ACP_CORRECTIVE_FORFEITURE, nondiscrimination_test_id = this.id and amount_cents = -round_half_up((participant_acr - limit_acp) * participant_counted_comp_cents)"
          - "recomputes PlanYear.total_deferral_match_funded_cents"
          - "sets total_correction_cents"
          - "increments NondiscriminationTest.version by 1"
      - from: PASSED
        to: STALE
        trigger: "system event: any change to the plan year's funded match totals (certification ACCEPT, VOID, allocation correction, or true-up run)"
        actor: system
        preconditions:
          - "status IN {PASSED, FAILED}"
        side_effects:
          - "sets status = STALE; stored ratios are retained for audit but no longer authoritative"
          - "unblocks PlanYear LOCKED -> OPEN again"
          - "increments NondiscriminationTest.version by 1"
      - from: FAILED
        to: STALE
        trigger: "system event: any change to the plan year's funded match totals"
        actor: system
        preconditions:
          - "status IN {PASSED, FAILED}"
        side_effects:
          - "sets status = STALE"
          - "increments NondiscriminationTest.version by 1"
      - from: STALE
        to: PASSED
        trigger: "POST /nondiscrimination-tests/{test_id}/compute"
        actor: ComplianceAuditor
        preconditions:
          - "nhce_count >= 1"
          - "recomputed hce_acp <= limit_acp"
        side_effects:
          - "overwrites the stored ratios with the recomputed values"
          - "increments NondiscriminationTest.version by 1"
        note: "Cycle: PASSED/FAILED -> STALE -> PASSED/FAILED as the ledger keeps moving."
      - from: STALE
        to: FAILED
        trigger: "POST /nondiscrimination-tests/{test_id}/compute"
        actor: ComplianceAuditor
        preconditions:
          - "nhce_count >= 1"
          - "recomputed hce_acp > limit_acp"
        side_effects:
          - "overwrites the stored ratios with the recomputed values"
          - "increments NondiscriminationTest.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: certification-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /loan-certifications"
    occ_field: "expected_employee_version"
    description: |
      Creating a LoanCertification against an Employee whose version has
      advanced since the client last read it is rejected. This captures the
      case where a newer claim has already been accepted for the same employee
      and plan year (legitimately superseding the prior one under the ACCEPTED
      -> SUPERSEDED transition) or a payroll line has changed the employee's
      remaining statutory space, so the submitting client's view of eligibility
      is stale.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
  - rule_id: allocation-correction-stale-plan-year
    parent_entity: PlanYear
    write_endpoint: "POST /match-allocations/{allocation_id}/corrections"
    occ_field: "expected_plan_year_version"
    description: |
      Recording a correction against a MatchAllocation whose PlanYear version
      has advanced since the client last read it is rejected. A correction is a
      legitimate supersede of the plan year's funded match ledger, so two
      corrections written from the same observed ledger snapshot would both
      claim to reconcile the same totals; the stale-version check forces the
      second writer to re-read the reconciled ledger first.
    error_id: ERR_STALE_PLAN_YEAR_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: hce_determination
    trigger: "on POST /employees, on PlanYear DRAFT -> OPEN, and on any read of Employee.hce_flag"
    algorithm: threshold
    formula: |
      py = the unique PlanYear with status == OPEN
      if py is null:
          hce_flag = false
      else:
          hce_flag = (Employee.prior_year_compensation_cents > py.hce_prior_comp_threshold_cents)
      # STRICTLY greater: prior-year compensation exactly equal to the threshold
      # is NOT highly compensated.
    input_set: "single Employee row; threshold read from the unique PlanYear with status == OPEN"
    constants:
      DEFAULT_HCE_THRESHOLD_CENTS: 15500000
    precision: "integer cents comparison; no rounding"

  - name: deferral_match_per_period
    trigger: "on POST /contribution-records (sets counted_compensation_cents, deferral_match_cents, qslp_space_tier1_cents, qslp_space_tier2_cents)"
    algorithm: chronological
    formula: |
      py = PlanYear of this.payroll_period
      # chronological accumulator over the employee's own periods in this plan year,
      # ordered by PayrollPeriod.period_number ASC, tie-break ContributionRecord.created_at ASC
      prior_counted = sum(cr.counted_compensation_cents
                          for cr of the same employee whose payroll_period.plan_year_id == py.id
                          and payroll_period.period_number < this.payroll_period.period_number)
      counted_compensation_cents = min(eligible_compensation_cents,
                                       max(py.compensation_cap_cents - prior_counted, 0))
      t1_cap = counted_compensation_cents * py.tier1_pct        # 3% of counted comp
      t2_cap = counted_compensation_cents * py.tier2_pct        # next 2% of counted comp
      t1_used = min(elective_deferral_cents, t1_cap)
      t2_used = min(max(elective_deferral_cents - t1_cap, 0), t2_cap)
      deferral_match_cents = round_half_up(t1_used * py.tier1_match_rate
                                          + t2_used * py.tier2_match_rate)
      qslp_space_tier1_cents = max(t1_cap - t1_used, 0)
      qslp_space_tier2_cents = max(t2_cap - t2_used, 0)
      # counted_compensation_cents == 0 (unpaid-leave period) yields all-zero caps,
      # zero match and zero QSLP space; no division occurs anywhere in this formula.
    input_set: "the ContributionRecord being created plus the employee's earlier ContributionRecords in the same plan year (period_number ASC)"
    constants:
      DEFAULT_TIER1_PCT: 0.03
      DEFAULT_TIER1_RATE: 1.00
      DEFAULT_TIER2_PCT: 0.02
      DEFAULT_TIER2_RATE: 0.50
      DEFAULT_COMPENSATION_CAP_CENTS: 34500000
    precision: "integer cents, round_half_up on the final match amount only"

  - name: qslp_eligible_amount
    trigger: "on POST /loan-certifications/{certification_id}/decision with decision=ACCEPT (sets eligible_total_cents and capped_by_statutory_room)"
    algorithm: threshold
    formula: |
      py = PlanYear of this certification
      certified_total_cents = sum(CertificationLine.amount_cents where certification_id == this.id)
      prior_claimed = sum(c.eligible_total_cents
                          for LoanCertification c of the same employee and plan year
                          with c.status IN {ACCEPTED, AUDIT_HOLD} and c.id != this.id)
      statutory_room = max(py.annual_deferral_limit_cents
                           - Employee.ytd_deferral_cents
                           - prior_claimed, 0)
      eligible_total_cents = min(certified_total_cents, statutory_room)
      capped_by_statutory_room = (eligible_total_cents < certified_total_cents)
      # statutory_room == 0 yields eligible_total_cents == 0, no MatchAllocation rows
      # and unmatched_eligible_cents == 0.
    input_set: "CertificationLine rows of this certification; the employee's ContributionRecords in the plan year; sibling certifications with status IN {ACCEPTED, AUDIT_HOLD}"
    constants:
      DEFAULT_ANNUAL_DEFERRAL_LIMIT_CENTS: 2300000
    precision: "integer cents; no rounding"

  - name: qslp_match_amount
    trigger: "on certification ACCEPT (PAY_PERIOD_MIRROR variant) and on POST /plan-years/{plan_year_id}/true-up (ANNUAL_TRUE_UP variant)"
    algorithm: waterfall_allocation
    formula: |
      # Shared premise for both variants: elective deferrals consume the tier
      # space FIRST; certified student-loan payments may only fill what is left.
      # The two variants measure that leftover space over different windows and
      # therefore produce different totals for identical data.
      base_entitlement(contribution_cents, comp_cents) =
          t1 = min(contribution_cents, comp_cents * tier1_pct)
          t2 = min(max(contribution_cents - comp_cents * tier1_pct, 0), comp_cents * tier2_pct)
          round_half_up(t1 * tier1_match_rate + t2 * tier2_match_rate)
    input_set: "the accepted certification's eligible_total_cents plus the employee's ContributionRecords in the plan year"
    constants:
      DEFAULT_TIER1_PCT: 0.03
      DEFAULT_TIER2_PCT: 0.02
      DEFAULT_TIER1_RATE: 1.00
      DEFAULT_TIER2_RATE: 0.50
    precision: "integer cents, round_half_up; MIRROR rounds once per payroll-period allocation, TRUE_UP rounds once on the annual entitlement"
    variants:
      - name: PAY_PERIOD_MIRROR
        when: "at LoanCertification SUBMITTED -> ACCEPTED; the interim variant that mirrors the elective-deferral match period by period"
        difference: "Walks payroll periods in period_number ASC order and fills each period's leftover tier space; certified dollars that find no leftover space in any period earn nothing, so the total can be strictly less than the annual entitlement."
      - name: ANNUAL_TRUE_UP
        when: "at POST /plan-years/{plan_year_id}/true-up while PlanYear.status == LOCKED"
        difference: "Ignores period boundaries: it recomputes the combined annual entitlement on annual compensation and annual contributions, then subtracts what was already funded, so certified dollars stranded by period-level fluctuation are recovered."

  - name: qslp_mirror_allocation
    trigger: "on POST /loan-certifications/{certification_id}/decision with decision=ACCEPT (creates MatchAllocation rows with allocation_type=MIRROR)"
    algorithm: waterfall_allocation
    formula: |
      remaining = certification.eligible_total_cents
      for cr in ContributionRecord rows of (employee, plan year)
               ordered by payroll_period.period_number ASC,
               tie-break cr.created_at ASC:
          if remaining == 0: break
          # space already consumed by earlier certifications of the same employee
          used1 = sum(a.tier1_applied_cents for MatchAllocation a
                      where a.payroll_period_id == cr.payroll_period_id
                      and a.employee_id == cr.employee_id
                      and a.funding_status IN {UNFUNDED, SCHEDULED, FUNDED})
          used2 = sum(a.tier2_applied_cents for the same set)
          free1 = max(cr.qslp_space_tier1_cents - used1, 0)
          free2 = max(cr.qslp_space_tier2_cents - used2, 0)
          a1 = min(remaining, free1); remaining -= a1
          a2 = min(remaining, free2); remaining -= a2
          amount = round_half_up(a1 * tier1_match_rate + a2 * tier2_match_rate)
          if amount > 0:
              create MatchAllocation(allocation_type=MIRROR,
                                     payroll_period_id=cr.payroll_period_id,
                                     certification_id=certification.id,
                                     tier1_applied_cents=a1, tier2_applied_cents=a2,
                                     amount_cents=amount)
      certification.unmatched_eligible_cents = remaining
      # Rounding order is PINNED: round once per payroll-period allocation, then sum
      # the rounded allocations into the derived totals. Summing raw tier products
      # first and rounding once is NOT the declared behavior.
    input_set: "ContributionRecord rows of the employee in the plan year (period_number ASC) and existing non-REVERSED MatchAllocation rows for the same employee/period"
    constants:
      TIER1_RATE: 1.00
      TIER2_RATE: 0.50
    precision: "integer cents, round_half_up per allocation, then sum"

  - name: qslp_annual_true_up
    trigger: "on POST /plan-years/{plan_year_id}/true-up (PlanYear.status == LOCKED)"
    algorithm: constraint_propagation
    formula: |
      run_started_at = current logical clock
      # Evaluation order is PINNED as STEP 1 -> STEP 2 -> STEP 3 -> STEP 4.
      # The true-up depends on funded totals, and it then changes funded totals,
      # so the inclusion set of STEP 3 must be fixed before STEP 4 writes.
      STEP 1: comp_year = min(sum(cr.counted_compensation_cents for the employee in this plan year),
                              py.compensation_cap_cents)
      STEP 2: qslp_eligible_year = sum(c.eligible_total_cents
                                       for certifications of the employee in this plan year
                                       with status IN {ACCEPTED, AUDIT_HOLD})
              combined = employee_ytd_deferral_cents + qslp_eligible_year
              t1 = min(combined, comp_year * tier1_pct)
              t2 = min(max(combined - comp_year * tier1_pct, 0), comp_year * tier2_pct)
              combined_entitlement = round_half_up(t1 * tier1_match_rate + t2 * tier2_match_rate)
      STEP 3: funded_deferral = sum(cr.deferral_match_cents for the employee in this plan year)
              funded_qslp = sum(a.amount_cents for MatchAllocation a of the employee in this plan year
                                where a.funding_status IN {SCHEDULED, FUNDED}
                                and a.created_at < run_started_at)   # REVERSED excluded; this run's own row excluded
              recouped = sum(adj.amount_cents for CorrectionAdjustment adj of the employee in this plan year
                             where adj.reason_code == TRUE_UP_RECOUPMENT)   # negative or zero
      STEP 4: delta = combined_entitlement - funded_deferral - funded_qslp - recouped
              if delta > 0: create MatchAllocation(allocation_type=TRUE_UP, amount_cents=delta,
                                                   certification_id=null, payroll_period_id=null)
              if delta < 0: create CorrectionAdjustment(reason_code=TRUE_UP_RECOUPMENT,
                                                        amount_cents=delta, match_allocation_id=null)
              if delta == 0: create nothing
      # TRUE_UP allocation batch attachment selector:
      #   candidate set: FundingBatch rows with plan_year_id == py.id AND status == PENDING
      #   ranking:       payroll_period.period_number DESC
      #   tie-break:     FundingBatch.created_at ASC
      #   empty pool:    allocation stays funding_status = UNFUNDED with funding_batch_id null
    input_set: "one employee at a time (all employees with at least one ContributionRecord in the plan year when employee_id is omitted, processed in Employee.created_at ASC order)"
    constants:
      DEFAULT_TIER1_PCT: 0.03
      DEFAULT_TIER2_PCT: 0.02
    precision: "integer cents, round_half_up once on combined_entitlement"

  - name: employee_remaining_qslp_space
    trigger: "on every read of Employee and after any ContributionRecord / LoanCertification status change"
    algorithm: aggregation
    formula: |
      py = the unique PlanYear with status == OPEN
      if py is null: remaining_qslp_space_cents = null
      else:
          reserved = sum(c.certified_total_cents
                         for LoanCertification c of this employee with c.plan_year_id == py.id
                         and c.status IN {SUBMITTED, ACCEPTED, AUDIT_HOLD})
          remaining_qslp_space_cents = max(py.annual_deferral_limit_cents
                                           - ytd_deferral_cents - reserved, 0)
      # Conserved quantity Q2: statuses DRAFT, RETURNED, VOIDED and SUPERSEDED are
      # OUTSIDE the reserved set, so submit-then-return restores the pre-submit value
      # exactly.
    input_set: "ContributionRecord rows of the employee in the OPEN plan year and the employee's certifications with status IN {SUBMITTED, ACCEPTED, AUDIT_HOLD}"
    constants:
      DEFAULT_ANNUAL_DEFERRAL_LIMIT_CENTS: 2300000
    precision: "integer cents; floored at 0"

  - name: acp_test
    trigger: "on POST /nondiscrimination-tests/{test_id}/compute"
    algorithm: weighted_scoring
    formula: |
      participants = employees having >= 1 ContributionRecord in this plan year
                     with sum(counted_compensation_cents) > 0
      for p in participants:
          numerator = sum(cr.deferral_match_cents for p in this plan year)
                      + (include_qslp_match
                         ? sum(a.amount_cents for MatchAllocation a of p in this plan year
                               where a.funding_status IN {SCHEDULED, FUNDED})
                         : 0)
                      + sum(adj.amount_cents for CorrectionAdjustment adj of p in this plan year
                            where adj.reason_code IN {ACP_CORRECTIVE_FORFEITURE, TRUE_UP_RECOUPMENT})
          denominator = sum(cr.counted_compensation_cents for p in this plan year)
          acr[p] = round_half_up(numerator / denominator, 4)      # STEP A: round PER PARTICIPANT
      hce_group  = [p for p in participants if p.hce_flag]
      nhce_group = [p for p in participants if not p.hce_flag]
      hce_count = len(hce_group); nhce_count = len(nhce_group)
      if nhce_count == 0: reject with ERR_NO_NHCE_POPULATION
      hce_acp = hce_count == 0 ? 0.0000
                               : round_half_up(sum(acr[p] for p in hce_group) / hce_count, 4)
      # STEP B: average the ALREADY ROUNDED ratios. Averaging raw ratios and rounding
      # once is NOT the declared behavior and can differ in the 4th decimal place.
      nhce_acp = test_method == CURRENT_YEAR
                 ? round_half_up(sum(acr[p] for p in nhce_group) / nhce_count, 4)
                 : py.prior_year_nhce_acp
      limit_acp = round_half_up(max(1.25 * nhce_acp,
                                    min(2 * nhce_acp, nhce_acp + 0.02)), 4)
      status = hce_acp <= limit_acp ? PASSED : FAILED
    input_set: "all employees with positive counted compensation in the plan year; matches from ContributionRecord plus (optionally) non-REVERSED MatchAllocation rows plus signed CorrectionAdjustment rows"
    constants:
      BASIC_MULTIPLE: 1.25
      ALTERNATE_MULTIPLE: 2
      ALTERNATE_SPREAD: 0.02
    precision: "ratios at 4 decimal places, round_half_up, applied twice: per participant then on the group average"
    variants:
      - name: CURRENT_YEAR
        when: "NondiscriminationTest.test_method == CURRENT_YEAR"
        difference: "nhce_acp is measured from this plan year's NHCE population, so the limit tracks current-year NHCE behavior and can fail a plan the prior-year method passes."
      - name: PRIOR_YEAR
        when: "NondiscriminationTest.test_method == PRIOR_YEAR"
        difference: "nhce_acp is read from PlanYear.prior_year_nhce_acp, so identical current-year data can yield a different limit and a different PASSED/FAILED outcome."

  - name: acp_corrective_forfeiture
    trigger: "on POST /nondiscrimination-tests/{test_id}/correction (test status FAILED)"
    algorithm: aggregation
    formula: |
      for p in hce_group ordered by Employee.created_at ASC:
          if acr[p] > limit_acp:
              excess_cents = round_half_up((acr[p] - limit_acp)
                                           * sum(cr.counted_compensation_cents for p))
              create CorrectionAdjustment(employee_id=p.id, plan_year_id=py.id,
                                          nondiscrimination_test_id=test.id,
                                          reason_code=ACP_CORRECTIVE_FORFEITURE,
                                          match_allocation_id=null,
                                          amount_cents=-excess_cents)
      total_correction_cents = sum(created adjustments' amount_cents)
    input_set: "HCE participants of the failed test whose rounded ratio exceeds limit_acp, in Employee.created_at ASC order"
    constants: {}
    precision: "integer cents, round_half_up per participant"

  - name: vesting_and_forfeiture
    trigger: "on POST /employees/{employee_id}/employment-events with event_type=TERMINATE, and at MatchAllocation creation for the FULLY_VESTED shortcut"
    algorithm: threshold
    formula: |
      vested_pct = 0.00 if vesting_service_months < 24
                   0.40 if 24 <= vesting_service_months <= 35
                   0.60 if 36 <= vesting_service_months <= 47
                   0.80 if 48 <= vesting_service_months <= 59
                   1.00 if vesting_service_months >= 60
      for a in MatchAllocation rows of the employee
               where a.funding_status IN {SCHEDULED, FUNDED}
               and a.vesting_status IN {UNVESTED, PARTIALLY_VESTED}
               ordered by a.created_at ASC:
          a.vested_cents = round_half_up(a.amount_cents * vested_pct)
          a.forfeited_cents = a.amount_cents - a.vested_cents
          a.vesting_status = a.forfeited_cents == 0 ? FULLY_VESTED
                             : (a.vested_cents == 0 ? FORFEITED : PARTIALLY_VESTED)
          if a.forfeited_cents > 0:
              create ForfeitureRecord(match_allocation_id=a.id, amount_cents=a.forfeited_cents,
                                      reason_code = a.vested_cents == 0 ? TERMINATION_UNVESTED
                                                                       : TERMINATION_PARTIAL_VESTING)
      # Rounding order is PINNED: round the vested portion PER ALLOCATION, then sum
      # the per-allocation forfeitures into the plan-year pool.
    input_set: "MatchAllocation rows of the terminating employee with funding_status IN {SCHEDULED, FUNDED}, created_at ASC"
    constants:
      CLIFF_MONTHS: 24
      FULL_VEST_MONTHS: 60
    precision: "integer cents, round_half_up per allocation"

  - name: forfeiture_offset_waterfall
    trigger: "after any ForfeitureRecord is created, after any FundingBatch is created, and after any allocation reversal"
    algorithm: waterfall_allocation
    formula: |
      pool = sum(ForfeitureRecord.amount_cents where plan_year_id == py.id)
      pool_remaining = pool
      for b in FundingBatch rows with plan_year_id == py.id and status == PENDING
               ordered by b.created_at ASC:
          offset = min(pool_remaining, b.total_allocated_cents)
          pool_remaining -= offset
          b.forfeiture_offset_cents = offset
          b.net_funding_cents = b.total_allocated_cents - offset
      for b in FundingBatch rows with plan_year_id == py.id and status != PENDING:
          b.forfeiture_offset_cents is frozen at its value when it left PENDING
          b.net_funding_cents = b.total_allocated_cents - b.forfeiture_offset_cents
      py.forfeiture_balance_cents = pool_remaining
    input_set: "ForfeitureRecord rows of the plan year and its PENDING FundingBatch rows in created_at ASC order"
    constants: {}
    precision: "integer cents; no rounding"

  - name: unpaid_leave_days
    trigger: "on POST /leave-events and on every read of Employee.unpaid_leave_days_ytd"
    algorithm: interval_merge
    formula: |
      py = the unique PlanYear with status == OPEN (null -> unpaid_leave_days_ytd = 0)
      intervals = [[max(l.start_date, py.period_start), min(l.end_date, py.period_end)]
                   for LeaveEvent l of this employee with l.leave_type == UNPAID
                   and l.end_date >= py.period_start and l.start_date <= py.period_end]
      sort intervals by start_date ASC, tie-break end_date ASC
      merge two adjacent intervals when next.start_date <= prev.end_date + py.leave_merge_buffer_days
      # CLOSED intervals: day_count of one merged span = (end_date - start_date) in whole days + 1
      unpaid_leave_days_ytd = sum(day_count of merged spans)
      # Conflict rule (validations[priority=42]): a new LeaveEvent is rejected when,
      # for any existing LeaveEvent of the same employee,
      #     new.start_date <= existing.end_date + buffer_days
      # AND new.end_date   >= existing.start_date - buffer_days
      # (closed intervals inflated by the buffer on BOTH sides; equality collides).
    input_set: "LeaveEvent rows of the employee with leave_type == UNPAID intersecting the OPEN plan year window"
    constants:
      DEFAULT_BUFFER_DAYS: 14
      DEFAULT_UNPAID_DAY_CAP: 180
    precision: "whole days, inclusive of both endpoints"

  - name: audit_packet_summary
    trigger: "on GET /employees/{employee_id}/audit-packet"
    algorithm: aggregation
    formula: |
      py = the unique PlanYear with status IN {OPEN, LOCKED}; if several exist,
           pick status == OPEN first, else the LOCKED one with the greatest year
      certification_count = count(LoanCertification of the employee in py
                                  with status IN {SUBMITTED, RETURNED, ACCEPTED, AUDIT_HOLD, VOIDED, SUPERSEDED})
      accepted_certified_cents = sum(c.eligible_total_cents where status IN {ACCEPTED, AUDIT_HOLD})
      deferral_match_cents = sum(cr.deferral_match_cents for the employee in py)
      qslp_match_cents = sum(a.amount_cents for allocations of the employee in py
                             where funding_status IN {SCHEDULED, FUNDED})
      forfeited_cents = sum(f.amount_cents for ForfeitureRecord of the employee in py)
      correction_cents = sum(adj.amount_cents for CorrectionAdjustment of the employee in py)
      remaining_space_cents = Employee.remaining_qslp_space_cents
    input_set: "all certification, payroll, allocation, forfeiture and correction rows of one employee inside the selected plan year"
    constants: {}
    precision: "integer cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "required body fields present, types correct, enum members valid, amount_cents > 0, original_principal_cents > 0, account_last4 exactly 4 digits, covered_period_end > covered_period_start, eligible_compensation_cents >= 0, elective_deferral_cents >= 0, notice_channel present on NOTICE_SENT, rescinded_reason present on RESCINDED, rejection_code present on REJECTED settlement"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "plan_year_id in path or body resolves to a PlanYear"
    error_id: ERR_PLAN_YEAR_NOT_FOUND
    http_status: 404
    applies_to: "POST /plan-amendments, POST /payroll-periods, POST /loan-certifications, POST /nondiscrimination-tests, POST /plan-years/{plan_year_id}/status, POST /plan-years/{plan_year_id}/true-up, POST /funding-batches, GET /plan-years/{plan_year_id}"
  - priority: 5
    category: existence
    check: "employee_id in path or body resolves to an Employee"
    error_id: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    applies_to: "POST /contribution-records, POST /loan-accounts, POST /loan-certifications, POST /leave-events, POST /employees/{employee_id}/employment-events, GET /employees/{employee_id}, GET /employees/{employee_id}/audit-packet, POST /plan-years/{plan_year_id}/true-up"
  - priority: 6
    category: existence
    check: "payroll_period_id in path or body resolves to a PayrollPeriod"
    error_id: ERR_PAYROLL_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "POST /contribution-records, POST /funding-batches, POST /payroll-periods/{payroll_period_id}/status, GET /payroll-periods/{payroll_period_id}"
  - priority: 7
    category: existence
    check: "loan_account_id in path or body resolves to a LoanAccount"
