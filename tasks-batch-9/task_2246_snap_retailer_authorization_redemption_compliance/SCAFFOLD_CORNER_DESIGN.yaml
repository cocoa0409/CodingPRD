              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /sanction-cases/${case_t_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "the first enforce is 409 with ${early_enforce_error_id} == ERR_ENFORCEMENT_NOT_DUE"
            - "after the refusal: TerminalDeployment.${dep_id}.status == ACTIVE with close_reason_code == null, EbtTerminal.${term_id}.status == DEPLOYED"
            - "after the refusal: EquipmentDepot.${depot_id} has units_deployed == 1, units_pending_return == 0, units_reserved == 0, units_in_stock == 4 (sum still 5)"
            - "after the refusal: Store.${store_id}.authorization_status == AUTHORIZED, active_terminal_count == 1, sanction_status == SANCTION_FINAL"
            - "after the refusal: SanctionCase.${case_t_id}.status == SANCTION_FINAL with enforced_at == null and effective_date == 2026-09-20"
            - "Owner.${owner_id}.permanent_disqualification_count == 1 and sanction_flag == PERMANENTLY_DISQUALIFIED with status == ACTIVE (1 < 2)"
            - "the second enforce is 200 and every level moves together: case ENFORCED, store DISQUALIFIED, deployment RECALL_PENDING with close_reason_code AUTHORIZATION_LOST, terminal PENDING_RETURN, units_deployed 0 / units_pending_return 1, active_terminal_count 0"

      - name: opening_an_investigation_releases_reserved_deployments_but_spares_active_ones
