            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${ra_id}", destination_state_code: "NV", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${rb_id}", destination_state_code: "NV", quantity: 2, unit_price_cents: 200000, foam_mass_required_kg: 20, ship_method: "WAREHOUSE" }, as: PlantManager }
          trigger:
            - { call: "GET /plant/production-orders", payload: { retailer_id: "${rb_id}" }, as: PlantManager, captures: { got: "$.data[0].retailer_id" } }
          assert:
            - "response data length == 1"
            - "total_count == 1"
            - "${got} == ${rb_id}"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_errors_across_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETAILER_NOT_FOUND]", "errors[ERR_FOAM_BATCH_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Each resource family returns its own domain-specific 404: retailer, foam batch, and warranty claim lookups on unknown ids return ERR_RETAILER_NOT_FOUND / ERR_FOAM_BATCH_NOT_FOUND / ERR_CLAIM_NOT_FOUND respectively."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/retailers/00000000-0000-0000-0000-000000000000", payload: {}, as: PlantManager, captures: { e1: $.data.error_id } }
            - { call: "GET /plant/foam-batches/00000000-0000-0000-0000-000000000000", payload: {}, as: PlantManager, captures: { e2: $.data.error_id } }
            - { call: "GET /plant/warranty-claims/00000000-0000-0000-0000-000000000000", payload: {}, as: PlantManager, captures: { e3: $.data.error_id } }
          assert:
            - "${e1} == ERR_RETAILER_NOT_FOUND"
            - "${e2} == ERR_FOAM_BATCH_NOT_FOUND"
            - "${e3} == ERR_CLAIM_NOT_FOUND"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: line_supervisor_cannot_certify_model
        claim_type: rbac_denial
        grounds: ["roles.LineSupervisor", "roles.ComplianceOfficer", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /plant/models/{id}/certify is exclusive to ComplianceOfficer; LineSupervisor gets ERR_FORBIDDEN_ROLE even with the model in CERT_REVIEW."
        test_recipe:
          setup: ["model CERT_REVIEW with one BomLine"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-RB1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: LineSupervisor, as_user_id: ls-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: qc_inspector_cannot_cancel_order
        claim_type: rbac_denial
        grounds: ["roles.QcInspector", "roles.PlantManager", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /plant/production-orders/{id}/cancel is exclusive to PlantManager; QcInspector gets ERR_FORBIDDEN_ROLE on a PLANNED order."
        test_recipe:
          setup: ["PLANNED order exists"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-RB2", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /plant/production-orders/${o_id}/cancel", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "ProductionOrder.${o_id}.production_status == PLANNED"

      - name: retailer_cannot_post_credit_adjustment
        claim_type: rbac_denial
        grounds: ["roles.Retailer", "roles.PlantManager", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "The credit ledger is PlantManager-only: a Retailer posting to its own credit-adjustments collection still gets ERR_FORBIDDEN_ROLE (ownership does not widen role scope)."
        test_recipe:
          setup: ["retailer exists"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "POST /plant/retailers/${r_id}/credit-adjustments", payload: { amount_cents: 1000, reason: "self serve", expected_retailer_version: "${r_v}" }, as: Retailer, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  # Section: complexity_layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_law_label_create_stale_model_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[law-label-create-stale-model]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "First label generation with the observed model version succeeds and bumps model.version; a second generation replaying the same expected_model_version is rejected with HTTP 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["CERTIFIED model (version captured after certify); PUBLISHED CA spec"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-OC1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["PHRASE"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
          trigger:
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb1: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { err: $.data.error_id } }
          assert:
            - "LawLabel.${lb1}.status == GENERATED"
            - "${err} == ERR_STALE_VERSION"

      - name: occ_bom_edit_stale_model_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bom-edit-stale-model]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A BomLine PATCH carrying the pre-edit model version succeeds and bumps the model; replaying the same expected_model_version on a second PATCH fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT model with one BomLine; model version captured after BOM create"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-OC2", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager, captures: { ln_id: $.data.id } }
            - { call: "GET /plant/models/${m_id}", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
          trigger:
            - { call: "PATCH /plant/models/${m_id}/bom-lines/${ln_id}", payload: { quantity_per_unit: 3, expected_model_version: "${m_v}" }, as: PlantManager, captures: { lc: $.data.line_cost_cents } }
            - { call: "PATCH /plant/models/${m_id}/bom-lines/${ln_id}", payload: { quantity_per_unit: 4, expected_model_version: "${m_v}" }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${lc} == 30"
            - "${err} == ERR_STALE_VERSION"

      - name: occ_credit_adjustment_stale_retailer_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[credit-adjustment-stale-retailer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A manual adjustment against the observed retailer version succeeds; replaying the same expected_retailer_version fails 412 ERR_STALE_VERSION while the balance reflects only the first adjustment."
        test_recipe:
          setup: ["retailer with version captured at creation"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "POST /plant/retailers/${r_id}/credit-adjustments", payload: { amount_cents: 5000, reason: "promo", expected_retailer_version: "${r_v}" }, as: PlantManager, captures: { a1: $.data.id } }
            - { call: "POST /plant/retailers/${r_id}/credit-adjustments", payload: { amount_cents: 7000, reason: "stale retry", expected_retailer_version: "${r_v}" }, as: PlantManager, captures: { err: $.data.error_id } }
            - { call: "GET /plant/retailers/${r_id}", payload: {}, as: PlantManager, captures: { bal: $.data.credit_balance_cents } }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${bal} == 5000"

      - name: version_pinning_label_retains_original_spec
        claim_type: version_pinning
        grounds: ["entities.LawLabel.fields.spec_id", "entities.LawLabel.fields.spec_version"]
        distinguishing_aspect: "A generated label keeps its pinned spec_id/spec_version after a newer spec for the same state is published: the label still references spec v1 and its content_text contains PHRASE V1, never PHRASE V2."
        test_recipe:
          setup: ["CERTIFIED model; spec1 CA PUBLISHED; label generated; spec2 CA published afterwards"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-VP1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["PHRASE V1"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp1: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp1}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["PHRASE V2"], prop65_warning_required: true }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp2: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp2}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
          trigger:
            - { call: "GET /plant/law-labels/${lb_id}", payload: {}, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_spec: $.data.spec_id, lb_spv: $.data.spec_version, lb_txt: $.data.content_text } }
          assert:
            - "${lb_spec} == ${sp1}"
            - "${lb_spv} == 1"
            - "${lb_txt} contains PHRASE V1"
            - "${lb_txt} does not contain PHRASE V2"

      - name: cascading_layers_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.ComplianceCertificate.APPROVED_to_REVOKED"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: certificate_revoke_depth3_cascade
          rationale: "Multi-hop cascade asserted there; warranty-pay ledger cascade asserted in warranty_pay_ledger_cascade."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: ["calculations.warranty_credit_amount", "calculations.recycling_credit"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: warranty_full_replacement_vs_prorated_divergence
          rationale: "Both variant families asserted in the two Rule-1 instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_allocate_reflects_reservation
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "endpoints.POST_/plant/production-orders/{orderId}/allocate-materials"]
        distinguishing_aspect: "Immediate consistency: the allocate response shows production_status MATERIAL_ALLOCATED and a subsequent GET of the batch in the same test shows reserved_mass_kg 40 — no lag, no recompute delay."
        test_recipe:
          setup: ["ACTIVE model; CURED batch 1000 kg; PLANNED order requiring 40 kg"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-CM1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 4, unit_price_cents: 200000, foam_mass_required_kg: 40, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1, captures: { st: $.data.production_status } }
            - { call: "GET /plant/foam-batches/${b_id}", payload: {}, as: PlantManager, captures: { av: $.data.available_mass_kg, rs: $.data.reserved_mass_kg } }
          assert:
            - "${st} == MATERIAL_ALLOCATED"
            - "${av} == 960"
            - "${rs} == 40"
