          rationale: "That §1.8 instance already drives both Keg dimensions at once through the QUARANTINED -> PRESSURE_TESTED retest loop, asserting custody_state and service_state independently at each step; a separate corner probe of the parallel shape would repeat the same transitions with weaker assertions."

