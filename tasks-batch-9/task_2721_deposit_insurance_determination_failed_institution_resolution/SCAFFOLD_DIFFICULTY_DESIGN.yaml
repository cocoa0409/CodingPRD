            - "One BranchReopening BR-09 is PLANNED for 2026-08-06T09:00:00Z -> 2026-08-06T17:00:00Z."
            - "A QUALIFIED bidder has SUBMITTED one WHOLE_BANK_PA bid: deposit_premium_bps 340, asset_discount_bps 1000, no retention. Under EXPECTED_LOSS_SHARE: base 25000000, premium 850000, asset_bid_value 9000000, retained_shortfall 0, pre_fee 15150000, fee 0, reimbursement 0, evaluated_cost 15150000 — exactly the baseline."
