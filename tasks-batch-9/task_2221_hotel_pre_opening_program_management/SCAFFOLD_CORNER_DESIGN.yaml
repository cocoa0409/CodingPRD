              payload: {}
              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { e_guarantee_state: "$.data.error_id" }
          assert:
            - "the block is ACCEPTED after setup, so resolve-contingency has no AT_RISK precondition to satisfy"
            - "first trigger returns 409 with e_resolve_state == 'ERR_INVALID_RESERVATION_STATE', and committed_room_nights stays 10 on the program"
            - "second trigger returns 200 with state 'GUARANTEED' and the program contingency_liability_cents rises from 262500 to 412500 by the 150000 guarantee penalty"
            - "third trigger returns 409 with e_guarantee_state == 'ERR_INVALID_RESERVATION_STATE' — the guarantee is not idempotent"
            - "the program contingency_liability_cents stays 412500 after the rejected replay, so no second penalty was added"

