  # =========================================================================
  # RULE 5 — priority_pair_validation_conflict, DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_business_safety_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (state vs business_safety): approving a RecordBook that is still in DRAFT (state
          violation) by a volunteer who is ALSO not cleared (business_safety violation) must return
          the state error ERR_INVALID_STATE (priority 5), not ERR_SCREENING_NOT_CLEARED (priority 7).
        test_recipe:
          setup:
            - "A DRAFT record book and a non-CLEARED (PENDING) volunteer"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Walnut 4-H", county_code: "WN" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
