              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE (state priority 5 beats business_temporal priority 6)"
            - "http_status == 409, not 422"

      - name: sod_beats_occ_stale_version_on_amendment_execute
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 9) vs business_fiscal
          (priority 14): the same person (one Contact id) both agreed the
          amendment as LandlordCounsel and now attempts to execute it as
          AssetManager, AND their expected_lease_version is stale — both rules
          fail; the response must surface ERR_SOD_VIOLATION because
          business_safety precedes business_fiscal.
        test_recipe:
          setup:
            - "Portfolio P with a single dual-hat contact DUAL (one Contact id used with both role headers)"
            - "Lease L ACTIVE; amendment A proposed by DUAL (as AssetManager), agreed by DUAL (as LandlordCounsel) — note: agree's SoD rule compares against the most recent proposer, so agreement must be done by a DIFFERENT user; use second contact AM2 for propose"
            - "Pinned: AM2 proposes; DUAL agrees as LandlordCounsel; a withdraw on a dummy option bumps Lease.version so DUAL's captured version is stale; DUAL then attempts execute as AssetManager — executor == agreer (SoD violation) AND stale version (OCC violation)"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P10", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
