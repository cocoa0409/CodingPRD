          assert:
            - "${e_parent} == ERR_UNDERTAKING_NOT_FOUND with HTTP 404 — priority 4 outranks priority 7's OCC check"
            - "${ok_und} == \"${und_id}\", ${ok_status} == ACTIVE, ${ok_ack} == null (declared default)"
            - "${ok_lapse} == 0 — with last_calendar_ack_date null the lapse falls back to effective_date 2026-08-01, which equals the clock date"
            - "${ok_billable} == 0, ${ok_invoice} == 300000 (retainer 250000 raised by the MIN_ANNUAL_FEE_CENTS floor), ${ok_super} == null, ${ok_term} == null"
            - "${eng_total} == 1 — only the valid creation persisted"

      - name: filing_creation_rejects_a_cycle_owned_by_a_different_bond_issue
        claim_type: cross_reference_integrity
        grounds:
          - validations.priority_28_ERR_FILING_SUBJECT_MISMATCH
          - complexity_profile.entity_topology
          - endpoints.POST_/disclosure/filings
        distinguishing_aspect: >-
          The topology is flat, so a Filing names its subject by FK in the body rather than by
          URL nesting — nothing structural stops a caller from pairing issue A with a cycle owned
          by issue B. Priority 28 is the integrity check that does, and it fires even though both
          ids exist and the cycle is in a perfectly fileable READY_TO_FILE state.
