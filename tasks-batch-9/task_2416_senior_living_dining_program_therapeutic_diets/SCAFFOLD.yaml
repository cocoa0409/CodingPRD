scenario: |
  Generate task harder than expert level!

  2416. Senior Living Dining Program & Therapeutic Diets (Brookdale dining services): resident diet order intake from clinical staff with texture and consistency levels, allergy and preference profile with substitution rules, dining venue capacity, seating and meal-time scheduling across levels of care, therapeutic diet menu extension and dietitian review, meal count reconciliation to billing for guest and takeout meals, weight-loss and intake monitoring triggering plan-of-care review, food safety and temperature compliance in satellite kitchens, resident food committee feedback and menu cycle refresh
domain_name: senior-living-dining-therapeutic-diets
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  difficulty_level: expert_plus
  entity_topology: flat
  state_machine_shape: parallel
  state_machine_shape_notes: |
    DietOrder carries two independent state dimensions on one row
    (clinical_status x review_status); TherapeuticExtension and MenuCycle are
    cyclic (CHANGES_REQUESTED -> DRAFT -> SUBMITTED, PUBLISHED ->
    REFRESH_PENDING -> DRAFT); DiningVenue.temp_compliance_posture is a derived
    posture that gates child operations; PlanOfCareReview is branching
    (three outcomes with divergent side-effect sets).
  relationship_patterns:
    - one_to_many
    - self_referential      # DietOrder.supersedes_order_id -> DietOrder.id
    - cross_aggregate       # MealServiceTicket spans DiningVenue + Resident + SeatingReservation
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Senior living community name
      - name: care_levels_offered
        type: array
        source: input
        description: Levels of care this community serves
        constraints: "non-empty subset of {INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING}"
      - name: guest_meal_sponsor_cap_cents
        type: integer
        source: input
        description: Per-resident open sponsorship cap for GUEST + TAKEOUT tickets
        default: 20000
        constraints: ">= 0"
      - name: variance_tolerance_cents
        type: integer
        source: input
        description: Absolute reconciliation variance tolerated at finalize without a variance_note
        default: 5000
        constraints: ">= 0"
      - name: pending_dietitian_review_count
        type: integer
        source: computed
        description: "Denormalized count of DietOrder rows in this community with review_status IN {AWAITING_DIETITIAN, CHANGES_REQUESTED, REREVIEW_REQUIRED} AND clinical_status IN {PENDING_REVIEW, ACTIVE}; fully recomputed on every DietOrder review_status write"
        default: 0
      - name: active_menu_cycle_id
        type: string
        source: computed
        description: "Id of the single MenuCycle of this community with status == PUBLISHED whose closed date range [effective_start_date, effective_end_date] contains the logical clock date; null when no such cycle exists (uniqueness guaranteed by the PUBLISHED-overlap rule)"
        default: null

  - name: DiningVenue
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: name
        type: string
        source: input
        description: Venue name
      - name: venue_kind
        type: enum
        source: input
        description: Venue type; SATELLITE venues are satellite-kitchen served
        constraints: "one of {MAIN_DINING, BISTRO, SATELLITE}"
      - name: seat_capacity
        type: integer
        source: input
        description: Total seats available for any single overlapping seating window
        constraints: ">= 1"
      - name: seating_turn_minutes
        type: integer
        source: input
        description: Length of one seating turn; seat_end_utc = seat_start_utc + this
        default: 60
        constraints: ">= 15"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Table-reset tail appended to an incumbent reservation's occupation interval
        default: 20
        constraints: ">= 0"
      - name: care_levels_served
        type: array
        source: input
        description: Levels of care allowed to be seated here
        constraints: "non-empty subset of the parent Community.care_levels_offered"
      - name: temp_compliance_posture
        type: enum
        source: computed
        description: "Food-safety posture derived from this venue's TemperatureLog stream; gates ticket issuance and service"
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, SUSPENDED}"
      - name: consecutive_temp_violation_count
        type: integer
        source: computed
        description: Count of consecutive out-of-range TemperatureLog rows since the last resetting log
        default: 0
      - name: status
        type: enum
        source: computed
        description: Operational availability of the venue
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: full_name
        type: string
        source: input
        description: Resident name
      - name: care_level
        type: enum
        source: input
        description: Level of care; must be in Community.care_levels_offered
        constraints: "one of {INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING}"
      - name: dining_status
        type: enum
        source: computed
        description: Dining participation status
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_LEAVE, DISCHARGED}"
      - name: baseline_weight_kg
        type: number
        source: input
        description: Admission baseline weight used by the BASELINE_ANCHORED weight variant
        constraints: "> 0, 1 decimal place"
      - name: current_weight_kg
        type: number
        source: computed
        description: "weight_kg of the latest IntakeObservation (observation_date DESC, created_at DESC) with weight_kg != null; baseline_weight_kg when none exists"
      - name: rolling_30d_weight_change_pct
        type: number
        source: computed
        description: "Output of calculation resident_weight_trend variant ROLLING_30D; the ONLY weight metric that gates plan-of-care review"
        default: 0.00
      - name: baseline_weight_change_pct
        type: number
        source: computed
        description: "Output of calculation resident_weight_trend variant BASELINE_ANCHORED; reported only, never gates"
        default: 0.00
      - name: avg_intake_pct_7d
        type: number
        source: computed
        description: "Mean IntakeObservation.intake_pct over observation_date IN [clock_date - 6 days, clock_date] inclusive; null when the window holds no observation"
        default: null
      - name: intake_risk_score
        type: number
        source: computed
        description: Output of calculation intake_risk_score
        default: 0.00
      - name: allergens
        type: array
        source: input
        description: Allergen tags this resident must never be served
        default: []
      - name: dislikes
        type: array
        source: input
        description: MenuItem.item_code values the resident refuses
        default: []
      - name: preference_strictness
        type: enum
        source: input
        description: Whether DISLIKE substitutions are mandatory (STRICT) or best-effort (FLEXIBLE)
        default: FLEXIBLE
        constraints: "one of {STRICT, FLEXIBLE}"
      - name: guest_meal_charge_balance_cents
        type: integer
        source: computed
        description: "Sum of billed_amount_cents over MealServiceTicket rows with resident_id == this resident, ticket_type IN {GUEST, TAKEOUT} and status IN {ISSUED, SERVED, BILLED}"
        default: 0
      - name: tray_card_state
        type: enum
        source: computed
        description: Service-time clearance for this resident's tray
        default: CLEAR
        constraints: "one of {CLEAR, HOLD_PENDING_REVIEW, BLOCKED}"

  - name: DietOrder
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: supersedes_order_id
        type: string
        source: input
        description: "FK -> DietOrder.id; the same resident's clinical_status == ACTIVE order this order replaces on approval; null for a first order"
        default: null
      - name: texture_level
        type: enum
        source: input
        description: "IDDSI-style texture; TEXTURE_RANK = {REGULAR:0, BITE_SIZED:1, MINCED_MOIST:2, PUREED:3}"
        constraints: "one of {REGULAR, BITE_SIZED, MINCED_MOIST, PUREED}"
      - name: liquid_consistency
        type: enum
        source: input
        description: "Thickened-liquid level; LIQUID_RANK = {THIN:0, SLIGHTLY_THICK:1, MILDLY_THICK:2, MODERATELY_THICK:3, EXTREMELY_THICK:4}"
        constraints: "one of {THIN, SLIGHTLY_THICK, MILDLY_THICK, MODERATELY_THICK, EXTREMELY_THICK}"
      - name: therapeutic_codes
        type: array
        source: input
        description: Therapeutic diet codes attached to this order
        default: []
        constraints: "subset of {CARB_CONTROLLED, RENAL, LOW_SODIUM, HIGH_PROTEIN, GLUTEN_FREE}"
      - name: clinical_status
        type: enum
        source: computed
        description: "Order lifecycle dimension; evolves independently of review_status"
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, ACTIVE, SUPERSEDED, DISCONTINUED}"
      - name: review_status
        type: enum
        source: computed
        description: "Dietitian-review dimension; evolves independently of clinical_status (an ACTIVE order can be pushed back to REREVIEW_REQUIRED without leaving ACTIVE)"
        default: AWAITING_DIETITIAN
        constraints: "one of {AWAITING_DIETITIAN, CHANGES_REQUESTED, APPROVED, REREVIEW_REQUIRED}"
      - name: review_round
        type: integer
        source: computed
        description: Number of REQUEST_CHANGES decisions recorded against this order
        default: 0
      - name: ordered_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClinicalStaff actor that created the order
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the RegisteredDietitian that recorded the most recent decision
        default: null
      - name: activated_at
        type: datetime
        source: computed
        description: Logical clock instant at which clinical_status became ACTIVE
        default: null

  - name: SubstitutionRule
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: trigger_type
        type: enum
        source: input
        description: "What makes this rule eligible; TRIGGER_PRIORITY = {ALLERGEN:0, TEXTURE:1, DISLIKE:2}"
        constraints: "one of {ALLERGEN, TEXTURE, DISLIKE}"
      - name: match_value
        type: string
        source: input
        description: "Allergen tag when trigger_type == ALLERGEN; MenuItem.item_code when DISLIKE; the literal string ANY when TEXTURE"
      - name: replacement_item_code
        type: string
        source: input
        description: item_code served instead of the matched MenuItem
      - name: priority_rank
        type: integer
        source: input
        description: Author-assigned rank; lower wins inside one trigger_type
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: SUPERSEDED rules are ignored by tray-card resolution
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: SeatingReservation
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: venue_id
        type: string
        source: input
        description: "FK -> DiningVenue.id"
      - name: service_date
        type: string
        source: input
        description: "Service date, ISO 8601 date (YYYY-MM-DD); must equal the UTC date of seat_start_utc"
      - name: meal_period
        type: enum
        source: input
        description: Meal period served in this seating
        constraints: "one of {BREAKFAST, LUNCH, DINNER}"
      - name: seat_start_utc
        type: datetime
        source: input
        description: Inclusive start of the seating window
      - name: seat_end_utc
        type: datetime
        source: computed
        description: "seat_start_utc + DiningVenue.seating_turn_minutes; exclusive end of the venue-side half-open interval"
      - name: party_size
        type: integer
        source: input
        description: Seats consumed (resident plus accompanying guests)
        constraints: ">= 1"
      - name: allow_waitlist
        type: boolean
        source: input
        description: When true a capacity rejection becomes a WAITLISTED row instead of an error
        default: false
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle
        default: RESERVED
        constraints: "one of {RESERVED, WAITLISTED, SEATED, COMPLETED, RELEASED}"
      - name: suspension_hold
        type: boolean
        source: computed
        description: Set true when a venue posture escalation to SUSPENDED forced this row from RESERVED to WAITLISTED
        default: false
      - name: seated_at
        type: datetime
        source: computed
        description: Logical clock instant at which status became SEATED
        default: null

  - name: MenuCycle
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: cycle_number
        type: integer
        source: input
        description: Operator-assigned cycle number
        constraints: ">= 1"
      - name: week_count
        type: integer
        source: input
        description: Number of menu weeks; day_index spans 1..week_count*7
        constraints: ">= 1"
      - name: effective_start_date
        type: string
        source: input
        description: "Inclusive first service date of the cycle, ISO 8601 date"
      - name: effective_end_date
        type: string
        source: input
        description: "Inclusive last service date of the cycle, ISO 8601 date; must be >= effective_start_date"
      - name: status
        type: enum
        source: computed
        description: Menu cycle lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_DIETITIAN_SIGNOFF, PUBLISHED, REFRESH_PENDING, ARCHIVED}"
      - name: refresh_index
        type: number
        source: computed
        description: Output of calculation menu_refresh_index
        default: 0.00
      - name: refresh_tier
        type: enum
        source: computed
        description: Participation tier pinned by calculation menu_refresh_index step 3
        default: ADVISORY
        constraints: "one of {ADVISORY, QUORUM}"
      - name: refresh_round
        type: integer
        source: computed
        description: Number of completed committee-driven refresh loops for this cycle
        default: 0
      - name: refresh_reason
        type: string
        source: input
        description: Free-text reason recorded when the refresh loop is executed
        default: null
      - name: signed_off_by_user_id
        type: string
        source: computed
        description: X-User-ID of the RegisteredDietitian that published the cycle
        default: null

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: menu_cycle_id
        type: string
        source: input
        description: "FK -> MenuCycle.id"
      - name: item_code
        type: string
        source: input
        description: Item code, unique within the owning MenuCycle
      - name: name
        type: string
        source: input
        description: Dish name
      - name: day_index
        type: integer
        source: input
        description: Cycle day this item is served on
        constraints: "1 <= day_index <= MenuCycle.week_count * 7"
      - name: meal_period
        type: enum
        source: input
        description: Meal period this item belongs to
        constraints: "one of {BREAKFAST, LUNCH, DINNER}"
      - name: base_texture
        type: enum
        source: input
        description: Texture the kitchen produces by default
        constraints: "one of {REGULAR, BITE_SIZED, MINCED_MOIST, PUREED}"
      - name: allergen_tags
        type: array
        source: input
        description: Allergen tags present in the item as produced
        default: []
      - name: required_therapeutic_codes
        type: array
        source: input
        description: Therapeutic diet codes that need an APPROVED TherapeuticExtension before publication
        default: []
        constraints: "subset of {CARB_CONTROLLED, RENAL, LOW_SODIUM, HIGH_PROTEIN, GLUTEN_FREE}"
      - name: extension_coverage_status
        type: enum
        source: computed
        description: "NOT_REQUIRED when required_therapeutic_codes is empty; COMPLETE when every required code has a TherapeuticExtension with review_status == APPROVED; INCOMPLETE otherwise"
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, INCOMPLETE, COMPLETE}"

  - name: TherapeuticExtension
    parent: null
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id"
      - name: diet_code
        type: enum
        source: input
        description: Therapeutic diet code this extension covers
        constraints: "one of {CARB_CONTROLLED, RENAL, LOW_SODIUM, HIGH_PROTEIN, GLUTEN_FREE}"
      - name: nutrient_overrides
        type: object
        source: input
        description: "Nutrient targets the extension pins, e.g. { sodium_mg: 400 }"
      - name: review_status
        type: enum
        source: computed
        description: Dietitian review loop state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, RETIRED}"
      - name: review_round
        type: integer
        source: computed
        description: Number of REQUEST_CHANGES decisions recorded against this extension
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created the extension
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the RegisteredDietitian that recorded the most recent decision
        default: null
      - name: reviewer_note
        type: string
        source: computed
        description: Note captured with the most recent review decision
        default: null

  - name: MealServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> DiningVenue.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id; served resident for RESIDENT tickets, sponsoring resident for GUEST/TAKEOUT tickets; null only for an unsponsored GUEST/TAKEOUT ticket"
        default: null
      - name: reservation_id
        type: string
        source: input
        description: "FK -> SeatingReservation.id; the seating this ticket was issued from; null for walk-in and takeout tickets"
        default: null
      - name: billed_reconciliation_id
        type: string
        source: computed
        description: "FK -> BillingReconciliation.id; set when a reconciliation finalize marks this ticket BILLED"
        default: null
      - name: ticket_type
        type: enum
        source: input
        description: Billing class of the meal
        constraints: "one of {RESIDENT, GUEST, TAKEOUT}"
      - name: service_date
        type: string
        source: input
        description: "Service date, ISO 8601 date (YYYY-MM-DD)"
      - name: meal_period
        type: enum
        source: input
        description: Meal period served
        constraints: "one of {BREAKFAST, LUNCH, DINNER}"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "Output of calculation ticket_billed_amount at issuance; forced to 0 when the ticket is VOIDED"
        default: 0
      - name: voided_amount_cents
        type: integer
        source: computed
        description: The billed_amount_cents value the ticket carried immediately before it was VOIDED
        default: 0
      - name: status
        type: enum
        source: computed
        description: Ticket lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, SERVED, BILLED, VOIDED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that issued the ticket

  - name: BillingReconciliation
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive first service_date of the billing period, ISO 8601 date"
      - name: period_end_date
        type: string
        source: input
        description: "Inclusive last service_date of the billing period, ISO 8601 date; must be >= period_start_date"
      - name: ticket_ledger_total_cents
        type: integer
        source: computed
        description: Output of calculation meal_count_reconciliation variant TICKET_LEDGER
        default: 0
      - name: census_projection_total_cents
        type: integer
        source: computed
        description: Output of calculation meal_count_reconciliation variant CENSUS_PROJECTION
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "ticket_ledger_total_cents - census_projection_total_cents (may be negative)"
        default: 0
      - name: ledger_meal_counts
        type: object
        source: computed
        description: "Counts per ticket_type under the TICKET_LEDGER variant, e.g. { RESIDENT: 1, GUEST: 3, TAKEOUT: 0 }"
      - name: census_meal_counts
        type: object
        source: computed
        description: "Counts per ticket_type under the CENSUS_PROJECTION variant (RESIDENT counted from the reservation book)"
      - name: void_credit_cents
        type: integer
        source: computed
        description: "Chargeback credits for tickets VOIDED inside this period that a PRIOR reconciliation had already billed (billed_reconciliation_id != null)"
        default: 0
      - name: pre_fee_base_cents
        type: integer
        source: computed
        description: "max(0, ticket_ledger_total_cents - void_credit_cents); the ONLY input that keys the administrative-fee tier"
        default: 0
      - name: administrative_fee_cents
        type: integer
        source: computed
        description: Output of calculation reconciliation_net_billable step 5
        default: 0
      - name: net_billable_total_cents
        type: integer
        source: computed
        description: "pre_fee_base_cents + administrative_fee_cents"
        default: 0
      - name: variance_note
        type: string
        source: input
        description: Operator explanation supplied at finalize when the absolute variance exceeds Community.variance_tolerance_cents
        default: null
      - name: status
        type: enum
        source: computed
        description: Reconciliation lifecycle
        default: RECONCILED
        constraints: "one of {RECONCILED, FINALIZED}"
      - name: finalized_by_user_id
        type: string
        source: computed
        description: X-User-ID of the BillingSpecialist that finalized the period
        default: null

  - name: IntakeObservation
    parent: null
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: observation_date
        type: string
        source: input
        description: "Observation date, ISO 8601 date; must be <= the logical clock date"
      - name: meal_period
        type: enum
        source: input
        description: Meal period observed
        constraints: "one of {BREAKFAST, LUNCH, DINNER}"
      - name: intake_pct
        type: integer
        source: input
        description: Percentage of the served meal consumed
        constraints: "0 <= intake_pct <= 100"
      - name: weight_kg
        type: number
        source: input
        description: Weight recorded with this observation; null when only intake was observed
        default: null
        constraints: "> 0 when present, 1 decimal place"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that recorded the observation

  - name: PlanOfCareReview
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: trigger_observation_id
        type: string
        source: input
        description: "FK -> IntakeObservation.id; the observation whose cascade opened this review"
      - name: trigger_reason
        type: enum
        source: computed
        description: Which monitoring threshold breached
        constraints: "one of {WEIGHT_LOSS_30D, LOW_INTAKE_AVG, COMBINED}"
      - name: risk_score_at_open
        type: number
        source: computed
        description: Resident.intake_risk_score snapshot taken when the review opened
      - name: status
        type: enum
        source: computed
        description: Review lifecycle
        default: OPEN
        constraints: "one of {OPEN, COMPLETED}"
      - name: outcome
        type: enum
        source: computed
        description: Branch selected at completion; each branch fires a different side-effect set
        default: null
        constraints: "one of {NO_CHANGE, DIET_ORDER_REREVIEW, ESCALATED}"
      - name: completed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the RegisteredDietitian that completed the review
        default: null

  - name: TemperatureLog
    parent: null
    common_fields: false
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> DiningVenue.id"
      - name: probe_point
        type: enum
        source: input
        description: Monitored point in the satellite kitchen
        constraints: "one of {HOT_HOLDING, COLD_HOLDING, REHEAT}"
      - name: temperature_f
        type: number
        source: input
        description: Probe reading in degrees Fahrenheit
        constraints: "1 decimal place"
      - name: corrective_action_code
        type: string
        source: input
        description: Corrective action taken; a resetting log requires this to be non-null AND in_range true
        default: null
      - name: logged_at_utc
        type: datetime
        source: computed
        description: Logical clock instant at which the log row was accepted
      - name: in_range
        type: boolean
        source: computed
        description: "true when the reading satisfies TEMP_LIMITS for probe_point (HOT_HOLDING >= 135.0, COLD_HOLDING <= 41.0, REHEAT >= 165.0)"
      - name: violation_sequence_index
        type: integer
        source: computed
        description: DiningVenue.consecutive_temp_violation_count as it stands immediately after this log row is applied
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that logged the reading

  - name: CommitteeFeedback
    parent: null
    common_fields: false
    fields:
      - name: menu_cycle_id
        type: string
        source: input
        description: "FK -> MenuCycle.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id; the food-committee member casting the ballot"
      - name: menu_item_code
        type: string
        source: input
        description: "Natural key resolved against MenuItem.item_code among MenuItem rows whose menu_cycle_id == this ballot's menu_cycle_id; unresolvable codes are rejected"
      - name: sentiment
        type: enum
        source: input
        description: Ballot sentiment
        constraints: "one of {POSITIVE, NEUTRAL, NEGATIVE}"
      - name: vote_weight
        type: integer
        source: computed
        description: "2 when the submitting Resident.care_level IN {MEMORY_CARE, SKILLED_NURSING}, else 1"
      - name: status
        type: enum
        source: computed
        description: SUBMITTED ballots feed menu_refresh_index; ACKNOWLEDGED ballots are consumed by an executed refresh
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACKNOWLEDGED}"

state_machines:
  # ---------------------------------------------------------------- DietOrder
  # PARALLEL DIMENSIONS on one row: clinical_status x review_status.
  # `dimension:` names which axis the transition moves; the other axis is
  # explicitly unchanged unless the side_effects say otherwise.
  - entity: DietOrder
    initial_state: "clinical_status=PENDING_REVIEW / review_status=AWAITING_DIETITIAN"
    terminal_states: [SUPERSEDED, DISCONTINUED]
    transitions:
      - from: "(none)"
        to: PENDING_REVIEW
        dimension: clinical_status
        trigger: "POST /diet-orders"
        actor: ClinicalStaff
        preconditions:
          - "Resident exists and Resident.dining_status != DISCHARGED"
          - "payload expected_resident_version == Resident.version (OCC, §1.2.1 diet-order-create-stale-resident)"
          - "when supersedes_order_id != null: that DietOrder.resident_id == payload resident_id AND its clinical_status == ACTIVE"
          - "texture liberalization gate: when the resident has an ACTIVE DietOrder and TEXTURE_RANK(payload texture_level) < TEXTURE_RANK(active order texture_level), the resident MUST NOT have a PlanOfCareReview with status == OPEN"
        side_effects:
          - "review_status initialised to AWAITING_DIETITIAN, review_round = 0"
          - "increments Resident.version by 1"
          - "recomputes Community.pending_dietitian_review_count"
      - from: AWAITING_DIETITIAN
        to: APPROVED
        dimension: review_status
        trigger: "POST /diet-orders/{id}/dietitian-review with decision == APPROVE"
        actor: RegisteredDietitian
        preconditions:
          - "review_status == AWAITING_DIETITIAN"
          - "X-User-ID != DietOrder.ordered_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "clinical_status PENDING_REVIEW -> ACTIVE on the other axis; activated_at = logical clock"
          - "cascade: when supersedes_order_id != null, that order's clinical_status ACTIVE -> SUPERSEDED (its review_status is left untouched)"
          - "recomputes Community.pending_dietitian_review_count"
          - "recomputes Resident.intake_risk_score (texture/therapeutic/liquid inputs changed)"
      - from: AWAITING_DIETITIAN
        to: CHANGES_REQUESTED
        dimension: review_status
        trigger: "POST /diet-orders/{id}/dietitian-review with decision == REQUEST_CHANGES"
        actor: RegisteredDietitian
        preconditions:
          - "review_status == AWAITING_DIETITIAN"
          - "X-User-ID != DietOrder.ordered_by_user_id (segregation of duties)"
          - "review_round < MAX_DIET_REVIEW_ROUNDS (3); a 4th REQUEST_CHANGES is rejected with ERR_REVIEW_ROUND_LIMIT"
        side_effects:
          - "review_round += 1; reviewed_by_user_id = X-User-ID; reviewer_note stored on the order's reviewer_note-equivalent field (reviewed_by_user_id + reviewer note echoed in response)"
          - "clinical_status stays PENDING_REVIEW (independent axis)"
        note: "Cycle edge 1 of 2 for the review axis."
      - from: CHANGES_REQUESTED
        to: AWAITING_DIETITIAN
        dimension: review_status
        trigger: "POST /diet-orders/{id}/resubmit"
        actor: ClinicalStaff
        preconditions:
          - "review_status == CHANGES_REQUESTED AND clinical_status == PENDING_REVIEW"
          - "texture liberalization gate re-applied against the resident's ACTIVE order"
        side_effects:
          - "texture_level / liquid_consistency / therapeutic_codes replaced by any supplied values; ordered_by_user_id unchanged"
          - "recomputes Community.pending_dietitian_review_count (no net change)"
        note: "Cycle edge 2 of 2: CHANGES_REQUESTED -> AWAITING_DIETITIAN -> CHANGES_REQUESTED is a legal loop bounded by review_round."
      - from: REREVIEW_REQUIRED
        to: APPROVED
        dimension: review_status
        trigger: "POST /diet-orders/{id}/dietitian-review with decision == APPROVE"
        actor: RegisteredDietitian
        preconditions:
          - "review_status == REREVIEW_REQUIRED"
          - "X-User-ID != DietOrder.ordered_by_user_id (segregation of duties)"
        side_effects:
          - "clinical_status remains ACTIVE (proof the two axes are independent)"
          - "cascade: Resident.tray_card_state HOLD_PENDING_REVIEW -> CLEAR"
          - "recomputes Community.pending_dietitian_review_count"
      - from: APPROVED
        to: REREVIEW_REQUIRED
        dimension: review_status
        trigger: "system cascade hop 3 of the intake-observation chain (a PlanOfCareReview was opened for the resident)"
        actor: system
        preconditions:
          - "clinical_status == ACTIVE AND review_status == APPROVED"
        side_effects:
          - "cascade hop 4: every SubstitutionRule of the resident with trigger_type == TEXTURE and status == ACTIVE flips to SUPERSEDED"
          - "cascade hop 4: Resident.tray_card_state CLEAR -> HOLD_PENDING_REVIEW"
          - "recomputes Community.pending_dietitian_review_count"
      - from: ACTIVE
        to: DISCONTINUED
        dimension: clinical_status
        trigger: "POST /diet-orders/{id}/discontinue"
        actor: ClinicalStaff
        preconditions:
          - "clinical_status IN {PENDING_REVIEW, ACTIVE}"
        side_effects:
          - "review_status frozen at its current value"
          - "recomputes Community.pending_dietitian_review_count"
          - "recomputes Resident.intake_risk_score (texture_points and therapeutic_points drop to 0 with no ACTIVE order)"
      - from: PENDING_REVIEW
        to: DISCONTINUED
        dimension: clinical_status
        trigger: "POST /diet-orders/{id}/discontinue"
        actor: ClinicalStaff
        preconditions:
          - "clinical_status == PENDING_REVIEW"
        side_effects:
          - "recomputes Community.pending_dietitian_review_count"
      - from: ACTIVE
        to: SUPERSEDED
        dimension: clinical_status
        trigger: "system cascade from a successor order's APPROVE decision"
        actor: system
        preconditions:
          - "the approving order's supersedes_order_id == this order's id"
        side_effects:
          - "activated_at retained for audit"

  # ------------------------------------------------------- TherapeuticExtension
  - entity: TherapeuticExtension
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /therapeutic-extensions/{id}/submit"
        actor: RegisteredDietitian
        preconditions:
          - "review_status IN {DRAFT, CHANGES_REQUESTED}"
          - "the owning MenuItem's MenuCycle.status IN {DRAFT, PENDING_DIETITIAN_SIGNOFF}"
        side_effects: ["no field other than review_status and updated_at/version changes"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /therapeutic-extensions/{id}/review with decision == REQUEST_CHANGES"
        actor: RegisteredDietitian
        preconditions:
          - "review_status == SUBMITTED"
          - "X-User-ID != TherapeuticExtension.authored_by_user_id (segregation of duties)"
          - "review_round < MAX_EXTENSION_REVIEW_ROUNDS (3)"
        side_effects:
          - "review_round += 1; reviewer_note stored; reviewed_by_user_id = X-User-ID"
          - "recomputes MenuItem.extension_coverage_status"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /therapeutic-extensions/{id}/submit"
        actor: RegisteredDietitian
        preconditions: ["review_status == CHANGES_REQUESTED"]
        side_effects: ["review_round retained; the SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED loop is bounded by MAX_EXTENSION_REVIEW_ROUNDS"]
        note: "Closes the review cycle for this entity."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /therapeutic-extensions/{id}/review with decision == APPROVE"
        actor: RegisteredDietitian
        preconditions:
          - "review_status == SUBMITTED"
          - "X-User-ID != TherapeuticExtension.authored_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; reviewer_note stored"
          - "cascade: recomputes MenuItem.extension_coverage_status (COMPLETE once every required_therapeutic_code has an APPROVED extension)"
      - from: APPROVED
        to: RETIRED
        trigger: "system cascade from POST /menu-cycles/{id}/refresh"
        actor: system
        preconditions: ["the owning MenuItem belongs to the refreshed MenuCycle"]
        side_effects: ["cascade: recomputes MenuItem.extension_coverage_status back to INCOMPLETE when the item still declares required_therapeutic_codes"]

  # ---------------------------------------------------------------- MenuCycle
  - entity: MenuCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PENDING_DIETITIAN_SIGNOFF
        trigger: "POST /menu-cycles/{id}/submit"
        actor: DiningServicesManager
        preconditions:
          - "status == DRAFT"
          - "the cycle owns at least one MenuItem"
        side_effects: ["no cascade"]
      - from: PENDING_DIETITIAN_SIGNOFF
        to: PUBLISHED
        trigger: "POST /menu-cycles/{id}/publish"
        actor: RegisteredDietitian
        preconditions:
          - "status == PENDING_DIETITIAN_SIGNOFF"
          - "every MenuItem of the cycle with a non-empty required_therapeutic_codes has extension_coverage_status == COMPLETE, else ERR_THERAPEUTIC_COVERAGE_INCOMPLETE"
          - "no other MenuCycle of the same community with status == PUBLISHED has a closed date range [effective_start_date, effective_end_date] intersecting this cycle's closed range, else ERR_MENU_CYCLE_DATE_OVERLAP"
        side_effects:
          - "signed_off_by_user_id = X-User-ID"
          - "cascade: every other MenuCycle of the community with status == PUBLISHED and effective_end_date < this cycle's effective_start_date moves to ARCHIVED"
          - "recomputes Community.active_menu_cycle_id"
      - from: PUBLISHED
        to: REFRESH_PENDING
        trigger: "system auto-transition inside POST /menu-cycles/{id}/committee-feedback when menu_refresh_index step 5 returns eligible_for_refresh == true"
        actor: system
        preconditions:
          - "status == PUBLISHED"
          - "refresh_index >= REFRESH_THRESHOLD[refresh_tier]"
        side_effects:
          - "refresh_index and refresh_tier persisted from calculation menu_refresh_index"
          - "recomputes Community.active_menu_cycle_id to null (the cycle is no longer PUBLISHED)"
      - from: REFRESH_PENDING
        to: DRAFT
        trigger: "POST /menu-cycles/{id}/refresh"
        actor: DiningServicesManager
        preconditions: ["status == REFRESH_PENDING"]
        side_effects:
          - "refresh_round += 1; refresh_reason stored; refresh_index reset to 0.00 and refresh_tier reset to ADVISORY"
          - "cascade: every CommitteeFeedback of this cycle with status == SUBMITTED moves to ACKNOWLEDGED"
          - "cascade: every TherapeuticExtension with review_status == APPROVED whose MenuItem belongs to this cycle moves to RETIRED, which in turn recomputes that MenuItem.extension_coverage_status"
        note: "Cyclic edge: DRAFT -> PENDING_DIETITIAN_SIGNOFF -> PUBLISHED -> REFRESH_PENDING -> DRAFT."
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system cascade from a later cycle's publish"
        actor: system
        preconditions: ["effective_end_date < the publishing cycle's effective_start_date"]
        side_effects: ["recomputes Community.active_menu_cycle_id"]

  # -------------------------------------------------------- SeatingReservation
  - entity: SeatingReservation
    initial_state: RESERVED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: "(none)"
        to: RESERVED
        trigger: "POST /seating-reservations"
        actor: DiningServicesManager
        preconditions:
          - "payload expected_venue_version == DiningVenue.version (OCC, §1.2.1 reservation-create-stale-venue)"
          - "Resident.dining_status == ACTIVE"
          - "DiningVenue.status == OPEN AND temp_compliance_posture != SUSPENDED"
          - "Resident.care_level IN DiningVenue.care_levels_served"
          - "the resident has a DietOrder with clinical_status == ACTIVE AND review_status == APPROVED"
          - "no resident-side interval collision per calculation resident_meal_spacing_conflict"
          - "venue_committed_seats over the candidate's conflict set + party_size <= DiningVenue.seat_capacity per calculation venue_capacity_conflict"
        side_effects:
          - "seat_end_utc = seat_start_utc + DiningVenue.seating_turn_minutes"
          - "increments DiningVenue.version by 1"
      - from: "(none)"
        to: WAITLISTED
        trigger: "POST /seating-reservations with allow_waitlist == true when the capacity check fails"
        actor: DiningServicesManager
        preconditions:
          - "every RESERVED precondition holds except the capacity check"
          - "payload allow_waitlist == true"
        side_effects:
          - "seat_end_utc computed identically; suspension_hold stays false"
          - "increments DiningVenue.version by 1"
          - "the row is excluded from venue_committed_seats and from CENSUS_PROJECTION"
      - from: WAITLISTED
        to: RESERVED
        trigger: "system waitlist promotion, cascade hop 3 of the ticket-void chain"
        actor: system
        preconditions:
          - "the freed reservation's (venue_id, service_date, meal_period) matches this row"
          - "DiningVenue.temp_compliance_posture == COMPLIANT"
          - "venue_committed_seats after the release + this row's party_size <= DiningVenue.seat_capacity"
          - "this row is the promotion selector winner (created_at ASC, no other ordering input)"
        side_effects:
          - "suspension_hold set to false"
          - "increments DiningVenue.version by 1"
      - from: RESERVED
        to: WAITLISTED
        trigger: "system cascade hop 3 of the temperature-violation chain (venue posture escalated to SUSPENDED)"
        actor: system
        preconditions:
          - "status == RESERVED AND seat_start_utc >= the logical clock"
        side_effects:
          - "suspension_hold = true"
          - "the row leaves venue_committed_seats"
      - from: RESERVED
        to: SEATED
        trigger: "POST /seating-reservations/{id}/seat"
        actor: DiningServicesManager | SatelliteKitchenLead
        preconditions:
          - "status == RESERVED"
          - "DiningVenue.temp_compliance_posture != SUSPENDED"
          - "the resident's tray card for (service_date, meal_period) has tray_status != BLOCKED, else ERR_UNSAFE_TRAY_NO_SUBSTITUTION"
          - "the resident still has a DietOrder with clinical_status == ACTIVE AND review_status == APPROVED"
        side_effects:
          - "seated_at = logical clock"
          - "cascade: a MealServiceTicket is created with ticket_type = RESIDENT, reservation_id = this row, venue/service_date/meal_period copied, status ISSUED, billed_amount_cents from calculation ticket_billed_amount"
      - from: SEATED
        to: COMPLETED
        trigger: "system cascade from POST /meal-tickets/{id}/serve on the linked ticket"
        actor: system
        preconditions: ["status == SEATED AND the served ticket's reservation_id == this row"]
        side_effects: ["the row still counts in CENSUS_PROJECTION and in resident_meal_spacing_conflict, but leaves venue_committed_seats"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /seating-reservations/{id}/release"
        actor: DiningServicesManager
        preconditions: ["status IN {RESERVED, WAITLISTED, SEATED}"]
        side_effects:
          - "increments DiningVenue.version by 1"
          - "cascade: waitlist promotion selector runs for (venue_id, service_date, meal_period)"
      - from: SEATED
        to: RELEASED
        trigger: "system cascade hop 2 of the ticket-void chain"
        actor: system
        preconditions: ["status IN {SEATED, COMPLETED} AND the voided ticket's reservation_id == this row"]
        side_effects:
          - "cascade hop 3: waitlist promotion selector runs for (venue_id, service_date, meal_period)"
          - "the row leaves venue_committed_seats and leaves CENSUS_PROJECTION"

  # ------------------------------------------------------- MealServiceTicket
  - entity: MealServiceTicket
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: "(none)"
        to: ISSUED
        trigger: "POST /meal-tickets, or system cascade from POST /seating-reservations/{id}/seat"
        actor: DiningServicesManager | SatelliteKitchenLead | system
        preconditions:
          - "DiningVenue.temp_compliance_posture != SUSPENDED"
          - "when temp_compliance_posture == WATCH: ticket_type == RESIDENT, else ERR_VENUE_POSTURE_RESTRICTED"
          - "when ticket_type == RESIDENT: resident_id != null AND that resident has a DietOrder with clinical_status == ACTIVE AND review_status == APPROVED"
          - "when reservation_id != null: that reservation's resident_id == payload resident_id AND venue_id == payload venue_id"
          - "no FINALIZED BillingReconciliation of the venue's community covers service_date, else ERR_PERIOD_CLOSED"
          - "for GUEST/TAKEOUT with resident_id != null: Resident.guest_meal_charge_balance_cents + the computed billed_amount_cents <= Community.guest_meal_sponsor_cap_cents"
        side_effects:
          - "billed_amount_cents from calculation ticket_billed_amount"
          - "recomputes Resident.guest_meal_charge_balance_cents when resident_id != null"
      - from: ISSUED
        to: SERVED
        trigger: "POST /meal-tickets/{id}/serve"
        actor: SatelliteKitchenLead | DiningServicesManager
        preconditions:
          - "status == ISSUED"
          - "DiningVenue.temp_compliance_posture != SUSPENDED"
        side_effects:
          - "cascade: when reservation_id != null and that reservation is SEATED, it moves to COMPLETED"
      - from: SERVED
        to: BILLED
        trigger: "system cascade from POST /reconciliations/{id}/finalize"
        actor: system
        preconditions:
          - "status == SERVED AND service_date IN [period_start_date, period_end_date] of the finalizing reconciliation"
        side_effects:
          - "billed_reconciliation_id = the finalizing reconciliation's id"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /meal-tickets/{id}/void"
        actor: BillingSpecialist
        preconditions: ["status IN {ISSUED, SERVED, BILLED}"]
        side_effects:
          - "voided_amount_cents = billed_amount_cents before the write; billed_amount_cents = 0"
          - "recomputes Resident.guest_meal_charge_balance_cents when resident_id != null"
          - "cascade hop 2: a linked reservation with status IN {SEATED, COMPLETED} moves to RELEASED"
      - from: SERVED
        to: VOIDED
        trigger: "POST /meal-tickets/{id}/void"
        actor: BillingSpecialist
        preconditions: ["status IN {ISSUED, SERVED, BILLED}"]
        side_effects:
          - "identical to the ISSUED -> VOIDED edge; the chain continues into hop 3 (waitlist promotion)"
      - from: BILLED
        to: VOIDED
        trigger: "POST /meal-tickets/{id}/void"
        actor: BillingSpecialist
        preconditions: ["status == BILLED AND billed_reconciliation_id != null"]
        side_effects:
          - "the void becomes a chargeback: it enters void_credit_cents of any LATER reconciliation whose period covers service_date"

  # ---------------------------------------------------------- DiningVenue posture
  - entity: DiningVenue
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "POST /venues/{id}/temperature-logs producing in_range == false"
        actor: SatelliteKitchenLead | DiningServicesManager
        preconditions: ["consecutive_temp_violation_count after this log == 2 (POSTURE_WATCH_AT)"]
        side_effects:
          - "consecutive_temp_violation_count += 1"
          - "GUEST and TAKEOUT ticket issuance is now rejected with ERR_VENUE_POSTURE_RESTRICTED; RESIDENT tickets still allowed"
      - from: WATCH
        to: SUSPENDED
        trigger: "POST /venues/{id}/temperature-logs producing in_range == false"
        actor: SatelliteKitchenLead | DiningServicesManager
        preconditions: ["consecutive_temp_violation_count after this log >= 3 (POSTURE_SUSPEND_AT)"]
        side_effects:
          - "consecutive_temp_violation_count += 1"
          - "cascade hop 3: every SeatingReservation of this venue with status == RESERVED and seat_start_utc >= the logical clock moves to WAITLISTED with suspension_hold = true"
          - "all ticket issuance and service at this venue is rejected"
      - from: SUSPENDED
        to: COMPLIANT
        trigger: "POST /venues/{id}/temperature-logs with corrective_action_code != null producing in_range == true"
        actor: SatelliteKitchenLead
        preconditions: ["in_range == true AND corrective_action_code != null"]
        side_effects:
          - "consecutive_temp_violation_count reset to 0"
          - "reservations held with suspension_hold == true are NOT auto-restored; they remain WAITLISTED until the promotion selector runs"
      - from: WATCH
        to: COMPLIANT
        trigger: "POST /venues/{id}/temperature-logs with corrective_action_code != null producing in_range == true"
        actor: SatelliteKitchenLead
        preconditions: ["in_range == true AND corrective_action_code != null"]
        side_effects: ["consecutive_temp_violation_count reset to 0"]
      - from: COMPLIANT
        to: COMPLIANT
        trigger: "POST /venues/{id}/temperature-logs producing in_range == true with corrective_action_code == null"
        actor: SatelliteKitchenLead | DiningServicesManager
        preconditions: ["consecutive_temp_violation_count after this log <= 1"]
        side_effects: ["an in-range log WITHOUT corrective_action_code does NOT reset consecutive_temp_violation_count"]
        note: "Sticky counter: only a corrective log resets the streak, so an in-range reading between two violations still leaves the venue on 2 and escalates to WATCH."

  # -------------------------------------------------------- PlanOfCareReview
  - entity: PlanOfCareReview
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: "(none)"
        to: OPEN
        trigger: "system cascade hop 2 of POST /residents/{id}/intake-observations"
        actor: system
        preconditions:
          - "after the observation, Resident.rolling_30d_weight_change_pct <= -5.00 OR Resident.avg_intake_pct_7d < 50.00"
          - "the resident has no PlanOfCareReview with status == OPEN"
        side_effects:
          - "risk_score_at_open = Resident.intake_risk_score after the recompute; trigger_reason from the breach set"
          - "cascade hop 3: the resident's DietOrder with clinical_status == ACTIVE moves review_status APPROVED -> REREVIEW_REQUIRED"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /plan-of-care-reviews/{id}/complete with outcome == NO_CHANGE"
        actor: RegisteredDietitian
        preconditions:
          - "status == OPEN"
          - "X-User-ID != the trigger IntakeObservation.recorded_by_user_id (segregation of duties)"
        side_effects:
          - "completed_by_user_id = X-User-ID; no cross-entity mutation"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /plan-of-care-reviews/{id}/complete with outcome == DIET_ORDER_REREVIEW"
        actor: RegisteredDietitian
        preconditions:
          - "status == OPEN"
          - "X-User-ID != the trigger IntakeObservation.recorded_by_user_id (segregation of duties)"
          - "the resident has a DietOrder with clinical_status == ACTIVE, else ERR_DIET_ORDER_NOT_VERIFIED"
        side_effects:
          - "that DietOrder's review_status is forced to REREVIEW_REQUIRED when it is APPROVED (idempotent when already REREVIEW_REQUIRED)"
          - "Resident.tray_card_state -> HOLD_PENDING_REVIEW"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /plan-of-care-reviews/{id}/complete with outcome == ESCALATED"
        actor: RegisteredDietitian
        preconditions:
          - "status == OPEN"
          - "X-User-ID != the trigger IntakeObservation.recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Resident.tray_card_state -> BLOCKED (service halted pending physician follow-up)"
          - "no DietOrder mutation"
        note: "Branching machine: three outcomes, three disjoint side-effect sets."

  # ------------------------------------------------------ BillingReconciliation
  - entity: BillingReconciliation
    initial_state: RECONCILED
    terminal_states: [FINALIZED]
    transitions:
      - from: "(none)"
        to: RECONCILED
        trigger: "POST /reconciliations"
        actor: BillingSpecialist
        preconditions:
          - "Community exists AND period_end_date >= period_start_date"
          - "no FINALIZED BillingReconciliation of the same community has a period whose closed date range intersects the requested range, else ERR_PERIOD_CLOSED"
        side_effects:
          - "both variants of calculation meal_count_reconciliation are computed and stored, plus variance_cents"
          - "calculation reconciliation_net_billable runs in its pinned step order"
      - from: RECONCILED
        to: FINALIZED
        trigger: "POST /reconciliations/{id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "status == RECONCILED"
          - "recomputing both variants reproduces the stored net_billable_total_cents, else ERR_RECONCILIATION_STALE"
          - "abs(variance_cents) <= Community.variance_tolerance_cents OR variance_note is supplied"
        side_effects:
          - "finalized_by_user_id = X-User-ID"
          - "cascade: every MealServiceTicket with status == SERVED and service_date inside the period moves to BILLED with billed_reconciliation_id = this reconciliation"

concurrency_rules:
  - rule_id: diet-order-create-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /diet-orders"
    occ_field: "expected_resident_version"
    description: |
      Creating a DietOrder against a Resident whose version has advanced since
      the client last observed it is rejected. A new order legitimately
      supersedes the resident's currently ACTIVE order once approved, so the
      second writer's create would otherwise succeed on identical state; the
      OCC check on Resident.version forces the writer to re-read the resident's
      order history before layering a second supersede on top of a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-venue
    parent_entity: DiningVenue
    write_endpoint: "POST /seating-reservations"
    occ_field: "expected_venue_version"
    description: |
      Creating a SeatingReservation against a DiningVenue whose version has
      advanced since the client last observed it is rejected. Seat capacity is
      a legitimately shared pool, so a writer holding a stale venue view would
      otherwise succeed against capacity numbers that no longer exist; the OCC
      check on DiningVenue.version turns that into a deterministic stale-version
      rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: ticket_billed_amount
    trigger: "POST /meal-tickets, and the cascade inside POST /seating-reservations/{id}/seat"
    algorithm: tiered_pricing
    formula: |
      # MODE (b) COMBINATORIAL RULE: nested rounding whose ORDER changes the cents.
      # PINNED ORDER — round EACH component to whole cents (round_half_up) and
      # THEN sum. Summing unrounded components and rounding once at the end is
      # explicitly WRONG and yields a different value (see the TAKEOUT example).
      base_cents = RATE[ticket_type][meal_period]
      sponsor_eligible = (ticket_type IN {GUEST, TAKEOUT})
                         AND resident_id != null
                         AND Resident.dining_status == 'ACTIVE'
      # step 1 - rounded component
      guest_discount_cents = sponsor_eligible
                             ? round_half_up(base_cents * SPONSOR_DISCOUNT_PCT)
                             : 0
      packaging_cents = (ticket_type == 'TAKEOUT') ? PACKAGING_FEE_CENTS : 0
      # step 2 - integer subtotal built from already-rounded components
      subtotal_cents = base_cents - guest_discount_cents + packaging_cents
      # step 3 - tax computed on the ROUNDED subtotal, then rounded itself
      tax_cents = (ticket_type IN {GUEST, TAKEOUT})
                  ? round_half_up(subtotal_cents * MEALS_TAX_PCT)
                  : 0
      billed_amount_cents = subtotal_cents + tax_cents
      # Worked pin: TAKEOUT/DINNER sponsored ->
      #   1450 - round_half_up(181.25)=181 + 175 = 1444 ; tax round_half_up(104.69)=105
      #   billed_amount_cents = 1549
      #   (sum-then-round would give 1443.75 + 104.672 = 1548.42 -> 1548, WRONG)
    input_set: "One ticket in isolation; RESIDENT tickets are an internal transfer priced from RATE with no discount, no packaging and no tax"
    constants:
      RATE:
        RESIDENT: { BREAKFAST: 400, LUNCH: 650, DINNER: 800 }
        GUEST: { BREAKFAST: 850, LUNCH: 1250, DINNER: 1650 }
        TAKEOUT: { BREAKFAST: 700, LUNCH: 1100, DINNER: 1450 }
      SPONSOR_DISCOUNT_PCT: 0.125
      PACKAGING_FEE_CENTS: 175
      MEALS_TAX_PCT: 0.0725
    precision: "whole cents, round_half_up applied per component (never once at the end)"

  - name: meal_count_reconciliation
    trigger: "POST /reconciliations, and re-executed as the staleness guard inside POST /reconciliations/{id}/finalize"
    algorithm: aggregation
    formula: |
      # Two independent, both-valid readings of the SAME period.
      period = [period_start_date, period_end_date]        # inclusive both ends
      venues_in_scope = DiningVenue rows with community_id == this community
      # ---- variant TICKET_LEDGER (what the point-of-service actually recorded)
      ledger_tickets = MealServiceTicket t where t.venue_id IN venues_in_scope
                       AND t.service_date IN period
                       AND t.status IN {SERVED, BILLED}
      ticket_ledger_total_cents = sum(t.billed_amount_cents for t in ledger_tickets)
      ledger_meal_counts = count of ledger_tickets grouped by ticket_type
                           (all three keys always present, zero-filled)
      # ---- variant CENSUS_PROJECTION (what the reservation book projected)
      census_reservations = SeatingReservation r where r.venue_id IN venues_in_scope
                            AND r.service_date IN period
                            AND r.status IN {RESERVED, SEATED, COMPLETED}
      census_resident_cents = sum(RATE['RESIDENT'][r.meal_period] for r in census_reservations)
      census_guest_tickets = MealServiceTicket t where t.venue_id IN venues_in_scope
                             AND t.service_date IN period
                             AND t.ticket_type IN {GUEST, TAKEOUT}
                             AND t.status IN {SERVED, BILLED}
      census_projection_total_cents = census_resident_cents
                                    + sum(t.billed_amount_cents for t in census_guest_tickets)
      census_meal_counts = { RESIDENT: count(census_reservations),
                             GUEST: count(census_guest_tickets with ticket_type GUEST),
                             TAKEOUT: count(census_guest_tickets with ticket_type TAKEOUT) }
      variance_cents = ticket_ledger_total_cents - census_projection_total_cents
    input_set: |
      TICKET_LEDGER counts only tickets that reached SERVED or BILLED (ISSUED and
      VOIDED excluded). CENSUS_PROJECTION prices resident meals from the
      reservation book (RESERVED, SEATED and COMPLETED all count; WAITLISTED and
      RELEASED never count) and reuses the ticket ledger for GUEST/TAKEOUT.
      A walk-in RESIDENT ticket (reservation_id == null) therefore raises the
      ledger only, and a RESERVED-but-never-seated reservation raises the census
      only.
    constants:
      RATE_RESIDENT: { BREAKFAST: 400, LUNCH: 650, DINNER: 800 }
    precision: "integer cents; no rounding occurs (all inputs are already whole cents)"
    variants:
      - name: TICKET_LEDGER
        when: "Always computed; it is the figure the community invoices against"
        difference: "Chronological point-of-service reading: only tickets that actually reached SERVED/BILLED contribute, so no-shows vanish and walk-ins appear"
      - name: CENSUS_PROJECTION
        when: "Always computed; it is the figure the census/reservation book projects"
        difference: "Forward-looking reading: every non-released reservation contributes its RESIDENT transfer rate even when no ticket was ever issued, so no-shows are charged and walk-ins are invisible"

  - name: reconciliation_net_billable
    trigger: "POST /reconciliations, and re-executed inside POST /reconciliations/{id}/finalize"
    algorithm: threshold
    formula: |
      # MODE (c) COMBINATORIAL RULE: circular-looking dependency.
      # net_billable_total_cents = pre_fee_base_cents + administrative_fee_cents,
      # while administrative_fee_cents comes from a tier that LOOKS like it should
      # be keyed on the total. The evaluation order below is normative: the tier
      # is keyed on step 3 (pre_fee_base_cents) and NEVER on step 6.
      # step 1
      gross_cents = ticket_ledger_total_cents          # from meal_count_reconciliation
      # step 2 - chargebacks only: a void of a ticket a PRIOR reconciliation billed
      void_credit_cents = sum(t.voided_amount_cents
                              for t in MealServiceTicket
                              where t.venue_id IN venues_in_scope
                                AND t.service_date IN period
                                AND t.status == 'VOIDED'
                                AND t.billed_reconciliation_id != null)
      # step 3
      pre_fee_base_cents = max(0, gross_cents - void_credit_cents)
      # step 4 - tier keyed on step 3
      admin_fee_tier = pre_fee_base_cents <= ADMIN_TIER_SMALL_MAX ? 'SMALL'
                     : pre_fee_base_cents <= ADMIN_TIER_MID_MAX   ? 'MID'
                     : 'LARGE'
      # step 5
      administrative_fee_cents = round_half_up(pre_fee_base_cents * ADMIN_FEE_PCT[admin_fee_tier])
      # step 6
      net_billable_total_cents = pre_fee_base_cents + administrative_fee_cents
      # Worked pin: pre_fee_base_cents = 3386 -> SMALL -> round_half_up(203.16)=203
      #   -> net 3589. Keying the tier on 3589 would give MID (0.045) -> 152
      #   -> net 3538, which is WRONG.
    input_set: "Single BillingReconciliation row; gross_cents is the TICKET_LEDGER variant output, never the CENSUS_PROJECTION one"
    constants:
      ADMIN_TIER_SMALL_MAX: 3500
      ADMIN_TIER_MID_MAX: 20000
      ADMIN_FEE_PCT: { SMALL: 0.06, MID: 0.045, LARGE: 0.03 }
    precision: "whole cents, round_half_up, single rounding at step 5"

  - name: resident_weight_trend
    trigger: "POST /residents/{id}/intake-observations (cascade hop 1)"
    algorithm: chronological
    formula: |
      clock_date = date part of the logical clock
      # ---- variant ROLLING_30D (gating variant)
      window = [clock_date - 30 days, clock_date]           # inclusive both ends
      w_obs = IntakeObservation rows of the resident with weight_kg != null
              AND observation_date IN window,
              sorted by observation_date ASC, created_at ASC     # never by id
      if count(w_obs) < 2:
          rolling_30d_weight_change_pct = 0.00
      else:
          earliest = w_obs.first.weight_kg
          latest   = w_obs.last.weight_kg
          rolling_30d_weight_change_pct = round_half_up((latest - earliest) / earliest * 100, 2)
      # ---- variant BASELINE_ANCHORED (reported only)
      all_w_obs = IntakeObservation rows of the resident with weight_kg != null,
                  sorted by observation_date DESC, created_at DESC
      current_weight_kg = all_w_obs.first.weight_kg if any else Resident.baseline_weight_kg
      baseline_weight_change_pct = round_half_up(
          (current_weight_kg - Resident.baseline_weight_kg) / Resident.baseline_weight_kg * 100, 2)
      # ---- 7-day intake window
      intake_window = [clock_date - 6 days, clock_date]     # inclusive both ends
      i_obs = IntakeObservation rows of the resident with observation_date IN intake_window
      avg_intake_pct_7d = count(i_obs) == 0 ? null
                          : round_half_up(sum(i_obs.intake_pct) / count(i_obs), 2)
    input_set: |
      ROLLING_30D uses only observations inside the 30-day window and only those
      carrying a weight; BASELINE_ANCHORED uses the newest weight of all time
      against Resident.baseline_weight_kg. Ties on observation_date are broken by
      created_at ASC (ROLLING_30D) / created_at DESC (current weight); id is never
      an ordering input.
    constants:
      WEIGHT_WINDOW_DAYS: 30
      INTAKE_WINDOW_DAYS: 7
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_30D
        when: "Always computed; the ONLY variant the plan-of-care trigger reads"
        difference: "Measures the newest weight against the OLDEST weight still inside the 30-day window, so a gain followed by a loss shows the full intra-window swing"
      - name: BASELINE_ANCHORED
        when: "Always computed; surfaced on Resident.baseline_weight_change_pct for clinical reporting"
        difference: "Measures the newest weight against the admission baseline, so the same observations can read -2.56% here while ROLLING_30D reads -5.00%"

  - name: intake_risk_score
    trigger: "POST /residents/{id}/intake-observations, and any DietOrder transition that changes which order is ACTIVE"
    algorithm: weighted_scoring
    formula: |
      # MODE (a) COMBINATORIAL RULE: five inputs, tiered selection on two of them,
      # nested min/max, and a conditional multiplier branching on entity state.
      active = the resident's DietOrder with clinical_status == 'ACTIVE' (at most one)
      weight_points = rolling_30d_weight_change_pct <= -10.00 ? 40
                    : rolling_30d_weight_change_pct <= -5.00  ? 30
                    : rolling_30d_weight_change_pct <= -2.00  ? 15
                    : 0
      intake_points = avg_intake_pct_7d == null ? 0
                    : avg_intake_pct_7d < 25.00 ? 40
                    : avg_intake_pct_7d < 50.00 ? 30
                    : avg_intake_pct_7d < 75.00 ? 15
                    : 0
      texture_points      = active == null ? 0 : TEXTURE_RANK[active.texture_level] * 5
      therapeutic_points  = active == null ? 0 : min(10, 5 * count(active.therapeutic_codes))
      liquid_points       = (active != null AND LIQUID_RANK[active.liquid_consistency] >= 2) ? 10 : 0
      raw = weight_points + intake_points + texture_points + therapeutic_points + liquid_points
      severity_multiplier = Resident.dining_status == 'ON_LEAVE' ? 0.50 : 1.00
      intake_risk_score = round_half_up(min(100.00, max(0.00, raw * severity_multiplier)), 2)
    input_set: "Only the resident's single ACTIVE DietOrder contributes texture/therapeutic/liquid points; PENDING_REVIEW, SUPERSEDED and DISCONTINUED orders contribute nothing"
    constants:
      TEXTURE_RANK: { REGULAR: 0, BITE_SIZED: 1, MINCED_MOIST: 2, PUREED: 3 }
      LIQUID_RANK: { THIN: 0, SLIGHTLY_THICK: 1, MILDLY_THICK: 2, MODERATELY_THICK: 3, EXTREMELY_THICK: 4 }
      SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up, single rounding after the multiplier"

  - name: plan_of_care_trigger
    trigger: "POST /residents/{id}/intake-observations, evaluated after resident_weight_trend and intake_risk_score have been written (cascade hop 2)"
    algorithm: threshold
    formula: |
      weight_breach = Resident.rolling_30d_weight_change_pct <= WEIGHT_LOSS_TRIGGER_PCT   # <= is inclusive
      intake_breach = Resident.avg_intake_pct_7d != null
                      AND Resident.avg_intake_pct_7d < INTAKE_TRIGGER_PCT                # < is strict
      open_exists = a PlanOfCareReview of this resident with status == 'OPEN' exists
      if (weight_breach OR intake_breach) AND NOT open_exists:
          trigger_reason = weight_breach AND intake_breach ? 'COMBINED'
                         : weight_breach ? 'WEIGHT_LOSS_30D'
                         : 'LOW_INTAKE_AVG'
          open a PlanOfCareReview with risk_score_at_open = Resident.intake_risk_score
                and trigger_observation_id = the observation just created
    input_set: "Exactly one review may be OPEN per resident; a further breach while one is OPEN opens nothing and mutates nothing"
    constants:
      WEIGHT_LOSS_TRIGGER_PCT: -5.00
      INTAKE_TRIGGER_PCT: 50.00
    precision: "comparisons on 2-decimal values; -5.00 exactly DOES breach, -4.99 does not; avg intake exactly 50.00 does NOT breach"

  - name: venue_capacity_conflict
    trigger: "POST /seating-reservations, and the waitlist-promotion selector"
    algorithm: interval_merge
    formula: |
      # Venue-side interval semantics: HALF-OPEN intervals, ONE-SIDED buffer on the
      # incumbent's tail, AGGREGATE capacity.
      candidate = [seat_start_utc, seat_start_utc + venue.seating_turn_minutes)
      occupation(r) = [r.seat_start_utc, r.seat_end_utc + venue.turnover_buffer_minutes)
      conflict_set = { r : r.venue_id == venue.id
                           AND r.service_date == candidate.service_date
                           AND r.status IN {RESERVED, SEATED}
                           AND occupation(r) INTERSECTS candidate }
      committed = sum(r.party_size for r in conflict_set)
      capacity_ok = (committed + candidate.party_size) <= venue.seat_capacity
      if NOT capacity_ok:
          allow_waitlist ? create the row as WAITLISTED : ERR_VENUE_CAPACITY_EXCEEDED
    input_set: "Only RESERVED and SEATED rows occupy seats; COMPLETED, RELEASED and WAITLISTED rows never do. Half-open arithmetic means a candidate starting exactly at occupation(r)'s exclusive end does NOT conflict"
    constants:
      DEFAULT_SEATING_TURN_MINUTES: 60
      DEFAULT_TURNOVER_BUFFER_MINUTES: 20
    precision: "minute granularity; boundary is exclusive at the buffered tail end"

  - name: resident_meal_spacing_conflict
    trigger: "POST /seating-reservations"
    algorithm: interval_merge
    formula: |
      # Resident-side interval semantics: CLOSED intervals, SYMMETRIC gap, capacity 1,
      # venue-independent, and COMPLETED rows still count. Deliberately different
      # geometry from venue_capacity_conflict.
      candidate = [seat_start_utc, seat_end_utc]                                   # CLOSED
      occupation(r) = [r.seat_start_utc - MIN_MEAL_GAP_MINUTES,
                       r.seat_end_utc   + MIN_MEAL_GAP_MINUTES]                    # CLOSED
      conflict = EXISTS r : r.resident_id == candidate.resident_id
                            AND r.status IN {RESERVED, SEATED, COMPLETED}
                            AND occupation(r) INTERSECTS candidate                 # touching endpoints DO intersect
      if conflict: ERR_RESIDENT_MEAL_SPACING
    input_set: "All venues of all communities are searched for the resident; WAITLISTED and RELEASED rows are ignored"
    constants:
      MIN_MEAL_GAP_MINUTES: 90
    precision: "minute granularity; a candidate starting exactly MIN_MEAL_GAP_MINUTES after an incumbent's seat_end_utc DOES conflict (closed interval), and must start at least one minute later"

  - name: venue_committed_seats
    trigger: "GET /venues/{id}/seat-availability, and as the conserved quantity of the reserve/release invariant"
    algorithm: aggregation
    formula: |
      venue_committed_seats(venue_id, service_date, meal_period) =
          sum(r.party_size for r in SeatingReservation
              where r.venue_id == venue_id
                AND r.service_date == service_date
                AND r.meal_period == meal_period
                AND r.status IN {RESERVED, SEATED})
      open_seats = max(0, venue.seat_capacity - venue_committed_seats)
      blocking_reservation_ids = ids of the summed rows, sorted by created_at ASC
    input_set: "Meal-period roll-up (NOT the interval conflict set of venue_capacity_conflict); RESERVED and SEATED only"
    constants: {}
    precision: "integer seats; open_seats is floored at 0. The roll-up spans the whole meal period, so it can legitimately exceed seat_capacity when two disjoint seating turns are booked inside one meal period — which is precisely why the interval-level check in venue_capacity_conflict, not this roll-up, gates writes"

  - name: community_billable_cents
    trigger: "Conserved quantity of the ticket issue/void invariant; recomputed on demand"
    algorithm: aggregation
    formula: |
      community_billable_cents(community_id, period) =
          sum(t.billed_amount_cents for t in MealServiceTicket
              where t.venue_id IN venues of community_id
                AND t.service_date IN period
                AND t.status IN {SERVED, BILLED})
        - sum(t.voided_amount_cents for t in MealServiceTicket
              where t.venue_id IN venues of community_id
                AND t.service_date IN period
                AND t.status == 'VOIDED'
                AND t.billed_reconciliation_id != null)
    input_set: "The credit term is restricted to tickets a prior reconciliation already billed, so voiding a never-billed ticket removes it from the first term without adding a credit"
    constants: {}
    precision: "integer cents"

  - name: tray_card_resolution
    trigger: "GET /residents/{id}/tray-card, and the tray_status gate inside POST /seating-reservations/{id}/seat"
    algorithm: constraint_propagation
    formula: |
      cycle = the MenuCycle with status == 'PUBLISHED', community_id == resident.community_id,
              and service_date IN [effective_start_date, effective_end_date]
      if cycle == null: ERR_NO_PUBLISHED_MENU_CYCLE
      day_index = ((service_date - cycle.effective_start_date).days MOD (cycle.week_count * 7)) + 1
      items = MenuItem rows of the cycle with day_index and meal_period matching,
              sorted by item_code ASC                                   # never by id
      active = the resident's DietOrder with clinical_status == 'ACTIVE'
      for each item:
          # --- eligibility filter: candidate substitution rules
          candidates = SubstitutionRule rows of the resident with status == 'ACTIVE' and:
            trigger_type == 'ALLERGEN' AND match_value IN item.allergen_tags
            OR trigger_type == 'TEXTURE' AND active != null
               AND TEXTURE_RANK[item.base_texture] < TEXTURE_RANK[active.texture_level]
            OR trigger_type == 'DISLIKE' AND match_value == item.item_code
               AND Resident.preference_strictness == 'STRICT'
          # --- ranking expression, then tie-break
          winner = candidates sorted by TRIGGER_PRIORITY[trigger_type] ASC,
                                        priority_rank ASC,
                                        created_at ASC                  # never by id
                   .first
          # --- outcome per line
          unresolved_allergen = EXISTS a IN item.allergen_tags : a IN Resident.allergens
                                AND NOT EXISTS c IN candidates : c.trigger_type == 'ALLERGEN'
                                                                 AND c.match_value == a
          extension_pending = active != null AND EXISTS code IN active.therapeutic_codes :
                                code IN item.required_therapeutic_codes
                                AND NO TherapeuticExtension of the item with diet_code == code
                                    has review_status == 'APPROVED'
          line.reason = unresolved_allergen ? 'ALLERGEN_UNRESOLVED'
                      : extension_pending  ? 'EXTENSION_PENDING'
                      : winner == null     ? 'NONE'
                      : winner.trigger_type == 'ALLERGEN' ? 'ALLERGEN_SUBSTITUTION'
                      : winner.trigger_type == 'TEXTURE'  ? 'TEXTURE_SUBSTITUTION'
                      : 'DISLIKE_SUBSTITUTION'
          line.served_item_code = winner == null ? item.item_code : winner.replacement_item_code
          line.substitution_rule_id = winner == null ? null : winner.id
      blocked_item_codes = item_codes whose line.reason IN {ALLERGEN_UNRESOLVED, EXTENSION_PENDING},
                           sorted by item_code ASC
      tray_status = blocked_item_codes non-empty ? 'BLOCKED'
                  : Resident.tray_card_state == 'HOLD_PENDING_REVIEW' ? 'HOLD_PENDING_REVIEW'
                  : Resident.tray_card_state == 'BLOCKED' ? 'BLOCKED'
                  : 'CLEAR'
    input_set: "Empty candidate set falls back to the base item unchanged (reason NONE); an empty item set for the requested (day_index, meal_period) yields lines == [] with tray_status derived from Resident.tray_card_state alone"
    constants:
      TRIGGER_PRIORITY: { ALLERGEN: 0, TEXTURE: 1, DISLIKE: 2 }
    precision: "deterministic ordering: item_code ASC for lines, (TRIGGER_PRIORITY, priority_rank, created_at) for the winner"

  - name: menu_refresh_index
    trigger: "POST /menu-cycles/{id}/committee-feedback, evaluated after the ballot is persisted"
    algorithm: threshold
    formula: |
      eligible_resident_count = count(Resident r : r.community_id == cycle.community_id
                                                   AND r.dining_status == 'ACTIVE')
      ballots = CommitteeFeedback f : f.menu_cycle_id == cycle.id AND f.status == 'SUBMITTED'
      negative_weight = sum(f.vote_weight for f in ballots where f.sentiment == 'NEGATIVE')
      distinct_voters = count(distinct f.resident_id for f in ballots)
      # step order is normative: participation -> tier -> index -> threshold
      participation_pct = round_half_up(distinct_voters * 100 / max(1, eligible_resident_count), 2)
      refresh_tier = participation_pct >= QUORUM_PARTICIPATION_PCT ? 'QUORUM' : 'ADVISORY'
      refresh_index = round_half_up(negative_weight * TIER_WEIGHT[refresh_tier] * 100
                                    / max(1, eligible_resident_count), 2)
      eligible_for_refresh = refresh_index >= REFRESH_THRESHOLD[refresh_tier]
      if eligible_for_refresh AND cycle.status == 'PUBLISHED': cycle.status -> 'REFRESH_PENDING'
    input_set: "Only SUBMITTED ballots of this cycle count; ACKNOWLEDGED ballots (consumed by a prior refresh) are excluded, which is what lets a refreshed cycle start a fresh loop"
    constants:
      QUORUM_PARTICIPATION_PCT: 40.00
      TIER_WEIGHT: { QUORUM: 1.0, ADVISORY: 0.6 }
      REFRESH_THRESHOLD: { QUORUM: 25.00, ADVISORY: 40.00 }
    precision: "2 decimal places, round_half_up; participation exactly 40.00 IS quorum, refresh_index exactly at threshold IS eligible"

  - name: temperature_posture
    trigger: "POST /venues/{id}/temperature-logs"
    algorithm: threshold
    formula: |
      in_range = probe_point == 'HOT_HOLDING' ? temperature_f >= 135.0
               : probe_point == 'COLD_HOLDING' ? temperature_f <= 41.0
               : temperature_f >= 165.0                                   # REHEAT
      if in_range AND corrective_action_code != null:
          consecutive_temp_violation_count = 0                            # only resetting path
      else if NOT in_range:
          consecutive_temp_violation_count += 1
      # an in-range log WITHOUT a corrective_action_code leaves the counter untouched
      temp_compliance_posture = consecutive_temp_violation_count >= POSTURE_SUSPEND_AT ? 'SUSPENDED'
                             : consecutive_temp_violation_count >= POSTURE_WATCH_AT   ? 'WATCH'
                             : 'COMPLIANT'
      violation_sequence_index = consecutive_temp_violation_count after this log
    input_set: "Only this venue's own log stream; probe_point limits are independent of each other"
    constants:
      TEMP_LIMITS: { HOT_HOLDING_MIN_F: 135.0, COLD_HOLDING_MAX_F: 41.0, REHEAT_MIN_F: 165.0 }
      POSTURE_WATCH_AT: 2
      POSTURE_SUSPEND_AT: 3
    precision: "1 decimal place on readings; boundary readings (exactly 135.0, exactly 41.0, exactly 165.0) are IN range"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the seven declared roles; X-User-ID header present and non-empty on every request; when X-User-Role is ResidentRepresentative the X-User-ID must resolve to an existing Resident (identity: entity_backed:Resident)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7; for ResidentRepresentative the X-User-ID must equal the resident the request targets (path resident id, payload resident_id, or the owning resident of the addressed DietOrder / SeatingReservation / PlanOfCareReview / IntakeObservation), otherwise the read or write is refused"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, JSON types correct, enum values inside the declared set, integers/numbers inside the declared ranges, dates ISO 8601 YYYY-MM-DD, datetimes RFC 3339 UTC, service_date equal to the UTC date of seat_start_utc, period_end_date >= period_start_date, effective_end_date >= effective_start_date, decimal fields at the declared precision"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every path id resolves, validated left-to-right in path order (e.g. /menu-cycles/{id}/items checks the cycle before anything else)"
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_DIET_ORDER_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_MENU_CYCLE_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_EXTENSION_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_RECONCILIATION_NOT_FOUND | ERR_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the body resolves, validated in the order the fields are declared on the entity in §1.1 (e.g. POST /seating-reservations checks resident_id before venue_id; POST /meal-tickets checks venue_id, then resident_id, then reservation_id)"
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_DIET_ORDER_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_MENU_CYCLE_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints accepting foreign keys in the body"
  - priority: 6
    category: business_referential
    check: "Cross-community references are refused: SeatingReservation.resident_id's community must equal DiningVenue.community_id; MealServiceTicket.resident_id's community must equal the venue's community; CommitteeFeedback.resident_id's community must equal the MenuCycle's community; DiningVenue.care_levels_served must be a subset of the parent Community.care_levels_offered; Resident.care_level must be in Community.care_levels_offered"
    error_id: ERR_CROSS_COMMUNITY_REFERENCE
    http_status: 422
    applies_to: "POST /venues, POST /residents, POST /seating-reservations, POST /meal-tickets, POST /menu-cycles/{id}/committee-feedback"
  - priority: 7
    category: business_referential
    check: "A supplied link must point at a row that belongs to the same subject: MealServiceTicket.reservation_id's resident_id and venue_id must equal the payload resident_id and venue_id; DietOrder.supersedes_order_id must belong to the payload resident_id; PlanOfCareReview.trigger_observation_id must belong to the review's resident; SubstitutionRule.replacement_item_code must differ from match_value when trigger_type == DISLIKE"
    error_id: ERR_LINKED_RESOURCE_MISMATCH
    http_status: 422
    applies_to: "POST /diet-orders, POST /residents/{id}/substitution-rules, POST /meal-tickets"
  - priority: 8
    category: business_referential
    check: "CommitteeFeedback.menu_item_code must resolve against MenuItem.item_code among the MenuItem rows of the addressed MenuCycle"
    error_id: ERR_MENU_ITEM_NOT_IN_CYCLE
    http_status: 422
    applies_to: "POST /menu-cycles/{id}/committee-feedback"
  - priority: 9
    category: state
    check: "The addressed entity is in a state from which the requested transition exists per §1.2 (reservation not RESERVED for seat, ticket not ISSUED for serve, ticket already VOIDED for void, cycle not PENDING_DIETITIAN_SIGNOFF for publish, cycle not REFRESH_PENDING for refresh, extension not SUBMITTED for review, DietOrder review_status not AWAITING_DIETITIAN/REREVIEW_REQUIRED for dietitian-review, DietOrder not CHANGES_REQUESTED for resubmit, review not OPEN for complete, reconciliation not RECONCILED for finalize, order already DISCONTINUED or SUPERSEDED for discontinue), and every row-shape precondition the transition declares in §1.2 holds (a MenuCycle with zero MenuItem rows cannot be submitted)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: state
    check: "expected_resident_version equals Resident.version on POST /diet-orders and expected_venue_version equals DiningVenue.version on POST /seating-reservations, per §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /diet-orders, POST /seating-reservations"
  - priority: 11
    category: business_safety
    check: "Segregation of duties on X-User-ID: the dietitian recording a DietOrder decision must not be DietOrder.ordered_by_user_id; the dietitian reviewing a TherapeuticExtension must not be its authored_by_user_id; the dietitian completing a PlanOfCareReview must not be the trigger IntakeObservation.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /diet-orders/{id}/dietitian-review, POST /therapeutic-extensions/{id}/review, POST /plan-of-care-reviews/{id}/complete"
  - priority: 12
    category: business_safety
    check: "The venue may serve at all: DiningVenue.status == OPEN and temp_compliance_posture != SUSPENDED"
    error_id: ERR_VENUE_SERVICE_SUSPENDED
    http_status: 409
    applies_to: "POST /seating-reservations, POST /seating-reservations/{id}/seat, POST /meal-tickets, POST /meal-tickets/{id}/serve"
  - priority: 13
    category: business_safety
    check: "While DiningVenue.temp_compliance_posture == WATCH only ticket_type == RESIDENT may be issued; GUEST and TAKEOUT issuance is refused"
    error_id: ERR_VENUE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /meal-tickets"
  - priority: 14
    category: business_safety
    check: "The resident's tray card for (service_date, meal_period) must not be BLOCKED: no line may carry reason ALLERGEN_UNRESOLVED or EXTENSION_PENDING and Resident.tray_card_state must not be BLOCKED"
    error_id: ERR_UNSAFE_TRAY_NO_SUBSTITUTION
    http_status: 422
    applies_to: "POST /seating-reservations/{id}/seat"
  - priority: 15
    category: business_safety
    check: "Texture liberalization gate: an order whose TEXTURE_RANK is lower than the resident's current ACTIVE order's TEXTURE_RANK may not be created or resubmitted while the resident has a PlanOfCareReview with status == OPEN"
    error_id: ERR_TEXTURE_REQUIRES_DIETITIAN
    http_status: 422
    applies_to: "POST /diet-orders, POST /diet-orders/{id}/resubmit"
  - priority: 16
    category: business_safety
    check: "A verified diet order is required: the resident must have a DietOrder with clinical_status == ACTIVE and review_status == APPROVED to be reserved, seated, or issued a RESIDENT ticket; completing a PlanOfCareReview with outcome == DIET_ORDER_REREVIEW requires an ACTIVE DietOrder"
    error_id: ERR_DIET_ORDER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /seating-reservations, POST /seating-reservations/{id}/seat, POST /meal-tickets, POST /plan-of-care-reviews/{id}/complete"
  - priority: 17
    category: business_safety
    check: "Resident.dining_status must be ACTIVE to reserve, to have a RESIDENT ticket issued, to cast a committee ballot, or to sponsor a GUEST/TAKEOUT meal; it must not be DISCHARGED to accept a new DietOrder, a substitution rule, or an intake observation"
    error_id: ERR_RESIDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /diet-orders, POST /residents/{id}/substitution-rules, POST /seating-reservations, POST /meal-tickets, POST /residents/{id}/intake-observations, POST /menu-cycles/{id}/committee-feedback"
  - priority: 18
    category: business_safety
    check: "Resident.care_level must be a member of DiningVenue.care_levels_served"
    error_id: ERR_CARE_LEVEL_NOT_SERVED
    http_status: 422
    applies_to: "POST /seating-reservations"
  - priority: 19
    category: business_safety
    check: "A MenuCycle with status == PUBLISHED whose closed range [effective_start_date, effective_end_date] contains the requested service_date must exist for the resident's community before a tray card can be resolved or a resident seated"
    error_id: ERR_NO_PUBLISHED_MENU_CYCLE
    http_status: 409
    applies_to: "GET /residents/{id}/tray-card, POST /seating-reservations/{id}/seat"
  - priority: 20
    category: business_temporal
    check: "IntakeObservation.observation_date must be <= the logical clock date; MealServiceTicket.service_date must be <= the logical clock date"
    error_id: ERR_OBSERVATION_FUTURE_DATE
    http_status: 422
    applies_to: "POST /residents/{id}/intake-observations, POST /meal-tickets"
  - priority: 21
    category: business_temporal
    check: "Resident-side meal spacing per calculation resident_meal_spacing_conflict: the candidate closed interval must not intersect any RESERVED/SEATED/COMPLETED reservation of the same resident widened by MIN_MEAL_GAP_MINUTES on both sides, at any venue in any community"
    error_id: ERR_RESIDENT_MEAL_SPACING
    http_status: 409
    applies_to: "POST /seating-reservations"
  - priority: 22
    category: business_temporal
    check: "Publishing a MenuCycle requires that no other PUBLISHED cycle of the same community has a closed effective range intersecting this cycle's closed range"
    error_id: ERR_MENU_CYCLE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /menu-cycles/{id}/publish"
  - priority: 23
    category: business_constraint
    check: "MenuItem.item_code must be unique inside the owning MenuCycle"
    error_id: ERR_DUPLICATE_ITEM_CODE
    http_status: 409
    applies_to: "POST /menu-cycles/{id}/items"
  - priority: 24
    category: business_constraint
    check: "One ballot per (menu_cycle_id, resident_id, menu_item_code) with status == SUBMITTED; a second SUBMITTED ballot on the same triple is refused, while a new ballot after the prior one moved to ACKNOWLEDGED is accepted"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /menu-cycles/{id}/committee-feedback"
  - priority: 25
    category: business_constraint
    check: "Publishing requires therapeutic coverage: every MenuItem of the cycle with a non-empty required_therapeutic_codes must have extension_coverage_status == COMPLETE"
    error_id: ERR_THERAPEUTIC_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /menu-cycles/{id}/publish"
  - priority: 26
    category: business_constraint
    check: "Review loops are bounded: DietOrder.review_round must be < MAX_DIET_REVIEW_ROUNDS and TherapeuticExtension.review_round must be < MAX_EXTENSION_REVIEW_ROUNDS before another REQUEST_CHANGES decision is recorded"
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /diet-orders/{id}/dietitian-review, POST /therapeutic-extensions/{id}/review"
  - priority: 27
    category: business_fiscal
    check: "Venue seat capacity per calculation venue_capacity_conflict: the summed party_size of the overlapping RESERVED/SEATED conflict set plus the candidate party_size must be <= DiningVenue.seat_capacity, unless allow_waitlist == true in which case the row is created WAITLISTED"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /seating-reservations"
  - priority: 28
    category: business_fiscal
    check: "No FINALIZED BillingReconciliation of the community may cover the ticket's service_date, and a new reconciliation period may not intersect the closed range of an existing FINALIZED period of the same community"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /meal-tickets, POST /reconciliations"
  - priority: 29
    category: business_fiscal
    check: "Sponsorship cap: for GUEST/TAKEOUT tickets with resident_id != null, Resident.guest_meal_charge_balance_cents plus the newly computed billed_amount_cents must be <= Community.guest_meal_sponsor_cap_cents"
    error_id: ERR_SPONSOR_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /meal-tickets"
  - priority: 30
    category: business_fiscal
    check: "Finalize staleness: recomputing both meal_count_reconciliation variants and reconciliation_net_billable at finalize time must reproduce the stored ticket_ledger_total_cents, census_projection_total_cents and net_billable_total_cents"
    error_id: ERR_RECONCILIATION_STALE
    http_status: 409
    applies_to: "POST /reconciliations/{id}/finalize"
  - priority: 31
    category: business_fiscal
    check: "Variance gate: when abs(variance_cents) > Community.variance_tolerance_cents a non-empty variance_note must be supplied at finalize"
    error_id: ERR_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /reconciliations/{id}/finalize"

