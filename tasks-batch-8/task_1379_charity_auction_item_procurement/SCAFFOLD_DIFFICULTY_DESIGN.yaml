  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bid_exactly_at_min_bid_boundary
        grounds:
          - calculations.min_next_bid_cents
          - errors[ERR_BID_BELOW_MINIMUM]
        distinguishing_aspect: |
          Money metric on POST /bundles/{id}/bids: with no ACTIVE bids the acceptance
          bound is min_bid_cents exactly (>= semantics) — 11999 is rejected and
          12000 accepted for a 40000-FMV bundle (locked min 12000).
        test_recipe:
          setup:
            - "Event BIDDING_OPEN; bundle PUBLISHED (single PHYSICAL item FMV 40000 -> min_bid 12000); bidder br registered with payment method"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala P", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
