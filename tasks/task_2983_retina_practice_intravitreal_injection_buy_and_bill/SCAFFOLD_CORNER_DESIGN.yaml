              payload: { payer_id: "${k_pay_comm_id}", drug_id: "${k_drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 14000, admin_allowed_cents: 10000, wastage_reimbursed: true, pa_required: true, pa_validity_days: 180, pa_max_injections: 1 }
