        excluded_because:
          difficulty_instance: cross_entity_state_dependency / showing_confirmation_gated_by_placed_lockbox_placement
          rationale: "Asserted as the pre-placement rejection of the named §1.8 instance."

      - name: error_member_balance_delinquent_is_outranked_by_state
