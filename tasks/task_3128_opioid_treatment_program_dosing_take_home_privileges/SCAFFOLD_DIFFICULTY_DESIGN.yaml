            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${p_a}", medication: "METHADONE", ordered_daily_mg: 60.0, split_dose_authorized: true }
              as: Physician
              as_user_id: "${phys4_id}"
              captures: { o_a: $.data.id }
            - call: "POST /otp/dose-orders/${o_a}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys4_id}"
            - *k_clock_dec
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${o_a}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${delta_lot_id}" }
              as: Nurse
              as_user_id: "${nurse4_id}"
              captures: { permit_1: $.data.id }
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${o_a}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T10:30:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${delta_lot_id}" }
              as: Nurse
              as_user_id: "${nurse4_id}"
              captures: { err_permit: $.data.error_id }
          assert:
            - "the first scheduling returned 201 and DoseDispense.${permit_1}.dose_date == 2026-12-21"
            - "the second returns 409 and err_permit == ERR_DUPLICATE_ACTIVE_DOSE"
            - "err_permit != ERR_NO_DOSE_CAPACITY, so the shared day bucket had spare room and the per-patient permit was the binding rule"
            - "GET /otp/dose-dispenses?dose_order_id=${o_a}&dose_date=2026-12-21 returns exactly 1 row"
            - "InventoryLot.${delta_lot_id}.running_on_hand_mg == 900.0, so no medication moved"

      - name: guest_travel_window_uses_half_open_intersection_semantics
        grounds:
          - validations[priority=12]
          - entities.GuestDosingArrangement.fields.travel_start_date
          - errors[ERR_NO_OVERLAPPING_VISIT_WINDOW]
          - endpoints.POST_/otp/dose-dispenses
        distinguishing_aspect: "Interval semantics C is half-open intersection between the patient's travel window and the receiving clinic's open days and hours: a window that intersects only at the receiving clinic's 11:00 close on its one open Saturday is rejected, while a window whose end lands on an open day inside the window is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Two CA programs: an originating clinic open Monday to Friday, and a receiving clinic open on Saturdays only from 08:00 to 10:00."
            - "One ACTIVE patient registered at the originating clinic with a Buprenorphine 16 mg active order."
          setup_api_calls:
            - *k_clock
            - call: "POST /otp/programs"
              payload: { name: "BayMark Origin", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO", "TU", "WE", "TH", "FR"], max_daily_dose_slots: 40, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog_orig: $.data.id }
            - call: "POST /otp/programs"
              payload: { name: "BayMark Coast", state_code: "CA", clinic_hours_start: "08:00", clinic_hours_end: "10:00", open_days: ["SA"], max_daily_dose_slots: 10, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog_recv: $.data.id }
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_orig}", medication: "BUPRENORPHINE", lot_number: "LOT-ORIG", expiration_date: "2027-06-30", quantity_received_mg: 400.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: false }
              as: ProgramAdministrator
              captures: { orig_lot: $.data.id }
            - call: "POST /otp/users"
              payload: { program_id: "${prog_orig}", full_name: "Paul Physician", staff_role: "PHYSICIAN", license_number: "MD-3001" }
              as: ProgramAdministrator
              captures: { phys_orig: $.data.id }
            - call: "POST /otp/users"
              payload: { program_id: "${prog_recv}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_recv: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_orig}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:cccc0001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PUBLIC_TRANSIT", one_way_travel_minutes: 40 }
              as: Physician
              as_user_id: "${phys_orig}"
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_orig}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "BUPRENORPHINE", ordered_daily_mg: 16.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_orig}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_orig}"
            - *k_clock_dec
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: Physician
              as_user_id: "${phys_orig}"
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /otp/guest-dosing-arrangements"
              payload: { patient_id: "${pat_id}", receiving_program_id: "${prog_recv}", travel_start_date: "2026-12-19", travel_end_date: "2026-12-19", expected_patient_version: "${pat_v2}" }
              as: ProgramAdministrator
              captures: { arr_ok_id: $.data.id }
            - call: "POST /otp/guest-dosing-arrangements/${arr_ok_id}/transmit"
              payload: {}
              as: ProgramAdministrator
              captures: { arr_token: $.data.dose_authorization_token }
            - call: "POST /otp/guest-dosing-arrangements"
              payload: { patient_id: "${pat_id}", receiving_program_id: "${prog_recv}", travel_start_date: "2026-12-20", travel_end_date: "2026-12-20", expected_patient_version: "${pat_v2}" }
              as: ProgramAdministrator
              captures: { arr_bad_id: $.data.id }
            - call: "POST /otp/guest-dosing-arrangements/${arr_bad_id}/transmit"
              payload: {}
              as: ProgramAdministrator
              captures: { err_window: $.data.error_id }
          assert:
            - "2026-12-19 is a Saturday and the receiving clinic's only open day, so the first transmit returns 200 and GuestDosingArrangement.${arr_ok_id}.status == PENDING_RECEIVING_ACK"
            - "2026-12-20 is a Sunday, outside the receiving clinic's open days, so the second transmit returns 409 and err_window == ERR_NO_OVERLAPPING_VISIT_WINDOW"
            - "err_window != ERR_GUEST_DOSING_NOT_ENABLED, so the receiving clinic does accept guests and the failure is the window"
            - "GuestDosingArrangement.${arr_bad_id}.status == DRAFT and its dose_authorization_token is null"
            - "GuestDosingArrangement.${arr_ok_id}.authorized_mg == 16.0, read from the active order at transmit time"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2, DIFFERENT conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: carry_quota_conservation_closed_over_approve_and_revoke
        grounds:
          - entities.CarryQuotaLedger.fields.available_carries
          - entities.TakeHomePrivilege.fields.freed_carries
          - calculations.carry_cap_waterfall
          - state_machines.TakeHomePrivilege.APPROVED_to_REVOKED
        distinguishing_aspect: "Conserved quantity is the integer carry pool with the identity allotted_carries == granted_carries + available_carries: approving a 5-carry privilege and then revoking it must return the pool to exactly 10, with the released_carries reporting field explicitly excluded from the arithmetic."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One admitted ACTIVE patient 105 days in treatment, journal reconciled, phase MAINTENANCE, with a held privilege requesting 6 carries."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "POST /otp/take-home-privileges/${priv_id}/revoke"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "after the evaluate, GET /otp/programs/${prog_id}/carry-quota reports allotted_carries == 10, granted_carries == 5, available_carries == 5"
            - "after the revoke, the same read reports allotted_carries == 10, granted_carries == 0, available_carries == 10"
            - "the identity allotted_carries == granted_carries + available_carries holds at both readings"
            - "TakeHomePrivilege.${priv_id}.freed_carries == 5"
            - "the same read reports released_carries == 5 and available_carries != allotted_carries - granted_carries + released_carries, proving the released field is reporting-only"
            - "GET /otp/take-home-carry-ledgers?patient_id=${pat_id} reports carry_variance == 0"

      - name: carried_milligram_conservation_closed_over_dispense_waste_and_void
        grounds:
          - entities.TakeHomeCarryLedger.fields.carried_balance_mg
          - entities.TakeHomeCarryLedger.fields.carried_consumed_mg
          - entities.InventoryTransaction.fields.transaction_type
          - state_machines.TakeHomePrivilege.APPROVED_to_REVOKED
        distinguishing_aspect: "Conserved quantity is a milligram total rather than a count, with the identity carried_issued_mg == carried_voided_mg + carried_dispensed_mg + carried_consumed_mg + carried_balance_mg: two take-home doses of 90 mg are drawn, one is completed with 5 mg wasted and 5 mg returned, the other is voided by revocation, and the ledger must balance to exactly zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 20, a reusable lot, and the four staff users."
            - "One admitted ACTIVE patient 105 days in treatment, PRIVATE_VEHICLE, journal reconciled, phase MAINTENANCE, with an APPROVED privilege holding 2 carries and two synthesized SCHEDULED take-home doses."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { pat_v: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 2, carry_interval_days: 7, expected_patient_version: "${pat_v}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id }
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "GET /otp/dose-dispenses?privilege_id=${priv_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { th_first: "$.data[0].id", th_second: "$.data[1].id" }
            - call: "POST /otp/dose-dispenses/${th_first}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${th_first}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${th_first}/dispense"
              payload: { dispensed_mg: 90.0, wasted_mg: 0.0, returned_mg: 0.0, inventory_lot_id: "${lot_id}", witness_staff_id: "staff-witness-77" }
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /otp/dose-dispenses/${th_first}/complete"
              payload: { dispensed_mg: 90.0, wasted_mg: 5.0, returned_mg: 5.0 }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/take-home-privileges/${priv_id}/revoke"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "GET /otp/take-home-carry-ledgers?patient_id=${pat_id} reports carried_issued_mg == 180.0"
            - "the same read reports carried_dispensed_mg == 90.0"
            - "the same read reports carried_consumed_mg == 10.0"
            - "the same read reports carried_voided_mg == 90.0"
            - "the same read reports carried_balance_mg == 0.0"
            - "the identity carried_issued_mg == carried_voided_mg + carried_dispensed_mg + carried_consumed_mg + carried_balance_mg holds"
            - "DoseDispense.${th_second}.status == CANCELLED"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 49910.0"
