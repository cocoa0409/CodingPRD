          assert:
            - "the response status is 201 and Playlist.${pld_id}.status == IMPORTED (the IMPORTING state is transactional only)"
            - "Playlist.${pld_id}.window_duration_seconds == 86400 and traffic_revision == 1 and version == 1"
            - "Playlist.${pld_id}.item_count == 2 and blocked_item_count == 0 and scheduled_total_seconds == 630"
            - "Playlist.${pld_id}.projected_end_variance_seconds == -85770 and asrun_end_variance_seconds == -85770"
            - "Playlist.${pld_id}.commercial_seconds_by_hour == {\"0\": 30} (string hour keys relative to schedule_start_utc)"
            - "Playlist.${pld_id}.armed_at_utc is null, closed_at_utc is null, reconciliation_credit_cents == 0"
            - "PlaylistItem.${pld_it1}.playout_status == SCHEDULED, clearance_status == CLEARED, house_number == HN-PROG-01, max_trim_seconds == 0, trim_applied_seconds == 0, is_makegood == false, actual_start_utc is null, version == 1"

  # ===========================================================================
  # Table 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: transmitter_reduction_to_exactly_eighty_pct_creates_no_notification
        claim_type: Valid Transition
        grounds: "§1.2 Transmitter FULL_POWER -> REDUCED_POWER (CASCADE A hop 1: 'at exactly power_pct == 80 no notification is created'); §1.3 regulatory_notification_deadline (POWER_REDUCTION_THRESHOLD_PCT 80, strict <, NOTIFY_WINDOW_SECONDS 86400); §1.3 multiplex_bitrate_allocation (DERATE_REDUCED_HIGH 0.75)"
        distinguishing_aspect: "80 % is the exact threshold: it derates the pool (0.75) and degrades posture but must NOT create a RegulatoryNotification, while 79 % must create one with due_utc = trigger + 86400. An implementation using `<=` files a notification at 80 and fails."
        test_recipe:
          setup: "Base graph through ch2 (mux1 effective 38000, ch1 16000, ch2 6000). Clock 2026-08-01T09:00:00Z."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 80, reason: "antenna maintenance" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: FULL_POWER }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 79, reason: "antenna maintenance" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { kind: POWER_REDUCTION }
              as: ComplianceOfficer
              captures: { ntf_pr_id: "$.data[0].id" }
          assert:
            - "after power_pct 80: Transmitter.${tx1_id}.operational_state == REDUCED_POWER, current_power_pct == 80, derate_factor == 0.75"
            - "after power_pct 80: the notifications list returns total_count 0 and Transmitter.${tx1_id}.notification_pending_count == 0"
            - "after power_pct 80: Multiplex.${mux1_id}.effective_capacity_kbps == 28300 (floor(38800*0.75) - 800), assigned_kbps == 22000, available_kbps == 6300, starved_channel_count == 0"
            - "after power_pct 80: Channel.${ch1_id}.allocated_bitrate_kbps == 16000 and Channel.${ch2_id}.allocated_bitrate_kbps == 6000 (floors still fit, nothing starves)"
            - "after power_pct 80: Channel.${ch1_id}.posture == DEGRADED and Channel.${ch2_id}.posture == DEGRADED (channel_posture clause 4: Transmitter REDUCED_POWER)"
            - "after the FULL_POWER restore: derate_factor == 1.00, available_kbps == 16000, both channels posture == NORMAL"
            - "after power_pct 79: RegulatoryNotification.${ntf_pr_id}.kind == POWER_REDUCTION, status == PENDING, observed_power_pct == 79, triggering_utc == 2026-08-01T09:00:00Z, due_utc == 2026-08-02T09:00:00Z"
            - "after power_pct 79: Transmitter.${tx1_id}.notification_pending_count == 1"

      - name: cascade_a_hops_one_to_four_starve_the_priority_tail_and_suspend_it
        claim_type: Side Effect Execution
        grounds: "§1.2 Transmitter FULL_POWER -> REDUCED_POWER CASCADE A hops 1-4; §1.3 multiplex_bitrate_allocation (DERATE_REDUCED_LOW 0.50 when current_power_pct < 50); §1.3 channel_posture clause 1 (STARVED -> SUSPENDED); §1.3 multiplex_capacity_conservation"
        distinguishing_aspect: "One power-state call must ripple four hops in the same request: notification, effective capacity 9500 = floor(20000*0.50) - 500, floor-order starvation of the rank-2 channel only, and its posture flip to SUSPENDED with air_status forced from ON_AIR to BARS_AND_TONE. An implementation that starves by proportional haircut (both channels reduced) instead of strict waterfall order fails."
        test_recipe:
          setup: "MUX-B (total 20000, pilot 500 -> effective 19500) carries two HD_720P channels with identical floors 5000 and requests 6000, ranks 1 and 2; both are ACTIVE and channel 20.2 is ON_AIR. Then the transmitter drops to 40 %."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *tx1
            - *mux2
            - *ch_other
            - call: "GET /multiplexes/${mux2_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux2_v2: "$.data.version" }
            - &ch_b2
              call: "POST /channels"
              payload:
                multiplex_id: "${mux2_id}"
                expected_multiplex_version: "${mux2_v2}"
                call_sign: "WABC-DT2"
                channel_number: "20.2"
                service_class: PRIMARY
                resolution_class: HD_720P
                requested_bitrate_kbps: 6000
                floor_bitrate_kbps: 5000
                priority_rank: 2
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { ch_b2_id: "$.data.id" }
            - call: "POST /channels/${ch_b2_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 40, reason: "generator failover" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { status: PENDING }
              as: ComplianceOfficer
              captures: { ntf_low_id: "$.data[0].id" }
          assert:
            - "hop 1: RegulatoryNotification.${ntf_low_id}.kind == POWER_REDUCTION with observed_power_pct == 40 and due_utc == 2026-08-02T09:00:00Z; notification_pending_count == 1"
            - "hop 2: Transmitter.${tx1_id}.derate_factor == 0.50 and Multiplex.${mux2_id}.effective_capacity_kbps == 9500"
            - "hop 3: Channel.${ch_other_id}.allocation_state == ACTIVE with allocated_bitrate_kbps == 6000 (floor 5000 + share min(4500, 1000) = 1000)"
            - "hop 3: Channel.${ch_b2_id}.allocation_state == STARVED with allocated_bitrate_kbps == 0 (5000 + 5000 > 9500 at rank 2)"
            - "hop 3: Multiplex.${mux2_id}.assigned_kbps == 6000, available_kbps == 3500, starved_channel_count == 1"
            - "hop 4: Channel.${ch_b2_id}.posture == SUSPENDED and air_status == BARS_AND_TONE, while Channel.${ch_other_id}.posture == DEGRADED"
            - "multiplex_capacity_conservation holds: available_kbps 3500 + assigned_kbps 6000 == effective_capacity_kbps 9500"
            - "every one of these changes is visible in the single power-state response body (consistency_model immediate)"

      - name: outage_epoch_creates_notification_at_exactly_1800_seconds_and_a_resumption
        claim_type: Side Effect Execution
        grounds: "§1.2 Transmitter FULL_POWER -> OFF_AIR, OFF_AIR -> OFF_AIR clock checkpoint, OFF_AIR -> REDUCED_POWER; §1.3 regulatory_notification_deadline (OUTAGE_NOTIFY_AFTER_SECONDS 1800, >=)"
        distinguishing_aspect: "At 1799 s of outage no OUTAGE notification exists; at exactly 1800 s the clock checkpoint creates one whose triggering_utc is the outage START (not the checkpoint instant) and whose outage_seconds is 1800. The later resumption must NOT create a duplicate OUTAGE row."
        test_recipe:
          setup: "Base graph through ch2. The transmitter goes OFF_AIR at 09:00:00Z with a reason; the clock is then stepped to 09:29:59Z and 09:30:00Z."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: OFF_AIR, reason: "transmitter fire alarm" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:29:59Z" }
              as: StationAdmin
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { kind: OUTAGE }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:30:00Z" }
              as: StationAdmin
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { kind: OUTAGE }
              as: ComplianceOfficer
              captures: { ntf_out_id: "$.data[0].id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 60, reason: "partial restore" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
          assert:
            - "immediately after OFF_AIR: outage_started_utc == 2026-08-01T09:00:00Z, current_power_pct == 0, derate_factor == 0.00, Multiplex.${mux1_id}.effective_capacity_kbps == 0"
            - "immediately after OFF_AIR: both channels are STARVED with allocated_bitrate_kbps 0, posture SUSPENDED, air_status DARK, and starved_channel_count == 2"
            - "at 09:29:59Z (1799 s) the OUTAGE-filtered list returns total_count 0"
            - "at 09:30:00Z (exactly 1800 s) RegulatoryNotification.${ntf_out_id}.kind == OUTAGE, status == PENDING, triggering_utc == 2026-08-01T09:00:00Z, outage_seconds == 1800, due_utc == 2026-08-02T09:30:00Z"
            - "after the restore: last_outage_seconds == 1800, cumulative_outage_seconds == 1800, outage_started_utc is null, operational_state == REDUCED_POWER, derate_factor == 0.75"
            - "after the restore the unfiltered list returns total_count 2 with kinds exactly {OUTAGE, RESUMPTION} — the OUTAGE row is not duplicated for the same epoch"
            - "Transmitter.${tx1_id}.notification_pending_count == 2"

      - name: undeclared_transmitter_and_channel_transitions_are_rejected
        claim_type: Invalid Transitions
        grounds: "§1.2 Transmitter (no FULL_POWER -> FULL_POWER, no REDUCED_POWER -> REDUCED_POWER) and Channel.air_status (no DARK -> BARS_AND_TONE, EAS_OVERRIDE is system-only); §1.4 priorities 14-15 (ERR_TRANSMITTER_INVALID_STATE, ERR_CHANNEL_INVALID_AIR_STATE)"
        distinguishing_aspect: "Only the declared edges exist: re-asserting the current transmitter state, re-reducing an already REDUCED_POWER transmitter, jumping DARK -> BARS_AND_TONE, or asking for EAS_OVERRIDE directly must all be 409s with the machine-specific error id rather than idempotent no-ops."
        test_recipe:
          setup: "Base graph through ch2; the transmitter is first taken to REDUCED_POWER 60 so the REDUCED -> REDUCED edge can be probed."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
          trigger:
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: BARS_AND_TONE }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_dark_bars: "$.data.error_id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: EAS_OVERRIDE }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_direct_eas: "$.data.error_id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: FULL_POWER }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_full_full: "$.data.error_id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 60, reason: "step one" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 55, reason: "step two" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_red_red: "$.data.error_id" }
          assert:
            - "${e_dark_bars} == ERR_CHANNEL_INVALID_AIR_STATE with status 409 (DARK -> BARS_AND_TONE is not declared)"
            - "${e_direct_eas} == ERR_CHANNEL_INVALID_AIR_STATE with status 409 (EAS_OVERRIDE is reachable only through an override activation)"
            - "${e_full_full} == ERR_TRANSMITTER_INVALID_STATE with status 409"
            - "${e_red_red} == ERR_TRANSMITTER_INVALID_STATE with status 409, and current_power_pct is still 60 (the second reduction did not partially apply)"
            - "Channel.${ch1_id}.air_status is still DARK and Channel.${ch1_id}.version is unchanged by the two rejected calls"

      - name: channel_air_status_cycle_dark_on_air_bars_and_back_with_a_critical_gate
        claim_type: Valid Transition
        grounds: "§1.2 Channel.air_status DARK -> ON_AIR, ON_AIR -> BARS_AND_TONE, BARS_AND_TONE -> ON_AIR (extra precondition: no open CRITICAL fault), ON_AIR -> DARK; §1.3 channel_posture clause 3; §1.4 priority 26 ERR_CRITICAL_FAULT_OPEN"
        distinguishing_aspect: "BARS_AND_TONE -> ON_AIR carries a precondition that DARK -> ON_AIR does not: an open CRITICAL fault (states DETECTED/ACKNOWLEDGED/ESCALATED) blocks the return to air, and mitigating the fault (MITIGATED is not 'open') unblocks it in the same graph. An implementation that treats both entries to ON_AIR identically passes the blocked case."
        test_recipe:
          setup: "Base graph through ch2, ch1 ACTIVE with 16000 kbps on a FULL_POWER transmitter."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
          trigger:
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: BARS_AND_TONE, reason: "encoder swap" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults"
              payload:
                fault_code: ENCODER_FAILURE
                severity: MINOR
                detected_utc: "2026-08-01T09:00:00Z"
                channel_id: "${ch1_id}"
                notes: "encoder card offline"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { flt_enc_id: "$.data.id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_crit_open: "$.data.error_id" }
            - call: "POST /technical-faults/${flt_enc_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /technical-faults/${flt_enc_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "SPARE_ENCODER" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: DARK, reason: "end of broadcast day" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          assert:
            - "DARK -> ON_AIR succeeds while the channel is ACTIVE, allocated 16000 >= floor 8000, transmitter FULL_POWER and posture NORMAL"
            - "the fault row is created with severity == CRITICAL — the client-sent MINOR is ignored because FAULT_SEVERITY[ENCODER_FAILURE] == CRITICAL"
            - "while that fault is DETECTED, Channel.${ch1_id}.posture == DEGRADED_CRITICAL and open_critical_fault_count == 1"
            - "${e_crit_open} == ERR_CRITICAL_FAULT_OPEN with status 409, and air_status is still BARS_AND_TONE"
            - "after MITIGATED the fault leaves the open set: open_critical_fault_count == 0, posture == NORMAL, and BARS_AND_TONE -> ON_AIR now succeeds"
            - "ON_AIR -> DARK succeeds (no ACTIVE override on the channel) and Channel.${ch1_id}.air_status == DARK"
            - "each air-state transition bumps Channel.${ch1_id}.version by exactly 1"

      - name: asset_waiver_cycle_at_exactly_score_forty_reopens_the_air_path
        claim_type: Valid Transition
        grounds: "§1.2 Asset QC_FAILED -> QC_WAIVED (preconditions: OCC-free waiver, X-User-ID != inspected_by_operator_id, technical_score >= WAIVER_MIN_SCORE 40, no AUDIO_LOSS defect) and QC_WAIVED -> AIR_CHECK reporting; §1.3 asset_qc_score (DEFECT_POINTS, duration_penalty cap 30, PASS_WITH_EXCEPTION_MIN 70); §1.4 priorities 55, 57 (ERR_QC_WAIVER_SCORE_TOO_LOW, ERR_WAIVER_JUSTIFICATION_REQUIRED)"
        distinguishing_aspect: "The waiver floor is inclusive at exactly 40 and the justification floor is inclusive at exactly 20 characters. The same graph shows the 19-character rejection, so an implementation using strict > 40 or > 20 fails while a correct one waives and re-opens the AIR_CHECK path."
        test_recipe:
          setup: "HN-WAIVE-01 (expected 1800 s, HD_1080I, captions required) is delivered 1780 s (delta 20 -> duration penalty min(30, ceil(20/2)*3) = 30) and inspected with defects [VIDEO_ARTIFACT, CAPTION_MISSING] (10 + 20 = 30) and in-spec loudness -24.0 -> technical_score exactly 100 - 30 - 30 = 40, verdict FAIL, status QC_FAILED."
          setup_api_calls:
            - *clk_t0
            - *op_qc
            - *op_pd
            - &as_waive
              call: "POST /assets"
              payload:
                house_number: "HN-WAIVE-01"
                title: "Waiver Boundary Feature"
                source: FILE_DELIVERY
                expected_duration_seconds: 1800
                delivery_deadline_utc: "2026-08-01T10:00:00Z"
                required_resolution_class: HD_1080I
                captions_required: true
              as: TrafficCoordinator
              captures: { awv_id: "$.data.id" }
            - call: "POST /assets/${awv_id}/delivery"
              payload:
