      - name: commitment_for_everyday_product_returns_product_program_mismatch
        claim_type: error_triggerability
        grounds:
          - errors.ERR_PRODUCT_PROGRAM_MISMATCH
          - validations[priority=10]
        distinguishing_aspect: "A commitment naming an EVERYDAY product against a seasonal program fails 422 ERR_PRODUCT_PROGRAM_MISMATCH — commitments exist only for SEASONAL products of the named program."
        test_recipe:
          setup:
            - "Program OPEN_FOR_COMMITMENTS; GOLD retailer; one EVERYDAY product (no program)."
