            - call: "GET /v1/finds-buys/${buy}/allocations"
              as: CategoryManager
              captures: { alloc: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/allocations/${alloc}/sell"
              payload: { quantity: 1 }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/allocations/${alloc}/sell"
