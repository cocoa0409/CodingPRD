      - name: overlap_detection_compares_left_against_a_peer_right_range_rejected
        claim_type: interval_merge
        grounds:
          - calculations.address_range_overlap_detection
          - validations[priority=21]
          - errors.ERR_ROAD_RANGE_OVERLAP
        distinguishing_aspect: "The conflict key is (jurisdiction, normalized_name, parity, interval) and NOT the side: R2's LEFT ODD [101,199] collides with R1's RIGHT ODD [101,199], so validating R2 returns 409 ERR_ROAD_RANGE_OVERLAP, while a third road at EVEN [200,298] / ODD [201,299] validates because the intervals share no integer."
        test_recipe:
          setup:
            - "One jurisdiction LARCO."
            - "R1 \"N MAPLE STREET\": LEFT [100,198] EVEN, RIGHT [101,199] ODD — validated first."
            - "R2 \"N. Maple St\" (same normalized name), mirrored: LEFT [101,199] ODD, RIGHT [100,198] EVEN."
            - "R3 \"N MAPLE STREET\": LEFT [200,298] EVEN, RIGHT [201,299] ODD."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r1_id: $.data.id }
            - call: "POST /gis/road-centerlines/${r1_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N. Maple St", jurisdiction_id: "${j_id}", from_addr_left: 101, to_addr_left: 199, parity_left: "ODD", from_addr_right: 100, to_addr_right: 198, parity_right: "EVEN" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r2_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 200, to_addr_left: 298, parity_left: "EVEN", from_addr_right: 201, to_addr_right: 299, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /gis/road-centerlines/${r2_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /gis/road-centerlines/${r3_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the R2 validate returns status_code 409 with ${err_id} == \"ERR_ROAD_RANGE_OVERLAP\""
            - "RoadCenterline.${r2_id}.status == \"DRAFT\" and qc_dirty == true and version == 1"
            - "RoadCenterline.${r2_id}.normalized_name == \"N MAPLE STREET\"   # same key as R1 despite the different spelling"
            - "the R3 validate returns status_code 200 and RoadCenterline.${r3_id}.status == \"VALIDATED\""
            - "R3 is accepted even though R2 is still DRAFT — DRAFT peers never block validation"
            - "RoadCenterline.${r1_id}.status == \"VALIDATED\" and version == 2"

      - name: road_scoped_scan_excludes_terminal_points_and_all_cells
        claim_type: input_set_filtering
        grounds:
          - calculations.qc_defect_scan
          - calculations.qc_quality_score
        distinguishing_aspect: "A ROAD-scoped scan sees neither terminal address points nor any CoverageCell: a RETIRED point that would fire MISSING_GEOMETRY, POSTAL_CITY_MISMATCH and LOW_CONFIDENCE contributes nothing, and the jurisdiction's three uncovered (cell, service_type) pairs leave the BOUNDARY category at a full 100 -> quality_score 100.00 with zero defects."
        test_recipe:
          setup:
            - "One jurisdiction LARCO (postal_city FORT COLLINS) with cell C001 and NO boundaries -> gap_pair_count 3."
            - "One PUBLISHED centerline \"N MAPLE STREET\"."
            - "Point A: PARCEL, geometry true, postal match, ACTIVE -> 96.00, clean."
            - "Point B: POSTAL, geometry false, postal_city LOVELAND -> 51.00, then RETIRED."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { ptA_id: $.data.id }
            - call: "POST /gis/address-points/${ptA_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "LOVELAND", cell_id: "${cell_id}", geometry_verified: false }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { ptB_id: $.data.id }
            - call: "POST /gis/address-points/${ptB_id}/retire"
              payload: { retire_reason: "Never built" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          assert:
            - "status_code == 201"
            - "AddressPoint.${ptA_id}.status == \"ACTIVE\" and confidence_score == 96.00"
            - "AddressPoint.${ptB_id}.status == \"RETIRED\" and confidence_score == 51.00"
            - "QcValidationReport.${rep_id}.defect_count == 0"
            - "no ADDRESS_MISSING_GEOMETRY, ADDRESS_POSTAL_CITY_MISMATCH or ADDRESS_LOW_CONFIDENCE defect is anchored to ${ptB_id}"
            - "no BOUNDARY_COVERAGE_GAP defect exists even though Jurisdiction.${j_id}.gap_pair_count == 3"
            - "no ROAD_NO_ADDRESSES defect exists — the ACTIVE point A counts as an address"
            - "QcValidationReport.${rep_id}.quality_score == 100.00 and advisory_quality_score == 100.00"
            - "QcValidationReport.${rep_id}.quality_tier == \"A\""
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == true"
            - "GET /gis/qc-validation-reports/${rep_id}/defects returns meta.total_count == 0"

      - name: strict_and_advisory_quality_scores_diverge
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: qc_strict_vs_advisory_quality_score_diverge
          rationale: "The §1.8 dual_variant_calc instance already runs both qc_quality_score variants over the same defect set and asserts the pre-computed delta plus the opposite direction they move in once a BLOCKING defect is waived."

      - name: provisional_to_certified_confidence_reconciliation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: address_confidence_provisional_vs_certified_diverge
          rationale: "The §1.8 dual_variant_calc instance already covers the variant switch at certification, including the clamp that makes the delta +4.00 rather than +10.00 and the fact that confidence_score is preserved so the delta stays inspectable."

      - name: per_category_round_then_sum_precision
        claim_type: precision
        excluded_because:
          difficulty_instance: qc_quality_score_per_category_rounding_order
          rationale: "The §1.8 combinatorial_formula instance already pins the normative per-category round-then-sum order at the 0.01 divergence point (77.06 vs the 77.05 that sum-then-round would give) with ROUND_HALF_UP at 2dp."

      - name: instantaneous_versus_forward_gap_counters
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: jurisdiction_instantaneous_vs_forward_gap_counters_diverge
          rationale: "The §1.8 dual_variant_calc instance already builds the configuration where gap_pair_count stays 0 while forward_gap_pair_count becomes 1 over the 30-day horizon, and shows that only the forward counter gates an E911 publish."

      - name: weighted_confidence_scoring_with_clamp
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: address_confidence_clamped_multi_factor
          rationale: "The §1.8 combinatorial_formula instance already exercises every additive term of address_point_confidence_score together with the clamp applied after summation and before rounding."

      - name: proposal_status_projection_over_the_append_only_log
        claim_type: projection
        excluded_because:
          difficulty_instance: discrepancy_case_proposal_counter_cycle_two_rounds
          rationale: "The §1.8 non_linear_state_machine instance already replays the proposal log and asserts the projected PENDING/COUNTERED statuses plus round_count and current_proposal_id after each filing."

      - name: pin_staleness_propagates_to_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: road_retire_cascades_points_units_pins_package
          rationale: "The §1.8 transitive_cascade instance already propagates PIN_STALENESS_RULE through every mutated record to its fixed point and asserts the resulting fresh_pin_count / stale_pin_count / drift_detected values."

  # =========================================================================
  # SECTION: validations  (guide Table 4 + validation-pattern rows)
  # =========================================================================
  - section: validations
    instances:
      - name: house_number_outside_the_closed_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors.ERR_ADDRESS_OUTSIDE_RANGE
        distinguishing_aspect: "Both 200 (one step above to_addr_left 198) and 98 (one step below from_addr_left 100) are refused 422 ERR_ADDRESS_OUTSIDE_RANGE even though both have the correct EVEN parity, and neither refusal consumes an assignable slot."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a DRAFT centerline, LEFT [100,198] EVEN, RIGHT [101,199] ODD."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points"
              payload: { house_number: 200, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { hi_err: $.data.error_id }
            - call: "POST /gis/address-points"
              payload: { house_number: 98, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { lo_err: $.data.error_id }
          assert:
            - "both calls return status_code 422"
            - "${hi_err} == \"ERR_ADDRESS_OUTSIDE_RANGE\" and ${lo_err} == \"ERR_ADDRESS_OUTSIDE_RANGE\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50   # untouched"
            - "GET /gis/address-points with road_centerline_id ${road_id} returns meta.total_count == 0"

      - name: house_number_inside_range_with_matching_parity_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - calculations.address_point_confidence_score.provisional
        distinguishing_aspect: "150 on LEFT EVEN satisfies both the parity rule (priority 18) and the closed-range rule (priority 19), so the point is created 201 with confidence 91.00 (70 PARCEL + 12 + 8 + 6 - 5 VALIDATED) and one slot is consumed."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a VALIDATED centerline, LEFT [100,198] EVEN."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /gis/address-points"
              payload: { house_number: 150, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          assert:
            - "status_code == 201"
            - "AddressPoint.${pt_id}.house_number == 150 and side == \"LEFT\" and status == \"PENDING\""
            - "AddressPoint.${pt_id}.confidence_score == 91.00 and confidence_basis == \"PROVISIONAL\""
            - "AddressPoint.${pt_id}.jurisdiction_id == \"${j_id}\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49"

      - name: parity_check_precedes_the_range_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors.ERR_ADDRESS_PARITY_MISMATCH
        distinguishing_aspect: "house_number 201 on LEFT breaks parity (LEFT is EVEN) AND falls outside [100,198], so both priority 18 and 19 are violated; the ordered walk must stop at 18 and answer ERR_ADDRESS_PARITY_MISMATCH, never ERR_ADDRESS_OUTSIDE_RANGE."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a DRAFT centerline, LEFT [100,198] EVEN, RIGHT [101,199] ODD."
          setup_api_calls:
