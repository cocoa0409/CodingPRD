        distinguishing_aspect: "Hold then resume returns status to ACTIVE, clears hold_reason to null, and leaves hold_count at 1; a second hold/resume pair leaves it at 2."
        test_recipe:
          setup: ["One ACTIVE HOURLY engagement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
