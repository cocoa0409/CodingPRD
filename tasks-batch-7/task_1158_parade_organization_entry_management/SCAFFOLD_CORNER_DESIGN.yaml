  - section: rbac
    instances:
      - name: entrant_cannot_approve_entry_forbidden
        claim_type: rbac_denied
        grounds: [roles.CommitteeAdmin, roles.Entrant, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "approve is exclusive to CommitteeAdmin; the entry's own Entrant gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["One parade; one UNDER_REVIEW entry owned by entrant_1"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "RBAC Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "RBAC Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: Entrant, as_user_id: "entrant_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403; entry remains UNDER_REVIEW"

      - name: judge_cannot_finalize_sheet_forbidden
        claim_type: rbac_denied
        grounds: [roles.Judge, roles.CommitteeAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the judge who submitted a sheet cannot finalize it — finalize is CommitteeAdmin-only."
        test_recipe:
          setup: ["One parade; one APPROVED BAND entry; judge_1's sheet SUBMITTED"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "SoD Judge Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "SoD Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/score-sheets", payload: { creativity: 15, craftsmanship: 15, theme: 15, crowd_appeal: 15 }, as: Judge, as_user_id: "judge_1", captures: { sh_id: $.data.id } }
            - { call: "POST /score-sheets/${sh_id}/submit", payload: {}, as: Judge, as_user_id: "judge_1" }
          trigger:
            - { call: "POST /score-sheets/${sh_id}/finalize", payload: {}, as: Judge, as_user_id: "judge_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403; sheet remains SUBMITTED"

      - name: entrant_cannot_touch_other_entrants_entry_forbidden
        claim_type: rbac_denied
        grounds: [entities.EntryApplication.fields.applicant_user_id, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership check: resubmit by a different Entrant id than applicant_user_id fails with ERR_FORBIDDEN even though Entrant may call the endpoint."
        test_recipe:
          setup: ["One parade; entry owned by entrant_1 sitting in REVISION_REQUESTED"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Owner Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Owned Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/request-revision", payload: { revision_notes: "Fix roster" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /entries/${en_id}/resubmit", payload: { estimated_participants: 12 }, as: Entrant, as_user_id: "entrant_2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403 — entrant_2 is not the applicant"
            - "entry remains REVISION_REQUESTED with estimated_participants unchanged (10)"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: rbac_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parades", payload: { name: "No Auth Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP 401 (test harness sends the request without the role/id headers)"

  - section: cross_cutting_layers
    instances:
      - name: endorsement_create_with_stale_permit_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[endorsement-create-stale-permit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After the POLICE endorsement advances the permit version, a FIRE creation carrying the pre-POLICE version is stale and rejected with 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["One parade; permit created (version captured); POLICE endorsement created with the fresh version, advancing the permit version"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "OCC Permit Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { pv1: $.data.permit_version } }
          trigger:
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1} - 1" }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION and HTTP 412 — expected_permit_version (${pv1} - 1) lags the current permit version"
            - "no FIRE endorsement is persisted; permit endorsed flow unaffected (endorsed_count == 0)"

      - name: publish_lineup_with_stale_parade_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[lineup-publish-stale-parade]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Publish carrying one less than the version observed at lock is rejected with 412; the successful publish path is covered separately in publish_lineup_with_fresh_version_succeeds_and_locks_scripts."
