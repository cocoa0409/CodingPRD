        distinguishing_aspect: "Creating a project against a SCOPE_SUBMITTED (not yet approved) consultation returns ERR_SCOPE_NOT_APPROVED (409); no Project row is created."
        test_recipe:
          setup: ["A VACANT consultation submitted but not approved."]
          setup_api_calls: *cons_two_items
          trigger:
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
