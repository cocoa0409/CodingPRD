              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { seller_cg_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Vermillion Acquisition Group", common_control_basis: "BROTHER_SISTER" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { buyer_cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${seller_cg_id}", legal_name: "Sandia Freight Lines Inc", ein: "410001101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 2 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2023, plan_year_end: 2023, contribution_base_units: 20000, contribution_amount_cents: 20000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2024, plan_year_end: 2024, contribution_base_units: 25000, contribution_amount_cents: 25000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2025, plan_year_end: 2025, contribution_base_units: 30000, contribution_amount_cents: 30000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v3}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /asset-sale-transactions"
              payload: { seller_employer_id: "${emp_id}", buyer_controlled_group_id: "${buyer_cg_id}", closing_date: "2026-02-01T00:00:00Z", closing_plan_year: 2026, purchase_price_cents: 300000000, bond_amount_cents: 0, buyer_assumes_contribution_obligation: false, workforce_continuity_pct: 0.80, asset_continuity_pct: 0.60, customer_continuity_pct: 0.60 }
              as: EmployerRepresentative
              as_user_id: "${emp_id}"
              captures: { txn_id: "$.data.id", required_bond: "$.data.required_bond_cents" }
          trigger:
            - call: "POST /asset-sale-transactions/${txn_id}/adjudicate"
              payload: { disposition: "CERTIFY_4204_EXEMPTION" }
              as: PlanTrustee
              as_user_id: "tr-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "${required_bond} == 30000000"
            - "${err} == ERR_4204_BOND_INSUFFICIENT"
            - "HTTP status == 422"
            - "${err} != ERR_4204_OBLIGATION_NOT_ASSUMED (priority 9 safety beats priority 12 constraint)"
            - "AssetSaleTransaction.${txn_id}.status == SUBMITTED and AssetSaleTransaction.${txn_id}.exemption_status == PENDING"
            - "ControlledGroup.${buyer_cg_id}.bond_posture == UNBONDED and ControlledGroup.${buyer_cg_id}.contingent_exposure_cents == 0"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: de_minimis_phaseout_inclusive_at_exactly_ten_million_cents
        grounds:
          - calculations.de_minimis_reduction
          - entities.LiabilityAssessment.fields.de_minimis_reduction_cents
          - entities.LiabilityAssessment.fields.net_assessed_cents
        distinguishing_aspect: |
          Metric: the de minimis phase-out threshold in cents, reached through
          POST /liability-assessments. A gross of exactly 10000000 keeps the whole 3000000-cent
          reduction (the comparison is <=, inclusive), while a gross of 10000001 — one cent more —
          burns exactly one cent of it, giving 2999999 and a net of 7000002 instead of 7000000.
        test_recipe:
          setup:
            - "Plan with MODIFIED_PRESUMPTIVE allocation and STATUTORY de minimis; CERTIFIED valuations 2021..2025 each uvb_total_cents 400000000, all_employer_contributions_cents 100000000, all_employer_cbu 100000, so the de minimis base is floor(400000000 * 75 / 10000) == 3000000 capped at 5000000."
            - "Employer A with one CERTIFIED record covering 2021..2025: 12500 CBU, 12500000 cents, 1000 cents per CBU -> gross exactly 10000000."
            - "Employer B identical except the record carries 12500001 cents -> gross 10000001."
            - "Both withdrawal events are for plan year 2026 and are determined COMPLETE; clock left at its default 2026-08-01T00:00:00Z."
