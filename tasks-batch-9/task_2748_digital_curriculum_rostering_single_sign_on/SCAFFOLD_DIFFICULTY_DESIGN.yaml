  # ===========================================================================
  # RULE 3 — non_linear_state_machine on DIFFERENT entities
  #   3a: SyncRun — a genuine cycle EXTRACTED -> HELD -> TRANSFORMED -> HELD.
  #   3b: AppAccount — parallel seat_status x identity_status dimensions.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sync_run_held_to_transformed_cycle
        grounds:
          - state_machines.SyncRun.EXTRACTED_to_HELD
          - state_machines.SyncRun.HELD_to_TRANSFORMED
          - state_machines.SyncRun.TRANSFORMED_to_HELD
          - state_machines.ErrorQueueItem.OPEN_to_RESOLVED_MATCHED
          - entities.SyncRun.fields.transform_count
          - entities.SyncRun.fields.blocking_error_count
          - validations[priority=25]
          - errors[ERR_BLOCKING_ERRORS_UNRESOLVED]
        distinguishing_aspect: "The SyncRun entity traverses a real cycle — EXTRACTED -> HELD -> (triage) -> TRANSFORMED -> HELD — and transform_count records 2 laps while the run ends back in HELD, which no acyclic pipeline can produce; the guard is that a second transform from HELD with the BLOCKING UNMATCHED_TEACHER item still OPEN is refused rather than looping forever."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE."
            - "Two ACTIVE teachers T_A and T_B in that building; T_A is primary_teacher_id of section SEC1 at period 3 (MON/WED/FRI); section SEC2 at period 5 (MON/WED) is created with primary_teacher_id omitted, so its roster_health is UNMATCHED_TEACHER."
            - "One ENROLLED student with a PENDING_ADD enrollment in SEC1 requested for 2026-08-15 (future relative to the clock)."
            - "An ACTIVE PER_STUDENT licence with unmatched_teacher_policy HOLD_RUN, total_seats 10, price_per_seat_cents 1000 and PROPORTIONAL_HEADCOUNT allocation."
            - "A FULL SyncRun in state EXTRACTED that has never been transformed (transform_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/teachers"
              payload: { school_id: "${sch_ne_id}", sis_staff_id: "STF-1001", full_name: "Dana Reed", email: "dana.reed@district.k12" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { t_a_id: $.data.id }
            - call: "POST /rostering/teachers"
              payload: { school_id: "${sch_ne_id}", sis_staff_id: "STF-1002", full_name: "Owen Pike", email: "owen.pike@district.k12" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { t_b_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", primary_teacher_id: "${t_a_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec1_id: $.data.id }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3002", course_code: "READ4", subject: "ELA", period_index: 5, meeting_days: ["MON", "WED"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec2_id: $.data.id }
            - call: "POST /rostering/enrollments"
              payload: { section_id: "${sec1_id}", student_id: "${s1_id}", requested_effective_date: "2026-08-15", source: "SIS_EXTRACT" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { e1_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", unmatched_teacher_policy: "HOLD_RUN", total_seats: 10, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "POST /rostering/sync-runs"
              payload: { vendor_app_id: "${va_id}", run_type: "FULL" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /rostering/sync-runs/${run_id}/transform"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/sync-runs/${run_id}/transform"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/error-queue-items"
              payload: { sync_run_id: "${run_id}", category: "UNMATCHED_TEACHER", status: "OPEN" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { item1_id: "$.data[0].id" }
            - call: "POST /rostering/error-queue-items/${item1_id}/resolve-match"
              payload: { replacement_teacher_id: "${t_b_id}", resolution_note: "reassigned to Owen Pike" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "POST /rostering/sync-runs/${run_id}/transform"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/teachers/${t_b_id}/separate"
              payload: { separation_effective_date: "2026-08-20" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          assert:
            - "after the first transform: SyncRun.${run_id}.state == HELD, transform_count == 1, blocking_error_count == 1, advisory_error_count == 0, projected_charge_cents == null, projected_seat_delta == null"
            - "after the first transform: VendorApp.${va_id}.sync_health == BLOCKED"
            - "the second transform is refused with error_id ERR_BLOCKING_ERRORS_UNRESOLVED and HTTP 409; SyncRun.${run_id}.transform_count stays 1 and state stays HELD"
            - "the raised ErrorQueueItem has category == UNMATCHED_TEACHER, severity == BLOCKING, status == OPEN and subject_section_id == ${sec2_id}"
            - "after resolve-match: ErrorQueueItem.${item1_id}.status == RESOLVED_MATCHED, Section.${sec2_id}.primary_teacher_id == ${t_b_id}, Section.${sec2_id}.roster_health == OK, SyncRun.${run_id}.blocking_error_count == 0 and SyncRun.${run_id}.state is STILL HELD"
            - "after the third transform: SyncRun.${run_id}.state == TRANSFORMED, transform_count == 2, transformed_record_count == 3, projected_seat_delta == 1, projected_charge_cents == 1000, VendorApp.${va_id}.sync_health == OK"
            - "after the separation: SyncRun.${run_id}.state == HELD again, blocking_error_count == 1, projected_charge_cents == null, transform_count still 2, VendorApp.${va_id}.sync_health == BLOCKED"
            - "GET /rostering/sync-runs?vendor_app_id=${va_id} returns exactly 1 row — the cycle reuses one SyncRun, it never supersedes it"

      - name: app_account_parallel_seat_and_identity_axes
        grounds:
          - state_machines.AppAccount.RESERVED_to_ACTIVE
          - state_machines.AppAccount.RESERVED_or_ACTIVE_to_RELEASED
          - state_machines.AppAccount.PENDING_PROVISION_to_PROVISIONED
          - state_machines.AppAccount.PROVISIONED_to_DEPROVISIONED
          - entities.AppAccount.fields.seat_status
          - entities.AppAccount.fields.identity_status
          - entities.AppAccount.fields.password_state
          - entities.BuildingAllocation.fields.consumed_seats
        distinguishing_aspect: "On the AppAccount entity (not SyncRun) two dimensions advance on four different triggers and never move together: password-set moves identity PENDING_PROVISION -> PROVISIONED while the seat stays RESERVED; record-usage moves the seat RESERVED -> ACTIVE while the identity stays PROVISIONED; deprovision moves the identity to DEPROVISIONED while the seat stays ACTIVE and BuildingAllocation.consumed_seats stays 1; only release frees the seat, so the terminal state is the COMBINATION RELEASED+DEPROVISIONED."
