        distinguishing_aspect: |
          Category pair business_safety(7) vs business_temporal(8) — different
          pair than the state/fiscal instance: firing with an EXPIRED
          TASK_TRAINING record at 02:00 UTC (outside the blast window) must
          return ERR_TRAINING_EXPIRED, not ERR_OUTSIDE_BLAST_WINDOW.
        test_recipe:
          setup:
            - "Site OPERATING (bond posted); bench RELEASED; shot plan LOADED; firing user's TASK_TRAINING expired 2026-06-01; clock 2026-08-01T02:00:00Z (hour 2 outside [8,17))"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2025-06-01" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: QuarryAdmin }
          trigger:
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_TRAINING_EXPIRED (http 409), NOT ERR_OUTSIDE_BLAST_WINDOW — safety priority 7 beats temporal priority 8"
            - "ShotPlan.${plan}.status stays LOADED; no muckpile created (GET /muckpiles?shot_plan_id returns empty array)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: royalty_tier_exact_threshold_boundary
        grounds:
          - calculations.royalty_amount
          - entities.RoyaltyStatement.fields.ytd_tons_before
        distinguishing_aspect: |
          Metric = calendar-year cumulative tonnage, endpoint = POST
          /royalty-statements: January tickets of 26.000 + 24.000 t land YTD
          EXACTLY on the 50 t threshold (tons beyond threshold = 0, so all base
          rate, due 12.50); the next 26.000 t ticket in February runs entirely
          at the tier rate (due 10.40).
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 200.0; agreement 0.25 base / 0.40 tier / threshold 50; zone; order qty 100 CONFIRMED; certified scale"
            - "January (clock 2026-01-10): tickets 26.000 t and 24.000 t COMPLETED; statement for January generated"
            - "February (clock 2026-02-10): one more 26.000 t ticket COMPLETED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2025-12-01", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T12:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe1: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe1}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt1: $.data.id } }
            - { call: "POST /queue-entries/${qe1}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt1}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-2", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe2: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe2}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 76000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt2: $.data.id } }
            - { call: "POST /queue-entries/${qe2}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt2}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-01-01", period_end: "2026-02-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { stmt_jan: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-10T12:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-3", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe3: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe3}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt3: $.data.id } }
            - { call: "POST /queue-entries/${qe3}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt3}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-02-01", period_end: "2026-03-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { stmt_feb: $.data.id } }
          assert:
            - "RoyaltyStatement.${stmt_jan}.tons_sold == 50.000 and ytd_tons_after == 50.000 — YTD lands EXACTLY on the threshold"
            - "RoyaltyStatement.${stmt_jan}.royalty_due_usd == 12.50 (26.000x0.25 + 24.000x0.25: zero tons beyond threshold, so no tier-rate tonnage)"
            - "RoyaltyStatement.${stmt_feb}.ytd_tons_before == 50.000"
            - "RoyaltyStatement.${stmt_feb}.royalty_due_usd == 10.40 (26.000 t entirely at tier rate 0.40 — threshold already exhausted)"

      - name: order_completion_exact_quantity_boundary
        grounds:
          - state_machines.SalesOrder.IN_FULFILLMENT_to_COMPLETED
          - entities.SalesOrder.fields.fulfilled_tons
        distinguishing_aspect: |
          Metric = fulfilled tons, endpoint = POST /scale-tickets/{id}/weigh-out:
          fulfilled == quantity exactly (52.000 == 52) auto-completes the order
          (>= boundary, equality completes); the first ticket (26.000 < 52)
          leaves it IN_FULFILLMENT.
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 200.0; agreement; certified scale; zone; order qty 52 CONFIRMED; two tickets of net 26.000 t each at default clock"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 52 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe1: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe1}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt1: $.data.id } }
            - { call: "POST /queue-entries/${qe1}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt1}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "GET /sales-orders/${ord}", payload: {}, as: SalesAgent, as_user_id: "sa-1", captures: { st_after_1: $.data.status } }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-2", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe2: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe2}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt2: $.data.id } }
            - { call: "POST /queue-entries/${qe2}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /scale-tickets/${tkt2}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "GET /sales-orders/${ord}", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
          assert:
            - "after first weigh-out: SalesOrder.${ord}.status == IN_FULFILLMENT and fulfilled_tons == 26.000 (26 < 52)"
            - "after second weigh-out: fulfilled_tons == 52.000 == quantity_tons and status == COMPLETED (equality completes)"
            - "Stockpile.${pile}.reserved_tons == 0 after completion and on_hand_tons == 148.0"

      - name: calibration_tolerance_inclusive_boundary
        grounds:
          - calculations.certification_window
          - entities.ScaleCalibration.fields.as_left_error_pct
          - entities.Scale.fields.certified_through
        distinguishing_aspect: |
          Metric = as-left error percent, endpoint = POST /scale-calibrations:
          abs error exactly 0.25 PASSES (inclusive <=) and certifies the scale;
          0.251 FAILS and leaves the scale OUT_OF_SERVICE.
        test_recipe:
          setup:
            - "Site with two TRUCK scales registered (both initially OUT_OF_SERVICE); default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale1: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-02", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale2: $.data.id } }
          trigger:
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale1}", calibrated_on: "2026-02-02", as_found_error_pct: 0.40, as_left_error_pct: 0.25 }, as: QuarryAdmin, captures: { cal1: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale2}", calibrated_on: "2026-02-02", as_found_error_pct: 0.40, as_left_error_pct: 0.251 }, as: QuarryAdmin, captures: { cal2: $.data.id } }
            - { call: "GET /scales/${scale1}", payload: {}, as: QuarryAdmin, captures: { s1_status: $.data.status } }
            - { call: "GET /scales/${scale2}", payload: {}, as: QuarryAdmin, captures: { s2_status: $.data.status } }
          assert:
            - "ScaleCalibration.${cal1}.result == PASS and Scale.${scale1}.status == CERTIFIED with certified_through == 2026-08-01 (0.25 passes: inclusive)"
            - "ScaleCalibration.${cal2}.result == FAIL and Scale.${scale2}.status == OUT_OF_SERVICE with certified_through null (0.251 fails)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fire_requires_site_posture_operating
        grounds:
          - state_machines.ShotPlan.LOADED_to_FIRED
          - calculations.posture_derivation
          - errors[ERR_SITE_POSTURE_BLOCKED]
        distinguishing_aspect: |
          Pair ShotPlan x QuarrySite: firing is gated on the SITE's derived
          posture, not on anything in the plan itself — with bond coverage
          DEFICIENT (posture RESTRICTED), a fully LOADED plan with current
          training inside the blast window still fails with
          ERR_SITE_POSTURE_BLOCKED.
        test_recipe:
          setup:
            - "Site with NO bond posted; bench released (posture drops to RESTRICTED because required 60000 > posted 0); plan advanced to LOADED; training current; clock 2026-08-01T10:00:00Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
          trigger:
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1", captures: { err: $.data.error_id } }
            - { call: "GET /sites/${site}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "trigger error_id == ERR_SITE_POSTURE_BLOCKED (http 409)"
            - "QuarrySite.${site}.posture == RESTRICTED and bond_adequacy == DEFICIENT"
            - "ShotPlan.${plan}.status stays LOADED"

      - name: weighout_requires_scale_certified_in_date
        grounds:
          - state_machines.ScaleTicket.OPEN_to_COMPLETED
          - calculations.certification_window
          - errors[ERR_SCALE_NOT_CERTIFIED]
        distinguishing_aspect: |
          Pair ScaleTicket x Scale (different pair than ShotPlan x QuarrySite):
          weigh-in succeeds while the scale's certified_through covers the clock
          date; after the clock passes certified_through (2026-06-30), weigh-out
          of that same open ticket fails with ERR_SCALE_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 200.0; agreement; zone; order qty 100 CONFIRMED; TRUCK scale calibrated_on 2026-01-01 (certified_through 2026-06-30)"
            - "Clock 2026-06-15T09:00:00Z: ticket weighed in (gross 80000), entry moved LOADING -> AT_SCALE_OUT"
            - "Clock advanced to 2026-07-01T09:00:00Z (past certification)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-01-01", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T09:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt: $.data.id } }
            - { call: "POST /queue-entries/${qe}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T09:00:00Z" }, as: QuarryAdmin }
          trigger:
            - { call: "POST /scale-tickets/${tkt}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SCALE_NOT_CERTIFIED (http 409): certified_through 2026-06-30 < clock date 2026-07-01"
            - "ScaleTicket.${tkt}.status stays OPEN; TruckQueueEntry.${qe}.status stays AT_SCALE_OUT"

      - name: confirm_requires_stockpile_open_not_quarantined
        grounds:
          - state_machines.SalesOrder.QUOTED_to_CONFIRMED
          - state_machines.Stockpile.OPEN_to_QUARANTINED
          - errors[ERR_STOCKPILE_QUARANTINED]
        distinguishing_aspect: |
          Pair SalesOrder x Stockpile (a third distinct pair): a CONFIRMED-FAIL
          gradation test quarantines the pile, and an otherwise valid order
          confirm then fails with ERR_STOCKPILE_QUARANTINED — the order's
          transition depends on the stockpile's state.
        test_recipe:
          setup:
            - "Site; spec A57; stockpile QUARANTINED via confirmed FAIL test; zone; order for 30 t in QUOTED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T07:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 80 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { gt: $.data.id } }
            - { call: "POST /gradation-tests/${gt}/confirm", payload: {}, as: QCTechnician, as_user_id: "qc-2" }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_STOCKPILE_QUARANTINED (http 409)"
            - "SalesOrder.${ord}.status stays QUOTED and prices_pinned == false"
            - "Stockpile.${pile}.status == QUARANTINED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: circuit_cooldown_buffer_overlap
        grounds:
          - state_machines.PlantRun
          - errors[ERR_CIRCUIT_OVERLAP]
        distinguishing_aspect: |
          Semantics: half-open run intervals PLUS a mandatory 30-minute cooldown
          buffer on the same circuit_line. A run ending 10:00 blocks a start at
          10:20 (inside buffer) but not at 10:30 (buffer boundary, inclusive
          end). Resource: crusher circuit (PlantRun.circuit_line).
        test_recipe:
          setup:
            - "Site OPERATING; fired shot -> muckpile; certified belt scale; pile capacity 5000; run A on PRIMARY started and completed at clock 2026-08-01T10:00:00Z (input 100.0, output 100.0)"
            - "run B scheduled on PRIMARY; clock at 2026-08-01T10:20:00Z for first start attempt"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "GET /muckpiles", payload: { shot_plan_id: "${plan}" }, as: PlantOperator, as_user_id: "po-1", captures: { mp: "$.data[0].id" } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { runA: $.data.id } }
            - { call: "POST /plant-runs/${runA}/start", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /plant-runs/${runA}/complete", payload: { input_tons: 100.0, outputs: [ { stockpile_id: "${pile}", product_spec_id: "${spec}", tons: 100.0 } ] }, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { runB: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: QuarryAdmin }
          trigger:
            - { call: "POST /plant-runs/${runB}/start", payload: {}, as: PlantOperator, as_user_id: "po-1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:30:00Z" }, as: QuarryAdmin }
            - { call: "POST /plant-runs/${runB}/start", payload: {}, as: PlantOperator, as_user_id: "po-1" }
          assert:
            - "at 10:20 (inside the 30-minute cooldown): error_id == ERR_CIRCUIT_OVERLAP (http 409); run B stays SCHEDULED"
            - "at 10:30 (ended_at + 30 min exactly, boundary inclusive): run B starts — production_status == RUNNING"
            - "run A production_status stays COMPLETED throughout"

      - name: truck_single_active_queue_occupancy
        grounds:
          - state_machines.TruckQueueEntry
          - errors[ERR_TRUCK_ALREADY_QUEUED]
        distinguishing_aspect: |
          Semantics: aggregate occupancy, not interval arithmetic — a truck may
          hold AT MOST ONE queue entry in an active status
          {QUEUED, AT_SCALE_IN, LOADING, AT_SCALE_OUT} per site, regardless of
          times. Resource: the truck. Terminal states (NO_SHOW/EXITED) free it.
        test_recipe:
          setup:
            - "Site; queue entry for TRK-1 in QUEUED (active occupancy)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe1: $.data.id } }
          trigger:
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "SPOT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
            - { call: "POST /queue-entries/${qe1}/mark-no-show", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "SPOT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe2: $.data.id } }
          assert:
            - "second entry while TRK-1 QUEUED: error_id == ERR_TRUCK_ALREADY_QUEUED (http 409)"
            - "after mark-no-show (terminal, occupancy released): re-entry succeeds — TruckQueueEntry.${qe2}.status == QUEUED"
            - "occupancy is status-based, not time-based: queued_at plays no role in the rejection"

      - name: statement_period_half_open_adjacency
        grounds:
          - entities.RoyaltyStatement.fields.period_start
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Semantics: pure half-open [start, end) with NO buffer — adjacency
          (period_start == prior period_end) is legal, any positive intersection
          is not. Different from both the circuit's buffered intervals and the
          truck's occupancy semantics. Resource: the site's statement calendar.
        test_recipe:
          setup:
            - "Site with ACTIVE agreement (effective 2026-01-01); statement S1 [2026-01-01, 2026-02-01) generated DRAFT (zero tickets is legal: tons_sold 0)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-01-01", period_end: "2026-02-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-01-15", period_end: "2026-02-15" }, as: FinanceClerk, as_user_id: "fc-1", captures: { err: $.data.error_id } }
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-02-01", period_end: "2026-03-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { s2: $.data.id } }
          assert:
            - "[2026-01-15, 2026-02-15) intersects S1: error_id == ERR_STATEMENT_PERIOD_OVERLAP (http 409)"
            - "[2026-02-01, 2026-03-01) is exactly adjacent (start == S1.end): accepted, RoyaltyStatement.${s2}.tons_sold == 0"
            - "RoyaltyStatement.${s1}.status == DRAFT (unchanged by the rejected attempt)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ticket_void_roundtrip_conserves_available_tons
        grounds:
          - state_machines.ScaleTicket.COMPLETED_to_VOIDED
          - calculations.stockpile_availability
        distinguishing_aspect: |
          Conserved quantity: Stockpile.available_tons == on_hand - reserved.
          A weigh-out (draw 26.000 t, fulfill 26.000 t, reserve release 26.000 t)
          followed by its void leaves available_tons at exactly 100.0 at all
          three observation points — the shipment and its compensation cancel.
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 200.0; agreement; zone; order qty 100 CONFIRMED (reserved 100, available 100.0); certified scale; one ticket weighed out (net 26.000) then voided"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt: $.data.id } }
            - { call: "POST /queue-entries/${qe}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /scale-tickets/${tkt}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { avail_mid: $.data.available_tons } }
            - { call: "POST /scale-tickets/${tkt}/void", payload: { void_reason: "duplicate entry" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /sales-orders/${ord}", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
          assert:
            - "invariant before weigh-out: on_hand 200.0 - reserved 100.0 == available_tons 100.0"
            - "after weigh-out: on_hand 174.0 and reserved 74.0 -> available_tons == 100.0 (unchanged)"
            - "after void: on_hand_tons == 200.0, reserved_tons == 100.0, available_tons == 100.0 — full compensation, zero drift"
            - "SalesOrder.${ord}.fulfilled_tons == 0 and status == IN_FULFILLMENT after the void"
            - "ScaleTicket.${tkt}.status == VOIDED"

      - name: order_confirm_cancel_roundtrip_conserves_reserved_tons
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - calculations.stockpile_availability
        distinguishing_aspect: |
          Conserved quantity (different from ticket tons): the reservation pool
          — reserved_tons + available_tons == on_hand_tons (80.0) across a
          confirm (reserves 30) and its cancel (releases 30); no ticket ever
          exists, so the invariant isolates the allocation channel.
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 80.0 (adjustment), reserved 0; zone; order qty 30"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 80.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { avail_mid: $.data.available_tons } }
            - { call: "POST /sales-orders/${ord}/cancel", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "before confirm: reserved 0, available == 80.0 == on_hand 80.0"
            - "after confirm: reserved_tons == 30.0 and available_tons == 50.0 (reserved + available == on_hand)"
            - "after cancel: reserved_tons == 0 and available_tons == 80.0 — round trip leaves the pool unchanged"
            - "SalesOrder.${ord}.status == CANCELLED"

      - name: plant_run_void_roundtrip_conserves_production_mass
        grounds:
          - state_machines.PlantRun
          - state_machines.Muckpile.DEPLETED_to_OPEN
          - calculations.muckpile_remaining
        distinguishing_aspect: |
          Conserved quantity (different from both inventory pools): blast mass
          — muckpile.remaining_tons + stockpile credited tons == 3792.6 across
          a run complete and its void; the void also demonstrates DEPLETED ->
          OPEN resurrection is NOT triggered here (remaining never reaches 0)
          while mass still balances.
        test_recipe:
          setup:
            - "Site OPERATING; fired shot (estimated 3792.6 t); certified belt scale; pile capacity 5000; run COMPLETED with input 620.0 / output 620.0 then voided while UNRECONCILED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "GET /muckpiles", payload: { shot_plan_id: "${plan}" }, as: PlantOperator, as_user_id: "po-1", captures: { mp: "$.data[0].id" } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { run: $.data.id } }
            - { call: "POST /plant-runs/${run}/start", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /plant-runs/${run}/complete", payload: { input_tons: 620.0, outputs: [ { stockpile_id: "${pile}", product_spec_id: "${spec}", tons: 620.0 } ] }, as: PlantOperator, as_user_id: "po-1" }
          trigger:
            - { call: "POST /plant-runs/${run}/void", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "GET /muckpiles/${mp}", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "after complete: Muckpile.${mp}.remaining_tons == 3172.6 and Stockpile.${pile}.on_hand_tons == 620.0 (sum == 3792.6)"
            - "after void: Muckpile.${mp}.remaining_tons == 3792.6 and actual_fed_tons == 0"
            - "after void: Stockpile.${pile}.on_hand_tons == 0 (credit fully reversed; sum conserved at 3792.6)"
            - "PlantRun.${run}.production_status == VOIDED and Muckpile.${mp}.status == OPEN"



