            - "R2 (ship 2026-08-10) allocations == [{lot_id: ${lb_id}, qty: 2}] — LB eligible because expiry 2026-08-10 == ship date (inclusive)"
            - "InventoryLot.${la_id} untouched: qty_on_hand == 5, status AVAILABLE"
            - "InventoryLot.${lb_id}.qty_on_hand == 0 and status == DEPLETED"

      - name: tier_discount_boundary_499_vs_500
        claim_type: constants_applied
