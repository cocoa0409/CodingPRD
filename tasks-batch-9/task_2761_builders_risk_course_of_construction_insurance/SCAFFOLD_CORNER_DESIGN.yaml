      - name: corner_four_hop_cascades_are_verified_end_to_end_in_both_directions
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST /builders-risk/extension-endorsements/{id}/decision
          - endpoints.POST /builders-risk/loss-payments
        excluded_because:
          difficulty_instance: "transitive_cascade / loss_payment_cascades_erosion_reserve_and_closure"
          rationale: "The payment cascade (erosion, reserve, payment_status, closure) and the clock expiry cascade are both walked hop by hop there, and clock_expiry_cascades_policy_parts_storage_and_facility covers the ordering-sensitive variant; a third pass here would only restate them."

      - name: corner_both_calculation_variants_diverge_on_identical_inputs
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.project_risk_score.variants
          - calculations.claim_indemnity_allocation.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_risk_score_submission_basis_versus_audit_basis"
          rationale: "Variant divergence, variant selection and the delta on switch are already measured there and in claim_indemnity_reconstruction_cost_versus_actual_loss, with the exact per-variant literals."

  - section: consistency_model
    instances:
      - name: corner_every_derived_field_is_current_in_the_same_response_that_changed_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /builders-risk/loss-payments
          - endpoints.POST /builders-risk/storage-assignments
          - endpoints.POST /builders-risk/policies/{id}/bind
        distinguishing_aspect: "The consistency model is immediate, so no read may lag a write by even one request: the bind response itself already carries written_premium_cents, the assignment response's facility read immediately after shows the new committed_value_cents, and the read taken directly after the payment already shows the eroded part, the raised paid_cents and the closed claim - there is no settle-later or recompute-on-read window anywhere."
        test_recipe:
          setup:
            - "IN_FORCE 200-day policy (quoted 320000) with MATERIALS_ON_SITE 60000000 and TEMPORARY_STORAGE 20000000, OWNER 100 acknowledged; clock 2026-09-01; one facility WH-01 12 miles."
            - "Claim adjusted by ca-001 on ACTUAL_LOSS 15000000 -> indemnity 12500000 and settled by ca-002."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
