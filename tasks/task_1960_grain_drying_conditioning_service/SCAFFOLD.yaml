# =============================================================================
# Task 1960 — Grain Drying & Conditioning Service (country elevator dryer)
# Scaffold seed tables (§1.0–§1.7). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  1960. Grain Drying & Conditioning Service (country elevator dryer): intake
  moisture test & drying charge schedule, dryer scheduling & throughput queue,
  shrink factor & weight reconciliation, quality damage during drying &
  liability, energy cost pass-through, storage after drying & ownership,
  blending to target moisture, capacity allocation at harvest peak.

domain_name: grain-drying-conditioning
api_prefix: /grain-drying

complexity_profile:
  primary_archetype: "Quota / allocation — finite daily dryer throughput competed for by queue tickets, class caps, priority preemption"
  secondary_archetype: "Ledger reconciliation — provisional formula-estimated shrink vs certified scale weights; prepaid ledger vs invoice receivables"
  complexity_layers:
    - dual_variant_calculation      # provisional-formula vs certified-scale weight; metered vs estimated energy
    - cascading_side_effects        # run-complete -> lot -> agreement -> lot; claim-pay -> customer -> invoice -> invoice state
    - rate_threshold_triggers       # moisture brackets, energy tiers, class capacity caps, liability caps
    - optimistic_concurrency        # OCC on GrainLot.version (test create) and Invoice.version (payment post)
  entity_topology: flat             # peer entities joined by FK references; no nested ownership tree in URLs
  state_machine_shape: cyclic       # DAMAGE_HOLD / STORED loops on GrainLot; DISPUTED retest loop; appeal loop; PAID->ISSUED reversal loop
  relationship_patterns:
    - one_to_many                   # Customer -> GrainLot -> MoistureTest / QueueTicket / DryerRun
    - self_referential              # MoistureTest.supersedes_test_id; Payment.reversal_of_payment_id
    - cross_aggregate               # BlendOrder joins two GrainLots and mints a third; DamageClaim spans GrainLot + DryerRun
  role_model: segregation_of_duties # dryer operator may not assess claims on own runs; dispute retest certifier != original certifier; blend approver != creator
  consistency_model: immediate      # every mutation visible in the same response; derived fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower / account name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding receivables allowed; confirmed-ticket estimates + ISSUED dues must stay <= this" }
      - { name: prepaid_balance_cents, type: integer, source: computed, default: 0, description: "Ledger of grower credit on account; input at create as opening balance, afterwards mutated only by claim credits, payment draws, and reversal refunds" }
      - { name: priority_class, type: enum, source: input, default: STANDARD, description: "STANDARD | PRIORITY_CONTRACT — governs queue-ticket class caps and preemption exposure" }
      - { name: account_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED — suspension blocks queue-ticket create/confirm" }

  - name: GrainLot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; delivering account" }
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Scale weight of truck + grain at intake" }
      - { name: tare_weight_lbs, type: integer, source: input, description: "Scale weight of empty truck" }
      - { name: wet_net_weight_lbs, type: integer, source: computed, description: "= gross_weight_lbs - tare_weight_lbs" }
      - { name: foreign_material_pct, type: number, source: input, default: 0.0, description: "FM percentage from intake grading; > fm_threshold_pct triggers drying-charge surcharge; > 8.0 marks pre-existing condition in liability" }
      - { name: target_moisture_pct, type: number, source: input, description: "Contractual dry-down target; 10.0 <= target <= 20.0" }
      - { name: intake_moisture_pct, type: number, source: computed, description: "Moisture from the currently CERTIFIED MoistureTest; null until first certification" }
      - { name: current_moisture_pct, type: number, source: computed, description: "intake_moisture_pct before drying; discharge_moisture_pct of the completing DryerRun after drying" }
      - { name: certified_test_id, type: string, source: computed, description: "FK -> MoistureTest.id; nullable; the lot's governing certified test" }
      - { name: provisional_shrink_pct, type: number, source: computed, description: "Formula-estimated shrink % (water shrink + 0.5 handling); set at certification" }
      - { name: provisional_dry_weight_lbs, type: integer, source: computed, description: "Formula-estimated dry weight in whole lbs (round_half_up); set at certification" }
      - { name: final_dry_weight_lbs, type: integer, source: computed, description: "Certified scale-out weight copied from completing DryerRun.scale_out_weight_lbs" }
      - { name: final_shrink_pct, type: number, source: computed, description: "= round_half_up((wet_net - final_dry)/wet_net * 100, 2); set at run completion" }
      - { name: shrink_variance_lbs, type: integer, source: computed, description: "= provisional_dry_weight_lbs - final_dry_weight_lbs; positive means formula over-estimated dry weight" }
      - { name: status, type: enum, source: system, description: "RECEIVED | TESTED | QUEUED | DRYING | DRIED | DAMAGE_HOLD | STORED | LOADED_OUT | BLENDED_OUT" }
      - { name: ownership, type: enum, source: system, default: GROWER_HELD, description: "GROWER_HELD | ELEVATOR_HELD — flips on storage default" }
      - { name: current_owner_id, type: string, source: system, description: "FK -> Customer.id; nullable; equals customer_id while GROWER_HELD; null while ELEVATOR_HELD" }

  - name: MoistureTest
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> GrainLot.id; lot under test" }
      - { name: sample_moisture_pct, type: number, source: input, description: "Measured moisture of the composite sample; 0 < value < 60" }
      - { name: method, type: enum, source: input, default: PROBE, description: "PROBE | OVEN_REFERENCE" }
      - { name: supersedes_test_id, type: string, source: input, description: "FK -> MoistureTest.id; nullable; declared retest target when disputing" }
      - { name: status, type: enum, source: system, description: "PRELIMINARY | CERTIFIED | DISPUTED | SUPERSEDED" }
      - { name: tested_by_user_id, type: string, source: system, description: "X-User-ID of creating IntakeTechnician" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying IntakeTechnician; null until certified" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of certification; null until certified" }

  - name: DryingChargeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT — one active window per commodity" }
      - { name: effective_from, type: string, source: input, description: "Inclusive start date (YYYY-MM-DD) of tariff window" }
      - { name: effective_to, type: string, source: input, description: "Inclusive end date (YYYY-MM-DD) of tariff window; windows for the same commodity must not overlap (closed-interval semantics)" }
      - { name: t1_max_moisture_pct, type: number, source: input, description: "Upper edge (inclusive) of bracket 1 intake moisture" }
      - { name: t2_max_moisture_pct, type: number, source: input, description: "Upper edge (inclusive) of bracket 2 intake moisture" }
      - { name: rate_t1_cents_per_pt_bu, type: integer, source: input, description: "Cents per point removed per bushel when intake <= t1_max" }
      - { name: rate_t2_cents_per_pt_bu, type: integer, source: input, description: "Rate when t1_max < intake <= t2_max" }
      - { name: rate_t3_cents_per_pt_bu, type: integer, source: input, description: "Rate when intake > t2_max" }
      - { name: fm_threshold_pct, type: number, source: input, description: "FM above this (strictly greater) triggers surcharge" }
      - { name: fm_surcharge_pct, type: number, source: input, description: "Multiplier applied to bracket subtotal when FM above threshold, e.g. 0.10" }
      - { name: min_charge_cents, type: integer, source: input, description: "Floor applied after bracket + surcharge" }
      - { name: energy_t1_limit_therms, type: number, source: input, description: "Marginal-tier breakpoint for energy pass-through" }
      - { name: energy_t1_rate_cents_per_therm, type: integer, source: input, description: "Rate for therms <= breakpoint" }
      - { name: energy_t2_rate_cents_per_therm, type: integer, source: input, description: "Marginal rate for therms above breakpoint" }
      - { name: est_therms_per_hour, type: number, source: input, description: "Estimated-variant burn rate per run hour" }
      - { name: est_point_factor, type: number, source: input, description: "Estimated-variant load factor per point removed, e.g. 0.05" }

  - name: DryerUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique unit identifier, e.g. DRYER-1" }
      - { name: daily_capacity_bushels, type: integer, source: input, description: "Total bookable bushels per calendar day across all classes" }
      - { name: standard_class_cap_bushels, type: integer, source: input, description: "Max committed bushels per day from STANDARD-class tickets" }
      - { name: throughput_bu_per_hour, type: integer, source: input, description: "Nameplate throughput; informational" }
      - { name: cooldown_minutes, type: integer, source: input, description: "Mandatory idle gap between runs on this unit" }

  - name: QueueTicket
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> GrainLot.id; lot booking dryer time" }
      - { name: unit_id, type: string, source: input, description: "FK -> DryerUnit.id; unit whose daily capacity is consumed" }
      - { name: window_date, type: string, source: input, description: "Calendar day (YYYY-MM-DD) the bushels are committed against" }
      - { name: requested_bushels, type: integer, source: input, description: "Bushels to reserve; > 0" }
      - { name: priority_class, type: enum, source: computed, description: "Copied from Customer.priority_class at creation; STANDARD tickets are preemption-eligible" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | PREEMPTED | CONSUMED | CANCELLED | EXPIRED" }
      - { name: preemption_count, type: integer, source: system, default: 0, description: "Number of times preempted; requeue requires < 2" }

  - name: DryerRun
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> DryerUnit.id; physical unit booked" }
      - { name: lot_id, type: string, source: input, description: "FK -> GrainLot.id; lot being dried" }
      - { name: queue_ticket_id, type: string, source: input, description: "FK -> QueueTicket.id; capacity backing this run" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start; half-open interval [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end; must be after start" }
      - { name: actual_start, type: datetime, source: system, description: "Logical-clock timestamp at start" }
      - { name: actual_end, type: datetime, source: system, description: "Logical-clock timestamp at completion" }
      - { name: operator_user_id, type: string, source: system, description: "X-User-ID of DryerOperator who started the run; used by claim segregation-of-duties" }
      - { name: meter_start_therms, type: number, source: input, description: "Gas meter reading at start" }
      - { name: meter_end_therms, type: number, source: input, description: "Gas meter reading at completion; required unless energy_estimated" }
      - { name: energy_estimated, type: boolean, source: input, default: false, description: "true selects the estimated-burn variant of the energy pass-through" }
      - { name: scale_out_weight_lbs, type: integer, source: input, description: "Certified scale weight of dried grain at completion" }
      - { name: discharge_moisture_pct, type: number, source: input, description: "Measured moisture of grain leaving the dryer" }
      - { name: fuel_therms, type: number, source: computed, description: "meter_end - meter_start, or estimated burn when energy_estimated" }
      - { name: energy_charge_cents, type: integer, source: computed, description: "Tiered pass-through charge, round_half_up to whole cents at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED | CANCELLED" }

  - name: BlendOrder
    parent: null
    common_fields: true
    fields:
      - { name: high_moisture_lot_id, type: string, source: input, description: "FK -> GrainLot.id; wetter source (DRIED, current_moisture_pct above target)" }
      - { name: low_moisture_lot_id, type: string, source: input, description: "FK -> GrainLot.id; drier source (DRIED, current_moisture_pct below target)" }
      - { name: target_moisture_pct, type: number, source: input, description: "Blend target; must lie strictly between the two source moistures" }
      - { name: required_low_lot_lbs, type: integer, source: computed, description: "Ceiling of Pearson-square required low-side pounds; computed at create" }
      - { name: result_lot_id, type: string, source: computed, description: "FK -> GrainLot.id; nullable; blended lot minted at execute" }
      - { name: result_weight_lbs, type: integer, source: computed, description: "= high.final_dry_weight_lbs + required_low_lot_lbs; set at execute" }
      - { name: result_moisture_pct, type: number, source: computed, description: "Weight-mean moisture of the blend, round_half_up to 2 decimals; set at execute" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EXECUTED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating ElevatorManager" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving ElevatorManager; must differ from creator" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> GrainLot.id; damaged lot" }
      - { name: dryer_run_id, type: string, source: input, description: "FK -> DryerRun.id; run alleged to have caused damage" }
      - { name: damage_type, type: enum, source: input, description: "HEAT_DAMAGE | STRESS_CRACKING | MOLD_CONTAMINATION | EXCESS_SHRINK" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Grower-claimed damages; > 0" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | ASSESSED | DENIED | APPEALED | PAID | WITHDRAWN" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of filing Grower (= lot.current_owner_id at filing)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing ClaimsAdjuster" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of assessing ClaimsAdjuster; must differ from filer and run operator" }
      - { name: lot_value_cents, type: integer, source: computed, description: "Certified lot value snapshot at assessment" }
      - { name: fault_multiplier, type: number, source: computed, description: "0.25 pre-existing | 1.0 in-spec | 1.5 out-of-spec; set at assessment" }
      - { name: assessed_liability_cents, type: integer, source: computed, description: "Final liability after deductible, multiplier, and cap; set at assessment" }

  - name: StorageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> GrainLot.id; stored lot" }
      - { name: owner_id, type: string, source: system, description: "FK -> Customer.id; copied from lot.current_owner_id at creation" }
      - { name: daily_rate_cents_per_bu, type: number, source: input, default: 0.15, description: "Storage rate per bushel per day" }
      - { name: min_days, type: integer, source: input, default: 7, description: "Minimum billable days floor" }
      - { name: baseline_bushels, type: number, source: computed, description: "= round_half_up(final_dry_weight_lbs / lbs-per-bushel, 2); fixed at activation" }
      - { name: start_date, type: string, source: system, description: "Activation date (completion date or creation date when lot already DRIED)" }
      - { name: closed_date, type: string, source: system, description: "Date accrual stopped (exclusive); null until closed" }
      - { name: accrued_days, type: integer, source: computed, description: "Days in [start_date, closed_date or current date)" }
      - { name: accrued_storage_cents, type: integer, source: computed, description: "= round_half_up(baseline_bushels * daily_rate * max(min_days, accrued_days)); finalized at close" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | CLOSED | DEFAULTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billed account" }
      - { name: period_start, type: string, source: input, description: "Inclusive period start date" }
      - { name: period_end, type: string, source: input, description: "Inclusive period end date" }
      - { name: lines, type: array, source: computed, description: "Computed line items: {line_type: DRYING|ENERGY|STORAGE, ref_id, description, amount_cents}; per-line amounts rounded to whole cents then summed" }
      - { name: total_cents, type: integer, source: computed, description: "= sum of rounded line amount_cents" }
      - { name: amount_due_cents, type: integer, source: computed, description: "= total_cents - applied payments (net of reversals)" }
      - { name: schedule_id, type: string, source: computed, description: "FK -> DryingChargeSchedule.id; nullable; tariff pinned at issue" }
      - { name: pinned_schedule_version, type: integer, source: input, description: "Schedule version the issuer observed; must equal schedule.version at issue" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issue; null until issued" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; invoice paid (or whose payment is reversed)" }
      - { name: amount_cents, type: integer, source: input, description: "Cash amount applied; > 0 (APPLICATION records)" }
      - { name: applied_from_prepaid_cents, type: integer, source: computed, description: "Portion drawn from Customer.prepaid_balance_cents" }
      - { name: applied_from_cash_cents, type: integer, source: computed, description: "Portion covered by cash amount_cents" }
      - { name: direction, type: enum, source: system, description: "APPLICATION | REVERSAL" }
      - { name: reversal_of_payment_id, type: string, source: system, description: "FK -> Payment.id; null on APPLICATION; set on REVERSAL records" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrainLot
    initial_state: RECEIVED
    terminal_states: [LOADED_OUT, BLENDED_OUT]
    transitions:
      - from: RECEIVED
        to: TESTED
        trigger: "POST /grain-drying/moisture-tests/{id}/certify (first certification of this lot's test)"
        actor: IntakeTechnician
        preconditions:
          - "lot.status == RECEIVED"
          - "test.status == PRELIMINARY and test.lot_id == lot.id"
        side_effects:
          - "lot.intake_moisture_pct = test.sample_moisture_pct; lot.current_moisture_pct = same; lot.certified_test_id = test.id"
          - "run provisional_shrink_estimate: set provisional_shrink_pct and provisional_dry_weight_lbs"
          - "lot.version += 1"
      - from: TESTED
        to: TESTED
        trigger: "POST /grain-drying/moisture-tests/{id}/certify (recertification via a newer PRELIMINARY test)"
        actor: IntakeTechnician
        preconditions:
          - "lot.status == TESTED"
          - "test.status == PRELIMINARY and test.lot_id == lot.id"
          - "if lot's current certified test is DISPUTED, certifier X-User-ID != that test's certified_by_user_id (ERR_RETEST_SO_DUTY_VIOLATION)"
        side_effects:
          - "prior CERTIFIED or DISPUTED test for this lot -> SUPERSEDED"
          - "lot.intake_moisture_pct / current_moisture_pct / certified_test_id updated to new test; provisional fields recomputed"
          - "lot.version += 1"
      - from: TESTED
        to: QUEUED
        trigger: "POST /grain-drying/queue-tickets/{id}/confirm"
        actor: ElevatorManager
        preconditions:
          - "lot.status == TESTED and ticket.lot_id == lot.id"
        side_effects:
          - "lot.status = QUEUED; lot.version += 1"
      - from: QUEUED
        to: DRYING
        trigger: "POST /grain-drying/dryer-runs/{id}/start"
        actor: DryerOperator
        preconditions:
          - "lot.status == QUEUED and run.lot_id == lot.id and run.status == SCHEDULED"
        side_effects:
          - "lot.status = DRYING; lot.version += 1"
      - from: DRYING
        to: DRIED
        trigger: "POST /grain-drying/dryer-runs/{id}/complete (no RESERVED StorageAgreement for this lot)"
        actor: DryerOperator
        preconditions:
          - "run.status == IN_PROGRESS and run.lot_id == lot.id"
          - "no StorageAgreement with status == RESERVED for this lot"
        side_effects:
          - "run final_weight_reconciliation: lot.final_dry_weight_lbs = run.scale_out_weight_lbs; lot.final_shrink_pct and lot.shrink_variance_lbs computed"
          - "lot.current_moisture_pct = run.discharge_moisture_pct; lot.status = DRIED; lot.version += 1"
      - from: DRYING
        to: STORED
        trigger: "POST /grain-drying/dryer-runs/{id}/complete (a RESERVED StorageAgreement exists for this lot)"
        actor: DryerOperator
        preconditions:
          - "run.status == IN_PROGRESS and run.lot_id == lot.id"
          - "exactly one StorageAgreement with status == RESERVED exists for this lot"
        side_effects:
          - "same final_weight_reconciliation as DRYING->DRIED (link 1: lot mutation)"
          - "the lot reaching DRIED-weight state activates the agreement: RESERVED -> ACTIVE, baseline_bushels and start_date set (link 2: agreement mutation caused by link 1)"
          - "agreement activation moves the lot to STORED (link 3: lot mutation caused by link 2)"
          - "lot.version += 1"
      - from: DRYING
        to: QUEUED
        trigger: "POST /grain-drying/dryer-runs/{id}/abort"
        actor: DryerOperator
        preconditions:
          - "run.status == IN_PROGRESS and run.lot_id == lot.id"
        side_effects:
          - "lot.status = QUEUED; run's ticket CONSUMED -> CONFIRMED (compensation); lot.version += 1"
      - from: DRIED
        to: DAMAGE_HOLD
        trigger: "POST /grain-drying/damage-claims"
        actor: Grower
        preconditions:
          - "lot.status == DRIED and claim.lot_id == lot.id"
          - "error mapping by lot state: LOADED_OUT | BLENDED_OUT -> ERR_CLAIM_AFTER_DELIVERY (priority 11); DAMAGE_HOLD or any pre-drying state -> ERR_INVALID_STATE (priority 6)"
        side_effects:
          - "lot.status = DAMAGE_HOLD; lot.version += 1"
      - from: DAMAGE_HOLD
        to: DRIED
        trigger: "POST /grain-drying/damage-claims/{id}/deny | /pay | /withdraw"
        actor: ClaimsAdjuster | ElevatorManager | Grower
        preconditions:
          - "claim.lot_id == lot.id and lot.status == DAMAGE_HOLD"
        side_effects:
          - "lot.status = DRIED; lot.version += 1"
      - from: DRIED
        to: STORED
        trigger: "POST /grain-drying/storage-agreements (creation when lot already DRIED)"
        actor: ElevatorManager
        preconditions:
          - "lot.status == DRIED"
          - "no StorageAgreement with status IN {RESERVED, ACTIVE} for this lot (ERR_DUPLICATE_ACTIVE_AGREEMENT)"
        side_effects:
          - "agreement created directly ACTIVE: baseline_bushels, start_date = current date, accrued 0"
          - "lot.status = STORED; lot.version += 1"
      - from: STORED
        to: DRIED
        trigger: "POST /grain-drying/storage-agreements/{id}/close"
        actor: ElevatorManager
        preconditions:
          - "agreement.lot_id == lot.id and agreement.status == ACTIVE"
        side_effects:
          - "agreement accrual finalized (min-days floor); lot.status = DRIED; lot.version += 1"
      - from: DRIED
        to: LOADED_OUT
        trigger: "POST /grain-drying/grain-lots/{id}/load-out"
        actor: IntakeTechnician
        preconditions:
          - "lot.status == DRIED"
          - "no StorageAgreement with status IN {RESERVED, ACTIVE} for this lot"
        side_effects:
          - "lot.status = LOADED_OUT; lot.version += 1"
      - from: DRIED
        to: BLENDED_OUT
        trigger: "POST /grain-drying/blend-orders/{id}/execute (lot is a source)"
        actor: ElevatorManager
        preconditions:
          - "blend order APPROVED and this lot is high_moisture_lot_id or low_moisture_lot_id"
        side_effects:
          - "lot.status = BLENDED_OUT; lot.version += 1"

  - entity: MoistureTest
    initial_state: PRELIMINARY
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: CERTIFIED
        trigger: "POST /grain-drying/moisture-tests/{id}/certify"
        actor: IntakeTechnician
        preconditions:
          - "test.status == PRELIMINARY"
          - "lot.status IN {RECEIVED, TESTED} (not terminal)"
          - "SoD: if lot's current certified test is DISPUTED, certifier != that test's certified_by_user_id"
        side_effects:
          - "test.status = CERTIFIED; certified_by_user_id = X-User-ID; certified_at = clock"
          - "lot intake/current moisture + certified_test_id + provisional fields updated (see GrainLot transitions)"
          - "any prior CERTIFIED or DISPUTED test of the same lot -> SUPERSEDED"
      - from: CERTIFIED
        to: DISPUTED
        trigger: "POST /grain-drying/moisture-tests/{id}/dispute"
        actor: Grower
        preconditions:
          - "test.status == CERTIFIED"
          - "X-User-ID == lot.current_owner_id (ownership)"
        side_effects:
          - "test.status = DISPUTED"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system (a newer test for the same lot is certified)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system (the dispute-retest is certified)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QueueTicket
    initial_state: PENDING
    terminal_states: [CANCELLED, EXPIRED]
    note: "Creation (into PENDING) requires lot.status IN {RECEIVED, TESTED} and a non-past window_date; confirmation is what requires lot.status == TESTED."
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /grain-drying/queue-tickets/{id}/confirm"
        actor: ElevatorManager
        preconditions:
          - "ticket.status == PENDING"
          - "lot.status == TESTED (ERR_INVALID_STATE)"
          - "ticket.window_date >= current date (ERR_TICKET_WINDOW_INVALID)"
          - "lot.intake_moisture_pct <= 26.0 (ERR_MOISTURE_EXCEEDS_DRYER_LIMIT)"
          - "class and total daily capacity available (ERR_CAPACITY_EXCEEDED)"
          - "customer ACTIVE and credit headroom (ERR_CUSTOMER_SUSPENDED / ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "ticket.status = CONFIRMED; lot TESTED -> QUEUED; committed capacity for (unit, window_date) += requested_bushels"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /grain-drying/queue-tickets/{id}/cancel"
        actor: Grower | ElevatorManager
        preconditions:
          - "ticket.status == PENDING"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /grain-drying/queue-tickets/{id}/cancel"
        actor: Grower | ElevatorManager
        preconditions:
          - "ticket.status == CONFIRMED"
        side_effects:
          - "committed capacity -= requested_bushels; lot QUEUED -> TESTED"
      - from: CONFIRMED
        to: PREEMPTED
        trigger: "POST /grain-drying/queue-tickets/{id}/preempt"
        actor: ElevatorManager
        preconditions:
          - "ticket.status == CONFIRMED and ticket.priority_class == STANDARD (ERR_PREEMPTION_NOT_ALLOWED)"
        side_effects:
          - "committed capacity -= requested_bushels; lot QUEUED -> TESTED; preemption_count += 1"
      - from: PREEMPTED
        to: PENDING
        trigger: "POST /grain-drying/queue-tickets/{id}/requeue"
        actor: Grower | ElevatorManager
        preconditions:
          - "ticket.status == PREEMPTED and preemption_count < 2 (ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (POST /grain-drying/_clock/set_current_utc advances the current date past window_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CONSUMED
        trigger: "system (POST /grain-drying/dryer-runs/{id}/start on a run referencing this ticket)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONSUMED
        to: CONFIRMED
        trigger: "system (POST /grain-drying/dryer-runs/{id}/abort — compensation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DryerRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /grain-drying/dryer-runs/{id}/start"
        actor: DryerOperator
        preconditions:
          - "run.status == SCHEDULED"
          - "lot.status == QUEUED (ERR_INVALID_STATE)"
          - "ticket.status == CONFIRMED and ticket.window_date == date(scheduled_start) (ERR_INVALID_STATE)"
          - "no other run on the same unit IN_PROGRESS"
        side_effects:
          - "meter_start_therms, actual_start = clock, operator_user_id = X-User-ID"
          - "ticket CONFIRMED -> CONSUMED; lot QUEUED -> DRYING"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /grain-drying/dryer-runs/{id}/complete"
        actor: DryerOperator
        preconditions:
          - "run.status == IN_PROGRESS"
          - "if not energy_estimated: meter_end_therms > meter_start_therms (ERR_METER_READING_INVALID)"
        side_effects:
          - "actual_end = clock; run energy_passthrough_charge (metered or estimated variant): fuel_therms, energy_charge_cents"
          - "lot final_weight_reconciliation and DRYING -> DRIED (or DRYING -> STORED via RESERVED agreement cascade — see GrainLot)"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /grain-drying/dryer-runs/{id}/abort"
        actor: DryerOperator
        preconditions:
          - "run.status == IN_PROGRESS"
        side_effects:
          - "ticket CONSUMED -> CONFIRMED; lot DRYING -> QUEUED (compensation pair)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /grain-drying/dryer-runs/{id}/cancel"
        actor: DryerOperator
        preconditions:
          - "run.status == SCHEDULED"
        side_effects: []

  - entity: BlendOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /grain-drying/blend-orders/{id}/approve"
        actor: ElevatorManager
        preconditions:
          - "order.status == DRAFT"
          - "approver X-User-ID != created_by_user_id (ERR_BLEND_APPROVER_CONFLICT)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /grain-drying/blend-orders/{id}/execute"
        actor: ElevatorManager
        preconditions:
          - "order.status == APPROVED"
          - "both source lots still status == DRIED (ERR_INVALID_STATE)"
          - "required_low_lot_lbs <= low lot.final_dry_weight_lbs (ERR_INSUFFICIENT_BLEND_GRAIN)"
        side_effects:
          - "both source lots DRIED -> BLENDED_OUT"
          - "mint result GrainLot: commodity/customer/owner = sources', wet_net = result_weight_lbs, current_moisture_pct = intake_moisture_pct = result_moisture_pct, status = DRIED, final_dry_weight_lbs = result_weight_lbs"
          - "order.result_lot_id, result_weight_lbs, result_moisture_pct set"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /grain-drying/blend-orders/{id}/cancel"
        actor: ElevatorManager
        preconditions:
          - "order.status == DRAFT"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /grain-drying/blend-orders/{id}/cancel"
        actor: ElevatorManager
        preconditions:
          - "order.status == APPROVED"
        side_effects: []

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [PAID, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /grain-drying/damage-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == FILED"
          - "reviewer X-User-ID != filed_by_user_id (ERR_CLAIM_SO_DUTY_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: ASSESSED
        trigger: "POST /grain-drying/damage-claims/{id}/assess"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "assessor X-User-ID != filed_by_user_id AND != dryer_run.operator_user_id (ERR_CLAIM_SO_DUTY_VIOLATION)"
          - "dryer_run.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "run claim_liability_assessment: lot_value_cents, fault_multiplier, assessed_liability_cents set"
          - "assessed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /grain-drying/damage-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "denier X-User-ID != filed_by_user_id (ERR_CLAIM_SO_DUTY_VIOLATION)"
        side_effects:
          - "lot DAMAGE_HOLD -> DRIED"
      - from: ASSESSED
        to: PAID
        trigger: "POST /grain-drying/damage-claims/{id}/pay"
        actor: ElevatorManager
        preconditions:
          - "claim.status == ASSESSED"
        side_effects:
          - "link 1 (claim transition mutates customer): Customer.prepaid_balance_cents += assessed_liability_cents"
          - "link 2 (prepaid increase auto-applies): prepaid_waterfall_application across the customer's ISSUED invoices, oldest issued_at ASC (tie: created_at ASC), until prepaid exhausted or no ISSUED invoice remains"
          - "link 3 (invoice mutation): each fully-covered invoice ISSUED -> PAID"
          - "lot DAMAGE_HOLD -> DRIED"
      - from: DENIED
        to: APPEALED
        trigger: "POST /grain-drying/damage-claims/{id}/appeal"
        actor: Grower
        preconditions:
          - "claim.status == DENIED"
          - "X-User-ID == filed_by_user_id (ownership)"
        side_effects: []
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /grain-drying/damage-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == APPEALED"
          - "reviewer X-User-ID != filed_by_user_id"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /grain-drying/damage-claims/{id}/withdraw"
        actor: Grower
        preconditions:
          - "claim.status == FILED and X-User-ID == filed_by_user_id"
        side_effects:
          - "lot DAMAGE_HOLD -> DRIED"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /grain-drying/damage-claims/{id}/withdraw"
        actor: Grower
        preconditions:
          - "claim.status == UNDER_REVIEW and X-User-ID == filed_by_user_id"
        side_effects:
          - "lot DAMAGE_HOLD -> DRIED"

  - entity: StorageAgreement
    initial_state: RESERVED
    terminal_states: [CLOSED, DEFAULTED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "system (the lot's DryerRun completes — DRYING -> STORED cascade link 2)"
        actor: system
        preconditions:
          - "agreement.lot_id == completing run's lot_id"
        side_effects:
          - "baseline_bushels = round_half_up(lot.final_dry_weight_lbs / lbs_per_bushel, 2); start_date = completion date; accrued_storage_cents = 0"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /grain-drying/storage-agreements/{id}/close"
        actor: ElevatorManager
        preconditions:
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "closed_date = current date; accrued_days and accrued_storage_cents finalized with min_days floor"
          - "lot STORED -> DRIED"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /grain-drying/storage-agreements/{id}/declare-default"
        actor: ElevatorManager
        preconditions:
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "lot.ownership = ELEVATOR_HELD; lot.current_owner_id = null; lot.version += 1 (title transfer; lot remains STORED)"
    note: "Creation sets initial state ACTIVE (not RESERVED) when lot.status == DRIED at creation; otherwise RESERVED."

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /grain-drying/invoices/{id}/issue"
        actor: ElevatorManager
        preconditions:
          - "invoice.status == DRAFT"
          - "pinned_schedule_version == current version of the schedule used at draft creation (ERR_STALE_SCHEDULE_VERSION)"
        side_effects:
          - "schedule_id + pinned_schedule_version recorded; issued_at = clock; amount_due_cents = total_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /grain-drying/invoices/{id}/void"
        actor: ElevatorManager
        preconditions:
          - "invoice.status == DRAFT"
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST /grain-drying/invoices/{id}/void"
        actor: ElevatorManager
        preconditions:
          - "invoice.status == ISSUED and amount_due_cents == total_cents (no unreversed payments; ERR_INVALID_STATE)"
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "system (amount_due_cents reaches 0 via payment application or prepaid waterfall)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: ISSUED
        trigger: "system (POST /grain-drying/payments/{id}/reverse restores amount_due_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: moisture-test-create-stale-lot
    parent_entity: GrainLot
    write_endpoint: "POST /grain-drying/moisture-tests"
    occ_field: "expected_grain_lot_version"
    description: |
      Creating a MoistureTest against a GrainLot whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created or certified a test for the same
      lot (legitimately moving the lot's governing-moisture baseline forward)
      and the current writer's view of the lot is therefore stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: invoice-payment-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /grain-drying/invoices/{invoiceId}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Posting a Payment against an Invoice whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just posted a payment (payments legitimately stack
      against the same invoice) and the current writer's view of amount_due
      and the invoice version is therefore stale.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_shrink_estimate
    trigger: "MoistureTest certification (initial and every recertification)"
    algorithm: threshold
    formula: |
      water_shrink_pct = (intake_moisture_pct - target_moisture_pct) / (100 - target_moisture_pct) * 100
      provisional_shrink_pct = water_shrink_pct + HANDLING_SHRINK_PCT
      provisional_dry_weight_lbs = round_half_up(wet_net_weight_lbs * (1 - provisional_shrink_pct / 100), 0 decimals)
    input_set: "the GrainLot being certified; uses intake_moisture_pct (new test), target_moisture_pct, wet_net_weight_lbs"
    constants:
      HANDLING_SHRINK_PCT: 0.5
    precision: "provisional_shrink_pct full precision; provisional_dry_weight_lbs integer, round_half_up"
    variants:
      - name: provisional_formula
        when: "any certification, before a DryerRun completes"
        difference: "weight derived from the shrink formula, not a scale reading"

  - name: final_weight_reconciliation
    trigger: "DryerRun completion"
    algorithm: aggregation
    formula: |
      final_dry_weight_lbs = run.scale_out_weight_lbs
      final_shrink_pct = round_half_up((wet_net_weight_lbs - final_dry_weight_lbs) / wet_net_weight_lbs * 100, 2 decimals)
      shrink_variance_lbs = provisional_dry_weight_lbs - final_dry_weight_lbs
    input_set: "the completing DryerRun (scale_out_weight_lbs) and its GrainLot"
    constants: {}
    precision: "final_shrink_pct 2 decimals round_half_up; weights integer lbs"
    variants:
      - name: certified_scale
        when: "run completion with a certified scale-out weight"
        difference: "authoritative weight from the scale; differs from provisional_formula for identical lot data, and the delta is exposed as shrink_variance_lbs"

  - name: drying_charge
    trigger: "GET charge-preview; QueueTicket confirm (credit estimate); Invoice DRAFT creation (billable line)"
    algorithm: tiered_pricing
    formula: |
      bushels = wet_net_weight_lbs / LBS_PER_BUSHEL[commodity]        # full precision, no rounding
      points_removed = max(0, intake_moisture_pct - target_moisture_pct)
      rate = rate_t1 if intake_moisture_pct <= t1_max_moisture_pct
             else rate_t2 if intake_moisture_pct <= t2_max_moisture_pct
             else rate_t3                                            # bracket edges inclusive downward
      base_cents = bushels * points_removed * rate
      surcharged_cents = base_cents * (1 + fm_surcharge_pct) if foreign_material_pct > fm_threshold_pct else base_cents
      charge_cents = max(min_charge_cents, round_half_up(surcharged_cents, 0 decimals))
    input_set: "one GrainLot with a CERTIFIED moisture test + the DryingChargeSchedule whose commodity matches and whose [effective_from, effective_to] window covers the relevant date; when no schedule window covers the date, charge-preview returns ERR_SCHEDULE_NOT_FOUND and the ticket-confirm credit estimate treats the estimate as 0"
    constants:
      LBS_PER_BUSHEL: { CORN: 56, SOYBEAN: 60, WHEAT: 60 }
    precision: "no intermediate rounding; final charge integer cents, round_half_up; minimum floor applied last"

  - name: energy_passthrough_charge
    trigger: "DryerRun completion"
    algorithm: tiered_pricing
    formula: |
      # variant metered:
      fuel_therms = meter_end_therms - meter_start_therms
      # variant estimated (energy_estimated == true):
      duration_hours = (actual_end - actual_start) / 3600
      points_removed = intake_moisture_pct - discharge_moisture_pct   # of the run's lot
      fuel_therms = duration_hours * est_therms_per_hour * (1 + est_point_factor * points_removed)   # NO intermediate rounding
      # shared tiered pricing, marginal tiers:
      charge_cents = round_half_up(min(fuel_therms, energy_t1_limit_therms) * energy_t1_rate_cents_per_therm
                     + max(0, fuel_therms - energy_t1_limit_therms) * energy_t2_rate_cents_per_therm, 0 decimals)
    input_set: "the completing DryerRun + schedule tariff constants"
    constants: {}
    precision: "fuel_therms unrounded until the final round_half_up to integer cents per run"
    variants:
      - name: metered
        when: "energy_estimated == false"
        difference: "fuel from meter delta; requires meter_end_therms > meter_start_therms"
      - name: estimated
        when: "energy_estimated == true (meter failure provision)"
        difference: "fuel from duration * burn rate * load factor; produces a different charge than metered for the same run parameters"

  - name: blend_quantities
    trigger: "BlendOrder creation (required_low_lot_lbs) and execution (result fields)"
    algorithm: constraint_propagation
    formula: |
      # Pearson square, using final_dry_weight_lbs and current_moisture_pct of each source
      q_low = high.final_dry_weight_lbs * (high.current_moisture_pct - target_moisture_pct)
              / (target_moisture_pct - low.current_moisture_pct)
      required_low_lot_lbs = ceil(q_low)                              # whole lbs, rounded UP so target is not exceeded
      result_weight_lbs = high.final_dry_weight_lbs + required_low_lot_lbs
      result_moisture_pct = round_half_up(
        (high.final_dry_weight_lbs * high.current_moisture_pct + required_low_lot_lbs * low.current_moisture_pct)
        / result_weight_lbs, 2 decimals)
    input_set: "two DRIED GrainLots, same commodity, same current_owner_id, moistures strictly bracketing target"
    constants: {}
    precision: "required_low_lot_lbs integer ceil; result_moisture_pct 2 decimals round_half_up"

  - name: claim_liability_assessment
    trigger: "DamageClaim assessment"
    algorithm: weighted_scoring
    formula: |
      bushels_final = round_half_up(lot.final_dry_weight_lbs / LBS_PER_BUSHEL[lot.commodity], 2 decimals)
      lot_value_cents = round_half_up(bushels_final * BENCHMARK_PRICE_CENTS[lot.commodity], 0 decimals)
      # multiplier ladder, evaluated in this pinned order:
      fault_multiplier = 0.25 if lot.intake_moisture_pct > PREEXISTING_MOISTURE_PCT or lot.foreign_material_pct > PREEXISTING_FM_PCT
                         else 1.5 if abs(run.discharge_moisture_pct - lot.target_moisture_pct) > OUT_OF_SPEC_TOLERANCE_PCT
                         else 1.0
      assessed_liability_cents = min(
        round_half_up(CLAIM_CAP_PCT * lot_value_cents, 0 decimals),
        round_half_up(max(0, claimed_amount_cents - CLAIM_DEDUCTIBLE_CENTS) * fault_multiplier, 0 decimals))
    input_set: "the claim, its GrainLot (final weights, intake moisture, FM, target), its DryerRun (discharge moisture)"
    constants:
      CLAIM_DEDUCTIBLE_CENTS: 2500
      CLAIM_CAP_PCT: 0.40
      PREEXISTING_MOISTURE_PCT: 26.0
      PREEXISTING_FM_PCT: 8.0
      OUT_OF_SPEC_TOLERANCE_PCT: 0.5
      BENCHMARK_PRICE_CENTS: { CORN: 450, SOYBEAN: 1050, WHEAT: 620 }
      LBS_PER_BUSHEL: { CORN: 56, SOYBEAN: 60, WHEAT: 60 }
    precision: "bushels 2 decimals round_half_up; money integer cents round_half_up; cap and adjusted claim rounded before min()"

  - name: storage_accrual
    trigger: "StorageAgreement activation (baseline), close (finalization), Invoice DRAFT creation (billing)"
    algorithm: chronological
    formula: |
      accrued_days = days in [start_date, min(closed_date, current_date))    # half-open, end-exclusive
      accrued_storage_cents = round_half_up(baseline_bushels * daily_rate_cents_per_bu * max(min_days, accrued_days), 0 decimals)
      # billed only on the first Invoice whose [period_start, period_end] covers closed_date; ACTIVE agreements are not billed
    input_set: "the StorageAgreement; baseline_bushels fixed at activation"
    constants: {}
    precision: "integer cents round_half_up at finalization"

  - name: daily_capacity_commitment
    trigger: "QueueTicket confirm / cancel / preempt / requeue; capacity-calendar read"
    algorithm: aggregation
    formula: |
      standard_committed(u, d) = sum(requested_bushels of QueueTickets with unit_id == u, window_date == d, status == CONFIRMED, priority_class == STANDARD)
      total_committed(u, d)    = sum(requested_bushels of QueueTickets with unit_id == u, window_date == d, status == CONFIRMED)
      confirm allowed iff  standard_committed + requested <= standard_class_cap_bushels   (for STANDARD tickets; <=, equality allowed)
                       and total_committed    + requested <= daily_capacity_bushels       (all classes; <=)
    input_set: "tickets with status IN {CONFIRMED, CONSUMED} hold capacity (CONSUMED still occupies its day while the run executes); PENDING/PREEMPTED/CANCELLED/EXPIRED hold none; grouped by (unit_id, window_date)"
    constants: {}
    precision: "integer bushels; equality at the cap is allowed"

  - name: invoice_composition
    trigger: "Invoice DRAFT creation (POST /grain-drying/invoices)"
    algorithm: aggregation
    formula: |
      DRYING lines: one per distinct GrainLot of the customer with >= 1 COMPLETED DryerRun whose completion date
                    falls in [period_start, period_end] (inclusive both ends); amount from drying_charge using the
                    schedule whose window covers the completion date
      ENERGY lines: one per COMPLETED DryerRun of the customer's lots completed in period; amount = run.energy_charge_cents
      STORAGE lines: one per StorageAgreement of the customer's lots whose closed_date falls in period; amount = accrued_storage_cents
      excluded: ABORTED/CANCELLED runs; runs of lots whose customer_id != invoice.customer_id
      ROUNDING ORDER (pinned): each line is rounded to integer cents at its own calculation; total_cents = sum of rounded lines.
      Never sum unrounded amounts and round once.
      creation requires >= 1 line (ERR_NO_BILLABLE_ACTIVITY)
    input_set: "customer's lots/runs/agreements filtered by state and period as above"
    constants: {}
    precision: "per-line integer cents; total is a plain integer sum"

  - name: prepaid_waterfall_application
    trigger: "Payment creation; any increase of Customer.prepaid_balance_cents (claim pay)"
    algorithm: waterfall_allocation
    formula: |
      on payment(invoice I, cash C):
        prepaid_drawn = min(customer.prepaid_balance_cents, I.amount_due_cents)
        require C <= I.amount_due_cents - prepaid_drawn   (ERR_PAYMENT_EXCEEDS_DUE)
        I.amount_due_cents -= (prepaid_drawn + C); customer.prepaid_balance_cents -= prepaid_drawn
        record applied_from_prepaid_cents = prepaid_drawn, applied_from_cash_cents = C
        if I.amount_due_cents == 0: I ISSUED -> PAID
      on prepaid increase (credit X):
        for each ISSUED invoice of the customer ordered by issued_at ASC, tie created_at ASC:
          applied = min(prepaid_balance_cents, invoice.amount_due_cents)
          invoice.amount_due_cents -= applied; prepaid_balance_cents -= applied
          if invoice.amount_due_cents == 0: invoice ISSUED -> PAID
          stop when prepaid_balance_cents == 0
      on reverse(payment P):
        P.invoice.amount_due_cents += (P.applied_from_prepaid_cents + P.applied_from_cash_cents)
        customer.prepaid_balance_cents += P.applied_from_prepaid_cents   # cash portion refunded externally
        if P.invoice.status == PAID: invoice PAID -> ISSUED
    input_set: "ISSUED invoices of one customer; payments and reversals on a single invoice"
    constants: {}
    precision: "integer cents; selector order pinned (issued_at ASC, tie created_at ASC) — never id"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Grower-scoped access: X-User-ID equals the owning customer_id (lot/ticket/claim/invoice/agreement/payment belongs to that customer)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all Grower-accessible endpoints" }
  - { priority: 4, category: existence, check: "path ids resolve left-to-right, then body FK ids (customer_id, lot_id, unit_id, queue_ticket_id, schedule ids, etc.)", error_id: ERR_CUSTOMER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_BLEND_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_PAYMENT_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "request shape: required fields present, types valid, enum values legal, gross_weight_lbs > tare_weight_lbs > 0, claimed_amount_cents > 0, amount_cents > 0, 0 < sample_moisture_pct < 60, 10.0 <= target_moisture_pct <= 20.0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "target resource in a state permitting the operation (per §1.2 from-states); terminal resources reject further transitions; lot DAMAGE_HOLD blocks load-out/ticket/blend; payment only on ISSUED invoice; close/default only on ACTIVE agreement; no second non-terminal agreement per lot", error_id: ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | ERR_LOT_ON_DAMAGE_HOLD | ERR_INVOICE_NOT_ISSUED | ERR_AGREEMENT_NOT_ACTIVE | ERR_DUPLICATE_ACTIVE_AGREEMENT, http_status: 409, applies_to: "action + create endpoints" }
  - { priority: 7, category: state, check: "OCC expected_*_version equals current parent version; invoice issue pin equals current schedule version", error_id: ERR_STALE_LOT_VERSION | ERR_STALE_INVOICE_VERSION | ERR_STALE_SCHEDULE_VERSION, http_status: 412, applies_to: "POST /grain-drying/moisture-tests, POST /grain-drying/invoices/{id}/payments (412); POST /grain-drying/invoices/{id}/issue (409)" }
  - { priority: 8, category: auth, check: "segregation of duties: claim reviewer/assessor/denier != filer; assessor also != run operator; dispute-retest certifier != disputed test's certifier; blend approver != creator", error_id: ERR_CLAIM_SO_DUTY_VIOLATION | ERR_RETEST_SO_DUTY_VIOLATION | ERR_BLEND_APPROVER_CONFLICT, http_status: 403, applies_to: "claim review/assess/deny, moisture-test certify, blend approve" }
  - { priority: 9, category: business_safety, check: "dryer safety: lot.intake_moisture_pct <= 26.0 at queue-ticket confirm and dryer-run create", error_id: ERR_MOISTURE_EXCEEDS_DRYER_LIMIT, http_status: 422, applies_to: "POST /grain-drying/queue-tickets/{id}/confirm, POST /grain-drying/dryer-runs" }
  - { priority: 10, category: business_constraint, check: "structural constraints: dryer-run window overlap incl. cooldown; charge-schedule closed-window overlap per commodity; ticket window_date not in past and requested_bushels > 0; blend sources same commodity/owner, target strictly between source moistures, required_low_lot_lbs <= available; meter_end > meter_start unless estimated; claim's run must belong to claim's lot; reversal only of an unreversed APPLICATION payment", error_id: ERR_RUN_OVERLAP | ERR_SCHEDULE_WINDOW_OVERLAP | ERR_TICKET_WINDOW_INVALID | ERR_TARGET_MOISTURE_INVALID | ERR_BLEND_COMMODITY_MISMATCH | ERR_BLEND_OWNERSHIP_MISMATCH | ERR_INSUFFICIENT_BLEND_GRAIN | ERR_METER_READING_INVALID | ERR_CLAIM_RUN_MISMATCH | ERR_PAYMENT_NOT_REVERSIBLE, http_status: 409, applies_to: "per-condition endpoints" }
  - { priority: 11, category: business_temporal, check: "capacity and time-window rules: daily class/total capacity at confirm; preemption only of CONFIRMED STANDARD tickets; claims only before load-out/blend", error_id: ERR_CAPACITY_EXCEEDED | ERR_PREEMPTION_NOT_ALLOWED | ERR_CLAIM_AFTER_DELIVERY, http_status: 422, applies_to: "ticket confirm/preempt, damage-claim create" }
  - { priority: 12, category: business_fiscal, check: "fiscal gates: customer not SUSPENDED for ticket create/confirm; credit headroom at confirm (estimated drying charge + outstanding ISSUED dues <= credit_limit); cash portion <= due after prepaid draw; invoice has >= 1 billable line", error_id: ERR_CUSTOMER_SUSPENDED | ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_EXCEEDS_DUE | ERR_NO_BILLABLE_ACTIVITY, http_status: 422, applies_to: "ticket create/confirm, payments, invoice create" }

