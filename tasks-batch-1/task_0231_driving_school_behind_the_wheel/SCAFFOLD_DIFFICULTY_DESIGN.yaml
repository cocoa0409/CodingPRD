              payload: { code: "PP_PKG1", name: "PP Pkg1", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
