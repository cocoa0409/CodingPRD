# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances. Every grounds[] ref resolves into §1.1–§1.7.
# Every literal in assert: was computed against the §1.3 formulas (see generation notes).
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: availability_reserve_view_vs_pick_view
        grounds:
          - calculations.inventory_availability
          - entities.StoreInventory.fields.on_hand
          - entities.StoreInventory.fields.reserved
          - entities.StoreInventory.fields.available
          - state_machines.OrderLine.RESERVED_to_PICKED
        distinguishing_aspect: |
          Same StoreInventory row, two algorithms: the reserve_view at SUBMIT blocks on
          available = on_hand - reserved, while the pick_view at /order-lines/{id}/pick
          checks on_hand directly — so reserving 2 units drops available to on_hand-2 but
          leaves on_hand unchanged, and the pick succeeds against on_hand even when
          available has already fallen below the picked quantity.
        test_recipe:
          setup:
            - "Store S; Product P (price 1000); StoreInventory inv(S,P) on_hand=3, reserved=0, available=3"
            - "Customer C with a DRAFT order O1 at S, one line P x2; PickupSlot far ahead"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "Prod P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 3 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /orders/${o1_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o1_id}/start-picking"
              payload: {}
              as: StorePicker
          trigger:
            - call: "GET /store-inventory/${inv_id}"
              payload: {}
              as: StoreManager
              captures: { avail_after_reserve: $.data.available, oh_after_reserve: $.data.on_hand }
            - call: "POST /order-lines/${l1_id}/pick"
              payload: { qty_picked: 2 }
              as: StorePicker
              captures: { line_status: $.data.line_status }
          assert:
            - "StoreInventory.${inv_id}.available == 1 after reserve (reserve_view: 3 - 2)"
            - "StoreInventory.${inv_id}.on_hand == 3 after reserve (reservation does not touch on_hand)"
            - "OrderLine.${l1_id}.pick succeeds (pick_view checks on_hand 3 >= 2), line_status == PICKED"
            - "StoreInventory.${inv_id}.on_hand == 1 after pick; reserved == 0; available == 1"

      - name: order_captured_full_vs_partial
        grounds:
          - calculations.order_captured_total
          - calculations.order_refunded_total
          - entities.Order.fields.captured_total_cents
          - entities.Order.fields.refunded_total_cents
          - state_machines.Order.AWAITING_PICKUP_to_COMPLETED
          - state_machines.Order.AWAITING_PICKUP_to_PARTIALLY_PICKED_UP
        distinguishing_aspect: |
          Same Order, two captured-total variants on a DIFFERENT entity domain (Order, vs
          the inventory-domain instance above): full_pickup captures all picked units so
          captured==authorized and refund==0, while partial_pickup captures only the
          handed-over units so captured<authorized and the remainder is refunded.
        test_recipe:
          setup:
            - "Order O with lines A x2 (price 1500) and C x3 (price 1000), authorized=6000, AWAITING_PICKUP, verified"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", unit_price_cents: 1500 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C", name: "Prod C", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${a_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${c_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${a_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { la_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${c_id}", qty_ordered: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${la_id}/pick"
              payload: { qty_picked: 2 }
              as: StorePicker
            - call: "POST /order-lines/${lc_id}/pick"
              payload: { qty_picked: 3 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${la_id}", qty_handed_over: 2 } ] }
              as: StoreAssociate
              captures: { fstatus: $.data.fulfillment_status, cap: $.data.captured_total_cents }
          assert:
            - "Order.${o_id}.fulfillment_status == PARTIALLY_PICKED_UP (handed 2 of 5 picked units)"
            - "Order.${o_id}.captured_total_cents == 3000 (partial_pickup: 1500*2, line C not handed)"
            - "Order.${o_id}.authorized_total_cents == 6000 (full order authorization, unchanged)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: captured_rounding_order_per_unit_then_multiply_then_sum
        grounds:
          - calculations.order_captured_total
          - entities.OrderLine.fields.qty_handed_over
          - entities.Substitution.fields.substitute_product_id
          - state_machines.Order.AWAITING_PICKUP_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: captured pins round_half_up at the
          per-unit effective price FIRST, then multiplies by qty_handed_over, then sums
          across lines (NOT sum-then-round). With a substituted line at effective price
          1800 handed over 2 units plus a normal line at 1000 handed over 3 units, the
          pinned order yields 1800*2 + 1000*3 = 6600.
        test_recipe:
          setup:
            - "Order with line A x2 substituted by B (price 1800) and line C x3 (price 1000), all picked, AWAITING_PICKUP, verified"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", unit_price_cents: 1500, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B", name: "Prod B", unit_price_cents: 1800, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C", name: "Prod C", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${a_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${b_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${c_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${a_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { la_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${c_id}", qty_ordered: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${la_id}/pick"
              payload: { qty_picked: 0 }
              as: StorePicker
            - call: "POST /substitutions"
              payload: { order_line_id: "${la_id}", substitute_product_id: "${b_id}", substitute_qty: 2 }
              as: StorePicker
              captures: { sub_id: $.data.id }
            - call: "POST /substitutions/${sub_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /order-lines/${lc_id}/pick"
              payload: { qty_picked: 3 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${la_id}", qty_handed_over: 2 }, { order_line_id: "${lc_id}", qty_handed_over: 3 } ] }
              as: StoreAssociate
              captures: { cap: $.data.captured_total_cents, fstatus: $.data.fulfillment_status }
          assert:
            - "Order.${o_id}.captured_total_cents == 6600 (1800*2 + 1000*3; per-unit round then multiply then sum)"
            - "Order.${o_id}.fulfillment_status == COMPLETED (all picked units handed over)"
            - "Order.${o_id}.refunded_total_cents == 0 (captured == authorized 3600+3000)"

      - name: authorized_then_refund_evaluation_order_with_substitution_delta
        grounds:
          - calculations.order_authorized_total
          - calculations.substitution_price_delta
          - calculations.order_refunded_total
          - entities.Order.fields.authorized_total_cents
          - state_machines.Substitution.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: refunded =
          authorized - captured, but authorized itself is first mutated by substitution
          price_delta (authorized 3000 += delta 600 = 3600) before captured (3600) is
          computed at pickup; the pinned order delta→authorized→captured→refunded yields
          refund 0, whereas computing refund before applying the delta would give a wrong
          non-zero value.
        test_recipe:
          setup:
            - "Order with single line A x2 (1500), short-picked 0, substituted by B (1800) qty 2, accepted; AWAITING_PICKUP verified"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", unit_price_cents: 1500, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B", name: "Prod B", unit_price_cents: 1800, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${a_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${b_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${a_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { la_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { auth_at_submit: $.data.authorized_total_cents }
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${la_id}/pick"
              payload: { qty_picked: 0 }
              as: StorePicker
            - call: "POST /substitutions"
              payload: { order_line_id: "${la_id}", substitute_product_id: "${b_id}", substitute_qty: 2 }
              as: StorePicker
              captures: { sub_id: $.data.id }
            - call: "POST /substitutions/${sub_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { delta: $.data.price_delta_cents }
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${la_id}", qty_handed_over: 2 } ] }
              as: StoreAssociate
              captures: { auth: $.data.authorized_total_cents, cap: $.data.captured_total_cents, ref: $.data.refunded_total_cents, fstatus: $.data.fulfillment_status }
          assert:
            - "Order.${o_id}.authorized_total_cents == 3600 (3000 at submit + 600 substitution delta)"
            - "Substitution.${sub_id}.price_delta_cents == 600 ((1800-1500)*2)"
            - "Order.${o_id}.captured_total_cents == 3600 (substitute effective price 1800 * 2)"
            - "Order.${o_id}.refunded_total_cents == 0 (refund = authorized 3600 - captured 3600)"
            - "Order.${o_id}.fulfillment_status == COMPLETED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_fulfillment_x_payment_axes
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.AWAITING_PICKUP_to_COMPLETED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Order carries two independent state axes on the same row: fulfillment_status and
          payment_status. Submitting moves fulfillment DRAFT→SUBMITTED AND payment
          UNAUTHORIZED→AUTHORIZED; a full pickup moves fulfillment →COMPLETED AND payment
          AUTHORIZED→CAPTURED — the two axes evolve on the same entity, the parallel shape.
        test_recipe:
          setup:
            - "DRAFT Order O at store S, one line P x1, slot far ahead"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "Prod P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs1: $.data.fulfillment_status, ps1: $.data.payment_status }
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${l_id}/pick"
              payload: { qty_picked: 1 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${l_id}", qty_handed_over: 1 } ] }
              as: StoreAssociate
              captures: { fs2: $.data.fulfillment_status, ps2: $.data.payment_status }
          assert:
            - "after submit: Order.${o_id}.fulfillment_status == SUBMITTED AND payment_status == AUTHORIZED"
            - "after pickup: Order.${o_id}.fulfillment_status == COMPLETED AND payment_status == CAPTURED"

      - name: orderline_substitution_cycle_propose_decline_repropose
        grounds:
          - state_machines.OrderLine.SHORT_PICKED_to_SUBSTITUTION_PROPOSED
          - state_machines.OrderLine.SUBSTITUTION_PROPOSED_to_SHORT_PICKED
          - state_machines.Substitution.PROPOSED_to_DECLINED
          - entities.OrderLine.fields.line_status
        distinguishing_aspect: |
          OrderLine is cyclic (different entity from the Order parallel instance): a
          SHORT_PICKED line moves to SUBSTITUTION_PROPOSED on proposal, returns to
          SHORT_PICKED on customer DECLINE, then can move to SUBSTITUTION_PROPOSED again on
          a fresh proposal — the line revisits SUBSTITUTION_PROPOSED, a true loop.
        test_recipe:
          setup:
            - "Order in PICKING; line A x2 short-picked to 0; products A,B,D share group BREAD"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", unit_price_cents: 1500, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B", name: "Prod B", unit_price_cents: 1800, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "D", name: "Prod D", unit_price_cents: 1600, substitution_group: "BREAD" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
