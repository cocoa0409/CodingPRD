              captures: { term_ver: $.data.version }
            - call: "POST /stormwater/outfalls/${of4_id}/retire"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          trigger:
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: {}
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: { limit: 2, offset: 2 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: { priority_tier: "HIGH", limit: 2, offset: 2 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: { status: "RETIRED" }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: { screening_status: "NOT_SCREENED", priority_tier: "MEDIUM" }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}/outfalls"
              payload: { offset: 5 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
          assert:
            - "call 1: five rows under the default limit of 10 and offset of 0, total_count 5, has_more false; retired outfalls are still listed, there being no soft-delete layer"
            - "call 2: two rows, total_count 5, has_more true"
            - "call 3: one row, total_count 3 and has_more false, the filter being applied before the page window"
            - "call 4: one row, ${of4_id}, total_count 1"
            - "call 5: one row, ${of3_id}, showing two filters combining conjunctively"
            - "call 6: zero rows, total_count 5, has_more false, an offset beyond the end being legal"
            - "every response carries response_type array and the meta envelope"

