  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_accept_requote_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[requote-decision-stale-tradein]
          - state_machines.TradeIn.REQUOTED_to_ACCEPTED
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          After a trade-in reaches REQUOTED, the client reads version V; a grading-agent /reinspect
          legitimately supersedes the prior re-quote and mints a new one, advancing the version to
          V+1 while the trade-in stays REQUOTED; a subsequent accept-requote still carrying
          expected_trade_in_version V is rejected with ERR_STALE_VERSION (412). The state precondition
          (REQUOTED) is satisfied, so OCC is the deciding check. Two strictly sequential requests.
        test_recipe:
          setup: ["Trade-in REQUOTED at 16000; version V captured; /reinspect (FAIR+BATTERY_DEGRADED -> 32000) supersedes and bumps version to V+1 while still REQUOTED; stale accept attempted with V."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "occ1@x.com", full_name: "OCC1" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
              captures: { ti_ver: $.data.version }
            - call: "POST /trade-ins/${ti_id}/reinspect"
              payload: { verified_grade: "FAIR", verified_defects: ["BATTERY_DEGRADED"], verified_powers_on: true }
              as: GradingAgent
          trigger:
            - call: "POST /trade-ins/${ti_id}/accept-requote"
              payload: { expected_trade_in_version: "${ti_ver}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "TradeIn.${ti_id}.status == REQUOTED"

      - name: occ_decline_requote_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[decline-decision-stale-tradein]
          - state_machines.TradeIn.REQUOTED_to_REJECTED
        distinguishing_aspect: |
          The happy-path counterpart: a decline-requote carrying the CURRENT expected_trade_in_version
