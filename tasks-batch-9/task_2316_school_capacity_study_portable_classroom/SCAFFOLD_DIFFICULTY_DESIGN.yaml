          entities: [InstallationSchedule, InstallationCrew, PlacementRequest]
          endpoints: ["POST /facilities/installation-schedules"]
        resource: InstallationCrew
        interval_semantics: "half-open interval [window_start, window_end); two bookings overlap when new_window_start < existing_window_end AND new_window_end > existing_window_start, so touching endpoints are not an overlap; the count of overlapping PLANNED or IN_PROGRESS schedules for the crew must stay below max_concurrent_jobs"
        distinguishing_aspect: >
          A crew limited to one concurrent job holds a set for 2027-06-15 through
          2027-06-25 on one pad. A second booking on a different pad for 2027-06-20
          through 2027-06-30 overlaps and is rejected with
          ERR_CREW_CAPACITY_EXCEEDED, while a booking for 2027-06-25 through
          2027-07-05 - starting on the exact day the first ends - is accepted
          because the interval is half-open. That is the opposite verdict from the
          pad rule for an equally touching pair of dates, which is why the two
          overlap rules cannot share an implementation. Because the pads differ,
