          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - calculations.employer_delinquency_ledger
          - entities.Employer.fields.delinquency_strikes
          - entities.Fund.fields.suspended_employer_count
        distinguishing_aspect: |
          A second depth-4 chain from a different trigger, the ops-run checkpoint: the sweep
          flips three reports to DELINQUENT (hop 1); because those reports flipped,
