            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac1}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_a1: $.data.id } }
            - { call: "POST /carding-inspections/${i_a1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac2}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_a2: $.data.id } }
            - { call: "POST /carding-inspections/${i_a2}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p1}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_p1: $.data.id } }
            - { call: "POST /carding-inspections/${i_p1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do1: $.data.id } }
            - { call: "POST /dispatch-orders/${do1}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do1}", as: CarrierOps, captures: { do1_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do1}/assignments", payload: { aircraft_id: "${ac1}", pilot_id: "${p1}", planned_start: "2026-08-05T08:00:00Z", planned_end: "2026-08-05T10:00:00Z", expected_dispatch_order_version: "${do1_v}" }, as: CarrierOps, captures: { a1: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1002", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 2 }, as: AgencyDispatcher, captures: { do2: $.data.id } }
            - { call: "POST /dispatch-orders/${do2}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do2}", as: CarrierOps, captures: { do2_v: $.data.version } }
          trigger:
            - { call: "POST /dispatch-orders/${do2}/assignments", payload: { aircraft_id: "${ac2}", pilot_id: "${p1}", planned_start: "2026-08-05T10:30:00Z", planned_end: "2026-08-05T12:00:00Z", expected_dispatch_order_version: "${do2_v}" }, as: CarrierOps, captures: { err: $.data.error_id } }
            - { call: "POST /dispatch-orders/${do2}/assignments", payload: { aircraft_id: "${ac2}", pilot_id: "${p1}", planned_start: "2026-08-05T11:00:00Z", planned_end: "2026-08-05T13:00:00Z", expected_dispatch_order_version: "${do2_v}" }, as: CarrierOps, captures: { b3: $.data.id } }
