  - section: consistency_model
    instances:

      - name: the_accept_cascade_is_readable_on_the_first_read_after_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CompensationOffer.APPROVED_to_ACCEPTED
          - state_machines.Candidate.OFFER_OUT_to_HIRED
          - endpoints[POST /lateral-hiring/offers/{offer_id}/accept]
          - calculations.guarantee_budget_ledger
          - calculations.search_fee_liability
        distinguishing_aspect: |
          The declared consistency model is IMMEDIATE, so the single accept must land its
          three-hop cascade across FOUR aggregates - offer, candidate, search firm engagement
          and practice group ledger - inside the same request. The probe reads every one of
          them once immediately afterwards and then reads the ledger a SECOND time with no
          intervening write: an eventual or queued implementation shows itself either by a
          first read that still reports the pre-accept values or by a second read that differs
          from the first. The ledger arm is the sharpest, because accept MOVES money between
          two fields (reserved -> committed) while leaving available_guarantee_budget_usd
          untouched at 4500000.00, so a half-applied cascade cannot hide behind an unchanged
          total.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup with guarantee_budget_total_usd 5000000.00."
            - "One ACTIVE SearchFirmEngagement with fee_pct 0.2500, fee_cap_usd 400000.00 and exclusivity [2026-08-01, 2026-12-01)."
            - "One Candidate in OFFER_OUT with notice_period_days 45, clearance_status CLEARED and the SLIM BOOK assessed."
            - "One APPROVED CompensationOffer (guaranteed 500000.00 + signing 50000.00) holding a live reservation of 500000.00."
            - "The logical clock stands at 2026-08-01T00:00:00.000Z and has not been moved."
