# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3010 Subscribe & Save
# Depth probe: 9 Difficulty Rules x 2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> precondition via §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plan_estimated_total_diverges_from_charged_total_after_price_move
        grounds:
          - calculations.price_at_ship_resolution
          - entities.DeliveryPlan.fields.estimated_total_cents
          - entities.DeliveryPlan.fields.charged_total_cents
        distinguishing_aspect: |
          Same plan, same lines: the estimated variant (priced at generation
          time, clock 2026-09-01) yields 1000 cents while the final variant
          (priced at lock, clock 2026-09-03, after a 1100-cent price event
          effective 2026-09-02) yields 1100 cents — the DeliveryPlan entity
          domain carries two valid price-basis algorithms with different results.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Customer C region US-WEST, preferred day 10."
            - "Product P price 1000 effective 2026-09-01T00:00:00Z, stocked 10 units in US-WEST."
            - "One subscription qty 1 start 2026-09-10; plan generated for 2026-09 (estimated_total 1000)."
            - "Price event 1100 effective 2026-09-02T00:00:00Z; clock advanced to 2026-09-03T00:00:00Z."
          setup_api_calls:
            - &d1_clock
              call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d1_cust
              call: "POST /sns/customers"
              payload: { email: "dv1@x.com", full_name: "Dv One", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { dv1_cust: $.data.id }
            - &d1_prod
              call: "POST /sns/products"
              payload: { sku: "DV-1", name: "DV Product 1", region: "US-WEST" }
              as: PlatformAdmin
              captures: { dv1_prod: $.data.id }
            - &d1_pe
              call: "POST /sns/products/${dv1_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d1_inv
              call: "POST /sns/inventory-placements"
              payload: { product_id: "${dv1_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { dv1_pl: $.data.id }
            - &d1_recv
              call: "POST /sns/inventory-placements/${dv1_pl}/receive"
              payload: { units: 10 }
              as: PlatformAdmin
            - &d1_sub
              call: "POST /sns/subscriptions"
              payload: { customer_id: "${dv1_cust}", product_id: "${dv1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${dv1_cust}"
            - &d1_gen
              call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { dv1_plan: "$.data[0].id" }
            - call: "POST /sns/products/${dv1_prod}/price-events"
              payload: { price_cents: 1100, effective_from: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/delivery-plans/${dv1_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${dv1_cust}"
              captures: { dv1_charged: $.data.charged_total_cents }
          assert:
            - "DeliveryPlan.${dv1_plan}.estimated_total_cents == 1000"
            - "DeliveryPlan.${dv1_plan}.charged_total_cents == 1100"
            - "DeliveryPlan.${dv1_plan}.gross_line_total_cents == 1100"
            - "estimated_total_cents != charged_total_cents for identical line content"

      - name: forecast_committed_vs_provisional_half_weight_paused
        grounds:
          - calculations.demand_forecast_units
          - entities.DemandForecast.fields.committed_units
          - entities.DemandForecast.fields.provisional_units
        distinguishing_aspect: |
          DemandForecast entity domain (not pricing): the committed variant sums
          ACTIVE subscriptions only (4+2=6 units) while the provisional variant
          adds floor(0.5 * 5) = 2 for the PAUSED subscription, yielding 8 — two
          valid algorithms over the same subscription set produce different units.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer, product FP region US-WEST price 500 stocked."
            - "Sub A qty 4 ACTIVE start 2026-09-10; sub B qty 2 ACTIVE start 2026-09-10; sub C qty 5 PAUSED start 2026-09-10."
            - "No generate-plans run (next_delivery_dates remain in 2026-09)."
          setup_api_calls:
            - *d1_clock
            - &d2_cust
              call: "POST /sns/customers"
              payload: { email: "dv2@x.com", full_name: "Dv Two", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { dv2_cust: $.data.id }
            - &d2_prod
              call: "POST /sns/products"
              payload: { sku: "DV-2", name: "DV Product 2", region: "US-WEST" }
              as: PlatformAdmin
              captures: { dv2_prod: $.data.id }
            - call: "POST /sns/products/${dv2_prod}/price-events"
              payload: { price_cents: 500, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${dv2_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { dv2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${dv2_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${dv2_cust}", product_id: "${dv2_prod}", cadence_months: 1, quantity: 4, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${dv2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${dv2_cust}", product_id: "${dv2_prod}", cadence_months: 1, quantity: 2, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${dv2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${dv2_cust}", product_id: "${dv2_prod}", cadence_months: 1, quantity: 5, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${dv2_cust}"
              captures: { dv2_subc: $.data.id }
            - call: "POST /sns/subscriptions/${dv2_subc}/pause"
              payload: {}
              as: Customer
              as_user_id: "${dv2_cust}"
          trigger:
            - call: "POST /sns/ops/recompute-forecasts"
              payload: { region: "US-WEST", forecast_month: "2026-09" }
              as: PlatformAdmin
              captures: { dv2_fc: "$.data[0].id" }
          assert:
            - "DemandForecast.${dv2_fc}.committed_units == 6"
            - "DemandForecast.${dv2_fc}.provisional_units == 8"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tier_discount_selects_rate_by_active_line_count
        grounds:
          - calculations.tier_discount_selection
          - calculations.line_charging_and_total
        distinguishing_aspect: |
          Mode (a): >=3 inputs (active_line_count, unit price, quantity) with
          non-linear tiered-rate selection — 5 lines at 1000 cents each select
          the 0.10 tier, charging 900 per line and 4500 total, whereas the same
          basket at 4 lines would select 0.05.
        test_recipe:
          setup:
            - "Logical clock default 2026-09-01T00:00:00Z. Customer, one product price 1000 stocked 100."
            - "Five separate ACTIVE subscriptions qty 1 each, all start 2026-09-10; plan generated for 2026-09."
          setup_api_calls:
            - *d1_clock
            - &c1_cust
              call: "POST /sns/customers"
              payload: { email: "cf1@x.com", full_name: "Cf One", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { c1_cust: $.data.id }
            - &c1_prod
              call: "POST /sns/products"
              payload: { sku: "CF-1", name: "CF Product 1", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c1_prod: $.data.id }
            - call: "POST /sns/products/${c1_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${c1_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c1_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${c1_pl}/receive"
              payload: { units: 100 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c1_cust}", product_id: "${c1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c1_cust}", product_id: "${c1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c1_cust}", product_id: "${c1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c1_cust}", product_id: "${c1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c1_cust}", product_id: "${c1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c1_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { c1_plan: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${c1_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${c1_cust}"
          assert:
            - "DeliveryPlan.${c1_plan}.active_line_count == 5"
            - "DeliveryPlan.${c1_plan}.tier_discount_pct == 0.10"
            - "DeliveryPlan.${c1_plan}.gross_line_total_cents == 4500"
            - "DeliveryPlan.${c1_plan}.charged_total_cents == 4500"
            - "every non-bonus PlanLine of plan ${c1_plan} has line_charged_cents == 900"

      - name: per_line_rounding_then_sum_beats_sum_then_round
        grounds:
          - calculations.line_charging_and_total
        distinguishing_aspect: |
          Mode (b): pinned rounding order — three lines at 333 cents with the 5%
          tier round per line to 316 each and sum to 948, while the forbidden
          sum-then-round order would yield round(999 * 0.95) = 949; the one-cent
          delta proves the pinned order.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product CP price 333 stocked 100."
            - "Three ACTIVE subscriptions qty 1 each start 2026-09-10; plan generated for 2026-09."
          setup_api_calls:
            - *d1_clock
            - &c2_cust
              call: "POST /sns/customers"
              payload: { email: "cf2@x.com", full_name: "Cf Two", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { c2_cust: $.data.id }
            - &c2_prod
              call: "POST /sns/products"
              payload: { sku: "CF-2", name: "CF Product 2", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c2_prod: $.data.id }
            - call: "POST /sns/products/${c2_prod}/price-events"
              payload: { price_cents: 333, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${c2_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${c2_pl}/receive"
              payload: { units: 100 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c2_cust}", product_id: "${c2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c2_cust}", product_id: "${c2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c2_cust}", product_id: "${c2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c2_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { c2_plan: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${c2_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${c2_cust}"
          assert:
            - "DeliveryPlan.${c2_plan}.tier_discount_pct == 0.05"
            - "every non-bonus PlanLine of plan ${c2_plan} has line_charged_cents == 316"
            - "DeliveryPlan.${c2_plan}.gross_line_total_cents == 948"
            - "DeliveryPlan.${c2_plan}.charged_total_cents == 948"

      - name: cap_skip_drops_tier_and_reprices_surviving_lines
        grounds:
          - calculations.lock_evaluation_pipeline
          - calculations.tier_discount_selection
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency is resolved by the pinned
          order — the cap check uses the PRE-TIER price (1200 > cap 1050 skips
          the line even though the 10%-tier price would be 1080 > cap too), the
          skip drops the count 5 -> 4, the tier falls 0.10 -> 0.05, and the four
          surviving lines reprice from 900 to 950 each, total 3800.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product CP3 price 1000 stocked 100."
            - "Five subscriptions qty 1 start 2026-09-10; exactly one carries price_cap_cents 1050."
            - "Plan generated for 2026-09; price event 1200 effective 2026-09-02; clock at 2026-09-03."
          setup_api_calls:
            - *d1_clock
            - &c3_cust
              call: "POST /sns/customers"
              payload: { email: "cf3@x.com", full_name: "Cf Three", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { c3_cust: $.data.id }
            - &c3_prod
              call: "POST /sns/products"
              payload: { sku: "CF-3", name: "CF Product 3", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c3_prod: $.data.id }
            - call: "POST /sns/products/${c3_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${c3_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { c3_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${c3_pl}/receive"
              payload: { units: 100 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c3_cust}", product_id: "${c3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10", price_cap_cents: 1050 }
              as: Customer
              as_user_id: "${c3_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c3_cust}", product_id: "${c3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c3_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c3_cust}", product_id: "${c3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c3_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c3_cust}", product_id: "${c3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c3_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${c3_cust}", product_id: "${c3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${c3_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { c3_plan: "$.data[0].id" }
            - call: "POST /sns/products/${c3_prod}/price-events"
              payload: { price_cents: 1200, effective_from: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/delivery-plans/${c3_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${c3_cust}"
          assert:
            - "exactly one PlanLine of plan ${c3_plan} has line_status == AUTO_SKIPPED and skip_reason == PRICE_CAP"
            - "DeliveryPlan.${c3_plan}.active_line_count == 4"
            - "DeliveryPlan.${c3_plan}.tier_discount_pct == 0.05"
            - "DeliveryPlan.${c3_plan}.gross_line_total_cents == 3800"
            - "DeliveryPlan.${c3_plan}.charged_total_cents == 3800"
            - "a Notification of type PRICE_CAP_SKIP exists for customer ${c3_cust}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_cancel_offer_accept_cycle_returns_to_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_PENDING_CANCEL
          - state_machines.Subscription.PENDING_CANCEL_to_ACTIVE
          - state_machines.RetentionOffer
        distinguishing_aspect: |
          Subscription machine is cyclic: ACTIVE -> PENDING_CANCEL -> ACTIVE via
          offer acceptance (not a one-way pipeline); after the cycle the
          subscription can pause again, proving the loop is re-entrant.
        test_recipe:
          setup:
            - "Logical clock default. Customer credit_balance 0; stocked product price 1000; one ACTIVE subscription."
          setup_api_calls:
            - *d1_clock
            - &n1_cust
              call: "POST /sns/customers"
              payload: { email: "nl1@x.com", full_name: "Nl One", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { n1_cust: $.data.id }
            - &n1_prod
              call: "POST /sns/products"
              payload: { sku: "NL-1", name: "NL Product 1", region: "US-WEST" }
              as: PlatformAdmin
              captures: { n1_prod: $.data.id }
            - call: "POST /sns/products/${n1_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${n1_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { n1_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${n1_pl}/receive"
              payload: { units: 10 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${n1_cust}", product_id: "${n1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${n1_cust}"
              captures: { n1_sub: $.data.id }
            - call: "POST /sns/subscriptions/${n1_sub}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${n1_cust}"
            - call: "GET /sns/subscriptions/${n1_sub}/retention-offers"
              payload: {}
              as: Customer
              as_user_id: "${n1_cust}"
              captures: { n1_offer: "$.data[0].id" }
          trigger:
            - call: "POST /sns/retention-offers/${n1_offer}/accept"
              payload: {}
              as: Customer
              as_user_id: "${n1_cust}"
            - call: "POST /sns/subscriptions/${n1_sub}/pause"
              payload: {}
              as: Customer
              as_user_id: "${n1_cust}"
          assert:
            - "RetentionOffer.${n1_offer}.offer_status == ACCEPTED"
            - "Customer.${n1_cust}.credit_balance_cents == 500"
            - "after accept, Subscription.${n1_sub}.status == ACTIVE (cycle closed)"
            - "the subsequent pause succeeds, so Subscription.${n1_sub}.status == PAUSED at the end"

      - name: planline_skip_unskip_cycle_restores_tier
        grounds:
          - state_machines.PlanLine.SCHEDULED_to_SKIPPED
          - state_machines.PlanLine.SKIPPED_to_SCHEDULED
        distinguishing_aspect: |
          PlanLine machine is cyclic: SCHEDULED -> SKIPPED -> SCHEDULED on the
          same line, with the plan tier falling 0.05 -> 0.00 on skip and
          returning to 0.05 on unskip — a different entity than Subscription.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product price 1000 stocked; three subscriptions qty 1; plan generated (3 lines, tier 0.05 estimated)."
          setup_api_calls:
            - *d1_clock
            - &n2_cust
              call: "POST /sns/customers"
              payload: { email: "nl2@x.com", full_name: "Nl Two", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { n2_cust: $.data.id }
            - &n2_prod
              call: "POST /sns/products"
              payload: { sku: "NL-2", name: "NL Product 2", region: "US-WEST" }
              as: PlatformAdmin
              captures: { n2_prod: $.data.id }
            - call: "POST /sns/products/${n2_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${n2_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { n2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${n2_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${n2_cust}", product_id: "${n2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${n2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${n2_cust}", product_id: "${n2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${n2_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${n2_cust}", product_id: "${n2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${n2_cust}"
            - call: "POST /sns/ops/generate-plans"
