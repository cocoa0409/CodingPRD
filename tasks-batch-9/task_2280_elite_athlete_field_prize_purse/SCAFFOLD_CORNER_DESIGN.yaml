              as: ElitesDirector
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T09:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${inv_id}", gun_seconds: 7400, net_seconds: 7398 }
              as: TechnicalOfficial
              captures: { res_id: "$.data.id" }
            - call: POST /race-results/${res_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { ed_v: "$.data.version" }
          trigger:
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v0}" }
              as: FinanceOfficer
              captures: { err1: "$.data.error_id" }
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}" }
              as: FinanceOfficer
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v}" }
              as: FinanceOfficer
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v}" }
              as: FinanceOfficer
              captures: { err2: "$.data.error_id" }
            - call: GET /race-editions/${ed_id}
              as: FinanceOfficer
              captures: { ed_v2: "$.data.version" }
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v2}" }
              as: FinanceOfficer
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}", status: COMPUTED }
              as: FinanceOfficer
          assert:
            - "trigger call 1 returns HTTP 412 with error_id == ERR_STALE_EDITION_VERSION — the version captured on the edition create response predates open-field, lock-field, mark-raced and certify-results"
            - "trigger call 2 returns total_count == 0 — the refused run computed nothing"
            - "trigger call 3 returns HTTP 200 with purse_allocated_cents == 1000000, purse_unallocated_cents == 7000000 and version == the captured value + 1"
            - "trigger call 4 returns HTTP 412 with error_id == ERR_STALE_EDITION_VERSION — the accepted value is consumed by its own write"
            - "trigger call 6 returns HTTP 200 and re-runs the computation with the refreshed version, voiding the prior award set and recomputing an identical 1,000,000 allocation"
            - "trigger call 7 returns total_count == 1 — exactly one live COMPUTED award survives the recompute, the earlier one being VOID"

      - name: corner_layer_pagination_with_filtering_on_doping_tests
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /doping-tests]
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          Filtering and paging must compose rather than fight: total_count reflects the filtered set
          and not the table, has_more flips only on the last page, an offset past the end returns an
          empty page with the filtered total intact, and a status change under a stable filter moves a
          row between two filtered views without disturbing the offsets of the others.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition and two athletes; athlete A has three OUT_OF_COMPETITION tests scheduled more than seven days apart (Sep 5, Sep 20, Oct 5) and athlete B has one (Sep 6). All four are SCHEDULED and were created in that order."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Pagination Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "Page Alpha", country_code: USA, gender: MALE, birth_date: "1997-10-01", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Page Beta", country_code: USA, gender: MALE, birth_date: "1997-10-02", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: POST /doping-tests
              payload: { athlete_id: "${athA_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-09-05T08:00:00Z", window_end_at: "2026-09-05T18:00:00Z", sample_code: "S-PG-A1" }
              as: AntiDopingLiaison
              captures: { t1_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: AntiDopingLiaison
            - call: POST /doping-tests
              payload: { athlete_id: "${athA_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-09-20T08:00:00Z", window_end_at: "2026-09-20T18:00:00Z", sample_code: "S-PG-A2" }
              as: AntiDopingLiaison
              captures: { t2_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:02Z" }
              as: AntiDopingLiaison
            - call: POST /doping-tests
              payload: { athlete_id: "${athA_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-10-05T08:00:00Z", window_end_at: "2026-10-05T18:00:00Z", sample_code: "S-PG-A3" }
              as: AntiDopingLiaison
              captures: { t3_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:03Z" }
              as: AntiDopingLiaison
            - call: POST /doping-tests
              payload: { athlete_id: "${athB_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-09-06T08:00:00Z", window_end_at: "2026-09-06T18:00:00Z", sample_code: "S-PG-B1" }
              as: AntiDopingLiaison
              captures: { t4_id: "$.data.id" }
          trigger:
            - call: GET /doping-tests
              payload: { race_edition_id: "${ed_id}" }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", limit: 2, offset: 0 }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", limit: 2, offset: 2 }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", limit: 2, offset: 99 }
              as: AntiDopingLiaison
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: AntiDopingLiaison
            - call: POST /doping-tests/${t1_id}/collect
              payload: { collected_sample_ref: "COC-PG-A1" }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", status: SCHEDULED, limit: 2, offset: 0 }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", status: COLLECTED }
              as: AntiDopingLiaison
            - call: GET /doping-tests
              payload: { athlete_id: "${athA_id}", status: SCHEDULED, test_type: IN_COMPETITION }
              as: AntiDopingLiaison
          assert:
            - "trigger call 1 returns total_count == 4 with limit == 10, offset == 0 and has_more == false — the declared defaults apply when the client sends neither"
            - "trigger call 2 returns exactly 2 rows with total_count == 3 and has_more == true; data[0].id == the Sep 5 test and data[1].id == the Sep 20 test (creation order, created_at ascending)"
            - "trigger call 3 returns exactly 1 row with total_count == 3 and has_more == false; data[0].id == the Oct 5 test — the filtered total is unchanged by the page window"
            - "trigger call 4 returns 0 rows with total_count == 3 and has_more == false — an offset beyond the end is an empty page, not an error"
            - "trigger call 7 returns total_count == 2 with data[0].id == the Sep 20 test — collecting the Sep 5 sample removed it from the SCHEDULED view without shifting the remaining pair out of order"
            - "trigger call 8 returns total_count == 1 with data[0].id == the Sep 5 test and status == COLLECTED — the row moved between filtered views, it did not disappear"
            - "trigger call 9 returns total_count == 0 — the two filters intersect (AND), they do not union"

      - name: corner_layer_cascading_side_effects_end_to_end_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / adverse_finding_four_hop_clawback_and_breach_cascade
          rationale: "That §1.8 instance walks the four-hop adverse-finding chain end to end and asserts every intermediate hop plus the recomputed ledger."

      - name: corner_layer_dual_variant_calculation_both_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_withholding_per_award_vs_aggregated
          rationale: "That §1.8 instance asserts both withholding variants on identical award data and the 15,000-cent delta between them."

      - name: corner_layer_derived_field_reconciliation_after_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - calculations.purse_and_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_appearance_budget_invariant_across_withdraw_and_reissue
          rationale: "That §1.8 instance asserts the derived appearance ledger after create, after withdrawal of the source row and after a reissue, returning to the original figure."

  # ===========================================================================
  # From Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_consistency_immediate_every_derived_field_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.purse_and_budget_ledger
        distinguishing_aspect: >-
          The consistency model is immediate, so no derived value is ever allowed to lag a request:
          the offer response already carries its valuations and deadline, the accept response already
          carries the commitment, the edition read immediately afterwards already carries the ledger,
          and a withdrawal in the very next call is already reflected — every figure matches between
          the write's own body and the subsequent read with no intermediate step.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with appearance_budget_cents 9,000,000 and one DRAFT invitation for a VERIFIED ELITE MALE athlete."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Immediate Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0, offer_response_days: 10 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Immediate Reps", license_code: "AGT-IM-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Instant Ida", country_code: ETH, gender: MALE, birth_date: "1997-11-01", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual IM", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-IM-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 1500000, air_class: BUSINESS, hotel_nights: 4, ground_transport: true }
              as: ElitesDirector
            - call: GET /invitations/${inv_id}
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/assign-bib
              as: ElitesDirector
            - call: GET /invitations
              payload: { race_edition_id: "${ed_id}", status: ACCEPTED }
              as: FinanceOfficer
            - call: POST /invitations/${inv_id}/withdraw
              payload: { reason: "injury" }
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "trigger call 1's own body already carries guaranteed_commitment_cents == 1958000 (1,500,000 + 300,000 BUSINESS + 128,000 for 4 nights + 30,000 ground), full_exposure_cents == 4458000, round_count == 0 and response_deadline_at == \"2026-08-11T00:00:00.000Z\" (10 offer_response_days on the logical clock)"
            - "trigger call 2 returns byte-identical values to trigger call 1's body — nothing was recomputed or backfilled between the two requests"
            - "trigger call 3's own body already reports status == ACCEPTED with the same 1,958,000 commitment"
            - "trigger call 4 already reports appearance_committed_cents == 1958000 and appearance_uncommitted_cents == 7042000 — the parent ledger is current in the read immediately after the child write, with no sweep in between"
            - "trigger call 5's own body already carries bib_number == 11"
            - "trigger call 6 returns total_count == 1 with data[0].bib_number == 11 — the list view agrees with the write's body"
            - "trigger call 7's own body reports status == WITHDRAWN with bib_number == null and guaranteed_commitment_cents == 0"
            - "trigger call 8 reports appearance_committed_cents == 0 and appearance_uncommitted_cents == 9000000 — the reversal is visible immediately, not eventually"
