      - name: close_date_outside_tsa_window_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_CLOSE_DATE_OUTSIDE_TSA]
        distinguishing_aspect: "sign-spa requires expected_close_date within [tsa_start_date, tsa_end_date]; a close date before the TSA start fails ERR_CLOSE_DATE_OUTSIDE_TSA and no TSA is created."
        test_recipe:
          setup: ["Non-core brand B with divestiture PROPOSED (expected_close 2026-10-01)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA12", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 75000, tsa_start_date: "2026-11-01T00:00:00Z", tsa_end_date: "2027-11-01T00:00:00Z" }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
