              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /candidate-sites/${sb_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "AIR_COOLED", annual_water_demand_mgal: 0 }
