        claim_type: violation_to_error
        grounds: ["entities.SafetyEvent.fields.kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "HOS_VIOLATION is system-created only: manual creation -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["driver exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
