        distinguishing_aspect: "Requests without X-User-ID/X-User-Role headers fail ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /f2s/farms", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: err_period_outside_year_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERIOD_OUTSIDE_YEAR]
        distinguishing_aspect: "Claim period 2025-01 does not overlap a 2026-07-01..2027-06-24 year -> ERR_PERIOD_OUTSIDE_YEAR."
        test_recipe:
          setup: ["OPEN year"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
