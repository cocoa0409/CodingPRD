      - name: seal_is_refused_until_the_evaluation_is_rebuilt_on_the_new_ledger_total
        claim_type: cascading_validation
        grounds:
          - validations[priority=23]
          - validations[priority=21]
          - errors.ERR_EVALUATION_REFERENCE_STALE
          - calculations.project_demand_ledger
          - entities.WaterSupplyEvaluation.fields.design_demand_gpm
          - entities.WaterSupplyEvaluation.fields.pinned_calculation_iteration_count
        distinguishing_aspect: |
          The reconciliation check consumes the OUTPUT of the ledger recomputation, so adding a 100.0
          gpm hose station after the evaluation was written silently invalidates the seal: the pinned
          design_demand_gpm 2130.0 no longer equals total_system_demand_gpm 2230.0 and the seal is 409
          even though the iteration count and the required pressure still agree and the margin is still
          positive. A fresh evaluation on the same flow test - 64.26 psi available, margin 8.72, verdict
          MARGINAL - reconciles on all three legs and the seal lands.
