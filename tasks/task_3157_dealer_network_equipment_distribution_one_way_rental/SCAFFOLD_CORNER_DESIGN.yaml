              as: NetworkAdmin
              captures: { task_2: $.data.id }
            - call: "POST /rental-network/reposition-tasks/${task_1}/assign"
              payload: { assigned_driver_id: "drv-1" }
              as: NetworkAdmin
            - call: "POST /rental-network/reposition-tasks/${task_2}/assign"
              payload: { assigned_driver_id: "drv-2" }
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
