            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 10.01, drive_minutes: 20, overnight: false }, as: OperationsDirector, captures: { leg1: $.data.id, leg1_stip: $.data.stipend_cents } }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Hospital A", destination_name: "Depot", distance_miles: 10.01, drive_minutes: 20, overnight: false }, as: OperationsDirector, captures: { leg2: $.data.id, leg2_stip: $.data.stipend_cents } }
          trigger:
            - { call: "GET /api/route-plans/${plan}", payload: {}, as: OperationsDirector, captures: { plan_stip: $.data.total_travel_stipend_cents } }
          assert:
            - "TransportLeg[${leg1}].stipend_cents == 671 (round_half_up(10.01*67)=round_half_up(670.67))"
            - "TransportLeg[${leg2}].stipend_cents == 671"
            - "RoutePlan[${plan}].total_travel_stipend_cents == 1342 (per-leg-then-sum); sum-then-round would give 1341 and is non-conformant"
            - "${leg1_stip} == 671 and ${leg2_stip} == 671 and ${plan_stip} == 1342"

