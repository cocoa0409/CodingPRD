              as: ComplianceOfficer
              captures: { st2: $.data.status, round2: $.data.revision_round, v2: $.data.version }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture2: $.data.site_posture }
          assert:
            - "${st1} == APPROVED, ${round1} == 1 and ${posture1} == OPEN after the first approval"
