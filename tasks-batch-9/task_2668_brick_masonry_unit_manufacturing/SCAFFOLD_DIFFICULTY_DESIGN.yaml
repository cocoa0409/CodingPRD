        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - endpoints["POST /blends/{id}/certify"]
        distinguishing_aspect: |
          The pair is priority 19 (category state, ERR_BLEND_NOT_COMPOSED, 409) against
          priority 22 (category business_safety, ERR_PANEL_NOT_APPROVED, 422) - a
          three-step gap on ONE endpoint, both rules reading the ShippedBlend aggregate, where the winner is the state check. The test
          then satisfies 19 and re-fires the same call to prove 22 was genuinely
          violated all along and merely masked. The other instance in this rule pairs
          business_referential against business_fiscal with a seventeen-step gap on a
          different endpoint.
