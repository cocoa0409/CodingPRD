# =============================================================================
# Coding Bootcamp & ISA — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Coding Bootcamp & ISA: cohort/admission, income share agreement (percent/cap/term/threshold),
  deferment (unemployment/income floor), payment collection, CIRR job-placement reporting,
  refund, scholarship/deposit, attendance/progress

domain_name: coding-bootcamp-isa
api_prefix: ""

# Complexity profile (Expert band, §0.4) ---------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation       # ISA payment ledger: forward-looking projected payoff vs chronological actual accumulation
  secondary_archetype: compliance_audit           # CIRR job-placement reporting under regulated definitions; deferment eligibility
  complexity_layers:
    - dual_variant_calculation                    # ISA payoff projection vs chronological settlement; CIRR rate denominators
    - rate_threshold_triggers                     # income floor gates each monthly payment obligation
    - cascading_side_effects                      # income report -> payment -> ISA ledger -> enrollment derived status
    - derived_field_reconciliation                # ISA amount_paid_cents / remaining_cap_cents kept consistent with Payment ledger
    - optimistic_concurrency                      # scholarship application supersede on Enrollment.version

  entity_topology: flat                           # peer top-level collections linked by FKs (no nested URL ownership)
  state_machine_shape: cyclic                     # ISAContract ACTIVE<->DEFERRED loop; Enrollment branch; Payment branch
  relationship_patterns:
    - one_to_many                                 # Cohort 1:N Enrollment; ISAContract 1:N Payment
    - cross_aggregate                             # Payment obligation reads ISAContract + IncomeReport across aggregates
  role_model: peer_roles                          # AdmissionsOfficer / ServicingOfficer / ComplianceOfficer / Student own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cohort
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Cohort name, e.g. 'Full-Stack 2026-Spring'" }
      - { name: track, type: enum, source: input, description: "FULLSTACK | DATA | CYBER" }
      - { name: capacity, type: integer, source: input, description: "Max admitted seats", constraints: ">= 1" }
      - { name: tuition_sticker_cents, type: integer, source: input, description: "Sticker tuition in cents", constraints: ">= 0" }
      - { name: start_date, type: datetime, source: input, description: "ISO date the cohort begins instruction" }
      - { name: end_date, type: datetime, source: input, description: "ISO date the cohort ends; must be after start_date" }
      - { name: cirr_period_label, type: string, source: input, description: "CIRR reporting period label, e.g. 'H1-2026'" }
      - { name: status, type: enum, source: system, description: "PLANNING -> OPEN -> RUNNING -> GRADUATED -> ARCHIVED", default: "PLANNING", constraints: "PLANNING | OPEN | RUNNING | GRADUATED | ARCHIVED" }
      - { name: seats_committed, type: integer, source: computed, description: "Count of Enrollment rows for this cohort whose status IN {ENROLLED, ACTIVE, GRADUATED}" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - seats_committed; invariant seats_committed + seats_available == capacity" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort the applicant applies to" }
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: email, type: string, source: input, description: "Applicant email; unique per cohort" }
      - { name: reported_prior_income_cents, type: integer, source: input, description: "Self-reported annual income at application in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "APPLIED -> ADMITTED -> ENROLLED | REJECTED | WITHDRAWN_APP", default: "APPLIED", constraints: "APPLIED | ADMITTED | REJECTED | ENROLLED | WITHDRAWN_APP" }
      - { name: admitted_at, type: datetime, source: system, required: false, description: "Timestamp of admission decision" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the admitted applicant enrolling" }
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id; copied from the applicant at enrollment" }
      - { name: financing_choice, type: enum, source: input, description: "ISA | UPFRONT; ISA opens an ISAContract, UPFRONT does not", constraints: "ISA | UPFRONT" }
      - { name: status, type: enum, source: system, description: "ENROLLED -> ACTIVE -> {GRADUATED | DISMISSED | WITHDRAWN}", default: "ENROLLED", constraints: "ENROLLED | ACTIVE | GRADUATED | DISMISSED | WITHDRAWN" }
      - { name: attendance_pct, type: number, source: computed, description: "100 * present_sessions / total_recorded_sessions over AttendanceRecord rows; 0 when none recorded" }
      - { name: progress_pct, type: number, source: computed, description: "Latest AttendanceRecord.cumulative_progress_pct by created_at; 0 when none recorded" }
      - { name: enrolled_at, type: datetime, source: system, description: "Timestamp the enrollment was created (refund cooling-off anchor)" }
      - { name: isa_status, type: enum, source: computed, required: false, description: "Mirror of the linked ISAContract.status; null when financing_choice=UPFRONT" }

  - name: ISAContract
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the financed enrollment (1:1)" }
      - { name: income_share_pct, type: number, source: input, description: "Fraction of monthly income owed, e.g. 0.17", constraints: "0 < x <= 0.5" }
      - { name: cap_cents, type: integer, source: input, description: "Total payment cap in cents (payment ceiling)", constraints: ">= 0" }
      - { name: term_months, type: integer, source: input, description: "Max number of monthly payments owed", constraints: ">= 1" }
      - { name: income_threshold_cents, type: integer, source: input, description: "Monthly income floor; at/below it no payment is owed", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE <-> DEFERRED ; ACTIVE -> {COMPLETED | SETTLED_TERM} ; PENDING -> VOIDED", default: "PENDING", constraints: "PENDING | ACTIVE | DEFERRED | COMPLETED | SETTLED_TERM | VOIDED" }
      - { name: payments_made_count, type: integer, source: computed, description: "Count of Payment rows for this contract with status=SETTLED" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for Payment rows with status=SETTLED" }
      - { name: remaining_cap_cents, type: integer, source: computed, description: "cap_cents - amount_paid_cents; invariant amount_paid_cents + remaining_cap_cents == cap_cents" }
      - { name: projected_payoff_cents, type: integer, source: computed, description: "Forward-looking projected total payoff (see calc isa_payoff_projection); differs from amount_paid_cents" }

  - name: Scholarship
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment receiving the award" }
      - { name: kind, type: enum, source: input, description: "DEI | MERIT | NEED; affects cap-reduction percent", constraints: "DEI | MERIT | NEED" }
      - { name: cap_reduction_pct, type: number, source: input, description: "Fraction the ISA cap is reduced by, e.g. 0.20", constraints: "0 < x <= 1" }
      - { name: status, type: enum, source: system, description: "APPLIED -> SUPERSEDED (when a newer scholarship replaces it)", default: "APPLIED", constraints: "APPLIED | SUPERSEDED" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; deposit holder enrollment (1:1)" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "HELD -> {REFUNDED | FORFEITED} via the refund/withdraw/dismiss cascades", default: "HELD", constraints: "HELD | REFUNDED | FORFEITED" }
      - { name: refunded_amount_cents, type: integer, source: computed, required: false, description: "Amount returned on refund; 0 until refund/forfeit resolves" }

  - name: IncomeReport
    parent: null
    common_fields: true
    fields:
      - { name: isa_contract_id, type: string, source: input, description: "FK -> ISAContract.id; the contract this income covers" }
      - { name: period_start, type: datetime, source: input, description: "First day of the monthly period (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "First day of the NEXT month (exclusive); half-open [period_start, period_end)" }
      - { name: gross_income_cents, type: integer, source: input, description: "Verified monthly gross income in cents", constraints: ">= 0" }
      - { name: employment_status, type: enum, source: input, description: "EMPLOYED | UNEMPLOYED | UNDEREMPLOYED", constraints: "EMPLOYED | UNEMPLOYED | UNDEREMPLOYED" }
      - { name: obligation_cents, type: integer, source: computed, description: "Payment owed for this period (see calc monthly_payment_amount); 0 when income <= threshold or deferred" }
      - { name: payment_id, type: string, source: computed, required: false, description: "Id of the Payment row this report generated (back-pointer; Payment.income_report_id is the canonical FK); null when obligation_cents == 0" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: isa_contract_id, type: string, source: input, description: "FK -> ISAContract.id; the contract being paid down" }
      - { name: income_report_id, type: string, source: input, description: "FK -> IncomeReport.id; the report that generated this payment" }
      - { name: amount_cents, type: integer, source: system, description: "Charged amount in cents = the report's obligation_cents at creation" }
      - { name: collection_status, type: enum, source: system, description: "PENDING -> {SETTLED | FAILED}; FAILED -> PENDING on retry", default: "PENDING", constraints: "PENDING | SETTLED | FAILED" }
      - { name: refund_status, type: enum, source: system, description: "NONE -> REFUNDED (independent dimension on a SETTLED payment)", default: "NONE", constraints: "NONE | REFUNDED" }
      - { name: status, type: enum, source: computed, description: "Rollup view: PENDING|FAILED|SETTLED from collection_status unless refund_status=REFUNDED then REVERSED", constraints: "PENDING | FAILED | SETTLED | REVERSED" }

  - name: DefermentRequest
    parent: null
    common_fields: true
    fields:
      - { name: isa_contract_id, type: string, source: input, description: "FK -> ISAContract.id; the contract to pause" }
      - { name: reason, type: enum, source: input, description: "UNEMPLOYMENT | INCOME_FLOOR", constraints: "UNEMPLOYMENT | INCOME_FLOOR" }
      - { name: period_start, type: datetime, source: input, description: "First day deferment takes effect (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Last day deferment covers (inclusive); closed interval [start, end]" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> {APPROVED | DENIED} ; APPROVED -> ENDED", default: "REQUESTED", constraints: "REQUESTED | APPROVED | DENIED | ENDED" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the withdrawing enrollment" }
      - { name: reason, type: enum, source: input, description: "COOLING_OFF | WITHDRAWAL | DISMISSAL_APPEAL", constraints: "COOLING_OFF | WITHDRAWAL | DISMISSAL_APPEAL" }
      - { name: requested_at, type: datetime, source: system, description: "Timestamp of refund request (drives cooling-off boundary)" }
      - { name: gross_refund_cents, type: integer, source: computed, description: "Pre-fee refund (deposit portion + tuition proration), see calc refund_amount" }
      - { name: net_refund_cents, type: integer, source: computed, description: "gross_refund_cents minus admin fee, see calc refund_amount" }
      - { name: status, type: enum, source: system, description: "PENDING -> {APPROVED | REJECTED}", default: "PENDING", constraints: "PENDING | APPROVED | REJECTED" }

  - name: PlacementOutcome
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the graduate this outcome describes (1:1)" }
      - { name: category, type: enum, source: input, description: "CIRR placement category", constraints: "EMPLOYED_IN_FIELD | EMPLOYED_OUT_OF_FIELD | SELF_EMPLOYED | CONTINUED_EDUCATION | STILL_SEEKING | OUT_OF_PROGRAM" }
      - { name: annual_salary_cents, type: integer, source: input, required: false, description: "Reported starting salary in cents; required for in-field/out-of-field placements", constraints: ">= 0" }
      - { name: placement_days, type: integer, source: input, required: false, description: "Days from graduation to placement; for the 180-day CIRR window check" }
      - { name: reported_at, type: datetime, source: input, description: "Date the outcome was reported relative to graduation" }
      - { name: cirr_eligible, type: boolean, source: computed, description: "True when category is a CIRR-countable placement reported within 180 days" }

  - name: AttendanceRecord
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment the session record belongs to" }
      - { name: session_date, type: datetime, source: input, description: "Calendar date of the session" }
      - { name: present, type: boolean, source: input, description: "Whether the student attended this session" }
      - { name: cumulative_progress_pct, type: number, source: input, description: "Curriculum completion at this session, 0..100", constraints: "0 <= x <= 100" }

  - name: CIRRReport
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort being reported" }
      - { name: denominator_basis, type: enum, source: input, description: "GRADUATES_ONLY | ALL_ENROLLED; chooses the placement-rate denominator", constraints: "GRADUATES_ONLY | ALL_ENROLLED" }
      - { name: graduates_count, type: integer, source: computed, description: "Count of Enrollment rows in this cohort with status=GRADUATED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollment rows in this cohort with status IN {ACTIVE, GRADUATED, DISMISSED, WITHDRAWN}" }
      - { name: placed_count, type: integer, source: computed, description: "Count of PlacementOutcome rows with cirr_eligible=true for graduates in this cohort" }
      - { name: placement_rate, type: number, source: computed, description: "placed_count / denominator (per denominator_basis); see calc cirr_placement_rate" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED", default: "DRAFT", constraints: "DRAFT | PUBLISHED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cohort
    initial_state: PLANNING
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /cohorts/{id}/open"
        actor: AdmissionsOfficer
        preconditions: ["start_date is in the future relative to current clock"]
        side_effects: ["Cohort accepts admissions; seats_available == capacity"]
      - from: OPEN
        to: RUNNING
        trigger: "POST /cohorts/{id}/start"
        actor: AdmissionsOfficer
        preconditions: ["current clock >= start_date"]
        side_effects: ["All ENROLLED enrollments for this cohort transition ENROLLED -> ACTIVE", "Each ACTIVE enrollment with financing_choice=ISA: its ISAContract stays PENDING until graduation"]
      - from: RUNNING
        to: GRADUATED
        trigger: "POST /cohorts/{id}/graduate"
        actor: AdmissionsOfficer
        preconditions: ["current clock >= end_date"]
        side_effects: ["Every ACTIVE enrollment with progress_pct >= 100 transitions ACTIVE -> GRADUATED (cascade); each graduating ISA enrollment activates its PENDING ISAContract -> ACTIVE"]
      - from: GRADUATED
        to: ARCHIVED
        trigger: "POST /cohorts/{id}/archive"
        actor: AdmissionsOfficer
        preconditions: ["No ISAContract for this cohort in status PENDING"]
        side_effects: ["Cohort frozen; no further admissions or enrollment changes"]

  - entity: Applicant
    initial_state: APPLIED
    terminal_states: [REJECTED, ENROLLED, WITHDRAWN_APP]
    transitions:
      - from: APPLIED
        to: ADMITTED
        trigger: "POST /applicants/{id}/admit"
        actor: AdmissionsOfficer
        preconditions: ["Cohort.status == OPEN", "Cohort.seats_available >= 1 (ERR_COHORT_FULL)"]
        side_effects: ["admitted_at stamped; a seat is conceptually reserved at enrollment, not here"]
      - from: APPLIED
        to: REJECTED
        trigger: "POST /applicants/{id}/reject"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects: ["Applicant exits funnel"]
      - from: ADMITTED
        to: ENROLLED
        trigger: "POST /enrollments (with applicant_id)"
        actor: AdmissionsOfficer
        preconditions: ["Applicant.status == ADMITTED", "Cohort.seats_available >= 1 (ERR_COHORT_FULL)"]
        side_effects: ["Creates an Enrollment(status=ENROLLED); Cohort.seats_committed += 1 (seat conservation); a Deposit(HELD) is created; if financing_choice=ISA an ISAContract(PENDING) is created"]
      - from: ADMITTED
        to: WITHDRAWN_APP
        trigger: "POST /applicants/{id}/withdraw"
        actor: AdmissionsOfficer
        preconditions: ["No Enrollment exists for this applicant"]
        side_effects: ["Applicant exits funnel without consuming a seat"]

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [GRADUATED, DISMISSED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /cohorts/{id}/start (cascade) "
        actor: system
        preconditions: ["Owning Cohort transitions OPEN -> RUNNING"]
        side_effects: ["Enrollment becomes ACTIVE; attendance/progress recording enabled"]
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /cohorts/{id}/graduate (cascade) "
        actor: system
        preconditions: ["progress_pct >= 100 (ERR_PROGRESS_INCOMPLETE for direct attempts)"]
        side_effects: ["If financing_choice=ISA: linked ISAContract PENDING -> ACTIVE (cascade, cross-entity)", "Cohort.seats_committed unchanged (graduate still counts as committed)"]
      - from: ACTIVE
        to: DISMISSED
        trigger: "POST /enrollments/{id}/dismiss"
        actor: AdmissionsOfficer
        preconditions: ["attendance_pct < 50 (ERR_DISMISSAL_NOT_JUSTIFIED)"]
        side_effects: ["Cohort.seats_committed -= 1 (seat released); linked PENDING ISAContract -> VOIDED; Deposit HELD -> FORFEITED"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects: ["Cohort.seats_committed -= 1 (seat released, conservation); linked PENDING ISAContract -> VOIDED (cascade); a RefundRequest(PENDING, reason=COOLING_OFF or WITHDRAWAL) is created"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects: ["Cohort.seats_committed -= 1 (seat released, conservation); linked PENDING ISAContract -> VOIDED (cascade); a RefundRequest(PENDING, reason=WITHDRAWAL) is created"]

  - entity: ISAContract
    initial_state: PENDING
    terminal_states: [COMPLETED, SETTLED_TERM, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /cohorts/{id}/graduate (cascade via Enrollment GRADUATED) "
        actor: system
        preconditions: ["Linked Enrollment.status == GRADUATED (cross-entity dependency)"]
        side_effects: ["Income reporting and payment collection enabled; remaining_cap_cents = cap_cents"]
      - from: PENDING
        to: VOIDED
        trigger: "POST /enrollments/{id}/withdraw OR /dismiss (cascade) "
        actor: system
        preconditions: ["Linked Enrollment transitions to WITHDRAWN or DISMISSED"]
        side_effects: ["No payment obligation ever accrues; cap_cents effectively unrecoverable"]
      - from: ACTIVE
        to: DEFERRED
        trigger: "POST /deferment-requests/{id}/approve (cascade) "
        actor: ServicingOfficer
        preconditions: ["A DefermentRequest for this contract transitions to APPROVED (cross-entity)"]
        side_effects: ["No new payment obligation accrues for periods inside the deferment window; term clock effectively pauses"]
      - from: DEFERRED
        to: ACTIVE
        trigger: "POST /deferment-requests/{id}/end"
        actor: ServicingOfficer
        preconditions: ["The active deferment for this contract transitions APPROVED -> ENDED (cyclic return)"]
        side_effects: ["Payment obligation resumes for periods after the deferment window"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /payments/{id}/settle (cascade when cap reached) "
        actor: system
        preconditions: ["amount_paid_cents >= cap_cents after settlement (boundary: >=)"]
        side_effects: ["No further payments owed; remaining_cap_cents = 0; linked Enrollment.isa_status mirrors COMPLETED (cascade)"]
      - from: ACTIVE
        to: SETTLED_TERM
        trigger: "POST /payments/{id}/settle (cascade when term reached) "
        actor: system
        preconditions: ["payments_made_count >= term_months after settlement (boundary: >=) AND amount_paid_cents < cap_cents"]
        side_effects: ["No further payments owed even though cap not reached; remaining_cap_cents frozen at residual"]

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED]
    note: "collection_status is the primary lifecycle dimension; refund_status is an independent parallel dimension on a SETTLED payment; status is the computed rollup"
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /payments/{id}/settle"
        actor: ServicingOfficer
        preconditions: ["Linked ISAContract.status == ACTIVE (cross-entity; DEFERRED blocks settlement)"]
        side_effects: ["ISAContract.amount_paid_cents += amount_cents; remaining_cap_cents recomputed (ledger sync)", "ISAContract may cascade ACTIVE -> COMPLETED or ACTIVE -> SETTLED_TERM"]
      - from: PENDING
        to: FAILED
        trigger: "POST /payments/{id}/fail"
        actor: ServicingOfficer
        preconditions: []
        side_effects: ["No ledger change; payment marked uncollected"]
      - from: FAILED
        to: PENDING
        trigger: "POST /payments/{id}/retry"
        actor: ServicingOfficer
        preconditions: ["Linked ISAContract.status == ACTIVE"]
        side_effects: ["collection_status returns to PENDING for re-collection (cyclic)"]
      - from: SETTLED
        to: SETTLED
        trigger: "POST /payments/{id}/refund (refund_status NONE -> REFUNDED, parallel dimension) "
        actor: ServicingOfficer
        preconditions: ["collection_status == SETTLED", "refund_status == NONE"]
        side_effects: ["refund_status = REFUNDED; status rollup -> REVERSED; ISAContract.amount_paid_cents -= amount_cents (compensating ledger reversal); if contract was COMPLETED/SETTLED_TERM it reverts to ACTIVE"]

  - entity: DefermentRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, ENDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /deferment-requests/{id}/approve"
        actor: ServicingOfficer
        preconditions:
          - "Linked ISAContract.status == ACTIVE (cross-entity)"
          - "reason==UNEMPLOYMENT requires the latest IncomeReport for the contract has employment_status=UNEMPLOYED (ERR_DEFERMENT_INELIGIBLE)"
          - "reason==INCOME_FLOOR requires the latest IncomeReport gross_income_cents <= ISAContract.income_threshold_cents (ERR_DEFERMENT_INELIGIBLE)"
          - "period does not overlap any prior APPROVED-or-ENDED deferment window for the same contract incl. a 1-day buffer (closed intervals; ERR_DEFERMENT_OVERLAP)"
        side_effects: ["ISAContract ACTIVE -> DEFERRED (cascade, cross-entity)"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /deferment-requests/{id}/deny"
        actor: ServicingOfficer
        preconditions: []
        side_effects: ["No contract change"]
      - from: APPROVED
        to: ENDED
        trigger: "POST /deferment-requests/{id}/end"
        actor: ServicingOfficer
        preconditions: ["ISAContract.status == DEFERRED"]
        side_effects: ["ISAContract DEFERRED -> ACTIVE (cascade, cyclic)"]

  - entity: RefundRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /refund-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "reason==COOLING_OFF requires (requested_at - Enrollment.enrolled_at) <= 14 days inclusive (ERR_COOLING_OFF_EXPIRED)"
          - "Linked Deposit.status == HELD (ERR_DEPOSIT_ALREADY_RESOLVED)"
        side_effects: ["gross_refund_cents and net_refund_cents computed (calc refund_amount)", "Deposit HELD -> REFUNDED with refunded_amount_cents set (cascade); seat already released by the withdraw that created this request"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /refund-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Deposit HELD -> FORFEITED (cascade); refunded_amount_cents = 0"]

  - entity: Scholarship
    initial_state: APPLIED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: APPLIED
        to: SUPERSEDED
        trigger: "POST /scholarships (a newer scholarship for the same enrollment is applied)"
        actor: system
        preconditions: ["A newer Scholarship is created on the same enrollment_id"]
        side_effects: ["This award stops contributing to the ISA cap reduction; the new award's cap_reduction_pct governs"]

  - entity: PlacementOutcome
    initial_state: REPORTED
    terminal_states: [REPORTED]
    note: "Single-state resource; cirr_eligible is a computed field, no lifecycle transitions"
    transitions: []

  - entity: CIRRReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /cirr-reports/{id}/publish"
        actor: ComplianceOfficer
        preconditions: ["Cohort.status IN {GRADUATED, ARCHIVED} (cross-entity; cannot publish before graduation)"]
        side_effects: ["graduates_count, enrolled_count, placed_count, placement_rate frozen at publish time"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: scholarship-apply-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /scholarships"
    occ_field: "expected_enrollment_version"
    description: |
      Applying a Scholarship against an Enrollment whose version has advanced since
      the client last observed it is rejected. A scholarship application recomputes the
      linked ISAContract.cap_cents and supersedes any prior APPLIED scholarship on the
      same enrollment; when another writer has already applied a scholarship (legitimately
      superseding the prior award and bumping the enrollment version), the current writer's
      view is stale and the create is refused on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_payment_amount
    trigger: "POST /income-reports (compute obligation_cents and, if > 0, create a Payment)"
    algorithm: threshold
    formula: |
      # Mode (a): >=3 inputs, nested min/max, conditional branch on income vs threshold,
      # and a remaining-cap clamp. Evaluation order is pinned.
      if ISAContract.status == DEFERRED: return 0          # no obligation while deferred
      if gross_income_cents <= income_threshold_cents: return 0   # income floor (boundary: <=, see ERR none)
      if payments_made_count >= term_months: return 0      # term exhausted
      raw = round_half_up(gross_income_cents * income_share_pct)   # round AFTER the multiply (pinned)
      obligation = min(raw, remaining_cap_cents)            # clamp to the remaining cap
      return obligation
    input_set: "Single IncomeReport for an ACTIVE (not DEFERRED) ISAContract; payments_made_count and remaining_cap_cents read from the contract's current ledger"
    constants: {}
    precision: "round_half_up to whole cents; multiply-then-round (never round the share fraction first)"
    variants:
      - name: at_threshold
        when: "gross_income_cents == income_threshold_cents exactly"
        difference: "Equality is below-or-at the floor: obligation is 0 (uses <=, not <)"
      - name: cap_straddle
        when: "raw would exceed remaining_cap_cents"
        difference: "Obligation is clamped to remaining_cap_cents so amount_paid never overshoots cap"

  - name: isa_payoff_projection
    trigger: "Read of ISAContract.projected_payoff_cents (computed field) and GET /isa-contracts/{id}/projection"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT on ISAContract: forward-looking projection vs chronological actual.
      # Projection assumes income continues at the latest reported gross indefinitely.
      latest = most recent IncomeReport for this contract by (period_start DESC, created_at DESC)
      if no IncomeReport OR status in {COMPLETED, SETTLED_TERM, VOIDED}: projected = amount_paid_cents
      else:
        per_month = max(0, min(round_half_up(latest.gross_income_cents * income_share_pct), cap_cents))
        months_left = term_months - payments_made_count
        projected = min(cap_cents, amount_paid_cents + per_month * months_left)
      return projected
    input_set: "Latest IncomeReport (forward projection) vs the SETTLED Payment ledger (chronological amount_paid_cents)"
    constants: {}
    precision: "round_half_up to whole cents"
    variants:
      - name: forward_projection
        when: "GET /isa-contracts/{id}/projection (variant=PROJECTED)"
        difference: "Assumes latest income repeats every remaining month; can equal cap_cents early"
      - name: chronological_actual
        when: "ISAContract.amount_paid_cents read directly"
        difference: "Sum of only the Payment rows actually SETTLED so far; lags the projection"

  - name: refund_amount
    trigger: "POST /refund-requests/{id}/approve"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where per-line rounding order is PINNED.
      # Two lines are rounded INDEPENDENTLY then summed (round-per-line, then sum) — NOT sum-then-round.
      # Line 1: deposit refund. COOLING_OFF -> full deposit; WITHDRAWAL -> deposit * (1 - WITHDRAWAL_RETENTION).
      deposit_line = Deposit.amount_cents if reason==COOLING_OFF
                     else round_half_up(Deposit.amount_cents * (1 - WITHDRAWAL_RETENTION))
      # Line 2: unused tuition proration by progress. 0 for COOLING_OFF (no instruction consumed).
      tuition_paid = Deposit.amount_cents (deposits are the only tuition collected pre-ISA)
      tuition_line = 0 if reason==COOLING_OFF
                     else round_half_up(Cohort.tuition_sticker_cents * (1 - Enrollment.progress_pct/100) * TUITION_PRORATION_WEIGHT)
      gross_refund_cents = deposit_line + tuition_line          # sum of per-line rounded values (pinned order)
      admin_fee = round_half_up(gross_refund_cents * ADMIN_FEE_PCT)
      net_refund_cents = gross_refund_cents - admin_fee
    input_set: "One RefundRequest, its Enrollment (progress_pct), the Enrollment's Deposit, and the Cohort sticker price"
    constants:
      WITHDRAWAL_RETENTION: 0.10
      TUITION_PRORATION_WEIGHT: 0.50
      ADMIN_FEE_PCT: 0.05
    precision: "round_half_up to whole cents; round EACH line independently, then sum (order pinned), then deduct rounded admin fee"
    variants:
      - name: cooling_off_full
        when: "reason == COOLING_OFF"
        difference: "Full deposit returned, tuition_line = 0; admin fee still applies to gross"
      - name: withdrawal_prorated
        when: "reason == WITHDRAWAL"
        difference: "Deposit retains 10%; tuition_line prorated by remaining progress at 50% weight"

  - name: cirr_placement_rate
    trigger: "Read of CIRRReport.placement_rate and POST /cirr-reports/{id}/publish"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on CIRRReport (different entity domain than isa_payoff_projection):
      # same placed_count, two denominators -> different rate.
      placed_count = count(PlacementOutcome where enrollment in this cohort,
                           enrollment.status==GRADUATED, cirr_eligible==true)
      graduates_count = count(Enrollment in cohort where status==GRADUATED)
      enrolled_count  = count(Enrollment in cohort where status IN {ACTIVE,GRADUATED,DISMISSED,WITHDRAWN})
      denom = graduates_count if denominator_basis==GRADUATES_ONLY else enrolled_count
      placement_rate = 0 if denom == 0 else round_half_up_4(placed_count / denom)
    input_set: "PlacementOutcome rows (cirr_eligible) and Enrollment status counts for the cohort"
    constants:
      CIRR_WINDOW_DAYS: 180
    precision: "placement_rate rounded to 4 decimals, round_half_up; empty denominator => 0"
    variants:
      - name: graduates_only
        when: "denominator_basis == GRADUATES_ONLY"
        difference: "Denominator is graduates only -> higher rate"
      - name: all_enrolled
        when: "denominator_basis == ALL_ENROLLED"
        difference: "Denominator includes dismissed/withdrawn -> lower rate for identical placements"

  - name: cirr_eligibility
    trigger: "POST /placement-outcomes (compute cirr_eligible)"
    algorithm: threshold
    formula: |
      countable = category IN {EMPLOYED_IN_FIELD, EMPLOYED_OUT_OF_FIELD, SELF_EMPLOYED}
      within_window = (placement_days != null AND placement_days <= CIRR_WINDOW_DAYS)   # boundary <=
      cirr_eligible = countable AND within_window
    input_set: "Single PlacementOutcome"
    constants:
      CIRR_WINDOW_DAYS: 180
    precision: "n/a (boolean)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path/body resource ids resolve to existing rows, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Pagination/query params in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_enrollment_version matches Enrollment.version on POST /scholarships"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /scholarships"
  - priority: 7
    category: business_temporal
    check: "Cohort transition timing vs current clock (open requires future start; start requires clock>=start_date; graduate requires clock>=end_date)"
    error_id: ERR_COHORT_TIMING
    http_status: 409
    applies_to: "POST /cohorts/{id}/open, /start, /graduate"
  - priority: 8
    category: business_constraint
    check: "Cohort has an available seat for admit/enroll"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /applicants/{id}/admit, POST /enrollments"
  - priority: 9
    category: business_temporal
    check: "COOLING_OFF refund requested within 14 days inclusive of enrolled_at"
    error_id: ERR_COOLING_OFF_EXPIRED
    http_status: 409
    applies_to: "POST /refund-requests/{id}/approve"
  - priority: 10
    category: business_referential
    check: "Deposit linked to the refund's enrollment is still HELD"
    error_id: ERR_DEPOSIT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /refund-requests/{id}/approve"
  - priority: 11
    category: business_safety
    check: "Dismissal justified: attendance_pct < 50"
    error_id: ERR_DISMISSAL_NOT_JUSTIFIED
    http_status: 409
    applies_to: "POST /enrollments/{id}/dismiss"
  - priority: 12
    category: business_constraint
    check: "Graduation requires Enrollment.progress_pct >= 100 (direct-attempt guard)"
    error_id: ERR_PROGRESS_INCOMPLETE
    http_status: 409
    applies_to: "POST /enrollments/{id}/graduate"
  - priority: 13
    category: business_constraint
    check: "Deferment eligibility: UNEMPLOYMENT needs latest IncomeReport employment_status=UNEMPLOYED; INCOME_FLOOR needs latest gross_income_cents <= threshold"
    error_id: ERR_DEFERMENT_INELIGIBLE
    http_status: 409
    applies_to: "POST /deferment-requests/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "Deferment window must not overlap any prior APPROVED-or-ENDED deferment window for the contract including a 1-day buffer (closed intervals; a span stays reserved after it ENDs)"
    error_id: ERR_DEFERMENT_OVERLAP
    http_status: 409
    applies_to: "POST /deferment-requests/{id}/approve"
  - priority: 15
    category: business_temporal
    check: "IncomeReport monthly period [period_start, period_end) must not overlap an existing report for the same contract (half-open intervals)"
    error_id: ERR_INCOME_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /income-reports"
  - priority: 16
    category: business_constraint
    check: "PlacementOutcome with category EMPLOYED_IN_FIELD or EMPLOYED_OUT_OF_FIELD requires annual_salary_cents"
    error_id: ERR_SALARY_REQUIRED
    http_status: 400
    applies_to: "POST /placement-outcomes"
  - priority: 17
    category: business_referential
    check: "PlacementOutcome may only be reported for a GRADUATED enrollment"
    error_id: ERR_OUTCOME_NOT_GRADUATE
    http_status: 409
    applies_to: "POST /placement-outcomes"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Cohort ----------
  - method: POST
    path: "/cohorts"
    description: "Create a cohort"
    roles: [AdmissionsOfficer]
    code: 201
    input: [name, track, capacity, tuition_sticker_cents, start_date, end_date, cirr_period_label]
    output: Cohort
    side_effects: ["status=PLANNING; seats_committed=0; seats_available=capacity"]
  - method: GET
    path: "/cohorts/{id}"
    description: "Get a cohort"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: GET
    path: "/cohorts"
    description: "List cohorts"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: POST
    path: "/cohorts/{id}/open"
    description: "Open a cohort for admissions"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status PLANNING -> OPEN"]
  - method: POST
    path: "/cohorts/{id}/start"
    description: "Start instruction; cascade all ENROLLED -> ACTIVE"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status OPEN -> RUNNING", "each ENROLLED enrollment -> ACTIVE (cascade)"]
  - method: POST
    path: "/cohorts/{id}/graduate"
    description: "Graduate the cohort; cascade qualifying enrollments and ISA activation"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status RUNNING -> GRADUATED", "each ACTIVE enrollment with progress_pct>=100 -> GRADUATED (cascade)", "each graduating ISA enrollment: ISAContract PENDING -> ACTIVE (cascade)"]
  - method: POST
    path: "/cohorts/{id}/archive"
    description: "Archive a graduated cohort"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status GRADUATED -> ARCHIVED"]
  - method: GET
    path: "/cohorts/{id}/enrollments"
    description: "List enrollments for a cohort (FK reverse-reachability: Enrollment.cohort_id)"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}/cirr-reports"
    description: "List CIRR reports for a cohort (FK reverse-reachability: CIRRReport.cohort_id)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CIRRReport[]
    side_effects: []

  # ---------- Applicant ----------
  - method: POST
    path: "/applicants"
    description: "Submit an application to a cohort"
    roles: [AdmissionsOfficer, Student]
    code: 201
    input: [cohort_id, full_name, email, reported_prior_income_cents]
    output: Applicant
    side_effects: ["status=APPLIED"]
  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant"
    roles: [AdmissionsOfficer, Student]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants"
    description: "List applicants, filterable by cohort (FK reverse-reachability: Applicant.cohort_id)"
    roles: [AdmissionsOfficer]
    code: 200
    input: ["cohort_id?", "status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []
  - method: POST
    path: "/applicants/{id}/admit"
    description: "Admit an applicant"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: ["status APPLIED -> ADMITTED; admitted_at stamped"]
  - method: POST
    path: "/applicants/{id}/reject"
    description: "Reject an applicant"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: ["status APPLIED -> REJECTED"]
  - method: POST
    path: "/applicants/{id}/withdraw"
    description: "Withdraw an admitted applicant before enrolling"
    roles: [AdmissionsOfficer, Student]
    code: 200
    input: []
    output: Applicant
    side_effects: ["status ADMITTED -> WITHDRAWN_APP"]

  # ---------- Enrollment ----------
  - method: POST
    path: "/enrollments"
    description: "Enroll an admitted applicant; creates Deposit and (for ISA) ISAContract"
    roles: [AdmissionsOfficer]
    code: 201
    input: [applicant_id, financing_choice, deposit_amount_cents, "isa_income_share_pct?", "isa_cap_cents?", "isa_term_months?", "isa_income_threshold_cents?"]
    output: Enrollment
    side_effects: ["Applicant ADMITTED -> ENROLLED", "Cohort.seats_committed += 1", "Deposit(HELD) created", "if financing_choice=ISA: ISAContract(PENDING) created"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by applicant (FK reverse-reachability: Enrollment.applicant_id)"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer]
    code: 200
    input: ["applicant_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/graduate"
    description: "Directly graduate a single ACTIVE enrollment (guarded by progress_pct>=100)"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status ACTIVE -> GRADUATED", "linked ISAContract PENDING -> ACTIVE (cascade)"]
  - method: POST
    path: "/enrollments/{id}/dismiss"
    description: "Dismiss an enrollment for attendance"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status ACTIVE -> DISMISSED", "Cohort.seats_committed -= 1", "linked PENDING ISAContract -> VOIDED", "Deposit HELD -> FORFEITED"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment; voids pending ISA and opens a refund request"
    roles: [AdmissionsOfficer, Student]
    code: 200
    input: ["refund_reason?"]
    output: Enrollment
    side_effects: ["status -> WITHDRAWN", "Cohort.seats_committed -= 1", "linked PENDING ISAContract -> VOIDED", "RefundRequest(PENDING) created"]
  - method: GET
    path: "/enrollments/{id}/attendance"
    description: "List attendance records for an enrollment (FK reverse-reachability: AttendanceRecord.enrollment_id)"
    roles: [AdmissionsOfficer, ServicingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []

  # ---------- AttendanceRecord ----------
  - method: POST
    path: "/attendance-records"
    description: "Record a session attendance/progress event for an ACTIVE enrollment"
    roles: [AdmissionsOfficer]
    code: 201
    input: [enrollment_id, session_date, present, cumulative_progress_pct]
    output: AttendanceRecord
    side_effects: ["Enrollment.attendance_pct and progress_pct recomputed"]

  # ---------- Scholarship ----------
  - method: POST
    path: "/scholarships"
    description: "Apply a scholarship to an enrollment; supersedes prior award and reduces ISA cap (OCC on enrollment)"
    roles: [AdmissionsOfficer]
    code: 201
    input: [enrollment_id, kind, cap_reduction_pct, expected_enrollment_version]
    output: Scholarship
    side_effects: ["prior APPLIED Scholarship on this enrollment -> SUPERSEDED", "linked ISAContract.cap_cents recomputed", "Enrollment.version += 1"]
  - method: GET
    path: "/scholarships/{id}"
    description: "Get a scholarship"
    roles: [AdmissionsOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Scholarship
    side_effects: []
  - method: GET
    path: "/scholarships"
    description: "List scholarships, filterable by enrollment (FK reverse-reachability: Scholarship.enrollment_id)"
    roles: [AdmissionsOfficer, ComplianceOfficer]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: Scholarship[]
    side_effects: []

  # ---------- Deposit ----------
  - method: GET
    path: "/deposits/{id}"
    description: "Get a deposit"
    roles: [AdmissionsOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: GET
    path: "/deposits"
    description: "List deposits, filterable by enrollment (FK reverse-reachability: Deposit.enrollment_id)"
    roles: [AdmissionsOfficer, ComplianceOfficer]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []

  # ---------- ISAContract ----------
  - method: GET
    path: "/isa-contracts/{id}"
    description: "Get an ISA contract with its current ledger"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: ISAContract
    side_effects: []
  - method: GET
    path: "/isa-contracts"
    description: "List ISA contracts, filterable by enrollment (FK reverse-reachability: ISAContract.enrollment_id)"
    roles: [ServicingOfficer, ComplianceOfficer]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: ISAContract[]
    side_effects: []
  - method: GET
    path: "/isa-contracts/{id}/projection"
    description: "Computed read: forward-looking projected payoff vs chronological actual"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: ["variant?"]
    output: ISAContract
    side_effects: []
  - method: GET
    path: "/isa-contracts/{id}/payments"
    description: "List payments for a contract (FK reverse-reachability: Payment.isa_contract_id)"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/isa-contracts/{id}/income-reports"
    description: "List income reports for a contract (FK reverse-reachability: IncomeReport.isa_contract_id)"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: IncomeReport[]
    side_effects: []
  - method: GET
    path: "/isa-contracts/{id}/deferment-requests"
    description: "List deferment requests for a contract (FK reverse-reachability: DefermentRequest.isa_contract_id)"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: DefermentRequest[]
    side_effects: []

  # ---------- IncomeReport ----------
  - method: POST
    path: "/income-reports"
    description: "File a monthly income report; computes obligation and may create a Payment"
    roles: [ServicingOfficer, Student]
    code: 201
    input: [isa_contract_id, period_start, period_end, gross_income_cents, employment_status]
    output: IncomeReport
    side_effects: ["obligation_cents computed", "if obligation_cents > 0: Payment(PENDING) created and payment_id set"]
  - method: GET
    path: "/income-reports/{id}"
    description: "Get an income report"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: IncomeReport
    side_effects: []

  # ---------- Payment ----------
  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments, filterable by income report (FK reverse-reachability: Payment.income_report_id)"
    roles: [ServicingOfficer, ComplianceOfficer]
    code: 200
    input: ["income_report_id?", "isa_contract_id?", "collection_status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/settle"
    description: "Settle a pending payment; updates ISA ledger and may complete the contract"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["collection_status PENDING -> SETTLED", "ISAContract.amount_paid_cents += amount_cents (ledger sync)", "contract may cascade -> COMPLETED or SETTLED_TERM"]
  - method: POST
    path: "/payments/{id}/fail"
    description: "Mark a pending payment as failed"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["collection_status PENDING -> FAILED"]
  - method: POST
    path: "/payments/{id}/retry"
    description: "Return a failed payment to pending for re-collection"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["collection_status FAILED -> PENDING"]
  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a settled payment; compensating reversal of the ISA ledger"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["refund_status NONE -> REFUNDED", "status rollup -> REVERSED", "ISAContract.amount_paid_cents -= amount_cents (compensating)", "COMPLETED/SETTLED_TERM contract reverts to ACTIVE"]

  # ---------- DefermentRequest ----------
  - method: POST
    path: "/deferment-requests"
    description: "Request a deferment on an ISA contract"
    roles: [ServicingOfficer, Student]
    code: 201
    input: [isa_contract_id, reason, period_start, period_end]
    output: DefermentRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/deferment-requests/{id}"
    description: "Get a deferment request"
    roles: [ServicingOfficer, ComplianceOfficer, Student]
    code: 200
    input: []
    output: DefermentRequest
    side_effects: []
  - method: POST
    path: "/deferment-requests/{id}/approve"
    description: "Approve a deferment; pauses the contract"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: DefermentRequest
    side_effects: ["status REQUESTED -> APPROVED", "ISAContract ACTIVE -> DEFERRED (cascade)"]
  - method: POST
    path: "/deferment-requests/{id}/deny"
    description: "Deny a deferment"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: DefermentRequest
    side_effects: ["status REQUESTED -> DENIED"]
  - method: POST
    path: "/deferment-requests/{id}/end"
    description: "End an approved deferment; resumes the contract"
    roles: [ServicingOfficer]
    code: 200
    input: []
    output: DefermentRequest
    side_effects: ["status APPROVED -> ENDED", "ISAContract DEFERRED -> ACTIVE (cascade)"]

  # ---------- RefundRequest ----------
  - method: GET
    path: "/refund-requests/{id}"
    description: "Get a refund request"
    roles: [ComplianceOfficer, AdmissionsOfficer, Student]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: GET
    path: "/refund-requests"
    description: "List refund requests, filterable by enrollment (FK reverse-reachability: RefundRequest.enrollment_id)"
    roles: [ComplianceOfficer, AdmissionsOfficer]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: POST
    path: "/refund-requests/{id}/approve"
    description: "Approve a refund; computes amounts and refunds the deposit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["status PENDING -> APPROVED", "gross/net refund computed", "Deposit HELD -> REFUNDED (cascade)"]
  - method: POST
    path: "/refund-requests/{id}/reject"
    description: "Reject a refund; forfeits the deposit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["status PENDING -> REJECTED", "Deposit HELD -> FORFEITED (cascade)"]

  # ---------- PlacementOutcome ----------
  - method: POST
    path: "/placement-outcomes"
    description: "Report a CIRR placement outcome for a graduate"
    roles: [ComplianceOfficer]
    code: 201
    input: [enrollment_id, category, reported_at, "annual_salary_cents?", "placement_days?"]
    output: PlacementOutcome
    side_effects: ["cirr_eligible computed"]
  - method: GET
    path: "/placement-outcomes/{id}"
    description: "Get a placement outcome"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PlacementOutcome
    side_effects: []
  - method: GET
    path: "/placement-outcomes"
    description: "List placement outcomes, filterable by enrollment (FK reverse-reachability: PlacementOutcome.enrollment_id)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: PlacementOutcome[]
    side_effects: []

  # ---------- CIRRReport ----------
  - method: POST
    path: "/cirr-reports"
    description: "Create a draft CIRR report for a cohort"
    roles: [ComplianceOfficer]
    code: 201
    input: [cohort_id, denominator_basis]
    output: CIRRReport
    side_effects: ["status=DRAFT; counts and placement_rate computed"]
  - method: GET
    path: "/cirr-reports/{id}"
    description: "Get a CIRR report"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CIRRReport
    side_effects: []
  - method: POST
    path: "/cirr-reports/{id}/publish"
    description: "Publish a CIRR report (freezes computed counts)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CIRRReport
    side_effects: ["status DRAFT -> PUBLISHED"]

  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock for time-gated transitions"
    roles: [AdmissionsOfficer, ServicingOfficer, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server current-clock advanced to the supplied instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state from which this transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match current Enrollment.version on scholarship apply" }
  - { id: ERR_COHORT_TIMING, http: 409, condition: "Cohort transition violates clock timing (future-start / clock>=start / clock>=end)" }
  - { id: ERR_COHORT_FULL, http: 409, condition: "Cohort has no available seat for admit/enroll" }
  - { id: ERR_COOLING_OFF_EXPIRED, http: 409, condition: "COOLING_OFF refund requested more than 14 days after enrolled_at" }
  - { id: ERR_DEPOSIT_ALREADY_RESOLVED, http: 409, condition: "Deposit for this enrollment is not HELD (already refunded/forfeited/applied)" }
  - { id: ERR_DISMISSAL_NOT_JUSTIFIED, http: 409, condition: "Dismissal attempted while attendance_pct >= 50" }
  - { id: ERR_PROGRESS_INCOMPLETE, http: 409, condition: "Direct graduation attempted with progress_pct < 100" }
  - { id: ERR_DEFERMENT_INELIGIBLE, http: 409, condition: "Deferment reason not supported by the latest income report" }
  - { id: ERR_DEFERMENT_OVERLAP, http: 409, condition: "Deferment window overlaps any prior APPROVED-or-ENDED deferment window (incl. 1-day buffer) for the contract" }
  - { id: ERR_INCOME_PERIOD_OVERLAP, http: 409, condition: "Income report period overlaps an existing report period for the same contract" }
  - { id: ERR_SALARY_REQUIRED, http: 400, condition: "Employed placement outcome missing annual_salary_cents" }
  - { id: ERR_OUTCOME_NOT_GRADUATE, http: 409, condition: "Placement outcome reported for a non-GRADUATED enrollment" }
  - { id: ERR_VALIDATION, http: 422, condition: "Pagination/query parameter out of bounds (limit > 100 or < 1, negative offset)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AdmissionsOfficer
    description: "Runs the admission funnel and cohort lifecycle: applications, admission, enrollment, attendance, scholarships, withdrawals/dismissals"
    identity: "opaque"
    exclusive_operations:
      - "POST /cohorts and /cohorts/{id}/(open|start|graduate|archive)"
      - "POST /applicants/{id}/(admit|reject)"
      - "POST /enrollments"
      - "POST /enrollments/{id}/(graduate|dismiss)"
      - "POST /attendance-records"
      - "POST /scholarships"
    shared_operations:
      - "POST /applicants, /applicants/{id}/withdraw, /enrollments/{id}/withdraw (shared with Student)"
      - "GET reads on cohorts, applicants, enrollments, deposits, scholarships, refund-requests"
  - name: ServicingOfficer
    description: "Services live ISA contracts: income reports, payment collection, deferments"
    identity: "opaque"
    exclusive_operations:
      - "POST /payments/{id}/(settle|fail|retry|refund)"
      - "POST /deferment-requests/{id}/(approve|deny|end)"
    shared_operations:
      - "POST /income-reports, /deferment-requests (shared with Student)"
      - "GET reads on isa-contracts, payments, income-reports, deferment-requests, enrollments"
  - name: ComplianceOfficer
    description: "Owns refunds and CIRR job-placement reporting"
    identity: "opaque"
    exclusive_operations:
      - "POST /refund-requests/{id}/(approve|reject)"
      - "POST /placement-outcomes"
      - "POST /cirr-reports and /cirr-reports/{id}/publish"
    shared_operations:
      - "GET reads on cirr-reports, placement-outcomes, refund-requests, isa-contracts"
  - name: Student
    description: "The applicant/graduate acting on their own funnel and ISA: apply, withdraw, file income, request deferment"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /applicants, /applicants/{id}/withdraw, /enrollments/{id}/withdraw (shared with AdmissionsOfficer)"
      - "POST /income-reports, /deferment-requests (shared with ServicingOfficer)"
      - "GET reads on own cohort, applicant, enrollment, isa-contract, payments, deposits"
