      - name: weighted_scoring_composes_severity_scheme_market_and_language_weights
        claim_type: weighted_scoring
        grounds:
          - calculations.mandatory_element_compliance_score
          - calculations.mandatory_element_compliance_score.constants.ELEMENT_SEVERITY_WEIGHT
        excluded_because:
          difficulty_instance: combinatorial_formula / compliance_score_combines_element_scheme_market_and_language_inputs
          rationale: "The named instance varies all four weight inputs at once and asserts the composed score, which is exactly this row."

      - name: constraint_propagation_over_the_three_proof_dimensions
        claim_type: constraint_propagation
        grounds:
          - calculations.proof_state_resolution
          - calculations.proof_state_resolution.constants.PRESS_CHECK_SATISFIED_STATES
        excluded_because:
          difficulty_instance: non_linear_state_machine / proof_three_dimensions_resolve_independently_into_derived_state
          rationale: "The named instance drives each dimension separately and asserts the derived proof_state after every write, reaching the fixed point only on the last one."

      - name: chronological_replay_of_out_of_order_depletion_weeks
        claim_type: chronological
        grounds:
          - calculations.runout_projection
          - calculations.runout_projection.variants.CHRONOLOGICAL
        excluded_because:
          difficulty_instance: dual_variant_calc / runout_forward_looking_vs_chronological_date_divergence
          rationale: "The named instance replays the depletion history record by record and asserts remaining_qty, the trailing average and actual_runout_date after each append."

      - name: variant_divergence_between_provisional_and_final_recovery
        claim_type: variant_divergence
        grounds:
          - calculations.cost_recovery_amount
          - calculations.cost_recovery_amount.variants.PROVISIONAL
          - calculations.cost_recovery_amount.variants.FINAL
        excluded_because:
          difficulty_instance: dual_variant_calc / recovery_provisional_vs_final_diverge_on_per_line_rounding
          rationale: "The named instance asserts both variants on the same escape and the exact delta between them."

      - name: variant_selection_between_projected_and_actual_runout_dates
        claim_type: variant_selection
        grounds:
          - calculations.runout_projection.variants.FORWARD_LOOKING
          - entities.InventoryRunout.fields.projected_runout_date
          - entities.InventoryRunout.fields.actual_runout_date
        excluded_because:
          difficulty_instance: dual_variant_calc / runout_forward_looking_vs_chronological_date_divergence
          rationale: "The named instance proves projected_runout_date is written once at creation and never revised while actual_runout_date moves with every depletion append."

      - name: reconciliation_of_the_recovery_variance_against_the_ledger
        claim_type: reconciliation
        grounds:
          - entities.ErrorEscape.fields.recovery_variance_cents
          - entities.Printer.fields.recovery_balance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / recovery_provisional_vs_final_diverge_on_per_line_rounding
          rationale: "The named instance asserts recovery_variance_cents and the printer ledger credited with the FINAL figure, which is this row's delta-on-switch claim."

  # ==========================================================================
  # SECTION 4 - validations (§1.4 surface)
  # Table-4's three generic rows (violation -> error, satisfaction -> pass,
  # priority ordering) plus the six validation-pattern rows. The
  # violation -> error row is discharged as themed batches so every error id in
  # §1.6 that is not already triggered elsewhere in §1.8/§1.9 has a home; the
  # priority-conflict pattern belongs to §1.8 rule 5 and appears as a stub.
  # ==========================================================================
  - section: validations
    instances:

      - name: each_proof_dimension_closes_once_and_the_whole_proof_closes_after_it_resolves
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - validations[priority=31]
          - errors[ERR_PROOF_STATE_INVALID]
          - errors[ERR_PROOF_DIMENSION_ALREADY_DECIDED]
          - errors[ERR_PRESS_CHECK_NOT_REQUIRED]
          - calculations.proof_state_resolution
        distinguishing_aspect: |
          Three refusals that all look like the same thing but are three different
          rules. A press check on a proof whose press_check_status is NOT_REQUIRED is
          priority 31, not 30. A second colour decision is priority 30 while the proof
          is still PROOF_IN_REVIEW. Once substrate approval flips proof_state to
          PROOF_APPROVED, a further substrate write is priority 29 - the whole proof is
          closed - which OUTRANKS the per-dimension rule that would also fire. An
          implementation with a single already-decided guard cannot produce these three
          error ids from these four calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]); ArtworkAsset (CARTON / COATED_PAPER / US) with brand_critical_color false and plate_budget_cents 500000."
            - "ArtworkVersion v1 is APPROVED with requires_reverification false (no CONDITIONAL decision on its route)."
            - "Printer Cascade Print Co: G7_MASTER, certified_substrates [COATED_PAPER, FILM]."
            - "PrinterProof proof_no 1 on COATED_PAPER: color_status COLOR_PENDING, substrate_status SUBSTRATE_PENDING, press_check_required false so press_check_status NOT_REQUIRED, effective_tolerance 2.0, proof_state PROOF_IN_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
