# =============================================================================
# PRD Benchmark Scaffold — Music & Art Therapy Practice  (Expert)
# §1.0–§1.7 live here. §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Music & Art Therapy Practice: referral & assessment, session plan & goal,
  individual/group scheduling, insurance/self-pay & superbill, progress note &
  outcome, facility/school contract, materials/instrument, discharge

domain_name: music-art-therapy-practice
api_prefix: "/"   # flat multi-collection API; each entity is a top-level resource path

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing        # therapist/room calendar with divergent interval semantics
  secondary_archetype: ledger_reconciliation   # insurance/self-pay superbill estimate vs adjudicated
  complexity_layers:
    - optimistic_concurrency                    # OCC on Client.version for supersede-on-create of TreatmentPlan
    - cascading_side_effects                    # discharge cascade; superbill-void cascade
    - dual_variant_calculation                  # superbill estimated-vs-final; goal progress attendance-vs-rubric
    - scheduled_actions                          # logical clock gates session completion

  entity_topology: graph
  # Enrollment is a many-to-many junction between Session and Client; Session
  # cross-references six peer aggregates (therapist/room/plan/goal/material/contract).

  state_machine_shape: parallel
  # Headline: Session carries two independent axes (scheduling_status x billing_status).
  # Also present: cyclic (TreatmentPlan revision loop) and branching (Referral assess fork).

  relationship_patterns:
    - one_to_many          # Client -> Referral -> TreatmentPlan -> Goal
    - many_to_many         # Session <-> Client via Enrollment
    - cross_aggregate      # Session references Therapist/Room/Material/Contract across aggregates

  role_model: peer_roles
  # IntakeCoordinator, Therapist (entity_backed, owns own sessions), ClinicalDirector, BillingSpecialist.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Therapist name" }
      - { name: discipline, type: enum, source: input, description: "MUSIC | ART", constraints: "one of {MUSIC, ART}" }
      - { name: credential, type: string, source: input, description: "License/board credential, e.g. MT-BC or ATR-BC" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client (patient/student) name" }
      - { name: dob, type: string, source: input, description: "Date of birth (YYYY-MM-DD)" }
      - { name: payer_type, type: enum, source: input, description: "INSURANCE | SELF_PAY", constraints: "one of {INSURANCE, SELF_PAY}" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income in cents; required for SELF_PAY sliding scale", constraints: ">= 0" }
      - { name: household_size, type: integer, source: input, default: 1, description: "Persons in household; used by sliding scale FPL", constraints: ">= 1" }
      - { name: insurance_payer_name, type: string, source: input, description: "Payer name (INSURANCE only)" }
      - { name: insurance_coinsurance_pct, type: number, source: input, default: 0.20, description: "Client coinsurance fraction (INSURANCE only)", constraints: "0.0 <= x <= 1.0" }
      - { name: insurance_contracted_rate_cents, type: integer, source: input, description: "Estimated in-network allowed amount used for the ESTIMATED superbill variant (INSURANCE only)", constraints: ">= 0" }
      - { name: insurance_visits_authorized, type: integer, source: input, default: 0, description: "Authorized insurance visits (INSURANCE only)", constraints: ">= 0" }
      - { name: insurance_visits_used, type: integer, source: computed, default: 0, description: "Visits consumed by BILLED insurance superbills; ++ on superbill create, -- on superbill void" }
      - { name: insurance_visits_remaining, type: integer, source: computed, description: "= insurance_visits_authorized - insurance_visits_used" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE -> ACTIVE -> DISCHARGED", constraints: "one of {INTAKE, ACTIVE, DISCHARGED}" }
      - { name: discharge_reason, type: string, source: input, description: "Reason captured at discharge (optional)" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: referral_source, type: string, source: input, description: "Who referred (school, physician, self)" }
      - { name: reason, type: string, source: input, description: "Presenting reason" }
      - { name: referred_discipline, type: enum, source: input, description: "MUSIC | ART", constraints: "one of {MUSIC, ART}" }
      - { name: assessed_by_therapist_id, type: string, source: system, description: "FK -> Therapist.id; set on assess (acting Therapist)" }
      - { name: recommendation, type: enum, source: input, description: "Set on assess: THERAPY_RECOMMENDED | NOT_APPROPRIATE", constraints: "one of {THERAPY_RECOMMENDED, NOT_APPROPRIATE}" }
      - { name: baseline_score, type: integer, source: input, description: "Assessment baseline (0-100), set on assess", constraints: "0 <= x <= 100" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED -> ASSESSED -> CONVERTED / DECLINED", constraints: "one of {RECEIVED, ASSESSED, CONVERTED, DECLINED}" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id" }
      - { name: discipline, type: enum, source: input, description: "MUSIC | ART", constraints: "one of {MUSIC, ART}" }
      - { name: weekly_frequency, type: integer, source: input, description: "Planned sessions per week", constraints: ">= 1" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Incremented each ACTIVE -> UNDER_REVISION transition" }
      - { name: revision_note, type: string, source: input, description: "Note captured on revise (optional)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE <-> UNDER_REVISION; -> DISCHARGED / SUPERSEDED", constraints: "one of {DRAFT, ACTIVE, UNDER_REVISION, DISCHARGED, SUPERSEDED}" }

  - name: Goal
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id" }
      - { name: description, type: string, source: input, description: "Goal statement" }
      - { name: target_sessions, type: integer, source: input, description: "Attended sessions targeted to meet the goal", constraints: ">= 1" }
      - { name: weight, type: number, source: input, description: "Relative weight of goal within plan", constraints: "0.0 < x <= 1.0" }
      - { name: progress_attendance, type: number, source: computed, default: 0.0, description: "= min(1.0, attended_session_count / target_sessions), 2dp" }
      - { name: progress_rubric, type: number, source: computed, default: 0.0, description: "= mean(rubric_score of SIGNED progress notes on this goal)/100, 2dp; 0.0 when none" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> MET / DISCONTINUED", constraints: "one of {OPEN, MET, DISCONTINUED}" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent occupants (room-level)", constraints: ">= 1" }

  - name: MaterialItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Instrument or art-supply name" }
      - { name: category, type: enum, source: input, description: "INSTRUMENT | ART_SUPPLY", constraints: "one of {INSTRUMENT, ART_SUPPLY}" }
      - { name: on_hand_quantity, type: integer, source: input, description: "Total units owned (conserved quantity)", constraints: ">= 0" }
      - { name: reserved_quantity, type: integer, source: computed, default: 0, description: "Units reserved by SCHEDULED sessions" }
      - { name: available_quantity, type: integer, source: computed, description: "= on_hand_quantity - reserved_quantity (invariant: never < 0)" }
      - { name: unit_charge_cents, type: integer, source: input, description: "Per-unit materials charge used in superbill materials component", constraints: ">= 0" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: party_name, type: string, source: input, description: "Facility or school name" }
      - { name: contract_type, type: enum, source: input, description: "FACILITY | SCHOOL", constraints: "one of {FACILITY, SCHOOL}" }
      - { name: budget_cents, type: integer, source: input, description: "Total contract budget in cents", constraints: ">= 0" }
      - { name: rate_cents_per_session, type: integer, source: input, description: "Amount charged to the contract per delivered session", constraints: ">= 0" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "= rate_cents_per_session * count(non-CANCELLED sessions on this contract); ++ on session create, -- on session cancel" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: goal_id, type: string, source: input, description: "FK -> Goal.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; optional. When set, the session is charged to the contract budget (not superbilled)." }
      - { name: material_item_id, type: string, source: input, description: "FK -> MaterialItem.id; optional instrument/supply reserved for the session" }
      - { name: material_qty, type: integer, source: input, default: 0, description: "Units of material_item reserved (0 when no material)", constraints: ">= 0" }
      - { name: modality, type: enum, source: input, description: "INDIVIDUAL | GROUP", constraints: "one of {INDIVIDUAL, GROUP}" }
      - { name: start_utc, type: datetime, source: input, description: "Session start (ISO8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Session end (ISO8601 UTC); must be > start_utc" }
      - { name: capacity, type: integer, source: input, default: 1, description: "Max enrollments; INDIVIDUAL defaults to 1", constraints: ">= 1" }
      - { name: attended_count, type: integer, source: computed, default: 0, description: "Count of enrollments marked ATTENDED at completion" }
      - { name: scheduling_status, type: enum, source: system, default: SCHEDULED, description: "AXIS 1: SCHEDULED -> COMPLETED / NO_SHOW / CANCELLED", constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "AXIS 2 (independent): UNBILLED -> BILLED -> ADJUDICATED; void reverts to UNBILLED", constraints: "one of {UNBILLED, BILLED, ADJUDICATED}" }

  - name: Enrollment
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED -> ATTENDED / NO_SHOW / CANCELLED", constraints: "one of {ENROLLED, ATTENDED, NO_SHOW, CANCELLED}" }

  - name: ProgressNote
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: narrative, type: string, source: input, description: "Clinical narrative" }
      - { name: rubric_score, type: integer, source: input, description: "Structured outcome rubric (0-100), feeds Goal.progress_rubric when SIGNED", constraints: "0 <= x <= 100" }
      - { name: outcome_rating, type: enum, source: input, description: "IMPROVED | MAINTAINED | DECLINED", constraints: "one of {IMPROVED, MAINTAINED, DECLINED}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SIGNED (terminal)", constraints: "one of {DRAFT, SIGNED}" }

  - name: Superbill
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id (must be COMPLETED)" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id (must be an ATTENDED enrollee of the session)" }
      - { name: payer_type, type: enum, source: computed, description: "Copied from Client.payer_type at create", constraints: "one of {INSURANCE, SELF_PAY}" }
      - { name: coinsurance_pct, type: number, source: computed, description: "Copied from Client.insurance_coinsurance_pct at create (INSURANCE)" }
      - { name: therapy_charge_cents, type: integer, source: computed, description: "INDIVIDUAL_RATE_CENTS or GROUP_RATE_CENTS by session.modality" }
      - { name: materials_charge_cents, type: integer, source: computed, description: "session.material_qty * MaterialItem.unit_charge_cents (0 when none)" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "= therapy_charge_cents + materials_charge_cents" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "ESTIMATED variant: = min(therapy_charge_cents, Client.insurance_contracted_rate_cents) + materials_charge_cents. FINAL variant: = adjudicate remittance allowed_amount_cents" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "See calc superbill_patient_responsibility (variant-dependent)" }
      - { name: plan_paid_cents, type: integer, source: computed, description: "INSURANCE: allowed_amount_cents - patient_responsibility_cents. SELF_PAY: 0" }
      - { name: adjustment_cents, type: integer, source: computed, default: 0, description: "INSURANCE FINAL: billed_amount_cents - allowed_amount_cents. SELF_PAY: billed_amount_cents - patient_responsibility_cents (sliding-scale write-off)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> ADJUDICATED; SUBMITTED/ADJUDICATED -> VOIDED (terminal)", constraints: "one of {SUBMITTED, ADJUDICATED, VOIDED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [CONVERTED, DECLINED]
    transitions:
      - from: RECEIVED
        to: ASSESSED
        trigger: "POST /referrals/{id}/assess (recommendation=THERAPY_RECOMMENDED)"
        actor: Therapist
        preconditions: ["referral.status == RECEIVED"]
        side_effects:
          - "assessed_by_therapist_id = acting Therapist (X-User-ID)"
          - "recommendation, baseline_score recorded"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /referrals/{id}/assess (recommendation=NOT_APPROPRIATE)"
        actor: Therapist
        preconditions: ["referral.status == RECEIVED"]
        side_effects:
          - "assessed_by_therapist_id = acting Therapist (X-User-ID)"
          - "recommendation=NOT_APPROPRIATE, baseline_score recorded"
        note: "Branching fork: assess routes RECEIVED to ASSESSED or DECLINED based on recommendation."
      - from: ASSESSED
        to: CONVERTED
        trigger: "POST /clients/{id}/treatment-plans (referral_id = this referral)"
        actor: ClinicalDirector
        preconditions: ["referral.status == ASSESSED", "referral.recommendation == THERAPY_RECOMMENDED"]
        side_effects: ["referral.status = CONVERTED"]

  - entity: Client
    initial_state: INTAKE
    terminal_states: [DISCHARGED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate (bubble-up when client's first plan activates)"
        actor: ClinicalDirector
        preconditions: ["client.status == INTAKE"]
        side_effects: ["client.status = ACTIVE"]
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /clients/{id}/discharge"
        actor: ClinicalDirector
        preconditions: ["client.status == ACTIVE"]
        side_effects:
          - "CASCADE L1: client's ACTIVE or UNDER_REVISION TreatmentPlan -> DISCHARGED"
          - "discharge_reason recorded"
        note: "Root of the discharge cascade (see TreatmentPlan/Goal/Session below)."

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [DISCHARGED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate"
        actor: ClinicalDirector
        preconditions: ["plan.status == DRAFT"]
        side_effects:
          - "plan.status = ACTIVE"
          - "if owning Client.status == INTAKE: Client -> ACTIVE"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /treatment-plans/{id}/revise"
        actor: ClinicalDirector
        preconditions: ["plan.status == ACTIVE"]
        side_effects: ["plan.status = UNDER_REVISION", "revision_count += 1", "revision_note recorded"]
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate"
        actor: ClinicalDirector
        preconditions: ["plan.status == UNDER_REVISION"]
        side_effects: ["plan.status = ACTIVE"]
        note: "Revision cycle: ACTIVE <-> UNDER_REVISION (cyclic shape)."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /clients/{id}/treatment-plans (a newer plan is created for the same client)"
        actor: ClinicalDirector
        preconditions: []
        side_effects: ["plan.status = SUPERSEDED"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /clients/{id}/treatment-plans (a newer plan is created for the same client)"
        actor: ClinicalDirector
        preconditions: []
        side_effects: ["plan.status = SUPERSEDED", "increments Client.version by 1"]
        note: "Supersede-on-create; OCC on Client.version guards a stale creator (see §1.2.1)."
      - from: ACTIVE
        to: DISCHARGED
        trigger: "system (discharge cascade from Client)"
        actor: system
        preconditions: ["parent Client transitioning to DISCHARGED"]
        side_effects:
          - "CASCADE L2: each OPEN Goal of this plan -> DISCONTINUED"
      - from: UNDER_REVISION
        to: DISCHARGED
        trigger: "system (discharge cascade from Client)"
        actor: system
        preconditions: ["parent Client transitioning to DISCHARGED"]
        side_effects:
          - "CASCADE L2: each OPEN Goal of this plan -> DISCONTINUED"

  - entity: Goal
    initial_state: OPEN
    terminal_states: [MET, DISCONTINUED]
    transitions:
      - from: OPEN
        to: MET
        trigger: "system (on POST /sessions/{id}/complete when progress_attendance reaches 1.0)"
        actor: system
        preconditions: ["goal.status == OPEN", "progress_attendance >= 1.0 after recompute"]
        side_effects: ["goal.status = MET"]
      - from: OPEN
        to: DISCONTINUED
        trigger: "system (discharge cascade from TreatmentPlan)"
        actor: system
        preconditions: ["owning TreatmentPlan transitioning to DISCHARGED"]
        side_effects:
          - "goal.status = DISCONTINUED"
          - "CASCADE L3: each SCHEDULED Session with goal_id == this goal -> CANCELLED (drives L4/L5 below)"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      # ---- AXIS 1: scheduling_status ----
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete (attended_client_ids non-empty)"
        actor: Therapist
        preconditions:
          - "session.scheduling_status == SCHEDULED"
          - "current_utc >= session.start_utc"
          - "every id in attended_client_ids is an ENROLLED enrollee of this session"
        side_effects:
          - "each attended Enrollment -> ATTENDED; each other ENROLLED Enrollment -> NO_SHOW"
          - "attended_count = size(attended set)"
          - "release material reservation: MaterialItem.reserved_quantity -= material_qty (available_quantity recomputed)"
          - "recompute Goal.progress_attendance for session.goal_id; if >= 1.0 then Goal -> MET"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sessions/{id}/complete (attended_client_ids empty)"
        actor: Therapist
        preconditions: ["session.scheduling_status == SCHEDULED", "current_utc >= session.start_utc"]
        side_effects:
          - "all ENROLLED Enrollments -> NO_SHOW"
          - "release material reservation: MaterialItem.reserved_quantity -= material_qty"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel (or system discharge cascade)"
        actor: Therapist
        preconditions: ["session.scheduling_status == SCHEDULED"]
        side_effects:
          - "CASCADE L4: all non-terminal Enrollments -> CANCELLED"
          - "CASCADE L5: release material reservation: MaterialItem.reserved_quantity -= material_qty"
          - "if contract_id set: Contract.spent_cents -= rate_cents_per_session"
      # ---- AXIS 2: billing_status (independent of AXIS 1) ----
      - from: UNBILLED
        to: BILLED
        trigger: "POST /superbills (session_id = this session)"
        actor: BillingSpecialist
        preconditions: ["session.scheduling_status == COMPLETED", "session.billing_status == UNBILLED"]
        side_effects:
          - "a Superbill is created (SUBMITTED)"
          - "if client.payer_type == INSURANCE: Client.insurance_visits_used += 1"
        note: "billing_status axis evolves independently of scheduling_status."
      - from: BILLED
        to: ADJUDICATED
        trigger: "POST /superbills/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions: ["session.billing_status == BILLED"]
        side_effects: ["FINAL variant recomputed on the linked Superbill"]
      - from: BILLED
        to: UNBILLED
        trigger: "POST /superbills/{id}/void"
        actor: BillingSpecialist
        preconditions: ["session.billing_status == BILLED"]
        side_effects:
          - "linked Superbill -> VOIDED"
          - "if client.payer_type == INSURANCE: Client.insurance_visits_used -= 1"
      - from: ADJUDICATED
        to: UNBILLED
        trigger: "POST /superbills/{id}/void"
        actor: BillingSpecialist
        preconditions: ["session.billing_status == ADJUDICATED"]
        side_effects:
          - "linked Superbill -> VOIDED"
          - "if client.payer_type == INSURANCE: Client.insurance_visits_used -= 1"

  - entity: Superbill
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /superbills/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions: ["superbill.status == SUBMITTED"]
        side_effects:
          - "allowed_amount_cents = remittance allowed_amount_cents"
          - "patient_responsibility_cents, plan_paid_cents, adjustment_cents recomputed (FINAL)"
          - "linked Session.billing_status = ADJUDICATED"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /superbills/{id}/void"
        actor: BillingSpecialist
        preconditions: ["superbill.status == SUBMITTED"]
        side_effects:
          - "CASCADE: linked Session.billing_status -> UNBILLED; if INSURANCE, Client.insurance_visits_used -= 1"
      - from: ADJUDICATED
        to: VOIDED
        trigger: "POST /superbills/{id}/void"
        actor: BillingSpecialist
        preconditions: ["superbill.status == ADJUDICATED"]
        side_effects:
          - "CASCADE: linked Session.billing_status -> UNBILLED; if INSURANCE, Client.insurance_visits_used -= 1"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "system (session complete; client in attended_client_ids)"
        actor: system
        preconditions: ["enrollment.status == ENROLLED"]
        side_effects: []
      - from: ENROLLED
        to: NO_SHOW
        trigger: "system (session complete; client not attended)"
        actor: system
        preconditions: ["enrollment.status == ENROLLED"]
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "system (session cancel / discharge cascade)"
        actor: system
        preconditions: ["enrollment.status == ENROLLED"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/treatment-plans"
    occ_field: "expected_client_version"
    description: |
      Creating a new TreatmentPlan supersedes the client's current ACTIVE plan
      (that older plan transitions to SUPERSEDED and Client.version advances by 1).
      A create whose expected_client_version no longer matches the client's
      current version is rejected as stale: the creator's view of the client
      predates a plan another writer already created and superseded against.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sliding_scale_fee
    trigger: "POST /superbills for a SELF_PAY client (patient_responsibility for the visit)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs, tiered selection + nested min/max.
      fpl = FPL_BASE_CENTS + FPL_PER_PERSON_CENTS * (household_size - 1)
      ratio = household_income_cents / fpl                # real division
      if   ratio <= 1.50: discount = 0.75
      elif ratio <= 2.50: discount = 0.50
      elif ratio <= 4.00: discount = 0.25
      else:               discount = 0.00
      base = INDIVIDUAL_RATE_CENTS if modality == INDIVIDUAL else GROUP_RATE_CENTS
      fee  = round_half_up(base * (1 - discount))
      fee  = max(MIN_FEE_CENTS, min(fee, base))
    input_set: "Single Client + the session's modality; no cross-row aggregation."
    constants:
      FPL_BASE_CENTS: 1560000
      FPL_PER_PERSON_CENTS: 550000
      INDIVIDUAL_RATE_CENTS: 12503
      GROUP_RATE_CENTS: 6503
      MIN_FEE_CENTS: 2000
    precision: "cents, round_half_up; ratio compared with exact real division at band boundaries"

  - name: superbill_patient_responsibility
    trigger: "POST /superbills (ESTIMATED); POST /superbills/{id}/adjudicate (FINAL)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): multi-component rounding — ROUND PER COMPONENT, THEN SUM.
      # therapy component and materials component are each rounded to whole cents
      # BEFORE summing. Summing raw then rounding once is explicitly NOT the rule.
      therapy_charge   = INDIVIDUAL_RATE_CENTS if modality == INDIVIDUAL else GROUP_RATE_CENTS
      materials_charge = material_qty * MaterialItem.unit_charge_cents
      billed           = therapy_charge + materials_charge
      # INSURANCE:
      pr = round_half_up(therapy_component_allowed * coinsurance_pct)
         + round_half_up(materials_component_allowed * coinsurance_pct)
      # where, ESTIMATED: therapy_component_allowed   = min(therapy_charge, insurance_contracted_rate_cents)
      #                   materials_component_allowed = materials_charge
      #        FINAL:     total allowed = remittance allowed_amount_cents,
      #                   split pro-rata across components by charge, each rounded then summed
    input_set: "Single Superbill's own components; INSURANCE path only (SELF_PAY uses sliding_scale_fee)."
    constants:
      INDIVIDUAL_RATE_CENTS: 12503
      GROUP_RATE_CENTS: 6503
    precision: "cents, round_half_up, per component before summation"
    variants:
      - name: estimated
        when: "at superbill create (status SUBMITTED, INSURANCE)"
        difference: "therapy allowed capped at insurance_contracted_rate_cents, materials allowed = charge; pr = sum of per-component round(allowed*coins); plan_paid = allowed - pr"
      - name: final
        when: "at adjudicate (status ADJUDICATED, INSURANCE)"
        difference: "allowed_amount_cents = remittance allowed_amount_cents; adjustment = billed - allowed; pr recomputed from allowed; plan_paid = allowed - pr"

  - name: goal_progress
    trigger: "POST /sessions/{id}/complete (attendance variant); POST /progress-notes/{id}/sign (rubric variant)"
    algorithm: weighted_scoring
    formula: |
      # attendance variant:
      attended_session_count = count(distinct Session s where s.goal_id == goal.id
                                      AND s.scheduling_status == COMPLETED
                                      AND EXISTS Enrollment e (e.session_id==s.id
                                          AND e.client_id in plan client set AND e.status==ATTENDED))
      progress_attendance = round_half_up_2dp( min(1.0, attended_session_count / target_sessions) )
      # rubric variant:
      notes = ProgressNote n where n.status==SIGNED
              AND n.enrollment -> session.goal_id == goal.id
      progress_rubric = 0.0 if notes empty
                        else round_half_up_2dp( mean(n.rubric_score for n in notes) / 100 )
    input_set: "Sessions/notes tied to the goal; COMPLETED+ATTENDED for attendance; SIGNED for rubric."
    precision: "2 decimal places, round_half_up; empty rubric set -> 0.0"
    variants:
      - name: attendance_based
        when: "operational throughput view (auto-MET trigger uses this at >= 1.0)"
        difference: "counts completed+attended sessions vs target_sessions"
      - name: rubric_weighted
        when: "clinical outcome view (signed progress notes)"
        difference: "mean of signed rubric scores; diverges from attendance for identical session history"

  - name: contract_budget_check
    trigger: "POST /sessions when contract_id is set"
    algorithm: threshold
    formula: |
      projected = Contract.spent_cents + Contract.rate_cents_per_session
      if projected > Contract.budget_cents: reject ERR_CONTRACT_BUDGET_EXCEEDED
      else: Contract.spent_cents = projected   # reserved at scheduling
    input_set: "Single Contract; spent counts non-CANCELLED sessions on the contract."
    precision: "integer cents; boundary is strict > (equal-to-budget is allowed)"

  - name: instrument_availability
    trigger: "POST /sessions (reserve); complete/cancel (release)"
    algorithm: aggregation
    formula: |
      # Conservation invariant: available_quantity + reserved_quantity == on_hand_quantity (always).
      reserve: if material_qty > available_quantity -> ERR_INSUFFICIENT_MATERIAL
               else reserved_quantity += material_qty
      release: reserved_quantity -= material_qty
      available_quantity = on_hand_quantity - reserved_quantity
    input_set: "Single MaterialItem."
    precision: "integer units; available_quantity never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: "ERR_*_NOT_FOUND (per entity)"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "Ownership: acting Therapist (X-User-ID) equals session.therapist_id for session write/complete/cancel/enroll/note"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sessions, /sessions/{id}/complete, /sessions/{id}/cancel, /sessions/{id}/enrollments, /enrollments/{id}/progress-notes"
  - priority: 5
    category: business_constraint
    check: "Required body fields present, types valid, enum members valid, end_utc > start_utc, numeric ranges"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_client_version equals current Client.version on plan create"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/treatment-plans"
  - priority: 7
    category: state
    check: "Target resource is in a state that permits the transition (assess/activate/revise/complete/cancel/superbill/adjudicate/void); superbill requires session.scheduling_status == COMPLETED"
    error_id: "ERR_REFERRAL_INVALID_STATE / ERR_PLAN_INVALID_STATE / ERR_SESSION_INVALID_STATE / ERR_SUPERBILL_INVALID_STATE / ERR_SESSION_NOT_COMPLETED"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 8
    category: state
    check: "Cross-entity gate: scheduling a Session requires the referenced TreatmentPlan.status == ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 9
    category: business_referential
    check: "Referential coherence: session.goal_id belongs to session.plan_id; enrolled client not already enrolled in the session"
    error_id: "ERR_GOAL_PLAN_MISMATCH / ERR_CLIENT_ALREADY_ENROLLED"
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/enrollments"
  - priority: 10
    category: business_temporal
    check: "Therapist calendar: half-open [start,end) overlap with another non-CANCELLED session for the same therapist (adjacency at the boundary is allowed)"
    error_id: ERR_THERAPIST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 11
    category: business_temporal
    check: "Room calendar: another non-CANCELLED session in the same room within TURNAROUND_BUFFER_MINUTES of this interval (buffer-expanded overlap)"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 12
    category: business_constraint
    check: "Group capacity: enrolled (non-CANCELLED) count would reach session.capacity"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /sessions/{id}/enrollments"
  - priority: 13
    category: business_constraint
    check: "Material availability: material_qty <= MaterialItem.available_quantity"
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 14
    category: business_fiscal
    check: "Contract budget: spent_cents + rate_cents_per_session <= budget_cents (strict > rejects)"
    error_id: ERR_CONTRACT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /sessions (contract sessions)"
  - priority: 15
    category: business_fiscal
    check: "Authorization: for INSURANCE superbill, insurance_visits_remaining >= 1"
    error_id: ERR_AUTH_VISITS_EXHAUSTED
    http_status: 402
    applies_to: "POST /superbills"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (used before any set call; never falls back to wall-clock)."
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["current_utc = to_iso8601"]

  # ---- Therapist ----
  - method: POST
    path: "/therapists"
    description: "Register a therapist"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, discipline, credential]
    output: Therapist
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a client (intake)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, dob, payer_type, "household_income_cents?", "household_size?", "insurance_payer_name?", "insurance_coinsurance_pct?", "insurance_contracted_rate_cents?", "insurance_visits_authorized?"]
    output: Client
    side_effects: ["status=INTAKE", "insurance_visits_used=0", "insurance_visits_remaining=insurance_visits_authorized", "version=1"]
  - method: GET
    path: "/clients/{id}"
    description: "Get a client (status, version, visit counters)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/discharge"
    description: "Discharge a client; cascades to plan/goals/sessions/enrollments/materials"
    roles: [ClinicalDirector]
    code: 200
    input: ["discharge_reason?"]
    output: Client
    side_effects:
      - "client.status -> DISCHARGED"
      - "CASCADE: ACTIVE/UNDER_REVISION plan -> DISCHARGED -> OPEN goals -> DISCONTINUED -> SCHEDULED sessions -> CANCELLED -> enrollments -> CANCELLED + material reservations released + contract spend released"

  # ---- Referral ----
  - method: POST
    path: "/referrals"
    description: "Create a referral for a client"
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id, referral_source, reason, referred_discipline]
    output: Referral
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/referrals"
    description: "List referrals (reverse-reachability for client_id and assessed_by_therapist_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["client_id?", "assessed_by_therapist_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral (status, recommendation)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/referrals/{id}/assess"
    description: "Record assessment; forks to ASSESSED (recommended) or DECLINED (not appropriate)"
    roles: [Therapist]
    code: 200
    input: [recommendation, baseline_score]
    output: Referral
    side_effects: ["assessed_by_therapist_id = X-User-ID", "status -> ASSESSED | DECLINED"]

  # ---- TreatmentPlan ----
  - method: POST
    path: "/clients/{id}/treatment-plans"
    description: "Create a treatment plan (supersedes prior ACTIVE plan; OCC on client version)"
    roles: [ClinicalDirector]
    code: 201
    input: [referral_id, discipline, weekly_frequency, expected_client_version]
    output: TreatmentPlan
    side_effects:
      - "plan.status=DRAFT"
      - "referral (if ASSESSED & recommended) -> CONVERTED"
      - "prior ACTIVE plan of client -> SUPERSEDED (if any)"
      - "increments Client.version by 1"
  - method: GET
    path: "/treatment-plans"
    description: "List treatment plans (reverse-reachability for client_id and referral_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["client_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []
  - method: GET
    path: "/treatment-plans/{id}"
    description: "Get a treatment plan (status, revision_count)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: POST
    path: "/treatment-plans/{id}/activate"
    description: "Activate a plan (DRAFT or UNDER_REVISION -> ACTIVE)"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["plan.status=ACTIVE", "if owning Client INTAKE -> ACTIVE"]
  - method: POST
    path: "/treatment-plans/{id}/revise"
    description: "Open a plan for revision (ACTIVE -> UNDER_REVISION)"
    roles: [ClinicalDirector]
    code: 200
    input: ["revision_note?"]
    output: TreatmentPlan
    side_effects: ["plan.status=UNDER_REVISION", "revision_count += 1"]

  # ---- Goal ----
  - method: POST
    path: "/treatment-plans/{id}/goals"
    description: "Add a goal to a plan"
    roles: [ClinicalDirector]
    code: 201
    input: [description, target_sessions, weight]
    output: Goal
    side_effects: ["status=OPEN", "progress_attendance=0.0", "progress_rubric=0.0"]
  - method: GET
    path: "/treatment-plans/{id}/goals"
    description: "List goals of a plan (reverse-reachability for Goal.plan_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Goal[]
    side_effects: []

  # ---- Room ----
  - method: POST
    path: "/rooms"
    description: "Create a room"
    roles: [IntakeCoordinator]
    code: 201
    input: [name, capacity]
    output: Room
    side_effects: []

  # ---- MaterialItem ----
  - method: POST
    path: "/materials"
    description: "Create a material (instrument or art supply)"
    roles: [IntakeCoordinator]
    code: 201
    input: [name, category, on_hand_quantity, unit_charge_cents]
    output: MaterialItem
    side_effects: ["reserved_quantity=0", "available_quantity=on_hand_quantity"]
  - method: GET
    path: "/materials/{id}"
    description: "Get a material (available/reserved quantities)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: MaterialItem
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/contracts"
    description: "Create a facility/school contract"
    roles: [IntakeCoordinator]
    code: 201
    input: [party_name, contract_type, budget_cents, rate_cents_per_session]
    output: Contract
    side_effects: ["spent_cents=0"]

  # ---- Session ----
  - method: POST
    path: "/sessions"
    description: "Schedule a session (reserves therapist+room calendar and any material)"
    roles: [Therapist]
    code: 201
    input: [therapist_id, room_id, plan_id, goal_id, modality, start_utc, end_utc, "capacity?", "material_item_id?", "material_qty?", "contract_id?"]
    output: Session
    side_effects:
      - "scheduling_status=SCHEDULED, billing_status=UNBILLED"
      - "if material_item_id set: MaterialItem.reserved_quantity += material_qty"
      - "if contract_id set: Contract.spent_cents += rate_cents_per_session"
  - method: GET
    path: "/sessions/{id}"
    description: "Get a session"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: GET
    path: "/sessions"
    description: "List sessions (reverse-reachability for therapist/room/plan/goal/material/contract FKs)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["therapist_id?", "room_id?", "plan_id?", "goal_id?", "material_item_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: POST
    path: "/sessions/{id}/complete"
    description: "Complete a session; marks attendance, releases materials, updates goal progress"
    roles: [Therapist]
    code: 200
    input: ["attended_client_ids?"]
    output: Session
    side_effects:
      - "scheduling_status -> COMPLETED (>=1 attended) or NO_SHOW (0 attended)"
      - "enrollments -> ATTENDED/NO_SHOW; attended_count set"
      - "MaterialItem.reserved_quantity -= material_qty"
      - "Goal.progress_attendance recomputed; Goal -> MET if >= 1.0"
  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a scheduled session (releases reservations)"
    roles: [Therapist]
    code: 200
    input: ["cancel_reason?"]
    output: Session
    side_effects:
      - "scheduling_status -> CANCELLED"
      - "enrollments -> CANCELLED"
      - "MaterialItem.reserved_quantity -= material_qty"
      - "if contract_id set: Contract.spent_cents -= rate_cents_per_session"
  - method: POST
    path: "/sessions/{id}/enrollments"
    description: "Enroll a client into a session (individual=1, group up to capacity)"
    roles: [Therapist]
    code: 201
    input: [client_id]
    output: Enrollment
    side_effects: ["status=ENROLLED"]

  # ---- Enrollment ----
  - method: GET
    path: "/enrollments"
    description: "List enrollments (reverse-reachability for Enrollment.client_id and session_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["client_id?", "session_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment (status)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  # ---- ProgressNote ----
  - method: POST
    path: "/enrollments/{id}/progress-notes"
    description: "Write a progress note for an enrollment"
    roles: [Therapist]
    code: 201
    input: [narrative, rubric_score, outcome_rating]
    output: ProgressNote
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/enrollments/{id}/progress-notes"
    description: "List progress notes of an enrollment (reverse-reachability for ProgressNote.enrollment_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: ProgressNote[]
    side_effects: []
  - method: POST
    path: "/progress-notes/{id}/sign"
    description: "Sign a progress note (DRAFT -> SIGNED); feeds goal rubric progress"
    roles: [Therapist]
    code: 200
    input: []
    output: ProgressNote
    side_effects: ["status=SIGNED", "recompute Goal.progress_rubric for the note's goal"]

  # ---- Superbill ----
  - method: POST
    path: "/superbills"
    description: "Create a superbill for a completed session's attended client (ESTIMATED variant)"
    roles: [BillingSpecialist]
    code: 201
    input: [session_id, client_id]
    output: Superbill
    side_effects:
      - "status=SUBMITTED; charges + ESTIMATED patient_responsibility computed"
      - "linked Session.billing_status -> BILLED"
      - "if client INSURANCE: Client.insurance_visits_used += 1"
  - method: GET
    path: "/superbills"
    description: "List superbills (reverse-reachability for client_id and session_id)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["client_id?", "session_id?", "status?", "limit?", "offset?"]
    output: Superbill[]
    side_effects: []
  - method: GET
    path: "/superbills/{id}"
    description: "Get a superbill (charges, patient_responsibility, status)"
    roles: [IntakeCoordinator, Therapist, ClinicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: Superbill
    side_effects: []
  - method: POST
    path: "/superbills/{id}/adjudicate"
    description: "Post remittance; recompute FINAL variant"
    roles: [BillingSpecialist]
    code: 200
    input: [allowed_amount_cents]
    output: Superbill
    side_effects: ["status -> ADJUDICATED", "FINAL patient_responsibility/plan_paid/adjustment computed", "linked Session.billing_status -> ADJUDICATED"]
  - method: POST
    path: "/superbills/{id}/void"
    description: "Void a superbill (reverts billing; refunds insurance visit)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Superbill
    side_effects:
      - "status -> VOIDED"
      - "linked Session.billing_status -> UNBILLED"
      - "if client INSURANCE: Client.insurance_visits_used -= 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED,           http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "Acting Therapist is not session.therapist_id" }
  - { id: ERR_VALIDATION,             http: 422, condition: "Missing/invalid field, bad enum member, or end_utc <= start_utc" }
  - { id: ERR_CLIENT_NOT_FOUND,       http: 404, condition: "clientId / client_id does not exist" }
  - { id: ERR_THERAPIST_NOT_FOUND,    http: 404, condition: "therapist_id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND,     http: 404, condition: "referralId / referral_id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND,         http: 404, condition: "planId / plan_id does not exist" }
  - { id: ERR_GOAL_NOT_FOUND,         http: 404, condition: "goal_id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND,         http: 404, condition: "room_id does not exist" }
  - { id: ERR_MATERIAL_NOT_FOUND,     http: 404, condition: "materialId / material_item_id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND,     http: 404, condition: "contract_id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND,      http: 404, condition: "sessionId / session_id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND,   http: 404, condition: "enrollmentId does not exist" }
  - { id: ERR_SUPERBILL_NOT_FOUND,    http: 404, condition: "superbillId does not exist" }
  - { id: ERR_REFERRAL_INVALID_STATE, http: 409, condition: "Referral not in a state permitting assess/convert" }
  - { id: ERR_PLAN_INVALID_STATE,     http: 409, condition: "Plan not in a state permitting activate/revise" }
  - { id: ERR_PLAN_NOT_ACTIVE,        http: 409, condition: "Scheduling a session but the plan is not ACTIVE" }
  - { id: ERR_SESSION_INVALID_STATE,  http: 409, condition: "Session not in a state permitting complete/cancel, or completed before start_utc" }
  - { id: ERR_SESSION_NOT_COMPLETED,  http: 409, condition: "Superbill create but session.scheduling_status != COMPLETED" }
  - { id: ERR_SUPERBILL_INVALID_STATE,http: 409, condition: "Superbill not in a state permitting adjudicate/void" }
  - { id: ERR_GOAL_PLAN_MISMATCH,     http: 409, condition: "session.goal_id does not belong to session.plan_id" }
  - { id: ERR_CLIENT_ALREADY_ENROLLED,http: 409, condition: "Client already has a non-CANCELLED enrollment in the session" }
  - { id: ERR_SESSION_FULL,           http: 409, condition: "Non-CANCELLED enrollment count already equals session.capacity" }
  - { id: ERR_THERAPIST_UNAVAILABLE,  http: 409, condition: "Therapist has an overlapping [start,end) session" }
  - { id: ERR_ROOM_UNAVAILABLE,       http: 409, condition: "Room has a session within TURNAROUND_BUFFER_MINUTES" }
  - { id: ERR_AUTH_VISITS_EXHAUSTED,  http: 402, condition: "INSURANCE superbill but insurance_visits_remaining < 1" }
  - { id: ERR_CONTRACT_BUDGET_EXCEEDED,http: 402, condition: "Contract spent + rate would exceed budget" }
  - { id: ERR_INSUFFICIENT_MATERIAL,  http: 409, condition: "material_qty exceeds MaterialItem.available_quantity" }
  - { id: ERR_STALE_CLIENT_VERSION,   http: 412, condition: "expected_client_version != current Client.version on plan create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-office intake: registers therapists, clients, referrals, rooms, materials, contracts."
    identity: opaque
    exclusive_operations:
      - "POST /therapists"
      - "POST /clients"
      - "POST /referrals"
      - "POST /rooms"
      - "POST /materials"
      - "POST /contracts"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: Therapist
    description: "Clinician. Assesses referrals and owns/operates their own sessions and progress notes."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /referrals/{id}/assess"
      - "POST /sessions"
      - "POST /sessions/{id}/complete"
      - "POST /sessions/{id}/cancel"
      - "POST /sessions/{id}/enrollments"
      - "POST /enrollments/{id}/progress-notes"
      - "POST /progress-notes/{id}/sign"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: ClinicalDirector
    description: "Supervises plans of care; creates/activates/revises plans and goals; discharges clients."
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/treatment-plans"
      - "POST /clients/{id}/discharge"
      - "POST /treatment-plans/{id}/activate"
      - "POST /treatment-plans/{id}/revise"
      - "POST /treatment-plans/{id}/goals"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: BillingSpecialist
    description: "Revenue cycle: creates superbills, posts remittance (adjudicate), voids."
    identity: opaque
    exclusive_operations:
      - "POST /superbills"
      - "POST /superbills/{id}/adjudicate"
      - "POST /superbills/{id}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
