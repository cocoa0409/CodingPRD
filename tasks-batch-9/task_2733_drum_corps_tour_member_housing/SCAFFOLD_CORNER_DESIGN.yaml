  - section: state_machines
    instances:
      - name: zero_roster_show_stop_confirms_then_completes_with_snapshots
        claim_type: valid_transition
        grounds:
          - state_machines.TourStop.PLANNED_to_CONFIRMED
          - state_machines.TourStop.CONFIRMED_to_COMPLETED
          - calculations.transport_plan
        distinguishing_aspect: "The happy path through the stop machine on an empty roster: confirm must snapshot every derived field (head counts 0, required coverage 0, meal cost 0, trucks_required 1 from the max(...,1) floor) and complete must set settlement_state PENDING because stop_type == SHOW, with the clock exactly at depart_at."
        test_recipe:
          setup: ["One season with a single SHOW stop and no members at all."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Rockford Stadium", city: "Rockford", state_code: "IL", arrive_at: "2027-06-20T08:00:00Z", depart_at: "2027-06-20T23:00:00Z", show_start_at: "2027-06-20T19:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
          trigger:
            - call: "POST /tour-stops/${stop_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-20T23:00:00Z" }
              as: TourManager
            - call: "POST /tour-stops/${stop_id}/complete"
              payload: {}
              as: TourManager
          assert:
            - "the confirm returns 200 with TourStop.${stop_id}.status == CONFIRMED and version == 2"
            - "TourStop.${stop_id}.roster_head_count == 0 and minor_head_count == 0 and required_chaperone_count == 0 and required_cook_count == 0 and meal_cost_cents == 0"
            - "TourStop.${stop_id}.total_load_cuft == 0 and total_load_lbs == 0 and trucks_required == 1 (the max(volume, weight, 1) floor) and required_travel_minutes == 0"
            - "the complete returns 200 at a clock instant exactly equal to depart_at: TourStop.${stop_id}.status == COMPLETED and version == 3"
            - "TourStop.${stop_id}.settlement_state == PENDING because stop_type == SHOW"

      - name: newly_created_entities_start_in_their_declared_initial_states
