            - { call: "POST /taxpayers", payload: { full_name: "Taxpayer Three", ssn_token: "SSN-003", phone: "555-0103" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: PASSPORT }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
