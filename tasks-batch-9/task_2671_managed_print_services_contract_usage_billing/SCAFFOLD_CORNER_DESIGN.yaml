          setup:
            - "contract C1 whose MONO rate card holds exactly one band: tier 1 covering pages 1..1000 at 9375 micro-dollars"
            - "one ACTIVE device D1 and period P1 2026-08-01 .. 2026-09-01 with a single ACCEPTED read of 1500 mono pages"
