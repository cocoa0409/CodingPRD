    input: ["limit?", "offset?", "product_id?", "bom_id?", "gate_status?"]
    output: "ReleaseGate[]"
    side_effects: []

  - method: GET
    path: "/oss-products/remediation-plans"
    description: "List RemediationPlans with product_id, finding_id, target_component_id, or verification_scan_id filter"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "product_id?", "finding_id?", "target_component_id?", "verification_scan_id?", "status?"]
    output: "RemediationPlan[]"
    side_effects: []

  - method: GET
    path: "/oss-products/audit-engagements"
    description: "List AuditEngagements with product_id filter"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "product_id?", "status?"]
    output: "AuditEngagement[]"
    side_effects: []

errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Input Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error"

  - id: ERR_INVALID_DISTRIBUTION_MODEL
    http: 400
    condition: "distribution_model must be one of SaaS, ON_PREMISE, EMBEDDED, MOBILE_APP"

  - id: ERR_INVALID_SCAN_TOOL
    http: 400
    condition: "scan_tool must be one of SYFT, ORT, SCANCODE, FOSSOLOGY, COMMERCIAL_VENDOR_X"

  - id: ERR_INVALID_LICENSE_DECISION
    http: 400
    condition: "legal_decision must be APPROVE, REJECT, or CONDITIONAL"

  - id: ERR_INVALID_ENGINEERING_DECISION
    http: 400
    condition: "engineering_decision must be APPROVE or REJECT"

  - id: ERR_INVALID_PLAN_TYPE
    http: 400
    condition: "plan_type must be UPGRADE, REPLACE, PATCH, MITIGATE_CONFIG, or ACCEPT_RISK"

  - id: ERR_INCOMPATIBLE_LICENSE
    http: 400
    condition: "target_component_id has PROHIBITED or incompatible license for remediation"

  # --- Resource Not Found ---
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "Product not found"

  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "Component not found"

  - id: ERR_SCAN_NOT_FOUND
    http: 404
    condition: "DependencyScan not found"

  - id: ERR_BOM_NOT_FOUND
    http: 404
    condition: "BillOfMaterials not found"

  - id: ERR_BOM_ENTRY_NOT_FOUND
    http: 404
    condition: "BomEntry not found"

  - id: ERR_APPROVAL_REQUEST_NOT_FOUND
    http: 404
    condition: "LicenseApprovalRequest not found"

  - id: ERR_OBLIGATION_TICKET_NOT_FOUND
    http: 404
    condition: "ObligationTicket not found"

  - id: ERR_VULNERABILITY_NOT_FOUND
    http: 404
    condition: "Vulnerability not found"

  - id: ERR_VULNERABILITY_FINDING_NOT_FOUND
    http: 404
    condition: "VulnerabilityFinding not found"

  - id: ERR_RELEASE_GATE_NOT_FOUND
    http: 404
    condition: "ReleaseGate not found"

  - id: ERR_REMEDIATION_PLAN_NOT_FOUND
    http: 404
    condition: "RemediationPlan not found"

  - id: ERR_AUDIT_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "AuditEngagement not found"

  # --- State Constraints ---
  - id: ERR_PRODUCT_BLOCKED
    http: 409
    condition: "Operation requires Product not in BLOCKED posture"

  - id: ERR_SCAN_NOT_CANCELLABLE
    http: 409
    condition: "Scan must be in QUEUED or PARSING state to cancel"

  - id: ERR_BOM_NOT_FINALIZED
    http: 409
    condition: "Operation requires BOM in FINALIZED status"

  - id: ERR_BOM_NOT_ARCHIVABLE
    http: 409
    condition: "BOM has open ReleaseGates or no newer FINALIZED BOM exists"

  - id: ERR_REQUEST_NOT_PENDING
    http: 409
    condition: "LicenseApprovalRequest must be in PENDING state"

  - id: ERR_REQUEST_NOT_IN_LEGAL_REVIEW
    http: 409
    condition: "LicenseApprovalRequest must be in LEGAL_REVIEW state"

  - id: ERR_REQUEST_NOT_IN_ENGINEERING_REVIEW
    http: 409
    condition: "LicenseApprovalRequest must be in ENGINEERING_REVIEW state"

  - id: ERR_REQUEST_NOT_WITHDRAWABLE
    http: 409
    condition: "LicenseApprovalRequest cannot be withdrawn in current state"

  - id: ERR_TICKET_NOT_OPEN
    http: 409
    condition: "ObligationTicket must be OPEN"

  - id: ERR_TICKET_NOT_IN_PROGRESS
    http: 409
    condition: "ObligationTicket must be IN_PROGRESS"

  - id: ERR_TICKET_NOT_WAIVABLE
    http: 409
    condition: "ObligationTicket must be OPEN or IN_PROGRESS to waive"

  - id: ERR_FINDING_NOT_OPEN
    http: 409
    condition: "VulnerabilityFinding must be OPEN"

  - id: ERR_FINDING_NOT_CONFIRMED
    http: 409
    condition: "VulnerabilityFinding must be CONFIRMED"

  - id: ERR_FINDING_NOT_REMEDIABLE
    http: 409
    condition: "VulnerabilityFinding must be CONFIRMED or MITIGATED"

  - id: ERR_GATE_NOT_EVALUABLE
    http: 409
    condition: "ReleaseGate must be OPEN and BOM must be FINALIZED"

  - id: ERR_GATE_NOT_BYPASSABLE
    http: 409
    condition: "ReleaseGate must be EVALUATING and Product must not be BLOCKED"

  - id: ERR_PLAN_NOT_PROPOSED
    http: 409
    condition: "RemediationPlan must be PROPOSED"

  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "RemediationPlan must be APPROVED"

  - id: ERR_PLAN_NOT_IN_PROGRESS
    http: 409
    condition: "RemediationPlan must be IN_PROGRESS"

  - id: ERR_PLAN_NOT_ABANDONABLE
    http: 409
    condition: "RemediationPlan must be APPROVED or IN_PROGRESS"

  - id: ERR_ENGAGEMENT_NOT_INITIATED
    http: 409
    condition: "AuditEngagement must be INITIATED"

  - id: ERR_ENGAGEMENT_NOT_SCOPING
    http: 409
    condition: "AuditEngagement must be SCOPING"

  - id: ERR_ENGAGEMENT_NOT_DATA_COLLECTION
    http: 409
    condition: "AuditEngagement must be DATA_COLLECTION"

  - id: ERR_ENGAGEMENT_NOT_ANALYSIS
    http: 409
    condition: "AuditEngagement must be ANALYSIS"

  - id: ERR_ENGAGEMENT_NOT_REPORT_DRAFT
    http: 409
    condition: "AuditEngagement must be REPORT_DRAFT"

  - id: ERR_ENGAGEMENT_NOT_CANCELLABLE
    http: 409
    condition: "AuditEngagement must be INITIATED, SCOPING, or DATA_COLLECTION"

  # --- Compliance & Business Rules ---
  - id: ERR_PROHIBITED_COMPONENT
    http: 403
    condition: "Component has PROHIBITED classification and cannot be added without CISO waiver"

  - id: ERR_NOTICE_FILE_MISSING
    http: 409
    condition: "Release gate evaluation requires NOTICE file generated"

  - id: ERR_APPROVAL_EXPIRED
    http: 409
    condition: "LicenseApprovalRequest has expired and cannot be used"

  - id: ERR_CAPACITY_EXCEEDED
    http: 402
    condition: "RemediationPlan migration_effort_days exceeds available engineering capacity"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_version does not match current resource version (OCC conflict)"

  - id: ERR_SCAN_WORKER_ERROR
    http: 500
    condition: "Scan worker failed to process manifest"

  - id: ERR_LICENSE_SCAN_INCOMPLETE
    http: 422
    condition: "License scan coverage below threshold (80%) — cannot finalize BOM"

roles:
  - name: ComplianceAnalyst
    description: "Manages products, components, scans, BOMs, obligation tickets, and audit engagements"
    identity: opaque
    exclusive_operations:
      - "POST /oss-products — Create product"
      - "POST /oss-components — Create component"
      - "POST /oss-products/{id}/dependency-scans — Create scan"
      - "POST /oss-products/{id}/dependency-scans/{id}/cancel — Cancel scan"
      - "POST /oss-products/{id}/boms/{id}/generate-notice — Generate NOTICE file"
      - "POST /oss-products/{id}/boms/{id}/archive — Archive BOM"
      - "POST /oss-products/{id}/obligation-tickets/{id}/start — Start ticket"
      - "POST /oss-products/{id}/obligation-tickets/{id}/fulfill — Fulfill ticket"
      - "POST /oss-products/{id}/license-approvals/{id}/withdraw — Withdraw approval"
      - "POST /oss-products/{id}/audit-engagements — Create audit"
      - "POST /oss-products/{id}/audit-engagements/{id}/start-* — Advance audit"
      - "POST /oss-products/{id}/audit-engagements/{id}/draft-report — Draft report"
      - "POST /oss-products/{id}/audit-engagements/{id}/cancel — Cancel audit"

  - name: LegalCounsel
    description: "Reviews license classifications, approves restricted licenses, waives obligations, finalizes audit reports"
    identity: opaque
    exclusive_operations:
      - "POST /oss-components/{id}/override-classification — Override license classification"
      - "POST /oss-products/{id}/license-approvals/{id}/assign-legal — Assign legal review"
      - "POST /oss-products/{id}/license-approvals/{id}/legal-decision — Record legal decision"
      - "POST /oss-products/{id}/obligation-tickets/{id}/waive — Waive obligation"
      - "POST /oss-products/{id}/audit-engagements/{id}/finalize-report — Finalize audit report"

  - name: EngineeringManager
    description: "Approves remediation plans, makes engineering decisions on license approvals"
    identity: opaque
    exclusive_operations:
      - "POST /oss-products/{id}/license-approvals/{id}/engineering-decision — Record engineering decision"
      - "POST /oss-products/{id}/remediation-plans — Create remediation plan"
      - "POST /oss-products/{id}/remediation-plans/{id}/approve — Approve plan"
      - "POST /oss-products/{id}/remediation-plans/{id}/start — Start plan"
      - "POST /oss-products/{id}/remediation-plans/{id}/complete — Complete plan"
      - "POST /oss-products/{id}/remediation-plans/{id}/reject — Reject plan"
      - "POST /oss-products/{id}/remediation-plans/{id}/abandon — Abandon plan"

  - name: SecurityAnalyst
    description: "Manages vulnerabilities, confirms findings, verifies remediations"
    identity: opaque
    exclusive_operations:
      - "POST /oss-vulnerabilities — Register vulnerability"
      - "POST /oss-products/{id}/vulnerability-findings/{id}/confirm — Confirm finding"
      - "POST /oss-products/{id}/vulnerability-findings/{id}/mitigate — Mitigate finding"
      - "POST /oss-products/{id}/vulnerability-findings/{id}/verify-remediation — Verify remediation"
      - "POST /oss-products/{id}/vulnerability-findings/{id}/mark-false-positive — Mark false positive"

  - name: ReleaseManager
    description: "Manages release gates and evaluations"
    identity: opaque
    exclusive_operations:
      - "POST /oss-products/{id}/release-gates — Create release gate"
      - "POST /oss-products/{id}/release-gates/{id}/evaluate — Evaluate gate"

  - name: CISO
    description: "Chief Information Security Officer — approves risk acceptances, bypasses, and unblocks products"
    identity: opaque
    exclusive_operations:
      - "POST /oss-products/{id}/unblock — Unblock BLOCKED product"
      - "POST /oss-products/{id}/vulnerability-findings/{id}/wont-fix — Accept risk"
      - "POST /oss-products/{id}/release-gates/{id}/bypass — Bypass release gate"

  - name: PlatformAdmin
    description: "System administration — test-driving endpoints only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set logical clock"
      - "POST /_vulnerability-feed/simulate — Simulate CVE feed"
      - "POST /_scan-worker/process-next — Process scan synchronously"

  - name: Any
    description: "Shared read operations across all roles"
    identity: opaque
    shared_operations:
      - "GET /oss-products — List products"
      - "GET /oss-products/{id} — Get product"
      - "GET /oss-components — List components"
      - "GET /oss-components/{id} — Get component"
      - "GET /oss-products/{id}/dependency-scans — List scans"
      - "GET /oss-products/{id}/dependency-scans/{id} — Get scan"
      - "GET /oss-products/{id}/boms — List BOMs"
      - "GET /oss-products/{id}/boms/{id} — Get BOM"
      - "GET /oss-products/{id}/boms/{id}/entries — List BOM entries"
      - "GET /oss-products/{id}/boms/{id}/entries/{id} — Get BOM entry"
      - "GET /oss-products/{id}/license-approvals — List approvals"
      - "GET /oss-products/{id}/license-approvals/{id} — Get approval"
      - "GET /oss-products/{id}/obligation-tickets — List tickets"
      - "GET /oss-products/{id}/obligation-tickets/{id} — Get ticket"
      - "GET /oss-vulnerabilities — List vulnerabilities"
      - "GET /oss-vulnerabilities/{id} — Get vulnerability"
      - "GET /oss-products/{id}/vulnerability-findings — List findings"
      - "GET /oss-products/{id}/vulnerability-findings/{id} — Get finding"
      - "GET /oss-products/{id}/release-gates — List gates"
      - "GET /oss-products/{id}/release-gates/{id} — Get gate"
      - "GET /oss-products/{id}/remediation-plans — List plans"
      - "GET /oss-products/{id}/remediation-plans/{id} — Get plan"
      - "GET /oss-products/{id}/audit-engagements — List audits"
      - "GET /oss-products/{id}/audit-engagements/{id} — Get audit"
