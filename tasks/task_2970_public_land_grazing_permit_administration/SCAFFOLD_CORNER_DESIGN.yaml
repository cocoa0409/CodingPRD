          - calculations.use_bill_amount
        excluded_because:
          difficulty_instance: admin_fee_tier_keyed_on_base_not_total
          rationale: "The §1.8 instance admin_fee_tier_keyed_on_base_not_total builds the case where reading the tier from total_amount_cents instead of base_amount_cents changes the answer and asserts the correct fee, so the circular-reading trap is already covered."

      - name: corner_actual_use_rounds_per_record_then_sums
        claim_type: precision
        grounds:
          - calculations.actual_use_aggregation
        excluded_because:
          difficulty_instance: actual_use_per_record_rounding_order
          rationale: "The §1.8 instance actual_use_per_record_rounding_order reports three windows whose per-record 2dp rounding differs from a rounded-once sum and asserts both actual_aums_total and the downstream bill, so the pinned rounding order is fully exercised."

      - name: corner_minimum_billable_fraction_floor
        claim_type: algorithm_boundary
        grounds:
          - calculations.use_bill_amount
        excluded_because:
          difficulty_instance: minimum_billable_fraction_floor_boundary
          rationale: "The §1.8 instance minimum_billable_fraction_floor_boundary straddles the max(actual, floor(0.25 * billable)) selector at both sides with author-computed literals, which subsumes any separate boundary probe."

      - name: corner_cost_share_remainder_distribution
        claim_type: algorithm_boundary
        grounds:
          - calculations.cost_share_allocation
        excluded_because:
          difficulty_instance: cost_share_remainder_penny_boundary
          rationale: "The §1.8 instance cost_share_remainder_penny_boundary asserts every per-permit share for a pool whose floors leave a remainder, plus the exact conservation of allocated_share_cents, so the floor-then-distribute passes and the permitted_aums DESC / created_at ASC rank order are already pinned."

      - name: corner_trespass_charge_three_factor_composition
        claim_type: correct_result
        grounds:
          - calculations.unauthorized_use_charge
        excluded_because:
          difficulty_instance: trespass_penalty_three_factor_composition
          rationale: "The §1.8 instance trespass_penalty_three_factor_composition composes the AUM ceiling, the willfulness factor and the repeat-offender factor in one bill and asserts every intermediate value, so the combinatorial formula has no uncovered branch worth a separate corner."

  - section: validations
