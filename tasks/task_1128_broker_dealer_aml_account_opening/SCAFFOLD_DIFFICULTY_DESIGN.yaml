            - "captured posture_before == ELEVATED"
            - "captured st1 == RESTRICTED, st2 == OPEN, st3 == RESTRICTED (cycle traversed twice)"
            - "captured posture_after == ELEVATED (posture dimension unchanged by lifecycle cycling)"

