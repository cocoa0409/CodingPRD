  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bed_occupancy_pairwise_exclusion_with_turnaround_buffer
        grounds:
          - errors[ERR_BED_OCCUPIED]
          - validations[priority=13]
          - entities.CastingBed.fields.turnaround_buffer_hours
          - entities.BedRun.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics 1, on CastingBed: PAIRWISE EXCLUSION over half-open windows that are
          first extended by the bed's turnaround_buffer_hours. Run R1 books
          [06:00 Aug 3, 06:00 Aug 4) on a bed with a 6 h buffer, so the bed is occupied until
          12:00 Aug 4; a run starting at 11:00 Aug 4 is rejected and one starting at exactly
          12:00 Aug 4 is admitted.
        test_recipe:
          setup:
            - "Bed B1 has turnaround_buffer_hours 6 and status AVAILABLE."
            - "Run R1 occupies B1 from 2026-08-03T06:00:00Z to 2026-08-04T06:00:00Z and is in status SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
