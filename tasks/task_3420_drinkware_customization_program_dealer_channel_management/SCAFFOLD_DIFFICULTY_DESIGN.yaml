# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3420_drinkware_customization_program_dealer_channel_management
# 9 rules x 2 instances. Every number in assert: was computed by hand from the
# scaffold's pinned formulas and constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_quote_diverges_on_approved_artwork
        grounds:
          - calculations.customization_quote_cents
          - entities.CustomizationOrder.fields.provisional_quote_cents
          - entities.CustomizationOrder.fields.final_quote_cents
          - state_machines.CustomizationOrder.PROOF_SUBMITTED_to_ART_APPROVED
        distinguishing_aspect: |
          Order-domain dual variant: the PROVISIONAL quote prices the buyer's DECLARED counts
          (2 colors, 1 placement) with a requested-ship-date peak probe (in-peak, x1.25), while
          the FINAL quote prices the APPROVED proof's actual counts (3 colors, 2 placements)
          with the reserved slot's off-peak probe (x1.0) — same order, two evidence sets,
          481950 vs 428400 cents.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line RAM20 (base 3000c, MOQ 24), drop Rescue Red, off-peak LASER slot L-1 capacity 600 on 2026-10-05. Corporate order qty 144, declared 2 colors / 1 placement, ship 2026-11-20 (in peak)."
            - "Order submitted: provisional 481950 = round((round(144*3150*0.85) + 0) * 1.25); reservation HELD on L-1 (576 of 600 minutes)."
          setup_api_calls:
            - &d_clock_sep1
              call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - &d_line_ram20
              call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 20 oz", category: "DRINKWARE", base_sku: "RAM20", base_custom_price_cents: 3000, map_price_cents: 3499, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_id: $.data.id }
            - &d_drop_rescue
              call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_id}", color_name: "Rescue Red", pantone_code: "PMS 186", drop_type: "STANDARD", total_units: 5000, dtc_reserved_units: 1000, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_id: $.data.id }
            - &d_slot_l1
              call: "POST /drinkware/print-slots"
              payload: { station_code: "L-1", technology: "LASER", window_start: "2026-10-05T00:00:00Z", window_end: "2026-10-05T12:00:00Z", capacity_minutes: 600 }
              as: ProductionLead
              captures: { slot_id: $.data.id }
            - &d_order_acme
              call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "CORPORATE", buyer_ref: "buyer-acme", product_line_id: "${pl_id}", colorway_drop_id: "${drop_id}", quantity: 144, declared_color_count: 2, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-11-20T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-acme"
              captures: { order_id: $.data.id }
            - &d_submit_acme
              call: "POST /drinkware/customization-orders/${order_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-acme"
              captures: { prov_quote: $.data.provisional_quote_cents }
            - &d_reserve_acme
              call: "POST /drinkware/customization-orders/${order_id}/reserve-slot"
              payload: { slot_id: "${slot_id}" }
              as: Buyer
              as_user_id: "buyer-acme"
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${order_id}", artwork_file_ref: "s3://art/acme-v1.ai", color_count: 3, placement_count: 2, pantone_codes: ["PMS 186", "PMS Black"] }
              as: Buyer
              as_user_id: "buyer-acme"
              captures: { proof_id: $.data.id }
          trigger:
            - call: "POST /drinkware/artwork-proofs/${proof_id}/approve"
              payload: {}
              as: PrepressTech
              as_user_id: "pp-1"
          assert:
            - "CustomizationOrder.${order_id}.provisional_quote_cents == 481950"
            - "CustomizationOrder.${order_id}.final_quote_cents == 428400 (144 x (3000 + 2*150 + 1*200) x 0.85, setup waived, off-peak x1.0)"
            - "CustomizationOrder.${order_id}.quote_variant == FINAL and peak_applied flipped from true (provisional, ship-date probe) to false (final, slot probe)"
            - "CustomizationOrder.${order_id}.reservation_status == CONFIRMED and schedule_status == CONFIRMED (approval cascade)"
            - "ArtworkProof.${proof_id}.status == APPROVED"

      - name: allocation_score_switches_variant_with_season_clock
        grounds:
          - calculations.dealer_allocation_score
          - entities.Dealer.fields.allocation_score
        distinguishing_aspect: |
          Dealer-domain dual variant: the SAME dealer metrics (sell-through 80, brand 85,
          tenure 5, 0 points) score 75.50 under the STANDARD weights at a September clock
          and 76.25 under the PEAK weights at a November clock — the variant is selected
          purely by the logical clock, no write in between.
        test_recipe:
          setup:
            - "Dealer fully authorized via the fork-join chain with inspection score 85; clock ends at 2026-09-03 (STANDARD season)."
          setup_api_calls:
            - *d_clock_sep1
            - &d_dealer_riverbend
              call: "POST /drinkware/dealers"
              payload: { legal_name: "Riverbend Outfitters", storefront_address: "12 River Rd", region_code: "TX-CT", sell_through_pct: 80, tenure_years: 5 }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - &d_app_riverbend
              call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_id}", has_physical_storefront: true, storefront_sqft: 1800, document_refs: ["doc-1"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_id: $.data.id }
            - &d_sched_riverbend
              call: "POST /drinkware/dealer-applications/${app_id}/schedule-inspection"
              payload: { inspector_user_id: "fi-1", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:00:00Z" }
              as: PlatformAdmin
            - &d_record_riverbend
              call: "POST /drinkware/dealer-applications/${app_id}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 85 }
              as: FieldInspector
              as_user_id: "fi-1"
            - &d_docs_riverbend
              call: "POST /drinkware/dealer-applications/${app_id}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - &d_decide_riverbend
              call: "POST /drinkware/dealer-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_reason: "meets standards" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /drinkware/dealers/${dealer_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { score_standard: $.data.allocation_score }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /drinkware/dealers/${dealer_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { score_peak: $.data.allocation_score }
          assert:
            - "score_standard == 75.5 (0.50*80 + 0.30*85 + 2*5 - 5*0)"
            - "score_peak == 76.25 (0.35*80 + 0.45*85 + 2*5 - 8*0)"
            - "score_standard != score_peak and Dealer.${dealer_id}.version == 2 across both reads (no write occurred)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_quote_combines_rate_waiver_and_buyer_type_branches
        grounds:
          - calculations.customization_quote_cents
          - entities.ProductLine.fields.min_custom_quantity
        distinguishing_aspect: |
          Mode (a) combinatorial: four interacting inputs (quantity tier, buyer-type-gated
          discount eligibility, setup-fee waiver at 144, peak probe) — a CORPORATE qty-47
          order pays full price plus the 8000c setup (149000c) because 47 < 48 skips tier 1
          and 47 < 144 keeps the fee, while an INDIVIDUAL qty-500 order pays 1500000c with
          NO 22% tier discount (buyer-type gate) but with the fee waived (quantity gate).
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line CAMP20 (base 3000c, MOQ 1) with a standard drop."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Camp Mug 20 oz", category: "DRINKWARE", base_sku: "CAMP20", base_custom_price_cents: 3000, map_price_cents: 3499, min_custom_quantity: 1, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl2_id: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl2_id}", color_name: "Navy", pantone_code: "PMS 533", drop_type: "STANDARD", total_units: 8000, dtc_reserved_units: 1000, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop2_id: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "CORPORATE", buyer_ref: "buyer-corp47", product_line_id: "${pl2_id}", colorway_drop_id: "${drop2_id}", quantity: 47, declared_color_count: 1, declared_placement_count: 1, print_technology: "PAD", requested_ship_date: "2026-09-10T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-corp47"
              captures: { order_a: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-ind500", product_line_id: "${pl2_id}", colorway_drop_id: "${drop2_id}", quantity: 500, declared_color_count: 1, declared_placement_count: 1, print_technology: "PAD", requested_ship_date: "2026-09-12T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-ind500"
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /drinkware/customization-orders/${order_a}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-corp47"
            - call: "POST /drinkware/customization-orders/${order_b}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-ind500"
          assert:
            - "CustomizationOrder.${order_a}.provisional_quote_cents == 149000 (47 x 3000 = 141000, no tier rate below 48, + 8000 setup, off-peak)"
            - "CustomizationOrder.${order_b}.provisional_quote_cents == 1500000 (500 x 3000, INDIVIDUAL never tiers, setup waived at >= 144)"
            - "a CORPORATE qty-500 order would have been 1170000 — the buyer-type gate, not quantity alone, decides the 0.22 branch"
            - "both orders: quote_variant == PROVISIONAL and payment_status == AUTHORIZED"

      - name: launch_allocation_floor_then_cap_then_largest_remainder
        grounds:
          - calculations.launch_allocation_distribution
          - calculations.dealer_allocation_score
          - entities.ColorwayDrop.fields.unallocated_units
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order floors raw weighted shares FIRST
          (28.41 -> 28, 27.02 -> 27, 14.55 -> 14), caps at requested SECOND, then distributes
          the single leftover unit in fractional-DESC order — C (frac .55) beats B (frac .03)
          despite B's higher score. With pool 70, weights 41/39/21, requests 28/50/50 the
          result is exactly (28, 27, 15); a score-first remainder rule would give B 28 and
          C 14, and is wrong.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Three dealers authorized: A (sell 20, tenure 5, brand 70 -> score 41), B (sell 20, tenure 4, brand 70 -> 39), C (sell 0, tenure 0, brand 70 -> 21); inspector windows staggered with >= 60-minute travel gaps."
            - "Line RAM26 with drop: total 100, dtc_reserved 30 -> dealer pool 70, unit price 2000c; window opens 2026-09-05, closes 2026-09-10."
            - "Requests: A 28 units (== its floored share, so A is capped out of remainder passes), B 50, C 50 (total 128 > 70). Clock moved to 2026-09-11 (past closes)."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 26 oz", category: "DRINKWARE", base_sku: "RAM26", base_custom_price_cents: 3200, map_price_cents: 3799, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl3_id: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl3_id}", color_name: "Canopy Green", pantone_code: "PMS 350", drop_type: "LIMITED_EDITION", total_units: 100, dtc_reserved_units: 30, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-10T00:00:00Z", go_live_at: "2026-12-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop3_id: $.data.id }
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Alpine Outfitters", storefront_address: "1 Alpine Way", region_code: "CO-N", sell_through_pct: 20, tenure_years: 5 }
              as: PlatformAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_a}", has_physical_storefront: true, storefront_sqft: 1500, document_refs: ["doc-a"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_a: $.data.id }
            - call: "POST /drinkware/dealer-applications/${app_a}/schedule-inspection"
              payload: { inspector_user_id: "fi-1", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Basin Sports", storefront_address: "2 Basin Blvd", region_code: "CO-S", sell_through_pct: 20, tenure_years: 4 }
              as: PlatformAdmin
              captures: { dealer_b: $.data.id }
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_b}", has_physical_storefront: true, storefront_sqft: 1600, document_refs: ["doc-b"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_b: $.data.id }
            - call: "POST /drinkware/dealer-applications/${app_b}/schedule-inspection"
              payload: { inspector_user_id: "fi-1", window_start: "2026-09-02T11:00:00Z", window_end: "2026-09-02T12:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Canyon Supply", storefront_address: "3 Canyon Ct", region_code: "UT-N", sell_through_pct: 0, tenure_years: 0 }
              as: PlatformAdmin
              captures: { dealer_c: $.data.id }
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_c}", has_physical_storefront: true, storefront_sqft: 1400, document_refs: ["doc-c"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_c: $.data.id }
            - call: "POST /drinkware/dealer-applications/${app_c}/schedule-inspection"
              payload: { inspector_user_id: "fi-1", window_start: "2026-09-02T13:00:00Z", window_end: "2026-09-02T14:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/dealer-applications/${app_a}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 70 }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/dealer-applications/${app_b}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 70 }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/dealer-applications/${app_c}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 70 }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /drinkware/dealer-applications/${app_a}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - call: "POST /drinkware/dealer-applications/${app_b}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - call: "POST /drinkware/dealer-applications/${app_c}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - call: "POST /drinkware/dealer-applications/${app_a}/decide"
              payload: { decision: "APPROVE", decision_reason: "ok" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/dealer-applications/${app_b}/decide"
              payload: { decision: "APPROVE", decision_reason: "ok" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/dealer-applications/${app_c}/decide"
              payload: { decision: "APPROVE", decision_reason: "ok" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop3_id}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${dealer_a}", drop_id: "${drop3_id}", requested_units: 28 }
              as: Dealer
              as_user_id: "${dealer_a}"
              captures: { alloc_a: $.data.id }
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${dealer_b}", drop_id: "${drop3_id}", requested_units: 50 }
              as: Dealer
              as_user_id: "${dealer_b}"
              captures: { alloc_b: $.data.id }
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${dealer_c}", drop_id: "${drop3_id}", requested_units: 50 }
              as: Dealer
              as_user_id: "${dealer_c}"
              captures: { alloc_c: $.data.id }
            - call: "GET /drinkware/colorway-drops/${drop3_id}"
              payload: {}
              as: PlatformAdmin
              captures: { drop3_v: $.data.version }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /drinkware/colorway-drops/${drop3_id}/lock-allocation"
              payload: { expected_drop_version: "${drop3_v}" }
              as: PlatformAdmin
          assert:
            - "LaunchAllocation.${alloc_a}: status == ALLOCATED and allocated_units == 28 (floor(raw 28.41) == 28 == request; A is capped and skipped in remainder passes)"
            - "LaunchAllocation.${alloc_b}: status == ALLOCATED and allocated_units == 27 — B keeps its floor and gets NOTHING from the leftover because its fractional part 0.03 loses to C's 0.55"
            - "LaunchAllocation.${alloc_c}: status == ALLOCATED and allocated_units == 15 (floor 14 + the single leftover unit)"
            - "ColorwayDrop.${drop3_id}.dealer_committed_units == 70 and unallocated_units == 0"
            - "ColorwayDrop.${drop3_id}.status == ALLOCATION_LOCKED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dealer_application_fork_join_gate
        grounds:
          - state_machines.DealerApplication
          - entities.DealerApplication.fields.inspection_status
          - entities.DealerApplication.fields.docs_status
        distinguishing_aspect: |
          Branching fork-join on DealerApplication: the docs leg (PENDING->VERIFIED) and the
          inspection leg (UNSCHEDULED->SCHEDULED->PASSED) advance in EITHER order, and the
          decide join refuses with ERR_APPLICATION_INCOMPLETE until both have passed —
          two premature APPROVE attempts fail for different missing legs.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Dealer created (PENDING) with one application; nothing vetted yet."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Fork Join Traders", storefront_address: "9 Fork Rd", region_code: "TX-N", sell_through_pct: 60, tenure_years: 4 }
              as: PlatformAdmin
              captures: { dealer_fj: $.data.id }
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_fj}", has_physical_storefront: true, storefront_sqft: 2000, document_refs: ["doc-fj"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_fj: $.data.id }
          trigger:
            - call: "POST /drinkware/dealer-applications/${app_fj}/decide"
              payload: { decision: "APPROVE", decision_reason: "too early" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { err_first: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${app_fj}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - call: "POST /drinkware/dealer-applications/${app_fj}/decide"
              payload: { decision: "APPROVE", decision_reason: "docs done, inspection missing" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { err_second: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${app_fj}/schedule-inspection"
              payload: { inspector_user_id: "fi-2", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-2"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/dealer-applications/${app_fj}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 85 }
              as: FieldInspector
              as_user_id: "fi-2"
            - call: "POST /drinkware/dealer-applications/${app_fj}/decide"
              payload: { decision: "APPROVE", decision_reason: "both legs green" }
              as: ChannelManager
              as_user_id: "cm-1"
