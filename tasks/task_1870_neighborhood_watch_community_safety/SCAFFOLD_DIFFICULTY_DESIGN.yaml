            - "heat != 4.0 and heat != 2.0 (off-by-one on the <= 30 bucket boundary would produce one of these)"

      - name: certification_empty_set_and_attendance_tier_boundary
        grounds:
          - state_machines.CommunityEvent.PROPOSED_to_APPROVED
          - validations[priority=15]
          - validations[priority=16]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (certification gating of event
          approval) reached through a different endpoint than the heat bucket:
          with zero approval-worthy certification (UNCERTIFIED) and NO data-share
          agreement, three approve calls disentangle the gates — NNO at
          attendance 50 hits ERR_CERTIFICATION_REQUIRED (p15 silent below the
          100 tier); BLOCK_PARTY at exactly 100 hits ERR_DATA_SHARE_REQUIRED
          (>= boundary inclusive, p15 fires before p16); BLOCK_PARTY at 99
          passes p15 and hits ERR_CERTIFICATION_REQUIRED (p16).
        test_recipe:
          setup:
            - "Group UNCERTIFIED, posture FORMATION, 1 REGISTERED block, 1 ACTIVE member, officer present, NO data-share agreement."
            - "E1 NATIONAL_NIGHT_OUT attendance 50; E2 BLOCK_PARTY attendance 100; E3 BLOCK_PARTY attendance 99 — all PROPOSED on disjoint closure windows."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Gate Watch", precinct_code: "PCT12" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
