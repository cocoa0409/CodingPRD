scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, not-found, computed/system fields,
  # type constraints, pagination
  # =========================================================================
  - section: entities
    instances:
      - name: create_business_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Business, endpoints]
        distinguishing_aspect: "POST /businesses with legal_name+owner_name+zone_code -> 201; standing defaults GOOD, prior_revocation_flag false, compliance_risk_score 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /businesses"
              payload: { legal_name: "New Biz", owner_name: "N Owner", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Business.${biz_id}.standing == GOOD"
            - "Business.${biz_id}.prior_revocation_flag == false"
            - "Business.${biz_id}.compliance_risk_score == 0"
            - "Business.${biz_id}.version == 1"

      - name: create_application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Application, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applications omitting activity_category_id -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a business exists"]
          setup_api_calls:
            - call: "POST /businesses"
              payload: { legal_name: "Req Biz", owner_name: "RB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_license_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.License, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /licenses/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: activity_category_invalid_enum_risk_tier_rejected
        claim_type: Type Constraints
        grounds: [entities.ActivityCategory.fields.risk_tier, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /activity-categories with risk_tier='EXTREME' (not in {LOW,MEDIUM,HIGH}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /activity-categories"
              payload: { code: "BAD_TIER", risk_tier: "EXTREME", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: activity_category_base_risk_out_of_range_unprocessable
        claim_type: Type Constraints
        grounds: [entities.ActivityCategory.fields.activity_base_risk, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "activity_base_risk=99 (>40) passes type check but violates the 0..40 range -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /activity-categories"
              payload: { code: "RANGE_BAD", risk_tier: "LOW", activity_base_risk: 99, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: application_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Application.fields.status, entities.Application.fields.estimated_fee]
        distinguishing_aspect: "Client-supplied status/estimated_fee on POST /applications are ignored; status forced DRAFT, estimated_fee 0 until submit."
        test_recipe:
          setup: ["a business exists"]
          setup_api_calls:
            - call: "POST /businesses"
              payload: { legal_name: "Sys Biz", owner_name: "SB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /activity-categories"
              payload: { code: "SYS_CAT", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 3, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "Application.${app_id}.status == DRAFT"
            - "Application.${app_id}.estimated_fee == 0"
            - "Application.${app_id}.version == 1"

      - name: list_activity_categories_pagination_envelope
        claim_type: Listing
        grounds: [entities.ActivityCategory, endpoints, response_envelope]
        distinguishing_aspect: "GET /activity-categories?limit=1 -> array response with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["two activity categories exist"]
          setup_api_calls:
            - call: "POST /activity-categories"
              payload: { code: "PAGE_A", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "PAGE_B", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
          trigger:
            - call: "GET /activity-categories"
              payload: { limit: 1, offset: 0 }
              as: LicensingOfficer
          assert:
            - "response.response_type == array"
            - "response.total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: pagination_limit_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [response_envelope, "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /licenses?limit=500 (> max 100) -> ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /licenses"
              payload: { limit: 500 }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_PAGINATION_INVALID"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: approve_application_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.ZONING_CLEARED_to_APPROVED, "validations[priority=5]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application still in DRAFT (no submit/zoning) -> ERR_INVALID_STATE (409); no reviewed_by_user_id set."
        test_recipe:
          setup: ["a DRAFT application exists"]
          setup_api_calls:
            - call: "POST /activity-categories"
              payload: { code: "INV_CAT", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Inv Biz", owner_name: "IB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: revoke_active_license_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.License.DELINQUENT_to_REVOKED, "validations[priority=5]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoking an ACTIVE (not DELINQUENT) license -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["an ACTIVE license exists, never delinquent"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "ACT_CAT", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Act Biz", owner_name: "AB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /licenses/${lic_id}/revoke"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: record_inspection_twice_rejected
        claim_type: idempotency_violation
        grounds: [endpoints, entities.Inspection.fields.result, "errors[ERR_INSPECTION_ALREADY_RECORDED]"]
        distinguishing_aspect: "Recording an outcome on an inspection that is already PASSED (not SCHEDULED) -> ERR_INSPECTION_ALREADY_RECORDED (409)."
        test_recipe:
          setup: ["a SCHEDULED inspection recorded PASSED once"]
          setup_api_calls:
            - call: "POST /activity-categories"
              payload: { code: "DBL_INSP", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 1, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Insp Biz", owner_name: "IPB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /inspections"
              payload: { application_id: "${app_id}", inspector_user_id: "insp-x" }
              as: InspectionOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/record"
              payload: { result: "PASSED", verified_employee_count: 1, failed_item_count: 0 }
              as: InspectionOfficer
          trigger:
            - call: "POST /inspections/${insp_id}/record"
              payload: { result: "FAILED", verified_employee_count: 1, failed_item_count: 2 }
              as: InspectionOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSPECTION_ALREADY_RECORDED"

      - name: zoning_clear_branch_already_covered
        claim_type: valid_transition
        grounds: [state_machines.Application.SUBMITTED_to_ZONING_CLEARED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_branch_zoning_clear_vs_variance
          rationale: "The ZONING_CLEARED fork is asserted as Application app_a.status == ZONING_CLEARED in that §1.8 instance."

  # =========================================================================
  # Calculations — constants, precision, boundaries already partly covered
  # =========================================================================
  - section: calculations
    instances:
      - name: penalty_tier_b_day61_correct
        claim_type: correct_result
        grounds: [calculations.delinquency_penalty, entities.FeeAssessment.fields.amount]
        distinguishing_aspect: "MEDIUM license 61 days overdue -> DELINQUENCY_PENALTY assessment amount == 120.00 (25% tier B of 480.00 renewal fee)."
        test_recipe:
          setup: ["MEDIUM license expires 2027-06-01; clock 2027-08-01 = 61 days overdue."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "PEN_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Pen Biz", owner_name: "PB", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /licenses/${lic_id}/assess-delinquency"
              payload: {}
              as: LicensingOfficer
            - call: "GET /licenses/${lic_id}/fee-assessments"
              payload: {}
              as: LicensingOfficer
          assert:
            - "License.${lic_id}.status == DELINQUENT"
            - "a FeeAssessment with kind == DELINQUENCY_PENALTY and amount == 120.00 exists for ${lic_id}"
            - "a FeeAssessment with kind == RENEWAL_FEE and amount == 480.00 exists for ${lic_id}"

      - name: transfer_fee_high_risk_surcharge_correct
        claim_type: correct_result
        grounds: [calculations.transfer_fee, entities.OwnershipTransfer.fields.transfer_fee]
        distinguishing_aspect: "Completing a transfer on a HIGH-risk license -> transfer_fee == 500.00 (FLAT 300 + RISK 200)."
        test_recipe:
          setup: ["ACTIVE HIGH license with an APPROVED transfer to a GOOD buyer."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "TFEE_HIGH", risk_tier: "HIGH", activity_base_risk: 30, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "TF Seller", owner_name: "TS", zone_code: "C1" }
              as: Applicant
              captures: { seller_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "TF Buyer", owner_name: "TB", zone_code: "C1" }
              as: Applicant
              captures: { buyer_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${seller_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${seller_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /transfers"
              payload: { license_id: "${lic_id}", from_business_id: "${seller_id}", to_business_id: "${buyer_id}" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /transfers/${tr_id}/approve"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /transfers/${tr_id}/complete"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingOfficer
              captures: { st: $.data.status, fee: $.data.transfer_fee }
          assert:
            - "OwnershipTransfer.${tr_id}.status == COMPLETED"
            - "OwnershipTransfer.${tr_id}.transfer_fee == 500.00"

      - name: estimate_provisional_value_already_covered
        claim_type: correct_result
        grounds: [calculations.application_fee_estimate]
        excluded_because:
          difficulty_instance: dual_variant_calc / license_fee_estimate_vs_final_diverge
          rationale: "estimated_fee == 660.00 is asserted directly in that §1.8 instance."

  # =========================================================================
  # Validations — satisfaction passes, duplicate code, zoning denial
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_activity_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_ACTIVITY_CODE]"]
        distinguishing_aspect: "Creating a second ActivityCategory with an existing code -> ERR_DUPLICATE_ACTIVITY_CODE (409)."
        test_recipe:
          setup: ["one activity category with code DUP_CODE exists"]
          setup_api_calls:
            - call: "POST /activity-categories"
              payload: { code: "DUP_CODE", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
          trigger:
            - call: "POST /activity-categories"
              payload: { code: "DUP_CODE", risk_tier: "HIGH", activity_base_risk: 30, required_inspection_count: 1, requires_zoning_check: true, term_months: 24, allowed_zones: ["C2"] }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ACTIVITY_CODE"

      - name: zoning_denied_no_variance_path
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", state_machines.Application.SUBMITTED_to_ZONING_CLEARED, "errors[ERR_ZONING_DENIED]"]
        distinguishing_aspect: "A category with requires_zoning_check=false but requested_zone_code NOT in allowed_zones -> zoning-check returns ERR_ZONING_DENIED (409) because no variance path is available."
        test_recipe:
          setup: ["category requires_zoning_check=false allowed_zones=[C1]; application requests zone X9."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "NOVAR_CAT", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Zone Biz", owner_name: "ZB", zone_code: "X9" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "X9" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ZONING_DENIED"

      - name: surrender_with_no_outstanding_fees_succeeds
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=13]", state_machines.License.ACTIVE_to_SURRENDERED]
        distinguishing_aspect: "Surrendering an ACTIVE license with no unsettled FeeAssessment (issuance fee settled) -> 200, status SURRENDERED."
        test_recipe:
          setup: ["ACTIVE license whose ISSUANCE_FEE assessment is settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "SUR_LOW", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "SurOK Biz", owner_name: "SK", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
