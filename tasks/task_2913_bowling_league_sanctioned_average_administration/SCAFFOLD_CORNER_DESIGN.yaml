      # --- corners already exercised by §1.8 -----------------------------------
      - name: corner_membership_dual_axis_parallel_states_diverge
        claim_type: parallel
        grounds:
          - state_machines.Membership.PENDING_REMITTANCE_to_UNSANCTIONED
          - entities.Membership.fields.remittance_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_two_axes_diverge_through_rejection_and_refiling
          rationale: "That §1.8 instance already walks sanction_status and remittance_status out of step through a national rejection and a refiling, asserting each axis at every step."

      - name: corner_void_match_compensates_every_certified_figure
        claim_type: compensation
        grounds:
          - state_machines.Match.CERTIFIED_to_VOID
          - calculations.certified_pin_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / void_match_restores_certified_pins_and_handicaps_exactly
          rationale: "That §1.8 instance is exactly the certify-then-void compensating pair, asserting pins, games, averages, handicaps and points back to their pre-certify integers."

      - name: corner_remittance_acceptance_bubbles_up_to_the_league
        claim_type: bubble_up
        grounds:
          - state_machines.FeeRemittance.SUBMITTED_to_ACCEPTED
          - state_machines.Team.PROVISIONAL_to_CONFIRMED
          - state_machines.League.BYLAWS_ADOPTED_to_SANCTIONED
        excluded_because:
          difficulty_instance: transitive_cascade / remittance_acceptance_cascades_membership_team_league_match
          rationale: "That §1.8 instance asserts all four hops of the upward cascade - membership, team, league and the DRAFT -> SCHEDULED match sweep - from a single national acceptance."

      - name: corner_match_certification_cascades_down_to_every_slot
        claim_type: cascade_down
        grounds:
          - state_machines.Match.SCORES_ENTERED_to_CERTIFIED
          - calculations.bowler_average
        excluded_because:
          difficulty_instance: transitive_cascade / certification_cascades_series_entry_membership_team_league
          rationale: "That §1.8 instance asserts the downward-then-upward certification cascade slot by slot, including the average variant flip it triggers."

      - name: corner_award_reversal_keeps_the_money_ledger_in_step
        claim_type: ledger_sync
        grounds:
          - state_machines.PrizeAward.PAID_to_REVERSED
          - calculations.prize_money_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / award_reversal_restores_undistributed_balance_to_the_cent
          rationale: "That §1.8 instance asserts collected == paid + undistributed to the cent across a disbursement and every reversal, including the first-reversal fund and league reverts."

      - name: corner_match_open_depends_on_a_foreign_lane_pair_state
        claim_type: cross_entity
        grounds:
          - state_machines.LanePair.CERTIFIED_to_REVOKED
          - state_machines.Match.LINEUPS_SUBMITTED_to_OPEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / match_open_gated_on_lane_pair_certification_lifecycle
          rationale: "That §1.8 instance drives the whole lane-pair lifecycle against one match's open attempt, asserting the refusal and the later success on identical inputs."

  # ==========================================================================
  # SECTION 3 - calculations  (claim-extraction-guide Table 3)
  #   algorithms present: threshold, aggregation, tiered_pricing,
  #   forward_looking, waterfall_allocation; dual-variant rules:
  #   bowler_handicap, bowler_average, team_handicap_per_game, prize_fund_basis
  # ==========================================================================
  - section: calculations
    instances:

      - name: corner_entering_average_game_floor_and_carryover_policy_switch
        claim_type: threshold
        grounds:
          - calculations.entering_average
          - calculations.bowler_average
          - state_machines.League.BYLAWS_ADOPTED_to_BYLAWS_ADOPTED
          - entities.Membership.fields.entering_average
        distinguishing_aspect: "MIN_PRIOR_GAMES_FOR_CARRYOVER is inclusive at 21 and nothing else about the bowler matters: 20 prior games yield a null entering average while 21 identical-average games yield 170, a missing prior average yields null regardless of games, and switching carryover_policy to NONE and back to PRIOR_SEASON_FULL proves the value is re-derived from the stored prior_season_* fields on every amendment rather than frozen at registration."
        test_recipe:
          setup:
            - "One league on CONFIG-B at status BYLAWS_ADOPTED with carryover_policy BLENDED, minimum_games_for_average 9, handicap_base 220 and handicap_percentage 0.90."
            - "Four memberships registered with deliberately different prior records: ${ms1_id} 180 over 30 games, ${ms2_id} 195 over 20 games, ${ms3_id} 170 over exactly 21 games, and ${ms4_id} with no prior_season_average and no prior_season_games at all."
            - "No remittance has been submitted, so all four are UNSANCTIONED with certified_games 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
              payload: { full_name: "Ann Secretary", email: "sec@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { sec_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Bob Treasurer", email: "tre@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
