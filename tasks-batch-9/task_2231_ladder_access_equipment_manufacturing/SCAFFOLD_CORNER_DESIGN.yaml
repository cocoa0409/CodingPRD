    grounds:
    - endpoints[POST /_clock/set_current_utc]
    - roles.SystemOperator
    distinguishing_aspect: 'The clock endpoint is the only mover of the logical clock: after advancing it to 2026-08-20, a product created afterwards is stamped 2026-08-20T00:00:00Z while the product created
      before keeps 2026-08-01T00:00:00Z.'
    test_recipe:
      setup:
