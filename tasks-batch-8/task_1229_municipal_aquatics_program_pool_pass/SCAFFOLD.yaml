# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or request-body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or enum value not in declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state of target resource does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_FACILITY_CLOSED, http: 409, condition: "Facility is in a CLOSED_* status and the operation requires OPEN or RESTRICTED" }
  - { id: ERR_FACILITY_AT_CAPACITY, http: 409, condition: "current_bather_count would exceed max_bather_capacity" }
  - { id: ERR_HOLDER_BANNED, http: 409, condition: "PassHolder.banned_until is in the future" }
  - { id: ERR_GUARD_NOT_CERTIFIED, http: 409, condition: "Lifeguard cert_status is EXPIRED or SUSPENDED at submission/check-in time" }
  - { id: ERR_RENTAL_OVERLAP, http: 409, condition: "Requested rental window overlaps an APPROVED or CHECKED_IN rental at the same facility" }
  - { id: ERR_RENTAL_CAPACITY, http: 409, condition: "Rental party_size exceeds facility capacity or overlaps RESERVED LaneAllocations" }
  - { id: ERR_LANE_CAPACITY_EXCEEDED, http: 409, condition: "Sum of overlapping RESERVED lane_counts plus new lanes_required exceeds facility.lap_lane_count" }
  - { id: ERR_SESSION_OUTSIDE_SEASON, http: 422, condition: "LessonSession window not contained in its MembershipSeason window" }
  - { id: ERR_ADMISSION_DATE_INVALID, http: 422, condition: "admission_date is not today or season not PUBLISHED on that date" }
  - { id: ERR_SHIFT_WINDOW_INVALID, http: 422, condition: "shift_start >= shift_end or outside the allowed booking window" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 422, condition: "placement_evidence_level_id does not satisfy level prerequisite chain or age minimum" }
  - { id: ERR_SEASON_OVERLAP, http: 409, condition: "PUBLISHED season window overlaps another PUBLISHED season for the same facility, or resident price > non-resident price" }
  - { id: ERR_CHEMISTRY_INPUT_INVALID, http: 422, condition: "ChemistryLog reading outside plausible instrument range" }
  - { id: ERR_REOPEN_CRITERIA_NOT_MET, http: 409, condition: "Reopen attempted but chemistry still OUT_OF_RANGE, or staffing shortage still present" }
  - { id: ERR_PASS_NOT_VALID, http: 409, condition: "SeasonPass referenced for admission is not ACTIVE or does not belong to the current season" }
  - { id: ERR_ALREADY_CHECKED_IN, http: 409, condition: "Second enter or check-in attempt on an already-active record" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AquaticsManager
    description: "City aquatics division manager; full administrative control over facilities, seasons, sessions, staffing, and incidents"
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /seasons"
      - "POST /seasons/{id}/publish"
      - "POST /seasons/{id}/close"
      - "POST /facilities/{id}/closures"
      - "POST /facilities/{id}/reopen"
      - "POST /closures/{id}/resolve"
      - "POST /lesson-levels"
      - "POST /lesson-sessions"
      - "POST /lesson-sessions/{id}/schedule"
      - "POST /lesson-sessions/{id}/cancel"
      - "POST /lifeguards"
      - "POST /lifeguards/{id}/suspend"
      - "POST /lifeguards/{id}/reinstate"
      - "POST /shifts"
      - "POST /shifts/{id}/cancel"
      - "POST /lane-allocations"
      - "POST /lane-allocations/{id}/release"
      - "POST /rentals/{id}/approve"
      - "POST /rentals/{id}/reject"
      - "POST /incident-reports/{id}/confirm"
      - "POST /incident-reports/{id}/dismiss"
      - "POST /passes/{id}/refund"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /pass-holders"
      - "POST /passes"
      - "POST /enrollments"
      - "POST /enrollments/{id}/drop"
      - "POST /rentals"
      - "POST /rentals/{id}/cancel"
      - "POST /facilities/{id}/chemistry-logs"
      - "POST /incident-reports"

  - name: GateAttendant
    description: "Front-gate staff; sells passes and admissions, checks patrons in/out"
    identity: opaque
    exclusive_operations:
      - "POST /admissions"
      - "POST /admissions/{id}/enter"
      - "POST /admissions/{id}/exit"
      - "POST /rentals/{id}/check-in"
      - "POST /rentals/{id}/check-out"
    shared_operations:
      - "GET reads across all resources"
      - "POST /pass-holders"
      - "POST /passes"
      - "POST /enrollments"
      - "POST /rentals"

  - name: Lifeguard
    description: "Certified lifeguard; logs chemistry, checks into shifts, files incident reports"
    identity: "entity_backed:Lifeguard"
    exclusive_operations:
      - "POST /shifts/{id}/check-in"
      - "POST /incident-reports/{id}/submit"
    shared_operations:
      - "GET reads across most resources"
      - "POST /facilities/{id}/chemistry-logs"
      - "POST /incident-reports"

  - name: PassHolder
    description: "Registered patron; can view own record, enroll in lessons, book rentals, drop own enrollments"
    identity: "entity_backed:PassHolder"
    exclusive_operations: []
    shared_operations:
