  - name: compliance_sweep_flips_every_overdue_row_in_one_call
    claim_type: bulk_action
    grounds:
    - endpoints[POST /programs/{id}/compliance-sweep]
    - state_machines.DonorFollowUp.DUE_to_DELINQUENT
    - calculations.program_follow_up_compliance
