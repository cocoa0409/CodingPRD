              captures: { t1_id: $.data.id }
            - call: "POST /trainers"
              payload: { full_name: "T2", email: "t16b@x.com" }
              as: PlatformAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t1_id}", full_name: "C", email: "c16@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t1_id}"
