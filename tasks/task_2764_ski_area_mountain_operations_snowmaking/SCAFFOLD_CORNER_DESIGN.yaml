      - name: the_plant_wide_sweep_runs_after_the_pump_house_sweep_and_across_pump_houses
        claim_type: priority_ordering
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - errors[ERR_PUMP_CAPACITY_EXCEEDED]
          - errors[ERR_PLANT_CAPACITY_EXCEEDED]
          - calculations.pump_capacity_sweep
        distinguishing_aspect: |
          Two pump houses of 4000 gpm each sit under a 6000 gpm plant limit, so the plant is the binding
          constraint even though neither pump house is close to its own ceiling. A create on PH2 that
          overlaps a peer on PH1 must therefore be rejected with ERR_PLANT_CAPACITY_EXCEEDED, which is
          only reachable by summing ACROSS pump houses on shared boundary intervals; a per-pump-house-only
          implementation admits it. The last trigger busts both ceilings at once and must report the pump
          house error, pinning the 42-before-43 order.
        test_recipe:
          setup:
            - "A season with plant_max_gpm 6000, two ONLINE pump houses PH1 and PH2 of max_gpm 4000 each, and three terrain areas."
            - "One SCHEDULED session S1 on PH1 over area T1, window [08:00, 12:00), gpm 3500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
