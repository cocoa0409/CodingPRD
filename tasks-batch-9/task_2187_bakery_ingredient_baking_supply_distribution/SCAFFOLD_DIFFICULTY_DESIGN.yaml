      - name: boundary_tech_hours_exactly_four_point_zero_flips_open_to_billable
        grounds:
          - state_machines.TechSupportEngagement.OPEN_to_BILLABLE
          - calculations.tech_support_attach_fee
          - entities.TechSupportEngagement.fields.hours_logged
          - entities.TechSupportEngagement.fields.attach_fee_cents
        distinguishing_aspect: |
          A fourth boundary metric (hours at 1 decimal place) reached by ACCUMULATION rather than by
          a single value: postings of 2.0 then 1.9 leave hours_logged at 3.9, one tenth below
          BILLABLE_HOURS_THRESHOLD, so the engagement stays OPEN with attach_fee_cents 0; the third
          posting of 0.1 lands hours_logged on exactly 4.0 and must flip OPEN -> BILLABLE with
          attach_fee_cents = (4.0 - 2.0) * 18500 = 37000. Float accumulation that yields 3.9999
          fails the flip; a > comparison also fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Bench Test Bakery ACTIVE, risk_tier GREEN (so RED_TIER_MULTIPLIER does not apply), credit_limit_cents 5000000, min_drop_cents 25000."
            - "Emulsifier SKU SPC-EMU-10 as the engagement subject."
            - "Engagement opened by specialist ts-1 for that customer and SKU: status OPEN, hours_logged 0, attach_fee_cents 0."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Bench Test Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "SPC-EMU-10", category: "FAT", allergen_class: "NONE", bulk_capable: false, shelf_life_days: 90, index_code: "NONE", list_price_cents_per_lb: 490, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { emu_id: $.data.id }
            - call: "POST /bakery-distribution/tech-engagements"
              payload: { customer_id: "${cust_id}", product_id: "${emu_id}" }
              as: TechnicalSpecialist
              as_user_id: "ts-1"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /bakery-distribution/tech-engagements/${eng_id}/hours"
              payload: { hours: 2.0, work_note: "dough rheology bench trial" }
              as: TechnicalSpecialist
              as_user_id: "ts-1"
              captures: { h1: $.data.hours_logged, s1: $.data.status, f1: $.data.attach_fee_cents }
            - call: "POST /bakery-distribution/tech-engagements/${eng_id}/hours"
              payload: { hours: 1.9, work_note: "second bake trial" }
              as: TechnicalSpecialist
              as_user_id: "ts-1"
              captures: { h2: $.data.hours_logged, s2: $.data.status, f2: $.data.attach_fee_cents }
            - call: "POST /bakery-distribution/tech-engagements/${eng_id}/hours"
              payload: { hours: 0.1, work_note: "write-up" }
              as: TechnicalSpecialist
              as_user_id: "ts-1"
              captures: { h3: $.data.hours_logged, s3: $.data.status, f3: $.data.attach_fee_cents }
          assert:
            - "${h1} == 2.0"
            - "${s1} == OPEN"
            - "${f1} == 0"
            - "${h2} == 3.9"
            - "${s2} == OPEN"
            - "${f2} == 0"
            - "${h3} == 4.0"
            - "${s3} == BILLABLE"
            - "${f3} == 37000"
            - "TechSupportEngagement.${eng_id}.assigned_specialist_user_id == ts-1"
            - "TechSupportEngagement.${eng_id}.order_id == null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_blocked_by_contract_still_offered_not_active
        grounds:
          - validations[priority=12]
          - state_machines.ForwardPricingContract.DRAFT_to_OFFERED
          - calculations.contract_line_settlement_price
          - errors[ERR_RELATED_ENTITY_STATE_INVALID]
          - entities.Order.fields.contract_id
        distinguishing_aspect: |
          The blocking condition lives on a DIFFERENT entity than the one being mutated: the Order
          itself is in a perfectly legal UNPRICED state and every own-field rule passes, but its
          ForwardPricingContract is only OFFERED (never activated), and pricing an order requires
          contract.status == ACTIVE. Expected ERR_RELATED_ENTITY_STATE_INVALID / 409 - not a state
          error about the order, and not a silent fallback to list pricing.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Contract Pending Bakery ACTIVE, credit_limit_cents 5000000, min_drop_cents 25000."
            - "Flour SKU FLR-HRW-50 (GLUTEN, index HRW_WHEAT, list 42); HRW_WHEAT quote 38 c/lb effective 2026-08-01."
