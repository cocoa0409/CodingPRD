              as: ReferralCoordinator
              captures: { ref_id: $.data.id, r0: $.data.status, rounds0: $.data.info_request_rounds }
          trigger:
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "ACCEPT_OPEN_ACCESS" }
              as: ReferralCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "BEGIN_TRIAGE" }
              as: ReferralCoordinator
              captures: { r1: $.data.status }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "ACCEPT_OPEN_ACCESS" }
              as: ReferralCoordinator
              captures: { r2: $.data.status }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "DECLINE" }
              as: ReferralCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /referrals/${ref_id}"
              payload: {}
              as: PracticeAdmin
              captures: { r3: $.data.status, rounds3: $.data.info_request_rounds }
          assert:
            - "${r0} == SUBMITTED and ${rounds0} == 0"
            - "the first accept returns HTTP 409 with ${e1} == ERR_INVALID_REFERRAL_STATE"
            - "${r1} == UNDER_TRIAGE and ${r2} == ACCEPTED_OPEN_ACCESS"
            - "the decline returns HTTP 409 with ${e2} == ERR_INVALID_REFERRAL_STATE"
            - "${r3} == ACCEPTED_OPEN_ACCESS and ${rounds3} == 0"
