            - "Subscription.${s2_id}.counts_toward_escrow == true"
            - "the second POST /de-novo/capital-raises/${r_id}/lock-escrow returns 200 and CapitalRaise.${r_id}.status == ESCROW_LOCKED"
  - rule_id: combinatorial_formula
    instances:
      - name: management_composite_rounding_order_pinned_per_organizer
        grounds:
          - calculations.management_composite_score
          - calculations.organizer_qualification_subscore
          - entities.OrganizingGroup.fields.management_composite_score
          - entities.Organizer.fields.qualification_subscore
          - validations[priority=30]
        distinguishing_aspect: >
          Mode (b) nested rounding where the order changes the answer: rounding each organizer's
          weighted subscore to an integer FIRST and averaging afterwards yields 71.80, while
          averaging the unrounded raws and rounding once yields 71.68 - the scaffold pins the
          per-organizer-first order, so 71.80 is the only correct value.
        test_recipe:
          setup:
            - "A group with the five canonical organizers seated."
            - "Nine of the ten background dimensions already resolved CLEARED; organizer o5's CREDIT"
            - "dimension is still PENDING so the composite has not yet reached its final value."
