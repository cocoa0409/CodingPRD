scaffold_corner_design:
  - section: entities
    instances:
      - name: plan_tier_creation_returns_every_declared_field
        claim_type: Creation
        grounds: ["entities.PlanTier", "endpoints.POST /plan-tiers"]
        distinguishing_aspect: "A PlanTier created with all thirteen inputs returns 201 and echoes tier_code, rank, monthly_fee_cents and the four overage rates unchanged."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /plan-tiers"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
          assert:
            - "the trigger call returns 201"
            - "PlanTier.${plan_id}.tier_code == PLUS"
            - "PlanTier.${plan_id}.rank == 2"
            - "PlanTier.${plan_id}.monthly_fee_cents == 6000"
            - "PlanTier.${plan_id}.included_scan_pages == 50"
            - "PlanTier.${plan_id}.overage_storage_day_cents == 30"
            - "PlanTier.${plan_id}.allows_overage == true"

      - name: box_retrieval_by_unknown_id_returns_box_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_BOX_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /boxes/{id} with a well-formed UUID that no Box carries returns 404 ERR_BOX_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup: ["One PlanTier and one Box exist."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0001", plan_tier_id: "${plan_id}", holder_name: "Cor Ner", holder_email: "cor@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id", box_v: "$.data.version" }
          trigger:
            - call: "GET /boxes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CmraOperator
          assert:
            - "the trigger call returns 404 with error_id ERR_BOX_NOT_FOUND"

      - name: box_list_returns_pagination_envelope_fields
        claim_type: Listing
        grounds: ["endpoints.GET /boxes", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /boxes returns response_type array with limit, offset, total_count and has_more, defaulting to limit 10 and offset 0."
        test_recipe:
          setup: ["Two boxes on the same plan tier."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0001", plan_tier_id: "${plan_id}", holder_name: "Cor Ner", holder_email: "cor@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id", box_v: "$.data.version" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0002", plan_tier_id: "${plan_id}", holder_name: "Two Ner", holder_email: "two@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
          trigger:
            - call: "GET /boxes"
              payload: { plan_tier_id: "${plan_id}", limit: 1, offset: 0 }
              as: CmraOperator
          assert:
            - "the trigger call returns 200 with response_type array"
            - "the response meta carries limit 1, offset 0, total_count 2 and has_more true"
            - "exactly 1 Box object is returned"

      - name: recipient_creation_without_legal_name_is_rejected
        claim_type: Required Fields
        grounds: ["validations[priority=9]", "errors[ERR_VALIDATION]", "entities.Recipient.fields.legal_name"]
        distinguishing_aspect: "POST /boxes/{id}/recipients with recipient_kind but no legal_name returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["One ACTIVE box."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0001", plan_tier_id: "${plan_id}", holder_name: "Cor Ner", holder_email: "cor@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id", box_v: "$.data.version" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
          trigger:
            - call: "POST /boxes/${box_id}/recipients"
              payload: { recipient_kind: "INDIVIDUAL" }
              as: CmraOperator
          assert:
            - "the trigger call returns 400 with error_id ERR_VALIDATION"
            - "GET /boxes/${box_id}/recipients returns total_count 0"

      - name: box_optional_money_fields_default_to_zero
        claim_type: Defaults
        grounds: ["entities.Box.fields.security_deposit_cents", "entities.Box.fields.extra_recipient_slots", "entities.Box.fields.prepaid_balance_cents"]
        distinguishing_aspect: "Omitting security_deposit_cents, extra_recipient_slots and prepaid_balance_cents yields 0 for each rather than null."
        test_recipe:
          setup: ["One PlanTier."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /boxes"
              payload: { box_number: "Z-0003", plan_tier_id: "${plan_id}", holder_name: "Def Ault", holder_email: "def@example.com" }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
          assert:
            - "Box.${box_id}.security_deposit_cents == 0"
            - "Box.${box_id}.extra_recipient_slots == 0"
            - "Box.${box_id}.prepaid_balance_cents == 0"
            - "Box.${box_id}.service_status == PENDING_SETUP"
            - "Box.${box_id}.compliance_status == COMPLIANT"
            - "Box.${box_id}.suspended_reason == NONE"
            - "Box.${box_id}.version == 1"

      - name: box_roster_authorized_count_is_computed_not_input
        claim_type: Computed Fields
        grounds: ["entities.Box.fields.roster_authorized_count", "entities.Box.fields.release_gate_state"]
        distinguishing_aspect: "roster_authorized_count is 0 on a fresh box and becomes 1 only after a Form 1583 is accepted; a client-supplied value is ignored."
        test_recipe:
          setup: ["One ACTIVE box with one recipient whose Form 1583 is accepted."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0004", plan_tier_id: "${plan_id}", holder_name: "Ada Count", holder_email: "ada@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Ada Count", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /boxes/${box_id}"
              payload: {}
              as: CmraOperator
          assert:
            - "Box.${box_id}.roster_authorized_count == 1"
            - "Box.${box_id}.release_gate_state == OPEN"
            - "Box.${box_id}.outstanding_overage_cents == 0"

      - name: mail_item_received_at_and_ids_are_system_stamped
        claim_type: System Fields
        grounds: ["entities.MailItem.fields.received_at", "entities.MailItem.fields.id"]
        distinguishing_aspect: "MailItem.received_at equals the logical clock at intake (2026-05-01T00:00:00.000Z by default) and MailItem.id is a bare server-minted UUID with no type prefix."
        test_recipe:
          setup: ["One ACTIVE box with a releasable recipient, clock untouched."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0005", plan_tier_id: "${plan_id}", holder_name: "Ben Stamp", holder_email: "ben@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Ben Stamp", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Ben Stamp", item_class: "LETTER", signature_required: false, actual_weight_lb: 0.1, length_in: 9.0, width_in: 4.0, height_in: 0.2, interior_scan_consent: false }
              as: CmraOperator
              captures: { mi_id: "$.data.id" }
          assert:
            - "MailItem.${mi_id}.received_at == 2026-05-01T00:00:00.000Z"
            - "MailItem.${mi_id}.id matches the bare UUID form with no prefix"
            - "MailItem.${mi_id}.version == 1"
            - "MailItem.${mi_id}.handling_status == RECEIVED"
            - "MailItem.${mi_id}.storage_status == FREE_WINDOW"
            - "MailItem.${mi_id}.billing_status == UNBILLED"
            - "MailItem.${mi_id}.notification_status == NOT_REQUIRED"
            - "MailItem.${mi_id}.billable_weight_lb == 0.1"

      - name: recipient_kind_outside_enum_is_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "recipient_kind CORPORATION is not a declared member, so the request returns 400 ERR_INVALID_ENUM rather than ERR_VALIDATION."
        test_recipe:
          setup: ["One ACTIVE box."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0001", plan_tier_id: "${plan_id}", holder_name: "Cor Ner", holder_email: "cor@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id", box_v: "$.data.version" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
          trigger:
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Cee Corp", recipient_kind: "CORPORATION", signature_authorization_on_file: false }
              as: CmraOperator
          assert:
            - "the trigger call returns 400 with error_id ERR_INVALID_ENUM"

      - name: usage_ledger_entry_is_append_only_without_version
        claim_type: Immutability
        grounds: ["entities.UsageLedgerEntry", "endpoints.GET /billing-cycles/{id}/usage-entries"]
        distinguishing_aspect: "UsageLedgerEntry declares common_fields false, so its rows expose id and created_at but no version and no updated_at, and no endpoint mutates one."
        test_recipe:
          setup: ["One ACTIVE box whose recipient was authorized, producing exactly one RECIPIENT usage entry."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0006", plan_tier_id: "${plan_id}", holder_name: "Dee Ledger", holder_email: "dee@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Dee Ledger", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /boxes/${box_id}/billing-cycles"
              payload: {}
              as: CmraOperator
              captures: { cyc_id: "$.data[0].id" }
          trigger:
            - call: "GET /billing-cycles/${cyc_id}/usage-entries"
              payload: {}
              as: CmraOperator
          assert:
            - "the trigger call returns 200 with total_count 1"
            - "the returned UsageLedgerEntry has unit_type RECIPIENT, tranche IN_TIER, quantity 1, unit_rate_cents 0, amount_cents 0"
            - "the returned UsageLedgerEntry object carries id and created_at but no version key and no updated_at key"

      - name: recipient_creation_under_unknown_box_returns_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=3]", "errors[ERR_BOX_NOT_FOUND]"]
        distinguishing_aspect: "The parent Box is validated before the body, so a recipient create under a non-existent box id returns 404 ERR_BOX_NOT_FOUND even with a valid body."
        test_recipe:
          setup: ["One PlanTier exists; no box with the requested id."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/00000000-0000-4000-8000-000000000000/recipients"
              payload: { legal_name: "Eve Ghost", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
          assert:
            - "the trigger call returns 404 with error_id ERR_BOX_NOT_FOUND"

      - name: guarantor_self_reference_is_discoverable_by_filtered_list
        claim_type: Retrieval
        grounds: ["entities.Recipient.fields.guarantor_recipient_id", "endpoints.GET /recipients"]
        distinguishing_aspect: "GET /recipients?guarantor_recipient_id={G} returns exactly the minors guaranteed by G, exercising the self-referential foreign key in both directions."
        test_recipe:
          setup: ["One ACTIVE box with a guarantor recipient G and one MINOR recipient M whose guarantor_recipient_id is G."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-0007", plan_tier_id: "${plan_id}", holder_name: "Fay Guard", holder_email: "fay2@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Fay Guard", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Gus Minor", recipient_kind: "MINOR", guarantor_recipient_id: "${rec_id}", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_m: "$.data.id" }
          trigger:
            - call: "GET /recipients"
              payload: { guarantor_recipient_id: "${rec_id}" }
              as: CmraOperator
          assert:
            - "the trigger call returns 200 with total_count 1"
            - "the single returned Recipient has id ${rec_m} and recipient_kind MINOR"
            - "Recipient.${rec_m}.guarantor_recipient_id == ${rec_id}"

  - section: state_machines
    instances:
      - name: activating_an_already_active_box_is_rejected
        claim_type: Idempotency
