            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "FabCo", discipline: MECHANICAL, hourly_rate_cents: 10000, coordination_budget_hours: 50.0, software_platform: TEKLA }, as: VDCManager, captures: { p2: $.data.id } }
