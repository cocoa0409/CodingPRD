# =============================================================================
# SCAFFOLD.yaml — Concierge Senior & Non-Emergency Transport (private)
# §1.0–§1.7 seed tables. Difficulty: harder-than-expert.
# =============================================================================

scenario: |
  975. Concierge Senior & Non-Emergency Transport (private): client & ride
  request (grocery/appointment/companion), driver match & door-through-door,
  recurring standing ride, hourly/mileage & wait, family portal & log,
  wheelchair/assist, background/bonding, billing

domain_name: concierge-senior-transport
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing        # driver buffered windows, rate-card windows, standing-ride horizons
  secondary_archetype: pricing_engine          # hourly + mileage + wait, tiered cancel fees, per-line rounding
  complexity_layers:
    - selector_policy                          # driver matching: eligibility filter + ranking + tie-break + empty-pool fallback + exclusion on retry
    - dual_variant_calculation                 # quote vs final fare; scheduled vs worked driver minutes
    - optimistic_concurrency                   # OCC on StandingRide.version and Client.version
    - cascading_side_effects                   # compliance expiry -> driver suspension -> assignment release -> ride re-dispatch
  entity_topology: flat                        # peer entities joined by FK references; no nested write paths
  state_machine_shape: cyclic                  # Ride ASSIGNED -> DISPATCHING rematch loop; ComplianceDoc renewal loop; Invoice carries two independent state dimensions
  relationship_patterns:
    - one_to_many                              # Client -> Ride, Driver -> Assignment, Invoice -> InvoiceLine
    - self_referential                         # Ride.linked_return_ride_id (round-trip leg); ComplianceDoc.renewal_of_doc_id (renewal chain)
    - cross_aggregate                          # Assignment joins Ride and Driver aggregates; InvoiceLine references Ride
  role_model: segregation_of_duties            # a BillingAdmin who dispatched a ride on an invoice may not resolve that invoice's dispute
  consistency_model: immediate                 # all mutations visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Senior client's legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEACTIVATED; starts ACTIVE" }
      - { name: mobility_aid, type: enum, source: input, description: "NONE | WALKER | FOLDING_WHEELCHAIR | POWER_WHEELCHAIR; drives vehicle-class derivation" }
      - { name: assist_level_default, type: enum, source: input, description: "DOOR_TO_DOOR | DOOR_THROUGH_DOOR; default escort level snapshotted onto each ride" }
      - { name: home_zone, type: string, source: input, description: "Home zone label used for driver zone-match ranking" }
      - { name: address, type: string, source: input, description: "Pickup home address (free text)" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Prepaid credit pool; credited by payment remainders and accepted disputes, debited by invoice generation and refunds; starts 0" }
      - { name: billing_hold_limit_cents, type: integer, source: input, description: "Overdue accounts-receivable threshold at or above which new rides/standing rides are blocked", default: 20000 }
      - { name: no_show_count, type: integer, source: system, description: "Cumulative NO_SHOW rides; reaching NO_SHOW_STRIKE_LIMIT (3) auto-suspends the client", default: 0 }

  - name: FamilyMember
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the senior this family member is attached to" }
      - { name: full_name, type: string, source: input, description: "Family member name" }
      - { name: relation, type: string, source: input, description: "Free-text relation (e.g. daughter, son, nephew)" }
      - { name: access_level, type: enum, source: input, description: "VIEW_ONLY | BOOK_FOR_CLIENT | BILLING_PAYER; portal capability tier" }
      - { name: notify_on_ride_events, type: boolean, source: input, description: "Whether ride log events are surfaced to this member's portal feed", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED; starts ACTIVE" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver name" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ACTIVE | SUSPENDED | OFFBOARDED; starts APPLICANT" }
      - { name: vehicle_class, type: enum, source: input, description: "SEDAN | WAV (wheelchair-accessible vehicle)" }
      - { name: assist_certification, type: enum, source: input, description: "NONE | DOOR_TO_DOOR | DOOR_THROUGH_DOOR; must be >= ride assist_level" }
      - { name: home_zone, type: string, source: input, description: "Driver base zone for zone-match ranking" }
      - { name: max_daily_service_minutes, type: integer, source: input, description: "Daily cap on forward-looking scheduled minutes" }
      - { name: current_load_minutes, type: integer, source: computed, description: "Forward-looking load: sum of estimated_duration_minutes over this driver's rides with pickup date == logical today and status in {ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE}" }
      - { name: day_worked_minutes, type: integer, source: computed, description: "Chronological actuals: sum of service_minutes over this driver's rides with pickup date == logical today and status COMPLETED" }

  - name: ComplianceDoc
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; owning driver" }
      - { name: doc_type, type: enum, source: input, description: "BACKGROUND_CHECK | BONDING | INSURANCE | MOTOR_VEHICLE_RECORD" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED | EXPIRED; starts PENDING_REVIEW" }
      - { name: valid_from, type: string, source: input, description: "First valid date (YYYY-MM-DD), inclusive" }
      - { name: valid_until, type: string, source: input, description: "Last valid date (YYYY-MM-DD), exclusive — half-open validity window [valid_from, valid_until)" }
      - { name: renewal_of_doc_id, type: string, source: input, description: "FK -> ComplianceDoc.id; optional pointer to the expired/rejected doc this submission renews", constraints: "nullable" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "ComplianceOfficer X-User-ID who reviewed; null until reviewed", constraints: "nullable" }
      - { name: review_note, type: string, source: system, description: "Reviewer note captured at review", constraints: "nullable" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: service_class, type: enum, source: input, description: "STANDARD | WAV; which derived ride class this card prices" }
      - { name: effective_from, type: string, source: input, description: "First effective date (YYYY-MM-DD), inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last effective date (YYYY-MM-DD), exclusive — half-open window [effective_from, effective_to)" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Per-hour service rate, prorated per minute" }
      - { name: per_mile_cents, type: integer, source: input, description: "Per-mile rate" }
      - { name: wait_per_minute_cents, type: integer, source: input, description: "Per-billable-wait-minute rate" }
      - { name: included_wait_minutes, type: integer, source: input, description: "Wait grace per ride; wait at or below this bills zero minutes" }
      - { name: minimum_charge_cents, type: integer, source: input, description: "Per-completed-ride fare floor and the basis for cancellation/no-show fees" }
      - { name: after_hours_multiplier_bp, type: integer, source: input, description: "Multiplier in basis points applied when pickup time-of-day >= after_hours_start_minute (e.g. 11000 = 1.1x)" }
      - { name: after_hours_start_minute, type: integer, source: input, description: "Minute of day (0-1439) from which the after-hours multiplier applies (e.g. 1080 = 18:00)" }
      - { name: wav_surcharge_cents, type: integer, source: input, description: "Flat surcharge added to completed WAV-class rides", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; starts DRAFT" }

  - name: StandingRide
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; riding senior" }
      - { name: booked_by_family_member_id, type: string, source: input, description: "FK -> FamilyMember.id; set when a family member created the series", constraints: "nullable" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN; weekly cadence day" }
      - { name: pickup_time_of_day_minutes, type: integer, source: input, description: "Pickup time as minutes after midnight (e.g. 540 = 09:00)" }
      - { name: kind, type: enum, source: input, description: "GROCERY | APPOINTMENT | COMPANION_OUTING" }
      - { name: estimated_duration_minutes, type: integer, source: input, description: "Planned in-service minutes per occurrence" }
      - { name: estimated_distance_miles, type: integer, source: input, description: "Planned miles per occurrence" }
      - { name: origin_zone, type: string, source: input, description: "Pickup zone label for driver zone-match ranking" }
      - { name: starts_on, type: string, source: input, description: "First series date (YYYY-MM-DD), inclusive" }
      - { name: ends_on, type: string, source: input, description: "Last series date (YYYY-MM-DD), inclusive" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | ENDED; starts ACTIVE" }
      - { name: next_occurrence_date, type: string, source: computed, description: "Next cadence date d with d >= logical today and starts_on <= d <= ends_on; null when none remains", constraints: "nullable" }

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; riding senior" }
      - { name: standing_ride_id, type: string, source: system, description: "FK -> StandingRide.id; set when generated from a series, null for one-off requests", constraints: "nullable" }
      - { name: booked_by_family_member_id, type: string, source: input, description: "FK -> FamilyMember.id; set when booked via family portal", constraints: "nullable" }
      - { name: linked_return_ride_id, type: string, source: input, description: "FK -> Ride.id; optional self-reference to the outbound APPOINTMENT ride this is the return leg of", constraints: "nullable" }
      - { name: kind, type: enum, source: input, description: "GROCERY | APPOINTMENT | COMPANION_OUTING" }
      - { name: origin_zone, type: string, source: input, description: "Pickup zone label for driver zone-match ranking" }
      - { name: scheduled_pickup_at, type: datetime, source: input, description: "Requested pickup instant (ISO8601 UTC)" }
      - { name: estimated_duration_minutes, type: integer, source: input, description: "Planned in-service minutes" }
      - { name: estimated_distance_miles, type: integer, source: input, description: "Planned miles" }
      - { name: requires_wav, type: boolean, source: computed, description: "Snapshot at creation: true iff client.mobility_aid == POWER_WHEELCHAIR" }
      - { name: service_class, type: enum, source: computed, description: "STANDARD | WAV; WAV iff requires_wav — selects the RateCard" }
      - { name: assist_level, type: enum, source: computed, description: "Snapshot at creation of client.assist_level_default: DOOR_TO_DOOR | DOOR_THROUGH_DOOR" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCHING | ASSIGNED | EN_ROUTE | ARRIVED | IN_SERVICE | COMPLETED | CANCELLED | NO_SHOW; starts SCHEDULED" }
      - { name: dispatch_round, type: integer, source: system, description: "Match attempt counter; starts 0, +1 on each dispatch call and +1 on every release-driven rematch" }
      - { name: excluded_driver_ids, type: array, source: system, description: "Driver ids barred from future offers for this ride (declined, offer-expired, or released drivers); starts []" }
      - { name: assigned_driver_id, type: string, source: system, description: "FK -> Driver.id; the accepted driver; null until assigned and cleared on release", constraints: "nullable" }
      - { name: en_route_at, type: datetime, source: system, description: "Logical timestamp of EN_ROUTE event", constraints: "nullable" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical timestamp of ARRIVED event; no-show grace measures from here", constraints: "nullable" }
      - { name: wait_minutes, type: integer, source: computed, description: "Total wait: sum over closed WAIT_STARTED/WAIT_ENDED event pairs of (ended - started) in whole minutes", default: 0 }
      - { name: service_minutes, type: integer, source: computed, description: "COMPLETED minus SERVICE_STARTED in whole minutes; set at completion", constraints: "nullable" }
      - { name: actual_distance_miles, type: integer, source: input, description: "Driver-reported miles at COMPLETE", constraints: "nullable" }
      - { name: quoted_fare_cents, type: integer, source: computed, description: "Provisional fare at creation: fare formula evaluated on estimated duration/distance with zero wait" }
      - { name: final_fare_cents, type: integer, source: computed, description: "Final fare at completion: fare formula evaluated on actuals; null until COMPLETED", constraints: "nullable" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Tiered cancel fee computed at cancel time; 0 for free/system cancels", default: 0 }
      - { name: cancel_reason, type: enum, source: system, description: "CUSTOMER | CLIENT_SUSPENDED | SERIES_PAUSED | SERIES_ENDED", constraints: "nullable" }
      - { name: cancelled_by_role, type: string, source: system, description: "Role that cancelled; null while not cancelled", constraints: "nullable" }
      - { name: no_show_fee_cents, type: integer, source: computed, description: "No-show fee = rate card minimum_charge_cents; set on NO_SHOW", default: 0 }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: ride_id, type: string, source: system, description: "FK -> Ride.id; the ride being matched" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; the offered/accepted driver chosen by the selector policy" }
      - { name: round, type: integer, source: system, description: "Ride dispatch_round at which this offer was created" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | RELEASED; starts OFFERED" }
      - { name: offered_at, type: datetime, source: system, description: "Logical timestamp of offer creation" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + OFFER_TIMEOUT_MINUTES (30)" }
      - { name: responded_at, type: datetime, source: system, description: "Logical timestamp of respond/release", constraints: "nullable" }
      - { name: decline_reason, type: string, source: input, description: "Driver-supplied decline reason", constraints: "nullable" }
      - { name: release_reason, type: string, source: system, description: "DRIVER_RELEASE | RIDE_CANCELLED | DRIVER_SUSPENDED", constraints: "nullable" }
      - { name: matched_by, type: enum, source: system, description: "COORDINATOR; which actor class created the offer" }
      - { name: matched_by_user_id, type: string, source: system, description: "X-User-ID of the Coordinator who ran dispatch; used for segregation-of-duties checks" }

  - name: RideEvent
    parent: null
    common_fields: false
    fields:
      - { name: ride_id, type: string, source: system, description: "FK -> Ride.id; owning ride" }
      - { name: event_type, type: enum, source: system, description: "CREATED | DISPATCHED | OFFERED | ACCEPTED | DECLINED | RELEASED | EN_ROUTE | ARRIVED | WAIT_STARTED | WAIT_ENDED | SERVICE_STARTED | COMPLETED | CANCELLED | NO_SHOW_RECORDED" }
      - { name: actor_role, type: string, source: system, description: "Role whose action logged this event (or system)" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for automatic transitions" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock timestamp when the event was recorded; log is ordered by occurred_at ASC, tie created_at ASC" }
      - { name: note, type: string, source: system, description: "Free-text detail (e.g. decline reason)", constraints: "nullable" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; billed senior" }
      - { name: period_start, type: string, source: input, description: "First billed date (YYYY-MM-DD), inclusive — half-open period [period_start, period_end)" }
      - { name: period_end, type: string, source: input, description: "Last billed date (YYYY-MM-DD), exclusive" }
      - { name: issuance_status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOIDED; starts DRAFT" }
      - { name: dispute_status, type: enum, source: system, description: "NONE | DISPUTED | RESOLVED_ACCEPTED | RESOLVED_REJECTED; independent of issuance_status" }
      - { name: charges_cents, type: integer, source: computed, description: "Sum of per-line rounded amounts (round per line, then sum — pinned order)" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Credit debited at generation: min(client.credit_balance_cents, floor(charges_cents * MAX_CREDIT_SHARE_BP / 10000))" }
      - { name: total_due_cents, type: integer, source: computed, description: "charges_cents - credit_applied_cents (evaluation order pinned: charges first, then credit, then due)" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of non-refunded payment applications", default: 0 }
      - { name: due_date, type: string, source: system, description: "period_end + NET_DAYS (14) days" }
      - { name: past_due, type: boolean, source: system, description: "Set true by run-cycle when logical date > due_date and issuance_status in {ISSUED, PARTIALLY_PAID}; never auto-clears", default: false }
      - { name: resolved_by_user_id, type: string, source: system, description: "BillingAdmin X-User-ID who resolved the dispute", constraints: "nullable" }
      - { name: resolution_credit_cents, type: integer, source: system, description: "Goodwill credit granted on RESOLVE_ACCEPT; posted to client credit pool", default: 0 }

  - name: InvoiceLine
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; owning invoice" }
      - { name: ride_id, type: string, source: system, description: "FK -> Ride.id; the ride this line prices" }
      - { name: line_kind, type: enum, source: system, description: "HOURLY | MILEAGE | WAIT | WAV_SURCHARGE | MINIMUM_ADJUSTMENT | CANCELLATION_FEE | NO_SHOW_FEE" }
      - { name: quantity, type: integer, source: system, description: "Minutes for HOURLY/WAIT, miles for MILEAGE, 1 for flat lines" }
      - { name: unit_rate_cents, type: integer, source: system, description: "Rate snapshot from the ride's rate card; 0 for MINIMUM_ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "Line amount rounded half-up to whole cents at line level (never re-rounded at invoice level)" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; whose balance is being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount; must be > 0" }
      - { name: method, type: enum, source: input, description: "CARD | ACH | CHECK" }
      - { name: status, type: enum, source: system, description: "SETTLED | PARTIALLY_REFUNDED | REFUNDED; starts SETTLED" }
      - { name: refunded_cents, type: integer, source: system, description: "Cumulative refunded amount", default: 0 }
      - { name: applications, type: array, source: system, description: "Ordered list of {invoice_id, applied_cents} in waterfall allocation order (invoice due_date ASC, tie created_at ASC); remainder beyond invoices went to client credit" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /clients/{id} with status=SUSPENDED"
        actor: Coordinator
        preconditions: ["expected_client_version matches current version (OCC)"]
        side_effects:
          - "Every Ride of this client with status in {SCHEDULED, DISPATCHING} -> CANCELLED with cancel_reason=CLIENT_SUSPENDED, cancellation_fee_cents=0, cancelled_by_role=system"
          - "Each such DISPATCHING ride's OFFERED assignments -> EXPIRED with release_reason=RIDE_CANCELLED"
          - "increments Client.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /clients/{id} with status=ACTIVE"
        actor: Coordinator
        preconditions: ["expected_client_version matches current version (OCC)"]
        side_effects: ["increments Client.version by 1"]
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "PATCH /clients/{id} with status=DEACTIVATED"
        actor: Coordinator
        preconditions:
          - "expected_client_version matches current version (OCC)"
          - "No rides with status in {SCHEDULED, DISPATCHING, ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE} (else ERR_CLIENT_HAS_OPEN_WORK)"
          - "No invoices with issuance_status in {DRAFT, ISSUED, PARTIALLY_PAID} (else ERR_CLIENT_HAS_OPEN_WORK)"
        side_effects: ["increments Client.version by 1"]
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "PATCH /clients/{id} with status=DEACTIVATED"
        actor: Coordinator
        preconditions:
          - "expected_client_version matches current version (OCC)"
          - "No rides with status in {SCHEDULED, DISPATCHING, ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE} (else ERR_CLIENT_HAS_OPEN_WORK)"
          - "No invoices with issuance_status in {DRAFT, ISSUED, PARTIALLY_PAID} (else ERR_CLIENT_HAS_OPEN_WORK)"
        side_effects: ["increments Client.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (no_show_count reaches NO_SHOW_STRIKE_LIMIT=3 on a NO_SHOW transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Ride of this client with status in {SCHEDULED, DISPATCHING} -> CANCELLED with cancel_reason=CLIENT_SUSPENDED, cancellation_fee_cents=0"
          - "Each such DISPATCHING ride's OFFERED assignments -> EXPIRED with release_reason=RIDE_CANCELLED"
          - "increments Client.version by 1"

  - entity: FamilyMember
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /family-members/{id}/revoke"
        actor: Coordinator
        preconditions: []
        side_effects: ["member can no longer act on the portal (ownership checks fail)"]

  - entity: Driver
    initial_state: APPLICANT
    terminal_states: [OFFBOARDED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /drivers/{id}/status-events (ACTIVATE)"
        actor: Coordinator
        preconditions:
          - "Compliance posture complete at logical today: for each doc_type in {BACKGROUND_CHECK, BONDING, INSURANCE} there exists an APPROVED doc with valid_from <= today < valid_until (else ERR_DRIVER_COMPLIANCE_INCOMPLETE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /drivers/{id}/status-events (SUSPEND)"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "This driver's ACCEPTED assignments whose ride status is ASSIGNED -> RELEASED with release_reason=DRIVER_SUSPENDED; each such ride -> DISPATCHING with assigned_driver_id=null, dispatch_round +1, driver added to ride.excluded_driver_ids"
          - "OFFERED assignments are NOT auto-expired; they fail at accept time with ERR_DRIVER_NOT_ELIGIBLE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (run-cycle: a required compliance doc expired and posture became incomplete)"
        actor: system
        preconditions: []
        side_effects:
          - "Same ACCEPTED-assignment release cascade as manual SUSPEND"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /drivers/{id}/status-events (REINSTATE)"
        actor: Coordinator
        preconditions:
          - "Compliance posture complete at logical today (else ERR_DRIVER_COMPLIANCE_INCOMPLETE)"
        side_effects: []
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /drivers/{id}/status-events (OFFBOARD)"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Same ACCEPTED-assignment release cascade as SUSPEND"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /drivers/{id}/status-events (OFFBOARD)"
        actor: Coordinator
        preconditions: []
        side_effects: []

  - entity: ComplianceDoc
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /compliance-docs/{id}/review (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["reviewed_by_user_id and review_note recorded"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /compliance-docs/{id}/review (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["reviewed_by_user_id and review_note recorded"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (run-cycle: valid_until <= logical today; half-open window ends)"
        actor: system
        preconditions: []
        side_effects:
          - "If the owning driver is ACTIVE and no other APPROVED doc of the same doc_type covers today, posture is incomplete -> driver auto-SUSPENDED (release cascade fires)"

  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rate-cards/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "effective_from < effective_to (else ERR_RATE_WINDOW_INVALID)"
          - "No other ACTIVE card of the same service_class whose half-open window intersects (else ERR_RATE_WINDOW_OVERLAP); windows touching at a boundary (a.effective_to == b.effective_from) do NOT intersect"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /rate-cards/{id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /rate-cards/{id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: StandingRide
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /standing-rides/{id}/status-events (PAUSE)"
        actor: "Coordinator or Client (own series)"
        preconditions: []
        side_effects:
          - "Generated rides of this series with status SCHEDULED and pickup date > logical today -> CANCELLED with cancel_reason=SERIES_PAUSED, fee 0"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /standing-rides/{id}/status-events (RESUME)"
        actor: "Coordinator or Client (own series)"
        preconditions: []
        side_effects: ["occurrence regeneration runs for the current horizon"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /standing-rides/{id}/status-events (END)"
        actor: "Coordinator or Client (own series)"
        preconditions: []
        side_effects:
          - "Generated rides of this series with status SCHEDULED -> CANCELLED with cancel_reason=SERIES_ENDED, fee 0"
      - from: PAUSED
        to: ENDED
        trigger: "POST /standing-rides/{id}/status-events (END)"
        actor: "Coordinator or Client (own series)"
        preconditions: []
        side_effects:
          - "Generated rides of this series with status SCHEDULED -> CANCELLED with cancel_reason=SERIES_ENDED, fee 0"

  - entity: Ride
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: DISPATCHING
        trigger: "POST /rides/{id}/dispatch"
        actor: Coordinator
        preconditions: ["No OFFERED assignment exists for this ride (else ERR_DUPLICATE_OFFER)"]
        side_effects:
          - "dispatch_round +1; selector policy runs; on non-empty pool an Assignment(OFFERED) is created and a RideEvent DISPATCHED+OFFERED appended; on empty pool ride stays DISPATCHING and dispatch response data is null"
      - from: DISPATCHING
        to: DISPATCHING
        trigger: "POST /rides/{id}/dispatch (re-offer after decline/expiry)"
        actor: Coordinator
        preconditions: ["No OFFERED assignment exists for this ride (else ERR_DUPLICATE_OFFER)"]
        side_effects: ["dispatch_round +1; selector runs with exclusion set applied"]
      - from: DISPATCHING
        to: ASSIGNED
        trigger: "system (an OFFERED assignment is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["assigned_driver_id set to the accepting driver; RideEvent ACCEPTED appended"]
      - from: ASSIGNED
        to: DISPATCHING
        trigger: "system (the ACCEPTED assignment is RELEASED — driver release, ride-independent driver suspension, or compliance cascade)"
        actor: system
        preconditions: []
        side_effects: ["assigned_driver_id=null; dispatch_round +1; releasing driver appended to excluded_driver_ids; RideEvent RELEASED appended"]
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /rides/{id}/execution-events (EN_ROUTE) by assigned driver"
        actor: Driver
        preconditions: ["X-User-ID == ride.assigned_driver_id (else ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["en_route_at set; RideEvent EN_ROUTE appended"]
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /rides/{id}/execution-events (ARRIVED) by assigned driver"
        actor: Driver
        preconditions: ["X-User-ID == ride.assigned_driver_id"]
        side_effects: ["arrived_at set; RideEvent ARRIVED appended"]
      - from: ARRIVED
        to: IN_SERVICE
        trigger: "POST /rides/{id}/execution-events (SERVICE_STARTED) by assigned driver"
        actor: Driver
        preconditions: ["No open wait segment (a WAIT_STARTED without matching WAIT_ENDED)"]
        side_effects: ["RideEvent SERVICE_STARTED appended"]
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /rides/{id}/execution-events (COMPLETE) by assigned driver"
        actor: Driver
        preconditions:
          - "No open wait segment"
          - "actual_distance_miles provided in payload"
        side_effects:
          - "service_minutes, wait_minutes, final_fare_cents computed (final fare variant)"
          - "RideEvent COMPLETED appended"
      - from: ARRIVED
        to: NO_SHOW
        trigger: "POST /rides/{id}/execution-events (NO_SHOW) by assigned driver"
        actor: Driver
        preconditions:
          - "logical now >= arrived_at + NO_SHOW_WAIT_MINUTES (15) (else ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "no_show_fee_cents = rate card minimum_charge_cents"
          - "client.no_show_count +1; if it reaches 3 -> client auto-SUSPENDED with its cancellation cascade"
          - "RideEvent NO_SHOW_RECORDED appended"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rides/{id}/cancel"
        actor: "Client (own), FamilyMember (BOOK_FOR_CLIENT or BILLING_PAYER of client), or Coordinator"
        preconditions: []
        side_effects: ["cancellation_fee_cents per tiered notice rule; cancelled_by_role recorded; RideEvent CANCELLED appended"]
      - from: DISPATCHING
        to: CANCELLED
        trigger: "POST /rides/{id}/cancel"
        actor: "Client (own), FamilyMember, or Coordinator"
        preconditions: []
        side_effects: ["OFFERED assignments -> EXPIRED (release_reason=RIDE_CANCELLED); cancellation fee per notice; RideEvent CANCELLED appended"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /rides/{id}/cancel"
        actor: "Client (own), FamilyMember, or Coordinator"
        preconditions: []
        side_effects: ["ACCEPTED assignment -> RELEASED (release_reason=RIDE_CANCELLED); cancellation fee per notice; driver load derived fields reflect removal"]
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /rides/{id}/cancel"
        actor: "Client (own), FamilyMember, or Coordinator"
        preconditions: []
        side_effects: ["ACCEPTED assignment -> RELEASED (release_reason=RIDE_CANCELLED); notice is by definition < 240 minutes so fee = 100% of minimum_charge_cents"]
      - from: ARRIVED
        to: CANCELLED
        trigger: "POST /rides/{id}/cancel"
        actor: "Client (own), FamilyMember, or Coordinator"
        preconditions: []
        side_effects: ["ACCEPTED assignment -> RELEASED (release_reason=RIDE_CANCELLED); fee = 100% of minimum_charge_cents"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (client suspended / series paused / series ended)"
        actor: system
        preconditions: []
        side_effects: ["cancellation_fee_cents=0; cancel_reason in {CLIENT_SUSPENDED, SERIES_PAUSED, SERIES_ENDED}"]
      - from: DISPATCHING
        to: CANCELLED
        trigger: "system (client suspended)"
        actor: system
        preconditions: []
        side_effects: ["OFFERED assignments -> EXPIRED; cancellation_fee_cents=0; cancel_reason=CLIENT_SUSPENDED"]

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, RELEASED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/respond (decision=ACCEPT)"
        actor: Driver
        preconditions:
          - "X-User-ID == assignment.driver_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "Driver status == ACTIVE (else ERR_DRIVER_NOT_ELIGIBLE)"
          - "Compliance docs valid at the ride's scheduled pickup date (else ERR_DRIVER_NOT_ELIGIBLE)"
          - "No buffered-window overlap with this driver's other ACCEPTED assignments whose ride status is in {ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE} — completed/cancelled/no-show rides occupy no window (else ERR_RIDE_OVERLAP_DRIVER)"
          - "driver.current_load_minutes + ride.estimated_duration_minutes <= driver.max_daily_service_minutes (else ERR_DRIVER_DAILY_CAP_EXCEEDED)"
        side_effects: ["ride -> ASSIGNED; ride.assigned_driver_id set; responded_at set; RideEvent ACCEPTED appended"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/respond (decision=DECLINE)"
        actor: Driver
        preconditions: ["X-User-ID == assignment.driver_id"]
        side_effects: ["driver appended to ride.excluded_driver_ids; RideEvent DECLINED appended"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system (run-cycle: offer_expires_at <= logical now; or the ride was cancelled; or the client was suspended)"
        actor: system
        preconditions: []
        side_effects: ["driver appended to ride.excluded_driver_ids when expired by timeout; RideEvent appended when timeout-driven"]
      - from: ACCEPTED
        to: RELEASED
        trigger: "POST /assignments/{id}/release"
        actor: Driver
        preconditions: ["X-User-ID == assignment.driver_id"]
        side_effects: ["release_reason=DRIVER_RELEASE; ride -> DISPATCHING rematch cycle"]
      - from: ACCEPTED
        to: RELEASED
        trigger: "system (ride cancelled, or driver suspended/offboarded)"
        actor: system
        preconditions: []
        side_effects: ["release_reason in {RIDE_CANCELLED, DRIVER_SUSPENDED}; ride effect depends on the cause (cancel -> terminal; suspension -> DISPATCHING rematch)"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    note: "Two independent state dimensions on one row: issuance_status (DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOIDED) and dispute_status (NONE | DISPUTED | RESOLVED_ACCEPTED | RESOLVED_REJECTED). They evolve independently; a dispute may be raised and resolved while payments arrive."
    transitions:
      - from: "issuance_status=DRAFT"
        to: "issuance_status=ISSUED"
        trigger: "POST /invoices/{id}/issue"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["invoice becomes payable (enters the waterfall candidate set and, after due_date, the billing-hold AR sum)"]
      - from: "issuance_status=ISSUED"
        to: "issuance_status=PARTIALLY_PAID"
        trigger: "system (payment application covers part of total_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["paid_cents increased by applied amount"]
      - from: "issuance_status=ISSUED"
        to: "issuance_status=PAID"
        trigger: "system (payment application covers total_due_cents in full)"
        actor: system
        preconditions: []
        side_effects: ["paid_cents == total_due_cents"]
      - from: "issuance_status=PARTIALLY_PAID"
        to: "issuance_status=PAID"
        trigger: "system (cumulative applications reach total_due_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "issuance_status=PAID"
        to: "issuance_status=PARTIALLY_PAID"
        trigger: "system (refund reversal reduces paid_cents below total_due_cents but above 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "issuance_status=PARTIALLY_PAID"
        to: "issuance_status=ISSUED"
        trigger: "system (refund reversal reduces paid_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "issuance_status=PAID"
        to: "issuance_status=ISSUED"
        trigger: "system (refund reversal reduces paid_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "issuance_status=DRAFT"
        to: "issuance_status=VOIDED"
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: ["paid_cents == 0"]
        side_effects: ["credit_applied_cents is credited back to client.credit_balance_cents (compensation); invoice leaves the waterfall and AR sets"]
      - from: "issuance_status=ISSUED"
        to: "issuance_status=VOIDED"
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: ["paid_cents == 0 (else ERR_INVOICE_NOT_VOIDABLE)"]
        side_effects: ["credit_applied_cents is credited back to client.credit_balance_cents"]
      - from: "dispute_status=NONE"
        to: "dispute_status=DISPUTED"
        trigger: "POST /invoices/{id}/dispute-events (action=RAISE)"
        actor: "Client (own) or FamilyMember with access_level=BILLING_PAYER of this client"
        preconditions: ["issuance_status in {ISSUED, PARTIALLY_PAID} (else ERR_DISPUTE_ACTION_INVALID)"]
        side_effects: []
      - from: "dispute_status=DISPUTED"
        to: "dispute_status=RESOLVED_ACCEPTED"
        trigger: "POST /invoices/{id}/dispute-events (action=RESOLVE_ACCEPT, credit_cents>=0)"
        actor: BillingAdmin
        preconditions:
          - "credit_cents <= total_due_cents (else ERR_INVALID_REQUEST)"
          - "Segregation of duties: resolver X-User-ID must not equal matched_by_user_id of any assignment whose ride is billed on this invoice (else ERR_SOD_CONFLICT)"
        side_effects: ["client.credit_balance_cents += credit_cents; resolution_credit_cents and resolved_by_user_id recorded"]
      - from: "dispute_status=DISPUTED"
        to: "dispute_status=RESOLVED_REJECTED"
        trigger: "POST /invoices/{id}/dispute-events (action=RESOLVE_REJECT)"
        actor: BillingAdmin
        preconditions:
          - "Segregation of duties as above (else ERR_SOD_CONFLICT)"
        side_effects: ["resolved_by_user_id recorded"]

  - entity: Payment
    initial_state: SETTLED
    terminal_states: [REFUNDED]
    transitions:
      - from: SETTLED
        to: PARTIALLY_REFUNDED
        trigger: "POST /payments/{id}/refund with amount_cents < amount_cents - refunded_cents"
        actor: BillingAdmin
        preconditions:
          - "amount_cents(request) <= payment.amount_cents - refunded_cents (else ERR_REFUND_EXCEEDS_SETTLED)"
          - "Credit-portion of the refund (request minus reversed invoice applications) <= client.credit_balance_cents (else ERR_REFUND_CREDIT_SPENT)"
        side_effects: ["applications reversed newest-first; invoice paid_cents/issuance recomputed; credit portion deducted from client credit"]
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund with amount_cents == amount_cents - refunded_cents"
        actor: BillingAdmin
        preconditions: ["same as partial refund"]
        side_effects: ["same reversal mechanics; refunded_cents == amount_cents"]
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund settling the remainder"
        actor: BillingAdmin
        preconditions: ["same as partial refund"]
        side_effects: ["same reversal mechanics"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state preconditions live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: standing-ride-put-stale-version
    parent_entity: StandingRide
    write_endpoint: "PUT /standing-rides/{id}"
    occ_field: "expected_standing_ride_version"
    description: |
      Editing a StandingRide template (which regenerates its future SCHEDULED
      occurrences) with an expected_standing_ride_version that no longer equals
      the current version is rejected: another writer's edit has already
      advanced the template (and rebuilt the occurrence set) since the client
      last read it, so this edit would be based on a stale template.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: client-patch-stale-version
    parent_entity: Client
    write_endpoint: "PATCH /clients/{id}"
    occ_field: "expected_client_version"
    description: |
      Patching a Client (status change with its suspension cascade, or profile
      edits) with an expected_client_version that no longer equals the current
      version is rejected: an intervening write (including system transitions
      such as the no-show auto-suspension) has advanced the client since the
      caller last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ride_fare
    trigger: "ride creation (provisional variant) and ride COMPLETE (final variant)"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (all money integer cents):
      1. hourly_charge_cents = round_half_up(hourly_rate_cents * service_or_est_minutes / 60)
      2. mileage_charge_cents = per_mile_cents * distance_miles
      3. billable_wait_minutes = max(0, wait_minutes - included_wait_minutes)
         wait_charge_cents = billable_wait_minutes * wait_per_minute_cents
      4. subtotal = hourly_charge_cents + mileage_charge_cents + wait_charge_cents
      5. if pickup time-of-day (minutes after midnight UTC) >= after_hours_start_minute:
           subtotal = round_half_up(subtotal * after_hours_multiplier_bp / 10000)
      6. floored = max(subtotal, minimum_charge_cents)
         minimum_adjustment_cents = floored - subtotal   (0 when floor does not bind)
      7. fare = floored + (wav_surcharge_cents if ride.service_class == WAV else 0)
      Rate card: the ACTIVE card of the ride's service_class whose half-open
      window contains the pickup date; exactly one such card must exist.
    input_set: "provisional: estimated_duration_minutes, estimated_distance_miles, wait_minutes=0; final: service_minutes, actual_distance_miles, wait_minutes from event replay"
    constants:
      ROUNDING: "round_half_up to whole cents at steps 1 and 5"
    precision: "integer cents"
    variants:
      - name: provisional_quote
        when: "at ride creation -> Ride.quoted_fare_cents"
        difference: "uses estimated duration/distance and zero wait; identical formula otherwise"
      - name: final_settlement
        when: "at ride completion -> Ride.final_fare_cents and invoice lines"
        difference: "uses actual service_minutes (SERVICE_STARTED -> COMPLETED), driver-reported miles, and replayed wait segments; identical formula otherwise"

  - name: wait_time_billing
    trigger: "ride COMPLETE (feeds ride_fare step 3)"
    algorithm: threshold
    formula: |
      wait_minutes = sum over closed WAIT_STARTED/WAIT_ENDED pairs of (ended - started) in whole minutes
      billable_wait_minutes = max(0, wait_minutes - included_wait_minutes)
      Boundary: wait_minutes == included_wait_minutes bills exactly 0 minutes;
      wait_minutes == included_wait_minutes + 1 bills exactly 1 minute.
      An open wait segment at COMPLETE is rejected (state precondition).
    input_set: "WAIT_STARTED/WAIT_ENDED RideEvent pairs of this ride, in occurred_at order"
    precision: "whole minutes"

  - name: cancellation_fee
    trigger: "POST /rides/{id}/cancel (CUSTOMER reason only; system cancels are always 0)"
    algorithm: threshold
    formula: |
      notice_minutes = (scheduled_pickup_at - logical now) in whole minutes
      if notice_minutes >= FREE_CANCEL_NOTICE_MINUTES (1440): fee = 0
      elif notice_minutes >= LATE_CANCEL_NOTICE_MINUTES (240):
        fee = round_half_up(minimum_charge_cents * 50 / 100)
      else: fee = minimum_charge_cents
      Boundaries: exactly 1440 -> free; exactly 240 -> 50% tier; 239 -> 100% tier.
      EN_ROUTE/ARRIVED cancels necessarily have notice < 240 -> 100% tier.
      Rate card: ACTIVE card of the ride's service_class at pickup date.
    input_set: "the ride being cancelled"
    constants:
      FREE_CANCEL_NOTICE_MINUTES: 1440
      LATE_CANCEL_NOTICE_MINUTES: 240
      LATE_CANCEL_SHARE_BP: 5000
    precision: "integer cents, round_half_up on the 50% tier"

  - name: invoice_aggregation
    trigger: "POST /invoices/generate"
    algorithm: aggregation
    formula: |
      Included rides: client_id matches, scheduled_pickup_at's date in the
      half-open period [period_start, period_end), and status COMPLETED,
      or CANCELLED with cancellation_fee_cents > 0, or NO_SHOW.
      Excluded: SCHEDULED/DISPATCHING/ASSIGNED/EN_ROUTE/ARRIVED/IN_SERVICE rides
      and CANCELLED rides with fee 0.
      Line emission per COMPLETED ride (pinned order):
        HOURLY (qty=service_minutes), MILEAGE (qty=actual_distance_miles),
        WAIT (only when billable_wait_minutes > 0),
        WAV_SURCHARGE (only when service_class == WAV, qty=1),
        MINIMUM_ADJUSTMENT (only when minimum_adjustment_cents > 0, qty=1, unit_rate 0)
      Per CANCELLED ride: CANCELLATION_FEE (qty=1). Per NO_SHOW ride: NO_SHOW_FEE (qty=1).
      ROUNDING ORDER (pinned): each line amount_cents is rounded half-up to whole
      cents at line level FIRST; charges_cents is the plain sum of rounded line
      amounts. The invoice total is NEVER computed by summing unrounded amounts
      and rounding once. (2501-minimum late-cancel twice => 1251 + 1251 = 2502,
      not 2501.)
      Invoice line ordering: rides sorted by scheduled_pickup_at ASC, tie created_at ASC;
      lines within a ride in the pinned emission order above.
    input_set: "client's rides in the billing period per the status filter above"
    precision: "integer cents; per-line round_half_up then sum"

  - name: invoice_credit_application
    trigger: "POST /invoices/generate, immediately after invoice_aggregation"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency resolved by pinned evaluation order:
      1. charges_cents = sum of rounded line amounts (from invoice_aggregation)
      2. credit_applied_cents = min(client.credit_balance_cents,
                                    floor(charges_cents * MAX_CREDIT_SHARE_BP / 10000))
      3. total_due_cents = charges_cents - credit_applied_cents
      The credit share cap is computed from charges BEFORE credit is deducted,
      so the value is well-defined. Client credit is debited by
      credit_applied_cents at generation time (skipped when 0, leaving the
      client row unmutated); voiding the invoice credits exactly
      credit_applied_cents back.
    input_set: "the invoice being generated and the client's current credit_balance_cents"
    constants:
      MAX_CREDIT_SHARE_BP: 5000
    precision: "integer cents; floor on the share cap"

  - name: payment_waterfall
    trigger: "POST /payments"
    algorithm: waterfall_allocation
    formula: |
      Candidate invoices: client's invoices with issuance_status in {ISSUED,
      PARTIALLY_PAID} and total_due_cents > paid_cents.
      Order: due_date ASC, tie created_at ASC (never id).
      Apply remaining = amount_cents to each candidate in order:
        applied = min(remaining, total_due_cents - paid_cents)
        record {invoice_id, applied_cents: applied} in Payment.applications (allocation order)
        invoice.paid_cents += applied; issuance_status recomputed
        remaining -= applied
      Any leftover remaining is credited to client.credit_balance_cents.
    input_set: "client's open invoices per the filter above"
    precision: "integer cents"

  - name: refund_reversal
    trigger: "POST /payments/{id}/refund"
    algorithm: chronological
    formula: |
      Reverse invoice applications in the exact reverse of the original
      allocation order (newest application first). For refund amount R:
        walk applications backwards, reversing up to R in total
        (partial reversal allowed at the tail application);
        each reversal decrements invoice.paid_cents and recomputes issuance_status
        (PAID -> PARTIALLY_PAID when 0 < paid < due; -> ISSUED when paid == 0).
      credit_portion = R - (sum of reversed application cents)
      credit_portion requires client.credit_balance_cents >= credit_portion
      (else the whole refund is rejected with ERR_REFUND_CREDIT_SPENT);
      on success client.credit_balance_cents -= credit_portion.
      refunded_cents += R; status PARTIALLY_REFUNDED, or REFUNDED when
      refunded_cents == amount_cents.
    input_set: "the payment's stored applications array"
    precision: "integer cents"

  - name: driver_load_metrics
    trigger: "GET /drivers/{id} (computed on read against the logical clock date)"
    algorithm: forward_looking
    formula: |
      current_load_minutes (forward-looking variant) = sum of
      estimated_duration_minutes over rides with assigned_driver_id == driver.id,
      pickup date == logical today, status in {ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE}.
      day_worked_minutes (chronological variant) = sum of service_minutes over
      rides with assigned_driver_id == driver.id, pickup date == logical today,
      status == COMPLETED (service_minutes derived from event replay).
      The two variants intentionally diverge for the same driver-day:
      estimates vs actuals, and planned-but-unfinished vs finished work.
    input_set: "driver's rides on the logical date, split by status set"
    precision: "whole minutes"
    variants:
      - name: scheduled_load
        when: "dispatch eligibility and dashboard -> current_load_minutes"
        difference: "counts future/unfinished work at estimated duration"
      - name: worked_actuals
        when: "end-of-day actuals -> day_worked_minutes"
        difference: "counts only COMPLETED rides at replayed service_minutes"

  - name: standing_occurrence_generation
    trigger: "POST /standing-rides, PUT /standing-rides/{id}, RESUME, and POST /ops/run-cycle"
    algorithm: interval_merge
    formula: |
      Generation window: dates d matching the series weekday with
      starts_on <= d <= min(ends_on, logical_today + GENERATION_HORIZON_DAYS)
      and d >= logical_today (dates are calendar days; today included).
      For each such d with no existing ride of this series on d, create a Ride:
      status SCHEDULED, scheduled_pickup_at = d + pickup_time_of_day_minutes,
      estimated fields and kind copied, standing_ride_id set.
      On PUT (template edit): existing generated rides with status SCHEDULED
      and pickup date > logical_today are deleted and the window is regenerated
      from the new parameters; rides in DISPATCHING or later are untouched.
      next_occurrence_date = smallest cadence-matching d >= logical_today with
      starts_on <= d <= ends_on, else null.
    input_set: "the series' cadence fields and the logical today"
    constants:
      GENERATION_HORIZON_DAYS: 14
    precision: "calendar days"

  - name: driver_eligibility
    trigger: "POST /rides/{id}/dispatch (selector filter) and POST /assignments/{id}/respond ACCEPT (recheck)"
    algorithm: constraint_propagation
    formula: |
      A driver is eligible for a ride iff ALL hold:
        a) status == ACTIVE
        b) for each doc_type in {BACKGROUND_CHECK, BONDING, INSURANCE}: an
           APPROVED ComplianceDoc with valid_from <= pickup_date < valid_until
        c) vehicle_class == WAV when ride.requires_wav (any class otherwise)
        d) assist_certification rank >= ride.assist_level rank
           (NONE < DOOR_TO_DOOR < DOOR_THROUGH_DOOR)
        e) no buffered-window overlap with the driver's ACCEPTED assignments whose ride status is in {ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE} (live windows only)
        f) current_load_minutes + ride.estimated_duration_minutes <= max_daily_service_minutes
        g) driver.id not in ride.excluded_driver_ids
      Selector ranking over eligible drivers:
        1. zone match: home_zone == ride.origin_zone ranks before non-match
        2. current_load_minutes ASC
        3. driver created_at ASC (final tie-break; id is NEVER used)
      Fallback: empty pool -> dispatch returns 200 with data null, ride stays
      DISPATCHING, no assignment created.
    input_set: "all drivers, filtered and ranked per above"
    precision: "deterministic total order"

  - name: buffered_window_overlap
    trigger: "driver_eligibility (e) and ACCEPT recheck"
    algorithm: interval_merge
    formula: |
      A ride's occupied window on a driver is the half-open buffered interval
        [pickup_at - TRAVEL_BUFFER_MINUTES, pickup_at + estimated_duration_minutes + TRAVEL_BUFFER_MINUTES)
      Two occupied windows conflict iff start_A < end_B AND start_B < end_A.
      Windows touching exactly (end_A == start_B) do NOT conflict.
    input_set: "the driver's ACCEPTED assignments whose ride status is in {ASSIGNED, EN_ROUTE, ARRIVED, IN_SERVICE} (live windows only), plus the candidate ride"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "whole minutes"

  - name: overdue_ar_and_billing_hold
    trigger: "POST /rides and POST /standing-rides (fiscal gate)"
    algorithm: aggregation
    formula: |
      overdue_ar_cents = sum over the client's invoices with issuance_status in
      {ISSUED, PARTIALLY_PAID} and due_date < logical today of
      (total_due_cents - paid_cents).
      Billing hold fires when overdue_ar_cents >= client.billing_hold_limit_cents
      (boundary: exactly equal triggers the hold).
      due_date == logical today is NOT yet overdue (strict <).
    input_set: "client's issued invoices vs logical today"
    precision: "integer cents"

  - name: no_show_strike
    trigger: "ride NO_SHOW transition"
    algorithm: threshold
    formula: |
      client.no_show_count += 1 on each NO_SHOW.
      On reaching exactly NO_SHOW_STRIKE_LIMIT (3) the client is auto-SUSPENDED
      and the suspension cascade fires (future SCHEDULED/DISPATCHING rides
      cancelled fee-free, their OFFERED assignments expired).
      Counts below the limit have no status effect.
    input_set: "the client's cumulative NO_SHOW rides"
    constants:
      NO_SHOW_STRIKE_LIMIT: 3
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request body is valid JSON; declared required fields present; enum/typed fields well-formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Caller role is in the endpoint's allowed role list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Entity-backed ownership: Client acts only on own resources (X-User-ID == resource's client_id); Driver only on own assignments/rides; FamilyMember only on their client's resources"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "resource-scoped endpoints"
  - priority: 5
    category: auth
    check: "FamilyMember access tier: booking requires access_level in {BOOK_FOR_CLIENT, BILLING_PAYER}; payments require BILLING_PAYER; member status must be ACTIVE"
    error_id: ERR_FAMILY_ACCESS_INSUFFICIENT
    http_status: 403
    applies_to: "POST /rides, POST /standing-rides, POST /payments, POST /rides/{id}/cancel, POST /invoices/{id}/dispute-events"
  - priority: 6
    category: existence
    check: "Path and body-referenced ids exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 7
    category: state
    check: "Target entity is in a state permitting the operation (per-entity state errors below)"
    error_id: "ERR_RIDE_NOT_CANCELLABLE | ERR_RIDE_NOT_DISPATCHABLE | ERR_ASSIGNMENT_NOT_ACTIONABLE | ERR_ASSIGNMENT_RELEASE_INVALID | ERR_EXECUTION_EVENT_INVALID | ERR_INVOICE_NOT_ISSUABLE | ERR_INVOICE_NOT_VOIDABLE | ERR_DISPUTE_ACTION_INVALID | ERR_PAYMENT_NOT_REFUNDABLE | ERR_STANDING_STATUS_INVALID | ERR_RATE_CARD_STATE_INVALID | ERR_DOC_ALREADY_REVIEWED | ERR_DRIVER_STATE_INVALID | ERR_CLIENT_SUSPENDED"
    http_status: 409
    applies_to: "state transition endpoints; POST /rides and POST /standing-rides for the client-active check"
  - priority: 8
    category: business_safety
    check: "Concurrency precondition: expected_<parent>_version equals current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /standing-rides/{id}, PATCH /clients/{id}"
  - priority: 9
    category: business_safety
    check: "Driver compliance/eligibility: activation requires complete posture; ACCEPT requires driver ACTIVE with docs valid at pickup date; WAV/assist capability satisfied"
    error_id: "ERR_DRIVER_COMPLIANCE_INCOMPLETE | ERR_DRIVER_NOT_ELIGIBLE | ERR_DRIVER_DAILY_CAP_EXCEEDED"
    http_status: 409
    applies_to: "POST /drivers/{id}/status-events, POST /assignments/{id}/respond"
  - priority: 10
    category: business_temporal
    check: "Window validity: doc valid_from < valid_until; rate effective_from < effective_to; standing starts_on <= ends_on; invoice period_start < period_end; no-show grace elapsed"
    error_id: "ERR_DOC_WINDOW_INVALID | ERR_RATE_WINDOW_INVALID | ERR_STANDING_WINDOW_INVALID | ERR_INVOICE_PERIOD_INVALID | ERR_NO_SHOW_TOO_EARLY"
    http_status: 422
    applies_to: "windowed create/action endpoints (ERR_NO_SHOW_TOO_EARLY is 409)"
  - priority: 11
    category: business_constraint
    check: "Occupancy/uniqueness: driver buffered-window overlap; rate-card window overlap; invoice period overlap; duplicate live offer; empty invoice set; open-work deactivation guard"
    error_id: "ERR_RIDE_OVERLAP_DRIVER | ERR_RATE_WINDOW_OVERLAP | ERR_INVOICE_PERIOD_OVERLAP | ERR_DUPLICATE_OFFER | ERR_INVOICE_EMPTY | ERR_CLIENT_HAS_OPEN_WORK"
    http_status: 409
    applies_to: "POST /assignments/{id}/respond, POST /rate-cards/{id}/activate, POST /invoices/generate, POST /rides/{id}/dispatch, PATCH /clients/{id}"
  - priority: 12
    category: business_referential
    check: "Cross-reference integrity: linked_return_ride_id targets a SCHEDULED APPOINTMENT ride of the SAME client with no return link of its own; booked_by_family_member_id belongs to the ride's client"
    error_id: "ERR_RETURN_LINK_MISMATCH | ERR_FAMILY_CLIENT_MISMATCH"
    http_status: 409
    applies_to: "POST /rides, POST /standing-rides"
  - priority: 13
    category: business_fiscal
    check: "Rate card must be ACTIVE for the derived service_class at pickup; billing hold (overdue AR >= limit); payment amount > 0; refund caps"
    error_id: "ERR_RATE_CARD_NOT_ACTIVE | ERR_BILLING_HOLD | ERR_PAYMENT_AMOUNT_INVALID | ERR_REFUND_EXCEEDS_SETTLED | ERR_REFUND_CREDIT_SPENT"
    http_status: 402
    applies_to: "POST /rides, POST /standing-rides, POST /payments, POST /payments/{id}/refund (ERR_RATE_CARD_NOT_ACTIVE and ERR_INVALID_REQUEST-class 422s use their own codes' statuses)"
  - priority: 14
    category: auth
    check: "Segregation of duties: dispute resolver X-User-ID must not equal matched_by_user_id of any assignment whose ride is billed on the invoice"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "POST /invoices/{id}/dispute-events (RESOLVE_ACCEPT, RESOLVE_REJECT)"
    description: "Evaluated after existence/state of the invoice and dispute dimension are established."

