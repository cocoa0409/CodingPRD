  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: protest_ratio_exactly_at_threshold_forms
        grounds:
          - calculations.protest_ratio
          - state_machines.AssessmentDistrict.PROTEST_PERIOD_to_FORMED
          - entities.AssessmentDistrict.fields.protest_threshold_pct
        distinguishing_aspect: "protest_ratio == threshold exactly (50/100 == 0.50) is NOT a majority protest because the comparison is STRICT greater-than, so close-hearing FORMS the district — a ratio-metric boundary reached via close-hearing."
        test_recipe:
          setup:
            - "District DBD in PROTEST_PERIOD with PX(bu50) and PY(bu50); PX's owner has filed exactly one protest so protest weight is 50 of 100."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DBD", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000, protest_threshold_pct: 50 }
              as: DistrictAdministrator
              captures: { dbd: "$.data.id" }
            - call: "POST /districts/${dbd}/parcels"
              payload: { apn: "X-1", owner_name: "OX", benefit_units: 50 }
              as: DistrictAdministrator
              captures: { px: "$.data.id" }
            - call: "POST /districts/${dbd}/parcels"
              payload: { apn: "Y-1", owner_name: "OY", benefit_units: 50 }
              as: DistrictAdministrator
            - call: "POST /districts/${dbd}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /parcels/${px}/protests"
              payload: { filed_by: "OX" }
              as: ParcelOwner
              as_user_id: "${px}"
          trigger:
            - call: "POST /districts/${dbd}/close-hearing"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "AssessmentDistrict.${dbd}.status == FORMED"

      - name: delinquency_marks_exactly_at_due_plus_grace
        grounds:
          - state_machines.Installment.DUE_to_DELINQUENT
          - validations[priority=8]
          - errors[ERR_GRACE_NOT_ELAPSED]
        distinguishing_aspect: "mark-delinquent succeeds when the clock is exactly due_date + GRACE_DAYS (2027-07-01 + 30 = 2027-07-31) because the check is >= — a day-count boundary on a different metric and a different endpoint (mark-delinquent) than the protest-ratio boundary."
        test_recipe:
          setup:
            - "District DBG FORMED, single parcel (assessed 1000000), bond term 1 issued at 2026-07-01 (installment due 2027-07-01); clock advanced to exactly 2027-07-31."
