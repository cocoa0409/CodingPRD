          assert:
            - "first trigger call — HTTP 409 with error_id ERR_RESORT_NOT_AFFILIATED, NOT 422 ERR_NO_SEASON_BAND_FOR_DATE"
            - "GET /exchange-network/deposits?resort_id=${resort_a} — total_count == 0 after the first call"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 0 after the first call"
            - "third trigger call, resort now ACTIVE and everything else identical — HTTP 422 with error_id ERR_NO_SEASON_BAND_FOR_DATE, proving the referential rule was live and merely outranked"
            - "GET /exchange-network/deposits?resort_id=${resort_a} — total_count == 0 after the third call as well"
            - "GET /exchange-network/resorts/${resort_a} — affiliation_status == \"ACTIVE\", deposits_committed_count == 0, committed_nights == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    rule_summary: >-
      A threshold tested at exactly the boundary value and at the adjacent value
      on the losing side, so an off-by-one comparison produces a different
      observable number rather than a rounding wobble.
    instances:

      - name: lead_time_factor_boundary_at_exactly_180_days
        boundary: "lead_time_days >= 180 selects lead_factor 1.10; 179 falls to the 1.00 band"
        why_hard: >-
          The lead-time band table is inclusive on its lower edge and the interval is measured in
          whole days from the logical clock to check_in_date. At exactly 180 days the week is worth
          62; one day nearer, at 179, it is worth 56. A ">" instead of ">=", or a lead time measured
          from created_at with a time component, or a lead time computed as an inclusive day count,
          all shift one of the two numbers. Both deposits are placed at the same resort with
          overlapping occupancy intervals, which units_per_size 2 permits, so the only thing that
          differs between them is the single day.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, GOLD_CROWN and a single
            PLATINUM band 01-01..03-31, affiliated at the default clock 2026-08-01. Member M1 on
            PLUS, dues-paid through 2030-12-31. Two STUDIO weeks are banked back to back: check-in
            2027-01-28 is exactly 180 days out, check-in 2027-01-27 is exactly 179 days out. Both
            clear the 60-day minimum banking window.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "PLATINUM", start_month_day: "01-01", end_month_day: "03-31" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2027-01-28" }
              captures: { dep_at_180: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2027-01-27" }
              captures: { dep_at_179: "$.data.id" }
          assert:
            - "GET /exchange-network/deposits/${dep_at_180} — awarded_power == 62 (30 * 1.50 * 1.10 = 49.5 -> 50, +6 = 56, lead 180 -> factor 1.10, 61.6 -> 62)"
            - "GET /exchange-network/deposits/${dep_at_179} — awarded_power == 56 (same 56 subtotal, lead 179 -> factor 1.00, 56)"
            - "GET /exchange-network/deposits/${dep_at_180}/valuation — awarded_lead_time_days == 180 and season_band_code == \"PLATINUM\" and unit_size_base == 30 and season_multiplier == \"1.50\" and demand_multiplier == \"1.10\" and quality_bonus == 6"
            - "GET /exchange-network/deposits/${dep_at_179}/valuation — awarded_lead_time_days == 179"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 118 (62 + 56)"
            - "GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 2 and committed_nights == 16 (both weeks counted even though their occupancy intervals overlap, because units_per_size is 2)"

      - name: full_restore_at_exactly_thirty_days_before_check_in
        boundary: "days_to_check_in >= 30 selects FULL_RESTORE; 29 selects PRORATED_RESTORE"
        why_hard: >-
          Cancelling exactly 30 days before the awarded check-in must restore all 82 points to the
          exchanging member, leave the depositing owner's 82 untouched, charge only the tier
          cancellation fee of 8900 with no late surcharge, and create no GetawayOffer at all. One day
          later the same call takes a 21-point haircut, adds a 7500 surcharge, and lists the week.
          Testing only the strict side hides an off-by-one; testing both sides pins six numbers.
        test_recipe:
          setup: >-
            Identical to the canonical exchange chain: Tier PLUS, Resort A (units_per_size 2,
            demand_index 4, GOLD_CROWN, GOLD band 04-01..06-30) affiliated at the default clock;
            M1 and M2 on PLUS with wallet 80100; M1 banks ONE_BR 2027-06-15 for 82; M2 banks TWO_BR
            2027-05-10 for 107 and funds a DEPOSIT_FIRST ONE_BR request over 2027-06-01..2027-06-30,
            paying 23060 so wallet becomes 57040; a run reserves M1's week and M2 confirms, debiting
            82 and leaving M2 with 25. The clock is then set to 2027-05-16, exactly 30 days before
            the awarded check-in of 2027-06-15.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "reserve M1's week" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req}" }
              captures: { conf: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
