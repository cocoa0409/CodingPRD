            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Ten", date_of_birth: "1971-12-01", payer_policy_id: "${pp10}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat10: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat10}", device_serial: "SN-010", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { de10: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de10}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de10}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat10}", component_type: "TUBING" }
              as: OpsAdmin
              captures: { tub10: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat10}"
              payload: {}
              as: OpsAdmin
              captures: { pat10_v_pre: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat10}", component_supply_plan_id: "${tub10}", requested_quantity: 1, expected_patient_version: "${pat10_v_pre}" }
              as: IntakeCoordinator
              captures: { ro10: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${ro10}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
              as_user_id: "rt-1"
            # force patient.version to advance so the upcoming authorize is stale
            - call: "GET /sleep-therapy/patients/${pat10}"
              payload: {}
              as: OpsAdmin
              captures: { pat10_v_current: $.data.version }
          trigger:
            # authorizer == clinical clearer (SoD violation) AND stale version
