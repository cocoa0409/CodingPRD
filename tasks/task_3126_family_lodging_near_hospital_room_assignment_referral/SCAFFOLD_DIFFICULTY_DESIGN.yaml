          - errors.ERR_FOOD_SAFETY_CERT_EXPIRED
        distinguishing_aspect: |
          Entity pair MealShift -> VolunteerGroup (different pair from
          StayRequest -> Room): an OPEN shift cannot be claimed by an
          UNCERTIFIED group (ERR_FOOD_SAFETY_CERT_REQUIRED), nor by a group
          whose certification expires before the shift date
          (ERR_FOOD_SAFETY_CERT_EXPIRED), while a group certified through the
          shift date succeeds.
        test_recipe:
          setup:
            - "House with two meal shifts: LUNCH on 2026-09-08 and DINNER on 2026-09-12. Group G_UNCERT never certified; group G_OK certified_until 2026-09-10. Logical clock 2026-09-01."
          setup_api_calls:
