          - calculations.retiree_medical_liability_valuation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / liability_valuation_projected_unit_credit_versus_full_eligibility
          rationale: "That instance runs both methods over the same cohort and asserts apbo 2742856 versus 3657142 with the 914286 delta."

      - name: claim_variant_selected_by_lifecycle_phase
        claim_type: Variant Selection
        grounds:
