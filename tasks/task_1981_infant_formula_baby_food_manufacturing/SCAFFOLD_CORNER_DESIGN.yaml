                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: COMPLAINT_HANDLER
              captures: { err_unauth: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: duplicate_profile_code_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Creating a second NutrientProfile with the same profile_code returns 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup:
            - "One NutrientProfile with profile_code INF-0-6M exists."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "C", unit: "mg", min_per_100kcal: 60.0, max_per_100kcal: 180.0, target_per_100kcal: 120.0}]
                regulation_ref: "EU 2016/127"
                effective_from: "2026-06-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { err_dup: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_CODE"

      - name: invalid_numeric_range_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_RANGE]
        distinguishing_aspect: "Audit score of 101.00 exceeds the 0-100 range and returns ERR_INVALID_RANGE."
