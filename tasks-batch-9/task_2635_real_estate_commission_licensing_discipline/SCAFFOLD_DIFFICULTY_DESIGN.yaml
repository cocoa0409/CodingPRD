  - rule_id: compensating_invariant
    instances:
      - name: vacatur_restores_the_recovery_fund_identity_while_the_assessment_stays_spent
        grounds:
          - entities.RecoveryFund.fields.balance_cents
          - state_machines.SanctionOrder.SATISFIED_to_VACATED
          - state_machines.RecoveryFundClaim.PAID_to_CLAWED_BACK
          - state_machines.RecoveryFundClaim.ELIGIBLE_to_DENIED
          - calculations.recovery_fund_award_waterfall
        distinguishing_aspect: |
          The conserved quantity is the fund identity
          balance_cents == appropriated + fine_credits + clawed_back - awarded - assessment.
          The vacatur reverses two different money flows (the fine credit and every award) yet the
          2% administrative assessment is deliberately NOT compensated, so the balance does not
          return to its pre-disbursement value while the identity holds exactly. A test that merely
          compares balances before and after cannot distinguish a correct implementation from one
          that also refunds the assessment.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker and salesperson Rae Field (ACTIVE) affiliated"
            - "a hearing chaired by chair-01 decided VIOLATION_FOUND against Rae Field with sanction_type REVOCATION and fine_cents 500000 at 2026-08-05T09:00:00Z, so a SanctionOrder is ISSUED"
            - "Rae Field paid the 500000-cent fine in full, so the order is SATISFIED, fund_credited_cents == 500000 and the fund holds 2900000 appropriated plus 500000 of fine credits, i.e. balance_cents == 3400000"
            - "two recovery claims were filed in this created_at ASC order: 2500000 cents then 1000000 cents"
            - "the disbursement ran the floor_constrained variant: awards 2000000 and 842000, total_awarded 2842000, assessment 56840, balance 501160"
            - "a third claim of 300000 cents was filed after the run and sits ELIGIBLE"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Rae Field", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { rae_id: $.data.id }
            - call: "POST /commission/licensees/${rae_id}/exam-results"
              payload: { score: 84, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${rae_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Ora Buyer", respondent_licensee_id: "${rae_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 3000000 }
              as: Public
              captures: { c_id: $.data.id }
            - call: "POST /commission/complaints/${c_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-05" }
