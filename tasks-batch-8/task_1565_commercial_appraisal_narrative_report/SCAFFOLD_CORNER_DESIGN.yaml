              as_user_id: "${cl_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "at exactly +30 days: RevisionRequest.${rq1_id}.status == OPEN (created)"
            - "after withdraw + reissue (window restarts at 2026-08-31T00:00:00Z), request at +30d+1s: error_id == ERR_REVISION_WINDOW_CLOSED"

      - name: engagement_letter_expiry_sweep
        claim_type: constants_applied
        grounds: [state_machines.Engagement.PENDING_ACCEPTANCE_to_EXPIRED]
        distinguishing_aspect: "Letter validity is strictly greater than 14 days: at exactly submitted_at + 14 days the engagement is still PENDING_ACCEPTANCE; one second later the clock sweep moves it to EXPIRED and accept fails."
        test_recipe:
          setup: ["engagement submitted at default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: EngagementManager
            - call: "GET /engagements/${eng_id}"
              as: EngagementManager
              captures: { st_at_14: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:01Z" }
              as: EngagementManager
            - call: "GET /engagements/${eng_id}"
              as: EngagementManager
              captures: { st_past: $.data.status }
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "at exactly +14 days: status == PENDING_ACCEPTANCE (strictly-greater rule)"
            - "at +14 days + 1s: status == EXPIRED (sweep ran)"
            - "accept after expiry: error_id == ERR_INVALID_STATE_TRANSITION"

      - name: fee_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.fee_quote]
        excluded_because:
          difficulty_instance: fee_tiered_vs_per_sf_diverge
          rationale: "Both fee variants asserted with literal values there."

      - name: noi_variant_divergence
