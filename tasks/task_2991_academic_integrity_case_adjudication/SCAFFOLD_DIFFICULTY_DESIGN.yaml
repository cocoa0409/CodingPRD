              payload: { case_id: "${case_a_id}", expected_case_version: "${case_a_version}", kind: "TRANSCRIPT_NOTATION_ONLY", ladder_rank: 4, effective_from: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sanction_a_id: $.data.id }
          trigger:
            - call: "POST /integrity/sanctions/${sanction_a_id}/impose"
              as: IntegrityOfficer
          assert:
            - "HOP 1: Sanction.${sanction_a_id}.status == IMPOSED and imposed_at == 2026-08-20T10:00:00Z"
            - "HOP 2: Case.${case_a_id}.adjudication_status == SANCTION_IMPOSED and Case.${case_a_id}.notation_status == PENDING_POSTING"
            - "HOP 3: Student.${student_id}.prior_upheld_count == 1, active_sanction_points == 4, standing == GOOD_STANDING (rank 4 is neither the probation rank 5 nor >= 6)"
            - "HOP 4: Case.${case_b_id}.cross_course_pattern_points == 4 and Case.${case_b_id}.distinct_other_course_codes-equivalent count is 1 (ENGL-201 only, and ENGL-202 - case B's own course - is excluded)"
            - "HOP 4: Case.${case_b_id}.prior_upheld_count_at_assessment == 1 and Case.${case_b_id}.provisional_severity_index == 48.00 (20 base + 24.00 evidence + 4 cross)"
            - "HOP 4: Case.${case_b_id}.prior_escalation_points == 8, NOT 14 - the band is read from the provisional 48.00, which is below the 50.00 pivot"
            - "HOP 4: Case.${case_b_id}.severity_index == 56.00 and NOT 62.00, and Case.${case_b_id}.recommended_ladder_rank == 5 with band [4, 6]"
            - "HOP 5: Sanction.${sanction_b_id}.status == VACATED with vacated_reason == LADDER_RECOMPUTE, because rank 3 is now outside [4, 6]"
            - "HOP 5: case B has a Notification with kind SANCTION_RECOMPUTE_NOTICE"
            - "Case.${case_b_id}.adjudication_status is still INFORMAL_PROPOSED - the recompute vacates the proposal but does not move case B's own state machine"
            - "Case.${case_b_id}.informal_severity_index is still 44.00 and informal_recommended_ladder_rank is still 3: the informal variant never reads cross_course_pattern_points or prior_escalation_points, so HOP 4 leaves both untouched"
            - "Case.${case_a_id}.severity_index is still 44.00 - HOP 4 re-assesses only OTHER cases, never the case that triggered the cascade"
            - "Student.${student_id}.active_sanction_points == 4 exactly once: the vacated sibling proposal was never IMPOSED and must not be subtracted"

      - name: appeal_overturn_cascade_four_hops_unwinds_the_notation_and_the_sibling_band
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.Case.APPEAL_UNDER_REVIEW_to_CLOSED
          - state_machines.Sanction.IMPOSED_to_VACATED
          - calculations.cross_course_pattern_points
          - calculations.case_severity_index
          - entities.Department.fields.open_case_count
          - entities.Student.fields.transcript_notation
          - invariants.inv-department-open-cases
        distinguishing_aspect: |
          This is the COMPENSATING direction of the same graph and it is four hops deep, not five, and it
          differs from the impose cascade in what makes the sibling recompute fire. Here case A stays
          decided_at != null and RESPONSIBLE-shaped in the raw row, yet it drops out of case B's
          cross-course input set purely because overturned flips to true - a filter on a boolean flag, not
          on the 730-day window or on the state machine. The single call therefore drives THREE separate
          decrements that a partial implementation will get wrong independently: active_sanction_points
          4 -> 0, Department.open_case_count 2 -> 1, and case B's cross points 4 -> 0 with escalation
          8 -> 0. HOP 4 also has no SANCTION_RECOMPUTE_NOTICE (unlike HOP 5 of the impose cascade), and
          the notation dimension moves POSTED -> EXPUNGED rather than being reset to NOT_APPLICABLE,
          which is only correct because the notation had already been posted.
