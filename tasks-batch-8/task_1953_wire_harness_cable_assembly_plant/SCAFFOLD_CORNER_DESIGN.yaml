# =============================================================================
# Task 1953 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth enumeration over §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# Logical clock default is 2026-08-01T00:00:00Z unless set via /plant/_clock.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: c_drawing_create_readonly_status_input_ignored
        claim_type: defaults
        grounds: [entities.HarnessDrawing.fields.status, "validations[priority=1]"]
        distinguishing_aspect: "Client-supplied read-only fields (status) are ignored; a new drawing is always DRAFT with version 1 and released_at null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2", status: "RELEASED" }, as: HarnessEngineer, captures: { dr: $.data.id } }
          assert:
            - "HarnessDrawing.${dr}.status == DRAFT   # client-supplied status ignored"
            - "HarnessDrawing.${dr}.version == 1"
            - "HarnessDrawing.${dr}.released_at is null"
            - "HarnessDrawing.${dr}.id is a server-minted UUID with no type prefix"

      - name: c_drawing_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=1]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required workmanship_class yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E2", customer_code: "ACME", revision: "A" }, as: HarnessEngineer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: c_get_drawing_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/drawings/00000000-0000-0000-0000-000000000000", payload: {}, as: HarnessEngineer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: c_components_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /plant/components]"]
        distinguishing_aspect: "Default pagination returns limit 10 / total_count 11 / has_more true on page 1; offset 10 returns the 11th row with has_more false; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["One DRAFT drawing with 11 components F00..F10"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E4", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F00", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F01", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F02", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F03", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F04", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F05", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F06", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F07", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F08", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F09", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F10", component_type: "WIRE", mpn: "WIRE-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer }
          trigger:
            - { call: "GET /plant/components", payload: { drawing_id: "${dr}" }, as: HarnessEngineer }
            - { call: "GET /plant/components", payload: { drawing_id: "${dr}", offset: 10 }, as: HarnessEngineer }
          assert:
            - "page 1: len(data) == 10 and total_count == 11 and has_more == true"
            - "page 2 (offset 10): len(data) == 1 and has_more == false"
            - "envelope: meta.api_request_id present and response_type == 'array'"

      - name: c_component_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=1]", entities.DrawingComponent.fields.component_type]
        distinguishing_aspect: "component_type 'PLASTIC' is outside the declared enum and yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One DRAFT drawing"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E5", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
          trigger:
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "X1", component_type: "PLASTIC", mpn: "M-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: c_program_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.MachineProgram.fields.min_pull_force_n, calculations.crimp_pull_force_minimum]
        distinguishing_aspect: "A client-supplied min_pull_force_n of 999.0 is ignored; the stored value is computed as 29.7 (class 3, AWG 22, CLOSED_BARREL)."
        test_recipe:
          setup: ["Released class-3 drawing; applicator"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E6", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_3" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-22", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-E6", compatible_terminal_mpn: "TERM-22" }, as: ProcessEngineer, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-E6", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 22, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-22", terminal_type: "CLOSED_BARREL", min_pull_force_n: 999.0 }, as: ProcessEngineer, captures: { pr: $.data.id } }
          assert:
            - "MachineProgram.${pr}.min_pull_force_n == 29.7   # computed, 999.0 ignored"

      - name: c_pull_test_record_immutable_common_fields_absent
        claim_type: immutability
        grounds: [entities.CrimpPullTest]
        distinguishing_aspect: "CrimpPullTest declares common_fields: false — its GET representation carries id and created_at but no version and no updated_at keys, and no update endpoint exists."
        test_recipe:
          setup: ["Qualified flow up to one recorded FIRST_ARTICLE pull test"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-E7", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-E7", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-E7", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI E7", badge_no: "B-QI-E7" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { pt: $.data.id } }
          trigger:
            - { call: "GET /plant/crimp-pull-tests/${pt}", payload: {}, as: QualityInspector }
          assert:
            - "response data has key 'id' and key 'created_at'"
            - "response data has NO key 'version' and NO key 'updated_at'   # common_fields: false"
            - "CrimpPullTest.${pt}.result == PASS and tested_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: c_component_fk_drawing_not_found
        claim_type: parent_relationships
        grounds: [entities.DrawingComponent.fields.drawing_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a component against a non-existent drawing_id yields 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/components", payload: { drawing_id: "00000000-0000-0000-0000-000000000000", find_number: "X1", component_type: "WIRE", mpn: "W-1", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 10 }, as: HarnessEngineer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_drawing_release_gates
        claim_type: precondition_enforcement
        grounds: [state_machines.HarnessDrawing.DRAFT_to_RELEASED, "errors[ERR_DRAWING_EMPTY_BOM]", "errors[ERR_DRAWING_NOT_DRAFT]"]
        distinguishing_aspect: "Release with an empty BOM fails ERR_DRAWING_EMPTY_BOM; after release the drawing is RELEASED; a second release and a component add on the RELEASED drawing both fail ERR_DRAWING_NOT_DRAFT."
        test_recipe:
          setup: ["Drawing DWG-S1 in DRAFT, no components"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
          trigger:
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer, captures: { err1: $.data.error_id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer, captures: { rel: $.data.status } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer, captures: { err2: $.data.error_id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T2", component_type: "TERMINAL", mpn: "TERM-21", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { err3: $.data.error_id } }
          assert:
            - "captured err1 == ERR_DRAWING_EMPTY_BOM"
            - "captured rel == RELEASED"
            - "captured err2 == ERR_DRAWING_NOT_DRAFT   # invalid transition: release from RELEASED"
            - "captured err3 == ERR_DRAWING_NOT_DRAFT   # BOM immutable once released"

      - name: c_superseded_drawing_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.HarnessDrawing.RELEASED_to_SUPERSEDED, "errors[ERR_DRAWING_NOT_DRAFT]", "errors[ERR_DRAWING_NOT_RELEASED]"]
        distinguishing_aspect: "SUPERSEDED is terminal: release, program creation, and build-order creation against the superseded revision all fail; the ECN-created revision-B drawing is DRAFT and independent."
        test_recipe:
          setup: ["Released drawing rev A with one component; OPEN ECN to rev B with USE_AS_IS disposition (no build orders exist)"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-S2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/ecns", payload: { drawing_id: "${dr}", to_revision: "B", wip_disposition: "USE_AS_IS" }, as: HarnessEngineer, captures: { ecn: $.data.id } }
            - { call: "POST /plant/ecns/${ecn}/apply", payload: {}, as: HarnessEngineer, captures: { new_dr: $.data.new_drawing_id } }
          trigger:
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer, captures: { err1: $.data.error_id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-S2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { err2: $.data.error_id } }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-S2", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { err3: $.data.error_id } }
            - { call: "GET /plant/drawings/${new_dr}", payload: {}, as: HarnessEngineer }
          assert:
            - "captured err1 == ERR_DRAWING_NOT_DRAFT"
            - "captured err2 == ERR_DRAWING_NOT_RELEASED"
            - "captured err3 == ERR_DRAWING_NOT_RELEASED"
            - "HarnessDrawing.${new_dr}.status == DRAFT and revision == B"

      - name: c_kit_auto_stage_on_zero_shortage
        claim_type: side_effect_execution
        grounds: [state_machines.Kit.PICKING_to_STAGED, calculations.kit_completeness]
        distinguishing_aspect: "The kit auto-transitions PICKING -> STAGED in the same request whose issue drives shortage_count to exactly 0 (zero-count boundary); the issue response itself shows STAGED."
        test_recipe:
          setup: ["Qualified flow; order qty 1; BOM T(qty 2) + W(qty 1); kit PICKING"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S3", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 2, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "W1", component_type: "WIRE", mpn: "WIRE-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 50 }, as: HarnessEngineer, captures: { w1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-S3", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-S3", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI S3", badge_no: "B-QI-S3" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-S3", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
          trigger:
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 2, source: "FACTORY_STOCK" }, as: MaterialsClerk, captures: { mid_status: $.data.status, mid_short: $.data.shortage_count } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${w1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk, captures: { end_status: $.data.status, end_short: $.data.shortage_count } }
          assert:
            - "captured mid_status == PICKING and mid_short == 1"
            - "captured end_status == STAGED and end_short == 0   # auto-stage at exactly zero shortage"

      - name: c_kit_state_gates
        claim_type: invalid_transition
        grounds: [state_machines.Kit.STAGED_to_DELIVERED_LINESIDE, "errors[ERR_KIT_NOT_STAGED]", "errors[ERR_KIT_NOT_PICKING]"]
        distinguishing_aspect: "Deliver from PICKING fails ERR_KIT_NOT_STAGED; issuing into a STAGED kit fails ERR_KIT_NOT_PICKING (state check precedes the line over-issue constraint)."
        test_recipe:
          setup: ["Qualified flow; order qty 1; BOM T(qty 1); kit PICKING"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S4", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-S4", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-S4", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI S4", badge_no: "B-QI-S4" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
