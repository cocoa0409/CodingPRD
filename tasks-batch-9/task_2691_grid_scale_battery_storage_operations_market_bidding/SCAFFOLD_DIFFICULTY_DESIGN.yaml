        distinguishing_aspect: |
          Depth 4 from a completely different trigger (POST /capacity-tests/{id}/complete) over a
          different entity chain: the test's own SOH figures (link 1) rewrite the asset's soh_pct,
          available_energy_mwh, cumulative_throughput_mwh and equivalent_full_cycles_ytd (link 2),
          the reduced available energy derates the CapacityObligation to SHORTFALL (link 3), and
          the changed throughput ratio re-prices every DRAFT MarketBid from 37.00 to 42.60
          (link 4). Links 3 and 4 both read link 2's output, so link 2 must be applied first.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A4 registered and commissioned with warranty_throughput_limit_mwh 200.0 and initial_cumulative_throughput_mwh 80.0 (rated 100.0, available 100.0, soh 100.0, efc 0.4, throughput ratio 0.4 — below the 0.5 warranty knee)"
