      - name: milestone_window_must_be_ordered_and_minute_aligned
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_WINDOW]
          - entities.Milestone.fields.window_start
        distinguishing_aspect: "ERR_INVALID_WINDOW (422) covers two separate defects at priority 15 - an inverted pair and a bound carrying seconds - and neither is downgraded to ERR_INVALID_REQUEST at priority 5, because both bounds parse as valid ISO-8601 UTC."
        test_recipe:
          setup:
            - "One DRAFT campaign spanning 2026-08-01T00:00:00Z .. 2026-12-31T00:00:00Z (milestones may be added before launch)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
