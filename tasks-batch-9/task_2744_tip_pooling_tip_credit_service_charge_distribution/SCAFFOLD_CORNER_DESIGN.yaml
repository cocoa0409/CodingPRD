      - name: manager_only_and_participantless_pools_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_MANAGER_POOL_PARTICIPATION]
          - errors[ERR_NO_ELIGIBLE_PARTICIPANTS]
          - validations.priority_25
          - validations.priority_53
          - calculations.shift_pool_contribution
          - calculations.pool_distribution
        distinguishing_aspect: >-
          The two ways a pool can have money and no lawful home for it, kept apart on two business
          dates of the same unit. A TIPPED manager who genuinely waits tables is still barred by
          is_management, so a pool of only her shifts is refused at creation with priority 25 rather
          than priority 52, even though her exclusion is also what makes the pool empty. A prep cook
          with pool_contribution_pct_bps 1500 but pool_share_points 0 is the mirror image: inside the
