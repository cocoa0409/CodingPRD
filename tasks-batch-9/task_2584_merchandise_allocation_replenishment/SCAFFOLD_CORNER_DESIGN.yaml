            - "action_type == MARKDOWN with consolidation_target_store_id == null on all five actions, and units_at_detection snapshots available_units: 9, 7, 8, 6 and 4 respectively"
            - "Item lifecycle re-derivation follows: SKU-1001 has broken_store_count 2 and size_out_store_count 1 -> BROKEN, while SKU-2001 and SKU-3001 have broken_store_count 0 and size_out_store_count 1 -> SIZE_OUT_WATCH"
      - name: size_split_follows_the_curve_not_the_receipt_and_breaks_ties_lexicographically
        claim_type: weighted_scoring
        grounds:
          - calculations.size_breakdown_split
          - entities.AllocationLine.fields.size_breakdown
          - entities.SizeProfile.fields.size_curve
          - entities.Receipt.fields.size_received
        distinguishing_aspect: |
          The split weights are the size curve's share_bp and nothing else, which two facts make observable.
          First, the 16-unit receipt is physically 16 units of M, yet the line must still allot 3 units of S,
          5 of L and single units of the two NON-CORE sizes - the curve governs, the box contents do not, and
          non-core sizes are excluded from assortment health but never from the split. Second, the 5-size
          curve leaves a 2-unit remainder after flooring (3 + 5 + 4 + 1 + 1 = 14), which must go to M then L
          by share_bp DESC. A second item on a curve where S and M are tied at 3000bp forces the declared
          secondary key: 'M' sorts before 'S' lexicographically, so the tied remainder unit lands on M.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101 (capacity 48 / pmin 12) and 0102 (capacity 24 / pmin 8)"
            - "SizeProfile TOP-5SZ = S 1900 / M 3300 / L 2900 / XL 1200 / XXL 700, default core cut 1500 so only S, M and L are core; SKU-1001 (SEASONAL) is on it"
            - "SizeProfile TOP-TIE = S 3000 / M 3000 / L 2500 / XL 1500; SKU-2001 (SEASONAL) is on it"
            - "Position 0101 of SKU-1001 holds 4 units (S 1 / M 2 / L 1) with min 12 / max 48 / forecast 5, so need = 5 x 4 - 4 = 16"
            - "Position 0102 of SKU-2001 holds 6 units (S 1 / M 2 / L 2 / XL 1) with min 8 / max 24 / forecast 4, so need = 4 x 4 - 6 = 10"
            - "Receipt ASN-C701 is 16 units of size M ONLY; receipt ASN-C702 is 10 units spread S 3 / M 3 / L 3 / XL 1"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-5SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 1900 }, { size_code: "M", share_bp: 3300 }, { size_code: "L", share_bp: 2900 }, { size_code: "XL", share_bp: 1200 }, { size_code: "XXL", share_bp: 700 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp5_id: $.data.id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-TIE", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 3000 }, { size_code: "M", share_bp: 3000 }, { size_code: "L", share_bp: 2500 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
