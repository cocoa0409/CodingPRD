          four inputs on submit must re-score the package rather than keep the creation-time value.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project Rainier Flats with planned_module_count 4"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
          trigger:
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 3, expected_project_version: "${projv}", connection_detail_state: "FACTORY_DETAILED", open_connection_conflicts: 1, field_scope_items_open: 2 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id", s0: "$.data.factory_compatibility_score" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { module_split_count: 4, open_connection_conflicts: 0, field_scope_items_open: 0, connection_detail_state: "COMPLETE", review_note: "coordination closed" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { s1: "$.data.factory_compatibility_score", fs: "$.data.freeze_state" }
          assert:
            - "${s0} == 57 — penalty 43 = 8*1 conflict + 5*2 field scope + 15 FACTORY_DETAILED + 10*abs(3 - 4) split mismatch"
            - "${s1} == 100 and ${fs} == 'IN_REVIEW' — every weight term went to zero, so the score is re-derived, not carried over"
            - "GET /modular/projects/${proj} still reports planned_module_count == 4 — the score reads the project but never writes it"

      - name: defect_charge_remainder_lands_on_the_field_side
        claim_type: Precision
        grounds:
          - calculations.defect_responsibility_allocation
          - endpoints[POST /modular/defect-claims/{claimId}/adjudicate]
        distinguishing_aspect: |
          A SITE_SET presumption of 25.00% against an odd repair cost leaves a fractional cent:
          1_234_567 * 0.25 == 308_641.75 rounds half up to 308_642 and the field side takes the
          complement, so the two charges must still sum to the repair cost exactly.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; module M-01 exists; an OPEN SITE_SET claim for 1_234_567 cents"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
