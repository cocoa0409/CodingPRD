scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_category_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.ServiceCategory, endpoints]
        distinguishing_aspect: "POST /categories with all required fields returns 201 and a server-minted id, created_at, version==1, active default true."
        test_recipe:
          setup: ["A department exists to serve as default_department_id."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}" }
              as: SystemAdmin
              captures: { cat_id: $.data.id, ver: $.data.version, act: $.data.active }
          assert:
            - "response.status == 201"
            - "ServiceCategory.${cat_id}.version == 1"
            - "ServiceCategory.${cat_id}.active == true"
            - "ServiceCategory.${cat_id}.default_priority == STANDARD"

      - name: get_service_request_not_found
        claim_type: Not Found
        grounds: [entities.ServiceRequest, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-requests/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; a registered citizen to authenticate the read."]
          setup_api_calls:
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
          trigger:
            - call: "GET /service-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_request_missing_required_category_id
        claim_type: Required Fields
        grounds: [entities.ServiceRequest.fields.category_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /service-requests without category_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered citizen."]
          setup_api_calls:
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", description: "no category" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: citizen_notify_channel_default_applied
        claim_type: Defaults
        grounds: [entities.Citizen.fields.notify_channel]
        distinguishing_aspect: "POST /citizens omitting notify_channel applies the default EMAIL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id, ch: $.data.notify_channel }
          assert:
            - "response.status == 201"
            - "Citizen.${citizen_id}.notify_channel == EMAIL"

      - name: request_status_ignored_on_create
        claim_type: System Fields
        grounds: [entities.ServiceRequest.fields.status]
        distinguishing_aspect: "Server-managed status is set by the system: a created request starts in SUBMITTED with version 1."
        test_recipe:
          setup: ["A department, a non-geo category, a citizen."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "ServiceRequest.${req_id}.status == SUBMITTED"
            - "ServiceRequest.${req_id}.version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: triage_from_already_triaged_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.SUBMITTED_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Triaging an already-TRIAGED request returns ERR_INVALID_STATE (409); no second notification synthesized."
        test_recipe:
          setup: ["A request already triaged (non-geo category)."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_submitted_on_create
        claim_type: Initial State
        grounds: [state_machines.ServiceRequest, entities.ServiceRequest.fields.status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_request_branching_submitted_fork
          rationale: "The branching-fork instance creates requests and observes the SUBMITTED initial state before forking; also covered by request_status_ignored_on_create."

      - name: close_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.RESOLVED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a SUBMITTED (not RESOLVED) request returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUBMITTED request."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${req_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_closed_request_cannot_reopen
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED request (terminal) rejects reopen with ERR_INVALID_STATE (409) — reopen requires RESOLVED."
        test_recipe:
          setup: ["A request RESOLVED then CLOSED by dispatcher, owned by the citizen."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /agents"
              payload: { department_id: "${dept_id}", full_name: "Ag" }
              as: SystemAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${req_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.0.id, wo_v: $.data.0.version }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completion_note: "fixed" }
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /service-requests/${req_id}/close"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${req_id}/reopen"
              payload: {}
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ServiceRequest.${req_id}.status == CLOSED"

      - name: start_workorder_from_open_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.WorkOrder.OPEN_to_IN_PROGRESS]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_cascade_request_resolved_survey_and_escalation
          rationale: "The complete-cascade setup performs the OPEN->IN_PROGRESS start as part of its chain and the request bubbles to IN_PROGRESS."

  # ===========================================================================
  - section: calculations
    instances:
      - name: jurisdiction_match_no_box_yields_null
        claim_type: Input Set Filtering
        grounds: [calculations.jurisdiction_match, entities.ServiceRequest.fields.jurisdiction_id]
        distinguishing_aspect: "A geo request whose point lies in NO jurisdiction box is triaged with jurisdiction_id == null (empty candidate set fallback)."
        test_recipe:
          setup: ["One jurisdiction far from the request point; a geo category; a request whose point is outside the box."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { name: "Far", min_lat: 10.0, max_lat: 11.0, min_lng: 10.0, max_lng: 11.0 }
              as: SystemAdmin
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r", lat: 41.8800, lng: -87.6300 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { jur: $.data.jurisdiction_id }
          assert:
            - "ServiceRequest.${req_id}.jurisdiction_id == null"
            - "ServiceRequest.${req_id}.status == TRIAGED"

      - name: avg_satisfaction_empty_set_yields_null
        claim_type: Correct Result
        grounds: [calculations.avg_satisfaction]
        distinguishing_aspect: "A department with no COMPLETED surveys returns avg_score null and completed_count 0 (empty-set boundary, not 0.0)."
        test_recipe:
          setup: ["A department with no surveys."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "GET /departments/${dept_id}/satisfaction"
              payload: {}
              as: Dispatcher
              captures: { ct: $.data.completed_count }
          assert:
            - "response.data.completed_count == 0"
            - "response.data.avg_score == null"

      - name: department_congested_at_threshold_inclusive
        claim_type: Constants Applied
        grounds: [calculations.department_backlog, entities.Department.fields.congested]
        distinguishing_aspect: "With backlog_threshold 1, routing a single request makes open_work_order_count 1 and congested true (>= inclusive boundary)."
        test_recipe:
          setup: ["A department with backlog_threshold 1; one routed request."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 1 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "GET /departments/${dept_id}"
              payload: {}
              as: Dispatcher
              captures: { ct: $.data.open_work_order_count, cong: $.data.congested }
          assert:
            - "Department.${dept_id}.open_work_order_count == 1"
            - "Department.${dept_id}.congested == true"

      - name: sla_breach_tier1_at_three_hours_overdue
        claim_type: Constants Applied
        grounds: [calculations.sla_breach_sweep, entities.Escalation.fields.tier]
        distinguishing_aspect: "Overdue 3h with tier1=2/tier2=6 fires a TIER1 escalation (>=2, <6), not TIER2 — distinct from the §1.8 TIER2-at-6h instance."
        test_recipe:
          setup: ["A routed request, STANDARD 24h SLA tier1=2 tier2=6; clock advanced 27h (overdue 3h)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /_clock/advance"
              payload: { hours: 27 }
              as: SystemAdmin
              captures: { created: $.data.escalations_created }
            - call: "GET /service-requests/${req_id}/escalations"
              payload: {}
              as: Dispatcher
              captures: { tier: $.data.0.tier }
          assert:
            - "exactly one Escalation on ${req_id} with tier == TIER1"
            - "ServiceRequest.${req_id}.sla_breached == true"

  # ===========================================================================
  - section: validations
    instances:
      - name: intake_geo_required_missing_coordinates
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_GEOLOCATION_REQUIRED]"]
        distinguishing_aspect: "Intake of a request in a requires_geolocation category without lat/lng returns ERR_GEOLOCATION_REQUIRED (422)."
        test_recipe:
          setup: ["A geo-requiring category; a citizen."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "no geo" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_GEOLOCATION_REQUIRED"

      - name: intake_inactive_category_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_CATEGORY_INACTIVE]"]
        distinguishing_aspect: "Intake referencing an inactive category returns ERR_CATEGORY_INACTIVE (409)."
        test_recipe:
          setup: ["A category created with active false; a citizen."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Old", code: "OLD", default_department_id: "${dept_id}", requires_geolocation: false, active: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CATEGORY_INACTIVE"

      - name: route_no_sla_policy_standalone
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_NO_SLA_POLICY]"]
        distinguishing_aspect: "Routing a TRIAGED request whose (category,priority) has no SlaPolicy returns ERR_NO_SLA_POLICY (409) — triggered in isolation (request IS triaged, so the state check passes)."
        test_recipe:
          setup: ["A category with NO SLA policy; a TRIAGED request in it."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_SLA_POLICY"

      - name: reopen_window_closed_standalone
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_REOPEN_WINDOW_CLOSED]"]
        distinguishing_aspect: "The OWNER citizen reopening after >72h past resolved_at returns ERR_REOPEN_WINDOW_CLOSED (409) — owner check passes, so the window check fires."
        test_recipe:
          setup: ["Owner citizen A; request RESOLVED at 2026-06-01T10:00:00Z; clock advanced to 2026-06-05T00:00:00Z (>72h)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 240, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "a@x.com", full_name: "A" }
