# =============================================================================
# PRD Benchmark Seed Tables — Contents Pack-Out & Restoration Storage
# =============================================================================

scenario: |
  Contents Pack-Out & Restoration Storage (contents restoration company): room-by-room inventory with photo/barcode, salvageable vs non-salvageable determination & disposal documentation, cleaning/deodorization process by item type, climate-controlled storage & monthly charges, high-value/specialty item handling & subcontract, pack-back scheduling after structure completion, loss/damage claim during handling, carrier billing & inventory reconciliation

domain_name: contents-packout-restoration
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # storage accrual: provisional whole-month vs final daily proration; claim settlement ACV vs RCV
    - cascading_side_effects        # triage/claim-settle/schedule chains: item -> placement -> vault occupancy -> statement accrual -> job totals
    - optimistic_concurrency        # OCC on Item.version (triage) and PackOutJob.version (statement create-with-supersede)
    - ops_run_checkpoint            # POST /api/billing-runs advances the billing epoch and finalizes elapsed statements
  entity_topology: hierarchical     # PackOutJob -> Room -> Item core tree; satellite aggregates (Vault, Subcontractor, statements, invoices) FK-linked
  state_machine_shape: cyclic       # dominant shape: triage loop, cleaning rework loop, referral resend loop, claim appeal loop, schedule reschedule loop, invoice dispute loop; Item additionally carries parallel dimensions; Room/Job are compound
  relationship_patterns:
    - one_to_many
    - self_referential              # StorageStatement.supersedes_statement_id
    - cross_aggregate               # Item -> Vault via StoragePlacement; Item -> Subcontractor via SpecialtyReferral; HandlingClaim -> CarrierInvoice credit link
  role_model: segregation_of_duties # disposal documenter != verifier; claim filer != approver (same X-User-ID forbidden)
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PackOutJob
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: input, description: "Carrier claim reference; unique across all jobs" }
      - { name: property_address, type: string, source: input, description: "Loss site address" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: policy_coverage_type, type: enum, source: input, description: "ACV | RCV — selects the handling_claim_settlement variant for claims on this job's items" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | ACTIVE | PACKBACK_IN_PROGRESS | CLOSED — auto-advances on first item registration / first schedule IN_TRANSIT; CLOSED via transition action CLOSE" }
      - { name: structure_status, type: enum, source: system, default: PENDING, description: "PENDING | IN_PROGRESS | COMPLETE — independent parallel dimension driven by job transition actions STRUCTURE_START / STRUCTURE_COMPLETE / STRUCTURE_RESCIND" }
      - { name: billing_status, type: enum, source: computed, default: ACCUMULATING, description: "ACCUMULATING | INVOICED | RECONCILED | DISPUTED — derived from this job's CarrierInvoice statuses: DISPUTED if any DISPUTED; else RECONCILED if >=1 invoice and all RECONCILED; else INVOICED if any SUBMITTED or RECONCILED; else ACCUMULATING (DRAFT invoices do not change it)" }
      - { name: accrued_storage_total_cents, type: integer, source: computed, default: 0, description: "Sum over this job's StorageStatements: provisional_total_cents for PROVISIONAL, final_total_cents for FINALIZED/INVOICED; VOIDED excluded; recomputed on every statement or placement mutation" }

  - name: Room
    parent: PackOutJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> PackOutJob.id; set from the creation path" }
      - { name: name, type: string, source: input, description: "Room name, e.g. 'Master Bedroom'" }
      - { name: floor_level, type: integer, source: input, default: 1, description: "Floor number" }
      - { name: room_type, type: enum, source: input, description: "LIVING | BEDROOM | KITCHEN | BATH | GARAGE | BASEMENT | OTHER" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | INVENTORIED | CLEARED — compound of children: INVENTORIED when >=1 item and no item has condition_triage PENDING; CLEARED when additionally no item has processing_status in {REGISTERED, AWAITING_CLEANING, IN_CLEANING, CLEANED, AWAITING_DISPOSAL}" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Count of Items with room_id == this room" }

  - name: Item
    parent: Room
    common_fields: true
    fields:
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; set from the creation path" }
      - { name: barcode, type: string, source: input, description: "Scannable barcode; unique within the parent job (Room -> PackOutJob)" }
      - { name: description, type: string, source: input, description: "Free-text item description" }
      - { name: item_category, type: enum, source: input, description: "TEXTILE | ELECTRONICS | FURNITURE | DOCUMENT | ARTWORK | APPLIANCE | GENERAL — drives cleaning process_code and climate-class requirement" }
      - { name: photo_ref, type: string, source: input, default: null, description: "Photo reference URL/identifier taken at inventory" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared value in cents, >= 0" }
      - { name: volume_cu_ft, type: integer, source: input, description: "Storage volume in cubic feet, >= 1" }
      - { name: hazmat_flag, type: boolean, source: input, default: false, description: "True if contaminated (e.g., sewage, chemical); hazmat items may never enter vault storage" }
      - { name: smoke_damage_flag, type: boolean, source: input, default: false, description: "True if smoke/soot damaged; forces deodorization adder on cleaning fee" }
      - { name: condition_triage, type: enum, source: system, default: PENDING, description: "PENDING | SALVAGEABLE | NON_SALVAGEABLE — parallel dimension 1, cyclic via OCC-guarded re-triage" }
      - { name: processing_status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | AWAITING_CLEANING | IN_CLEANING | CLEANED | IN_STORAGE | OUT_FOR_SPECIALTY | PACKED_BACK | DELIVERED | AWAITING_DISPOSAL | DISPOSED | CLAIM_SETTLED — parallel dimension 2; DISPOSED/DELIVERED/CLAIM_SETTLED are terminal" }
      - { name: is_high_value, type: boolean, source: computed, description: "= declared_value_cents >= 1000000 (>=, exact boundary)" }
      - { name: triage_count, type: integer, source: system, default: 0, description: "Increments on every successful triage decision (including re-triage)" }

  - name: DisposalRecord
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; 1:1 — auto-created as DRAFT when an item enters AWAITING_DISPOSAL" }
      - { name: disposal_method, type: enum, source: input, default: null, description: "LANDFILL | RECYCLE | HAZARDOUS_WASTE | DONATION — required at DOCUMENT" }
      - { name: manifest_number, type: string, source: input, default: null, description: "Hazardous-waste manifest; required at DOCUMENT iff item.hazmat_flag is true" }
      - { name: facility_name, type: string, source: input, default: null, description: "Disposition facility; required at DOCUMENT" }
      - { name: photo_ref, type: string, source: input, default: null, description: "Photo documentation of disposal" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DOCUMENTED | VERIFIED | VOIDED — VOIDED automatically if the item is re-triaged SALVAGEABLE before verification" }
      - { name: documented_by_user_id, type: string, source: system, default: null, description: "X-User-ID that executed DOCUMENT" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID that executed VERIFY; must differ from documented_by_user_id" }
      - { name: documented_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of DOCUMENT" }

  - name: CleaningTask
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; set from the creation path" }
      - { name: process_code, type: enum, source: computed, description: "Derived from item.item_category: TEXTILE->LAUNDER_DEODORIZE, ELECTRONICS->DRY_CORROSION_INHIBIT, FURNITURE->SURFACE_CLEAN, DOCUMENT->FREEZE_DRY, APPLIANCE->DEEP_CLEAN, GENERAL->STANDARD_CLEAN; ARTWORK never gets a CleaningTask (specialty-only)" }
      - { name: deodorization_required, type: boolean, source: computed, description: "= item.smoke_damage_flag at task creation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | PASSED | FAILED — FAILED -> IN_PROGRESS rework cycle allowed" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Increments on each REWORK (FAILED -> IN_PROGRESS)" }
      - { name: fee_cents, type: integer, source: computed, default: null, description: "Computed at QA_PASS per cleaning_task_fee; null until PASSED" }
      - { name: qa_note, type: string, source: input, default: null, description: "QA note recorded at QA_PASS/QA_FAIL" }

  - name: Vault
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Vault code; globally unique" }
      - { name: climate_class, type: enum, source: input, description: "CLIMATE_CONTROLLED | STANDARD | COLD_STORAGE" }
      - { name: capacity_cu_ft, type: integer, source: input, description: "Total capacity in cubic feet, > 0" }
      - { name: monthly_rate_cents_per_cu_ft, type: integer, source: input, description: "Monthly storage rate per cubic foot in cents, > 0" }
      - { name: occupied_cu_ft, type: integer, source: computed, default: 0, description: "Sum of Item.volume_cu_ft over this vault's StoragePlacements with status ACTIVE" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | FULL — FULL iff occupied_cu_ft == capacity_cu_ft" }

  - name: StoragePlacement
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; set from the creation path" }
      - { name: vault_id, type: string, source: input, description: "FK -> Vault.id; target vault" }
      - { name: placed_on, type: string, source: system, description: "Date (YYYY-MM-DD) of activation from the logical clock" }
      - { name: released_on, type: string, source: system, default: null, description: "Date of release; null while ACTIVE" }
      - { name: release_reason, type: enum, source: system, default: null, description: "MANUAL | DISPOSAL | CLAIM | SPECIALTY | PACK_BACK — how the placement ended" }
      - { name: monthly_rate_cents, type: integer, source: computed, description: "Snapshot at activation = item.volume_cu_ft * vault.monthly_rate_cents_per_cu_ft" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: specialty_types, type: array, source: input, description: "Subset of ART_CONSERVATION | ELECTRONICS_DATA_RECOVERY | DOCUMENT_FREEZE_DRYING | FUR_CLEANING | JEWELRY_APPRAISAL" }
      - { name: max_concurrent_referrals, type: integer, source: input, description: "Aggregate capacity: max referrals with status in {DISPATCHED, IN_CUSTODY, QA_REJECTED}, >= 1" }
      - { name: active_referral_count, type: integer, source: computed, default: 0, description: "Count of this vendor's SpecialtyReferrals with status in {DISPATCHED, IN_CUSTODY, QA_REJECTED}" }
      - { name: contact_email, type: string, source: input, default: null, description: "Vendor contact" }

  - name: SpecialtyReferral
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; set from the creation path" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id" }
      - { name: specialty_type, type: enum, source: input, description: "ART_CONSERVATION | ELECTRONICS_DATA_RECOVERY | DOCUMENT_FREEZE_DRYING | FUR_CLEANING | JEWELRY_APPRAISAL — must be in subcontractor.specialty_types" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Vendor quote in cents, >= 0" }
      - { name: markup_pct, type: integer, source: input, default: 15, description: "Markup percentage applied at QA_ACCEPT" }
      - { name: billed_cost_cents, type: integer, source: computed, default: null, description: "= round_half_up(quoted_cost_cents * (100 + markup_pct) / 100); computed at QA_ACCEPT, null before" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DISPATCHED | IN_CUSTODY | RETURNED | QA_ACCEPTED | QA_REJECTED — QA_REJECTED -> DISPATCHED resend cycle (slot retained)" }

  - name: CustodyEvent
    parent: SpecialtyReferral
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> SpecialtyReferral.id; set from the creation path" }
      - { name: event_type, type: enum, source: input, description: "PICKED_UP | IN_TRANSIT | RECEIVED_BY_SUB | RETURNED_BY_SUB | RECEIVED_BACK" }
      - { name: event_at, type: datetime, source: input, description: "When the custody event occurred; must be strictly greater than every prior event_at on the same referral" }
      - { name: actor_name, type: string, source: input, description: "Person who took custody" }
      - { name: note, type: string, source: input, default: null, description: "Free-text note" }
      - { name: sequence, type: integer, source: system, description: "Per-referral monotonically increasing counter starting at 1 (append order; created_at ASC tie-break is never needed because event_at is strictly increasing)" }

  - name: HandlingClaim
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; set from the creation path" }
      - { name: claim_type, type: enum, source: input, description: "LOSS | DAMAGE — loss or damage during handling" }
      - { name: description, type: string, source: input, description: "What happened" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Replacement cost in cents, >= 0" }
      - { name: item_age_years, type: integer, source: input, description: "Item age in whole years, >= 0" }
      - { name: settlement_variant, type: enum, source: computed, default: null, description: "ACV | RCV — copied from the job's policy_coverage_type at APPROVE" }
      - { name: settlement_amount_cents, type: integer, source: computed, default: null, description: "Computed at APPROVE per handling_claim_settlement; null before" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID that filed the claim (SoD anchor)" }
      - { name: credited_invoice_id, type: string, source: system, default: null, description: "FK -> CarrierInvoice.id; set when an invoice SUBMIT sweeps this APPROVED claim into settlement credit; null for direct SETTLE" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | SETTLED | VOIDED — DENIED -> UNDER_REVIEW appeal cycle; open = {FILED, UNDER_REVIEW, APPROVED}" }

  - name: PackBackSchedule
    parent: PackOutJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> PackOutJob.id; set from the creation path" }
      - { name: crew_id, type: string, source: input, description: "Crew/resource identifier whose daily window this schedule occupies" }
      - { name: service_date, type: string, source: input, description: "Service date YYYY-MM-DD" }
      - { name: window_start_hour, type: integer, source: input, description: "Window start hour 0-23" }
      - { name: window_end_hour, type: integer, source: input, description: "Window end hour 1-24; must be > window_start_hour; half-open [start, end) occupation" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | IN_TRANSIT | DELIVERED | COMPLETED | CANCELLED — CONFIRMED -> REQUESTED reschedule cycle" }
      - { name: eligible_item_count, type: integer, source: computed, default: null, description: "Snapshot at CONFIRM per packback_eligibility_count; null before" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Increments on each RESCHEDULE" }

  - name: StorageStatement
    parent: PackOutJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> PackOutJob.id; set from the creation path" }
      - { name: period_start, type: string, source: input, description: "Period start date YYYY-MM-DD; half-open [period_start, period_end)" }
      - { name: period_end, type: string, source: input, description: "Period end date YYYY-MM-DD, exclusive; must be > period_start; non-VOIDED statements of one job must have disjoint periods" }
      - { name: supersedes_statement_id, type: string, source: input, default: null, description: "FK -> StorageStatement.id; when provided, names this job's current PROVISIONAL statement which becomes VOIDED on success (create-with-supersede)" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | FINALIZED | INVOICED | VOIDED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Whole-month forward-looking accrual per storage_charge_accrual provisional variant; recomputed on every placement activation/release for this job while PROVISIONAL" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Chronological daily-proration accrual per storage_charge_accrual final variant; computed at billing-run finalization; null while PROVISIONAL" }

  - name: CarrierInvoice
    parent: PackOutJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> PackOutJob.id; set from the creation path" }
      - { name: adjustment_cents, type: integer, source: input, default: 0, description: "Carrier-agreed manual adjustment in cents (may be negative)" }
      - { name: storage_cents, type: integer, source: computed, description: "Sum of final_total_cents over this job's FINALIZED statements swept at creation (swept statements become INVOICED)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Tiered fee per carrier_invoice_total; tier keyed on subtotal BEFORE fee (evaluation order pinned)" }
      - { name: total_cents, type: integer, source: computed, description: "= storage_cents + adjustment_cents + admin_fee_cents" }
      - { name: claim_credit_cents, type: integer, source: computed, default: 0, description: "Snapshot pinned at SUBMIT: sum of settlement_amount_cents over the job's APPROVED claims swept to SETTLED with credited_invoice_id == this invoice; frozen thereafter" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Sum of RECORD_PAYMENT amounts" }
      - { name: balance_cents, type: integer, source: computed, description: "= total_cents - claim_credit_cents - amount_paid_cents; may go negative only via post-SUBMIT claim VOID (see compensating invariant)" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Required at DISPUTE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | DISPUTED | RECONCILED — DISPUTED -> SUBMITTED resubmission cycle" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PackOutJob
    field: status
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "system (automatic when the job's first Item is registered)"
        actor: system
        preconditions: []
        side_effects: ["PackOutJob.status := ACTIVE; version increments by 1 (every mutation bumps version)"]
      - from: ACTIVE
        to: PACKBACK_IN_PROGRESS
        trigger: "system (automatic when this job's first PackBackSchedule enters IN_TRANSIT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [INTAKE, ACTIVE, PACKBACK_IN_PROGRESS]
        to: CLOSED
        trigger: "POST /api/pack-out-jobs/{id}/transition action=CLOSE"
        actor: ProjectManager
        preconditions:
          - "Every Item of the job (via Room -> Item) has processing_status in {DELIVERED, DISPOSED, CLAIM_SETTLED} (ERR_JOB_ITEMS_NOT_TERMINAL)"
          - "No StorageStatement of the job has status PROVISIONAL (ERR_INVALID_TRANSITION)"
          - "No CarrierInvoice of the job has status in {DRAFT, SUBMITTED, DISPUTED} (ERR_INVALID_TRANSITION)"
        side_effects: ["Job is terminal; all further mutations rejected"]

  - entity: PackOutJob
    field: structure_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /api/pack-out-jobs/{id}/transition action=STRUCTURE_START"
        actor: ProjectManager
        preconditions: ["Job status not CLOSED"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /api/pack-out-jobs/{id}/transition action=STRUCTURE_COMPLETE"
        actor: ProjectManager
        preconditions: ["Job status not CLOSED"]
        side_effects: ["Structure completion recorded; PackBackSchedule CONFIRM gate (ERR_JOB_NOT_READY_FOR_PACKBACK) now passable"]
      - from: COMPLETE
        to: IN_PROGRESS
        trigger: "POST /api/pack-out-jobs/{id}/transition action=STRUCTURE_RESCIND (structure work reopened)"
        actor: ProjectManager
        preconditions: ["No PackBackSchedule of the job is in {CONFIRMED, IN_TRANSIT, DELIVERED} (ERR_INVALID_TRANSITION)"]
        side_effects: ["Pack-back gate re-closes (cycle: COMPLETE -> IN_PROGRESS -> COMPLETE allowed)"]

  - entity: Room
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: INVENTORIED
        trigger: "system (automatic recompute on any child Item mutation)"
        actor: system
        preconditions: ["item_count >= 1 AND no child Item has condition_triage == PENDING"]
        side_effects: []
      - from: [OPEN, INVENTORIED]
        to: CLEARED
        trigger: "system (automatic recompute on any child Item mutation)"
        actor: system
        preconditions:
          - "INVENTORIED condition holds (>=1 item, none PENDING triage)"
          - "No child Item has processing_status in {REGISTERED, AWAITING_CLEANING, IN_CLEANING, CLEANED, AWAITING_DISPOSAL}"
        side_effects: []
        note: "Compound recompute can also move CLEARED back to INVENTORIED/OPEN if a child returns to an on-site processing_status (e.g., placement release returns item to CLEANED)."

  - entity: Item
    field: condition_triage
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: [PENDING, SALVAGEABLE, NON_SALVAGEABLE]
        to: SALVAGEABLE
        trigger: "POST /api/items/{id}/triage determination=SALVAGEABLE (OCC: expected_item_version)"
        actor: InventoryTechnician
        preconditions:
          - "processing_status not in {DISPOSED, DELIVERED, CLAIM_SETTLED} (ERR_ITEM_TERMINAL)"
          - "processing_status in {REGISTERED, AWAITING_CLEANING, IN_STORAGE, AWAITING_DISPOSAL} (ERR_INVALID_TRANSITION)"
          - "expected_item_version == Item.version (ERR_STALE_ITEM_VERSION)"
        side_effects:
          - "triage_count += 1; Item.version += 1"
          - "processing_status := AWAITING_CLEANING"
          - "If entering from AWAITING_DISPOSAL: the item's non-VERIFIED DisposalRecord (DRAFT or DOCUMENTED) becomes VOIDED"
      - from: [PENDING, SALVAGEABLE, NON_SALVAGEABLE]
        to: NON_SALVAGEABLE
        trigger: "POST /api/items/{id}/triage determination=NON_SALVAGEABLE (OCC: expected_item_version)"
        actor: InventoryTechnician
        preconditions:
          - "processing_status not in {DISPOSED, DELIVERED, CLAIM_SETTLED} (ERR_ITEM_TERMINAL)"
          - "processing_status in {REGISTERED, AWAITING_CLEANING, IN_STORAGE, AWAITING_DISPOSAL} (ERR_INVALID_TRANSITION)"
          - "expected_item_version == Item.version (ERR_STALE_ITEM_VERSION)"
        side_effects:
          - "triage_count += 1; Item.version += 1"
          - "processing_status := AWAITING_DISPOSAL (cascade link 1)"
          - "Entering AWAITING_DISPOSAL auto-creates a DRAFT DisposalRecord for the item if none non-VOIDED exists (cascade link 2)"
          - "Leaving IN_STORAGE auto-releases the item's ACTIVE StoragePlacement with release_reason=DISPOSAL (cascade link 3)"
          - "That release decrements Vault.occupied_cu_ft by item.volume_cu_ft and recomputes provisional_total_cents on the job's PROVISIONAL statements plus job.accrued_storage_total_cents (cascade link 4)"

  - entity: Item
    field: processing_status
    initial_state: REGISTERED
    terminal_states: [DISPOSED, DELIVERED, CLAIM_SETTLED]
    transitions:
      - from: REGISTERED
        to: AWAITING_CLEANING
        trigger: "system (triage SALVAGEABLE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [AWAITING_CLEANING, AWAITING_DISPOSAL]
        to: AWAITING_CLEANING
        trigger: "system (triage SALVAGEABLE; from AWAITING_DISPOSAL also voids the DRAFT/DOCUMENTED DisposalRecord)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [REGISTERED, AWAITING_CLEANING, IN_STORAGE, AWAITING_DISPOSAL]
        to: AWAITING_DISPOSAL
        trigger: "system (triage NON_SALVAGEABLE)"
        actor: system
        preconditions: []
        side_effects: ["Creates DRAFT DisposalRecord; releases ACTIVE placement (reason DISPOSAL) with vault/statement cascade"]
      - from: AWAITING_CLEANING
        to: IN_CLEANING
        trigger: "POST /api/cleaning-tasks/{id}/transition action=START on this item's task"
        actor: InventoryTechnician
        preconditions: []
        side_effects: []
      - from: IN_CLEANING
        to: CLEANED
        trigger: "POST /api/cleaning-tasks/{id}/transition action=QA_PASS"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["Task fee_cents computed per cleaning_task_fee"]
      - from: CLEANED
        to: IN_STORAGE
        trigger: "POST /api/items/{id}/placements (placement activated)"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["Vault.occupied_cu_ft += item.volume_cu_ft; PROVISIONAL statement accrual recompute"]
      - from: IN_STORAGE
        to: CLEANED
        trigger: "POST /api/storage-placements/{id}/release (manual release)"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["Placement RELEASED reason=MANUAL; Vault.occupied_cu_ft -= item.volume_cu_ft; accrual recompute"]
      - from: [AWAITING_CLEANING, CLEANED, IN_STORAGE]
        to: OUT_FOR_SPECIALTY
        trigger: "POST /api/specialty-referrals/{id}/transition action=DISPATCH on this item's referral"
        actor: ProjectManager
        preconditions: []
        side_effects: ["If IN_STORAGE: ACTIVE placement RELEASED reason=SPECIALTY with vault/statement cascade"]
      - from: OUT_FOR_SPECIALTY
        to: CLEANED
        trigger: "POST /api/specialty-referrals/{id}/transition action=QA_ACCEPT"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: IN_STORAGE
        to: PACKED_BACK
        trigger: "POST /api/pack-back-schedules/{id}/transition action=START_TRANSIT (item in eligible set)"
        actor: ProjectManager
        preconditions: []
        side_effects: ["ACTIVE placement RELEASED reason=PACK_BACK with vault/statement cascade"]
      - from: PACKED_BACK
        to: DELIVERED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=DELIVER"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: [REGISTERED, AWAITING_CLEANING, IN_CLEANING, CLEANED, IN_STORAGE, OUT_FOR_SPECIALTY, PACKED_BACK, AWAITING_DISPOSAL]
        to: CLAIM_SETTLED
        trigger: "system (a HandlingClaim on this item is SETTLED — direct SETTLE or invoice-submit sweep)"
        actor: system
        preconditions: []
        side_effects: ["If IN_STORAGE: ACTIVE placement RELEASED reason=CLAIM with vault/statement cascade (claim-settle cascade links 2-3)"]
      - from: AWAITING_DISPOSAL
        to: DISPOSED
        trigger: "POST /api/disposal-records/{id}/transition action=VERIFY"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Room/Job compound recompute (bubble-up)"]

  - entity: DisposalRecord
    field: status
    initial_state: DRAFT
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /api/disposal-records/{id}/transition action=DOCUMENT"
        actor: InventoryTechnician
        preconditions:
          - "disposal_method and facility_name present (ERR_VALIDATION)"
          - "If item.hazmat_flag: manifest_number required and disposal_method must be HAZARDOUS_WASTE (ERR_HAZMAT_MANIFEST_REQUIRED)"
        side_effects: ["documented_by_user_id := X-User-ID; documented_at := logical clock"]
      - from: DOCUMENTED
        to: VERIFIED
        trigger: "POST /api/disposal-records/{id}/transition action=VERIFY"
        actor: ProjectManager
        preconditions: ["verified_by X-User-ID != documented_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["verified_by_user_id := X-User-ID; item.processing_status := DISPOSED; Room/Job compound recompute"]
      - from: [DRAFT, DOCUMENTED]
        to: VOIDED
        trigger: "system (item re-triaged SALVAGEABLE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CleaningTask
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/cleaning-tasks/{id}/transition action=START"
        actor: InventoryTechnician
        preconditions: ["Item processing_status == AWAITING_CLEANING (ERR_INVALID_TRANSITION)"]
        side_effects: ["item.processing_status := IN_CLEANING; Item.version += 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /api/cleaning-tasks/{id}/transition action=QA_PASS"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["fee_cents computed per cleaning_task_fee; item.processing_status := CLEANED; Item.version += 1"]
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/cleaning-tasks/{id}/transition action=QA_FAIL"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["item stays IN_CLEANING (awaiting rework)"]
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /api/cleaning-tasks/{id}/transition action=REWORK (rework cycle)"
        actor: InventoryTechnician
        preconditions: []
        side_effects: ["rework_count += 1"]

  - entity: StoragePlacement
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/storage-placements/{id}/release (reason=MANUAL) OR system cascade (reason DISPOSAL | CLAIM | SPECIALTY | PACK_BACK)"
        actor: "InventoryTechnician | system"
        preconditions: ["Endpoint path: placement ACTIVE (ERR_INVALID_TRANSITION otherwise)"]
        side_effects:
          - "released_on := logical-clock date; release_reason set"
          - "Vault.occupied_cu_ft -= item.volume_cu_ft (compensating invariant: vault_occupancy)"
          - "provisional_total_cents recomputed on the job's PROVISIONAL statements; job.accrued_storage_total_cents recomputed"

  - entity: SpecialtyReferral
    field: status
    initial_state: DRAFT
    terminal_states: [QA_ACCEPTED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /api/specialty-referrals/{id}/transition action=DISPATCH"
        actor: ProjectManager
        preconditions:
          - "Item processing_status in {AWAITING_CLEANING, CLEANED, IN_STORAGE} (ERR_INVALID_TRANSITION)"
          - "Subcontractor.active_referral_count < subcontractor.max_concurrent_referrals (ERR_SUBCONTRACTOR_AT_CAPACITY)"
        side_effects: ["item.processing_status := OUT_FOR_SPECIALTY (releasing ACTIVE placement reason=SPECIALTY if IN_STORAGE); Subcontractor.active_referral_count += 1"]
      - from: QA_REJECTED
        to: DISPATCHED
        trigger: "POST /api/specialty-referrals/{id}/transition action=DISPATCH (resend cycle; slot retained — no new capacity consumed)"
        actor: ProjectManager
        preconditions: []
        side_effects: ["item stays OUT_FOR_SPECIALTY"]
      - from: DISPATCHED
        to: IN_CUSTODY
        trigger: "POST /api/specialty-referrals/{id}/transition action=RECEIVE"
        actor: SubcontractorContact
        preconditions: ["X-User-ID == referral.subcontractor_id (ERR_NOT_REFERRAL_SUBCONTRACTOR)"]
        side_effects: []
      - from: IN_CUSTODY
        to: RETURNED
        trigger: "POST /api/specialty-referrals/{id}/transition action=RETURN"
        actor: SubcontractorContact
        preconditions: ["X-User-ID == referral.subcontractor_id (ERR_NOT_REFERRAL_SUBCONTRACTOR)"]
        side_effects: ["Subcontractor.active_referral_count -= 1 (RETURNED frees the slot)"]
      - from: RETURNED
        to: QA_ACCEPTED
        trigger: "POST /api/specialty-referrals/{id}/transition action=QA_ACCEPT"
        actor: ProjectManager
        preconditions: []
        side_effects: ["billed_cost_cents := round_half_up(quoted_cost_cents * (100 + markup_pct) / 100); item.processing_status := CLEANED"]
      - from: RETURNED
        to: QA_REJECTED
        trigger: "POST /api/specialty-referrals/{id}/transition action=QA_REJECT"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Subcontractor.active_referral_count += 1 (QA_REJECTED re-holds the slot)"]

  - entity: HandlingClaim
    field: status
    initial_state: FILED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/handling-claims/{id}/transition action=SUBMIT_REVIEW"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/handling-claims/{id}/transition action=APPROVE"
        actor: ClaimsAdjuster
        preconditions: ["X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["settlement_variant := job.policy_coverage_type (via Item.room_id -> Room.job_id); settlement_amount_cents computed per handling_claim_settlement"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/handling-claims/{id}/transition action=DENY"
        actor: ClaimsAdjuster
        preconditions: ["X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /api/handling-claims/{id}/transition action=APPEAL (appeal cycle)"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /api/handling-claims/{id}/transition action=SETTLE (direct) OR system sweep on CarrierInvoice SUBMIT (credited)"
        actor: "ClaimsAdjuster | system"
        preconditions: ["Direct SETTLE: X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Invoice sweep path: credited_invoice_id := the submitting invoice (cascade link 1)"
          - "item.processing_status := CLAIM_SETTLED; if item IN_STORAGE its ACTIVE placement is RELEASED reason=CLAIM (cascade link 2)"
          - "That release decrements Vault.occupied_cu_ft and recomputes PROVISIONAL statement accrual + job.accrued_storage_total_cents (cascade link 3)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /api/handling-claims/{id}/transition action=VOID"
        actor: ClaimsAdjuster
        preconditions: ["credited_invoice_id is null (ERR_INVALID_TRANSITION once swept)"]
        side_effects: ["Compensating action for APPROVE: pending settlement liability and any not-yet-submitted invoice credit basis return to pre-approval values (compensating invariant: claim_credit_conservation)"]

  - entity: PackBackSchedule
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=CONFIRM"
        actor: ProjectManager
        preconditions:
          - "Job structure_status == COMPLETE (ERR_JOB_NOT_READY_FOR_PACKBACK)"
          - "No other schedule with same crew_id and service_date and status in {CONFIRMED, IN_TRANSIT} has a half-open window overlapping [window_start_hour, window_end_hour); adjacency (end == start) is allowed (ERR_CREW_WINDOW_OVERLAP)"
          - "packback_eligibility_count >= 1 (ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK)"
          - "No eligible item has a HandlingClaim with status in {FILED, UNDER_REVIEW, APPROVED} (ERR_OPEN_CLAIM_BLOCKS_PACKBACK)"
        side_effects: ["eligible_item_count snapshot stored"]
      - from: CONFIRMED
        to: IN_TRANSIT
        trigger: "POST /api/pack-back-schedules/{id}/transition action=START_TRANSIT"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Every eligible item (IN_STORAGE with all referrals QA_ACCEPTED): processing_status := PACKED_BACK, ACTIVE placement RELEASED reason=PACK_BACK, vault occupancy decremented, accrual recomputed; first IN_TRANSIT schedule moves job ACTIVE -> PACKBACK_IN_PROGRESS"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=DELIVER"
        actor: ProjectManager
        preconditions: []
        side_effects: ["All this job's PACKED_BACK items := DELIVERED"]
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=COMPLETE"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=RESCHEDULE with new service_date/window (reschedule cycle)"
        actor: ProjectManager
        preconditions: ["service_date, window_start_hour, window_end_hour present and valid (ERR_WINDOW_INVALID)"]
        side_effects: ["reschedule_count += 1; crew window freed (REQUESTED occupies no window)"]
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /api/pack-back-schedules/{id}/transition action=CANCEL"
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: StorageStatement
    field: status
    initial_state: PROVISIONAL
    terminal_states: [INVOICED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system (a new statement created with supersedes_statement_id naming this one — create-with-supersede)"
        actor: system
        preconditions: []
        side_effects: ["Job.accrued_storage_total_cents recomputed"]
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/billing-runs (ops-run checkpoint: period_end <= logical clock date)"
        actor: BillingClerk
        preconditions: []
        side_effects: ["final_total_cents computed per storage_charge_accrual final variant; job.accrued_storage_total_cents recomputed"]
      - from: FINALIZED
        to: INVOICED
        trigger: "system (swept into a CarrierInvoice at invoice creation)"
        actor: system
        preconditions: []
        side_effects: ["Its final_total_cents contributes to invoice.storage_cents"]

  - entity: CarrierInvoice
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/carrier-invoices/{id}/transition action=SUBMIT"
        actor: BillingClerk
        preconditions: []
        side_effects: ["Sweeps the job's APPROVED HandlingClaims: each becomes SETTLED with credited_invoice_id := this invoice; claim_credit_cents pinned to their settlement sum (version-pinned snapshot — later claim changes do not alter it); job.billing_status recomputed"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /api/carrier-invoices/{id}/transition action=SUBMIT (resubmission cycle)"
        actor: BillingClerk
        preconditions: []
        side_effects: ["Re-sweeps any newly APPROVED claims into credit (accumulates); job.billing_status recomputed"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/carrier-invoices/{id}/transition action=DISPUTE"
        actor: CarrierRepresentative
        preconditions: ["dispute_reason present (ERR_VALIDATION)"]
        side_effects: ["job.billing_status := DISPUTED"]
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /api/carrier-invoices/{id}/transition action=RECONCILE"
        actor: CarrierRepresentative
        preconditions: ["balance_cents == 0 exactly (ERR_INVOICE_BALANCE_OUTSTANDING)"]
        side_effects: ["job.billing_status recomputed"]
      - from: [SUBMITTED, DISPUTED]
        to: [SUBMITTED, DISPUTED]
        trigger: "POST /api/carrier-invoices/{id}/transition action=RECORD_PAYMENT (status unchanged)"
        actor: BillingClerk
        preconditions: ["1 <= amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE; amount < 1 -> ERR_VALIDATION)"]
        side_effects: ["amount_paid_cents += amount_cents; balance_cents recomputed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only — true races per the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: triage-decision-stale-item
    parent_entity: Item
    write_endpoint: "POST /api/items/{id}/triage"
    occ_field: expected_item_version
    description: |
      Re-triage is a legitimate revision loop (SALVAGEABLE <-> NON_SALVAGEABLE while the
      item is still re-triageable), so a second triage request observes the same triage
      state and would succeed on state grounds alone. The request is rejected instead
      when its expected_item_version no longer equals the Item's current version,
      because another triage decision has advanced Item.version since the client's view.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
  - rule_id: statement-create-stale-job
    parent_entity: PackOutJob
    write_endpoint: "POST /api/pack-out-jobs/{id}/storage-statements"
    occ_field: expected_job_version
    description: |
      Creating a StorageStatement with supersedes_statement_id legitimately voids the
      job's current PROVISIONAL statement, so a second create observes a still-valid
      job state and would succeed on state grounds alone. The request is rejected
      instead when its expected_job_version no longer equals the job's current version,
      because a prior statement creation has advanced PackOutJob.version since the
      client's view.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_charge_accrual
    trigger: "Statement creation (provisional); every placement activation/release while a statement is PROVISIONAL (provisional recompute); POST /api/billing-runs finalization (final)"
    algorithm: aggregation
    formula: |
      Input set: StoragePlacements of the job (via Item -> Room -> PackOutJob).
      PROVISIONAL variant (forward-looking, whole-month convention):
        include only placements with status == ACTIVE at computation time whose
        placed_on < statement.period_end;
        charge per placement = monthly_rate_cents * (number of distinct calendar
        months touched by [max(placed_on, period_start), period_end) );
        any partial month counts as a FULL month.
      FINAL variant (chronological daily proration):
        include every placement (ACTIVE or RELEASED) that occupied at least one
        day of [period_start, period_end);
        a placement occupies UTC date d iff placed_on <= d < (released_on or
        period_end, whichever is earlier), intersected with [period_start, period_end);
        daily_rate_cents = round_half_up(monthly_rate_cents * 12 / 365)
          -- ROUNDING ORDER PINNED: the daily rate is rounded once per placement
          -- FIRST, then multiplied by the occupied-day count; do NOT sum
          -- unrounded values and round once at the end (6001 -> 197/day ->
          -- 3 days = 591, not round(6001*12*3/365) = 592);
        charge per placement = daily_rate_cents * occupied_day_count;
        statement total = sum of per-placement charges.
    input_set: "PROVISIONAL: placements ACTIVE now, overlapping period; FINAL: all placements occupying >=1 day of the period, regardless of current status"
    constants:
      DAYS_PER_YEAR: 365
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Statement in PROVISIONAL status (creation and each placement mutation)"
        difference: "Whole-month forward-looking convention over currently-ACTIVE placements; assumes continued occupancy"
      - name: final
        when: "Billing run finalizes a statement whose period_end <= logical clock date"
        difference: "Chronological daily proration over all placements that occupied the period, including RELEASED ones; produces different cents than provisional for identical placement data"

  - name: handling_claim_settlement
    trigger: "HandlingClaim APPROVE transition"
    algorithm: threshold
    formula: |
      Variant selected by the job's policy_coverage_type (Item.room_id -> Room.job_id):
      ACV:  depreciation_pct = min(item_age_years * DEPRECIATION_PCT_PER_YEAR, MAX_DEPRECIATION_PCT)
            acv = max(replacement_cost_cents * (100 - depreciation_pct) / 100,
                      replacement_cost_cents * FLOOR_PCT / 100)
            settlement = round_half_up(acv)
      RCV:  if the item has any SpecialtyReferral with status QA_ACCEPTED: uncapped
            else settlement = min(replacement_cost_cents, RCV_CAP_CENTS)
      Both variants: settlement_amount_cents is an integer-cents value; division
      uses exact rational arithmetic rounded once at the end (round_half_up).
    input_set: "The single HandlingClaim being approved + its Item (+ the item's referrals for the RCV cap exception)"
    constants:
      DEPRECIATION_PCT_PER_YEAR: 10
      MAX_DEPRECIATION_PCT: 70
      FLOOR_PCT: 30
      RCV_CAP_CENTS: 250000
    precision: "integer cents, round_half_up"
    variants:
      - name: ACV
        when: "job.policy_coverage_type == ACV"
        difference: "Depreciates by age with a 70% cap and a 30% floor — nested min/max over 3 inputs (replacement_cost_cents, item_age_years, constants)"
      - name: RCV
        when: "job.policy_coverage_type == RCV"
        difference: "Full replacement cost, capped at RCV_CAP_CENTS unless a QA_ACCEPTED specialty referral exists for the item; identical claim data yields different cents than ACV"

  - name: carrier_invoice_total
    trigger: "CarrierInvoice creation (storage sweep); recompute of balance on RECORD_PAYMENT and SUBMIT"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
        1. storage_cents   = sum(final_total_cents) over the job's FINALIZED
                             statements swept at creation (they become INVOICED);
        2. subtotal_cents  = storage_cents + adjustment_cents;
        3. fee_pct         = 5  if subtotal_cents < 100000
                             7  if 100000 <= subtotal_cents < 500000
                             9  if subtotal_cents >= 500000
           -- the tier is keyed on the SUBTOTAL BEFORE the fee, never on the
           -- post-fee total (which would be circular);
        4. admin_fee_cents = round_half_up(subtotal_cents * fee_pct / 100);
        5. total_cents     = subtotal_cents + admin_fee_cents;
        6. balance_cents   = total_cents - claim_credit_cents - amount_paid_cents.
    input_set: "Swept FINALIZED statements + adjustment input + pinned claim_credit_cents + RECORD_PAYMENT history"
    constants:
      FEE_TIER1_MAX_CENTS: 100000
      FEE_TIER2_MAX_CENTS: 500000
      FEE_TIER1_PCT: 5
      FEE_TIER2_PCT: 7
      FEE_TIER3_PCT: 9
    precision: "integer cents, round_half_up"
    variants: []

  - name: vault_occupancy
    trigger: "StoragePlacement activation and release (any release_reason)"
    algorithm: aggregation
    formula: |
      vault.occupied_cu_ft = sum(item.volume_cu_ft) over this vault's placements
      with status == ACTIVE.
      Activation adds exactly item.volume_cu_ft; the paired release subtracts
      exactly the same amount — activate+release leaves occupied_cu_ft unchanged
      (compensating invariant; conserved quantity: physical volume).
      vault.posture = FULL iff occupied_cu_ft == capacity_cu_ft else OPEN.
    input_set: "StoragePlacements of the vault with status ACTIVE"
    constants: {}
    precision: "integer cubic feet (exact)"
    variants: []

  - name: cleaning_task_fee
    trigger: "CleaningTask QA_PASS transition"
    algorithm: aggregation
    formula: |
      fee_cents = CLEANING_BASE_CENTS + (DEODORIZATION_ADDER_CENTS if deodorization_required else 0)
      deodorization_required was snapshotted from item.smoke_damage_flag at task creation.
    input_set: "The single CleaningTask transitioning to PASSED"
    constants:
      CLEANING_BASE_CENTS: 12000
      DEODORIZATION_ADDER_CENTS: 4000
    precision: "integer cents (exact)"
    variants: []

  - name: specialty_billed_cost
    trigger: "SpecialtyReferral QA_ACCEPT transition"
    algorithm: aggregation
    formula: |
      billed_cost_cents = round_half_up(quoted_cost_cents * (100 + markup_pct) / 100)
      Rounded exactly once at the end.
    input_set: "The single SpecialtyReferral being accepted"
    constants:
      DEFAULT_MARKUP_PCT: 15
    precision: "integer cents, round_half_up"
    variants: []

  - name: packback_eligibility_count
    trigger: "PackBackSchedule CONFIRM transition"
    algorithm: aggregation
    formula: |
      eligible items = Items of the job (Item.room_id -> Room.job_id) where
        processing_status == IN_STORAGE
        AND every SpecialtyReferral of the item has status == QA_ACCEPTED
      eligible_item_count = count(eligible items).
      CONFIRM requires eligible_item_count >= 1 (ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK)
      AND no eligible item having a HandlingClaim with status in
      {FILED, UNDER_REVIEW, APPROVED} (ERR_OPEN_CLAIM_BLOCKS_PACKBACK).
    input_set: "Items of the job filtered by the explicit predicate above (no fuzzy 'ready' adjective — the enum set is the filter)"
    constants: {}
    precision: "integer count (exact)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation/ownership: disposal VERIFY user != documented_by_user_id; claim APPROVE/DENY/SETTLE user != filed_by_user_id; referral RECEIVE/RETURN user == referral.subcontractor_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/disposal-records/{id}/transition, POST /api/handling-claims/{id}/transition" }
  - { priority: 3, category: auth, check: "SubcontractorContact may only act on referrals whose subcontractor_id == X-User-ID", error_id: ERR_NOT_REFERRAL_SUBCONTRACTOR, http_status: 403, applies_to: "POST /api/specialty-referrals/{id}/transition, POST /api/specialty-referrals/{id}/custody-events" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, enum members valid, integer ranges respected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path and body-referenced resources exist, validated left-to-right (job, room, item, vault, placement, subcontractor, referral, claim, schedule, statement, invoice, disposal record, cleaning task)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC precondition: expected_item_version == Item.version on triage; expected_job_version == PackOutJob.version on statement create", error_id: ERR_STALE_ITEM_VERSION, http_status: 412, applies_to: "POST /api/items/{id}/triage" }
  - { priority: 6, category: state, check: "OCC precondition: expected_job_version == PackOutJob.version on statement create", error_id: ERR_STALE_JOB_VERSION, http_status: 412, applies_to: "POST /api/pack-out-jobs/{id}/storage-statements" }
  - { priority: 7, category: state, check: "Target resource's current state permits the requested transition per §1.2 (covers invalid-from, terminal lockdown, duplicate-action)", error_id: ERR_INVALID_TRANSITION, http_status: 409, applies_to: "all transition/triage/release/close endpoints" }
  - { priority: 7, category: state, check: "Item terminal lockdown: processing_status in {DISPOSED, DELIVERED, CLAIM_SETTLED} rejects triage/placement/referral/claim mutations", error_id: ERR_ITEM_TERMINAL, http_status: 409, applies_to: "POST /api/items/{id}/triage, POST /api/items/{id}/placements, POST /api/items/{id}/specialty-referrals, POST /api/items/{id}/handling-claims" }
  - { priority: 7, category: state, check: "Cleaning task creation or placement requires item.condition_triage == SALVAGEABLE", error_id: ERR_ITEM_NOT_SALVAGEABLE, http_status: 409, applies_to: "POST /api/items/{id}/cleaning-tasks, POST /api/items/{id}/placements" }
  - { priority: 7, category: state, check: "Job CLOSE requires every item terminal", error_id: ERR_JOB_ITEMS_NOT_TERMINAL, http_status: 409, applies_to: "POST /api/pack-out-jobs/{id}/transition action=CLOSE" }
  - { priority: 8, category: business_safety, check: "Hazmat-flagged items may never be placed in any vault", error_id: ERR_HAZMAT_STORAGE_FORBIDDEN, http_status: 422, applies_to: "POST /api/items/{id}/placements" }
  - { priority: 8, category: business_safety, check: "Climate-required categories {TEXTILE, DOCUMENT, ARTWORK, ELECTRONICS} may only be placed in CLIMATE_CONTROLLED vaults", error_id: ERR_CLIMATE_CLASS_INCOMPATIBLE, http_status: 422, applies_to: "POST /api/items/{id}/placements" }
  - { priority: 8, category: business_safety, check: "DOCUMENT of a hazmat item requires manifest_number and disposal_method == HAZARDOUS_WASTE", error_id: ERR_HAZMAT_MANIFEST_REQUIRED, http_status: 422, applies_to: "POST /api/disposal-records/{id}/transition action=DOCUMENT" }
  - { priority: 9, category: business_constraint, check: "Item barcode unique within the parent job", error_id: ERR_DUPLICATE_BARCODE, http_status: 409, applies_to: "POST /api/rooms/{id}/items" }
  - { priority: 9, category: business_constraint, check: "Vault capacity: vault.occupied_cu_ft + item.volume_cu_ft <= vault.capacity_cu_ft (exact fit allowed)", error_id: ERR_VAULT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/items/{id}/placements" }
  - { priority: 9, category: business_constraint, check: "Subcontractor aggregate capacity: active_referral_count < max_concurrent_referrals at DISPATCH (not on QA_REJECTED resend)", error_id: ERR_SUBCONTRACTOR_AT_CAPACITY, http_status: 422, applies_to: "POST /api/specialty-referrals/{id}/transition action=DISPATCH" }
  - { priority: 9, category: business_constraint, check: "Crew window half-open overlap on same crew_id + service_date among schedules in {CONFIRMED, IN_TRANSIT}; adjacency allowed", error_id: ERR_CREW_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /api/pack-back-schedules/{id}/transition action=CONFIRM" }
  - { priority: 9, category: business_constraint, check: "Non-VOIDED statements of one job must have disjoint [period_start, period_end) periods; at most one PROVISIONAL per job unless supersedes_statement_id names it", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /api/pack-out-jobs/{id}/storage-statements" }
  - { priority: 10, category: business_temporal, check: "Schedule window: window_end_hour > window_start_hour; custody event_at strictly greater than all prior events on the referral", error_id: ERR_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/pack-out-jobs/{id}/pack-back-schedules, POST /api/pack-back-schedules/{id}/transition action=RESCHEDULE" }
  - { priority: 10, category: business_temporal, check: "Custody event ordering: event_at strictly increasing per referral", error_id: ERR_CUSTODY_EVENT_OUT_OF_ORDER, http_status: 422, applies_to: "POST /api/specialty-referrals/{id}/custody-events" }
  - { priority: 11, category: business_referential, check: "Schedule CONFIRM requires job.structure_status == COMPLETE", error_id: ERR_JOB_NOT_READY_FOR_PACKBACK, http_status: 409, applies_to: "POST /api/pack-back-schedules/{id}/transition action=CONFIRM" }
  - { priority: 11, category: business_referential, check: "Schedule CONFIRM requires packback_eligibility_count >= 1", error_id: ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK, http_status: 422, applies_to: "POST /api/pack-back-schedules/{id}/transition action=CONFIRM" }
  - { priority: 11, category: business_referential, check: "Schedule CONFIRM rejects when any eligible item has an open HandlingClaim (FILED/UNDER_REVIEW/APPROVED)", error_id: ERR_OPEN_CLAIM_BLOCKS_PACKBACK, http_status: 409, applies_to: "POST /api/pack-back-schedules/{id}/transition action=CONFIRM" }
  - { priority: 11, category: business_referential, check: "Placement of an is_high_value item requires an existing QA_ACCEPTED SpecialtyReferral for the item; CleaningTask creation on ARTWORK category is forbidden (specialty-only)", error_id: ERR_SPECIALTY_REQUIRED, http_status: 422, applies_to: "POST /api/items/{id}/placements, POST /api/items/{id}/cleaning-tasks" }
  - { priority: 11, category: business_referential, check: "Invoice creation requires zero PROVISIONAL statements on the job and >=1 FINALIZED statement to sweep", error_id: ERR_STATEMENT_PERIOD_OPEN, http_status: 409, applies_to: "POST /api/pack-out-jobs/{id}/carrier-invoices" }
  - { priority: 12, category: business_fiscal, check: "RECORD_PAYMENT amount_cents must satisfy 1 <= amount <= balance_cents", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /api/carrier-invoices/{id}/transition action=RECORD_PAYMENT" }
  - { priority: 12, category: business_fiscal, check: "RECONCILE requires balance_cents == 0 exactly", error_id: ERR_INVOICE_BALANCE_OUTSTANDING, http_status: 422, applies_to: "POST /api/carrier-invoices/{id}/transition action=RECONCILE" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- PackOutJob ----
  - { method: POST, path: "/api/pack-out-jobs", description: "Create a pack-out job", roles: [ProjectManager], code: 201, input: [claim_number, property_address, carrier_name, policy_coverage_type], output: PackOutJob, side_effects: ["Job starts INTAKE / structure PENDING / billing ACCUMULATING"] }
  - { method: GET, path: "/api/pack-out-jobs/{id}", description: "Read a job with computed billing/rollup fields", roles: [ProjectManager, InventoryTechnician, BillingClerk, ClaimsAdjuster], code: 200, input: [], output: PackOutJob, side_effects: [] }
  - { method: POST, path: "/api/pack-out-jobs/{id}/transition", description: "Job lifecycle + structure-signoff actions: STRUCTURE_START | STRUCTURE_COMPLETE | STRUCTURE_RESCIND | CLOSE", roles: [ProjectManager], code: 200, input: [action], output: PackOutJob, side_effects: ["Drives PackOutJob.status / structure_status per §1.2; increments PackOutJob.version by 1"] }

  # ---- Room ----
  - { method: POST, path: "/api/pack-out-jobs/{id}/rooms", description: "Add a room to a job", roles: [ProjectManager], code: 201, input: [name, room_type, "floor_level?"], output: Room, side_effects: [] }
  - { method: GET, path: "/api/pack-out-jobs/{id}/rooms", description: "List rooms of a job (paginated)", roles: [ProjectManager, InventoryTechnician, BillingClerk, ClaimsAdjuster], code: 200, input: ["limit?", "offset?"], output: "Room[]", side_effects: [] }

  # ---- Item ----
  - { method: POST, path: "/api/rooms/{id}/items", description: "Register an inventoried item with photo/barcode", roles: [InventoryTechnician], code: 201, input: [barcode, description, item_category, declared_value_cents, volume_cu_ft, "photo_ref?", "hazmat_flag?", "smoke_damage_flag?"], output: Item, side_effects: ["First item moves job INTAKE -> ACTIVE; Room compound recompute"] }
  - { method: GET, path: "/api/items", description: "List items, optionally filtered by room_id (paginated)", roles: [ProjectManager, InventoryTechnician, BillingClerk, ClaimsAdjuster], code: 200, input: ["room_id?", "limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: GET, path: "/api/items/{id}", description: "Read an item (both parallel state dimensions + is_high_value)", roles: [ProjectManager, InventoryTechnician, BillingClerk, ClaimsAdjuster], code: 200, input: [], output: Item, side_effects: [] }
  - { method: POST, path: "/api/items/{id}/triage", description: "Salvageable determination / OCC-guarded re-triage", roles: [InventoryTechnician], code: 200, input: [determination, expected_item_version, "triage_note?"], output: Item, side_effects: ["Drives condition_triage + processing_status per §1.2 incl. disposal-record creation, placement release cascade, statement recompute; increments Item.version by 1"] }

  # ---- DisposalRecord ----
  - { method: GET, path: "/api/items/{id}/disposal-record", description: "Fetch the item's disposal record (array of 0-1)", roles: [ProjectManager, InventoryTechnician], code: 200, input: [], output: "DisposalRecord[]", side_effects: [] }
  - { method: POST, path: "/api/disposal-records/{id}/transition", description: "DOCUMENT (InventoryTechnician) | VERIFY (ProjectManager, SoD-checked)", roles: [InventoryTechnician, ProjectManager], code: 200, input: [action, "disposal_method?", "manifest_number?", "facility_name?", "photo_ref?"], output: DisposalRecord, side_effects: ["VERIFY flips item DISPOSED + compound recompute"] }

  # ---- CleaningTask ----
  - { method: POST, path: "/api/items/{id}/cleaning-tasks", description: "Schedule cleaning; process_code derived from item_category; ARTWORK rejected (ERR_SPECIALTY_REQUIRED)", roles: [InventoryTechnician], code: 201, input: [], output: CleaningTask, side_effects: [] }
  - { method: GET, path: "/api/items/{id}/cleaning-tasks", description: "List cleaning tasks of an item", roles: [ProjectManager, InventoryTechnician], code: 200, input: [], output: "CleaningTask[]", side_effects: [] }
  - { method: POST, path: "/api/cleaning-tasks/{id}/transition", description: "START | QA_PASS | QA_FAIL | REWORK (rework cycle)", roles: [InventoryTechnician], code: 200, input: [action, "qa_note?"], output: CleaningTask, side_effects: ["Drives item processing_status; QA_PASS computes fee_cents"] }

  # ---- Vault ----
  - { method: POST, path: "/api/vaults", description: "Register a storage vault", roles: [ProjectManager], code: 201, input: [code, climate_class, capacity_cu_ft, monthly_rate_cents_per_cu_ft], output: Vault, side_effects: [] }
  - { method: GET, path: "/api/vaults/{id}", description: "Read vault incl. computed occupied_cu_ft / posture", roles: [ProjectManager, InventoryTechnician, BillingClerk], code: 200, input: [], output: Vault, side_effects: [] }

  # ---- StoragePlacement ----
  - { method: POST, path: "/api/items/{id}/placements", description: "Activate placement of a CLEANED item into a vault (hazmat/climate/capacity/high-value gates)", roles: [InventoryTechnician], code: 201, input: [vault_id], output: StoragePlacement, side_effects: ["monthly_rate_cents snapshot; item -> IN_STORAGE; vault.occupied_cu_ft += volume; PROVISIONAL accrual recompute"] }
  - { method: GET, path: "/api/items/{id}/placements", description: "List placements of an item", roles: [ProjectManager, InventoryTechnician, BillingClerk], code: 200, input: [], output: "StoragePlacement[]", side_effects: [] }
  - { method: GET, path: "/api/vaults/{id}/placements", description: "List placements in a vault", roles: [ProjectManager, InventoryTechnician, BillingClerk], code: 200, input: [], output: "StoragePlacement[]", side_effects: [] }
  - { method: POST, path: "/api/storage-placements/{id}/release", description: "Manual release of an ACTIVE placement (reason=MANUAL)", roles: [InventoryTechnician], code: 200, input: [], output: StoragePlacement, side_effects: ["item IN_STORAGE -> CLEANED; vault occupancy decrement; accrual recompute"] }

  # ---- Subcontractor ----
  - { method: POST, path: "/api/subcontractors", description: "Register a specialty subcontractor", roles: [ProjectManager], code: 201, input: [name, specialty_types, max_concurrent_referrals, "contact_email?"], output: Subcontractor, side_effects: [] }
  - { method: GET, path: "/api/subcontractors/{id}", description: "Read subcontractor incl. active_referral_count", roles: [ProjectManager, InventoryTechnician], code: 200, input: [], output: Subcontractor, side_effects: [] }

  # ---- SpecialtyReferral + CustodyEvent ----
  - { method: POST, path: "/api/items/{id}/specialty-referrals", description: "Create a specialty referral for an item (specialty_type must be offered by the subcontractor)", roles: [ProjectManager], code: 201, input: [subcontractor_id, specialty_type, quoted_cost_cents, "markup_pct?"], output: SpecialtyReferral, side_effects: [] }
  - { method: GET, path: "/api/specialty-referrals", description: "List referrals, filterable by item_id and/or subcontractor_id", roles: [ProjectManager, InventoryTechnician, SubcontractorContact], code: 200, input: ["item_id?", "subcontractor_id?", "limit?", "offset?"], output: "SpecialtyReferral[]", side_effects: [] }
  - { method: GET, path: "/api/specialty-referrals/{id}", description: "Read a referral", roles: [ProjectManager, InventoryTechnician, SubcontractorContact], code: 200, input: [], output: SpecialtyReferral, side_effects: [] }
  - { method: POST, path: "/api/specialty-referrals/{id}/transition", description: "DISPATCH (PM, capacity gate) | RECEIVE | RETURN (SubcontractorContact, own vendor only) | QA_ACCEPT | QA_REJECT (PM)", roles: [ProjectManager, SubcontractorContact], code: 200, input: [action, "qa_note?"], output: SpecialtyReferral, side_effects: ["DISPATCH: item -> OUT_FOR_SPECIALTY (+placement release if IN_STORAGE); QA_ACCEPT: billed_cost_cents + item -> CLEANED; capacity counter updates per §1.2"] }
  - { method: POST, path: "/api/specialty-referrals/{id}/custody-events", description: "Append a chain-of-custody event (strictly increasing event_at)", roles: [InventoryTechnician, SubcontractorContact], code: 201, input: [event_type, event_at, actor_name, "note?"], output: CustodyEvent, side_effects: ["sequence := prior max + 1"] }
  - { method: GET, path: "/api/specialty-referrals/{id}/custody-events", description: "List custody events of a referral in sequence order", roles: [ProjectManager, InventoryTechnician, SubcontractorContact], code: 200, input: [], output: "CustodyEvent[]", side_effects: [] }

  # ---- HandlingClaim ----
  - { method: POST, path: "/api/items/{id}/handling-claims", description: "File a loss/damage-during-handling claim on an item (one open claim per item)", roles: [ProjectManager, InventoryTechnician], code: 201, input: [claim_type, description, replacement_cost_cents, item_age_years], output: HandlingClaim, side_effects: ["filed_by_user_id := X-User-ID"] }
  - { method: GET, path: "/api/items/{id}/handling-claims", description: "List claims on an item", roles: [ProjectManager, InventoryTechnician, ClaimsAdjuster], code: 200, input: [], output: "HandlingClaim[]", side_effects: [] }
  - { method: GET, path: "/api/carrier-invoices/{id}/handling-claims", description: "List claims credited to an invoice (credited_invoice_id)", roles: [BillingClerk, ClaimsAdjuster, CarrierRepresentative], code: 200, input: [], output: "HandlingClaim[]", side_effects: [] }
  - { method: POST, path: "/api/handling-claims/{id}/transition", description: "SUBMIT_REVIEW | APPROVE | DENY | APPEAL | SETTLE | VOID (SoD: approver != filer; settlement computed at APPROVE)", roles: [ClaimsAdjuster], code: 200, input: [action, "review_note?"], output: HandlingClaim, side_effects: ["APPROVE computes settlement per handling_claim_settlement; SETTLE moves item CLAIM_SETTLED with placement-release cascade"] }

  # ---- PackBackSchedule ----
  - { method: POST, path: "/api/pack-out-jobs/{id}/pack-back-schedules", description: "Request a pack-back schedule (crew window)", roles: [ProjectManager], code: 201, input: [crew_id, service_date, window_start_hour, window_end_hour], output: PackBackSchedule, side_effects: [] }
  - { method: GET, path: "/api/pack-out-jobs/{id}/pack-back-schedules", description: "List pack-back schedules of a job", roles: [ProjectManager, InventoryTechnician], code: 200, input: [], output: "PackBackSchedule[]", side_effects: [] }
  - { method: POST, path: "/api/pack-back-schedules/{id}/transition", description: "CONFIRM (structure/overlap/eligibility/claim gates) | START_TRANSIT | DELIVER | COMPLETE | RESCHEDULE | CANCEL", roles: [ProjectManager], code: 200, input: [action, "service_date?", "window_start_hour?", "window_end_hour?"], output: PackBackSchedule, side_effects: ["CONFIRM snapshots eligible_item_count; START_TRANSIT packs back eligible items + releases placements (PACK_BACK cascade); DELIVER marks items DELIVERED"] }

  # ---- StorageStatement / billing ----
  - { method: POST, path: "/api/pack-out-jobs/{id}/storage-statements", description: "Create PROVISIONAL statement for a period (OCC: expected_job_version; create-with-supersede via supersedes_statement_id)", roles: [BillingClerk], code: 201, input: [period_start, period_end, expected_job_version, "supersedes_statement_id?"], output: StorageStatement, side_effects: ["provisional_total_cents computed (provisional variant); named PROVISIONAL statement VOIDED; increments PackOutJob.version by 1; job.accrued_storage_total_cents recomputed"] }
  - { method: GET, path: "/api/storage-statements", description: "List statements, filterable by job_id and/or supersedes_statement_id", roles: [BillingClerk, ProjectManager], code: 200, input: ["job_id?", "supersedes_statement_id?", "limit?", "offset?"], output: "StorageStatement[]", side_effects: [] }
  - { method: GET, path: "/api/storage-statements/{id}", description: "Read a statement", roles: [BillingClerk, ProjectManager], code: 200, input: [], output: StorageStatement, side_effects: [] }
  - { method: POST, path: "/api/billing-runs", description: "Ops-run checkpoint: finalize every PROVISIONAL statement whose period_end <= logical clock date (final variant computed)", roles: [BillingClerk], code: 200, input: [], output: "{ finalized_count: integer, finalized_statement_ids: string[] }", side_effects: ["PROVISIONAL -> FINALIZED sweep; job.accrued_storage_total_cents recomputed"] }

  # ---- CarrierInvoice ----
  - { method: POST, path: "/api/pack-out-jobs/{id}/carrier-invoices", description: "Create DRAFT invoice sweeping the job's FINALIZED statements (blocked while any PROVISIONAL exists)", roles: [BillingClerk], code: 201, input: ["adjustment_cents?"], output: CarrierInvoice, side_effects: ["storage_cents swept; admin_fee_cents + total_cents per carrier_invoice_total; swept statements -> INVOICED; job.billing_status recomputed"] }
  - { method: GET, path: "/api/pack-out-jobs/{id}/carrier-invoices", description: "List invoices of a job", roles: [BillingClerk, ProjectManager, CarrierRepresentative], code: 200, input: [], output: "CarrierInvoice[]", side_effects: [] }
  - { method: GET, path: "/api/carrier-invoices/{id}", description: "Read an invoice", roles: [BillingClerk, ProjectManager, CarrierRepresentative], code: 200, input: [], output: CarrierInvoice, side_effects: [] }
  - { method: POST, path: "/api/carrier-invoices/{id}/transition", description: "SUBMIT (sweeps APPROVED claims into pinned credit) | RECORD_PAYMENT | DISPUTE | RECONCILE (balance == 0 gate)", roles: [BillingClerk, CarrierRepresentative], code: 200, input: [action, "amount_cents?", "dispute_reason?"], output: CarrierInvoice, side_effects: ["SUBMIT: claim sweep -> SETTLED + credited_invoice_id, claim_credit_cents pinned; RECORD_PAYMENT: amount_paid_cents/balance_cents; RECONCILE/DISPUTE: billing_status recompute"] }

  # ---- Test-driving clock (default time mandatory) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [ProjectManager, InventoryTechnician, BillingClerk], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["All date/datetime stamping (placed_on, released_on, documented_at, billing-run eligibility) reads this clock"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/empty X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposal verifier == documenter, or claim approver/denier/settler == filer (same X-User-ID)" }
  - { id: ERR_NOT_REFERRAL_SUBCONTRACTOR, http: 403, condition: "SubcontractorContact acting on a referral whose subcontractor_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum member, integer range violation, statement period overlap / duplicate PROVISIONAL without supersede, no FINALIZED statements to invoice" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path or body-referenced resource id does not exist" }
  - { id: ERR_STALE_ITEM_VERSION, http: 412, condition: "expected_item_version != Item.version on triage (OCC)" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version != PackOutJob.version on statement create (OCC)" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Current state does not permit the requested transition per §1.2" }
  - { id: ERR_ITEM_TERMINAL, http: 409, condition: "Mutation attempted on item in terminal processing_status (DISPOSED | DELIVERED | CLAIM_SETTLED)" }
  - { id: ERR_ITEM_NOT_SALVAGEABLE, http: 409, condition: "Cleaning-task creation or placement while condition_triage != SALVAGEABLE" }
  - { id: ERR_JOB_ITEMS_NOT_TERMINAL, http: 409, condition: "Job CLOSE while any item is non-terminal" }
  - { id: ERR_JOB_NOT_READY_FOR_PACKBACK, http: 409, condition: "Schedule CONFIRM while job.structure_status != COMPLETE" }
  - { id: ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK, http: 422, condition: "Schedule CONFIRM with packback_eligibility_count == 0 (empty eligible set)" }
  - { id: ERR_OPEN_CLAIM_BLOCKS_PACKBACK, http: 409, condition: "Schedule CONFIRM while any eligible item has an open claim (FILED | UNDER_REVIEW | APPROVED)" }
  - { id: ERR_STATEMENT_PERIOD_OPEN, http: 409, condition: "Invoice creation while a PROVISIONAL statement exists on the job" }
  - { id: ERR_HAZMAT_STORAGE_FORBIDDEN, http: 422, condition: "Placement of a hazmat_flag item into any vault" }
  - { id: ERR_CLIMATE_CLASS_INCOMPATIBLE, http: 422, condition: "Placement of {TEXTILE, DOCUMENT, ARTWORK, ELECTRONICS} into a non-CLIMATE_CONTROLLED vault" }
  - { id: ERR_HAZMAT_MANIFEST_REQUIRED, http: 422, condition: "DOCUMENT of a hazmat item without manifest_number or with disposal_method != HAZARDOUS_WASTE" }
  - { id: ERR_VAULT_CAPACITY_EXCEEDED, http: 422, condition: "Placement would push occupied_cu_ft above capacity_cu_ft (exact fit allowed: occupied + volume <= capacity passes)" }
  - { id: ERR_DUPLICATE_BARCODE, http: 409, condition: "Item barcode already used by another item in the same job" }
  - { id: ERR_SUBCONTRACTOR_AT_CAPACITY, http: 422, condition: "DISPATCH while subcontractor.active_referral_count >= max_concurrent_referrals" }
  - { id: ERR_CREW_WINDOW_OVERLAP, http: 422, condition: "CONFIRM collides with another CONFIRMED/IN_TRANSIT schedule on same crew_id + service_date (half-open windows; adjacency allowed)" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window_end_hour <= window_start_hour on schedule create/RESCHEDULE" }
  - { id: ERR_CUSTODY_EVENT_OUT_OF_ORDER, http: 422, condition: "custody event_at not strictly greater than the referral's latest event_at" }
  - { id: ERR_SPECIALTY_REQUIRED, http: 422, condition: "Placement of is_high_value item without a QA_ACCEPTED referral, or CleaningTask on ARTWORK category" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "RECORD_PAYMENT amount_cents > balance_cents" }
  - { id: ERR_INVOICE_BALANCE_OUTSTANDING, http: 422, condition: "RECONCILE while balance_cents != 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Contents restoration project manager; owns jobs, rooms, vaults, subcontractors, referrals, pack-back schedules; verifies disposals"
    identity: opaque
    exclusive_operations: ["job/room/vault/subcontractor creation", "job transitions incl. structure signoff and CLOSE", "referral DISPATCH/QA_ACCEPT/QA_REJECT", "pack-back schedule lifecycle", "disposal VERIFY"]
    shared_operations: ["read jobs/rooms/items/placements/statements/invoices", "file handling claims", "set logical clock"]
  - name: InventoryTechnician
    description: "Field/warehouse technician; registers items, triages, cleans, places into vaults, documents disposals, records custody events"
    identity: opaque
    exclusive_operations: ["item registration", "triage decisions (OCC)", "cleaning task lifecycle", "placement activation/release", "disposal DOCUMENT"]
    shared_operations: ["read jobs/rooms/items/vaults/referrals", "file handling claims", "custody events", "set logical clock"]
  - name: BillingClerk
    description: "Billing specialist; owns statements, billing runs, invoices, payments"
    identity: opaque
    exclusive_operations: ["storage statement create (OCC, supersede)", "billing runs", "carrier invoice create/SUBMIT/RECORD_PAYMENT"]
    shared_operations: ["read jobs/items/vaults/placements/statements/invoices", "set logical clock"]
  - name: ClaimsAdjuster
    description: "Adjuster; reviews and settles handling claims; cannot approve a claim they filed (SoD)"
    identity: opaque
    exclusive_operations: ["claim SUBMIT_REVIEW/APPROVE/DENY/APPEAL/SETTLE/VOID"]
    shared_operations: ["read jobs/rooms/items", "read claims"]
  - name: SubcontractorContact
    description: "Specialty vendor contact; acts only on their own subcontractor's referrals"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: ["referral RECEIVE/RETURN"]
    shared_operations: ["read referrals", "custody events"]
  - name: CarrierRepresentative
    description: "Insurance carrier representative; disputes or reconciles submitted invoices"
    identity: opaque
    exclusive_operations: ["invoice DISPUTE/RECONCILE"]
    shared_operations: ["read invoices and credited claims"]
