              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "ONE_TIME", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/confirm-pickup"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 36.0 }
              as: PlantOperator
            - call: "POST /service-orders/${order_id}/receive-at-plant"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /service-orders/${order_id}/destroy"
              payload: { witnessed_by: "tech-1" }
