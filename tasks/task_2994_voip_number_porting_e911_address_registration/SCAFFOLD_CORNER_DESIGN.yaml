            - "the trigger returns HTTP 200 with PhoneNumber.${pn1_id}.status == PARKED, assigned_account_id null and parked_at == 2026-08-01T00:00:00Z"
            - "GET /voip/number-blocks/${blk_id} now shows minted_count 2, available_count 1, reserved_count 0, assigned_count 0, parked_count 1"
