        grounds:
          - concurrency_rules[amend-agreement-stale-version]
          - endpoints.POST_/agreements/{id}/amendments
        distinguishing_aspect: "OCC on the Agreement version: two strictly sequential amendments both carrying the version observed at creation — the first succeeds (version 1 -> 2), the second is rejected 412 ERR_STALE_VERSION even though the agreement is still ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded via an ACTIVE agreement at version 1."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "OCC Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tocc_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "OCC Distributing", home_state: "TX", license_number: "TX-W-5001", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
