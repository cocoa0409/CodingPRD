          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E12, bundle B12 of 4 cycles, advocate A12, member M16 CARE_ACTIVE, clinic C12 CONTRACTED at 1450000."
