          eligible location must sit in exactly one bucket - unbound pool, bound to exactly one
          award, or high-cost deferred - and the bucket totals must always sum to
          location_count_total. Obligation moves three locations from the pool into the award and
          termination must return exactly those three, with awarded_award_id cleared and no claim
          left in AWARD_BOUND, so the occupancy census before and after the round trip is identical.
