              as: AssessmentManager
              captures: { reviewer_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${reviewer_q_id}/verify-evidence"
              payload: { verified_years_experience: 12, verified_witness_days: 2, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${reviewer_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
