      - name: advancing_the_clock_reports_lapsed_certs_suspended_styles_and_held_runs
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mill/_clock/set_current_utc]
          - state_machines.Certification.ACTIVE_to_LAPSED
          - state_machines.CarpetStyle.ACTIVE_to_SUSPENDED
          - state_machines.ProductionRun.SCHEDULED_to_HELD
        distinguishing_aspect: |
          One clock call returns three parallel arrays and they must agree with the persisted rows:
          the certificate expiring at exactly the new instant lapses (the comparison is <=), its
