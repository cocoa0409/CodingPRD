            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/reassign", payload: { new_supervisor_id: "${sup2_id}" }, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/experience-reports/${r1_id}/reassign", payload: { new_supervisor_id: "${sup2_id}" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "2026-05-15 (submitted 2026-04-01 + 44 days): error_id == ERR_REASSIGN_WINDOW_NOT_OPEN"
            - "2026-05-16 (+45 days): succeeds; supervisor_id == S2"
            - "submitted_at still 2026-04-01 and credit_pct still 100 (locked tier survives reassignment)"
            - "report status remains SUBMITTED (self-loop transition)"
