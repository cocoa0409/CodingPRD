            - "first call: HTTP 409 with error_id ERR_DUPLICATE_TIER_CODE (tier_code collision)"
            - "second call: HTTP 409 with error_id ERR_DUPLICATE_TIER_CODE (tier_rank collision, same error id)"
            - "third call: HTTP 409 with error_id ERR_DUPLICATE_STAGE_NAME"
            - "fourth call: HTTP 409 with error_id ERR_DUPLICATE_ARTIST_NAME even though the legal_name and genre differ"
            - "fifth call: HTTP 409 with error_id ERR_DUPLICATE_WAVE_NUMBER even though the phase differs"
            - "GET /festival-ops/festivals/${fest}/budget-tiers still returns total_count 1"

      - name: pagination_limit_bounds_rejected_at_zero_and_101
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 6]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Priority 6 is a 400, not the 422 that priority 5 would give, and its bounds
          are closed on both ends: limit 0 and limit 101 fail while limit 1 and limit
          100 pass on the same collection, and offset -1 fails while offset 0 passes.
          The passing calls also show the echoed limit / offset in the envelope.
