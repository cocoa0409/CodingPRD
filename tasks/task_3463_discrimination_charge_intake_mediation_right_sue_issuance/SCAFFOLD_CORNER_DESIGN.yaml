  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "a request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence logic."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /eeoc/charges"
              as: ChargingParty
              captures: { err_noauth: $.data.error_id }
          assert:
            - "the harness sends this call WITHOUT the X-User-Role and X-User-ID headers; response is 401 with err_noauth == ERR_UNAUTHENTICATED"
      - name: invalid_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "an X-User-Role value outside the nine declared roles is an authentication failure (401), not an authorization failure (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /eeoc/charges"
              as: Superuser
              captures: { err_badrole: $.data.error_id }
          assert:
            - "the harness sends X-User-Role: Superuser (undeclared); response is 401 with err_badrole == ERR_UNAUTHENTICATED"
      - name: mediator_cannot_assign_investigator
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "assign is a Director exclusive; a Mediator caller gets 403 ERR_FORBIDDEN_ROLE even with a well-formed payload on a real case."
