              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_SHUTTLE_VERSION"
            - "HTTP status == 412"

      - name: derived_lot_counter_reconciles_after_double_booking
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.compute_lot_availability
          - entities.Lot.fields.available_standard_count
        distinguishing_aspect: "Two sequential STANDARD bookings on a capacity-3 lot leave available_standard_count==1; the denormalized counter equals capacity minus active holds after each create."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap3; two customers each book one STANDARD stall."
          setup_api_calls:
            - call: "POST /_clock/set"
