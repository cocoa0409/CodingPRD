      - name: adjudicate_with_allowed_above_billed_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.Claim.SUBMITTED_to_ADJUDICATED", "errors[ERR_AMOUNT_OUT_OF_RANGE]"]
        distinguishing_aspect: "allowed_amount_cents > billed_amount_cents on adjudicate is rejected (precondition violation); exact error is ERR_AMOUNT_OUT_OF_RANGE per §1.6 domain semantics."
        test_recipe:
          setup: ["Plan, member, claim SUBMITTED with billed=10000_00"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-2222222" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 1000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 2000000 }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 4xx; error_id == ERR_AMOUNT_OUT_OF_RANGE (allowed > billed is a fiscal-range violation)"

      - name: stale_version_on_filing_create
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Filing create carrying an expected_contract_version that no longer matches the contract's current version fails with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Plan, contract IN_FORCE; client observed version v0; a laser create bumps contract.version"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-3333333" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${c_id}"
                member_id: "${m_id}"
                lasered_specific_deductible_cents: 15000000
                effective_from: "2026-01-01T00:00:00Z"
                effective_to: "2027-01-01T00:00:00Z"
                expected_contract_version: "${c_v0}"
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 15000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 15000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 15000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /stop-loss/filings"
              payload:
                contract_id: "${c_id}"
                filing_scope: "SPECIFIC"
                member_id: "${m_id}"
                claim_ids: ["${cl_id}"]
                expected_contract_version: "${c_v0} - 1"
              as: StopLossAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_VERSION (client's observed version predates the laser create which bumped the contract)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
