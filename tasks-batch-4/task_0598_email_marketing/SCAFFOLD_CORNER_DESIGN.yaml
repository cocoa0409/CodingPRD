        distinguishing_aspect: "Only consent_state == CONFIRMED, non-suppressed subscribers enter the snapshot: of three contacts (one CONFIRMED, one still PENDING, one CONFIRMED-then-UNSUBSCRIBED and therefore suppressed), recipient_count is exactly 1."
