# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Task 3315
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (19 total).
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is executable from
# empty-DB via the declared endpoint surface. Logical clock default:
# 2026-09-01T00:00:00Z (no set call needed for that instant).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: safe_harbor_cost_vs_physical_work_variants
        grounds:
          - calculations.safe_harbor_cost_test
          - state_machines.ProcurementOrder.DEPOSIT_PAID_to_SAFE_HARBOR_QUALIFIED
          - entities.ProcurementOrder.fields.safe_harbor_method
        distinguishing_aspect: |
          Same order economics, two qualification variants on the ProcurementOrder
          domain: FIVE_PERCENT_COST qualifies on money alone (no evidence), while
          PHYSICAL_WORK ignores a far larger deposit and qualifies only on
          physical-work evidence — the variant, not the amount, decides.
        test_recipe:
          setup:
            - "Project P with one EXECUTED TURBINE supply agreement SA"
            - "PO-A under SA: FIVE_PERCENT_COST, eligible basis 2,000,000.00, deposit 120,000.00 (6%)"
            - "PO-B under SA: PHYSICAL_WORK, eligible basis 2,000,000.00, deposit 1,500,000.00 (75%)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Variant Farm", technology: "WIND", target_capacity_mw: 150, resource_class: "A" }
              as: DeveloperAdmin
              captures: { proj: $.data.id }
            - call: "POST /api/projects/${proj}/supply-agreements"
              payload: { equipment_type: "TURBINE", supplier_name: "Vestas", total_contract_usd: 5000000, domestic_content_certified: false }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 1500000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { po_a: $.data.id }
            - call: "POST /api/procurement-orders/${po_a}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 120000.00 }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 1750000, safe_harbor_method: "PHYSICAL_WORK", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { po_b: $.data.id }
            - call: "POST /api/procurement-orders/${po_b}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 1500000.00 }
              as: ProcurementLead
          trigger:
            - call: "POST /api/procurement-orders/${po_a}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${po_b}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
              captures: { po_b_err: $.data.error_id }
            - call: "POST /api/procurement-orders/${po_b}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED", physical_work_evidence_uri: "s3://evidence/po-b-grading" }
              as: ProcurementLead
          assert:
            - "ProcurementOrder.${po_a}.status == SAFE_HARBOR_QUALIFIED and .safe_harbor_qualified == true with no evidence URI supplied"
            - "Second trigger call fails: ${po_b_err} == ERR_VALIDATION — a 1,500,000.00 deposit (75%) does NOT satisfy PHYSICAL_WORK"
            - "Third trigger call succeeds: ProcurementOrder.${po_b}.status == SAFE_HARBOR_QUALIFIED with deposit far above 5% being irrelevant"

      - name: continuity_four_year_vs_facts_circumstances_diverge
        grounds:
          - calculations.continuity_window_assessment
          - state_machines.TaxCreditQualification.SAFE_HARBOR_ESTABLISHED_to_CONTINUITY_MAINTAINED
          - entities.TaxCreditQualification.fields.continuity_variant
        distinguishing_aspect: |
          Identical work history, clock, and safe-harbor date on the
          TaxCreditQualification domain: FOUR_YEAR_SAFE_HARBOR passes (clock inside
          the 4-year deadline, gaps never examined) while FACTS_AND_CIRCUMSTANCES
          lapses (max consecutive work gap 1096 days > 365) — the two variants of
          the same continuity rule produce opposite verdicts on identical data.
        test_recipe:
          setup:
            - "Two projects X (variant FOUR_YEAR_SAFE_HARBOR) and Y (variant FACTS_AND_CIRCUMSTANCES), each with an EXECUTED supply agreement, a SAFE_HARBOR_QUALIFIED order, safe harbor established 2026-12-01, and one CERTIFIED CONTINUOUS_WORK milestone with work_date 2027-06-01"
            - "Logical clock advanced to 2030-06-01 (within 4-year deadline 2030-12-01, but 1096 days after the last certified work)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Four Year Farm", technology: "SOLAR", target_capacity_mw: 80, resource_class: "B" }
              as: DeveloperAdmin
              captures: { px: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Facts Farm", technology: "SOLAR", target_capacity_mw: 80, resource_class: "B" }
              as: DeveloperAdmin
              captures: { py: $.data.id }
            - call: "POST /api/projects/${px}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "FirstSolar", total_contract_usd: 3000000 }
              as: ProcurementLead
              captures: { sax: $.data.id }
            - call: "POST /api/supply-agreements/${sax}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sax}/procurement-orders"
              payload: { order_amount_usd: 2500000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2500000 }
              as: ProcurementLead
              captures: { pox: $.data.id }
            - call: "POST /api/procurement-orders/${pox}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 200000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${pox}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/projects/${py}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "FirstSolar", total_contract_usd: 3000000 }
              as: ProcurementLead
              captures: { say: $.data.id }
            - call: "POST /api/supply-agreements/${say}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${say}/procurement-orders"
              payload: { order_amount_usd: 2500000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2500000 }
              as: ProcurementLead
              captures: { poy: $.data.id }
            - call: "POST /api/procurement-orders/${poy}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 200000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${poy}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/projects/${px}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcqx: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcqx}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FOUR_YEAR_SAFE_HARBOR" }
              as: TaxCounsel
            - call: "GET /api/projects/${py}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcqy: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcqy}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FACTS_AND_CIRCUMSTANCES" }
              as: TaxCounsel
            - call: "POST /api/projects/${px}/construction-milestones"
              payload: { milestone_type: "CONTINUOUS_WORK", sequence_no: 1, planned_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              captures: { mwx: $.data.id }
            - call: "POST /api/construction-milestones/${mwx}/submit-evidence"
              payload: { evidence_uri: "s3://ev/x-work-1", work_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${mwx}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${py}/construction-milestones"
              payload: { milestone_type: "CONTINUOUS_WORK", sequence_no: 1, planned_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              captures: { mwy: $.data.id }
            - call: "POST /api/construction-milestones/${mwy}/submit-evidence"
              payload: { evidence_uri: "s3://ev/y-work-1", work_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${mwy}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2030-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/tax-credit-qualifications/${tcqx}/transitions"
              payload: { to: "CONTINUITY_MAINTAINED" }
              as: TaxCounsel
            - call: "POST /api/tax-credit-qualifications/${tcqy}/transitions"
              payload: { to: "CONTINUITY_MAINTAINED" }
              as: TaxCounsel
              captures: { tcqy_err: $.data.error_id }
          assert:
            - "TaxCreditQualification.${tcqx}.status == CONTINUITY_MAINTAINED (FOUR_YEAR_SAFE_HARBOR: 2030-06-01 <= 2026-12-01 + 1461 days)"
            - "Second trigger fails: ${tcqy_err} == ERR_CONTINUITY_LAPSED (FACTS_AND_CIRCUMSTANCES: gap 2027-06-01 -> 2030-06-01 = 1096 days > 365)"
            - "TaxCreditQualification.${tcqy}.status == CONTINUITY_LAPSED and .lapse_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: itc_rate_combinatorial_adders_mode_a
        grounds:
          - calculations.itc_credit_amount
          - state_machines.TaxCreditQualification.CONTINUITY_MAINTAINED_to_QUALIFIED
          - entities.Project.fields.domestic_content_certified
          - entities.SupplyAgreement.fields.domestic_content_certified
        distinguishing_aspect: |
          Mode (a): the ITC rate is a 3-input conditional formula (base 30.00,
          +10.00 gated on project flag AND existence of a certified non-terminal
          supply agreement, +10.00 on the energy-community flag) applied to a
          state-filtered eligible basis — all three branches engaged yields
          exactly 50.00% and 5,000,000.00 on a 10,000,000.00 basis.
        test_recipe:
          setup:
            - "Project P: domestic_content_certified=true, energy_community_eligible=true; one EXECUTED supply agreement with domestic_content_certified=true; one SAFE_HARBOR_QUALIFIED order of 10,000,000.00"
            - "Project driven to COMMISSIONING; COD milestone certified -> cascade qualifies the TCQ"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Adder Farm", technology: "SOLAR", target_capacity_mw: 200, resource_class: "A", energy_community_eligible: true, domestic_content_certified: true }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-A1", instrument_type: "LAND_OPTION", start_date: "2026-09-01T00:00:00Z", end_date: "2028-09-01T00:00:00Z", exercise_price_usd: 100000 }
              as: DeveloperAdmin
              captures: { sc: $.data.id }
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXERCISED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "SITE_SECURED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-A", requested_capacity_mw: 200 }
              as: OriginationManager
              captures: { ir: $.data.id }
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "DEVELOPMENT" }
              as: DeveloperAdmin
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "FEASIBILITY_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "FEASIBILITY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: OriginationManager
              captures: { st1: $.data.id }
            - call: "POST /api/interconnection-studies/${st1}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st1}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st1}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "SYSTEM_IMPACT_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "SYSTEM_IMPACT", window_start: "2026-11-06T00:00:00Z", window_end: "2026-12-15T00:00:00Z" }
              as: OriginationManager
              captures: { st2: $.data.id }
            - call: "POST /api/interconnection-studies/${st2}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st2}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st2}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/allocate-upgrade-costs"
              payload: { total_upgrade_cost_usd: 900000 }
              as: PlatformAdmin
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "FACILITIES_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "FACILITIES", window_start: "2027-01-05T00:00:00Z", window_end: "2027-02-15T00:00:00Z" }
              as: OriginationManager
              captures: { st3: $.data.id }
            - call: "POST /api/interconnection-studies/${st3}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st3}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st3}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "AGREEMENT_EXECUTED" }
              as: OriginationManager
            - call: "GET /api/projects/${p}"
              as: DeveloperAdmin
              captures: { pv: $.data.version }
            - call: "POST /api/projects/${p}/offtake-agreements"
              payload: { buyer_type: "UTILITY", base_price_usd_mwh: 45.00, escalator_pct: 2.0, term_years: 20, delivery_start_date: "2028-01-01T00:00:00Z", expected_project_version: "${pv}" }
              as: OriginationManager
              captures: { oa: $.data.id }
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EXECUTED" }
              as: OriginationManager
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EFFECTIVE" }
              as: OriginationManager
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "FirstSolar", total_contract_usd: 12000000, domestic_content_certified: true }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 10000000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 10000000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 500000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "GET /api/projects/${p}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcq: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FOUR_YEAR_SAFE_HARBOR" }
              as: TaxCounsel
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "CONTINUITY_MAINTAINED" }
              as: TaxCounsel
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "READY_FOR_CONSTRUCTION" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "UNDER_CONSTRUCTION" }
              as: DeveloperAdmin

            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "FOUNDATION", sequence_no: 1, planned_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m1: $.data.id }
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/m1", work_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m1}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "ERECTION", sequence_no: 2, planned_date: "2027-05-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m2: $.data.id }
            - call: "POST /api/construction-milestones/${m2}/submit-evidence"
              payload: { evidence_uri: "s3://ev/m2", work_date: "2027-05-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m2}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "ENERGIZATION", sequence_no: 3, planned_date: "2027-07-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m3: $.data.id }
            - call: "POST /api/construction-milestones/${m3}/submit-evidence"
              payload: { evidence_uri: "s3://ev/m3", work_date: "2027-07-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m3}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "SUBSTANTIAL_COMPLETION", sequence_no: 4, planned_date: "2027-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m4: $.data.id }
            - call: "POST /api/construction-milestones/${m4}/submit-evidence"
              payload: { evidence_uri: "s3://ev/m4", work_date: "2027-09-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m4}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "COMMISSIONING" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "COMMERCIAL_OPERATION", sequence_no: 5, planned_date: "2027-11-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m5: $.data.id }
            - call: "POST /api/construction-milestones/${m5}/submit-evidence"
              payload: { evidence_uri: "s3://ev/m5", work_date: "2027-11-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
          trigger:
            - call: "POST /api/construction-milestones/${m5}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
          assert:
            - "TaxCreditQualification.${tcq}.status == QUALIFIED"
            - "TaxCreditQualification.${tcq}.credit_rate_pct == 50.00 (30.00 base + 10.00 domestic + 10.00 energy community)"
            - "TaxCreditQualification.${tcq}.qualified_credit_usd == 5000000.00"
            - "Project.${p}.total_itc_credits_usd == 5000000.00"
            - "Project.${p}.status == COMMERCIAL_OPERATION"

      - name: waterfall_per_tier_rounding_mode_b
        grounds:
          - calculations.waterfall_distribution
          - entities.PartnershipLedgerEntry.fields.amount_usd
          - endpoints: "POST /api/tax-equity-partnerships/{partnership_id}/distributions"
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — the investor tier is
          rounded first (round_half_up) and the developer tier absorbs the
          remainder; at amount 100,000.01 pre-flip the investor takes 99,000.01
          (not 99,000.00) and the developer exactly 1,000.00, which the opposite
          rounding order would reverse.
        test_recipe:
          setup:
            - "Project at COD with qualified credit 5,000,000.00 (same chain as itc_rate_combinatorial_adders_mode_a)"
            - "Partnership: commitment 1,000,000.00, target IRR 8.0; COMMITMENT_EXECUTED; fully funded (1 x 1,000,000.00); auto PRE_FLIP_OPERATING at COD"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Waterfall Farm", technology: "SOLAR", target_capacity_mw: 200, resource_class: "A", energy_community_eligible: true, domestic_content_certified: true }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-B1", instrument_type: "EASEMENT", start_date: "2026-09-01T00:00:00Z", end_date: "2046-09-01T00:00:00Z", exercise_price_usd: 50000 }
              as: DeveloperAdmin
              captures: { sc: $.data.id }
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXERCISED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
