          - endpoints.GET_/pharmacy/adherence-events/{id}
        distinguishing_aspect: "AdherenceEvent declares common_fields false: it carries only id and created_at, has no version or updated_at, and §1.5 exposes no route that mutates one."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient with one prescription; cycle C1 [2026-08-15, 2026-09-12) adjudicated so dose events can reference it"
            - "the clock is moved to 2026-08-16T08:00:00Z before the events are reported"
          setup_api_calls:
