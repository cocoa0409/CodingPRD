        distinguishing_aspect: "SEND/FAIL/REQUEUE can cycle until attempt_count reaches 3, at which point REQUEUE returns ERR_NOTIFICATION_ATTEMPTS_EXHAUSTED and ABANDON is the only way out, landing the notification in UNDELIVERABLE."
