# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2151_implant_device_udi_tracking
#
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1-§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert. Section names and
# claim_type values come from references/claim-extraction-guide.md.
# Actor ids follow the §1.8 convention (rt-/il-/cc-/co-/ri- prefixes).
# The literal 00000000-0000-4000-8000-0000000000ff is a well-formed UUID that
# is never minted by the server and is used for every not-found probe.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: vendor_creation_returns_declared_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.Vendor.fields.standing
          - entities.Vendor.fields.open_consignment_liability_cents
          - entities.Vendor.fields.recall_open_count
          - endpoints[POST /udi/vendors]
        distinguishing_aspect: "A brand-new Vendor comes back with standing ACTIVE, open_consignment_liability_cents 0, recall_open_count 0, version 1 and a bare UUID id carrying no type prefix."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
          trigger:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Vendor.${vendor_id}.standing == ACTIVE"
            - "Vendor.${vendor_id}.open_consignment_liability_cents == 0"
            - "Vendor.${vendor_id}.recall_open_count == 0"
            - "Vendor.${vendor_id}.version == 1"
            - "response body has meta.api_request_id and meta.api_request_timestamp and response_type == object"
            - "Vendor.${vendor_id}.id matches the bare UUID form with no prefix such as ven_"

      - name: catalog_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /udi/catalog-items]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting list_charge_cents, a required input with no default, is rejected with ERR_INVALID_REQUEST (400) and no CatalogItem row is created."
        test_recipe:
          setup: ["One Vendor exists."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /udi/catalog-items?vendor_id=${vendor_id} returns total_count == 0"

      - name: catalog_item_registry_required_and_patient_consent_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.CatalogItem.fields.registry_required
          - entities.Patient.fields.registry_consent
          - entities.CatalogItem.fields.on_hand_available_qty
        distinguishing_aspect: "Omitting registry_required yields false and omitting registry_consent yields UNKNOWN; on_hand_available_qty starts at 0."
        test_recipe:
          setup: ["One Vendor exists."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
          assert:
            - "CatalogItem.${cat_id}.registry_required == false"
            - "CatalogItem.${cat_id}.on_hand_available_qty == 0"
            - "Patient.${pat_id}.registry_consent == UNKNOWN"
            - "Patient.${pat_id}.implant_count == 0"

      - name: patient_invalid_enum_registry_consent_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.registry_consent
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "registry_consent MAYBE is not a declared member of {GRANTED, DECLINED, UNKNOWN} and is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CircClinician
              as_user_id: "cc-01"
          trigger:
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "MAYBE" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: surgical_case_end_not_after_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.SurgicalCase.fields.scheduled_end_utc
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "scheduled_end_utc equal to scheduled_start_utc violates the strictly-after constraint and is rejected before any overlap rule runs."
        test_recipe:
          setup: ["One Patient exists."]
          setup_api_calls:
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
          trigger:
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T08:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /udi/surgical-cases?patient_id=${pat_id} returns total_count == 0"

      - name: reservation_with_both_selector_fields_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints[POST /udi/surgical-cases/{case_id}/reservations]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Supplying BOTH catalog_item_id and device_unit_id on a reservation violates the exactly-one rule and is rejected with ERR_INVALID_REQUEST before the FEFO selector runs."
        test_recipe:
          setup:
            - "One released lot with one AVAILABLE owned unit and one SCHEDULED case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /udi/surgical-cases/${case_id}/reservations"
              payload: { catalog_item_id: "${cat_id}", device_unit_id: "${u1_id}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "DeviceUnit.${u1_id}.custody_state == AVAILABLE"

      - name: device_unit_computed_and_system_fields_are_not_client_settable
        claim_type: System Fields
        grounds:
          - entities.DeviceUnit.fields.custody_state
          - entities.DeviceUnit.fields.udi_di_snapshot
          - entities.DeviceUnit.fields.ownership
          - endpoints[POST /udi/lots/{lot_id}/device-units]
        distinguishing_aspect: "A payload key custody_state is not in the endpoint's declared input list and is rejected with ERR_INVALID_REQUEST; the legitimate creation stamps udi_di_snapshot from the catalog and ownership OWNED because no agreement was supplied."
        test_recipe:
          setup: ["One catalog item with device_identifier 00812345678905 and one QUARANTINE lot."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v}", custody_state: "AVAILABLE" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "DeviceUnit.${u1_id}.custody_state == QUARANTINED"
            - "DeviceUnit.${u1_id}.billing_state == NOT_BILLABLE"
            - "DeviceUnit.${u1_id}.ownership == OWNED"
            - "DeviceUnit.${u1_id}.udi_di_snapshot == 00812345678905"
            - "DeviceUnit.${u1_id}.contract_price_cents == null"
            - "Lot.${lot_id}.received_qty == 1 and Lot.${lot_id}.on_hand_qty == 1"

      - name: device_unit_self_reference_replaced_unit_id_is_reverse_reachable
        claim_type: Parent Relationships
        grounds:
          - entities.DeviceUnit.fields.replaced_unit_id
          - endpoints[GET /udi/device-units]
        distinguishing_aspect: "The self-referential FK DeviceUnit.replaced_unit_id -> DeviceUnit.id is discoverable: GET /udi/device-units?replaced_unit_id=<first unit> returns exactly the replacement unit."
        test_recipe:
          setup: ["One QUARANTINE lot holding one unit SN-0001."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v1: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v1}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "GET /udi/lots/${lot_id}"
              payload: {}
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_v2: "$.data.version" }
          trigger:
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0002", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v2}", replaced_unit_id: "${u1_id}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u2_id: "$.data.id" }
            - call: "GET /udi/device-units"
              payload: { replaced_unit_id: "${u1_id}" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { found_id: "$.data[0].id" }
          assert:
            - "DeviceUnit.${u2_id}.replaced_unit_id == ${u1_id}"
            - "GET /udi/device-units?replaced_unit_id=${u1_id} returns total_count == 1 and data[0].id == ${u2_id}"
            - "GET /udi/device-units?lot_id=${lot_id} returns total_count == 2"

      - name: patient_list_pagination_limit_offset_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /udi/patients]
          - response_envelope.pagination_fields
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "With three patients, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; limit 0 and limit 101 are both rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Three patients MRN-1001, MRN-1002, MRN-1003."]
          setup_api_calls:
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { p1: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1002", display_name: "Pat Two", registry_consent: "DECLINED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { p2: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1003", display_name: "Pat Three", registry_consent: "UNKNOWN" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { p3: "$.data.id" }
          trigger:
            - call: "GET /udi/patients"
              payload: { limit: 2, offset: 0 }
              as: CircClinician
              as_user_id: "cc-01"
            - call: "GET /udi/patients"
              payload: { limit: 2, offset: 2 }
              as: CircClinician
              as_user_id: "cc-01"
            - call: "GET /udi/patients"
              payload: { registry_consent: "DECLINED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { only_id: "$.data[0].id" }
            - call: "GET /udi/patients"
              payload: { limit: 101 }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "First call: total_count == 3, has_more == true, 2 rows returned, response_type == array"
            - "Second call: total_count == 3, has_more == false, 1 row returned"
            - "Third call: total_count == 1 and data[0].id == ${p2}"
            - "Fourth call: HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: implant_record_list_by_patient_id_is_the_recall_lookup_surface
        claim_type: Listing
        grounds:
          - endpoints[GET /udi/implant-records]
          - entities.ImplantRecord.fields.patient_id
          - entities.Patient.fields.implant_count
        distinguishing_aspect: "Filtering implant records by patient_id answers 'what is implanted in this patient' and its total_count matches Patient.implant_count of 1."
        test_recipe:
          setup: ["One released lot with one owned unit implanted into an IN_PROGRESS case for patient P1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678905", udi_pi_serial: "SN-0001", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
          trigger:
            - call: "GET /udi/implant-records"
              payload: { patient_id: "${pat_id}" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { found_id: "$.data[0].id" }
            - call: "GET /udi/implant-records"
              payload: { device_unit_id: "${u1_id}" }
              as: ComplianceOfficer
              as_user_id: "co-01"
          assert:
            - "GET /udi/implant-records?patient_id=${pat_id} returns total_count == 1 and data[0].id == ${ir1_id}"
            - "GET /udi/implant-records?device_unit_id=${u1_id} returns total_count == 1"
            - "Patient.${pat_id}.implant_count == 1"
            - "ImplantRecord.${ir1_id}.patient_id == ${pat_id} (copied from the case when omitted)"
            - "ImplantRecord.${ir1_id}.documented_by_user_id == cc-01 and verified_by_user_id == null"
            - "SurgicalCase.${case_id}.implant_record_count == 1"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: verify_an_already_verified_record_returns_invalid_record_state
        claim_type: Idempotency
        grounds:
          - state_machines.ImplantRecord.DOCUMENTED_to_VERIFIED
          - validations[priority=8]
          - errors[ERR_INVALID_RECORD_STATE]
        distinguishing_aspect: "VERIFIED is not a declared `from:` state of the verify transition, so a second verify by a third user is rejected with ERR_INVALID_RECORD_STATE (409) and verified_by_user_id keeps its first value."
        test_recipe:
          setup: ["One implant record documented by cc-01 and already VERIFIED by cc-02."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
