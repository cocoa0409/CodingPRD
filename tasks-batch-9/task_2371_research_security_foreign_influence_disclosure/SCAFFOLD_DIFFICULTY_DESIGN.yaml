            - "trigger call 5 returns 409 ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS with the grant still REQUESTED"
            - "after trigger call 8, Disclosure.${d_id}.plan_status == PLAN_ACKNOWLEDGED, Investigator.${inv_id}.risk_score == 40 and disclosure_posture == REVIEW_REQUIRED"
