  - section: errors
    instances:
      - name: the_not_found_family_names_the_entity_and_the_path_is_resolved_before_the_body
        claim_type: error_triggerable
        grounds:
          - validations.p3
          - validations.p4
          - validations.p5
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_DEALER_ORDER_NOT_FOUND
          - errors.ERR_INSTALLATION_CREW_NOT_FOUND
          - errors.ERR_BIN_DESIGN_NOT_FOUND
          - errors.ERR_FREIGHT_LOAD_NOT_FOUND
          - errors.ERR_CONFIG_NOT_FOUND
        distinguishing_aspect: "One endpoint carries an unknown id in the path AND an unknown id in the body at once, so the answer discriminates priority 4 from priority 5: it must be ERR_DEALER_ORDER_NOT_FOUND, never ERR_INSTALLATION_CREW_NOT_FOUND. Adding a missing required field to that same doubly-unknown request pushes the answer up to HTTP 400 ERR_INVALID_REQUEST, which pins priority 3 above both lookups. The 404 vocabulary is then shown to be per-entity for the business entities and deliberately shared for configuration: an unknown CoatingSpec and an unknown GrainProfile both answer ERR_CONFIG_NOT_FOUND while an unknown BinDesign and an unknown FreightLoad answer their own ids, so a single generic ERR_NOT_FOUND fails and so does inventing ERR_GRAIN_PROFILE_NOT_FOUND."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha."
            - "BinDesign D1 and one DRAFT order O1 on it, plus a T3 crew under Alpha - all real, so the only defect in each rejected call is the id under test."
