  # ===========================================================================
  # RULE 8 — Resource temporal overlap: half-open booking windows that skip
  #          cancelled rows vs closed-interval licenses where endpoints touch
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rebooking_into_an_overlapping_window_succeeds_because_the_cancelled_interval_is_excluded
        grounds:
          - validations[priority=25]
          - calculations.sailing_capacity_ledger
          - entities.FreightBooking.fields.effective_window_start
          - entities.FreightBooking.fields.effective_window_end
          - state_machines.FreightBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          The two sailings' occupation intervals genuinely intersect —
          [2026-08-15T00:00:00Z, 2026-08-19T00:00:00Z) for S4 against
          [2026-08-16T00:00:00Z, 2026-08-20T00:00:00Z) for S5 — yet the second booking must be
          ACCEPTED because the first booking is CANCELLED and priority 25 scans only rows with
          status IN {BOOKED, CONFIRMED, SHIPPED}; an implementation that keeps cancelled
          intervals in the overlap set returns ERR_BOOKING_WINDOW_OVERLAP here.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted); the clock stays at 2026-08-01, strictly before both cutoffs, so priority 23 passes and both sailings stay OPEN."
            - "ExportOrder FOB / ZONE_1 / USD, one line 40.000 @ 100.0000 with gross_weight_kg 400.000, submitted and screened NLR so it is COMPLIANCE_CLEARED and no license ledger is involved."
            - "VesselSailing S4: cutoff_at 2026-08-15T00:00:00Z, etd 2026-08-18T00:00:00Z, capacity 5000.000 -> derived booking window [2026-08-15T00:00:00Z, 2026-08-19T00:00:00Z) after DOC_BUFFER_HOURS 24."
            - "VesselSailing S5: cutoff_at 2026-08-16T00:00:00Z, etd 2026-08-19T00:00:00Z, capacity 5000.000 -> derived window [2026-08-16T00:00:00Z, 2026-08-20T00:00:00Z), which intersects S4's window on 08-16..08-19."
            - "The order is booked on S4 and that booking is then CANCELLED, which returns the order to COMPLIANCE_CLEARED so priority 11 permits a second booking."
            - "S5's version is captured at creation and is never bumped, so the second booking carries a current expected_vessel_sailing_version."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Hakata Bearing Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
