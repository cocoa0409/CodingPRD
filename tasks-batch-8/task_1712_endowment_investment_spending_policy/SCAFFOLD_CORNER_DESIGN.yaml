            - { call: "POST /endowment/funds", payload: { pool_id: "${pg_pool}", fund_code: "FA", fund_name: "A", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { pg_fa: $.data.id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${pg_pool}", fund_code: "FB", fund_name: "B", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${pg_pool}", fund_code: "FC", fund_name: "C", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer }
            - { call: "POST /endowment/donors", payload: { donor_name: "D PG", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { pg_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${pg_fa}", donor_id: "${pg_donor}", external_ref: "PG1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer }
            - { call: "POST /endowment/funds/${pg_fa}/activate", payload: {}, as: DevelopmentOfficer }
          trigger:
            - { call: "GET /endowment/funds?pool_id=${pg_pool}&limit=2&offset=0", as: DevelopmentOfficer, captures: { pg_first: $.data } }
            - { call: "GET /endowment/funds?pool_id=${pg_pool}&limit=2&offset=2", as: DevelopmentOfficer, captures: { pg_last: $.data } }
            - { call: "GET /endowment/funds?pool_id=${pg_pool}&fund_status=ACTIVE", as: DevelopmentOfficer, captures: { pg_active: $.data } }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true; page 2 (offset 2): 1 item, has_more == false"
            - "filter fund_status=ACTIVE: exactly 1 item with fund_code == FA"
            - "envelope contains meta.api_request_id and response_type == array on list calls"

      - name: bulk_upsert_replaces_the_allocation_set_atomically
        claim_type: bulk_action
        grounds: ["endpoints[POST /endowment/allocations/bulk_upsert]", entities.AssetClassAllocation]
        distinguishing_aspect: "The second bulk_upsert REPLACES the set: the omitted CASH row disappears and the surviving US_EQUITY row keeps its identity with an updated target."
        test_recipe:
          setup: ["one pool whose allocation set is {US_EQUITY 6000, CASH 4000}"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool BU", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { bu_pool: $.data.id } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${bu_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 6000, rebalance_band_bps: 500 }, { asset_class: CASH, target_pct_bps: 4000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin, captures: { bu_us: "$.data[0].id" } }
          trigger:
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${bu_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 250 } ] }, as: EndowmentAdmin }
            - { call: "GET /endowment/allocations?pool_id=${bu_pool}", as: EndowmentAdmin, captures: { bu_rows: $.data } }
          assert:
            - "after the second upsert exactly 1 allocation row exists for the pool (CASH removed)"
            - "the US_EQUITY row now shows target_pct_bps == 10000 and rebalance_band_bps == 250"

      - name: computed_fund_market_value_visible_on_read_after_finalize
        claim_type: computed_read
        grounds: [entities.Fund.fields.market_value_cents]
        excluded_because:
          difficulty_instance: underwater_flag_strict_less_than_equality_is_not_underwater
          rationale: "That §1.8 instance reads market_value_cents after two distinct finalizes (10000000 then 9999900), asserting the computed read each time."

  # ===================== Section: errors =====================
  - section: errors
    instances:
      - name: error_underwater_spending_blocked_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNDERWATER_SPENDING_BLOCKED]"]
        excluded_because:
          difficulty_instance: distribution_approve_gated_by_exception_state_distribution_exception_pair
          rationale: "The first approve in that instance captures error_id == ERR_UNDERWATER_SPENDING_BLOCKED."
      - name: error_purpose_mismatch_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_PURPOSE_MISMATCH]"]
        excluded_because:
          difficulty_instance: payout_purpose_mismatch_beats_allocation_cap_safety_over_fiscal
          rationale: "Asserted as the winning error of the safety-vs-fiscal dual-failure trigger."
      - name: error_window_conflict_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: policy_effective_year_windows_half_open_strictly_increasing
          rationale: "Both window semantics (policy equal-year, manager inclusive-interval) plus the §1.9 fiscal-year-range case exercise this error three times."
      - name: error_incomplete_fiscal_year_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCOMPLETE_FISCAL_YEAR]"]
        excluded_because:
          difficulty_instance: report_publish_gated_by_distribution_terminality_report_distribution_pair
          rationale: "The first publish attempt captures error_id == ERR_INCOMPLETE_FISCAL_YEAR."
      - name: error_invalid_state_transition_additional_surfaces
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE_TRANSITION]"]
        excluded_because:
          difficulty_instance: approve_projected_underwater_returns_409_state_over_422_safety
          rationale: "Beyond that §1.8 dual-failure instance, §1.9 covers the error on unitized-gift receive/rescind, double finalize, ENGAGED-manager terminate, and closed-payout report."

  # ===================== Section: rbac =====================
  - section: rbac
    instances:
      - name: role_denied_for_other_roles_exclusive_operations
        claim_type: role_permission
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ProgramManager cannot create pools (EndowmentAdmin-exclusive) and DevelopmentOfficer cannot finalize valuations (InvestmentOfficer-exclusive) — both 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one pool exists (only its captured version is needed; the finalize target id is deliberately nonexistent)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool RB", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { rb_pool: $.data.id, rb_pv: $.data.version } }
          trigger:
            - { call: "POST /endowment/pools", payload: { pool_name: "Nope", inception_fiscal_year: 2026 }, as: ProgramManager, captures: { rb_err1: $.data.error_id } }
            - { call: "POST /endowment/valuations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${rb_pv}" }, as: DevelopmentOfficer, captures: { rb_err2: $.data.error_id } }
          assert:
            - "both calls: http 403 ERR_FORBIDDEN_ROLE (the finalize denial fires before existence even with a random id — priority 2 over 5)"

      - name: segregation_of_duties_policy_adopter_must_differ_from_proposer
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", roles]
        distinguishing_aspect: "The same opaque user id holding InvestmentOfficer (propose) and BoardMember (adopt) powers cannot adopt its own policy; a different board user adopts successfully."
        test_recipe:
          setup: ["pool with one DRAFT policy proposed by user dual-1; pool version captured"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool SD", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { sd_pool: $.data.id, sd_pv: $.data.version } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${sd_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "dual-1", captures: { sd_pol: $.data.id } }
          trigger:
            - { call: "POST /endowment/policies/${sd_pol}/adopt", payload: { expected_pool_version: "${sd_pv}" }, as: BoardMember, as_user_id: "dual-1", captures: { sd_err: $.data.error_id } }
            - { call: "POST /endowment/policies/${sd_pol}/adopt", payload: { expected_pool_version: "${sd_pv}" }, as: BoardMember, as_user_id: "bm-9", captures: { sd_ok: $.data.policy_status } }
          assert:
            - "adopter == proposer (dual-1): http 403 ERR_SEGREGATION_OF_DUTIES_VIOLATION; policy stays DRAFT and pool.version is unchanged (so the retry below uses the same version)"
            - "adopter bm-9: policy_status == ADOPTED"

      - name: segregation_of_duties_distribution_approver_must_differ_from_proposer
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", state_machines.SpendingDistribution.PROPOSED_to_APPROVED]
        distinguishing_aspect: "The distribution's proposed_by_user_id is pinned at propose; the board approval by the same user id fails even though the role is correct."
        test_recipe:
          setup: ["pool with policy ADOPTED, engaged manager, ACTIVE fund FSD with 100000000000 micro-units after Q1; FY2026 distribution PROPOSED by user dev-1"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool DS", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { ds_pool: $.data.id, ds_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${ds_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${ds_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { ds_pol: $.data.id } }
            - { call: "POST /endowment/policies/${ds_pol}/adopt", payload: { expected_pool_version: "${ds_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${ds_pool}", manager_name: "M DS", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { ds_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${ds_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${ds_pool}", fund_code: "FSD", fund_name: "Fund DS", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { ds_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D DS", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { ds_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${ds_fund}", donor_id: "${ds_donor}", external_ref: "DS1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { ds_g: $.data.id } }
            - { call: "POST /endowment/funds/${ds_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${ds_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${ds_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${ds_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { ds_v1: $.data.id } }
            - { call: "GET /endowment/pools/${ds_pool}", as: InvestmentOfficer, captures: { ds_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${ds_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${ds_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${ds_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { ds_d: $.data.id } }
            - { call: "POST /endowment/distributions/${ds_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
          trigger:
            - { call: "POST /endowment/distributions/${ds_d}/approve", payload: {}, as: BoardMember, as_user_id: "dev-1", captures: { ds_err: $.data.error_id } }
            - { call: "POST /endowment/distributions/${ds_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { ds_ok: $.data.distribution_status } }
          assert:
            - "approve by dev-1 (the proposer, acting with a board role): http 403 ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "approve by bm-1: distribution_status == APPROVED"

      - name: segregation_of_duties_exception_endorser_must_differ_from_requester
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", state_machines.PolicyException.REQUESTED_to_ENDORSED]
        distinguishing_aspect: "The three-person rule's first link: the investment-office endorsement of an underwater exception cannot come from the requesting user id."
        test_recipe:
          setup: ["underwater arrangement (pool, policy, manager, ACTIVE fund FES with HGV 10000000, Q2 crash to price 40000); exception REQUESTED by user dev-1"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool ES", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { es_pool: $.data.id, es_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${es_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${es_pool}", manager_name: "M ES", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { es_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${es_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${es_pool}", fund_code: "FES", fund_name: "Fund ES", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { es_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D ES", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { es_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${es_fund}", donor_id: "${es_donor}", external_ref: "ES1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { es_g: $.data.id } }
            - { call: "POST /endowment/funds/${es_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${es_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${es_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${es_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { es_v1: $.data.id } }
            - { call: "GET /endowment/pools/${es_pool}", as: InvestmentOfficer, captures: { es_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${es_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${es_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${es_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 4000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${es_pool}", estimated_pool_market_value_cents: 4000000 }, as: InvestmentOfficer, captures: { es_v2: $.data.id } }
            - { call: "GET /endowment/pools/${es_pool}", as: InvestmentOfficer, captures: { es_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${es_v2}/finalize", payload: { final_pool_market_value_cents: 4000000, expected_pool_version: "${es_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/exceptions", payload: { fund_id: "${es_fund}", fiscal_year: 2026, requested_amount_cents: 300000, justification: "bridge" }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { es_ex: $.data.id } }
          trigger:
            - { call: "POST /endowment/exceptions/${es_ex}/endorse", payload: {}, as: InvestmentOfficer, as_user_id: "dev-1", captures: { es_err: $.data.error_id } }
            - { call: "POST /endowment/exceptions/${es_ex}/endorse", payload: {}, as: InvestmentOfficer, as_user_id: "io-2", captures: { es_ok: $.data.exception_status } }
          assert:
            - "endorse by dev-1 (the requester): http 403 ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "endorse by io-2: exception_status == ENDORSED"

  # ===================== Section: validations (auth + report drift gate) =====================
  - section: validations
    instances:
      - name: pool_create_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent without X-User-ID/X-User-Role fails priority 1 with the context-header error before any role, existence, or body check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endowment/pools", payload: { pool_name: "NoAuth", inception_fiscal_year: 2026 }, as: Anonymous, captures: { na_err: $.data.error_id } }
          assert:
            - "request omits both auth headers entirely: http 400 with error_id == ERR_MISSING_OR_INVALID_CONTEXT_HEADER (not 403, not 404)"

      - name: board_report_publish_blocked_until_drift_acknowledged
