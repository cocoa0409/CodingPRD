            - "at exactly +14 days the second call returns 200 and Agent.${alice_id}.status == TERMINATED"

      - name: existence_precedes_state_on_unknown_invoice_pay
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3_existence
          - validations.priority_4_state
        distinguishing_aspect: "Paying a non-existent invoice id with an overpaying amount surfaces 404 ERR_NOT_FOUND — existence (priority 3) precedes both state (priority 4) and fiscal (priority 10) checks."
