        distinguishing_aspect: "TreatmentPlan DRAFT->ACTIVE is gated by the Authorization state: activating while the auth is only SUBMITTED returns ERR_AUTH_NOT_APPROVED (TreatmentPlan depends on Authorization)."
        test_recipe:
          setup:
            - "Patient with FINALIZED eval, an authorization left in SUBMITTED (not approved), and a DRAFT plan referencing it."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cro One", mrn: "MRN-1" }
