# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# National Cemetery & Veteran Burial (Expert). Nine Difficulty Rules x >=2 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: entitlement_score_own_vs_sponsor_derived
        grounds:
          - calculations.entitlement_score
          - entities.BurialCase.fields.entitlement_score
          - state_machines.BurialCase.SUBMITTED_to_ELIGIBLE
        distinguishing_aspect: |
          The same weighted_scoring formula operates on two different entity subjects: a VETERAN
          case scores from its OWN service/discharge fields, while a DEPENDENT case scores its
          service/discharge terms from the SPONSOR case's fields — different source entities yield
          different scores (140 vs 80) for otherwise identical service history.
        test_recipe:
          setup:
            - "US cemetery; one VETERAN case with HONORABLE discharge and 3650 service_days approved -> entitlement_score=140."
            - "One DEPENDENT case whose reserving_case_id points at that veteran case, approved -> entitlement_score=80 (base 40 + sponsor service 30 + sponsor honorable 10)."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Riverside National", country_code: "US", honors_squad_capacity: 2 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650, died_on_active_duty: false }
              as: EligibilityOfficer
              captures: { vet_case_id: $.data.id }
            - call: "POST /registry/burial-cases/${vet_case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "DEPENDENT", requested_class: "STANDARD", reserving_case_id: "${vet_case_id}", service_days: 0 }
              as: EligibilityOfficer
              captures: { dep_case_id: $.data.id }
            - call: "POST /registry/burial-cases/${dep_case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
          trigger:
            - call: "GET /registry/burial-cases/${dep_case_id}"
              payload: {}
              as: EligibilityOfficer
          assert:
            - "BurialCase.${vet_case_id}.entitlement_score == 140"
            - "BurialCase.${dep_case_id}.entitlement_score == 80"
            - "BurialCase.${dep_case_id}.entitlement_score != BurialCase.${vet_case_id}.entitlement_score"

      - name: eligibility_decision_veteran_direct_vs_derived_dependent
        grounds:
          - calculations.eligibility_decision
          - entities.EligibilityDetermination.fields.basis
          - state_machines.BurialCase.SUBMITTED_to_INELIGIBLE
        distinguishing_aspect: |
          The eligibility calc runs on two different entity domains: a VETERAN case is adjudicated
          against its OWN discharge/service (OTHER_THAN_HONORABLE -> DENIED/DISCHARGE_BAR), whereas
          a DEPENDENT case ignores its own discharge entirely and is adjudicated solely against the
          SPONSOR case's status (sponsor INELIGIBLE -> DENIED/SPONSOR_NOT_ELIGIBLE).
        test_recipe:
          setup:
            - "US cemetery; a VETERAN case with OTHER_THAN_HONORABLE discharge -> DENIED, denial_reason=DISCHARGE_BAR, case INELIGIBLE."
            - "A DEPENDENT case sponsored by that now-INELIGIBLE veteran -> DENIED, denial_reason=SPONSOR_NOT_ELIGIBLE."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Cardinal National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "OTHER_THAN_HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { vet_case_id: $.data.id }
            - call: "POST /registry/burial-cases/${vet_case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { vet_det_decision: $.data.decision }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "DEPENDENT", requested_class: "STANDARD", reserving_case_id: "${vet_case_id}", character_of_discharge: "HONORABLE", service_days: 5000 }
              as: EligibilityOfficer
              captures: { dep_case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${dep_case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { dep_reason: $.data.denial_reason }
          assert:
            - "EligibilityDetermination for ${vet_case_id}: decision == DENIED and denial_reason == DISCHARGE_BAR"
            - "EligibilityDetermination for ${dep_case_id}: decision == DENIED and denial_reason == SPONSOR_NOT_ELIGIBLE"
            - "BurialCase.${dep_case_id}.status == INELIGIBLE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: marker_charge_sum_then_allowance_rounding_order
        grounds:
          - calculations.marker_charge
          - entities.MarkerOrder.fields.marker_charge_cents
          - state_machines.MarkerOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: the free allowance is subtracted from the SUMMED total
          once (sum-then-allowance), NOT per line; with lines [40,40,22]=102 chars + 15 emblem = 117,
          minus 60 allowance = 57 chargeable, ceil(57/10)=6 blocks * 250 = 1500 cents. Applying the
          allowance per line would zero out most lines and yield a different, smaller charge.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section with one STANDARD gravesite; a VETERAN case approved and assigned to that gravesite."
            - "A DRAFT MarkerOrder with three inscription lines of lengths 40,40,22 and an emblem_of_belief."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Granite National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/marker-orders"
              payload: { burial_case_id: "${case_id}", marker_type: "UPRIGHT_MARBLE", inscription_lines: ["JOHN QUINCY ADAMS PATRIOT VETERAN OF THE", "UNITED STATES ARMY SERVED WITH HONOR AND", "DEVOTION FOREVER REMEM"], emblem_of_belief: "CHRISTIAN_CROSS" }
              as: MarkerClerk
              captures: { mk_id: $.data.id }
          trigger:
            - call: "POST /registry/marker-orders/${mk_id}/submit"
              payload: {}
              as: MarkerClerk
          assert:
            - "MarkerOrder.${mk_id}.billable_characters == 57"
            - "MarkerOrder.${mk_id}.marker_charge_cents == 1500"
            - "MarkerOrder.${mk_id}.status == SUBMITTED"

      - name: entitlement_score_nonlinear_capped_multiterm
        grounds:
          - calculations.entitlement_score
          - entities.BurialCase.fields.entitlement_score
          - state_machines.BurialCase.SUBMITTED_to_ELIGIBLE
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: base + min(floor(days/365)*3, 30)
          + died-in-service-bonus + honorable-bonus, then clamp to 150. A veteran died_on_active_duty
          with only 400 service_days and GENERAL discharge yields 100 + min(3,30) + 25 + 0 = 128 — the
          service cap and the honorable-only discharge branch make it non-linear in each input.
        test_recipe:
          setup:
            - "US cemetery; a VETERAN case with died_on_active_duty=true, service_days=400, GENERAL discharge."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Freedom National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "GENERAL", service_days: 400, died_on_active_duty: true }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
          assert:
            - "BurialCase.${case_id}.status == ELIGIBLE"
            - "EligibilityDetermination for ${case_id}: basis == DIED_IN_SERVICE"
            - "BurialCase.${case_id}.entitlement_score == 128"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: burial_case_assign_release_revert_loop
        grounds:
          - state_machines.BurialCase.ELIGIBLE_to_ASSIGNED
          - state_machines.BurialCase.ASSIGNED_to_ELIGIBLE
          - entities.BurialCase.fields.status
        distinguishing_aspect: |
          BurialCase has a cyclic revert loop ELIGIBLE -> ASSIGNED -> ELIGIBLE: assign-plot reserves a
          gravesite then release-plot returns it to AVAILABLE and the case to ELIGIBLE — the same case
          re-enters ELIGIBLE, which a linear pipeline cannot do.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section with one STANDARD gravesite; a VETERAN case approved (ELIGIBLE)."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Loop National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/release-plot"
              payload: {}
              as: SchedulingClerk
          assert:
            - "BurialCase.${case_id}.status == ELIGIBLE"
            - "BurialCase.${case_id}.assigned_gravesite_id == null"
            - "Gravesite.${grv_id}.status == AVAILABLE"

      - name: interment_schedule_cancel_reverts_case_branch
        grounds:
          - state_machines.IntermentSchedule.SCHEDULED_to_CANCELLED
          - state_machines.BurialCase.SCHEDULED_to_ASSIGNED
          - state_machines.MilitaryHonors.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          IntermentSchedule forks SCHEDULED -> {COMPLETED, CANCELLED} with divergent side-effect sets:
          the CANCELLED branch reverts the BurialCase SCHEDULED -> ASSIGNED and cascades linked
          MilitaryHonors to CANCELLED, whereas the COMPLETED branch drives the case to INTERRED — a
          branching fork-join on a different entity than the BurialCase revert loop.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section + STANDARD gravesite; VETERAN case approved, assigned, scheduled; honors REQUESTED then CONFIRMED on that schedule."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Branch National", country_code: "US", honors_squad_capacity: 3 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_id}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: SchedulingClerk
              captures: { sched_id: $.data.id }
            - call: "POST /registry/military-honors"
              payload: { interment_schedule_id: "${sched_id}", detail_size: "FULL_SQUAD" }
              as: HonorsCoordinator
              captures: { hon_id: $.data.id }
            - call: "POST /registry/military-honors/${hon_id}/confirm"
              payload: {}
              as: HonorsCoordinator
          trigger:
            - call: "POST /registry/interment-schedules/${sched_id}/cancel"
              payload: {}
              as: SchedulingClerk
          assert:
            - "IntermentSchedule.${sched_id}.status == CANCELLED"
            - "BurialCase.${case_id}.status == ASSIGNED"
            - "MilitaryHonors.${hon_id}.status == CANCELLED"
            - "MilitaryHonors.${hon_id}.flag_issued == false"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_interment_cascade_depth3
        grounds:
          - state_machines.IntermentSchedule.SCHEDULED_to_COMPLETED
          - state_machines.BurialCase.SCHEDULED_to_INTERRED
          - state_machines.MilitaryHonors.CONFIRMED_to_RENDERED
          - calculations.section_inventory
        distinguishing_aspect: |
          Depth-3 chain from a single complete trigger: (1) IntermentSchedule SCHEDULED -> COMPLETED
          causes (2) the Gravesite interment_count to reach depth_capacity so RESERVED -> OCCUPIED,
          which in turn (3) forces Section.interred_units recomputation; independently the completion
          also cascades the CONFIRMED honors -> RENDERED. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section + single-depth STANDARD gravesite; VETERAN case approved, assigned, scheduled; honors CONFIRMED."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Cascade National", country_code: "US", honors_squad_capacity: 3 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_id}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: SchedulingClerk
              captures: { sched_id: $.data.id }
            - call: "POST /registry/military-honors"
              payload: { interment_schedule_id: "${sched_id}", detail_size: "FULL_SQUAD" }
              as: HonorsCoordinator
              captures: { hon_id: $.data.id }
            - call: "POST /registry/military-honors/${hon_id}/confirm"
              payload: {}
              as: HonorsCoordinator
          trigger:
            - call: "POST /registry/interment-schedules/${sched_id}/complete"
              payload: {}
              as: SchedulingClerk
          assert:
            - "IntermentSchedule.${sched_id}.status == COMPLETED"
            - "BurialCase.${case_id}.status == INTERRED"
            - "Gravesite.${grv_id}.interment_count == 1"
            - "Gravesite.${grv_id}.status == OCCUPIED"
            - "Section.${sec_id}.interred_units == 1"
            - "Section.${sec_id}.available_units == 0"
            - "MilitaryHonors.${hon_id}.status == RENDERED"

      - name: expire_sweep_release_cascade_depth2
        grounds:
          - state_machines.PreNeedDetermination.APPROVED_to_EXPIRED
          - state_machines.Gravesite
          - calculations.section_inventory
        distinguishing_aspect: |
          Depth-2 chain from a distinct trigger (expire-sweep, not complete): expiring an APPROVED PMC
          whose case is ASSIGNED-but-not-INTERRED releases the reserved Gravesite RESERVED -> AVAILABLE,
          which then forces Section.available_units recomputation. Originates from a different transition
          than the complete-interment cascade.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section + STANDARD gravesite; PRE_NEED VETERAN case approved with an APPROVED PMC (expires 2027-05-01). Plot assigned so the gravesite is RESERVED and the PMC stays APPROVED (only interment COMPLETE would move it to RESERVED)."
            - "Clock advanced to 2027-06-01 (past expires_on) with the case still only ASSIGNED (never scheduled/completed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NCA_Admin
            - call: "POST /registry/cemeteries"
              payload: { name: "Preneed National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "PRE_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/pre-need-determinations"
              payload: { burial_case_id: "${case_id}" }
              as: EligibilityOfficer
              captures: { pmc_id: $.data.id, pmc_v0: $.data.version }
            - call: "POST /registry/pre-need-determinations/${pmc_id}/approve"
              payload: { expected_pmc_version: "${pmc_v0}" }
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: NCA_Admin
          trigger:
            - call: "POST /registry/pre-need-determinations/${pmc_id}/expire-sweep"
              payload: {}
              as: NCA_Admin
          assert:
            - "PreNeedDetermination.${pmc_id}.status == EXPIRED"
            - "Gravesite.${grv_id}.status == AVAILABLE"
            - "BurialCase.${case_id}.status == ELIGIBLE"
            - "Section.${sec_id}.available_units == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_temporal_on_interment_schedule
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.BurialCase.ASSIGNED_to_SCHEDULED
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_temporal (priority 8): a schedule request
          on a case that is only ELIGIBLE (not ASSIGNED) AND whose requested window would conflict on
          the gravesite must return ERR_INVALID_STATE (state wins), not ERR_GRAVESITE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section + STANDARD gravesite. Case X approved, assigned, scheduled 2026-06-10T10:00..12:00 (occupies the plot window)."
            - "Case Y approved but only ELIGIBLE (never assigned)."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Prio National", country_code: "US", honors_squad_capacity: 2 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 2 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_x: $.data.id }
            - call: "POST /registry/burial-cases/${case_x}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_x}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_x}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: SchedulingClerk
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_y: $.data.id }
            - call: "POST /registry/burial-cases/${case_y}/eligibility"
              payload: {}
              as: EligibilityOfficer
          trigger:
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_y}", window_start: "2026-06-10T10:30:00Z", window_end: "2026-06-10T11:30:00Z" }
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
