# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml -- task_2735 Lateral Partner Hiring & Portable
# Business Diligence
# SKILL.md §1.9 -- the BREADTH probe over §1.1-§1.7. §1.8 (SCAFFOLD_DIFFICULTY_
# DESIGN.yaml) is the depth probe; every corner it already exercises is emitted
# here as an `excluded_because:` stub that cites the covering instance by name.
# Section names and claim_type values come from
# references/claim-extraction-guide.md and nothing else.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: candidate_creation_initializes_both_status_dimensions
        claim_type: creation
        grounds:
          - endpoints[POST /lateral-hiring/candidates]
          - state_machines.Candidate.null_to_SOURCED
          - entities.Candidate.fields.pipeline_status
          - entities.Candidate.fields.clearance_status
          - entities.Candidate.fields.open_offer_id
        distinguishing_aspect: |
          A Candidate row carries TWO independent state fields, so 'created correctly'
          means both dimensions are seeded: pipeline_status == SOURCED (the pipeline
          machine's initial_state) AND clearance_status == NOT_STARTED (the clearance
          machine's initial_state). Every date field the hire cascade later fills
          (resignation_date, earliest_start_date, hire_date) and open_offer_id must be
          null at creation, and the row starts at version 1.
        test_recipe:
          setup:
            - "Empty DB except one OPEN PracticeGroup, one SearchFirm and one ACTIVE SearchFirmEngagement linking them."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is 'object'"
            - "Candidate.${cand_id}.pipeline_status == SOURCED"
            - "Candidate.${cand_id}.clearance_status == NOT_STARTED"
            - "Candidate.${cand_id}.resignation_date == null"
            - "Candidate.${cand_id}.earliest_start_date == null"
            - "Candidate.${cand_id}.hire_date == null"
            - "Candidate.${cand_id}.open_offer_id == null"
            - "Candidate.${cand_id}.notice_period_days == 45"
            - "Candidate.${cand_id}.non_solicit_days == 30"
            - "Candidate.${cand_id}.version == 1"

      - name: practice_group_read_returns_the_initialized_guarantee_ledger
        claim_type: retrieval
        grounds:
          - endpoints[GET /lateral-hiring/practice-groups/{practice_group_id}]
          - entities.PracticeGroup.fields.available_guarantee_budget_usd
          - entities.PracticeGroup.fields.reserved_guarantee_budget_usd
          - entities.PracticeGroup.fields.committed_guarantee_total_usd
          - entities.PracticeGroup.fields.active_onboarding_count
          - calculations.guarantee_budget_ledger
        distinguishing_aspect: |
          The read must surface all four ledger fields, not just the input total: with
          no offers anywhere in the system available == total == 5000000.00, reserved ==
          0.00, committed == 0.00 and active_onboarding_count == 0. A read that echoes
          only guarantee_budget_total_usd fails this instance.
        test_recipe:
          setup:
            - "One PracticeGroup created with guarantee_budget_total_usd 5000000.00, onboarding_capacity 2, leverage_ratio 3.20, target_standard_rate_usd 950.00. No candidates, offers or plans exist."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
          trigger:
            - call: "GET /lateral-hiring/practice-groups/${pg_id}"
              payload: {}
              as: SystemAdmin
              captures: { pg_status: $.data.status, pg_total: $.data.guarantee_budget_total_usd, pg_avail: $.data.available_guarantee_budget_usd, pg_resv: $.data.reserved_guarantee_budget_usd, pg_comm: $.data.committed_guarantee_total_usd, pg_onb: $.data.active_onboarding_count }
          assert:
            - "the response status is 200"
            - "${pg_status} == OPEN"
            - "${pg_total} == 5000000.00"
            - "${pg_avail} == 5000000.00"
            - "${pg_resv} == 0.00"
            - "${pg_comm} == 0.00"
            - "${pg_onb} == 0"
            - "PracticeGroup.${pg_id}.onboarding_capacity == 2"
            - "PracticeGroup.${pg_id}.leverage_ratio == 3.20"
            - "PracticeGroup.${pg_id}.target_standard_rate_usd == 950.00"

      - name: client_book_entry_listing_paginates_and_filters_by_questionnaire
        claim_type: listing
        grounds:
          - endpoints[GET /lateral-hiring/client-book-entries]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.ClientBookEntry.fields.questionnaire_id
          - entities.ClientBookEntry.fields.status
        distinguishing_aspect: |
          Three ACTIVE entries on one questionnaire are paged at limit 2: page one
          returns exactly 2 rows with total_count 3 and has_more true, page two
          (offset 2) returns exactly 1 row with total_count 3 and has_more false. The
          total_count is the FILTERED count, so it stays 3 on both pages and does not
          shrink to the page size.
        test_recipe:
          setup:
            - "One Candidate in DILIGENCE whose LateralQuestionnaire is DRAFT."
            - "Three ACTIVE ClientBookEntry rows on that questionnaire: 'Northwind Holdings', 'Calder Manufacturing' and 'Ridgeline Foods'."
            - "No ClientBookEntry rows exist on any other questionnaire."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/questionnaires"
              payload: { declared_prior_year_billings_usd: 3000000.00, declared_prior_year_collections_usd: 2600000.00, declared_realization_rate: 0.8700, primary_matter_types: ["M_AND_A", "LITIGATION", "TAX"] }
              as: RecruitingCoordinator
              captures: { lpq_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Northwind Holdings", relationship_role: "BILLING_ATTORNEY", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 1600000.00, claimed_portability_pct: 0.8000, claimed_realization_rate: 1.0000, matter_types: ["M_AND_A", "SECURITIES"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_a_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Calder Manufacturing", relationship_role: "RELATIONSHIP_PARTNER", client_consent_status: "CONSENT_PENDING", claimed_annual_billings_usd: 900000.00, claimed_portability_pct: 0.7000, claimed_realization_rate: 0.8800, matter_types: ["LITIGATION", "EMPLOYMENT"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_b_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Ridgeline Foods", relationship_role: "SERVICE_PARTNER", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 500000.00, claimed_portability_pct: 0.8200, claimed_realization_rate: 0.9900, matter_types: ["TAX"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_c_id: $.data.id }
          trigger:
            - call: "GET /lateral-hiring/client-book-entries"
              payload: { questionnaire_id: "${lpq_id}", status: "ACTIVE", limit: 2, offset: 0 }
              as: RecruitingCoordinator
              captures: { p1_total: "$.meta.total_count", p1_more: "$.meta.has_more", p1_limit: "$.meta.limit", p1_offset: "$.meta.offset" }
            - call: "GET /lateral-hiring/client-book-entries"
              payload: { questionnaire_id: "${lpq_id}", status: "ACTIVE", limit: 2, offset: 2 }
              as: RecruitingCoordinator
              captures: { p2_total: "$.meta.total_count", p2_more: "$.meta.has_more", p2_offset: "$.meta.offset" }
          assert:
            - "both responses have status 200 and response_type 'array'"
            - "page one returns exactly 2 ClientBookEntry rows"
            - "${p1_total} == 3"
            - "${p1_more} == true"
            - "${p1_limit} == 2"
            - "${p1_offset} == 0"
            - "page two returns exactly 1 ClientBookEntry row"
            - "${p2_total} == 3"
            - "${p2_more} == false"
            - "${p2_offset} == 2"
            - "LateralQuestionnaire.${lpq_id}.entry_count == 3"

      - name: candidate_read_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /lateral-hiring/candidates/{candidate_id}]
          - errors[ERR_CANDIDATE_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no Candidate row returns
          ERR_CANDIDATE_NOT_FOUND with HTTP 404 and the error envelope
          (response_type 'error'), never an empty 200 object and never a 400.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one SearchFirm, one ACTIVE SearchFirmEngagement and one real Candidate exist, so the collection is non-empty."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
          trigger:
            - call: "GET /lateral-hiring/candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecruitingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "${err} == ERR_CANDIDATE_NOT_FOUND"
            - "response_type == 'error'"
            - "Candidate.${cand_id} is unaffected and still has pipeline_status APPROACHED"

      - name: candidate_create_without_notice_period_days_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /lateral-hiring/candidates]
          - entities.Candidate.fields.notice_period_days
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          notice_period_days is declared `source: input` with NO default, so omitting
          it is ERR_INVALID_REQUEST (400) and no Candidate row is created — it must not
          silently default to 0, which would make earliest_start_date collapse onto
          resignation_date at hire time.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one SearchFirm and one ACTIVE SearchFirmEngagement exist. No Candidate rows exist."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, non_solicit_days: 30 }
              as: RecruitingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /lateral-hiring/candidates returns total_count 0"

      - name: omitted_consent_status_and_confidential_flag_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ClientBookEntry.fields.client_consent_status
          - entities.Candidate.fields.approach_confidential
          - endpoints[POST /lateral-hiring/candidates]
          - endpoints[POST /lateral-hiring/questionnaires/{questionnaire_id}/client-book-entries]
        distinguishing_aspect: |
          Both optional inputs default to their CONSERVATIVE value, not to the
          permissive one: an omitted approach_confidential becomes true (the approach is
          presumed confidential) and an omitted client_consent_status becomes
          CONSENT_PENDING, which drives consent_factor 0.60 rather than 1.00 in
          calculations.entry_validated_portable_amount.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one SearchFirm and one ACTIVE SearchFirmEngagement exist."
            - "One Candidate created WITHOUT the optional approach_confidential field, then approached, with a DRAFT LateralQuestionnaire."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30 }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/questionnaires"
              payload: { declared_prior_year_billings_usd: 1600000.00, declared_prior_year_collections_usd: 1410000.00, declared_realization_rate: 0.9500, primary_matter_types: ["M_AND_A"] }
              as: RecruitingCoordinator
              captures: { lpq_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Northwind Holdings", relationship_role: "BILLING_ATTORNEY", claimed_annual_billings_usd: 1600000.00, claimed_portability_pct: 0.8000, claimed_realization_rate: 1.0000, matter_types: ["M_AND_A", "SECURITIES"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_a_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ClientBookEntry.${entry_a_id}.client_consent_status == CONSENT_PENDING"
            - "ClientBookEntry.${entry_a_id}.status == ACTIVE"
            - "ClientBookEntry.${entry_a_id}.portable_status == UNVALIDATED"
            - "Candidate.${cand_id}.approach_confidential == true"

      - name: search_firm_engagement_count_is_derived_from_its_engagements
        claim_type: computed_fields
        grounds:
          - entities.SearchFirm.fields.engagement_count
          - endpoints[POST /lateral-hiring/search-firm-engagements]
          - state_machines.SearchFirmEngagement.null_to_ACTIVE
        distinguishing_aspect: |
          engagement_count is `source: computed`: it is 0 on a freshly created
          SearchFirm, becomes 2 after two engagements are booked on two DIFFERENT
          practice groups, and is NOT accepted as an input field — the POST
          /search-firms body may only carry name, max_fee_pct and
          max_concurrent_engagements.
        test_recipe:
          setup:
            - "Two OPEN PracticeGroups and one SearchFirm with max_concurrent_engagements 2."
            - "One ACTIVE SearchFirmEngagement already booked on the first practice group with exclusivity [2026-08-01, 2026-12-01) and tail_off_days 0."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Litigation", guarantee_budget_total_usd: 4000000.00, onboarding_capacity: 1, leverage_ratio: 2.50, target_standard_rate_usd: 800.00 }
              as: SystemAdmin
              captures: { pg2_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id, sf_count_0: $.data.engagement_count }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg2_id}", fee_pct: 0.3000, fee_cap_usd: 300000.00, exclusivity_start_date: "2026-12-01T00:00:00.000Z", exclusivity_end_date: "2027-04-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
              captures: { eng2_id: $.data.id }
            - call: "GET /lateral-hiring/search-firms/${sf_id}"
              payload: {}
              as: RecruitingCoordinator
              captures: { sf_count_2: $.data.engagement_count }
          assert:
            - "${sf_count_0} == 0"
            - "${sf_count_2} == 2"
            - "SearchFirmEngagement.${eng2_id}.status == ACTIVE"
            - "SearchFirmEngagement.${eng2_id}.fee_status == NOT_DUE"
            - "SearchFirmEngagement.${eng2_id}.fee_basis == NONE"
            - "SearchFirm.${sf_id}.max_concurrent_engagements == 2"

      - name: offer_create_stamps_created_by_user_id_from_the_request_header
        claim_type: system_fields
        grounds:
          - entities.CompensationOffer.fields.created_by_user_id
          - entities.CompensationOffer.fields.round_number
          - endpoints[POST /lateral-hiring/candidates/{candidate_id}/offers]
          - roles.CommitteeChair
        distinguishing_aspect: |
          created_by_user_id is `source: system` and is taken from the X-User-ID header,
          never from the body — the POST /offers input schema does not even accept it.
          round_number is likewise system-seeded to 1. Both are the inputs to the
          segregation-of-duties rule that later blocks the same user from finalizing.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one Candidate in DILIGENCE with clearance_status CLEARED and a CURRENT VALIDATED PortabilityAssessment over the SLIM BOOK."
            - "The candidate's version has been observed by the chair and captured as cand_v1."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
