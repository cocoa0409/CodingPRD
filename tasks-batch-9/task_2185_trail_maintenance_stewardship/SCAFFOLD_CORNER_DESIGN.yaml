          The BREAK_THRESHOLD_MIN boundary is >=, and the quarter-hour quantization makes it
          non-monotonic: a 240-minute shift loses the 30-minute break and credits 3.50 h, while a
          239-minute shift keeps every minute and credits 4.00 h - the shorter shift earns more.
