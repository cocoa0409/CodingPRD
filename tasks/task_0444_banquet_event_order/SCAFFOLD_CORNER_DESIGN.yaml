          - roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /events/{id}/bookings as AccountingClerk -> ERR_FORBIDDEN (403); bookings are a SalesManager exclusive (peer-role isolation)."
        test_recipe:
          setup: ["One INQUIRY event and a room."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon W", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Peer Co", event_date: "2029-11-01", setup_style: "THEATER", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2029-11-01T18:00:00Z", end_utc: "2029-11-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: missing_headers_returns_unauthenticated
        claim_type: exclusive_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with an unknown/blank X-User-Role -> ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /events"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_event_version_on_booking_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-event]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one booking create bumps Event.version, a second booking create still carrying the pre-bump expected_event_version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["INQUIRY event observed at version v0; one booking already created (version now v0+1)."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon X", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "OCC Co", event_date: "2029-12-01", setup_style: "THEATER", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2029-12-01T18:00:00Z", end_utc: "2029-12-01T20:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2029-12-01T21:00:00Z", end_utc: "2029-12-01T23:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: occ_correct_event_version_on_payment_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-record-stale-event]
          - entities.Event.fields.version
          - entities.Event.fields.paid_to_date_cents
        distinguishing_aspect: "Recording a payment with the current expected_event_version succeeds (201), Event.paid_to_date_cents rises to the amount, and Event.version increments by 1."
        test_recipe:
          setup: ["INQUIRY event observed at its current version with no payments."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "OCC2 Co", event_date: "2030-01-15", setup_style: "THEATER", expected_attendance: 30, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 25000, method: "ACH", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
          assert:
            - "Event.${event_id}.paid_to_date_cents == 25000"

      - name: stale_occ_payment_after_prior_payment_bumped_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-record-stale-event]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A first payment bumps Event.version; a second payment still carrying the pre-bump expected_event_version (ev_v0) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["INQUIRY event observed at version ev_v0; one payment already applied (version now ev_v0+1)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "OCC3 Co", event_date: "2030-02-01", setup_style: "THEATER", expected_attendance: 30, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 10000, method: "CARD", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
          trigger:
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 10000, method: "CARD", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: void_payment_recomputes_balance_derived_field
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Payment.APPLIED_to_VOIDED
          - calculations.balance_due
          - entities.Event.fields.paid_to_date_cents
          - entities.Event.fields.balance_due_cents
        distinguishing_aspect: "Voiding the only payment drops Event.paid_to_date_cents back to 0 and balance_due_cents back to estimated_total (0) on an INQUIRY event with no charges."
        test_recipe:
          setup: ["INQUIRY event with one 20000 APPLIED payment (paid_to_date 20000, balance -20000)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Recon Co", event_date: "2030-03-01", setup_style: "THEATER", expected_attendance: 20, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 20000, method: "CHECK", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/payments/${pay_id}/void"
              payload: {}
              as: AccountingClerk
          assert:
            - "Event.${event_id}.paid_to_date_cents == 0"
            - "Event.${event_id}.balance_due_cents == 0"
            - "Payment.${pay_id}.status == VOIDED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: lock_guarantee_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Event.DEFINITE_to_CONFIRMED
          - calculations.billable_count
          - entities.MenuLine.fields.extended_cents
        distinguishing_aspect: "lock-guarantee's response immediately reflects billable_count=ceil(120*1.05)=126 and the event's estimated_total recomputed in the same request (immediate consistency)."
        test_recipe:
          setup: ["DEFINITE event, guarantee about to be locked at 120, overset 0.05, one PER_PERSON line unit 10000, deposit settled."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon Y", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Immed Co", event_date: "2030-04-01", setup_style: "THEATER", expected_attendance: 100, overset_pct: 0.05, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Plated", pricing_mode: "PER_PERSON", unit_price_cents: 10000 }
              as: SalesManager
              captures: { ml_id: $.data.id }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2030-04-01T18:00:00Z", end_utc: "2030-04-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2030-03-01", amount_due_cents: 50000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 50000, method: "WIRE", expected_event_version: "${ev_v_pay}" }
              as: AccountingClerk
          trigger:
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 120 }
              as: BanquetCaptain
              captures: { billable: $.data.billable_count }
          assert:
            - "Event.${event_id}.billable_count == 126"
            - "MenuLine.${ml_id}.extended_cents == 1260000"
            - "Event.${event_id}.estimated_total_cents == 1260000"
