  - rule_id: boundary_precision_check
    instances:
      - name: cold_chain_temp_upper_bound_strict
        grounds:
          - calculations.cold_chain_temp_check
          - validations[priority=8]
          - entities.DonationBatch.fields.intake_temp_c
        distinguishing_aspect: "Temperature metric with strict > boundary at MAX_SAFE_TEMP_C=5.0: COLD_CHAIN intake at exactly 5.0 succeeds, at 5.1 is rejected ERR_TEMP_UNSAFE; reached via the intake endpoint."
        test_recipe:
          setup:
            - "Fridge OPERATIONAL; two COLD_CHAIN intakes at temps 5.0 (accepted) and 5.1 (rejected)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Spruce Fridge", location_label: "Spruce", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Ola", email: "ola@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "DAIRY", storage_type: "COLD_CHAIN", declared_quantity_kg: 2.0, slot_footprint: 1, intake_temp_c: 5.0, use_by: "2026-04-01T00:00:00Z", allergens: ["DAIRY"], expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { ok_id: $.data.id }
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "DAIRY", storage_type: "COLD_CHAIN", declared_quantity_kg: 2.0, slot_footprint: 1, intake_temp_c: 5.1, use_by: "2026-04-01T00:00:00Z", allergens: ["DAIRY"], expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "DonationBatch.${ok_id}.status == STOCKED"
            - "response.data.error_id == ERR_TEMP_UNSAFE"
            - "response.status == 422"

      - name: use_by_expiry_inclusive_lower_bound
        grounds:
          - calculations.use_by_expiry_check
          - state_machines.DonationBatch.STOCKED_to_EXPIRED
          - entities.DonationBatch.fields.use_by
        distinguishing_aspect: "Time metric with inclusive >= boundary: a run-ops with the clock exactly at use_by expires the batch (STOCKED->EXPIRED); reached via the run-ops endpoint, a different metric and endpoint than the temperature check."
        test_recipe:
          setup:
            - "A STOCKED batch with use_by 2026-03-10T00:00:00Z; clock set to exactly 2026-03-10T00:00:00Z; run-ops."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Poplar Fridge", location_label: "Poplar", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Pat", email: "pat@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-03-10T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fridges/${f_id}/run-ops"
              payload: {}
              as: NetworkAdmin
            - call: "GET /donation-batches/${b_id}"
              payload: {}
              as: NetworkAdmin
              captures: { st: $.data.status }
          assert:
            - "DonationBatch.${b_id}.status == EXPIRED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: intake_requires_fridge_operational
        grounds:
          - validations[priority=7]
          - entities.Fridge.fields.safety_posture
          - entities.DonationBatch.fields.status
        distinguishing_aspect: "Entity pair DonationBatch->Fridge: a batch intake is rejected ERR_FRIDGE_NOT_OPERATIONAL when the parent Fridge.safety_posture is RESTRICTED (forced by temp 10.0)."
        test_recipe:
          setup:
            - "Fridge forced RESTRICTED via temp 10.0; intake attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Alder Fridge", location_label: "Alder", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Wes", email: "wes@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/temperature"
              payload: { reading_c: 10.0 }
              as: Steward
              as_user_id: "${sid}"
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FRIDGE_NOT_OPERATIONAL"
            - "response.status == 409"

      - name: complete_requires_steward_active
        grounds:
          - validations[priority=7]
          - state_machines.StewardShift.SCHEDULED_to_COMPLETED
          - entities.Steward.fields.status
        distinguishing_aspect: "Entity pair StewardShift->Steward (distinct from Batch->Fridge): completing a shift is rejected ERR_STEWARD_SUSPENDED when the assigned Steward.status is SUSPENDED."
        test_recipe:
          setup:
            - "A SCHEDULED shift whose steward is then SUSPENDED; clock past start; complete attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Beech Fridge", location_label: "Beech", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Zoe", email: "zoe@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z" }
              as: NetworkAdmin
              captures: { sh_id: $.data.id }
            - call: "POST /stewards/${sid}/suspend"
              payload: {}
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STEWARD_SUSPENDED"
            - "response.status == 409"

  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_overlap_same_fridge_halfopen
        grounds:
          - validations[priority=12]
          - entities.StewardShift.fields.start_at
          - entities.StewardShift.fields.end_at
        distinguishing_aspect: "Fridge-resource overlap with half-open [start,end) semantics: two COVERAGE shifts on the SAME fridge whose windows intersect (09:00-10:00 and 09:30-10:30) are rejected ERR_SHIFT_OVERLAP_FRIDGE (adjacency end==start would be allowed)."
        test_recipe:
          setup:
            - "One fridge; a first COVERAGE shift 09:00-10:00 by steward A; a second COVERAGE shift 09:30-10:30 by steward B (different steward avoids the buffer rule)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Cypress Fridge", location_label: "Cypress", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "A", email: "a@x.org" }
              as: NetworkAdmin
              captures: { s_a: $.data.id }
            - call: "POST /stewards"
              payload: { name: "B", email: "b@x.org" }
              as: NetworkAdmin
              captures: { s_b: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${s_a}", kind: "COVERAGE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${s_b}", kind: "COVERAGE", start_at: "2026-03-01T09:30:00Z", end_at: "2026-03-01T10:30:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIFT_OVERLAP_FRIDGE"
            - "response.status == 409"

      - name: steward_buffer_double_booking_cross_fridge
        grounds:
          - validations[priority=13]
          - entities.StewardShift.fields.steward_id
          - entities.StewardShift.fields.start_at
        distinguishing_aspect: "Steward-resource overlap with a 30-minute buffer-expanded closed interval (distinct interval arithmetic and different resource entity): the same steward's shifts on two DIFFERENT fridges separated by only 15 minutes (10:00 end, 10:15 start) are rejected ERR_STEWARD_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "One steward with a shift on fridge F1 09:00-10:00; a second shift on fridge F2 starting 10:15 (15-min gap < 30-min buffer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F1", location_label: "L1", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f1: $.data.id }
            - call: "POST /fridges"
              payload: { name: "F2", location_label: "L2", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f2: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Kai", email: "kai@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f1}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fridges/${f2}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T10:15:00Z", end_at: "2026-03-01T11:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STEWARD_DOUBLE_BOOKED"
            - "response.status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: slot_conservation_stock_then_discard
        grounds:
          - calculations.fridge_slot_ledger
          - state_machines.DonationBatch.STOCKED_to_DISCARDED
          - entities.Fridge.fields.stock_slots_used
          - entities.Fridge.fields.free_slots
        distinguishing_aspect: "Conserved quantity = physical slots: capacity_slots (10) == stock_slots_used + free_slots at all times; STOCK (used 0->4) then DISCARD (used 4->0) returns stock_slots_used to 0 and free_slots to 10."
        test_recipe:
          setup:
            - "Fridge capacity 10; intake a batch footprint 4 (used 4, free 6); discard it (used 0, free 10)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Rowan Fridge", location_label: "Rowan", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Nan", email: "nan@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 8.0, slot_footprint: 4, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /donation-batches/${b_id}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { used: $.data.stock_slots_used, free: $.data.free_slots }
          assert:
            - "Fridge.${f_id}.stock_slots_used == 0"
            - "Fridge.${f_id}.free_slots == 10"

      - name: budget_conservation_grant_then_cancel
        grounds:
          - calculations.fridge_budget_ledger
          - state_machines.SponsorGrant.ACTIVE_to_CANCELLED
          - entities.Fridge.fields.budget_granted_cents
          - entities.Fridge.fields.budget_available_cents
        distinguishing_aspect: "Conserved quantity = money identity budget_granted == budget_available + budget_committed: creating a 100000-cent grant then cancelling it (no commits in between) returns all three to 0, preserving the identity; a different conserved quantity than physical slots."
        test_recipe:
          setup:
            - "Fridge with no commitments; create an ACTIVE grant of 100000 cents; cancel it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Hazel Fridge", location_label: "Hazel", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /fridges/${f_id}/grants"
              payload: { sponsor_name: "GoodCorp", amount_cents: 100000 }
              as: SponsorAgent
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /grants/${g_id}/cancel"
              payload: {}
              as: SponsorAgent
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { g: $.data.budget_granted_cents, av: $.data.budget_available_cents, cm: $.data.budget_committed_cents }
          assert:
            - "Fridge.${f_id}.budget_granted_cents == 0"
            - "Fridge.${f_id}.budget_available_cents == 0"
            - "Fridge.${f_id}.budget_committed_cents == 0"
