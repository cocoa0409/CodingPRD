              as_user_id: "sd-1"
            - call: "GET /evfleet/vehicles/${veh1_id}"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { d_stat: $.data.delivery_status, t_stat: $.data.telematics_status }
          assert:
            - "telematics reached ACTIVE while delivery was ASSEMBLED (no delivery precondition on telematics)"
            - "d_stat == IN_TRANSIT after the suspend (delivery dimension untouched by telematics transition)"
            - "t_stat == SUSPENDED (ACTIVE -> SUSPENDED legal while IN_TRANSIT)"

      - name: supplier_downgrade_quarantines_and_recovery_releases
        claim_type: Conditional cascade
        grounds:
          - state_machines.BatteryModule.IN_QA_to_QUARANTINED
          - state_machines.BatteryModule.QUARANTINED_to_IN_QA
          - entities.VehicleOrder.fields.supply_risk_flag
        distinguishing_aspect: "Conditional cascade by child state: a drop to tier C quarantines only modules in {REGISTERED, IN_QA, REWORK, FAILED} (a PASSED module is untouched), flags CONFIRMED orders and pushes promised_delivery_date +14; recovery to B releases QUARANTINED modules and clears the flag but never pulls the date back."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base order CONFIRMED (promised 2026-10-06); module 1 PASSED; module 2 in IN_QA (not yet passed)."
