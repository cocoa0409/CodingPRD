              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /deal-memos"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", submission_id: "${sub_id}" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 200000, offer_usage_term_months: 12 }
              as: CastingDirector
              as_user_id: "${cd_id}"
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", hold_kind: "CONFIRMED_BOOKING" }
              as: Agent
              captures: { hold_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv1: $.data.version }
            - call: "POST /bookings"
              payload: { deal_memo_id: "${dm_id}", talent_id: "${talent_id}", casting_call_id: "${call_id}", availability_hold_id: "${hold_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", expected_talent_version: "${tv1}" }
              as: Agent
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Agent
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: archive_talent_with_open_booking_rejected
