scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: penalty_share_forward_looking_vs_chronological_recidivist
        grounds:
          - calculations.penalty_allocation
          - state_machines.PenaltyAllocation.ALLOCATED_to_CONTESTED
          - entities.PenaltyAllocation.fields.operator_share_cents
          - entities.PenaltyAllocation.fields.state_baseline_share_cents
        distinguishing_aspect: |
          On a PenaltyAllocation (the permit-violation money domain) the forward-looking operator share and the chronological recidivist-tier
          baseline share diverge on identical inputs, because only the forward-looking variant admits the BREACH_UPLIFT_PCT uplift keyed on
          BREACHED standards under the contract while the chronological variant tiers on the allocation's created_at ASC position under its permit.
        test_recipe:
          setup:
            - "one Municipality with population_served 250000 and benchmark_index_baseline 0.0004"
            - "one Contract awarded at 40000000 cents per year with operator_penalty_share_pct 0.45"
            - "one ACTIVE PerformanceStandard under the contract so the BREACHED count is initially zero"
            - "one ACTIVE Permit under the contract"
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/permits"
              payload: { permit_number: "OH-2027-001", permit_type: "NPDES_DISCHARGE", regulator: "STATE_PRIMACY_AGENCY", effective_date: "2026-05-01T00:00:00Z", expiration_date: "2027-04-30T00:00:00Z" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { per_id: $.data.id }
          trigger:
            - call: "POST /water-om/permits/${per_id}/penalty-allocations"
              payload: { violation_code: "40CFR122-BYPASS", total_penalty_cents: 2000000 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { alloc_id: $.data.id }
          assert:
            - "PenaltyAllocation.${alloc_id}.operator_share_cents == 900000"
            - "PenaltyAllocation.${alloc_id}.state_baseline_share_cents == 900000"
            - "PenaltyAllocation.${alloc_id}.municipality_share_cents == 1100000"
      - name: benefit_vesting_vs_tiered_band_from_running_total
        grounds:
          - calculations.vesting_benefit
          - state_machines.Employee.MUNICIPAL_to_OFFERED
          - entities.Employee.fields.benefit_tier
          - entities.Employee.fields.pension_offset_cents
        distinguishing_aspect: |
          On an Employee (the workforce-transition domain) the tiered vesting formula's benefit_tier and pension_offset_cents
          differ between the pinned band-from-base_fte reading and the band-from-running-total reading, because the tier
          band is selected from municipal_years_of_service alone and the offset is then computed per year from that band.
        test_recipe:
          setup:
            - "one Municipality and one Contract starting 2026-05-01T00:00:00Z"
            - "one BINDING StaffingCommitment for role_code OPS-3 with committed_fte 2.0"
            - "one Employee hired 2016-05-01T00:00:00Z, exactly 10.00 years of municipal service"
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/staffing-commitments"
              payload: { role_code: "OPS-3", committed_fte: 2.0 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/staffing-commitments/${sc_id}/bind"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/employees"
              payload: { role_code: "OPS-3", full_name: "Dana Whitfield", municipal_hire_date: "2016-05-01T00:00:00Z", transfer_offer_fte: 1.0 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /water-om/contracts/${con_id}/employees/${emp_id}/offer"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          assert:
            - "Employee.${emp_id}.municipal_years_of_service == 10.0"
            - "Employee.${emp_id}.benefit_tier == 'ENHANCED'"
            - "Employee.${emp_id}.pension_offset_cents == 2500000"
            - "Employee.${emp_id}.status == 'OFFERED'"
  - rule_id: combinatorial_formula
    instances:
      - name: expense_class_boundary_ordered_branch_selection
        grounds:
          - calculations.expense_class_boundary
          - entities.WorkOrder.fields.expense_class
          - validations[priority=55]
        distinguishing_aspect: |
          Mode (a) tiered-rate/branch selection: the capital-versus-operating classification is decided by an ordered chain of
          guarded branches over estimated_cost_cents, Asset.condition_score and the install_year plus useful_life_years boundary,
          so an asset at 59.5 percent of useful life and a 3000000 cent estimate lands in OPERATING while the same estimate on a
          60.0 percent asset lands in CAPITAL_THRESHOLD.
        test_recipe:
          setup:
            - "one Contract with one ACTIVE PerformanceStandard"
            - "two Assets of class PUMP, one installed 2016 (10 of 15 useful years elapsed) and one installed 2011 (15 of 15 elapsed)"
            - "the contract is OPERATING"
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-101", asset_class: "PUMP", install_year: 2016, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_a: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-102", asset_class: "PUMP", install_year: 2011, useful_life_years: 15, criticality_rank: 2 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_b: $.data.id }
            - call: "POST /water-om/assets/${asset_a}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 85.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_a: $.data.id }
            - call: "POST /water-om/assets/${asset_b}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 85.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_b: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_a}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/asset-assessments/${asmt_b}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/assets/${asset_b}/work-orders"
              payload: { work_type: "CORRECTIVE", estimated_cost_cents: 3000000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { wo_b: $.data.id }
            - call: "POST /water-om/assets/${asset_a}/work-orders"
              payload: { work_type: "CORRECTIVE", estimated_cost_cents: 3000000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { wo_a: $.data.id }
          assert:
            - "WorkOrder.${wo_b}.expense_class == 'OPERATING'"
            - "WorkOrder.${wo_a}.expense_class == 'CAPITAL_THRESHOLD'"
            - "WorkOrder.${wo_a}.estimated_cost_cents - WorkOrder.${wo_b}.estimated_cost_cents == 0"
      - name: cost_variance_per_component_then_sum_rounding_order
        grounds:
          - calculations.work_order_cost_variance
          - entities.WorkOrder.fields.cost_variance_cents
          - validations[priority=42]
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the pinned order rounds the labour component and the materials
          component separately with round_half_up and only then sums them, so a closure with 12.01 labour hours and 483720
          materials cents yields actual_cost_cents exactly 627531, one cent more than a sum-then-round implementation produces.
        test_recipe:
          setup:
            - "one OPERATING contract with one Asset in service and one DRAFT corrective WorkOrder estimated at 500000 cents"
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-201", asset_class: "PUMP", install_year: 2020, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /water-om/assets/${asset_id}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 88.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_id}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/assets/${asset_id}/work-orders"
              payload: { work_type: "CORRECTIVE", estimated_cost_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /water-om/work-orders/${wo_id}/schedule"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/work-orders/${wo_id}/start"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/work-orders/${wo_id}/complete"
              payload: { labour_hours: 12.01, materials_cents: 483720, closure_narrative: "Replaced the mechanical seal and flushed the volute; impeller clearances verified within tolerance." }
              as: OperatorAdmin
              as_user_id: "${con_id}"
          assert:
            - "WorkOrder.${wo_id}.actual_cost_cents == 627531"
            - "WorkOrder.${wo_id}.cost_variance_cents == 127531"
            - "WorkOrder.${wo_id}.status == 'COMPLETED'"
  - rule_id: non_linear_state_machine
    instances:
      - name: renewal_negotiation_cycle_across_counter_rounds
        grounds:
          - state_machines.RenewalProposal.SUBMITTED_to_UNDER_REVIEW
          - state_machines.RenewalProposal.UNDER_REVIEW_to_COUNTERED
          - state_machines.RenewalProposal.COUNTERED_to_ACCEPTED
          - entities.RenewalProposal.fields.round_number
        distinguishing_aspect: |
          The RenewalProposal machine on the RenewalProposal entity is cyclic rather than a pipeline: UNDER_REVIEW -> COUNTERED creates the
          next round's SUBMITTED proposal, and the loop returns through SUBMITTED -> UNDER_REVIEW, so the same entity type re-enters its
          initial-adjacent state with an incremented round_number and the accepted round alone advances Contract.renewal_round.
        test_recipe:
          setup:
            - "one UNDER_REVIEW Contract past the 180 day renewal window with a frozen baseline"
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-301", asset_class: "PUMP", install_year: 2020, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /water-om/assets/${asset_id}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 88.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_id}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /water-om/contracts/${con_id}"
              payload: {}
              as: OperatorAdmin
              captures: { con_version: $.data.version }
            - call: "POST /water-om/contracts/${con_id}/reviews"
              payload: { expected_contract_version: "${con_version}", review_outcome: "OPEN" }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/renewals"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/contracts/${con_id}/renewal-proposals"
              payload: { round_number: 1, proposed_fee_cents: 41000000, proposed_term_years: 3, submitted_by: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { prop_r1: $.data.id }
            - call: "POST /water-om/renewal-proposals/${prop_r1}/review"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/renewal-proposals/${prop_r1}/counter"
              payload: { proposed_fee_cents: 39500000, proposed_term_years: 3 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { prop_r2: $.data.id }
          assert:
            - "RenewalProposal.${prop_r1}.status == 'COUNTERED'"
            - "RenewalProposal.${prop_r2}.round_number == 2"
            - "RenewalProposal.${prop_r2}.proposed_fee_cents == 39500000"
            - "RenewalProposal.${prop_r2}.status == 'SUBMITTED'"
      - name: hand_back_obligation_dispute_cycle_between_two_machines
        grounds:
          - state_machines.TransitionObligation.OVERDUE_to_DISPUTED
          - state_machines.TransitionObligation.DISPUTED_to_OVERDUE
          - state_machines.Contract.HANDING_BACK_to_RENEWAL_PENDING
          - entities.TransitionObligation.fields.withholding_cents
        distinguishing_aspect: |
          The Contract machine carries a genuine cycle — HANDING_BACK -> RENEWAL_PENDING -> RENEWED -> OPERATING — and it is entered only
          when every critical TransitionObligation is SATISFIED or WAIVED, which is itself the exit of a cyclic dispute loop between OVERDUE
          and DISPUTED, so the two cycles are ordered one after the other rather than being a single pipeline.
        test_recipe:
          setup:
            - "one OPERATING contract with one in-service Asset, one Employee in ACTIVE status and one ACTIVE Permit"
