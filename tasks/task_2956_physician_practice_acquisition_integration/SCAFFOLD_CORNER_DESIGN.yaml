      - name: compensation_designer_cannot_approve_its_own_plan
        claim_type: Cannot perform another role's exclusive operation
        grounds:
          - roles[CompensationDesigner].shared_operations
          - roles[ComplianceOfficer].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=2]
        distinguishing_aspect: |
          Authoring and approving are disjoint even though they share one endpoint: the
          designer may drive its plan to SUBMITTED or WITHDRAWN and no further. The role
          check at priority 2 also runs ahead of every business rule, so the designer's
          refusal is a 403 on a plan that a ComplianceOfficer could not have approved
          either.
