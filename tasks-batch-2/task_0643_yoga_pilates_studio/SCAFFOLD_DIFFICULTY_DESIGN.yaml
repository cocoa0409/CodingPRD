            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s1@x.com", full_name: "S1", home_studio_state: "CA" }
              as: StudioManager
