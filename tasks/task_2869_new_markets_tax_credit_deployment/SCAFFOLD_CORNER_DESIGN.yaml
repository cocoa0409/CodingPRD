              as: CertifyingAgency
              captures: { award_one_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_two_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_two_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_one_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_one_id}"
              captures: { award_one_v: $.data.version }
            - call: "POST /nmtc/allocation-awards/${award_two_id}/allocation-agreement"
              payload: { signatory_name: "B. Highland" }
              as: CDESponsor
              as_user_id: "${cde_two_id}"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
