  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_event_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[event-config-update-stale]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH /events with the captured version 1 succeeds (version -> 2); replaying the same expected_event_version 1 -> 412 ERR_STALE_VERSION. Two strictly sequential requests."
        test_recipe:
          setup: ["event DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id, evv: $.data.version } }
          trigger:
            - { call: "PATCH /volunteer-ops/events/${ev}", payload: { name: "City Marathon Renamed", expected_event_version: "${evv}" }, as: EventDirector, captures: { v2: $.data.version, nm: $.data.name } }
            - { call: "PATCH /volunteer-ops/events/${ev}", payload: { name: "City Marathon Third", expected_event_version: "${evv}" }, as: EventDirector, captures: { err: $.data.error_id } }
            - { call: "GET /volunteer-ops/events/${ev}", as: EventDirector, captures: { cur: $.data.name, curv: $.data.version } }
          assert:
            - "first PATCH succeeds: name == City Marathon Renamed (${nm}), version == 2 (${v2} == ${evv} + 1)"
            - "second PATCH with the stale version -> 412 ERR_STALE_VERSION (${err})"
            - "stored event unchanged by the rejected write: name == City Marathon Renamed (${cur}), version == 2 (${curv})"
      - name: occ_volunteer_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[volunteer-profile-update-stale]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH /volunteers: coordinator sets skills at version 1 (ok, -> 2); the volunteer's own float_opt_in PATCH still carrying version 1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["volunteer V1 at version 1"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id, vv: $.data.version } }
          trigger:
            - { call: "PATCH /volunteer-ops/volunteers/${v1}", payload: { skill_tags: [MEDICAL], expected_volunteer_version: "${vv}" }, as: VolunteerCoordinator, captures: { v2: $.data.version } }
            - { call: "PATCH /volunteer-ops/volunteers/${v1}", payload: { float_opt_in: true, expected_volunteer_version: "${vv}" }, as: Volunteer, as_user_id: "${v1}", captures: { err: $.data.error_id } }
            - { call: "GET /volunteer-ops/volunteers/${v1}", as: VolunteerCoordinator, captures: { fo: $.data.float_opt_in, sk: $.data.skill_tags } }
          assert:
            - "first PATCH -> version 2 (${v2})"
            - "second PATCH with stale version -> 412 ERR_STALE_VERSION (${err})"
            - "float_opt_in stays false (${fo}) while skill_tags == [MEDICAL] (${sk}) — the stale write did not partially apply"
      - name: occ_adjustment_apply_stale_role_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[role-adjust-apply-stale-role]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two APPROVED adjustments on the same role: applying the first bumps RoleCatalogEntry.version 1 -> 2; applying the second with the pre-captured version 1 -> 412 ERR_STALE_VERSION, forcing a re-read."
