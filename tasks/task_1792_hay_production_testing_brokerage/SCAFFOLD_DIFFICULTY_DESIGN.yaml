          trigger:
            - { call: "GET /api/bale-lots/${lot10_id}", payload: {}, as: BrokerOps, captures: { lot_pre_alloc: "$.data.allocatable_tonnage" } }
            - { call: "POST /api/load-allocations", payload: { delivery_load_id: "${l7_id}", contract_id: "${ct10_id}", bale_lot_id: "${lot10_id}", tons: 7.0, expected_delivery_load_version: "${l7_v}" }, as: BrokerOps, captures: { a6_id: "$.data.id" } }
            - { call: "GET /api/bale-lots/${lot10_id}", payload: {}, as: BrokerOps, captures: { lot_mid_alloc: "$.data.allocatable_tonnage", lot_mid_open: "$.data.open_allocated_tonnage" } }
            - { call: "POST /api/load-allocations/${a6_id}/release", payload: {}, as: BrokerOps }
            - { call: "GET /api/bale-lots/${lot10_id}", payload: {}, as: BrokerOps, captures: { lot_post_alloc: "$.data.allocatable_tonnage", lot_post_open: "$.data.open_allocated_tonnage" } }
          assert:
            - "BaleLot allocatable before allocation == 20.0"
            - "after allocating 7.0: allocatable_tonnage == 13.0 AND open_allocated_tonnage == 7.0 (sum conserved at 20.0)"
            - "after release: allocatable_tonnage == 20.0 AND open_allocated_tonnage == 0.0 (exactly the pre-allocation values)"
      - name: accept_cancel_credit_invariant
        grounds:
          - state_machines.Contract.ACTIVE_to_CANCELLED
          - state_machines.Quote.ISSUED_to_ACCEPTED
          - entities.Buyer.fields.credit_used_cents
        distinguishing_aspect: |
          Conserved quantity = buyer credit headroom (money, different from tonnage): accept reserves
          total_reserved_cents and the compensating cancel releases exactly the same amount, returning
          credit_used_cents to 0 with no drift.
        test_recipe:
          setup:
            - "Index @ 20000; lane 420mi; Buyer credit_limit 500000"
            - "Quote PREMIUM 12.0t total 439170 ISSUED"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer Eleven", region_code: "CA-NORTH", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { b11_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b11_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b11_id}", captures: { q11_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q11_id}/issue", payload: {}, as: Buyer, as_user_id: "${b11_id}", captures: { q11_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes/${q11_id}/accept", payload: { expected_quote_version: "${q11_v}" }, as: Buyer, as_user_id: "${b11_id}" }
            - { call: "GET /api/buyers/${b11_id}", payload: {}, as: PlatformAdmin, captures: { b11_used_mid: "$.data.credit_used_cents" } }
            - { call: "GET /api/contracts?quote_id=${q11_id}", payload: {}, as: BrokerOps, captures: { ct11_id: "$.data[0].id" } }
            - { call: "POST /api/contracts/${ct11_id}/cancel", payload: {}, as: PlatformAdmin }
            - { call: "GET /api/buyers/${b11_id}", payload: {}, as: PlatformAdmin, captures: { b11_used_post: "$.data.credit_used_cents" } }
          assert:
            - "after accept: Buyer.credit_used_cents == 439170 (reserved == quote.total_cents)"
            - "after cancel: Buyer.credit_used_cents == 0 (exactly the pre-accept value; credit_limit - credit_used headroom conserved)"
            - "Contract.${ct11_id}.status == CANCELLED"
