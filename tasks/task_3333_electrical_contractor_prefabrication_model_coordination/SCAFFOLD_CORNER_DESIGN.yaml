  - section: calculations
    instances:
      - name: project_posture_tier_boundary_at_exactly_two_percent
        claim_type: constants_applied
        grounds:
          - calculations.project_posture_derivation
          - entities.Project.fields.slippage_pct
        distinguishing_aspect: "A slippage ratio of exactly 0.0200 stays ON_TRACK because the tier test is <=, while 0.0201 moves the project to RELEASE_PENDING."
        test_recipe:
          setup: ["a project with one 100 day activity and the clock pushed so the shortfall is exactly 2 days"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-CA1", project_name: "Deck CA1", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_ca1_id: $.data.id }
            - call: "POST /trade-contract-rates"
              payload: { jurisdiction_key: "J1", classification: "JOURNEYMAN", apprentice_period: null, hourly_rate_cents: 6800, burden_pct: 0.42, apprentice_ratio_max: 1.0, wait_ratio_max: 1.0, effective_from_iso: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rate_ca1_id: $.data.id }
            - call: "POST /trade-activities"
              payload: { project_id: "${proj_ca1_id}", trade_key: "ELECTRICAL", activity_kind: "ELECTRICAL_INSTALL", work_front_code: "WF-1", bay_code: "BAY-A", planned_start_iso: "2026-10-01T00:00:00Z", planned_duration_days: 100, written_sequence_index: 1, revision_id: null, rate_id: "${rate_ca1_id}", permit_id: null }
              as: GeneralForeman
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /projects/${proj_ca1_id}/posture/recompute"
              payload: {}
              as: PlatformAdmin
          assert:
            - "slippage_pct == 0.0200 exactly: a 2 day shortfall over a 100 day span rounds to four decimals without loss"
            - "Project.${proj_ca1_id}.project_posture == ON_TRACK because equality belongs to the lower tier"
            - "one further day of slippage would give 0.0300 and RELEASE_PENDING, so the tier assignment is precomputed rather than interpolated at read time"
