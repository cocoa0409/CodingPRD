  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_cascades_lease_to_option_to_reminder
        grounds:
          - state_machines.Lease.ACTIVE_to_EXPIRING
          - state_machines.Option.AVAILABLE_to_WINDOW_OPEN
          - state_machines.Reminder
        distinguishing_aspect: |
          Depth-3 chain triggered by the clock-advance transition: clock advance
          moves Lease ACTIVE→EXPIRING (hop 1); that lease transition flips each
          in-window Option AVAILABLE→WINDOW_OPEN (hop 2, caused by the lease
          transition, not by the clock directly); each option window-open spawns
          its five-tier Reminder cascade (hop 3, caused by the option transition).
        test_recipe:
          setup:
            - "Portfolio P with one active contact AM (is_active=true)"
            - "Lease L ACTIVE: commenced 2026-01-01, expires 2027-01-31 (so EXPIRING starts at expiration-180d = 2026-08-04)"
            - "Option O on L: window [2026-08-10, 2026-11-30]"
            - "Clock advanced to 2026-08-15 → L goes EXPIRING, O goes WINDOW_OPEN, five PENDING reminders spawn for AM"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P7", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
