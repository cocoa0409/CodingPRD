  - rule_id: cross_entity_state_dependency
    instances:
      - name: nomination_blocked_by_candidate_hof_status
        grounds:
          - validations[priority=45]
          - entities.Candidate.fields.hof_status
          - endpoints[POST /candidates/{id}/permanent-ineligibility]
          - endpoints[POST /candidacies]
        distinguishing_aspect: |
          Entity pair Candidacy -> Candidate: whether a Candidacy may be created at all depends on
          a state field of a DIFFERENT entity, Candidate.hof_status. With the cycle, the elector and
          the eligibility rule all identical, the nomination of a PERMANENTLY_INELIGIBLE candidate
          is rejected with ERR_CANDIDATE_INELIGIBLE (422) while the very next nomination of a
          NOT_INDUCTED candidate with weaker credentials succeeds with 201.
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, MODERN) with waiting_period_years 5, min_career_seasons 10, min_career_metric 2000."
            - "One credentialed elector to name as nominator."
            - "Two candidates who both clear every career and waiting threshold; the first is then flagged permanently ineligible while the second stays NOT_INDUCTED."
            - "Cycle 2026 with nominations OPEN."
          setup_api_calls:
            - call: "POST /eligibility-rules"
              payload: { category: "PLAYER", pathway: "MODERN", waiting_period_years: 5, min_career_seasons: 10, min_career_metric: 2000, max_ballot_appearances: 3, election_threshold_pct: 0.75, carryover_min_pct: 0.05, runoff_floor_pct: 0.25 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /voter-blocs"
              payload: { bloc_code: "WRITERS", name: "Baseball Writers", seat_cap: 10, min_participation_pct: 0.50 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { bloc_id: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector One", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e1: "$.data.id" }
