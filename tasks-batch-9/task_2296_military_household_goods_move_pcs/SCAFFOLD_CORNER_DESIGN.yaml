              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claim-items/${ci2_id}/disposition"
              payload: { disposition: "ALLOWED", adjudication_note: "DOCUMENTED" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claims/${cl_id}/settle"
              payload: { settlement_note: "PAID WITH ONE CAP APPLIED" }
              as: ClaimsExaminer
              as_user_id: "examiner-02"
              captures: { settled_total: $.data.settlement_total_usd }
            - call: "GET /hhg/tsps/${tsp_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_score: $.data.performance_score, tsp_status: $.data.status }
          assert:
            - "${claimed_total} == 11000.00 and ${basis} == FULL_REPLACEMENT_VALUE"
            - "GET /hhg/claim-items/${ci1_id} shows item_settlement_usd == 5000.00 — capped from 6000.00 because high_value_inventory_documented is false at the 5000.00 threshold"
            - "GET /hhg/claim-items/${ci2_id} shows item_settlement_usd == 5000.00 — paid in full, and its age_years 4.0 is ignored under FULL_REPLACEMENT_VALUE"
            - "${settled_total} == 10000.00 (1000.00 less than claimed) and item_count == 2"
            - "${tsp_score} == 75.00 (100.00 - 5.00 - 10000.00/500) and ${tsp_status} == ACTIVE (75.00 >= 70.00)"
            - "GET /hhg/capacity-blocks/${cb_id} still shows status OPEN — no PROBATION cascade at 75.00"

      - name: sit_fuel_surcharge_precision_excluded_stub
        claim_type: precision
        grounds:
          - calculations.sit_cost_assessment.precision
        excluded_because:
          difficulty_instance: sit_fuel_surcharge_tier_keyed_on_pre_surcharge_base_cost
          rationale: >-
            That instance already pins the four-step rounding order and shows that the fuel tier is
            selected on sit_base_cost_usd rather than on sit_total_cost_usd, which is the only
            observable precision claim this calculation makes.

      - name: weight_allowance_table_correct_result_excluded_stub
        claim_type: correct_result
        grounds:
          - calculations.entitlement_weight_allowance
        excluded_because:
          difficulty_instance: weight_allowance_table_lookup_with_move_type_floor_and_cap
          rationale: >-
            The rank/dependent table lookup plus the LOCAL floor and SEPARATION cap modifiers are
            exercised there across several ranks and move types in one chain; a breadth instance would
            re-run the same formula with different literals only.

      - name: claim_settlement_variant_divergence_excluded_stub
        claim_type: variant_divergence
        grounds:
          - calculations.claim_settlement_valuation.variants
        excluded_because:
          difficulty_instance: claim_settlement_frv_versus_depreciated_on_identical_item_set
          rationale: >-
            Divergence is the whole point of that instance: it settles the identical item set under
            both settlement bases and asserts the delta, so nothing is left for §1.9 to add.

      - name: billable_weight_reconciliation_excluded_stub
        claim_type: reconciliation
        grounds:
          - calculations.shipment_billable_weight.variants
        excluded_because:
          difficulty_instance: billable_weight_provisional_estimate_replaced_by_final_actual
          rationale: >-
            That instance follows the provisional-to-final switch through the entitlement ledger and
            proves the estimate is replaced rather than added to, which is exactly the reconciliation
            claim for this calculation.

      - name: ppm_variant_selection_excluded_stub
        claim_type: variant_selection
        grounds:
          - calculations.ppm_reimbursement.variants
        excluded_because:
          difficulty_instance: ppm_reimbursement_incentive_versus_actual_expense_basis
          rationale: >-
            Basis selection under AUTO (including the tie going to INCENTIVE_BASIS) and the taxable
            consequence of each basis are both driven there on the same submission data.

  # ===========================================================================
  - section: validations
    instances:
      - name: spread_window_and_transit_dates_accept_the_first_spread_day
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - calculations.spread_window_and_transit
        distinguishing_aspect: >-
          A peak-season shipment gets a (2, 7) spread of 2026-08-15..2026-08-24, so packing on
          2026-08-14 (spread_start minus exactly one day) and picking up on 2026-08-15 (the first
          spread day) both pass, and required_delivery_by lands on 2026-08-21 via 6 transit days.
        test_recipe:
          setup:
            - "E6-with-dependents entitlement, surveyed and awarded shipment; booked_at 2026-08-03 with requested_pickup_date 2026-08-17 (peak season)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000040", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-40", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-C40", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s_id: $.data.id, sp_start: $.data.spread_start_date, sp_end: $.data.spread_end_date, transit: $.data.transit_days_allowed, peak: $.data.peak_season, short: $.data.is_short_notice }
            - call: "POST /hhg/shipments/${s_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-08-17T00:00:00Z", total_capacity_lbs: 12000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s_id}", expected_capacity_block_version: "${cb_v}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
          trigger:
            - call: "POST /hhg/shipments/${s_id}/pack"
              payload: { pack_date: "2026-08-14T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/pickup"
              payload: { actual_pickup_date: "2026-08-15T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { rdb: $.data.required_delivery_by }
          assert:
            - "${short} == false (14 whole days to pickup) and ${peak} == true (2026-08-17 is inside [May 15, Sep 30])"
            - "${sp_start} == 2026-08-15T00:00:00Z and ${sp_end} == 2026-08-24T00:00:00Z (peak spread 2 before / 7 after)"
            - "${transit} == 6 == max(5, ceil(1200/300) + 2 peak days)"
            - "the pack call returns HTTP 200: 2026-08-14 == spread_start minus 1 day is the earliest legal pack date"
            - "the pickup call returns HTTP 200 with movement_status == PICKED_UP: the closed interval includes spread_start"
            - "${rdb} == 2026-08-21T00:00:00Z (2026-08-15 + 6 transit days)"

