              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /installations/${i_id}/flag-drift"
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 75.0, axis_rms_y_mm: 75.0, axis_rms_z_mm: 75.0, sample_count: 6000, reference_point_count: 16 }
