  # ---------------------------------------------------------------------------
  # SECTION: optimistic_concurrency (complexity layer; §1.2.1 concurrency_rules)
  # One stale-version instance per declared rule, using that rule's own write_endpoint and
  # occ_field, plus one instance proving the happy path and the version increment. Every
  # expected_* value is captured from a GET, never written as a literal.
