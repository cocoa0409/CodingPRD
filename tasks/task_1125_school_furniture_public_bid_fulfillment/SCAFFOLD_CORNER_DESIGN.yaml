        test_recipe:
          setup: ["District D1; coop award accepted; PO lines L1 qty 10 and L2 qty 8 (ORDERED); both declared backordered (clock 2026-05-10); site exists"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ContractorAdmin }
