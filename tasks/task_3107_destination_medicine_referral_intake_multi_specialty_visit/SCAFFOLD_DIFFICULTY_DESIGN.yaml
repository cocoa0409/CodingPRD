  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: forfeiture_depth3_release_cascade
        grounds:
          - state_machines.FinancialClearance.PENDING_to_FORFEITED
          - state_machines.AppointmentSlot.HELD_to_RELEASED
          - state_machines.Visit.PENDING_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain: clearance FORFEITED -> held slots RELEASED -> their PENDING visits CANCELLED -> itinerary CANCELLED with revision bump; each hop is caused by the previous mutation, not by the forfeit call directly."
        test_recipe:
          setup:
            - "DESTINATION case approved; one slot held (visit PENDING) while clearance remains PENDING; logical clock advanced past earliest held slot_date minus 14 days."
            - "To hold a slot with clearance PENDING, the chain deposits 60000 (CLEARED), holds the slot, then FinancialCounselor reopens clearance (CLEARED -> PENDING)."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *case_v_after_approve
            - *deposit
            - *case_v_after_deposit
            - &f_hold
              call: "POST /visit-cases/${case_id}/slot-holds"
              payload: { appointment_slot_id: "${slot_c1}", visit_type: "CONSULT", listed_price_cents: 200000, sequencing_priority: 1, expected_case_version: "${case_v2}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { f_visit: $.data.id, f_itin: $.data.itinerary_id }
            - call: "POST /visit-cases/${case_id}/financial-clearance/reopen"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /visit-cases/${case_id}/financial-clearance/forfeit"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
          assert:
            - "FinancialClearance.status == FORFEITED and holds_released == true"
            - "AppointmentSlot.${slot_c1}.status == RELEASED"
            - "Visit.${f_visit}.status == CANCELLED"
            - "Itinerary.${f_itin}.status == CANCELLED and Itinerary.revision incremented to 2"
            - "VisitCase.${case_id}.status == WITHDRAWN"

      - name: record_verification_fatigue_withdrawal_cascade
        grounds:
          - state_machines.MedicalRecord.RECEIVED_to_VERIFIED
          - calculations.review_fatigue_accumulation
          - state_machines.VisitCase.transitions
        distinguishing_aspect: "Depth-2 chain from a different trigger (record verify, not forfeit): verify -> case fatigue_score +2 -> threshold breach at 10 -> VisitCase WITHDRAWN, with the standard release cascade as the terminal hop."
        test_recipe:
          setup:
            - "Same five-record setup as review_fatigue_circular_accumulator_evaluation_order through four verifications (score 8, case INTAKE)."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *ref_f
            - *f_rec1
            - *f_rec2
            - *f_rec3
            - *f_rec4
            - *f_rec5
            - *f_ver1
            - call: "POST /referrals/${ref_f_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - *case_f_create
            - *f_ver2
            - *f_ver3
            - *f_ver4
          trigger:
            - call: "POST /referrals/${ref_f_id}/medical-records/${f_rec5_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
          assert:
            - "VisitCase.${case_f_id}.fatigue_score == 10"
            - "VisitCase.${case_f_id}.status == WITHDRAWN without any explicit withdraw call"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_business_fiscal_on_slot_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors.ERR_INVALID_STATE
          - errors.ERR_FINANCIAL_CLEARANCE_REQUIRED
        distinguishing_aspect: "Dual failure on POST /slots/{id}/confirm where the slot is not HELD (state) AND clearance is not CLEARED (business_fiscal): priority 5 state must win over priority 16 fiscal, so the response is ERR_INVALID_STATE, never ERR_FINANCIAL_CLEARANCE_REQUIRED."
        test_recipe:
          setup:
            - "DESTINATION case approved, clearance still PENDING (no deposit); one OPEN slot exists (never held)."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
          trigger:
            - call: "POST /slots/${slot_c1}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 409 with error_id == ERR_INVALID_STATE (slot is OPEN, not HELD)"
            - "error_id != ERR_FINANCIAL_CLEARANCE_REQUIRED even though clearance is also PENDING"

      - name: segregation_safety_beats_referential_care_team_on_review
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_INVALID_CARE_TEAM
        distinguishing_aspect: "Different error-category pair (business_safety vs business_referential): a review submitted by the case's own assigned coordinator AND a case-creation attempt with a 1-specialty DESTINATION care team both violate rules — safety (priority 7) must surface before referential (priority 9) is ever evaluated on the review path, and the care-team error stands alone on creation."
        test_recipe:
          setup:
            - "Referral driven to IN_REVIEW; a DESTINATION case created by coordinator ic-anna."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
          trigger:
            - call: "POST /visit-cases/${case_id}/reviews"
              payload: { outcome: "APPROVE", notes: "self-review attempt" }
              as: CaseReviewer
              as_user_id: "ic-anna"
              captures: { err_sod: $.data.error_id }
            - call: "POST /visit-cases"
              payload: { referral_id: "${ref_id}", case_type: "DESTINATION", care_team_specialty_ids: ["${svc_card_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err_team: $.data.error_id }
          assert:
            - "the self-review is rejected with HTTP 403 ERR_SEGREGATION_OF_DUTIES"
            - "the under-sized care team creation is rejected with HTTP 422 ERR_INVALID_CARE_TEAM"
            - "the two failures surface their category-distinct errors with no cross-contamination"

