  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settled_invoice_payment_state_beats_overpay
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVOICE_NOT_PAYABLE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Category pair state(7) vs business_fiscal(12): a payment on a SETTLED invoice violates
          both "invoice not payable" and "amount exceeds balance_due (0)"; the state error
          ERR_INVOICE_NOT_PAYABLE (409) must win over ERR_OVERPAYMENT (422).
        test_recipe:
          setup:
            - "application SERVICE_INSTALLED; MainExtension CONSTRUCTED; CIACInvoice PAID at 322785¢ then finalize with as-built identical to design (delta 0) → invoice SETTLED, balance_due_cents == 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
