            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Cheese", base_price_cents: 800, shelf_life_opened_hours: 24, shelf_life_unopened_days: 60, allergen_tags: ["MILK"], requires_dedicated_slicer: true }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1", dedicated_allergen: "NONE" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S2", dedicated_allergen: "MILK" }, as: RetailManager, as_user_id: "${a1}", captures: { s2: $.data.id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
            - { call: "POST /api/service-visits/${v1}/submit", payload: { score: 90, rotation_compliant: true, slicer_presentation_ok: true, cleaned_slicer_ids: [ "${s1}" ] }, as: DistributorRep, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-02T11:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s2}", opened_at: "2026-09-02T11:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
          assert:
            - "err == ERR_ALLERGEN_CROSS_CONTACT on the freshly-cleaned but non-dedicated slicer"
            - "OpenedProductLog.${g1}.status == OPEN on the MILK-dedicated slicer"

      - name: allergen_cleaning_window_24_hour_boundary
        claim_type: temporal_validation
        grounds: ['validations[priority=8"]', 'errors[ERR_ALLERGEN_CROSS_CONTACT]']
        distinguishing_aspect: "Cleaning freshness window: cleaning_verified_at must be >= opened_at - 24h; +25h old cleaning fails while +23h passes for a non-dedicated allergen product."
        test_recipe:
          setup: ["approved A1; product P1 allergens [MILK], not dedicated; slicer S1 NONE cleaned at 2026-09-01T00:00:00Z (clock at submit time)"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
