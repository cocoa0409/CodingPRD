              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/accounts/${acct_id}/list"
              payload: {}
              as: AdvisorOperationsLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HouseholdAccount.${acct_id}.last_listed_at was null before the first listing"
            - "the first listing succeeds with last_listed_cents 0 and last_listed_at 2026-09-01T00:00:00Z"
            - "the immediate second listing is rejected at HTTP 409 with err_id == ERR_LISTING_COOLDOWN"
            - "HouseholdAccount.${acct_id}.last_listed_at is unchanged by the rejected call"

      - name: entitlement_duplicate_rejected_only_for_granted_siblings
        claim_type: Aggregate validation
        grounds:
          - validations[priority=20]
          - errors[ERR_ENTITLEMENT_DUPLICATE]
        distinguishing_aspect: "Duplication is evaluated over the firm's GRANTED set: two REQUESTED entitlements with the same code coexist, but granting the second while the first is GRANTED fails with ERR_ENTITLEMENT_DUPLICATE."
        test_recipe:
