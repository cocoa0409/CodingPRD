      - name: revoking_authorization_sweeps_the_training_credit_balance_into_forfeited
        claim_type: ledger_sync
        grounds:
          - state_machines.RepairProvider.transitions[APPLIED -> REVOKED]
          - calculations.training_credit_conservation
          - endpoints[POST /repair-program/repair-providers/{provider_id}/authorization-decision]
        distinguishing_aspect: |
          REVOKE moves the whole remaining balance into
          training_credit_forfeited_total in one step while the ACTIVE
          certification keeps its 2 consumed credits, so the conservation identity
          0 + 2 + 4 == 6 still holds after the sweep.
        test_recipe:
          setup:
            - "Region US-CA; provider with 4 technicians granted 6 credits and one ACTIVE certification (2 credits consumed), currently AUTHORIZED with balance 4."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Harbor Electronics Service", region_code: "US-CA", requested_access_tier: "TIER_2_SAFETY", technician_count: 4 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 6 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { granted: $.data.training_credit_granted_total }
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_2", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-07-01T00:00:00Z", exam_score: 91 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "AUTHORIZE", decision_reason: "coverage met" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { bal_before: $.data.training_credit_balance }
          trigger:
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "REVOKE", decision_reason: "counterfeit parts sourcing" }
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { forfeited: $.data.training_credit_forfeited_total, bal_after: $.data.training_credit_balance }
          assert:
            - "HTTP 200"
            - "${granted} == 6 and ${bal_before} == 4"
            - "${bal_after} == 0 and ${forfeited} == 4"
            - "TrainingCertification.${cert_id}.status is still ACTIVE with credits_consumed 2 — the sweep does not void certifications"
            - "conservation holds: 0 + 2 + 4 == 6"
            - "RepairProvider.authorization_status == REVOKED and parts_access_tier == null"

