      - name: dataset_delivery_moves_raw_to_cleaning_and_stamps_the_retention_clock
        claim_type: valid_transition
        grounds:
          - state_machines.Dataset.RAW_to_CLEANING
          - endpoints[POST /records-desk/datasets/{id}/delivery]
          - calculations.dataset_retention_expiry
        distinguishing_aspect: |
          The delivery transition is the one place where four things land at once: the state moves
          RAW -> CLEANING, record_count is populated from 0, format_negotiation_status resolves from
          REQUESTED to AGREED because delivered_format == negotiated_format, and retention_expires_at is
          computed as delivery date + Desk.retention_policy_days CALENDAR days at 23:59:59.000Z - 365
          calendar days after 2026-08-20 is 2027-08-20, which a business-day implementation would miss.
        test_recipe:
          setup:
            - "Desk with retention_policy_days 365; Agency; RecordsRequest submitted and RELEASED_FULL; Investigation; Dataset negotiated_format CSV, expected_field_count 1."
            - "Clock is advanced to 2026-08-20T14:30:00Z immediately before the delivery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
