      - name: pickup_confirm_blocked_by_suspended_partner
        grounds:
          - validations[priority=21]
          - state_machines.DonationPickup.SCHEDULED_to_CONFIRMED
          - entities.FoodBankPartner.fields.status
          - entities.DonationPickup.fields.partner_id
        distinguishing_aspect: |
          The blocking state lives on FoodBankPartner, a different entity from the DonationPickup
          being confirmed: with the partner SUSPENDED the confirm call fails with
          ERR_PARTNER_NOT_ACTIVE (409) and logistics_status stays SCHEDULED, and after the partner is
          PATCHed back to ACTIVE the same confirm call moves logistics_status to CONFIRMED.
        test_recipe:
          setup:
            - "Store 0412 in MID-ATL, donation_program_enabled true, dock door D1."
            - "One MID-ATL partner accepting PRODUCE, created ACTIVE, with one SCHEDULED pickup on D1 for 2026-08-12T14:00-16:00."
            - "The partner is then PATCHed to SUSPENDED, leaving the pickup untouched at logistics_status SCHEDULED and manifest_status DRAFT."
            - "Clock parked at 2026-08-12T13:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Mid-Atlantic Food Bank", contact_email: "ops@mafb.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"] }
              as: StoreOperationsAdmin
              captures: { partner_id: $.data.id, partner_status_initial: $.data.status }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-12T14:00:00.000Z", scheduled_window_end: "2026-08-12T16:00:00.000Z" }
              as: StoreOperationsAdmin
              captures: { pickup_id: $.data.id }
            - call: "PATCH /fresh/food-bank-partners/${partner_id}"
              payload: { status: "SUSPENDED" }
              as: StoreOperationsAdmin
              captures: { partner_status_suspended: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T13:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/donation-pickups/${pickup_id}/confirm"
              payload: {}
              as: DonationPartner
              as_user_id: "${partner_id}"
            - call: "PATCH /fresh/food-bank-partners/${partner_id}"
              payload: { status: "ACTIVE" }
              as: StoreOperationsAdmin
              captures: { partner_status_restored: $.data.status }
            - call: "POST /fresh/donation-pickups/${pickup_id}/confirm"
              payload: {}
              as: DonationPartner
              as_user_id: "${partner_id}"
              captures: { logi_after: $.data.logistics_status, manifest_after: $.data.manifest_status }
          assert:
            - "${partner_status_initial} == ACTIVE and ${partner_status_suspended} == SUSPENDED"
            - "the first confirm returns 409 with error_id ERR_PARTNER_NOT_ACTIVE"
            - "DonationPickup.${pickup_id}.logistics_status is still SCHEDULED after that rejection"
            - "${partner_status_restored} == ACTIVE"
            - "${logi_after} == CONFIRMED"
            - "${manifest_after} == DRAFT, untouched by the logistics transition"
            - "FoodBankPartner.${partner_id}.pickups_completed_count == 0"
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_window_closed_interval_with_thirty_minute_buffer
        grounds:
          - calculations.dock_window_conflict
          - validations[priority=28]
          - entities.DonationPickup.fields.scheduled_window_start
          - entities.Store.fields.dock_door_codes
        distinguishing_aspect: |
          Interval semantics: FULLY CLOSED comparison widened by a 30-minute turnaround buffer on
          both sides. Against an existing SCHEDULED window of [14:00, 16:00] on dock D1, a new window
          starting at exactly 16:30:00.000Z (P.end + the full buffer) is rejected with
          ERR_DOCK_WINDOW_OVERLAP, one starting at 16:30:01.000Z is accepted, and the rejected
          interval is accepted unchanged on dock D2 because the buffer is per dock door.
        test_recipe:
          setup:
            - "Store 0412 in MID-ATL with donation_program_enabled true and dock_door_codes [D1, D2]."
            - "One ACTIVE MID-ATL FoodBankPartner accepting PRODUCE."
            - "One existing SCHEDULED pickup P on dock D1 for [2026-08-12T14:00:00.000Z, 2026-08-12T16:00:00.000Z]."
            - "Clock parked at 2026-08-11T09:00:00.000Z; no manifest lines are needed because only the dock reservation is under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Mid-Atlantic Food Bank", contact_email: "ops@mafb.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"] }
              as: StoreOperationsAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-12T14:00:00.000Z", scheduled_window_end: "2026-08-12T16:00:00.000Z" }
              as: StoreOperationsAdmin
              captures: { pickup_p_id: $.data.id, p_logistics: $.data.logistics_status }
          trigger:
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-12T16:30:00.000Z", scheduled_window_end: "2026-08-12T18:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D2", scheduled_window_start: "2026-08-12T16:30:00.000Z", scheduled_window_end: "2026-08-12T18:00:00.000Z" }
              as: StoreOperationsAdmin
              captures: { pickup_d2_id: $.data.id, d2_door: $.data.dock_door_code }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-12T16:30:01.000Z", scheduled_window_end: "2026-08-12T18:30:00.000Z" }
              as: StoreOperationsAdmin
              captures: { pickup_late_id: $.data.id, late_start: $.data.scheduled_window_start }
          assert:
            - "${p_logistics} == SCHEDULED"
            - "the D1 window starting 2026-08-12T16:30:00.000Z returns 409 with error_id ERR_DOCK_WINDOW_OVERLAP"
            - "${d2_door} == 'D2' and the identical interval on dock D2 is created with code 201"
            - "${late_start} == '2026-08-12T16:30:01.000Z' and that D1 window is created with code 201"
            - "exactly three DonationPickup rows exist for store ${store_id}: ${pickup_p_id}, ${pickup_d2_id} and ${pickup_late_id}"
            - "DonationPickup.${pickup_late_id}.logistics_status == SCHEDULED and DonationPickup.${pickup_late_id}.manifest_status == DRAFT"
      - name: audit_window_half_open_touching_end_is_allowed
        grounds:
          - calculations.audit_window_conflict
          - validations[priority=29]
          - entities.ComplianceAudit.fields.window_start_at
          - entities.ComplianceAudit.fields.disposition_status
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) comparison with NO buffer -- the opposite
          convention from dock_window_conflict. Against an existing PENDING audit over
          [2026-08-17T00:00:00.000Z, 2026-08-20T00:00:00.000Z), a new audit starting one millisecond
          before the end (2026-08-19T23:59:59.999Z) is rejected with ERR_AUDIT_WINDOW_OVERLAP, while a
          new audit starting exactly at 2026-08-20T00:00:00.000Z abuts the old window and is accepted.
        test_recipe:
          setup:
            - "One BAKERY department on store 0412 with an ACTIVE ladder."
            - "One existing ComplianceAudit A on that department over [2026-08-17T00:00:00.000Z, 2026-08-20T00:00:00.000Z), sweep_status NOT_STARTED and disposition_status PENDING so it still occupies its window."
            - "Clock parked at 2026-08-18T00:00:00.000Z; no lots are needed because only the window reservation is under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "BAKERY-STD-2026", department_code: "BAKERY", rungs: [{ days_remaining_max: 2, discount_pct: 25, requires_manager_approval: false }, { days_remaining_max: 0, discount_pct: 50, requires_manager_approval: true }], sell_through_floor_pct: 60, max_total_discount_pct: 50 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "BAKERY", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/compliance-audits"
              payload: { department_id: "${dept_id}", window_start_at: "2026-08-17T00:00:00.000Z", window_end_at: "2026-08-20T00:00:00.000Z" }
              as: ComplianceAuditor
              captures: { audit_a_id: $.data.id, a_disposition: $.data.disposition_status, a_sweep: $.data.sweep_status }
          trigger:
            - call: "POST /fresh/compliance-audits"
              payload: { department_id: "${dept_id}", window_start_at: "2026-08-19T23:59:59.999Z", window_end_at: "2026-08-22T00:00:00.000Z" }
              as: ComplianceAuditor
            - call: "POST /fresh/compliance-audits"
              payload: { department_id: "${dept_id}", window_start_at: "2026-08-20T00:00:00.000Z", window_end_at: "2026-08-22T00:00:00.000Z" }
              as: ComplianceAuditor
              captures: { audit_b_id: $.data.id, b_start: $.data.window_start_at, b_severity: $.data.severity }
          assert:
            - "${a_disposition} == PENDING and ${a_sweep} == NOT_STARTED"
            - "the audit starting 2026-08-19T23:59:59.999Z returns 409 with error_id ERR_AUDIT_WINDOW_OVERLAP"
            - "${b_start} == '2026-08-20T00:00:00.000Z' and that audit is created with code 201"
            - "${b_severity} == NONE and ComplianceAudit.${audit_b_id}.sweep_status == NOT_STARTED"
            - "exactly two ComplianceAudit rows exist on department ${dept_id}: ${audit_a_id} and ${audit_b_id}"
            - "Department.${dept_id}.compliance_status == COMPLIANT, because neither audit has been swept"
  - rule_id: compensating_invariant
    instances:
      - name: units_conservation_restored_by_disputing_verified_shrink
        grounds:
          - calculations.lot_unit_conservation
          - state_machines.ShrinkEvent.VERIFIED_to_DISPUTED
          - calculations.shrink_cost_ratio
          - entities.DateCodeLot.fields.units_shrunk
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNITS on the lot. quantity_original 24 balances as
          24 == 14 + 4 + 6 + 0 while the shrink is VERIFIED and as 24 == 20 + 4 + 0 + 0 after the
          dispute reverses it, and every derived aggregate returns exactly to its pre-verification
          value (shrink_cost_ratio_pct 60.00 -> 0, compliance_status WATCH -> COMPLIANT) with no drift.
