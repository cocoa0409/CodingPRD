          Satisfaction is not the absence of a test - it is the assertion that a request which stands one
          unit away from six different rejections is accepted and produces exact numbers. The receipt holds
          44 units and the network needs exactly 44, so the pool ceiling (rung 35) is met with zero slack;
          every committed line sits at or above its presentation minimum and at or below its fixture
          capacity (rungs 13 and 14) - 0104 lands on 8 against a pmin of 6 and 0103 lands on 12 against a
          capacity of 20; the candidate set is non-empty and the total need is positive (rungs 30, 31); each
          store has exactly one shelf plan covering the clock (rung 25); and the committing manager differs
          from the proposing allocator (rung 12). The zero-need store 0102 is a candidate that gets no line,
          which is what makes the scorecard interesting: it dilutes the cluster it belongs to without ever
          appearing in the run.
