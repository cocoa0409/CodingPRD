            - { call: "POST /verification-requests", payload: { requester_id: "${rq_emp}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "ENROLLMENT", purpose: "LOAN_DEFERMENT" }, as: Requester, as_user_id: "${rq_emp}", captures: { err3: "$.data.error_id" } }
          assert:
            - "captured err1 == ERR_PURPOSE_NOT_PERMITTED (EMPLOYER may not use BACKGROUND_SCREEN)"
            - "captured err2 == ERR_PURPOSE_NOT_PERMITTED (BACKGROUND_SCREENER may not use INSURANCE)"
            - "captured err3 == ERR_PURPOSE_NOT_PERMITTED (LOAN_DEFERMENT is not purchasable)"

      - name: product_role_mismatch_denied
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_PURPOSE_NOT_PERMITTED]
        distinguishing_aspect: "Product/role exclusivity: a Requester creating TRANSCRIPT and a Learner creating DEGREE both fail with 422 ERR_PURPOSE_NOT_PERMITTED (TRANSCRIPT is Learner-only; DEGREE/ENROLLMENT are Requester-only)."
        test_recipe:
          setup:
            - "Compliant institution with student S1; VETTED EMPLOYER requester"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 100000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "TRANSCRIPT", purpose: "SELF" }, as: Requester, as_user_id: "${rq_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /verification-requests", payload: { student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Learner, as_user_id: "${st1}", captures: { err2: "$.data.error_id" } }
          assert:
            - "captured err1 == ERR_PURPOSE_NOT_PERMITTED (Requester may not order TRANSCRIPT)"
            - "captured err2 == ERR_PURPOSE_NOT_PERMITTED (Learner may not order DEGREE)"

      - name: directory_block_blocks_degree_create_but_not_consented_enrollment
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - errors[ERR_PRIVACY_BLOCKED]
        distinguishing_aspect: "DIRECTORY_BLOCK asymmetry at creation: it blocks DEGREE outright (ERR_PRIVACY_BLOCKED) but not ENROLLMENT, which instead requires consent_artifact == true and succeeds when consent is supplied."
        test_recipe:
          setup:
            - "Compliant institution with student S1; VETTED EMPLOYER requester; ACTIVE DIRECTORY_BLOCK on S1"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 100000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v: "$.data.version" } }
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "DIRECTORY_BLOCK", effective_from: "2026-01-01", expected_student_version: "${st_v}" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { err_deg: "$.data.error_id" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "ENROLLMENT", purpose: "EMPLOYMENT", consent_artifact: true }, as: Requester, as_user_id: "${rq_id}", captures: { enr_status: "$.data.status" } }
          assert:
            - "captured err_deg == ERR_PRIVACY_BLOCKED (DIRECTORY_BLOCK blocks DEGREE creation)"
            - "captured enr_status == QUOTED (DIRECTORY_BLOCK + ENROLLMENT passes with consent_artifact true)"

  # ---------------------------------------------------------------------------
  # Section: endpoints — envelope, pagination, filters, conditional actions
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: entries_list_pagination_envelope
        claim_type: standard_crud
        grounds:
          - entities.EnrollmentEntry.fields.row_index
        distinguishing_aspect: "List endpoints honor the fixed envelope pagination contract: with 12 entries the default page (limit 10, offset 0) reports total_count 12 and has_more true, and offset 10 returns the remaining 2 with has_more false."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall period; one file with 12 rows uploaded"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S01", full_name: "Stu One", date_of_birth: "2004-01-01", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S02", full_name: "Stu Two", date_of_birth: "2004-01-02", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S03", full_name: "Stu Three", date_of_birth: "2004-01-03", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S04", full_name: "Stu Four", date_of_birth: "2004-01-04", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S05", full_name: "Stu Five", date_of_birth: "2004-01-05", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S06", full_name: "Stu Six", date_of_birth: "2004-01-06", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S07", full_name: "Stu Seven", date_of_birth: "2004-01-07", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S08", full_name: "Stu Eight", date_of_birth: "2004-01-08", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S09", full_name: "Stu Nine", date_of_birth: "2004-01-09", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S10", full_name: "Stu Ten", date_of_birth: "2004-01-10", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S11", full_name: "Stu Eleven", date_of_birth: "2004-01-11", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S12", full_name: "Stu Twelve", date_of_birth: "2004-01-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
          trigger:
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { pg1_total: "$.meta.total_count", pg1_more: "$.meta.has_more", pg1_first: "$.data[0].student_ref", pg1_last: "$.data[9].student_ref" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}", limit: 10, offset: 10 }, as: ClearinghouseOps, captures: { pg2_total: "$.meta.total_count", pg2_more: "$.meta.has_more", pg2_first: "$.data[0].student_ref", pg2_last: "$.data[1].student_ref" } }
          assert:
            - "captured pg1_total == 12 and pg1_more == true (default limit 10)"
            - "captured pg1_first == S01 and pg1_last == S10 (row_index ASC within file)"
            - "captured pg2_total == 12 and pg2_more == false and pg2_first == S11 and pg2_last == S12"

      - name: file_list_filters_and_status_partition
        claim_type: standard_crud
        grounds:
          - entities.EnrollmentFile.fields.status
        distinguishing_aspect: "Certifying F1 then uploading F2 leaves F1 CERTIFIED (upload supersession applies only to UPLOADED files) and F2 UPLOADED: the status filter returns exactly one file per filter value and the unfiltered list returns both in created_at ASC."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall period; F1 certified, F2 uploaded afterwards"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { f1: "$.data.id" } }
            - { call: "POST /enrollment-files/${f1}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v2: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v2}", rows: [ { student_ref: "S2", full_name: "Second Student", date_of_birth: "2004-06-01", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { f2: "$.data.id" } }
          trigger:
            - { call: "GET /enrollment-files", payload: { institution_id: "${inst_id}", status: "CERTIFIED" }, as: ClearinghouseOps, captures: { c_total: "$.meta.total_count", c_id: "$.data[0].id" } }
            - { call: "GET /enrollment-files", payload: { institution_id: "${inst_id}", status: "UPLOADED" }, as: ClearinghouseOps, captures: { u_total: "$.meta.total_count", u_id: "$.data[0].id" } }
            - { call: "GET /enrollment-files", payload: { institution_id: "${inst_id}" }, as: ClearinghouseOps, captures: { all_total: "$.meta.total_count", all_first: "$.data[0].id" } }
          assert:
            - "captured c_total == 1 and c_id == ${f1} (certified file survives a later upload)"
            - "captured u_total == 1 and u_id == ${f2}"
            - "captured all_total == 2 and all_first == ${f1} (created_at ASC)"

      - name: response_envelope_shapes
        claim_type: standard_crud
        grounds:
          - errors[ERR_INSTITUTION_NOT_FOUND]
        distinguishing_aspect: "The fixed envelope holds on both paths: a successful create carries response_type object with meta.api_request_id present, and an error carries response_type error with data.error_id set."
        test_recipe:
          setup:
            - "One institution exists"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", ok_type: "$.response_type", ok_req: "$.meta.api_request_id" } }
          trigger:
            - { call: "GET /institutions/00000000-0000-0000-0000-000000000000", payload: {}, as: ClearinghouseOps, captures: { err_type: "$.response_type", err_id: "$.data.error_id" } }
          assert:
            - "captured ok_type == object and ok_req is a non-empty string"
            - "captured err_type == error and err_id == ERR_INSTITUTION_NOT_FOUND"

      - name: expired_quote_allows_identical_new_request
        claim_type: conditional_action
        grounds:
          - state_machines.VerificationRequest.QUOTED_to_EXPIRED
          - validations[priority=33]
        distinguishing_aspect: "The duplicate in-flight rule counts only QUOTED/PAID: once the first request has expired, an identical (requester, student, institution, product, purpose) create succeeds again as a fresh QUOTED request."
        test_recipe:
          setup:
            - "Compliant institution with student S1; VETTED requester; R1 DEGREE/EMPLOYMENT created at the default clock and expired at 2026-09-03"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 100000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: ClearinghouseOps }
          trigger:
            - { call: "GET /verification-requests/${r1}", payload: {}, as: ClearinghouseOps, captures: { r1_status: "$.data.status" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r2_status: "$.data.status", r2_id: "$.data.id" } }
          assert:
            - "captured r1_status == EXPIRED"
            - "captured r2_status == QUOTED and r2_id != ${r1} (EXPIRED is not in-flight, so no duplicate rejection)"

  # ---------------------------------------------------------------------------
  # Section: errors — every catalog error is triggerable (not-found family,
  # state/business triggers, and stubs for errors §1.8 already fires)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: err_period_not_found
        claim_type: not_found
        grounds:
          - validations[priority=9]
          - errors[ERR_PERIOD_NOT_FOUND]
        distinguishing_aspect: "Uploading against a non-existent reporting_period_id fails with 404 ERR_PERIOD_NOT_FOUND."
        test_recipe:
          setup:
            - "Compliant institution with one real period (its version captured for the OCC field)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "00000000-0000-0000-0000-000000000000", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_PERIOD_NOT_FOUND"

      - name: err_student_not_found
        claim_type: not_found
        grounds:
