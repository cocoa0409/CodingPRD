  - rule_id: boundary_precision_check
    instances:
      - name: daily_capacity_admits_exact_equality_and_rejects_one_hundredth_over
        grounds:
          - calculations.staff_daily_capacity
          - validations[priority=32]
          - errors[ERR_DAILY_CAPACITY_EXCEEDED]
          - entities.StaffMember.fields.daily_capacity_hours
        distinguishing_aspect: |
          The per-date capacity test is inclusive at equality: a 1-day booking of exactly
          10.00 h is admitted when daily_capacity_hours is 10.00, and the very next 0.01 h
          booking on the same date (aggregate 10.01) is rejected - a 0.01 boundary on the
          DAILY capacity of one calendar date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "Senior S1 has base_weekly_cap_hours 40.00 and no waiver and no logged history, so effective_weekly_cap_hours = 50.00 and daily_capacity_hours = round_half_up(50.00/5) = 10.00."
            - "Phase PH1 expects 60.00 hours in window 2026-08-03..2026-08-31 (required_level SENIOR), leaving room for both bookings."
            - "Booking A_EQ occupies the single date 2026-08-05 with allocated_hours 10.00 -> daily_hours 10.00, exactly equal to capacity."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
