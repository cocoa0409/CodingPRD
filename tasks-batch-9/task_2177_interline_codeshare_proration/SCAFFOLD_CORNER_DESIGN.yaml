              payload: { ticket_number: "0045000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 3, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 422 with data.error_id == ERR_COUPON_SEQUENCE_INVALID"
            - "Ticket.${t1}.coupon_count == 0 and Ticket.${t1}.version == 1"
            - "GET /interline/coupons with ticket_id ${t1} returns total_count 0"

