              as: PayrollClerk
              as_user_id: "pay-1"
          assert:
            - "TimesheetEntry.${t1}: ot_minutes == 0 and gross_pay_cents == 32000 (exactly 480 minutes earns no overtime)"
            - "TimesheetEntry.${t2}: ot_minutes == 1 and gross_pay_cents == 32100 (one minute past the breakpoint pays 1.5x for that minute)"

      - name: bonus_eligible_at_exact_mph_target_with_zero_pool
        grounds:
          - calculations.productivity_bonus
