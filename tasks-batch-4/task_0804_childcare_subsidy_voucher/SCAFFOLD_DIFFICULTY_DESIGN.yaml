            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "AttendanceRecord.${att_id}.status == SUBMITTED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: authorization_halfopen_interval_overlap
        grounds:
          - validations[priority=8]
          - entities.Authorization.fields.start_date
          - entities.Authorization.fields.end_date
          - errors[ERR_AUTHORIZATION_OVERLAP]
        distinguishing_aspect: |
          Half-open [start_date, end_date) overlap on the (family_id, child_name) resource: a second
          authorization [2026-06-01, 2026-12-01) overlaps the first [2026-03-01, 2026-09-01) and is rejected
          ERR_AUTHORIZATION_OVERLAP; adjacency (end==next start) would be allowed.
        test_recipe:
          setup:
            - "eligible Family + APPROVED determination + LICENSED provider + RateCeiling"
            - "first PENDING Authorization for child 'Kid One' [2026-03-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v1: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v1}" }
              as: CaseWorker
              captures: { auth1_id: $.data.id }
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v2: $.data.version }
          trigger:
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-06-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v2}" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_AUTHORIZATION_OVERLAP"

      - name: rate_ceiling_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - entities.RateCeiling.fields.effective_start
          - entities.RateCeiling.fields.effective_end
          - errors[ERR_RATE_CEILING_OVERLAP]
        distinguishing_aspect: |
          Closed [effective_start, effective_end] overlap on the (provider_type, care_level, state_code)
          resource: a second CENTER/TODDLER/CA ceiling [2026-06-30, 2026-12-31] shares the endpoint 2026-06-30
          with the first [2026-01-01, 2026-06-30] and is rejected -- shared endpoints count as overlap, unlike
          the half-open authorization rule; different resource entity.
        test_recipe:
          setup:
            - "one RateCeiling CENTER/TODDLER/CA [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5200, effective_start: "2026-06-30T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RATE_CEILING_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: provider_payment_ledger_conserved_on_reverse
        grounds:
          - invariants.provider_payment_ledger_conserved
          - state_machines.Payment.PAID_to_REVERSED
          - entities.Provider.fields.total_net_paid_cents
          - calculations.overpayment_amount
        distinguishing_aspect: |
          Conserved quantity = Provider.total_net_paid_cents: attendance approve adds 93072, payment reverse
          subtracts the same 93072, returning it to 0; the reversal also raises an OverpaymentClaim
          amount_cents == 93072.
        test_recipe:
          setup:
            - "ACTIVE Authorization; approved AttendanceRecord present=18 absent=3 -> Payment PAID net 93072"
            - "Provider.total_net_paid_cents == 93072 pre-reversal"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
            - call: "POST /ccdf/attendance-records/${att_id}/approve"
              payload: {}
              as: CaseWorker
            - call: "GET /ccdf/payments?attendance_record_id=${att_id}"
              payload: {}
              as: CaseWorker
              captures: { pay_id: "$.data[0].id" }
          trigger:
            - call: "POST /ccdf/payments/${pay_id}/reverse"
              payload: { reason: "audit clawback" }
              as: ProgramAdmin
