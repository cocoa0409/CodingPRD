# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id not found or scope mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request payload or missing required field" }
  - { id: ERR_INVALID_FORMAT, http: 422, condition: "Field format violation (e.g., cycle_label, academic_year)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in correct state for the requested transition" }
  - { id: ERR_CHAPTER_FROZEN, http: 409, condition: "Chapter SUSPENDED or DISSOLVED; child mutations blocked" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on parent version" }
  - { id: ERR_STALE_CHAPTER_VERSION, http: 412, condition: "Chapter version stale on advisor-approve" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "Member version stale on dismiss" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "MembershipCycle version stale on induct" }
  - { id: ERR_ATHLETICS_CONFLICT, http: 409, condition: "Operation conflicts with an ACTIVE AthleticsCalendarBlock" }
  - { id: ERR_INVALID_ATHLETICS_BLOCK, http: 422, condition: "block_start >= block_end" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 409, condition: "Director approving equals advisor approving" }
  - { id: ERR_GPA_BELOW_THRESHOLD, http: 422, condition: "Nominee GPA below chapter thresholds" }
  - { id: ERR_ELIGIBILITY_SCORE_BELOW_THRESHOLD, http: 422, condition: "Application eligibility_score below 70.00" }
  - { id: ERR_INVALID_SERVICE_HOURS, http: 422, condition: "Service hours not in (0, 12] or not a 0.25 multiple" }
  - { id: ERR_FUTURE_SERVICE_DATE, http: 422, condition: "service_date after current logical clock" }
  - { id: ERR_ACTIVE_CYCLE_EXISTS, http: 409, condition: "A MembershipCycle already exists in active states" }
  - { id: ERR_INVALID_CYCLE_DATE, http: 422, condition: "Cycle dates out of order or in the past" }
  - { id: ERR_EMPTY_CANDIDATE_POOL, http: 409, condition: "No candidates at close-nominations" }
  - { id: ERR_NO_INDUCTED_APPLICATIONS, http: 409, condition: "Cycle close requires at least one INDUCTED application" }
  - { id: ERR_INSUFFICIENT_CHAPTER_FUNDS, http: 409, condition: "Chapter fund_balance insufficient for upfront_cost" }
  - { id: ERR_INSUFFICIENT_FUNDS_FOR_REMITTANCE, http: 409, condition: "Chapter fund_balance insufficient to remit dues" }
  - { id: ERR_ELECTION_ALREADY_OPEN, http: 409, condition: "Another election already OPEN or TALLIED" }
  - { id: ERR_OFFICE_ALREADY_OCCUPIED, http: 409, condition: "An ACTIVE OfficerRole already holds this office" }
  - { id: ERR_NO_VOTES_CAST, http: 409, condition: "Cannot tally an election with zero CAST votes" }
  - { id: ERR_RUNOFF_REQUIRED, http: 409, condition: "Tally produced a tie; runoff required" }
  - { id: ERR_DEPOSIT_NOT_CLEARED, http: 409, condition: "Fundraiser close requires cleared deposit ledger entry" }
  - { id: ERR_NOT_AN_OFFICER, http: 403, condition: "Caller does not hold an ACTIVE OfficerRole" }
  - { id: ERR_MEMBER_MISMATCH, http: 403, condition: "Caller X-User-ID does not match the Member.id" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Probation appeal window (14 days) has passed" }
  - { id: ERR_DISMISSAL_REQUIRES_CAUSE, http: 422, condition: "Dismissal requires probation_strikes >= 2 or override_reason" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Voter has already cast a vote in this election" }
  - { id: ERR_INVALID_VOTE_STATE, http: 409, condition: "Vote attempted when election not OPEN" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ActivitiesDirector
    description: "District-level activities director; top of approval chain; segregation of duties vs Advisor on funds"
    identity: opaque
    exclusive_operations:
      - "POST /chapters — Create chapter"
      - "POST /chapters/{id}/activate — Activate chapter"
      - "POST /chapters/{id}/suspend — Suspend chapter"
      - "POST /chapters/{id}/reinstate — Reinstate chapter"
      - "POST /chapters/{id}/dissolve — Dissolve chapter"
      - "POST /chapters/{id}/fundraiser-requests/{id}/director-approve — Director approval (segregation of duties enforced vs Advisor)"
      - "POST /_clock/set_current_utc — Advance logical clock"
    shared_operations:
      - "GET /chapters, /chapters/{id}, /chapters/{id}/standing — Read chapter state"
      - "GET on all child collections (members, cycles, applications, elections, votes, roles, minutes, fundraisers, ledger, dues, probations, athletics)"

  - name: Advisor
    description: "Faculty advisor for the chapter; mid-tier approval; cannot approve own fundraisers at director level"
    identity: opaque
    exclusive_operations:
      - "POST /chapters/{id}/members — Register prospective member"
      - "POST /chapters/{id}/membership-cycles — Create cycle"
      - "POST /chapters/{id}/membership-cycles/{id}/open-nominations|close-nominations|induct|close|cancel — Cycle lifecycle"
      - "POST /chapters/{id}/members/{id}/nominate|reinstate|dismiss|graduate — Member lifecycle"
      - "POST /chapters/{id}/membership-cycles/{id}/applications/{id}/approve|reject — Application review"
      - "POST /chapters/{id}/members/{id}/service-hour-entries/{id}/verify|reject|void — Service hour verification"
      - "POST /chapters/{id}/elections — Create election; open|tally|certify|void — Election lifecycle"
      - "POST /chapters/{id}/meeting-minutes/{id}/approve — Approve minutes"
      - "POST /chapters/{id}/fundraiser-requests/{id}/advisor-approve — Advisor approval (OCC on Chapter)"
      - "POST /chapters/{id}/fundraiser-requests/{id}/close — Close fundraiser"
      - "POST /chapters/{id}/fund-ledger-entries/{id}/clear|void — Ledger clearing"
      - "POST /chapters/{id}/members/{id}/dues-payments/{id}/remit|void|refund — Dues lifecycle"
      - "POST /chapters/{id}/members/{id}/probation-cases — Open case; appeal response; resolve|dismiss-case"
      - "POST /chapters/{id}/officer-roles/{id}/remove — Remove an officer"
      - "POST /chapters/{id}/athletics-blocks — Create athletics block"
      - "POST /chapters/{id}/athletics-blocks/{id}/cancel — Cancel athletics block"
    shared_operations:
      - "GET on chapter, members, cycles, applications, elections, votes, roles, minutes, fundraisers, ledger, dues, probations, athletics"

  - name: Officer
    description: "Elected chapter officer (President, VP, Secretary, Treasurer, Historian); identity backed by Member entity"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /chapters/{id}/meeting-minutes — Draft minutes"
      - "POST /chapters/{id}/meeting-minutes/{id}/submit — Submit minutes (SECRETARY only)"
      - "POST /chapters/{id}/meeting-minutes/{id}/amend — Amend minutes (SECRETARY only)"
      - "POST /chapters/{id}/fundraiser-requests — Create fundraiser"
      - "POST /chapters/{id}/fundraiser-requests/{id}/submit — Submit fundraiser"
      - "POST /chapters/{id}/fundraiser-requests/{id}/execute — Execute fundraiser with actuals"
      - "POST /chapters/{id}/officer-roles/{id}/resign — Resign (self)"
    shared_operations:
      - "POST /chapters/{id}/members/{id}/service-hour-entries — Log own service hours"
      - "POST /chapters/{id}/members/{id}/dues-payments — Pay own dues"
      - "GET on chapter, members, cycles, applications, elections, roles, minutes, fundraisers, ledger, dues, probations, athletics"

  - name: Member
    description: "Chapter member (or candidate); identity backed by Member entity"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /chapters/{id}/elections/{id}/votes — Cast vote"
      - "POST /chapters/{id}/membership-cycles/{id}/applications/{id}/withdraw — Withdraw own application"
      - "POST /chapters/{id}/members/{id}/probation-cases/{id}/appeal — Appeal own probation case"
    shared_operations:
      - "POST /chapters/{id}/members/{id}/service-hour-entries — Log own service hours"
      - "POST /chapters/{id}/members/{id}/dues-payments — Pay own dues"
      - "GET on own member record, chapter summary, elections, minutes"
