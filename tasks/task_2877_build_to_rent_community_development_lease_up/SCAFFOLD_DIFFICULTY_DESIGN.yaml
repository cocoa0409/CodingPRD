            - call: "POST /communities"
              payload: { name: "Ravensdale", market_code: "TX-AUS", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 2000000, facility_commitment_cents: 40000000, maintenance_tech_headcount: 1 }
