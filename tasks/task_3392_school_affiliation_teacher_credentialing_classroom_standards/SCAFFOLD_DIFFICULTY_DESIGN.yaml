              as: SchoolAdmin
              as_user_id: "${x_id}"
              captures: { cx_id: $.data.id }
            - call: "POST /society/classroom-audits"
              payload: { classroom_id: "${cx_id}", students_present: 31, adults_present: 2, observed_uninterrupted_minutes: 180, materials_groups: [ { domain: "PRACTICAL_LIFE", required_count: 10, present_count: 9 }, { domain: "SENSORIAL", required_count: 10, present_count: 9 } ] }
              as: Consultant
              as_user_id: "con-ada"
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/classroom-audits"
              payload: { classroom_id: "${cx_id}", students_present: 30, adults_present: 2, observed_uninterrupted_minutes: 180, materials_groups: [ { domain: "PRACTICAL_LIFE", required_count: 10, present_count: 9 }, { domain: "SENSORIAL", required_count: 10, present_count: 9 } ] }
              as: Consultant
              as_user_id: "con-ada"
            - call: "POST /society/school-applications"
              payload: { school_id: "${x_id}", type: "AFFILIATION", expected_school_version: "${x_v}" }
              as: SchoolAdmin
              as_user_id: "${x_id}"
              captures: { xa1: $.data.id }
            - call: "POST /society/school-applications/${xa1}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${x_id}"
            - call: "POST /society/school-applications/${xa1}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
            - call: "GET /society/schools/${x_id}"
              payload: {}
              as: SocietyAdmin
              captures: { x_v2: $.data.version }
            - call: "POST /society/school-applications"
