  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: final_weighted_pct_exactly_95_00_yields_accredited_not_with_correction
        grounds:
          - calculations.accreditation_decision_level
          - calculations.accreditation_decision_level.final_weighted_pct
          - state_machines.StandardEvaluation.UNSCORED_to_LOCKED
          - entities.AccreditationCycle.fields.final_weighted_pct
          - entities.Camp.fields.prior_accredited_cycle_count
          - entities.Camp.fields.last_accredited_year
          - calculations.accreditation_fee_assessment
        distinguishing_aspect: |
          The exact-equality edge of a strict less-than comparison on a two-decimal
          percentage: weights 5+5+4+3+2 met out of 20 applicable weight is 19/20,
          which is 95.00 to the cent with no rounding involved, so the level lands on
          ACCREDITED and not ACCREDITED_WITH_CORRECTION. The missing weight comes from
          a non-mandatory row deliberately left unscored, which contributes to the
          weighted denominator with no numerator credit yet raises no deficiency, so
          the cycle closes and the camp's accredited counters increment.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-B is PUBLISHED with six universal SUPERVISION standards: SB.1 weight 5 mandatory, SB.2 weight 5 mandatory, SB.3 weight 4 mandatory, SB.4 weight 3 mandatory, SB.5 weight 2 mandatory and SB.6 weight 1 non-mandatory, so the applicable weight total is 20."
            - "Birch Day Camp is a DAY / YOUTH_ONLY camp in OH with no program elements, health_staffing_level FIRST_AIDER_ONLY and prior_accredited_cycle_count 0."
            - "All six evaluations are self scored MET and the self-assessment is submitted."
            - "At logical clock 2026-09-02T09:00:00Z the team scores the five mandatory standards MET with score_source OBSERVED and leaves the non-mandatory SB.6 with no visitor_score at all."
