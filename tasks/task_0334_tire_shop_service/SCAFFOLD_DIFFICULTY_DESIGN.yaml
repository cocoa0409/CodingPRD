          - state_machines.MileageWarrantyClaim.SUBMITTED_to_APPROVED
          - errors[ERR_MILEAGE_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the miles_driven vs mileage_warranty_miles threshold via
          POST /mileage-claims/{id}/approve: eligibility requires miles_driven < warranty
          (strict). miles_driven == 60000 with warranty 60000 is NOT eligible -> ERR_MILEAGE_EXCEEDED,
          confirming the >= cutoff is excluded.
