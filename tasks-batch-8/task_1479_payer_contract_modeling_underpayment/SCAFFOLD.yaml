  - method: POST
    path: "/api/contract-proposals/{id}/record_counter"
    description: "Record a payer counter-offer"
    roles: [ContractManager]
    code: 200
    input: []
    output: ContractProposal
    side_effects: ["status SUBMITTED -> COUNTERED", "increments ContractProposal.version by 1"]
  - method: POST
