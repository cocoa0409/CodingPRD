    instances:

      - name: sliding_fee_rounding_order_round_each_line_then_sum
        grounds:
          - calculations.patient_responsibility_cents
          - calculations.sliding_fee_band
          - entities.Coverage.fields.sliding_fee_band
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents. A band-D uninsured encounter with
          five PERFORMED procedures {D0190, D0150, D1206, D1351, D1351} yields 17242 cents when each
          line is rounded half-up before summing, and 17241 cents when the subtotal is discounted and
          rounded once. The scaffold pins round-per-line-then-sum, so 17242 is the only correct answer.
