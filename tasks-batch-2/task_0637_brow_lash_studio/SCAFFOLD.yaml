# =============================================================================
# Brow & Lash Studio (Amazing Lash style) — benchmark seed tables (v1)
# Expert difficulty band (§0.4)
# =============================================================================

scenario: |
  637. Brow & Lash Studio (Amazing Lash style): service (full/fill/lift/tint) &
  duration, membership & rollover credits, lash-tech assignment & fill-timing
  rules, patch-test/consent, retail & add-on, no-show & deposit, recurring fill
  scheduling, sanitation log

domain_name: brow-lash-studio
api_prefix: ""   # flat topology: every entity has a top-level collection (/studios, /service-types, /members, /appointments, ...) with studio/parent scoping via FK fields, not URL nesting

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy            # server picks the lash-tech from a candidate pool
    - derived_field_reconciliation  # membership credit_balance / rollover recomputed
    - optimistic_concurrency     # OCC on Membership.version when consuming credits
    - scheduled_deferred_actions # logical clock drives fill-window / no-show deadlines

  entity_topology: flat
  # Every entity is a top-level collection linked by FK fields (studio_id, member_id,
  # plan_id, service_type_id, membership_id, lash_tech_id, appointment_id,
  # recurring_schedule_id) carried in request bodies — no URL nesting. Studio is the
  # scoping root referenced by studio_id; CreditLedgerEntry is the one append-only
  # sub-resource (read via /memberships/{id}/credit-ledger).

  state_machine_shape: cyclic
  # Membership: ACTIVE -> PAST_DUE -> ACTIVE (recover) / -> SUSPENDED -> ACTIVE (reactivate) — cyclic.
  # Appointment: branching fork-join (BOOKED -> {COMPLETED, NO_SHOW, LATE_CANCELLED, CANCELLED}) with
  #   divergent side-effect sets per branch.
  # RecurringFillSchedule: ACTIVE -> (spawns appt) -> ACTIVE — cyclic.

  relationship_patterns:
    - one_to_many        # Studio -> LashTech / Member / Appointment / SanitationLog
    - cross_aggregate    # Appointment references ServiceType, LashTech, Member, Membership
    - polymorphic        # CreditLedgerEntry.source_ref_id points to Appointment | Membership | RecurringFillSchedule

  role_model: peer_roles
  # StudioManager (operator), FrontDesk (operator), LashTech (entity-backed), Member (entity-backed).

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration root ----
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Studio location name" }
      - { name: deposit_rate_pct, type: number, source: input, default: 0.20, description: "Fraction of service base price taken as booking deposit; round_half_up to cent", constraints: "0 <= deposit_rate_pct <= 1" }
      - { name: late_cancel_cutoff_hours, type: integer, source: input, default: 24, description: "Hours before appointment start under which a cancel is a LATE_CANCELLED (forfeits half deposit)", constraints: ">= 0" }
      - { name: noshow_strike_window_days, type: integer, source: input, default: 90, description: "Rolling window (days) over which no-show strikes accumulate" }
      - { name: noshow_strike_threshold, type: integer, source: input, default: 3, description: "Strike count (>=) within window that auto-suspends a Membership" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED", constraints: "OPEN, CLOSED" }

  - name: ServiceType
    parent: Studio
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; owning studio" }
      - { name: code, type: enum, source: input, description: "FULL_SET | FILL | LIFT | TINT", constraints: "FULL_SET, FILL, LIFT, TINT" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: duration_minutes, type: integer, source: input, description: "Chair time required for this service", constraints: "> 0" }
      - { name: base_price_cents, type: integer, source: input, description: "Cash price in cents; deposit is derived from this", constraints: ">= 0" }
      - { name: credit_cost, type: integer, source: input, description: "Membership credits consumed when booked on a membership", constraints: ">= 0" }
      - { name: category, type: enum, source: input, description: "PREMIUM (FULL_SET, LIFT) | STANDARD (FILL, TINT); drives peak surcharge eligibility", constraints: "PREMIUM, STANDARD" }
      - { name: requires_patch_test, type: boolean, source: input, default: true, description: "Whether a valid ConsentPatchTest is required to book this service" }
      - { name: active, type: boolean, source: system, default: true, description: "False once retired; retired types cannot be booked" }

  - name: MembershipPlan
    parent: Studio
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; owning studio" }
      - { name: tier, type: enum, source: input, description: "ESSENTIAL | PREMIER | LUXE", constraints: "ESSENTIAL, PREMIER, LUXE" }
      - { name: monthly_credit_allotment, type: integer, source: input, description: "Credits granted at each billing-cycle close", constraints: "> 0" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly membership fee in cents", constraints: ">= 0" }
      - { name: rollover_cap_multiplier, type: number, source: input, default: 1.0, description: "Max rollover = floor(monthly_credit_allotment * rollover_cap_multiplier)", constraints: ">= 0" }
      - { name: loyalty_discount_pct, type: number, source: input, default: 0.10, description: "Per-line retail/add-on discount fraction for members on this plan", constraints: "0 <= loyalty_discount_pct <= 1" }

  # ---- Resources ----
  - name: LashTech
    parent: Studio
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; owning studio" }
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: skill_level, type: integer, source: input, description: "1=junior .. 3=master; PREMIUM services require >= 2", constraints: "1 <= skill_level <= 3" }
      - { name: station_number, type: integer, source: input, description: "Physical chair/station this tech occupies (unique within a Studio)", constraints: ">= 1" }
      - { name: station_sanitized_through_utc, type: datetime, source: computed, description: "End of the validity window of this tech's most recent COMPLETED SanitationLog; null if none. Appointment start must be <= this." }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | OFF_DUTY; OFF_DUTY techs are excluded from assignment", constraints: "AVAILABLE, OFF_DUTY" }

  - name: Member
    parent: Studio
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; owning studio" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: email, type: string, source: input, description: "Contact email; unique within a Studio" }
      - { name: noshow_strike_count, type: integer, source: computed, description: "Count of this member's Appointments in NO_SHOW whose appointment start_utc is within Studio.noshow_strike_window_days before the current clock; recomputed on every no-show and on read" }
      - { name: last_premium_completed_utc, type: datetime, source: computed, description: "start_utc of this member's most recent COMPLETED Appointment whose ServiceType.category == PREMIUM; null if none. Anchors fill-timing window." }

  - name: Membership
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: plan_id, type: string, source: system, description: "FK -> MembershipPlan.id; chosen plan" }
      - { name: credit_balance, type: integer, source: computed, description: "Available credits = sum of CreditLedgerEntry.delta for this membership; never negative", constraints: ">= 0" }
      - { name: cycle_anchor_utc, type: datetime, source: input, description: "Day-of-month anchor for billing cycle close" }
      - { name: cycles_closed, type: integer, source: computed, default: 0, description: "Number of billing-cycle closes applied to date" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAST_DUE | SUSPENDED | CANCELLED", constraints: "ACTIVE, PAST_DUE, SUSPENDED, CANCELLED" }

  - name: ConsentPatchTest
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member who consented" }
      - { name: administered_utc, type: datetime, source: input, description: "When the patch test was administered and consent recorded" }
      - { name: valid_through_utc, type: datetime, source: computed, description: "administered_utc + PATCH_TEST_VALIDITY_DAYS; service blocked if clock > this" }
      - { name: consent_signed, type: boolean, source: input, description: "True only if the member signed the consent waiver; a false value is rejected at creation" }
      - { name: status, type: enum, source: system, default: "VALID", description: "VALID | EXPIRED | REVOKED", constraints: "VALID, EXPIRED, REVOKED" }

  - name: Appointment
    parent: Studio
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; owning studio" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booking member" }
      - { name: service_type_id, type: string, source: input, description: "FK -> ServiceType.id; service booked" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; set when paid with credits, else null", constraints: "nullable" }
      - { name: lash_tech_id, type: string, source: computed, description: "FK -> LashTech.id; server-assigned from the candidate pool by the selector policy" }
      - { name: recurring_schedule_id, type: string, source: system, description: "FK -> RecurringFillSchedule.id; set when spawned by a recurring schedule, else null", constraints: "nullable" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start instant" }
      - { name: end_utc, type: datetime, source: computed, description: "start_utc + ServiceType.duration_minutes" }
      - { name: pay_with_credits, type: boolean, source: input, default: false, description: "True to consume membership credits; false to pay deposit in cash" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(ServiceType.base_price_cents * Studio.deposit_rate_pct); 0 when pay_with_credits" }
      - { name: credits_charged, type: integer, source: computed, description: "ServiceType.credit_cost when pay_with_credits else 0" }
      - { name: deposit_forfeited_cents, type: computed, source: computed, description: "Deposit kept by studio on NO_SHOW/LATE_CANCELLED; 0 otherwise" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | COMPLETED | NO_SHOW | LATE_CANCELLED | CANCELLED", constraints: "BOOKED, COMPLETED, NO_SHOW, LATE_CANCELLED, CANCELLED" }

  - name: RetailOrder
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; purchasing member" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; appointment the add-on retail attaches to" }
      - { name: lines, type: array, source: input, description: "Array of {sku, unit_price_cents, quantity}; >= 1 line required" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Per-line: round_half_up(unit_price_cents * quantity * (1 - loyalty_discount_pct)), THEN sum over lines" }
      - { name: peak_surcharge_cents, type: integer, source: computed, description: "Peak add-on surcharge; see calculations.retail_order_total" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + peak_surcharge_cents" }
      - { name: status, type: enum, source: system, default: "PAID", description: "PAID | VOIDED", constraints: "PAID, VOIDED" }

  - name: RecurringFillSchedule
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: service_type_id, type: string, source: input, description: "FK -> ServiceType.id; must be a FILL service" }
      - { name: cadence_days, type: integer, source: input, description: "Days between successive fills", constraints: "MIN_FILL_GAP_DAYS <= cadence_days <= MAX_FILL_WINDOW_DAYS" }
      - { name: first_start_utc, type: datetime, source: input, description: "Start instant of the first fill in the series" }
      - { name: next_due_utc, type: datetime, source: computed, description: "Start instant the next spawned fill should target; advances by cadence_days on each spawn" }
      - { name: spawned_count, type: integer, source: computed, default: 0, description: "Number of Appointments spawned by this schedule" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | ENDED", constraints: "ACTIVE, PAUSED, ENDED" }

  - name: SanitationLog
    parent: LashTech
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: lash_tech_id, type: string, source: system, description: "FK -> LashTech.id; station/tech sanitized" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the operator who logged it" }
      - { name: sanitized_at_utc, type: datetime, source: input, description: "When sanitation was performed" }
      - { name: valid_through_utc, type: datetime, source: computed, description: "sanitized_at_utc + SANITATION_VALIDITY_HOURS" }
      - { name: status, type: enum, source: system, default: "COMPLETED", description: "COMPLETED | VOIDED", constraints: "COMPLETED, VOIDED" }

  - name: CreditLedgerEntry
    parent: Membership
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; ledger owner" }
      - { name: delta, type: integer, source: system, description: "Signed credit movement (+allotment/+rollover/+refund, -consumption, -forfeit)" }
      - { name: reason, type: enum, source: system, description: "GRANT | ROLLOVER | ROLLOVER_FORFEIT | CONSUME | REFUND", constraints: "GRANT, ROLLOVER, ROLLOVER_FORFEIT, CONSUME, REFUND" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic ref: Appointment.id (CONSUME/REFUND) | Membership.id (GRANT/ROLLOVER/ROLLOVER_FORFEIT)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; ledger entries are append-only and ordered by this for replay" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Membership: cyclic (PAST_DUE recover, SUSPENDED reactivate) ----
  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/close-cycle"
        actor: StudioManager
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "ROLLOVER reconciliation runs (calculations.cycle_rollover): carried = min(credit_balance, floor(plan.monthly_credit_allotment * plan.rollover_cap_multiplier)); a ROLLOVER_FORFEIT CreditLedgerEntry of -(credit_balance - carried) is appended when credit_balance > carried"
          - "A ROLLOVER CreditLedgerEntry restoring balance to `carried` then a GRANT entry of +plan.monthly_credit_allotment are appended (net effect: credit_balance = carried + monthly_credit_allotment)"
          - "cycles_closed += 1; cycle_anchor_utc advanced by one month"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /memberships/{id}/flag-past-due"
        actor: StudioManager
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "Credit booking is blocked while PAST_DUE (see Appointment BOOKED precondition)"
          - "increments Membership.version by 1"

      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /memberships/{id}/settle-dues"
        actor: StudioManager
        preconditions:
          - "Membership.status == PAST_DUE"
        side_effects:
          - "increments Membership.version by 1"

      - from: [ACTIVE, PAST_DUE]
        to: SUSPENDED
        trigger: "system (member's noshow_strike_count reaches Studio.noshow_strike_threshold after a NO_SHOW is recorded)"
        actor: system
        preconditions:
          - "member.noshow_strike_count >= Studio.noshow_strike_threshold"
        side_effects:
          - "All this member's BOOKED Appointments with start_utc in the future are auto-cancelled to CANCELLED (cascade); each credit-paid one refunds its credits and each cash one forfeits nothing (the suspension, not the member, cancels them)"
          - "increments Membership.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{id}/reactivate"
        actor: StudioManager
        preconditions:
          - "Membership.status == SUSPENDED"
          - "member.noshow_strike_count < Studio.noshow_strike_threshold (strikes must have aged out of the rolling window) (ERR_STRIKES_STILL_ACTIVE)"
        side_effects:
          - "increments Membership.version by 1"

      - from: [ACTIVE, PAST_DUE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel-membership"
        actor: StudioManager
        preconditions: []
        side_effects:
          - "Any linked ACTIVE RecurringFillSchedule for this member transitions ACTIVE -> ENDED (cascade)"
          - "increments Membership.version by 1"

  # ---- Appointment: branching fork-join with divergent side-effects ----
  - entity: Appointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, LATE_CANCELLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: LashTech
        preconditions:
          - "Appointment.status == BOOKED"
          - "current clock >= Appointment.start_utc (ERR_APPOINTMENT_NOT_STARTED)"
        side_effects:
          - "Member.last_premium_completed_utc recomputed (if ServiceType.category == PREMIUM)"
          - "If spawned by a RecurringFillSchedule: schedule.next_due_utc and spawned_count already advanced at spawn; no further change"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment.status == BOOKED"
          - "current clock >= Appointment.start_utc (ERR_APPOINTMENT_NOT_STARTED)"
        side_effects:
          - "deposit_forfeited_cents = deposit_cents (full deposit forfeited); cash deposit kept"
          - "If credit-paid: NO refund — credits_charged stay consumed"
          - "Member.noshow_strike_count recomputed; if it reaches Studio.noshow_strike_threshold, Membership ACTIVE/PAST_DUE -> SUSPENDED (cascade, see Membership SM)"

      - from: BOOKED
        to: LATE_CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: [Member, FrontDesk]
        preconditions:
          - "Appointment.status == BOOKED"
          - "current clock is within Studio.late_cancel_cutoff_hours before start_utc (i.e. start_utc - now < cutoff) and current clock < start_utc"
        side_effects:
          - "deposit_forfeited_cents = round_half_up(deposit_cents * 0.50) (half deposit forfeited)"
          - "If credit-paid: a REFUND CreditLedgerEntry of +credits_charged is appended (credits returned)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: [Member, FrontDesk]
        preconditions:
          - "Appointment.status == BOOKED"
          - "current clock is at or before Studio.late_cancel_cutoff_hours before start_utc (start_utc - now >= cutoff) (timely cancel)"
        side_effects:
          - "deposit_forfeited_cents = 0 (cash deposit fully refundable)"
          - "If credit-paid: a REFUND CreditLedgerEntry of +credits_charged is appended (credits returned)"
          - "If spawned by a RecurringFillSchedule: schedule.next_due_utc is rewound by cadence_days and spawned_count -= 1 (the slot is reclaimed)"

  # ---- RecurringFillSchedule: cyclic spawn loop ----
  - entity: RecurringFillSchedule
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /recurring-schedules/{id}/spawn-next"
        actor: FrontDesk
        preconditions:
          - "RecurringFillSchedule.status == ACTIVE"
          - "next_due_utc is anchored so the spawned FILL satisfies the fill-timing window vs member.last_premium_completed_utc (ERR_FILL_WINDOW_VIOLATION)"
          - "Member's Membership is ACTIVE (ERR_MEMBERSHIP_NOT_BOOKABLE)"
        side_effects:
          - "A new Appointment (BOOKED, recurring_schedule_id set, start_utc = next_due_utc, pay_with_credits = true) is created via the full booking pipeline (selector + credit consume)"
          - "next_due_utc += cadence_days; spawned_count += 1"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /recurring-schedules/{id}/pause"
        actor: [Member, FrontDesk]
        preconditions:
          - "RecurringFillSchedule.status == ACTIVE"
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /recurring-schedules/{id}/resume"
        actor: [Member, FrontDesk]
        preconditions:
          - "RecurringFillSchedule.status == PAUSED"
        side_effects: []

      - from: [ACTIVE, PAUSED]
        to: ENDED
        trigger: "POST /recurring-schedules/{id}/end OR system (member Membership CANCELLED)"
        actor: [Member, FrontDesk, system]
        preconditions: []
        side_effects: []

  # ---- ConsentPatchTest: linear with auto-expiry + manual revoke ----
  - entity: ConsentPatchTest
    field: status
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system (current clock > valid_through_utc, evaluated when the patch test is read or used to gate a booking)"
        actor: system
        preconditions:
          - "current clock > valid_through_utc"
        side_effects: []

      - from: VALID
        to: REVOKED
        trigger: "POST /patch-tests/{id}/revoke"
        actor: [Member, StudioManager]
        preconditions:
          - "ConsentPatchTest.status == VALID"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: credit-book-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /appointments"
    occ_field: "expected_membership_version"
    description: |
      Booking a credit-paid Appointment against a Membership whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A credit booking debits the membership (appending a CONSUME ledger
      entry and bumping Membership.version), and a cycle close / refund / earlier
      booking may also have advanced it; if the booking request carries a version
      the client read before any of those, the membership view is stale and the
      booking is rejected.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

  - rule_id: rollover-close-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/close-cycle"
    occ_field: "expected_membership_version"
    description: |
      Closing a billing cycle (which reconciles rollover and grants the monthly
      allotment, mutating the credit balance) against a Membership whose version
      has advanced since the client last read it is rejected. A prior booking,
      refund, or earlier cycle close legitimately advances the version; a close
      request carrying the pre-advance version is operating on a stale view and
      is rejected so the rollover math is not applied on top of unseen balance
      movements.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1: deposit forfeiture (Appointment domain) ---
  - name: deposit_forfeiture
    trigger: "Appointment transition out of BOOKED to NO_SHOW / LATE_CANCELLED / CANCELLED"
    algorithm: threshold
    formula: |
      deposit_cents = round_half_up(service_type.base_price_cents * studio.deposit_rate_pct)  # fixed at booking
      on transition:
        if to == NO_SHOW:        deposit_forfeited_cents = deposit_cents                       # full
        elif to == LATE_CANCELLED: deposit_forfeited_cents = round_half_up(deposit_cents * 0.50) # half
        elif to == CANCELLED:    deposit_forfeited_cents = 0                                    # none
      Late-vs-timely boundary: 'late' when (start_utc - now) < studio.late_cancel_cutoff_hours hours
      AND now < start_utc; 'timely' when (start_utc - now) >= cutoff.
    input_set: "Single Appointment; deposit_cents computed once at booking, forfeiture decided at cancel/no-show time."
    constants:
      LATE_CANCEL_FORFEIT_RATE: 0.50
    precision: "cents, round_half_up"
    variants:
      - name: full_forfeit
        when: "to == NO_SHOW"
        difference: "Whole deposit forfeited"
      - name: half_forfeit
        when: "to == LATE_CANCELLED"
        difference: "Half deposit forfeited; the OTHER valid reading (refund half) is explicitly rejected — studio keeps half"

  # --- Dual-variant #2: cycle rollover reconciliation (Membership domain) ---
  - name: cycle_rollover
    trigger: "Membership close-cycle (ACTIVE -> ACTIVE)"
    algorithm: aggregation
    formula: |
      pre_balance = credit_balance  (= sum of all prior CreditLedgerEntry.delta for this membership)
      cap = floor(plan.monthly_credit_allotment * plan.rollover_cap_multiplier)
      carried = min(pre_balance, cap)
      forfeited = pre_balance - carried                  # >= 0
      # Ledger appends (in this order):
      if forfeited > 0: append ROLLOVER_FORFEIT delta = -forfeited
      append GRANT delta = +plan.monthly_credit_allotment
      new_balance = carried + plan.monthly_credit_allotment
    input_set: "All CreditLedgerEntry rows for the membership up to close; carried capped, overage forfeited."
    constants: {}
    precision: "integer credits"
    variants:
      - name: within_cap
        when: "pre_balance <= cap"
        difference: "Nothing forfeited; carried == pre_balance"
      - name: over_cap
        when: "pre_balance > cap"
        difference: "Overage forfeited via ROLLOVER_FORFEIT entry; the OTHER valid reading (carry everything) is rejected"

  # --- Combinatorial mode (b): nested rounding order, retail order total (RetailOrder domain) ---
  - name: retail_order_total
    trigger: "POST RetailOrder create"
    algorithm: tiered_pricing
    formula: |
      # Rounding order PINNED: discount + round PER LINE, THEN sum. (sum-then-round is the WRONG reading.)
      loyalty = member's MembershipPlan.loyalty_discount_pct (0 if member has no ACTIVE/PAST_DUE membership)
      for each line {unit_price_cents, quantity}:
        line_cents = round_half_up(unit_price_cents * quantity * (1 - loyalty))
      subtotal_cents = sum(line_cents over lines)
      # Peak surcharge (combinatorial: 3 inputs, nonlinear conditional):
      tech_load = count of the assigned tech's BOOKED Appointments whose start_utc is on the
                  SAME calendar UTC date as the linked appointment's start_utc
      is_premium = (linked Appointment's ServiceType.category == PREMIUM)
      if tech_load >= PEAK_LOAD_THRESHOLD and is_premium:
        peak_surcharge_cents = round_half_up(subtotal_cents * PEAK_SURCHARGE_PCT)
      else:
        peak_surcharge_cents = 0
      total_cents = subtotal_cents + peak_surcharge_cents
    input_set: "RetailOrder.lines + assigned tech's same-day BOOKED appointment count + linked service category."
    constants:
      PEAK_LOAD_THRESHOLD: 3
      PEAK_SURCHARGE_PCT: 0.15
    precision: "cents, round_half_up; per-line rounding precedes summation"

  # --- Combinatorial mode (c): pinned evaluation order, credit balance vs booking gate ---
  - name: credit_balance_and_book_gate
    trigger: "Appointment BOOKED create with pay_with_credits == true"
    algorithm: aggregation
    formula: |
      # Evaluation order PINNED (circular-looking: balance is read from the ledger, the
      # booking appends to the ledger, and the gate depends on the balance BEFORE the append):
      # 1. credit_balance = sum(CreditLedgerEntry.delta) for the membership  (read BEFORE this booking)
      # 2. required = service_type.credit_cost
      # 3. gate: if credit_balance < required -> reject ERR_INSUFFICIENT_CREDITS (no append)
      # 4. only if gate passes: append CONSUME delta = -required; credits_charged = required
      # 5. post-balance = credit_balance - required  (never negative because of step 3)
      credits_charged = required
    input_set: "All CreditLedgerEntry rows for the membership prior to this booking; the new CONSUME is appended only after the gate passes."
    constants: {}
    precision: "integer credits"

  # --- Selector policy: lash-tech assignment ---
  - name: lash_tech_assignment
    trigger: "Appointment BOOKED create / RecurringFillSchedule spawn-next"
    algorithm: weighted_scoring
    formula: |
      candidate set = LashTech where:
        studio_id == appointment.studio_id
        AND status == AVAILABLE
        AND (service_type.category != PREMIUM OR skill_level >= 2)            # premium needs >=2
        AND station_sanitized_through_utc is not null AND appointment.start_utc <= station_sanitized_through_utc  # sanitation valid through appt
        AND no BOOKED Appointment on this tech overlaps [start_utc, end_utc)  # half-open overlap, see appointment_overlap
      ranking (ascending — pick smallest):
        1. same-UTC-date BOOKED appointment load (fewest first)
        2. skill_level (lowest qualifying first — reserve masters for premium)
        3. station_number (lowest first)
        4. created_at ASC  (final deterministic tie-break; NEVER id)
      empty candidate set -> reject ERR_NO_TECH_AVAILABLE
    input_set: "All LashTech under the studio filtered by the eligibility predicate above."
    constants: {}
    precision: "n/a"

  # --- Temporal overlap on the lash-tech chair (half-open) ---
  - name: appointment_overlap
    trigger: "Appointment BOOKED create (after a candidate tech is tentatively chosen)"
    algorithm: interval_merge
    formula: |
      Two appointments on the SAME lash_tech_id conflict iff their half-open intervals
      [start_utc, end_utc) overlap: existing.start_utc < new.end_utc AND new.start_utc < existing.end_utc.
      Adjacency (existing.end_utc == new.start_utc) is ALLOWED (no buffer). Only BOOKED appointments occupy the chair.
    input_set: "BOOKED Appointments sharing lash_tech_id."
    constants: {}
    precision: "n/a"

  # --- Temporal overlap on the studio sanitation window (closed/buffered, different semantics) ---
  - name: sanitation_window_coverage
    trigger: "Appointment BOOKED create; SanitationLog create"
    algorithm: interval_merge
    formula: |
      A SanitationLog covers [sanitized_at_utc, sanitized_at_utc + SANITATION_VALIDITY_HOURS]  (CLOSED interval;
      an appointment starting exactly at valid_through_utc is still covered — boundary inclusive, OPPOSITE of
      the half-open chair overlap).
      LashTech.station_sanitized_through_utc = max(valid_through_utc) over the tech's COMPLETED SanitationLogs.
      An appointment is bookable on a tech only if start_utc <= station_sanitized_through_utc (ERR_STATION_NOT_SANITIZED).
    input_set: "COMPLETED SanitationLogs for the tech."
    constants:
      SANITATION_VALIDITY_HOURS: 12

  # --- Fill-timing window (scheduled / clock dependent) ---
  - name: fill_timing_window
    trigger: "Appointment BOOKED create where ServiceType.code == FILL; RecurringFillSchedule spawn-next"
    algorithm: threshold
    formula: |
      anchor = member.last_premium_completed_utc   # most recent COMPLETED PREMIUM appointment start
      if anchor is null -> reject ERR_FILL_REQUIRES_PRIOR_FULL_SET  (a fill needs a prior full/lift)
      gap_days = (appointment.start_utc - anchor) / 86400 seconds
      if gap_days < MIN_FILL_GAP_DAYS  -> reject ERR_FILL_TOO_SOON          (boundary: gap_days >= 5 ok)
      if gap_days > MAX_FILL_WINDOW_DAYS -> reject ERR_FILL_WINDOW_EXPIRED  (boundary: gap_days <= 21 ok)
    input_set: "member.last_premium_completed_utc vs the proposed FILL start_utc."
    constants:
      MIN_FILL_GAP_DAYS: 5
      MAX_FILL_WINDOW_DAYS: 21

  # --- No-show strike accumulation (rolling window) ---
  - name: noshow_strike_count
    trigger: "Appointment NO_SHOW; Member read; Membership reactivate precondition"
    algorithm: aggregation
    formula: |
      window_start = current_clock - Studio.noshow_strike_window_days days
      noshow_strike_count = count of this member's Appointments where status == NO_SHOW
                            AND start_utc >= window_start  (strikes older than the window age out)
      if noshow_strike_count >= Studio.noshow_strike_threshold -> trigger Membership SUSPENDED (see SM)
    input_set: "This member's NO_SHOW Appointments within the rolling window measured from the current clock."
    constants: {}

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; for entity-backed roles acting on own resource, X-User-ID matches the resource's owning FK"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (studioId, then memberId/membershipId/appointmentId/techId/scheduleId/patchTestId)"
    error_id: "ERR_STUDIO_NOT_FOUND / ERR_MEMBER_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_TECH_NOT_FOUND / ERR_SCHEDULE_NOT_FOUND / ERR_PATCH_TEST_NOT_FOUND / ERR_SERVICE_TYPE_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "FK references in the request body resolve to existing rows in the same studio (member_id, service_type_id, membership_id, appointment_id)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_SERVICE_TYPE_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /appointments, POST /retail-orders, POST /memberships"

  - priority: 5
    category: state
    check: "Target resource in the correct state for the operation (Appointment.status == BOOKED to complete/cancel/no-show; Membership.status matches transition's from; ConsentPatchTest.status == VALID to revoke; RecurringFillSchedule.status matches from)"
    error_id: "ERR_APPOINTMENT_NOT_BOOKED / ERR_INVALID_MEMBERSHIP_STATE / ERR_PATCH_TEST_NOT_VALID / ERR_INVALID_SCHEDULE_STATE"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "ServiceType.active == true and (FILL schedule's service_type.code == FILL); a retail order's appointment_id is a BOOKED appointment of the same member"
    error_id: "ERR_SERVICE_TYPE_RETIRED / ERR_SCHEDULE_NOT_FILL_SERVICE / ERR_ORDER_APPOINTMENT_MISMATCH"
    http_status: 409
    applies_to: "POST /appointments, POST /recurring-schedules, POST /retail-orders"

  - priority: 7
    category: business_safety
    check: "If ServiceType.requires_patch_test, the member has a ConsentPatchTest with status VALID and current clock <= valid_through_utc; consent_signed must be true"
    error_id: ERR_NO_VALID_PATCH_TEST
    http_status: 422
    applies_to: "POST /appointments, POST /recurring-schedules/{id}/spawn-next"

  - priority: 8
    category: business_temporal
    check: "Fill-timing window: FILL requires anchor present and MIN_FILL_GAP_DAYS <= gap_days <= MAX_FILL_WINDOW_DAYS (calculations.fill_timing_window)"
    error_id: "ERR_FILL_REQUIRES_PRIOR_FULL_SET / ERR_FILL_TOO_SOON / ERR_FILL_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "POST /appointments (FILL), POST /recurring-schedules/{id}/spawn-next"

  - priority: 9
    category: business_safety
    check: "Sanitation coverage: the assigned tech's station_sanitized_through_utc is not null and appointment.start_utc <= station_sanitized_through_utc (closed interval)"
    error_id: ERR_STATION_NOT_SANITIZED
    http_status: 422
    applies_to: "POST /appointments, POST /recurring-schedules/{id}/spawn-next"

  - priority: 10
    category: business_constraint
    check: "Chair temporal overlap: no BOOKED appointment on the chosen tech overlaps [start_utc, end_utc) (half-open); if every eligible tech overlaps, candidate set is empty"
    error_id: ERR_NO_TECH_AVAILABLE
    http_status: 409
    applies_to: "POST /appointments, POST /recurring-schedules/{id}/spawn-next"

  - priority: 11
    category: state
    check: "For credit booking: Membership.status == ACTIVE (PAST_DUE/SUSPENDED/CANCELLED block credit bookings)"
    error_id: ERR_MEMBERSHIP_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /appointments (pay_with_credits), POST /recurring-schedules/{id}/spawn-next"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_membership_version must equal current Membership.version on credit booking and on close-cycle"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /appointments (pay_with_credits), POST /memberships/{id}/close-cycle"

  - priority: 13
    category: business_fiscal
    check: "Sufficient credits: credit_balance >= service_type.credit_cost BEFORE the consuming append (calculations.credit_balance_and_book_gate)"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /appointments (pay_with_credits), POST /recurring-schedules/{id}/spawn-next"

  - priority: 14
    category: business_constraint
    check: "Field-level: start_utc parseable; duration positive; RetailOrder.lines non-empty with positive unit_price_cents and quantity; deposit_rate_pct in [0,1]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create endpoints"

