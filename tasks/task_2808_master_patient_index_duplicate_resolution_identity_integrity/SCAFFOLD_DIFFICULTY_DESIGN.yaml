              payload: { dispatch_window_start_at: "2026-08-02T11:00:00Z", dispatch_window_end_at: "2026-08-02T12:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/propagation-tasks/${task_dw3_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T10:30:00Z", dispatch_window_end_at: "2026-08-02T11:30:00Z" }
              as: MpiAdmin
          assert:
            - "All three PropagationTask rows start QUEUED with attempt_count 0 and propagation_deadline_at == \"2026-08-04T00:00:00Z\""
            - "First trigger call: HTTP 200 and PropagationTask.${task_dw1_id}.state == SENT and attempt_count == 1"
            - "Second trigger call: HTTP 200 and PropagationTask.${task_dw2_id}.state == SENT and attempt_count == 1 (start 11:00:00Z equals task 1's end, and the half-open rule x.start < y.end makes 11:00 < 11:00 false, so occupancy is 0)"
            - "Third trigger call: HTTP 409 with $.data.error_id == \"ERR_DISPATCH_CAPACITY_EXCEEDED\" (the 10:30-11:30 window intersects BOTH SENT windows, occupancy 2 >= max_concurrent_dispatch 1)"
            - "PropagationTask.${task_dw3_id}.state == QUEUED and attempt_count == 0 and version == 1 and dispatch_window_start_at == null"
            - "DownstreamSystem.${sys_dw_id}.unacked_task_count == 3 (two SENT plus one QUEUED)"
            - "GET /mpi/propagation-tasks?downstream_system_id=${sys_dw_id}&state=SENT returns exactly 2 rows"

      - name: metric_window_closed_adjacency_collides_but_other_variant_does_not
        grounds:
          - calculations.metric_window_exclusivity
          - validations[priority=44]
          - entities.SiteDuplicateMetric.fields.attribution_variant
          - endpoints[POST /mpi/registration-sites/{id}/duplicate-metric-runs]
        distinguishing_aspect: |
          The OPPOSITE adjacency convention to the dispatch-window instance, on a different
          entity: SiteDuplicateMetric windows are CLOSED, so a run starting on the exact
          end_date of an existing run of the same attribution_variant collides
          (ERR_METRIC_WINDOW_OVERLAP), yet the identical dates succeed under the other
          attribution_variant because exclusivity is partitioned per variant, and shifting
          the start one day later succeeds under the original variant.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-MW."
            - "One MatchRuleSet RS-BASE created AND activated, because SiteDuplicateMetric.rule_set_version_label snapshots the ACTIVE rule set's version_label."
            - "One ACTIVE PatientRecord MW-2001 created at 2026-08-01, so it falls inside the first metric window and outside every later one."
            - "No MergeOperation exists, so confirmed_duplicates is 0 for every run and duplicate_rate_bps stays 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-MW", name: "Metric Window Clinic", region_code: "US-AZ", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_mw_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/match-rule-sets/${rs_base_id}/activate"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_mw_id}", mrn: "MW-2001", last_name: "Fitzgerald", first_name: "Aoife", dob: "1990-05-17", sex: "F", ssn_last4: "4455", postal_code: "85004", phone: "6025550101", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_mw1_id: $.data.id }
          trigger:
            - call: "POST /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-01", window_end_date: "2026-08-15", attribution_variant: "CREATION_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_run1_id: $.data.id }
            - call: "POST /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-15", window_end_date: "2026-08-31", attribution_variant: "CREATION_SITE_ATTRIBUTION" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-15", window_end_date: "2026-08-31", attribution_variant: "SURVIVOR_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_run3_id: $.data.id }
            - call: "POST /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-16", window_end_date: "2026-08-31", attribution_variant: "CREATION_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_run4_id: $.data.id }
          assert:
            - "First trigger call: HTTP 201 with $.data.records_created == 1, $.data.confirmed_duplicates == 0, $.data.duplicate_rate_bps == 0"
            - "First trigger call: $.data.sample_size_sufficient == false (1 < METRIC_MIN_SAMPLE_SIZE 30) and $.data.rule_set_version_label == \"V-BASE-1\""
            - "Second trigger call: HTTP 409 with $.data.error_id == \"ERR_METRIC_WINDOW_OVERLAP\" (2026-08-15 <= 2026-08-15 under the CLOSED collides rule, so touching end dates collide)"
            - "Third trigger call: HTTP 201 - the identical dates are accepted under SURVIVOR_SITE_ATTRIBUTION because exclusivity is scoped to site_id AND attribution_variant"
            - "Third trigger call: $.data.records_created == 0 and $.data.duplicate_rate_bps == 0 and $.data.sample_size_sufficient == false"
            - "Fourth trigger call: HTTP 201 - moving the start one day to 2026-08-16 clears run 1's closed window, proving the collision was exactly at the shared boundary date"
            - "Fourth trigger call: $.data.records_created == 0 and $.data.attribution_variant == CREATION_SITE_ATTRIBUTION"
            - "GET /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs returns exactly 3 rows (the rejected run created nothing)"
            - "GET /mpi/registration-sites/${site_mw_id}/duplicate-metric-runs?attribution_variant=CREATION_SITE_ATTRIBUTION returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:

      - name: unmerge_restores_cluster_elements_and_enterprise_ids
        grounds:
          - calculations.clinical_element_conservation
          - calculations.enterprise_identity_conservation
          - calculations.merge_element_transfer
          - state_machines.MergeOperation.COMPLETED_to_UNMERGED
          - state_machines.PatientRecord.MERGED_SUBSUMED_to_ACTIVE
        distinguishing_aspect: |
          Reverses a TWO-LEVEL merge cluster and proves both numeric and identity
          conservation: CLUSTER_ELEMENTS is 35 before the merge and 35 after the unmerge with
          each record's own count restored exactly (10 / 25 / 0), DISTINCT_ACTIVE_EIDS
          returns from 1 to 2, and the reactivated record's enterprise_id equals
          subsumed_prior_enterprise_id "EID-SITE-A-A-2000" byte for byte with the
          grandchild re-pointed back to it.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-A and one MatchRuleSet RS-BASE."
            - "NO DownstreamSystem exists, so every merge has propagation_task_count 0 and completes immediately with completed_at 2026-08-01T00:00:00Z and reversal_deadline_at 2026-10-30T00:00:00Z."
            - "Three ACTIVE PatientRecord rows created in this order: A-1000 (clinical_element_count 10), A-2000 (20), A-3000 (5). All three agree on all seven scored attributes, so every pair scores STRICT 100.00 with no conflicts and is created directly in RECOMMENDED_MERGE with recommended_by_user_id null."
            - "Merge 1 subsumes A-3000 into A-2000: moved 5, A-2000 becomes 25, A-3000 becomes 0 with enterprise_id EID-SITE-A-A-2000 and recompressed_record_mrns []."
            - "Merge 2 subsumes A-2000 into A-1000: moved 25 (not greater than CONTAMINATION_REVIEW_ELEMENT_THRESHOLD 25, so no remediation opens), A-1000 becomes 35, subsumed_prior_enterprise_id EID-SITE-A-A-2000, recompressed_record_mrns [\"A-3000\"], and A-3000 is re-pointed to A-1000 with enterprise_id EID-SITE-A-A-1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-A", name: "Conservation Clinic", region_code: "US-MN", registrar_headcount: 5 }
              as: MpiAdmin
              captures: { site_a_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-1000", last_name: "Ibarra", first_name: "Rosalia", dob: "1968-09-30", sex: "F", ssn_last4: "9090", postal_code: "55401", phone: "6125550111", clinical_element_count: 10 }
              as: IdentityAnalyst
              captures: { rec_a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-2000", last_name: "Ibarra", first_name: "Rosalia", dob: "1968-09-30", sex: "F", ssn_last4: "9090", postal_code: "55401", phone: "6125550111", clinical_element_count: 20 }
              as: IdentityAnalyst
              captures: { rec_b_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-3000", last_name: "Ibarra", first_name: "Rosalia", dob: "1968-09-30", sex: "F", ssn_last4: "9090", postal_code: "55401", phone: "6125550111", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_c_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_b_id}", record_b_id: "${rec_c_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_bc_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_a_id}", record_b_id: "${rec_b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ab_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_bc_id}", survivor_record_id: "${rec_b_id}", subsumed_record_id: "${rec_c_id}", rationale: "A-3000 is a duplicate registration of A-2000." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge1_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_ab_id}", survivor_record_id: "${rec_a_id}", subsumed_record_id: "${rec_b_id}", rationale: "A-2000 and its cluster belong under the oldest identity A-1000." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge2_id: $.data.id, merge2_moved: $.data.moved_clinical_element_count, merge2_prior_eid: $.data.subsumed_prior_enterprise_id }
          trigger:
            - call: "POST /mpi/merge-operations/${merge2_id}/unmerge"
              payload: { unmerge_reason: "Chart review proved A-2000 is a different patient with the same demographics." }
              as: IdentityStewardApprover
              as_user_id: "steward-2"
          assert:
            - "Before the trigger: MergeOperation.${merge2_id}.moved_clinical_element_count == 25 and subsumed_prior_enterprise_id == \"EID-SITE-A-A-2000\" and recompressed_record_mrns == [\"A-3000\"]"
            - "Before the trigger: PatientRecord.${rec_a_id}.clinical_element_count == 35 and subsumed_member_count == 2, and CLUSTER_ELEMENTS == 35 + 0 + 0 == 35"
            - "Before the trigger: DISTINCT_ACTIVE_EIDS == 1 (only A-1000 is ACTIVE)"
            - "Trigger: HTTP 200 and MergeOperation.${merge2_id}.state == UNMERGED and unmerged_at == \"2026-08-01T00:00:00Z\""
            - "After the trigger: PatientRecord.${rec_a_id}.clinical_element_count == 10 and PatientRecord.${rec_b_id}.clinical_element_count == 25 and PatientRecord.${rec_c_id}.clinical_element_count == 0"
            - "After the trigger: CLUSTER_ELEMENTS == 10 + 25 + 0 == 35, identical to the pre-merge total (clinical_element_conservation)"
            - "After the trigger: PatientRecord.${rec_b_id}.identity_state == ACTIVE and survivor_record_id == null and enterprise_id == \"EID-SITE-A-A-2000\""
            - "After the trigger: PatientRecord.${rec_c_id}.survivor_record_id == ${rec_b_id} and enterprise_id == \"EID-SITE-A-A-2000\" and identity_state == MERGED_SUBSUMED (the grandchild follows its restored parent)"
            - "After the trigger: DISTINCT_ACTIVE_EIDS == 2 (enterprise_identity_conservation restores exactly one identity)"
            - "After the trigger: PatientRecord.${rec_a_id}.subsumed_member_count == 0 and PatientRecord.${rec_b_id}.subsumed_member_count == 1"
            - "After the trigger: RegistrationSite.${site_a_id}.active_record_count == 2"
            - "After the trigger: DuplicateCandidatePair.${pair_ab_id}.queue_state == UNDER_REVIEW with recommended_by_user_id == null, recommendation == null and approved_by_user_id == null"
            - "After the trigger: MergeOperation.${merge1_id}.state == COMPLETED (reversing merge 2 must not disturb merge 1)"

      - name: unmerge_closes_merge_remediation_and_cancels_queued_task
        grounds:
          - state_machines.ContaminationRemediation.OPEN_to_CLOSED
          - state_machines.PropagationTask.QUEUED_to_CANCELLED
          - state_machines.MergeOperation.PENDING_PROPAGATION_to_UNMERGED
          - calculations.record_integrity_state_derivation
        distinguishing_aspect: |
          Compensates the SIDE-EFFECT surface rather than the numeric cluster: the same
          unmerge action must close the ContaminationRemediation the merge opened (closure_note
          CLOSED_BY_UNMERGE), re-derive the survivor's integrity_state from REMEDIATION_PENDING
          back to CLEAR, cancel the still-QUEUED MERGE propagation task and mint a replacement
          UNMERGE task - none of which the element-conservation instance exercises.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-R and one MatchRuleSet RS-BASE."
            - "One ACTIVE DownstreamSystem REG-MIRROR with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 2, so the merge's task is minted QUEUED and the merge stays PENDING_PROPAGATION."
            - "Two ACTIVE PatientRecord rows R-1000 (clinical_element_count 4) and R-2000 (clinical_element_count 30) agreeing on all seven scored attributes, giving STRICT 100.00 AUTO_LINK and a pair created directly in RECOMMENDED_MERGE with recommended_by_user_id null."
            - "The merge subsumes R-2000 into R-1000, moving 30 elements. Because 30 > CONTAMINATION_REVIEW_ELEMENT_THRESHOLD 25, a ContaminationRemediation (source_type MERGE, state OPEN, element_count_subject 30) opens on the survivor and the survivor's integrity_state becomes REMEDIATION_PENDING."
            - "The single PropagationTask (operation_kind MERGE) is left QUEUED - it is never sent, so the priority-33 in-flight guard does not block the reversal, and priority 42 does not apply because the merge is PENDING_PROPAGATION rather than COMPLETED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-R", name: "Remediation Clinic", region_code: "US-NV", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_r_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "REG-MIRROR", name: "Registration Mirror", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 2 }
              as: MpiAdmin
              captures: { sys_r_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_r_id}", mrn: "R-1000", last_name: "Vasquez", first_name: "Camila", dob: "1984-04-07", sex: "F", ssn_last4: "6262", postal_code: "89101", phone: "7025550122", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_r1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_r_id}", mrn: "R-2000", last_name: "Vasquez", first_name: "Camila", dob: "1984-04-07", sex: "F", ssn_last4: "6262", postal_code: "89101", phone: "7025550122", clinical_element_count: 30 }
              as: IdentityAnalyst
              captures: { rec_r2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_r1_id}", record_b_id: "${rec_r2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_r_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_r_id}", survivor_record_id: "${rec_r1_id}", subsumed_record_id: "${rec_r2_id}", rationale: "Second registration created during a downtime event." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_r_id: $.data.id, merge_r_moved: $.data.moved_clinical_element_count }
            - call: "GET /mpi/contamination-remediations"
              payload: { merge_operation_id: "${merge_r_id}" }
              as: PrivacyOfficer
              captures: { rem_r_id: "$.data[0].id", rem_r_state: "$.data[0].state" }
            - call: "GET /mpi/propagation-tasks"
              payload: { merge_operation_id: "${merge_r_id}" }
              as: MpiAdmin
              captures: { task_r_id: "$.data[0].id", task_r_state: "$.data[0].state" }
          trigger:
            - call: "POST /mpi/merge-operations/${merge_r_id}/unmerge"
              payload: { unmerge_reason: "Downtime reconciliation showed two genuinely distinct patients." }
              as: MpiAdmin
              as_user_id: "admin-1"
          assert:
            - "Before the trigger: MergeOperation.${merge_r_id}.state == PENDING_PROPAGATION and moved_clinical_element_count == 30 and propagation_task_count == 1"
            - "Before the trigger: ContaminationRemediation.${rem_r_id}.source_type == MERGE and state == OPEN and element_count_subject == 30 and record_id == ${rec_r1_id}"
            - "Before the trigger: PatientRecord.${rec_r1_id}.integrity_state == REMEDIATION_PENDING and clinical_element_count == 34"
            - "Before the trigger: PropagationTask.${task_r_id}.state == QUEUED and operation_kind == MERGE"
            - "Trigger: HTTP 200 and MergeOperation.${merge_r_id}.state == UNMERGED and unmerged_at == \"2026-08-01T00:00:00Z\""
            - "After the trigger: PatientRecord.${rec_r1_id}.clinical_element_count == 4 and PatientRecord.${rec_r2_id}.clinical_element_count == 30"
            - "After the trigger: PatientRecord.${rec_r2_id}.identity_state == ACTIVE and enterprise_id == \"EID-SITE-R-R-2000\""
            - "After the trigger: ContaminationRemediation.${rem_r_id}.state == CLOSED and closure_note == \"CLOSED_BY_UNMERGE\""
            - "After the trigger: PatientRecord.${rec_r1_id}.integrity_state == CLEAR (re-derived once no remediation is OPEN, QUARANTINED or REASSIGNED)"
            - "After the trigger: PropagationTask.${task_r_id}.state == CANCELLED"
            - "After the trigger: GET /mpi/propagation-tasks?merge_operation_id=${merge_r_id} returns exactly 2 rows - the CANCELLED MERGE task and one new QUEUED task with operation_kind == UNMERGE"
            - "After the trigger: DownstreamSystem.${sys_r_id}.unacked_task_count == 1 (only the new UNMERGE task holds a slot)"
            - "After the trigger: DuplicateCandidatePair.${pair_r_id}.queue_state == UNDER_REVIEW and RegistrationSite.${site_r_id}.active_record_count == 2"
