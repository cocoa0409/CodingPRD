# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Supplier Diversity Program & Tier-2 Reporting
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Claims already exercised by §1.8 appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: business_unit_creation_defaults
        claim_type: defaults
        grounds:
          - entities.BusinessUnit.fields.inclusion_min_diverse_bidders
          - entities.BusinessUnit.fields.lifetime_imported_spend_cents
        distinguishing_aspect: "Omitting inclusion_min_diverse_bidders applies the default 1; both lifetime counters initialize to 0; version starts at 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/business-units"
              payload: { name: "Avionics", code: "AVIO", lead_user_id: "lead-7" }
              as: DiversityAdmin
              captures: { minb: $.data.inclusion_min_diverse_bidders, imp: $.data.lifetime_imported_spend_cents, voided: $.data.lifetime_voided_spend_cents, ver: $.data.version }
          assert:
            - "minb == 1 (default applied)"
            - "imp == 0 and voided == 0"
            - "ver == 1 and id/created_at/updated_at are server-stamped"

      - name: supplier_creation_initial_state
        claim_type: creation
        grounds:
          - state_machines.Supplier
          - entities.Supplier.fields.status
          - entities.Supplier.fields.diverse_eligible
        distinguishing_aspect: "A newly registered supplier starts REGISTERED with diverse_eligible false and both risk scores 0, before any certification exists."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Fresh Co", tax_id: "T-FRESH", kind: "BOTH", contact_email: "f@x.com" }
              as: DiversityAnalyst
              captures: { st: $.data.status, elig: $.data.diverse_eligible, rs: $.data.risk_score_standard, rc: $.data.risk_score_conservative }
          assert:
            - "st == REGISTERED (initial state)"
            - "elig == false, rs == 0, rc == 0"

      - name: supplier_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but non-existent supplier id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/suppliers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DiversityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: spend_record_create_missing_amount_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.SpendRecord.fields.amount_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required amount_cents on import returns 400 ERR_INVALID_REQUEST; no record is persisted."
        test_recipe:
          setup:
            - "One BU and one supplier exist"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Req Co", tax_id: "T-REQ", kind: "DIVERSE", contact_email: "r@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", transaction_date: "2026-02-01", payment_date: "2026-02-10" }
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: supplier_create_invalid_enum_kind_rejected
        claim_type: type_constraints
        grounds:
          - entities.Supplier.fields.kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "kind must be one of DIVERSE | PRIME | BOTH; any other value returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Alien Co", tax_id: "T-ALIEN", kind: "ALIEN", contact_email: "a@x.com" }
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: certification_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Certification.fields.submitted_by_user_id
          - entities.Certification.fields.verified_by_user_id
        distinguishing_aspect: "Client-supplied submitted_by_user_id/verified_by_user_id values are ignored; the server stamps submitted_by_user_id from the X-User-ID header and leaves verified_by_user_id null."
        test_recipe:
          setup: ["One supplier exists"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Spoof Co", tax_id: "T-SPF", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-SPF", valid_from: "2026-01-01", valid_to: "2026-12-31", submitted_by_user_id: "spoofed-user", verified_by_user_id: "spoofed-user" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { subby: $.data.submitted_by_user_id, verby: $.data.verified_by_user_id }
          assert:
            - "subby == 'analyst-1' (header value stamped; spoofed input ignored)"
            - "verby is null until verification"

      - name: engagement_improvement_computed_on_complete
        claim_type: computed_fields
        grounds:
          - entities.DevelopmentEngagement.fields.improvement
          - state_machines.DevelopmentEngagement.ENROLLED_to_ACTIVE
          - state_machines.DevelopmentEngagement.ACTIVE_to_COMPLETED
        distinguishing_aspect: "The clock sweep activates an ENROLLED engagement whose start_date has been reached; completion computes improvement == capacity_score_after - capacity_score_before."
        test_recipe:
          setup:
            - "Supplier enrolled with start_date 2026-07-01 (before the default clock date), capacity_score_before 40"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Mentee Co", tax_id: "T-MEN", kind: "DIVERSE", contact_email: "m@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/development-engagements"
              payload: { track: "MENTORING", start_date: "2026-07-01", end_date: "2026-09-30", mentor_name: "Mentor A", capacity_score_before: 40 }
              as: DiversityAnalyst
              captures: { eng: $.data.id, st0: $.data.status }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: DiversityAdmin
            - call: "GET /api/v1/suppliers/${sup_id}/development-engagements"
              payload: {}
              as: DiversityAnalyst
              captures: { st1: "$.data[0].status" }
          trigger:
            - call: "POST /api/v1/development-engagements/${eng}/complete"
              payload: { capacity_score_after: 75 }
              as: DiversityAnalyst
              captures: { st2: $.data.status, imp: $.data.improvement }
          assert:
            - "st0 == ENROLLED at creation"
            - "st1 == ACTIVE after the clock sweep (start_date 2026-07-01 <= 2026-08-02)"
            - "st2 == COMPLETED and imp == 35 (75 - 40)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: certification_reject_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Certification.UNDER_REVIEW_to_REJECTED
          - errors[ERR_CERT_NOT_REVIEWABLE]
        distinguishing_aspect: "A REJECTED certification is terminal: verify (and any further review action) returns ERR_CERT_NOT_REVIEWABLE."
        test_recipe:
          setup: ["Supplier with a certification rejected under review (submitted by analyst-1, rejected by admin-1)"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Rej Co", tax_id: "T-REJ", kind: "DIVERSE", contact_email: "r@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "DOBE", certifying_body: "USBLN", certificate_number: "D-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/reject"
              payload: { reason: "illegible document" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { st: $.data.status }
          trigger:
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-2
              captures: { err: $.data.error_id }
          assert:
            - "st == REJECTED after the reject action"
            - "err == ERR_CERT_NOT_REVIEWABLE; status stays REJECTED"

      - name: spend_record_double_void_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SpendRecord.POSTED_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOIDED is terminal: voiding the same spend record twice returns ERR_INVALID_STATE and the BU voided counter moves only once."
        test_recipe:
          setup: ["BU and supplier; one POSTED spend record of 70000"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Void Co", tax_id: "T-VOID", kind: "DIVERSE", contact_email: "v@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 70000, transaction_date: "2026-02-01", payment_date: "2026-02-10" }
              as: DiversityAnalyst
              captures: { r1: $.data.id }
            - call: "POST /api/v1/spend-records/${r1}/void"
              payload: {}
              as: DiversityAnalyst
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /api/v1/spend-records/${r1}/void"
              payload: {}
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/business-units/${bu_id}"
              payload: {}
              as: DiversityAdmin
              captures: { voided: $.data.lifetime_voided_spend_cents }
          assert:
            - "st1 == VOIDED after the first void"
            - "err == ERR_INVALID_STATE on the second void"
            - "voided == 70000 (counted exactly once)"

      - name: tier2_superseded_report_not_editable
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Tier2Report.APPROVED_to_SUPERSEDED
          - errors[ERR_REPORT_NOT_EDITABLE]
        distinguishing_aspect: "Once a report is SUPERSEDED, PUT lines returns ERR_REPORT_NOT_EDITABLE and submit returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "BU; prime; diverse supplier with VERIFIED MBE cert covering 2026-03-31"
            - "RA approved for 2026-Q1, then RB approved for the same prime+period so RA is SUPERSEDED"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-PB", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-DP", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-DP", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certD: $.data.id }
            - call: "POST /api/v1/certifications/${certD}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certD}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 100000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repA: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repA}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
            - call: "POST /api/v1/tier-2-reports/${repA}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 80000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repB: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repB}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
            - call: "POST /api/v1/tier-2-reports/${repB}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
          trigger:
            - call: "PUT /api/v1/tier-2-reports/${repA}"
              payload:
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 1, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPORT_NOT_EDITABLE — SUPERSEDED is terminal for edits"

      - name: award_draft_event_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SourcingEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Awarding a DRAFT (never opened) event returns ERR_INVALID_STATE even when the named supplier exists."
        test_recipe:
          setup: ["BU (lead-1); one supplier; DRAFT event"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Bidder Co", tax_id: "T-BID", kind: "DIVERSE", contact_email: "b@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Draft event", estimated_value_cents: 100000, required_diverse_bidders: 0 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/v1/sourcing-events/${ev_id}/award"
              payload: { award_supplier_id: "${sup_id}", award_amount_cents: 90000 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (award is undefined from DRAFT)"

      - name: respond_after_award_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BidderInvitation.INVITED_to_NO_RESPONSE
          - state_machines.SourcingEvent.OPEN_to_AWARDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Awarding flips a non-responsive invitation to NO_RESPONSE; a later respond on it returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "BU (lead-1); ACTIVE diverse winner (VERIFIED MBE cert); second REGISTERED supplier invited but silent"
            - "Event OPEN with required_diverse_bidders 0; winner BID_SUBMITTED; award executed -> silent invitation becomes NO_RESPONSE"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Winner Co", tax_id: "T-WIN", kind: "DIVERSE", contact_email: "w@x.com" }
              as: DiversityAnalyst
              captures: { sW: $.data.id }
            - call: "POST /api/v1/suppliers/${sW}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-W", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certW: $.data.id }
            - call: "POST /api/v1/certifications/${certW}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certW}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Silent Co", tax_id: "T-SIL", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sX: $.data.id }
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Fasteners", estimated_value_cents: 100000, required_diverse_bidders: 0 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sW}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { invW: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sX}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { invX: $.data.id }
            - call: "POST /api/v1/invitations/${invW}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/award"
              payload: { award_supplier_id: "${sW}", award_amount_cents: 90000 }
              as: BusinessUnitLead
              as_user_id: lead-1
          trigger:
            - call: "POST /api/v1/invitations/${invX}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE — the invitation left INVITED (NO_RESPONSE) and the event is AWARDED"

      - name: engagement_complete_before_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DevelopmentEngagement
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Complete is defined only from ACTIVE; an ENROLLED engagement with a future start_date rejects completion with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Supplier; engagement starting 2027-01-01 (after the default clock 2026-08-01), still ENROLLED"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Mentee Co", tax_id: "T-MEN", kind: "DIVERSE", contact_email: "m@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/development-engagements"
              payload: { track: "MENTORING", start_date: "2027-01-01", end_date: "2027-06-30", mentor_name: "Mentor A", capacity_score_before: 40 }
              as: DiversityAnalyst
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /api/v1/development-engagements/${eng}/complete"
              payload: { capacity_score_after: 75 }
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (ENROLLED -> COMPLETED is not defined)"

      - name: audit_outcome_recorded_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.AuditCase.OPEN_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CONFIRMED is terminal: a second record-outcome on the same case returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Supplier with VERIFIED SELF_CERT (submitted analyst-1, verified admin-1); OPEN audit case owned by auditor-9"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Self Cert Co", tax_id: "T-SCC", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert_id}", reason: "RANDOM_SAMPLE" }
              as: Auditor
              as_user_id: auditor-9
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/audit-cases/${case_id}/record-outcome"
              payload: { outcome: "CONFIRMED" }
              as: Auditor
              as_user_id: auditor-9
              captures: { st: $.data.status }
          trigger:
            - call: "POST /api/v1/audit-cases/${case_id}/record-outcome"
              payload: { outcome: "FAILED" }
              as: Auditor
              as_user_id: auditor-9
              captures: { err: $.data.error_id }
          assert:
            - "st == CONFIRMED after the first outcome"
            - "err == ERR_INVALID_STATE on the second record-outcome; the certification remains VERIFIED"

      - name: scorecard_recompute_after_publish_locked
        claim_type: invalid_transition
        grounds:
          - state_machines.Scorecard.GENERATED_to_PUBLISHED
          - errors[ERR_SCORECARD_LOCKED]
        distinguishing_aspect: "Publishing locks the snapshot: recompute on a PUBLISHED scorecard returns ERR_SCORECARD_LOCKED and the stored figures do not change."
        test_recipe:
          setup: ["BU with one 50000 spend record; GENERATED scorecard for 2026-Q1; then published by admin"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Plain Co", tax_id: "T-PLN", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 50000, transaction_date: "2026-02-01", payment_date: "2026-02-01" }
              as: DiversityAnalyst
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { sc_id: $.data.id, tot_pre: $.data.total_spend_cents }
            - call: "POST /api/v1/scorecards/${sc_id}/publish"
              payload: {}
              as: DiversityAdmin
              captures: { st: $.data.status }
          trigger:
            - call: "POST /api/v1/scorecards/${sc_id}/recompute"
              payload: {}
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "st == PUBLISHED"
            - "err == ERR_SCORECARD_LOCKED"
            - "tot_pre == 50000 and remains the stored value"

      - name: cancel_open_event_withdraws_pending_invitations
        claim_type: side_effect_execution
        grounds:
          - state_machines.SourcingEvent.OPEN_to_CANCELLED
          - state_machines.BidderInvitation.INVITED_to_WITHDRAWN
        distinguishing_aspect: "Cancelling an OPEN event withdraws only its INVITED invitations; the BID_SUBMITTED one is untouched, and the event is terminally CANCELLED."
        test_recipe:
          setup:
            - "BU (lead-1); diverse ACTIVE supplier A (VERIFIED MBE) invited and BID_SUBMITTED; supplier B invited, still INVITED"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse A", tax_id: "T-DA", kind: "DIVERSE", contact_email: "a@x.com" }
              as: DiversityAnalyst
              captures: { sA: $.data.id }
            - call: "POST /api/v1/suppliers/${sA}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-A", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certA: $.data.id }
            - call: "POST /api/v1/certifications/${certA}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certA}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Bidder B", tax_id: "T-BB", kind: "DIVERSE", contact_email: "b@x.com" }
              as: DiversityAnalyst
              captures: { sB: $.data.id }
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Paint shop", estimated_value_cents: 200000, required_diverse_bidders: 1 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sA}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { invA: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sB}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { invB: $.data.id }
            - call: "POST /api/v1/invitations/${invA}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
          trigger:
            - call: "POST /api/v1/sourcing-events/${ev_id}/cancel"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_st: $.data.status }
            - call: "GET /api/v1/suppliers/${sB}/invitations"
              payload: {}
              as: DiversityAdmin
              captures: { invB_st: "$.data[0].status" }
            - call: "GET /api/v1/suppliers/${sA}/invitations"
              payload: {}
              as: DiversityAdmin
              captures: { invA_st: "$.data[0].status" }
          assert:
            - "ev_st == CANCELLED"
            - "invB_st == WITHDRAWN (was INVITED)"
            - "invA_st == BID_SUBMITTED (conditional cascade: only INVITED invitations are withdrawn)"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: certification_expiration_sweep_boundary
        claim_type: threshold
        grounds:
          - calculations.certification_expiration_sweep
          - state_machines.Certification.VERIFIED_to_EXPIRED
        distinguishing_aspect: "On the clock date equal to valid_to the certification stays VERIFIED (closed window); advancing the clock one day further moves it to EXPIRED."
        test_recipe:
          setup: ["Supplier with VERIFIED MBE cert valid 2026-01-01..2026-11-15 (verified at the default clock 2026-08-01)"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Sweep Co", tax_id: "T-SWP", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-SWP", valid_from: "2026-01-01", valid_to: "2026-11-15" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T12:00:00Z" }
              as: DiversityAdmin
            - call: "GET /api/v1/suppliers/${sup_id}/certifications"
              payload: {}
              as: DiversityAdmin
              captures: { st_on: "$.data[0].status" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T00:00:00Z" }
              as: DiversityAdmin
            - call: "GET /api/v1/suppliers/${sup_id}/certifications"
              payload: {}
              as: DiversityAdmin
              captures: { st_after: "$.data[0].status" }
          assert:
            - "st_on == VERIFIED (valid_to day itself is still covered)"
            - "st_after == EXPIRED (valid_to strictly before the new clock date)"

      - name: tier2_approve_requires_cert_covering_period_end
        claim_type: input_set_filtering
        grounds:
          - state_machines.Tier2Report.SUBMITTED_to_APPROVED
          - errors[ERR_SUPPLIER_NOT_ELIGIBLE]
        distinguishing_aspect: "A line supplier whose certification window ends 2026-03-30 does not cover the 2026-Q1 period end (2026-03-31); approve is rejected even though the certification is VERIFIED."
        test_recipe:
          setup:
            - "Clock set back to 2026-03-01 so the short cert window verifies"
            - "Diverse supplier with VERIFIED MBE cert 2026-01-01..2026-03-30; prime; DRAFT report for 2026-Q1 with one 100000 line at 100.00"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DiversityAdmin
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Short Cert Co", tax_id: "T-SHT", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-SHT", valid_from: "2026-01-01", valid_to: "2026-03-30" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certD: $.data.id }
            - call: "POST /api/v1/certifications/${certD}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certD}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-PB", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 100000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { rep: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${rep}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
          trigger:
            - call: "POST /api/v1/tier-2-reports/${rep}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUPPLIER_NOT_ELIGIBLE — window [2026-01-01, 2026-03-30] does not cover the period end 2026-03-31"
            - "Report remains SUBMITTED"

      - name: spend_voided_records_excluded_from_attribution
        claim_type: input_set_filtering
        grounds:
          - calculations.diverse_spend_attribution
          - state_machines.SpendRecord.POSTED_to_VOIDED
        distinguishing_aspect: "VOIDED records drop out of both total_spend_cents and direct_diverse_spend_cents; a 70000 void + 30000 posted yields exactly 30000/30000."
        test_recipe:
          setup:
            - "BU; diverse supplier with VERIFIED MBE cert covering Q1; R1 70000 and R2 30000 both dated in 2026-Q1"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-DP", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-DP", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certD: $.data.id }
            - call: "POST /api/v1/certifications/${certD}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certD}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sD}", business_unit_id: "${bu_id}", amount_cents: 70000, transaction_date: "2026-02-01", payment_date: "2026-02-01" }
              as: DiversityAnalyst
              captures: { r1: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sD}", business_unit_id: "${bu_id}", amount_cents: 30000, transaction_date: "2026-02-02", payment_date: "2026-02-02" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records/${r1}/void"
              payload: {}
              as: DiversityAnalyst
          trigger:
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { tot: $.data.total_spend_cents, div: $.data.direct_diverse_spend_cents }
          assert:
            - "tot == 30000 and div == 30000 (the VOIDED 70000 record is excluded from both)"

      - name: multiple_covering_certifications_latest_valid_from_wins
        claim_type: correct_result
        grounds:
          - calculations.diverse_spend_attribution
        distinguishing_aspect: "Two VERIFIED certifications of different types cover the same spend date; attribution goes to the certification with the latest valid_from (WBE 2026-06-01 beats MBE 2026-01-01), so spend_by_category keys it under WBE."
        test_recipe:
          setup:
            - "BU; supplier with VERIFIED MBE 2026-01-01..2026-12-31 AND VERIFIED WBE 2026-06-01..2026-12-31 (different cert_types — no overlap conflict)"
            - "One spend record 60000 dated 2026-08-10 (covered by both)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Multi Cert Co", tax_id: "T-MUL", kind: "DIVERSE", contact_email: "m@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-MUL", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { c1: $.data.id }
            - call: "POST /api/v1/certifications/${c1}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${c1}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "WBE", certifying_body: "WBENC", certificate_number: "W-MUL", valid_from: "2026-06-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { c2: $.data.id }
            - call: "POST /api/v1/certifications/${c2}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${c2}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sD}", business_unit_id: "${bu_id}", amount_cents: 60000, transaction_date: "2026-08-10", payment_date: "2026-08-10" }
              as: DiversityAnalyst
          trigger:
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q3", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { div: $.data.direct_diverse_spend_cents, bycat: $.data.spend_by_category }
          assert:
            - "div == 60000"
            - "bycat == { WBE: 60000 } — the later valid_from (2026-06-01) wins the category attribution"

      - name: scorecard_without_goal_rated_no_goal
        claim_type: correct_result
        grounds:
          - calculations.scorecard_attainment_rating
        excluded_because:
          difficulty_instance: boundary_precision_check / certification_window_inclusive_end_boundary
          rationale: "That instance generates a scorecard with no PUBLISHED goal and asserts rating == NO_GOAL with null attainment_pct."

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID fails at priority 1 with 400 before existence is even evaluated (the id used does not exist, yet the error is the auth one, not 404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/suppliers/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400 (auth beats the would-be 404)"

      - name: certification_verify_own_submission_returns_sod_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_SOD_VIOLATION]
          - state_machines.Certification.UNDER_REVIEW_to_VERIFIED
        distinguishing_aspect: "The analyst who submitted the certification cannot verify it: caller == submitted_by_user_id yields ERR_SOD_VIOLATION and the cert stays UNDER_REVIEW."
        test_recipe:
          setup: ["Supplier; certification submitted by analyst-1 and moved to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "SoD Co", tax_id: "T-SOD", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "VET", certifying_body: "NVBDC", certificate_number: "V-SOD", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_VIOLATION"
            - "Certification remains UNDER_REVIEW"

      - name: audit_create_by_cert_verifier_returns_sod_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_SOD_VIOLATION]
          - entities.AuditCase.fields.auditor_user_id
        distinguishing_aspect: "The admin who verified a self-certification may not audit it: auditor_user_id == certification.verified_by_user_id yields ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["Supplier with VERIFIED SELF_CERT (submitted analyst-1, verified admin-1)"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Self Cert Co", tax_id: "T-SCC", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
          trigger:
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert_id}", reason: "RANDOM_SAMPLE" }
              as: Auditor
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_VIOLATION (auditor 'admin-1' equals the certification's verified_by_user_id)"

      - name: goal_publish_by_creator_returns_sod_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_SOD_VIOLATION]
          - state_machines.ProgramGoal.DRAFT_to_PUBLISHED
        distinguishing_aspect: "The admin who created a goal cannot publish it: publisher == created_by_user_id yields ERR_SOD_VIOLATION and the goal stays DRAFT."
        test_recipe:
          setup: ["BU; DRAFT goal created by admin-1"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id, bu_v: $.data.version }
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 25.00, expected_business_unit_version: "${bu_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /api/v1/goals/${goal_id}/publish"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_VIOLATION"
            - "Goal remains DRAFT"

      - name: self_cert_submission_during_cooling_off_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_AUDIT_COOLING_OFF]
        distinguishing_aspect: "Within 90 days of a FAILED audit outcome, a new SELF_CERT submission for that supplier is rejected with ERR_AUDIT_COOLING_OFF."
        test_recipe:
          setup:
            - "Supplier with VERIFIED SELF_CERT; audit FAILED at the default clock 2026-08-01 (outcome_recorded_at pinned)"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Cooling Co", tax_id: "T-COOL", kind: "DIVERSE", contact_email: "c@x.com" }
              as: DiversityAnalyst
