# =============================================================================
# Task 1828 — Escheatment & Unclaimed Property
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 difficulty rules x instances; every recipe replays from empty-DB using only
# endpoints declared in SCAFFOLD.yaml §1.5. Logical clock default is
# 2026-08-01T00:00:00Z whenever an instance never calls _clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: securities_valuation_provisional_vs_liquidation_final
        grounds:
          - calculations.securities_valuation
          - entities.ReportLineItem.fields.provisional_value_cents
          - entities.ReportLineItem.fields.final_value_cents
          - state_machines.LiquidationOrder.EXECUTED_to_SETTLED
        distinguishing_aspect: |
          Entity domain Property/ReportLineItem: the provisional variant (last close
          price x shares + dividends, no fee) and the final variant (execution price
          x shares - fee + dividends) produce 462500 vs 480000 for the same position.
        test_recipe:
          setup:
            - "NV BROKERAGE_SHARES rule (3y) and a securities property (100 shares, close 4500c, dividends 12500c) that has flowed DORMANT -> DUE_DILIGENCE -> letter EXPIRED -> REPORTABLE -> line in an ACCEPTED NV 2026 report; a liquidation order executed at 4700c/share with 2500c fee is then settled."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "BROKERAGE_SHARES", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Ada Wirth", last_known_address: "1 Pine St, Reno, NV", state_code: "NV" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own_id: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own_id}", property_type: "BROKERAGE_SHARES", state_code: "NV", original_value_cents: 462500, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { prop_id: $.data.id } }
            - { call: "POST /escheatment/properties/${prop_id}/securities-detail", payload: { cusip: "ESC1828A", shares_quantity: 100, last_close_price_cents: 4500, accrued_dividends_cents: 12500 }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${prop_id}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { let_id: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "NV", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rep_id: $.data.id, rep_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${rep_id}/line-items", payload: { property_id: "${prop_id}", expected_report_version: "${rep_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { line_id: $.data.id, line_prov: $.data.provisional_value_cents } }
            - { call: "POST /escheatment/holder-reports/${rep_id}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${rep_id}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/liquidation-orders", payload: { property_id: "${prop_id}", liquidation_fee_cents: 2500 }, as: TreasuryOps, as_user_id: "to-1", captures: { liq_id: $.data.id } }
            - { call: "POST /escheatment/liquidation-orders/${liq_id}/execute", payload: { execution_price_cents_per_share: 4700 }, as: TreasuryOps, as_user_id: "to-1" }
          trigger:
            - { call: "POST /escheatment/liquidation-orders/${liq_id}/settle", as: TreasuryOps, as_user_id: "to-1", captures: { liq_net: $.data.net_proceeds_cents } }
            - { call: "GET /escheatment/holder-reports/${rep_id}/line-items", as: Any, captures: { line_final: "$.data[0].final_value_cents", line_status: "$.data[0].status" } }
            - { call: "GET /escheatment/holder-reports/${rep_id}", as: Any, captures: { rep_prov: $.data.total_provisional_cents, rep_final: $.data.total_final_cents } }
          assert:
            - "line provisional_value_cents == 462500 (100*4500 + 12500, provisional variant)"
            - "settle response net_proceeds_cents == 480000 (100*4700 - 2500 + 12500, final variant)"
            - "ReportLineItem.${line_id}.final_value_cents == 480000 and status == FINAL"
            - "HolderReport.${rep_id}.total_provisional_cents == 462500 (unchanged by settle)"
            - "HolderReport.${rep_id}.total_final_cents == 480000"
            - "provisional != final: 480000 - 462500 == 17500 delta for identical share/dividend inputs"

      - name: claim_payout_cash_interest_vs_securities_proceeds
        grounds:
          - calculations.claim_payout
          - entities.OwnerClaim.fields.approved_payout_cents
          - entities.OwnerClaim.fields.approved_interest_cents
        distinguishing_aspect: |
          Entity domain OwnerClaim (different domain from the securities_valuation
          instance): with the same days_held == 100, a CASH claim accrues interest
          (6575c) while a SECURITIES claim pays liquidation proceeds only (interest
          pinned 0), so the two variants diverge on the payout formula itself.
        test_recipe:
          setup:
            - "Chain A: CA SAVINGS property of 200000c remitted with confirmation date 2026-09-01; a claim UNDER_REVIEW."
            - "Chain B: NV BROKERAGE_SHARES property (100 sh @ close 4500c, div 12500c) liquidated at 4700c with 2500c fee (net 480000c), remitted with confirmation date 2026-09-01; a claim UNDER_REVIEW."
            - "Clock advanced to 2026-12-10 for both approvals (days_held == 100)."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "BROKERAGE_SHARES", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Cash Claimant", last_known_address: "2 Oak Ave, Fresno, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own_a: $.data.id } }
            - { call: "POST /escheatment/owners", payload: { full_name: "Stock Claimant", last_known_address: "9 Cedar Rd, Elko, NV", state_code: "NV" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own_b: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own_a}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 200000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { prop_a: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own_b}", property_type: "BROKERAGE_SHARES", state_code: "NV", original_value_cents: 462500, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { prop_b: $.data.id } }
            - { call: "POST /escheatment/properties/${prop_b}/securities-detail", payload: { cusip: "ESC1828B", shares_quantity: 100, last_close_price_cents: 4500, accrued_dividends_cents: 12500 }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${prop_a}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${prop_b}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rep_a: $.data.id, rep_a_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${rep_a}/line-items", payload: { property_id: "${prop_a}", expected_report_version: "${rep_a_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${rep_a}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${rep_a}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${rep_a}/remittances", payload: { amount_cents: 200000 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem_a: $.data.id } }
            - { call: "POST /escheatment/remittances/${rem_a}/confirm", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "NV", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rep_b: $.data.id, rep_b_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${rep_b}/line-items", payload: { property_id: "${prop_b}", expected_report_version: "${rep_b_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${rep_b}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${rep_b}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/liquidation-orders", payload: { property_id: "${prop_b}", liquidation_fee_cents: 2500 }, as: TreasuryOps, as_user_id: "to-1", captures: { liq_b: $.data.id } }
            - { call: "POST /escheatment/liquidation-orders/${liq_b}/execute", payload: { execution_price_cents_per_share: 4700 }, as: TreasuryOps, as_user_id: "to-1" }
            - { call: "POST /escheatment/liquidation-orders/${liq_b}/settle", as: TreasuryOps, as_user_id: "to-1" }
            - { call: "POST /escheatment/holder-reports/${rep_b}/remittances", payload: { amount_cents: 480000 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem_b: $.data.id } }
            - { call: "POST /escheatment/remittances/${rem_b}/confirm", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/owner-claims", payload: { property_id: "${prop_a}" }, as: Claimant, as_user_id: "${own_a}", captures: { claim_a: $.data.id } }
            - { call: "POST /escheatment/owner-claims/${claim_a}/start-review", as: ClaimsExaminer, as_user_id: "ce-1" }
            - { call: "POST /escheatment/owner-claims", payload: { property_id: "${prop_b}" }, as: Claimant, as_user_id: "${own_b}", captures: { claim_b: $.data.id } }
            - { call: "POST /escheatment/owner-claims/${claim_b}/start-review", as: ClaimsExaminer, as_user_id: "ce-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/owner-claims/${claim_a}/approve", as: ClaimsApprover, as_user_id: "ap-1", captures: { pay_a: $.data.approved_payout_cents, int_a: $.data.approved_interest_cents, fee_a: $.data.processing_fee_cents, base_a: $.data.approved_base_cents } }
            - { call: "POST /escheatment/owner-claims/${claim_b}/approve", as: ClaimsApprover, as_user_id: "ap-1", captures: { pay_b: $.data.approved_payout_cents, int_b: $.data.approved_interest_cents, fee_b: $.data.processing_fee_cents, base_b: $.data.approved_base_cents } }
          assert:
            - "Claim A (CASH): approved_base_cents == 200000, approved_interest_cents == 6575 (round_half_up(200000*1200*100/3650000)), processing_fee_cents == 3099 (round_half_up(206575*0.015)), approved_payout_cents == 203476"
            - "Claim B (SECURITIES): approved_base_cents == 480000, approved_interest_cents == 0 despite identical days_held == 100, processing_fee_cents == 7200, approved_payout_cents == 472800"
            - "Variant divergence: identical days_held, different interest treatment -> payouts 203476 vs 472800"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: late_penalty_gross_tier_and_cap_interaction
        grounds:
          - calculations.late_penalty
          - entities.PenaltyAssessment.fields.penalty_cents
          - entities.PenaltyAssessment.fields.days_late
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (days_late, report total, rule rate pair + cap pct)
          interact non-linearly — a conditional gross-rate branch keyed on
          days_late > 30 applies to ALL days (30 days -> 300000, 31 days -> 775000,
          not 760000), then min() against the 25%-of-total cap.
        test_recipe:
          setup:
            - "Report R1 (CA 2026): two SAVINGS properties of 2000000c each, letters expired, submitted 2026-12-01 (30 days late); assessed same day."
            - "Report R2 (CA 2027): two further SAVINGS properties of 2000000c each on the 2027 cycle, letters expired, submitted 2027-12-02 (31 days late); assessed same day."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Pen Ala", last_known_address: "3 Elm St, Napa, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 2000000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 2000000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p2: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${p2}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r1_v2: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p2}", expected_report_version: "${r1_v2}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/penalty-assessments", as: StateAuditor, as_user_id: "sa-1", captures: { pen1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 2000000, last_contact_date: "2024-04-10" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p3: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 2000000, last_contact_date: "2024-04-10" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p4: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p3}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${p4}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2027 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r2: $.data.id, r2_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r2}/line-items", payload: { property_id: "${p3}", expected_report_version: "${r2_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /escheatment/holder-reports/${r2}", as: Any, captures: { r2_v2: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r2}/line-items", payload: { property_id: "${p4}", expected_report_version: "${r2_v2}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2027-12-02T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports/${r2}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r2}/penalty-assessments", as: StateAuditor, as_user_id: "sa-1", captures: { pen2: $.data.id } }
            - { call: "GET /escheatment/penalty-assessments/${pen1}", as: Any, captures: { p1_days: $.data.days_late, p1_pen: $.data.penalty_cents, p1_int: $.data.interest_cents, p1_tot: $.data.total_cents } }
            - { call: "GET /escheatment/penalty-assessments/${pen2}", as: Any, captures: { p2_days: $.data.days_late, p2_pen: $.data.penalty_cents, p2_int: $.data.interest_cents, p2_tot: $.data.total_cents } }
          assert:
            - "R1: days_late == 30 (boundary: <= threshold uses daily rate), penalty_cents == 300000 (10000*30; cap 1000000 not binding)"
            - "R1: interest_cents == 39452 (per-line round_half_up(2000000*1200*30/3650000)=19726, x2 lines), total_cents == 339452"
            - "R2: days_late == 31, penalty_cents == 775000 (gross rate 25000 applied to ALL 31 days — not 300000 + 25000 marginal)"
            - "R2: interest_cents == 40768 (per-line 20384 x2), total_cents == 815768"

      - name: late_interest_round_per_line_then_sum
        grounds:
          - calculations.late_interest
          - entities.PenaltyAssessment.fields.interest_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round_half_up PER LINE then
          sum. Two 33333c lines at 40 days give 438 + 438 == 876; the alternative
          sum-then-round order gives 877 — the pinned order is observable.
        test_recipe:
          setup:
            - "CA 2026 report with two SAVINGS lines of 33333c each (total 66666c), submitted 2026-11-11 (10 days late), assessed 2026-12-11 (40 interest days)."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
