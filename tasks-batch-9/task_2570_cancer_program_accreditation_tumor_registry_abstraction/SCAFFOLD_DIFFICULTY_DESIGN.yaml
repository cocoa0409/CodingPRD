            - call: "POST /cancer-registry/abstractions/${abst_c_id}/reopen-draft"
              payload: { stage_group: "STAGE_III" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_c_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_c_id}/qa-decision"
              payload: { verdict: "REWORK_REQUIRED", reviewer_note: "treatment modality still incomplete" }
