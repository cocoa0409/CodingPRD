  # ===========================================================================
  - section: state_machines
    instances:

      - name: agreement_starts_in_draft_with_clear_posture_and_zero_ledger
        claim_type: initial_state
        grounds:
          - state_machines.LicenseAgreement.contract_status.initial_state
          - state_machines.LicenseAgreement.compliance_posture.initial_state
          - entities.LicenseAgreement.fields.contract_year_start_quarter
        distinguishing_aspect: |
          LicenseAgreement carries TWO independent dimensions, so a fresh row must
          start at contract_status DRAFT *and* compliance_posture CLEAR with
          posture_as_of_quarter null. Every ledger counter starts at 0,
          mg_final_shortfall_cents starts null (not 0 — null means "term has not
          ended"), and contract_year_start_quarter is derived from term_start_date
          as 2026Q1 rather than from the clock's 2026Q3.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "category JERSEY exists and licensee LIC_I is ACTIVE"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Ironwood Sport", contact_email: "ops@ironwood.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_i: $.data.id }
            - call: "POST /licensing/licensees/${lic_i}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_i}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_i: $.data.id }
          assert:
            - "response status is 201, data.contract_status == 'DRAFT' and data.compliance_posture == 'CLEAR'"
            - "data.posture_as_of_quarter is null and data.contract_year_start_quarter == '2026Q1' (from term_start_date, NOT the clock quarter 2026Q3)"
            - "data.advance_paid_cents == 0, data.unrecouped_advance_cents == 0, data.recouped_advance_cents == 0, data.cumulative_royalty_cents == 0"
            - "data.mg_accrued_shortfall_cents == 0 and data.mg_final_shortfall_cents is null"
            - "data.approved_sku_count == 0, data.authorized_channel_count == 0, data.distribution_ready == false"
            - "data.countersigned_by is null, data.suspension_reason is null, data.termination_reason is null, data.version == 1"

      - name: enforcement_action_reported_to_investigating
        claim_type: valid_transition
        grounds:
          - state_machines.EnforcementAction.REPORTED_to_INVESTIGATING
          - entities.EnforcementAction.fields.status
          - entities.EnforcementAction.fields.occurrence_quarter
        distinguishing_aspect: |
          INVESTIGATE moves REPORTED -> INVESTIGATING, bumps version to 2 and
          does NOTHING else: occurrence_quarter stays null (it is stamped only by
          ORDER_SEIZURE), seized_units stays 0, recovered_cents stays 0 and the
          suspected licensee's compliance_risk_index stays 0 because only a
          SEIZURE contributes a risk factor. An implementation that stamps the
          quarter or scores the licensee at investigation time fails here.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_J2 is ACTIVE and one EnforcementAction naming it was reported at venue_type ONLINE"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Jetty Merch", contact_email: "ops@jetty.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_j2: $.data.id }
            - call: "POST /licensing/licensees/${lic_j2}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/enforcement-actions"
              payload: { venue_type: "ONLINE", venue_reference: "marketplace-listing-4102", target_name: "BargainShield", estimated_units: 120, estimated_retail_cents: 360000, suspected_licensee_id: "${lic_j2}" }
              as: MarkComplianceOfficer
              as_user_id: "u_mco_1"
              captures: { enf_j2: $.data.id }
          trigger:
            - call: "POST /licensing/enforcement-actions/${enf_j2}/status"
              payload: { action: "INVESTIGATE" }
              as: MarkComplianceOfficer
              as_user_id: "u_mco_1"
          assert:
            - "response status is 200 and data.status == 'INVESTIGATING'"
            - "data.occurrence_quarter is null, data.seized_units == 0, data.seizure_authority is null, data.recovered_cents == 0"
            - "data.version == 2 (REPORTED row was version 1)"
            - "Licensee.${lic_j2}.compliance_risk_index == 0"

      - name: submit_for_signature_without_territory_grant_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LicenseAgreement.DRAFT_to_PENDING_SIGNATURE
          - errors.ERR_INVALID_STATE
          - validations.priority_12
        distinguishing_aspect: |
          DRAFT -> PENDING_SIGNATURE has four preconditions; with MG at the floor
          and the advance fully paid, the ONLY unmet one is "at least one
          TerritoryGrant with status == GRANTED exists". The transition must fail
          with ERR_INVALID_STATE (409) and leave contract_status DRAFT; issuing the
          grant then lets the identical call through. An implementation that only
          checks the money preconditions signs an agreement with no territory.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_K2 ACTIVE; a DRAFT agreement AGR_K2 on category JERSEY with minimum_guarantee_cents 1000000 (exactly the floor) and required_advance_cents 250000 already paid in full"
            - "AGR_K2 holds NO TerritoryGrant"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Kirkwall Apparel", contact_email: "ops@kirkwall.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_k2: $.data.id }
            - call: "POST /licensing/licensees/${lic_k2}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_k2}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_k2: $.data.id }
            - call: "POST /licensing/agreements/${agr_k2}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
          trigger:
