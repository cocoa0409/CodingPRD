  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: club_day_capacity_admits_at_one_below_and_rejects_at_exact_equality
        grounds:
          - calculations.club_day_calendar_utilization
          - validations[priority=32]
          - entities.Club.fields.daily_event_capacity
          - errors[ERR_CLUB_DAY_CAPACITY_FULL]
        distinguishing_aspect: |
          The capacity guard is written confirmed_count >= daily_event_capacity,
          so with daily_event_capacity 2 the SECOND approval must succeed at
          confirmed_count 1 (one below the limit) and the THIRD must fail at
          confirmed_count exactly 2 — equality rejects, it does not admit. An
          off-by-one that uses > instead of >= lets the third event through and
          leaves remaining_slots at -1 instead of the clamped 0. The third
          event deliberately carries a DIFFERENT Product.category from the
          first two so category_count for its category is 0, keeping
          validations[priority=34] out of contention; all three products are
          NON_FOOD so validations[priority=33] cannot fire either. Only the
          day-capacity arithmetic can produce the rejection.
        test_recipe:
          setup:
            - "Club C with daily_event_capacity 2 and food_station_count 1."
            - "Two NON_FOOD products: P1 in category HOUSEHOLD (used by events A and B) and P2 in category ELECTRONICS (used by event C). weekly_sample_case_pool 30 on each so validations[priority=42] never binds."
            - "Three events, all on 2026-09-14, day parts MORNING / MIDDAY / AFTERNOON so no equipment or shift geometry is involved, each requested_sample_cases 2, each driven to SUBMITTED."
            - "Approvals are issued one at a time in A, B, C order; the assertions read confirmed_count from GET /clubs/{id}/capacity between the boundary steps."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Ambrose Goods Co", billing_email: "ap@ambrose.example", program_tier: "STANDARD", credit_limit_cents: 4000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5112", name: "Ambrose Club 5112", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 2, food_station_count: 1, health_permit_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "AG-MOP-112", name: "Spin Mop System", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 2900, samples_per_case: 4, weekly_sample_case_pool: 30 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "AG-SPK-113", name: "Portable Speaker", category: "ELECTRONICS", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 6900, samples_per_case: 2, weekly_sample_case_pool: 30 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${p1_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
