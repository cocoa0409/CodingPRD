  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: funder_period_half_open_overlap
        grounds:
          - entities.FundingSource.fields.period_end
          - errors[ERR_SOURCE_PERIOD_OVERLAP]
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = FundingSource, semantics = continuous half-open interval:
          [2026-01-01, 2026-07-01) rejects a same-funder source starting
          2026-05-01 but ACCEPTS one starting exactly 2026-07-01 (adjacency is
          not overlap), and a different funder may overlap freely.
        test_recipe:
          setup:
            - "Source M exists: funder Rotary, period [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/funding-sources"
              payload: { name: "M", funder_name: "Rotary", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_budget_cents: 50000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { sm: $.data.id }
          trigger:
            - call: "POST /assistance/funding-sources"
              payload: { name: "N", funder_name: "Rotary", source_type: "GRANT_RESTRICTED", allowed_categories: ["UTILITY"], period_start: "2026-05-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", total_budget_cents: 50000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { err_n: $.data.error_id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "O", funder_name: "Rotary", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 50000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { so: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "P", funder_name: "Other Org", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-05-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", total_budget_cents: 50000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { sp: $.data.id }
          assert:
            - "${err_n} == ERR_SOURCE_PERIOD_OVERLAP (same funder, true overlap)"
            - "FundingSource.${so}.status == ACTIVE (adjacent half-open start == M's end is allowed)"
            - "FundingSource.${sp}.status == ACTIVE (overlap scope is per-funder; Other Org may overlap Rotary)"

      - name: household_service_month_bucket_capacity
        grounds:
          - entities.AssistanceApplication.fields.service_month
          - errors[ERR_SERVICE_MONTH_CONFLICT]
          - validations[priority=10]
        distinguishing_aspect: |
          Resource = Household, semantics = discrete month-bucket capacity 1 per
          (household, category, service_month) among applications NOT IN
          {DENIED, WITHDRAWN, CLOSED}: the same bucket is rejected wholesale, a
          different category or different month in the SAME wall-clock span is
          fine, and withdrawing frees the bucket — no interval arithmetic at all.
        test_recipe:
          setup:
            - "Household with one RENT 2026-08 application in INTAKE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/vendors"
              payload: { name: "City Power & Light", vendor_type: "UTILITY" }
              as: Caseworker
              captures: { ven_u: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Xu Yan", address: "12 Oak St", phone: "555-0501", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 10000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { err: $.data.error_id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven_u}", category: "UTILITY", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { a3: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { a4: $.data.id }
            - { call: "POST /assistance/applications/${a1}/withdraw", payload: {}, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 7000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { a5: $.data.id }
          assert:
            - "${err} == ERR_SERVICE_MONTH_CONFLICT (same household + category + month bucket)"
            - "AssistanceApplication.${a3}.status == INTAKE (UTILITY in the same month is a different bucket)"
            - "AssistanceApplication.${a4}.status == INTAKE (RENT in 2026-09 is a different bucket)"
            - "AssistanceApplication.${a5}.status == INTAKE (WITHDRAWN releases the 2026-08 RENT bucket)"

