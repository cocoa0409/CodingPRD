          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.50, kiln_run_id: "${ra}" }, captures: { ra_in_spec: "$.data.in_spec" } }
          assert:
            - "the 1.51 test on RB returns in_spec false with spec_min null and spec_max 1.50, unit PCT, and RB reads quality_state QUARANTINED"
            - "the trigger returns 201 with in_spec true, spec_max 1.50, unit PCT"
            - "RA reads quality_state PENDING_LAB with free_lime_pct 1.50 and process_state COMPLETED"
            - "POST /cement-ops/kiln-runs/${ra}/release-clinker then returns 200 with quality_state RELEASED"
            - "POST /cement-ops/kiln-runs/${rb}/release-clinker returns 422 ERR_FREE_LIME_OUT_OF_SPEC"

      - name: shc_tier_is_selected_from_the_provisional_tonnage_and_never_re_selected
        grounds: >
          calculations.clinker_output_from_fuel_energy selects effective_shc from
          provisional_clinker_tonnes (2160.00 / 3.60 = exactly 600.00, the inclusive lower edge of
          tier 2) and then divides the same gross energy by 3.70. The formula says SINGLE PASS ONLY:
          the step-4 result 583.78 sits inside tier 1 but must not re-select 4.00.
        distinguishing_aspect: >
          A re-tiering implementation returns clinker_tonnes 540.00 (2160.00 / 4.00); an
          implementation treating 600.00 as tier 1 (exclusive lower edge) returns the same 540.00.
          The correct answer is 583.78 with effective_shc_gj_per_tonne 3.70, and the difference
          propagates into nox_intensity (1.295 vs 1.400) and into the kiln feed check
          (904.86 vs 837.00 dry tonnes).
        test_recipe:
          setup: >
            Kiln K1 with nominal_shc 3.60 and a sealed pile carrying 1000.00 dry tonnes, so the
            904.86 t feed requirement is satisfiable and the completion is not masked by
            ERR_INSUFFICIENT_KILN_FEED. The run is lit and coal is the only fuel.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
