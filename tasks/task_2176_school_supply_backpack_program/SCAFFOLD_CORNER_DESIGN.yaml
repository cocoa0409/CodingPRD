              captures: { err: $.data.error_id }
          assert:
            - "PurchaseOrder.${po_id}.submitted_by_user_id == pd-1"
            - "HTTP status == 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "PurchaseOrder.${po_id}.status == SUBMITTED and approved_by_user_id == null"

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_distribution_event_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[registration-transition-stale-event]", "errors[ERR_STALE_EVENT_VERSION]", "validations[priority=10]"]
        distinguishing_aspect: "Reusing the event version observed before a committed transition returns 412 ERR_STALE_EVENT_VERSION and leaves the second registration in PENDING."
        test_recipe:
          setup:
            - "Lincoln Elementary is ACTIVE with a PUBLISHED one-backpack K_2 spec; a PUBLISHED event of 10 seats holds two PENDING registrations."
            - "The event version is read once and then consumed by verifying the first registration."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${school_id}", grade_band: "K_2", student_target_count: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${backpack_id}", qty_per_student: 1 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "PATCH /grade-kit-specs/${spec_id}/status"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "K_2", window_start: "2026-08-20T15:00:00Z", window_end: "2026-08-20T19:00:00Z", seat_capacity: 10 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-001", grade_band: "K_2", guardian_name: "G One", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-002", grade_band: "K_2", guardian_name: "G Two", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r2_id: $.data.id }
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v_observed: $.data.version }
