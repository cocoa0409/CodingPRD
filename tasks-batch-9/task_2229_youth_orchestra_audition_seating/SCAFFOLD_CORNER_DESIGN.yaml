      - name: empty_aid_pool_delinquency_and_member_dimension_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_AID_BUDGET]
          - errors[ERR_INVALID_MEMBER_TRANSITION]
          - errors[ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE]
          - validations[priority 22]
          - validations[priority 23]
          - validations[priority 45]
          - validations[priority 81]
          - state_machines.Member.transitions
          - state_machines.TuitionAccount.transitions
        distinguishing_aspect: |
          A season with aid_budget_cents 0 still ACCEPTS an aid request - the fiscal gate
          sits on the review, which answers 422 ERR_NO_AID_BUDGET, leaving the account
          stranded in REQUESTED. The member's two dimensions reject undeclared hops with 409
          ERR_INVALID_MEMBER_TRANSITION: ENROLLED -> ALUMNI is refused because ALUMNI is
          reachable only from GRADUATED, and STANDING CLEAR -> CLEAR is refused because a
          self-hop is not a declared transition. Once the clock passes tuition_due_at, the
          1-cent payment's balance recomputation flips the account to DELINQUENT and the
          member to FINANCIAL_HOLD, after which BOTH the graduation transition and the
          season's CLOSED hop answer 409 ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE - the same id
          from two different endpoints.
