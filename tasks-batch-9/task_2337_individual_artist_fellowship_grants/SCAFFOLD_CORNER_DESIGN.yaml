            - "CASH 2027: reportable_gross_cents == 600000, reportable_net_cents == 600000, installment_count == 1"
            - "CASH 2028: reportable_gross_cents == 0, reportable_net_cents == 0, installment_count == 0"
            - "The parameterless call returns tax_year 2027 and basis \"ACCRUAL\" with gross 1500000 — both defaults come from the logical clock and the declared default"
            - "The award read still shows status \"ACTIVE\", payment_status \"PARTIALLY_PAID\", disbursed_gross_cents == 600000 and undisbursed_gross_cents == 900000 — none of the four reads mutated it"

      - name: strike_requires_a_reason_code_before_it_notifies_the_applicant
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /grants/recommendation-slots/{recommendation_slot_id}/board-action]
          - state_machines.RecommendationSlot[PROPOSED->BOARD_STRUCK]
        distinguishing_aspect: |
          The STRIKE branch needs struck_reason_code, so the first call fails at
          P30 with ERR_INVALID_REQUEST, leaves the slot PROPOSED and — critically
          — does not increment the cycle version, which is why the very same
          expected_cycle_version still works on the retry. The successful strike
          notifies the applicant (NOT_RECOMMENDED with notified_at) and creates
          no Award.
