  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: seat_pool_capacity_half_open_zero_buffer_adjacency
        grounds:
          - calculations.seat_pool_occupancy
          - validations[priority=42]
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
          - entities.AddOnSubscription.fields.seats_available
          - concurrency_rules[device-seat-bind-stale-addon]
        distinguishing_aspect: |
          Interval semantics A: AGGREGATE capacity N over a HALF-OPEN occupation interval with
          SEAT_ADJACENCY_BUFFER_SECONDS 0 on the AddOnSubscription seat pool. Two of two seats are
          occupied so the third bind collides, yet releasing a seat and binding another at the very
          same logical instant is admitted — adjacency carries no buffer here.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE VPN add-on with seats_total 2."
            - "Both seats bound to the primary member; seats_bound 2, seats_available 0."
            - "Clock at the startup default 2026-05-01T00:00:00Z for every call, so the release and the following bind share one instant."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "VPN", seats_total: 2, per_seat_fee_cents: 300 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, addon_v1: $.data.version }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Laptop", expected_addon_version: "${addon_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat1_id: $.data.id }
            - call: "GET /addons/${addon_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_v2: $.data.version }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Tablet", expected_addon_version: "${addon_v2}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat2_id: $.data.id }
            - call: "GET /addons/${addon_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_v3: $.data.version }
          trigger:
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Phone", expected_addon_version: "${addon_v3}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err_full: $.data.error_id }
            - call: "POST /device-seats/${seat1_id}/release"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /addons/${addon_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_v4: $.data.version }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Phone", expected_addon_version: "${addon_v4}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat3_id: $.data.id }
          assert:
            - "Third bind against a full pool: HTTP 409 and data.error_id == ERR_SEAT_CAPACITY_EXCEEDED"
            - "After that failure AddOnSubscription.${addon_id}.seats_bound == 2 and seats_available == 0 and version is unchanged"
            - "After the release: DeviceSeat.${seat1_id}.status == RELEASED and AddOnSubscription.${addon_id}.seats_available == 1"
            - "The bind that immediately follows the release at the SAME instant succeeds: DeviceSeat.${seat3_id}.status == BOUND with bound_at == 2026-05-01T00:00:00.000Z"
            - "DeviceSeat.${seat1_id}.released_at == 2026-05-01T00:00:00.000Z — occupation ended and re-started at one identical instant, which the zero adjacency buffer permits"
            - "AddOnSubscription.${addon_id}.seats_bound == 2 and seats_available == 0 again"

      - name: exposure_channel_closed_interval_with_reopen_buffer
        grounds:
          - calculations.exposure_channel_occupancy
          - validations[priority=32]
          - validations[priority=35]
          - errors[ERR_DUPLICATE_REMOVAL_REQUEST]
          - errors[ERR_EXPOSURE_CHANNEL_BUFFER]
        distinguishing_aspect: |
          Interval semantics B on a different resource entity (the ExposureRecord removal channel):
          capacity ONE over a CLOSED occupation interval that ends at closed_at inclusive and is
          then extended by a 24-hour REQUEST_REOPEN_BUFFER_HOURS during which no successor may be
