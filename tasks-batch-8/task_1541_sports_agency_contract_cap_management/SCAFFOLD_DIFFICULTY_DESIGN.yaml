              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_old_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            # Transition client before sign
            - call: "POST /agencies/${agency_id}/clients/${c_id}/initiate_transition"
              payload: { target_agent_id: "${a_new_id}" }
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}"
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { con_v: $.data.version }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/sign"
              payload: { expected_contract_version: "${con_v}" }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE   # Client.status == TRANSITIONING blocks sign"
            - "Contract.${con_id}.signing_status == NEGOTIATING   # unchanged"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: tender_option_window_half_open_interval
        grounds:
          - state_machines.TenderOption.PENDING_to_EXERCISED
          - validations[priority=7]
        distinguishing_aspect: |
          Resource = TenderOption, interval semantic = HALF-OPEN [open, close).
          Exercise at exactly window_open_at MUST succeed (inclusive lower
          bound); exercise at exactly window_close_at MUST fail (exclusive
          upper bound). Different semantic from an adjacent-merge or
          aggregate-capacity model.
        test_recipe:
          setup:
            - "SIGNED contract, TenderOption window [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)"
            - "Logical clock will be moved via _clock/set_current_utc"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "TOHalfTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "TOHalfAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@to.example", cert_number: "MTO", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@to.example", cert_number: "ATO" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 5000000, guaranteed_cents: 5000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 5000000, proposed_guaranteed_cents: 5000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}"
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/sign"
              payload: { expected_contract_version: "${con_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/tender_options"
              payload: { kind: "TEAM_OPTION", window_open_at: "2026-08-10T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { tender_id: $.data.id }
          trigger:
            # Set clock to exactly window_open_at — exercise MUST succeed
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: LeagueOfficer
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/tender_options/${tender_id}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${a_id}"
          assert:
            - "TenderOption.${tender_id}.status == EXERCISED  # half-open lower bound is INCLUSIVE"
            - "TenderOption.${tender_id}.exercised_at == '2026-08-10T00:00:00Z'"

      - name: duplicate_active_contract_temporal_aggregate
        grounds:
          - validations[priority=11]
          - state_machines.Contract
        distinguishing_aspect: |
          Resource = (Client, Team) pair; interval semantic = AGGREGATE
          CAPACITY — at most one Contract in NEGOTIATING or SIGNED state for
          the pair at any moment, regardless of specific date intervals.
          Different from half-open window semantics: this is a status-based
          occupancy check, not a date-interval comparison. A second Contract
          create against the same (client, team) while one is NEGOTIATING
          MUST be rejected with ERR_DUPLICATE_ACTIVE_CONTRACT.
        test_recipe:
          setup:
            - "Client with one NEGOTIATING contract against Team T1"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "DupTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "DupAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@du.example", cert_number: "MDU", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@du.example", cert_number: "ADU" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 5000000, guaranteed_cents: 5000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con1_id: $.data.id }
          trigger:
            # Second create against same (client, team) while first is NEGOTIATING
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 2, base_salary_cents: 8000000, guaranteed_cents: 12000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_CONTRACT"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reserved_cents_invariant_across_submit_withdraw
        grounds:
          - calculations.cap_space_projection
          - state_machines.Proposal.DRAFT_to_SUBMITTED
          - state_machines.Proposal.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = CapSeason.reserved_cents. Invariant:
          submit(P) followed by withdraw(P) MUST leave reserved_cents equal
          to its pre-submit value. Pinned formula: reserved_cents(after
          submit then withdraw) == reserved_cents(before submit).
        test_recipe:
          setup:
            - "CapSeason with committed=0, reserved=0; DRAFT proposal P1 with aav=20M"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "InvTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "InvAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@i.example", cert_number: "MI", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@i.example", cert_number: "AI" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 20000000, guaranteed_cents: 20000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 20000000, proposed_guaranteed_cents: 20000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_pre: $.data.version, reserved_pre: $.data.reserved_cents }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_pre}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/withdraw"
              payload: {}
              as: Agent
              as_user_id: "${a_id}"
          assert:
            - "Proposal.${p_id}.status == WITHDRAWN"
            - "CapSeason.${cs_id}.reserved_cents == 0   # invariant: forward+compensating action restores original value"

      - name: fee_ledger_invariant_across_transition_split
        grounds:
          - calculations.transition_split_fee
        distinguishing_aspect: |
          Conserved quantity = total fee amount_cents across the SPLIT. When
          a client transition splits a signed contract's remaining fee into
          two TRANSITION_ADJUSTMENT entries (old 25%, new 75%), the sum of
          the two entries MUST equal the unsplit remaining fee (any rounding
          residue goes to the NEW agent). Different conserved quantity from
          reserved_cents. Pinned formula:
          entry_old.amount_cents + entry_new.amount_cents ==
          round_half_up(aav_cents * remaining_years * fee_cap_pct).
        test_recipe:
          setup:
            - "Agency fee_cap_pct = 0.04; client with SIGNED contract years=3, aav=10,000,000, start_season_year=2026"
            - "Current season = 2026 (clock at 2026-08-01) → remaining_years = 3 - 0 = 3"
            - "remaining_fee = round_half_up(10,000,000 * 3 * 0.04) = 1,200,000"
            - "old split = round_half_up(1,200,000 * 0.25) = 300,000"
            - "new split = 1,200,000 - 300,000 = 900,000 (residue to new)"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "SplitTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "SplitAgency", fee_cap_pct: 0.04 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@sp.example", cert_number: "MSP", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Old", email: "o@sp.example", cert_number: "AOSP" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_old_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_old_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "New", email: "n@sp.example", cert_number: "ANSP" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_new_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_new_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_old_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 3, base_salary_cents: 10000000, guaranteed_cents: 25000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_old_id}", proposed_aav_cents: 10000000, proposed_guaranteed_cents: 10000000 }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_old_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}"
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { con_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/sign"
              payload: { expected_contract_version: "${con_v}" }
              as: Agent
              as_user_id: "${a_old_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/initiate_transition"
              payload: { target_agent_id: "${a_new_id}" }
              as: AgencyManager
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/complete_transition"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          assert:
            - "Client.${c_id}.status == ACTIVE"
            - "Client.${c_id}.primary_agent_id == ${a_new_id}"
            - "FeeLedgerEntry for contract ${con_id} agent ${a_old_id} kind=TRANSITION_ADJUSTMENT has amount_cents == 300000"
            - "FeeLedgerEntry for contract ${con_id} agent ${a_new_id} kind=TRANSITION_ADJUSTMENT has amount_cents == 900000"
            - "300000 + 900000 == 1200000   # invariant: split conserves total"
