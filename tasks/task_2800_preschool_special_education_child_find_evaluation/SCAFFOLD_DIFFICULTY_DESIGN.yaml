  - rule_id: resource_temporal_overlap
    instances:

      - name: screening_event_windows_overlap_per_site_half_open_with_no_buffer
        grounds:
          - validations[priority=21]
          - errors.ERR_SITE_EVENT_OVERLAP
          - endpoints[POST /child-find/screening-events]
        distinguishing_aspect: |
          The overlap test is scoped to one site, uses half-open intervals with
          NO buffer and ignores CANCELLED events: a window straddling an existing
          one is refused, a back-to-back window that starts exactly when the
          other ends is accepted, the same straddling window at a different site
          is accepted, and once the incumbent is CANCELLED the previously refused
          window becomes bookable.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE screening_host_approved sites S1 and S2."
            - "Site S1 already hosts event A on 2026-08-20T09:00Z-12:00Z in SCHEDULED."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/community-sites"
              payload: { name: "Harbor Head Start", region_code: "R-2", licensed_capacity: 25, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site2_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "A morning", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_a_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "B straddling", window_start_utc: "2026-08-20T11:00:00Z", window_end_utc: "2026-08-20T13:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "C adjacent", window_start_utc: "2026-08-20T12:00:00Z", window_end_utc: "2026-08-20T14:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_c_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site2_id}", event_label: "D other site", window_start_utc: "2026-08-20T11:00:00Z", window_end_utc: "2026-08-20T13:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_d_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_a_id}/status"
              payload: { target_status: "CANCELLED" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "E reuse of the cancelled window", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_e_id: "$.data.id" }
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_SITE_EVENT_OVERLAP\""
            - "second response.status_code == 201"
            - "ScreeningEvent.${event_c_id}.status == \"SCHEDULED\""
            - "ScreeningEvent.${event_c_id}.effective_slot_capacity == 4"
            - "third response.status_code == 201"
            - "ScreeningEvent.${event_d_id}.site_id == \"${site2_id}\""
            - "ScreeningEvent.${event_a_id}.status == \"CANCELLED\""
            - "fifth response.status_code == 201"
            - "ScreeningEvent.${event_e_id}.window_start_utc == \"2026-08-20T09:00:00Z\""
            - "GET /child-find/screening-events?site_id=${site1_id} returns total_count == 3"
            - "GET /child-find/screening-events?site_id=${site2_id} returns total_count == 1"

      - name: evaluator_assessment_windows_need_a_travel_buffer_only_across_sites
        grounds:
          - validations[priority=22]
          - errors.ERR_EVALUATOR_WINDOW_CONFLICT
          - endpoints[POST /child-find/evaluation-cases/{id}/domain-assessments]
        distinguishing_aspect: |
          The same evaluator's back-to-back 10:00-11:00 assessment is accepted
          when both sessions are at the district centre (null assessment_site_id,
          zero buffer, half-open adjacency), yet an 11:00-12:00 session at a
          community site is refused because TRAVEL_BUFFER_MINUTES 30 is added on
          both ends once the sites differ; pushing that same session to
          11:30-12:30 clears the buffer exactly and is accepted.
