        grounds:
          - state_machines.CostChangeRequest.SUBMITTED_to_ACCEPTED
          - state_machines.Specification.LOCKED_to_SUPERSEDE_PENDING
          - state_machines.ArtworkRound.nutrition_status.VALID_to_INVALIDATED
          - state_machines.LabelClaim.APPROVED_to_RESCINDED
          - state_machines.ProductItem.LAUNCHED_to_RELAUNCH_PENDING
          - calculations.landed_unit_cost
        distinguishing_aspect: |
          Depth-5 chain originating in the CostChangeRequest ACCEPT transition, each hop caused by
          the previous one: cost model base moves 221 -> 238, THEREFORE the pinning specification
          leaves LOCKED for SUPERSEDE_PENDING, THEREFORE (scope INGREDIENT) the pinned artwork
          round's nutrition_status becomes INVALIDATED, THEREFORE the APPROVED nutrient-content
