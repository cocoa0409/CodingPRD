  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: profile_unlink_blocked_by_entitlement_state
        grounds:
          - state_machines.ServiceProfile.LINKED_to_UNLINKED
          - validations[priority=22]
          - entities.Entitlement.fields.service_profile_id
        distinguishing_aspect: |
          Entity pair ServiceProfile <- Entitlement: the profile's
          LINKED->UNLINKED transition is legal only when NO entitlement on the
          profile is PROVISIONING or ACTIVE. While the subscription's
          entitlement is ACTIVE the unlink is rejected; after the subscription
          is cancelled (entitlement REVOKED) the same unlink succeeds.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS subscription whose entitlement sits on the DPLUS profile; first unlink attempt (blocked), then cancel with immediate_effect and clock advance to finalize"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ce1@x.com", full_name: "CE One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/service-profiles/${prof_dplus}/unlink"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: true }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/service-profiles/${prof_dplus}/unlink"
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "First unlink returned HTTP 409 with error_id == ERR_PROFILE_HAS_ACTIVE_ENTITLEMENTS"
            - "Second unlink returns HTTP 200"
            - "ServiceProfile.${prof_dplus}.profile_status == UNLINKED"

      - name: entitlement_activation_blocked_by_unlinked_profile
        grounds:
          - state_machines.Entitlement.PROVISIONING_to_ACTIVE
          - state_machines.Subscription.lifecycle_status
        distinguishing_aspect: |
          Entity pair Entitlement <- ServiceProfile (distinct pair from
          instance 1's direction and from instance 3): subscription creation
          referencing an UNLINKED profile cannot provision its entitlement, so
          the subscription stays PENDING_ENTITLEMENT rather than ACTIVE —
          entitlement activation preconditioned on profile state.
        test_recipe:
          setup:
            - "Subscriber with a DPLUS profile created and immediately unlinked (no entitlements ever attached, so unlink is legal); then a subscription purchase referencing the UNLINKED profile"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ce2@x.com", full_name: "CE Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/service-profiles/${prof_dplus}/unlink"
              as: Subscriber
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.lifecycle_status == PENDING_ENTITLEMENT"
            - "GET /streaming/subscriptions/${sub_id}/entitlements shows 1 entitlement in PROVISIONING"
            - "SubscriberAccount.${sa_id}.grandfathered_price_cents == null (lock not taken — no activation)"

      - name: account_reactivate_blocked_by_pastdue_subscription
        grounds:
          - state_machines.SubscriberAccount.SUSPENDED_to_ACTIVE
          - state_machines.Subscription.lifecycle_status
        distinguishing_aspect: |
          Entity pair SubscriberAccount <- Subscription (distinct pair):
          reactivation of a SUSPENDED account is preconditioned on having no
          subscription in PAST_DUE lifecycle. With a failed renewal leaving
          the subscription PAST_DUE the reactivate is rejected
          (ERR_INVALID_STATE); after the FAILED invoice is retried
          successfully (subscription recovers to ACTIVE), the identical
          reactivate succeeds — the account transition is gated on the
          subscription's state.
        test_recipe:
          setup:
            - "PLATFORM subscriber with DPLUS_ADS subscription; renewal at 2026-10-01 FAILED (subscription PAST_DUE); account suspended by Support; failed invoice id captured"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ce3@x.com", full_name: "CE Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { inv_id: $.data.invoice_id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/suspend"
              as: Support
            - call: "POST /streaming/subscriber-accounts/${sa_id}/reactivate"
              as: Support
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /streaming/invoices/${inv_id}/retry-payment"
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/subscriber-accounts/${sa_id}/reactivate"
              as: Support
          assert:
            - "First reactivate returned HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.lifecycle_status == ACTIVE after retry"
            - "SubscriberAccount.${sa_id}.account_status == ACTIVE after second reactivate"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_active_subscription_period_overlap
        grounds:
          - validations[priority=25]
          - errors[ERR_DUPLICATE_ACTIVE_SUBSCRIPTION]
          - calculations.renewal_collection
        distinguishing_aspect: |
          Resource: the (account, plan_code) interval. Interval semantics:
          half-open billing periods [period_start, period_end). A second
          non-terminal subscription for the SAME plan_code is rejected while
          the first occupies ANY non-terminal lifecycle — including
          CANCEL_SCHEDULED whose occupation still extends to
          cancel_effective_at — but is accepted once the first is finalized
          (CANCELLED) by the clock crossing period_end, proving the occupation
          ends exactly at the half-open boundary.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS subscription created 2026-09-01 (period [09-01, 10-01)); cancel scheduled at period end; a second purchase of DPLUS_ADS attempted while scheduled (rejected); clock advanced to 2026-10-01 (finalize fires at boundary), purchase retried (accepted)"
