scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_pending_kyc_defaults
        claim_type: Creation
        grounds:
          - "entities.Account"
          - "endpoints"
        distinguishing_aspect: "POST /accounts with all required fields returns 201 with status=PENDING_KYC, options_level=0, margin_type=CASH, version=1, and a server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
          assert:
            - "response.status == 201"
            - "Account.${acct_a}.status == PENDING_KYC"
            - "Account.${acct_a}.options_level == 0"
            - "Account.${acct_a}.margin_type == CASH"
            - "Account.${acct_a}.version == 1"
            - "Account.${acct_a}.cash_balance_cents == 0"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Account"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Account.fields.legal_name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /accounts omitting required legal_name returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: cash_balance_defaults_to_zero_when_omitted
        claim_type: Defaults
        grounds:
          - "entities.Account.fields.cash_balance_cents"
        distinguishing_aspect: "Omitting cash_balance_cents on POST /accounts applies default 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
          assert:
            - "Account.${acct_a}.cash_balance_cents == 0"

      - name: order_create_invalid_enum_order_type_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Order.fields.order_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /orders with order_type not in {LIMIT, STOP, TAKE_PROFIT} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Account active"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", side: "BUY", order_type: "MARKET", quantity: 1, limit_price_cents: 1000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: daytrade_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.DayTrade"
        distinguishing_aspect: "DayTrade is common_fields:false (append-only): it has no update/transition endpoint and no version field; rows are only created as a fill side-effect and read via GET /day-trades."
        test_recipe:
          setup: ["Account active; one same-day closing order FILLED producing a DayTrade row"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 3000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "DT", instrument_type: "EQUITY", side: "SELL", order_type: "LIMIT", quantity: 1, limit_price_cents: 100, opened_position_same_day: true, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
            - call: "POST /orders/${ord}/fill"
              payload: { fill_quantity: 1 }
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "GET /day-trades"
              payload: { account_id: "${acct_a}" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { count: $.meta.total_count }
          assert:
            - "response.status == 200"
            - "GET /day-trades?account_id=${acct_a} returns exactly 1 DayTrade row whose closing_order_id == ${ord}"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_account_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Account.PENDING_KYC_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "An ACTIVE account has no ACTIVE->ACTIVE transition; POST /accounts/{id}/activate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account active"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_without_w9_certified_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Account.PENDING_KYC_to_ACTIVE"
          - "errors[ERR_W9_NOT_CERTIFIED]"
          - "validations[priority=6]"
        distinguishing_aspect: "PENDING_KYC->ACTIVE precondition w9_certified==true: activating an account opened with w9_certified=false returns ERR_W9_NOT_CERTIFIED (422)."
        test_recipe:
          setup: ["Account PENDING_KYC opened with w9_certified=false"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: false, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_W9_NOT_CERTIFIED"

      - name: activate_under_18_returns_kyc_age_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Account.PENDING_KYC_to_ACTIVE"
          - "errors[ERR_KYC_AGE]"
        distinguishing_aspect: "PENDING_KYC->ACTIVE age precondition: an account whose holder is under 18 on created_at returns ERR_KYC_AGE (422)."
        test_recipe:
          setup: ["Account PENDING_KYC opened with date_of_birth making holder under 18 as of 2026"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "2015-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_KYC_AGE"

      - name: restore_restricted_pdt_account_below_equity_min_returns_equity_call
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Account.RESTRICTED_to_ACTIVE"
          - "errors[ERR_PDT_EQUITY_CALL]"
        distinguishing_aspect: "RESTRICTED->ACTIVE on a pdt_flagged account with equity_cents < 2500000 returns ERR_PDT_EQUITY_CALL (409)."
        test_recipe:
          setup: ["Account flagged PDT and RESTRICTED via 4 same-day day trades under $25k equity"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 100000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /_day-trades/seed"
              payload: { account_id: "${acct_a}", trade_date: "2026-06-01", count: 4 }
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PDT_EQUITY_CALL"

      - name: terminal_closed_account_cannot_transition
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Account.ACTIVE_to_CLOSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CLOSED account is terminal; POST /accounts/{id}/restrict returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account active with no positions/transfers, then closed"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /accounts/${acct_a}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /accounts/${acct_a}/restrict"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: account_close_blocked_by_pending_transfer
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Account.ACTIVE_to_CLOSED"
          - "errors[ERR_PENDING_TRANSFER]"
        distinguishing_aspect: "ACTIVE->CLOSED precondition: a REQUESTED ACAT transfer blocks close with ERR_PENDING_TRANSFER (409)."
        test_recipe:
          setup: ["Account active with one REQUESTED ACAT transfer"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "IN", counterparty_dtc: "0226", transfer_value_cents: 100000 }
              as: AccountHolder
              as_user_id: "h_a"
          trigger:
            - call: "POST /accounts/${acct_a}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PENDING_TRANSFER"

      - name: restrict_rejects_pending_options_approval_cascade
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Account.ACTIVE_to_RESTRICTED"
          - "state_machines.OptionsApproval.DRAFT_to_SUBMITTED"
        distinguishing_aspect: "ACTIVE->RESTRICTED cascade: a SUBMITTED OptionsApproval transitions to REJECTED with rejection_reason='ACCOUNT_RESTRICTED'."
        test_recipe:
          setup: ["Account active with one SUBMITTED level-1 OptionsApproval"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 1 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa1: $.data.id }
            - call: "POST /options-approvals/${oa1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /accounts/${acct_a}/restrict"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "Account.${acct_a}.status == RESTRICTED"
            - "OptionsApproval.${oa1}.status == REJECTED"
            - "OptionsApproval.${oa1}.rejection_reason == ACCOUNT_RESTRICTED"

      - name: options_approval_level_skip_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.OptionsApproval.DRAFT_to_SUBMITTED"
          - "errors[ERR_LEVEL_SKIP]"
          - "validations[priority=9]"
        distinguishing_aspect: "DRAFT->SUBMITTED precondition requested_level==options_level+1: submitting a level-2 approval on an account at options_level 0 returns ERR_LEVEL_SKIP (422)."
        test_recipe:
          setup: ["Account active at options_level 0; a DRAFT level-2 approval"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 2 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa2: $.data.id }
          trigger:
            - call: "POST /options-approvals/${oa2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_LEVEL_SKIP"

      - name: margin_upgrade_noop_same_type_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.MarginUpgrade.DRAFT_to_SUBMITTED"
          - "errors[ERR_MARGIN_NOOP]"
        distinguishing_aspect: "DRAFT->SUBMITTED precondition requested_margin_type != current: a MarginUpgrade requesting REG_T when... actually requesting CASH-equivalent; here requesting the account's current CASH-derived type is impossible so we request REG_T after the account is already REG_T."
        test_recipe:
          setup: ["Account active, already upgraded to REG_T; a new DRAFT MarginUpgrade also requesting REG_T"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_a}", requested_margin_type: "REG_T" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu1: $.data.id }
            - call: "POST /margin-upgrades/${mu1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { v1: $.data.version }
            - call: "POST /margin-upgrades/${mu1}/approve"
              payload: { expected_account_version: "${v1}" }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_a}", requested_margin_type: "REG_T" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu2: $.data.id }
          trigger:
            - call: "POST /margin-upgrades/${mu2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MARGIN_NOOP"

      - name: pma_upgrade_below_equity_minimum_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.MarginUpgrade.DRAFT_to_SUBMITTED"
          - "errors[ERR_PMA_EQUITY_MINIMUM]"
          - "validations[priority=11]"
        distinguishing_aspect: "DRAFT->SUBMITTED PMA gate: submitting a PMA upgrade with equity_cents=1000000 (< 15000000) returns ERR_PMA_EQUITY_MINIMUM (422)."
        test_recipe:
          setup: ["Account active, CASH, equity 1000000; a DRAFT PMA MarginUpgrade"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_a}", requested_margin_type: "PMA" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu1: $.data.id }
          trigger:
            - call: "POST /margin-upgrades/${mu1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PMA_EQUITY_MINIMUM"

      - name: order_missing_price_for_order_type_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Order.DRAFT_to_ACCEPTED"
          - "calculations.trigger_eligibility"
          - "errors[ERR_MISSING_PRICE]"
          - "validations[priority=10]"
        distinguishing_aspect: "DRAFT->ACCEPTED price gate: a TAKE_PROFIT order accepted with stop_price_cents but no limit_price_cents returns ERR_MISSING_PRICE (422)."
        test_recipe:
          setup: ["Account active; a DRAFT TAKE_PROFIT order missing limit_price_cents"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 100000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", side: "BUY", order_type: "TAKE_PROFIT", quantity: 1, stop_price_cents: 5000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/accept"
              payload: {}
              as: AccountHolder
