            # docs for B
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents"
              payload: { doc_type: "SUBSCRIPTION_AGREEMENT", file_uri: "s3://bb/sub" }
              as: Investor
              as_user_id: "${inv_b}"
              captures: { db_sub: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents"
              payload: { doc_type: "W9", file_uri: "s3://bb/w9" }
              as: Investor
              as_user_id: "${inv_b}"
              captures: { db_w9: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://bb/suit" }
              as: Investor
              as_user_id: "${inv_b}"
              captures: { db_suit: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents/${db_sub}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents/${db_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/documents/${db_suit}/accept"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_a}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_a}"
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_b}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_b}"
              captures: { err_b: $.data.error_id }
          assert:
            - "Subscription.${sub_a}.status == SUBMITTED (boundary accepted)"
            - "Subscription.${sub_b} submission rejected: error_id == ERR_BELOW_MIN_SUBSCRIPTION (HTTP 422)"

      - name: capital_event_proceeds_strictly_greater
        grounds:
          - validations[priority=8d]
          - entities.CapitalEvent.fields.gross_proceeds_cents
          - entities.CapitalEvent.fields.debt_payoff_cents
        distinguishing_aspect: |
          Metric: gross_proceeds_cents vs debt_payoff_cents on capital-event
          execution. Boundary is STRICTLY GREATER — equal proceeds must be
          REJECTED (net_distributable would be 0, and ERR_EMPTY_DISTRIBUTION_POOL
          would later fire), while gross > debt by exactly 1 cent must be
          accepted. Distinct endpoint: POST /capital-events/{id}/execute.
        test_recipe:
          setup:
            - "Two properties: P1 and P2, both OWNED"
            - "P1: CapitalEvent with gross_proceeds_cents=1000000, debt_payoff_cents=1000000 (equal — must fail)"
            - "P2: CapitalEvent with gross_proceeds_cents=1000001, debt_payoff_cents=1000000 (1 cent above — must succeed)"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "BpSyn", sponsor_legal_entity: "Bp LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: $.data.id }
