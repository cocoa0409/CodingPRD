  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_state_check_beats_payment_method_check_on_pay
        grounds:
          - validations[priority=25]
          - validations[priority=90]
          - errors[ERR_INVOICE_NOT_PAYABLE]
          - errors[ERR_PAYMENT_METHOD_REQUIRED]
          - calculations.account_credit_balance
        distinguishing_aspect: |
          Category pair `state` (priority 25, ERR_INVOICE_NOT_PAYABLE) vs `business_fiscal`
          (priority 90, ERR_PAYMENT_METHOD_REQUIRED). A second pay on an already-PAID invoice by
          an account with no card and only 702 cents of credit violates BOTH; the state check
          wins with 409 ERR_INVOICE_NOT_PAYABLE.
        test_recipe:
          setup:
            - "Account with NO card on file and 2000 cents of granted store credit."
            - "example.com registration invoice (total 1298) already PAID entirely out of credit, leaving 702 cents of credit."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "credit@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/credits"
              payload: { amount_cents: 2000, reason: "welcome credit" }
              as: BillingAdmin
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: false, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: true }
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: true }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVOICE_NOT_PAYABLE' (NOT 'ERR_PAYMENT_METHOD_REQUIRED', although the 702-cent credit could not cover the 1298-cent total and no card is on file)"
            - "Account.${acct_id}.credit_balance_cents == 702 (unchanged by the rejected call)"
            - "Account.${acct_id}.payment_method_on_file == false"
            - "Invoice.${inv_id}.status == 'PAID' and amount_paid_cents == 1298"

      - name: abuse_hold_check_beats_registrar_lock_check_on_transfer_out
        grounds:
          - validations[priority=50]
          - validations[priority=65]
          - errors[ERR_ABUSE_HOLD_ACTIVE]
          - errors[ERR_DOMAIN_LOCKED]
          - state_machines.TransferRequest.INITIATED_to_PENDING_ACK
        distinguishing_aspect: |
          A DIFFERENT category pair — `business_safety` (priority 50, ERR_ABUSE_HOLD_ACTIVE) vs
          `business_constraint` (priority 65, ERR_DOMAIN_LOCKED). An outbound transfer for a
          still-ACTIVE but still-LOCKED domain that has an UNDER_REVIEW abuse report violates
          both; the safety check wins with ERR_ABUSE_HOLD_ACTIVE.
        test_recipe:
          setup:
            - "Account with a card; example.com ACTIVE since 2026-05-01 and still LOCKED."
            - "Clock at 2026-07-15, so the 60-day post-registration lock period has already elapsed and only the registrar lock itself blocks the transfer."
            - "One abuse report on the domain, moved to UNDER_REVIEW by analyst-1 (the domain is therefore still ACTIVE, not SUSPENDED)."
            - "An outbound TransferRequest carrying the domain's correct EPP auth code, in INITIATED."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "hold@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: false, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { epp: $.data.epp_auth_code }
            - call: "POST /registrar/abuse-reports"
              payload: { domain_id: "${dom_id}", category: "MALWARE", severity: "HIGH", reporter_email: "watch@ngo.example" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /registrar/abuse-reports/${rep_id}/review"
              payload: {}
              as: AbuseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /registrar/transfer-requests"
              payload: { account_id: "${acct_id}", direction: "OUT", domain_name: "example", tld: "com", epp_auth_code: "${epp}", domain_id: "${dom_id}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_ABUSE_HOLD_ACTIVE' (NOT 'ERR_DOMAIN_LOCKED', although Domain.lock_status is LOCKED)"
            - "TransferRequest.${tr_id}.status == 'INITIATED' and attempt_count == 0"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE' and lock_status == 'LOCKED'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_at_exactly_70_auto_suspends_the_account
        grounds:
          - calculations.account_risk_score
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - entities.Account.fields.risk_score
        distinguishing_aspect: |
          Numeric threshold boundary on Account.risk_score reached through
          POST /abuse-reports/{id}/uphold: two upheld HIGH reports leave the score at exactly 60
          and the account ACTIVE; a third upheld LOW report lands the score on exactly 70, and
          because the rule is `>= AUTO_SUSPEND_THRESHOLD` (not `>`), the account suspends at 70.
        test_recipe:
          setup:
            - "Account with a card and three ACTIVE domains: example.com, shop.net, blog.xyz."
            - "Three abuse reports — HIGH on example.com, HIGH on shop.net, LOW on blog.xyz — all UNDER_REVIEW by analyst-1."
            - "The two HIGH reports are already upheld by analyst-2, so risk_score is exactly 60 and the account is still ACTIVE."
