              payload: { lot_id: "${lot1}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { run1: $.data.id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${run1}", spc_chart_id: "${chart}", measured_value: 103.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { c1: $.data.classification, d1: $.data.deviation_sigma, e1: $.data.excursion_id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${run1}", spc_chart_id: "${chart}", measured_value: 103.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { c2: $.data.classification, r2: $.data.run_rule_triggered }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${run1}", spc_chart_id: "${chart}", measured_value: 103.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { c3: $.data.classification, r3: $.data.run_rule_triggered }
          trigger:
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${run1}", spc_chart_id: "${chart}", measured_value: 103.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { c4: $.data.classification, r4: $.data.run_rule_triggered, exc: $.data.excursion_id }
          assert:
            - "${c1} == IN_CONTROL and ${d1} == 1.5000 and ${e1} == null"
            - "${c2} == IN_CONTROL and ${r2} == false"
            - "${c3} == IN_CONTROL and ${r3} == false"
            - "HTTP status == 201"
            - "${c4} == IN_CONTROL"
            - "${r4} == true"
            - "${exc} != null"
            - "SpcChart.${chart}.consecutive_same_side_count == 4"
            - "SpcChart.${chart}.last_side == ABOVE"
            - "SpcChart.${chart}.violation_count == 1"
            - "SpcChart.${chart}.status == MONITORING"
            - "Excursion.${exc}.source_type == SPC"
            - "Excursion.${exc}.trigger_value == 103.0000"
            - "Excursion.${exc}.severity_score == 21.00"
            - "Excursion.${exc}.severity_band == LOW"
            - "Excursion.${exc}.severity_variant == PROVISIONAL"
            - "Excursion.${exc}.affected_lot_count == 1"
            - "Lot.${lot1}.hold_state == NONE"

      - name: one_particle_reading_ripples_through_five_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.entity_topology
          - state_machines.Chamber.QUALIFIED_to_DISQUALIFIED
        excluded_because:
          difficulty_instance: particle_reading_cascades_five_deep_to_lot_qual_hold
          rationale: "That §1.8 instance files a single particle reading and walks the whole chain — Excursion opened and auto-contained, Chamber DISQUALIFIED, Equipment driven DOWN, the OPEN StepRun ABORTED with its reserved hours refunded and the Lot put on QUAL_HOLD — which is this cascade claim in full."

      - name: the_dispatch_score_has_two_variants_selected_by_lot_priority
        claim_type: dual_variant_calculation
        grounds:
          - calculations.chamber_dispatch_score
          - entities.Lot.fields.priority_class
        excluded_because:
          difficulty_instance: chamber_dispatch_super_hot_waiver_flips_winning_chamber
          rationale: "That §1.8 instance scores the same two chambers under both variants and shows the SUPER_HOT waiver of the PM-proximity term changing which chamber wins, which is exactly the dual-variant claim for this calculation."

