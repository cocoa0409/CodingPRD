            - call: "POST /cath-lab/cases/${case_d_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_d_id}/staff-assignments"
