      - name: adas_damage_without_a_calibration_procedure_blocks_blueprint
        claim_type: violation_to_error
        grounds:
          - validations.priority_54
          - errors.ERR_ADAS_PROCEDURE_RESEARCH_MISSING
          - entities.DamageLine.fields.adas_component_touched
        distinguishing_aspect: >-
          A STRUCTURAL procedure record does not satisfy the ADAS research requirement, and neither does
          an ADAS record with requires_calibration false - the rule demands both attributes on one row.
          The order already has a teardown finding, so rule 70 is satisfied and the answer must be the
          422 research error rather than a missing-findings complaint.
        test_recipe:
          setup:
            - "An order with one teardown finding carrying adas_component_touched true."
            - "One ProcedureRecord with operation_scope STRUCTURAL and requires_calibration false."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus Tal", phone: "555-1032", email: "gus@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-32", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90037", vehicle_vin: "1HGCV1F30LA090037", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "FRT-BUMPER", severity: "MODERATE", adas_component_touched: true }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "SEAM-SEAL", source: "ALLDATA", operation_scope: "STRUCTURAL" }
              as: Estimator
              as_user_id: "est-100"
              captures: { pr_struct: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_ADAS_PROCEDURE_RESEARCH_MISSING"
            - "RepairOrder.${ro_id}.stage == TEARDOWN, blueprint_by_user_id null, refinish_hours_provisional 0"
            - "after POST /repair-orders/${ro_id}/procedure-records with operation_scope ADAS, requires_calibration true and calibration_type STATIC, the identical blueprint call succeeds and the order is BLUEPRINTED"
            - "GET /procedure-records?repair_order_id=${ro_id}&calibration_status=REQUIRED then returns total_count 1"

      - name: a_new_line_after_the_lock_must_name_an_open_supplement
        claim_type: violation_to_error
        grounds:
          - validations.priority_84
          - errors.ERR_SUPPLEMENT_REQUIRED
          - entities.EstimateLine.fields.supplement_id
        distinguishing_aspect: >-
          Past BLUEPRINTED the estimate is closed to unsupplemented work: the same payload that was
          legal one stage earlier is now ERR_SUPPLEMENT_REQUIRED (422). The refusal is not a stage
          precondition - the endpoint stays open - and adding the supplement_id makes the identical
          request succeed, landing the line in PENDING_SUPPLEMENT rather than DRAFT.
        test_recipe:
          setup:
