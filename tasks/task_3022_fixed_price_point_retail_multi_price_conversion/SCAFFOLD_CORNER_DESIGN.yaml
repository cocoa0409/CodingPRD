  # ===========================================================================
  - section: endpoints
    instances:

      - name: conversion_project_create_increments_the_store_version_under_occ
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/merchandise/conversion-projects
          - concurrency_rules[conversion-create-stale-store]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The guarded create reads expected_store_version and, on success, advances Store.version by one — so the same token replayed strictly afterwards is a 412 ERR_STALE_VERSION while the first call returned 201."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point, an ACTIVE 300-cent point, and a store already CONVERTING from its SINGLE_PRICE start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
              captures: { store_v: $.data.version }
          trigger:
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_v}" }
              as: StoreOperationsManager
              captures: { project_id: $.data.id }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_v}" }
              as: StoreOperationsManager
              captures: { err_stale: $.data.error_id }
          assert:
            - "the first create returns 201 with ConversionProject.${project_id}.status == DRAFT"
            - "the replayed create returns 412 and err_stale == ERR_STALE_VERSION"
            - "GET /merchandise/stores/${store_id} reports a version strictly greater than ${store_v} — the successful create advanced it"
            - "GET /merchandise/stores/${store_id}/conversion-projects returns exactly 1 row"
            - "the loser's observed store version ${store_v} was genuinely superseded by the winner's own write, not by a wall-clock elapsed window"

      - name: coverage_read_returns_the_computed_shortfall_projection
        claim_type: Computed read
        grounds:
          - endpoints.GET_/merchandise/conversion-projects/{id}/coverage
          - calculations.conversion_coverage_shortfall
        distinguishing_aspect: "The coverage read is a derived projection, not a stored value: it recomputes completed, projected, adjusted_baseline, coverage_delta_pct and shortfall on every call, so executing one more reset changes the answer without any write to the project."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point, a CONVERTING store, an OPEN season window and two PLANNED resets on distinct aisles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
