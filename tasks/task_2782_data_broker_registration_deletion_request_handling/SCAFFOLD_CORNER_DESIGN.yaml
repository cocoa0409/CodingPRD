      - name: suppression_lift_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.SuppressionEntry.transitions.ACTIVE_to_LIFTED
          - validations.priority_23.ERR_SUPPRESSION_INVALID_STATE
        distinguishing_aspect: >
          The lift action is not idempotent: the first call moves ACTIVE to LIFTED and stores the
          justification, and the second must return ERR_SUPPRESSION_INVALID_STATE at HTTP 409
          leaving the first justification and the version from the first lift intact.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker, one CA Consumer, one RECEIVED DeletionRequest, and one ACTIVE SuppressionEntry with the default 730-day window."
          setup_api_calls:
