            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "9 Cap St", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SPRINKLER_HEAD", serial_no: "SH-C1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Carl Cap", nicet_level: "III" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "SPRINKLER", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-12T09:30:00Z", scheduled_end: "2026-08-12T10:30:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-12T08:30:00Z", scheduled_end: "2026-08-12T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_TECHNICIAN_CAPACITY"
            - "HTTP status == 409"
            - "note: closed-closed intersection means the 4th event (10:00..11:00) touches event 1 (ends 10:00), overlaps event 2 (09:30..10:30), and touches event 3 (ends 10:00) -> 3 pre-existing overlapping leads -> 4th rejected; event 3 itself (08:30..10:00) was accepted with only 2 pre-existing overlaps"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deficiency_reject_reopens_with_fee_invariant
        grounds:
          - state_machines.Deficiency.CORRECTED_to_OPEN
          - calculations.deficiency_late_fee
          - entities.Deficiency.fields.correction_deadline
        distinguishing_aspect: |
          Conserved quantity: correction_deadline. Forward action
          attest-correction followed by compensating reject-correction must
          leave correction_deadline byte-identical to its pre-attest value and
          restore status OPEN with corrected_at == null — no deadline drift
          across the action pair.
        test_recipe:
          setup:
            - "Completed event 2026-08-03 with NONCRITICAL deficiency (deadline 2026-09-02)"
            - "Attest correction on 2026-08-20 then reject"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
