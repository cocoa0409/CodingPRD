            - "the v2 read returns state SCHEDULED, span_start_date 2026-08-25, span_end_date 2026-08-25, completed_at null and report_count 0 — a window inside one UTC day spans exactly that day"
            - "the cycle_id filter returns total_count 2 with has_more false, and the two rows carry different reviewer_id values"
            - "the reviewer_id filter for r2 returns total_count 1 with only ${v2_id}"
            - "state SCHEDULED returns total_count 1 (${v2_id}); state COMPLETED returns total_count 0 — v1 left COMPLETED for REPORTED when the report was filed; state REPORTED returns total_count 1 (${v1_id})"
            - "the three-filter combination cycle_id + reviewer_id r1 + state SCHEDULED returns data [] with total_count 0 and has_more false — filters compose as AND, not OR, so a row matching two of three is excluded"
            - "limit 1 offset 1 returns exactly one row with total_count 2 and has_more false — total_count counts the filtered set, not the returned page"
            - "the unfiltered cycle list returns total_count 1 with the cycle in state REPORT_RECEIVED, addendum_round 0 and compliance_posture NOT_APPLICABLE"
            - "cycle_year 2026 returns total_count 1 and cycle_year 2025 returns data [] with total_count 0"
            - "state REPORT_RECEIVED returns total_count 1 and state SELF_STUDY_OPEN returns total_count 0 — the filter reads the cycle's current state, not the state it was created in"
  # ==========================================================================
  # §1.6 ERRORS — every catalogued error id must be triggerable
  # ==========================================================================
  - section: errors
    instances:
      - name: every_unknown_path_id_reports_its_own_entity_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SELF_STUDY_NOT_FOUND]
          - errors[ERR_VISIT_NOT_FOUND]
          - errors[ERR_DECISION_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_GUARANTEE_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_APPOINTMENT_NOT_FOUND]
        distinguishing_aspect: |
          Eight different entity families each answer an unknown path id with
          their OWN 404 error id, never a shared generic one, and they do so on
          an empty database — before any body validation, so a request whose
          payload would also have been rejected still reports the not-found. Each
          probe is issued by a role with an opaque identity, so no ownership check
          can intercept the unknown id.
        test_recipe:
          setup:
            - "Empty database. Only the logical clock is set; no program, cycle, plan, guarantee, student or appointment exists, so every id below is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/self-studies/00000000-0000-4000-8000-000000000001/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /provost/reviewer-visits/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ReviewCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /provost/decision-records/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: Provost
              captures: { e3: $.data.error_id }
            - call: "POST /provost/agency-notifications/00000000-0000-4000-8000-000000000004/transitions"
              payload: { action: "SEND", transmitted_reference: "TX-0001" }
              as: ReviewCoordinator
              captures: { e4: $.data.error_id }
            - call: "GET /provost/teach-out-plans/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ReviewCoordinator
              captures: { e5: $.data.error_id }
            - call: "POST /provost/course-guarantees/00000000-0000-4000-8000-000000000006/seat-allocations"
              payload: { action: "WAIVE", waived_reason_code: "NO-DEMAND" }
              as: Registrar
              captures: { e6: $.data.error_id }
            - call: "POST /provost/displaced-students/00000000-0000-4000-8000-000000000007/advising"
              payload: { advised_credits_per_term: 9, plan_signed: false }
              as: Registrar
              captures: { e7: $.data.error_id }
            - call: "POST /provost/faculty-appointments/00000000-0000-4000-8000-000000000008/transitions"
              payload: { action: "RETAIN" }
              as: HRPartner
              captures: { e8: $.data.error_id }
            - call: "POST /provost/displaced-students/00000000-0000-4000-8000-000000000007/progress"
              payload: { action: "COMPLETE", completion_term_index: 99 }
              as: Registrar
              captures: { e9: $.data.error_id }
          assert:
            - "every one of the nine calls returns HTTP 404 with the standard error envelope: success == false, data.error_id set, data.message a non-empty string"
            - "${e1} == ERR_SELF_STUDY_NOT_FOUND, ${e2} == ERR_VISIT_NOT_FOUND, ${e3} == ERR_DECISION_NOT_FOUND, ${e4} == ERR_NOTIFICATION_NOT_FOUND"
            - "${e5} == ERR_PLAN_NOT_FOUND, ${e6} == ERR_GUARANTEE_NOT_FOUND, ${e7} == ERR_STUDENT_NOT_FOUND, ${e8} == ERR_APPOINTMENT_NOT_FOUND"
            - "${e9} == ERR_STUDENT_NOT_FOUND and NOT ERR_VALIDATION — the unknown path id is reported at priority 7, ahead of the priority-9 body check that would have rejected completion_term_index 99 on a real plan, and ahead of the priority-40 advising check"
            - "no row is created by any of the nine calls: GET /provost/academic-programs, GET /provost/teach-out-plans and GET /provost/decision-records all return total_count == 0"

      - name: a_second_report_without_an_addendum_request_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_REPORT_ALREADY_FILED]
          - state_machines.ReviewerVisit.COMPLETED_to_REPORTED
        distinguishing_aspect: |
          The gate is the visit's report_count together with the CYCLE's state,
          not the visit's: with report_count 1 and the cycle in REPORT_RECEIVED
          the reviewer's second filing is refused, and the refusal leaves both
          report_count and the reviewer's visit_count untouched.
        test_recipe:
          setup:
            - "One completed visit whose reviewer has filed exactly one report, leaving the cycle in REPORT_RECEIVED and the visit in REPORTED with no addendum outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
