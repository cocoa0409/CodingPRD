    code: 201
    input: [full_name, email, campus_name, campus_tier, graduation_year, leadership_score, achievement_score, gpa]
    output: Applicant
    side_effects: []
  - method: POST
    path: "/corps/applications"
    description: "Submit an application for an applicant, entering the selection pipeline at SUBMITTED."
    roles: [Applicant, SelectionManager]
    code: 201
    input: [applicant_id, preferred_region_id, subject_area, grade_preference]
    output: Application
    side_effects: ["Sets status = SUBMITTED, revision_count = 0.", "Computes selection_score with the provisional variant of calculation `selection_score`."]
  - method: GET
    path: "/corps/applications"
    description: "List applications, optionally filtered by applicant or preferred region."
    roles: [Applicant, SelectionManager]
    code: 200
    input: ["applicant_id?", "preferred_region_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/corps/applications/{id}"
    description: "Read one application, including its provisional and final selection scores."
    roles: [Applicant, SelectionManager]
    code: 200
    input: []
    output: Application
    side_effects: []
