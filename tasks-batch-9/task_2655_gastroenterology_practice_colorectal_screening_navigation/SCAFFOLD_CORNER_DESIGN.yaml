        grounds:
          - validations.priority_6
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Patient
        distinguishing_aspect: "For the entity-backed Patient role the addressed id, not the role, decides: reads and the prep attestation succeed for the acting patient's own rows and return 403 ERR_NOT_RESOURCE_OWNER for the other patient's rows even though the role itself is permitted on those endpoints."
        test_recipe:
          setup:
