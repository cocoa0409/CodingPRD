    roles: [DiningServicesManager]
    code: 200
    input: []
    output: Term
    side_effects: ["increments Term.version by 1", "current_week_index = 1", "ASSIGNED enrollments -> ACTIVE with enrollment_activation_pricing and ALLOCATION_GRANT postings"]
  - method: POST
    path: "/api/terms/{id}/advance-week"
    description: "Advance the term one week: resets swipes, executes due plan changes"
    roles: [DiningServicesManager]
