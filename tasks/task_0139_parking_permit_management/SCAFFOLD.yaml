    output: Zone[]
    side_effects: []

  # ---- EventPricing ----
  - method: POST
    path: "/parking/event-pricing"
    description: "Create a DRAFT event-pricing window"
    roles: [FacilityAdmin]
    code: 201
    input: [garage_id, name, window_start_utc, window_end_utc, flat_surcharge_cents, "multiplier?"]
    output: EventPricing
    side_effects: ["validates window_end_utc > window_start_utc"]
  - method: GET
    path: "/parking/event-pricing/{id}"
    description: "Read an event-pricing window"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: EventPricing
    side_effects: []
  - method: POST
    path: "/parking/event-pricing/{id}/publish"
    description: "Publish a DRAFT window so it begins pricing sessions"
    roles: [FacilityAdmin]
    code: 200
    input: []
