            - "Provider.${p1}.membership_status == ACTIVE and network_posture == OPEN"
            - "SubsidyContract.${c1}.status == ACTIVE (no cascade fired)"

      - name: exit_network_side_effects_freeze_provider_and_release_committed_slots
