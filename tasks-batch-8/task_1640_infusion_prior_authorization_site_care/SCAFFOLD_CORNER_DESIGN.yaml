            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_cc}", policy_id: "${pol_cc}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_cc: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_cc: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_cc}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_cc: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_cc}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_cc2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_cc2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_cc: $.data.id } }
            - { call: "POST /infusion/financial-clearances/${fc_cc}/line-items", payload: { description: "drug", allowed_amount_cents: 10000, billed_charges_cents: 10000 }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/financial-clearances/${fc_cc}/clear", payload: {}, as: FinanceSpecialist, as_user_id: "fin-2" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/appointments", payload: { chair_id: "${chair_cc}", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_cc_a: $.data.id } }
            - { call: "POST /infusion/appointments/${appt_cc_a}/confirm", payload: {}, as: Scheduler, as_user_id: "sched-1" }
            - { call: "POST /infusion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PolicyAdmin, as_user_id: "admin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cc}/appointments", payload: { chair_id: "${chair_cc}", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_cc_b: $.data.id } }
