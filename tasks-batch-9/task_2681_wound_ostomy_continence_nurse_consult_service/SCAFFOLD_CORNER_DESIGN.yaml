            - "SurveyRound.${r1_id}.observation_count == 3 — only the three accepted rows moved the counter, and the three rejections left it untouched"

      - name: nurse_load_aggregate_rejected_at_ceiling_but_reassignment_exempt
        claim_type: Aggregate validation
        grounds:
          - validations[priority=52]
          - errors[ERR_NURSE_LOAD_EXCEEDED]
          - global_constants.MAX_LOAD_BY_CERT
          - state_machines.ConsultRequest.ESCALATED_to_ASSIGNED
        distinguishing_aspect: "Each individual assignment is unremarkable; only the fourth one breaches the CANDIDATE ceiling of 3, and the check is evaluated BEFORE the increment so load == max is already a refusal. The carve-out is the interesting half: re-assigning the consult to the nurse who already holds it must skip the check entirely, which a naive `load < max` guard on every assign would fail."
        test_recipe:
          setup:
            - "Unit 3E exists with nurse Nina advanced to CANDIDATE, so MAX_LOAD_BY_CERT[CANDIDATE] == 3."
            - "Four ADMITTED patients MRN-S1..MRN-S4 each have a WOUND consult with reported_stage STAGE_1, all four triaged (band P3, sla_due_at 2026-08-04T00:00:00Z)."
