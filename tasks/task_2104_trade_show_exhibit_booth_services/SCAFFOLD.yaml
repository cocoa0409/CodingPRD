scenario: "Trade Show Exhibit & Booth Services (Freeman style general contractor): exhibit design & rental vs purchase, show-service ordering (drayage/electrical/rigging) & deadline pricing, crate tracking & advance warehouse, labor rules by venue & union jurisdiction, on-site change order, storage & refurbishment between shows, lead-capture integration, damage & loss claim"

domain_name: trade-show-exhibit-services
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "beyond_expert"
  notes: |
    Beyond-Expert calibration. 18 entities / 75 endpoints / 46 error codes / 13 calculations /
    11 state machines / 6 roles / 3 OCC rules. Density, not volume, is the point: every
    calculation feeds a second calculation (line pricing -> order total -> invoice total ->
    exhibitor balance -> booth posture -> labor-call auto-cancellation), and three independent
    conserved quantities (money, warehouse weight, committed labor hours) must survive
    forward+compensating action pairs with zero drift.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue trade name" }
      - { name: city, type: string, source: input, description: "City the venue sits in" }
      - { name: straight_time_start_hhmm, type: string, source: input, default: "08:00", description: "Start of the straight-time labor band, UTC HH:MM; venue-local time is defined to equal UTC" }
      - { name: straight_time_end_hhmm, type: string, source: input, default: "16:30", description: "Exclusive end of the straight-time labor band, UTC HH:MM" }
      - { name: max_forklift_capacity_lbs, type: integer, source: input, default: 6000, description: "Heaviest single crate the venue's material-handling equipment may lift" }
      - { name: hanging_sign_booth_types, type: array, source: input, default: ["ISLAND", "PENINSULA"], description: "Booth types permitted to fly a hanging sign at this venue" }
      - { name: dock_count, type: integer, source: input, default: 4, description: "Number of receiving docks" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "Venue availability", constraints: "ACTIVE | INACTIVE" }

  - name: UnionJurisdiction
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; jurisdiction is scoped to exactly one venue and is taken from the creation path" }
      - { name: trade, type: enum, source: input, description: "Craft jurisdiction", constraints: "RIGGING | ELECTRICAL | CARPENTRY | MATERIAL_HANDLING | CLEANING" }
      - { name: straight_time_rate_cents_per_hour, type: integer, source: input, description: "Straight-time hourly rate per worker, in cents" }
      - { name: overtime_multiplier, type: number, source: input, default: 1.5, description: "Multiplier applied to the straight-time rate for overtime-band hours" }
      - { name: doubletime_multiplier, type: number, source: input, default: 2.0, description: "Multiplier applied to the straight-time rate for double-time (Sunday) calls" }
      - { name: min_call_hours, type: number, source: input, default: 4.0, description: "Minimum billable hours per dispatched call regardless of hours actually worked" }
      - { name: crew_max_size, type: integer, source: input, default: 8, description: "Largest crew this jurisdiction will dispatch to a single call" }
      - { name: exhibitor_self_install_allowed, type: boolean, source: input, default: false, description: "Whether exhibitor personnel may perform this trade themselves" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory idle buffer between two calls on this jurisdiction at the same booth" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Advance-warehouse trade name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: storage_rate_cents_per_cwt_per_month, type: integer, source: input, default: 2200, description: "Between-show storage rate, cents per hundredweight per billable month" }
      - { name: free_days, type: integer, source: input, default: 30, description: "Days of storage granted at no charge before metered storage begins" }
      - { name: capacity_cwt, type: integer, source: input, description: "Total hundredweight the warehouse can hold" }
      - { name: dock_capacity_cwt, type: integer, source: input, default: 300, description: "Maximum aggregate hundredweight of receiving appointments overlapping any instant" }
      - { name: committed_cwt, type: integer, source: computed, default: 0, description: "Derived: sum of ceil(weight_lbs/100) over crates held at this warehouse; see calculations.warehouse_committed_cwt" }
      - { name: status, type: enum, source: input, default: ACCEPTING, description: "Whether new crates may be checked in", constraints: "ACCEPTING | CLOSED" }

  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue hosting the show" }
      - { name: name, type: string, source: input, description: "Show name" }
      - { name: discount_deadline, type: datetime, source: input, description: "Last instant at which an order still earns ADVANCE pricing (inclusive)" }
      - { name: advance_warehouse_deadline, type: datetime, source: input, description: "Last instant at which advance-warehouse freight is received without the late surcharge (inclusive)" }
      - { name: move_in_start, type: datetime, source: input, description: "First instant of the move-in envelope; also the ONSITE pricing boundary (inclusive of STANDARD)" }
      - { name: move_in_end, type: datetime, source: input, description: "Last instant of move-in" }
      - { name: show_open, type: datetime, source: input, description: "Show floor opens" }
      - { name: show_close, type: datetime, source: input, description: "Show floor closes" }
      - { name: move_out_end, type: datetime, source: input, description: "Last instant of the move-out envelope" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Show lifecycle", constraints: "DRAFT | OPEN_FOR_ORDERS | ADVANCE_CLOSED | MOVE_IN | ON_SITE | MOVE_OUT | CLOSED | CANCELLED" }
      - { name: committed_labor_hours, type: number, source: computed, default: 0, description: "Derived: crew-hours currently committed on this show; see calculations.show_committed_labor_hours" }
      - { name: cancelled_labor_call_count, type: integer, source: computed, default: 0, description: "Derived: count of LaborCall rows on this show whose status is CANCELLED" }

  - name: Exhibitor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Exhibiting company" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: credit_limit_cents, type: integer, source: input, default: 500000, description: "Maximum permitted exposure (balance plus unbilled orders)" }
      - { name: account_balance_cents, type: integer, source: computed, default: 0, description: "Derived open receivable; see calculations.exhibitor_account_balance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Account standing", constraints: "ACTIVE | SUSPENDED" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Free-text reason captured when status became SUSPENDED" }

  - name: Booth
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show this booth belongs to" }
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; exhibitor holding the space" }
      - { name: booth_number, type: string, source: input, description: "Floor-plan booth number; unique within show_id" }
      - { name: sqft, type: integer, source: input, description: "Contracted square footage" }
      - { name: booth_type, type: enum, source: input, description: "Floor-plan geometry", constraints: "INLINE | CORNER | PENINSULA | ISLAND" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "Derived gate over all child writes; see calculations.booth_posture", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: posture_reason, type: string, source: computed, default: null, description: "Enum token naming the highest-priority clause that produced the current posture" }

  - name: ExhibitAsset
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; owner of the physical property" }
      - { name: current_warehouse_id, type: string, source: system, default: null, description: "FK -> Warehouse.id; warehouse currently holding the asset, null when not in storage" }
      - { name: derived_from_asset_id, type: string, source: input, default: null, description: "FK -> ExhibitAsset.id; self-reference set when this asset was split out of a refurbished predecessor" }
      - { name: acquisition_mode, type: enum, source: input, description: "How the exhibitor holds the property", constraints: "RENTAL | PURCHASE" }
      - { name: list_value_cents, type: integer, source: input, description: "Undepreciated replacement value used as the declared-value ceiling on claims" }
      - { name: shipping_weight_lbs, type: integer, source: input, description: "Weight basis used for tariff liability when no crate is cited on a claim" }
      - { name: condition_grade, type: enum, source: input, default: A, description: "Physical condition; drives declared-value depreciation. Supplied at registration for property the exhibitor already owns, downgraded one step by an APPROVED DAMAGE claim, and reset upward only by a completed refurbishment", constraints: "A | B | C | D" }
      - { name: refurb_cycles_count, type: integer, source: system, default: 0, description: "Number of completed refurbishment work orders against this asset" }
      - { name: stored_since, type: datetime, source: system, default: null, description: "Logical-clock instant at which the asset last entered IN_STORAGE" }
      - { name: status, type: enum, source: system, default: IN_DESIGN, description: "Asset lifecycle", constraints: "IN_DESIGN | FABRICATED | IN_STORAGE | STAGED | ON_SHOW_FLOOR | IN_REFURB | RETIRED | WRITTEN_OFF" }

  - name: ExhibitDesign
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; commissioning exhibitor" }
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth the design is drawn for" }
      - { name: asset_id, type: string, source: system, default: null, description: "FK -> ExhibitAsset.id; asset minted when the design is released to fabrication" }
      - { name: sqft, type: integer, source: input, description: "Design footprint in square feet" }
      - { name: linear_feet, type: integer, source: input, description: "Linear feet of structural wall" }
      - { name: has_hanging_sign, type: boolean, source: input, default: false, description: "Whether the design flies a hanging sign" }
      - { name: expected_show_count, type: integer, source: input, default: 1, description: "Number of shows the exhibitor expects to reuse the property across; amortization denominator" }
      - { name: selected_acquisition_mode, type: enum, source: input, description: "Which variant becomes quoted_price_cents", constraints: "RENTAL | PURCHASE" }
      - { name: rental_quote_cents, type: integer, source: computed, default: null, description: "RENTAL_QUOTE variant output; see calculations.exhibit_acquisition_quote" }
      - { name: purchase_quote_cents, type: integer, source: computed, default: null, description: "PURCHASE_QUOTE variant output; see calculations.exhibit_acquisition_quote" }
      - { name: rental_per_show_cents, type: integer, source: computed, default: null, description: "Rental cost attributable to one show" }
      - { name: purchase_per_show_cents, type: integer, source: computed, default: null, description: "Amortized purchase cost attributable to one show, inclusive of the per-show storage/refurb load" }
      - { name: breakeven_show_count, type: integer, source: computed, default: null, description: "Smallest reuse count at which PURCHASE beats RENTAL per show; 0 means never within the 20-show horizon" }
      - { name: quoted_price_cents, type: integer, source: computed, default: null, description: "The variant selected by selected_acquisition_mode" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times the design has cycled QUOTED -> DRAFT via REQUEST_REVISION" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Design lifecycle", constraints: "DRAFT | QUOTED | APPROVED | RELEASED_TO_FAB | CANCELLED" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth the service is ordered for" }
      - { name: invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id; invoice carrying this order, set when the invoice is created" }
      - { name: service_type, type: enum, source: input, description: "Show service ordered", constraints: "ELECTRICAL | RIGGING | MATERIAL_HANDLING | CLEANING | INSTALL_DISMANTLE" }
      - { name: window_start, type: datetime, source: input, default: null, description: "Start of the booth floor-occupancy window; required when service_type is RIGGING or INSTALL_DISMANTLE" }
      - { name: window_end, type: datetime, source: input, default: null, description: "End of the booth floor-occupancy window; closed interval, endpoints are occupied" }
      - { name: ordered_at, type: datetime, source: system, description: "Logical-clock instant at creation; the sole input to deadline tiering" }
      - { name: deadline_tier, type: enum, source: computed, description: "Pricing tier; see calculations.service_order_deadline_tier", constraints: "ADVANCE | STANDARD | ONSITE" }
      - { name: tier_multiplier, type: number, source: computed, description: "Multiplier corresponding to deadline_tier" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded totals; see calculations.service_order_line_pricing" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Step 3 of calculations.service_order_total" }
      - { name: discounted_base_cents, type: integer, source: computed, description: "Step 4 of calculations.service_order_total; the fee-tier key" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Step 6 of calculations.service_order_total" }
      - { name: total_cents, type: integer, source: computed, description: "Step 7 of calculations.service_order_total" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING, description: "Operational dimension; evolves independently of billing_status", constraints: "PENDING | CONFIRMED | SCHEDULED | DELIVERED | HELD | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Financial dimension; evolves independently of fulfillment_status", constraints: "UNBILLED | INVOICED | REBILL_PENDING | SETTLED | CREDITED" }

  - name: ServiceOrderLine
    parent: ServiceOrder
    common_fields: false
    fields:
      - { name: service_order_id, type: string, source: system, description: "FK -> ServiceOrder.id; owning order, taken from the creating request" }
      - { name: line_seq, type: integer, source: input, description: "1-based ordinal; unique within service_order_id and the pinned evaluation order" }
      - { name: catalog_item_code, type: string, source: input, description: "Service catalog SKU" }
      - { name: unit_qty, type: integer, source: input, description: "Units ordered" }
      - { name: unit_rate_cents, type: integer, source: input, description: "Catalog rate per unit in cents" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Per-line discount as a fraction, applied before the tier multiplier" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_qty * unit_rate_cents * (1 - discount_pct) * tier_multiplier)" }

  - name: Crate
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; owner of the freight" }
      - { name: asset_id, type: string, source: input, default: null, description: "FK -> ExhibitAsset.id; asset packed in this crate" }
      - { name: warehouse_id, type: string, source: system, default: null, description: "FK -> Warehouse.id; warehouse currently holding the crate" }
      - { name: shipment_id, type: string, source: system, default: null, description: "FK -> DrayageShipment.id; shipment the crate was received on" }
      - { name: crate_label, type: string, source: input, description: "Exhibitor-applied crate label" }
      - { name: crate_type, type: enum, source: input, description: "Packaging class; LOOSE_UNCRATED triggers the special-handling surcharge", constraints: "WOOD_CRATE | FIBER_CASE | LOOSE_UNCRATED" }
      - { name: weight_lbs, type: integer, source: input, description: "Gross weight in pounds" }
      - { name: stored_since, type: datetime, source: system, default: null, description: "Logical-clock instant the crate last entered a storage-bearing status" }
      - { name: storage_charge_cents, type: integer, source: computed, default: 0, description: "Charge produced by the most recent storage billing run; see calculations.storage_billing" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "Crate location lifecycle", constraints: "REGISTERED | AT_ADVANCE_WAREHOUSE | IN_TRANSIT_TO_SHOW | ON_SHOW_FLOOR | EMPTY_STORED | OUTBOUND_STAGED | RETURNED_TO_WAREHOUSE | RELEASED_TO_CARRIER | LOST" }

  - name: DrayageShipment
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; destination show" }
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; consignor" }
      - { name: warehouse_id, type: string, source: input, default: null, description: "FK -> Warehouse.id; receiving warehouse, required for ADVANCE_WAREHOUSE and forbidden for DIRECT_TO_SHOW" }
      - { name: channel, type: enum, source: input, description: "Receiving channel", constraints: "ADVANCE_WAREHOUSE | DIRECT_TO_SHOW" }
      - { name: crate_ids, type: array, source: input, description: "Ordered list of Crate ids covered by this receipt; must be non-empty" }
      - { name: received_at, type: datetime, source: input, description: "Instant the freight was tendered; drives the overtime-receiving and late surcharges" }
      - { name: dock_window_start, type: datetime, source: input, description: "Start of the receiving appointment, half-open interval" }
      - { name: dock_window_end, type: datetime, source: input, description: "Exclusive end of the receiving appointment" }
      - { name: declared_value_coverage, type: boolean, source: input, default: false, description: "Whether the exhibitor bought declared-value coverage; unlocks the DECLARED_VALUE claim variant" }
      - { name: gross_weight_lbs, type: integer, source: computed, description: "Sum of weight_lbs over crate_ids" }
      - { name: billable_cwt, type: integer, source: computed, description: "max(2, ceil(gross_weight_lbs / 100))" }
      - { name: drayage_charge_cents, type: integer, source: computed, description: "See calculations.drayage_charge" }
      - { name: hold_flag, type: boolean, source: system, default: false, description: "Operational hold; a true value drives every booth of this exhibitor+show to RESTRICTED" }
      - { name: hold_reason, type: string, source: system, default: null, description: "Reason captured when hold_flag was last set true" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Shipment lifecycle, derived from its crates", constraints: "RECEIVED | IN_TRANSIT | DELIVERED_TO_BOOTH | CLOSED" }

  - name: LaborCall
    parent: null
    common_fields: true
    fields:
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth the crew works" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> UnionJurisdiction.id; craft jurisdiction supplying the crew" }
      - { name: service_order_id, type: string, source: input, default: null, description: "FK -> ServiceOrder.id; order the call fulfils" }
      - { name: trade, type: enum, source: computed, description: "Copied from the jurisdiction at creation", constraints: "RIGGING | ELECTRICAL | CARPENTRY | MATERIAL_HANDLING | CLEANING" }
      - { name: scheduled_start, type: datetime, source: input, description: "Requested crew start, half-open interval start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Requested crew end, exclusive" }
      - { name: crew_size, type: integer, source: input, description: "Number of workers requested" }
      - { name: self_install_requested, type: boolean, source: input, default: false, description: "Exhibitor intends to perform the work with its own personnel" }
      - { name: actual_start, type: datetime, source: system, default: null, description: "Recorded at check-in" }
      - { name: actual_end, type: datetime, source: system, default: null, description: "Recorded at completion" }
      - { name: scheduled_hours, type: number, source: computed, description: "(scheduled_end - scheduled_start) in hours, 2dp" }
      - { name: billed_hours, type: number, source: computed, default: null, description: "max(min_call_hours, elapsed rounded up to the next 0.5h)" }
      - { name: st_hours, type: number, source: computed, default: null, description: "Straight-time hours after padding assignment" }
      - { name: ot_hours, type: number, source: computed, default: null, description: "Overtime-band hours after padding assignment" }
      - { name: dt_hours, type: number, source: computed, default: null, description: "Double-time hours; non-zero only for Sunday calls" }
      - { name: labor_charge_cents, type: integer, source: computed, default: null, description: "See calculations.labor_call_billing" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Call lifecycle", constraints: "REQUESTED | DISPATCHED | ON_SITE | COMPLETED | NO_SHOW | CANCELLED" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth whose work is being changed" }
      - { name: target_type, type: enum, source: input, description: "Discriminator for target_id", constraints: "SERVICE_ORDER | LABOR_CALL | EXHIBIT_DESIGN" }
      - { name: target_id, type: string, source: input, description: "Polymorphic reference -> ServiceOrder.id when target_type is SERVICE_ORDER, LaborCall.id when LABOR_CALL, ExhibitDesign.id when EXHIBIT_DESIGN; the referenced row's booth_id must equal this ChangeOrder.booth_id" }
      - { name: delta_kind, type: enum, source: input, description: "Nature of the requested change", constraints: "QTY_INCREASE | QTY_DECREASE | CREW_INCREASE | SCOPE_UPGRADE" }
      - { name: delta_qty, type: integer, source: input, default: null, description: "Magnitude of the change; applied to the target's lowest line_seq line for QTY_* and to crew_size for CREW_INCREASE" }
      - { name: reason, type: string, source: input, description: "Justification captured on the floor" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; the segregation-of-duties subject" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approver; must differ from created_by_user_id" }
      - { name: price_delta_cents, type: integer, source: computed, default: null, description: "Repriced target total minus its pre-change total, computed at apply time" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Change-order lifecycle", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | RETURNED | REJECTED | APPLIED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; billed party" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show the charges belong to" }
      - { name: service_order_ids, type: array, source: input, description: "Service orders swept onto this invoice; must be non-empty" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of ServiceOrder.total_cents over service_order_ids at issue time" }
      - { name: adjustments_cents, type: integer, source: computed, default: 0, description: "Running sum of applied ChangeOrder.price_delta_cents and refurb credits" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + adjustments_cents" }
      - { name: settled_cents, type: integer, source: system, default: 0, description: "Cumulative payments applied" }
      - { name: issued_by_user_id, type: string, source: system, default: null, description: "X-User-ID that issued the invoice" }
      - { name: voided_by_user_id, type: string, source: system, default: null, description: "X-User-ID that voided the invoice; must differ from issued_by_user_id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Invoice lifecycle", constraints: "DRAFT | ISSUED | PARTIALLY_SETTLED | SETTLED | VOID" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; claimant" }
      - { name: asset_id, type: string, source: input, description: "FK -> ExhibitAsset.id; damaged or lost property" }
      - { name: crate_id, type: string, source: input, default: null, description: "FK -> Crate.id; crate whose weight forms the tariff basis" }
      - { name: shipment_id, type: string, source: input, default: null, description: "FK -> DrayageShipment.id; shipment whose declared_value_coverage gates the DECLARED_VALUE variant" }
      - { name: claim_type, type: enum, source: input, description: "Loss cascades to the asset and its crates; damage does not", constraints: "DAMAGE | LOSS" }
      - { name: declared_value_cents, type: integer, source: input, description: "Value asserted by the exhibitor" }
      - { name: incident_at, type: datetime, source: input, description: "When the damage or loss occurred" }
      - { name: coverage_basis, type: enum, source: system, default: TARIFF_LIABILITY, description: "Which settlement variant was selected at adjudication", constraints: "TARIFF_LIABILITY | DECLARED_VALUE" }
      - { name: settlement_cents, type: integer, source: computed, default: null, description: "See calculations.claim_settlement" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID that filed the claim" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID that adjudicated; must differ from filed_by_user_id" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of DENIED -> UNDER_INVESTIGATION cycles consumed" }
      - { name: status, type: enum, source: system, default: FILED, description: "Claim lifecycle", constraints: "FILED | UNDER_INVESTIGATION | APPROVED | DENIED | SETTLED" }

  - name: RefurbWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> ExhibitAsset.id; property being refurbished" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; shop performing the work" }
      - { name: scope, type: enum, source: input, description: "Work scope", constraints: "GRAPHICS_REFRESH | STRUCTURAL_REPAIR | FULL_REBUILD" }
      - { name: estimate_cents, type: integer, source: input, description: "Quoted cost" }
      - { name: actual_cents, type: integer, source: system, default: null, description: "Cost recorded at completion" }
      - { name: variance_cents, type: integer, source: computed, default: null, description: "actual_cents - estimate_cents, computed at completion" }
      - { name: condition_grade_after, type: enum, source: system, default: null, description: "Grade the asset carries after the work", constraints: "A | B | C | D" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Work-order lifecycle", constraints: "OPEN | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: LeadCaptureLicense
    parent: null
    common_fields: true
    fields:
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth the devices are licensed to" }
      - { name: device_count, type: integer, source: input, description: "Number of scanners licensed" }
      - { name: included_leads, type: integer, source: input, default: 250, description: "Leads included before overage billing begins" }
      - { name: ingested_badge_ids, type: array, source: system, default: [], description: "Distinct badge ids ever accepted, in first-seen order; the dedupe key set" }
      - { name: leads_ingested_count, type: integer, source: computed, default: 0, description: "Cardinality of ingested_badge_ids" }
      - { name: billable_overage_leads, type: integer, source: computed, default: 0, description: "max(0, leads_ingested_count - included_leads)" }
      - { name: lead_overage_cents, type: integer, source: computed, default: 0, description: "billable_overage_leads * LEAD_OVERAGE_CENTS" }
      - { name: license_total_cents, type: integer, source: computed, description: "device_count * DEVICE_FEE_CENTS + lead_overage_cents" }
      - { name: status, type: enum, source: system, default: PROVISIONED, description: "License lifecycle", constraints: "PROVISIONED | ACTIVE | CLOSED" }

state_machines:
  - entity: Show
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_ORDERS
        trigger: "POST /shows/{id}/status with to_status=OPEN_FOR_ORDERS"
        actor: ShowOperations
        preconditions: ["show.status == DRAFT", "discount_deadline < advance_warehouse_deadline < move_in_start < move_in_end <= show_open < show_close <= move_out_end"]
        side_effects: ["Show.updated_at refreshed", "Show.version += 1"]
      - from: OPEN_FOR_ORDERS
        to: ADVANCE_CLOSED
        trigger: "POST /shows/{id}/status with to_status=ADVANCE_CLOSED"
        actor: ShowOperations
        preconditions: ["show.status == OPEN_FOR_ORDERS"]
        side_effects: ["No repricing of existing orders: deadline_tier is frozen at ordered_at and never re-derived"]
      - from: ADVANCE_CLOSED
        to: MOVE_IN
        trigger: "POST /shows/{id}/status with to_status=MOVE_IN"
        actor: ShowOperations
        preconditions: ["show.status == ADVANCE_CLOSED"]
        side_effects: ["Every Crate with shipment.show_id == show and status == AT_ADVANCE_WAREHOUSE remains untouched; movement stays operator-driven"]
      - from: MOVE_IN
        to: ON_SITE
        trigger: "POST /shows/{id}/status with to_status=ON_SITE"
        actor: ShowOperations
        preconditions: ["show.status == MOVE_IN"]
        side_effects: ["Every LeadCaptureLicense on booths of this show with status == PROVISIONED remains PROVISIONED until its first accepted lead batch"]
      - from: ON_SITE
        to: MOVE_OUT
        trigger: "POST /shows/{id}/status with to_status=MOVE_OUT"
        actor: ShowOperations
        preconditions: ["show.status == ON_SITE"]
        side_effects: ["Every DrayageShipment with show_id == show and status == DELIVERED_TO_BOOTH transitions to CLOSED", "Every LeadCaptureLicense on booths of this show with status == ACTIVE transitions to CLOSED and license_total_cents is frozen"]
      - from: MOVE_OUT
        to: CLOSED
        trigger: "POST /shows/{id}/status with to_status=CLOSED"
        actor: ShowOperations
        preconditions: ["show.status == MOVE_OUT", "no LaborCall on any booth of this show is in status DISPATCHED or ON_SITE"]
        side_effects: ["Every Booth of this show recomputes calculations.booth_posture and lands on FROZEN with posture_reason=SHOW_CLOSED", "Every LeadCaptureLicense on booths of this show with status == PROVISIONED transitions to CLOSED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shows/{id}/status with to_status=CANCELLED"
        actor: ShowOperations
        preconditions: ["show.status in {DRAFT, OPEN_FOR_ORDERS, ADVANCE_CLOSED}"]
        side_effects: ["Every ServiceOrder on booths of this show with fulfillment_status in {PENDING, CONFIRMED, SCHEDULED, HELD} transitions to CANCELLED", "Every Booth recomputes posture and lands on FROZEN with posture_reason=SHOW_CANCELLED"]
        note: "Same transition object also fires from OPEN_FOR_ORDERS and ADVANCE_CLOSED; from MOVE_IN onward cancellation is refused with ERR_INVALID_STATE_TRANSITION."

  - entity: ExhibitDesign
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /exhibit-designs/{id}/quote"
        actor: Exhibitor
        preconditions: ["design.status == DRAFT", "booth.posture != FROZEN", "design.revision_count <= MAX_DESIGN_REVISIONS"]
        side_effects: ["calculations.exhibit_acquisition_quote runs and writes rental_quote_cents, purchase_quote_cents, rental_per_show_cents, purchase_per_show_cents, breakeven_show_count and quoted_price_cents"]
      - from: QUOTED
        to: DRAFT
        trigger: "POST /exhibit-designs/{id}/decision with decision=REQUEST_REVISION"
        actor: ShowOperations
        preconditions: ["design.status == QUOTED", "design.revision_count < MAX_DESIGN_REVISIONS"]
        side_effects: ["ExhibitDesign.revision_count += 1", "rental_quote_cents, purchase_quote_cents, rental_per_show_cents, purchase_per_show_cents, breakeven_show_count and quoted_price_cents are cleared to null"]
        note: "Cycle edge: DRAFT -> QUOTED -> DRAFT. A fourth REQUEST_REVISION (revision_count already 3) is refused with ERR_DESIGN_REVISION_LIMIT."
      - from: QUOTED
        to: APPROVED
        trigger: "POST /exhibit-designs/{id}/decision with decision=APPROVE"
        actor: ShowOperations
        preconditions: ["design.status == QUOTED", "booth.posture == OPEN", "quoted_price_cents is not null"]
        side_effects: ["Quote fields are version-pinned: a later quote run cannot overwrite them while status is APPROVED or RELEASED_TO_FAB"]
      - from: APPROVED
        to: RELEASED_TO_FAB
        trigger: "POST /exhibit-designs/{id}/release"
        actor: ShowOperations
        preconditions: ["design.status == APPROVED", "booth.posture != FROZEN"]
        side_effects: ["A new ExhibitAsset is created with exhibitor_id = design.exhibitor_id, acquisition_mode = design.selected_acquisition_mode, list_value_cents = design.quoted_price_cents, shipping_weight_lbs = design.sqft * 12, status IN_DESIGN, condition_grade A", "ExhibitDesign.asset_id is set to the new asset id"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /exhibit-designs/{id}/decision with decision=CANCEL"
        actor: ShowOperations
        preconditions: ["design.status in {DRAFT, QUOTED, APPROVED}"]
        side_effects: ["No asset is minted; if asset_id is already set the transition is refused with ERR_INVALID_STATE_TRANSITION"]

  - entity: ExhibitAsset
    initial_state: IN_DESIGN
    terminal_states: [RETIRED, WRITTEN_OFF]
    transitions:
      - from: IN_DESIGN
        to: FABRICATED
        trigger: "POST /exhibit-assets/{id}/lifecycle with to_status=FABRICATED"
        actor: ShowOperations
        preconditions: ["asset.status == IN_DESIGN"]
        side_effects: ["ExhibitAsset.version += 1"]
      - from: FABRICATED
        to: IN_STORAGE
        trigger: "POST /exhibit-assets/{id}/lifecycle with to_status=IN_STORAGE and warehouse_id supplied"
        actor: WarehouseAgent
        preconditions: ["asset.status in {FABRICATED, ON_SHOW_FLOOR, IN_REFURB}", "warehouse.status == ACCEPTING"]
        side_effects: ["ExhibitAsset.current_warehouse_id = warehouse_id", "ExhibitAsset.stored_since = logical clock now"]
      - from: IN_STORAGE
        to: STAGED
        trigger: "POST /exhibit-assets/{id}/lifecycle with to_status=STAGED"
        actor: WarehouseAgent
        preconditions: ["asset.status == IN_STORAGE", "no RefurbWorkOrder on this asset is in status OPEN or IN_PROGRESS"]
        side_effects: ["ExhibitAsset.stored_since cleared to null"]
      - from: STAGED
        to: ON_SHOW_FLOOR
        trigger: "POST /exhibit-assets/{id}/lifecycle with to_status=ON_SHOW_FLOOR"
        actor: ShowOperations
        preconditions: ["asset.status == STAGED"]
        side_effects: ["ExhibitAsset.current_warehouse_id cleared to null"]
      - from: IN_STORAGE
        to: IN_REFURB
        trigger: "POST /refurb-work-orders/{id}/progress with to_status=IN_PROGRESS (cascade from RefurbWorkOrder)"
        actor: WarehouseAgent
        preconditions: ["asset.status == IN_STORAGE"]
        side_effects: ["Asset is unavailable for staging while IN_REFURB"]
      - from: IN_REFURB
        to: IN_STORAGE
        trigger: "POST /refurb-work-orders/{id}/progress with to_status=COMPLETED (cascade from RefurbWorkOrder)"
        actor: WarehouseAgent
        preconditions: ["asset.status == IN_REFURB"]
        side_effects: ["ExhibitAsset.refurb_cycles_count += 1", "ExhibitAsset.condition_grade = work_order.condition_grade_after", "ExhibitAsset.stored_since = logical clock now"]
        note: "Cycle edge: IN_STORAGE -> IN_REFURB -> IN_STORAGE."
      - from: IN_STORAGE
        to: RETIRED
        trigger: "POST /exhibit-assets/{id}/lifecycle with to_status=RETIRED"
        actor: ShowOperations
        preconditions: ["asset.status in {IN_STORAGE, FABRICATED}", "no DamageClaim on this asset is in status FILED, UNDER_INVESTIGATION or APPROVED"]
        side_effects: ["ExhibitAsset.current_warehouse_id cleared to null", "Warehouse.committed_cwt is NOT affected: assets do not carry weight, crates do"]
      - from: ON_SHOW_FLOOR
        to: WRITTEN_OFF
        trigger: "POST /damage-claims/{id}/adjudication with decision=APPROVE on a LOSS claim (cascade from DamageClaim)"
        actor: system
        preconditions: ["asset.status not in {RETIRED, WRITTEN_OFF}", "claim.claim_type == LOSS"]
        side_effects: ["Every Crate with asset_id == this asset and status not in {LOST, RELEASED_TO_CARRIER} transitions to LOST", "Every RefurbWorkOrder on this asset with status in {OPEN, IN_PROGRESS} transitions to CANCELLED"]
        note: "Cascade link 2 of the loss-claim chain; fires from any non-terminal asset status, ON_SHOW_FLOOR is the representative from-state."

  - entity: ServiceOrder
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /service-orders/{id}/fulfillment with to_status=CONFIRMED"
        actor: ShowOperations
        preconditions: ["order.fulfillment_status == PENDING", "booth.posture != FROZEN", "booth.show.status in {OPEN_FOR_ORDERS, ADVANCE_CLOSED, MOVE_IN, ON_SITE}"]
        side_effects: ["billing_status is untouched: the two dimensions advance independently"]
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /service-orders/{id}/fulfillment with to_status=SCHEDULED"
        actor: ShowOperations
        preconditions: ["order.fulfillment_status == CONFIRMED", "booth.posture != FROZEN"]
        side_effects: ["ServiceOrder.version += 1"]
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /service-orders/{id}/fulfillment with to_status=DELIVERED"
        actor: ShowOperations
        preconditions: ["order.fulfillment_status == SCHEDULED", "booth.show.status in {MOVE_IN, ON_SITE, MOVE_OUT}"]
        side_effects: ["Order becomes ineligible as a ChangeOrder target"]
      - from: PENDING
        to: HELD
        trigger: "Cascade from Booth posture becoming FROZEN (exhibitor suspension or credit breach)"
        actor: system
        preconditions: ["order.fulfillment_status == PENDING", "booth.posture == FROZEN"]
        side_effects: ["Every LaborCall with service_order_id == this order and status == REQUESTED transitions to CANCELLED", "Show.cancelled_labor_call_count is recomputed", "Show.committed_labor_hours is recomputed"]
        note: "Cascade link 3 of the exhibitor-suspension chain."
      - from: HELD
        to: PENDING
        trigger: "Cascade from Booth posture leaving FROZEN (reinstatement, payment, or claim settlement)"
        actor: system
        preconditions: ["order.fulfillment_status == HELD", "booth.posture != FROZEN"]
        side_effects: ["Cancelled LaborCalls are NOT resurrected; the compensating action restores fulfillment_status only"]
        note: "Cycle edge: PENDING -> HELD -> PENDING."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /service-orders/{id}/fulfillment with to_status=CANCELLED"
        actor: Exhibitor
        preconditions: ["order.fulfillment_status in {PENDING, CONFIRMED, SCHEDULED, HELD}", "order.billing_status in {UNBILLED, CREDITED}"]
        side_effects: ["Every LaborCall with service_order_id == this order and status in {REQUESTED, DISPATCHED} transitions to CANCELLED", "Show.committed_labor_hours is recomputed"]

  - entity: ServiceOrder
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /invoices then POST /invoices/{id}/issue (cascade from Invoice)"
        actor: system
        preconditions: ["order.billing_status == UNBILLED", "order.id appears in invoice.service_order_ids"]
        side_effects: ["ServiceOrder.invoice_id is set", "fulfillment_status is untouched"]
        note: "Parallel dimension: this machine is billing_status on the same ServiceOrder row that the fulfillment_status machine above governs."
      - from: INVOICED
        to: REBILL_PENDING
        trigger: "POST /change-orders/{id}/apply on a SERVICE_ORDER target whose billing_status is INVOICED"
        actor: system
        preconditions: ["order.billing_status == INVOICED"]
        side_effects: ["Invoice.adjustments_cents += change_order.price_delta_cents", "Invoice.total_cents recomputed", "Exhibitor.account_balance_cents recomputed"]
        note: "Cascade link 2 of the change-order chain."
      - from: REBILL_PENDING
        to: INVOICED
        trigger: "POST /invoices/{id}/issue on the same invoice after the adjustment (re-issue)"
        actor: FinanceController
        preconditions: ["order.billing_status == REBILL_PENDING", "invoice.status in {ISSUED, PARTIALLY_SETTLED}"]
        side_effects: ["No further balance movement: total_cents already reflects the adjustment"]
        note: "Cycle edge: INVOICED -> REBILL_PENDING -> INVOICED."
      - from: INVOICED
        to: SETTLED
        trigger: "POST /invoices/{id}/payments that drives settled_cents to total_cents"
        actor: system
        preconditions: ["order.billing_status in {INVOICED, REBILL_PENDING}", "invoice.settled_cents == invoice.total_cents"]
        side_effects: ["Exhibitor.account_balance_cents recomputed"]
      - from: INVOICED
        to: CREDITED
        trigger: "POST /invoices/{id}/void"
        actor: system
        preconditions: ["order.billing_status in {INVOICED, REBILL_PENDING}", "invoice.settled_cents == 0"]
        side_effects: ["ServiceOrder.invoice_id cleared to null", "Exhibitor.account_balance_cents recomputed and returns to its pre-issue value"]

  - entity: Crate
    initial_state: REGISTERED
    terminal_states: [RELEASED_TO_CARRIER, LOST]
    transitions:
      - from: REGISTERED
        to: AT_ADVANCE_WAREHOUSE
        trigger: "POST /crates/{id}/warehouse-check-in"
        actor: WarehouseAgent
        preconditions: ["crate.status == REGISTERED", "warehouse.status == ACCEPTING", "warehouse.committed_cwt + ceil(crate.weight_lbs/100) <= warehouse.capacity_cwt", "expected_warehouse_version matches warehouse.version"]
        side_effects: ["Crate.warehouse_id set", "Crate.stored_since = logical clock now", "Warehouse.committed_cwt recomputed upward", "Warehouse.version += 1"]
      - from: AT_ADVANCE_WAREHOUSE
        to: IN_TRANSIT_TO_SHOW
        trigger: "POST /crates/{id}/movements with to_status=IN_TRANSIT_TO_SHOW"
        actor: WarehouseAgent
        preconditions: ["crate.status == AT_ADVANCE_WAREHOUSE", "crate.shipment_id is not null", "shipment.show.status in {ADVANCE_CLOSED, MOVE_IN, ON_SITE}"]
        side_effects: ["Crate.warehouse_id cleared to null", "Crate.stored_since cleared to null", "Warehouse.committed_cwt recomputed downward", "DrayageShipment.status becomes IN_TRANSIT if it was RECEIVED"]
      - from: REGISTERED
        to: ON_SHOW_FLOOR
        trigger: "POST /crates/{id}/movements with to_status=ON_SHOW_FLOOR"
        actor: ShowOperations
        preconditions: ["crate.status in {REGISTERED, IN_TRANSIT_TO_SHOW, EMPTY_STORED}", "crate.shipment_id is not null", "shipment.show.status in {MOVE_IN, ON_SITE, MOVE_OUT}"]
        side_effects: ["When every crate whose shipment_id == this shipment has status ON_SHOW_FLOOR, DrayageShipment.status bubbles up to DELIVERED_TO_BOOTH"]
        note: "DIRECT_TO_SHOW freight uses the REGISTERED -> ON_SHOW_FLOOR edge and never touches a warehouse."
      - from: ON_SHOW_FLOOR
        to: EMPTY_STORED
        trigger: "POST /crates/{id}/movements with to_status=EMPTY_STORED"
        actor: ShowOperations
        preconditions: ["crate.status == ON_SHOW_FLOOR", "shipment.show.status in {MOVE_IN, ON_SITE}"]
        side_effects: ["Crate.stored_since is NOT set: empty-crate accessible storage during a show is not metered storage"]
      - from: EMPTY_STORED
        to: ON_SHOW_FLOOR
        trigger: "POST /crates/{id}/movements with to_status=ON_SHOW_FLOOR"
        actor: ShowOperations
        preconditions: ["crate.status == EMPTY_STORED", "shipment.show.status in {ON_SITE, MOVE_OUT}"]
        side_effects: ["Shipment bubble-up recomputes as above"]
        note: "Cycle edge: ON_SHOW_FLOOR -> EMPTY_STORED -> ON_SHOW_FLOOR."
      - from: ON_SHOW_FLOOR
        to: OUTBOUND_STAGED
        trigger: "POST /crates/{id}/movements with to_status=OUTBOUND_STAGED"
        actor: ShowOperations
        preconditions: ["crate.status == ON_SHOW_FLOOR", "shipment.show.status == MOVE_OUT"]
        side_effects: ["Crate is queued for the outbound carrier or for warehouse return"]
      - from: OUTBOUND_STAGED
        to: RETURNED_TO_WAREHOUSE
        trigger: "POST /crates/{id}/warehouse-check-in"
        actor: WarehouseAgent
        preconditions: ["crate.status == OUTBOUND_STAGED", "warehouse.status == ACCEPTING", "warehouse.committed_cwt + ceil(crate.weight_lbs/100) <= warehouse.capacity_cwt", "expected_warehouse_version matches warehouse.version"]
        side_effects: ["Crate.warehouse_id set", "Crate.stored_since = logical clock now", "Warehouse.committed_cwt recomputed upward", "Warehouse.version += 1"]
      - from: OUTBOUND_STAGED
        to: RELEASED_TO_CARRIER
        trigger: "POST /crates/{id}/movements with to_status=RELEASED_TO_CARRIER"
        actor: ShowOperations
        preconditions: ["crate.status == OUTBOUND_STAGED"]
        side_effects: ["Terminal: no further movement is accepted"]
      - from: AT_ADVANCE_WAREHOUSE
        to: LOST
        trigger: "POST /crates/{id}/movements with to_status=LOST, or cascade from an APPROVED LOSS DamageClaim on the packed asset"
        actor: WarehouseAgent
        preconditions: ["crate.status not in {RELEASED_TO_CARRIER, LOST}"]
        side_effects: ["Crate.warehouse_id cleared to null", "Crate.stored_since cleared to null", "Warehouse.committed_cwt recomputed downward"]
        note: "Cascade link 3 of the loss-claim chain; reachable from every non-terminal crate status."

  - entity: DrayageShipment
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: IN_TRANSIT
        trigger: "First crate of the shipment moving AT_ADVANCE_WAREHOUSE -> IN_TRANSIT_TO_SHOW (cascade from Crate)"
        actor: system
        preconditions: ["shipment.status == RECEIVED", "shipment.channel == ADVANCE_WAREHOUSE"]
        side_effects: ["DrayageShipment.version += 1"]
      - from: IN_TRANSIT
        to: DELIVERED_TO_BOOTH
        trigger: "Every crate of the shipment reaching ON_SHOW_FLOOR (compound bubble-up from Crate)"
        actor: system
        preconditions: ["every Crate with shipment_id == this shipment has status == ON_SHOW_FLOOR"]
        side_effects: ["No charge recomputation: drayage_charge_cents is frozen at receipt"]
        note: "Also fires from RECEIVED for DIRECT_TO_SHOW shipments, which never pass through IN_TRANSIT."
      - from: DELIVERED_TO_BOOTH
        to: CLOSED
        trigger: "POST /shows/{id}/status with to_status=MOVE_OUT (cascade from Show)"
        actor: system
        preconditions: ["shipment.status == DELIVERED_TO_BOOTH"]
        side_effects: ["hold_flag is forced to false and every Booth of this exhibitor+show recomputes posture"]

  - entity: LaborCall
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /labor-calls/{id}/dispatch"
        actor: LaborSupervisor
        preconditions: ["call.status == REQUESTED", "booth.posture == OPEN", "booth.show.status in {MOVE_IN, ON_SITE, MOVE_OUT}"]
        side_effects: ["Show.committed_labor_hours += crew_size * scheduled_hours"]
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /labor-calls/{id}/check-in"
        actor: LaborSupervisor
        preconditions: ["call.status == DISPATCHED", "actual_start is within [show.move_in_start, show.move_out_end]"]
        side_effects: ["LaborCall.actual_start recorded"]
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /labor-calls/{id}/completion with outcome=COMPLETED"
        actor: LaborSupervisor
        preconditions: ["call.status == ON_SITE", "actual_end > actual_start"]
        side_effects: ["calculations.labor_call_billing runs and writes billed_hours, st_hours, ot_hours, dt_hours and labor_charge_cents", "Show.committed_labor_hours -= crew_size * scheduled_hours"]
      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /labor-calls/{id}/completion with outcome=NO_SHOW"
        actor: LaborSupervisor
        preconditions: ["call.status == DISPATCHED"]
        side_effects: ["labor_charge_cents = round_half_up(crew_size * jurisdiction.min_call_hours * jurisdiction.straight_time_rate_cents_per_hour)", "Show.committed_labor_hours -= crew_size * scheduled_hours", "Booth recomputes posture and lands on RESTRICTED with posture_reason=LABOR_NO_SHOW when no FROZEN clause applies"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /labor-calls/{id}/cancel, or cascade from ServiceOrder entering HELD or CANCELLED"
        actor: LaborSupervisor
        preconditions: ["call.status in {REQUESTED, DISPATCHED}"]
        side_effects: ["Show.committed_labor_hours -= crew_size * scheduled_hours when the call was DISPATCHED, and is left unchanged when it was REQUESTED", "Show.cancelled_labor_call_count += 1", "labor_charge_cents remains null"]
        note: "Cascade link 4 of the exhibitor-suspension chain and of the change-order chain."

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit"
        actor: Exhibitor
        preconditions: ["change_order.status in {DRAFT, RETURNED}", "booth.posture != FROZEN"]
        side_effects: ["ChangeOrder.version += 1"]
        note: "Cycle edge source: RETURNED -> SUBMITTED re-enters review."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /change-orders/{id}/review with decision=START_REVIEW"
        actor: ShowOperations
        preconditions: ["change_order.status == SUBMITTED"]
        side_effects: ["No reviewer identity is recorded yet; segregation of duties is enforced at APPROVE"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /change-orders/{id}/review with decision=APPROVE"
        actor: ShowOperations
        preconditions: ["change_order.status == UNDER_REVIEW", "X-User-ID != change_order.created_by_user_id", "target row exists and its booth_id == change_order.booth_id"]
        side_effects: ["ChangeOrder.reviewed_by_user_id = X-User-ID", "Booth recomputes posture and lands on RESTRICTED with posture_reason=CHANGE_ORDER_APPROVED when no FROZEN clause applies"]
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /change-orders/{id}/review with decision=RETURN"
        actor: ShowOperations
        preconditions: ["change_order.status == UNDER_REVIEW"]
        side_effects: ["price_delta_cents remains null"]
        note: "Cycle edge: SUBMITTED -> UNDER_REVIEW -> RETURNED -> SUBMITTED."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /change-orders/{id}/review with decision=REJECT"
        actor: ShowOperations
        preconditions: ["change_order.status == UNDER_REVIEW", "X-User-ID != change_order.created_by_user_id"]
        side_effects: ["Booth recomputes posture; the CHANGE_ORDER_APPROVED clause no longer holds"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /change-orders/{id}/apply"
        actor: ShowOperations
        preconditions: ["change_order.status == APPROVED", "target ServiceOrder.fulfillment_status not in {DELIVERED, CANCELLED}", "expected_service_order_version matches the target ServiceOrder.version", "booth.posture != FROZEN"]
        side_effects: ["Target ServiceOrder lines are mutated per delta_kind and repriced at the deadline tier in force at apply time", "ChangeOrder.price_delta_cents = repriced total_cents - pre-change total_cents", "ServiceOrder.version += 1", "billing_status moves INVOICED -> REBILL_PENDING when it was INVOICED, starting the change-order cascade"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: FinanceController
        preconditions: ["invoice.status in {DRAFT}", "every ServiceOrder in service_order_ids has billing_status in {UNBILLED, REBILL_PENDING}", "exhibitor.status == ACTIVE"]
        side_effects: ["subtotal_cents and total_cents recomputed", "Invoice.issued_by_user_id = X-User-ID", "Every listed ServiceOrder.billing_status becomes INVOICED and invoice_id is set", "Exhibitor.account_balance_cents recomputed", "Every Booth of this exhibitor recomputes posture"]
      - from: ISSUED
        to: PARTIALLY_SETTLED
        trigger: "POST /invoices/{id}/payments with amount_cents < outstanding"
        actor: FinanceController
        preconditions: ["invoice.status in {ISSUED, PARTIALLY_SETTLED}", "amount_cents > 0", "settled_cents + amount_cents <= total_cents"]
        side_effects: ["Invoice.settled_cents += amount_cents", "Exhibitor.account_balance_cents recomputed", "Every Booth of this exhibitor recomputes posture"]
      - from: PARTIALLY_SETTLED
        to: SETTLED
        trigger: "POST /invoices/{id}/payments that drives settled_cents to total_cents"
        actor: FinanceController
        preconditions: ["invoice.status in {ISSUED, PARTIALLY_SETTLED}", "settled_cents + amount_cents == total_cents"]
        side_effects: ["Every listed ServiceOrder.billing_status becomes SETTLED", "Exhibitor.account_balance_cents recomputed to exclude this invoice"]
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceController
        preconditions: ["invoice.status in {DRAFT, ISSUED}", "invoice.settled_cents == 0", "X-User-ID != invoice.issued_by_user_id"]
        side_effects: ["Invoice.voided_by_user_id = X-User-ID", "Every listed ServiceOrder.billing_status becomes CREDITED and invoice_id is cleared", "Exhibitor.account_balance_cents recomputed and returns to its exact pre-issue value", "Every Booth of this exhibitor recomputes posture"]

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [SETTLED]
    transitions:
      - from: FILED
        to: UNDER_INVESTIGATION
        trigger: "POST /damage-claims/{id}/investigation"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == FILED", "asset.status not in {RETIRED}"]
        side_effects: ["DamageClaim.version += 1"]
      - from: UNDER_INVESTIGATION
        to: APPROVED
        trigger: "POST /damage-claims/{id}/adjudication with decision=APPROVE"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == UNDER_INVESTIGATION", "X-User-ID != claim.filed_by_user_id", "coverage_basis DECLARED_VALUE requires shipment_id is not null and shipment.declared_value_coverage == true", "asset.status not in {RETIRED, WRITTEN_OFF}"]
        side_effects: ["calculations.claim_settlement runs and writes settlement_cents", "DamageClaim.adjudicated_by_user_id = X-User-ID", "When claim_type == DAMAGE the linked ExhibitAsset.condition_grade is downgraded exactly one step along A -> B -> C -> D, and D stays D", "When claim_type == LOSS the linked ExhibitAsset transitions to WRITTEN_OFF, which itself sends every crate packed with that asset to LOST, which itself recomputes Warehouse.committed_cwt"]
      - from: UNDER_INVESTIGATION
        to: DENIED
        trigger: "POST /damage-claims/{id}/adjudication with decision=DENY"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == UNDER_INVESTIGATION", "X-User-ID != claim.filed_by_user_id"]
        side_effects: ["settlement_cents remains null", "DamageClaim.adjudicated_by_user_id = X-User-ID"]
      - from: DENIED
        to: UNDER_INVESTIGATION
        trigger: "POST /damage-claims/{id}/appeal"
        actor: Exhibitor
        preconditions: ["claim.status == DENIED", "claim.appeal_count < MAX_CLAIM_APPEALS"]
        side_effects: ["DamageClaim.appeal_count += 1", "DamageClaim.adjudicated_by_user_id cleared to null so the next adjudication re-runs the segregation-of-duties check"]
        note: "Cycle edge: UNDER_INVESTIGATION -> DENIED -> UNDER_INVESTIGATION, capped at MAX_CLAIM_APPEALS."
      - from: APPROVED
        to: SETTLED
        trigger: "POST /damage-claims/{id}/settlement"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == APPROVED", "settlement_cents is not null"]
        side_effects: ["Exhibitor.account_balance_cents recomputed downward by settlement_cents", "Every Booth of this exhibitor recomputes posture; booths frozen solely by the credit clause leave FROZEN", "Every ServiceOrder on a booth that left FROZEN and whose fulfillment_status is HELD returns to PENDING"]

  - entity: RefurbWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /refurb-work-orders/{id}/progress with to_status=IN_PROGRESS"
        actor: WarehouseAgent
        preconditions: ["work_order.status == OPEN", "asset.status == IN_STORAGE", "asset.current_warehouse_id == work_order.warehouse_id"]
        side_effects: ["ExhibitAsset transitions IN_STORAGE -> IN_REFURB"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /refurb-work-orders/{id}/progress with to_status=COMPLETED"
        actor: WarehouseAgent
        preconditions: ["work_order.status == IN_PROGRESS", "actual_cents is supplied", "actual_cents <= round_half_up(estimate_cents * REFURB_OVERRUN_TOLERANCE) or an APPLIED ChangeOrder covers the overrun", "condition_grade_after is not worse than asset.condition_grade"]
        side_effects: ["RefurbWorkOrder.variance_cents = actual_cents - estimate_cents", "ExhibitAsset transitions IN_REFURB -> IN_STORAGE, refurb_cycles_count += 1, condition_grade = condition_grade_after"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /refurb-work-orders/{id}/progress with to_status=CANCELLED, or cascade from the asset becoming WRITTEN_OFF"
        actor: WarehouseAgent
        preconditions: ["work_order.status in {OPEN, IN_PROGRESS}"]
        side_effects: ["When the asset is IN_REFURB it returns to IN_STORAGE without incrementing refurb_cycles_count", "variance_cents remains null"]

  - entity: LeadCaptureLicense
    initial_state: PROVISIONED
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /lead-capture-licenses/{id}/lead-batches with at least one badge id accepted"
        actor: Exhibitor
        preconditions: ["license.status == PROVISIONED", "booth.show.status in {ON_SITE, MOVE_OUT}", "booth.posture != FROZEN"]
        side_effects: ["ingested_badge_ids extended with the not-yet-seen badge ids in request order", "leads_ingested_count, billable_overage_leads, lead_overage_cents and license_total_cents recomputed"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /shows/{id}/status with to_status=MOVE_OUT (cascade from Show)"
        actor: system
        preconditions: ["license.status == ACTIVE"]
        side_effects: ["license_total_cents is frozen; later lead batches are refused with ERR_LICENSE_CLOSED"]
        note: "PROVISIONED licenses also transition to CLOSED, but on the later MOVE_OUT -> CLOSED show edge."

concurrency_rules:
  - rule_id: service-order-create-stale-booth
    parent_entity: Booth
    write_endpoint: "POST /service-orders"
    occ_field: "expected_booth_version"
    description: |
      Creating a ServiceOrder against a Booth whose version has advanced since the
      client last observed it is rejected. Booth.version advances whenever the booth's
      posture is recomputed or another order is written against it, so a client working
      from a stale read would be pricing and credit-checking against a booth state that
      no longer holds.
    error_id: ERR_STALE_BOOTH_VERSION
    http_status: 412

  - rule_id: change-order-apply-stale-service-order
    parent_entity: ServiceOrder
    write_endpoint: "POST /change-orders/{id}/apply"
    occ_field: "expected_service_order_version"
    description: |
      Applying a ChangeOrder to a target ServiceOrder whose version has advanced since
      the reviewer last observed it is rejected. Multiple approved change orders may
      legitimately land on one order, and each application mutates lines and reprices,
      so a second application computed from a stale view would produce a price delta
      against the wrong baseline.
    error_id: ERR_STALE_SERVICE_ORDER_VERSION
    http_status: 412

  - rule_id: crate-checkin-stale-warehouse
    parent_entity: Warehouse
    write_endpoint: "POST /crates/{id}/warehouse-check-in"
    occ_field: "expected_warehouse_version"
    description: |
      Checking a Crate into a Warehouse whose version has advanced since the client last
      observed it is rejected. Every check-in and check-out moves committed_cwt, so a
      client holding a stale warehouse view would be reasoning about remaining capacity
      from a number the warehouse no longer reports.
    error_id: ERR_STALE_WAREHOUSE_VERSION
    http_status: 412

calculations:
  - name: service_order_deadline_tier
    trigger: "POST /service-orders (writes deadline_tier and tier_multiplier), and again on POST /change-orders/{id}/apply where the tier is re-derived from the apply-time clock"
    algorithm: threshold
    formula: |
      t = logical_clock_now()                       # ordered_at at creation; apply-time clock on a change order
      show = booth_of(order).show
      if t <= show.discount_deadline:      tier = ADVANCE,  multiplier = ADVANCE_MULT
      elif t <= show.move_in_start:        tier = STANDARD, multiplier = STANDARD_MULT
      else:                                tier = ONSITE,   multiplier = ONSITE_MULT
      # Both comparisons are inclusive on the left-hand boundary: an order placed at
      # exactly show.discount_deadline is ADVANCE, and one placed at exactly
      # show.move_in_start is STANDARD. One microsecond later flips the tier.
    input_set: "Exactly one Show, resolved as ServiceOrder.booth_id -> Booth.show_id -> Show. Show.status is irrelevant to tiering; only the three timestamps matter."
    constants:
      ADVANCE_MULT: 1.00
      STANDARD_MULT: 1.30
      ONSITE_MULT: 1.65
    precision: "multiplier carried exactly as a 2-decimal rational; no rounding at this step"
    variants:
      - name: creation_tier
        when: "POST /service-orders"
        difference: "Tier is frozen onto the order and is never re-derived by later Show status transitions."
      - name: apply_time_tier
        when: "POST /change-orders/{id}/apply"
        difference: "The whole order is repriced at the tier in force at apply time, not at the tier stored on the order. An ADVANCE order changed on the floor reprices every line at ONSITE."

  - name: service_order_line_pricing
    trigger: "POST /service-orders and POST /change-orders/{id}/apply; writes ServiceOrderLine.line_total_cents and ServiceOrder.subtotal_cents"
    algorithm: tiered_pricing
    formula: |
      # Lines are evaluated in ascending line_seq order. line_seq is unique within the
      # order, so no tie-break is required.
      for line in sorted(order.lines, key=line_seq):
          gross            = line.unit_qty * line.unit_rate_cents          # exact integer cents
          after_discount   = gross * (1 - line.discount_pct)               # exact rational
          line_total_cents = ROUND_HALF_UP(after_discount * tier_multiplier)   # rounded HERE, per line
      subtotal_cents = SUM(line_total_cents over all lines)
      # PINNED ORDER: round each line to whole cents FIRST, then sum. Summing the
      # unrounded per-line products and rounding the sum once is NOT the rule and
      # produces a different subtotal whenever two or more lines land on a half cent.
    input_set: "Every ServiceOrderLine with service_order_id == this order; there is no status filter because lines are immutable and are never soft-deleted. An order must carry at least one line."
    constants:
      ROUNDING: round_half_up
    precision: "whole cents per line, then integer summation"
    variants:
      - name: round_per_line_then_sum
        when: "always — this is the pinned rule"
        difference: "Three lines each landing on .5 of a cent contribute +1 cent each, for +3 cents total."
      - name: sum_then_round_once
        when: "never — documented only to name the forbidden interpretation"
        difference: "The same three lines contribute a single +0.5 rounding, so the subtotal is 1 cent lower and the error propagates through the volume-discount and fee tiers into total_cents."

  - name: service_order_total
    trigger: "POST /service-orders and POST /change-orders/{id}/apply, immediately after service_order_line_pricing"
    algorithm: waterfall_allocation
    formula: |
      # The dependency looks circular: the total depends on a fee, the fee depends on a
      # discounted base, and the base depends on a discount keyed on a subtotal tier.
      # The evaluation order below is PINNED and makes the value well-defined.
      # Step 1  subtotal_cents            <- service_order_line_pricing
      # Step 2  volume_discount_pct       <- VOLUME_TIERS keyed on subtotal_cents
      # Step 3  volume_discount_cents      = ROUND_HALF_UP(subtotal_cents * volume_discount_pct)
      # Step 4  discounted_base_cents      = subtotal_cents - volume_discount_cents
      # Step 5  service_fee_pct           <- FEE_TIERS keyed on discounted_base_cents
      # Step 6  service_fee_cents          = ROUND_HALF_UP(discounted_base_cents * service_fee_pct)
      # Step 7  total_cents                = discounted_base_cents + service_fee_cents
      #
      # FORBIDDEN: keying FEE_TIERS on subtotal_cents or on total_cents, and keying
      # VOLUME_TIERS on discounted_base_cents or on total_cents. A subtotal of 200000
      # yields a 4% volume discount, a base of 192000, and therefore the 7% fee band —
      # NOT the 5% band that keying off the subtotal would have selected.
    input_set: "One ServiceOrder. No cross-order aggregation: volume tiers are per order, not per exhibitor."
    constants:
      VOLUME_TIERS: "subtotal_cents < 100000 -> 0.00; 100000 <= subtotal_cents < 500000 -> 0.04; 500000 <= subtotal_cents < 1500000 -> 0.07; subtotal_cents >= 1500000 -> 0.10"
      FEE_TIERS: "discounted_base_cents < 50000 -> 0.09; 50000 <= discounted_base_cents < 200000 -> 0.07; discounted_base_cents >= 200000 -> 0.05"
      ROUNDING: round_half_up
    precision: "whole cents at Step 3 and Step 6; Steps 4 and 7 are exact integer arithmetic"

  - name: drayage_charge
    trigger: "POST /drayage-shipments; writes gross_weight_lbs, billable_cwt and drayage_charge_cents"
    algorithm: tiered_pricing
    formula: |
      gross_weight_lbs = SUM(crate.weight_lbs for crate.id in shipment.crate_ids)
      billable_cwt     = MAX(MIN_BILLABLE_CWT, CEIL(gross_weight_lbs / 100))
      base_rate        = ADVANCE_RATE_CENTS_PER_CWT if channel == ADVANCE_WAREHOUSE
                         else DIRECT_RATE_CENTS_PER_CWT
      surcharge_pct    = 0
        + LOOSE_SURCHARGE  if ANY crate in crate_ids has crate_type == LOOSE_UNCRATED
        + OT_SURCHARGE     if hour_of(received_at) < 8 OR hour_of(received_at) >= 16
        + LATE_SURCHARGE   if channel == ADVANCE_WAREHOUSE
                              AND received_at > show.advance_warehouse_deadline
      drayage_charge_cents = ROUND_HALF_UP(billable_cwt * base_rate * (1 + surcharge_pct))
      # Surcharges are ADDITIVE on the base, never compounded: 0.30 + 0.25 is a 1.55
      # multiplier, not 1.30 * 1.25. The three conditions are independent and any
      # subset may hold at once.
    input_set: "Every Crate whose id appears in shipment.crate_ids, regardless of the crate's current status. Crates not listed on the shipment never contribute weight, even when they sit at the same warehouse."
    constants:
      MIN_BILLABLE_CWT: 2
      ADVANCE_RATE_CENTS_PER_CWT: 9800
      DIRECT_RATE_CENTS_PER_CWT: 11500
      LOOSE_SURCHARGE: 0.30
      OT_SURCHARGE: 0.25
      LATE_SURCHARGE: 0.35
    precision: "billable_cwt is a whole hundredweight via CEIL; the charge is whole cents, round_half_up"

  - name: labor_call_billing
    trigger: "POST /labor-calls/{id}/completion with outcome=COMPLETED; writes billed_hours, st_hours, ot_hours, dt_hours and labor_charge_cents"
    algorithm: chronological
    formula: |
      elapsed_minutes = MINUTES(actual_end - actual_start)
      elapsed_hours   = CEIL((elapsed_minutes / 60) * 2) / 2          # round UP to the next 0.5h
      billed_hours    = MAX(jurisdiction.min_call_hours, elapsed_hours)
      #
      # Band allocation walks the WORKED interval [actual_start, actual_end) minute by
      # minute in chronological order. A minute is straight time when its
      # minute-of-day falls in [venue.straight_time_start_hhmm, venue.straight_time_end_hhmm),
      # otherwise it is overtime.
      #
      # Sunday override: when actual_start falls on a Sunday (UTC), the ENTIRE call is
      # double time, st_hours = ot_hours = 0 and dt_hours = billed_hours. The override
      # is decided by actual_start alone; a call that begins Saturday and ends Sunday is
      # not double time.
      #
      # Minimum-call padding: padding_minutes = billed_hours * 60 - elapsed_minutes.
      # PINNED: all padding is assigned to the band containing the LAST WORKED MINUTE,
      # i.e. the minute beginning at actual_end - 1 minute. Padding is never split
      # across bands and never assigned to the band of actual_start.
      #
      st_hours = st_minutes / 60 ; ot_hours = ot_minutes / 60 ; dt_hours = 0
      labor_charge_cents = ROUND_HALF_UP(
          crew_size * (  st_hours * R
                       + ot_hours * R * jurisdiction.overtime_multiplier
                       + dt_hours * R * jurisdiction.doubletime_multiplier ) )
      where R = jurisdiction.straight_time_rate_cents_per_hour
      # PINNED: the crew-size multiplication and the three band products are summed in
      # exact rational arithmetic and rounded ONCE at the end — the opposite order from
      # service_order_line_pricing, which rounds per line before summing.
    input_set: "One LaborCall and the UnionJurisdiction named by jurisdiction_id, plus the Venue reached as booth -> show -> venue for the straight-time band."
    constants:
      HALF_HOUR_ROUNDING: "CEIL to the next 0.5 hour"
      SUNDAY_UTC_WEEKDAY: 6
    precision: "hours to 2 decimal places; charge to whole cents, round_half_up, applied once at the end"
    variants:
      - name: worked_billing
        when: "outcome=COMPLETED"
        difference: "Bands are derived from the actual worked interval and padded to the minimum call."
      - name: no_show_billing
        when: "outcome=NO_SHOW"
        difference: "No interval exists, so the whole minimum call is billed at straight time: ROUND_HALF_UP(crew_size * min_call_hours * R). Bands, padding and the Sunday override are not consulted."

  - name: exhibit_acquisition_quote
    trigger: "POST /exhibit-designs/{id}/quote; writes rental_quote_cents, purchase_quote_cents, rental_per_show_cents, purchase_per_show_cents, breakeven_show_count and quoted_price_cents"
    algorithm: forward_looking
    formula: |
      # VARIANT A — RENTAL_QUOTE
      rental_base_cents   = sqft * RENT_SQFT_CENTS
                          + linear_feet * RENT_LF_CENTS
                          + (SIGN_RENT_CENTS if has_hanging_sign else 0)
      rental_quote_cents  = ROUND_HALF_UP(rental_base_cents * (1 + REFURB_LOAD_PCT))
      rental_per_show_cents = rental_quote_cents          # a rental is re-rented every show

      # VARIANT B — PURCHASE_QUOTE
      build_cost_cents      = sqft * BUILD_SQFT_CENTS
                            + linear_feet * BUILD_LF_CENTS
                            + (SIGN_BUILD_CENTS if has_hanging_sign else 0)
      purchase_quote_cents  = ROUND_HALF_UP(build_cost_cents * (1 + DESIGN_FEE_PCT))
      residual_cents        = ROUND_HALF_UP(purchase_quote_cents * RESIDUAL_PCT)
      purchase_per_show_cents = ROUND_HALF_UP((purchase_quote_cents - residual_cents)
                                              / expected_show_count)
                              + PER_SHOW_CARRY_CENTS

      # Breakeven: smallest integer n in [1, BREAKEVEN_HORIZON] such that
      #   ROUND_HALF_UP((purchase_quote_cents - residual_cents) / n) + PER_SHOW_CARRY_CENTS
      #     <= rental_per_show_cents
      # Scanned in ascending n. If no such n exists within the horizon,
      # breakeven_show_count = 0 (sentinel meaning "never breaks even").

      quoted_price_cents = rental_quote_cents   if selected_acquisition_mode == RENTAL
                           else purchase_quote_cents
    input_set: "One ExhibitDesign. No other design, asset or show participates; expected_show_count is a client-supplied projection, not a count of existing rows."
    constants:
      RENT_SQFT_CENTS: 2400
      RENT_LF_CENTS: 15000
      SIGN_RENT_CENTS: 85000
      REFURB_LOAD_PCT: 0.12
      BUILD_SQFT_CENTS: 7800
      BUILD_LF_CENTS: 38000
      SIGN_BUILD_CENTS: 210000
      DESIGN_FEE_PCT: 0.15
      RESIDUAL_PCT: 0.20
      PER_SHOW_CARRY_CENTS: 45000
      BREAKEVEN_HORIZON: 20
    precision: "whole cents, round_half_up, applied at each named ROUND_HALF_UP site"
    variants:
      - name: RENTAL_QUOTE
        when: "selected_acquisition_mode == RENTAL"
        difference: "Charges the loaded rental base every show; carries no residual and no amortization denominator."
      - name: PURCHASE_QUOTE
        when: "selected_acquisition_mode == PURCHASE"
        difference: "Capitalises a design-fee-loaded build cost, deducts a residual, amortises over expected_show_count and adds a fixed per-show storage and refurbishment carry. For identical geometry the two variants differ by roughly a factor of three."

  - name: claim_settlement
    trigger: "POST /damage-claims/{id}/adjudication with decision=APPROVE; writes settlement_cents and coverage_basis"
    algorithm: threshold
    formula: |
      # VARIANT A — TARIFF_LIABILITY (default; the only variant available when the
      # cited shipment did not carry declared-value coverage)
      weight_basis_lbs = crate.weight_lbs           if claim.crate_id is not null
                         else asset.shipping_weight_lbs
      settlement_cents = MIN( claim.declared_value_cents,
                              ROUND_HALF_UP(weight_basis_lbs * TARIFF_CENTS_PER_LB),
                              TARIFF_MAX_PER_CLAIM_CENTS )

      # VARIANT B — DECLARED_VALUE (requires shipment_id is not null and
      # shipment.declared_value_coverage == true)
      depreciation_pct = DEPRECIATION_BY_GRADE[asset.condition_grade]
      settlement_cents = MAX(0,
          ROUND_HALF_UP( MIN(claim.declared_value_cents, asset.list_value_cents)
                         * (1 - depreciation_pct) )
          - DECLARED_VALUE_DEDUCTIBLE_CENTS )
      # The deductible is subtracted AFTER rounding the depreciated value, and the
      # result is floored at zero rather than allowed to go negative.
    input_set: "One DamageClaim plus the ExhibitAsset it names, the Crate it names when crate_id is non-null, and the DrayageShipment it names when shipment_id is non-null. Weight is never summed across crates: only the single cited crate counts."
    constants:
      TARIFF_CENTS_PER_LB: 30
      TARIFF_MAX_PER_CLAIM_CENTS: 5000000
      DECLARED_VALUE_DEDUCTIBLE_CENTS: 25000
      DEPRECIATION_BY_GRADE: "A -> 0.00; B -> 0.10; C -> 0.25; D -> 0.40"
    precision: "whole cents, round_half_up"
    variants:
      - name: TARIFF_LIABILITY
        when: "coverage_basis omitted at adjudication, or the cited shipment has declared_value_coverage == false"
        difference: "Weight-capped: a 1250 lb crate caps liability at 37500 cents no matter how valuable the property is."
      - name: DECLARED_VALUE
        when: "coverage_basis=DECLARED_VALUE supplied and shipment.declared_value_coverage == true"
        difference: "Value-based and condition-depreciated less a flat deductible; for the same claim it can exceed the tariff figure by more than an order of magnitude."

  - name: exhibitor_account_balance
    trigger: "Recomputed on POST /invoices/{id}/issue, POST /invoices/{id}/payments, POST /invoices/{id}/void, POST /damage-claims/{id}/settlement, and on the billing-status cascade of POST /change-orders/{id}/apply"
    algorithm: aggregation
    formula: |
      account_balance_cents =
            SUM(Invoice.total_cents   WHERE Invoice.exhibitor_id == E
                                        AND Invoice.status IN {ISSUED, PARTIALLY_SETTLED})
          - SUM(Invoice.settled_cents WHERE Invoice.exhibitor_id == E
                                        AND Invoice.status IN {ISSUED, PARTIALLY_SETTLED})
          - SUM(DamageClaim.settlement_cents WHERE DamageClaim.exhibitor_id == E
                                               AND DamageClaim.status == SETTLED)
      # Full recompute from the source rows every time; never an incremental delta.
      # DRAFT, SETTLED and VOID invoices are excluded outright, which is what makes
      # issue-then-void a perfect round trip.
    input_set: "All Invoice rows for the exhibitor with status in {ISSUED, PARTIALLY_SETTLED}, plus all DamageClaim rows for the exhibitor with status == SETTLED. No time window: the aggregate is over the exhibitor's entire history."
    constants:
      RECOMPUTE_MODE: full_recompute
    precision: "exact integer cents; no rounding"

  - name: warehouse_committed_cwt
    trigger: "Recomputed on POST /crates/{id}/warehouse-check-in, on every POST /crates/{id}/movements that leaves or enters a storage-bearing status, and on the crate-loss cascade of an APPROVED LOSS claim"
    algorithm: aggregation
    formula: |
      committed_cwt = SUM( CEIL(Crate.weight_lbs / 100)
                           WHERE Crate.warehouse_id == W
                             AND Crate.status IN {AT_ADVANCE_WAREHOUSE,
                                                  RETURNED_TO_WAREHOUSE} )
      # Per-crate CEIL then sum — the same round-then-sum discipline as
      # service_order_line_pricing. Summing raw pounds and taking one CEIL is NOT the rule.
      # EMPTY_STORED crates sit in accessible storage on the show floor, carry no
      # warehouse_id and therefore never contribute.
    input_set: "Crate rows whose warehouse_id equals this warehouse and whose status is AT_ADVANCE_WAREHOUSE or RETURNED_TO_WAREHOUSE. Every other status contributes zero."
    constants:
      CWT_DIVISOR: 100
    precision: "whole hundredweight per crate via CEIL, then exact integer summation"

  - name: show_committed_labor_hours
    trigger: "Recomputed on POST /labor-calls/{id}/dispatch, /check-in, /completion and /cancel, and on every cascade that cancels a labor call"
    algorithm: aggregation
    formula: |
      committed_labor_hours =
          SUM( LaborCall.crew_size * LaborCall.scheduled_hours
               WHERE booth_of(LaborCall).show_id == S
                 AND LaborCall.status IN {DISPATCHED, ON_SITE} )
      # scheduled_hours = (scheduled_end - scheduled_start) in hours to 2dp, computed
      # once at creation and never re-derived from actual_start / actual_end.
    input_set: "LaborCall rows reachable as call -> booth -> show for this show, filtered to status in {DISPATCHED, ON_SITE}. REQUESTED calls are not yet committed; COMPLETED, NO_SHOW and CANCELLED calls are no longer committed."
    constants:
      HOURS_PRECISION: 2
    precision: "hours to 2 decimal places, round_half_up on the final sum"

  - name: booth_posture
    trigger: "Recomputed on every write that touches the booth's exhibitor, show, labor calls, drayage shipments or change orders — enumerated in the side_effects of the relevant transitions"
    algorithm: constraint_propagation
    formula: |
      # Clauses are evaluated in the order below and the FIRST match wins, which also
      # fixes posture_reason. FROZEN clauses outrank every RESTRICTED clause.
      # FROZEN
      #   F1 exhibitor.status == SUSPENDED                    -> EXHIBITOR_SUSPENDED
      #   F2 exhibitor.account_balance_cents
      #        > exhibitor.credit_limit_cents                 -> CREDIT_LIMIT_BREACHED
      #   F3 show.status == CLOSED                            -> SHOW_CLOSED
      #   F4 show.status == CANCELLED                         -> SHOW_CANCELLED
      # RESTRICTED
      #   R1 EXISTS LaborCall(booth_id == B, status == NO_SHOW)          -> LABOR_NO_SHOW
      #   R2 EXISTS DrayageShipment(exhibitor_id == booth.exhibitor_id,
      #        show_id == booth.show_id, hold_flag == true)              -> FREIGHT_HOLD
      #   R3 EXISTS ChangeOrder(booth_id == B, status == APPROVED)       -> CHANGE_ORDER_APPROVED
      # OPEN
      #   otherwise, posture_reason = null
      #
      # F2 uses strict greater-than: a balance exactly equal to the credit limit is NOT
      # a breach.
    input_set: "The booth's Exhibitor row, its Show row, all LaborCall rows on the booth, all ChangeOrder rows on the booth, and all DrayageShipment rows matching the booth's exhibitor and show."
    constants:
      CLAUSE_ORDER: "F1, F2, F3, F4, R1, R2, R3"
    precision: "enum, no numeric rounding"

  - name: storage_billing
    trigger: "POST /warehouses/{id}/storage-billing-runs; writes Crate.storage_charge_cents for every metered crate and returns the run total"
    algorithm: decay_function
    formula: |
      for each crate with warehouse_id == W
                     and status IN {AT_ADVANCE_WAREHOUSE, RETURNED_TO_WAREHOUSE}
                     and stored_since is not null,
          processed in ascending crate.created_at order:
        days_stored     = FLOOR((as_of - crate.stored_since) / 86400 seconds)
        billable_days   = MAX(0, days_stored - warehouse.free_days)
        billable_months = CEIL(billable_days / DAYS_PER_BILLABLE_MONTH)
        crate.storage_charge_cents =
            ROUND_HALF_UP( CEIL(crate.weight_lbs / 100)
                           * warehouse.storage_rate_cents_per_cwt_per_month
                           * billable_months )
      total_storage_charge_cents = SUM(crate.storage_charge_cents)   # round per crate, then sum
      # Boundary: days_stored exactly equal to free_days yields billable_days 0,
      # billable_months 0 and a charge of exactly 0. One further day yields a full month.
    input_set: "Crate rows at this warehouse in status AT_ADVANCE_WAREHOUSE or RETURNED_TO_WAREHOUSE with a non-null stored_since. Crates in any other status are skipped and keep their previous storage_charge_cents."
    constants:
      DAYS_PER_BILLABLE_MONTH: 30
    precision: "whole days via FLOOR, whole months via CEIL, whole cents per crate via round_half_up"

  - name: lead_license_billing
    trigger: "POST /lead-capture-licenses/{id}/lead-batches; writes leads_ingested_count, billable_overage_leads, lead_overage_cents and license_total_cents"
    algorithm: aggregation
    formula: |
      # Badge ids are deduplicated against ingested_badge_ids, which is the set of every
      # badge id ever accepted on this license. New ids are appended in request order;
      # ids already present are silently skipped and do not raise an error.
      ingested_badge_ids     = ingested_badge_ids ++ [b for b in request.badge_ids
                                                      if b not in ingested_badge_ids]
      leads_ingested_count   = LENGTH(ingested_badge_ids)
      billable_overage_leads = MAX(0, leads_ingested_count - included_leads)
      lead_overage_cents     = billable_overage_leads * LEAD_OVERAGE_CENTS
      license_total_cents    = device_count * DEVICE_FEE_CENTS + lead_overage_cents
      # Boundary: leads_ingested_count exactly equal to included_leads yields
      # billable_overage_leads 0 and lead_overage_cents 0.
    input_set: "One LeadCaptureLicense and the badge_ids array on the request. Duplicate ids WITHIN a single request body are also collapsed, first occurrence winning."
    constants:
      DEVICE_FEE_CENTS: 32500
      LEAD_OVERAGE_CENTS: 150
    precision: "exact integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The acting role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "When the acting role is Exhibitor, X-User-ID equals the exhibitor_id reachable from the target resource; when the acting role is WarehouseAgent, X-User-ID equals the warehouse_id the request targets"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Exhibitor-scoped and WarehouseAgent-scoped endpoints"
  - priority: 5
    category: auth
    check: "Segregation of duties: X-User-ID differs from ChangeOrder.created_by_user_id on review APPROVE/REJECT, from DamageClaim.filed_by_user_id on adjudication, and from Invoice.issued_by_user_id on void"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /change-orders/{id}/review, POST /damage-claims/{id}/adjudication, POST /invoices/{id}/void"
  - priority: 6
    category: business_constraint
    check: "Request body carries every required field, every enum value is a declared member, every integer field is a non-negative integer, and every datetime parses as ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 8
    category: existence
    check: "Every path-segment resource exists, validated left to right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_SHOW_NOT_FOUND | ERR_EXHIBITOR_NOT_FOUND | ERR_BOOTH_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_DESIGN_NOT_FOUND | ERR_SERVICE_ORDER_NOT_FOUND | ERR_CRATE_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_LABOR_CALL_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_REFURB_NOT_FOUND | ERR_LICENSE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 9
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared on the endpoint's input list"
    error_id: "the matching ERR_*_NOT_FOUND for the referenced entity"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 10
    category: state
    check: "The target resource is in a from-state that the requested transition declares"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 11
    category: state
    check: "The target resource is not already in a terminal state for its machine"
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 12
    category: state
    check: "expected_booth_version, expected_service_order_version or expected_warehouse_version matches the parent's current version"
    error_id: "ERR_STALE_BOOTH_VERSION | ERR_STALE_SERVICE_ORDER_VERSION | ERR_STALE_WAREHOUSE_VERSION"
    http_status: 412
    applies_to: "POST /service-orders, POST /change-orders/{id}/apply, POST /crates/{id}/warehouse-check-in"
  - priority: 13
    category: state
    check: "The Show reached from the target is in a status that admits the operation: order creation and confirmation require {OPEN_FOR_ORDERS, ADVANCE_CLOSED, MOVE_IN, ON_SITE}; labor dispatch requires {MOVE_IN, ON_SITE, MOVE_OUT}; lead ingest requires {ON_SITE, MOVE_OUT}"
    error_id: ERR_SHOW_NOT_ACCEPTING
    http_status: 409
    applies_to: "POST /service-orders, POST /service-orders/{id}/fulfillment, POST /labor-calls, POST /labor-calls/{id}/dispatch, POST /lead-capture-licenses/{id}/lead-batches, POST /crates/{id}/movements"
  - priority: 14
    category: state
    check: "The Booth reached from the target is not FROZEN"
    error_id: ERR_BOOTH_FROZEN
    http_status: 409
    applies_to: "POST /service-orders, POST /service-orders/{id}/fulfillment, POST /labor-calls, POST /labor-calls/{id}/dispatch, POST /change-orders, POST /change-orders/{id}/submit, POST /change-orders/{id}/apply, POST /exhibit-designs/{id}/quote, POST /exhibit-designs/{id}/release, POST /lead-capture-licenses/{id}/lead-batches"
  - priority: 15
    category: state
    check: "The Booth reached from the target is not RESTRICTED, for the narrower set of operations that RESTRICTED also blocks"
    error_id: ERR_BOOTH_RESTRICTED
    http_status: 409
    applies_to: "POST /labor-calls/{id}/dispatch, POST /exhibit-designs/{id}/decision with decision=APPROVE"
  - priority: 16
    category: business_safety
    check: "self_install_requested is true only when the named jurisdiction has exhibitor_self_install_allowed true"
    error_id: ERR_UNION_JURISDICTION_REQUIRED
    http_status: 422
    applies_to: "POST /labor-calls"
  - priority: 17
    category: business_safety
    check: "has_hanging_sign is true only when the booth's booth_type appears in the venue's hanging_sign_booth_types"
    error_id: ERR_HANGING_SIGN_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /exhibit-designs, POST /exhibit-designs/{id}/quote"
  - priority: 18
    category: business_safety
    check: "No crate on the shipment has weight_lbs greater than the show's venue max_forklift_capacity_lbs"
    error_id: ERR_CRATE_WEIGHT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /drayage-shipments"
  - priority: 19
    category: business_temporal
    check: "scheduled_start < scheduled_end and the whole interval lies inside [show.move_in_start, show.move_out_end]"
    error_id: ERR_LABOR_WINDOW_OUTSIDE_SHOW
    http_status: 422
    applies_to: "POST /labor-calls"
  - priority: 20
    category: business_temporal
    check: "Buffered overlap on the crew resource: for the same (jurisdiction_id, booth_id) pair and any existing call whose status is in {REQUESTED, DISPATCHED, ON_SITE}, reject when new.scheduled_start < existing.scheduled_end + turnaround_buffer_minutes AND existing.scheduled_start < new.scheduled_end + turnaround_buffer_minutes. A gap exactly equal to the buffer is accepted."
    error_id: ERR_LABOR_CALL_OVERLAP
    http_status: 409
    applies_to: "POST /labor-calls"
  - priority: 21
    category: business_temporal
    check: "Closed-interval collision on the booth floor: for the same booth_id and any existing ServiceOrder with non-null window and fulfillment_status in {PENDING, CONFIRMED, SCHEDULED, HELD}, reject when new.window_start <= existing.window_end AND existing.window_start <= new.window_end. Touching endpoints collide."
    error_id: ERR_BOOTH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-orders"
  - priority: 22
    category: business_temporal
    check: "Aggregate dock capacity on the warehouse: over the half-open interval [dock_window_start, dock_window_end), the sum of billable_cwt across this shipment and every existing shipment at the same warehouse with status in {RECEIVED, IN_TRANSIT} whose own half-open window intersects it must not exceed warehouse.dock_capacity_cwt. Abutting windows (existing.end == new.start) do not intersect."
    error_id: ERR_DOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /drayage-shipments"
  - priority: 23
    category: business_referential
    check: "The named UnionJurisdiction's venue_id equals the venue_id of the show reached as booth -> show"
    error_id: ERR_JURISDICTION_VENUE_MISMATCH
    http_status: 422
    applies_to: "POST /labor-calls"
  - priority: 24
    category: business_referential
    check: "Every crate in crate_ids has exhibitor_id equal to the shipment's exhibitor_id"
    error_id: ERR_CRATE_EXHIBITOR_MISMATCH
    http_status: 422
    applies_to: "POST /drayage-shipments"
  - priority: 25
    category: business_referential
    check: "The row named by target_type/target_id exists and its booth_id equals the change order's booth_id"
    error_id: ERR_CHANGE_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /change-orders, POST /change-orders/{id}/apply"
  - priority: 26
    category: business_referential
    check: "Every ServiceOrder in service_order_ids sits on a booth whose exhibitor_id and show_id equal the invoice's exhibitor_id and show_id"
    error_id: ERR_INVOICE_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /invoices"
  - priority: 27
    category: business_referential
    check: "The crate named on a claim is packed with the claimed asset (crate.asset_id == claim.asset_id) and the asset belongs to the claiming exhibitor"
    error_id: ERR_CLAIM_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /damage-claims"
  - priority: 28
    category: business_constraint
    check: "Warehouse capacity: warehouse.committed_cwt + ceil(crate.weight_lbs/100) <= warehouse.capacity_cwt, and warehouse.status == ACCEPTING"
    error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /crates/{id}/warehouse-check-in"
  - priority: 29
    category: business_constraint
    check: "crew_size is at least 1 and at most jurisdiction.crew_max_size"
    error_id: ERR_CREW_SIZE_LIMIT
    http_status: 422
    applies_to: "POST /labor-calls"
  - priority: 30
    category: business_constraint
    check: "Collection inputs are non-empty: lines on a service order, crate_ids on a shipment, service_order_ids on an invoice, badge_ids on a lead batch"
    error_id: ERR_EMPTY_COLLECTION
    http_status: 422
    applies_to: "POST /service-orders, POST /drayage-shipments, POST /invoices, POST /lead-capture-licenses/{id}/lead-batches"
  - priority: 31
    category: business_constraint
    check: "line_seq values on a service order are unique and form a contiguous 1-based run"
    error_id: ERR_INVALID_LINE_SEQUENCE
    http_status: 422
    applies_to: "POST /service-orders"
  - priority: 32
    category: business_constraint
    check: "booth_number is unique within its show_id"
    error_id: ERR_DUPLICATE_BOOTH_NUMBER
    http_status: 409
    applies_to: "POST /booths"
  - priority: 33
    category: business_constraint
    check: "A design may cycle QUOTED -> DRAFT at most MAX_DESIGN_REVISIONS times"
    error_id: ERR_DESIGN_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /exhibit-designs/{id}/decision with decision=REQUEST_REVISION"
  - priority: 34
    category: business_constraint
    check: "A denied claim may be appealed at most MAX_CLAIM_APPEALS times"
    error_id: ERR_CLAIM_APPEAL_LIMIT
    http_status: 409
    applies_to: "POST /damage-claims/{id}/appeal"
  - priority: 35
    category: business_constraint
    check: "actual_cents on a completing refurb work order does not exceed round_half_up(estimate_cents * REFURB_OVERRUN_TOLERANCE) unless an APPLIED ChangeOrder covers the overrun"
    error_id: ERR_REFURB_OVERRUN_UNAPPROVED
    http_status: 422
    applies_to: "POST /refurb-work-orders/{id}/progress with to_status=COMPLETED"
  - priority: 36
    category: business_constraint
    check: "condition_grade_after is not worse than the asset's current condition_grade, ordering A > B > C > D"
    error_id: ERR_CONDITION_GRADE_REGRESSION
    http_status: 422
    applies_to: "POST /refurb-work-orders/{id}/progress with to_status=COMPLETED"
  - priority: 37
    category: business_constraint
    check: "A lead batch is refused once the license status is CLOSED"
    error_id: ERR_LICENSE_CLOSED
    http_status: 409
    applies_to: "POST /lead-capture-licenses/{id}/lead-batches"
  - priority: 38
    category: business_fiscal
    check: "Projected exposure, defined as exhibitor.account_balance_cents plus the sum of total_cents over the exhibitor's ServiceOrders with billing_status == UNBILLED including the order being created, must not exceed exhibitor.credit_limit_cents. Equality is permitted; only a strictly greater figure is refused."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /service-orders"
  - priority: 39
    category: business_fiscal
    check: "amount_cents is strictly positive and settled_cents + amount_cents <= total_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"
  - priority: 40
    category: business_fiscal
    check: "declared_value_cents does not exceed the asset's list_value_cents"
    error_id: ERR_DECLARED_VALUE_EXCEEDS_ASSET
    http_status: 422
    applies_to: "POST /damage-claims"
  - priority: 41
    category: business_fiscal
    check: "A DECLARED_VALUE coverage basis is only selectable when the cited shipment carries declared_value_coverage true"
    error_id: ERR_COVERAGE_BASIS_UNAVAILABLE
    http_status: 422
    applies_to: "POST /damage-claims/{id}/adjudication"
  - priority: 42
    category: business_fiscal
    check: "An exhibitor whose status is SUSPENDED may not have a new invoice issued against it"
    error_id: ERR_EXHIBITOR_SUSPENDED
    http_status: 402
    applies_to: "POST /invoices/{id}/issue"

endpoints:
  # ---------------- Venues, jurisdictions, warehouses (configuration surface) ----------------
  - method: POST
    path: "/venues"
    description: "Register a venue with its straight-time band, forklift limit and hanging-sign policy"
    roles: [ShowOperations]
    code: 201
    input: ["name", "city", "straight_time_start_hhmm?", "straight_time_end_hhmm?", "max_forklift_capacity_lbs?", "hanging_sign_booth_types?", "dock_count?", "status?"]
    output: Venue
    side_effects: ["Venue created with version 1"]
  - method: GET
    path: "/venues/{id}"
    description: "Read one venue"
    roles: [ShowOperations, Exhibitor, WarehouseAgent, LaborSupervisor, ClaimsAdjuster, FinanceController]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/venues/{id}/union-jurisdictions"
    description: "Declare a craft jurisdiction and its labor rules at this venue"
    roles: [ShowOperations]
    code: 201
    input: ["trade", "straight_time_rate_cents_per_hour", "overtime_multiplier?", "doubletime_multiplier?", "min_call_hours?", "crew_max_size?", "exhibitor_self_install_allowed?", "turnaround_buffer_minutes?"]
    output: UnionJurisdiction
    side_effects: ["UnionJurisdiction created with venue_id taken from the path"]
  - method: GET
    path: "/venues/{id}/union-jurisdictions"
    description: "List the jurisdictions declared at a venue; reverse-reachability for UnionJurisdiction.venue_id"
    roles: [ShowOperations, Exhibitor, WarehouseAgent, LaborSupervisor, ClaimsAdjuster, FinanceController]
    code: 200
    input: ["trade?", "limit?", "offset?"]
    output: UnionJurisdiction[]
    side_effects: []
  - method: POST
    path: "/warehouses"
    description: "Register an advance warehouse with its storage rate, free-day allowance and dock capacity"
    roles: [ShowOperations]
    code: 201
    input: ["name", "city", "capacity_cwt", "storage_rate_cents_per_cwt_per_month?", "free_days?", "dock_capacity_cwt?", "status?"]
