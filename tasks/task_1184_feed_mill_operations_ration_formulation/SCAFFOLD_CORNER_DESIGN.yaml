  - section: errors
    instances:
      - name: bin_admin_domain_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_CODE]", "errors[ERR_BIN_CAPACITY_EXCEEDED]", "errors[ERR_BIN_NOT_EMPTY]", "errors[ERR_BIN_BLOCKED]"]
        distinguishing_aspect: "Bin administration errors: duplicate bin code (409), replenish beyond capacity (422), reassignment while stock remains (409), and replenish of a BLOCKED bin after its ingredient was discontinued (409)."
        test_recipe:
          setup: ["corn + SBM ingredients; BIN-C assigned to corn with 10t on hand"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 10 }, as: MillManager }
          trigger:
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 30 }, as: MillManager, captures: { err_dup: $.data.error_id } }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 41 }, as: MillManager, captures: { err_cap: $.data.error_id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager, captures: { err_ne: $.data.error_id } }
            - { call: "POST /api/ingredients/${corn_id}/discontinue", payload: {}, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 1 }, as: MillManager, captures: { err_blk: $.data.error_id } }
          assert:
            - "err_dup == ERR_DUPLICATE_CODE (409)"
            - "err_cap == ERR_BIN_CAPACITY_EXCEEDED (10 + 41 > 50; equality 40 would pass)"
            - "err_ne == ERR_BIN_NOT_EMPTY (on_hand_tons 10 > 0 blocks reassignment)"
            - "after discontinue: Bin.${binc_id}.status == BLOCKED (cascade) and err_blk == ERR_BIN_BLOCKED"

