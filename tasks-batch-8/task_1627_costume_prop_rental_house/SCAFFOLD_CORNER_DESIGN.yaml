# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Costume & Prop Rental House
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: item_creation_defaults_and_computed_fields
        claim_type: creation
        grounds: [entities.Item]
        distinguishing_aspect: "A created Item gets status ACTIVE, serviceable_unit_count 0, version 1, server-minted id/created_at — computed/system fields come from the server, not the payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /rental-house/items", payload: { name: "Tailcoat", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id, st: $.data.status, svc: $.data.serviceable_unit_count, ver: $.data.version } }
          trigger: []
          assert:
            - "201; Item.status == ACTIVE, serviceable_unit_count == 0, version == 1, id is a bare UUID"

      - name: item_list_filter_pagination_and_deaccession_visibility
        claim_type: listing
        grounds: [entities.Item, endpoints.GET_/rental-house/items]
        distinguishing_aspect: "Filtered list (category=COSTUME) returns only matching rows with total_count/has_more; a DEACCESSIONED item is hidden by default and visible with include_deaccessioned=true."
        test_recipe:
          setup: ["Two COSTUME items and one PROP item; the PROP item fully deaccessioned (no units)"]
          setup_api_calls:
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I2", period: REGENCY, category: COSTUME, size_class: L, alteration_policy: REVERSIBLE_ONLY, replacement_value_cents: 80000, base_daily_rate_cents: 900, base_weekly_rate_cents: 4500 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I3", period: TWENTIES, category: PROP, size_class: NONE, alteration_policy: PROHIBITED, replacement_value_cents: 20000, base_daily_rate_cents: 500, base_weekly_rate_cents: 2500 }, as: HouseAdmin, captures: { i3: $.data.id } }
            - { call: "POST /rental-house/items/${i3}/request-deaccession", payload: {}, as: HouseAdmin }
            - { call: "POST /rental-house/items/${i3}/complete-deaccession", payload: {}, as: HouseAdmin }
          trigger:
            - { call: "GET /rental-house/items?category=COSTUME&limit=1&offset=1", payload: {}, as: HouseAdmin, captures: { n: "$.data[0].name" } }
            - { call: "GET /rental-house/items", payload: {}, as: HouseAdmin }
            - { call: "GET /rental-house/items?include_deaccessioned=true", payload: {}, as: HouseAdmin }
          assert:
            - "Filtered page: 1 row, total_count == 2, has_more == false (offset 1 of 2)"
            - "Default list: total_count == 2 (I3 hidden once DEACCESSIONED)"
            - "include_deaccessioned=true: total_count == 3; GET /items/${i3} still returns 200 (soft delete keeps direct reads)"

      - name: unit_create_invalid_condition_grade_rejected
        claim_type: type_constraints
        grounds: [entities.ItemUnit.fields.condition_grade, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "condition_grade is a closed enum A|B|C|D — 'E' fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Item exists"]
          setup_api_calls:
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
          trigger:
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-X1", condition_grade: "E", acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400"

      - name: unit_create_duplicate_barcode_rejected
        claim_type: type_constraints
        grounds: [entities.ItemUnit.fields.barcode, "errors[ERR_DUPLICATE_BARCODE]"]
        distinguishing_aspect: "barcode is unique house-wide across ALL items, not per-item — the second unit with the same barcode fails even on a different item."
        test_recipe:
          setup: ["Two items; unit with barcode BC-DUP created under item 1"]
          setup_api_calls:
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { i1: $.data.id } }
            - { call: "POST /rental-house/items", payload: { name: "I2", period: REGENCY, category: PROP, size_class: NONE, alteration_policy: PROHIBITED, replacement_value_cents: 80000, base_daily_rate_cents: 900, base_weekly_rate_cents: 4500 }, as: HouseAdmin, captures: { i2: $.data.id } }
            - { call: "POST /rental-house/items/${i1}/units", payload: { barcode: "BC-DUP", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
          trigger:
            - { call: "POST /rental-house/items/${i2}/units", payload: { barcode: "BC-DUP", condition_grade: A, acquisition_date: "2025-02-01", acquisition_cost_cents: 30000 }, as: HouseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_BARCODE, HTTP 409"

      - name: renter_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Renter, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that was never created returns ERR_NOT_FOUND (404), not a 500 or empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rental-house/renters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: HouseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: reservation_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Reservation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field quantity fails with ERR_VALIDATION (400) — and this lowest-priority check still fires when every higher-priority rule passes."
        test_recipe:
          setup: ["RC published; item+unit; renter ACTIVE; production CONFIRMED (version captured)"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-M1", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PM-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400 (quantity missing)"

  - section: state_machines
    instances:
      - name: cert_starts_submitted_and_verify_flips_renter
        claim_type: initial_state
        grounds: [state_machines.InsuranceCertificate, state_machines.Renter.PENDING_VERIFICATION_to_ACTIVE]
        distinguishing_aspect: "A certificate is born SUBMITTED with decided_by_user_id null; its VERIFIED decision is what flips the renter PENDING_VERIFICATION -> ACTIVE (not the create call)."
        test_recipe:
          setup: ["renter created (PENDING_VERIFICATION)"]
          setup_api_calls:
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id, r_st: $.data.status } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PC-1", coverage_cents: 100000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id, c_st: $.data.status, c_dec: $.data.decided_by_user_id } }
          trigger:
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin, as_user_id: "admin-9", captures: { c_after: $.data.status, c_dec2: $.data.decided_by_user_id } }
            - { call: "GET /rental-house/renters/${r_id}", payload: {}, as: HouseAdmin, captures: { r_after: $.data.status } }
          assert:
            - "At create: Renter.status == PENDING_VERIFICATION; cert status == SUBMITTED, decided_by_user_id == null"
            - "After decide VERIFIED: cert VERIFIED with decided_by_user_id == admin-9; renter ACTIVE"

      - name: cert_double_decide_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InsuranceCertificate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED and REJECTED are terminal for decide: a second decide on a VERIFIED cert fails ERR_INVALID_STATE (409) and does not change decided_by_user_id."
        test_recipe:
          setup: ["renter with cert already VERIFIED by admin-1"]
          setup_api_calls:
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PC-2", coverage_cents: 100000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: REJECTED }, as: HouseAdmin, as_user_id: "admin-2", captures: { err: $.data.error_id } }
            - { call: "GET /rental-house/insurance-certificates/${cert}", payload: {}, as: HouseAdmin, captures: { c_st: $.data.status, c_dec: $.data.decided_by_user_id } }
          assert:
            - "Second decide: error_id == ERR_INVALID_STATE (409); cert remains VERIFIED with decided_by_user_id == admin-1"

      - name: fitting_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FittingAuthorization, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: a later decide on the same fitting fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["dispatched line on a TAILORING_ALLOWED item; fitting HEM decided REJECTED"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-F1", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PF-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}" }
            - { call: "GET /rental-house/productions/${p_id}", payload: {}, as: HouseAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /rental-house/pull-lists", payload: { production_id: "${p_id}", expected_production_version: "${p_v2}" }, as: RenterContact, as_user_id: "${r_id}", captures: { pl: $.data.id } }
            - { call: "POST /rental-house/pull-lists/${pl}/submit", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/pull-list-lines?pull_list_id=${pl}", payload: {}, as: WardrobeStaff, captures: { l1: "$.data[0].id" } }
            - { call: "POST /rental-house/fitting-authorizations", payload: { pull_list_line_id: "${l1}", alteration_type: HEM }, as: RenterContact, as_user_id: "${r_id}", captures: { fit: $.data.id } }
            - { call: "POST /rental-house/fitting-authorizations/${fit}/decide", payload: { decision: REJECTED }, as: HouseAdmin }
          trigger:
            - { call: "POST /rental-house/fitting-authorizations/${fit}/decide", payload: { decision: APPROVED }, as: HouseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); fitting stays REJECTED"

      - name: reservation_release_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Reservation.HELD_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RELEASED is terminal: the same release trigger twice fails on the second attempt with ERR_INVALID_STATE — no double-release side effects."
        test_recipe:
          setup: ["renter ACTIVE; production DRAFT; reservation HELD"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-R1", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PR-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
            - { call: "POST /rental-house/reservations/${r1}/release", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /rental-house/reservations/${r1}/release", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "First release: status == RELEASED; second release: error_id == ERR_INVALID_STATE (409)"

      - name: cleaning_ticket_repair_loop_returns_unit
        claim_type: valid_transition
        grounds: [state_machines.CleaningTicket, state_machines.ItemUnit.REPAIR_to_AVAILABLE]
        distinguishing_aspect: "REPAIRABLE check-in routes the ticket through the INSPECTION->REPAIR->INSPECTION loop (cyclic): QUEUED -> IN_CLEANING -> INSPECTION -> REPAIR (repair_done=true) -> INSPECTION -> READY, and only then does the unit return REPAIR -> AVAILABLE."
        test_recipe:
          setup: ["dispatched line; check-in at 2026-09-10 with damage_severity REPAIRABLE"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-C1", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin, captures: { u1: $.data.id } }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PC-3", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}" }
            - { call: "GET /rental-house/productions/${p_id}", payload: {}, as: HouseAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /rental-house/pull-lists", payload: { production_id: "${p_id}", expected_production_version: "${p_v2}" }, as: RenterContact, as_user_id: "${r_id}", captures: { pl: $.data.id } }
            - { call: "POST /rental-house/pull-lists/${pl}/submit", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/pull-list-lines?pull_list_id=${pl}", payload: {}, as: WardrobeStaff, captures: { l1: "$.data[0].id" } }
            - { call: "POST /rental-house/pull-list-lines/${l1}/pick", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: HouseAdmin }
            - { call: "POST /rental-house/pull-lists/${pl}/dispatch", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: HouseAdmin }
            - { call: "POST /rental-house/pull-list-lines/${l1}/check-in", payload: { condition_grade_after: C, damage_severity: REPAIRABLE, restoration_complete: true }, as: WardrobeStaff, as_user_id: "ws-1" }
            - { call: "GET /rental-house/units/${u1}", payload: {}, as: WardrobeStaff, captures: { u_mid: $.data.status } }
            - { call: "GET /rental-house/units/${u1}/cleaning-tickets", payload: {}, as: WardrobeStaff, captures: { t1: "$.data[0].id", t_rep: "$.data[0].requires_repair" } }
          trigger:
            - { call: "POST /rental-house/cleaning-tickets/${t1}/advance", payload: {}, as: WardrobeStaff, captures: { s1: $.data.status } }
            - { call: "POST /rental-house/cleaning-tickets/${t1}/advance", payload: {}, as: WardrobeStaff, captures: { s2: $.data.status } }
