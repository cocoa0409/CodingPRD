scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_provisional_vs_final_on_code_suggestions
        grounds:
          - calculations.billing_suggestion_totals
          - entities.NoteDraft.fields.billing_provisional_cents
          - entities.NoteDraft.fields.billing_final_cents
        distinguishing_aspect: |
          Entity domain: CodeSuggestion billing totals on a NoteDraft. Two valid
          variants (confidence-weighted provisional over SUGGESTED/MODIFIED plus
          full CONFIRMED lines, vs CONFIRMED-only final) produce 1500 vs 0 cents
          for identical stored data before any confirmation.
        test_recipe:
          setup:
            - "Encounter with GRANTED consent, one TRANSCRIBED capture, and a NoteDraft on a 2-field template (chief CRITICAL, hpi MAJOR)"
            - "Two BILLING suggestions: S1 unit 1000 qty 1 adj 1.004 conf 0.5; S2 unit 1000 qty 1 adj 1.004 conf 1.0 (each line rounds to 1000 cents)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-DV1-1", full_name: "Pat Dv1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-DV1-1", full_name: "Doc Dv1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "dv1", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}", scheduled_start: "2026-09-01T16:00:00Z" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id" }
          trigger:
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/code-suggestions"
              payload: { suggestions: [{ code_type: "BILLING", code_value: "B1001", confidence: 0.5, quantity: 1, unit_fee_cents: 1000, adjustment_pct: 1.004 }, { code_type: "BILLING", code_value: "B1002", confidence: 1.0, quantity: 1, unit_fee_cents: 1000, adjustment_pct: 1.004 }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          assert:
            - "NoteDraft.${draft}.billing_provisional_cents == 1500 (round_half_up(1000*0.5)=500 weighted SUGGESTED plus round_half_up(1000*1.0)=1000)"
            - "NoteDraft.${draft}.billing_final_cents == 0 (no CONFIRMED lines yet)"
            - "The two variants diverge by exactly 1500 cents on identical stored suggestion rows"
      - name: documentation_minutes_provisional_vs_final_on_encounter_spans
        grounds:
          - calculations.documentation_time
          - entities.DocumentationMetric.fields.provisional_minutes
          - entities.DocumentationMetric.fields.final_minutes
          - entities.DocumentationMetric.fields.after_hours_minutes
        distinguishing_aspect: |
          Entity domain: DocumentationMetric over Encounter/Attestation spans
          (different domain from CodeSuggestion billing). Provisional wall-clock
          minutes (210) vs final pause-adjusted minutes (195) diverge on the same
          attestation span; after-hours charting is measured at 90 minutes.
        test_recipe:
          setup:
            - "Encounter started 2026-09-01T16:00:00Z, capture paused 17:00-17:15, stopped 17:20, encounter completed 17:25, note attested 19:30 (after-hours charting)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-DV2-1", full_name: "Pat Dv2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-DV2-1", full_name: "Doc Dv2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "dv2", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }, { key: "exam", importance: "MAJOR", required: true }, { key: "plan", importance: "MAJOR", required: true }, { key: "ros", importance: "MINOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "VERBAL" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/pause"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T17:15:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/resume"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T17:20:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id", draft_v: "$.data.version" }
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "chest pain" }, { field_key: "hpi", field_value: "3 days" }, { field_key: "exam", field_value: "normal" }, { field_key: "plan", field_value: "stress test" }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T17:25:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/complete"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:30:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/attest"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/physicians/${phy}/documentation-metrics/recompute"
              payload: { period_start: "2026-09-01T00:00:00Z" }
              as: Physician
              as_user_id: "${phy}"
          assert:
            - "DocumentationMetric.provisional_minutes == 210 (19:30 - 16:00 wall clock)"
            - "DocumentationMetric.final_minutes == 195 (210 minus the 15-minute pause)"
            - "DocumentationMetric.after_hours_minutes == 90 (span 18:00-19:30; the pause lies outside the window)"
            - "DocumentationMetric.notes_attested == 1"
            - "provisional != final on identical span data (210 vs 195)"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: completeness_tiered_penalty_with_critical_cap
        grounds:
          - calculations.note_completeness_score
          - entities.NoteTemplate.fields.completeness_multiplier
        distinguishing_aspect: |
          Mode (a): >=3 inputs (missing-field penalty tiers, template multiplier,
          CRITICAL-cap branch) with non-linear interaction. Empty 3-field draft
          computes raw 100-40=60 but the CRITICAL cap forces min(60,49)=49 — the
          cap branch, not the linear penalty sum, decides the score.
        test_recipe:
          setup:
            - "Template (multiplier 1.0) with required fields: chief_complaint CRITICAL, hpi MAJOR, ros MINOR"
            - "Draft freshly created with all fields empty"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-CF1-1", full_name: "Pat Cf1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-CF1-1", full_name: "Doc Cf1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "cf1", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }, { key: "ros", importance: "MINOR", required: true }], completeness_multiplier: 1.0 }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
          trigger:
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id", draft_v: "$.data.version", score_empty: "$.data.completeness_score" }
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "palpitations" }] }
              as: Physician
              as_user_id: "${phy}"
              captures: { score_chief: "$.data.completeness_score" }
          assert:
            - "score_empty == 49 (raw 100-(25+10+5)=60, but a missing CRITICAL field caps at 49)"
            - "score_chief == 85 (missing hpi MAJOR 10 + ros MINOR 5; no CRITICAL missing so no cap)"
      - name: billing_per_line_rounding_then_sum
        grounds:
          - calculations.billing_suggestion_totals
          - entities.CodeSuggestion.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — round each line first,
          then sum. Two lines of round_half_up(1000*1*1.004)=1000 sum to 2000;
          the rejected sum-then-round order would yield round_half_up(2000.8)=2001.
        test_recipe:
          setup:
            - "Attestable draft with two BILLING suggestions, each unit 1000 qty 1 adj 1.004"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-CF2-1", full_name: "Pat Cf2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-CF2-1", full_name: "Doc Cf2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "cf2", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "PORTAL" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/code-suggestions"
              payload: { suggestions: [{ code_type: "BILLING", code_value: "B3001", confidence: 1.0, quantity: 1, unit_fee_cents: 1000, adjustment_pct: 1.004 }, { code_type: "BILLING", code_value: "B3002", confidence: 1.0, quantity: 1, unit_fee_cents: 1000, adjustment_pct: 1.004 }] }
              as: Physician
              as_user_id: "${phy}"
              captures: { s1: "$.data[0].id", s2: "$.data[1].id" }
          trigger:
            - call: "POST /ambient-clinical-documentation/code-suggestions/${s1}/confirm"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/code-suggestions/${s2}/confirm"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          assert:
            - "CodeSuggestion.${s1}.line_total_cents == 1000 and CodeSuggestion.${s2}.line_total_cents == 1000 (per-line round_half_up(1000*1.004)=1000)"
            - "NoteDraft.${draft}.billing_final_cents == 2000 (per-line-then-sum; sum-then-round would give 2001)"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: note_draft_revision_and_amendment_cycle
        grounds:
          - state_machines.NoteDraft.IN_REVIEW_to_DRAFT
          - state_machines.NoteDraft.ATTESTED_to_AMENDED
          - state_machines.NoteDraft.AMENDED_to_IN_REVIEW
        distinguishing_aspect: |
          Cyclic machine on NoteDraft: IN_REVIEW->DRAFT (regenerate) and the
          post-publication loop ATTESTED->AMENDED->IN_REVIEW->ATTESTED, with the
          second attestation recorded as attestation_type AMENDMENT.
        test_recipe:
          setup:
            - "Attestable draft (5-field template) driven through regenerate and amend cycles"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-NL1-1", full_name: "Pat Nl1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-NL1-1", full_name: "Doc Nl1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "nl1", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }, { key: "exam", importance: "MAJOR", required: true }, { key: "plan", importance: "MAJOR", required: true }, { key: "ros", importance: "MINOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id", draft_v: "$.data.version" }
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "syncope" }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/regenerate"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { st1: "$.data.status", score_regen: "$.data.completeness_score" }
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { v_pre_patch: "$.data.version" }
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${v_pre_patch}", field_updates: [{ field_key: "ros", field_value: "unremarkable" }] }
              as: Physician
              as_user_id: "${phy}"
              captures: { st2: "$.data.status" }
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/attest"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { st3: "$.data.status" }
