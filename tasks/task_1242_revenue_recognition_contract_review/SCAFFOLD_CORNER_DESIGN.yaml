  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: review_tasks_list_paginates_with_limit_offset
        claim_type: pagination_with_filtering
        grounds: ["endpoints.GET /revrec/review-tasks", response_envelope.pagination_defaults]
        distinguishing_aspect: "Filter + pagination interact: 3 tasks under one contract; limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup: ["customer; SSP WIDGET/US; contract with one POINT_IN_TIME POB and three non-standard clauses; submitted -> three ASSIGNED ReviewTasks"]
          setup_api_calls:
            - call: "POST /revrec/customers"
              payload: { legal_name: "Page Co", external_ref: "PAGE-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-PAGE", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
