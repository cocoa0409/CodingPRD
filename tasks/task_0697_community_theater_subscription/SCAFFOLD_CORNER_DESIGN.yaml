scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_season_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Season.fields.status, entities.Season.fields.loyalty_renewal_discount_pct]
        distinguishing_aspect: "POST /seasons with required fields returns 201, status=PLANNING, and loyalty_renewal_discount_pct defaults to 0.10 when omitted."
        test_recipe:
          setup: ["empty DB; logical clock at startup default"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SeasonAdmin
          trigger:
            - call: "POST /box-office/seasons"
              payload: { name: "Default Season", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
          assert:
            - "response_type == object"
            - "Season.${season_id}.status == PLANNING"
            - "Season.${season_id}.loyalty_renewal_discount_pct == 0.10"
            - "Season.${season_id}.version == 1"

      - name: create_season_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Season.fields.base_subscription_fee_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /seasons omitting base_subscription_fee_cents is rejected with ERR_VALIDATION (400) and no Season is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /box-office/seasons"
              payload: { name: "Bad Season", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z" }
              as: SeasonAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "error_id == ERR_VALIDATION"

      - name: get_performance_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Performance, "errors[ERR_PERFORMANCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /performances/{id} with a non-existent UUID returns ERR_PERFORMANCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /box-office/performances/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SeasonAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "error_id == ERR_PERFORMANCE_NOT_FOUND"

      - name: venue_total_seat_count_computed_on_seat_create
        claim_type: Computed Fields
        grounds: [entities.Venue.fields.total_seat_count, entities.Seat.fields.venue_id]
        distinguishing_aspect: "Venue.total_seat_count is server-computed: after creating two seats in a venue it reads exactly 2, regardless of any client-supplied value."
        test_recipe:
          setup: ["A venue with two seats created"]
          setup_api_calls:
            - call: "POST /box-office/venues"
              payload: { name: "Count Hall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "A", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "A", seat_number: 2, price_tier: "VALUE" }
              as: SeasonAdmin
          trigger:
            - call: "GET /box-office/venues/${venue_id}"
              payload: {}
              as: SeasonAdmin
          assert:
            - "Venue.${venue_id}.total_seat_count == 2"

      - name: seat_naming_status_defaults_unnamed
        claim_type: Defaults
        grounds: [entities.Seat.fields.naming_status, entities.Seat.fields.named_plaque_text]
        distinguishing_aspect: "A freshly created Seat has naming_status=UNNAMED and named_plaque_text null until a seat-naming donation is fulfilled."
        test_recipe:
          setup: ["A venue"]
          setup_api_calls:
            - call: "POST /box-office/venues"
              payload: { name: "Naming Hall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "B", seat_number: 1, price_tier: "PREMIUM" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
          assert:
            - "Seat.${seat_id}.naming_status == UNNAMED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: subscription_confirm_renewal_from_draft_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.RENEWAL_PENDING_to_RENEWED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm-renewal on a DRAFT subscription (not RENEWAL_PENDING) is rejected with ERR_INVALID_STATE; no successor is touched."
        test_recipe:
          setup: ["A DRAFT subscription"]
          setup_api_calls:
            - call: "POST /box-office/seasons"
              payload: { name: "SC1", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /box-office/subscriptions/${sub_id}/confirm-renewal"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "error_id == ERR_INVALID_STATE"

      - name: audition_decline_then_cast_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Audition.AUDITIONED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once an Audition is DECLINED (terminal), a subsequent cast attempt is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DECLINED audition on a production"]
          setup_api_calls:
            - call: "POST /box-office/seasons"
              payload: { name: "SC2", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Cast Show" }
              as: ArtisticDirector
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/auditions"
              payload: { production_id: "${prod_id}", applicant_name: "Alex", role_applied_for: "Lead" }
              as: ArtisticDirector
              captures: { aud_id: $.data.id }
            - call: "POST /box-office/auditions/${aud_id}/decline"
              payload: {}
              as: ArtisticDirector
          trigger:
            - call: "POST /box-office/auditions/${aud_id}/cast"
              payload: { cast_role: "Lead" }
              as: ArtisticDirector
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "error_id == ERR_INVALID_STATE"

      - name: ticket_pay_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Ticket.HELD_to_ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an already-PAID/ISSUED ticket a second time is rejected with ERR_INVALID_STATE (payment_status precondition UNPAID fails)."
        test_recipe:
          setup: ["A PAID ISSUED single ticket on an ON_SALE performance"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "SC3", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Pay Show" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "PayHall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "P", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_id}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "error_id == ERR_INVALID_STATE"

      - name: will_call_pickup_success_before_cutoff
        claim_type: Valid Transition
        grounds: [state_machines.Ticket.ISSUED_to_COLLECTED, entities.Ticket.fields.fulfillment_status]
        distinguishing_aspect: "will-call-pickup on a PAID ISSUED ticket when the clock is before (curtain - cutoff) moves fulfillment_status to COLLECTED."
        test_recipe:
          setup: ["A PAID ISSUED ticket; clock at 2026-07-01T18:00Z, well before the 19:00 cutoff"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "SC4", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "WC Show" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "WCHall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "Q", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", will_call_cutoff_minutes: 30, demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_id}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T18:00:00Z" }
              as: SeasonAdmin
          trigger:
            - call: "POST /box-office/tickets/${ticket_id}/will-call-pickup"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Ticket.${ticket_id}.fulfillment_status == COLLECTED"

      - name: exchange_deny_then_request_again_cycle
        claim_type: cyclic
        grounds: [state_machines.Exchange.REQUESTED_to_DENIED, entities.Exchange.fields.status]
        distinguishing_aspect: "An Exchange denied (REQUESTED->DENIED) is terminal for that request, but the holder may submit a new Exchange for the same ticket — the request/deny cycle is reachable by creating a second Exchange."
        test_recipe:
          setup: ["A PAID ISSUED single ticket and one DENIED exchange against it; a second free target seat exists"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "SC5", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Exch Show" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "ExchHall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "R", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat1: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "R", seat_number: 2, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat2: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat1}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/exchanges"
              payload: { original_ticket_id: "${ticket_id}", target_performance_id: "${perf_id}", target_seat_id: "${seat2}", mode: "PAID_EXCHANGE" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { exch1: $.data.id }
            - call: "POST /box-office/exchanges/${exch1}/deny"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /box-office/exchanges"
              payload: { original_ticket_id: "${ticket_id}", target_performance_id: "${perf_id}", target_seat_id: "${seat2}", mode: "PAID_EXCHANGE" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { exch2: $.data.id }
          assert:
            - "Exchange.${exch1}.status == DENIED"
            - "Exchange.${exch2}.status == REQUESTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: single_ticket_benefactor_discount_value
        claim_type: Correct Result
        grounds: [calculations.single_ticket_pricing, entities.Patron.fields.donor_level]
        distinguishing_aspect: "A BENEFACTOR buying a STANDARD seat at demand 1.0 pays floor(6000 * 1.0 * 0.80) = 4800."
        test_recipe:
          setup: ["A BENEFACTOR patron (lifetime FULFILLED 500000) buying a STANDARD single ticket at demand 1.0"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "SC6", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Ben Show" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "BenHall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "S", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/donations"
              payload: { patron_id: "${patron_id}", amount_cents: 500000 }
              as: BoxOfficeAgent
              captures: { don_id: $.data.id }
            - call: "POST /box-office/donations/${don_id}/fulfill"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_id}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          assert:
            - "Patron.${patron_id}.donor_level == BENEFACTOR"
            - "Ticket.${ticket_id}.price_cents == 4800"

      - name: exchange_flexpass_subscription_fee_zero
        claim_type: Variant Selection
        grounds: [calculations.exchange_fee, entities.Exchange.fields.mode]
        distinguishing_aspect: "A FLEX_PASS exchange on a SUBSCRIPTION-origin ticket waives the flat fee: fee_cents=0, complementing the §1.8 PAID_EXCHANGE fee=800 instance."
        test_recipe:
          setup: ["An ACTIVE subscription that issued a PAID SUBSCRIPTION ticket (STANDARD per_seat 20000) on perf1; a free STANDARD seat priced identically on perf2"]
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "SC7", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Flex Show" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "FlexHall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "T", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat1: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "T", seat_number: 2, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat2: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat1}" }
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/subscriptions/${sub_id}/activate"
              payload: { expected_season_version: "${season_v}" }
