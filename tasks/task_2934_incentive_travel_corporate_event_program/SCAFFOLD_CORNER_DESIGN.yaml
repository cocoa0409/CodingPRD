      The cyclic shape claim — a row re-enters a state it already left, and the loop is bounded by a termination counter rather than by the edge set — is exactly the negotiation cycle claim.
    excluded_because:
      difficulty_instance: supplier_contract_propose_counter_negotiation_cycle_terminates_at_five_rounds
      rationale: |-
        That §1.8 instance already plays five rounds, re-enters PROPOSED three times and asserts that the sixth round is refused with round_count frozen at 5. A second recipe would only re-run the same edges with different rate numbers.
