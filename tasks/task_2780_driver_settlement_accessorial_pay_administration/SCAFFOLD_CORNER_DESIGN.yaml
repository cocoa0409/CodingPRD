# SCAFFOLD_CORNER_DESIGN.yaml - section 1.9, the breadth probe over every testable claim of
# SCAFFOLD.yaml's 1.1-1.7 surface that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Logical clock: every chain pins it explicitly; the domain default is 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_pay_package_returns_draft_package_with_component_count_zero
        claim_type: creation
        grounds:
          - entities.PayPackage
          - endpoints[POST /driver-pay/pay-packages]
          - state_machines.PayPackage.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          A freshly created PayPackage is returned with HTTP 201, status DRAFT, version 1, component_count 0,
          has_pending_revision false and every input field echoed back; the response is the only place the
          caller learns the server-minted id, so a 200 or a missing status field is a failure.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Standard 2026", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "DAY_BASED", escrow_required: true, escrow_target_cents: 250000, escrow_monthly_deduction_cents: 40000 }
              as: PayrollAdmin
              captures: { pkg_new: $.data.id, pkg_new_v: $.data.version }
          assert:
            - "the create call returns HTTP 201"
            - "PayPackage.${pkg_new}.status == DRAFT and PayPackage.${pkg_new}.version == 1"
            - "PayPackage.${pkg_new}.name == Leased Standard 2026 and PayPackage.${pkg_new}.driver_type == LEASED_OPERATOR"
            - "PayPackage.${pkg_new}.mileage_guide == PRACTICAL and PayPackage.${pkg_new}.per_diem_method == DAY_BASED"
            - "PayPackage.${pkg_new}.escrow_required == true and PayPackage.${pkg_new}.escrow_target_cents == 250000"
            - "PayPackage.${pkg_new}.component_count == 0 and PayPackage.${pkg_new}.has_pending_revision == false"
            - "PayPackage.${pkg_new}.activated_at == null and PayPackage.${pkg_new}.retired_at == null"
            - "PayPackage.${pkg_new}.id is a bare UUID with no type prefix"
      - name: get_pay_package_by_id_returns_the_stored_row_with_component_count
        claim_type: retrieval
        grounds:
          - endpoints[GET /driver-pay/pay-packages/{id}]
          - entities.PayPackage.fields.component_count
          - endpoints[GET /driver-pay/pay-packages/{id}/components]
        distinguishing_aspect: |
          A read-back after two component writes must show component_count 2 and status ACTIVE - the value is
          recomputed from the PayComponent rows, not frozen at creation - and the sub-resource listing must
          return both components ordered by sequence with their immutable shape (no version field).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_R2 created, given a PER_MILE 58 component and a REVENUE_PERCENT 2500 bps component, then activated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Read Back", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_r2: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_r2}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_r2}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_r2}/activate"
              payload: {}
              as: PayrollAdmin
          trigger:
            - call: "GET /driver-pay/pay-packages/${pkg_r2}"
              payload: {}
              as: ComplianceAuditor
              captures: { pkg_r2_v: $.data.version }
            - call: "GET /driver-pay/pay-packages/${pkg_r2}/components"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "the read returns HTTP 200"
            - "PayPackage.${pkg_r2}.status == ACTIVE and PayPackage.${pkg_r2}.component_count == 2"
            - "PayPackage.${pkg_r2}.activated_at == 2026-08-01T00:00:00.000Z"
            - "the components listing returns exactly 2 rows ordered by sequence 1 then 2"
            - "the sequence 1 row has component_type PER_MILE, unit MILE and rate_value 58"
            - "the sequence 2 row has component_type REVENUE_PERCENT, unit PERCENT_BPS and rate_value 2500"
            - "each component row carries pay_package_id == ${pkg_r2}"
      - name: list_drivers_filtered_by_escrow_status_excludes_not_required_drivers
        claim_type: listing
        grounds:
          - endpoints[GET /driver-pay/drivers]
          - entities.Driver.fields.escrow_status
          - state_machines.Driver.NOT_REQUIRED_to_COLLECTING
        distinguishing_aspect: |
          The escrow_status filter must partition the two drivers: the one assigned an escrow_required package
          is COLLECTING and appears, the one assigned a non-escrow package stays NOT_REQUIRED and must be
          absent - an unfiltered handler that returns both rows fails.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_LST assigned an escrow_required package, so escrow_status is COLLECTING"
            - "driver DRV_LS2 assigned a package with escrow_required false, so escrow_status stays NOT_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Listing Probe", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: true, escrow_target_cents: 250000, escrow_monthly_deduction_cents: 40000 }
              as: PayrollAdmin
              captures: { pkg_lst: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_lst}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_lst}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_lst}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Lena Lister", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_lst: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_lst}/assign-pay-package"
              payload: { pay_package_id: "${pkg_lst}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_lst}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Listing Control", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_ls2: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_ls2}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_ls2}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_ls2}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Nils Nolist", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_ls2: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_ls2}/assign-pay-package"
              payload: { pay_package_id: "${pkg_ls2}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_ls2}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
          trigger:
            - call: "GET /driver-pay/drivers"
              payload: { escrow_status: "COLLECTING" }
              as: ComplianceAuditor
          assert:
            - "the listing returns HTTP 200"
            - "the listing contains exactly 1 row and its id == ${drv_lst}"
            - "the listing does not contain ${drv_ls2}"
            - "Driver.${drv_lst}.escrow_status == COLLECTING and Driver.${drv_lst}.escrow_target_cents == 250000"
            - "Driver.${drv_ls2}.escrow_status == NOT_REQUIRED and Driver.${drv_ls2}.escrow_target_cents == 0"
      - name: get_driver_with_unknown_uuid_returns_driver_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_DRIVER_NOT_FOUND]
          - endpoints[GET /driver-pay/drivers/{id}]
        distinguishing_aspect: |
          A syntactically valid UUID that names no Driver must produce ERR_DRIVER_NOT_FOUND with HTTP 404 and
          the standard error envelope - not an empty 200 body, not a 422, and not a 500.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no Driver rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "GET /driver-pay/drivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAuditor
              captures: { err_nf: $.data.error_id }
          assert:
            - "the read returns HTTP 404 with error_id ERR_DRIVER_NOT_FOUND"
            - "the response body carries the error envelope fields error_id and message"
            - "no Driver row is created as a side effect of the failed read"
      - name: create_load_without_hhg_miles_returns_missing_required_field
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_MISSING_REQUIRED_FIELD]
          - endpoints[POST /driver-pay/loads]
        distinguishing_aspect: |
          hhg_miles has source input with no default, so omitting it must fail at priority 4 with HTTP 422 even
          though every other field is valid and the driver is ACTIVE; supplying it then succeeds, which proves
          the rejection came from the missing field and not from the surrounding state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_REQ ACTIVE on an ACTIVE package"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Required Fields", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_req: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_req}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_req}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_req}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Rita Required", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_req: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_req}/assign-pay-package"
              payload: { pay_package_id: "${pkg_req}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_req}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_req}", linehaul_revenue_cents: 180000, practical_miles: 780 }
              as: SettlementClerk
              captures: { err_req: $.data.error_id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_req}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742 }
              as: SettlementClerk
              captures: { load_req: $.data.id }
          assert:
            - "the first create returns HTTP 422 with error_id ERR_MISSING_REQUIRED_FIELD"
            - "no Load row exists after the first attempt"
            - "the second create returns HTTP 201 and Load.${load_req}.hhg_miles == 742"
            - "Load.${load_req}.movement_status == TENDERED and Load.${load_req}.pay_status == UNPAID"
      - name: create_load_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Load.fields.stop_count
          - entities.Load.fields.hours_worked_minutes
          - entities.Load.fields.tarp_required
          - endpoints[POST /driver-pay/loads]
        distinguishing_aspect: |
          stop_count defaults to 1, hours_worked_minutes to 0 and tarp_required to false. The defaults must be
          materialised on the row, not left null, because accessorial_pay reads Load.stop_count for STOP_OFF
          units and a null there would make a later STOP_OFF claim uncomputable.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_DEF ACTIVE on an ACTIVE package"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Defaults", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_def: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_def}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_def}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_def}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Dana Default", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_def: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_def}/assign-pay-package"
              payload: { pay_package_id: "${pkg_def}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_def}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_def}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742 }
              as: SettlementClerk
              captures: { load_def: $.data.id }
          assert:
            - "the create returns HTTP 201"
            - "Load.${load_def}.stop_count == 1"
            - "Load.${load_def}.hours_worked_minutes == 0"
            - "Load.${load_def}.tarp_required == false"
            - "Load.${load_def}.dispatched_at == null and Load.${load_def}.delivered_at == null"
            - "Load.${load_def}.settlement_id == null and Load.${load_def}.pay_package_id_snapshot == null"
      - name: the_pay_fields_of_a_load_stay_null_until_delivery_computes_them
        claim_type: computed_fields
        grounds:
          - entities.Load.fields.paid_miles
          - entities.Load.fields.linehaul_pay_cents
          - endpoints[POST /driver-pay/loads]
          - calculations.paid_miles_determination
          - calculations.linehaul_component_pay
        distinguishing_aspect: |
          paid_miles and linehaul_pay_cents have source computed and the create input declares neither, so there
          is no client path to them at all: they must read null while the load is TENDERED, still null after
          dispatch has merely pinned the package snapshot, and only materialise at deliver as 780 and 46080 from
          the practical guide and the snapshotted PER_MILE band. A handler that seeds them at creation, or that
          computes them at dispatch, is observably wrong at the two earlier checkpoints.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_CMP ACTIVE on a PRACTICAL package with PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "load LOAD_CMP created with practical 780 / hhg 742 and still TENDERED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Computed Fields", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_cmp: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_cmp}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_cmp}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_cmp}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Cody Computed", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_cmp: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_cmp}/assign-pay-package"
              payload: { pay_package_id: "${pkg_cmp}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_cmp}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_cmp}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1, tarp_required: false }
              as: SettlementClerk
              captures: { load_cmp: $.data.id }
          trigger:
            - call: "GET /driver-pay/loads/${load_cmp}"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_cmp}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "GET /driver-pay/loads/${load_cmp}"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_cmp}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "GET /driver-pay/loads/${load_cmp}"
              payload: {}
              as: SettlementClerk
          assert:
            - "immediately after creation Load.${load_cmp}.paid_miles == null and Load.${load_cmp}.linehaul_pay_cents == null"
            - "at creation applied_mileage_guide, base_guide_miles, short_haul_floor_applied and linehaul_line_type are all null too"
            - "after dispatch paid_miles and linehaul_pay_cents are STILL null, while pay_package_id_snapshot == ${pkg_cmp} is already pinned"
            - "after delivery Load.${load_cmp}.paid_miles == 780 and Load.${load_cmp}.base_guide_miles == 780"
            - "after delivery Load.${load_cmp}.applied_mileage_guide == PRACTICAL and Load.${load_cmp}.short_haul_floor_applied == false"
            - "after delivery Load.${load_cmp}.linehaul_pay_cents == 46080 and Load.${load_cmp}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${load_cmp}.pay_status == ACCRUED and Load.${load_cmp}.movement_status == DELIVERED"
      - name: pay_package_system_fields_are_server_initialised_and_only_move_by_transition
        claim_type: system_fields
        grounds:
          - entities.PayPackage.fields.status
          - entities.PayPackage.fields.supersedes_pay_package_id
          - endpoints[POST /driver-pay/pay-packages]
          - endpoints[POST /driver-pay/pay-packages/{id}/activate]
        distinguishing_aspect: |
          status, supersedes_pay_package_id, has_pending_revision and version are all source system and the
          create input declares none of them, so a caller has no way to hand itself an ACTIVE package: the row
          must come back DRAFT with a null supersedes, has_pending_revision false and activated_at null, and the
          only route to ACTIVE is /activate - which is also the only thing that may stamp activated_at and move
          version. This is what makes the activation gate, and therefore the component-legality checks it runs,
          unskippable.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Owner Op Baseline", driver_type: "OWNER_OPERATOR", mileage_guide: "HHG", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_sys: $.data.id, pkg_sys_v: $.data.version }
            - call: "POST /driver-pay/pay-packages/${pkg_sys}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 7000, sequence: 1 }
              as: PayrollAdmin
            - call: "GET /driver-pay/pay-packages/${pkg_sys}"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_sys}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "GET /driver-pay/pay-packages/${pkg_sys}"
              payload: {}
              as: PayrollAdmin
          assert:
            - "the create returns HTTP 201 with PayPackage.${pkg_sys}.status == DRAFT and not ACTIVE"
            - "PayPackage.${pkg_sys}.has_pending_revision == false and supersedes_pay_package_id == null at creation"
            - "PayPackage.${pkg_sys}.activated_at == null and retired_at == null at creation"
            - "PayPackage.${pkg_sys}.version is non-null at creation and is captured as ${pkg_sys_v}"
            - "the create response carries id, created_at and updated_at, none of which the caller supplied"
            - "adding the component leaves status DRAFT and only moves component_count to 1"
            - "after /activate PayPackage.${pkg_sys}.status == ACTIVE with activated_at == 2026-08-01T00:00:00.000Z"
            - "after /activate PayPackage.${pkg_sys}.version is greater than ${pkg_sys_v}"
      - name: create_pay_package_with_undeclared_driver_type_returns_invalid_field_value
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_FIELD_VALUE]
          - entities.PayPackage.fields.driver_type
        distinguishing_aspect: |
          driver_type is an enum over {COMPANY_SOLO, COMPANY_TEAM, OWNER_OPERATOR, LEASED_OPERATOR}, so
          OWNER_OPERATOR_LITE must fail at priority 5 with HTTP 422; a negative escrow_target_cents fails the
          same check because magnitude fields must be non-negative integers.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
