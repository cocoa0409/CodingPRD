        distinguishing_aspect: "Conditional cascade on event category: confirming a CUSTOMER_CAUSED 4-day event shifts committed_delivery_date to 2026-09-05; confirming a CENTER_CAUSED 6-day event shifts nothing."
        test_recipe:
          setup: ["program QUOTED; two REPORTED delay events (CUSTOMER_CAUSED 4d, CENTER_CAUSED 6d)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
