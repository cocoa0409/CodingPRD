          unconditionally strict.
        test_recipe:
          setup:
            - "A SUBMITTED promotion with a TPR line (8000 cases at 1.250) and a DISPLAY line (2000 units, 3000.00 fee) under a 50000.00 / 20000-unit allocation, plus a VERIFIED COMMITMENT document covering DISPLAY. A sibling promotion has already committed 10000 units."
