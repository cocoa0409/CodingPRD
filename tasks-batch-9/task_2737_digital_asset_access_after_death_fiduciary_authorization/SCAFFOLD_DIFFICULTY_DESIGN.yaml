            - "the COUNTERSIGN by ${fid1_id} (the electing fiduciary) returns HTTP 409 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "the COUNTERSIGN by ${fid2_id} succeeds: DispositionElection.${el_del_id}.status == DRAFT and countersigned_by_fiduciary_id == ${fid2_id}"
            - "after SUBMIT: DispositionElection.${el_del_id}.status == SUBMITTED and DigitalAsset.${a_del_id}.disposition_status == ELECTED"
            - "after EXECUTE: DispositionElection.${el_del_id}.status == EXECUTED and DigitalAsset.${a_del_id}.disposition_status == PURGED"
            - "DigitalAsset.${a_del_id}.account_handle == vault-drafts (retained for audit after the purge)"
            - "the REVERSE of ${el_del_id} returns HTTP 409 with error_id ERR_INVALID_ELECTION_STATE"
            - "DigitalAsset.${a_del_id}.disposition_status is still PURGED after the refused REVERSE"
            - "DispositionElection.${el_mem_id}.status == DRAFT (the MEMORIALIZE election never needed a countersignature)"
            - "a SUBMIT of ${el_mem_id} straight from DRAFT succeeds without any countersignature"

      - name: estate_phase_walks_back_from_wind_down_to_disclosure_then_pins_at_closed
        grounds:
          - state_machines.Estate.transitions[DISCLOSURE->WIND_DOWN]
          - state_machines.Estate.transitions[WIND_DOWN->DISCLOSURE]
          - state_machines.Estate.transitions[WIND_DOWN->CLOSED]
          - calculations.estate_administration_phase
          - validations[priority=28]
        distinguishing_aspect: |
          The compound Estate phase is not monotone: one MEMORIALIZE execution drives it
          DISCLOSURE -> WIND_DOWN, the REVERSE of that same election drives it back
          WIND_DOWN -> DISCLOSURE with assets_disposed_count returning to 0, and a re-execution
          drives it forward again — and once POST /estates/{estate_id}/close pins it at CLOSED the
          derivation is suppressed for good, so a later write is refused with ERR_ESTATE_CLOSED
          instead of re-deriving the phase.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one platform CloudVault supporting memorialization"
            - "one estate with a single CLOUD_STORAGE asset, VERIFIED death certificate and VERIFIED letters"
            - "the asset is CATALOG_DISCLOSED by an APPROVED CATALOG_ACCESS request, so the phase has reached DISCLOSURE"
