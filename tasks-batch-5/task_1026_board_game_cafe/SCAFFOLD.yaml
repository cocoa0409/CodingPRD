scenario: |
  1026. Board-Game Café & Game Library: table/time & cover, game-library checkout &
  condition, food-beverage & minimum, event/tournament & league, membership & loyalty,
  retail/pre-order, party/private, reservation. A board-game café books tables for time
  windows (charging table time + per-head cover), seats reserved and walk-in parties,
  lends physical game copies from a lending library (tracking condition and damage/loss
  fees), takes food & beverage orders against a per-table minimum spend, runs
  tournaments/leagues with registration and check-in, manages loyalty memberships with
  tiered discounts and point redemption, sells and pre-orders retail games, and holds
  private rooms for parties. Billing reconciles a provisional running tab against a
  final bill at checkout; loyalty tiers, no-show penalties, capacity limits, temporal
  overlap on tables and rooms, and optimistic concurrency on room holds are all in scope.

domain_name: board-game-cafe
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities linked by foreign keys carried in request bodies; URL paths are
  # top-level collections (/reservations, /checkouts, ...) rather than nested trees.
  state_machine_shape: parallel
  # This scaffold blends non-linear shapes: Reservation is branching fork (SEATED |
  # CANCELLED | NO_SHOW) with divergent side effects; GameCopy carries two independent
  # parallel dimensions (status x condition); Membership and Registration are cyclic
  # (ACTIVE<->SUSPENDED, REGISTERED<->WITHDRAWN).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  # Manager is a superset operator over Staff's operational surface; Member is an
  # entity-backed self-service actor confined to its own resources.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Table
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. 'T1'" }
      - { name: zone, type: enum, source: input, description: "MAIN | QUIET | PATIO", default: MAIN, constraints: "one of MAIN, QUIET, PATIO" }
      - { name: seats, type: integer, source: input, description: "Seating capacity; party_size must not exceed this", constraints: ">= 1" }
      - { name: half_hour_rate_cents, type: integer, source: input, description: "Charge per started 30-minute block of table time", constraints: ">= 0" }
      - { name: day_pass_cents, type: integer, source: input, description: "Cap on time_charge for a single session (max time charge)", constraints: ">= 0" }
      - { name: cover_fee_cents, type: integer, source: input, description: "Per-head cover charge multiplied by party_size", constraints: ">= 0" }
      - { name: min_spend_cents, type: integer, source: input, description: "Required food & beverage minimum for a session on this table", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: AVAILABLE, constraints: "one of AVAILABLE, OUT_OF_SERVICE" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email (unique)", constraints: "unique across memberships" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD derived from lifetime_points thresholds", constraints: "one of BRONZE, SILVER, GOLD" }
      - { name: points_balance, type: integer, source: computed, description: "Spendable loyalty points; never negative" }
      - { name: lifetime_points, type: integer, source: computed, description: "Cumulative earned/granted points; drives tier; never decreases on redemption" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of reservation no-shows charged to this member" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CANCELLED", default: ACTIVE, constraints: "one of ACTIVE, SUSPENDED, CANCELLED" }
      - { name: last_redemption_id, type: string, source: system, description: "Id of the most recent redemption applied to this membership; null until first redemption" }
      - { name: last_redemption_points, type: integer, source: system, description: "Point cost of the most recent redemption; 0 until first redemption" }
      - { name: last_redemption_status, type: enum, source: system, description: "APPLIED | REVERSED | NONE for the most recent redemption", default: NONE, constraints: "one of APPLIED, REVERSED, NONE" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: table_id, type: string, source: input, description: "FK -> Table.id; table this reservation/visit occupies" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning member, null for a non-member walk-in" }
      - { name: party_size, type: integer, source: input, description: "Number of guests; must not exceed Table.seats", constraints: ">= 1" }
      - { name: start_at, type: datetime, source: input, description: "Reserved window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Reserved window end (ISO 8601 UTC); must be after start_at" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit held for the booking; forfeited on no-show", default: 0, constraints: ">= 0" }
      - { name: deposit_forfeited, type: boolean, source: computed, description: "True once a no-show forfeits the deposit", default: false }
      - { name: status, type: enum, source: system, description: "BOOKED | SEATED | COMPLETED | CANCELLED | NO_SHOW", default: BOOKED, constraints: "one of BOOKED, SEATED, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: seated_at, type: datetime, source: system, description: "Logical-clock timestamp when party was seated; null until SEATED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when bill was finalized; null until COMPLETED" }
      - { name: tier_at_seating, type: enum, source: system, description: "Membership.tier snapshot captured at SEAT; drives member discount; null for walk-in", constraints: "one of BRONZE, SILVER, GOLD" }
      - { name: time_charge_cents, type: integer, source: computed, description: "Final table-time charge, computed at close over seated_at..closed_at" }
      - { name: cover_charge_cents, type: integer, source: computed, description: "party_size * Table.cover_fee_cents, computed at close" }
      - { name: member_discount_cents, type: integer, source: computed, description: "Discount applied to gaming subtotal per tier_at_seating, computed at close" }
      - { name: fnb_subtotal_cents, type: integer, source: computed, description: "Sum of non-VOID FnbOrder.total_cents on this reservation, computed at close" }
      - { name: minimum_shortfall_cents, type: integer, source: computed, description: "max(0, Table.min_spend_cents - fnb_subtotal_cents), computed at close" }
      - { name: bill_total_cents, type: integer, source: computed, description: "Final bill; 0 until COMPLETED" }
      - { name: provisional_bill_total_cents, type: integer, source: computed, description: "Running estimate while SEATED, evaluated on read against the current logical clock; 0 unless SEATED" }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points earned at close; 0 until COMPLETED" }

  - name: FnbOrder
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the session this order is charged to" }
      - { name: description, type: string, source: input, description: "Free-text line description, e.g. 'Nachos + 2 sodas'" }
      - { name: total_cents, type: integer, source: input, description: "Line total in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | VOID; non-VOID orders count toward the bill and the F&B minimum", default: OPEN, constraints: "one of OPEN, VOID" }

  - name: GameCopy
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Game title, e.g. 'Catan'" }
      - { name: barcode, type: string, source: input, description: "Library barcode (unique)", constraints: "unique across game copies" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full replacement value charged on loss", constraints: ">= 0" }
      - { name: condition, type: enum, source: system, description: "MINT | GOOD | WORN | DAMAGED | LOST (ordinal 0..4); parallel dimension, evolves independently of status", default: GOOD, constraints: "one of MINT, GOOD, WORN, DAMAGED, LOST" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | RETIRED; parallel dimension, evolves independently of condition", default: AVAILABLE, constraints: "one of AVAILABLE, CHECKED_OUT, RETIRED" }

  - name: Checkout
    parent: null
    common_fields: true
    fields:
      - { name: game_copy_id, type: string, source: input, description: "FK -> GameCopy.id; the physical copy lent" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the seated session that borrowed the copy" }
      - { name: checkout_condition, type: enum, source: system, description: "GameCopy.condition snapshot at checkout (ordinal baseline for the return fee)", constraints: "one of MINT, GOOD, WORN, DAMAGED" }
      - { name: return_condition, type: enum, source: system, description: "Condition reported on return; null until returned", constraints: "one of MINT, GOOD, WORN, DAMAGED" }
      - { name: condition_fee_cents, type: integer, source: computed, description: "Damage/loss fee computed on return or loss report" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETURNED | LOST", default: ACTIVE, constraints: "one of ACTIVE, RETURNED, LOST" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock timestamp at checkout" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp at return; null until returned" }

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: game_title, type: string, source: input, description: "Game played" }
      - { name: format, type: enum, source: input, description: "SINGLE_ELIM | LEAGUE | CASUAL", constraints: "one of SINGLE_ELIM, LEAGUE, CASUAL" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of active registrations", constraints: ">= 1" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Per-entry fee funding the prize pool", constraints: ">= 0" }
      - { name: start_at, type: datetime, source: input, description: "Scheduled start (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | RUNNING | COMPLETED | CANCELLED", default: SCHEDULED, constraints: "one of SCHEDULED, OPEN, RUNNING, COMPLETED, CANCELLED" }
      - { name: registered_count, type: integer, source: computed, description: "Count of registrations in status REGISTERED or CHECKED_IN" }
      - { name: checked_in_count, type: integer, source: computed, description: "Count of registrations in status CHECKED_IN" }
      - { name: house_cut_cents, type: integer, source: computed, description: "House rake withheld from gross entry fees at start" }
      - { name: provisional_prize_pool_cents, type: integer, source: computed, description: "Estimated pool from REGISTERED+CHECKED_IN entries, evaluated on read while OPEN" }
      - { name: prize_pool_cents, type: integer, source: computed, description: "Final pool from CHECKED_IN entries, frozen at RUNNING; 0 before start" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the registering member" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CHECKED_IN | WITHDRAWN | REFUNDED", default: REGISTERED, constraints: "one of REGISTERED, CHECKED_IN, WITHDRAWN, REFUNDED" }
      - { name: fee_paid_cents, type: integer, source: system, description: "Entry fee captured at registration (Tournament.entry_fee_cents snapshot)" }
      - { name: refunded_cents, type: integer, source: computed, description: "Amount refunded on withdrawal/cancellation; 0 otherwise" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Private room name" }
      - { name: capacity, type: integer, source: input, description: "Maximum headcount", constraints: ">= 1" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Charge per started 60-minute block of room time", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: AVAILABLE, constraints: "one of AVAILABLE, OUT_OF_SERVICE" }

  - name: PrivateBooking
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the held room" }
      - { name: start_at, type: datetime, source: input, description: "Booking window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Booking window end (ISO 8601 UTC); must be after start_at" }
      - { name: headcount, type: integer, source: input, description: "Expected guests; must not exceed Room.capacity at confirm", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | SUPERSEDED | CANCELLED | COMPLETED", default: HELD, constraints: "one of HELD, CONFIRMED, SUPERSEDED, CANCELLED, COMPLETED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Quoted room + catering + service fee, computed at create" }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit = round_half_up(quoted_total_cents * DEPOSIT_PCT), computed at create" }

  - name: RetailOrder
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; purchasing member, null for a walk-in sale" }
      - { name: product_title, type: string, source: input, description: "Retail product name" }
      - { name: fulfillment_type, type: enum, source: input, description: "IN_STOCK (retail sale) | PREORDER (awaiting stock)", constraints: "one of IN_STOCK, PREORDER" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit", constraints: ">= 0" }
      - { name: total_cents, type: integer, source: computed, description: "quantity * unit_price_cents, computed at create" }
      - { name: status, type: enum, source: system, description: "AWAITING_STOCK | READY | FULFILLED | CANCELLED", default: READY, constraints: "one of AWAITING_STOCK, READY, FULFILLED, CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Branching fork from BOOKED: SEAT, CANCEL, and NO_SHOW carry divergent side-effect sets."
    transitions:
      - from: BOOKED
        to: SEATED
        trigger: "POST /reservations/{id}/seat"
        actor: Staff
        preconditions:
          - "Reservation.status == BOOKED"
          - "Table.status == AVAILABLE (cross-entity: the referenced Table)"
          - "party_size <= Table.seats"
        side_effects:
          - "Set seated_at = current logical clock"
          - "Snapshot tier_at_seating = Membership.tier (null if no membership_id)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "Staff or Member (owner)"
        preconditions:
          - "Reservation.status == BOOKED"
          - "current logical clock <= start_at - CANCEL_CUTOFF_MINUTES (= 120 minutes) (else ERR_CANCEL_TOO_LATE)"
        side_effects:
          - "deposit_forfeited stays false; deposit is released (not charged)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/no-show"
        actor: Staff
        preconditions:
          - "Reservation.status == BOOKED"
          - "current logical clock >= start_at"
        side_effects:
          - "Set deposit_forfeited = true (deposit is forfeited)"
          - "CASCADE hop 1: if membership_id present, Membership.no_show_strikes += 1"
          - "CASCADE hop 2: if that increment makes Membership.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD (= 3), Membership.status -> SUSPENDED"
      - from: SEATED
        to: COMPLETED
        trigger: "POST /reservations/{id}/close"
        actor: Staff
        preconditions:
          - "Reservation.status == SEATED"
          - "No Checkout with status ACTIVE references this reservation (else ERR_SESSION_HAS_OPEN_CHECKOUTS)"
        side_effects:
          - "Set closed_at = current logical clock"
          - "Compute time_charge_cents, cover_charge_cents, member_discount_cents, fnb_subtotal_cents, minimum_shortfall_cents, bill_total_cents (calc session_bill_total, final variant)"
          - "Compute points_earned (calc loyalty_points_earned)"
          - "CASCADE hop 1: if membership_id present, Membership.lifetime_points += points_earned and Membership.points_balance += points_earned"
          - "CASCADE hop 2: Membership.tier recomputed from new lifetime_points (calc membership_tier)"

  - entity: GameCopy
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Two parallel dimensions on one row: status (AVAILABLE|CHECKED_OUT|RETIRED) and condition (MINT..LOST) advance independently."
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "POST /checkouts (creates a Checkout for this copy)"
        actor: Staff
        preconditions:
          - "GameCopy.status == AVAILABLE"
          - "GameCopy.condition in {MINT, GOOD, WORN} (DAMAGED/LOST copies are not lendable)"
          - "Referenced Reservation.status == SEATED (cross-entity: a game may only be lent to a seated session; else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CHECKED_OUT (condition dimension unchanged)"
      - from: CHECKED_OUT
        to: AVAILABLE
        trigger: "POST /checkouts/{id}/return"
        actor: Staff
        preconditions:
          - "GameCopy.status == CHECKED_OUT"
        side_effects:
          - "status -> AVAILABLE"
          - "condition dimension updated to the reported return_condition (may differ from checkout_condition)"
      - from: [AVAILABLE, CHECKED_OUT]
        to: RETIRED
        trigger: "PATCH /game-copies/{id} with status=RETIRED, or POST /checkouts/{id}/report-lost"
        actor: "Manager, or system on loss report"
        preconditions:
          - "For manual retire: GameCopy.status != RETIRED"
        side_effects:
          - "status -> RETIRED"
          - "On loss report: condition dimension set to LOST"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Cyclic ACTIVE<->SUSPENDED (suspension via no-show cascade or manual, reinstated manually)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /memberships/{id} status=SUSPENDED, or system (no-show strike cascade)"
        actor: "Manager or system"
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "Suspended members cannot redeem points or register for tournaments"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /memberships/{id} status=ACTIVE"
        actor: Manager
        preconditions:
          - "Membership.status == SUSPENDED"
        side_effects:
          - "no_show_strikes reset to 0 on reinstatement"
      - from: [ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "PATCH /memberships/{id} status=CANCELLED"
        actor: Manager
        preconditions: []
        side_effects:
          - "Terminal; membership no longer usable"

  - entity: Tournament
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching: from OPEN either START (to RUNNING) or CANCEL, with divergent side effects (freeze pool vs refund all)."
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /tournaments/{id}/open"
        actor: Manager
        preconditions:
          - "Tournament.status == SCHEDULED"
        side_effects:
          - "Registrations accepted while OPEN"
      - from: OPEN
        to: RUNNING
        trigger: "POST /tournaments/{id}/start"
        actor: Manager
        preconditions:
          - "Tournament.status == OPEN"
        side_effects:
          - "Freeze prize_pool_cents from CHECKED_IN registrations (calc tournament_prize_pool, final variant)"
          - "Compute house_cut_cents"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /tournaments/{id}/cancel"
        actor: Manager
        preconditions:
          - "Tournament.status in {SCHEDULED, OPEN}"
        side_effects:
          - "All REGISTERED and CHECKED_IN registrations -> REFUNDED with refunded_cents = fee_paid_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tournaments/{id}/cancel"
        actor: Manager
        preconditions:
          - "Tournament.status in {SCHEDULED, OPEN}"
        side_effects:
          - "No registrations to refund"
      - from: RUNNING
        to: COMPLETED
        trigger: "system (out of scope for v1 endpoints; declared for completeness)"
        actor: system
        preconditions:
          - "Tournament.status == RUNNING"
        side_effects: []

  - entity: Registration
    initial_state: REGISTERED
    terminal_states: [REFUNDED]
    note: "Cyclic REGISTERED<->WITHDRAWN: a member may withdraw and re-register while the tournament is OPEN."
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /registrations/{id}/check-in"
        actor: Staff
        preconditions:
          - "Registration.status == REGISTERED"
          - "Tournament.status == OPEN (cross-entity: the referenced Tournament; check-in happens during OPEN, before START freezes the pool)"
        side_effects:
          - "Tournament.checked_in_count re-derived"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: "Member (owner) or Staff"
        preconditions:
          - "Registration.status == REGISTERED"
          - "Tournament.status in {OPEN, SCHEDULED}"
        side_effects:
          - "refunded_cents = fee_paid_cents; Tournament.registered_count re-derived"
      - from: WITHDRAWN
        to: REGISTERED
        trigger: "POST /registrations/{id}/... (re-register via new POST /registrations reusing the pair while OPEN)"
        actor: "Member (owner) or Staff"
        preconditions:
          - "Tournament.status == OPEN"
          - "Tournament not full"
        note: "Modeled as a fresh POST /registrations for the same (tournament, member) pair; the withdrawn row stays WITHDRAWN, a new REGISTERED row is created."
        side_effects:
          - "Tournament.registered_count re-derived"

  - entity: PrivateBooking
    initial_state: HELD
    terminal_states: [SUPERSEDED, CANCELLED, COMPLETED]
    note: "A room holds at most one active tentative HELD booking; a new hold supersedes the prior one (see concurrency_rules)."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /private-bookings/{id}/confirm"
        actor: Staff
        preconditions:
          - "PrivateBooking.status == HELD"
          - "headcount <= Room.capacity (cross-entity: the referenced Room)"
        side_effects:
          - "Booking becomes firm; participates in room overlap checks against future holds"
      - from: HELD
        to: SUPERSEDED
        trigger: "system (a newer HELD booking is created on the same room)"
        actor: system
        preconditions: []
        side_effects:
          - "Released without charge"
      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /private-bookings/{id}/cancel"
        actor: Staff
        preconditions:
          - "PrivateBooking.status in {HELD, CONFIRMED}"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (out of scope for v1 endpoints; declared for completeness)"
        actor: system
        preconditions:
          - "PrivateBooking.status == CONFIRMED"
        side_effects: []

  - entity: Checkout
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    note: "Linear lend lifecycle; drives the GameCopy status dimension and the availability-conservation invariant."
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /checkouts/{id}/return"
        actor: Staff
        preconditions:
          - "Checkout.status == ACTIVE"
        side_effects:
          - "Set returned_at; compute condition_fee_cents (calc condition_fee)"
          - "GameCopy.status -> AVAILABLE; GameCopy.condition -> return_condition"
      - from: ACTIVE
        to: LOST
        trigger: "POST /checkouts/{id}/report-lost"
        actor: Staff
        preconditions:
          - "Checkout.status == ACTIVE"
        side_effects:
          - "condition_fee_cents = GameCopy.replacement_value_cents (calc condition_fee, LOST branch)"
          - "GameCopy.condition -> LOST; GameCopy.status -> RETIRED"

  - entity: RetailOrder
    initial_state: READY
    terminal_states: [FULFILLED, CANCELLED]
    note: "PREORDER orders start AWAITING_STOCK; IN_STOCK orders start READY."
    transitions:
      - from: AWAITING_STOCK
        to: READY
        trigger: "POST /retail-orders/{id}/fulfill is rejected while AWAITING_STOCK; stock arrival modeled via PATCH not in v1 — see note"
        actor: system
        preconditions:
          - "RetailOrder.status == AWAITING_STOCK"
        note: "Pre-orders become READY via the same fulfill endpoint which first flips AWAITING_STOCK->READY then READY->FULFILLED in one call when stock_ready=true."
        side_effects: []
      - from: READY
        to: FULFILLED
        trigger: "POST /retail-orders/{id}/fulfill"
        actor: Staff
        preconditions:
          - "RetailOrder.status in {READY, AWAITING_STOCK}"
        side_effects:
          - "Order handed to customer"
      - from: [READY, AWAITING_STOCK]
        to: CANCELLED
        trigger: "POST /retail-orders/{id}/cancel"
        actor: "Staff or Member (owner)"
        preconditions:
          - "RetailOrder.status in {READY, AWAITING_STOCK}"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: private-booking-hold-supersede-stale-room
    parent_entity: Room
    write_endpoint: "POST /private-bookings"
    occ_field: "expected_room_version"
    description: |
      Creating a PrivateBooking hold against a Room whose version has advanced since
      the client last observed it is rejected. A new hold legitimately supersedes any
      prior HELD booking on the same room (the prior hold moves to SUPERSEDED), so a
      create that carries a stale expected_room_version encodes a client whose view of
      the room was invalidated by an earlier hold that already superseded state. The
      loser is rejected on the stale version rather than on any state field, because a
      fresh-version create would itself succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_time_charge
    trigger: "read of a SEATED Reservation (provisional) and POST /reservations/{id}/close (final)"
    algorithm: threshold
    formula: |
      duration_minutes = (end_instant - seated_at) in whole minutes
        - final variant:       end_instant = closed_at
        - provisional variant: end_instant = current logical clock (evaluated on read)
      blocks = ceil(duration_minutes / TIME_BLOCK_MINUTES)   # a started block counts fully
      time_charge_cents = min(blocks * Table.half_hour_rate_cents, Table.day_pass_cents)
    input_set: "The single Reservation and its Table; no other entities."
    constants:
      TIME_BLOCK_MINUTES: 30
    precision: "integer cents; ceil on blocks, min() cap"
    variants:
      - name: provisional
        when: "Reservation.status == SEATED, on read"
        difference: "elapsed measured to the current logical clock; surfaced as provisional_bill_total_cents"
      - name: final
        when: "at POST /reservations/{id}/close"
        difference: "elapsed measured to closed_at; surfaced as time_charge_cents and folded into bill_total_cents"

  - name: session_bill_total
    trigger: "POST /reservations/{id}/close (final); read of a SEATED Reservation (provisional_bill_total_cents)"
    algorithm: aggregation
    formula: |
      time_charge_cents = session_time_charge (variant per context)
      cover_charge_cents = party_size * Table.cover_fee_cents
      gaming_subtotal_cents = time_charge_cents + cover_charge_cents
      discount_pct = { BRONZE:0.00, SILVER:0.10, GOLD:0.20 }[tier_at_seating or BRONZE]
      member_discount_cents = round_half_up(gaming_subtotal_cents * discount_pct)
      discounted_gaming_cents = gaming_subtotal_cents - member_discount_cents
      fnb_subtotal_cents = sum(FnbOrder.total_cents for orders on this reservation with status != VOID)
      minimum_shortfall_cents = max(0, Table.min_spend_cents - fnb_subtotal_cents)
      bill_total_cents = discounted_gaming_cents + fnb_subtotal_cents + minimum_shortfall_cents
      # Evaluation order is pinned: discount is keyed on tier_at_seating (a SEAT-time
      # snapshot), NOT on any tier change caused by this session's own accrual, so the
      # discount->accrual dependency is acyclic.
    input_set: "The Reservation, its Table, and its non-VOID FnbOrders; discount uses tier_at_seating snapshot."
    constants:
      DISCOUNT_BRONZE: 0.00
      DISCOUNT_SILVER: 0.10
      DISCOUNT_GOLD: 0.20
    precision: "integer cents; round_half_up on the percentage discount; max()/sum() exact"

  - name: loyalty_points_earned
    trigger: "POST /reservations/{id}/close"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: floor each contributing F&B line to whole points,
      # THEN sum. (Contrast: floor(sum_of_lines / 100), which can differ by up to
      # (#lines - 1) points.) Gaming charges do not earn points; only F&B does.
      points_earned = sum( floor(order.total_cents / POINTS_PER_CENT_DIVISOR)
                           for order on this reservation with status != VOID )
    input_set: "Non-VOID FnbOrders on the reservation only."
    constants:
      POINTS_PER_CENT_DIVISOR: 100
    precision: "integer points; floor PER LINE then sum (order pinned)"

  - name: membership_tier
    trigger: "on lifetime_points change (loyalty accrual at close, or positive loyalty adjustment)"
    algorithm: threshold
    formula: |
      tier = GOLD   if lifetime_points >= TIER_GOLD_THRESHOLD
           = SILVER if lifetime_points >= TIER_SILVER_THRESHOLD
           = BRONZE otherwise
      # Boundary is inclusive (>=): exactly TIER_SILVER_THRESHOLD is SILVER.
    input_set: "The single Membership's lifetime_points."
    constants:
      TIER_SILVER_THRESHOLD: 500
      TIER_GOLD_THRESHOLD: 2000
    precision: "exact integer comparison, inclusive lower bound"

  - name: tournament_prize_pool
    trigger: "read while OPEN (provisional); POST /tournaments/{id}/start (final)"
    algorithm: aggregation
    formula: |
      gross_cents = eligible_registration_count * Tournament.entry_fee_cents
      house_cut_cents = round_half_up(gross_cents * HOUSE_CUT_PCT)
      pool_cents = gross_cents - house_cut_cents
    input_set: "Registrations on the tournament, filtered by variant."
    constants:
      HOUSE_CUT_PCT: 0.20
    precision: "integer cents; round_half_up on house cut"
    variants:
      - name: provisional
        when: "Tournament.status == OPEN, on read"
        difference: "eligible_registration_count = registrations with status in {REGISTERED, CHECKED_IN}; surfaced as provisional_prize_pool_cents"
      - name: final
        when: "at POST /tournaments/{id}/start"
        difference: "eligible_registration_count = registrations with status == CHECKED_IN only; frozen into prize_pool_cents and house_cut_cents"

  - name: condition_fee
    trigger: "POST /checkouts/{id}/return and POST /checkouts/{id}/report-lost"
    algorithm: threshold
    formula: |
      ord = { MINT:0, GOOD:1, WORN:2, DAMAGED:3, LOST:4 }
      # return branch:
      if ord[return_condition] <= ord[checkout_condition]:
          condition_fee_cents = 0
      else:
          condition_fee_cents = (ord[return_condition] - ord[checkout_condition]) * CONDITION_STEP_CENTS
      # lost branch:
      condition_fee_cents = GameCopy.replacement_value_cents
    input_set: "The Checkout and its GameCopy."
    constants:
      CONDITION_STEP_CENTS: 800
    precision: "integer cents"

  - name: private_booking_quote
    trigger: "POST /private-bookings"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round each component to whole cents, then sum.
      room_hours = ceil((end_at - start_at) in whole minutes / 60)   # a started hour counts fully
      room_charge_cents = room_hours * Room.hourly_rate_cents
      catering_cents = headcount * PER_HEAD_CATERING_CENTS
      service_fee_cents = round_half_up((room_charge_cents + catering_cents) * SERVICE_FEE_PCT)
      quoted_total_cents = room_charge_cents + catering_cents + service_fee_cents
      deposit_cents = round_half_up(quoted_total_cents * DEPOSIT_PCT)
    input_set: "The PrivateBooking and its Room."
    constants:
      PER_HEAD_CATERING_CENTS: 1500
      SERVICE_FEE_PCT: 0.18
      DEPOSIT_PCT: 0.25
    precision: "integer cents; round_half_up on service fee and deposit"

  - name: retail_order_total
    trigger: "POST /retail-orders"
    algorithm: aggregation
    formula: |
      total_cents = quantity * unit_price_cents
    input_set: "The single RetailOrder."
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of Manager, Staff, Member"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For a Member acting on an owned resource, X-User-ID equals the resource's membership_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "Member-invoked reservation/registration/redemption/retail-order mutations"

  - priority: 4
    category: existence
    check: "Every path and body resource id resolves (validated left-to-right in the path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range, end_at > start_at, email unique, barcode unique"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined; includes the cross-entity requirement that POST /checkouts sees Reservation.status == SEATED and POST /registrations/{id}/check-in sees Tournament.status == OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints and POST /checkouts"

  - priority: 7
    category: business_constraint
    check: "Acting/target Membership is not SUSPENDED where the operation requires an active member (redemption, registration)"
    error_id: ERR_MEMBERSHIP_SUSPENDED
    http_status: 409
    applies_to: "POST /memberships/{id}/redemptions, POST /registrations"

  - priority: 8
    category: business_safety
    check: "GameCopy is lendable: status AVAILABLE and condition in {MINT, GOOD, WORN} (DAMAGED/LOST not lendable)"
    error_id: ERR_GAME_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /checkouts"

  - priority: 9
    category: business_constraint
    check: "Table seat capacity honored: party_size <= Table.seats"
    error_id: ERR_TABLE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/seat"

  - priority: 10
    category: business_constraint
    check: "Table is not OUT_OF_SERVICE for booking/seating"
    error_id: ERR_TABLE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/seat"

  - priority: 11
    category: business_constraint
    check: "Tournament has capacity: count(REGISTERED+CHECKED_IN) < capacity before accepting a new registration"
    error_id: ERR_TOURNAMENT_FULL
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 12
    category: business_constraint
    check: "Tournament is OPEN to accept registrations"
    error_id: ERR_TOURNAMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 13
    category: business_constraint
    check: "A member has at most one non-terminal (REGISTERED/CHECKED_IN) registration per tournament"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 14
    category: business_temporal
    check: "Table time conflict: requested [start_at,end_at) must not fall within TABLE_TURNOVER_BUFFER_MINUTES (= 15 minutes) of any BOOKED/SEATED reservation on the same table. Conflict iff requested.start < existing.end + 15min AND requested.end + 15min > existing.start (buffer applied on both sides; a gap of exactly 15 minutes is accepted)"
    error_id: ERR_TABLE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 15
    category: business_temporal
    check: "Room time conflict: requested [start_at,end_at) must not overlap any CONFIRMED PrivateBooking on the same room. Half-open intervals, ZERO buffer: conflict iff requested.start < existing.end AND requested.end > existing.start (touching back-to-back, e.g. existing ends 20:00 and requested starts 20:00, is accepted)"
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /private-bookings"

  - priority: 16
    category: business_constraint
    check: "Room is AVAILABLE (not OUT_OF_SERVICE) to accept a hold"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /private-bookings"

  - priority: 17
    category: business_temporal
    check: "Reservation cancellation is before the cutoff: current clock <= start_at - CANCEL_CUTOFF_MINUTES (= 120 minutes); at exactly start_at - 120min cancellation is still accepted"
    error_id: ERR_CANCEL_TOO_LATE
    http_status: 409
    applies_to: "POST /reservations/{id}/cancel"

  - priority: 18
    category: business_fiscal
    check: "Membership.points_balance >= requested redemption points_cost"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /memberships/{id}/redemptions"

  - priority: 19
    category: state
    check: "Optimistic concurrency: expected_room_version equals the Room's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /private-bookings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances/sets the logical clock used by all deadline/expiry/duration rules"]

  # ---- Tables ----
  - method: POST
    path: "/tables"
    description: "Create a table"
    roles: [Manager]
    code: 201
    input: [label, seats, half_hour_rate_cents, day_pass_cents, cover_fee_cents, min_spend_cents, "zone?"]
    output: Table
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/tables/{id}"
    description: "Get a table"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Table
    side_effects: []
  - method: GET
    path: "/tables"
    description: "List tables"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["zone?", "status?", "limit?", "offset?"]
    output: Table[]
    side_effects: []
  - method: PATCH
    path: "/tables/{id}"
    description: "Update table config or take it out of service"
    roles: [Manager]
    code: 200
    input: ["status?", "half_hour_rate_cents?", "cover_fee_cents?", "min_spend_cents?", "day_pass_cents?"]
    output: Table
    side_effects: ["status may flip AVAILABLE<->OUT_OF_SERVICE"]

  # ---- Memberships ----
  - method: POST
    path: "/memberships"
    description: "Create a membership"
    roles: [Manager, Staff]
    code: 201
    input: [email, full_name]
    output: Membership
    side_effects: ["tier=BRONZE, points_balance=0, lifetime_points=0, no_show_strikes=0, status=ACTIVE, last_redemption_status=NONE"]
  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: GET
    path: "/memberships"
    description: "List memberships"
    roles: [Manager, Staff]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: PATCH
    path: "/memberships/{id}"
    description: "Change membership status (suspend/reinstate/cancel)"
    roles: [Manager]
    code: 200
    input: [status]
    output: Membership
    side_effects: ["ACTIVE<->SUSPENDED<->CANCELLED per state machine; reinstate resets no_show_strikes to 0"]
  - method: POST
    path: "/memberships/{id}/loyalty-adjustments"
    description: "Manager loyalty grant/deduction. Positive points_delta increases points_balance and lifetime_points (re-deriving tier); negative decreases points_balance only."
    roles: [Manager]
    code: 200
    input: [points_delta, reason]
    output: Membership
    side_effects: ["points_balance += points_delta", "if points_delta > 0: lifetime_points += points_delta and tier re-derived (calc membership_tier)"]
  - method: POST
    path: "/memberships/{id}/redemptions"
    description: "Redeem loyalty points for a reward"
    roles: [Member, Staff]
    code: 200
    input: [points_cost, reward_description]
    output: Membership
    side_effects: ["points_balance -= points_cost", "last_redemption_id set to new redemption id, last_redemption_points=points_cost, last_redemption_status=APPLIED"]
  - method: POST
    path: "/memberships/{id}/redemptions/{redemption_id}/reverse"
    description: "Reverse the most recent applied redemption, crediting points back"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Membership
    side_effects: ["points_balance += last_redemption_points", "last_redemption_status=REVERSED"]

  # ---- Reservations ----
  - method: POST
    path: "/reservations"
    description: "Book a table for a time window (member or walk-in)"
    roles: [Manager, Staff, Member]
    code: 201
    input: [table_id, party_size, start_at, end_at, "membership_id?", "deposit_cents?"]
    output: Reservation
    side_effects: ["status=BOOKED", "validates table capacity, out-of-service, and table time conflict"]
  - method: GET
    path: "/reservations/{id}"
    description: "Get a reservation (provisional_bill_total_cents evaluated live while SEATED)"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations, filterable by table or member"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["table_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{id}/seat"
    description: "Seat the party (BOOKED -> SEATED)"
    roles: [Manager, Staff]
    code: 200
    input: ["party_size?"]
    output: Reservation
    side_effects: ["seated_at set to clock", "tier_at_seating snapshot from Membership.tier"]
  - method: POST
    path: "/reservations/{id}/close"
    description: "Close the session and finalize the bill (SEATED -> COMPLETED)"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Reservation
    side_effects: ["compute bill (calc session_bill_total) and points_earned (calc loyalty_points_earned)", "CASCADE: Membership.lifetime_points/points_balance += points_earned -> tier re-derived"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a booking before the cutoff (BOOKED -> CANCELLED)"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["deposit released, not forfeited"]
  - method: POST
    path: "/reservations/{id}/no-show"
    description: "Mark a no-show (BOOKED -> NO_SHOW)"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Reservation
    side_effects: ["deposit_forfeited=true", "CASCADE: Membership.no_show_strikes += 1 -> if >= NO_SHOW_SUSPEND_THRESHOLD, Membership.status -> SUSPENDED"]

  # ---- F&B orders ----
  - method: POST
    path: "/fnb-orders"
    description: "Add a food & beverage line to a seated session"
    roles: [Manager, Staff]
    code: 201
    input: [reservation_id, description, total_cents]
    output: FnbOrder
    side_effects: ["status=OPEN; counts toward bill and F&B minimum"]
  - method: GET
    path: "/fnb-orders/{id}"
    description: "Get an F&B order"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: FnbOrder
    side_effects: []
  - method: GET
    path: "/fnb-orders"
    description: "List F&B orders for a reservation"
    roles: [Manager, Staff]
    code: 200
    input: ["reservation_id?", "status?", "limit?", "offset?"]
    output: FnbOrder[]
    side_effects: []
  - method: POST
    path: "/fnb-orders/{id}/void"
    description: "Void an F&B line (OPEN -> VOID)"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: FnbOrder
    side_effects: ["excluded from bill and F&B minimum"]

  # ---- Game copies ----
  - method: POST
    path: "/game-copies"
    description: "Add a library game copy"
    roles: [Manager]
    code: 201
    input: [title, barcode, replacement_value_cents, "condition?"]
    output: GameCopy
    side_effects: ["status=AVAILABLE, condition defaults to GOOD"]
  - method: GET
    path: "/game-copies/{id}"
    description: "Get a game copy"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: GameCopy
    side_effects: []
  - method: GET
    path: "/game-copies"
    description: "List game copies"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["title?", "status?", "condition?", "limit?", "offset?"]
    output: GameCopy[]
    side_effects: []
  - method: PATCH
    path: "/game-copies/{id}"
    description: "Update a game copy's condition or retire it"
    roles: [Manager]
    code: 200
    input: ["condition?", "status?"]
    output: GameCopy
    side_effects: ["condition and status dimensions updated independently; status=RETIRED is terminal"]

  # ---- Checkouts ----
  - method: POST
    path: "/checkouts"
    description: "Check out a game copy to a seated session (referenced Reservation must be SEATED)"
    roles: [Manager, Staff]
    code: 201
    input: [game_copy_id, reservation_id]
    output: Checkout
    side_effects: ["reject unless Reservation.status == SEATED (ERR_INVALID_STATE)", "GameCopy.status -> CHECKED_OUT", "checkout_condition snapshot; checked_out_at set"]
  - method: GET
    path: "/checkouts/{id}"
    description: "Get a checkout"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Checkout
    side_effects: []
  - method: GET
    path: "/checkouts"
    description: "List checkouts, filterable by game copy or reservation"
    roles: [Manager, Staff]
    code: 200
    input: ["game_copy_id?", "reservation_id?", "status?", "limit?", "offset?"]
    output: Checkout[]
    side_effects: []
  - method: POST
    path: "/checkouts/{id}/return"
    description: "Return a checked-out copy with a reported condition"
    roles: [Manager, Staff]
    code: 200
    input: [return_condition]
    output: Checkout
    side_effects: ["compute condition_fee_cents (calc condition_fee)", "GameCopy.status -> AVAILABLE; GameCopy.condition -> return_condition"]
  - method: POST
    path: "/checkouts/{id}/report-lost"
    description: "Report a checked-out copy lost"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Checkout
    side_effects: ["condition_fee_cents = replacement_value_cents", "GameCopy.condition -> LOST; GameCopy.status -> RETIRED"]

  # ---- Tournaments ----
  - method: POST
    path: "/tournaments"
    description: "Create a tournament/league"
    roles: [Manager]
    code: 201
    input: [name, game_title, format, capacity, entry_fee_cents, start_at]
    output: Tournament
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/tournaments/{id}"
    description: "Get a tournament (provisional_prize_pool_cents evaluated live while OPEN)"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Tournament
    side_effects: []
  - method: GET
    path: "/tournaments"
    description: "List tournaments"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["status?", "format?", "limit?", "offset?"]
    output: Tournament[]
    side_effects: []
  - method: POST
    path: "/tournaments/{id}/open"
    description: "Open registration (SCHEDULED -> OPEN)"
    roles: [Manager]
    code: 200
    input: []
    output: Tournament
    side_effects: []
  - method: POST
    path: "/tournaments/{id}/start"
    description: "Start the tournament (OPEN -> RUNNING), freezing the final prize pool"
    roles: [Manager]
    code: 200
    input: []
    output: Tournament
    side_effects: ["freeze prize_pool_cents from CHECKED_IN registrations (calc tournament_prize_pool final)", "compute house_cut_cents"]
  - method: POST
    path: "/tournaments/{id}/cancel"
    description: "Cancel a tournament (SCHEDULED/OPEN -> CANCELLED)"
    roles: [Manager]
    code: 200
    input: []
    output: Tournament
    side_effects: ["all REGISTERED/CHECKED_IN registrations -> REFUNDED with refunded_cents = fee_paid_cents"]

  # ---- Registrations ----
  - method: POST
    path: "/registrations"
    description: "Register a member for an open tournament"
    roles: [Manager, Staff, Member]
    code: 201
    input: [tournament_id, membership_id]
    output: Registration
    side_effects: ["status=REGISTERED; fee_paid_cents = Tournament.entry_fee_cents snapshot"]
  - method: GET
    path: "/registrations/{id}"
    description: "Get a registration"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/registrations"
    description: "List registrations, filterable by tournament or member"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["tournament_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/check-in"
    description: "Check a registrant in (REGISTERED -> CHECKED_IN); requires tournament OPEN"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: Registration
    side_effects: ["Tournament.checked_in_count re-derived"]
  - method: POST
    path: "/registrations/{id}/withdraw"
    description: "Withdraw a registration (REGISTERED -> WITHDRAWN), refunding the fee"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Registration
    side_effects: ["refunded_cents = fee_paid_cents; Tournament.registered_count re-derived"]

  # ---- Rooms ----
  - method: POST
    path: "/rooms"
    description: "Create a private room"
    roles: [Manager]
    code: 201
    input: [name, capacity, hourly_rate_cents]
    output: Room
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/rooms/{id}"
    description: "Get a room"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: GET
    path: "/rooms"
    description: "List rooms"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []
  - method: PATCH
    path: "/rooms/{id}"
    description: "Update a room or take it out of service"
    roles: [Manager]
    code: 200
    input: ["status?", "hourly_rate_cents?", "capacity?"]
    output: Room
    side_effects: ["status may flip AVAILABLE<->OUT_OF_SERVICE"]

  # ---- Private bookings ----
  - method: POST
    path: "/private-bookings"
    description: "Place a tentative hold on a room for a window; supersedes any prior HELD booking on the room. Requires expected_room_version (OCC)."
    roles: [Manager, Staff]
    code: 201
    input: [room_id, start_at, end_at, headcount, expected_room_version]
    output: PrivateBooking
    side_effects: ["status=HELD", "any prior HELD booking on the room -> SUPERSEDED", "increments Room.version by 1", "compute quoted_total_cents and deposit_cents (calc private_booking_quote)", "reject on CONFIRMED overlap or stale expected_room_version"]
  - method: GET
    path: "/private-bookings/{id}"
    description: "Get a private booking"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: PrivateBooking
    side_effects: []
  - method: GET
    path: "/private-bookings"
    description: "List private bookings for a room"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["room_id?", "status?", "limit?", "offset?"]
    output: PrivateBooking[]
    side_effects: []
  - method: POST
    path: "/private-bookings/{id}/confirm"
    description: "Confirm a held booking (HELD -> CONFIRMED)"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: PrivateBooking
    side_effects: ["headcount <= Room.capacity enforced"]
  - method: POST
    path: "/private-bookings/{id}/cancel"
    description: "Cancel a held/confirmed booking"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: PrivateBooking
    side_effects: []

  # ---- Retail / pre-orders ----
  - method: POST
    path: "/retail-orders"
    description: "Create a retail sale (IN_STOCK) or pre-order (PREORDER)"
    roles: [Manager, Staff, Member]
    code: 201
    input: [product_title, fulfillment_type, quantity, unit_price_cents, "membership_id?"]
    output: RetailOrder
    side_effects: ["status=READY for IN_STOCK, AWAITING_STOCK for PREORDER", "compute total_cents (calc retail_order_total)"]
  - method: GET
    path: "/retail-orders/{id}"
    description: "Get a retail order"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: RetailOrder
    side_effects: []
  - method: GET
    path: "/retail-orders"
    description: "List retail orders, filterable by member"
    roles: [Manager, Staff, Member]
    code: 200
    input: ["membership_id?", "status?", "fulfillment_type?", "limit?", "offset?"]
    output: RetailOrder[]
    side_effects: []
  - method: POST
    path: "/retail-orders/{id}/fulfill"
    description: "Fulfill/hand over an order (READY or AWAITING_STOCK -> FULFILLED)"
    roles: [Manager, Staff]
    code: 200
    input: []
    output: RetailOrder
    side_effects: ["status -> FULFILLED"]
  - method: POST
    path: "/retail-orders/{id}/cancel"
    description: "Cancel a retail order"
    roles: [Manager, Staff, Member]
    code: 200
    input: []
    output: RetailOrder
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path or body resource id does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range integer, end_at<=start_at, duplicate email/barcode" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_SESSION_HAS_OPEN_CHECKOUTS, http: 409, condition: "Closing a session while an ACTIVE Checkout still references it" }
  - { id: ERR_MEMBERSHIP_SUSPENDED, http: 409, condition: "Operation requires an active member but the membership is SUSPENDED" }
  - { id: ERR_GAME_NOT_AVAILABLE, http: 409, condition: "GameCopy is not AVAILABLE or is DAMAGED/LOST and cannot be lent" }
  - { id: ERR_TABLE_CAPACITY_EXCEEDED, http: 409, condition: "party_size exceeds Table.seats" }
  - { id: ERR_TABLE_OUT_OF_SERVICE, http: 409, condition: "Table is OUT_OF_SERVICE for booking/seating" }
  - { id: ERR_TOURNAMENT_FULL, http: 409, condition: "Tournament already has capacity active registrations" }
  - { id: ERR_TOURNAMENT_NOT_OPEN, http: 409, condition: "Tournament is not OPEN for registration" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Member already has a non-terminal registration for this tournament" }
  - { id: ERR_TABLE_TIME_CONFLICT, http: 409, condition: "Requested window collides (within turnover buffer) with another reservation on the table" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Requested window overlaps a CONFIRMED booking on the room" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Room is OUT_OF_SERVICE" }
  - { id: ERR_CANCEL_TOO_LATE, http: 409, condition: "Reservation cancellation attempted inside the cancellation cutoff window" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "Redemption points_cost exceeds points_balance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_room_version does not match the Room's current version" }
  - { id: ERR_REDEMPTION_ALREADY_REVERSED, http: 409, condition: "Reversing a redemption that is not the most recent APPLIED redemption" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Operator superset: configures tables/rooms/game-copies/tournaments, adjusts loyalty, suspends/reinstates members, and can perform every Staff operation (hierarchical override)."
    identity: opaque
    exclusive_operations:
      - "POST /tables, PATCH /tables/{id}"
      - "POST /game-copies, PATCH /game-copies/{id}"
      - "POST /rooms, PATCH /rooms/{id}"
      - "POST /tournaments, POST /tournaments/{id}/open, POST /tournaments/{id}/start, POST /tournaments/{id}/cancel"
      - "PATCH /memberships/{id} (suspend/reinstate/cancel)"
      - "POST /memberships/{id}/loyalty-adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All Staff operational endpoints (reservations, sessions, F&B, checkouts, registrations check-in/withdraw, private bookings, retail, redemptions/reverse, membership create)"

  - name: Staff
    description: "Front-of-house operator: books/seats/closes sessions, takes F&B, lends games, checks tournament registrants in, manages private bookings and retail."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /memberships"
      - "POST /reservations, POST /reservations/{id}/seat, POST /reservations/{id}/close, POST /reservations/{id}/cancel, POST /reservations/{id}/no-show"
      - "POST /fnb-orders, POST /fnb-orders/{id}/void"
      - "POST /checkouts, POST /checkouts/{id}/return, POST /checkouts/{id}/report-lost"
      - "POST /registrations, POST /registrations/{id}/check-in, POST /registrations/{id}/withdraw"
      - "POST /private-bookings, POST /private-bookings/{id}/confirm, POST /private-bookings/{id}/cancel"
      - "POST /retail-orders, POST /retail-orders/{id}/fulfill, POST /retail-orders/{id}/cancel"
      - "POST /memberships/{id}/redemptions, POST /memberships/{id}/redemptions/{redemption_id}/reverse"
      - "All GET endpoints"

  - name: Member
    description: "Entity-backed self-service member: books/cancels own reservations, registers/withdraws own tournament entries, redeems own points, places/cancels own retail orders. X-User-ID equals the acting Membership.id."
    identity: "entity_backed:Membership"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations (own membership_id), POST /reservations/{id}/cancel (own)"
      - "POST /registrations (own membership_id), POST /registrations/{id}/withdraw (own)"
      - "POST /memberships/{id}/redemptions (own)"
      - "POST /retail-orders (own membership_id), POST /retail-orders/{id}/cancel (own)"
      - "GET endpoints for own resources and public catalog (tables, rooms, game-copies, tournaments)"
