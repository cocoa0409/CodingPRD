# =============================================================================
# Task 0744 — Faith Congregation & Church Management
# §1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section: entities — creation, retrieval, not-found, required-field,
  # computed-field, system-field claims
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: household_create_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Household
          - endpoints["POST /households"]
        distinguishing_aspect: |
          Household create returns id + created_at + updated_at + version + all
          declared fields (name, address_line1, postal_code, primary_contact_member_id,
          status, archived_at). status defaults to ACTIVE; archived_at defaults null.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { name: "Test Household", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id, h_v: $.data.version, h_status: $.data.status }
          assert:
            - "response.status == 201"
            - "Household.${h_id}.status == ACTIVE"
            - "Household.${h_id}.version == 1"
            - "Household.${h_id}.archived_at is null"

      - name: household_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /households/{householdId}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /households with a well-formed but non-existent uuid returns
          ERR_NOT_FOUND with http 404.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: member_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /members without required field household_id returns ERR_INVALID_REQUEST 400.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "M X", date_of_birth: "1990-01-01", member_type: "ADULT", email: "mx@x.com" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: child_member_without_guardian_rejected
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.guardian_member_ids
          - errors[ERR_CHILD_MUST_HAVE_GUARDIAN]
        distinguishing_aspect: |
          Creating a CHILD member with empty guardian_member_ids returns
          ERR_CHILD_MUST_HAVE_GUARDIAN 422. This is the CHILD-specific required-field
          shape (guardian ids are only required when member_type == CHILD).
        test_recipe:
          setup: ["One Household exists"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H1", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "K1", date_of_birth: "2020-01-01", member_type: "CHILD", guardian_member_ids: [] }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_CHILD_MUST_HAVE_GUARDIAN"

      - name: pledge_computed_remaining_amount_after_partial_donation
        claim_type: Computed Fields
        grounds:
          - entities.Pledge.fields.remaining_amount_cents
          - entities.Pledge.fields.received_amount_cents
          - state_machines.Donation.PENDING_to_POSTED
        distinguishing_aspect: |
          After a 3000-cent POSTED donation against a 10000-cent pledge, the
          server-computed Pledge.remaining_amount_cents equals 7000 and
          received_amount_cents equals 3000.
        test_recipe:
          setup: ["Campaign C1 ACTIVE; Pledge P1 pledged 10000; Donation D1 3000 CHECK dated 2026-06-01 POSTED to P1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m_id}", amount_cents: 3000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c_id}", pledge_id: "${p_id}" }
              as: FinanceAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /pledges"
              payload: { member_id: "${m_id}" }
              as: FinanceAdmin
          assert:
            - "Pledge.${p_id}.received_amount_cents == 3000"
            - "Pledge.${p_id}.remaining_amount_cents == 7000"

      - name: event_computed_volunteer_filled_count_after_accept
        claim_type: Computed Fields
        grounds:
          - entities.Event.fields.volunteer_filled_count
          - state_machines.VolunteerAssignment.INVITED_to_ACCEPTED
        distinguishing_aspect: |
          After one INVITED assignment transitions to ACCEPTED,
          Event.volunteer_filled_count increments from 0 to 1.
        test_recipe:
          setup: ["Event E1 SCHEDULED with volunteer_slots=2; assignment A1 for member M1 in INVITED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /events"
              payload: { name: "E1", event_type: "SERVICE", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", expected_attendance: 50, volunteer_slots: 2 }
              as: Coordinator
              captures: { e_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e_id}", member_id: "${m_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /volunteer-assignments/${a_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "VolunteerAssignment.${a_id}.status == ACCEPTED"
            - "Event.${e_id}.volunteer_filled_count == 1"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: donation_post_from_posted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Donation.PENDING_to_POSTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /donations/{id}/post on a Donation already in POSTED is rejected
          with ERR_INVALID_STATE 409.
        test_recipe:
          setup: ["A POSTED CHECK donation"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m_id}", amount_cents: 5000, donation_date: "2026-06-01", payment_method: "CHECK" }
              as: FinanceAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /donations/${d_id}/post"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: pledge_cancel_on_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Pledge.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /pledges/{id}/cancel on an already-CANCELLED pledge is rejected
          with ERR_INVALID_STATE.
        test_recipe:
          setup: ["Cancelled pledge P1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pledges/${p_id}/cancel"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /pledges/${p_id}/cancel"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: event_complete_before_ends_at_returns_event_not_ended
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Event.SCHEDULED_to_COMPLETED
          - errors[ERR_EVENT_NOT_ENDED]
        distinguishing_aspect: |
          POST /events/{id}/complete before current_time >= event.ends_at
          returns ERR_EVENT_NOT_ENDED.
        test_recipe:
          setup: ["Event E1 SCHEDULED with ends_at in the future"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /events"
              payload: { name: "E1", event_type: "MEETING", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", expected_attendance: 20, volunteer_slots: 0 }
              as: Coordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /events/${e_id}/complete"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EVENT_NOT_ENDED"

      - name: statement_issue_provisional_variant_returns_variant_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.YearEndStatement.DRAFT_to_ISSUED
          - errors[ERR_STATEMENT_VARIANT_INVALID]
        distinguishing_aspect: |
          POST /year-end-statements/{id}/issue on a PROVISIONAL statement
          is rejected with ERR_STATEMENT_VARIANT_INVALID.
        test_recipe:
          setup: ["A PROVISIONAL DRAFT statement"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /year-end-statements"
              payload: { member_id: "${m_id}", tax_year: 2026, variant: "PROVISIONAL" }
              as: FinanceAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /year-end-statements/${s_id}/issue"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STATEMENT_VARIANT_INVALID"

      - name: child_checkout_wrong_pin_transitions_to_security_hold
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChildCheckIn.CHECKED_IN_to_SECURITY_HOLD
          - errors[ERR_SECURITY_HOLD_TRIGGERED]
        distinguishing_aspect: |
          POST /child-checkins/{id}/checkout with an incorrect pickup_pin
          transitions the check-in to SECURITY_HOLD with hold_reason=PIN_MISMATCH
          and returns ERR_SECURITY_HOLD_TRIGGERED.
        test_recipe:
          setup: ["Household H with adult guardian G and child K; Event E1 SCHEDULED; ChildCheckIn CH1 CHECKED_IN"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "G", date_of_birth: "1985-01-01", member_type: "ADULT", email: "g@x.com" }
              as: Registrar
              captures: { g_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "K", date_of_birth: "2020-01-01", member_type: "CHILD", guardian_member_ids: ["${g_id}"] }
              as: Registrar
              captures: { k_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Kids Church", event_type: "SERVICE", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", expected_attendance: 20, volunteer_slots: 0 }
              as: Coordinator
              captures: { e_id: $.data.id }
            - call: "POST /child-checkins"
              payload: { child_member_id: "${k_id}", event_id: "${e_id}", guardian_member_id: "${g_id}" }
              as: Coordinator
              captures: { ch_id: $.data.id, ch_pin: $.data.pickup_pin }
          trigger:
            - call: "POST /child-checkins/${ch_id}/checkout"
              payload: { pickup_pin: "0000", pickup_by_member_id: "${g_id}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SECURITY_HOLD_TRIGGERED"
            - "ChildCheckIn.${ch_id}.status == SECURITY_HOLD"
            - "ChildCheckIn.${ch_id}.hold_reason == PIN_MISMATCH"

      - name: pledge_active_to_fulfilled_bubble_up_on_boundary
        claim_type: bubble_up
        grounds:
          - state_machines.Pledge.ACTIVE_to_FULFILLED
          - entities.PledgeCampaign.fields.fulfilled_pledge_count
        distinguishing_aspect: |
          A single POSTED donation exactly equal to pledged_amount_cents triggers
          Pledge ACTIVE -> FULFILLED and increments PledgeCampaign.fulfilled_pledge_count.
          Boundary case: received == pledged (equal, not strictly greater).
        test_recipe:
          setup: ["Campaign C1 ACTIVE; Pledge P1 pledged 5000; no donations yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 5000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m_id}", amount_cents: 5000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c_id}", pledge_id: "${p_id}" }
              as: FinanceAdmin
              captures: { d_id: $.data.id }
          assert:
            - "Pledge.${p_id}.status == FULFILLED"
            - "PledgeCampaign.${c_id}.fulfilled_pledge_count == 1"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: coverage_score_at_urgency_horizon
        claim_type: threshold_boundary
        grounds:
          - calculations.volunteer_coverage_score
          - entities.Event.fields.coverage_score
        distinguishing_aspect: |
          At exactly 72 hours from event start, urgency = 0. With fill_ratio=0
          (no volunteers accepted) and event_type=SERVICE (weight 1.00), score
          = 100 * 1.00 * (0.60*0 + 0.40*(1-0)) = 40.00.
        test_recipe:
          setup: ["Clock 2026-05-01T10:00:00Z; SERVICE event E1 at 2026-05-04T10:00:00Z (exactly 72h out); volunteer_slots=4; no assignments accepted"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /events"
              payload: { name: "Sun 10am", event_type: "SERVICE", starts_at: "2026-05-04T10:00:00Z", ends_at: "2026-05-04T11:00:00Z", expected_attendance: 100, volunteer_slots: 4 }
              as: Coordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "GET /events/${e_id}"
              payload: {}
              as: Coordinator
          assert:
            - "Event.${e_id}.coverage_score == 40.00"

      - name: statement_final_before_cutoff_rejected
        claim_type: threshold_boundary
        grounds:
          - validations[priority=12]
          - errors[ERR_STATEMENT_TIMING]
        distinguishing_aspect: |
          Creating a FINAL statement for tax_year 2026 before 2027-01-16T00:00:00Z
          fails with ERR_STATEMENT_TIMING. Boundary: 2027-01-15T23:59:59Z rejects.
        test_recipe:
          setup: ["Clock at 2027-01-15T23:59:59Z (one second before FINAL boundary)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /year-end-statements"
              payload: { member_id: "${m_id}", tax_year: 2026, variant: "FINAL" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STATEMENT_TIMING"

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: pledge_first_expected_outside_campaign_window
        claim_type: Violation to Error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          POST /pledges with first_expected_on outside [campaign.starts_on,
          campaign.ends_on] returns ERR_INVALID_AMOUNT 422.
        test_recipe:
          setup: ["Campaign C1 ACTIVE, window 2026-05-01..2026-12-31"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 5000, frequency: "ONE_TIME", first_expected_on: "2027-02-01" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_AMOUNT"

      - name: small_group_leader_not_regular_or_member
        claim_type: Violation to Error
        grounds:
          - validations[priority=13]
          - errors[ERR_MEMBERSHIP_INELIGIBLE]
        distinguishing_aspect: |
          POST /small-groups with a leader_member_id whose membership_status
          is VISITOR (not REGULAR/MEMBER) returns ERR_MEMBERSHIP_INELIGIBLE.
        test_recipe:
          setup: ["Member M1 ADULT, membership_status still VISITOR (default)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /small-groups"
              payload: { name: "Study", leader_member_id: "${m_id}", ministry_area: "STUDY", capacity: 10 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MEMBERSHIP_INELIGIBLE"

      - name: facility_booking_headcount_exceeds_capacity
        claim_type: Violation to Error
        grounds:
          - validations[priority=9]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          POST /facility-bookings with headcount > facility.capacity returns
          ERR_CAPACITY_EXCEEDED 409.
        test_recipe:
          setup: ["Facility F1 capacity 50"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Small Room", capacity: 50, buffer_minutes: 0 }
              as: Coordinator
              captures: { f_id: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f_id}", booking_type: "EXTERNAL", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", headcount: 100, expected_facility_version: "${f_v}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CAPACITY_EXCEEDED"

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: pledge_campaign_activate_from_active_returns_invalid_state
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /pledge-campaigns/{campaignId}/activate"]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /pledge-campaigns/{id}/activate on an already-ACTIVE campaign
          returns ERR_INVALID_STATE 409.
        test_recipe:
          setup: ["Campaign C1 already ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: pagination_returns_envelope_shape
        claim_type: Listing
        grounds:
          - endpoints["GET /pledges"]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /pledges?limit=1 returns a response with envelope containing
          data list of length 1 plus pagination_fields limit=1, offset=0,
          total_count>=count(data), has_more true when total_count > offset+limit.
        test_recipe:
          setup: ["Two pledges exist for M1 on C1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 5000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 8000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /pledges"
              payload: { member_id: "${m_id}", limit: 1, offset: 0 }
              as: FinanceAdmin
          assert:
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "len(response.data) == 1"

  # ---------------------------------------------------------------------------
  # Section: errors — every error code must be triggerable
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: err_unauthenticated_missing_role_header
        claim_type: Violation to Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          A request missing the X-User-Role header (or carrying an unknown role)
          returns ERR_UNAUTHENTICATED 401. Higher priority than every other check.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Ghost   # unknown role → auth fails first
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: err_forbidden_registrar_cannot_create_facility
        claim_type: Violation to Error
        grounds:
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
          - roles.Registrar
        distinguishing_aspect: |
          Registrar attempting POST /facilities (Coordinator/PlatformAdmin only)
          returns ERR_FORBIDDEN 403.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "X", capacity: 100, buffer_minutes: 0 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: err_campaign_not_active_pledge_on_closed
        claim_type: Violation to Error
        grounds:
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
          - state_machines.PledgeCampaign
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pledge_create_requires_campaign_active
          rationale: "The same violation surface (Pledge cannot be created against a non-ACTIVE campaign) is already exercised by the §1.8 pledge_create_requires_campaign_active instance."

  # ---------------------------------------------------------------------------
  # Section: rbac — role isolation
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: member_cannot_post_donations_for_other_member
        claim_type: peer_roles
        grounds:
          - roles.Member
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          When Member calls POST /donations with member_id != X-User-ID, the
          server rejects with ERR_FORBIDDEN 403 (peer-roles ownership check).
        test_recipe:
          setup: ["Two members M1, M2 in Household H1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H1", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M2", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m2@x.com" }
              as: Registrar
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m2_id}", amount_cents: 1000, donation_date: "2026-06-01", payment_method: "CHECK" }
              as: Member
              as_user_id: "${m1_id}"    # M1 acting, but posting a donation for M2
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: coordinator_cannot_issue_year_end_statement
        claim_type: peer_roles
        grounds:
          - roles.Coordinator
          - roles.FinanceAdmin
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Coordinator attempting POST /year-end-statements/{id}/issue (FinanceAdmin
          exclusive) returns ERR_FORBIDDEN 403.
        test_recipe:
          setup: ["Statement S1 (FINAL) in DRAFT owned by FinanceAdmin flow"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /year-end-statements"
              payload: { member_id: "${m_id}", tax_year: 2026, variant: "FINAL" }
              as: FinanceAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /year-end-statements/${s_id}/issue"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_complexity_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: facility_stale_version_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[facility-booking-stale-facility]
          - errors[ERR_STALE_FACILITY_VERSION]
        distinguishing_aspect: |
          Two strictly sequential POST /facility-bookings using the same
          expected_facility_version: the first advances Facility.version, the
          second (with the stale version) is rejected with
          ERR_STALE_FACILITY_VERSION 412.
        test_recipe:
          setup: ["Facility F1 fresh (version=1), no bookings yet; client observes version=1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Sanctuary", capacity: 200, buffer_minutes: 0 }
              as: Coordinator
              captures: { f_id: $.data.id, f_v0: $.data.version }
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f_id}", booking_type: "EXTERNAL", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", headcount: 50, expected_facility_version: "${f_v0}" }
              as: Coordinator
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f_id}", booking_type: "EXTERNAL", starts_at: "2026-05-10T14:00:00Z", ends_at: "2026-05-10T15:00:00Z", headcount: 50, expected_facility_version: "${f_v0}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_FACILITY_VERSION"

      - name: cascade_side_effects_verified_across_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Donation.POSTED_to_REFUNDED
          - state_machines.Pledge.FULFILLED_to_ACTIVE
          - entities.PledgeCampaign.fields.fulfilled_pledge_count
        excluded_because:
          difficulty_instance: transitive_cascade / donation_refund_depth_three_cascade_to_campaign_counter
          rationale: "Depth-3 refund cascade end-to-end is the §1.8 transitive_cascade instance; corner would duplicate."

      - name: dual_variant_calc_delta_verified
        claim_type: dual_variant_calculation
        grounds:
          - calculations.pledge_campaign_progress
        excluded_because:
          difficulty_instance: dual_variant_calc / pledge_campaign_projected_vs_chronological_diverge
          rationale: "Projected-vs-chronological delta is the exact assertion made by the §1.8 dual_variant_calc instance."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_derived_field_visible_in_response
        claim_type: immediate
        grounds:
          - entities.PledgeCampaign.fields.received_total_cents
        distinguishing_aspect: |
          After a POST /donations that auto-POSTs (CHECK), an immediate GET
          /pledge-campaigns/{id} returns received_total_cents already reflecting
          the new donation (immediate consistency; no eventual lag).
        test_recipe:
          setup: ["Campaign C1 ACTIVE; Pledge P1 5000 ACTIVE; no donations"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c_id: $.data.id }
            - call: "POST /pledge-campaigns/${c_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c_id}", member_id: "${m_id}", pledged_amount_cents: 5000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m_id}", amount_cents: 1500, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c_id}", pledge_id: "${p_id}" }
              as: FinanceAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /pledge-campaigns/${c_id}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "PledgeCampaign.${c_id}.received_total_cents == 1500  # visible immediately in the same GET"
