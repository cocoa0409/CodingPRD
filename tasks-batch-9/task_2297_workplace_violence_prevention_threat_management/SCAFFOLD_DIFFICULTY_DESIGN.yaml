          linked IncidentReport ESCALATED -> SUBSTANTIATED, whose log_required true causes (3) one
          ViolentIncidentLogEntry to be appended and Worksite.violent_incident_count_12mo to reach
          1 so high_risk_flag flips true, which in turn causes (4) the worksite ACTIVE PreventionPlan
          to transition to REVIEW_DUE with compliance_posture RESTRICTED.
