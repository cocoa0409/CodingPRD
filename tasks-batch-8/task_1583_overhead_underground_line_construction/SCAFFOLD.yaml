# =============================================================================
# Task 1583 — Overhead & Underground Line Construction Contractor
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Overhead & Underground Line Construction Contractor (Quanta Services): work
  package & unit-price schedule, crew/equipment assignment & daily production,
  material issuance from utility stock & reconciliation, inspection & rework by
  utility standard, outage coordination & switching request, storm-standby &
  call-out premium, safety observation & incident, progress billing by completed
  units

domain_name: line-construction
api_prefix: /  # all endpoint paths are rooted; collections live at top level

complexity_profile:
  primary_archetype: ledger_reconciliation        # unit-price billing + utility stock reconciliation
  secondary_archetype: temporal_windowing         # crew/equipment assignments + outage windows
  complexity_layers:
    - optimistic_concurrency                      # OCC on Assignment.version and WorkPackage.version
    - cascading_side_effects                      # inspection FAIL cascade; fatal-incident cascade
    - dual_variant_calculation                    # provisional vs final billing; standby-convert vs pure call-out premium
    - rate_threshold_triggers                     # 110% overrun tier split; 125% quantity cap
  entity_topology: hierarchical                   # Contract root; peers Crew/Equipment referenced by FK
  state_machine_shape: cyclic                     # rework loop on ProductionEntry; revision loop on Invoice; suspend/resume on Contract
  relationship_patterns:
    - one_to_many                                 # Contract→BidItem/WorkPackage/StockItem; WorkPackage→Assignment/Inspection/OutageRequest/...
    - cross_aggregate                             # Assignment→Crew/Equipment; MaterialIssue→StockItem; ProductionEntry→BidItem
  role_model: approval_chain                      # contractor requests, utility approves (outages, invoices)
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Contract
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: utility_name, type: string, source: input, description: "Utility company name" }
      - { name: contract_number, type: string, source: input, description: "Unique contract identifier", constraints: "unique across all contracts" }
      - { name: effective_start, type: datetime, source: input, description: "Contract effective start (ISO8601)" }
      - { name: effective_end, type: datetime, source: input, description: "Contract effective end (ISO8601); must be >= effective_start" }
      - { name: retainage_pct, type: number, source: input, default: 0.10, description: "Fraction of each invoice subtotal withheld as retainage", constraints: "0 <= retainage_pct < 1" }
      - { name: overrun_threshold_pct, type: number, source: input, default: 1.10, description: "Cumulative accepted units up to estimated_quantity x this factor bill at base unit_price; beyond it at overrun_rate" }
      - { name: quantity_cap_pct, type: number, source: input, default: 1.25, description: "Hard cap: cumulative reported units (SUBMITTED+ACCEPTED) per BidItem may not exceed estimated_quantity x this factor" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: BidItem
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract" }
      - { name: item_code, type: string, source: input, description: "Utility unit-price schedule code, e.g. OH-POLE-35", constraints: "unique within contract" }
      - { name: description, type: string, source: input, description: "Bid item description" }
      - { name: unit, type: enum, source: input, description: "EACH | LF | CY | HR" }
      - { name: unit_price, type: number, source: input, description: "Base price per unit", constraints: "> 0" }
      - { name: estimated_quantity, type: number, source: input, description: "Scheduled quantity for this bid item", constraints: "> 0" }
      - { name: overrun_rate, type: number, source: input, default: null, description: "Unit price applied to units beyond the overrun threshold; when null, overrun units bill at unit_price" }
      - { name: accepted_quantity, type: number, source: computed, default: 0, description: "Sum of quantity_reported over child ProductionEntry rows with status ACCEPTED" }
      - { name: billed_quantity, type: number, source: computed, default: 0, description: "Sum of (in_schedule_units + overrun_units) over lines of invoices in SUBMITTED/APPROVED/PAID (frozen, non-VOID) for this bid item" }

  - name: WorkPackage
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract" }
      - { name: name, type: string, source: input, description: "Work package name" }
      - { name: location, type: string, source: input, description: "Feeder / address / mileage description" }
      - { name: requires_outage, type: boolean, source: input, default: false, description: "True when production may only be reported while an IN_EFFECT outage covers the work date" }
      - { name: status, type: enum, source: system, description: "PLANNED | MOBILIZED | IN_PROGRESS | PUNCH | COMPLETED | CANCELLED" }
      - { name: rework_open_count, type: integer, source: computed, default: 0, description: "Count of ProductionEntry rows (via child assignments) currently in REWORK_REQUIRED" }
      - { name: open_material_issue_count, type: integer, source: computed, default: 0, description: "Count of MaterialIssue rows for this work package with status OPEN" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew identifier", constraints: "unique" }
      - { name: crew_type, type: enum, source: input, description: "OVERHEAD | UNDERGROUND | STORM" }
      - { name: base_rate_per_hour, type: number, source: input, description: "Straight-time hourly rate used for storm premium pay", constraints: "> 0" }
      - { name: home_depot, type: string, source: input, default: null, description: "Home service center" }
      - { name: status, type: enum, source: computed, description: "CALLOUT if an ACTIVE StormActivation(kind=CALLOUT) references this crew; else STANDBY if an ACTIVE StormActivation(kind=STANDBY) references this crew; else ASSIGNED if an Assignment(status=ACTIVE) has start_date <= today <= end_date (today = logical clock date); else AVAILABLE" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: equipment_code, type: string, source: input, description: "Unique equipment identifier", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "BUCKET_TRUCK | DIGGER_DERRICK | TRENCHER | REEL_TRAILER" }
      - { name: daily_rate, type: number, source: input, description: "Daily rental rate", constraints: "> 0" }
      - { name: maintenance_flag, type: boolean, source: input, default: false, description: "True when equipment is down for maintenance; blocks new assignments" }
      - { name: status, type: enum, source: computed, description: "IN_USE if an Assignment(status=ACTIVE) references this equipment with start_date <= today <= end_date; else AVAILABLE" }

  - name: Assignment
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id; work package this crew/equipment is assigned to" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id" }
      - { name: start_date, type: string, source: input, description: "First working date (YYYY-MM-DD, inclusive)" }
      - { name: end_date, type: string, source: input, description: "Last working date (YYYY-MM-DD, inclusive); must be >= start_date" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED" }

  - name: ProductionEntry
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id" }
      - { name: bid_item_id, type: string, source: input, description: "FK -> BidItem.id; unit-price line this production counts against" }
      - { name: work_date, type: string, source: input, description: "Date the units were installed (YYYY-MM-DD); must fall inside the assignment's [start_date, end_date]" }
      - { name: quantity_reported, type: number, source: input, description: "Units installed this day", constraints: "> 0" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of times this entry has been resubmitted after REWORK_REQUIRED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REWORK_REQUIRED | VOID" }

  - name: StockItem
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; utility-owned stock account for this contract" }
      - { name: material_code, type: string, source: input, description: "Utility material catalog code", constraints: "unique within contract" }
      - { name: description, type: string, source: input, description: "Material description" }
      - { name: uom, type: string, source: input, description: "Unit of measure (e.g. EACH, LF)" }
      - { name: initial_on_hand, type: number, source: input, default: 0, description: "Opening balance at stock item creation", constraints: ">= 0" }
      - { name: on_hand, type: number, source: computed, description: "initial_on_hand + SUM(receipt quantities) - SUM(quantity_issued over all MaterialIssue) + SUM(quantity_returned over all MaterialIssue)" }

  - name: MaterialIssue
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id" }
      - { name: stock_item_id, type: string, source: input, description: "FK -> StockItem.id; must belong to the same contract as the work package" }
      - { name: quantity_issued, type: number, source: input, description: "Units drawn from utility stock", constraints: "> 0" }
      - { name: quantity_returned, type: number, source: system, default: 0, description: "Units returned to stock via /return" }
      - { name: quantity_installed, type: number, source: system, default: null, description: "Units declared installed, set at reconcile" }
      - { name: variance, type: number, source: computed, default: null, description: "quantity_issued - quantity_installed - quantity_returned, computed at reconcile" }
      - { name: variance_note, type: string, source: input, default: null, description: "Explanation required when reconciling with non-zero variance (CONTRACTOR_PM only)" }
      - { name: status, type: enum, source: system, description: "OPEN | RECONCILED | VARIANCE_RECONCILED" }

  - name: Inspection
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id" }
      - { name: production_entry_id, type: string, source: input, description: "FK -> ProductionEntry.id; entry under inspection" }
      - { name: standard_code, type: string, source: input, description: "Utility construction standard reference, e.g. UTIL-OH-12.4" }
      - { name: result, type: enum, source: input, default: null, description: "PASS | FAIL; set at submit" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED" }

  - name: OutageRequest
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id" }
      - { name: circuit_id, type: string, source: input, description: "Circuit / feeder identifier being switched out" }
      - { name: window_start, type: datetime, source: input, description: "Outage window start (ISO8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Outage window end (ISO8601 UTC); must be > window_start" }
      - { name: requested_window_start, type: datetime, source: system, default: null, description: "New window start proposed by request-change; adopted on re-approval" }
      - { name: requested_window_end, type: datetime, source: system, default: null, description: "New window end proposed by request-change; adopted on re-approval" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | CHANGE_REQUESTED | IN_EFFECT | RELEASED | DENIED | CANCELLED" }

  - name: StormActivation
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; crew placed on storm duty" }
      - { name: kind, type: enum, source: input, description: "STANDBY | CALLOUT; STANDBY may be converted to CALLOUT via /convert" }
      - { name: activation_date, type: string, source: input, description: "Date of the storm activation (YYYY-MM-DD)" }
      - { name: hours_standby, type: number, source: input, default: null, description: "Standby hours, recorded at close", constraints: ">= 0" }
      - { name: hours_worked, type: number, source: input, default: null, description: "Worked hours, recorded at close", constraints: ">= 0" }
      - { name: premium_pay, type: number, source: computed, default: null, description: "Computed at close per storm_premium_pay calculation" }
      - { name: converted, type: boolean, source: system, default: false, description: "True when a STANDBY activation was converted to CALLOUT before close" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED | CANCELLED" }

  - name: SafetyEvent
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id" }
      - { name: crew_id, type: string, source: input, default: null, description: "FK -> Crew.id; crew involved (optional)" }
      - { name: kind, type: enum, source: input, description: "OBSERVATION | INCIDENT" }
      - { name: severity, type: enum, source: input, description: "POSITIVE | AT_RISK | OSHA_RECORDABLE | FATAL" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | CLOSED" }

  - name: Invoice
    parent: WorkPackage
    common_fields: true
    fields:
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id" }
      - { name: period_start, type: string, source: input, description: "Billing period start date (YYYY-MM-DD, inclusive)" }
      - { name: period_end, type: string, source: input, description: "Billing period end date (YYYY-MM-DD, inclusive); must be >= period_start" }
      - { name: lines, type: array, source: computed, description: "Per-bid-item billing lines: {bid_item_id, item_code, in_schedule_units, overrun_units, in_schedule_rate, overrun_rate_applied, extension_amount}. Recomputed live while DRAFT; frozen on SUBMITTED" }
      - { name: subtotal, type: number, source: computed, default: 0, description: "Sum of per-line extension_amount after per-line rounding" }
      - { name: retainage_amount, type: number, source: computed, default: 0, description: "round(subtotal x retainage_pct, 2) half-up" }
      - { name: amount_due, type: number, source: computed, default: 0, description: "subtotal - retainage_amount" }
      - { name: hold_reason, type: enum, source: computed, default: null, description: "null | OPEN_REWORK — set on DRAFT invoices when the work package's rework_open_count rises above 0; cleared when it returns to 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PAID | REJECTED | VOID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/transition (to=ACTIVE)"
        actor: CONTRACTOR_PM
        preconditions:
          - "At least one BidItem exists for the contract (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Bid item schedule becomes immutable (further POST /contracts/{id}/bid-items -> ERR_BID_ITEMS_LOCKED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (SafetyEvent created with kind=INCIDENT and severity IN {OSHA_RECORDABLE, FATAL})"
        actor: system
        preconditions: []
        side_effects:
          - "Every Assignment of every WorkPackage of this contract with status IN {PLANNED, ACTIVE} -> CANCELLED"
          - "Every OutageRequest of every WorkPackage of this contract with status IN {REQUESTED, APPROVED, CHANGE_REQUESTED} -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/transition (to=ACTIVE)"
        actor: UTILITY_DISPATCHER
        preconditions:
          - "No SafetyEvent with kind=INCIDENT and status IN {OPEN, UNDER_REVIEW} exists on any WorkPackage of this contract (ERR_SAFETY_EVENT_OPEN)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /contracts/{contract_id}/transition (to=CLOSED)"
        actor: CONTRACTOR_PM
        preconditions:
          - "Every WorkPackage of this contract is in a terminal state (COMPLETED or CANCELLED) (ERR_OPEN_WORK_PACKAGES)"
        side_effects: []

  - entity: WorkPackage
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: MOBILIZED
        trigger: "POST /work-packages/{work_package_id}/transition (to=MOBILIZED)"
        actor: CONTRACTOR_PM
        preconditions:
          - "Contract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE / ERR_CONTRACT_SUSPENDED)"
        side_effects: []
      - from: MOBILIZED
        to: IN_PROGRESS
        trigger: "POST /work-packages/{work_package_id}/transition (to=IN_PROGRESS)"
        actor: CONTRACTOR_PM
        preconditions:
          - "At least one Assignment with status IN {PLANNED, ACTIVE} exists for this work package (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: PUNCH
        trigger: "POST /work-packages/{work_package_id}/transition (to=PUNCH)"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []
      - from: PUNCH
        to: COMPLETED
        trigger: "POST /work-packages/{work_package_id}/transition (to=COMPLETED)"
        actor: CONTRACTOR_PM
        preconditions:
          - "rework_open_count == 0 (ERR_OPEN_REWORK)"
          - "open_material_issue_count == 0 — every MaterialIssue is RECONCILED or VARIANCE_RECONCILED (ERR_OPEN_MATERIAL_ISSUES)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /work-packages/{work_package_id}/transition (to=CANCELLED)"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "Assignments with status IN {PLANNED, ACTIVE} -> CANCELLED"
          - "DRAFT/REJECTED Invoices -> VOID (frozen unit pool released)"
      - from: MOBILIZED
        to: CANCELLED
        trigger: "POST /work-packages/{work_package_id}/transition (to=CANCELLED)"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "Assignments with status IN {PLANNED, ACTIVE} -> CANCELLED"
          - "DRAFT/REJECTED Invoices -> VOID"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /work-packages/{work_package_id}/transition (to=CANCELLED)"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "Assignments with status IN {PLANNED, ACTIVE} -> CANCELLED"
          - "DRAFT/REJECTED Invoices -> VOID"

  - entity: Assignment
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /assignments/{assignment_id}/transition (to=ACTIVE)"
        actor: FOREMAN
        preconditions:
          - "start_date <= today <= end_date, today = logical clock date (ERR_INVALID_STATE)"
          - "WorkPackage.status IN {MOBILIZED, IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects:
          - "Crew.status / Equipment.status recompute (may become ASSIGNED / IN_USE)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /assignments/{assignment_id}/transition (to=COMPLETED)"
        actor: FOREMAN
        preconditions:
          - "No ProductionEntry of this assignment is in SUBMITTED or REWORK_REQUIRED (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /assignments/{assignment_id}/transition (to=CANCELLED)"
        actor: FOREMAN
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /assignments/{assignment_id}/transition (to=CANCELLED) or system contract-suspension cascade"
        actor: FOREMAN
        preconditions: []
        side_effects: []

  - entity: ProductionEntry
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, VOID]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /inspections/{inspection_id}/submit (result=PASS) on an Inspection whose production_entry_id == this entry"
        actor: UTILITY_INSPECTOR
        preconditions: []
        side_effects:
          - "BidItem.accepted_quantity increases by quantity_reported"
          - "DRAFT Invoices of the work package recompute lines/subtotal/retainage_amount/amount_due"
      - from: SUBMITTED
        to: REWORK_REQUIRED
        trigger: "POST /inspections/{inspection_id}/submit (result=FAIL) on an Inspection whose production_entry_id == this entry"
        actor: UTILITY_INSPECTOR
        preconditions: []
        side_effects:
          - "WorkPackage.rework_open_count increases by 1"
          - "When rework_open_count rises from 0 to 1: every DRAFT Invoice of the work package sets hold_reason=OPEN_REWORK"
      - from: REWORK_REQUIRED
        to: SUBMITTED
        trigger: "POST /production-entries/{production_entry_id}/resubmit"
        actor: FOREMAN
        preconditions:
          - "Quantity-cap check re-applies: cumulative quantity_reported over this BidItem's entries with status IN {SUBMITTED, ACCEPTED} plus this entry's quantity_reported <= estimated_quantity x Contract.quantity_cap_pct (ERR_QUANTITY_CAP_EXCEEDED)"
        side_effects:
          - "rework_count increases by 1"
          - "WorkPackage.rework_open_count decreases by 1"
          - "When rework_open_count falls to 0: every DRAFT Invoice of the work package clears hold_reason to null"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /production-entries/{production_entry_id}/void"
        actor: FOREMAN
        preconditions: []
        side_effects: []
      - from: REWORK_REQUIRED
        to: VOID
        trigger: "POST /production-entries/{production_entry_id}/void"
        actor: FOREMAN
        preconditions: []
        side_effects:
          - "WorkPackage.rework_open_count decreases by 1"
          - "When rework_open_count falls to 0: DRAFT Invoices clear hold_reason"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{inspection_id}/submit (result=PASS)"
        actor: UTILITY_INSPECTOR
        preconditions:
          - "ProductionEntry.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "ProductionEntry SUBMITTED -> ACCEPTED (see ProductionEntry machine for its cascade)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{inspection_id}/submit (result=FAIL)"
        actor: UTILITY_INSPECTOR
        preconditions:
          - "ProductionEntry.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "ProductionEntry SUBMITTED -> REWORK_REQUIRED (see ProductionEntry machine for its cascade)"

  - entity: OutageRequest
    initial_state: REQUESTED
    terminal_states: [RELEASED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /outage-requests/{outage_request_id}/decide (decision=APPROVED)"
        actor: UTILITY_DISPATCHER
        preconditions:
          - "Buffer conflict check: for every other OutageRequest on the same circuit_id with status IN {APPROVED, IN_EFFECT}, the gap between windows must be >= 60 minutes: window_start >= other.window_end + 60min OR window_end <= other.window_start - 60min (ERR_OUTAGE_WINDOW_CONFLICT)"
        side_effects: []
      - from: CHANGE_REQUESTED
        to: APPROVED
        trigger: "POST /outage-requests/{outage_request_id}/decide (decision=APPROVED)"
        actor: UTILITY_DISPATCHER
        preconditions:
          - "Same 60-minute buffer check, evaluated on the requested window (ERR_OUTAGE_WINDOW_CONFLICT)"
        side_effects:
          - "window_start/window_end overwritten by requested_window_start/requested_window_end; requested_window_* cleared to null"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /outage-requests/{outage_request_id}/decide (decision=DENIED)"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects: []
      - from: CHANGE_REQUESTED
        to: DENIED
        trigger: "POST /outage-requests/{outage_request_id}/decide (decision=DENIED)"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_EFFECT
        trigger: "system: logical clock enters [window_start, window_end]; evaluated whenever the clock is set and whenever the OutageRequest is read or referenced by another operation"
        actor: system
        preconditions:
          - "window_start <= now <= window_end (logical clock)"
        side_effects: []
      - from: APPROVED
        to: CHANGE_REQUESTED
        trigger: "POST /outage-requests/{outage_request_id}/request-change"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "requested_window_start/requested_window_end set from request body"
      - from: IN_EFFECT
        to: RELEASED
        trigger: "POST /outage-requests/{outage_request_id}/release"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /outage-requests/{outage_request_id}/cancel or system contract-suspension cascade"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /outage-requests/{outage_request_id}/cancel or system contract-suspension cascade"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []
      - from: CHANGE_REQUESTED
        to: CANCELLED
        trigger: "POST /outage-requests/{outage_request_id}/cancel or system contract-suspension cascade"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []

  - entity: StormActivation
    initial_state: ACTIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /storm-activations/{storm_activation_id}/close"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects:
          - "premium_pay computed per storm_premium_pay (variant pure_callout when kind=CALLOUT and converted=false; variant standby_convert when converted=true)"
          - "Crew.status recompute"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /storm-activations/{storm_activation_id}/cancel"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects:
          - "Crew.status recompute"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /storm-activations/{storm_activation_id}/convert (kind STANDBY -> CALLOUT)"
        actor: UTILITY_DISPATCHER
        preconditions:
          - "kind == STANDBY (ERR_INVALID_STATE)"
        side_effects:
          - "kind := CALLOUT; converted := true"
          - "Crew.status recompute (STANDBY -> CALLOUT)"

  - entity: SafetyEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /safety-events/{safety_event_id}/transition (to=UNDER_REVIEW)"
        actor: SAFETY_OFFICER
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /safety-events/{safety_event_id}/transition (to=CLOSED)"
        actor: SAFETY_OFFICER
        preconditions: []
        side_effects: []

  - entity: MaterialIssue
    initial_state: OPEN
    terminal_states: [RECONCILED, VARIANCE_RECONCILED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /material-issues/{material_issue_id}/reconcile"
        actor: FOREMAN
        preconditions:
          - "quantity_installed + quantity_returned == quantity_issued (else see VARIANCE_RECONCILED path)"
        side_effects:
          - "quantity_installed recorded; variance := 0"
          - "WorkPackage.open_material_issue_count decreases by 1"
      - from: OPEN
        to: VARIANCE_RECONCILED
        trigger: "POST /material-issues/{material_issue_id}/reconcile with variance_note"
        actor: CONTRACTOR_PM
        preconditions:
          - "variance_note present and non-empty (ERR_MATERIAL_VARIANCE_UNRESOLVED)"
          - "Actor role must be CONTRACTOR_PM when variance is non-zero (ERR_MATERIAL_VARIANCE_UNRESOLVED for FOREMAN)"
        side_effects:
          - "quantity_installed recorded; variance := quantity_issued - quantity_installed - quantity_returned"
          - "WorkPackage.open_material_issue_count decreases by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /invoices/{invoice_id}/transition (to=SUBMITTED)"
        actor: CONTRACTOR_PM
        preconditions:
          - "WorkPackage.rework_open_count == 0 (ERR_OPEN_REWORK)"
          - "At least one line with (in_schedule_units + overrun_units) > 0 (ERR_NO_BILLABLE_UNITS)"
        side_effects:
          - "Lines and subtotal/retainage_amount/amount_due freeze"
          - "BidItem.billed_quantity increases by each line's total units"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /invoices/{invoice_id}/transition (to=APPROVED)"
        actor: UTILITY_INSPECTOR
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /invoices/{invoice_id}/transition (to=REJECTED)"
        actor: UTILITY_INSPECTOR
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /invoices/{invoice_id}/transition (to=PAID)"
        actor: UTILITY_DISPATCHER
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /invoices/{invoice_id}/transition (to=DRAFT) — revise"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "Lines unfreeze; BidItem.billed_quantity decreases by each line's total units (pool released); lines resume live recompute"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{invoice_id}/transition (to=VOID) or work-package cancel cascade"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOID
        trigger: "POST /invoices/{invoice_id}/transition (to=VOID)"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects:
          - "BidItem.billed_quantity decreases by each line's total units (frozen unit pool restored to remaining billable pool)"
      - from: REJECTED
        to: VOID
        trigger: "POST /invoices/{invoice_id}/transition (to=VOID) or work-package cancel cascade"
        actor: CONTRACTOR_PM
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: production-entry-create-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /assignments/{assignment_id}/production-entries"
    occ_field: expected_assignment_version
    description: |
      Creating a ProductionEntry against an Assignment whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just posted a production entry (which
      legitimately advances the assignment's daily tally) and the current
      writer's view of the assignment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-work-package
    parent_entity: WorkPackage
    write_endpoint: "POST /work-packages/{work_package_id}/invoices"
    occ_field: expected_work_package_version
    description: |
      Creating an Invoice against a WorkPackage whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an invoice (which legitimately
      supersedes the prior billing view of the work package) and the current
      writer's view of the billable pool is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: crew_equipment_status_derivation
    trigger: "read of Crew/Equipment; after assignment transitions, storm activation create/convert/close/cancel, clock set"
    algorithm: aggregation
    formula: |
      Crew.status =
        CALLOUT   if exists StormActivation(crew_id=this, status=ACTIVE, kind=CALLOUT)
        STANDBY   elif exists StormActivation(crew_id=this, status=ACTIVE, kind=STANDBY)
        ASSIGNED  elif exists Assignment(crew_id=this, status=ACTIVE) with start_date <= today <= end_date
        AVAILABLE else
      Equipment.status =
        IN_USE    if exists Assignment(equipment_id=this, status=ACTIVE) with start_date <= today <= end_date
        AVAILABLE else
      today = date part of the logical clock.
    input_set: "StormActivation status=ACTIVE for this crew; Assignment status=ACTIVE for this crew/equipment"
    constants: {}
    precision: "n/a (enum derivation)"

  - name: production_acceptance_accounting
    trigger: "inspection submit PASS (entry ACCEPTED); entry VOID"
    algorithm: aggregation
    formula: |
      BidItem.accepted_quantity = SUM(quantity_reported) over ProductionEntry
        where bid_item_id = this AND status = ACCEPTED.
      WorkPackage.rework_open_count = COUNT(ProductionEntry) over entries whose
        assignment belongs to this work package AND status = REWORK_REQUIRED.
    input_set: "ProductionEntry rows: accepted_quantity counts status=ACCEPTED only; rework_open_count counts status=REWORK_REQUIRED only"
    constants: {}
    precision: "integer/exact quantity arithmetic"

  - name: quantity_cap_check
    trigger: "POST /assignments/{id}/production-entries and POST /production-entries/{id}/resubmit"
    algorithm: threshold
    formula: |
      cumulative = SUM(quantity_reported) over ProductionEntry
        where bid_item_id = target AND status IN {SUBMITTED, ACCEPTED}
      allowed iff cumulative + new_quantity <= BidItem.estimated_quantity * Contract.quantity_cap_pct
      (boundary: equality is ALLOWED — the check is <=, not <)
    input_set: "ProductionEntry rows of the BidItem with status IN {SUBMITTED, ACCEPTED}; REWORK_REQUIRED and VOID rows excluded"
    constants:
      DEFAULT_QUANTITY_CAP_PCT: 1.25
    precision: "exact numeric comparison"

  - name: billing_extension
    trigger: "invoice create/refresh while DRAFT; billing-preview read; freeze at invoice submit"
    algorithm: tiered_pricing
    formula: |
      For each BidItem of the contract, over the invoice period [period_start, period_end]:
        eligible_units(variant) = SUM(quantity_reported) over ProductionEntry where
          bid_item = this, work_date IN [period_start, period_end] (inclusive both ends),
          status = ACCEPTED                      (variant final)
          status IN {SUBMITTED, ACCEPTED}        (variant provisional)
        already_billed = SUM of this bid item's units over lines of this work package's
          invoices with status IN {SUBMITTED, APPROVED, PAID}
        billable = max(0, eligible_units - already_billed)
        prior_cumulative_accepted = accepted_quantity - eligible_units_final_component
          (i.e., cumulative accepted units OUTSIDE this period; used to position the tier boundary)
        threshold_units = floor(estimated_quantity * Contract.overrun_threshold_pct)
        in_schedule_units = max(0, min(billable, threshold_units - prior_cumulative_accepted))
        overrun_units = billable - in_schedule_units
        overrun_rate_applied = (overrun_rate if overrun_rate is not null else unit_price)
        extension_amount = round(in_schedule_units * unit_price, 2, HALF_UP)
                         + round(overrun_units * overrun_rate_applied, 2, HALF_UP)
    input_set: "BidItems of the contract; ProductionEntry filtered by variant and period window (inclusive); frozen invoice lines of the same work package with status IN {SUBMITTED, APPROVED, PAID}"
    constants:
      DEFAULT_OVERRUN_THRESHOLD_PCT: 1.10
    precision: "2 decimal places, round_half_up, applied per extension component (in-schedule part and overrun part rounded separately)"
    variants:
      - name: final
        when: "invoice creation and invoice submission (money actually billed)"
        difference: "only ProductionEntry rows with status=ACCEPTED count toward eligible_units"
      - name: provisional
        when: "GET /work-packages/{id}/billing-preview with variant=provisional (forecast)"
        difference: "ProductionEntry rows with status IN {SUBMITTED, ACCEPTED} count, so identical production data yields a larger preview total whenever un-inspected entries exist"

  - name: invoice_total_aggregation
    trigger: "invoice line recompute; freeze at submit"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED (per-line first, then sum):
        1. each line's extension_amount computed and rounded per billing_extension
        2. subtotal = SUM(line.extension_amount)          (already-rounded values; no further rounding)
        3. retainage_amount = round(subtotal * Contract.retainage_pct, 2, HALF_UP)
        4. amount_due = subtotal - retainage_amount
      Sum-then-round is FORBIDDEN: rounding each 100.005 line to 100.01 first and
      summing yields 200.02; summing raw (200.01) then rounding would yield 200.01.
    input_set: "the invoice's own lines as computed by billing_extension (final variant at submit)"
    constants: {}
    precision: "2 decimal places, round_half_up; per-line rounding precedes summation"

  - name: storm_premium_pay
    trigger: "POST /storm-activations/{id}/close"
    algorithm: weighted_scoring
    formula: |
      base = Crew.base_rate_per_hour
      variant standby_convert (activation was created as STANDBY and converted):
        premium_pay = round(hours_standby * STANDBY_MULT * base, 2, HALF_UP)
                    + round(hours_worked  * CALLOUT_MULT * base, 2, HALF_UP)
      variant pure_callout (activation created as CALLOUT, never converted):
        premium_pay = round(max(hours_worked, CALLOUT_MINIMUM_HOURS) * CALLOUT_MULT * base, 2, HALF_UP)
    input_set: "the closed StormActivation's hours_standby/hours_worked, its Crew.base_rate_per_hour, converted flag"
    constants:
      STANDBY_MULT: 0.5
      CALLOUT_MULT: 2.0
      CALLOUT_MINIMUM_HOURS: 4
    precision: "2 decimal places, round_half_up; each component rounded separately"
    variants:
      - name: pure_callout
        when: "kind=CALLOUT from creation (converted=false)"
        difference: "4-hour minimum guarantee applies via max(hours_worked, 4); standby hours are NOT credited"
      - name: standby_convert
        when: "created STANDBY then converted to CALLOUT (converted=true)"
        difference: "standby hours credited at 0.5x and worked hours at 2.0x with NO minimum guarantee, so identical worked hours price differently than pure_callout"

  - name: material_reconciliation
    trigger: "stock item create, receipt, material issue, material return, reconcile"
    algorithm: aggregation
    formula: |
      StockItem.on_hand = initial_on_hand
        + SUM(Receipt.quantity)
        - SUM(MaterialIssue.quantity_issued)
        + SUM(MaterialIssue.quantity_returned)
      At reconcile: variance = quantity_issued - quantity_installed - quantity_returned
      Conserved quantity (stock units): issue of q followed by return of q restores
      on_hand to its pre-issue value exactly.
    input_set: "all Receipt rows and all MaterialIssue rows (any status) referencing the StockItem"
    constants: {}
    precision: "exact numeric arithmetic"

  - name: billing_pool_reconciliation
    trigger: "invoice submit / revise-to-DRAFT / void; inspection PASS; billing-preview read"
    algorithm: aggregation
    formula: |
      remaining_billable_units(bid_item) = accepted_quantity
        - SUM(line units for bid_item over invoices of the SAME work package
              with status IN {SUBMITTED, APPROVED, PAID})
      Conserved quantity (billable units): submit of an invoice billing u units
      followed by void of the same invoice leaves remaining_billable_units unchanged:
      remaining = accepted always, because billed + remaining = accepted for any
      partition of frozen invoices.
    input_set: "BidItem.accepted_quantity; frozen lines of non-VOID invoices in SUBMITTED/APPROVED/PAID for the same work package"
    constants: {}
    precision: "exact numeric arithmetic"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, enum values valid, numeric constraints (quantity > 0, rates > 0, percentages in range)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids exist (validated left-to-right); body foreign-key ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_assignment_version / expected_work_package_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assignments/{assignment_id}/production-entries; POST /work-packages/{work_package_id}/invoices"

  - priority: 6
    category: state
    check: "Contract must be ACTIVE for operational writes; SUSPENDED yields ERR_CONTRACT_SUSPENDED, DRAFT/CLOSED yield ERR_CONTRACT_NOT_ACTIVE"
    error_id: ERR_CONTRACT_SUSPENDED
    http_status: 409
    applies_to: "work package transitions, assignments, production entries, material issues/returns/reconciles, inspections, outage requests, storm activations, safety event creation, invoices"
    note: "SafetyEvent transitions (review/close) and all GET endpoints are exempt, so incidents logged before the suspension can be reviewed and closed while SUSPENDED (otherwise resume would be unreachable)."

  - priority: 6b
    category: state
    check: "Contract must be ACTIVE (not DRAFT/CLOSED) for operational writes"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "work package transitions, assignments, production entries, material issues/returns/reconciles, inspections, outage requests, storm activations, safety event creation, invoices"
    note: "SafetyEvent transitions (review/close) and all GET endpoints are exempt, so incidents logged before the suspension can be reviewed and closed while SUSPENDED (otherwise resume would be unreachable)."

  - priority: 6c
    category: state
    check: "Work package / assignment lifecycle gates on child operations: assignment creation requires WorkPackage.status IN {MOBILIZED, IN_PROGRESS}; production entries require WorkPackage.status == IN_PROGRESS and Assignment.status == ACTIVE and work_date within [start_date, end_date]; material issues require WorkPackage.status == IN_PROGRESS; outage requests require a non-terminal work package; invoice creation requires WorkPackage.status IN {IN_PROGRESS, PUNCH, COMPLETED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /work-packages/{id}/assignments; POST /assignments/{id}/production-entries; POST /work-packages/{id}/material-issues; POST /work-packages/{id}/outage-requests; POST /work-packages/{id}/invoices"

  - priority: 7
    category: state
    check: "Entity must be in a valid source state for the requested transition (includes: bid item creation only while contract DRAFT -> ERR_BID_ITEMS_LOCKED; assignment activation date-window check)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints, POST /contracts/{id}/bid-items"

  - priority: 7b
    category: state
    check: "Bid item schedule is locked once the contract leaves DRAFT"
    error_id: ERR_BID_ITEMS_LOCKED
    http_status: 409
    applies_to: "POST /contracts/{contract_id}/bid-items"

  - priority: 8
    category: business_safety
    check: "Production on a work package with requires_outage=true requires an OutageRequest of that work package with status IN_EFFECT whose [window_start, window_end] covers the entry's work_date"
    error_id: ERR_OUTAGE_REQUIRED
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/production-entries"

  - priority: 8b
    category: business_safety
    check: "Equipment with maintenance_flag=true may not be assigned"
    error_id: ERR_EQUIPMENT_DOWN
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/assignments"

  - priority: 9
    category: business_constraint
    check: "Crew schedule: no two Assignments for the same crew with status IN {PLANNED, ACTIVE} may have overlapping closed date intervals (a.start <= b.end AND b.start <= a.end); adjacency (next start > prior end) is allowed"
    error_id: ERR_CREW_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/assignments"

  - priority: 9b
    category: business_constraint
    check: "Equipment schedule: same closed-interval overlap rule as crews, keyed on equipment_id"
    error_id: ERR_EQUIPMENT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/assignments"

  - priority: 9c
    category: business_constraint
    check: "Outage buffer: approving an outage whose window is within 60 minutes of another APPROVED/IN_EFFECT outage on the same circuit is rejected; gap >= 60 minutes is allowed"
    error_id: ERR_OUTAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /outage-requests/{outage_request_id}/decide"

  - priority: 9d
    category: business_constraint
    check: "At most one ACTIVE StormActivation per crew"
    error_id: ERR_DUPLICATE_ACTIVE_STANDBY
    http_status: 409
    applies_to: "POST /contracts/{contract_id}/storm-activations"

  - priority: 9e
    category: business_constraint
    check: "A crew with an ACTIVE StormActivation may not be given a regular Assignment"
    error_id: ERR_CREW_ON_STORM_DUTY
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/assignments"

  - priority: 9f
    category: business_constraint
    check: "At most one SCHEDULED Inspection per ProductionEntry"
    error_id: ERR_INSPECTION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/inspections"

  - priority: 9g
    category: business_constraint
    check: "Quantity cap: cumulative reported units (SUBMITTED+ACCEPTED) + new quantity must be <= estimated_quantity x quantity_cap_pct (equality allowed)"
    error_id: ERR_QUANTITY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/production-entries; POST /production-entries/{production_entry_id}/resubmit"

  - priority: 9h
    category: business_constraint
    check: "Date ranges must be well-formed: end >= start (assignments, invoice periods); outage window_end > window_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /work-packages/{id}/assignments; POST /work-packages/{id}/invoices; POST /work-packages/{id}/outage-requests; POST /outage-requests/{id}/request-change"

  - priority: 9i
    category: business_constraint
    check: "Returns may not exceed the unreturned issued balance: quantity_returned + return_qty <= quantity_issued"
    error_id: ERR_RETURN_EXCEEDS_ISSUED
    http_status: 409
    applies_to: "POST /material-issues/{material_issue_id}/return"

  - priority: 9j
    category: business_constraint
    check: "Reconcile with non-zero variance requires CONTRACTOR_PM role and a non-empty variance_note"
    error_id: ERR_MATERIAL_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /material-issues/{material_issue_id}/reconcile"

  - priority: 9k
    category: business_constraint
    check: "Work package completion gates: rework_open_count == 0"
    error_id: ERR_OPEN_REWORK
    http_status: 409
    applies_to: "POST /work-packages/{id}/transition (to=COMPLETED); POST /invoices/{id}/transition (to=SUBMITTED)"

  - priority: 9l
    category: business_constraint
    check: "Work package completion gates: open_material_issue_count == 0"
    error_id: ERR_OPEN_MATERIAL_ISSUES
    http_status: 409
    applies_to: "POST /work-packages/{id}/transition (to=COMPLETED)"

  - priority: 9m
    category: business_constraint
    check: "Contract resume gate: no INCIDENT SafetyEvent in OPEN or UNDER_REVIEW"
    error_id: ERR_SAFETY_EVENT_OPEN
    http_status: 409
    applies_to: "POST /contracts/{id}/transition (to=ACTIVE from SUSPENDED)"

  - priority: 9n
    category: business_constraint
    check: "Contract close gate: all work packages terminal"
    error_id: ERR_OPEN_WORK_PACKAGES
    http_status: 409
    applies_to: "POST /contracts/{id}/transition (to=CLOSED)"

  - priority: 10
    category: business_referential
    check: "Cross-references must stay within one contract: MaterialIssue.stock_item_id must belong to the same contract as the work package; ProductionEntry.bid_item_id must belong to the work package's contract; Inspection.production_entry_id must belong to the work package"
    error_id: ERR_CROSS_CONTRACT_REFERENCE
    http_status: 409
    applies_to: "POST /work-packages/{id}/material-issues; POST /assignments/{id}/production-entries; POST /work-packages/{id}/inspections"

  - priority: 11
    category: business_fiscal
    check: "Billing periods of non-VOID invoices of the same work package must not overlap: a.period_start > b.period_end OR b.period_start > a.period_end required"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /work-packages/{work_package_id}/invoices"

  - priority: 11b
    category: business_fiscal
    check: "Invoice submit requires at least one line with total units > 0"
    error_id: ERR_NO_BILLABLE_UNITS
    http_status: 422
    applies_to: "POST /invoices/{invoice_id}/transition (to=SUBMITTED)"

  - priority: 11c
    category: business_fiscal
    check: "Material issue may not exceed stock on hand: quantity_issued <= StockItem.on_hand (equality allowed, on_hand may reach exactly 0)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /work-packages/{work_package_id}/material-issues"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [utility_name, contract_number, effective_start, effective_end, "retainage_pct?", "overrun_threshold_pct?", "quantity_cap_pct?"]
    output: Contract
    side_effects: ["status=DRAFT; defaults applied for omitted percentages"]

  - method: GET
    path: "/contracts/{contract_id}"
    description: "Get a contract"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{contract_id}/transition"
    description: "Contract transitions: to=ACTIVE (DRAFT->ACTIVE by CONTRACTOR_PM; SUSPENDED->ACTIVE resume by UTILITY_DISPATCHER); to=CLOSED (ACTIVE->CLOSED by CONTRACTOR_PM)"
    roles: [CONTRACTOR_PM, UTILITY_DISPATCHER]
    code: 200
    input: [to]
    output: Contract
    side_effects: ["activation locks bid items; resume gated on open incidents; suspension cascade defined in Contract state machine"]

  # --- BidItem ---
  - method: POST
    path: "/contracts/{contract_id}/bid-items"
    description: "Add a unit-price bid item (contract must be DRAFT)"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [item_code, description, unit, unit_price, estimated_quantity, "overrun_rate?"]
    output: BidItem
    side_effects: []

  - method: GET
    path: "/bid-items"
    description: "List bid items, optionally filtered by contract"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: "BidItem[]"
    side_effects: []

  - method: GET
    path: "/bid-items/{bid_item_id}"
    description: "Get a single bid item (includes accepted_quantity and billed_quantity)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: BidItem
    side_effects: []

  # --- WorkPackage ---
  - method: POST
    path: "/contracts/{contract_id}/work-packages"
    description: "Create a work package (contract must be ACTIVE)"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [name, location, "requires_outage?"]
    output: WorkPackage
    side_effects: ["status=PLANNED"]

  - method: GET
    path: "/work-packages"
    description: "List work packages, optionally filtered by contract"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "WorkPackage[]"
    side_effects: []

  - method: GET
    path: "/work-packages/{work_package_id}"
    description: "Get a work package (includes rework_open_count, open_material_issue_count, version)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: WorkPackage
    side_effects: []

  - method: POST
    path: "/work-packages/{work_package_id}/transition"
    description: "Work package transitions: to=MOBILIZED|IN_PROGRESS|PUNCH|COMPLETED|CANCELLED"
    roles: [CONTRACTOR_PM]
    code: 200
    input: [to]
    output: WorkPackage
    side_effects: ["per WorkPackage state machine; COMPLETED gated on rework_open_count==0 and open_material_issue_count==0; increments WorkPackage.version by 1"]

  # --- Crew / Equipment ---
  - method: POST
    path: "/crews"
    description: "Register a crew"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [crew_code, crew_type, base_rate_per_hour, "home_depot?"]
    output: Crew
    side_effects: ["status computes to AVAILABLE"]

  - method: GET
    path: "/crews"
    description: "List crews (computed status visible)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["crew_type?", "status?", "limit?", "offset?"]
    output: "Crew[]"
    side_effects: []

  - method: GET
    path: "/crews/{crew_id}"
    description: "Get a single crew (includes computed status)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: POST
    path: "/equipment"
    description: "Register equipment"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [equipment_code, kind, daily_rate, "maintenance_flag?"]
    output: Equipment
    side_effects: ["status computes to AVAILABLE"]

  - method: GET
    path: "/equipment"
    description: "List equipment (computed status visible)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  - method: GET
    path: "/equipment/{equipment_id}"
    description: "Get a single equipment item (includes computed status)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/work-packages/{work_package_id}/assignments"
    description: "Assign a crew + equipment to a work package over a closed date interval"
    roles: [FOREMAN]
    code: 201
    input: [crew_id, equipment_id, start_date, end_date]
    output: Assignment
    side_effects: ["status=PLANNED; increments WorkPackage.version by 1"]

  - method: GET
    path: "/assignments"
    description: "List assignments with filters (reverse-reachability for crew_id/equipment_id/work_package_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "crew_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{assignment_id}"
    description: "Get an assignment (includes current version for OCC)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{assignment_id}/transition"
    description: "Assignment transitions: to=ACTIVE|COMPLETED|CANCELLED"
    roles: [FOREMAN]
    code: 200
    input: [to]
    output: Assignment
    side_effects: ["per Assignment state machine; increments Assignment.version by 1"]

  # --- ProductionEntry ---
  - method: POST
    path: "/assignments/{assignment_id}/production-entries"
    description: "Report daily production against a bid item (OCC on Assignment.version)"
    roles: [FOREMAN]
    code: 201
    input: [bid_item_id, work_date, quantity_reported, expected_assignment_version]
    output: ProductionEntry
    side_effects: ["status=SUBMITTED; increments Assignment.version by 1"]

  - method: GET
    path: "/production-entries"
    description: "List production entries with filters (reverse-reachability for assignment_id/bid_item_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["assignment_id?", "bid_item_id?", "status?", "limit?", "offset?"]
    output: "ProductionEntry[]"
    side_effects: []

  - method: POST
    path: "/production-entries/{production_entry_id}/resubmit"
    description: "Resubmit a REWORK_REQUIRED entry after rework (re-applies quantity cap)"
    roles: [FOREMAN]
    code: 200
    input: []
    output: ProductionEntry
    side_effects: ["status=SUBMITTED; rework_count+1; WorkPackage.rework_open_count-1; DRAFT invoice hold_reason may clear"]

  - method: POST
    path: "/production-entries/{production_entry_id}/void"
    description: "Void a SUBMITTED or REWORK_REQUIRED entry"
    roles: [FOREMAN]
    code: 200
    input: []
    output: ProductionEntry
    side_effects: ["status=VOID; rework_open_count adjusted when voiding REWORK_REQUIRED"]

  - method: GET
    path: "/production-entries/{production_entry_id}"
    description: "Get a single production entry (status, rework_count)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: ProductionEntry
    side_effects: []

  # --- StockItem ---
  - method: POST
    path: "/contracts/{contract_id}/stock-items"
    description: "Register a utility-owned stock item with an opening balance"
    roles: [UTILITY_DISPATCHER]
    code: 201
    input: [material_code, description, uom, "initial_on_hand?"]
    output: StockItem
    side_effects: ["on_hand := initial_on_hand"]

  - method: POST
    path: "/stock-items/{stock_item_id}/receipts"
    description: "Receive additional utility stock"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: [quantity]
    output: StockItem
    side_effects: ["on_hand += quantity; increments StockItem.version by 1"]

  - method: GET
    path: "/stock-items"
    description: "List stock items, optionally filtered by contract"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: "StockItem[]"
    side_effects: []

  - method: GET
    path: "/stock-items/{stock_item_id}"
    description: "Get a stock item (includes on_hand)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: StockItem
    side_effects: []

  # --- MaterialIssue ---
  - method: POST
    path: "/work-packages/{work_package_id}/material-issues"
    description: "Issue material from utility stock to a work package"
    roles: [FOREMAN]
    code: 201
    input: [stock_item_id, quantity_issued]
    output: MaterialIssue
    side_effects: ["StockItem.on_hand -= quantity_issued; WorkPackage.open_material_issue_count += 1; status=OPEN"]

  - method: GET
    path: "/material-issues"
    description: "List material issues with filters (reverse-reachability for work_package_id/stock_item_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "stock_item_id?", "status?", "limit?", "offset?"]
    output: "MaterialIssue[]"
    side_effects: []

  - method: POST
    path: "/material-issues/{material_issue_id}/return"
    description: "Return unused material to utility stock"
    roles: [FOREMAN]
    code: 200
    input: [quantity]
    output: MaterialIssue
    side_effects: ["quantity_returned += quantity; StockItem.on_hand += quantity"]

  - method: POST
    path: "/material-issues/{material_issue_id}/reconcile"
    description: "Reconcile an issue: exact match (FOREMAN) -> RECONCILED; non-zero variance requires CONTRACTOR_PM + variance_note -> VARIANCE_RECONCILED"
    roles: [FOREMAN, CONTRACTOR_PM]
    code: 200
    input: [quantity_installed, "variance_note?"]
    output: MaterialIssue
    side_effects: ["quantity_installed and variance recorded; WorkPackage.open_material_issue_count -= 1"]

  - method: GET
    path: "/material-issues/{material_issue_id}"
    description: "Get a single material issue (quantities, variance, status)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: MaterialIssue
    side_effects: []

  # --- Inspection ---
  - method: POST
    path: "/work-packages/{work_package_id}/inspections"
    description: "Schedule a utility-standard inspection of a SUBMITTED production entry"
    roles: [UTILITY_INSPECTOR]
    code: 201
    input: [production_entry_id, standard_code]
    output: Inspection
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/inspections/{inspection_id}/submit"
    description: "Submit inspection result (PASS|FAIL); drives the production entry accept/rework cascade"
    roles: [UTILITY_INSPECTOR]
    code: 200
    input: [result]
    output: Inspection
    side_effects: ["ProductionEntry -> ACCEPTED or REWORK_REQUIRED with cascades per state machines"]

  - method: GET
    path: "/inspections"
    description: "List inspections with filters (reverse-reachability for work_package_id/production_entry_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "production_entry_id?", "result?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/inspections/{inspection_id}"
    description: "Get a single inspection"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # --- OutageRequest ---
  - method: POST
    path: "/work-packages/{work_package_id}/outage-requests"
    description: "Request an outage/switching window for a circuit"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [circuit_id, window_start, window_end]
    output: OutageRequest
    side_effects: ["status=REQUESTED"]

  - method: POST
    path: "/outage-requests/{outage_request_id}/decide"
    description: "Utility decision: APPROVED (runs 60-minute buffer check; adopts requested window when CHANGE_REQUESTED) | DENIED"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: [decision]
    output: OutageRequest
    side_effects: ["status -> APPROVED or DENIED"]

  - method: POST
    path: "/outage-requests/{outage_request_id}/request-change"
    description: "Propose a new window for an APPROVED outage (moves to CHANGE_REQUESTED; re-approval required)"
    roles: [CONTRACTOR_PM]
    code: 200
    input: [window_start, window_end]
    output: OutageRequest
    side_effects: ["status=CHANGE_REQUESTED; requested_window_* stored"]

  - method: POST
    path: "/outage-requests/{outage_request_id}/release"
    description: "Release an IN_EFFECT outage back to the utility"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: []
    output: OutageRequest
    side_effects: ["status=RELEASED"]

  - method: POST
    path: "/outage-requests/{outage_request_id}/cancel"
    description: "Cancel a REQUESTED/APPROVED/CHANGE_REQUESTED outage"
    roles: [CONTRACTOR_PM]
    code: 200
    input: []
    output: OutageRequest
    side_effects: ["status=CANCELLED"]

  - method: GET
    path: "/outage-requests"
    description: "List outage requests with filters (reverse-reachability for work_package_id FK)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "circuit_id?", "status?", "limit?", "offset?"]
    output: "OutageRequest[]"
    side_effects: ["lazy IN_EFFECT evaluation on read against the logical clock"]

  - method: GET
    path: "/outage-requests/{outage_request_id}"
    description: "Get a single outage request (window and status; lazy IN_EFFECT evaluation applies)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: OutageRequest
    side_effects: []

  # --- StormActivation ---
  - method: POST
    path: "/contracts/{contract_id}/storm-activations"
    description: "Place a crew on storm STANDBY or CALLOUT"
    roles: [UTILITY_DISPATCHER]
    code: 201
    input: [crew_id, kind, activation_date]
    output: StormActivation
    side_effects: ["status=ACTIVE; converted=false; Crew.status recompute"]

  - method: POST
    path: "/storm-activations/{storm_activation_id}/convert"
    description: "Convert a STANDBY activation to CALLOUT"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: []
    output: StormActivation
    side_effects: ["kind := CALLOUT; converted := true; Crew.status recompute"]

  - method: POST
    path: "/storm-activations/{storm_activation_id}/close"
    description: "Close an activation, recording hours and computing premium_pay"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: [hours_standby, hours_worked]
    output: StormActivation
    side_effects: ["premium_pay computed per storm_premium_pay; status=CLOSED; Crew.status recompute"]

  - method: POST
    path: "/storm-activations/{storm_activation_id}/cancel"
    description: "Cancel an ACTIVE activation without closing hours"
    roles: [UTILITY_DISPATCHER]
    code: 200
    input: []
    output: StormActivation
    side_effects: ["status=CANCELLED; Crew.status recompute"]

  - method: GET
    path: "/storm-activations"
    description: "List storm activations with filters (reverse-reachability for contract_id/crew_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["contract_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: "StormActivation[]"
    side_effects: []

  - method: GET
    path: "/storm-activations/{storm_activation_id}"
    description: "Get a single storm activation (kind, converted, hours, premium_pay)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: StormActivation
    side_effects: []

  # --- SafetyEvent ---
  - method: POST
    path: "/work-packages/{work_package_id}/safety-events"
    description: "Log a safety observation or incident; INCIDENT with severity OSHA_RECORDABLE|FATAL suspends the contract"
    roles: [SAFETY_OFFICER]
    code: 201
    input: [kind, severity, description, "crew_id?"]
    output: SafetyEvent
    side_effects: ["status=OPEN; on INCIDENT with severity IN {OSHA_RECORDABLE, FATAL}: Contract ACTIVE->SUSPENDED with full cascade (assignments and outage requests cancelled)"]

  - method: POST
    path: "/safety-events/{safety_event_id}/transition"
    description: "Safety event review flow: to=UNDER_REVIEW|CLOSED"
    roles: [SAFETY_OFFICER]
    code: 200
    input: [to]
    output: SafetyEvent
    side_effects: []

  - method: GET
    path: "/safety-events"
    description: "List safety events with filters (reverse-reachability for work_package_id/crew_id FKs)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "crew_id?", "kind?", "status?", "limit?", "offset?"]
    output: "SafetyEvent[]"
    side_effects: []

  - method: GET
    path: "/safety-events/{safety_event_id}"
    description: "Get a single safety event"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: SafetyEvent
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/work-packages/{work_package_id}/invoices"
    description: "Create a DRAFT progress-billing invoice for a period (OCC on WorkPackage.version)"
    roles: [CONTRACTOR_PM]
    code: 201
    input: [period_start, period_end, expected_work_package_version]
    output: Invoice
    side_effects: ["lines computed (final variant); increments WorkPackage.version by 1"]

  - method: GET
    path: "/invoices"
    description: "List invoices with filters (reverse-reachability for work_package_id FK)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: ["work_package_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Get an invoice (lines, subtotal, retainage_amount, amount_due, hold_reason, status)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT invoices recompute lines on read"]

  - method: POST
    path: "/invoices/{invoice_id}/transition"
    description: "Invoice transitions: to=SUBMITTED (CONTRACTOR_PM) | APPROVED (UTILITY_INSPECTOR) | REJECTED (UTILITY_INSPECTOR) | PAID (UTILITY_DISPATCHER) | DRAFT revise (CONTRACTOR_PM) | VOID (CONTRACTOR_PM)"
    roles: [CONTRACTOR_PM, UTILITY_INSPECTOR, UTILITY_DISPATCHER]
    code: 200
    input: [to]
    output: Invoice
    side_effects: ["per Invoice state machine: submit freezes lines and debits billable pool; revise/void restore pool"]

  - method: GET
    path: "/work-packages/{work_package_id}/billing-preview"
    description: "Computed read: transient Invoice-shaped preview of billable units and amounts for a period; variant=final (ACCEPTED only) or provisional (SUBMITTED+ACCEPTED)"
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER]
    code: 200
    input: [period_start, period_end, "variant?"]
    output: Invoice
    side_effects: []

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [CONTRACTOR_PM, FOREMAN, UTILITY_INSPECTOR, UTILITY_DISPATCHER, SAFETY_OFFICER]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["APPROVED OutageRequests whose window contains the new time auto-transition to IN_EFFECT; Crew/Equipment computed statuses re-evaluate against the new date"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or non-positive quantity/rate" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_assignment_version / expected_work_package_version does not match the parent's current version" }
  - { id: ERR_CONTRACT_SUSPENDED, http: 409, condition: "Contract is SUSPENDED (safety stop-work); operational writes blocked" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract is DRAFT or CLOSED; operation requires ACTIVE" }
  - { id: ERR_BID_ITEMS_LOCKED, http: 409, condition: "Bid item schedule is immutable once the contract has left DRAFT" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a valid source state for the requested transition or action" }
  - { id: ERR_OUTAGE_REQUIRED, http: 409, condition: "Work package requires outage coverage but no IN_EFFECT OutageRequest covers the production entry's work_date" }
  - { id: ERR_EQUIPMENT_DOWN, http: 409, condition: "Equipment maintenance_flag is true; cannot be assigned" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Crew already has a PLANNED/ACTIVE assignment whose closed date interval overlaps the requested one" }
  - { id: ERR_EQUIPMENT_SCHEDULE_CONFLICT, http: 409, condition: "Equipment already has a PLANNED/ACTIVE assignment whose closed date interval overlaps the requested one" }
  - { id: ERR_OUTAGE_WINDOW_CONFLICT, http: 409, condition: "Outage window is within the 60-minute clearance buffer of another APPROVED/IN_EFFECT outage on the same circuit" }
  - { id: ERR_DUPLICATE_ACTIVE_STANDBY, http: 409, condition: "Crew already has an ACTIVE storm activation" }
  - { id: ERR_CREW_ON_STORM_DUTY, http: 409, condition: "Crew has an ACTIVE storm activation and cannot take a regular assignment" }
  - { id: ERR_INSPECTION_ALREADY_OPEN, http: 409, condition: "A SCHEDULED inspection already exists for this production entry" }
  - { id: ERR_QUANTITY_CAP_EXCEEDED, http: 422, condition: "Cumulative reported units would exceed estimated_quantity x quantity_cap_pct" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end before start, or outage window_end <= window_start" }
  - { id: ERR_RETURN_EXCEEDS_ISSUED, http: 409, condition: "Return would push quantity_returned above quantity_issued" }
  - { id: ERR_MATERIAL_VARIANCE_UNRESOLVED, http: 409, condition: "Non-zero reconciliation variance without CONTRACTOR_PM role and variance_note" }
  - { id: ERR_OPEN_REWORK, http: 409, condition: "Work package has production entries in REWORK_REQUIRED; completion/invoice submission blocked" }
  - { id: ERR_OPEN_MATERIAL_ISSUES, http: 409, condition: "Work package has OPEN material issues; completion blocked" }
  - { id: ERR_SAFETY_EVENT_OPEN, http: 409, condition: "An INCIDENT safety event is still OPEN or UNDER_REVIEW; contract resume blocked" }
  - { id: ERR_OPEN_WORK_PACKAGES, http: 409, condition: "Non-terminal work packages remain; contract close blocked" }
  - { id: ERR_CROSS_CONTRACT_REFERENCE, http: 409, condition: "Referenced entity belongs to a different contract than the work package" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "Period overlaps another non-VOID invoice of the same work package" }
  - { id: ERR_NO_BILLABLE_UNITS, http: 422, condition: "Invoice has no line with units > 0 at submission" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "quantity_issued exceeds StockItem.on_hand" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CONTRACTOR_PM
    description: "Contractor project manager: owns contract setup, work packages, crews, equipment, outage requests, and progress billing"
    identity: opaque
    exclusive_operations:
      - "POST /contracts; POST /contracts/{id}/bid-items; POST /contracts/{id}/work-packages"
      - "POST /work-packages/{id}/transition"
      - "POST /crews; POST /equipment"
      - "POST /work-packages/{id}/outage-requests; POST /outage-requests/{id}/request-change; POST /outage-requests/{id}/cancel"
      - "POST /work-packages/{id}/invoices; invoice transition to SUBMITTED/DRAFT/VOID"
      - "Material-issue reconcile with variance (variance_note)"
    shared_operations:
      - "GET endpoints; POST /_clock/set_current_utc; POST /material-issues/{id}/reconcile (exact match)"

  - name: FOREMAN
    description: "Contractor field foreman: crew/equipment assignments, daily production, material issuance and returns"
    identity: opaque
    exclusive_operations:
      - "POST /work-packages/{id}/assignments; POST /assignments/{id}/transition"
      - "POST /assignments/{id}/production-entries; POST /production-entries/{id}/resubmit; POST /production-entries/{id}/void"
      - "POST /work-packages/{id}/material-issues; POST /material-issues/{id}/return"
    shared_operations:
      - "GET endpoints; POST /_clock/set_current_utc; POST /material-issues/{id}/reconcile (exact match only)"

  - name: UTILITY_INSPECTOR
    description: "Utility inspector: schedules and submits standard inspections; approves or rejects invoices"
    identity: opaque
    exclusive_operations:
      - "POST /work-packages/{id}/inspections; POST /inspections/{id}/submit"
      - "Invoice transition to APPROVED / REJECTED"
    shared_operations:
      - "GET endpoints; POST /_clock/set_current_utc"

  - name: UTILITY_DISPATCHER
    description: "Utility dispatcher: manages utility stock, outage decisions and releases, storm activations, invoice payment, contract resume"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{id}/stock-items; POST /stock-items/{id}/receipts"
      - "POST /outage-requests/{id}/decide; POST /outage-requests/{id}/release"
      - "POST /contracts/{id}/storm-activations; POST /storm-activations/{id}/convert; POST /storm-activations/{id}/close; POST /storm-activations/{id}/cancel"
      - "Invoice transition to PAID; contract transition to ACTIVE from SUSPENDED (resume)"
    shared_operations:
      - "GET endpoints; POST /_clock/set_current_utc"

  - name: SAFETY_OFFICER
    description: "Safety officer: logs safety observations and incidents and drives their review lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /work-packages/{id}/safety-events; POST /safety-events/{id}/transition"
    shared_operations:
      - "GET endpoints; POST /_clock/set_current_utc"
