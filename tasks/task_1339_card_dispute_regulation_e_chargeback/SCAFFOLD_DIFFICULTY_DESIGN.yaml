          setup:
            - "Old account; two VISA ECOMMERCE txns 7000 posted 2026-07-01; two non-fraud disputes received 2026-08-03 (deadline 2026-09-17T23:59:59Z), classified, both credits granted (so the provisional-credit compliance rule does not fire)"
