        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.TransferCase.AWAITING_ACCEPTANCE_to_ACCEPTED]
        distinguishing_aspect: "Immediate consistency: the accept RESPONSE ITSELF carries status ACCEPTED and the new active_bed_hold_id (no re-read needed), and the certify response carries status CERTIFIED with the mirrored case transition visible on the next read."
        test_recipe:
          setup: ["EMTALA_DETERMINED case addressed to RCV (one AVAILABLE ICU bed)"]
          setup_api_calls:
            - call: "POST /facilities"
