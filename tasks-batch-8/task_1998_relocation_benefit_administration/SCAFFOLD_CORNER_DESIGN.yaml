              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412; the confirm advanced RelocationCase.version past the captured value)"
            - "MoveAssignment.${ma_id}.status == ESTIMATE_SUBMITTED (unchanged)"
            - "RelocationCase.${case_id}.total_committed_cents == 30000 (only the booking committed)"

