      - name: suspension_ledger_threshold_is_strictly_greater_and_crossed_by_one_cent
        grounds:
          - calculations.brand_posture
          - calculations.brand_penalty_ledger
          - calculations.marking_penalty_assessment
          - entities.Brand.fields.outstanding_penalty_usd
          - entities.Brand.fields.posture
        distinguishing_aspect: |
          PENALTY_SUSPEND_LEDGER_USD is compared with a STRICT greater-than, so a ledger of exactly 25000.00 leaves the brand OPEN and a second entry worth one cent - assessed at 0.01 because its own review still sees the pre-suspension posture - pushes the ledger to 25000.01 and flips the brand to SUSPENDED; an implementation using >= suspends on the first entry and then assesses the second on the statutory basis instead.
        test_recipe:
          setup:
            - "Market US is registered with marking_duty_rate 0.100."
            - "Brand Northline Apparel Co starts at posture OPEN with outstanding_penalty_usd 0.00 and has no audits at all."
            - "Entry ENT-4001 declares 250000.00 USD over 12000 units, so its ad valorem penalty is exactly 25000.00; entry ENT-4002 declares 0.10 USD over 1 unit."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-4001", quantity_units: 12000, declared_value_usd: 250000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh1_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-4002", quantity_units: 1, declared_value_usd: 0.10, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh2_id: $.data.id }
          trigger:
            - call: "POST /labeling/import-shipments/${sh1_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
              captures: { sh1_assessed: $.data.penalty_assessed_usd, sh1_basis: $.data.assessment_basis }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { ledger_at_boundary: $.data.outstanding_penalty_usd, posture_at_boundary: $.data.posture }
            - call: "POST /labeling/import-shipments/${sh2_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
              captures: { sh2_posture_at_review: $.data.posture_at_review, sh2_assessed: $.data.penalty_assessed_usd, sh2_basis: $.data.assessment_basis }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { ledger_over: $.data.outstanding_penalty_usd, posture_over: $.data.posture }
          assert:
            - "${sh1_assessed} == 25000.00 and ${sh1_basis} == \"AD_VALOREM\""
            - "${ledger_at_boundary} == 25000.00 and ${posture_at_boundary} == \"OPEN\""
            - "${sh2_posture_at_review} == \"OPEN\""
            - "${sh2_assessed} == 0.01 and ${sh2_basis} == \"AD_VALOREM\""
            - "ImportShipment.${sh2_id}.penalty_statutory_usd == 0.08 (the 0.80 cap on declared value beats the 1.25 per-unit figure)"
            - "${ledger_over} == 25000.01 and ${posture_over} == \"SUSPENDED\""

      - name: severity_escalation_and_restrict_threshold_are_both_inclusive
        grounds:
