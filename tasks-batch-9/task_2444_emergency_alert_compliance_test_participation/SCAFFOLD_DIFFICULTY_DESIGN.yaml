  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: readiness_threshold_inclusive_at_exactly_80_and_single_end_rounding
        grounds:
          - "§1.3 calculations.test_event_readiness_score: 'status = READY if readiness_score >= READINESS_PASS_MIN else READINESS_PENDING   # inclusive at the boundary'"
          - "§1.3 constants READY_DEVICE_WEIGHT=40, SOURCE_COVERAGE_WEIGHT=40, RECENT_ALERT_WEIGHT=20, RECENT_ALERT_TARGET=3, RECENT_ALERT_WINDOW_DAYS=30, READINESS_PASS_MIN=80.00"
          - "§1.3 precision '2 decimal places, round_half_up, rounded once after the weighted sum'"
          - "§1.3 input_set 'DECOMMISSIONED devices leave the denominator'"
        distinguishing_aspect: "Three probes pin the threshold and the rounding independently: exactly 80.00 passes (inclusive, so a strict `>` implementation fails here), 60.00 fails once a second REGISTERED device enters the denominator, and 86.67 proves the weighted sum is rounded exactly once at the end (40 + 40 + 20 * 1/3 = 86.6666...; rounding the alert term first would give 86.60 or 86.80)."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring only PEP, activated; station KWEA; dev1 readiness-checked to READY; ma1 PEP/WXPEP ACTIVE so source_coverage_ratio is 1/1."
            - "Three test events with pairwise disjoint half-open windows: te1 [2026-08-12T00:00Z, 01:00Z), te2 [2026-08-13T00:00Z, 01:00Z), te3 [2026-08-14T00:00Z, 01:00Z)."
