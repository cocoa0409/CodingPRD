  # ===========================================================================
  - section: errors
    instances:
      - name: error_stale_version_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[purchase-authorize-stale-account]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / authorize_requires_provider_enrolled_and_account_active
          rationale: "ERR_STALE_VERSION OCC is exercised directly in the cross-cutting OCC corner below (occ_stale_account_version_on_authorize); the difficulty index also relies on version captures throughout, so the catalog entry is covered."
      - name: error_invalid_state_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_settle_refunded_purchase
          rationale: "ERR_INVALID_STATE is the asserted outcome of the §1.8 state-vs-fiscal priority instance."
      - name: error_temporal_conflict_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_TEMPORAL_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / provider_promotion_half_open_window_overlap_rejected
          rationale: "ERR_TEMPORAL_CONFLICT is asserted by the §1.8 provider-promotion overlap instance."
      - name: error_account_not_eligible_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_ACCOUNT_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / authorize_requires_provider_enrolled_and_account_active
          rationale: "ERR_ACCOUNT_NOT_ELIGIBLE is asserted by the §1.8 suspended-provider authorize instance."

