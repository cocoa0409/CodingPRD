      - name: scoring_a_plan_with_no_eligible_alternative_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_ALTERNATIVES
          - calculations.workout_alternative_ranking
          - state_machines.WorkoutPlan.DRAFT_to_SCORED
        distinguishing_aspect: "The eligible pool, not the row count, is what the guard tests. An empty plan is refused; then a superseded alternative with the HIGHER net present value is excluded from the pool, so the surviving lower-value alternative becomes the rank-1 recommendation. If the implementation scored all rows, it would recommend the superseded 5,455,555.56 modification instead of the 4,579,629.63 note sale."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a loan in SPECIAL_SERVICING with a fresh DRAFT plan at 8.0% CONTRACTUAL and no alternatives."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V39", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V39", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "RECEIVERSHIP", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "receiver appointed over the property" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 8.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { empty_pool_error: "$.data.error_id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 6000000 }], upfront_cost_usd: 100000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_a_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "NOTE_SALE", projected_cash_flows: [{ period_index: 1, amount_usd: 5000000 }], upfront_cost_usd: 50000, supersedes_alternative_id: "${alt_a_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_b_id: "$.data.id", alt_b_type: "$.data.alternative_type" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { scored_status: "$.data.status", recommended_alt: "$.data.recommended_alternative_id" }
            - call: "GET /special-servicing/workout-alternatives/${alt_a_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_a_status: "$.data.status", alt_a_npv: "$.data.npv_usd" }
            - call: "GET /special-servicing/workout-alternatives/${alt_b_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_b_status: "$.data.status", alt_b_npv: "$.data.npv_usd" }
          assert:
            - "Scoring the empty plan returns HTTP 422 with error_id ERR_NO_ALTERNATIVES and the plan stays DRAFT with an unchanged version"
            - "Alternative A's stand-alone value would be round(6,000,000.00 / 1.08, 2) = 5555555.56 less 100,000.00 = 5455555.56 — the largest number in the fixture"
            - "Alternative B supersedes A, so A is excluded from the pool and B is scored at round(5,000,000.00 / 1.08, 2) = 4629629.63 less 50,000.00 = 4579629.63"
            - "The second scoring attempt returns 200 with status SCORED and recommended_alternative_id == ${alt_b_id} — the lower-value survivor wins because the higher-value row is superseded"
            - "Alternative A is in its superseded status with no npv written; only pool members are scored"
            - "Both attempts used the identical request body: the difference is entirely in the eligible pool"

      - name: workout_fee_rejected_unless_the_loan_was_corrected_under_a_plan
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WORKOUT_FEE_NOT_ELIGIBLE
          - validations.priority_29_workout_fee_eligibility
          - calculations.workout_fee_accrual
        distinguishing_aspect: "The eligibility predicate is a conjunction and each conjunct is falsified separately: a loan still in SPECIAL_SERVICING fails the servicing_status half while carrying no correction plan, and a loan that never left MASTER_SERVICING fails the correction_source_plan_id half while satisfying the status half. Both return the same 409, so the code is not a proxy for either single condition."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one trust with two loans — loan X transferred into SPECIAL_SERVICING, loan Y never transferred at all."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V40", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V40-X", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_x_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V40-Y", original_balance_usd: 8000000, current_principal_balance_usd: 7000000, note_rate_pct: 5.75, monthly_debt_service_usd: 45000, maturity_date: "2029-09-01T00:00:00Z", securitization_value_usd: 9000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_y_id: "$.data.id", loan_y_status: "$.data.servicing_status", loan_y_correction: "$.data.correction_source_plan_id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_x_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_x_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_x_status: "$.data.servicing_status" }
          trigger:
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_x_id}", fee_type: "WORKOUT_FEE", collection_amount_usd: 200000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { in_special_error: "$.data.error_id" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_y_id}", fee_type: "WORKOUT_FEE", collection_amount_usd: 200000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { never_corrected_error: "$.data.error_id" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_x_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { ssf_id: "$.data.id", ssf_amount: "$.data.amount_usd" }
            - call: "GET /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_x_id}" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { only_fee_type: "$.data[0].fee_type" }
          assert:
            - "Loan Y is in MASTER_SERVICING with correction_source_plan_id null; loan X is in SPECIAL_SERVICING, also with correction_source_plan_id null"
            - "The WORKOUT_FEE on loan X returns HTTP 409 with error_id ERR_WORKOUT_FEE_NOT_ELIGIBLE — the status conjunct fails"
            - "The WORKOUT_FEE on loan Y returns the same HTTP 409 ERR_WORKOUT_FEE_NOT_ELIGIBLE — the correction-plan conjunct fails even though the status is MASTER_SERVICING"
            - "Neither refusal created a FeeAccrual row and Loan.fees_payable_usd is 0.00 on both loans"
            - "A SPECIAL_SERVICING_FEE on the same loan X in the same state is accepted at 2083.33, so the refusal is specific to the workout fee and not a blanket ban"
            - "The fee list for loan X returns exactly one row, of fee_type SPECIAL_SERVICING_FEE"

      - name: workout_fee_after_a_liquidation_fee_returns_the_conflict_code
        claim_type: error_triggerable
        grounds:
