# =============================================================================
# Task 1216: Master-Planned Community Developer Operations — Seed Tables
# Difficulty target: beyond-expert (maximal entity graph depth, many interacting
# state machines, dense calculation rules, adversarial corners, deep RBAC)
# =============================================================================

scenario: |
  1216. Master-Planned Community Developer Operations (master-planned community developer): phase plan & amenity delivery schedule, builder lot sales agreement & takedown compliance, community association declarant control & transition plan, amenity operations budget & assessment setting, marketing/lifestyle programming & sales center, infrastructure reimbursement district accounting, design guideline enforcement during build-out, resident communication & transition to owner control

domain_name: master-planned-community-developer
api_prefix: /mpc

complexity_profile:
  primary_archetype: quota_allocation          # takedown tranches: finite committed-lot pool, scheduled obligations, waterfall crediting, default/cure
  secondary_archetype: posture_driven_gating   # community transition_stage derived from closed-unit ratio gates governance powers
  complexity_layers:
    - optimistic_concurrency                   # OCC on LotPurchaseAgreement.version and AssociationBudget.version for superseding amendments
    - cascading_side_effects                   # closing -> phase count -> amenity delinquency -> event cancellation; certify-default -> agreement -> builder -> other agreements
    - dual_variant_calculation                 # district interest (simple provisional vs daily-compound certified); assessment (uniform vs declarant subsidy)
    - rate_threshold_triggers                  # declarant-control thresholds at 25/50/75/100 percent; statutory assessment cap at 20.00
  entity_topology: flat                        # peer collections under /mpc, foreign keys in bodies, filtered-list reverse lookups
  state_machine_shape: compound                # community/board posture derived from children; cyclic (design review, tranche cure, violation appeal, election lapse) + guarded transitions
  relationship_patterns:
    - one_to_many
    - many_to_many                             # Builder x DevelopmentPhase via LotPurchaseAgreement
    - self_referential                         # AssociationBudget.amendment_of_id, ResidentNotice.supersedes_notice_id, AssessmentRate.prior_rate_id
    - cross_aggregate                          # CommunityEvent.charged_budget_id -> AssociationBudget; TakedownTranche crediting across LotClosing
  role_model: segregation_of_duties            # budget proposer != adopter != ratifier; payment requester != certifier; reviewer rotation; fine levy != appeal resolver
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (23 entities)
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: community_name, type: string, source: input, description: "Community legal/marketing name" }
      - { name: total_planned_units, type: integer, source: input, description: "Total residential units planned at full build-out; fixed divisor for assessments and transition ratios", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | TURNOVER_RECORDED", default: PLANNING }
      - { name: closed_unit_count, type: integer, source: computed, description: "Count of LotClosing rows in CLOSED status for this community", default: 0 }
      - { name: closed_unit_pct, type: number, source: computed, description: "round_half_up(closed_unit_count / total_planned_units * 100, 2)" }
      - { name: transition_stage, type: enum, source: computed, description: "DECLARANT_CONTROL | OWNER_REPRESENTATION | PARITY | OWNER_MAJORITY | TURNOVER_COMPLETE; monotone ratchet, never regresses once advanced" }

  - name: DevelopmentPhase
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: phase_name, type: string, source: input, description: "Phase name" }
      - { name: sequence_no, type: integer, source: input, description: "Phase ordering within community; unique per community", constraints: ">= 1" }
      - { name: planned_lot_count, type: integer, source: input, description: "Number of lots platted in this phase", constraints: ">= 1" }
      - { name: closed_lot_count, type: integer, source: computed, description: "Count of CLOSED LotClosing rows whose lot belongs to this phase", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED | SALES_OPEN | DELIVERING | CLOSED_OUT | CANCELLED", default: PLANNED }

  - name: Amenity
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: amenity_type, type: enum, source: input, description: "CLUBHOUSE | POOL | PARK | TRAIL_NETWORK | FITNESS_CENTER | EVENT_LAWN" }
      - { name: trigger_phase_id, type: string, source: input, description: "FK -> DevelopmentPhase.id; phase whose closed-lot count is compared to trigger_unit_count; nullable", constraints: "nullable; when present trigger_unit_count is required" }
      - { name: trigger_unit_count, type: integer, source: input, description: "Amenity must be OPEN before the trigger phase's closed_lot_count exceeds this count; nullable", constraints: "nullable; required iff trigger_phase_id present" }
      - { name: hard_deadline_date, type: datetime, source: input, description: "Statutory outside date; amenity DELINQUENT if not OPEN once logical clock passes it" }
      - { name: budgeted_cost_cents, type: integer, source: input, description: "Budgeted delivery cost in cents", constraints: ">= 0" }
      - { name: delinquency_recorded_at, type: datetime, source: system, description: "Timestamp the amenity entered DELINQUENT; null while never delinquent", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "COMMITTED | IN_DESIGN | UNDER_CONSTRUCTION | OPEN | DELINQUENT", default: COMMITTED }

  - name: Builder
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community this builder is credentialed for" }
      - { name: legal_name, type: string, source: input, description: "Builder legal name" }
      - { name: credit_tier, type: enum, source: input, description: "A | B | C" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | PROBATION | SUSPENDED", default: GOOD_STANDING }
      - { name: total_lots_purchased, type: integer, source: computed, description: "Count of CLOSED LotClosing rows across this builder's agreements", default: 0 }

  - name: LotPurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: builder_id, type: string, source: input, description: "FK -> Builder.id; purchasing builder" }
      - { name: phase_id, type: string, source: input, description: "FK -> DevelopmentPhase.id; phase whose lots this agreement draws from" }
      - { name: base_price_per_lot_cents, type: integer, source: input, description: "Base price per lot in cents at execution", constraints: "> 0" }
      - { name: annual_escalation_pct, type: number, source: input, description: "Annual price escalator percent, e.g. 6.0; applied per full anniversary of execution_date", constraints: ">= 0" }
      - { name: penalty_per_lot_per_day_cents, type: integer, source: input, description: "Late takedown penalty per deficit lot per day in cents", constraints: ">= 0" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents", constraints: ">= 0" }
      - { name: total_lots_committed, type: integer, source: input, description: "Total lots the builder commits to take down", constraints: ">= 1" }
      - { name: execution_date, type: datetime, source: system, description: "Logical-clock timestamp when agreement was executed; null until EXECUTED", constraints: "nullable" }
      - { name: lots_closed_count, type: integer, source: computed, description: "Count of CLOSED LotClosing rows for this agreement", default: 0 }
      - { name: forfeited_earnest_money_cents, type: integer, source: computed, description: "Earnest money forfeited on DEFAULTED; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | ACTIVE | COMPLETED | DEFAULTED | TERMINATED", default: DRAFT }

  - name: TakedownTranche
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LotPurchaseAgreement.id; owning agreement" }
      - { name: tranche_no, type: integer, source: input, description: "Tranche ordering within agreement; unique per agreement", constraints: ">= 1" }
      - { name: due_date, type: datetime, source: input, description: "Date by which lot_count_due lots must be closed" }
      - { name: lot_count_due, type: integer, source: input, description: "Lots due by due_date for this tranche (not cumulative)", constraints: ">= 1" }
      - { name: lots_credited, type: integer, source: computed, description: "Lots credited to this tranche by the closing waterfall", default: 0 }
      - { name: cure_deadline, type: datetime, source: computed, description: "= due_date + CURE_PERIOD_DAYS (14 days)" }
      - { name: accrued_penalty_cents, type: integer, source: computed, description: "min(PENALTY_CAP_PCT(25%) * lot_count_due * agreement.base_price_per_lot_cents, deficit_lots * penalty_per_lot_per_day_cents * days_late); deficit_lots = lot_count_due - lots_credited; days_late = calendar days since due_date, 0 while not MISSED", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | SATISFIED | MISSED | CURED | WAIVED | DEFAULTED | CANCELLED", default: SCHEDULED }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: computed, description: "FK -> Community.id; denormalized from the owning phase at creation" }
      - { name: phase_id, type: string, source: input, description: "FK -> DevelopmentPhase.id; owning phase" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; unique per community" }
      - { name: lot_premium_cents, type: integer, source: input, description: "Premium (view/corner/oversize) added to escalated base at closing", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PLATTED | OFFERED | UNDER_CONTRACT | CLOSED | WITHDRAWN", default: PLATTED }

  - name: LotClosing
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: computed, description: "FK -> Community.id; denormalized from agreement at creation" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LotPurchaseAgreement.id; agreement this closing draws against" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot being conveyed" }
      - { name: owner_resident_id, type: string, source: input, description: "FK -> Resident.id; purchasing resident (end-buyer); null for builder bulk holds", constraints: "nullable" }
      - { name: closing_date, type: datetime, source: system, description: "Logical-clock timestamp at close; null until CLOSED", constraints: "nullable" }
      - { name: escalated_base_cents, type: integer, source: computed, description: "round_half_up(base_price_per_lot_cents * (1 + annual_escalation_pct/100)^anniversaries, 0)" }
      - { name: premium_cents, type: integer, source: computed, description: "= lot.lot_premium_cents captured at close", default: 0 }
      - { name: price_cents, type: integer, source: computed, description: "= escalated_base_cents + premium_cents", default: 0 }
      - { name: credited_tranche_id, type: string, source: system, description: "FK -> TakedownTranche.id; tranche credited by the waterfall; null when is_surplus", constraints: "nullable" }
      - { name: is_surplus, type: boolean, source: computed, description: "true when no eligible tranche remained at close (over-takedown)", default: false }
      - { name: status, type: enum, source: system, description: "PENDING | CLOSED | CANCELLED | RESCINDED", default: PENDING }

  - name: AssociationBudget
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: fiscal_year, type: integer, source: input, description: "Budget fiscal year; only one non-SUPERSEDED budget per (community, fiscal_year)", constraints: ">= 2020" }
      - { name: amendment_of_id, type: string, source: system, description: "FK -> AssociationBudget.id; predecessor superseded by this amendment; null for original budgets", constraints: "nullable" }
      - { name: non_assessment_income_cents, type: integer, source: input, description: "Other income offsetting the assessment requirement", default: 0, constraints: ">= 0" }
      - { name: total_expense_cents, type: integer, source: computed, description: "Sum of all BudgetLineItem.amount_cents", default: 0 }
      - { name: reserve_cents, type: integer, source: computed, description: "Sum of BudgetLineItem.amount_cents where is_reserve is true", default: 0 }
      - { name: adopted_by_user_id, type: string, source: system, description: "X-User-ID that executed adopt; used for ratification segregation", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | PENDING_RATIFICATION | ADOPTED | REJECTED | SUPERSEDED", default: DRAFT }

  - name: BudgetLineItem
    parent: null
    common_fields: true
    fields:
      - { name: budget_id, type: string, source: input, description: "FK -> AssociationBudget.id; owning budget" }
      - { name: category, type: enum, source: input, description: "LANDSCAPE_MAINTENANCE | AMENITY_OPERATIONS | UTILITIES | MANAGEMENT | INSURANCE | RESERVE_CONTRIBUTION | EVENTS_PROGRAMMING | CONTINGENCY" }
      - { name: amount_cents, type: integer, source: input, description: "Line amount in cents", constraints: "> 0" }
      - { name: is_reserve, type: boolean, source: input, description: "True when this line funds the reserve account", default: false }

  - name: AssessmentRate
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: budget_id, type: string, source: input, description: "FK -> AssociationBudget.id; adopted budget this rate derives from" }
      - { name: fiscal_year, type: integer, source: input, description: "Rate year; must equal budget.fiscal_year; only one non-SUPERSEDED rate per (community, fiscal_year)" }
      - { name: subsidy_elected, type: boolean, source: input, description: "Declarant subsidizes the gap, freezing the owner rate at the prior year; only while transition_stage == DECLARANT_CONTROL", default: false }
      - { name: per_unit_annual_cents, type: integer, source: computed, description: "uniform: round_half_up((total_expense_cents - non_assessment_income_cents) / total_planned_units, 0); subsidy: prior year per_unit_annual_cents" }
      - { name: quarterly_installments_cents, type: array, source: computed, description: "[Q1,Q2,Q3,Q4]; Q1..Q3 = round_half_up(annual/4, 0), Q4 = annual - Q1 - Q2 - Q3" }
      - { name: prior_rate_id, type: string, source: system, description: "FK -> AssessmentRate.id; EFFECTIVE rate for fiscal_year - 1; null when none", constraints: "nullable" }
      - { name: prior_per_unit_cents, type: integer, source: computed, description: "prior rate per_unit_annual_cents; null when no prior rate", constraints: "nullable" }
      - { name: increase_pct, type: number, source: computed, description: "round_half_up((per_unit_annual_cents - prior_per_unit_cents) / prior_per_unit_cents * 100, 2); null when no prior rate", constraints: "nullable" }
      - { name: declarant_subsidy_cents, type: integer, source: computed, description: "subsidy variant: (total_expense - non_assessment_income) - per_unit_annual_cents * total_planned_units; 0 for uniform", default: 0 }
      - { name: cap_override_approved_by, type: string, source: system, description: "X-User-ID of AssociationDirector (or OwnerDirector post-turnover) who approved a cap override; null otherwise", constraints: "nullable" }
      - { name: cap_override_ratified_by, type: string, source: system, description: "X-User-ID of OwnerDirector who ratified the override; required when transition_stage in {PARITY, OWNER_MAJORITY}; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "CALCULATED | ARMED | EFFECTIVE | SUPERSEDED", default: CALCULATED }

  - name: ReimbursementDistrict
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community; at most one district per community" }
      - { name: district_name, type: string, source: input, description: "District name (MUD/PID/CFD style)" }
      - { name: interest_rate_annual_pct, type: number, source: input, description: "Annual interest rate on advances, e.g. 5.0", constraints: ">= 0" }
      - { name: advance_principal_cents, type: integer, source: computed, description: "Sum of all InfrastructureAdvance.amount_cents", default: 0 }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "advance_principal_cents minus certified principal portions of payments in CERTIFIED or PAID status; REJECTED restores", default: 0 }
      - { name: provisional_interest_cents, type: integer, source: computed, description: "Simple-interest accrual to the logical clock: sum over advances of round_half_up(amount * rate * days_outstanding/365, 0); days_outstanding measured advance_date -> now, 0 while advance_date >= now", default: 0 }
      - { name: certified_interest_to_date_cents, type: integer, source: computed, description: "Sum of certified_interest_cents over payments in CERTIFIED or PAID status", default: 0 }
      - { name: available_funds_cents, type: integer, source: computed, description: "Sum of COLLECTED DistrictLevy.amount_cents minus sum of amount_cents of PAID ReimbursementPayment rows", default: 0 }

  - name: InfrastructureAdvance
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> ReimbursementDistrict.id; owning district" }
      - { name: amount_cents, type: integer, source: input, description: "Advance principal in cents", constraints: "> 0" }
      - { name: advance_date, type: datetime, source: input, description: "Date funds were advanced; interest accrues from this date" }
      - { name: description, type: string, source: input, description: "Infrastructure description (roads, water, sewer)", constraints: "nullable", default: null }
      - { name: reimbursed_principal_cents, type: integer, source: computed, description: "Principal allocated to this advance by certified payment waterfalls (FIFO)", default: 0 }
      - { name: status, type: enum, source: computed, description: "OUTSTANDING | PARTIALLY_REIMBURSED | REIMBURSED; derived from reimbursed_principal_cents vs amount_cents" }

  - name: DistrictLevy
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> ReimbursementDistrict.id; owning district" }
      - { name: levy_year, type: integer, source: input, description: "Tax/assessment year of the levy; unique per district" }
      - { name: amount_cents, type: integer, source: input, description: "Levy amount in cents", constraints: "> 0" }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock timestamp when collected; null until COLLECTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | COLLECTED", default: PLANNED }

  - name: ReimbursementPayment
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> ReimbursementDistrict.id; owning district" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the DeclarantController who requested the payment" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed reimbursement amount in cents", constraints: "> 0" }
      - { name: certified_interest_cents, type: integer, source: computed, description: "Daily-compound interest certified at certification (interest-first waterfall, FIFO advances)", default: 0 }
      - { name: certified_principal_cents, type: integer, source: computed, description: "= amount_cents - certified_interest_cents", default: 0 }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of certification; null until CERTIFIED", constraints: "nullable" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CERTIFIED | PAID | REJECTED", default: REQUESTED }

  - name: DesignReviewApplication
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot the works apply to" }
      - { name: applicant_builder_id, type: string, source: input, description: "FK -> Builder.id; builder applicant; exactly one of applicant_builder_id / applicant_resident_id required", constraints: "nullable" }
      - { name: applicant_resident_id, type: string, source: input, description: "FK -> Resident.id; resident applicant; exactly one of applicant_builder_id / applicant_resident_id required", constraints: "nullable" }
      - { name: project_type, type: enum, source: input, description: "NEW_CONSTRUCTION | EXTERIOR_MODIFICATION | LANDSCAPE | ADDITION" }
      - { name: submission_round, type: integer, source: system, description: "Current review round, starts at 1; resubmit increments; MAX_REVIEW_ROUNDS = 3" }
      - { name: review_fee_cents, type: integer, source: computed, description: "0 for round 1; 25000 for round 2; 75000 for round 3", default: 0 }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the DesignReviewer holding the current review; null until UNDER_REVIEW", constraints: "nullable" }
      - { name: denied_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer who denied the latest round; resubmission review by the same user is rejected", constraints: "nullable" }
      - { name: conditions_text, type: string, source: system, description: "Conditions attached at CONDITIONALLY_APPROVED; null otherwise", constraints: "nullable" }
      - { name: construction_start_by, type: datetime, source: system, description: "= approval timestamp + CONSTRUCTION_START_WINDOW_DAYS (180); set on APPROVED; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | CONDITIONALLY_APPROVED | DENIED | RESUBMITTED | EXPIRED | WITHDRAWN; a DENIED application at round MAX_REVIEW_ROUNDS is terminal in practice (no resubmit path)", default: SUBMITTED }

  - name: DesignViolation
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot in violation" }
      - { name: respondent_resident_id, type: string, source: input, description: "FK -> Resident.id; resident respondent; exactly one of respondent_resident_id / respondent_builder_id required", constraints: "nullable" }
      - { name: respondent_builder_id, type: string, source: input, description: "FK -> Builder.id; builder respondent; exactly one of respondent_resident_id / respondent_builder_id required", constraints: "nullable" }
      - { name: violation_type, type: enum, source: input, description: "UNAPPROVED_MODIFICATION | NONCONFORMING_MATERIALS | SETBACK | LANDSCAPE_DEADLINE" }
      - { name: cure_deadline, type: datetime, source: system, description: "= notice timestamp + VIOLATION_CURE_DAYS (14); null until NOTICE_SENT", constraints: "nullable" }
      - { name: days_late, type: integer, source: computed, description: "calendar days from cure_deadline to min(cured_at, fined_at, now); 0 while not past deadline", default: 0 }
      - { name: fine_cents, type: integer, source: computed, description: "tiered accrual at levy-fine; frozen thereafter", default: 0 }
      - { name: cured_at, type: datetime, source: system, description: "Logical-clock timestamp of cure; null until CURED", constraints: "nullable" }
      - { name: fined_by_user_id, type: string, source: system, description: "X-User-ID of the AssociationDirector who levied the fine; appeal resolution by the same user is rejected", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REPORTED | NOTICE_SENT | CURED | ESCALATED | HEARING_SCHEDULED | FINED | PAID | APPEALED | DISMISSED", default: REPORTED }

  - name: CommunityEvent
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: venue, type: enum, source: input, description: "CLUBHOUSE | POOL_DECK | EVENT_LAWN | SALES_CENTER; CLUBHOUSE/POOL_DECK/EVENT_LAWN map to amenity types CLUBHOUSE/POOL/EVENT_LAWN and require that amenity OPEN" }
      - { name: start_at, type: datetime, source: input, description: "Event start (must be < end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Event end" }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed attendee count", constraints: ">= 1" }
      - { name: cost_cents, type: integer, source: input, description: "Event cost charged to the adopted budget EVENTS_PROGRAMMING line", default: 0, constraints: ">= 0" }
      - { name: charged_budget_id, type: string, source: input, description: "FK -> AssociationBudget.id; adopted budget charged; required when cost_cents > 0", constraints: "nullable" }
      - { name: confirmed_count, type: integer, source: computed, description: "Sum of party_size over CONFIRMED EventRsvp rows", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | SCHEDULED | COMPLETED | CANCELLED", default: PROPOSED }

  - name: EventRsvp
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CommunityEvent.id; event booked" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; resident booking" }
      - { name: party_size, type: integer, source: input, description: "Seats booked", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | CANCELLED; CONFIRMED when it fits capacity at creation, else WAITLISTED; waitlist promotion is strict head-of-line by created_at ASC" }

  - name: SalesCenterAppointment
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: agent_name, type: string, source: input, description: "Sales agent hosting the tour" }
      - { name: visitor_name, type: string, source: input, description: "Prospect name" }
      - { name: start_at, type: datetime, source: input, description: "Tour start (must be < end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Tour end" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED", default: BOOKED }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: lot_id, type: string, source: computed, description: "FK -> Lot.id; homesite; null until record-purchase", constraints: "nullable" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per community" }
      - { name: owner_since, type: datetime, source: system, description: "Logical-clock timestamp of the closing that made them OWNER; null until OWNER", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROSPECT | PURCHASER | OWNER | FORMER", default: PROSPECT }

  - name: ResidentNotice
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: notice_type, type: enum, source: input, description: "ASSESSMENT_CHANGE | TRANSITION_UPDATE | AMENITY_DELINQUENCY | GENERAL_MEETING | BUDGET_ADOPTION" }
      - { name: subject, type: string, source: input, description: "Notice subject" }
      - { name: body, type: string, source: input, description: "Notice body" }
      - { name: send_at, type: datetime, source: input, description: "Scheduled send time; schedule requires send_at strictly after the logical clock" }
      - { name: sent_at, type: datetime, source: system, description: "Set to send_at when the clock sweep sends the notice; null until SENT", constraints: "nullable" }
      - { name: effective_date, type: datetime, source: input, description: "Effective date referenced by the notice; null unless applicable", constraints: "nullable", default: null }
      - { name: budget_id, type: string, source: input, description: "FK -> AssociationBudget.id; required for BUDGET_ADOPTION notices; null otherwise", constraints: "nullable" }
      - { name: assessment_rate_id, type: string, source: input, description: "FK -> AssessmentRate.id; required for ASSESSMENT_CHANGE notices; null otherwise", constraints: "nullable" }
      - { name: supersedes_notice_id, type: string, source: system, description: "FK -> ResidentNotice.id; notice this one supersedes (set by the supersede action); null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | SENT | CANCELLED | SUPERSEDED", default: DRAFT }

  - name: BoardSeat
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: computed, description: "FK -> Community.id; owning community (seats are system-created)" }
      - { name: seat_no, type: integer, source: system, description: "Seat number 1..5; TOTAL_SEATS = 5" }
      - { name: seat_class, type: enum, source: system, description: "DECLARANT_APPOINTED | OWNER_ELECTED" }
      - { name: holder_name, type: string, source: system, description: "Declarant appointee name (from activate) or elected holder's resident full_name" }
      - { name: holder_resident_id, type: string, source: system, description: "FK -> Resident.id; elected holder; null for declarant appointees and vacant seats", constraints: "nullable" }
      - { name: eligible_voter_count, type: integer, source: system, description: "Snapshot of residents with status OWNER at call-election", constraints: "nullable" }
      - { name: election_deadline, type: datetime, source: system, description: "= call timestamp + ELECTION_WINDOW_DAYS (30); null until ELECTION_CALLED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FILLED | VACANT | ELECTION_CALLED | LAPSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Community
    initial_state: PLANNING
    terminal_states: [TURNOVER_RECORDED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /mpc/communities/{cid}/activate"
        actor: DeclarantExecutive
        preconditions:
          - "declarant_director_names has exactly TOTAL_SEATS (5) entries (ERR_VALIDATION)"
        side_effects:
          - "Creates 5 BoardSeat rows (seat_no 1..5, seat_class DECLARANT_APPOINTED, status FILLED, holder_name from declarant_director_names)"
          - "transition_stage remains DECLARANT_CONTROL"
      - from: ACTIVE
        to: TURNOVER_RECORDED
        trigger: "POST /mpc/communities/{cid}/record-turnover"
        actor: DeclarantExecutive
        preconditions:
          - "closed_unit_pct >= 100.00 (ERR_TRANSITION_THRESHOLD_NOT_MET)"
          - "All 5 BoardSeat rows have seat_class OWNER_ELECTED and status FILLED (ERR_TURNOVER_SEATS_NOT_FILLED)"
        side_effects:
          - "transition_stage -> TURNOVER_COMPLETE"
          - "Declarant governance powers end: adopt / arm / approve-cap-override by Declarant-side roles now fail with ERR_DECLARANT_AUTHORITY_ENDED"

  - entity: DevelopmentPhase
    initial_state: PLANNED
    terminal_states: [CLOSED_OUT, CANCELLED]
    transitions:
      - from: PLANNED
        to: SALES_OPEN
        trigger: "POST /mpc/phases/{pid}/open-sales"
        actor: DeclarantExecutive
        preconditions:
          - "Community must be ACTIVE (ERR_COMMUNITY_NOT_ACTIVE)"
          - "The phase with sequence_no - 1 in the same community, if one exists, must be in {DELIVERING, CLOSED_OUT} (ERR_PHASE_SEQUENCE_BLOCKED)"
        side_effects: []
      - from: SALES_OPEN
        to: DELIVERING
        trigger: "system (automatic when the phase's first LotClosing reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: CLOSED_OUT
        trigger: "POST /mpc/phases/{pid}/close-out"
        actor: DeclarantExecutive
        preconditions:
          - "Every Lot in the phase is in {CLOSED, WITHDRAWN} (ERR_CLOSEOUT_BLOCKED)"
          - "Every LotPurchaseAgreement with phase_id == this phase is in {COMPLETED, DEFAULTED, TERMINATED} (ERR_CLOSEOUT_BLOCKED)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /mpc/phases/{pid}/cancel"
        actor: DeclarantExecutive
        preconditions:
          - "No LotClosing in {PENDING, CLOSED} references a lot of this phase (ERR_CLOSEOUT_BLOCKED)"
        side_effects:
          - "Lots in {PLATTED, OFFERED} -> WITHDRAWN"
          - "Agreements with phase_id == this phase in {DRAFT, EXECUTED} -> TERMINATED; their tranches in {SCHEDULED, OPEN} -> CANCELLED"
      - from: SALES_OPEN
        to: CANCELLED
        trigger: "POST /mpc/phases/{pid}/cancel"
        actor: DeclarantExecutive
        preconditions:
          - "No LotClosing in {PENDING, CLOSED} references a lot of this phase (ERR_CLOSEOUT_BLOCKED)"
        side_effects:
          - "Same cascade as PLANNED -> CANCELLED"

  - entity: Amenity
    initial_state: COMMITTED
    terminal_states: [OPEN]
    transitions:
      - from: COMMITTED
        to: IN_DESIGN
        trigger: "POST /mpc/amenities/{aid}/start-design"
        actor: DeclarantExecutive
        preconditions: []
        side_effects: []
      - from: IN_DESIGN
        to: UNDER_CONSTRUCTION
        trigger: "POST /mpc/amenities/{aid}/start-construction"
        actor: DeclarantExecutive
        preconditions: []
        side_effects: []
      - from: UNDER_CONSTRUCTION
        to: OPEN
        trigger: "POST /mpc/amenities/{aid}/open"
        actor: DeclarantExecutive
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: OPEN
        trigger: "POST /mpc/amenities/{aid}/open"
        actor: DeclarantExecutive
        preconditions: []
        side_effects:
          - "Late opening is allowed; previously cancelled CommunityEvents are NOT restored"
      - from: COMMITTED
        to: DELINQUENT
        trigger: "system (lot-closing trigger breach, or clock sweep past hard_deadline_date)"
        actor: system
        preconditions: []
        side_effects:
          - "delinquency_recorded_at = logical clock"
          - "CommunityEvents in SCHEDULED whose venue maps to this amenity_type -> CANCELLED; their EventRsvp rows -> CANCELLED (reachable because scheduling only requires UNDER_CONSTRUCTION)"
          - "A DRAFT ResidentNotice of type AMENITY_DELINQUENCY is auto-created for the community"
      - from: IN_DESIGN
        to: DELINQUENT
        trigger: "system (lot-closing trigger breach, or clock sweep past hard_deadline_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as COMMITTED -> DELINQUENT"
      - from: UNDER_CONSTRUCTION
        to: DELINQUENT
        trigger: "system (lot-closing trigger breach, or clock sweep past hard_deadline_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as COMMITTED -> DELINQUENT"

  - entity: Builder
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system (automatic when any of the builder's agreements has a tranche that becomes MISSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system (automatic when any of the builder's agreements becomes DEFAULTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (automatic when any of the builder's agreements becomes DEFAULTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "POST /mpc/builders/{bid}/reinstate"
        actor: DeclarantExecutive
        preconditions:
          - "No tranche of any of the builder's agreements is in {MISSED, DEFAULTED} (ERR_OUTSTANDING_COMPLIANCE_DEFAULTS)"
        side_effects: []
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /mpc/builders/{bid}/reinstate"
        actor: DeclarantExecutive
        preconditions:
          - "No tranche of any of the builder's agreements is in {MISSED, DEFAULTED} (ERR_OUTSTANDING_COMPLIANCE_DEFAULTS)"
          - "No agreement of the builder is DEFAULTED (ERR_OUTSTANDING_COMPLIANCE_DEFAULTS)"
        side_effects: []

  - entity: LotPurchaseAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, DEFAULTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /mpc/agreements/{aid}/execute"
        actor: DeclarantExecutive
        preconditions:
          - "Community must be ACTIVE (ERR_COMMUNITY_NOT_ACTIVE)"
          - "Builder standing must be GOOD_STANDING (ERR_BUILDER_NOT_IN_GOOD_STANDING)"
          - "Phase must be in {SALES_OPEN, DELIVERING} (ERR_PHASE_NOT_OPEN_FOR_SALES)"
          - "Sum of lot_count_due over the agreement's tranches must equal total_lots_committed (ERR_TRANCHE_COVERAGE_MISMATCH)"
        side_effects:
          - "execution_date = logical clock; agreement.version increments"
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /mpc/agreements/{aid}/commence"
        actor: DeclarantController
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when lots_closed_count == total_lots_committed AND every tranche is in {SATISFIED, CURED, WAIVED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (automatic when any tranche reaches DEFAULTED via certify-default)"
        actor: system
        preconditions: []
        side_effects:
          - "forfeited_earnest_money_cents = earnest_money_cents"
          - "Builder standing -> SUSPENDED; that demotion itself cascades: the builder's OTHER agreements in {DRAFT, EXECUTED} -> TERMINATED, and their tranches in {SCHEDULED, OPEN} -> CANCELLED"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /mpc/agreements/{aid}/terminate"
        actor: DeclarantExecutive
        preconditions:
          - "No LotClosing for this agreement is PENDING (ERR_CLOSINGS_PENDING)"
        side_effects:
          - "Tranches in {SCHEDULED, OPEN} -> CANCELLED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /mpc/agreements/{aid}/terminate"
        actor: DeclarantExecutive
        preconditions:
          - "No LotClosing for this agreement is PENDING (ERR_CLOSINGS_PENDING)"
        side_effects:
          - "Tranches in {SCHEDULED, OPEN} -> CANCELLED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mpc/agreements/{aid}/terminate"
        actor: DeclarantExecutive
        preconditions:
          - "No LotClosing for this agreement is PENDING (ERR_CLOSINGS_PENDING)"
        side_effects:
          - "Tranches in {SCHEDULED, OPEN} -> CANCELLED"

  - entity: TakedownTranche
    initial_state: SCHEDULED
    terminal_states: [SATISFIED, CURED, WAIVED, DEFAULTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (clock sweep: due_date - TRANCHE_OPEN_LEAD_DAYS(30) <= now < due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SATISFIED
        trigger: "system (automatic when the closing waterfall raises lots_credited to >= lot_count_due)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: MISSED
        trigger: "system (clock sweep: now > due_date AND lots_credited < lot_count_due)"
        actor: system
        preconditions: []
        side_effects:
          - "Builder standing -> PROBATION (if currently GOOD_STANDING)"
          - "accrued_penalty_cents begins accruing"
      - from: MISSED
        to: CURED
        trigger: "POST /mpc/tranches/{tid}/cure"
        actor: BuilderRep
        preconditions:
          - "Logical clock must be <= cure_deadline (ERR_TRANCHE_NOT_CURABLE)"
          - "payment_cents must equal accrued_penalty_cents exactly (ERR_PENALTY_AMOUNT_MISMATCH)"
        side_effects:
          - "The acting BuilderRep's X-User-ID must equal the agreement's builder_id (ERR_FORBIDDEN_ROLE)"
      - from: MISSED
        to: WAIVED
        trigger: "POST /mpc/tranches/{tid}/waive"
        actor: AssociationDirector
        preconditions:
          - "Community transition_stage must not be TURNOVER_COMPLETE (ERR_DECLARANT_AUTHORITY_ENDED)"
        side_effects:
          - "accrued_penalty_cents is forgiven (frozen at current value, no longer owed)"
      - from: MISSED
        to: DEFAULTED
        trigger: "POST /mpc/tranches/{tid}/certify-default"
        actor: DeclarantExecutive
        preconditions:
          - "Logical clock must be > cure_deadline (ERR_CURE_WINDOW_OPEN)"
        side_effects:
          - "Agreement -> DEFAULTED (which cascades: earnest money forfeited; builder -> SUSPENDED; builder's other {DRAFT, EXECUTED} agreements -> TERMINATED; their {SCHEDULED, OPEN} tranches -> CANCELLED)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (agreement terminated or superseding amendment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "system (agreement terminated or superseding amendment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lot
    initial_state: PLATTED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: PLATTED
        to: OFFERED
        trigger: "POST /mpc/lots/{lid}/offer"
        actor: DeclarantExecutive
        preconditions:
          - "Phase must be in {SALES_OPEN, DELIVERING} (ERR_PHASE_NOT_OPEN_FOR_SALES)"
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /mpc/lots/{lid}/withdraw"
        actor: DeclarantExecutive
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: UNDER_CONTRACT
        trigger: "system (automatic on LotClosing creation referencing this lot)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: OFFERED
        trigger: "system (automatic when the referencing PENDING closing is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "system (automatic when the referencing closing reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: OFFERED
        trigger: "system (automatic when the CLOSED closing is RESCINDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LotClosing
    initial_state: PENDING
    terminal_states: [CANCELLED, RESCINDED]
    transitions:
      - from: PENDING
        to: CLOSED
        trigger: "POST /mpc/closings/{clid}/close"
        actor: DeclarantController
        preconditions:
          - "Agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "Lot must be UNDER_CONTRACT (ERR_LOT_NOT_UNDER_CONTRACT)"
        side_effects:
          - "closing_date = logical clock; compute escalated_base_cents, premium_cents, price_cents (calc escalated_lot_price)"
          - "Waterfall credit (calc takedown_waterfall_allocation): pick eligible tranche, lots_credited += 1, tranche -> SATISFIED when lots_credited == lot_count_due"
          - "Lot -> CLOSED; phase -> DELIVERING if it was SALES_OPEN"
          - "phase.closed_lot_count += 1; this increment itself triggers amenity_trigger_breach: if the trigger phase's closed_lot_count now > trigger_unit_count and the amenity is not OPEN/DELINQUENT, the amenity -> DELINQUENT, which itself cancels SCHEDULED CommunityEvents at venues mapped to its type and auto-creates a DRAFT AMENITY_DELINQUENCY notice"
          - "agreement.lots_closed_count += 1; builder.total_lots_purchased += 1; if lots_closed_count == total_lots_committed and all tranches terminal -> agreement COMPLETED"
          - "community.closed_unit_count += 1 -> closed_unit_pct recomputed -> transition_stage ratchets up across crossed thresholds -> DECLARANT_APPOINTED seats convert to OWNER_ELECTED VACANT per transition_seat_requirements"
          - "If owner_resident_id set: resident -> OWNER, owner_since = closing_date"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /mpc/closings/{clid}/cancel"
        actor: DeclarantController
        preconditions: []
        side_effects:
          - "Lot -> OFFERED"
      - from: CLOSED
        to: RESCINDED
        trigger: "POST /mpc/closings/{clid}/rescind"
        actor: DeclarantExecutive
        preconditions:
          - "Logical clock must be <= closing_date + RESCISSION_WINDOW_DAYS(30) (ERR_RESCISSION_WINDOW_EXPIRED)"
        side_effects:
          - "If credited_tranche_id set: that tranche's lots_credited -= 1; if it was SATISFIED it reverts to OPEN when now <= due_date, else MISSED when now > due_date"
          - "community.closed_unit_count -= 1 and closed_unit_pct recomputed; transition_stage does NOT regress (ratchet)"
          - "phase.closed_lot_count -= 1; agreement.lots_closed_count -= 1; builder.total_lots_purchased -= 1"
          - "Lot -> OFFERED; owner_resident (if any) remains OWNER (no regression)"

  - entity: AssociationBudget
    initial_state: DRAFT
    terminal_states: [ADOPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /mpc/budgets/{bid}/propose"
        actor: DeclarantController
        preconditions:
          - "At least one BudgetLineItem exists (ERR_BUDGET_EMPTY)"
        side_effects: []
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /mpc/budgets/{bid}/adopt"
        actor: AssociationDirector
        preconditions:
          - "A ResidentNotice of type BUDGET_ADOPTION with budget_id == this budget exists in SENT status (ERR_NOTICE_NOT_SENT)"
          - "That notice's sent_at must be <= now - BUDGET_NOTICE_LEAD_DAYS(14) (ERR_NOTICE_LEAD_TIME)"
          - "transition_stage in {DECLARANT_CONTROL, OWNER_REPRESENTATION} (else the adopt lands in PENDING_RATIFICATION)"
          - "transition_stage != TURNOVER_COMPLETE for AssociationDirector (ERR_DECLARANT_AUTHORITY_ENDED)"
        side_effects:
          - "adopted_by_user_id = X-User-ID"
      - from: PROPOSED
        to: PENDING_RATIFICATION
        trigger: "POST /mpc/budgets/{bid}/adopt"
        actor: AssociationDirector
        preconditions:
          - "Same notice preconditions as PROPOSED -> ADOPTED"
          - "transition_stage in {PARITY, OWNER_MAJORITY}"
        side_effects:
          - "adopted_by_user_id = X-User-ID"
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /mpc/budgets/{bid}/adopt"
        actor: OwnerDirector
        preconditions:
          - "Same notice preconditions"
          - "transition_stage == TURNOVER_COMPLETE"
        side_effects:
          - "adopted_by_user_id = X-User-ID"
      - from: PENDING_RATIFICATION
        to: ADOPTED
        trigger: "POST /mpc/budgets/{bid}/ratify"
        actor: OwnerDirector
        preconditions:
          - "X-User-ID != adopted_by_user_id (ERR_ADOPTER_CANNOT_RATIFY)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /mpc/budgets/{bid}/reject"
        actor: AssociationDirector
        preconditions: []
        side_effects: []
      - from: PENDING_RATIFICATION
        to: REJECTED
        trigger: "POST /mpc/budgets/{bid}/reject"
        actor: AssociationDirector
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /mpc/budgets/{bid}/revise"
        actor: DeclarantController
        preconditions: []
        side_effects: []
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system (atomic with POST /mpc/budgets/{bid}/amendments creating the successor DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "AssessmentRate rows with budget_id == this budget and status in {CALCULATED, ARMED} -> SUPERSEDED"

  - entity: AssessmentRate
    initial_state: CALCULATED
    terminal_states: [EFFECTIVE, SUPERSEDED]
    transitions:
      - from: CALCULATED
        to: ARMED
        trigger: "POST /mpc/assessment-rates/{rid}/arm"
        actor: DeclarantController
        preconditions:
          - "A ResidentNotice of type ASSESSMENT_CHANGE with assessment_rate_id == this rate exists in SENT status (ERR_NOTICE_NOT_SENT)"
          - "That notice's sent_at must be <= (fiscal_year Jan 1 00:00 UTC) - ASSESSMENT_NOTICE_LEAD_DAYS(30) (ERR_NOTICE_LEAD_TIME)"
          - "If increase_pct > STATUTORY_CAP_PCT(20.00): cap_override_approved_by must be set, and when transition_stage in {PARITY, OWNER_MAJORITY} cap_override_ratified_by must also be set (ERR_ASSESSMENT_CAP_EXCEEDED)"
          - "transition_stage != TURNOVER_COMPLETE for DeclarantController (ERR_DECLARANT_AUTHORITY_ENDED)"
        side_effects: []
      - from: CALCULATED
        to: ARMED
        trigger: "POST /mpc/assessment-rates/{rid}/arm"
        actor: OwnerDirector
        preconditions:
          - "Same notice and cap preconditions; OwnerDirector path applies post-turnover"
        side_effects: []
      - from: ARMED
        to: EFFECTIVE
        trigger: "system (clock sweep: now >= fiscal_year Jan 1 00:00 UTC)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CALCULATED
        to: SUPERSEDED
        trigger: "system (cascade: the source budget was superseded by an amendment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ARMED
        to: SUPERSEDED
        trigger: "system (cascade: the source budget was superseded by an amendment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReimbursementPayment
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /mpc/payments/{pid}/certify"
        actor: AssociationDirector
        preconditions:
          - "amount_cents must be <= outstanding_principal_cents + compound interest accrued to now across all advances (ERR_PAYMENT_EXCEEDS_OBLIGATION)"
        side_effects:
          - "Compute certified_interest_cents (calc district_interest_certified) and certified_principal_cents (calc reimbursement_waterfall)"
          - "certified_at = logical clock; district.outstanding_principal_cents -= certified_principal_cents; district.certified_interest_to_date_cents += certified_interest_cents"
          - "Advance reimbursed_principal_cents updated FIFO; advance status derived"
      - from: CERTIFIED
        to: PAID
        trigger: "POST /mpc/payments/{pid}/pay"
        actor: DeclarantController
        preconditions:
          - "district.available_funds_cents >= amount_cents (ERR_INSUFFICIENT_DISTRICT_FUNDS)"
        side_effects:
          - "paid_at = logical clock; district.available_funds_cents -= amount_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /mpc/payments/{pid}/reject"
        actor: AssociationDirector
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: REJECTED
        trigger: "POST /mpc/payments/{pid}/reject"
        actor: AssociationDirector
        preconditions: []
        side_effects:
          - "Compensation: district.outstanding_principal_cents += certified_principal_cents; district.certified_interest_to_date_cents -= certified_interest_cents; advance reimbursed_principal_cents unwound FIFO-reverse (latest allocations first)"

  - entity: DistrictLevy
    initial_state: PLANNED
    terminal_states: [COLLECTED]
    transitions:
      - from: PLANNED
        to: COLLECTED
        trigger: "POST /mpc/levies/{lid}/collect"
        actor: DeclarantController
        preconditions: []
        side_effects:
          - "collected_at = logical clock; district.available_funds_cents += amount_cents"

  - entity: DesignReviewApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, EXPIRED, WITHDRAWN]
    note: "DENIED is non-terminal only while submission_round < MAX_REVIEW_ROUNDS(3)"
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /mpc/applications/{aid}/begin-review"
        actor: DesignReviewer
        preconditions:
          - "Reviewer's X-User-ID must not equal the applicant user's id (ERR_REVIEWER_CONFLICT)"
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /mpc/applications/{aid}/begin-review"
        actor: DesignReviewer
        preconditions:
          - "Reviewer's X-User-ID must not equal denied_by_user_id of the latest denial (ERR_REVIEWER_CONFLICT)"
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mpc/applications/{aid}/approve"
        actor: DesignReviewer
        preconditions:
          - "X-User-ID must equal reviewer_user_id (ERR_REVIEWER_CONFLICT)"
        side_effects:
          - "construction_start_by = logical clock + CONSTRUCTION_START_WINDOW_DAYS(180)"
      - from: UNDER_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "POST /mpc/applications/{aid}/approve-with-conditions"
        actor: DesignReviewer
        preconditions:
          - "X-User-ID must equal reviewer_user_id (ERR_REVIEWER_CONFLICT)"
        side_effects:
          - "conditions_text recorded"
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /mpc/applications/{aid}/verify-conditions"
        actor: DesignReviewer
        preconditions: []
        side_effects:
          - "construction_start_by = logical clock + CONSTRUCTION_START_WINDOW_DAYS(180)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /mpc/applications/{aid}/deny"
        actor: DesignReviewer
        preconditions:
          - "X-User-ID must equal reviewer_user_id (ERR_REVIEWER_CONFLICT)"
        side_effects:
          - "denied_by_user_id = X-User-ID of reviewer"
          - "A denial at submission_round == MAX_REVIEW_ROUNDS(3) leaves the application DENIED with no further resubmit path"
      - from: DENIED
        to: RESUBMITTED
        trigger: "POST /mpc/applications/{aid}/resubmit"
        actor: BuilderRep
        preconditions:
          - "submission_round < MAX_REVIEW_ROUNDS(3) (ERR_REVIEW_ROUNDS_EXHAUSTED)"
          - "The acting user must match the applicant (BuilderRep as_user_id == applicant_builder_id, or HomeownerResident as_user_id == applicant_resident_id) (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "submission_round += 1; review_fee_cents = REVIEW_ROUND_FEES[submission_round] (round 2: 25000, round 3: 75000)"
      - from: DENIED
        to: RESUBMITTED
        trigger: "POST /mpc/applications/{aid}/resubmit"
        actor: HomeownerResident
        preconditions:
          - "Same preconditions as the BuilderRep resubmit path"
        side_effects:
          - "submission_round += 1; review_fee_cents = REVIEW_ROUND_FEES[submission_round]"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /mpc/applications/{aid}/withdraw"
        actor: BuilderRep
        preconditions:
          - "The acting user must match the applicant (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: DENIED
        to: WITHDRAWN
        trigger: "POST /mpc/applications/{aid}/withdraw"
        actor: HomeownerResident
        preconditions:
          - "The acting user must match the applicant (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep: now > construction_start_by and record-construction-start never called)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DesignViolation
    initial_state: REPORTED
    terminal_states: [PAID, DISMISSED, CURED]
    transitions:
      - from: REPORTED
        to: NOTICE_SENT
        trigger: "POST /mpc/violations/{vid}/send-notice"
        actor: DesignReviewer
        preconditions: []
        side_effects:
          - "cure_deadline = logical clock + VIOLATION_CURE_DAYS(14)"
      - from: NOTICE_SENT
        to: CURED
        trigger: "POST /mpc/violations/{vid}/record-cure"
        actor: DesignReviewer
        preconditions: []
        side_effects:
          - "cured_at = logical clock; days_late frozen; fine_cents stays 0 when cured on or before cure_deadline"
      - from: NOTICE_SENT
        to: ESCALATED
        trigger: "POST /mpc/violations/{vid}/escalate"
        actor: DesignReviewer
        preconditions:
          - "Logical clock must be > cure_deadline (ERR_CURE_WINDOW_OPEN)"
        side_effects: []
      - from: ESCALATED
        to: HEARING_SCHEDULED
        trigger: "POST /mpc/violations/{vid}/schedule-hearing"
        actor: AssociationDirector
        preconditions:
          - "hearing_date must be strictly after the logical clock (ERR_SEND_AT_IN_PAST)"
        side_effects: []
      - from: HEARING_SCHEDULED
        to: FINED
        trigger: "POST /mpc/violations/{vid}/levy-fine"
        actor: AssociationDirector
        preconditions: []
        side_effects:
          - "fine_cents = calc violation_fine_accrual at the levy timestamp (tiers 5000/10000/20000 cents per day over day bands 1-30/31-60/61+, capped at FINE_CAP_CENTS 1000000); days_late frozen"
          - "fined_by_user_id = X-User-ID"
      - from: FINED
        to: PAID
        trigger: "POST /mpc/violations/{vid}/record-payment"
        actor: DeclarantController
        preconditions:
          - "payment_cents must equal fine_cents exactly (ERR_PENALTY_AMOUNT_MISMATCH)"
        side_effects: []
      - from: FINED
        to: APPEALED
        trigger: "POST /mpc/violations/{vid}/appeal"
        actor: HomeownerResident
        preconditions:
          - "Logical clock must be <= fined timestamp + APPEAL_WINDOW_DAYS(30) (ERR_APPEAL_WINDOW_EXPIRED)"
          - "The acting user must match the respondent (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: FINED
        to: APPEALED
        trigger: "POST /mpc/violations/{vid}/appeal"
        actor: BuilderRep
        preconditions:
          - "Same window and respondent preconditions"
        side_effects: []
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /mpc/violations/{vid}/resolve-appeal"
        actor: AssociationDirector
        preconditions:
          - "X-User-ID must not equal fined_by_user_id (ERR_HEARING_OFFICER_CONFLICT)"
          - "outcome must be APPEAL_UPHELD (ERR_VALIDATION otherwise)"
        side_effects:
          - "fine_cents voided to 0"
      - from: APPEALED
        to: FINED
        trigger: "POST /mpc/violations/{vid}/resolve-appeal"
        actor: AssociationDirector
        preconditions:
          - "X-User-ID must not equal fined_by_user_id (ERR_HEARING_OFFICER_CONFLICT)"
          - "outcome must be APPEAL_DENIED (ERR_VALIDATION otherwise)"
        side_effects:
          - "fine_cents recomputed with days_late measured to the resolution date (accrual resumed through the appeal)"

  - entity: CommunityEvent
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: SCHEDULED
        trigger: "POST /mpc/events/{eid}/schedule"
        actor: LifestyleCoordinator
        preconditions:
          - "start_at must be >= logical clock + EVENT_LEAD_DAYS(14) (ERR_EVENT_LEAD_TIME)"
          - "No other SCHEDULED event at the same venue with half-open [start_at, end_at) overlap; adjacency is allowed (ERR_VENUE_OVERLAP)"
          - "If venue in {CLUBHOUSE, POOL_DECK, EVENT_LAWN}: the community's amenity of the mapped type must be in {UNDER_CONSTRUCTION, OPEN} (ERR_AMENITY_NOT_OPEN); a COMMITTED/IN_DESIGN/DELINQUENT amenity blocks scheduling"
          - "If cost_cents > 0: charged_budget_id required, budget ADOPTED, and its EVENTS_PROGRAMMING line minus the cost of SCHEDULED/COMPLETED events charged to it must be >= cost_cents (ERR_EVENT_BUDGET_EXCEEDED)"
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /mpc/events/{eid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects:
          - "EventRsvp rows in {CONFIRMED, WAITLISTED} -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mpc/events/{eid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects:
          - "EventRsvp rows in {CONFIRMED, WAITLISTED} -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (amenity DELINQUENT cascade for the mapped venue)"
        actor: system
        preconditions: []
        side_effects:
          - "EventRsvp rows in {CONFIRMED, WAITLISTED} -> CANCELLED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (clock sweep: end_at <= now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EventRsvp
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    note: "Creation lands CONFIRMED when the party fits the event's remaining capacity, else WAITLISTED; WAITLISTED is thus also a creation-time state"
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (automatic on capacity freeing: a CONFIRMED rsvp is cancelled and the earliest-created WAITLISTED rsvp has party_size <= freed capacity; strict head-of-line: if the earliest waitlisted rsvp does not fit, no promotion occurs)"
        actor: system
        preconditions: []
        side_effects:
          - "event.confirmed_count recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /mpc/rsvps/{rid}/cancel"
        actor: HomeownerResident
        preconditions:
          - "The acting resident must be the rsvp's resident (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "event.confirmed_count recomputed; waitlist promotion runs"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /mpc/rsvps/{rid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects:
          - "event.confirmed_count recomputed; waitlist promotion runs"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /mpc/rsvps/{rid}/cancel"
        actor: HomeownerResident
        preconditions:
          - "The acting resident must be the rsvp's resident (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (event cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (event cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalesCenterAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /mpc/appointments/{aid}/complete"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /mpc/appointments/{aid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []

  - entity: Resident
    initial_state: PROSPECT
    terminal_states: [FORMER]
    transitions:
      - from: PROSPECT
        to: PURCHASER
        trigger: "POST /mpc/residents/{rid}/record-purchase"
        actor: LifestyleCoordinator
        preconditions:
          - "lot_id must reference a lot of the same community (ERR_RESIDENT_COMMUNITY_MISMATCH)"
          - "Lot must be in {UNDER_CONTRACT, CLOSED} (ERR_LOT_NOT_UNDER_CONTRACT)"
        side_effects:
          - "lot_id recorded"
      - from: PURCHASER
        to: OWNER
        trigger: "system (automatic when a CLOSED LotClosing names this resident as owner_resident_id)"
        actor: system
        preconditions: []
        side_effects:
          - "owner_since = closing_date"
      - from: PROSPECT
        to: OWNER
        trigger: "system (automatic when a CLOSED LotClosing names this resident as owner_resident_id; a prospect who was never marked PURCHASER still becomes OWNER)"
        actor: system
        preconditions: []
        side_effects:
          - "owner_since = closing_date; lot_id set to the closing's lot if null"
      - from: PROSPECT
        to: FORMER
        trigger: "POST /mpc/residents/{rid}/archive"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []
      - from: PURCHASER
        to: FORMER
        trigger: "POST /mpc/residents/{rid}/archive"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []
      - from: OWNER
        to: FORMER
        trigger: "POST /mpc/residents/{rid}/archive"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []

  - entity: ResidentNotice
    initial_state: DRAFT
    terminal_states: [SENT, CANCELLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /mpc/notices/{nid}/schedule"
        actor: LifestyleCoordinator
        preconditions:
          - "send_at must be strictly after the logical clock (ERR_SEND_AT_IN_PAST)"
          - "BUDGET_ADOPTION notices require budget_id; ASSESSMENT_CHANGE notices require assessment_rate_id (ERR_VALIDATION)"
        side_effects: []
      - from: SCHEDULED
        to: SENT
        trigger: "system (clock sweep: send_at <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "sent_at = send_at"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mpc/notices/{nid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mpc/notices/{nid}/cancel"
        actor: LifestyleCoordinator
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (POST /mpc/notices/{nid}/supersede creates the successor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system (POST /mpc/notices/{nid}/supersede creates the successor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "system (POST /mpc/notices/{nid}/supersede creates the successor)"
        actor: system
        preconditions: []
        side_effects:
          - "A SUPERSEDED notice no longer satisfies budget-adoption or rate-arm notice gating even though it was SENT"

  - entity: BoardSeat
    initial_state: FILLED
    terminal_states: []
    transitions:
      - from: FILLED
        to: VACANT
        trigger: "system (stage-advance cascade: a DECLARANT_APPOINTED seat converts to OWNER_ELECTED VACANT per transition_seat_requirements; also at closed_unit_pct >= 100.00)"
        actor: system
        preconditions: []
        side_effects:
          - "seat_class becomes OWNER_ELECTED; holder_name and holder_resident_id cleared"
      - from: VACANT
        to: ELECTION_CALLED
        trigger: "POST /mpc/board-seats/{sid}/call-election"
        actor: AssociationDirector
        preconditions:
          - "Seat must be VACANT and seat_class OWNER_ELECTED (ERR_SEAT_NOT_VACANT)"
        side_effects:
          - "eligible_voter_count = count of residents of the community with status OWNER (snapshot)"
          - "election_deadline = logical clock + ELECTION_WINDOW_DAYS(30)"
      - from: LAPSED
        to: ELECTION_CALLED
        trigger: "POST /mpc/board-seats/{sid}/call-election"
        actor: AssociationDirector
        preconditions: []
        side_effects:
          - "eligible_voter_count and election_deadline refreshed as in VACANT -> ELECTION_CALLED"
      - from: ELECTION_CALLED
        to: FILLED
        trigger: "POST /mpc/board-seats/{sid}/certify-election"
        actor: AssociationDirector
        preconditions:
          - "votes_cast >= ceil(eligible_voter_count * QUORUM_PCT(20) / 100) (ERR_QUORUM_NOT_MET)"
          - "votes_for > votes_cast / 2 (strict majority) (ERR_ELECTION_MAJORITY_NOT_REACHED)"
          - "holder_resident_id must reference an OWNER resident of the community not already holding a FILLED or ELECTION_CALLED seat (ERR_HOLDER_NOT_ELIGIBLE)"
          - "Late certification is impossible to express: the clock sweep lapses the seat first, so the from-state check rejects with ERR_INVALID_STATE"
        side_effects:
          - "holder_resident_id and holder_name recorded; status FILLED"
      - from: ELECTION_CALLED
        to: LAPSED
        trigger: "system (clock sweep: now > election_deadline)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InfrastructureAdvance
    initial_state: OUTSTANDING
    terminal_states: [REIMBURSED]
    transitions:
      - from: OUTSTANDING
        to: PARTIALLY_REIMBURSED
        trigger: "system (derived: 0 < reimbursed_principal_cents < amount_cents after a payment certification or rejection unwind)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUTSTANDING
        to: REIMBURSED
        trigger: "system (derived: reimbursed_principal_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_REIMBURSED
        to: REIMBURSED
        trigger: "system (derived: reimbursed_principal_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_REIMBURSED
        to: OUTSTANDING
        trigger: "system (derived: rejection unwind returns reimbursed_principal_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amendment-stale-version
    parent_entity: LotPurchaseAgreement
    write_endpoint: "POST /mpc/agreements/{aid}/amendments"
    occ_field: "expected_agreement_version"
    description: |
      Creating a superseding takedown amendment against a LotPurchaseAgreement
      whose version has advanced since the client last observed it is rejected.
      Amendments legitimately supersede the existing tranche schedule, so a
      client holding a stale agreement version must not silently overwrite a
      newer amendment's schedule.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-amendment-stale-version
    parent_entity: AssociationBudget
    write_endpoint: "POST /mpc/budgets/{bid}/amendments"
    occ_field: "expected_budget_version"
    description: |
      Creating a successor DRAFT budget that supersedes an ADOPTED budget whose
      version has advanced since the client last observed it is rejected. The
      amendment is a create-with-supersede write: the requester must observe
      the current budget version so two amendments cannot both claim to succeed
      the same observed budget state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: escalated_lot_price
    trigger: "LotClosing PENDING -> CLOSED"
    algorithm: threshold
    formula: |
      anniversaries = count of calendar dates execution_date + k years (k = 1, 2, ...) that are <= closing_date
      escalated_base_cents = round_half_up(base_price_per_lot_cents * (1 + annual_escalation_pct / 100) ^ anniversaries, 0)
      premium_cents = lot.lot_premium_cents
      price_cents = escalated_base_cents + premium_cents
    input_set: "The LotClosing's agreement (base price, escalation, execution_date) and lot (premium); closing_date = logical clock at close"
    constants:
      ROUNDING: round_half_up to integer cents
    precision: "integer cents, round_half_up applied once to the escalated base before adding the premium"
    note: "A closing exactly on an anniversary date counts that anniversary (<=). 0 anniversaries before the first anniversary: price = base + premium."

  - name: takedown_waterfall_allocation
    trigger: "LotClosing PENDING -> CLOSED"
    algorithm: waterfall_allocation
    formula: |
      eligible = tranches of the agreement with status IN {OPEN, MISSED} AND lots_credited < lot_count_due
      order: due_date ASC, tie-break tranche_no ASC
      if eligible non-empty: selected = first in order; selected.lots_credited += 1; credited_tranche_id = selected.id;
        if selected.lots_credited == lot_count_due: selected -> SATISFIED
      else: credited_tranche_id = null; is_surplus = true
    input_set: "TakedownTranche rows of the same agreement in status OPEN or MISSED with remaining deficit"
    note: "SCHEDULED tranches are NOT eligible: early closings cannot pre-credit future tranches. Exactly one lot is credited per closing; no spill."

  - name: late_penalty_accrual
    trigger: "tranche enters MISSED (clock sweep); evaluated on read, cure, and certify-default"
    algorithm: decay_function
    formula: |
      deficit_lots = lot_count_due - lots_credited
      days_late = calendar days from due_date to min(now, cure evaluation date); 0 while status != MISSED
      raw = deficit_lots * agreement.penalty_per_lot_per_day_cents * days_late
      cap = round_half_up(PENALTY_CAP_PCT / 100 * lot_count_due * agreement.base_price_per_lot_cents, 0)
      accrued_penalty_cents = min(raw, cap)
    input_set: "The tranche and its agreement"
    constants:
      PENALTY_CAP_PCT: 25
    precision: "integer cents"

  - name: declarant_control_pct_and_stage
    trigger: "LotClosing CLOSED (increment) and RESCINDED (decrement)"
    algorithm: threshold
    formula: |
      closed_unit_pct = round_half_up(closed_unit_count / total_planned_units * 100, 2)
      stage_for(pct): >= 100 -> pending turnover (stage OWNER_MAJORITY until record-turnover); >= 75.00 -> OWNER_MAJORITY;
        >= 50.00 -> PARITY; >= 25.00 -> OWNER_REPRESENTATION; else DECLARANT_CONTROL
      transition_stage ratchets: it may advance across thresholds but NEVER regresses, including on rescission
    input_set: "Community.closed_unit_count over total_planned_units"
    constants:
      THRESHOLD_OWNER_REPRESENTATION: 25.00
      THRESHOLD_PARITY: 50.00
      THRESHOLD_OWNER_MAJORITY: 75.00
      THRESHOLD_TURNOVER: 100.00
    precision: "2 decimal places, round_half_up; threshold comparison uses >= on the rounded value"

  - name: transition_seat_requirements
    trigger: "transition_stage advance (cascade from declarant_control_pct_and_stage)"
    algorithm: aggregation
    formula: |
      The board always has exactly TOTAL_SEATS seats.
      required_owner_seats = { DECLARANT_CONTROL: 0, OWNER_REPRESENTATION: 1, PARITY: 2, OWNER_MAJORITY: 3 }[stage]
      on stage advance: convert (required - current OWNER_ELECTED count) DECLARANT_APPOINTED FILLED seats
        (highest seat_no first) into OWNER_ELECTED VACANT seats (declarant appointee removed, holder cleared)
      when closed_unit_pct >= 100.00: all remaining DECLARANT_APPOINTED seats convert to OWNER_ELECTED VACANT
      record-turnover additionally requires all TOTAL_SEATS seats OWNER_ELECTED and FILLED
    input_set: "BoardSeat rows of the community"
    constants:
      TOTAL_SEATS: 5

  - name: assessment_levy_setting
    trigger: "POST /mpc/assessment-rates (computation at creation)"
    algorithm: aggregation
    formula: |
      budget must be ADOPTED and budget.fiscal_year == rate.fiscal_year
      gap_cents = budget.total_expense_cents - budget.non_assessment_income_cents   (reserve lines included in total_expense)
      assessable_units = community.total_planned_units (all planned units are assessed; declarant covers unsold inventory)
      prior = the EFFECTIVE AssessmentRate of this community for fiscal_year - 1 (null if none)
      increase_pct = prior ? round_half_up((per_unit - prior.per_unit_annual_cents) / prior.per_unit_annual_cents * 100, 2) : null
    input_set: "ADOPTED budget line items, community.total_planned_units, prior-year EFFECTIVE rate"
    precision: "integer cents; percent at 2 decimals round_half_up"
    variants:
      - name: uniform
        when: "subsidy_elected == false"
        difference: "per_unit_annual_cents = round_half_up(gap_cents / assessable_units, 0); declarant_subsidy_cents = 0"
      - name: declarant_subsidy
        when: "subsidy_elected == true AND community.transition_stage == DECLARANT_CONTROL AND prior rate exists"
        difference: "per_unit_annual_cents = prior.per_unit_annual_cents (frozen); declarant_subsidy_cents = gap_cents - prior.per_unit_annual_cents * assessable_units; increase_pct = 0.00"

  - name: quarterly_installment_rounding
    trigger: "assessment_levy_setting (derived at rate creation)"
    algorithm: aggregation
    formula: |
      annual = per_unit_annual_cents (already rounded to integer cents)
      Q1 = Q2 = Q3 = round_half_up(annual / 4, 0)
      Q4 = annual - Q1 - Q2 - Q3
      rounding order is pinned: round the ANNUAL amount to integer cents first, then derive quarters; never round per-quarter from gap_cents directly
    input_set: "AssessmentRate.per_unit_annual_cents"
    precision: "integer cents; Q4 absorbs the remainder so sum(Q1..Q4) == annual exactly"

  - name: assessment_cap_check
    trigger: "POST /mpc/assessment-rates/{rid}/arm"
    algorithm: threshold
    formula: |
      if increase_pct is null: no cap applies
      else if increase_pct <= STATUTORY_CAP_PCT: no override needed (inclusive boundary: exactly 20.00 passes)
      else: require cap_override_approved_by set, AND when transition_stage in {PARITY, OWNER_MAJORITY} additionally cap_override_ratified_by set; else ERR_ASSESSMENT_CAP_EXCEEDED
    input_set: "AssessmentRate.increase_pct, override fields, community.transition_stage"
    constants:
      STATUTORY_CAP_PCT: 20.00
    precision: "comparison on the 2-decimal rounded increase_pct; 20.00 <= 20.00 passes"

  - name: district_interest_provisional
    trigger: "on read of ReimbursementDistrict and before certification"
    algorithm: forward_looking
    formula: |
      provisional_interest_cents = sum over advances of round_half_up(amount_cents * interest_rate_annual_pct/100 * days_outstanding / 365, 0)
      days_outstanding = calendar days from advance_date to logical clock now; 0 when advance_date >= now
    input_set: "All InfrastructureAdvance rows of the district regardless of status"
    precision: "integer cents, round_half_up per advance, then sum"
    variants:
      - name: certified
        when: "POST /mpc/payments/{pid}/certify"
        difference: "daily-compound per advance to the certification timestamp: round_half_up(amount_cents * ((1 + rate/100/365) ^ days_outstanding - 1), 0); summed FIFO; produces a different (larger) figure than the simple-interest provisional for the same data"

  - name: reimbursement_waterfall
    trigger: "POST /mpc/payments/{pid}/certify"
    algorithm: waterfall_allocation
    formula: |
      order advances by advance_date ASC, tie-break created_at ASC (FIFO)
      certified_interest_cents = sum of certified (daily-compound) interest over ALL advances to the certification timestamp
      certified_principal_cents = amount_cents - certified_interest_cents; must be >= 0 else ERR_PAYMENT_EXCEEDS_OBLIGATION
      principal allocates interest-first globally, then principal to advances FIFO: each advance's reimbursed_principal_cents increases until amount_cents reached (REIMBURSED), overflow rolls to the next advance
      guard: amount_cents > outstanding_principal_cents + certified_interest_cents -> ERR_PAYMENT_EXCEEDS_OBLIGATION
    input_set: "All InfrastructureAdvance rows of the district; the payment amount"
    precision: "integer cents"

  - name: violation_fine_accrual
    trigger: "POST /mpc/violations/{vid}/levy-fine and APPEAL_DENIED resolution"
    algorithm: tiered_pricing
    formula: |
      days_late = calendar days from cure_deadline to the levy (or resolution) timestamp; <= 0 -> fine 0
      fine = min(FINE_CAP_CENTS,
                 min(days_late, 30) * TIER1_DAILY_CENTS
                 + min(max(days_late - 30, 0), 30) * TIER2_DAILY_CENTS
                 + max(days_late - 60, 0) * TIER3_DAILY_CENTS)
    input_set: "The violation's cure_deadline and the levy timestamp"
    constants:
      TIER1_DAILY_CENTS: 5000
      TIER2_DAILY_CENTS: 10000
      TIER3_DAILY_CENTS: 20000
      FINE_CAP_CENTS: 1000000
    precision: "integer cents"

  - name: review_fee_schedule
    trigger: "POST /mpc/applications/{aid}/resubmit"
    algorithm: threshold
    formula: |
      resubmit allowed only while submission_round < MAX_REVIEW_ROUNDS
      on resubmit: submission_round += 1; review_fee_cents = REVIEW_ROUND_FEES[submission_round]
      a DENIED landing at submission_round == MAX_REVIEW_ROUNDS flips the application to EXHAUSTED instead of DENIED
    input_set: "The application"
    constants:
      MAX_REVIEW_ROUNDS: 3
      REVIEW_ROUND_FEES: {2: 25000, 3: 75000}
    precision: "integer cents"

  - name: quorum_and_majority
    trigger: "POST /mpc/board-seats/{sid}/certify-election"
    algorithm: threshold
    formula: |
      quorum_required = ceil(eligible_voter_count * QUORUM_PCT / 100)
      votes_cast >= quorum_required else ERR_QUORUM_NOT_MET (inclusive boundary)
      votes_for > votes_cast / 2 (strict majority; exactly half fails) else ERR_ELECTION_MAJORITY_NOT_REACHED
    input_set: "BoardSeat.eligible_voter_count snapshot, certify payload"
    constants:
      QUORUM_PCT: 20
    precision: "quorum_required is an integer via ceiling"

  - name: amenity_trigger_breach
    trigger: "phase.closed_lot_count increment during LotClosing close"
    algorithm: threshold
    formula: |
      for each amenity of the community with trigger_phase_id == phase.id and status NOT IN {OPEN, DELINQUENT}:
        if phase.closed_lot_count > trigger_unit_count: amenity -> DELINQUENT (strictly greater: the closing that makes the count EQUAL to trigger_unit_count is safe)
        side effects per the DELINQUENT transition (event cancellations + DRAFT AMENITY_DELINQUENCY notice)
    input_set: "Amenities keyed to the closing lot's phase"
    precision: "integer comparison, strictly greater than"

  - name: event_budget_remaining
    trigger: "POST /mpc/events/{eid}/schedule when cost_cents > 0"
    algorithm: aggregation
    formula: |
      line = the budget's BudgetLineItem with category EVENTS_PROGRAMMING (0 when absent)
      committed = sum of cost_cents over CommunityEvents with charged_budget_id == budget.id and status IN {SCHEDULED, COMPLETED}
      remaining = line.amount_cents - committed; require cost_cents <= remaining else ERR_EVENT_BUDGET_EXCEEDED
    input_set: "The charged ADOPTED budget, its line items, and events charged to it"
    precision: "integer cents; cost_cents == remaining passes (inclusive)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must name a declared role and X-User-ID header must be present (except platform clock is still authenticated); missing or unknown -> ERR_UNAUTHENTICATED"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The role named by X-User-Role must be in the endpoint's roles list -> ERR_FORBIDDEN_ROLE"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids validated left-to-right; then body FK ids (community_id, phase_id, builder_id, agreement_id, lot_id, budget_id, district_id, event_id, resident_id, owner_resident_id, holder_resident_id, trigger_phase_id, charged_budget_id, assessment_rate_id, applicant/respondent ids) must exist -> per-resource ERR_*_NOT_FOUND"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path or body resource references
  - priority: 3.5
    category: existence
    check: "Request body must contain all required input fields with correct primitive types, valid enum members, and no undeclared fields -> ERR_VALIDATION"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all POST endpoints
  - priority: 4
    category: state
    check: "Target entity must be in a valid from-state for the requested transition (generic ERR_INVALID_STATE), plus domain state gates: ERR_COMMUNITY_NOT_ACTIVE, ERR_PHASE_NOT_OPEN_FOR_SALES, ERR_AGREEMENT_NOT_ACTIVE, ERR_LOT_NOT_OFFERED, ERR_LOT_NOT_UNDER_CONTRACT, ERR_BUILDER_NOT_IN_GOOD_STANDING, ERR_OUTSTANDING_COMPLIANCE_DEFAULTS, ERR_CLOSEOUT_BLOCKED, ERR_CLOSINGS_PENDING, ERR_BUDGET_EMPTY, ERR_BUDGET_NOT_ADOPTED, ERR_NOTICE_NOT_SENT, ERR_TRANCHE_NOT_CURABLE, ERR_CURE_WINDOW_OPEN, ERR_SEAT_NOT_VACANT, ERR_REVIEW_ROUNDS_EXHAUSTED, ERR_DECLARANT_AUTHORITY_ENDED, ERR_SUBSIDY_NOT_AVAILABLE, ERR_NO_PRIOR_RATE, ERR_TRANSITION_THRESHOLD_NOT_MET, ERR_TURNOVER_SEATS_NOT_FILLED"
    error_id: "ERR_INVALID_STATE and domain-specific state errors"
    http_status: 409
    applies_to: state transition and gated action endpoints
  - priority: 5
    category: concurrency
    check: "expected_<parent>_version on amendment endpoints must equal the parent's current version -> ERR_STALE_VERSION"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mpc/agreements/{aid}/amendments, POST /mpc/budgets/{bid}/amendments"
  - priority: 6
    category: business_safety
    check: "Event scheduling at a CLUBHOUSE/POOL_DECK/EVENT_LAWN venue requires the mapped amenity in {UNDER_CONSTRUCTION, OPEN} (residents may not be booked into facilities not yet under construction or delinquent) -> ERR_AMENITY_NOT_OPEN"
    error_id: ERR_AMENITY_NOT_OPEN
    http_status: 409
    applies_to: "POST /mpc/events/{eid}/schedule"
  - priority: 7
    category: business_temporal
    check: "Time-window rules: event start_at >= now + 14d (ERR_EVENT_LEAD_TIME); budget-adoption notice sent_at <= now - 14d and assessment notice sent_at <= fiscal-year-start - 30d (ERR_NOTICE_LEAD_TIME); rescind within 30d of closing (ERR_RESCISSION_WINDOW_EXPIRED); appeal within 30d of fine (ERR_APPEAL_WINDOW_EXPIRED); schedule requires future send_at / hearing_date (ERR_SEND_AT_IN_PAST)"
    error_id: "ERR_EVENT_LEAD_TIME | ERR_NOTICE_LEAD_TIME | ERR_RESCISSION_WINDOW_EXPIRED | ERR_APPEAL_WINDOW_EXPIRED | ERR_SEND_AT_IN_PAST"
    http_status: 422
    applies_to: "event schedule, budget adopt, rate arm, closing rescind, violation appeal, notice schedule, violation schedule-hearing"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/sequence/segregation: phase sequence_no unique per community and opening order gated (ERR_PHASE_SEQUENCE_BLOCKED); one non-SUPERSEDED budget per fiscal year (ERR_DUPLICATE_FISCAL_YEAR); one non-SUPERSEDED rate per fiscal year (ERR_DUPLICATE_ASSESSMENT_YEAR); one district per community (ERR_DUPLICATE_DISTRICT); tranche_no unique per agreement (ERR_DUPLICATE_TRANCHE_NO); parcel_number and resident email unique per community (ERR_VALIDATION); venue half-open overlap (ERR_VENUE_OVERLAP); sales-center aggregate capacity 3 (ERR_TOUR_CAPACITY_REACHED); reviewer != applicant and != last denier and decision-maker == reviewer_user_id (ERR_REVIEWER_CONFLICT); ratifier != adopter (ERR_ADOPTER_CANNOT_RATIFY); appeal resolver != fine levier (ERR_HEARING_OFFICER_CONFLICT); quorum and majority (ERR_QUORUM_NOT_MET, ERR_ELECTION_MAJORITY_NOT_REACHED)"
    error_id: "ERR_PHASE_SEQUENCE_BLOCKED | ERR_DUPLICATE_FISCAL_YEAR | ERR_DUPLICATE_ASSESSMENT_YEAR | ERR_DUPLICATE_DISTRICT | ERR_DUPLICATE_TRANCHE_NO | ERR_VENUE_OVERLAP | ERR_TOUR_CAPACITY_REACHED | ERR_REVIEWER_CONFLICT | ERR_ADOPTER_CANNOT_RATIFY | ERR_HEARING_OFFICER_CONFLICT | ERR_QUORUM_NOT_MET | ERR_ELECTION_MAJORITY_NOT_REACHED"
    http_status: 409
    applies_to: create endpoints, event schedule, appointments, review actions, budget ratify, appeal resolve, election certify
  - priority: 9
    category: business_referential
    check: "Cross-entity field consistency: closing lot must belong to the agreement's phase (ERR_LOT_PHASE_MISMATCH); design application needs exactly one of applicant_builder_id/applicant_resident_id (ERR_APPLICANT_IDENTITY_INVALID); violation needs exactly one respondent id (ERR_RESPONDENT_IDENTITY_INVALID); rate fiscal_year must equal its budget's fiscal_year (ERR_FISCAL_YEAR_MISMATCH); resident record-purchase lot must be in the resident's community (ERR_RESIDENT_COMMUNITY_MISMATCH); at execute, sum of tranche lot_count_due must equal total_lots_committed, and amendments must re-cover total_lots_committed - lots_closed_count (ERR_TRANCHE_COVERAGE_MISMATCH); election holder must be an eligible OWNER (ERR_HOLDER_NOT_ELIGIBLE)"
    error_id: "ERR_LOT_PHASE_MISMATCH | ERR_APPLICANT_IDENTITY_INVALID | ERR_RESPONDENT_IDENTITY_INVALID | ERR_FISCAL_YEAR_MISMATCH | ERR_RESIDENT_COMMUNITY_MISMATCH | ERR_TRANCHE_COVERAGE_MISMATCH | ERR_HOLDER_NOT_ELIGIBLE"
    http_status: 422
    applies_to: create/action endpoints with cross-entity references
  - priority: 10
    category: business_fiscal
    check: "Fiscal guards last: district funds cover payment (ERR_INSUFFICIENT_DISTRICT_FUNDS, 402); payment within certified obligation (ERR_PAYMENT_EXCEEDS_OBLIGATION, 402); assessment cap without override (ERR_ASSESSMENT_CAP_EXCEEDED, 422); event within EVENTS_PROGRAMMING remaining (ERR_EVENT_BUDGET_EXCEEDED, 402); exact penalty/fine payment amounts (ERR_PENALTY_AMOUNT_MISMATCH, 402)"
    error_id: "ERR_INSUFFICIENT_DISTRICT_FUNDS | ERR_PAYMENT_EXCEEDS_OBLIGATION | ERR_ASSESSMENT_CAP_EXCEEDED | ERR_EVENT_BUDGET_EXCEEDED | ERR_PENALTY_AMOUNT_MISMATCH"
    http_status: 402
    applies_to: payment pay/certify, rate arm, event schedule, tranche cure, violation record-payment

# =============================================================================
# 1.5 API Endpoint Table
# ALL_GET_ROLES below expands to all nine roles (read endpoints are role-agnostic
# but still authenticated): DeclarantExecutive, DeclarantController, BuilderRep,
# AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator,
# HomeownerResident, PlatformAdmin.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs the sweep: tranches SCHEDULED->OPEN / OPEN->MISSED (builder -> PROBATION), notices SCHEDULED->SENT (sent_at = send_at), events SCHEDULED->COMPLETED, rates ARMED->EFFECTIVE, applications APPROVED->EXPIRED past construction_start_by, seats ELECTION_CALLED->LAPSED, amenities past hard_deadline_date -> DELINQUENT."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, transitions_applied: integer }
    side_effects: ["Clock sweep auto-transitions listed in the description"]

  # --- Community ---
  - method: POST
    path: "/mpc/communities"
    description: "Create a community (starts PLANNING, stage DECLARANT_CONTROL)"
    roles: [DeclarantExecutive]
    code: 201
    input: [community_name, total_planned_units]
    output: Community
    side_effects: ["closed_unit_count = 0, transition_stage = DECLARANT_CONTROL"]
  - method: GET
    path: "/mpc/communities"
    description: "List communities (paginated)"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Community[]"
    side_effects: []
  - method: GET
    path: "/mpc/communities/{cid}"
    description: "Get one community (includes computed closed_unit_count, closed_unit_pct, transition_stage)"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: Community
    side_effects: []
  - method: POST
    path: "/mpc/communities/{cid}/activate"
    description: "Activate a PLANNING community and seat the declarant board"
    roles: [DeclarantExecutive]
    code: 200
    input: [declarant_director_names]
    output: Community
    side_effects: ["status -> ACTIVE", "Creates 5 FILLED DECLARANT_APPOINTED BoardSeats (seat_no 1..5)"]
  - method: POST
    path: "/mpc/communities/{cid}/record-turnover"
    description: "Record statutory turnover to owner control"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: Community
    side_effects: ["status -> TURNOVER_RECORDED", "transition_stage -> TURNOVER_COMPLETE"]
  - method: GET
    path: "/mpc/communities/{cid}/summary"
    description: "Computed governance dashboard for a community"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: { closed_unit_count: integer, closed_unit_pct: number, transition_stage: string, owner_elected_seats_filled: integer, owner_elected_seats_vacant: integer }
    side_effects: []

  # --- DevelopmentPhase ---
  - method: POST
    path: "/mpc/phases"
    description: "Create a phase (PLANNED)"
    roles: [DeclarantExecutive]
    code: 201
    input: [community_id, phase_name, sequence_no, planned_lot_count]
    output: DevelopmentPhase
    side_effects: []
  - method: GET
    path: "/mpc/phases"
    description: "List phases, optionally by community"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "DevelopmentPhase[]"
    side_effects: []
  - method: GET
    path: "/mpc/phases/{pid}"
    description: "Get one phase"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: DevelopmentPhase
    side_effects: []
  - method: POST
    path: "/mpc/phases/{pid}/open-sales"
    description: "Open a phase for lot sales (sequencing gate applies)"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: DevelopmentPhase
    side_effects: ["status -> SALES_OPEN"]
  - method: POST
    path: "/mpc/phases/{pid}/close-out"
    description: "Close out a DELIVERING phase (all lots terminal, all agreements terminal)"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: DevelopmentPhase
    side_effects: ["status -> CLOSED_OUT"]
  - method: POST
    path: "/mpc/phases/{pid}/cancel"
    description: "Cancel a phase with no closings; cascades to lots and unexecuted agreements"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: DevelopmentPhase
    side_effects: ["status -> CANCELLED", "lots -> WITHDRAWN", "{DRAFT, EXECUTED} agreements -> TERMINATED, their {SCHEDULED, OPEN} tranches -> CANCELLED"]

  # --- Amenity ---
  - method: POST
    path: "/mpc/amenities"
    description: "Commit an amenity with its delivery trigger/deadline"
    roles: [DeclarantExecutive]
    code: 201
    input: [community_id, amenity_type, hard_deadline_date, budgeted_cost_cents, "trigger_phase_id?", "trigger_unit_count?"]
    output: Amenity
    side_effects: ["status = COMMITTED"]
  - method: GET
    path: "/mpc/amenities"
    description: "List amenities, optionally by community or trigger phase"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "trigger_phase_id?", "limit?", "offset?"]
    output: "Amenity[]"
    side_effects: []
  - method: GET
    path: "/mpc/amenities/{aid}"
    description: "Get one amenity"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: Amenity
    side_effects: []
  - method: POST
    path: "/mpc/amenities/{aid}/start-design"
    description: "COMMITTED -> IN_DESIGN"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: Amenity
    side_effects: ["status -> IN_DESIGN"]
  - method: POST
    path: "/mpc/amenities/{aid}/start-construction"
    description: "IN_DESIGN -> UNDER_CONSTRUCTION"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: Amenity
    side_effects: ["status -> UNDER_CONSTRUCTION"]
  - method: POST
    path: "/mpc/amenities/{aid}/open"
    description: "UNDER_CONSTRUCTION or DELINQUENT -> OPEN"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: Amenity
    side_effects: ["status -> OPEN"]

  # --- Builder ---
  - method: POST
    path: "/mpc/builders"
    description: "Credential a builder for a community"
    roles: [DeclarantExecutive]
    code: 201
    input: [community_id, legal_name, credit_tier]
    output: Builder
    side_effects: ["standing = GOOD_STANDING"]
  - method: GET
    path: "/mpc/builders"
    description: "List builders, optionally by community"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "Builder[]"
    side_effects: []
  - method: GET
    path: "/mpc/builders/{bid}"
    description: "Get one builder"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: Builder
    side_effects: []
  - method: POST
    path: "/mpc/builders/{bid}/reinstate"
    description: "Restore GOOD_STANDING after compliance defaults are cleared"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: Builder
    side_effects: ["standing -> GOOD_STANDING"]

  # --- LotPurchaseAgreement ---
  - method: POST
    path: "/mpc/agreements"
    description: "Draft a builder lot sales agreement"
    roles: [DeclarantController]
    code: 201
    input: [community_id, builder_id, phase_id, base_price_per_lot_cents, annual_escalation_pct, penalty_per_lot_per_day_cents, earnest_money_cents, total_lots_committed]
    output: LotPurchaseAgreement
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/mpc/agreements"
    description: "List agreements, filterable by community, builder, phase"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "builder_id?", "phase_id?", "limit?", "offset?"]
    output: "LotPurchaseAgreement[]"
    side_effects: []
  - method: GET
    path: "/mpc/agreements/{aid}"
    description: "Get one agreement"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: LotPurchaseAgreement
    side_effects: []
  - method: POST
    path: "/mpc/agreements/{aid}/execute"
    description: "Execute a DRAFT agreement (tranche coverage must equal total_lots_committed)"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: LotPurchaseAgreement
    side_effects: ["status -> EXECUTED", "execution_date = logical clock", "increments LotPurchaseAgreement.version by 1"]
  - method: POST
    path: "/mpc/agreements/{aid}/commence"
    description: "EXECUTED -> ACTIVE (takedown obligations begin)"
    roles: [DeclarantController]
    code: 200
    input: []
    output: LotPurchaseAgreement
    side_effects: ["status -> ACTIVE", "increments LotPurchaseAgreement.version by 1"]
  - method: POST
    path: "/mpc/agreements/{aid}/terminate"
    description: "Terminate a DRAFT/EXECUTED/ACTIVE agreement; open tranches are cancelled"
    roles: [DeclarantExecutive]
    code: 200
    input: []
    output: LotPurchaseAgreement
    side_effects: ["status -> TERMINATED", "tranches in {SCHEDULED, OPEN} -> CANCELLED", "increments LotPurchaseAgreement.version by 1"]
  - method: POST
    path: "/mpc/agreements/{aid}/amendments"
    description: "Supersede the remaining takedown schedule (OCC-guarded create-with-supersede). New tranches must re-cover total_lots_committed - lots_closed_count. Allowed while EXECUTED or ACTIVE."
    roles: [DeclarantController]
    code: 201
    input: [expected_agreement_version, replacement_tranches]
    output: LotPurchaseAgreement
    side_effects: ["Non-terminal tranches (SCHEDULED, OPEN) -> CANCELLED", "replacement_tranches created as SCHEDULED TakedownTranche rows", "increments LotPurchaseAgreement.version by 1"]

