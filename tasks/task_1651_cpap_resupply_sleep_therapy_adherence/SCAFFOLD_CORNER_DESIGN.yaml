# =============================================================================
# Task 1651 — §1.9 Scaffold Corner Design (Coverage Index)
# Breadth probe: every testable claim not already covered by §1.8
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_creation_required_fields
        claim_type: creation
        grounds: [entities.Patient, endpoints."POST /sleep-therapy/patients"]
        distinguishing_aspect: "POST with all required fields -> 201, patient_status=INTAKE, server-minted id, version=1"
        test_recipe:
          setup: ["PayerPolicy p1 exists"]
          setup_api_calls:
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppx: $.data.id }
          trigger:
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "New Patient", date_of_birth: "1990-01-01", payer_policy_id: "${ppx}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patx: $.data.id, patx_status: $.data.patient_status, patx_v: $.data.version }
          assert:
            - "Patient.${patx}.patient_status == 'INTAKE'"
            - "Patient.${patx}.version == 1"

      - name: patient_creation_missing_required_field_rejected
        claim_type: violation_to_error
        grounds: [entities.Patient.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field full_name -> 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["PayerPolicy p1 exists"]
          setup_api_calls:
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppy: $.data.id }
          trigger:
            - call: "POST /sleep-therapy/patients"
              payload: { date_of_birth: "1990-01-01", payer_policy_id: "${ppy}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST'"

      - name: patient_get_not_found
        claim_type: not_found
        grounds: [entities.Patient, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with non-existent UUID -> 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty"]
          setup_api_calls: []
          trigger:
            - call: "GET /sleep-therapy/patients/{id}"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_NOT_FOUND'"

      - name: patient_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Patient, endpoints."GET /sleep-therapy/patients", response_envelope]
        distinguishing_aspect: "List returns pagination envelope with limit/offset/total_count/has_more"
        test_recipe:
          setup: ["two patients exist"]
          setup_api_calls:
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppz: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "P1", date_of_birth: "1990-01-01", payer_policy_id: "${ppz}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "P2", date_of_birth: "1991-02-02", payer_policy_id: "${ppz}", prescribing_clinician_npi: "1234567891" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /sleep-therapy/patients"
              payload: { limit: 1, offset: 0 }
              as: OpsAdmin
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count >= 2"
            - "has_more == true when limit=1 and total>=2"

      - name: patient_computed_fields_present
        claim_type: computed_field_correctness
        grounds: [entities.Patient.fields.adherence_percentage, entities.Patient.fields.is_compliance_current, entities.Patient.fields.outstanding_balance_cents]
        distinguishing_aspect: "Computed fields default correctly: adherence_percentage null pre-report, is_compliance_current false pre-report, outstanding_balance_cents 0"
        test_recipe:
          setup: ["PayerPolicy, Patient INTAKE"]
          setup_api_calls:
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppc: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Comp", date_of_birth: "1985-01-01", payer_policy_id: "${ppc}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patc: $.data.id }
          trigger:
            - call: "GET /sleep-therapy/patients/${patc}"
              payload: {}
              as: OpsAdmin
              captures: { ap: $.data.adherence_percentage, ic: $.data.is_compliance_current, ob: $.data.outstanding_balance_cents }
          assert:
            - "adherence_percentage is null before any FINALIZED report (${ap} == null)"
            - "is_compliance_current == false (${ic})"
            - "outstanding_balance_cents == 0 (${ob})"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: resupply_order_invalid_transition_ship_before_authorize
        claim_type: invalid_transition
        grounds: [state_machines.ResupplyOrder, "errors[ERR_ORDER_NOT_READY_TO_SHIP]"]
        distinguishing_aspect: "ship from PENDING_CLINICAL_CLEARANCE -> ERR_ORDER_NOT_READY_TO_SHIP"
        test_recipe:
          setup: ["Patient PURCHASE setup complete; order created (auth=PENDING_CLINICAL_CLEARANCE, fulfillment=NOT_READY)"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppd: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "D", date_of_birth: "1980-01-01", payer_policy_id: "${ppd}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patd: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${patd}", device_serial: "SN-D", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { ded: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${ded}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${ded}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${patd}", component_type: "FILTER" }
              as: OpsAdmin
              captures: { fd: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${patd}"
              payload: {}
              as: OpsAdmin
              captures: { patd_v: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${patd}", component_supply_plan_id: "${fd}", requested_quantity: 1, expected_patient_version: "${patd_v}" }
              as: IntakeCoordinator
              captures: { rod: $.data.id }
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${rod}/ship"
              payload: { expected_patient_version: "${patd_v}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_ORDER_NOT_READY_TO_SHIP'"

      - name: adherence_report_finalize_from_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AdherenceReport, "errors[ERR_REPORT_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "finalize from RECEIVED (skipping begin-review) -> ERR_REPORT_NOT_UNDER_REVIEW"
        test_recipe:
          setup: ["Patient PURCHASE setup complete; AdherenceReport created (status=RECEIVED)"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppe: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "E", date_of_birth: "1980-01-01", payer_policy_id: "${ppe}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pate: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pate}", device_serial: "SN-E", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { dee: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${dee}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${dee}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pate}", device_enrollment_id: "${dee}", window_end_on: "2026-08-30", nights_reported: 30, compliant_nights: 25 }
              as: RespiratoryTherapist
              captures: { are: $.data.id }
          trigger:
            - call: "POST /sleep-therapy/adherence-reports/${are}/finalize"
              payload: {}
              as: RespiratoryTherapist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_REPORT_NOT_UNDER_REVIEW'"

      - name: mask_exchange_terminal_denied_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MaskExchange, "errors[ERR_EXCHANGE_NOT_REQUESTED]"]
        distinguishing_aspect: "from DENIED, no further transitions possible; approve attempt -> ERR_EXCHANGE_NOT_REQUESTED"
        test_recipe:
          setup: ["MaskExchange created and denied"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppf: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "F", date_of_birth: "1980-01-01", payer_policy_id: "${ppf}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patf: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${patf}", device_serial: "SN-F", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { def_: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${def_}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${def_}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${patf}", component_type: "MASK" }
              as: OpsAdmin
              captures: { mf: "$.data[0].id" }
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${patf}", device_enrollment_id: "${def_}", original_mask_plan_id: "${mf}", reason_code: "FIT_LEAK" }
              as: IntakeCoordinator
              captures: { mef: $.data.id }
            - call: "POST /sleep-therapy/mask-exchanges/${mef}/deny"
              payload: {}
              as: RespiratoryTherapist
          trigger:
            - call: "POST /sleep-therapy/mask-exchanges/${mef}/approve"
              payload: {}
              as: RespiratoryTherapist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_EXCHANGE_NOT_REQUESTED'"

      - name: patient_terminal_discontinued_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Patient, "errors[ERR_PATIENT_NOT_DISCONTINUABLE]"]
        distinguishing_aspect: "from DISCONTINUED, initiate-discontinuation -> ERR_PATIENT_NOT_DISCONTINUABLE"
        test_recipe:
          setup: ["Patient driven to DISCONTINUED via full retrieval flow"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppg: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "G", date_of_birth: "1980-01-01", payer_policy_id: "${ppg}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patg: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${patg}", device_serial: "SN-G", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { deg: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${deg}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${deg}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/patients/${patg}/initiate-discontinuation"
              payload: { reason_code: "THERAPY_DISCONTINUED" }
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/retrieval-cases"
              payload: { patient_id: "${patg}" }
              as: OpsAdmin
              captures: { retg: "$.data[0].id" }
            - call: "POST /sleep-therapy/retrieval-cases/${retg}/schedule-pickup"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/retrieval-cases/${retg}/mark-picked-up"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/retrieval-cases/${retg}/mark-received"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/retrieval-cases/${retg}/reconcile"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /sleep-therapy/patients/${patg}/initiate-discontinuation"
              payload: { reason_code: "PATIENT_REQUEST" }
              as: RespiratoryTherapist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_PATIENT_NOT_DISCONTINUABLE'"

      - name: resupply_order_initial_state
        claim_type: initial_state
        grounds: [state_machines.ResupplyOrder]
        distinguishing_aspect: "Newly created order has auth_status=PENDING_CLINICAL_CLEARANCE, fulfillment_status=NOT_READY"
        test_recipe:
          setup: ["Patient PURCHASE setup complete"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pph: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "H", date_of_birth: "1980-01-01", payer_policy_id: "${pph}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { path: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${path}", device_serial: "SN-H", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { deh: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${deh}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${deh}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${path}", component_type: "TUBING" }
              as: OpsAdmin
              captures: { th: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${path}"
              payload: {}
              as: OpsAdmin
              captures: { path_v: $.data.version }
          trigger:
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${path}", component_supply_plan_id: "${th}", requested_quantity: 1, expected_patient_version: "${path_v}" }
              as: IntakeCoordinator
              captures: { roh_auth: $.data.auth_status, roh_fulf: $.data.fulfillment_status }
          assert:
            - "${roh_auth} == 'PENDING_CLINICAL_CLEARANCE'"
            - "${roh_fulf} == 'NOT_READY'"

      - name: adherence_report_reject_leaves_patient_unchanged
        claim_type: side_effect_absent
        grounds: [state_machines.AdherenceReport.UNDER_REVIEW_to_REJECTED]
        distinguishing_aspect: "Rejecting a report does NOT update Patient.adherence_percentage, is_compliance_current, or patient_status"
        test_recipe:
          setup: ["Patient ACTIVE_THERAPY, no prior finalized reports; AdherenceReport in UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppi: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "I", date_of_birth: "1980-01-01", payer_policy_id: "${ppi}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pati: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pati}", device_serial: "SN-I", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { dei: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${dei}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${dei}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pati}", device_enrollment_id: "${dei}", window_end_on: "2026-08-30", nights_reported: 30, compliant_nights: 5 }
              as: RespiratoryTherapist
              captures: { ari: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ari}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/patients/${pati}"
              payload: {}
              as: OpsAdmin
              captures: { pati_pre_status: $.data.patient_status, pati_pre_pct: $.data.adherence_percentage }
          trigger:
            - call: "POST /sleep-therapy/adherence-reports/${ari}/reject"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/patients/${pati}"
              payload: {}
              as: OpsAdmin
              captures: { pati_post_status: $.data.patient_status, pati_post_pct: $.data.adherence_percentage }
          assert:
            - "patient_status unchanged: ${pati_post_status} == ${pati_pre_status} == 'ACTIVE_THERAPY'"
            - "adherence_percentage unchanged: ${pati_post_pct} == ${pati_pre_pct} (both null)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: adherence_provisional_zero_nights
        claim_type: correct_result
        grounds: [calculations.adherence_percentage_dual_variant]
        distinguishing_aspect: "nights_reported=0 -> adherence_pct_provisional = 0.0 (zero-count edge)"
        test_recipe:
          setup: ["Patient PURCHASE setup complete"]
          setup_api_calls:
