      - name: experience_period_shared_boundary_month_versus_adjacent_month
        grounds:
          - calculations.experience_period_overlap
          - validations[priority=18]
          - errors.ERR_EXPERIENCE_PERIOD_OVERLAP
          - calculations.experience_credit_evaluation
          - endpoints[GET /experience-records]
        distinguishing_aspect: |
          A month-granular, CLOSED-inclusive interval domain with NO buffer — deliberately the opposite
          convention from the half-open, 45-minute-buffered seat intervals in the same scaffold, so an
          implementation cannot share one comparison helper between the two. 2024-06..2024-11 collides on a
          single shared endpoint month and must be refused, while 2024-07..2024-12 abuts the incumbent with
          a zero-month gap and must be accepted; a half-open reading accepts both and a buffered reading
          refuses both.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Sana Iyer' has a DRAFT STANDARD_EXAM application with EABET_ACCREDITED education."
            - "It carries exactly one ExperienceRecord: PROGRESSIVE, post-degree, 2024-01..2024-06 (6 raw months, multiplier 0.75, floor(4.5) = 4 credited months)."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Sana Iyer", email: "sana.iyer@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
