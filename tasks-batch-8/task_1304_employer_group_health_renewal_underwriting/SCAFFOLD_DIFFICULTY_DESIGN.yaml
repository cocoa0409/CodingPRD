  - rule_id: transitive_cascade
    instances:
      - name: accept_supersedes_sibling_quote_and_rejects_rounds
        grounds:
          - state_machines.Quote.PROPOSED_to_ACCEPTED
          - state_machines.Quote.PROPOSED_to_SUPERSEDED
          - state_machines.NegotiationRound.PROPOSED_to_REJECTED
          - state_machines.BenefitPlanDesign.MODELED_to_SELECTED
          - state_machines.UnderwritingCase.QUOTED_to_APPROVED
        distinguishing_aspect: |
          Depth-3 cascade triggered by quote proposal/acceptance: proposing Q2 (a newer quote)
          mutates sibling Q1 -> SUPERSEDED, and Q1's supersession itself mutates Q1's
          NegotiationRounds -> REJECTED; the subsequent accept then mutates case -> APPROVED,
          plan -> SELECTED and creates CommissionDisclosure. Distinct trigger from the
          claims-review cascade instance.
        test_recipe:
          setup:
            - "Case QUOTED; Q1 PROPOSED with 2 negotiation rounds (counter+respond cycle done); Q2 DRAFT (created while case was RATING_IN_PROGRESS)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
