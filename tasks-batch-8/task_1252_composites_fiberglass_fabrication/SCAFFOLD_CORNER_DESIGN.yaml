      - name: theoretical_weight_computed_at_creation
        claim_type: correct_result
        grounds: [calculations.theoretical_part_weight_g, entities.WorkOrder.fields.target_part_weight_g]
        distinguishing_aspect: "fiber_mass_g = (200 + 300) * 2.0 = 1000 g; target = 1000 / 0.5 = 2000.0 g, stored at work order creation and never recomputed."
        test_recipe:
          setup: ["Approved PN-100; production mold"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-TW1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
