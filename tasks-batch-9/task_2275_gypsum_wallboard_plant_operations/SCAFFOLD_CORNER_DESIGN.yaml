            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-3", name: "Silo Constrained Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 50, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
