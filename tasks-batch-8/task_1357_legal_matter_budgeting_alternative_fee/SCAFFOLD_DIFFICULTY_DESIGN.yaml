      - name: segregation_vs_fiscal_priority_on_amendment_decide
        grounds:
          - validations[priority=8]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair: business_safety (ERR_SEGREGATION_OF_DUTIES,
          priority 8) vs business_fiscal (ERR_AMENDMENT_AUTHORITY_EXCEEDED,
          priority 15). When the SAME user requests and decides AND the
          amendment magnitude exceeds the decider's authority, the
          segregation-of-duties error (priority 8) MUST win. Setup uses a
