  - rule_id: boundary_precision_check
    instances:
      - name: appointment_end_exactly_at_window_close_allowed
        grounds:
          - calculations.appointment_window_and_overlap
          - errors[ERR_SLOT_OUTSIDE_WINDOW]
          - endpoints: "POST /api/appointments"
        distinguishing_aspect: |
          Metric: window minutes on POST /api/appointments. The window close is INCLUSIVE:
          an appointment whose effective end equals last_patient_time (16:00) is accepted, while
          one ending at 16:01 is rejected with ERR_SLOT_OUTSIDE_WINDOW. Distinct metric and
          endpoint from the dose-limit staffing boundary.
        test_recipe:
          setup:
            - "Bookable site day (SCHEDULED) with window 08:30-16:00"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
          trigger:
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-OVER", exam_type: "CT_HEAD", scheduled_start: "15:31", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { err: $.data.error_id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-EDGE", exam_type: "CT_HEAD", scheduled_start: "15:30", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { edge_id: $.data.id, edge_status: $.data.status } }
          assert:
            - "15:31 + 30 min = 16:01 > 16:00 -> ERR_SLOT_OUTSIDE_WINDOW (${err}), HTTP 422"
            - "15:30 + 30 min = 16:00 == last_patient_time -> created (${edge_id}), status REQUESTED (${edge_status}) — inclusive close"

      - name: projected_dose_exactly_at_limit_allowed
        grounds:
          - calculations.technologist_dose_projection
          - errors[ERR_DOSE_LIMIT_EXCEEDED]
          - endpoints: "POST /api/staffing-assignments"
        distinguishing_aspect: |
          Metric: mSv on POST /api/staffing-assignments. The gate rejects strictly-greater:
          projected exactly 5.0 mSv is allowed, 5.2 is rejected with ERR_DOSE_LIMIT_EXCEEDED.
          Distinct metric and endpoint from the appointment window boundary.
        test_recipe:
          setup:
            - "Day X (2026-08-04) with two appointments estimated 2.5 each -> projected exactly 5.0"
            - "Day Y (2026-08-05) with two appointments estimated 2.6 each -> projected 5.2"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_x: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-05", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_y: $.data.id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_x}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 2.5 }, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_x}", patient_ref: "P-002", exam_type: "CT_HEAD", scheduled_start: "09:40", duration_minutes: 30, estimated_dose_msv: 2.5 }, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_y}", patient_ref: "P-003", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 2.6 }, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_y}", patient_ref: "P-004", exam_type: "CT_HEAD", scheduled_start: "09:40", duration_minutes: 30, estimated_dose_msv: 2.6 }, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
          trigger:
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_x}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector, captures: { staff_x: $.data.id, proj_x: $.data.projected_dose_msv } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_y}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "Day X: projected_dose_msv == 5.0 (${proj_x}) — exactly at the limit, assignment CREATED (${staff_x}); == does not reject"
            - "Day Y: projected 5.2 > 5.0 -> ERR_DOSE_LIMIT_EXCEEDED (${err}), HTTP 422"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: begin_scan_gated_by_site_day_in_service
        grounds:
          - state_machines.PatientAppointment.CHECKED_IN_to_SCANNING
          - state_machines.SiteDayAssignment.READY_to_IN_SERVICE
          - errors[ERR_SITE_DAY_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Entity pair (PatientAppointment, SiteDayAssignment): the appointment's
          CHECKED_IN -> SCANNING transition is gated by the parent day's status == IN_SERVICE;
          on a READY day it fails with ERR_SITE_DAY_NOT_IN_SERVICE and succeeds after
          start-service. Distinct entity pair from the (SiteDayAssignment, AccreditationRecord)
          sibling.
        test_recipe:
          setup:
            - "Site day driven to READY (checklist ALL_PASSED) but NOT yet IN_SERVICE; one CONFIRMED appointment checked in"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
