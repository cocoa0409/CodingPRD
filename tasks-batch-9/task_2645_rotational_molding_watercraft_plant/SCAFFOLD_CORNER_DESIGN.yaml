            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
          trigger:
            - call: "GET /production-orders/${po}/cost-summary"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - call: "GET /production-orders/${po}/cost-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "the first cost-summary returns status 200 with consumed_charge_count 0, material_cost_cents 0, demolded_cycle_count 0, oven_energy_cost_cents 0 and pre_overhead_subtotal_cents 0"
            - "the first cost-summary returns overhead_rate_pct 18.00, overhead_cents 0, total_cost_cents 0, completed_qty 0 and unit_cost_cents null"
            - "the second cost-summary returns consumed_charge_count 1 and material_cost_cents 5040"
            - "the second cost-summary returns demolded_cycle_count 1 and oven_energy_cost_cents 6000"
            - "the second cost-summary returns pre_overhead_subtotal_cents 11040 and overhead_rate_pct 18.00"
