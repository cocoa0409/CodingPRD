  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sprint_window_half_open_overlap_on_same_retainer
        grounds:
          - validations[priority=20]
          - entities.Sprint.fields.starts_at
          - entities.Sprint.fields.ends_at
        distinguishing_aspect: |
          On the Sprint resource, windows are HALF-OPEN [starts_at, ends_at): a second sprint on the
          same retainer starting 2026-04-15 (inside [04-01, 05-01)) is rejected with
          ERR_SPRINT_WINDOW_OVERLAP, but a sprint starting exactly at the prior ends_at (2026-05-01)
          is ADJACENT and allowed.
        test_recipe:
          setup:
            - "ACTIVE retainer; one PLANNING sprint [2026-04-01, 2026-05-01)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "OvlA Co", primary_domain: "ovla.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "Apr", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp1_id: $.data.id }
          trigger:
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "Mid", starts_at: "2026-04-15T00:00:00Z", ends_at: "2026-05-15T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "May", starts_at: "2026-05-01T00:00:00Z", ends_at: "2026-06-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp3_id: $.data.id }
          assert:
            - "Overlapping create (starts 04-15 inside [04-01,05-01)) returns error_id == ERR_SPRINT_WINDOW_OVERLAP"
            - "Adjacent create (starts exactly 05-01 == prior ends_at) succeeds and returns a Sprint id"

      - name: report_period_closed_buffer_overlap_on_same_client
        grounds:
          - validations[priority=21]
          - entities.Report.fields.period_start
          - entities.Report.fields.period_end
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Report): periods are CLOSED with a
          REPORT_GAP_DAYS=1 buffer, so a new period_start must be strictly > prior period_end + 1 day.
          A new period starting 2026-05-01 after a prior [2026-04-01, 2026-04-30] is within the 1-day
          buffer (04-30 + 1 day = 05-01, not strictly greater) and is rejected with ERR_REPORT_PERIOD_OVERLAP,
          while starting 2026-05-02 is allowed.
        test_recipe:
          setup:
            - "ACTIVE client with one prior Report covering [2026-04-01, 2026-04-30]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "OvlB Co", primary_domain: "ovlb.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /clients/${cl_id}/reports"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: AccountManager
              captures: { rep1_id: $.data.client_id }
          trigger:
            - call: "POST /clients/${cl_id}/reports"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T00:00:00Z" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /clients/${cl_id}/reports"
              payload: { period_start: "2026-05-02T00:00:00Z", period_end: "2026-05-31T00:00:00Z" }
              as: AccountManager
              captures: { ok_traffic: $.data.total_traffic }
          assert:
            - "Within-buffer create (start 05-01 == 04-30 + 1 day) returns error_id == ERR_REPORT_PERIOD_OVERLAP"
            - "Outside-buffer create (start 05-02 > 04-30 + 1 day) succeeds"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_pool_conserved_across_assign_then_reject
        grounds:
          - state_machines.Deliverable.DRAFT_to_ASSIGNED
          - state_machines.Deliverable.ASSIGNED_to_REJECTED
          - calculations.retainer_credit_balance
          - entities.Retainer.fields.credits_available
        distinguishing_aspect: |
          Conserved quantity = Retainer.credits_available (credits). The forward action (assign,
          reserving credit_cost) paired with its compensating action (reject, releasing credit_cost)
          MUST leave credits_available unchanged: granted 20, after assign 17, after reject back to 20.
          Invariant: credits_available == credits_granted - credits_committed - credits_consumed at all times.
        test_recipe:
          setup:
            - "ACTIVE retainer monthly_credits 20 (credits_available 20); ACTIVE sprint capacity 20; one CONTENT deliverable cost 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "InvA Co", primary_domain: "inva.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
          trigger:
            - call: "GET /retainers/${ret_id}"
              payload: {}
              as: AgencyAdmin
              captures: { avail_after_assign: $.data.credits_available, committed_after_assign: $.data.credits_committed }
            - call: "POST /deliverables/${d_id}/reject"
              payload: {}
              as: AccountManager
            - call: "GET /retainers/${ret_id}"
              payload: {}
              as: AgencyAdmin
              captures: { avail_after_reject: $.data.credits_available }
          assert:
            - "After assign: Retainer.${ret_id}.credits_committed == 3 and credits_available == 17"
            - "After reject (compensation): Retainer.${ret_id}.credits_available == 20 (restored, no drift)"

      - name: ad_spend_conserved_across_record_then_upheld_dispute
        grounds:
          - state_machines.AdCampaign.DRAFT_to_LIVE
          - state_machines.AdSpendDispute.UNDER_REVIEW_to_UPHELD
          - entities.AdCampaign.fields.spent_cents
          - entities.AdSpendDispute.fields.credited_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity = total recorded ad spend in cents (spent_cents + credited_cents
          of UPHELD disputes). Forward action record-spend (800,000c) paired with its compensating action
          (UPHELD dispute crediting 300,000c) MUST conserve the total: after UPHELD,
          AdCampaign.spent_cents (500,000) + AdSpendDispute.credited_cents (300,000) == 800,000 originally recorded.
        test_recipe:
          setup:
            - "Direct ACTIVE client; LIVE campaign recorded spend 800,000c; dispute 300,000c at UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "InvB Co", primary_domain: "invb.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "GOOGLE_ADS", budget_cents: 1000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 800000 }
              as: AccountManager
            - call: "POST /ad-spend-disputes"
              payload: { ad_campaign_id: "${camp_id}", client_id: "${cl_id}", disputed_cents: 300000 }
              as: AccountManager
              captures: { dsp_id: $.data.id }
            - call: "POST /ad-spend-disputes/${dsp_id}/review"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /ad-spend-disputes/${dsp_id}/resolve"
              payload: { outcome: "UPHELD" }
              as: AccountManager
              captures: { credited: $.data.credited_cents }
            - call: "GET /ad-campaigns/${camp_id}"
              payload: {}
              as: AgencyAdmin
              captures: { spent: $.data.spent_cents }
          assert:
            - "AdSpendDispute.${dsp_id}.credited_cents == 300000"
            - "AdCampaign.${camp_id}.spent_cents == 500000"
            - "Invariant: spent_cents (500000) + credited_cents (300000) == 800000 originally recorded (no drift)"
