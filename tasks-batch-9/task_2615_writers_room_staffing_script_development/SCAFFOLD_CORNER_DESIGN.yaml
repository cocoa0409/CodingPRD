            - "AvailabilityWindow.${aw1}.status == CONSUMED with consumed_by_seat_id == ${s1}"
            - "AvailabilityWindow.${aw1b}.status == OPEN with consumed_by_seat_id == null, even though it also contains the seat interval and was created first"
            - "WritersRoom.${rm}.confirmed_seat_count == 1, confirmed_diversity_seat_count == 0, seat_subtotal_weekly_cents == 600000, weekly_burn_cents == 800000"
            - "Writer.${w1}.active_seat_count == 1 and Season.${se}.staffing_commitment_weekly_cents == 800000"

      - name: an_assignment_reaches_delivered_only_when_its_last_milestone_lands
        claim_type: bubble_up
        grounds:
          - state_machines.ScriptAssignment.transitions.DRAFTING_to_DELIVERED
          - state_machines.Milestone.transitions.PENDING_to_DELIVERED
          - endpoints.POST_/milestones/{milestone_id}/deliver
        distinguishing_aspect: |
          The parent transition is a bubble-up guarded on ALL children: the assignment must stay DRAFTING
          after the first and second of three milestone deliveries and flip to DELIVERED only inside the
          third call. Approve therefore fails with ERR_ASSIGNMENT_NOT_DELIVERED while any milestone is
          still PENDING.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) on EP1 with three PENDING milestones M1, M2, M3 due 2026-09-21, 2026-10-05 and 2026-10-19."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
          trigger:
            - *C_D1
            - call: "POST /script-assignments/${a1}/approve"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
            - *C_D2
            - *C_D3
          assert:
            - "After trigger call 1: Milestone.${m1}.status == DELIVERED with delivered_at 2026-08-01T00:00:00.000Z and days_late == 0, while ScriptAssignment.${a1}.status is still DRAFTING"
            - "Trigger call 2 returns 409 ERR_ASSIGNMENT_NOT_DELIVERED"
            - "After trigger call 3: ${m2} DELIVERED, ${a1} still DRAFTING (${m3} is still PENDING)"
            - "After trigger call 4: all three milestones are DELIVERED and ScriptAssignment.${a1}.status == DELIVERED, late_milestone_count == 0"
            - "Episode.${ep1}.script_readiness == IN_PROGRESS throughout: only an approve can make it READY"

      - name: wrapping_a_room_releases_every_confirmed_seat_and_pends_their_assignments
        claim_type: cascade_down
        grounds:
          - state_machines.WritersRoom.transitions.ACTIVE_to_WRAPPED
          - state_machines.ScriptAssignment.transitions.to_REASSIGNMENT_PENDING
          - entities.ScriptAssignment.fields.room_seat_id
          - calculations.season_staffing_commitment
        distinguishing_aspect: |
          A wrap is a fan-out over children with a state filter: both CONFIRMED seats move to RELEASED, and
          every non-terminal assignment held through those seats moves to REASSIGNMENT_PENDING with
          room_seat_id cleared - while the already APPROVED assignment A1 is terminal and must be left
          alone, keeping Episode.script_readiness at READY.
        test_recipe:
          setup:
            - "Room RM is ACTIVE with S1 (W1) and S2 (W2) CONFIRMED."
            - "A1 (TELEPLAY, W1) is APPROVED on EP1 (script_readiness READY); A2 (STORY, W2) is still DRAFTING."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
          trigger:
            - *C_WRAP
          assert:
            - "WritersRoom.${rm}.status == WRAPPED, confirmed_seat_count == 0, seat_subtotal_weekly_cents == 0 and weekly_burn_cents == 200000"
            - "RoomSeat.${s1}.status == RELEASED and RoomSeat.${s2}.status == RELEASED"
            - "AvailabilityWindow.${aw1}.status == OPEN and AvailabilityWindow.${aw2}.status == OPEN, both with consumed_by_seat_id == null"
            - "ScriptAssignment.${a2}.status == REASSIGNMENT_PENDING with room_seat_id == null"
            - "ScriptAssignment.${a1}.status == APPROVED with room_seat_id == ${s1} retained: a terminal assignment is not touched by the cascade"
            - "Episode.${ep1}.script_readiness == READY and Writer.${w1}.active_seat_count == 0, Writer.${w2}.active_seat_count == 0"
            - "Season.${se}.staffing_commitment_weekly_cents == 0"

      - name: a_milestone_flips_to_late_inside_the_delivery_call_and_stamps_days_late
        claim_type: valid_transition
        grounds:
          - state_machines.Milestone.transitions.PENDING_to_LATE
          - entities.Milestone.fields.days_late
          - entities.ScriptAssignment.fields.late_milestone_count
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Lateness is evaluated lazily: moving the clock alone must change nothing, and the PENDING -> LATE
          flip happens INSIDE the delivery call, before the LATE -> DELIVERED move, so one call produces
          status DELIVERED with days_late 3 (clock 2026-09-25T00:00:00Z against a due date of
          2026-09-21T23:59:59.999Z) while the two later milestones stay PENDING.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) on EP1 with milestones due 2026-09-21, 2026-10-05 and 2026-10-19 (all 23:59:59.999Z)."
            - "The logical clock is then moved to 2026-09-25T00:00:00Z, past the OUTLINE due date only."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: StudioExecutive
          trigger:
            - *C_D1
          assert:
            - "Immediately after the clock move and before the trigger, Milestone.${m1}.status is still PENDING and ScriptAssignment.${a1}.late_milestone_count == 0: the clock alone mutates nothing"
            - "After the trigger: Milestone.${m1}.status == DELIVERED, delivered_at == 2026-09-25T00:00:00.000Z and days_late == 3"
            - "ScriptAssignment.${a1}.late_milestone_count == 1 and status is still DRAFTING"
            - "Milestone.${m2}.status == PENDING and Milestone.${m3}.status == PENDING with days_late == 0"
            - "GET /milestones?assignment_id=${a1}&status=PENDING returns exactly 2 rows"

      - name: a_review_reaches_cleared_only_when_every_item_is_decided_and_scores_zero
        claim_type: conditional_cascade
        grounds:
          - state_machines.ClearanceReview.transitions.PENDING_to_CLEARED
          - calculations.clearance_risk_score
          - entities.ClearanceReview.fields.decided_item_count
          - entities.Episode.fields.clearance_posture
        distinguishing_aspect: |
          CLEARED is guarded on a conjunction the other postures do not need: item_count >= 1 AND
          decided_item_count == item_count AND risk_score == 0. With two items, deciding only the first
          CLEARED leaves the review PENDING (score 0 but one item still SUBMITTED), and only the second
          decision flips it to CLEARED - which propagates to the episode and makes the lock gate passable.
        test_recipe:
