      - name: suspended_plan_in_the_period_outranks_the_tolerance_override
        claim_type: priority_ordering
        grounds:
          - validations[priority=33]
          - validations[priority=40]
          - errors[ERR_PERIOD_HAS_SUSPENDED_PLAN]
          - errors[ERR_SHRINK_EXCEEDS_TOLERANCE]
          - state_machines.ShrinkReconciliation.DRAFT_to_POSTED
        distinguishing_aspect: "With both rules violated the lower-priority number wins: posting an out-of-tolerance reconciliation without an override returns ERR_SHRINK_EXCEEDS_TOLERANCE, but once a plan inside the period is SUSPENDED the same request returns ERR_PERIOD_HAS_SUSPENDED_PLAN (priority 33 ahead of priority 40), and posting only succeeds after the plan is resumed and the override is supplied."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (shrink_tolerance_pct 0.015); clock at 2026-08-05T08:00:00Z."
            - "RIB01 is PROPOSED at 2149; CasePlan CP1 (service_date 2026-08-05) is PUBLISHED with line 1 (required 34.50) filled with only 20.0 lb."
            - "ShrinkReconciliation SR1 covers 2026-08-01..2026-08-07 on the YIELD_MODEL basis and is DRAFT with within_tolerance false."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${dept_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "PUBLISH" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 20.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/shrink-reconciliations"
              payload: { department_id: "${dept_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-07", basis: "YIELD_MODEL" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { sr1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/shrink-reconciliations/${sr1_id}/transitions"
              payload: { action: "POST" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { err_tolerance: $.data.error_id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "SUSPEND" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/shrink-reconciliations/${sr1_id}/transitions"
              payload: { action: "POST" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { err_suspended: $.data.error_id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "RESUME" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/shrink-reconciliations/${sr1_id}/transitions"
              payload: { action: "POST", override_reason: "case reset after a compressor repair; shortfall accepted by the store director" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
          assert:
            - "ShrinkReconciliation.${sr1_id}.expected_salable_lb == 34.50, physical_salable_lb == 20.00, variance_lb == -14.50, variance_pct == -0.4203 and within_tolerance == false"
            - "${err_tolerance} == ERR_SHRINK_EXCEEDS_TOLERANCE with HTTP 422 while every plan in the period is PUBLISHED"
            - "${err_suspended} == ERR_PERIOD_HAS_SUSPENDED_PLAN with HTTP 422 — both rules are violated and priority 33 wins over priority 40"
            - "ShrinkReconciliation.${sr1_id}.status == DRAFT after both refusals"
            - "After RESUME and the override the POST returns 200: ShrinkReconciliation.${sr1_id}.status == POSTED with the override_reason stored"

      - name: grind_state_gate_outranks_the_trim_pounds_gate
