            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Quarter Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000, minimum_billable_hours: 1 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-Q", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Quarter job", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:01:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { amt: "$.data.line_amount_cents", bmin: "$.data.billable_minutes" } }
          assert:
            - "StandbyAssignment.${sa}.billable_minutes == 75 (ceil(61/15)*15)"
            - "chargeable_hours == 1.25 (above the 1h minimum)"
            - "StandbyAssignment.${sa}.line_amount_cents == 25000 (1.25 * 20000 * 1.0 weekday daytime)"

      - name: corner_minimum_hours_floor
        claim_type: boundary
        grounds: [calculations.standby_line_amount_hourly, entities.ClientAccount.fields.minimum_billable_hours]
        distinguishing_aspect: "A 30-minute engagement bills the 4-hour minimum floor: max(4, 0.5) = 4h * 20000 = 80000 cents — the floor binds exactly when billable_hours < minimum."
        test_recipe:
          setup: ["HOURLY account (min 4h); ISSUED permit; assignment window 10:00-20:00 checked in 10:00, released 10:30 (30 min)"]
