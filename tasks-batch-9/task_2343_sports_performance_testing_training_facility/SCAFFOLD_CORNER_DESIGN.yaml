              payload: { full_name: "Delta Athlete", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "g.delta@example.com" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "PERFORMANCE_BATTERY" }
              as: Coach
              captures: { battery_one: $.data.id }
            - call: "POST /test-sessions/${battery_one}/results"
              payload: { results: [ { metric_code: "CMJ_CM", value: 42.5, side: "BILATERAL" }, { metric_code: "SPRINT_10M_S", value: 1.74, side: "BILATERAL" }, { metric_code: "IMTP_N", value: 1850, side: "BILATERAL" } ] }
              as: Coach
            - call: "POST /test-sessions/${battery_one}/finalize"
              as: Coach
              captures: { composite_one: $.data.composite_percentile }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "PERFORMANCE_BATTERY" }
              as: Coach
              captures: { battery_two: $.data.id }
            - call: "POST /test-sessions/${battery_two}/results"
              payload: { results: [ { metric_code: "CMJ_CM", value: 45.0, side: "BILATERAL" }, { metric_code: "SPRINT_10M_S", value: 1.70, side: "BILATERAL" }, { metric_code: "IMTP_N", value: 1900, side: "BILATERAL" } ] }
              as: Coach
            - call: "POST /test-sessions/${battery_two}/finalize"
              as: Coach
              captures: { composite_two: $.data.composite_percentile }
          action:
            - call: "GET /athletes/${athlete_id}/progress-report"
              as: PerformanceDirector
              captures: { delta: $.data.delta_percentile_points }
          assertions:
            - "the first battery finalized with composite_percentile 60.0 (every metric lands exactly on the P50 anchor plus half the P90 span for the BASKETBALL/GUARD 15-16 band)"
            - "the second battery finalized with composite_percentile 68.3 (per-metric 70.0 / 70.0 / 63.3 rounded to 1dp, then 0.4*70.0 + 0.35*70.0 + 0.25*63.3 = 68.325 -> 68.3)"
            - "status 200 on the progress report"
            - "$.data.composite_percentile_current == 68.3 and $.data.composite_percentile_previous == 60.0"
            - "$.data.delta_percentile_points == 8.3"
            - "$.data.tests_included_count == 2"
            - "$.data.normative_cohort == 'BASKETBALL/GUARD/15-16'"
            - "$.data.next_test_due_on == '2026-10-10' (2026-08-15 plus TEST_CADENCE_DAYS 56) and $.data.test_overdue == false"
            - "$.data.readiness_index == 68.30 (readiness base tracks the latest composite, no decay at 0 days elapsed, no attendance history, no active RTS plan)"

