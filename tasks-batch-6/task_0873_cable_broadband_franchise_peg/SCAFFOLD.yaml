scenario: "Cable/Broadband Franchise & PEG: franchise agreement & territory, franchise-fee (% gross) & audit, build-out & density milestone, PEG/I-Net obligation, customer-complaint escalation, right-of-way use, transfer/renewal, reporting"
domain_name: cable-broadband-franchise-peg
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities joined by explicit FK fields (franchise_id, audit_id, row_segment_id);
  # no nested URL ownership beyond two sub-resource discovery reads.
  state_machine_shape: parallel
  # Franchise carries two independent axes (lifecycle_status x compliance_status);
  # Complaint is cyclic; FranchiseApplication is branching fork-join.
  relationship_patterns:
    - one_to_many        # Franchise -> RevenueReport/Audit/Complaint/PegContribution/...
    - cross_aggregate    # Assessment reaches Franchise through Audit.franchise_id
  role_model: segregation_of_duties
  # Same authority user that finalized an audit (issuing the assessment) may not waive it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Franchise
    parent: null
    common_fields: true
    fields:
      - name: operator_name
        type: string
        source: input
        description: Legal name of the cable/broadband operator holding the grant.
      - name: territory_name
        type: string
        source: input
        description: Name of the franchise service territory / franchise area.
      - name: homes_in_territory
        type: integer
        source: input
        description: Total dwelling units (homes/passings) within the franchise territory; denominator for build-out density.
        constraints: ">= 1"
      - name: road_miles
        type: number
        source: input
        description: Public right-of-way road miles within the territory.
        constraints: "> 0"
      - name: fee_rate_pct
        type: number
        source: input
        description: Franchise fee as a fraction of gross revenue (e.g. 0.05 = 5%).
        constraints: "0 < fee_rate_pct <= 0.05"
      - name: peg_fee_per_sub_cents
        type: integer
        source: input
        description: Per-subscriber PEG/I-Net capital support fee in cents.
        default: 0
        constraints: ">= 0"
      - name: term_start_date
        type: datetime
        source: input
        description: Franchise term start (ISO date).
      - name: term_end_date
        type: datetime
        source: input
        description: Franchise term end (ISO date); must be after term_start_date.
      - name: lifecycle_status
        type: enum
        source: system
        description: Grant lifecycle axis.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RENEWAL_PENDING, RENEWED, TRANSFERRED, EXPIRED, REVOKED}"
      - name: compliance_status
        type: enum
        source: system
        description: Independent compliance axis (parallel to lifecycle_status).
        default: COMPLIANT
        constraints: "one of {COMPLIANT, IN_VIOLATION, CURED}"
      - name: unresolved_complaint_count
        type: integer
        source: system
        description: Count of complaints on this franchise currently in ESCALATED state; drives compliance flip.
        default: 0
      - name: homes_passed
        type: integer
        source: system
        description: Most recently certified homes-passed count across build-out milestones.
        default: 0
      - name: total_owed_cents
        type: integer
        source: computed
        description: Outstanding money owed to the authority (see calculations.franchise_total_owed).
      - name: peg_credit_cents
        type: integer
        source: computed
        description: Cumulative accepted PEG/I-Net capital credit (see calculations.franchise_peg_credit).

  - name: RowSegment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label for the public right-of-way segment (e.g. "Main St 100-400 block").
      - name: length_miles
        type: number
        source: input
        description: Length of the ROW segment in miles.
        constraints: "> 0"
      - name: homes_along
        type: integer
        source: input
        description: Homes fronting this ROW segment.
        constraints: ">= 0"
      - name: jurisdiction
        type: string
        source: input
        description: Owning municipal jurisdiction of the ROW.
        default: "CITY"

  - name: RowPermit
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; the operator requesting ROW use."
      - name: row_segment_id
        type: string
        source: input
        description: "FK -> RowSegment.id; the segment to be occupied."
      - name: window_start
        type: datetime
        source: input
        description: Half-open occupation window start (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: Half-open occupation window end (exclusive); must be after window_start.
      - name: purpose
        type: string
        source: input
        description: Construction purpose (e.g. "aerial strand", "conduit").
      - name: status
        type: enum
        source: system
        description: Permit lifecycle.
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: Authority X-User-ID that approved or rejected the permit.

  - name: BuildoutMilestone
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; owner of the build-out obligation."
      - name: label
        type: string
        source: input
        description: Milestone label (e.g. "Year-2 60% density").
      - name: deadline_date
        type: datetime
        source: input
        description: Milestone deadline (ISO date); certify at/after this date is the final determination.
      - name: required_pct
        type: number
        source: input
        description: Required homes-passed fraction of homes_in_territory at the deadline.
        constraints: "0 < required_pct <= 1"
      - name: required_homes
        type: integer
        source: computed
        description: ceil(required_pct * Franchise.homes_in_territory), snapshotted at milestone creation.
      - name: homes_passed_certified
        type: integer
        source: system
        description: Homes passed reported at the most recent certify call.
        default: 0
      - name: status
        type: enum
        source: system
        description: Milestone determination.
        default: PENDING
        constraints: "one of {PENDING, MET, MISSED}"
      - name: provisional_damage_cents
        type: integer
        source: system
        description: Refundable liquidated damages from the latest interim (pre-deadline) certify.
        default: 0
      - name: final_damage_cents
        type: integer
        source: system
        description: Non-refundable liquidated damages fixed by a final (at/after-deadline) certify.
        default: 0
      - name: last_certified_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the last certify.

  - name: RevenueReport
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; the reporting operator."
      - name: period_start_date
        type: datetime
        source: input
        description: Reporting period start (ISO date).
      - name: period_end_date
        type: datetime
        source: input
        description: Reporting period end (ISO date); must be after period_start_date.
      - name: residential_gross_cents
        type: integer
        source: input
        description: Reported residential gross revenue for the period, in cents.
        constraints: ">= 0"
      - name: commercial_gross_cents
        type: integer
        source: input
        description: Reported commercial gross revenue for the period, in cents.
        constraints: ">= 0"
      - name: advertising_gross_cents
        type: integer
        source: input
        description: Reported advertising gross revenue for the period, in cents.
        constraints: ">= 0"
      - name: fee_due_cents
        type: integer
        source: computed
        description: Franchise fee due for the period (see calculations.franchise_fee_due); recomputed on audit adjustment.
      - name: amount_paid_cents
        type: integer
        source: system
        description: Cumulative franchise-fee payment applied to this report.
        default: 0
      - name: status
        type: enum
        source: system
        description: Report lifecycle.
        default: FILED
        constraints: "one of {FILED, ACCEPTED, UNDER_AUDIT, ADJUSTED, PAID}"
      - name: fee_basis
        type: enum
        source: system
        description: Which gross figure fee_due_cents was computed from.
        default: AS_FILED
        constraints: "one of {AS_FILED, AS_AUDITED}"

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; audited operator."
      - name: target_report_id
        type: string
        source: input
        description: "FK -> RevenueReport.id; the specific report whose gross is examined."
      - name: period_start_date
        type: datetime
        source: input
        description: Audit coverage period start (ISO date); closed interval.
      - name: period_end_date
        type: datetime
        source: input
        description: Audit coverage period end (ISO date); closed interval, must be >= period_start_date.
      - name: audited_gross_residential_cents
        type: integer
        source: system
        description: Residential gross determined at finalize (finding only).
      - name: audited_gross_commercial_cents
        type: integer
        source: system
        description: Commercial gross determined at finalize (finding only).
      - name: audited_gross_advertising_cents
        type: integer
        source: system
        description: Advertising gross determined at finalize (finding only).
      - name: status
        type: enum
        source: system
        description: Audit lifecycle.
        default: OPEN
        constraints: "one of {OPEN, COMPLETED_CLEAN, COMPLETED_FINDING}"
      - name: finalized_by_user_id
        type: string
        source: system
        description: Authority X-User-ID that finalized the audit; becomes the assessment issuer for SoD.
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock timestamp of finalize; anchors assessment interest days_late.

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> Audit.id; the finalized audit that produced this underpayment assessment."
      - name: principal_cents
        type: integer
        source: system
        description: Underpaid franchise-fee principal (audited fee minus previously paid).
      - name: interest_cents
        type: integer
        source: system
        description: Interest on principal (see calculations.audit_underpayment_assessment).
      - name: penalty_cents
        type: integer
        source: system
        description: Tiered penalty on principal, capped.
      - name: total_cents
        type: integer
        source: computed
        description: principal_cents + interest_cents + penalty_cents.
      - name: days_late
        type: integer
        source: system
        description: Whole days from target report period_end_date to audit finalized_at.
      - name: underpayment_pct
        type: number
        source: system
        description: principal_cents / prior_paid_fee (report fee at finalize), drives penalty tier.
      - name: status
        type: enum
        source: system
        description: Assessment lifecycle.
        default: ISSUED
        constraints: "one of {ISSUED, DISPUTED, PAID, WAIVED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: Copied from Audit.finalized_by_user_id; the user forbidden from waiving (SoD).
      - name: amount_paid_cents
        type: integer
        source: system
        description: Cumulative payment applied to the assessment.
        default: 0

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; the operator the complaint is against."
      - name: complainant_id
        type: string
        source: system
        description: X-User-ID of the Resident who filed the complaint.
      - name: category
        type: enum
        source: input
        description: Complaint category (drives SLA window).
        constraints: "one of {SERVICE_INTERRUPTION, BILLING, OTHER}"
      - name: description
        type: string
        source: input
        description: Free-text complaint description.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp at filing.
      - name: sla_deadline
        type: datetime
        source: computed
        description: filed_at + SLA_HOURS[category] (see calculations.complaint_sla_deadline).
      - name: status
        type: enum
        source: system
        description: Complaint lifecycle (cyclic).
        default: OPEN
        constraints: "one of {OPEN, RESOLVED, REOPENED, ESCALATED, CLOSED}"
      - name: escalated_at
        type: datetime
        source: system
        description: Logical-clock timestamp of escalation.
      - name: resolution_note
        type: string
        source: system
        description: Operator's resolution note recorded on resolve.

  - name: PegContribution
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; contributing operator."
      - name: amount_cents
        type: integer
        source: input
        description: PEG/I-Net capital contribution amount in cents.
        constraints: "> 0"
      - name: contribution_type
        type: enum
        source: input
        description: Kind of PEG/I-Net obligation satisfied.
        default: CAPITAL_GRANT
        constraints: "one of {CAPITAL_GRANT, INET}"
      - name: status
        type: enum
        source: system
        description: Contribution lifecycle.
        default: RECORDED
        constraints: "one of {RECORDED, VOIDED}"
      - name: voided_reason
        type: string
        source: system
        description: Authority-supplied reason when a contribution is voided.

  - name: FranchiseApplication
    parent: null
    common_fields: true
    fields:
      - name: franchise_id
        type: string
        source: input
        description: "FK -> Franchise.id; the franchise being transferred or renewed."
      - name: application_type
        type: enum
        source: input
        description: Transfer (FCC Form 394 style) or renewal.
        constraints: "one of {TRANSFER, RENEWAL}"
      - name: transferee_name
        type: string
        source: input
        description: Proposed transferee legal name; required when application_type == TRANSFER.
      - name: proposed_term_end_date
        type: datetime
        source: input
        description: Proposed new term end for RENEWAL applications.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp at submission.
      - name: decision_deadline
        type: datetime
        source: computed
        description: submitted_at + DEEMED_APPROVAL_DAYS; past this with no decision, deem-approval is allowed.
      - name: status
        type: enum
        source: system
        description: Application lifecycle (branching fork-join).
        default: SUBMITTED
        constraints: "one of {SUBMITTED, HELD, APPROVED, DENIED, DEEMED_APPROVED, WITHDRAWN}"
      - name: decided_by_user_id
        type: string
        source: system
        description: Authority X-User-ID that decided the application.
      - name: decision
        type: enum
        source: system
        description: The explicit decision recorded (null until decided).
        constraints: "one of {APPROVE, DENY}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Franchise
    initial_state: "lifecycle_status=DRAFT, compliance_status=COMPLIANT"
    terminal_states: [TRANSFERRED, EXPIRED, REVOKED]
    note: "Two independent axes. lifecycle_status is driven by grant/transfer/renewal/revoke; compliance_status is driven by audit findings and complaint escalations. Terminal lifecycle states forbid all lifecycle transitions."
    transitions:
      - from: "lifecycle=DRAFT"
        to: "lifecycle=ACTIVE"
        trigger: "POST /franchises/{id}/activate"
        actor: FranchiseAuthority
        preconditions: ["lifecycle_status == DRAFT"]
        side_effects: ["set lifecycle_status=ACTIVE", "increments Franchise.version by 1"]
      - from: "lifecycle=ACTIVE"
        to: "lifecycle=REVOKED"
        trigger: "POST /franchises/{id}/revoke"
        actor: FranchiseAuthority
        preconditions: ["lifecycle_status == ACTIVE"]
        side_effects: ["set lifecycle_status=REVOKED", "increments Franchise.version by 1"]
      - from: "lifecycle=ACTIVE"
        to: "lifecycle=RENEWAL_PENDING"
        trigger: "system: POST /franchise-applications with application_type=RENEWAL"
        actor: system
        preconditions: ["lifecycle_status == ACTIVE"]
        side_effects: ["set lifecycle_status=RENEWAL_PENDING", "increments Franchise.version by 1"]
      - from: "lifecycle=RENEWAL_PENDING"
        to: "lifecycle=RENEWED"
        trigger: "system: FranchiseApplication(RENEWAL) -> APPROVED or DEEMED_APPROVED"
        actor: system
        preconditions: ["an application_type=RENEWAL reached APPROVED/DEEMED_APPROVED"]
        side_effects: ["set lifecycle_status=RENEWED", "set term_end_date = application.proposed_term_end_date", "increments Franchise.version by 1"]
      - from: "lifecycle=ACTIVE|RENEWAL_PENDING"
        to: "lifecycle=TRANSFERRED"
        trigger: "system: FranchiseApplication(TRANSFER) -> APPROVED or DEEMED_APPROVED"
        actor: system
        preconditions: ["an application_type=TRANSFER reached APPROVED/DEEMED_APPROVED"]
        side_effects: ["set lifecycle_status=TRANSFERRED", "set operator_name = application.transferee_name", "increments Franchise.version by 1"]
      - from: "compliance=COMPLIANT|CURED"
        to: "compliance=IN_VIOLATION"
        trigger: "system: audit finalize cascade OR complaint escalation threshold reached"
        actor: system
        preconditions: ["compliance_status != IN_VIOLATION"]
        side_effects:
          - "set compliance_status=IN_VIOLATION"
          - "CASCADE: every FranchiseApplication of this franchise with status=SUBMITTED transitions to HELD"
          - "increments Franchise.version by 1"
      - from: "compliance=IN_VIOLATION"
        to: "compliance=CURED"
        trigger: "POST /franchises/{id}/cure"
        actor: FranchiseAuthority
        preconditions: ["compliance_status == IN_VIOLATION"]
        side_effects:
          - "set compliance_status=CURED"
          - "set unresolved_complaint_count=0"
          - "CASCADE: every FranchiseApplication of this franchise with status=HELD transitions back to SUBMITTED"
          - "increments Franchise.version by 1"

  - entity: RowPermit
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /row-permits/{id}/decide {decision: APPROVE}"
        actor: FranchiseAuthority
        preconditions:
          - "permit.status == REQUESTED"
          - "Franchise(franchise_id).lifecycle_status == ACTIVE  # cross-entity"
        side_effects: ["set status=APPROVED", "set decided_by_user_id", "increments RowPermit.version by 1"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /row-permits/{id}/decide {decision: REJECT}"
        actor: FranchiseAuthority
        preconditions: ["permit.status == REQUESTED"]
        side_effects: ["set status=REJECTED", "set decided_by_user_id", "increments RowPermit.version by 1"]

  - entity: BuildoutMilestone
    initial_state: PENDING
    terminal_states: [MET, MISSED]
    note: "Certify before deadline is interim (provisional, refundable; status stays PENDING). Certify at/after deadline is final and terminal."
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /buildout-milestones/{id}/certify (interim: clock < deadline_date)"
        actor: Operator
        preconditions: ["status == PENDING", "current_clock < deadline_date"]
        side_effects:
          - "set homes_passed_certified = homes_passed (input)"
          - "recompute provisional_damage_cents (see calculations.buildout_liquidated_damages variant=provisional)"
          - "set Franchise.homes_passed = homes_passed"
          - "increments BuildoutMilestone.version by 1"
      - from: PENDING
        to: MET
        trigger: "POST /buildout-milestones/{id}/certify (final: clock >= deadline_date, pct >= required)"
        actor: Operator
        preconditions: ["status == PENDING", "current_clock >= deadline_date", "homes_passed / homes_in_territory >= required_pct"]
        side_effects: ["set status=MET", "set final_damage_cents=0", "set Franchise.homes_passed = homes_passed", "increments BuildoutMilestone.version by 1"]
      - from: PENDING
        to: MISSED
        trigger: "POST /buildout-milestones/{id}/certify (final: clock >= deadline_date, pct < required)"
        actor: Operator
        preconditions: ["status == PENDING", "current_clock >= deadline_date", "homes_passed / homes_in_territory < required_pct"]
        side_effects:
          - "set status=MISSED"
          - "recompute final_damage_cents (see calculations.buildout_liquidated_damages variant=final)"
          - "set Franchise.homes_passed = homes_passed"
          - "increments BuildoutMilestone.version by 1"

  - entity: RevenueReport
    initial_state: FILED
    terminal_states: [ADJUSTED]
    note: "A PAID report is not terminal — it can still be pulled UNDER_AUDIT. ADJUSTED is terminal; its underpayment is carried by the Assessment, not by report outstanding."
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /revenue-reports/{id}/accept"
        actor: FranchiseAuthority
        preconditions: ["status == FILED"]
        side_effects: ["set status=ACCEPTED", "increments RevenueReport.version by 1"]
      - from: ACCEPTED
        to: PAID
        trigger: "POST /revenue-reports/{id}/pay {amount_cents}"
        actor: Operator
        preconditions:
          - "status == ACCEPTED"
          - "amount_cents == fee_due_cents - amount_paid_cents  # business_fiscal"
        side_effects: ["set amount_paid_cents += amount_cents", "set status=PAID", "increments RevenueReport.version by 1"]
      - from: "ACCEPTED|PAID"
        to: UNDER_AUDIT
        trigger: "system: POST /audits with target_report_id == this report"
        actor: system
        preconditions: ["status IN {ACCEPTED, PAID}"]
        side_effects: ["remember pre_audit_status; set status=UNDER_AUDIT", "increments RevenueReport.version by 1"]
      - from: UNDER_AUDIT
        to: "pre_audit_status (ACCEPTED|PAID)"
        trigger: "system: audit finalize CLEAN — restore"
        actor: system
        preconditions: ["status == UNDER_AUDIT"]
        side_effects: ["restore status to pre_audit_status", "increments RevenueReport.version by 1"]
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "system: audit finalize with finding (Assessment issued) — CASCADE hop"
        actor: system
        preconditions: ["status == UNDER_AUDIT"]
        side_effects:
          - "set status=ADJUSTED"
          - "set fee_basis=AS_AUDITED"
          - "recompute fee_due_cents from audited gross (calculations.franchise_fee_due variant=as_audited)"
          - "CASCADE: Franchise.total_owed_cents / compliance recompute (hop 3)"
          - "increments RevenueReport.version by 1"

  - entity: Audit
    initial_state: OPEN
    terminal_states: [COMPLETED_CLEAN, COMPLETED_FINDING]
    transitions:
      - from: OPEN
        to: COMPLETED_CLEAN
        trigger: "POST /audits/{id}/finalize {finding: CLEAN}"
        actor: FranchiseAuthority
        preconditions: ["status == OPEN"]
        side_effects:
          - "set status=COMPLETED_CLEAN"
          - "set finalized_by_user_id, finalized_at=current_clock"
          - "restore target RevenueReport to its pre_audit_status (ACCEPTED or PAID)"
          - "increments Audit.version by 1"
      - from: OPEN
        to: COMPLETED_FINDING
        trigger: "POST /audits/{id}/finalize {finding: FINDING, audited_gross_*}"
        actor: FranchiseAuthority
        preconditions:
          - "status == OPEN"
          - "target RevenueReport.status == UNDER_AUDIT"
          - "sum(audited_gross_*) > sum(reported gross of target report)"
        side_effects:
          - "set status=COMPLETED_FINDING; set finalized_by_user_id, finalized_at=current_clock"
          - "CASCADE hop 1: create Assessment(status=ISSUED) with principal/interest/penalty (calculations.audit_underpayment_assessment); issued_by_user_id = finalized_by_user_id"
          - "CASCADE hop 2: target RevenueReport UNDER_AUDIT -> ADJUSTED, fee recomputed AS_AUDITED"
          - "CASCADE hop 3: Franchise.compliance COMPLIANT/CURED -> IN_VIOLATION, total_owed_cents recomputed"
          - "increments Audit.version by 1"

  - entity: Assessment
    initial_state: ISSUED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /assessments/{id}/dispute"
        actor: Operator
        preconditions: ["status == ISSUED"]
        side_effects: ["set status=DISPUTED", "increments Assessment.version by 1"]
      - from: "ISSUED|DISPUTED"
        to: PAID
        trigger: "POST /assessments/{id}/pay {amount_cents}"
        actor: Operator
        preconditions:
          - "status IN {ISSUED, DISPUTED}"
          - "amount_cents == total_cents  # business_fiscal"
        side_effects:
          - "set amount_paid_cents = total_cents; set status=PAID"
          - "recompute Franchise.total_owed_cents (assessment leaves ISSUED/DISPUTED set)"
          - "increments Assessment.version by 1"
      - from: "ISSUED|DISPUTED"
        to: WAIVED
        trigger: "POST /assessments/{id}/waive"
        actor: FranchiseAuthority
        preconditions:
          - "status IN {ISSUED, DISPUTED}"
          - "X-User-ID != issued_by_user_id  # segregation_of_duties"
        side_effects:
          - "set status=WAIVED"
          - "COMPENSATION: recompute Franchise.total_owed_cents; the waived assessment leaves the {ISSUED,DISPUTED} owed-set (see calculations.franchise_total_owed)"
          - "increments Assessment.version by 1"

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Cyclic: RESOLVED -> REOPENED -> RESOLVED can repeat. Escalation is a branch off OPEN/REOPENED."
    transitions:
      - from: "OPEN|REOPENED|ESCALATED"
        to: RESOLVED
        trigger: "POST /complaints/{id}/resolve {resolution_note}"
        actor: Operator
        preconditions: ["status IN {OPEN, REOPENED, ESCALATED}"]
        side_effects:
          - "set status=RESOLVED, resolution_note"
          - "if prior status == ESCALATED: Franchise.unresolved_complaint_count -= 1"
          - "increments Complaint.version by 1"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /complaints/{id}/reopen"
        actor: Resident
        preconditions: ["status == RESOLVED", "X-User-ID == complainant_id"]
        side_effects: ["set status=REOPENED", "increments Complaint.version by 1"]
      - from: "OPEN|REOPENED"
        to: ESCALATED
        trigger: "POST /complaints/{id}/escalate"
        actor: FranchiseAuthority
        preconditions:
          - "status IN {OPEN, REOPENED}"
          - "current_clock > sla_deadline  # business_safety, strict"
        side_effects:
          - "set status=ESCALATED, escalated_at=current_clock"
          - "CASCADE hop 1: Franchise.unresolved_complaint_count += 1"
          - "CASCADE hop 2: if unresolved_complaint_count >= ESCALATION_VIOLATION_THRESHOLD -> Franchise.compliance=IN_VIOLATION (which itself HOLDs SUBMITTED applications)"
          - "increments Complaint.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "system: authority closes a resolved complaint (terminal); modeled via POST /complaints/{id}/resolve is NOT used — closing uses reopen-window expiry"
        actor: system
        preconditions: ["status == RESOLVED"]
        side_effects: ["set status=CLOSED", "increments Complaint.version by 1"]
        note: "CLOSED is reachable when a Resident reopen is no longer pursued; represented as terminal lockdown for tests that assert no further transitions."

  - entity: PegContribution
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /peg-contributions/{id}/void {voided_reason}"
        actor: FranchiseAuthority
        preconditions: ["status == RECORDED"]
        side_effects:
          - "set status=VOIDED, voided_reason"
          - "COMPENSATION: recompute Franchise.peg_credit_cents; voided contribution leaves the RECORDED credit-set (calculations.franchise_peg_credit)"
          - "increments PegContribution.version by 1"

  - entity: FranchiseApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, DEEMED_APPROVED, WITHDRAWN]
    note: "Branching fork-join: SUBMITTED -> {APPROVED, DENIED, DEEMED_APPROVED} with divergent side-effects by application_type; HELD is a compliance interlock cycle."
    transitions:
      - from: SUBMITTED
        to: HELD
        trigger: "system: Franchise.compliance -> IN_VIOLATION"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["set status=HELD", "increments FranchiseApplication.version by 1"]
      - from: HELD
        to: SUBMITTED
        trigger: "system: Franchise.compliance -> CURED"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["set status=SUBMITTED", "increments FranchiseApplication.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /franchise-applications/{id}/decide {decision: APPROVE}"
        actor: FranchiseAuthority
        preconditions:
          - "status == SUBMITTED"
          - "Franchise.compliance_status != IN_VIOLATION  # business_safety"
          - "if application_type == RENEWAL: every BuildoutMilestone of the franchise has status == MET  # cross-entity business_constraint"
        side_effects:
          - "set status=APPROVED, decision=APPROVE, decided_by_user_id"
          - "if TRANSFER: Franchise.lifecycle -> TRANSFERRED, operator_name = transferee_name"
          - "if RENEWAL: Franchise.lifecycle -> RENEWED, term_end_date = proposed_term_end_date"
          - "increments FranchiseApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /franchise-applications/{id}/decide {decision: DENY}"
        actor: FranchiseAuthority
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "set status=DENIED, decision=DENY, decided_by_user_id"
          - "if application_type == RENEWAL: Franchise.lifecycle RENEWAL_PENDING -> ACTIVE (revert)"
          - "increments FranchiseApplication.version by 1"
      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "POST /franchise-applications/{id}/deem"
        actor: Operator
        preconditions:
          - "status == SUBMITTED"
          - "current_clock > decision_deadline  # strict; deemed-approval window elapsed"
        side_effects:
          - "set status=DEEMED_APPROVED"
          - "same lifecycle side-effects as APPROVED (TRANSFER -> TRANSFERRED / RENEWAL -> RENEWED)"
          - "increments FranchiseApplication.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: superseded by a newer FranchiseApplication create on the same franchise"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["set status=WITHDRAWN", "increments FranchiseApplication.version by 1"]

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: application-create-stale-franchise
    parent_entity: Franchise
    write_endpoint: "POST /franchise-applications"
    occ_field: "expected_franchise_version"
    description: |
      Filing a FranchiseApplication against a Franchise whose version has
      advanced since the client last observed it is rejected. A newly filed
      application legitimately supersedes any prior SUBMITTED application on
      the same franchise (the prior is WITHDRAWN); when the client's view of
      the franchise is stale, the create carries an outdated
      expected_franchise_version and is refused so it cannot clobber the
      supersede performed by the intervening filing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: franchise_fee_due
    trigger: "on POST /revenue-reports (variant=as_filed); on audit finalize FINDING cascade (variant=as_audited)"
    algorithm: tiered_pricing
    formula: |
      # Round PER LINE ITEM, then sum (pinned order — NOT sum-then-round).
      def fee(res, com, adv, rate):
          f_res = round_half_up(res * rate)
          f_com = round_half_up(com * rate)
          f_adv = round_half_up(adv * rate)
          return f_res + f_com + f_adv          # integer cents
      fee_due_cents = fee(residential_gross_cents,
                          commercial_gross_cents,
                          advertising_gross_cents,
                          Franchise.fee_rate_pct)
    input_set: "The three gross-category cents fields on the report (as_filed) or the audited_gross_* fields (as_audited)."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up applied to each line item before summing"
    variants:
      - name: as_filed
        when: "at report creation, from reported gross"
        difference: "uses residential/commercial/advertising_gross_cents; sets fee_basis=AS_FILED"
      - name: as_audited
        when: "at audit finalize FINDING, from audited gross"
        difference: "uses audited_gross_*_cents; sets fee_basis=AS_AUDITED; result differs whenever audited gross differs from reported"

  - name: audit_underpayment_assessment
    trigger: "on POST /audits/{id}/finalize with finding=FINDING"
    algorithm: threshold
    formula: |
      audited_fee = franchise_fee_due(audited_gross_*, rate)     # round-per-line-then-sum
      principal_cents = audited_fee - target_report.amount_paid_cents
      # interest: simple, per whole day from report period_end to finalize clock
      days_late = whole_days(target_report.period_end_date, audit.finalized_at)
      interest_cents = round_half_up(principal_cents * DAILY_INTEREST_RATE * days_late)
      # penalty: tiered on underpayment fraction (of the fee previously paid), capped
      underpayment_pct = principal_cents / target_report.amount_paid_cents
      if   underpayment_pct >= 0.10: penalty_raw = round_half_up(principal_cents * 0.15)
      elif underpayment_pct >= 0.05: penalty_raw = round_half_up(principal_cents * 0.10)
      else:                          penalty_raw = round_half_up(principal_cents * 0.05)
      penalty_cents = min(penalty_raw, PENALTY_CAP_CENTS)
      total_cents = principal_cents + interest_cents + penalty_cents
    input_set: "One Audit (finding), its target RevenueReport, and the franchise fee_rate_pct."
    constants:
      DAILY_INTEREST_RATE: 0.0005
      PENALTY_TIER_HIGH_PCT: 0.10
      PENALTY_TIER_HIGH_RATE: 0.15
      PENALTY_TIER_MID_PCT: 0.05
      PENALTY_TIER_MID_RATE: 0.10
      PENALTY_TIER_LOW_RATE: 0.05
      PENALTY_CAP_CENTS: 5000000
    precision: "integer cents, round_half_up at each rounding step"

  - name: buildout_liquidated_damages
    trigger: "on POST /buildout-milestones/{id}/certify"
    algorithm: threshold
    formula: |
      required_homes = ceil(required_pct * Franchise.homes_in_territory)   # snapshot at create
      shortfall_homes = max(0, required_homes - homes_passed)              # homes_passed = certify input
      damage_cents = shortfall_homes * PER_HOME_DAMAGE_CENTS
      pct_passed = homes_passed / Franchise.homes_in_territory
      met = (pct_passed >= required_pct)                                   # >= boundary
    input_set: "One milestone, its franchise homes_in_territory, and the certify homes_passed input."
    constants:
      PER_HOME_DAMAGE_CENTS: 2500
    precision: "integer cents"
    variants:
      - name: provisional
        when: "interim certify, current_clock < deadline_date"
        difference: "writes provisional_damage_cents (refundable); status stays PENDING; recomputed on each interim certify"
      - name: final
        when: "final certify, current_clock >= deadline_date"
        difference: "writes final_damage_cents (non-refundable); status becomes MET (damage 0) or MISSED; provisional_damage_cents is retained as a historical value (not cleared), so both variants remain observable together on the terminal milestone"

  - name: complaint_sla_deadline
    trigger: "on POST /complaints (compute at filing)"
    algorithm: threshold
    formula: |
      sla_deadline = filed_at + hours(SLA_HOURS[category])
      # escalation is permitted only when current_clock > sla_deadline (strict)
    input_set: "One complaint's category and filed_at."
    constants:
      SLA_HOURS_SERVICE_INTERRUPTION: 24
      SLA_HOURS_BILLING: 72
      SLA_HOURS_OTHER: 168
      ESCALATION_VIOLATION_THRESHOLD: 2
    precision: "whole-second ISO timestamp"
    note: "ESCALATION_VIOLATION_THRESHOLD is the count of ESCALATED complaints (Franchise.unresolved_complaint_count) at or above which the franchise flips to compliance IN_VIOLATION."

  - name: application_decision_deadline
    trigger: "on POST /franchise-applications (compute at submission)"
    algorithm: threshold
    formula: |
      decision_deadline = submitted_at + days(DEEMED_APPROVAL_DAYS)
      # deem-approval is permitted only when current_clock > decision_deadline (strict)
    input_set: "One application's submitted_at."
    constants:
      DEEMED_APPROVAL_DAYS: 120
    precision: "whole-second ISO timestamp"

  - name: franchise_total_owed
    trigger: "computed on read (GET /franchises/{id}, /summary) and refreshed on report/assessment mutations"
    algorithm: aggregation
    formula: |
      # ADJUSTED reports are EXCLUDED — their underpayment is carried by the
      # Assessment, so counting both would double-count the delta.
      owed_reports = sum(r.fee_due_cents - r.amount_paid_cents
                         for r in RevenueReport
                         where r.franchise_id == F.id
                           and r.status == ACCEPTED)
      owed_assess  = sum(a.total_cents - a.amount_paid_cents
                         for a in Assessment
                         join Audit on a.audit_id == Audit.id
                         where Audit.franchise_id == F.id
                           and a.status IN {ISSUED, DISPUTED})
      total_owed_cents = owed_reports + owed_assess
    input_set: "RevenueReports in ACCEPTED and Assessments in {ISSUED, DISPUTED} for the franchise."
    constants: {}
    precision: "integer cents"
    note: "Conserved-quantity target for compensating invariant: issue-then-waive an assessment leaves total_owed_cents unchanged from its pre-issue value."

  - name: franchise_peg_credit
    trigger: "computed on read (GET /franchises/{id}, /summary); refreshed on PEG record/void"
    algorithm: aggregation
    formula: |
      peg_credit_cents = sum(c.amount_cents
                             for c in PegContribution
                             where c.franchise_id == F.id
                               and c.status == RECORDED)
    input_set: "PegContributions in RECORDED status for the franchise."
    constants: {}
    precision: "integer cents"
    note: "Conserved-quantity target: record-then-void leaves peg_credit_cents unchanged from its pre-record value."

  - name: row_permit_window_overlap
    trigger: "on POST /row-permits (before create)"
    algorithm: interval_merge
    formula: |
      # Half-open windows [window_start, window_end) on the SAME row_segment_id.
      # A gap of at least PERMIT_BUFFER_HOURS is required between any two permits
      # in status {REQUESTED, APPROVED}. Reject the new permit when, for any such
      # existing permit p:
      #   NOT ( new.window_start >= p.window_end   + buffer
      #         OR p.window_start >= new.window_end + buffer )
      # where buffer = hours(PERMIT_BUFFER_HOURS). Exactly buffer hours of gap is
      # allowed (>=); anything less collides.
      buffer = hours(PERMIT_BUFFER_HOURS)
    input_set: "Existing RowPermits on the same row_segment_id with status in {REQUESTED, APPROVED}."
    constants:
      PERMIT_BUFFER_HOURS: 24
    precision: "whole-second timestamps"

  - name: audit_period_overlap
    trigger: "on POST /audits (before create)"
    algorithm: interval_merge
    formula: |
      # CLOSED date intervals [period_start_date, period_end_date] on the SAME
      # franchise_id, over audits in status {OPEN, COMPLETED_CLEAN,
      # COMPLETED_FINDING}. NO buffer. Reject when:
      #   max(new.start, p.start) <= min(new.end, p.end)
      # A shared endpoint (e.g. both touch 2026-03-31) therefore counts as overlap.
    input_set: "Existing Audits on the same franchise_id (any status)."
    constants: {}
    precision: "whole-day date intervals, inclusive both ends"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 15
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, numeric types/ranges valid (e.g. window_end > window_start, term_end_date > term_start_date, amount_cents > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 20
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 30
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 35
    category: business_referential
    check: "Operator ownership: X-User-ID equals the franchise_id of the target resource (entity_backed:Franchise)"
    error_id: ERR_NOT_FRANCHISE_OWNER
    http_status: 403
    applies_to: "Operator-authored writes on franchise-scoped resources"
  - priority: 40
    category: business_safety
    check: "segregation of duties: on assessment waive, X-User-ID != Assessment.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /assessments/{id}/waive"
  - priority: 45
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 50
    category: business_referential
    check: "cross-entity: RowPermit create/approve requires Franchise.lifecycle_status == ACTIVE"
    error_id: ERR_FRANCHISE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /row-permits, POST /row-permits/{id}/decide(APPROVE)"
  - priority: 55
    category: business_safety
    check: "complaint escalate requires current_clock > sla_deadline (strict)"
    error_id: ERR_SLA_NOT_BREACHED
    http_status: 409
    applies_to: "POST /complaints/{id}/escalate"
  - priority: 56
    category: business_safety
    check: "FranchiseApplication decide(APPROVE) requires Franchise.compliance_status != IN_VIOLATION"
    error_id: ERR_FRANCHISE_IN_VIOLATION
    http_status: 409
    applies_to: "POST /franchise-applications/{id}/decide"
  - priority: 58
    category: business_constraint
    check: "cross-entity: FranchiseApplication decide(APPROVE) of a RENEWAL requires every BuildoutMilestone of the franchise to be MET"
    error_id: ERR_MILESTONES_NOT_MET
    http_status: 409
    applies_to: "POST /franchise-applications/{id}/decide"
  - priority: 60
    category: business_temporal
    check: "RowPermit window overlaps (with PERMIT_BUFFER_HOURS buffer) an existing REQUESTED/APPROVED permit on the same row_segment_id"
    error_id: ERR_PERMIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /row-permits"
  - priority: 61
    category: business_temporal
    check: "Audit period (closed interval) overlaps an existing OPEN/COMPLETED_* audit period on the same franchise_id"
    error_id: ERR_AUDIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /audits"
  - priority: 65
    category: business_fiscal
    check: "payment amount must equal the outstanding balance (report: fee_due_cents - amount_paid_cents; assessment: total_cents)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /revenue-reports/{id}/pay, POST /assessments/{id}/pay"
  - priority: 70
    category: business_constraint
    check: "OCC: expected_franchise_version must equal the current Franchise.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /franchise-applications"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [FranchiseAuthority]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601 for all subsequent time-gated rules"]

  - method: POST
    path: "/franchises"
    description: "Grant (create) a franchise in DRAFT."
    roles: [FranchiseAuthority]
    code: 201
    input: [operator_name, territory_name, homes_in_territory, road_miles, fee_rate_pct, "peg_fee_per_sub_cents?", term_start_date, term_end_date]
    output: Franchise
    side_effects: ["Franchise created lifecycle=DRAFT, compliance=COMPLIANT, version=1"]
  - method: GET
    path: "/franchises/{id}"
    description: "Read a franchise incl. computed total_owed_cents/peg_credit_cents."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: Franchise
  - method: GET
    path: "/franchises/{id}/summary"
    description: "Computed compliance/fee summary for a franchise."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: "{ total_owed_cents: integer, peg_credit_cents: integer, compliance_status: string, lifecycle_status: string, unresolved_complaint_count: integer }"
  - method: POST
    path: "/franchises/{id}/activate"
    description: "DRAFT -> ACTIVE grant activation."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: Franchise
    side_effects: ["lifecycle_status=ACTIVE", "increments Franchise.version by 1"]
  - method: POST
    path: "/franchises/{id}/revoke"
    description: "ACTIVE -> REVOKED."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: Franchise
    side_effects: ["lifecycle_status=REVOKED", "increments Franchise.version by 1"]
  - method: POST
    path: "/franchises/{id}/cure"
    description: "compliance IN_VIOLATION -> CURED; resets unresolved_complaint_count and releases HELD applications."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: Franchise
    side_effects:
      - "compliance_status=CURED; unresolved_complaint_count=0"
      - "CASCADE: HELD FranchiseApplications -> SUBMITTED"
      - "increments Franchise.version by 1"

  - method: POST
    path: "/row-segments"
    description: "Register a municipal right-of-way segment."
    roles: [FranchiseAuthority]
    code: 201
    input: [name, length_miles, homes_along, "jurisdiction?"]
    output: RowSegment
    side_effects: ["RowSegment created"]
  - method: GET
    path: "/row-segments/{id}"
    description: "Read a ROW segment."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: RowSegment

  - method: POST
    path: "/row-permits"
    description: "Operator requests ROW use for a segment/time window."
    roles: [Operator]
    code: 201
    input: [franchise_id, row_segment_id, window_start, window_end, purpose]
    output: RowPermit
    side_effects: ["RowPermit created status=REQUESTED after franchise-active + window-overlap checks"]
  - method: GET
    path: "/row-permits/{id}"
    description: "Read a ROW permit."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: RowPermit
  - method: GET
    path: "/row-permits"
    description: "List ROW permits; filter by franchise and/or segment (FK reverse-reachability for franchise_id and row_segment_id)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "row_segment_id?", "limit?", "offset?"]
    output: RowPermit[]
  - method: POST
    path: "/row-permits/{id}/decide"
    description: "Authority approves or rejects a requested permit."
    roles: [FranchiseAuthority]
    code: 200
    input: [decision]
    output: RowPermit
    side_effects: ["status=APPROVED (requires Franchise ACTIVE) or REJECTED; set decided_by_user_id", "increments RowPermit.version by 1"]

  - method: POST
    path: "/buildout-milestones"
    description: "Authority sets a build-out/density milestone for a franchise."
    roles: [FranchiseAuthority]
    code: 201
    input: [franchise_id, label, deadline_date, required_pct]
    output: BuildoutMilestone
    side_effects: ["milestone created PENDING; required_homes = ceil(required_pct*homes_in_territory)"]
  - method: GET
    path: "/buildout-milestones/{id}"
    description: "Read a build-out milestone."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: BuildoutMilestone
  - method: GET
    path: "/buildout-milestones"
    description: "List build-out milestones; filter by franchise_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "limit?", "offset?"]
    output: BuildoutMilestone[]
  - method: POST
    path: "/buildout-milestones/{id}/certify"
    description: "Operator certifies homes passed; interim (provisional) or final (MET/MISSED) by clock vs deadline."
    roles: [Operator]
    code: 200
    input: [homes_passed]
    output: BuildoutMilestone
    side_effects: ["recompute provisional/final damages; possible MET/MISSED; set Franchise.homes_passed", "increments BuildoutMilestone.version by 1"]

  - method: POST
    path: "/revenue-reports"
    description: "Operator files a period gross-revenue report; fee_due computed AS_FILED."
    roles: [Operator]
    code: 201
    input: [franchise_id, period_start_date, period_end_date, residential_gross_cents, commercial_gross_cents, advertising_gross_cents]
    output: RevenueReport
    side_effects: ["fee_due_cents computed (franchise_fee_due, as_filed); status=FILED"]
  - method: GET
    path: "/revenue-reports/{id}"
    description: "Read a revenue report."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: RevenueReport
  - method: GET
    path: "/revenue-reports"
    description: "List revenue reports; filter by franchise_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "limit?", "offset?"]
    output: RevenueReport[]
  - method: POST
    path: "/revenue-reports/{id}/accept"
    description: "Authority accepts a filed report (FILED -> ACCEPTED)."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: RevenueReport
    side_effects: ["status=ACCEPTED", "increments RevenueReport.version by 1"]
  - method: POST
    path: "/revenue-reports/{id}/pay"
    description: "Operator pays the outstanding franchise fee on an accepted/adjusted report."
    roles: [Operator]
    code: 200
    input: [amount_cents]
    output: RevenueReport
    side_effects: ["amount_paid_cents += amount_cents; status=PAID (amount must equal outstanding)", "increments RevenueReport.version by 1"]

  - method: POST
    path: "/audits"
    description: "Authority opens an audit of a specific filed report; report -> UNDER_AUDIT."
    roles: [FranchiseAuthority]
    code: 201
    input: [franchise_id, target_report_id, period_start_date, period_end_date]
    output: Audit
    side_effects: ["audit OPEN after period-overlap check; target RevenueReport FILED -> UNDER_AUDIT"]
  - method: GET
    path: "/audits/{id}"
    description: "Read an audit."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: Audit
  - method: GET
    path: "/audits"
    description: "List audits; filter by franchise_id and/or target_report_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "target_report_id?", "limit?", "offset?"]
    output: Audit[]
  - method: POST
    path: "/audits/{id}/finalize"
    description: "Finalize an audit clean, or with a finding (cascades assessment + report adjust + compliance flip)."
    roles: [FranchiseAuthority]
    code: 200
    input: [finding, "audited_gross_residential_cents?", "audited_gross_commercial_cents?", "audited_gross_advertising_cents?"]
    output: Audit
    side_effects: ["CLEAN: report back to ACCEPTED; FINDING: create Assessment + report ADJUSTED + Franchise IN_VIOLATION", "increments Audit.version by 1"]
  - method: GET
    path: "/audits/{id}/assessments"
    description: "Assessments produced by this audit (FK reverse-reachability for Assessment.audit_id)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: Assessment[]

  - method: GET
    path: "/assessments/{id}"
    description: "Read an assessment."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: Assessment
  - method: POST
    path: "/assessments/{id}/pay"
    description: "Operator pays an assessment in full."
    roles: [Operator]
    code: 200
    input: [amount_cents]
    output: Assessment
    side_effects: ["amount_paid_cents=total_cents; status=PAID; recompute Franchise.total_owed_cents", "increments Assessment.version by 1"]
  - method: POST
    path: "/assessments/{id}/dispute"
    description: "Operator disputes an issued assessment (ISSUED -> DISPUTED)."
    roles: [Operator]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status=DISPUTED", "increments Assessment.version by 1"]
  - method: POST
    path: "/assessments/{id}/waive"
    description: "Authority waives an assessment (SoD: not the issuer)."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status=WAIVED; recompute Franchise.total_owed_cents (compensation)", "increments Assessment.version by 1"]

  - method: POST
    path: "/complaints"
    description: "Resident files a customer complaint against a franchise."
    roles: [Resident]
    code: 201
    input: [franchise_id, category, description]
    output: Complaint
    side_effects: ["complaint OPEN; complainant_id=X-User-ID; sla_deadline computed"]
  - method: GET
    path: "/complaints/{id}"
    description: "Read a complaint."
    roles: [FranchiseAuthority, Operator, Resident]
    code: 200
    input: []
    output: Complaint
  - method: GET
    path: "/complaints"
    description: "List complaints; filter by franchise_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "limit?", "offset?"]
    output: Complaint[]
  - method: POST
    path: "/complaints/{id}/resolve"
    description: "Operator resolves a complaint (from OPEN/REOPENED/ESCALATED)."
    roles: [Operator]
    code: 200
    input: [resolution_note]
    output: Complaint
    side_effects: ["status=RESOLVED; if was ESCALATED decrement Franchise.unresolved_complaint_count", "increments Complaint.version by 1"]
  - method: POST
    path: "/complaints/{id}/escalate"
    description: "Authority escalates a complaint whose SLA deadline has passed (cascade to franchise)."
    roles: [FranchiseAuthority]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status=ESCALATED; Franchise.unresolved_complaint_count += 1; possible compliance IN_VIOLATION cascade", "increments Complaint.version by 1"]
  - method: POST
    path: "/complaints/{id}/reopen"
    description: "Resident reopens a resolved complaint (RESOLVED -> REOPENED); cyclic."
    roles: [Resident]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status=REOPENED", "increments Complaint.version by 1"]

  - method: POST
    path: "/peg-contributions"
    description: "Operator records a PEG/I-Net capital contribution."
    roles: [Operator]
    code: 201
    input: [franchise_id, amount_cents, "contribution_type?"]
    output: PegContribution
    side_effects: ["contribution RECORDED; increases Franchise.peg_credit_cents"]
  - method: GET
    path: "/peg-contributions/{id}"
    description: "Read a PEG contribution."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: PegContribution
  - method: GET
    path: "/peg-contributions"
    description: "List PEG contributions; filter by franchise_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "limit?", "offset?"]
    output: PegContribution[]
  - method: POST
    path: "/peg-contributions/{id}/void"
    description: "Authority voids a recorded PEG contribution (compensation)."
    roles: [FranchiseAuthority]
    code: 200
    input: [voided_reason]
    output: PegContribution
    side_effects: ["status=VOIDED; recompute Franchise.peg_credit_cents", "increments PegContribution.version by 1"]

  - method: POST
    path: "/franchise-applications"
    description: "Operator files a transfer or renewal application; OCC on Franchise.version; supersedes prior SUBMITTED application."
    roles: [Operator]
    code: 201
    input: [franchise_id, application_type, "transferee_name?", "proposed_term_end_date?", expected_franchise_version]
    output: FranchiseApplication
    side_effects:
      - "requires expected_franchise_version == Franchise.version (else ERR_STALE_VERSION)"
      - "WITHDRAW any prior SUBMITTED application on this franchise (supersede)"
      - "if RENEWAL: Franchise.lifecycle ACTIVE -> RENEWAL_PENDING"
      - "increments Franchise.version by 1"
  - method: GET
    path: "/franchise-applications/{id}"
    description: "Read a franchise application."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: []
    output: FranchiseApplication
  - method: GET
    path: "/franchise-applications"
    description: "List franchise applications; filter by franchise_id (FK reverse-reachability)."
    roles: [FranchiseAuthority, Operator]
    code: 200
    input: ["franchise_id?", "limit?", "offset?"]
    output: FranchiseApplication[]
  - method: POST
    path: "/franchise-applications/{id}/decide"
    description: "Authority approves or denies a submitted application (branching side-effects by type)."
    roles: [FranchiseAuthority]
    code: 200
    input: [decision]
    output: FranchiseApplication
    side_effects: ["APPROVE (checks compliance + milestones-if-renewal) -> franchise TRANSFERRED/RENEWED; DENY -> franchise reverts", "increments FranchiseApplication.version by 1"]
  - method: POST
    path: "/franchise-applications/{id}/deem"
    description: "Operator invokes deemed-approval once the decision deadline has elapsed (current_clock > decision_deadline)."
    roles: [Operator]
    code: 200
    input: []
    output: FranchiseApplication
    side_effects: ["status=DEEMED_APPROVED; same lifecycle side-effects as APPROVE", "increments FranchiseApplication.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a known role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not permitted for this endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, illegal enum, bad numeric range/order"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced path id or body FK does not resolve"
  - id: ERR_NOT_FRANCHISE_OWNER
    http: 403
    condition: "Operator X-User-ID does not match the target resource's franchise_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "assessment waive attempted by the same user who issued it (finalized the audit)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which the requested transition is defined"
  - id: ERR_FRANCHISE_NOT_ACTIVE
    http: 409
    condition: "RowPermit create/approve requires the franchise lifecycle to be ACTIVE"
  - id: ERR_SLA_NOT_BREACHED
    http: 409
    condition: "complaint escalate attempted at/before sla_deadline (not strictly past)"
  - id: ERR_FRANCHISE_IN_VIOLATION
    http: 409
    condition: "application approve blocked while franchise compliance is IN_VIOLATION"
  - id: ERR_MILESTONES_NOT_MET
    http: 409
    condition: "renewal approve blocked because a BuildoutMilestone is not MET"
  - id: ERR_PERMIT_WINDOW_OVERLAP
    http: 409
    condition: "ROW permit window collides (within buffer) with an existing permit on the same segment"
  - id: ERR_AUDIT_PERIOD_OVERLAP
    http: 409
    condition: "audit period (closed) overlaps an existing audit period on the same franchise"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 402
    condition: "payment amount does not equal the outstanding balance"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_franchise_version does not equal current Franchise.version"
  - id: ERR_AUDIT_NO_UNDERPAYMENT
    http: 409
    condition: "finalize with finding but audited gross does not exceed reported gross"
  - id: ERR_TRANSFEREE_REQUIRED
    http: 400
    condition: "application_type=TRANSFER without transferee_name"
  - id: ERR_TERM_REQUIRED
    http: 400
    condition: "application_type=RENEWAL without proposed_term_end_date"
  - id: ERR_VALIDATION_PERIOD_INVALID
    http: 400
    condition: "period_end_date < period_start_date, or window_end <= window_start, or term_end_date <= term_start_date"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: FranchiseAuthority
    description: "Local franchising authority (city/county) staff: grants franchises, sets milestones, runs audits, issues/waives assessments, decides transfers/renewals, escalates complaints."
    identity: "opaque"
    exclusive_operations:
      - "POST /franchises"
      - "POST /franchises/{id}/activate"
      - "POST /franchises/{id}/revoke"
      - "POST /franchises/{id}/cure"
      - "POST /row-segments"
      - "POST /row-permits/{id}/decide"
      - "POST /buildout-milestones"
      - "POST /revenue-reports/{id}/accept"
      - "POST /audits"
      - "POST /audits/{id}/finalize"
      - "POST /assessments/{id}/waive"
      - "POST /complaints/{id}/escalate"
      - "POST /peg-contributions/{id}/void"
      - "POST /franchise-applications/{id}/decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
    note: "SoD: the FranchiseAuthority user (X-User-ID) that finalized an audit may not waive the resulting assessment."
  - name: Operator
    description: "The cable/broadband company holding a franchise; files reports, pays, certifies build-out, requests ROW permits, records PEG, files transfer/renewal, disputes assessments."
    identity: "entity_backed:Franchise"
    exclusive_operations:
      - "POST /row-permits"
      - "POST /buildout-milestones/{id}/certify"
      - "POST /revenue-reports"
      - "POST /revenue-reports/{id}/pay"
      - "POST /assessments/{id}/pay"
      - "POST /assessments/{id}/dispute"
      - "POST /peg-contributions"
      - "POST /franchise-applications"
      - "POST /franchise-applications/{id}/deem"
    shared_operations:
      - "GET (reads scoped to own franchise plus public segment reads)"
    note: "X-User-ID equals the id of the Franchise the operator holds; ownership checks compare it to resource.franchise_id."
  - name: Resident
    description: "A customer/member of the public who files and manages complaints."
    identity: "opaque"
    exclusive_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/reopen"
    shared_operations:
      - "GET /complaints/{id}"
    note: "X-User-ID is stored as Complaint.complainant_id; reopen requires it to match."
