  - section: rbac
    instances:
      - name: supplier_manager_cannot_create_programs
        claim_type: rbac_denial
        grounds:
          - "roles[ProgramAdmin]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Program creation is exclusive to ProgramAdmin; a SupplierManager gets ERR_UNAUTHORIZED_ROLE (403) regardless of payload validity."
        test_recipe:
          setup: ["supplier S1 exists"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/programs", payload: { model_code: "M9", current_rate_per_month: 2, required_component_codes: 1, rework_budget_total_cents: 1000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403"
      - name: customer_cannot_record_flight_test_outcomes
        claim_type: rbac_denial
        grounds:
          - "roles[DeliveryManager]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "record-outcome is exclusive to DeliveryManager; the aircraft's own Customer is denied even though they are the buying party."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1024 in FLIGHT_TESTING with one SCHEDULED test"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1024, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "PASS" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403"
      - name: supplier_manager_ownership_mismatch_rejected
        claim_type: rbac_denial
        grounds:
          - "roles[SupplierManager]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Entity-backed ownership: a SupplierManager whose X-User-ID is supplier S2 cannot create a commitment under supplier S1's path (403), even though the role is correct."
        test_recipe:
          setup: ["program M1; suppliers S1 and S2"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S2", name: "Landing Co", region: "EU" }, as: ProgramAdmin, captures: { s2_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403 (S2 acting on S1's collection)"
      - name: customer_walkthrough_ownership_mismatch_rejected
        claim_type: rbac_denial
        grounds:
          - "roles[Customer]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Entity-backed ownership on the acceptance path: customer AL2 cannot conduct the walkthrough for AL1's aircraft (403), though Customer is the correct role."
        test_recipe:
          setup: ["program M1; customers AL1 and AL2; AL1's aircraft line 1025 in CONFIG_VERIFIED"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust1_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL2", name: "Air Two", credit_standing: "WATCH" }, as: ProgramAdmin, captures: { cust2_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust1_id}", line_number: 1025, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "PASS" }, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/verify-configuration", payload: {}, as: DeliveryManager }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/conduct-walkthrough", payload: { snag_count: 0 }, as: Customer, as_user_id: "${cust2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403 (AL2 is not the aircraft's customer)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_rate_case_create_with_stale_program_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[rate-case-create-stale-program]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating rate case A advances program.version to 2; a second create still carrying expected_program_version 1 is deterministically rejected 412 — two strictly sequential requests, no overlap needed."
        test_recipe:
          setup: ["program M1 at version 1"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_a: "$.data.id" } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 9, effective_month: "2027-01", demand_backlog_units: 90, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "first create succeeded with the observed version 1 and advanced program.version to 2"
            - "second create with the same expected version 1: ERR_STALE_VERSION with HTTP 412"
      - name: occ_negotiation_counter_with_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[negotiation-counter-stale-negotiation]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After the Customer's counter advances the negotiation to version 2, a DeliveryManager counter carrying version 1 is rejected 412 — the OCC check (priority 4) fires before the turn check, and here the turn would have been legal."
        test_recipe:
          setup: ["program M1; GOOD customer AL1; aircraft line 1026; negotiation at round 2 (COUNTERED) after a successful customer counter"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1026, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id", neg_v1: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-12", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${neg_v1}" }, as: Customer, as_user_id: "${cust_id}", captures: { neg_v2: "$.data.version" } }
          trigger:
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-13", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${neg_v1}" }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (version advanced 1 -> 2 by the customer counter)"
            - "negotiation remains COUNTERED at round 2"
      - name: announced_target_rate_reconciles_after_shelve
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.ProductionProgram.fields.announced_target_rate"
        distinguishing_aspect: "The denormalized announced_target_rate follows the latest ANNOUNCED case and falls back to current_rate_per_month when that case is shelved: 5 -> 8 -> 5 across announce then shelve."
        test_recipe:
          setup: ["program M1 (current rate 5) with one rate case proposed 8, announced"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_id: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_id}/announce", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { ann1: "$.data.announced_target_rate" } }
            - { call: "POST /api/rate-cases/${rc_id}/shelve", payload: {}, as: ProductionPlanner }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { ann2: "$.data.announced_target_rate" } }
          assert:
            - "after announce: announced_target_rate == 8"
            - "after shelve: announced_target_rate == 5 (fallback to current_rate_per_month)"

  - section: consistency_model
    instances:
      - name: write_immediately_visible_in_same_read
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: a created supplier is fully visible on the very next GET with identical field values and version 1 — no lag, no stale cache."
