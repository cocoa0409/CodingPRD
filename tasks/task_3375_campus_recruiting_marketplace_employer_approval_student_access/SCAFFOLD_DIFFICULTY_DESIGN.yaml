          setup:
            - "Base fixture (clock 2026-09-01, university ACTIVE, Sam, Acme APPROVED + approval APPROVED, posting PUBLISHED). Sam's application advanced to INTERVIEWING with one SCHEDULED interview. Second student Sally applied to the same posting and advanced to OFFER_EXTENDED. Posting active_application_count == 2."
