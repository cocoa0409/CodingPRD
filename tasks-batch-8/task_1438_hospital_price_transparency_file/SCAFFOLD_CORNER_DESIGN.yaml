  - section: cross_cutting_layers
    instances:
      - name: occ_service_item_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-service-item-patch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ServiceItem.version: a PATCH carrying the version observed before a prior successful PATCH (1 vs current 2) fails 412 ERR_STALE_VERSION; the first PATCH with the fresh version succeeded."
        test_recipe:
          setup: ["Facility F; item SI gross 100000 at version 1 (captured at creation)"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-X1L", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id, si_v: $.data.version } }
          trigger:
            - { call: "PATCH /transparency/service-items/${si}", payload: { gross_charge_cents: 110000, expected_service_item_version: "${si_v}" }, as: TransparencyOfficer, captures: { v2: $.data.version } }
            - { call: "PATCH /transparency/service-items/${si}", payload: { gross_charge_cents: 120000, expected_service_item_version: "${si_v}" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /transparency/facilities/${fac}/service-items", as: TransparencyOfficer, captures: { g_final: "$.data[0].gross_charge_cents", v_final: "$.data[0].version" } }
          assert:
            - "first PATCH (expected 1 == current 1): 200, version becomes 2, gross 110000"
            - "second PATCH (expected ${si_v} == 1, current 2): http 412, error_id == ERR_STALE_VERSION"
            - "final state: gross_charge_cents == 110000 and version == 2 (losing write left no trace)"

      - name: occ_file_generate_stale_cycle_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-cycle-file-generate]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PublicationCycle.version: generating a file advances the cycle version (file creation bumps it), so a second generate still carrying the pre-first-generate version fails 412 ERR_STALE_VERSION — a deterministic create-with-supersede race surrogate."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI; cycle FROZEN with VALIDATED record; cycle version captured at freeze"]
