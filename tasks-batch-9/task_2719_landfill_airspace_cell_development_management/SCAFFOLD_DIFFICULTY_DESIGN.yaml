      - name: gas_well_tune_branches_on_readings_then_cycles_through_exceedance
        grounds:
          - state_machines.GasWell.CONNECTED_to_ONLINE
          - state_machines.GasWell.CONNECTED_to_TUNING_REQUIRED
          - state_machines.GasWell.ONLINE_to_TUNING_REQUIRED
          - state_machines.GasWell.TUNING_REQUIRED_to_ONLINE
          - state_machines.SurfaceEmissionScan.PASSED_to_EXCEEDANCE_OPEN
          - state_machines.SurfaceEmissionScan.EXCEEDANCE_OPEN_to_RESOLVED
          - entities.Landfill.fields.gas_collection_status
        distinguishing_aspect: |
          The single trigger POST /gas-wells/{id}/tune resolves to two different target states
          from the same source state purely by comparing three readings, and the well then
          re-enters TUNING_REQUIRED a second time through a completely different trigger
          (a surface-emission exceedance), closing the cycle ONLINE -> TUNING_REQUIRED ->
          ONLINE. The site-level gas_collection_status is not a mirror of the well: it stays
          CORRECTIVE_ACTION after the well returns ONLINE because the scan is still open, and
          only the scan resolution clears it. Resolving before re-tuning is refused.
