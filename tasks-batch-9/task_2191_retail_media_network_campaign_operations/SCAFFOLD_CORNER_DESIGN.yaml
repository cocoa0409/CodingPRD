            - "LineItem.${li2_id}.spend_cents == 0"
            - "Campaign.${camp_id}.delivered_spend_cents == 284"
            - "BudgetPlan.${plan_id}.consumed_cents == 284"
            - "BudgetPlan.${plan_id}.available_cents == 999716"

      - name: cpm_settlement_rounds_once_then_waterfalls_remainder_by_occurred_at
        claim_type: precision
        grounds:
          - calculations.auction_settlement_amount
          - calculations.second_price_clearing
          - entities.EngagementEvent.billable_cents
        distinguishing_aspect: "A single CPM candidate clears at the 3500 floor; the auction total is rounded once from the aggregate (3500 * 3 / 1000 = 10.5 -> 11), per_event_floor is floor(3500/1000) = 3, and the 2-cent remainder is handed out by occurred_at ASC giving 4, 4, 3 — never 3, 3, 3 with the remainder dropped nor 4, 4, 4 by per-event rounding."
