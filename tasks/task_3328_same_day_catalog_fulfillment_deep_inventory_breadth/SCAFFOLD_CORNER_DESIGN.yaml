            - "CatalogOrder.${order_id}.order_total_cents is 0 after the cancel, because both lines left the eligible status set and their fees were cleared"
            - "each CatalogOrderLine.allocated_small_line_fee_cents == 0 after the cancel"
            - "CatalogOrder.${order_id}.total_small_line_fee_cents == 0 after the cancel"
            - "the two line rows themselves are still present: GET /orders/${order_id}/lines returns 2 rows"

      - name: cutoff_sequence_index_is_captured_not_recomputed
