              captures: { decl: $.data.id }
            - call: "PATCH /issuers/${iss}"
              payload: { status: "SUSPENDED" }
              as: IssuerOfficer
              as_user_id: "${iss}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-declarations/${decl}"
              as: AgentAdmin
              captures: { st1: $.data.status }
            - call: "PATCH /issuers/${iss}"
              payload: { status: "ACTIVE" }
              as: IssuerOfficer
              as_user_id: "${iss}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-declarations/${decl}"
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
          assert:
            - "after the first clock set (issuer SUSPENDED, past record_date): DividendDeclaration.${decl}.status == DECLARED"
            - "no DividendPayment rows exist for the declaration while suspended"
            - "after resume + second clock set: DividendDeclaration.${decl}.status == ACCRUED"
            - "exactly 1 DividendPayment with eligible_shares == 100 is generated"

  - rule_id: resource_temporal_overlap
    instances:
      - name: freeze_window_closed_interval_overlap
        grounds:
          - validations[priority=7]
          - entities.TransferFreezeWindow.fields.start_date
          - entities.TransferFreezeWindow.fields.end_date
        distinguishing_aspect: |
          Closed-interval semantics on the Issuer's freeze-window resource: [s1,e1] and [s2,e2]
          conflict iff s1 <= e2 AND s2 <= e1, so a new window whose start equals the existing
          window's end (2026-09-05 touching 2026-09-05) IS an overlap — boundary days are
          occupied on both sides.
        test_recipe:
          setup: ["Issuer onboarded; one freeze window [2026-09-01, 2026-09-05] already declared"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Pi Corp", cusip: "000000016", ticker: "PICO", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /issuers/${iss}/freeze-windows"
              payload: { start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", reason: "record date blackout" }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /issuers/${iss}/freeze-windows"
              payload: { start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-10T00:00:00Z", reason: "touching window" }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { err: $.data.error_id }
            - call: "POST /issuers/${iss}/freeze-windows"
              payload: { start_date: "2026-09-06T00:00:00Z", end_date: "2026-09-10T00:00:00Z", reason: "adjacent disjoint window" }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { w2: $.data.id }
            - call: "GET /freeze-windows?issuer_id=${iss}"
              as: IssuerOfficer
              as_user_id: "${iss}"
          assert:
            - "touching window: error_id == ERR_FREEZE_WINDOW_OVERLAP with HTTP 409 (closed interval: 2026-09-05 belongs to both)"
            - "disjoint window starting 2026-09-06: created with id ${w2}"
            - "GET /freeze-windows?issuer_id=${iss} returns total_count == 2"

      - name: stop_order_open_occupancy_overlap
        grounds:
          - validations[priority=8]
          - state_machines.Certificate.ISSUED_to_LOST_REPORTED
        distinguishing_aspect: |
          Different interval semantics on a different resource: a stop-transfer order occupies its
          Certificate as an OPEN-ENDED occupancy [lost_reported_at, infinity) that closes only on
          recovery or replacement — not a closed date range. A second report-lost collides with
          the open occupancy and is rejected with ERR_DUPLICATE_OPEN_CLAIM.
        test_recipe:
          setup: ["Issuer outstanding 100; account with 100 book shares; certificate C of 50 shares withdrawn and already reported lost (claim FILED)"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Rho Inc", cusip: "000000017", ticker: "RHOI", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Uma Loser", address_line1: "25 Willow St", city: "Stockton", state_code: "CA", postal_code: "95202", country_code: "US", tax_id: "151-51-5151", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
              captures: { pos: $.data.id }
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 50 }
              as: TransferExaminer
              captures: { cert: $.data.id }
            - call: "POST /certificates/${cert}/report-lost"
              payload: { loss_date: "2026-08-10T00:00:00Z" }
              as: TransferExaminer
              as_user_id: "exam_1"
              captures: { claim1: $.data.id }
          trigger:
            - call: "POST /certificates/${cert}/report-lost"
              payload: { loss_date: "2026-08-11T00:00:00Z" }
              as: TransferExaminer
              as_user_id: "exam_2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_OPEN_CLAIM with HTTP 409 (the open stop occupancy rejects a second report)"
            - "GET /lost-certificate-claims?certificate_id=${cert} returns total_count == 1"
            - "Certificate.${cert}.status remains LOST_REPORTED"

  - rule_id: compensating_invariant
    instances:
      - name: share_conservation_withdrawal_redeposit
        grounds:
          - entities.Position.fields.total_shares
          - entities.Issuer.fields.shares_outstanding
          - state_machines.Certificate.ISSUED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: share count. The withdrawal / convert-to-drs pair are compensating
          actions: Position.total_shares == 500 and Issuer.shares_outstanding == 500 before, after,
          and between the pair; only the book/certificated split moves.
        test_recipe:
          setup: ["Issuer outstanding 500; account with 500 book-entry shares"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Sigma Co", cusip: "000000018", ticker: "SGMA", shares_outstanding: 500, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Vera Vault", address_line1: "26 Alder St", city: "Irvine", state_code: "CA", postal_code: "92602", country_code: "US", tax_id: "161-61-6161", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 500 }
              as: AgentAdmin
              captures: { pos: $.data.id }
          trigger:
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 200 }
              as: TransferExaminer
              captures: { cert: $.data.id }
            - call: "GET /positions?account_id=${acct}"
              as: TransferExaminer
            - call: "POST /certificates/${cert}/convert-to-drs"
              payload: {}
              as: TransferExaminer
            - call: "GET /positions?account_id=${acct}"
              as: TransferExaminer
            - call: "GET /issuers/${iss}"
              as: TransferExaminer
          assert:
            - "after withdrawal: Position.book_entry_shares == 300 and certificated_shares == 200, total_shares == 500"
            - "after convert-to-drs: Position.book_entry_shares == 500 and certificated_shares == 0, total_shares == 500"
            - "invariant: total_shares == 500 at every step (withdrawal and redeposit compensate exactly)"
            - "Issuer.${iss}.shares_outstanding == 500 unchanged; total_book_entry_shares returns to 500 and total_certificated_shares returns to 0"
            - "Certificate.${cert}.status == CANCELLED"

      - name: dividend_cash_conservation_return_reissue
        grounds:
          - entities.DividendDeclaration.fields.total_accrued_cents
          - entities.DividendPayment.fields.gross_cents
          - state_machines.DividendPayment.DISBURSED_to_RETURNED
          - state_machines.DividendPayment.RETURNED_to_DISBURSED
        distinguishing_aspect: |
          Conserved quantity: dividend cash cents (a different quantity from share count). The
          mark-returned / reissue pair are compensating actions on a disbursed payment: per-row
          gross_cents == net_cents + withholding_cents (500 == 380 + 120) and the declaration's
          frozen total_accrued_cents == 500 hold before, after, and between the pair.
        test_recipe:
          setup:
            - "Issuer outstanding 1000; account with tin_status MISSING holding 1000 shares"
            - "Declaration 500 millicents/share, record 2026-08-02, payable 2026-08-03; payment disbursed with 24% backup withholding"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Tau Inc", cusip: "000000019", ticker: "TAUI", shares_outstanding: 1000, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Walt Withheld", address_line1: "27 Chestnut St", city: "El Paso", state_code: "TX", postal_code: "79901", country_code: "US", tax_id: "171-71-7171", tin_status: "MISSING" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1000 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-08-02T00:00:00Z", payable_date: "2026-08-03T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
              captures: { pay: "$.data[0].id" }
          trigger:
            - call: "POST /dividend-payments/${pay}/mark-returned"
              payload: {}
              as: ServiceAgent
            - call: "PATCH /accounts/${acct}"
              payload: { address_line1: "27 Chestnut St Ste 4" }
              as: AgentAdmin
            - call: "POST /dividend-payments/${pay}/reissue"
              payload: {}
              as: ServiceAgent
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
            - call: "GET /dividend-declarations/${decl}"
              as: AgentAdmin
          assert:
            - "invariant per row: DividendPayment.${pay}.gross_cents == 500 == net_cents (380) + withholding_cents (120) at DISBURSED, RETURNED, and re-disbursed states"
            - "DividendDeclaration.${decl}.total_accrued_cents == 500 after mark-returned and after reissue (return/reissue compensate; no drift)"
            - "DividendPayment.${pay}.status == DISBURSED after reissue"
            - "ShareholderAccount.${acct}.address_verified == true after the PATCH, which is what unblocked the reissue"
