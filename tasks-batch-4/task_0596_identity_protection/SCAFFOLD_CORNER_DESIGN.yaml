              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Imm Spec", tier: "TIER2", max_caseload: 1, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "leak" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { count_now: $.data.active_case_count }
          assert:
            - "Trigger 1's response body already has data.status == 'ASSIGNED' and data.specialist_id == ${sp_id}"
            - "Trigger 2 (issued immediately, no retry) returns active_case_count == 1 and status == 'AT_CAPACITY'"
            - "Specialist.${sp_id}.version == 2 (create + the assign cascade)"
