              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_v: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${rp_v}", memo: "premature settlement" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "interim advance" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { prov_id: $.data.id }
          assert:
            - "the FINAL_AUDITED attempt returns HTTP 422 with error.error_id == ERR_AUDITED_EXPENSE_MISSING and creates no DistributionRun"
            - "the PROVISIONAL attempt succeeds at the same expected_pool_version ${rp_v}, proving the refusal did not bump RevenuePool.version"
            - "DistributionRun.${prov_id}.variant == \"PROVISIONAL\", .status == \"COMPUTED\" and .net_pool_cents == 480000000, the 500000000 gross less the 20000000 *estimated* expense the PROVISIONAL variant selects"
            - "DistributionRun.${prov_id}.reserve_draw_cents == 6000000 (ceil(480000000*500/10000) = 24000000 clamped to the 6000000 shortfall) and .distributable_cents == 474000000"
            - "DistributionRun.${prov_id}.total_weight_bps == 40000 and each of the four lines has weight_bps == 10000, gross_share_cents == 118500000, withheld_cents == 11850000, governance_fee_cents == 1250000 and net_payable_cents == 105400000"
            - "every line has remainder_cent_awarded == 0, because 474000000 divides exactly across the four tied 10000 bps weights"

      - name: corner_reserve_sweep_rate_switches_with_restricted_posture
        claim_type: Constants Applied
        grounds:
          - calculations.distribution_share_allocation
          - calculations.reserve_posture_derivation
          - entities.Conference.fields.reserve_posture
        distinguishing_aspect: |
          The sweep rate is chosen by posture, not fixed: at a 4500000 balance
          against an 18000000 target the funded ratio is exactly 2500 bps, the
          posture is RESERVE_RESTRICTED and the rate triples to 1500 bps -
          ceil(596000000*1500/10000) = 89400000, then clamped by the 13500000
          shortfall. Each member therefore receives 145625000 instead of the
          147500000 an OPEN-posture 500 bps sweep on the same pool would leave,
          so an implementation hard-coding RESERVE_SWEEP_BPS_OPEN is off by
          1875000 cents per member.
