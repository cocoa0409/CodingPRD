# =============================================================================
# task_1498 — Joint Trench & Underground Conversion (Rule 20) scaffold
# =============================================================================

scenario: |
  Joint Trench & Underground Conversion Project (Rule 20 undergrounding program): participating utility cost share & sequencing, trench schedule & occupancy depth rules, customer service conversion & panel work, easement/permit acquisition, temporary service & outage coordination, cost allocation true-up & billing, property restoration & landscaping, project delay & change order

domain_name: joint-trench-undergrounding
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation      # estimated cost-share vs final true-up
  secondary_archetype: temporal_windowing       # trench occupancy & outage windows
  complexity_layers:
    - optimistic_concurrency                    # OCC on Project.version / TrenchSegment.version
    - cascading_side_effects                    # withdrawal & change-order chains
    - dual_variant_calculation                  # provisional vs final shares; standard vs waiver separation
    - rate_threshold_triggers                   # late-fee steps, LD cap, panel load factor
  entity_topology: flat                         # peer collections with FK references
  state_machine_shape: compound                 # project posture derived from children; plus cyclic & parallel machines
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties             # cost submitter may not publish the true-up
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: rule20_credit_cents, type: integer, source: input, description: "Rule 20 program credit pool applied at true-up (>= 0)" }
      - { name: estimated_total_cost_cents, type: integer, source: input, description: "Estimated total project cost (> 0); mutated by change-order incorporation" }
      - { name: contingency_days, type: integer, source: input, default: 0, description: "Excusable-delay allowance in days before LDs accrue (>= 0)" }
      - { name: target_cutover_on, type: datetime, source: input, description: "Planned cutover date; changed via replan" }
      - { name: status, type: enum, source: system, description: "PLANNING | MOBILIZED | TRENCHING | CONVERTING | RECONCILIATION | CLOSED | CANCELLED" }
      - { name: posture, type: enum, source: computed, description: "CLEAR | CONDITIONAL | FROZEN — derived from change orders, easements, share variance" }
      - { name: cumulative_delay_days, type: integer, source: computed, description: "Sum of delta_delay_days over INCORPORATED change orders" }
      - { name: liquidated_damages_cents, type: integer, source: computed, description: "Per calculation delay_liquidated_damages" }
      - { name: latest_true_up_run_id, type: string, source: computed, description: "Most recent TrueUpRun id (any status); null before first run", default: null }

  - name: UtilityParticipation
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: utility_name, type: string, source: input, description: "Utility display name" }
      - { name: utility_type, type: enum, source: input, description: "ELECTRIC | TELECOM | CATV" }
      - { name: cost_share_bp, type: integer, source: input, description: "Cost share in basis points (1..10000); sum over non-withdrawn participants must equal 10000 at mobilize" }
      - { name: sequence_order, type: integer, source: input, description: "Trench/billing sequence (>= 1); unique among non-withdrawn participants of the project" }
      - { name: has_separation_waiver, type: boolean, source: input, default: false, description: "Joint-trench reduced-separation waiver signed by this utility" }
      - { name: status, type: enum, source: system, description: "INVITED | COMMITTED | MOBILIZED | INSTALLED | BILLED | SETTLED | WITHDRAWN" }
      - { name: provisional_share_cents, type: integer, source: computed, description: "Estimated share per provisional_cost_share; recomputed at mobilize, withdrawal, and change-order incorporation" }
      - { name: final_share_cents, type: integer, source: computed, description: "Final allocated share per final_trueup_allocation; null until first DRAFT true-up run", default: null }
      - { name: variance_flag, type: boolean, source: computed, description: "True when a recompute moved provisional_share_cents by >= 10% vs its previous value" }
      - { name: withdrawn_on, type: datetime, source: system, description: "Clock timestamp of withdrawal; null otherwise", default: null }

  - name: TrenchSegment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: segment_code, type: string, source: input, description: "Human-readable segment identifier" }
      - { name: length_ft, type: integer, source: input, description: "Segment length in feet (> 0)" }
      - { name: max_depth_inches, type: integer, source: input, description: "Maximum usable trench depth in inches (> 0)" }
      - { name: parcel_ids, type: array, source: input, description: "FK -> Parcel.id (array); parcels the segment passes through" }
      - { name: excavation_start_on, type: datetime, source: system, description: "Scheduled excavation window start (set via /schedule); null until scheduled", default: null }
      - { name: excavation_end_on, type: datetime, source: system, description: "Scheduled excavation window end; null until scheduled", default: null }
      - { name: status, type: enum, source: system, description: "PLANNED | SCHEDULED | EXCAVATING | BACKFILLING | BACKFILLED | CLOSED" }
      - { name: occupied_depth_inches, type: integer, source: computed, description: "Max depth_bottom_inches over slots with status RESERVED|INSTALLING|INSTALLED|VERIFIED; 0 when none" }
      - { name: available_depth_inches, type: integer, source: computed, description: "max_depth_inches - occupied_depth_inches" }
      - { name: frozen, type: boolean, source: computed, description: "True while an APPROVED change order references this segment (or is project-wide)" }

  - name: OccupancySlot
    parent: null
    common_fields: true
    fields:
      - { name: trench_segment_id, type: string, source: input, description: "FK -> TrenchSegment.id" }
      - { name: participation_id, type: string, source: input, description: "FK -> UtilityParticipation.id" }
      - { name: depth_top_inches, type: integer, source: input, description: "Top of facility band (>= 12 min cover)" }
      - { name: depth_bottom_inches, type: integer, source: input, description: "Bottom of facility band (> depth_top_inches, <= segment max_depth_inches)" }
      - { name: install_start_at, type: datetime, source: input, description: "Install window start (within segment excavation window)" }
      - { name: install_end_at, type: datetime, source: input, description: "Install window end (> install_start_at)" }
      - { name: status, type: enum, source: system, description: "RESERVED | INSTALLING | INSTALL_FAILED | INSTALLED | VERIFIED | RELEASED" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: owner_name, type: string, source: input, description: "Property owner name" }
      - { name: existing_panel_amps, type: integer, source: input, description: "Existing service panel rating in amps (> 0)" }
      - { name: load_calc_amps, type: integer, source: input, description: "Calculated load in amps (> 0)" }
      - { name: panel_upgrade_required, type: boolean, source: computed, description: "load_calc_amps >= 0.8 * existing_panel_amps" }

  - name: Easement
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: easement_type, type: enum, source: input, description: "TRENCH | ACCESS | ANCHOR; only TRENCH gates excavation" }
      - { name: status, type: enum, source: system, description: "DRAFT | REQUESTED | SIGNED | RECORDED | REFUSED" }
      - { name: requested_on, type: datetime, source: system, description: "Clock timestamp of last DRAFT|REFUSED -> REQUESTED", default: null }
      - { name: signed_on, type: datetime, source: system, description: "Clock timestamp of signing", default: null }
      - { name: recorded_on, type: datetime, source: system, description: "Clock timestamp of recording", default: null }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: permit_type, type: enum, source: input, description: "ENCROACHMENT | TRAFFIC_CONTROL | GRADING" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start" }
      - { name: valid_to, type: datetime, source: input, description: "Validity window end (> valid_from)" }
      - { name: status, type: enum, source: system, description: "APPLICATION | SUBMITTED | ISSUED | EXPIRED | REVOKED | CLOSED" }

  - name: ServiceConversion
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id (denormalized filter key); must equal the parcel's project_id" }
      - { name: work_status, type: enum, source: system, description: "PLANNED | ROUGH_IN | PANEL_SET | READY_TO_ENERGIZE | ENERGIZED | INSPECTED | COMPLETE" }
      - { name: temp_service_status, type: enum, source: system, description: "NONE | TEMP_INSTALLED | TEMP_ACTIVE | TEMP_REMOVED — parallel state dimension" }
      - { name: panel_capacity_amps, type: integer, source: system, description: "New panel rating set at PANEL_SET; null until then", default: null }
      - { name: last_inspection_outcome, type: enum, source: system, description: "PASS | FAIL recorded at inspection; null until first inspection", default: null }
      - { name: energized_on, type: datetime, source: system, description: "Clock timestamp of energization", default: null }

  - name: OutageWindow
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: feeder_id, type: string, source: input, description: "Feeder identifier; capacity rules are per feeder" }
      - { name: start_at, type: datetime, source: input, description: "Outage window start (half-open)" }
      - { name: end_at, type: datetime, source: input, description: "Outage window end (> start_at, duration <= 8h)" }
      - { name: conversion_ids, type: array, source: input, description: "FK -> ServiceConversion.id (array); affected conversions" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | NOTIFIED | EXECUTED | CLOSED | CANCELLED" }
      - { name: notified_at, type: datetime, source: system, description: "Clock timestamp of customer notification", default: null }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: description, type: string, source: input, description: "Scope description" }
      - { name: segment_ids, type: array, source: input, default: [], description: "FK -> TrenchSegment.id (array); empty means project-wide" }
      - { name: delta_cost_cents, type: integer, source: input, description: "Signed cost delta; required at PRICED" , default: null }
      - { name: delta_delay_days, type: integer, source: input, description: "Non-negative delay delta in days; required at PRICED", default: null }
      - { name: delay_cause, type: enum, source: input, description: "EXCUSABLE | NEGLIGENT | MIXED; required at PRICED", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | PRICED | APPROVED | INCORPORATED | REJECTED | WITHDRAWN" }
      - { name: revision_count, type: integer, source: system, description: "Increments on each PRICED -> PROPOSED revision", default: 0 }

  - name: ActualCostEntry
    parent: null
    common_fields: false   # append-only: id + created_at only; no update endpoints exist
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: participation_id, type: string, source: input, description: "FK -> UtilityParticipation.id; required when cost_code = EXCLUSIVE, omitted otherwise", default: null }
      - { name: cost_code, type: enum, source: input, description: "JOINT_TRENCH | EXCLUSIVE | RESTORATION | PROGRAM_OVERHEAD" }
      - { name: amount_cents, type: integer, source: input, description: "Cost amount (> 0)" }
      - { name: incurred_on, type: datetime, source: input, description: "Date the cost was incurred" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting FinanceAnalyst (segregation-of-duties anchor)" }

  - name: TrueUpRun
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED | SETTLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst who created the run" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager who published; null until published", default: null }
      - { name: total_actual_cost_cents, type: integer, source: computed, description: "Sum over all ActualCostEntry of the project" }
      - { name: rule20_credit_applied_cents, type: integer, source: computed, description: "Credit actually consumed by the waterfall (<= project.rule20_credit_cents)" }
      - { name: lines, type: array, source: computed, description: "Per-participation objects: participation_id, gross_share_cents, credit_cents, exclusive_cents, final_share_cents, delta_cents, refund_cents" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: true_up_run_id, type: string, source: system, description: "FK -> TrueUpRun.id" }
      - { name: participation_id, type: string, source: system, description: "FK -> UtilityParticipation.id" }
      - { name: principal_cents, type: integer, source: system, description: "Billed delta at publish (may be adjusted on dispute resolution)" }
      - { name: issued_on, type: datetime, source: system, description: "Clock timestamp at publish" }
      - { name: due_on, type: datetime, source: system, description: "issued_on + 30 days" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | DISPUTED | VOID" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Per calculation late_fee_accrual, evaluated at read time against the logical clock" }
      - { name: amount_due_cents, type: integer, source: computed, description: "principal_cents + late_fee_cents" }
      - { name: paid_on, type: datetime, source: system, description: "Clock timestamp of payment", default: null }

  - name: RestorationTask
    parent: null
    common_fields: true
    fields:
      - { name: trench_segment_id, type: string, source: input, description: "FK -> TrenchSegment.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: task_type, type: enum, source: input, description: "HARDSCAPE | LANDSCAPE | IRRIGATION" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_WORK | COMPLETE | ACCEPTED | WARRANTY_CLAIM" }
      - { name: completed_on, type: datetime, source: system, description: "Clock timestamp of completion", default: null }
      - { name: accepted_on, type: datetime, source: system, description: "Clock timestamp of acceptance", default: null }
      - { name: warranty_expires_on, type: datetime, source: computed, description: "completed_on + 180 days; null until COMPLETE", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: MOBILIZED
        trigger: "POST /api/projects/{id}/lifecycle {action: MOBILIZE}"
        actor: ProgramManager
        preconditions:
          - "count of participations with status COMMITTED >= 2 (ERR_MIN_PARTICIPANTS)"
          - "sum of cost_share_bp over participations with status COMMITTED|MOBILIZED == 10000 (ERR_SHARE_SUM_INVALID)"
          - "no duplicate sequence_order among non-withdrawn participations (ERR_DUPLICATE_SEQUENCE)"
        side_effects:
          - "provisional_cost_share computed for every participation in COMMITTED|MOBILIZED"
      - from: MOBILIZED
        to: TRENCHING
        trigger: "POST /api/projects/{id}/lifecycle {action: START_TRENCHING}"
        actor: ProgramManager
        preconditions:
          - "posture != FROZEN (ERR_POSTURE_FROZEN)"
          - "at least one TrenchSegment with status SCHEDULED exists (ERR_INVALID_STATE)"
        side_effects: []
      - from: TRENCHING
        to: CONVERTING
        trigger: "POST /api/projects/{id}/lifecycle {action: START_CONVERSION}"
        actor: ProgramManager
        preconditions:
          - "every TrenchSegment of the project is in BACKFILLED|CLOSED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONVERTING
        to: RECONCILIATION
        trigger: "POST /api/projects/{id}/lifecycle {action: START_RECONCILIATION}"
        actor: ProgramManager
        preconditions:
          - "every ServiceConversion of the project has work_status = COMPLETE (ERR_INVALID_STATE)"
          - "every TrenchSegment is CLOSED (ERR_INVALID_STATE)"
          - "every OutageWindow is CLOSED|CANCELLED (ERR_INVALID_STATE)"
        side_effects: []
      - from: RECONCILIATION
        to: CLOSED
        trigger: "POST /api/projects/{id}/lifecycle {action: CLOSE}"
        actor: ProgramManager
        preconditions:
          - "latest TrueUpRun exists and has status SETTLED (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /api/projects/{id}/lifecycle {action: CANCEL}"
        actor: ProgramManager
        preconditions: []
        side_effects: ["participations in INVITED|COMMITTED stay unchanged (project cancellation is administrative)"]
      - from: MOBILIZED
        to: CANCELLED
        trigger: "POST /api/projects/{id}/lifecycle {action: CANCEL}"
        actor: ProgramManager
        preconditions: []
        side_effects: []

  - entity: UtilityParticipation
    initial_state: INVITED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: INVITED
        to: COMMITTED
        trigger: "POST /api/participations/{id}/transition {to: COMMITTED}"
        actor: UtilityCoordinator (own participation only)
        preconditions: ["project.status == PLANNING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: COMMITTED
        to: MOBILIZED
        trigger: "POST /api/participations/{id}/transition {to: MOBILIZED}"
        actor: UtilityCoordinator (own)
        preconditions: ["project.status == MOBILIZED|TRENCHING|CONVERTING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: MOBILIZED
        to: INSTALLED
        trigger: "POST /api/participations/{id}/transition {to: INSTALLED}"
        actor: UtilityCoordinator (own)
        preconditions:
          - "every OccupancySlot of this participation is in VERIFIED|RELEASED (ERR_INVALID_STATE)"
        side_effects: []
      - from: BILLED
        to: SETTLED
        trigger: "system (cascade: every Invoice of this participation reaches PAID|VOID)"
        actor: system
        preconditions: ["all invoices of this participation are PAID|VOID"]
        side_effects: []
      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /api/participations/{id}/transition {to: WITHDRAWN}"
        actor: UtilityCoordinator (own)
        preconditions: []
        side_effects: ["withdrawal cascade (see shared note below)"]
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /api/participations/{id}/transition {to: WITHDRAWN}"
        actor: UtilityCoordinator (own)
        preconditions: []
        side_effects: ["withdrawal cascade (see shared note below)"]
      - from: MOBILIZED
        to: WITHDRAWN
        trigger: "POST /api/participations/{id}/transition {to: WITHDRAWN}"
        actor: UtilityCoordinator (own)
        preconditions: []
        side_effects: ["withdrawal cascade (see shared note below)"]
      - from: INSTALLED
        to: BILLED
        trigger: "system (cascade: a TrueUpRun publish issues this participation an Invoice)"
        actor: system
        preconditions: []
        side_effects: []
    notes: |
      Withdrawal cascade (each hop caused by the previous):
      (1) this participation -> WITHDRAWN, withdrawn_on = clock, provisional_share_cents -> 0;
      (2) its OccupancySlots in RESERVED|INSTALLING|INSTALL_FAILED -> RELEASED;
      (3) each affected TrenchSegment recomputes occupied_depth_inches / available_depth_inches;
      (4) remaining non-withdrawn participations rescale cost_share_bp to sum 10000
          (round_half_up(bp * 10000 / remaining_bp_sum), then fix rounding drift by +/-1 bp
          on the participant with lowest sequence_order, tie-break created_at ASC);
      (5) provisional_cost_share recomputed for all non-withdrawn participants;
      (6) variance_flag updated per participant; project posture recomputed.

  - entity: TrenchSegment
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /api/trench-segments/{id}/schedule (OCC)"
        actor: ProgramManager
        preconditions:
          - "segment not frozen (ERR_CHANGE_ORDER_FREEZE)"
          - "project.status in MOBILIZED|TRENCHING (ERR_INVALID_STATE)"
          - "excavation_start_on < excavation_end_on (ERR_VALIDATION)"
        side_effects: ["trench segment version incremented by 1"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/trench-segments/{id}/schedule (reschedule supersedes prior window; OCC)"
        actor: ProgramManager
        preconditions:
          - "segment not frozen (ERR_CHANGE_ORDER_FREEZE)"
          - "project.status in MOBILIZED|TRENCHING (ERR_INVALID_STATE)"
        side_effects: ["excavation window replaced", "trench segment version incremented by 1"]
      - from: SCHEDULED
        to: EXCAVATING
        trigger: "POST /api/trench-segments/{id}/transition {to: EXCAVATING}"
        actor: ProgramManager
        preconditions:
          - "project.status == TRENCHING (ERR_INVALID_STATE)"
          - "segment not frozen (ERR_CHANGE_ORDER_FREEZE)"
          - "no parcel in parcel_ids has a TRENCH easement in REFUSED (ERR_EASEMENT_REFUSED_BLOCKING)"
          - "every parcel in parcel_ids has a TRENCH easement in RECORDED (ERR_EASEMENT_NOT_RECORDED)"
          - "an ENCROACHMENT Permit with status ISSUED exists for the project (ERR_PERMIT_NOT_ISSUED)"
          - "that permit's [valid_from, valid_to] covers [excavation_start_on, excavation_end_on] inclusive (ERR_PERMIT_WINDOW_VIOLATION)"
        side_effects: []
      - from: EXCAVATING
        to: BACKFILLING
        trigger: "POST /api/trench-segments/{id}/transition {to: BACKFILLING}"
        actor: ProgramManager
        preconditions:
          - "every OccupancySlot of this segment is in INSTALLED|VERIFIED|RELEASED (ERR_INVALID_STATE)"
        side_effects: []
      - from: BACKFILLING
        to: BACKFILLED
        trigger: "POST /api/trench-segments/{id}/transition {to: BACKFILLED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: BACKFILLED
        to: EXCAVATING
        trigger: "POST /api/trench-segments/{id}/transition {to: EXCAVATING} (reopen cycle)"
        actor: ProgramManager
        preconditions:
          - "segment not frozen (ERR_CHANGE_ORDER_FREEZE)"
          - "permit + easement gates identical to SCHEDULED -> EXCAVATING"
        side_effects: []
      - from: BACKFILLED
        to: CLOSED
        trigger: "POST /api/trench-segments/{id}/transition {to: CLOSED}"
        actor: ProgramManager
        preconditions:
          - "every RestorationTask of this segment is ACCEPTED (ERR_RESTORATION_OPEN_BLOCKING)"
        side_effects: []

  - entity: OccupancySlot
    initial_state: RESERVED
    terminal_states: [VERIFIED, RELEASED]
    transitions:
      - from: RESERVED
        to: INSTALLING
        trigger: "POST /api/occupancy-slots/{id}/transition {to: INSTALLING}"
        actor: UtilityCoordinator (own participation)
        preconditions:
          - "segment.status == EXCAVATING (ERR_INVALID_STATE)"
          - "every deeper slot on the same segment (depth_top_inches > this.depth_top_inches) is INSTALLED|VERIFIED (ERR_SLOT_ORDER_VIOLATION)"
        side_effects: []
      - from: INSTALLING
        to: INSTALLED
        trigger: "POST /api/occupancy-slots/{id}/transition {to: INSTALLED}"
        actor: UtilityCoordinator (own)
        preconditions: []
        side_effects: []
      - from: INSTALLING
        to: INSTALL_FAILED
        trigger: "POST /api/occupancy-slots/{id}/transition {to: INSTALL_FAILED}"
        actor: UtilityCoordinator (own)
        preconditions: []
        side_effects: []
      - from: INSTALL_FAILED
        to: INSTALLING
        trigger: "POST /api/occupancy-slots/{id}/transition {to: INSTALLING} (retry cycle)"
        actor: UtilityCoordinator (own)
        preconditions: ["same deeper-first gate as RESERVED -> INSTALLING"]
        side_effects: []
      - from: INSTALLED
        to: VERIFIED
        trigger: "POST /api/occupancy-slots/{id}/transition {to: VERIFIED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/occupancy-slots/{id}/transition {to: RELEASED} or withdrawal cascade"
        actor: UtilityCoordinator (own) | system
        preconditions: []
        side_effects: ["segment recomputes occupied_depth_inches / available_depth_inches"]
      - from: INSTALL_FAILED
        to: RELEASED
        trigger: "POST /api/occupancy-slots/{id}/transition {to: RELEASED} or withdrawal cascade"
        actor: UtilityCoordinator (own) | system
        preconditions: []
        side_effects: ["segment recomputes occupied_depth_inches / available_depth_inches"]

  - entity: Easement
    initial_state: DRAFT
    terminal_states: [RECORDED]
    transitions:
      - from: DRAFT
        to: REQUESTED
        trigger: "POST /api/easements/{id}/transition {to: REQUESTED}"
        actor: RightOfWayAgent
        preconditions: []
        side_effects: ["requested_on = clock"]
      - from: REQUESTED
