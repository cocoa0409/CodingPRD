              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rl_id: $.data.id }
            - call: "POST /return-lines/${rl_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { rl_ver_graded: $.data.version }
            - call: "POST /return-lines/${rl_id}/override-disposition"
              payload: { disposition: "DONATE", override_reason: "Client charity programme" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { rl_ver_override: $.data.version }
          trigger:
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${rl_id}", expected_return_line_version: "${rl_ver_graded}", channel_id: "${ch_id}", disposition: "LIQUIDATE", channel_window_start_at: "2026-08-03T08:00:00Z", channel_window_end_at: "2026-08-03T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_RETURN_LINE_VERSION — not ERR_DISPOSITION_DRIFT, because priority 29 precedes priority 49"
            - "${rl_ver_override} == ${rl_ver_graded} + 1, the single increment contributed by the override"
            - "GET /return-lines/${rl_id} shows disposition == DONATE, version == ${rl_ver_override} and disposition_state == GRADED, so the refused create left the line untouched"
            - "GET /disposition-orders?return_line_id=${rl_id} returns total_count == 0"
            - "Re-sending with expected_return_line_version == ${rl_ver_override} and disposition DONATE returns HTTP 201, proving both the token and the disposition had to be refreshed"

