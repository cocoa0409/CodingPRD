            - call: "GET /billing-statements/${tc2_st}"
              as: BillingAdmin
              captures: { tc2_post_end: $.data.postage_cents, tc2_box_end: $.data.box_charge_cents, tc2_st_status: $.data.status }
          assert:
            - "after manifest the statement had postage_cents == 970 (2 x 485) and box_charge_cents == 4000 (${tc2_post_mid} / ${tc2_box_mid})"
            - "after wave cancel: Shipment.${tc2_sh1} fulfill_status == STAGED and label_status == VOIDED; same for Shipment.${tc2_sh2}"
            - "BillingStatement.${tc2_st}.postage_cents == 0 (PURCHASED-only filter drops voided labels) and box_charge_cents == 4000 unchanged"
            - "BillingStatement.${tc2_st}.status == PROVISIONAL (cancel never finalizes)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lock_plan_retired_and_zero_credit_state_wins
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_CREDIT]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_fiscal (p7): the lock call
          violates both (plan RETIRED; wallet 0 < estimate 6000) and MUST return
          ERR_PLAN_NOT_ACTIVE, never ERR_INSUFFICIENT_CREDIT.
        test_recipe:
          setup:
            - "client PV1 with credit_balance_cents == 0 (never topped up)"
            - "component CMP-PV1 stocked 100; plan PL-PV1 with APPROVED BOM (qty 1), activated then RETIRED"
            - "2 ACTIVE subscribers; run 2026-05 created (DRAFT) on the retired plan"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "PV1 Client", billing_email: "pv1@acme.test" }
              as: PlatformAdmin
              captures: { pv1_cl: $.data.id }
            - call: "POST /components"
              payload: { sku: "CMP-PV1", name: "PV1 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { pv1_cp: $.data.id, pv1_cp_v: $.data.version }
            - { call: "POST /components/${pv1_cp}/receipts", payload: { quantity: 100, expected_component_version: "${pv1_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${pv1_cl}", name: "PV1 Box", sku: "PL-PV1", price_per_box_cents: 3000, shipping_weight_grams: 1000 }
              as: ClientOps
              as_user_id: "${pv1_cl}"
              captures: { pv1_pl: $.data.id, pv1_pl_v: $.data.version }
            - call: "POST /box-plans/${pv1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${pv1_pl_v}" }
              as: ClientOps
              as_user_id: "${pv1_cl}"
              captures: { pv1_rv: $.data.id }
            - call: "PUT /kit-revisions/${pv1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${pv1_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${pv1_cl}"
            - { call: "POST /kit-revisions/${pv1_rv}/approve", as: ClientOps, as_user_id: "${pv1_cl}" }
            - { call: "POST /box-plans/${pv1_pl}/activate", as: ClientOps, as_user_id: "${pv1_cl}" }
            - { call: "POST /box-plans/${pv1_pl}/retire", as: ClientOps, as_user_id: "${pv1_cl}" }
            - call: "POST /box-plans/${pv1_pl}/import-batches"
              payload: { rows: [{ email: "pv1a@x.test", zone: 2 }, { email: "pv1b@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${pv1_cl}"
              captures: { pv1_ib: $.data.id }
            - { call: "POST /import-batches/${pv1_ib}/commit", as: ClientOps, as_user_id: "${pv1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${pv1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { pv1_rn: $.data.id }
          trigger:
            - call: "POST /assembly-runs/${pv1_rn}/lock"
              as: WarehouseOps
              captures: { pv1_err: $.data.error_id }
          assert:
            - "error_id (${pv1_err}) == ERR_PLAN_NOT_ACTIVE with HTTP 409 (state, priority 4)"
            - "ERR_INSUFFICIENT_CREDIT (business_fiscal, priority 7) MUST NOT be returned even though wallet 0 < estimate 6000"
            - "AssemblyRun.${pv1_rn} remains DRAFT"

      - name: wave_malformed_window_rejected_over_overlap_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_WAVE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Error-category pair business_constraint (p5) vs business_temporal
          (p6): a wave whose pickup_end <= pickup_start also geometrically
          overlaps an existing same-carrier window, and MUST return
          ERR_INVALID_WINDOW, never ERR_WAVE_WINDOW_CONFLICT. Different category
          pair than the state-vs-fiscal instance.
        test_recipe:
          setup:
            - "wave WV-PV2 exists: USPS GROUND pickup 2026-05-10T10:00:00Z to 2026-05-10T12:00:00Z, SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T12:00:00Z" }
              as: WarehouseOps
              captures: { pv2_wv: $.data.id }
          trigger:
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T12:00:00Z", pickup_end: "2026-05-10T11:00:00Z" }
              as: WarehouseOps
              captures: { pv2_err: $.data.error_id }
          assert:
            - "error_id (${pv2_err}) == ERR_INVALID_WINDOW with HTTP 400 (business_constraint, priority 5)"
            - "ERR_WAVE_WINDOW_CONFLICT (business_temporal, priority 6) MUST NOT be returned for the malformed interval"
            - "no second wave is persisted (GET /shipping-waves/${pv2_wv} still the only SCHEDULED USPS wave)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lock_credit_exactly_equal_estimate_passes
        grounds:
          - calculations.run_estimate
          - errors[ERR_INSUFFICIENT_CREDIT]
          - entities.AssemblyRun.fields.estimate_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on money at the lock endpoint: the gate is
          '>=' so wallet exactly equal to the estimate (6000 == 6000) PASSES;
          one cent less would fail with ERR_INSUFFICIENT_CREDIT.
        test_recipe:
          setup:
            - "client BD1 topped up to exactly 6000 cents"
            - "component CMP-BD1 stocked 100 (BOM qty 1); plan PL-BD1 ACTIVE price 3000 weight 1000"
            - "2 ACTIVE subscribers; run 2026-05 DRAFT (estimate will be 2 x 3000 = 6000)"
