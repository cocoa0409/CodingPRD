            - "An APPROVED LOW merchant on a FLAT plan (290bps + 30c) with an AUTHORIZED charge of 12345."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
