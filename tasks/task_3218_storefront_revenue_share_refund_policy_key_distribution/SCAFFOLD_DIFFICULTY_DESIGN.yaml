  - rule_id: cross_entity_state_dependency
    instances:
      - name: key_batch_approval_gated_by_title_release_state
        grounds:
          - state_machines.ActivationKeyBatch
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair ActivationKeyBatch -> Title: batch approval requires
          Title.status == RELEASED; while the title sits APPROVED (not yet
          released) the approve transition is rejected with ERR_INVALID_STATE,
          and succeeds after release-now with no change to the batch itself.
        test_recipe:
          setup:
            - "Active developer; title APPROVED but not RELEASED; batch REQUESTED with 10 keys (0 free)"
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Gate Studio", contact_email: "gate@studio.example" }
              as: PlatformOps
