# =============================================================================
# SCAFFOLD.yaml — Autonomous Ride-Hailing Depot Operations & Remote Assistance
# §1.0–§1.7. Difficulty (§1.8) and Corner (§1.9) designs live in sibling files.
# =============================================================================

scenario: |
  Autonomous Ride-Hailing Depot Operations & Remote Assistance (Waymo): vehicle
  depot cycles covering charging, cleaning, sensor calibration and software update
  before returning to service, fleet availability planning against demand curves
  with staged deployment across a service territory, geofenced operational design
  domain with route restrictions, exclusion zones and weather-based service
  suspension, rider support and remote assistance escalation when a vehicle
  encounters an unresolvable situation, pickup and dropoff location selection
  constrained by curb access and safety rules, incident and collision reporting
  obligations with data retention, roadside response team dispatch for stuck or
  disabled vehicles, service area expansion with mapping and validation gates

domain_name: autonomous-ride-hailing-depot-ops
api_prefix: /fleet

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: workflow orchestration
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
    - idempotency
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  entity_count: 17
  state_machine_count: 9
  calculation_count: 10
  validation_layers: 12
  endpoint_count: 114
  error_code_count: 29
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceTerritory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Territory display name" }
      - { name: region_code, type: string, source: input, description: "Operating region code, e.g. PHX-METRO" }
      - { name: posture, type: enum, source: computed, description: "PENDING | MAPPING | VALIDATING | ACTIVE | RESTRICTED | SUSPENDED — derived per §1.3 territory_posture" }
      - { name: mapped_pct, type: integer, source: input, default: 0, description: "Percent of road segments with validated HD maps (0-100)" }
      - { name: validation_hours, type: integer, source: input, default: 0, description: "Cumulative supervised validation drive hours" }
      - { name: road_type_risk, type: enum, source: input, default: "MEDIUM", description: "LOW | MEDIUM | HIGH — highest unmet road-type risk in the territory" }
      - { name: active_zone_count, type: integer, source: computed, description: "Count of ExclusionZone rows in status ACTIVE for this territory" }
      - { name: total_credit_cents, type: integer, source: computed, default: 0, description: "Territory ride-credit pool, recomputed per §1.3 territory_total_credit" }
      - { name: total_severe_incidents, type: integer, source: computed, default: 0, description: "Count of non-VOIDED SEVERE IncidentReports for vehicles in this territory, per §1.3 territory_total_severe_incidents" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DepotSite
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; operating territory" }
      - { name: name, type: string, source: input, description: "Depot name" }
      - { name: charge_positions, type: integer, source: input, description: "Total charging bay positions" }
      - { name: cleaning_positions, type: integer, source: input, description: "Total cleaning bay positions" }
      - { name: calib_positions, type: integer, source: input, description: "Total sensor-calibration bay positions" }
      - { name: software_positions, type: integer, source: input, description: "Total software-update bay positions" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | LOCKDOWN — derived per §1.3 depot_posture" }
      - { name: occupancy_pct, type: integer, source: computed, default: 0, description: "Floored percent of bay positions occupied by RESERVED/ACTIVE BaySlots" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run-depot-ops" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Vehicle
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; home territory" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique per territory" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_SERVICE | AT_DEPOT | ROADSIDE | SUSPENDED — lifecycle dimension per §1.2" }
      - { name: service_status, type: enum, source: computed, description: "Parallel axis: UNAVAILABLE | AVAILABLE | DISPATCHED | ON_TRIP — derived per §1.3 vehicle_service_status" }
      - { name: battery_pct, type: integer, source: input, description: "State of charge percent (0-100)" }
      - { name: cleanliness_score, type: integer, source: input, default: 100, description: "Cabin cleanliness score (0-100)" }
      - { name: calib_valid, type: boolean, source: input, default: false, description: "True only once a sensor-calibration cycle has been signed off" }
      - { name: software_version, type: string, source: input, description: "Current onboard software version" }
      - { name: target_software_version, type: string, source: input, description: "Fleet-mandated software version" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Ride-credit balance credited/debited per §1.3 territory_total_credit" }
      - { name: is_roadside_blocked, type: boolean, source: computed, default: false, description: "True while a RoadsideCase in status RESPONSE_DISPATCHED references this vehicle" }
      - { name: current_depot_id, type: string, source: system, required: false, description: "FK -> DepotSite.id; depot the vehicle is staged at; null otherwise" }
      - { name: delay_ops_runs, type: integer, source: computed, default: 0, description: "Count of depot ops runs elapsed while AT_DEPOT and not yet re-deployed" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: BaySlot
    parent: DepotSite
    common_fields: true
    fields:
      - { name: depot_id, type: string, source: input, description: "FK -> DepotSite.id; owning depot" }
      - { name: service_type, type: enum, source: input, description: "CHARGE | CLEAN | CALIBRATION | SOFTWARE" }
      - { name: bay_index, type: integer, source: input, description: "Physical bay number within the depot bay pool for this service_type" }
      - { name: start_utc, type: datetime, source: input, description: "Reservation window start (UTC)" }
      - { name: duration_seconds, type: integer, source: input, description: "Reservation window length in seconds" }
      - { name: end_utc, type: datetime, source: computed, description: "= start_utc + duration_seconds; window is half-open [start_utc, end_utc)" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle occupying the bay" }
      - { name: cycle_id, type: string, source: input, description: "FK -> DepotCycle.id; cycle this slot belongs to" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | COMPLETED | RELEASED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DepotCycle
    parent: DepotSite
    common_fields: true
    fields:
      - { name: depot_id, type: string, source: input, description: "FK -> DepotSite.id; depot running the cycle" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle under service" }
      - { name: service_kind, type: enum, source: input, description: "CHARGE | CLEAN | CALIBRATION | SOFTWARE" }
      - { name: status, type: enum, source: system, description: "STAGED -> IN_PROGRESS -> COMPLETED / ABORTED" }
      - { name: is_scheduled, type: boolean, source: system, default: false, description: "True once the cycle holds a reserved BaySlot" }
      - { name: last_ops_run_index, type: integer, source: system, description: "Depot.ops_run_index observed at last run-depot-ops sweep" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DeploymentWave
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; target territory" }
      - { name: window_code, type: enum, source: input, description: "MORNING_PEAK | MIDDAY | EVENING_PEAK | OVERNIGHT" }
      - { name: planned_vehicle_count, type: integer, source: input, description: "Vehicles the wave intends to deploy" }
      - { name: deployed_vehicle_count, type: integer, source: system, default: 0, description: "Vehicles actually moved into IN_SERVICE by this wave" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | ABORTED" }
      - { name: last_ops_run_index, type: integer, source: system, description: "Territory ops epoch observed at last wave sweep" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DemandSignal
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory the curve belongs to" }
      - { name: window_code, type: enum, source: input, description: "MORNING_PEAK | MIDDAY | EVENING_PEAK | OVERNIGHT" }
      - { name: projected_rides, type: integer, source: input, description: "Forecast ride requests in the window" }
      - { name: manual_only_rides, type: integer, source: input, description: "Forecast ride requests that cannot be served autonomously" }
      - { name: effective_demand, type: integer, source: computed, description: "= max(0, projected_rides - manual_only_rides)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ServiceAreaRule
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; rule scope" }
      - { name: rule_version, type: integer, source: system, default: 1, description: "Rule-set version; bumped on approval and pinned onto ServiceAreaExpansionRequest at approval" }
      - { name: route_class, type: enum, source: input, description: "FREEWAY | ARTERIAL | RESIDENTIAL | ALLEY" }
      - { name: allowed, type: boolean, source: input, description: "Whether the route class is inside the operational design domain" }
      - { name: notes, type: string, source: input, required: false, description: "Human-readable ODD annotation" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | RETIRED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ExclusionZone
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; zone scope" }
      - { name: kind, type: enum, source: input, description: "CONSTRUCTION | EVENT | EMERGENCY | WEATHER | TEMPORARY" }
      - { name: route_class, type: enum, source: input, description: "FREEWAY | ARTERIAL | RESIDENTIAL | ALLEY — route class the exclusion applies to" }
      - { name: start_utc, type: datetime, source: input, description: "Exclusion window start (UTC); window is closed [start_utc, end_utc] and inclusive at both edges" }
      - { name: duration_seconds, type: integer, source: input, description: "Exclusion window length in seconds" }
      - { name: end_utc, type: datetime, source: computed, description: "= start_utc + duration_seconds" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | EXPIRED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ServiceAreaExpansionRequest
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory requesting the expansion" }
      - { name: target_region_code, type: string, source: input, description: "Region code of the neighboring area proposed for inclusion" }
      - { name: mapped_pct_at_submit, type: integer, source: system, description: "Snapshot of the territory's mapped_pct at submission (change detection)" }
      - { name: rule_version_at_approval, type: integer, source: system, required: false, description: "ServiceAreaRule.rule_version pinned at approval; null before approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | MAPPING_COMPLETE | VALIDATION_FAILED | CONDITIONALLY_APPROVED | APPROVED | REJECTED" }
      - { name: requires_road_type_validation, type: boolean, source: input, default: false, description: "True when a HIGH-risk road-type validation gate is required before approval" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RideRequest
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory serving the ride" }
      - { name: rider_name, type: string, source: input, description: "Rider display name" }
      - { name: sub_service_type, type: enum, source: input, description: "STANDARD | ASSISTED" }
      - { name: manual_only_reason, type: enum, source: input, required: false, description: "MOBILITY_ASSIST | CHILD_SEAT | NONE — set for ASSISTED requests" }
      - { name: status, type: enum, source: system, description: "REQUESTED | MATCHED | PICKED_UP | COMPLETED | CANCELLED_NO_SHOW | CANCELLED | FAILED" }
      - { name: vehicle_id, type: string, source: system, required: false, description: "FK -> Vehicle.id; matched vehicle; null until matched and after an un-match cycle" }
      - { name: pickup_location_id, type: string, source: input, required: false, description: "FK -> PickupLocation.id; chosen pickup curb; null until picked" }
      - { name: dropoff_location_id, type: string, source: input, required: false, description: "FK -> PickupLocation.id; chosen dropoff curb; null until set at pickup" }
      - { name: dispatch_attempts, type: integer, source: system, default: 0, description: "Count of remote-assistance escalation attempts recorded against the ride's current vehicle" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied dedupe key; unique per territory" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: PickupLocation
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory the curb location sits in" }
      - { name: curb_segment_code, type: string, source: input, description: "Stable curb segment identifier" }
      - { name: curb_access, type: enum, source: input, description: "SAFE | NO_STOPPING | LOADING_ONLY" }
      - { name: is_valid, type: boolean, source: system, default: true, description: "False once the curb is reclassified NO_STOPPING" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CurbRule
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; rule scope" }
      - { name: curb_access, type: enum, source: input, description: "SAFE | NO_STOPPING | LOADING_ONLY — curb access class this rule constrains" }
      - { name: sub_service_type, type: enum, source: input, description: "STANDARD | ASSISTED — service type this rule constrains" }
      - { name: allowed, type: boolean, source: input, description: "Whether pickup/dropoff selection may use this curb access class" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: AssistanceSession
    parent: RideRequest
    common_fields: true
    fields:
      - { name: ride_request_id, type: string, source: input, description: "FK -> RideRequest.id; ride the vehicle cannot resolve unaided" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; vehicle under assistance; copied from RideRequest.vehicle_id at creation" }
      - { name: reason, type: enum, source: input, description: "STUCK | ROAD_BLOCKED | SENSOR_FAULT | PASSENGER_ASSIST | OTHER" }
      - { name: status, type: enum, source: system, description: "ESCALATED | ACKNOWLEDGED | RESOLVED | UNRESOLVED" }
      - { name: escalation_tier, type: integer, source: system, default: 1, description: "1 while handled by a remote assistance operator; increments to 2 on the no-response timeout sweep" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Resolution attempts recorded against the session" }
      - { name: op_user_id, type: string, source: system, required: false, description: "Opaque operator id that acknowledged the session; null while ESCALATED" }
      - { name: last_ops_run_index, type: integer, source: system, description: "Depot.ops_run_index observed at last run-depot-ops sweep" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: IncidentReport
    parent: AssistanceSession
    common_fields: true
    fields:
      - { name: assistance_session_id, type: string, source: input, description: "FK -> AssistanceSession.id; session the incident arose from" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; vehicle involved; copied from the assistance session at filing" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE" }
      - { name: description, type: string, source: input, description: "Incident narrative" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | CLOSED | VOIDED" }
      - { name: crash_evidence_retained, type: boolean, source: computed, description: "= severity in {MODERATE, SEVERE}" }
      - { name: retention_expires_at, type: datetime, source: computed, description: "= created_at + retention_days(severity) per §1.3 incident_retention_expiry" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RoadsideCase
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory the disabled vehicle sits in" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; disabled vehicle the case was opened for" }
      - { name: assistance_session_id, type: string, source: input, required: false, description: "FK -> AssistanceSession.id; originating session when the case was escalated from one" }
      - { name: road_class, type: enum, source: input, description: "ARTERIAL | FREEWAY | RESIDENTIAL" }
      - { name: status, type: enum, source: system, description: "OPEN | TEAM_ASSIGNED | RESPONSE_DISPATCHED | CLEARED | CANCELLED" }
      - { name: team_id, type: string, source: system, required: false, description: "FK -> RoadsideTeam.id; selected response team; null until the selector runs" }
      - { name: dispatched_at, type: datetime, source: system, required: false, description: "Timestamp the case moved to RESPONSE_DISPATCHED; null before dispatch" }
      - { name: raise_count, type: integer, source: system, default: 0, description: "Count of dispatch attempts recorded against the case" }
      - { name: created_ops_run_index, type: integer, source: system, description: "Territory ops epoch at case creation; drives the response SLA" }

  - name: RoadsideTeam
    parent: ServiceTerritory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory the team is based in" }
      - { name: team_code, type: string, source: input, description: "Human-readable team code; stable ranking key" }
      - { name: road_class, type: enum, source: input, description: "ARTERIAL | FREEWAY | RESIDENTIAL — road class the team is equipped for" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_CASE | OFF_SHIFT; OFF_SHIFT teams are excluded from selection, ON_CASE teams remain candidates until the 2-case cap" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Parallel state dimensions on one entity: Vehicle ----
  - entity: Vehicle
    initial_state: DRAFT
    terminal_states: []
    state_dimensions:
      - dimension: status
        initial: DRAFT
      - dimension: service_status
        initial: UNAVAILABLE
    transitions:
      - from: DRAFT
        to: AT_DEPOT
        dimension: status
        trigger: POST /fleet/vehicles/{vehicleId}/stage
        actor: FleetOperations | DepotTechnician
        preconditions:
          - "vehicle.status in {DRAFT, IN_SERVICE}"
          - "body.depot_id names a DepotSite whose territory_id equals vehicle.territory_id (ERR_CROSS_TERRITORY otherwise)"
        side_effects:
          - "current_depot_id = body.depot_id"
          - "service_status recomputed per §1.3 vehicle_service_status"
          - "increments Vehicle.version by 1"
      - from: IN_SERVICE
        to: AT_DEPOT
        dimension: status
        trigger: POST /fleet/vehicles/{vehicleId}/stage
        actor: FleetOperations | DepotTechnician
        preconditions:
          - "vehicle.status in {DRAFT, IN_SERVICE}"
          - "body.depot_id names a DepotSite whose territory_id equals vehicle.territory_id (ERR_CROSS_TERRITORY otherwise)"
        side_effects:
          - "current_depot_id = body.depot_id"
          - "service_status recomputed per §1.3 vehicle_service_status"
          - "increments Vehicle.version by 1"
      - from: AT_DEPOT
        to: IN_SERVICE
        dimension: status
        trigger: POST /fleet/vehicles/{vehicleId}/return-to-service
        actor: FleetOperations
        preconditions:
          - "is_roadside_blocked == false (ERR_VEHICLE_ROADSIDE_BLOCKED)"
          - "service_status == AVAILABLE per §1.3 vehicle_service_status (ERR_VEHICLE_NOT_SERVICE_READY)"
        side_effects:
          - "current_depot_id = null"
          - "increments Vehicle.version by 1"
      - from: IN_SERVICE
        to: ROADSIDE
        dimension: status
        trigger: "system (automatic when a RoadsideCase referencing this vehicle moves to RESPONSE_DISPATCHED)"
        actor: system
        preconditions: []
        side_effects:
          - "is_roadside_blocked = true"
          - "service_status recomputed per §1.3 vehicle_service_status"
          - "increments Vehicle.version by 1"
      - from: ROADSIDE
        to: AT_DEPOT
        dimension: status
        trigger: "system (automatic when the referencing RoadsideCase moves to CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "is_roadside_blocked = false"
          - "service_status recomputed per §1.3 vehicle_service_status"
          - "increments Vehicle.version by 1"
      - from: AT_DEPOT
        to: SUSPENDED
        dimension: status
        trigger: POST /fleet/vehicles/{vehicleId}/suspend
        actor: SafetyReviewer
        preconditions:
          - "vehicle.status == AT_DEPOT"
          - "no DepotCycle in status IN_PROGRESS references this vehicle (ERR_VEHICLE_HAS_ACTIVE_CYCLE)"
        side_effects:
          - "service_status recomputed per §1.3 vehicle_service_status"
          - "increments Vehicle.version by 1"
      - from: SUSPENDED
        to: DRAFT
        dimension: status
        trigger: POST /fleet/vehicles/{vehicleId}/clear-suspension
        actor: SafetyReviewer
        preconditions:
          - "vehicle.status == SUSPENDED"
        side_effects:
          - "increments Vehicle.version by 1"
      # service_status dimension (recomputed, never directly triggered)
      - from: UNAVAILABLE
        to: AVAILABLE
        dimension: service_status
        trigger: "system (recompute per §1.3 vehicle_service_status after any depot cycle completion that satisfies all four readiness predicates)"
        actor: system
        preconditions:
          - "status == AT_DEPOT"
          - "is_roadside_blocked == false"
        side_effects: []
      - from: AVAILABLE
        to: UNAVAILABLE
        dimension: service_status
        trigger: "system (recompute per §1.3 vehicle_service_status when any readiness predicate fails)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: DISPATCHED
        dimension: service_status
        trigger: "system (recompute per §1.3 vehicle_service_status when status becomes IN_SERVICE or the vehicle is matched to a ride)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ON_TRIP
        dimension: service_status
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/pickup
        actor: FleetOperations
        preconditions:
          - "the ride's status == MATCHED"
          - "expected_vehicle_version == Vehicle.version (ERR_STALE_VERSION)"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: ON_TRIP
        to: AVAILABLE
        dimension: service_status
        trigger: "system (recompute per §1.3 vehicle_service_status when the ride is COMPLETED and the vehicle is AT_DEPOT and service-ready)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DepotSite
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONGESTED
        trigger: "system (automatic whenever occupancy_pct >= congestion_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 depot_posture"]
      - from: CONGESTED
        to: OPEN
        trigger: "system (automatic whenever occupancy_pct falls below congestion_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 depot_posture"]
      - from: CONGESTED
        to: LOCKDOWN
        trigger: "system (automatic whenever occupancy_pct == 100)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 depot_posture"]
      - from: LOCKDOWN
        to: CONGESTED
        trigger: "system (automatic whenever occupancy_pct falls below 100)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 depot_posture"]

  - entity: DepotCycle
    initial_state: STAGED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: STAGED
        to: IN_PROGRESS
        trigger: POST /fleet/depots/{depotId}/cycles/{cycleId}/start
        actor: DepotTechnician
        preconditions:
          - "cycle.is_scheduled == true (ERR_INVALID_STATE)"
          - "cycle.vehicle_id has no other DepotCycle in status IN_PROGRESS (ERR_VEHICLE_IN_CYCLE)"
          - "depot.posture != LOCKDOWN (ERR_POSTURE_LOCKDOWN)"
        side_effects:
          - "the cycle's reserved BaySlot moves to ACTIVE"
          - "depot posture recomputed per §1.3 depot_posture"
          - "increments DepotCycle.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /fleet/depots/{depotId}/cycles/{cycleId}/complete
        actor: DepotTechnician
        preconditions:
          - "body.cleanliness_score supplied when service_kind == CLEAN (ERR_INVALID_REQUEST otherwise)"
          - "body.signed_off == true when service_kind == CALIBRATION (ERR_CALIBRATION_SIGNOFF_REQUIRED otherwise)"
        side_effects:
          - "service_kind CHARGE: vehicle.battery_pct = 100"
          - "service_kind CLEAN: vehicle.cleanliness_score = body.cleanliness_score"
          - "service_kind CALIBRATION: vehicle.calib_valid = body.signed_off"
          - "service_kind SOFTWARE: vehicle.software_version = vehicle.target_software_version"
          - "the cycle's BaySlot moves to COMPLETED and its window is released"
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
          - "depot posture recomputed per §1.3 depot_posture"
          - "increments DepotCycle.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: POST /fleet/depots/{depotId}/cycles/{cycleId}/abort
        actor: DepotTechnician
        preconditions:
          - "cycle.status == IN_PROGRESS"
        side_effects:
          - "the cycle's BaySlot moves to RELEASED"
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
          - "depot posture recomputed per §1.3 depot_posture"
          - "increments DepotCycle.version by 1"

  - entity: DeploymentWave
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/activate
        actor: TerritoryPlanner
        preconditions:
          - "territory.posture == ACTIVE (ERR_TERRITORY_NOT_ACTIVE)"
          - "territory.active_zone_count == 0 (ERR_ZONE_BLOCKED_WAVE)"
          - "weather_tier for the wave's window_code is below 3 (ERR_WEATHER_SUSPENDED)"
        side_effects:
          - "increments DeploymentWave.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/dispatch
        actor: TerritoryPlanner
        preconditions:
          - "wave.status == ACTIVE"
        side_effects:
          - "selects vehicles via §1.3 wave_vehicle_selection"
          - "each selected vehicle's status moves to IN_SERVICE (updates Vehicle.version; service_status recomputed)"
          - "wave.deployed_vehicle_count = number of vehicles moved"
          - "increments DeploymentWave.version by 1"
      - from: PLANNED
        to: ABORTED
        trigger: POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/abort
        actor: TerritoryPlanner
        preconditions:
          - "wave.status in {PLANNED, ACTIVE}"
        side_effects:
          - "increments DeploymentWave.version by 1"
      - from: ACTIVE
        to: ABORTED
        trigger: POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/abort
        actor: TerritoryPlanner
        preconditions:
          - "wave.status in {PLANNED, ACTIVE}"
        side_effects:
          - "increments DeploymentWave.version by 1"

  - entity: RideRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED_NO_SHOW, CANCELLED, FAILED]
    transitions:
      - from: REQUESTED
        to: MATCHED
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/match
        actor: FleetOperations
        preconditions:
          - "territory.posture == ACTIVE (ERR_TERRITORY_NOT_ACTIVE)"
          - "the referenced PickupLocation.is_valid == true (ERR_LOCATION_INVALID)"
          - "pickup curb check per §1.4 priority 10 (ERR_CURB_ACCESS_DENIED)"
          - "the selector finds a candidate vehicle per §1.3 vehicle_selector (ERR_NO_VEHICLE_AVAILABLE)"
          - "expected_vehicle_version == Vehicle.version (ERR_STALE_VERSION)"
        side_effects:
          - "ride.vehicle_id = selected vehicle.id"
          - "selected vehicle.service_status moves to DISPATCHED"
          - "territory.total_credit_cents credited per §1.3 territory_total_credit"
          - "increments Vehicle.version by 1"
      - from: MATCHED
        to: PICKED_UP
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/pickup
        actor: FleetOperations
        preconditions:
          - "ride.status == MATCHED"
          - "the dropoff rule check per §1.4 priority 10 (ERR_CURB_ACCESS_DENIED)"
          - "expected_vehicle_version == Vehicle.version (ERR_STALE_VERSION)"
        side_effects:
          - "ride.dropoff_location_id = body.dropoff_location_id"
          - "vehicle.service_status moves to ON_TRIP"
          - "increments Vehicle.version by 1"
      - from: PICKED_UP
        to: COMPLETED
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/complete
        actor: FleetOperations
        preconditions:
          - "vehicle.is_roadside_blocked == false (ERR_VEHICLE_ROADSIDE_BLOCKED)"
        side_effects:
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
      - from: REQUESTED
        to: CANCELLED_NO_SHOW
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/cancel-no-show
        actor: FleetOperations
        preconditions:
          - "ride.status == REQUESTED"
        side_effects:
          - "service_status recomputed per §1.3 vehicle_service_status"
      - from: MATCHED
        to: MATCHED
        trigger: "system (automatic on the 3rd dispatch attempt recorded via POST .../{rideId}/assistance-sessions)"
        actor: system
        preconditions:
          - "ride.status == MATCHED"
          - "ride.dispatch_attempts >= 3 after this attempt is recorded"
        side_effects:
          - "ride.dispatch_attempts increments by 1"
          - "the matched vehicle's credit_cents is decremented by body.credit_cents, bounded below at 0 — §1.3 territory_total_credit"
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
          - "ride.vehicle_id = null"
          - "ride.status returns to REQUESTED (cyclic re-dispatch)"
        note: "Cyclic re-dispatch: a ride whose matched vehicle has failed 3 dispatch attempts is un-matched and re-queued."
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/cancel
        actor: FleetOperations
        preconditions:
          - "ride.status == REQUESTED (ERR_INVALID_STATE otherwise)"
        side_effects: []
      - from: MATCHED
        to: CANCELLED
        trigger: POST /fleet/territories/{territoryId}/ride-requests/{rideId}/cancel
        actor: FleetOperations
        preconditions:
          - "ride.status == MATCHED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
          - "the matched vehicle's credit_cents is decremented by body.credit_cents, bounded below at 0"
      - from: MATCHED
        to: FAILED
        trigger: "system (automatic when the ride's AssistanceSession is moved to UNRESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
          - "a film_incident call against this ride now fails with ERR_SESSION_TERMINAL, so territory.total_severe_incidents cannot grow"

  - entity: AssistanceSession
    initial_state: ESCALATED
    terminal_states: [RESOLVED, UNRESOLVED]
    transitions:
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: POST /fleet/assistance-sessions/{sessionId}/acknowledge
        actor: RemoteAssistanceOperator
        preconditions:
          - "session.status == ESCALATED (ERR_INVALID_STATE)"
        side_effects:
          - "session.op_user_id = X-User-ID of the acknowledging operator"
          - "increments AssistanceSession.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "system (automatic during run-depot-ops when the session has been ACKNOWLEDGED for 3 depot ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "session.escalation_tier increments by 1"
          - "session.attempt_count increments by 1"
          - "session.last_ops_run_index = depot.ops_run_index"
          - "increments AssistanceSession.version by 1"
        note: "Bounded escalation cycle: the tier rises on every timeout sweep."
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: POST /fleet/assistance-sessions/{sessionId}/resolve
        actor: RemoteAssistanceOperator
        preconditions:
          - "session.status == ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "increments AssistanceSession.version by 1"
      - from: ACKNOWLEDGED
        to: UNRESOLVED
        trigger: POST /fleet/assistance-sessions/{sessionId}/escalate-unresolved
        actor: RemoteAssistanceOperator
        preconditions:
          - "session.status == ACKNOWLEDGED (ERR_INVALID_STATE)"
          - "session.attempt_count >= 3 (ERR_MAX_ATTEMPTS_NOT_REACHED)"
        side_effects:
          - "the referencing RideRequest.status moves to FAILED, which recomputes the matched vehicle's service_status — see RideRequest MATCHED_to_FAILED"
          - "increments AssistanceSession.version by 1"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /fleet/incident-reports/{incidentId}/begin-review
        actor: SafetyReviewer
        preconditions:
          - "report.status == FILED"
        side_effects:
          - "recomputes territory.total_severe_incidents per §1.3 territory_total_severe_incidents"
          - "increments IncidentReport.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: POST /fleet/incident-reports/{incidentId}/close
        actor: SafetyReviewer
        preconditions:
          - "report.status == UNDER_REVIEW"
        side_effects:
          - "increments IncidentReport.version by 1"
      - from: FILED
        to: VOIDED
        trigger: POST /fleet/incident-reports/{incidentId}/void
        actor: SafetyReviewer
        preconditions:
          - "report.status == FILED"
        side_effects:
          - "recomputes territory.total_severe_incidents per §1.3 territory_total_severe_incidents, removing this report from the count"
          - "increments IncidentReport.version by 1"

  - entity: RoadsideCase
    initial_state: OPEN
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: OPEN
        to: TEAM_ASSIGNED
        trigger: POST /fleet/vehicles/{vehicleId}/roadside-cases
        actor: FleetOperations | RemoteAssistanceOperator
        preconditions:
          - "the selector finds a candidate RoadsideTeam per §1.3 roadside_response_sla (ERR_NO_TEAM_AVAILABLE)"
          - "the selected team has fewer than 2 cases in RESPONSE_DISPATCHED (ERR_TEAM_CAPACITY_EXCEEDED)"
          - "the case is within the response SLA window (ERR_RESPONSE_SLA_BREACHED)"
        side_effects:
          - "case.team_id = selected team.id"
          - "the selected team's status moves to ON_CASE"
      - from: TEAM_ASSIGNED
        to: RESPONSE_DISPATCHED
        trigger: POST /fleet/roadside-cases/{caseId}/dispatch
        actor: FleetOperations
        preconditions:
          - "case.status == TEAM_ASSIGNED"
        side_effects:
          - "case.dispatched_at = logical clock"
          - "case.raise_count increments by 1"
          - "the referencing Vehicle's status moves to ROADSIDE and is_roadside_blocked = true (cascade; updates Vehicle.version)"
      - from: RESPONSE_DISPATCHED
        to: CLEARED
        trigger: POST /fleet/roadside-cases/{caseId}/clear
        actor: FleetOperations
        preconditions:
          - "case.status == RESPONSE_DISPATCHED"
        side_effects:
          - "the referencing Vehicle's status moves to AT_DEPOT and is_roadside_blocked = false (cascade; updates Vehicle.version)"
          - "the selected team's status returns to AVAILABLE when it has no other RESPONSE_DISPATCHED case"
      - from: TEAM_ASSIGNED
        to: CANCELLED
        trigger: POST /fleet/roadside-cases/{caseId}/cancel
        actor: FleetOperations
        preconditions:
          - "case.status in {OPEN, TEAM_ASSIGNED}"
        side_effects:
          - "the selected team's status returns to AVAILABLE when it has no other RESPONSE_DISPATCHED case"

  - entity: ServiceTerritory
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: MAPPING
        trigger: POST /fleet/territories/{territoryId}/mapping-ticks
        actor: MappingEngineer
        preconditions:
          - "territory.posture == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "territory.mapped_pct = min(100, mapped_pct + body.mapped_pct_delta)"
          - "posture recomputed per §1.3 territory_posture"
          - "increments ServiceTerritory.version by 1"
      - from: MAPPING
        to: VALIDATING
        trigger: "system (automatic whenever mapped_pct >= 95)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]
      - from: MAPPING
        to: VALIDATING
        trigger: POST /fleet/territories/{territoryId}/validation-runs
        actor: MappingEngineer | SafetyReviewer
        preconditions:
          - "territory.posture in {MAPPING, VALIDATING} (ERR_INVALID_STATE)"
        side_effects:
          - "territory.validation_hours = validation_hours + body.hours"
          - "posture recomputed per §1.3 territory_posture"
          - "increments ServiceTerritory.version by 1"
      - from: VALIDATING
        to: VALIDATING
        trigger: POST /fleet/territories/{territoryId}/validation-runs
        actor: MappingEngineer | SafetyReviewer
        preconditions:
          - "territory.posture in {MAPPING, VALIDATING} (ERR_INVALID_STATE)"
        side_effects:
          - "territory.validation_hours = validation_hours + body.hours"
          - "posture recomputed per §1.3 territory_posture"
          - "increments ServiceTerritory.version by 1"
        note: "Self-loop: accumulating validation hours while the territory stays VALIDATING."
      - from: VALIDATING
        to: ACTIVE
        trigger: "system (automatic whenever validation_hours >= 100 and mapped_pct >= 95)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (automatic whenever active_zone_count >= 3)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system (automatic whenever active_zone_count >= 5)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system (automatic whenever active_zone_count falls back below 5)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system (automatic whenever active_zone_count falls back below 3)"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed per §1.3 territory_posture"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: match-ride-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/match"
    occ_field: "expected_vehicle_version"
    description: |
      Matching a RideRequest to a Vehicle whose Vehicle.version has advanced since
      the client last observed it is rejected. This captures the case where a depot
      cycle completion or a roadside dispatch has just advanced the vehicle's
      version, so the client's view of the vehicle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: request-expansion-stale-territory
    parent_entity: ServiceTerritory
    write_endpoint: "POST /fleet/territories/{territoryId}/expansion-requests"
    occ_field: "expected_territory_version"
    description: |
      Submitting a ServiceAreaExpansionRequest against a ServiceTerritory whose
      ServiceTerritory.version has advanced since the client last observed it is
      rejected. This captures the case where mapping ticks or exclusion-zone
      activation have just advanced the territory's version, so the precondition
      snapshot the client is expanding against is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vehicle_service_status
    trigger: "any change to battery_pct, cleanliness_score, calib_valid, software_version, is_roadside_blocked, current_depot_id or status"
    algorithm: threshold
    formula: |
      service_ready = (battery_pct >= 80)
                      AND (cleanliness_score >= 70)
                      AND (calib_valid == true)
                      AND (software_version == target_software_version)
      if is_roadside_blocked == true:  service_status = DISPATCHED
      elif status == IN_SERVICE:       service_status = DISPATCHED
      elif status == AT_DEPOT:
        if service_ready:             service_status = AVAILABLE
        else:                         service_status = UNAVAILABLE
      else:                           service_status = UNAVAILABLE
    input_set: "evaluated on the mutated Vehicle row only; the four readiness predicates read the row's current values"
    constants:
      MIN_BATTERY_PCT: 80
      MIN_CLEANLINESS_SCORE: 70
    precision: "integer thresholds; both predicate comparisons are inclusive (>=)"
    variants:
      - name: depot_marginal_ready
        when: "a readiness predicate sits exactly at its boundary (battery_pct == 80 or cleanliness_score == 70)"
        difference: "uses >=, so a vehicle exactly at the boundary is AVAILABLE; a strict > reading would mark it UNAVAILABLE and block its return to service"

  - name: depot_posture
    trigger: "any BaySlot create / activate / complete / release, any DepotCycle start / complete / abort"
    algorithm: aggregation
    formula: |
      reference = logical clock
      occupied = count of DISTINCT (service_type, bay_index) pairs among BaySlot rows
                 where depot_id == this depot AND status in {RESERVED, ACTIVE}
                 AND start_utc <= reference < end_utc
      total    = charge_positions + cleaning_positions + calib_positions + software_positions
      occupancy_pct = min(100, floor(100 * occupied / total))
      if occupancy_pct == 100:                          posture = LOCKDOWN
      elif occupancy_pct >= congestion_threshold_pct:   posture = CONGESTED
      else:                                             posture = OPEN
    input_set: "BaySlot rows for this depot in RESERVED or ACTIVE whose half-open window [start_utc, end_utc) contains the logical clock; COMPLETED, RELEASED and not-yet-started future windows excluded"
    constants:
      congestion_threshold_pct: 80
    precision: "occupancy percentage floored to an integer before every boundary comparison"
    variants:
      - name: depot_posture_reservation_counted
        when: "a BaySlot is RESERVED and its window already contains the logical clock, but its cycle has not started"
        difference: "the slot already counts toward occupied, so a depot can read CONGESTED purely from reservations; an active-only reading stays OPEN"

  - name: territory_posture
    trigger: "any ExclusionZone activation or expiry, any mapping tick, any validation run, any incident review"
    algorithm: constraint_propagation
    formula: |
      active_zone_count = count(ExclusionZone where territory_id == this AND status == ACTIVE)
      if active_zone_count >= 5:                          posture = SUSPENDED
      elif active_zone_count >= 3:                        posture = RESTRICTED
      elif mapped_pct >= 95 AND validation_hours >= 100:  posture = ACTIVE
      elif mapped_pct >= 95 AND validation_hours < 100:   posture = VALIDATING
      elif mapped_pct > 0:                                posture = MAPPING
      else:                                               posture = PENDING
    input_set: "ExclusionZone rows for this territory in status ACTIVE only; SCHEDULED and EXPIRED excluded"
    constants:
      RESTRICTED_ZONE_COUNT: 3
      SUSPENDED_ZONE_COUNT: 5
      MAPPED_PCT_GATE: 95
      VALIDATION_HOURS_GATE: 100
    precision: "integer comparisons, inclusive (>=) at every gate"
    variants:
      - name: territory_zone_override
        when: "active_zone_count >= 3 while mapped_pct is still below 95"
        difference: "zone gates are evaluated first, so a barely-mapped territory reads RESTRICTED; the mapping-first reading would report MAPPING"

  - name: wave_vehicle_selection
    trigger: "POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/dispatch"
    algorithm: waterfall_allocation
    formula: |
      wave_budget   = wave.planned_vehicle_count
      reserve_floor = ceil(6 / wave.planned_vehicle_count)     # staged reserve kept staged
      candidates = Vehicle where territory_id == wave.territory_id
                   AND status == AT_DEPOT
                   AND is_roadside_blocked == false
                   AND service_status == AVAILABLE
      available = count(candidates)
      cap = max(0, min(wave_budget, available - reserve_floor))
      sort candidates by (battery_pct DESC, created_at ASC)
      take the first cap
    input_set: "candidates exclude vehicles whose status is DRAFT, IN_SERVICE, ROADSIDE or SUSPENDED, and vehicles whose service_status is not AVAILABLE"
    constants:
      RESERVE_TARGET: 6
      BATTERY_SORT_DIRECTION: DESC
    precision: "reserve_floor is rounded once per wave with round-half-up ceil BEFORE the subtraction; summing candidate counts across waves and rounding once reproduces this value only when every wave has the same planned_vehicle_count"
    variants:
      - name: wave_reserve_floor
        when: "wave.planned_vehicle_count divides unevenly into RESERVE_TARGET, so reserve_floor rounds up"
        difference: "the ceil rounds up per wave, so a wave with planned_vehicle_count == 4 keeps reserve_floor == 2 and deploys one fewer vehicle than available - 1; a floor reading would deploy two"

  - name: vehicle_selector
    trigger: "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/match"
    algorithm: selector_policy
    formula: |
      candidates = Vehicle where territory_id == ride.territory_id
                   AND status == IN_SERVICE
                   AND is_roadside_blocked == false
      if candidates is empty: reject ERR_NO_VEHICLE_AVAILABLE
      sort candidates by (battery_pct DESC, created_at ASC)
      select candidates[0]
    input_set: "eligibility filter: territory_id match, status == IN_SERVICE, is_roadside_blocked == false; tie-break is created_at ascending, never the id"
    constants:
      BATTERY_SORT_DIRECTION: DESC
    precision: "integer battery comparison; ties resolved by created_at ascending"
    variants:
      - name: selector_staged_fallback
        when: "no candidate has status IN_SERVICE"
        difference: "the pool is empty and the match is rejected with ERR_NO_VEHICLE_AVAILABLE — there is no depot-staged fallback, because a staged vehicle still fails its readiness predicates"

  - name: territory_total_credit
    trigger: "any ride match, ride cancel, or re-dispatch cycle on a ride in this territory"
    algorithm: threshold
    formula: |
      effective_demand = max(0, DemandSignal.projected_rides - DemandSignal.manual_only_rides)
      provision = 10 * effective_demand
      if territory.posture == RESTRICTED: provision = 5 * effective_demand
      denominator     = provision + 500
      credit_per_ride    = floor(5000000 / denominator)
      total_credit_cents = floor(5000000 * provision / denominator)
    input_set: "the territory's DemandSignal row for the ride's window_code; provision uses the territory posture at match time"
    constants:
      fixed_denominator: 500
      OPEN_MULTIPLIER: 10
      RESTRICTED_MULTIPLIER: 5
      CREDIT_NUMERATOR: 5000000
    precision: "integer cent math; each division is floored independently before any multiplication"
    variants:
      - name: credit_restricted_territory
        when: "territory.posture == RESTRICTED at match time"
        difference: "provision halves from 10*effective_demand to 5*effective_demand, which changes both credit_per_ride and total_credit_cents for identical demand input; the OPEN reading would report a different pair of values"

  - name: depot_cycle_sla_expiry
    trigger: "run-depot-ops"
    algorithm: threshold
    formula: |
      For each DepotCycle in {STAGED, IN_PROGRESS}:
        if (depot.ops_run_index - cycle.last_ops_run_index) >= 2:
          the cycle's Vehicle status returns to DRAFT
          cycle → ABORTED and its BaySlot → RELEASED
    input_set: "DepotCycle rows in status STAGED or IN_PROGRESS only"
    constants:
      SLA_OPS_RUNS: 2
    precision: "integer run-index difference, inclusive (>=) at the boundary"

  - name: roadside_response_sla
    trigger: "roadside team selection on POST /fleet/vehicles/{vehicleId}/roadside-cases and run-depot-ops"
    algorithm: threshold
    formula: |
      select_candidates = RoadsideTeam where territory_id == case.territory_id AND status in {AVAILABLE, ON_CASE}
      if case.road_class == FREEWAY: select_candidates = select_candidates where road_class in {FREEWAY, ARTERIAL}
      else:                         select_candidates = select_candidates where road_class == case.road_class
      if select_candidates is empty: reject ERR_NO_TEAM_AVAILABLE
      selected = select_candidates sorted by (team_code ASC), take first
      dispatched = count(RoadsideCase where team_id == selected.id AND status == RESPONSE_DISPATCHED)
      if dispatched >= 2: reject ERR_TEAM_CAPACITY_EXCEEDED
      if (territory_ops_run_index - case.created_ops_run_index) >= 4 AND case.status == OPEN:
        reject ERR_RESPONSE_SLA_BREACHED
    input_set: "RoadsideTeam rows in status AVAILABLE or ON_CASE (OFF_SHIFT excluded); RoadsideCase rows assigned to the team in status RESPONSE_DISPATCHED"
    constants:
      MAX_DISPATCHED_PER_TEAM: 2
      SLA_OPS_RUNS: 4
    precision: "integer counts, inclusive (>=) at both boundaries; team_code is the only ranking key so ranking ties cannot occur"
    variants:
      - name: freetown_arterial_widening
        when: "case.road_class == FREEWAY"
        difference: "the eligible pool widens to include ARTERIAL teams, so selection can succeed when no FREEWAY team is AVAILABLE; the strict-equality reading would reject with ERR_NO_TEAM_AVAILABLE"

  - name: incident_retention_expiry
    trigger: "POST /fleet/ride-requests/{rideId}/film-incident"
    algorithm: derived
    formula: |
      crash_evidence_retained = (severity in {MODERATE, SEVERE})
      retention_days = 365 if crash_evidence_retained else 180
      retention_expires_at = created_at + retention_days * 86400 seconds
    input_set: "the IncidentReport row's own severity and created_at"
    constants:
      CRASH_RETENTION_DAYS: 365
      STANDARD_RETENTION_DAYS: 180
    precision: "calendar-day offset from created_at expressed as exact seconds"
    variants:
      - name: minor_report_short_retention
        when: "severity == MINOR"
        difference: "retention drops from 365 to 180 days and crash_evidence_retained is false, so the retention_expires_at literal halves"

  - name: territory_total_severe_incidents
    trigger: "POST /fleet/ride-requests/{rideId}/film-incident and any IncidentReport void"
    algorithm: aggregation
    formula: |
      reports = IncidentReport where vehicle_id == ride.vehicle_id
                AND severity == SEVERE AND status != VOIDED
      territory.total_severe_incidents = count(reports)
      reachability: a report can only be created while an AssistanceSession for the ride is in
      {ESCALATED, ACKNOWLEDGED}; once a session is UNRESOLVED the ride is FAILED and no new
      session (hence no report) is accepted.
    input_set: "IncidentReport rows with severity SEVERE and status in {FILED, UNDER_REVIEW, CLOSED}; VOIDED excluded"
    constants:
      SEVERE_RETAINED_DAYS: 365
    precision: "integer count"
    variants:
      - name: severe_incident_unresolved_ride
        when: "the ride's AssistanceSession was driven to UNRESOLVED before the film-incident attempt"
        difference: "the film-incident call is rejected with ERR_SESSION_TERMINAL so no report is created and the count is unchanged; a reading that ignores the session precondition would increment it by 1"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed; the role value must be a declared §1.7 role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Calling role permitted for the operation per §1.5 roles; a peer role's exclusive operation is denied"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right: territory, then depot, then the nested resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all path-scoped endpoints
  - priority: 4
    category: business_constraint
    check: "Unique key collision — (territory_id, vin) on Vehicle, and (territory_id, idempotency_key) on RideRequest"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /fleet/territories/{territoryId}/vehicles, POST /fleet/territories/{territoryId}/ride-requests"
  - priority: 5
    category: business_safety
    check: "Route class must be allowed by an APPROVED ServiceAreaRule for the vehicle's territory"
    error_id: ERR_ROUTE_NOT_ALLOWED
    http_status: 422
    applies_to: "ride matching and wave dispatch"
  - priority: 6
    category: business_safety
    check: "An ACTIVE ExclusionZone whose window contains the reference time must not cover the requested route class"
    error_id: ERR_EXCLUSION_ZONE_ACTIVE
    http_status: 422
    applies_to: "ride matching, wave activation and dispatch"
  - priority: 7
    category: business_safety
    check: "For MORNING_PEAK and EVENING_PEAK windows the weather tier must be below 3"
    error_id: ERR_WEATHER_SUSPENDED
    http_status: 422
    applies_to: "POST .../deployment-waves/{waveId}/activate"
  - priority: 8
    category: business_temporal
    check: "Vehicle must not already have a DepotCycle in {STAGED, IN_PROGRESS}"
    error_id: ERR_VEHICLE_IN_CYCLE
    http_status: 409
    applies_to: "POST /fleet/depots/{depotId}/cycles/start"
  - priority: 9
    category: business_constraint
    check: "BaySlot occupancy: the requested half-open window [start_utc, end_utc) must not intersect an existing RESERVED/ACTIVE slot on the same (depot_id, service_type, bay_index)"
    error_id: ERR_BAY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /fleet/depots/{depotId}/bay-slots"
  - priority: 10
    category: business_safety
    check: "Pickup/dropoff curb access must be allowed for the ride's sub_service_type by an ACTIVE CurbRule, and the location must be valid"
    error_id: "ERR_CURB_ACCESS_DENIED / ERR_LOCATION_INVALID"
    http_status: 422
    applies_to: "ride match, ride pickup"
  - priority: 11
    category: business_constraint
    check: "Requested state transition valid for the resource's current state (guarded by §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 12
    category: business_fiscal
    check: "Pool exhaustion — no candidate vehicle (ERR_NO_VEHICLE_AVAILABLE), depot bay pool full (ERR_CAPACITY_EXCEEDED), no candidate RoadsideTeam (ERR_NO_TEAM_AVAILABLE)"
    error_id: ERR_NO_VEHICLE_AVAILABLE
    http_status: 409
    applies_to: "ride match, bay-slot creation, roadside case dispatch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Envelope + logical clock ----
  - method: GET
    path: "/fleet/health"
    description: "Liveness probe returning a fixed object envelope"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: []
    output: "{ status: string, service: string }"
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the clock reads that fixed default and never falls back to real wall-clock time."
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock := body.current_utc"]

  # ---- ServiceTerritory ----
  - method: POST
    path: "/fleet/territories"
    description: "Create a ServiceTerritory"
    roles: [TerritoryPlanner]
    code: 201
    input: ["name", "region_code", "mapped_pct?", "validation_hours?", "road_type_risk?"]
    output: ServiceTerritory
    side_effects: ["posture derived per §1.3 territory_posture; active_zone_count=0; total_credit_cents=0; total_severe_incidents=0"]
  - method: GET
    path: "/fleet/territories"
    description: "List ServiceTerritories with optional posture filter"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["posture?", "region_code?", "limit?", "offset?"]
    output: ServiceTerritory[]
    side_effects: []
  - method: GET
    path: "/fleet/territories/{territoryId}"
    description: "Get a ServiceTerritory"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: []
    output: ServiceTerritory
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/mapping-ticks"
    description: "Record an HD-mapping progress tick; drives PENDING to MAPPING and MAPPING to VALIDATING"
    roles: [MappingEngineer]
    code: 200
    input: ["mapped_pct_delta"]
    output: ServiceTerritory
    side_effects:
      - "mapped_pct = min(100, mapped_pct + mapped_pct_delta)"
      - "posture recomputed per §1.3 territory_posture"
      - "increments ServiceTerritory.version by 1"
  - method: POST
    path: "/fleet/territories/{territoryId}/validation-runs"
    description: "Log supervised validation drive hours; drives VALIDATING to ACTIVE"
    roles: [MappingEngineer, SafetyReviewer]
    code: 200
    input: ["hours"]
    output: ServiceTerritory
    side_effects:
      - "validation_hours = validation_hours + hours"
      - "posture recomputed per §1.3 territory_posture"
      - "increments ServiceTerritory.version by 1"

  # ---- DepotSite ----
  - method: POST
    path: "/fleet/territories/{territoryId}/depots"
    description: "Create a DepotSite"
    roles: [TerritoryPlanner]
    code: 201
    input: ["name", "charge_positions", "cleaning_positions", "calib_positions", "software_positions"]
    output: DepotSite
    side_effects: ["posture=OPEN, occupancy_pct=0, ops_run_index=0"]
  - method: GET
    path: "/fleet/territories/{territoryId}/depots"
    description: "List DepotSites for a territory"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: DepotSite[]
    side_effects: []
  - method: GET
    path: "/fleet/depots/{depotId}"
    description: "Get a DepotSite"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: []
    output: DepotSite
    side_effects: []
  - method: GET
    path: "/fleet/depots/{depotId}/vehicles"
    description: "List Vehicles currently staged at a depot"
    roles: [FleetOperations, DepotTechnician, TerritoryPlanner, SafetyReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []
  - method: POST
    path: "/fleet/depots/{depotId}/run-depot-ops"
    description: "Run the depot operations checkpoint: advances the ops epoch and sweeps SLA expiries"
    roles: [DepotTechnician]
    code: 200
    input: []
    output: DepotSite
    side_effects:
      - "ops_run_index increments by 1"
      - "DepotCycle SLA expiry per §1.3 depot_cycle_sla_expiry"
      - "AssistanceSession timeout sweep: a session ACKNOWLEDGED for 3 depot ops runs returns to ESCALATED with escalation_tier +1 and attempt_count +1"
      - "Vehicle AT_DEPOT not yet re-deployed refresh delay_ops_runs"
      - "posture recomputed per §1.3 depot_posture"

  # ---- BaySlot ----
  - method: POST
    path: "/fleet/depots/{depotId}/bay-slots"
    description: "Reserve a BaySlot for a service type and half-open window"
    roles: [DepotTechnician]
    code: 201
    input: ["service_type", "bay_index", "start_utc", "duration_seconds", "vehicle_id", "cycle_id"]
    output: BaySlot
    side_effects:
      - "status=RESERVED; end_utc = start_utc + duration_seconds"
      - "posture recomputed per §1.3 depot_posture"
  - method: GET
    path: "/fleet/depots/{depotId}/bay-slots"
    description: "List BaySlots for a depot, optionally filtered by service type, vehicle or cycle"
    roles: [FleetOperations, DepotTechnician]
    code: 200
    input: ["service_type?", "vehicle_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: BaySlot[]
    side_effects: []
  - method: GET
    path: "/fleet/bay-slots/{baySlotId}"
    description: "Get a BaySlot"
    roles: [FleetOperations, DepotTechnician]
    code: 200
    input: []
    output: BaySlot
    side_effects: []
  - method: POST
    path: "/fleet/depots/{depotId}/bay-slots/{baySlotId}/release"
    description: "Release a reserved BaySlot (RESERVED to RELEASED)"
    roles: [DepotTechnician]
    code: 200
    input: []
    output: BaySlot
    side_effects:
      - "status=RELEASED"
      - "posture recomputed per §1.3 depot_posture"

  # ---- Vehicle ----
  - method: POST
    path: "/fleet/territories/{territoryId}/vehicles"
    description: "Register a Vehicle"
    roles: [FleetOperations]
    code: 201
    input: ["vin", "battery_pct", "cleanliness_score?", "calib_valid?", "software_version", "target_software_version"]
    output: Vehicle
    side_effects: ["status=DRAFT, service_status=UNAVAILABLE, credit_cents=0, is_roadside_blocked=false, current_depot_id=null, delay_ops_runs=0"]
  - method: GET
    path: "/fleet/territories/{territoryId}/vehicles"
    description: "List Vehicles for a territory, optionally filtered by status, service status or depot"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer]
    code: 200
    input: ["status?", "service_status?", "current_depot_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []
  - method: GET
    path: "/fleet/vehicles/{vehicleId}"
    description: "Get a Vehicle"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/fleet/vehicles/{vehicleId}/stage"
    description: "Stage a Vehicle at a depot (DRAFT or IN_SERVICE to AT_DEPOT)"
    roles: [FleetOperations, DepotTechnician]
    code: 200
    input: ["depot_id"]
    output: Vehicle
    side_effects:
      - "status=AT_DEPOT; current_depot_id=depot_id"
      - "service_status recomputed per §1.3 vehicle_service_status"
      - "increments Vehicle.version by 1"
  - method: POST
    path: "/fleet/vehicles/{vehicleId}/return-to-service"
    description: "Return a service-ready Vehicle to service (AT_DEPOT to IN_SERVICE)"
    roles: [FleetOperations]
    code: 200
    input: []
    output: Vehicle
    side_effects:
      - "status=IN_SERVICE; current_depot_id=null"
      - "service_status recomputed per §1.3 vehicle_service_status"
      - "increments Vehicle.version by 1"
  - method: POST
    path: "/fleet/vehicles/{vehicleId}/suspend"
    description: "Suspend a staged Vehicle (AT_DEPOT to SUSPENDED)"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status=SUSPENDED", "service_status recomputed per §1.3 vehicle_service_status", "increments Vehicle.version by 1"]
  - method: POST
    path: "/fleet/vehicles/{vehicleId}/clear-suspension"
    description: "Clear a suspension (SUSPENDED to DRAFT)"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status=DRAFT", "increments Vehicle.version by 1"]
  - method: GET
    path: "/fleet/vehicles/{vehicleId}/assistance-sessions"
    description: "List AssistanceSessions opened for a vehicle"
    roles: [FleetOperations, RemoteAssistanceOperator, SafetyReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AssistanceSession[]
    side_effects: []

  # ---- DepotCycle ----
  - method: POST
    path: "/fleet/depots/{depotId}/cycles"
    description: "Create an unscheduled DepotCycle for a vehicle and service kind"
    roles: [DepotTechnician]
    code: 201
    input: ["vehicle_id", "service_kind"]
    output: DepotCycle
    side_effects: ["status=STAGED, is_scheduled=false, last_ops_run_index=depot.ops_run_index"]
  - method: GET
    path: "/fleet/depots/{depotId}/cycles"
    description: "List DepotCycles for a depot, optionally filtered by vehicle or status"
    roles: [FleetOperations, DepotTechnician]
    code: 200
    input: ["vehicle_id?", "status?", "limit?", "offset?"]
    output: DepotCycle[]
    side_effects: []
  - method: GET
    path: "/fleet/cycles/{cycleId}"
    description: "Get a DepotCycle"
    roles: [FleetOperations, DepotTechnician]
    code: 200
    input: []
    output: DepotCycle
    side_effects: []
  - method: POST
    path: "/fleet/depots/{depotId}/cycles/{cycleId}/schedule"
    description: "Attach a reserved BaySlot to a cycle, setting is_scheduled"
    roles: [DepotTechnician]
    code: 200
    input: ["bay_slot_id"]
    output: DepotCycle
    side_effects: ["is_scheduled=true", "increments DepotCycle.version by 1"]
  - method: POST
    path: "/fleet/depots/{depotId}/cycles/{cycleId}/start"
    description: "Start a scheduled cycle (STAGED to IN_PROGRESS)"
    roles: [DepotTechnician]
    code: 200
    input: []
    output: DepotCycle
    side_effects:
      - "status=IN_PROGRESS"
      - "the cycle's BaySlot moves to ACTIVE"
      - "posture recomputed per §1.3 depot_posture"
      - "increments DepotCycle.version by 1"
  - method: POST
    path: "/fleet/depots/{depotId}/cycles/{cycleId}/complete"
    description: "Complete a cycle, applying its service effect to the vehicle"
    roles: [DepotTechnician]
    code: 200
    input: ["cleanliness_score?", "signed_off?"]
    output: DepotCycle
    side_effects:
      - "status=COMPLETED"
      - "service_kind CHARGE: vehicle.battery_pct=100"
      - "service_kind CLEAN: vehicle.cleanliness_score=cleanliness_score"
      - "service_kind CALIBRATION: vehicle.calib_valid=signed_off"
      - "service_kind SOFTWARE: vehicle.software_version=vehicle.target_software_version"
      - "the cycle's BaySlot moves to COMPLETED"
      - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
      - "posture recomputed per §1.3 depot_posture"
      - "increments DepotCycle.version by 1"
  - method: POST
    path: "/fleet/depots/{depotId}/cycles/{cycleId}/abort"
    description: "Abort a cycle (IN_PROGRESS to ABORTED)"
    roles: [DepotTechnician]
    code: 200
    input: []
    output: DepotCycle
    side_effects:
      - "status=ABORTED"
      - "the cycle's BaySlot moves to RELEASED"
      - "service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
      - "increments DepotCycle.version by 1"

  # ---- DemandSignal + DeploymentWave ----
  - method: POST
    path: "/fleet/territories/{territoryId}/demand-signals"
    description: "Upsert the DemandSignal for a window code"
    roles: [TerritoryPlanner]
    code: 200
    input: ["window_code", "projected_rides", "manual_only_rides"]
    output: DemandSignal
    side_effects: ["effective_demand = max(0, projected_rides - manual_only_rides)"]
  - method: GET
    path: "/fleet/territories/{territoryId}/demand-signals"
    description: "List DemandSignals for a territory"
    roles: [FleetOperations, TerritoryPlanner]
    code: 200
    input: ["window_code?", "limit?", "offset?"]
    output: DemandSignal[]
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/deployment-waves"
    description: "Plan a DeploymentWave for a window code"
    roles: [TerritoryPlanner]
    code: 201
    input: ["window_code", "planned_vehicle_count"]
    output: DeploymentWave
    side_effects: ["status=PLANNED, deployed_vehicle_count=0"]
  - method: GET
    path: "/fleet/territories/{territoryId}/deployment-waves"
    description: "List DeploymentWaves for a territory"
    roles: [FleetOperations, TerritoryPlanner]
    code: 200
    input: ["status?", "window_code?", "limit?", "offset?"]
    output: DeploymentWave[]
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/deployment-waves/{waveId}/activate"
    description: "Activate a planned wave (PLANNED to ACTIVE); posture, zone and weather gates apply"
    roles: [TerritoryPlanner]
    code: 200
    input: ["route_class?"]
    output: DeploymentWave
    side_effects: ["status=ACTIVE", "increments DeploymentWave.version by 1"]
  - method: POST
    path: "/fleet/territories/{territoryId}/deployment-waves/{waveId}/dispatch"
    description: "Dispatch a wave's vehicles into service via the §1.3 selector"
    roles: [TerritoryPlanner]
    code: 200
    input: []
    output: DeploymentWave
    side_effects:
      - "status=COMPLETED"
      - "selects vehicles per §1.3 wave_vehicle_selection"
      - "each selected vehicle moves to IN_SERVICE (updates Vehicle.version; service_status recomputed)"
      - "deployed_vehicle_count = number of vehicles moved"
      - "increments DeploymentWave.version by 1"
  - method: POST
    path: "/fleet/territories/{territoryId}/deployment-waves/{waveId}/abort"
    description: "Abort a wave (PLANNED or ACTIVE to ABORTED)"
    roles: [TerritoryPlanner]
    code: 200
    input: []
    output: DeploymentWave
    side_effects: ["status=ABORTED", "increments DeploymentWave.version by 1"]

  # ---- ServiceAreaRule + ExclusionZone ----
  - method: POST
    path: "/fleet/territories/{territoryId}/area-rules"
    description: "Create a ServiceAreaRule governing a route class in the operational design domain"
    roles: [MappingEngineer]
    code: 201
    input: ["route_class", "allowed", "notes?"]
    output: ServiceAreaRule
    side_effects: ["rule_version=1, status=DRAFT"]
  - method: GET
    path: "/fleet/territories/{territoryId}/area-rules"
    description: "List ServiceAreaRules for a territory"
    roles: [FleetOperations, MappingEngineer, SafetyReviewer]
    code: 200
    input: ["status?", "route_class?", "limit?", "offset?"]
    output: ServiceAreaRule[]
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/area-rules/{ruleId}/approve"
    description: "Approve a ServiceAreaRule (DRAFT to APPROVED); bumps rule_version"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: ServiceAreaRule
    side_effects: ["status=APPROVED", "rule_version increments by 1"]
  - method: POST
    path: "/fleet/territories/{territoryId}/exclusion-zones"
    description: "Schedule an ExclusionZone for a route class"
    roles: [SafetyReviewer, MappingEngineer]
    code: 201
    input: ["kind", "route_class", "start_utc", "duration_seconds"]
    output: ExclusionZone
    side_effects: ["status=SCHEDULED; end_utc = start_utc + duration_seconds"]
  - method: GET
    path: "/fleet/territories/{territoryId}/exclusion-zones"
    description: "List ExclusionZones for a territory"
    roles: [FleetOperations, MappingEngineer, SafetyReviewer, TerritoryPlanner]
    code: 200
    input: ["status?", "route_class?", "limit?", "offset?"]
    output: ExclusionZone[]
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/exclusion-zones/{zoneId}/activate"
    description: "Activate an exclusion zone; drives territory posture gates"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: ExclusionZone
    side_effects:
      - "status=ACTIVE"
      - "active_zone_count recomputed; posture recomputed per §1.3 territory_posture"
      - "increments ServiceTerritory.version by 1"

  - method: POST
    path: "/fleet/territories/{territoryId}/weather-tier-ticks"
    description: "Record the forecast weather tier for a service window; tier 3 or higher suspends MORNING_PEAK and EVENING_PEAK service"
    roles: [SafetyReviewer]
    code: 200
