      - name: binder_revision_loop_returns_to_emissions_testing_a_second_time
        claim_type: cyclic
        grounds:
          - state_machines[BinderFormulation.status].transitions[REVISION_REQUIRED->DRAFT]
          - calculations.binder_cure_index.constants.MAX_BINDER_REVISIONS
        excluded_because:
          difficulty_instance: binder_revision_cycle_revisits_emissions_testing_twice
          rationale: "The §1.8 instance already drives the whole loop DRAFT -> SUBMITTED -> EMISSIONS_TESTING -> REVISION_REQUIRED -> DRAFT -> SUBMITTED -> EMISSIONS_TESTING on one row, and shows that revision_count (0 then 1) is the only field distinguishing the two visits to EMISSIONS_TESTING. A breadth-level repeat of the same loop would add no distinct observation; the MAX_BINDER_REVISIONS ceiling itself is triggered separately by the errors-section instance revising_past_the_max_binder_revisions_ceiling_is_rejected."

      - name: run_status_and_qc_status_are_independent_dimensions
        claim_type: parallel
        grounds:
          - state_machines[ProductionRun.run_status]
          - state_machines[ProductionRun.qc_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: run_status_and_qc_status_advance_as_independent_dimensions
          rationale: "The §1.8 instance walks the full cross product — a run that is CLOSED while still NONCONFORMING, and a run that is CONFORMING while still CURING — and pins which combinations gate release-hold and lot release. The initial-state and valid-transition instances above already record the narrower claim that each dimension moves without disturbing the other."

      - name: sku_submission_is_guarded_by_the_binder_reaching_certified
        claim_type: guarded_transitions
        grounds:
          - validations[priority=52]
          - state_machines[ProductLine.certification_status].transitions[DRAFT->PENDING_CERTIFICATION]
        excluded_because:
          difficulty_instance: sku_certification_submission_gated_on_binder_reaching_certified
          rationale: "The §1.8 instance holds the SKU fixed and walks its binder through DRAFT, SUBMITTED, EMISSIONS_TESTING and CERTIFIED, showing that submit-certification is refused with ERR_BINDER_NOT_CERTIFIED at each earlier stop and accepted only at the last. That is the whole cross-entity guard."

      - name: quarantining_a_lot_cascades_down_to_its_allocation_lines
        claim_type: cascade_down
        grounds:
          - state_machines[InventoryLot.status].transitions[ALLOCATED->QUARANTINED]
          - state_machines[AllocationLine.status].transitions[ALLOCATED->REVOKED]
        excluded_because:
          difficulty_instance: nonconforming_thermal_result_cascades_to_order_backorder_five_hops
          rationale: "The §1.8 instance carries the same cascade at full depth: a NONCONFORMING result quarantines the run's lot, revokes every line on that lot, and rewrites each affected order's allocated_sqft, fill_rate_pct and status down to BACKORDERED, verifying every intermediate hop."

      - name: aborting_a_melting_run_reverses_every_cullet_charge_side_effect
        claim_type: compensation
        grounds:
          - state_machines[ProductionRun.run_status].transitions[MELTING->ABORTED].side_effects
          - state_machines[CulletBatch.status].transitions[CHARGED->STAGED]
        excluded_because:
          difficulty_instance: cullet_charge_reversal_preserves_total_glass_mass
          rationale: "The §1.8 instance reverses a charge both ways — batch-level reverse and run-level abort — and reconciles the plant's four cullet counters plus total_charge_kg_ytd against their pre-charge values, proving no glass mass drifts. A breadth instance could only restate a subset of those equalities."

      - name: charging_cullet_keeps_the_plant_glass_ledger_in_sync
        claim_type: ledger_sync
        grounds:
          - entities.Plant.fields.cullet_charged_kg_ytd
          - entities.Plant.fields.cullet_fraction_ytd
          - calculations.cullet_charge_allocation
        excluded_because:
          difficulty_instance: cullet_charge_cap_circular_dependency_evaluation_order
          rationale: "The §1.8 instance already establishes the ledger identity under the hard case — the per-run cap depends on total_charge_kg, which depends on the cullet actually selected — and reconciles cullet_on_hand_kg, cullet_charged_kg_ytd, total_charge_kg_ytd and cullet_fraction_ytd after each charge."

  # ===========================================================================
  # 3. CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:
      - name: cure_index_hits_both_of_its_caps_on_two_runs_of_the_same_oven
        claim_type: correct_result
        grounds:
          - calculations.binder_cure_index
          - endpoints[POST /production-runs/{runId}/start-cure]
        distinguishing_aspect: "One start-cure lands inside both caps (dwell_ratio 1.2, temp margin 0.8333 -> 110.00) and a second, faster-and-hotter one saturates BOTH the DWELL_RATIO_CAP of 1.25 and the temperature-margin clamp at 1, giving exactly 125.00 — the arithmetic ceiling of the index."
        test_recipe:
          setup:
            - "Plant NWK (oven_length_ft 120) with SKU PL-A on binder BF-FREE-1 (min_cure_temp_f 420, min_dwell_s 150)."
            - "run_a is MELTING on line 1 and run_b is MELTING on line 2, both over [06:00, 14:00)."
