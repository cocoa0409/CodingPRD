              payload: { proposal_id: "${prop_w}", room_block_size: 10, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_y_v}" }
