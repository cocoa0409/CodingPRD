      - name: log_amendment_appends_a_successor_and_unblocks_case_close
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /violent-incident-log/{log_entry_id}/amendments]
          - endpoints[GET /violent-incident-log]
          - endpoints[POST /threat-cases/{threat_case_id}/close]
          - entities.ViolentIncidentLogEntry.fields.supersedes_entry_id
          - entities.ViolentIncidentLogEntry.fields.superseded_flag
          - entities.ViolentIncidentLogEntry.fields.required_element_count_present
          - validations[priority=56]
          - calculations.plan_compliance_metrics
        distinguishing_aspect: |
          The amendment endpoint links two rows of the same table through supersedes_entry_id rather
          than editing one: the original keeps required_element_count_present 6 forever and gains
          superseded_flag true, the successor carries 8, and because the priority-56 gate reads only live
          entries the same close call that was refused now succeeds.
        test_recipe:
