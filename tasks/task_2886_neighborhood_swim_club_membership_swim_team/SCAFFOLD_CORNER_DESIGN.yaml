      - name: precondition_enforcement_offer_expiry_is_measured_by_the_clock_not_by_status
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=48]
          - errors[ERR_OFFER_EXPIRED]
          - calculations.waitlist_offer_selection
          - state_machines[WaitlistEntry].OFFERED_to_EXPIRED
          - endpoints[POST /swim-club/waitlist-entries/{id}/respond]
        distinguishing_aspect: |
          The OFFERED -> EXPIRED edge is driven by the billing-run checkpoint, so between the moment
          the window lapses and the next run the entry still READS as OFFERED while being
          unresponsive. Priority 48 must therefore test the clock against offer_expires_at rather
          than trusting the status column, and it must refuse ACCEPT and DECLINE alike. The boundary
          is inclusive: a response exactly AT offer_expires_at is still live.
        test_recipe:
          setup:
            - "One waitlist-gated FAMILY category and one household in GOOD_STANDING."
            - "An offer is extended at 2027-06-01T09:00Z, so offer_expires_at is 2027-06-15T09:00Z (OFFER_WINDOW_DAYS 14)."
            - "No billing run is executed at any point, so nothing else can move the entry off OFFERED."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: true, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Expiry Test Household", address_line: "91 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { e_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_id}" }
              as: MembershipChair
              captures: { offered_id: $.data.id, offered_at: $.data.offered_at, offer_expires_at: $.data.offer_expires_at, offered_status: $.data.status }
          trigger:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T09:00:00Z" }
              as: SystemOperator
            - call: "GET /swim-club/waitlist-entries/${e_id}"
              payload: {}
              as: MembershipChair
              captures: { status_at_boundary: $.data.status }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T09:00:01Z" }
              as: SystemOperator
            - call: "POST /swim-club/waitlist-entries/${e_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Member
              as_user_id: "${h_id}"
              captures: { err_accept: $.data.error_id }
            - call: "POST /swim-club/waitlist-entries/${e_id}/respond"
              payload: { decision: "DECLINE", requeue: true }
              as: Member
              as_user_id: "${h_id}"
              captures: { err_decline: $.data.error_id }
            - call: "GET /swim-club/waitlist-entries/${e_id}"
              payload: {}
              as: MembershipChair
              captures: { status_after: $.data.status, defer_after: $.data.deferral_count }
          assert:
            - "${offered_id} == ${e_id} with ${offered_status} == OFFERED, ${offered_at} == 2027-06-01T09:00:00Z and ${offer_expires_at} == 2027-06-15T09:00:00Z"
            - "${status_at_boundary} == OFFERED: at exactly offer_expires_at the offer is still live, because priority 48 compares with <="
            - "one second past the window, ACCEPT is HTTP 409 with ${err_accept} == ERR_OFFER_EXPIRED"
            - "DECLINE with requeue=true is HTTP 409 with the same ${err_decline} == ERR_OFFER_EXPIRED, so the expiry gate outranks the deferral gate at priority 49"
            - "${status_after} == OFFERED and ${defer_after} == 0: no billing run has aged the entry, so the status column is stale by design and neither refused response mutated it"

      - name: valid_transition_requeued_declines_cycle_until_the_deferral_cap_bites
        claim_type: valid_transition
        grounds:
          - state_machines[WaitlistEntry].OFFERED_to_WAITING
          - complexity_profile.state_machine_shape
          - calculations.waitlist_offer_selection
          - validations[priority=49]
          - errors[ERR_MAX_DEFERRALS_REACHED]
          - endpoints[POST /swim-club/waitlist-entries/{id}/respond]
        distinguishing_aspect: |
          This is the cyclic edge of the model: OFFERED -> WAITING returns a row to a state it has
          already occupied, and the loop is bounded by a counter rather than by a status. Two things
          must both hold - each pass through the loop costs the household its place, because
          queue_key_at becomes requeued_at and therefore sorts AFTER a sibling that arrived later,
          and the third requeue is refused while a plain DECLINE from the same state still works.
          A cap implemented as `<=` would allow three loops.
        test_recipe:
          setup:
            - "One waitlist-gated FAMILY category and two households, both STANDARD tier and both in GOOD_STANDING."
            - "Household A joins the queue at 09:00Z and household B at 10:00Z, so A is strictly ahead on queue_key_at."
            - "The clock is advanced before every offer so that no two timestamps collide and the ordering is never ambiguous."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: true, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Household A", address_line: "101 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Household B", address_line: "102 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { e_a_id: $.data.id, e_a_key_0: $.data.queue_key_at }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T10:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { e_b_id: $.data.id, e_b_key_0: $.data.queue_key_at }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T11:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_id}" }
              as: MembershipChair
              captures: { offer_1_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries/${e_a_id}/respond"
              payload: { decision: "DECLINE", requeue: true }
              as: Member
              as_user_id: "${h_a_id}"
              captures: { a_status_1: $.data.status, a_defer_1: $.data.deferral_count, a_key_1: $.data.queue_key_at, a_requeued_1: $.data.requeued_at, a_offered_1: $.data.offered_at }
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_id}" }
              as: MembershipChair
              captures: { offer_2_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries/${e_b_id}/respond"
              payload: { decision: "DECLINE", requeue: false }
              as: Member
              as_user_id: "${h_b_id}"
              captures: { b_status_1: $.data.status }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T12:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_id}" }
              as: MembershipChair
              captures: { offer_3_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries/${e_a_id}/respond"
              payload: { decision: "DECLINE", requeue: true }
              as: Member
              as_user_id: "${h_a_id}"
              captures: { a_status_2: $.data.status, a_defer_2: $.data.deferral_count, a_key_2: $.data.queue_key_at }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T13:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_id}" }
              as: MembershipChair
              captures: { offer_4_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries/${e_a_id}/respond"
              payload: { decision: "DECLINE", requeue: true }
              as: Member
              as_user_id: "${h_a_id}"
              captures: { err_cap: $.data.error_id }
            - call: "GET /swim-club/waitlist-entries/${e_a_id}"
              payload: {}
              as: MembershipChair
              captures: { a_status_3: $.data.status, a_defer_3: $.data.deferral_count }
            - call: "POST /swim-club/waitlist-entries/${e_a_id}/respond"
              payload: { decision: "DECLINE", requeue: false }
              as: Member
              as_user_id: "${h_a_id}"
              captures: { a_status_4: $.data.status, a_defer_4: $.data.deferral_count }
          assert:
            - "${e_a_key_0} == 2027-06-01T09:00:00Z and ${e_b_key_0} == 2027-06-01T10:00:00Z"
            - "${offer_1_id} == ${e_a_id}: A wins the first offer on queue_key_at, both entries being STANDARD (rank 2)"
            - "the first requeue is HTTP 200 with ${a_status_1} == WAITING, ${a_defer_1} == 1, ${a_requeued_1} == 2027-06-01T11:00:00Z, ${a_key_1} == 2027-06-01T11:00:00Z and ${a_offered_1} == null"
            - "${a_key_1} is strictly LATER than ${e_b_key_0}, which is the place the household lost"
            - "${offer_2_id} == ${e_b_id}: the later arrival now outranks the requeued entry"
            - "${b_status_1} == DECLINED, a terminal state, so B leaves the candidate set permanently"
            - "${offer_3_id} == ${e_a_id} and the second requeue gives ${a_status_2} == WAITING with ${a_defer_2} == 2 and ${a_key_2} == 2027-06-01T12:00:00Z"
            - "${offer_4_id} == ${e_a_id}: the entry is offerable a third time, so the cap is on requeues and not on offers"
            - "the third requeue is HTTP 409 with ${err_cap} == ERR_MAX_DEFERRALS_REACHED, because deferral_count 2 is not < MAX_DEFERRALS 2"
            - "${a_status_3} == OFFERED and ${a_defer_3} == 2: the refused requeue neither advanced the counter nor dropped the live offer"
            - "the same entry then declines WITHOUT requeue and reaches ${a_status_4} == DECLINED with ${a_defer_4} == 2, so the cap blocks only the looping arm of the edge"

      - name: side_effect_execution_reinstatement_restores_access_but_not_revoked_children
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /swim-club/households/{id}/standing-transitions]
          - state_machines[Household].SUSPENDED_to_GOOD_STANDING
          - state_machines[Membership].SUSPENDED_to_ACTIVE
          - state_machines[SwimTeamRegistration].terminal_states
          - calculations.volunteer_credit_balance
        distinguishing_aspect: |
          The reinstatement cascade is deliberately ASYMMETRIC: it walks one hop (Membership
          SUSPENDED -> ACTIVE) and stops, because REVOKED and RELEASED are terminal and a terminal
          state is never reversed. The natural implementation - undoing the suspension cascade in
          reverse - would restore the registration and the assignment and silently re-inflate
          meet.volunteer_slots_filled. This instance asserts the boundary of the walk, not its
          depth; the depth itself belongs to
          transitive_cascade / conduct_suspension_cascade_to_meet_understaffing.
        test_recipe:
          setup:
            - "One OPEN 2027 season, one COUPLE category, one household with an invoiced ACTIVE membership."
            - "One CONFIRMED registration under that membership and one ASSIGNED SCORER assignment (2 credits) at a meet requiring 4, with the roster left OPEN so no fork can occur."
            - "The conduct case is reported by pm-001 and decided by bp-001, satisfying the two-person control at priority 5."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Reinstatement Household", address_line: "111 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_id}", season_id: "${s27_id}", swimmer_name: "Rafi Cole", swimmer_birthdate: "2014-08-08", squad: "JUNIOR" }
              as: SwimTeamCoach
              captures: { r_id: $.data.id }
            - call: "POST /swim-club/swim-team-registrations/${r_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { r_status_0: $.data.status }
            - call: "POST /swim-club/meets"
              payload: { season_id: "${s27_id}", name: "June Dual Meet", start_iso: "2027-06-12T08:00:00Z", end_iso: "2027-06-12T13:00:00Z", expected_swimmers: 40, volunteer_slots_required: 4 }
              as: SwimTeamCoach
              captures: { meet_id: $.data.id }
            - call: "POST /swim-club/volunteer-assignments"
              payload: { meet_id: "${meet_id}", swim_team_registration_id: "${r_id}", job_code: "SCORER" }
              as: SwimTeamCoach
              captures: { a_id: $.data.id, a_status_0: $.data.status }
            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_id}", subject_name: "Adult member of the household", severity: "SEVERE", narrative: "Verbal abuse of a lifeguard during a ratio closure." }
              as: PoolManager
              as_user_id: pm-001
              captures: { c_id: $.data.id }
            - call: "POST /swim-club/conduct-cases/${c_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: BoardPresident
              as_user_id: bp-001
            - call: "POST /swim-club/conduct-cases/${c_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "SUSPENSION" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { c_status: $.data.status, c_points: $.data.points_assessed }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_access_susp: $.data.access_status, m_dues_susp: $.data.dues_status }
            - call: "GET /swim-club/swim-team-registrations/${r_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { r_status_susp: $.data.status }
            - call: "GET /swim-club/volunteer-assignments/${a_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { a_status_susp: $.data.status }
            - call: "GET /swim-club/meets/${meet_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { meet_filled_susp: $.data.volunteer_slots_filled, meet_status_susp: $.data.status }
          trigger:
            - call: "POST /swim-club/households/${h_id}/standing-transitions"
              payload: { to_standing: "GOOD_STANDING", reason: "Board accepted the written apology and lifted the suspension." }
              as: BoardPresident
              as_user_id: bp-001
              captures: { h_standing_2: $.data.standing, h_points_2: $.data.conduct_points }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_access_2: $.data.access_status, m_dues_2: $.data.dues_status, m_req_2: $.data.volunteer_credits_required }
            - call: "GET /swim-club/swim-team-registrations/${r_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { r_status_2: $.data.status }
            - call: "GET /swim-club/volunteer-assignments/${a_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { a_status_2: $.data.status }
            - call: "GET /swim-club/meets/${meet_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { meet_filled_2: $.data.volunteer_slots_filled, meet_status_2: $.data.status }
          assert:
            - "before the sanction: ${r_status_0} == CONFIRMED and ${a_status_0} == ASSIGNED"
            - "after the sanction: ${c_status} == SANCTIONED with ${c_points} == 8 (CONDUCT_POINTS[SEVERE]), household standing SUSPENDED, ${m_access_susp} == SUSPENDED, ${r_status_susp} == REVOKED, ${a_status_susp} == RELEASED, ${meet_filled_susp} == 0"
            - "${meet_status_susp} == SCHEDULED throughout, because the roster was never closed, so no STAFFED/UNDERSTAFFED fork can confuse the reading"
            - "${m_dues_susp} == INVOICED: the suspension cascade touches the access dimension only, never the dues dimension"
            - "the reinstatement is HTTP 200 with ${h_standing_2} == GOOD_STANDING"
            - "${m_access_2} == ACTIVE: the walk restores exactly one hop"
            - "${r_status_2} == REVOKED and ${a_status_2} == RELEASED: both terminal states survive the reinstatement untouched"
            - "${meet_filled_2} == 0, NOT 2: the meet's credit count was not re-inflated by the restore"
            - "${m_req_2} == 0, because volunteer_credits_required counts only CONFIRMED or COMPLETED registrations and the revoked one no longer qualifies"
            - "${h_points_2} == 8: reinstatement softens standing but never erases accrued conduct points, so a further MINOR case can re-suspend the household immediately"

      - name: state_machine_membership_two_dimensions_on_one_row
        claim_type: valid_transition
        grounds:
          - state_machines[Membership].dues_status
