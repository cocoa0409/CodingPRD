            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /work-items/${w1_id}/complete", payload: { actual_hours: 90 }, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /work-items/${w1_id}/verify", payload: { outcome: "VERIFIED" }, as: OperationsRep }
