      - name: grant_lazy_expiry_and_suspended_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.AccessGrant, calculations.access_decision_selector]
        distinguishing_aspect: "An access attempt at/after valid_until flips the grant to EXPIRED and the event is DENIED NO_ACTIVE_GRANT; separately, manual suspend -> reinstate cycles ACTIVE -> SUSPENDED -> ACTIVE."
        test_recipe:
          setup: ["Holder with verified ACTIVE card; zone; two grants: gx valid_until 2026-09-01 (expires), gy valid 2026-08-01..2027-08-01 on a second zone"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
