            - "Registration.${reg_a}.status == ACTIVE (5 points is TIER_0, far below the TIER_2 floor of 20, so no suspension cascade fires)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: window_calendar_half_open_adjacency
        grounds:
          - validations[priority=36]
          - errors.ERR_WINDOW_PERIOD_OVERLAP
          - entities.ReportingWindow.fields.period_start
          - entities.ReportingWindow.fields.period_end
        resource: "The reporting calendar slot keyed by (species, report_class, frequency)"
        interval_semantics: "HALF-OPEN [period_start, period_end) with mutual exclusion: any non-empty intersection is refused, adjacency is not an intersection"
        distinguishing_aspect: |
          Resource is the ReportingWindow calendar and the semantics are half-open plus
          mutual exclusion — capacity one. The decisive pair is the adjacency case:
          a window starting exactly at the incumbent's period_end is accepted because
          the incumbent does not own that instant, while a window starting one day
          earlier is refused. The resource key also matters: the same calendar span is
          free again under a different frequency or report_class.
        test_recipe:
          setup:
            - "One existing weekly CATTLE LIVE_ANIMAL window W1 spanning [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z)."
            - "No other windows exist; the clock is at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
          trigger:
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-09T00:00:00Z", period_end: "2026-08-16T00:00:00Z", submission_deadline_utc: "2026-08-17T15:00:00Z", correction_deadline_utc: "2026-08-24T15:00:00Z", publication_release_utc: "2026-08-18T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-05T00:00:00Z", period_end: "2026-08-06T00:00:00Z", submission_deadline_utc: "2026-08-07T15:00:00Z", correction_deadline_utc: "2026-08-14T15:00:00Z", publication_release_utc: "2026-08-08T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { err_contained: $.data.error_id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-10T00:00:00Z", period_end: "2026-08-17T00:00:00Z", submission_deadline_utc: "2026-08-18T15:00:00Z", correction_deadline_utc: "2026-08-25T15:00:00Z", publication_release_utc: "2026-08-19T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { win_next: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "DAILY", period_start: "2026-08-05T00:00:00Z", period_end: "2026-08-06T00:00:00Z", submission_deadline_utc: "2026-08-06T15:00:00Z", correction_deadline_utc: "2026-08-13T15:00:00Z", publication_release_utc: "2026-08-07T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 200 }
              as: ProgramAdmin
              captures: { win_daily: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "BOXED_BEEF", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 100000 }
              as: ProgramAdmin
              captures: { win_boxed: $.data.id }
          assert:
            - "Partial overlap [2026-08-09, 2026-08-16) against [2026-08-03, 2026-08-10): 409 with error_id ERR_WINDOW_PERIOD_OVERLAP"
            - "Strict containment [2026-08-05, 2026-08-06): 409 with error_id ERR_WINDOW_PERIOD_OVERLAP (being wholly inside is still an intersection)"
            - "Adjacency [2026-08-10, 2026-08-17), whose period_start equals W1's period_end: 201 created, ReportingWindow.${win_next}.status == OPEN — the half-open upper bound is exclusive"
            - "Same span, different frequency: the DAILY window [2026-08-05, 2026-08-06) is created (201) because the resource key includes frequency"
            - "Same span, different report_class: the BOXED_BEEF weekly window [2026-08-03, 2026-08-10) is created (201) alongside W1"
            - "GET /reporting-windows returns total_count 4 (W1 plus the three accepted windows) and ReportingWindow.${win_1}.period_end is still 2026-08-10T00:00:00Z, untouched by the two refusals"

      - name: forward_commitment_closed_interval_aggregate_cap
        grounds:
          - calculations.forward_commitment_peak
          - validations[priority=50]
          - errors.ERR_FORWARD_COMMITMENT_CAP_EXCEEDED
          - entities.Plant.fields.forward_commitment_cap_head
          - entities.TransactionRecord.fields.forward_delivery_start
        resource: "A Plant's forward delivery capacity (forward_commitment_cap_head) on any single delivery day"
        interval_semantics: "CLOSED [forward_delivery_start, forward_delivery_end] with AGGREGATE capacity: intervals may overlap freely until the summed head on a shared day exceeds the cap, and a shared endpoint day counts as an overlap"
        distinguishing_aspect: |
          Different resource entity (Plant capacity, not the ReportingWindow calendar)
          and the opposite interval semantics on both axes: endpoints are INCLUSIVE, so
          two commitments that merely touch at one instant do collide, and capacity is
          aggregate rather than one, so overlap is legal up to the cap. Exactly at the
          cap is allowed and one head more is refused — the mirror image of the calendar
          rule, where the first overlap already fails.
