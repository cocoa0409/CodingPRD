      - name: failed_screening_cascade_artist_sessions_residency_school
        grounds:
          - state_machines.TeachingArtist.vetting_status.CLEARED_to_SCREEN_FAILED
          - state_machines.TeachingArtist.roster_status.ACTIVE_to_SUSPENDED
          - state_machines.Session.CONFIRMED_to_VACATED
          - calculations.residency_staffing_status
          - calculations.school_partnership_health
        distinguishing_aspect: |
          Depth-4 chain from one POST /teaching-artists/{id}/screenings with
          outcome FAILED: the screening flips the artist to SCREEN_FAILED /
          SUSPENDED; that suspension (not the screening) vacates her CONFIRMED
          session and releases its 13974-cent encumbrance; that vacancy (not the
          suspension) clears Residency.lead_artist_id and recomputes
          staffing_status to LEAD_VACANT; that staffing_status (not the vacancy)
          recomputes SchoolPartner.partnership_health to WATCH.
