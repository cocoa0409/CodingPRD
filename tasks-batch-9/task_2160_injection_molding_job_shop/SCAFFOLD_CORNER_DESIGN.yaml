          trigger:
            - { call: "POST /quotes/${qa_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
          assert:
            - "Quote.${qa_id}.status == ACCEPTED and decided_by_user_id == ${cust_id}"
            - "Quote.${qb_id}.status == SUPERSEDED"
            - "Quote.${qc_id}.status == DRAFT because it belongs to mold ${mold2_id}"
            - "Mold.${mold_id}.status == SAMPLING and Mold.${mold2_id}.status == NEW"

      - name: mold_retire_cascades_revocation_to_its_qualifications
        claim_type: Cascade down
        grounds: ["state_machines.Mold.NEW_to_RETIRED", "state_machines.PressQualification.QUALIFIED_to_REVOKED", "endpoints[POST /molds/{id}/retire]"]
        distinguishing_aspect: "Retiring a tool that never sampled still revokes its QUALIFIED junction rows, and a qualification on a different mold is left alone."
        test_recipe:
          setup: ["Molds M-1 and M-2, both QUALIFIED on press P-150 after 380-against-400 trials; no ProductionJob exists."]
