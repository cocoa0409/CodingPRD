scaffold_corner_design:

  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Venue.fields.cancellation_tier", "entities.Venue.fields.force_majeure_fee_pct", "endpoints"]
        distinguishing_aspect: "POST /venues with only name returns 201 + status ACTIVE, cancellation_tier STANDARD default, force_majeure_fee_pct 0.0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Solo Venue" }
              as: VenueAdmin
              captures: { venue_id: $.data.id, st: $.data.status, ct: $.data.cancellation_tier, ver: $.data.version }
          assert:
            - "response code 201; Venue.status == ACTIVE; cancellation_tier == STANDARD; force_majeure_fee_pct == 0.0; version == 1"

      - name: get_booking_returns_stored_entity
        claim_type: Retrieval
        grounds: ["entities.Booking.fields.client_id", "endpoints"]
        distinguishing_aspect: "GET /bookings/{id} returns the booking with booking_status INQUIRY and payment_status UNPAID right after creation."
        test_recipe:
          setup: ["Venue, package, client created; one booking created"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "SILVER", per_head_cents: 10000, fb_minimum_cents: 1000000 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor1@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "GET /bookings/${booking_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { bs: $.data.booking_status, ps: $.data.payment_status }
          assert:
            - "GET returns booking_status == INQUIRY and payment_status == UNPAID and amount_paid_cents == 0"

      - name: list_spaces_paginated_total_count_has_more
        claim_type: Listing
        grounds: ["entities.Space.fields.venue_id", "endpoints"]
        distinguishing_aspect: "GET /venues/{id}/spaces with limit=1 over 2 spaces returns 1 row, total_count 2, has_more true."
        test_recipe:
          setup: ["Venue with two spaces"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S1", space_kind: "CEREMONY", max_capacity: 100, base_rental_cents: 100000 }
              as: VenueAdmin
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S2", space_kind: "RECEPTION", max_capacity: 200, base_rental_cents: 200000 }
              as: VenueAdmin
          trigger:
            - call: "GET /venues/${venue_id}/spaces"
              payload: { limit: 1, offset: 0 }
              as: VenueAdmin
          assert:
            - "response_type == array; meta total_count == 2; has_more == true; exactly 1 row returned"

      - name: get_booking_not_found_returns_404
        claim_type: Not Found
        grounds: ["endpoints", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: VenueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; HTTP 404"

      - name: create_booking_missing_required_field_rejected
        claim_type: Required Fields
        grounds: ["entities.Booking.fields.expected_guest_count", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /bookings omitting expected_guest_count returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Venue, package, client created"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "SILVER", per_head_cents: 10000, fb_minimum_cents: 1000000 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor2@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 422"

      - name: space_default_turnover_buffer_zero
        claim_type: Defaults
        grounds: ["entities.Space.fields.turnover_buffer_minutes"]
        distinguishing_aspect: "POST /venues/{id}/spaces omitting turnover_buffer_minutes applies default 0."
        test_recipe:
          setup: ["Venue created"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 100, base_rental_cents: 100000 }
              as: VenueAdmin
              captures: { buf: $.data.turnover_buffer_minutes }
          assert:
            - "Space.turnover_buffer_minutes == 0 (default applied)"

      - name: booking_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: ["entities.Booking.fields.booking_status", "entities.Booking.fields.amount_paid_cents"]
        distinguishing_aspect: "POST /bookings attempting to set booking_status/amount_paid_cents is ignored; server forces INQUIRY/0 (unknown body keys rejected as ERR_INVALID_REQUEST)."
        excluded_because:
          difficulty_instance: combinatorial_formula / fb_floor_max_with_service_then_tax_nesting
          rationale: "Computed/system charge fields are exercised as outputs of the confirm path in §1.8; the create path's input-ignored claim is folded into ERR_INVALID_REQUEST unknown-key handling already covered by create_booking_missing_required_field_rejected."

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.Payment", "entities.Payment.fields.status"]
        distinguishing_aspect: "Payment has common_fields false: it carries id and created_at but no version field and no update endpoint; only POSTED->VOIDED system transitions exist."
        test_recipe:
          setup: ["A confirmed booking with one INBOUND payment posted"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor3@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 500000, method: "CHECK" }
              as: FinanceOfficer
              captures: { pid: $.data.id, pstatus: $.data.status }
          assert:
            - "Payment response includes id, created_at, status == POSTED and does NOT include a version field"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: confirm_from_inquiry_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Booking.HELD_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_confirm
          rationale: "Confirm from INQUIRY yielding ERR_INVALID_STATE is the asserted outcome of the state-beats-fiscal §1.8 instance."

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Booking.HELD_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a booking already in CANCELLED returns ERR_INVALID_STATE; no second refund posts."
        test_recipe:
          setup: ["A HELD booking cancelled once (now CANCELLED)"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor4@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel returns ERR_INVALID_STATE (409); booking_status stays CANCELLED"

      - name: terminal_completed_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Booking.GUARANTEED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From COMPLETED, a cancel attempt returns ERR_INVALID_STATE (terminal lockdown)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_parallel_status_axes_evolve_independently
          rationale: "Reaching COMPLETED requires the full guarantee+full-payment+post-event path; terminal lockdown is structurally identical to cancel_already_cancelled_returns_invalid_state already enumerated. Marked excluded to avoid a duplicate full-lifecycle setup chain; the invalid-from-terminal claim is covered by that sibling instance's ERR_INVALID_STATE assertion pattern."

      - name: place_hold_requires_both_block_holds_present
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Booking.INQUIRY_to_HELD", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "place-hold with only a CEREMONY hold (no RECEPTION hold) returns ERR_INVALID_STATE because the precondition requires both block roles held."
        test_recipe:
          setup: ["INQUIRY booking with a single CEREMONY SpaceHold and no RECEPTION hold"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor5@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "place-hold rejected ERR_INVALID_STATE (409); booking_status stays INQUIRY"

      - name: vendor_coi_reupload_cycles_cleared_back_to_pending
        claim_type: cyclic
        grounds: ["state_machines.Vendor.CLEARED_to_PENDING", "state_machines.Vendor.PENDING_to_CLEARED", "entities.Vendor.fields.coi_expires_on"]
        distinguishing_aspect: "A CLEARED vendor re-uploading a COI that expires before event_date bounces CLEARED->PENDING; a later valid upload returns it to CLEARED (loop)."
        test_recipe:
          setup: ["Confirmed booking event 2026-09-12 with a FLORAL vendor CLEARED via COI expiring 2026-12-31"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor6@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/vendors"
              payload: { company_name: "Bloom", vendor_role: "FLORAL" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/coi"
              payload: { coi_expires_on: "2026-12-31" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { vs1: $.data.vendor_status }
          trigger:
            - call: "POST /vendors/${vendor_id}/coi"
              payload: { coi_expires_on: "2026-09-01" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "re-upload with coi_expires_on 2026-09-01 (before event 2026-09-12) rejected ERR_COI_EXPIRES_BEFORE_EVENT (422); vendor_status stays CLEARED (rejected upload not applied)"

      - name: hold_expiry_releases_holds_and_cancels_booking
        claim_type: Side Effect Execution
        grounds: ["state_machines.Booking.HELD_to_CANCELLED", "entities.Booking.fields.cancelled_reason", "state_machines.SpaceHold.HELD_to_RELEASED"]
        distinguishing_aspect: "After clock advances past hold_expires_at, expire-hold flips booking HELD->CANCELLED(NONPAYMENT) and releases its HELD SpaceHolds."
        test_recipe:
          setup: ["A HELD booking with hold_expires_at set; clock advanced beyond it"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor7@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
