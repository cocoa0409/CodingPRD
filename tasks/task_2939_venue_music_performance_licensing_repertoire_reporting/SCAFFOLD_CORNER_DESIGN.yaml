            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${t2_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 101, declared_standing: 0, declared_cover_revenue_cents: 0, declared_live_nights: 0, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${t2_v0}" }
              as: VenueOperator
