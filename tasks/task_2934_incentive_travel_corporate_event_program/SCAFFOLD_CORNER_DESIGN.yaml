  - name: gross_up_flat_versus_full_variant_divergence
    claim_type: variant_divergence
    grounds:
    - §1.3 taxable_award_gross_up (variants flat_supplemental, full_gross_up)
    - §0.5 dual_variant_calc
    distinguishing_aspect: |
      Both variant pairs in §1.3 already have dedicated §1.8 designs. For the gross-up pair the
      divergence claim — same award value, two policies, different gross_up_cents, and a delta
      that must be exactly 117350 cents — is the substance of two paired §1.8 instances built on
      the identical 443198-cent award.
    excluded_because:
      difficulty_instance: gross_up_flat_supplemental_variant_on_travelled_winner
      rationale: |
        That §1.8 instance and its full_gross_up twin are constructed as a matched pair on the same
        winner and the same taxable base precisely so the delta between the variants is asserted,
        which is exactly what a variant_divergence recipe would do.
  - name: no_gross_up_variant_is_selected_and_snapshotted_when_policy_is_none
    claim_type: variant_selection
    grounds:
    - §1.3 taxable_award_gross_up (variant no_gross_up)
    - §1.1 Program.gross_up_policy, TaxAwardReport.gross_up_method
    - §1.5 POST /programs/{program_id}/gross-up-policy
    - §1.5 POST /tax-award-reports
    distinguishing_aspect: |
      The third gross-up variant is the one no §1.8 instance uses: NONE. It is also the variant
      that proves selection is driven by the Program policy at draft creation rather than by any
      request field — POST /tax-award-reports accepts only qualifier_id and tax_year, so a report
      cannot ask for a method. With NONE the employer withholds nothing, so combined_rate_bp and
