          Pair GrantRecommendation -> Grantee: approve is legal only while the
          referenced Grantee is CLEARED; approving while the grantee is IN_REVIEW
          fails ERR_GRANTEE_NOT_CLEARED, and succeeds after the grantee's own
          state machine reaches CLEARED.
        test_recipe:
          setup:
            - "Fund fx ACTIVE non-endowed cash 50000; grantee gx IN_REVIEW; grant grx 1000.00 in COMPLIANCE_REVIEW (claimed by co-1, approving as co-2)"
