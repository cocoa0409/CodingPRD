              as: MeterTechnician
            - call: "POST /meters"
              payload: { account_id: "${acct_x_id}", meter_serial: "MTR-I-5", meter_type: "IRRIGATION_SUBMETER", size_inches: 0.75, initial_register_value: 0, parent_meter_id: "${master_x_id}" }
