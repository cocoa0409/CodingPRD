      - name: rbac_customer_scope_confines_reads_and_writes_to_its_own_rows
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
          - roles.Customer.identity
          - roles.Customer.exclusive_operations
          - roles.Customer.shared_operations
          - errors.ERR_CUSTOMER_SCOPE_VIOLATION
          - validations.priority_6
