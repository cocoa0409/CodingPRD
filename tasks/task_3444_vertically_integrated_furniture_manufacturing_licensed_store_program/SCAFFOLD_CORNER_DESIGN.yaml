            - "after run: STAR order ALLOCATED and NEW order WAITLISTED — tier 1 PREFERRED outranks earlier created_at (licensee_cap 8 fits only one 6-unit order)"

  # ===========================================================================
  - section: validations
    instances:
      - name: bogus_action_on_unknown_order_returns_validation_before_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors.ERR_VALIDATION
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "A request that is BOTH malformed (action enum BOGUS) AND targets a non-existent order returns 400 ERR_VALIDATION — request-shape priority 2 runs before existence priority 5."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/orders/00000000-0000-0000-0000-000000000000/transition"
              payload: { action: "BOGUS" }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id == ERR_VALIDATION, not 404 ERR_ORDER_NOT_FOUND"

      - name: error_account_on_hold_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_ACCOUNT_ON_HOLD]
        excluded_because:
          difficulty_instance: account_hold_beats_credit_overflow_on_submit
          rationale: "Asserted as the winning error of the state-vs-fiscal priority instance."

      - name: error_credit_limit_exceeded_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_CREDIT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: credit_exactly_at_limit_passes_one_cent_over_fails
          rationale: "The third submit in the boundary instance asserts this error."

      - name: error_line_not_orderable_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_LINE_NOT_ORDERABLE]
        excluded_because:
          difficulty_instance: order_create_blocked_by_concept_line_state
          rationale: "Asserted as the failure of the cross-entity guard instance."

      - name: error_order_not_picked_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_ORDER_NOT_PICKED]
        excluded_because:
          difficulty_instance: appointment_create_blocked_by_order_not_picked
          rationale: "Asserted as the failure of the appointment guard instance."

      - name: error_delivery_capacity_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_DELIVERY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: delivery_crew_aggregate_overlap_with_half_open_adjacency
          rationale: "AP-C rejection asserts this error; the confirm-time recheck fires it again in crew_units_conserved_across_confirm_and_cancel."

      - name: error_cycle_week_overlap_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_CYCLE_WEEK_OVERLAP]
        excluded_because:
          difficulty_instance: cycle_week_strict_exclusion_with_adjacency_allowed
          rationale: "The overlapping second cycle asserts this error."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: run_allocation_converts_and_locks_final_prices
        claim_type: action_endpoint
        grounds:
          - state_machines.AllocationCycle.OPEN_to_ALLOCATED
          - entities.SupplyOrder.fields.final_total_cents
        distinguishing_aspect: "run-allocation flips the cycle to ALLOCATED, converts RESERVED orders to ALLOCATED, locks final_total_cents, and stamps run_at — all visible in one response plus order reads."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensee Summit ACTIVE, OPEN cycle; order qty 3 RESERVED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
