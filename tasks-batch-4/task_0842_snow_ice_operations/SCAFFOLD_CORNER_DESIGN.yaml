            - "response.data.error_id == ERR_STALE_STORM_VERSION"

      - name: replan_supersedes_prior_planned_assignment
        claim_type: cascading_side_effects
        grounds: [state_machines.RouteAssignment.PLANNED_to_SUPERSEDED, entities.RouteAssignment.fields.status]
