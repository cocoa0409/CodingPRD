      - name: withdrawing_a_placement_relaxes_the_envelope_back_to_the_exact_prior_bounds
        grounds:
          - calculations.case_environmental_envelope
          - "endpoints.DELETE_/artifact-cases/{id}/placements/{artifact_id}"
          - state_machines.Artifact.RESERVED_to_UNPLACED
          - entities.ArtifactCase.fields.placed_artifact_count
        distinguishing_aspect: |
          The envelope is a strictest-wins fold over the placed set, so it is only
          correctly compensated if the DELETE re-folds the REMAINING artifacts
          rather than trying to invert whatever the last placement did. Inversion is
          impossible here: max/min are not invertible, and the same artifact can be
          removed from the middle of the set. The chain drives env_feasible and
          security_ok false and back to true purely by adding and withdrawing
          artifacts, then re-adds the same artifact to prove the recomputation is
          idempotent, and finally empties the case to hit the null branch - where a
          case with no objects is declared feasible rather than infeasible.
