  # ===========================================================================
  - section: errors
    instances:

      - name: netting_after_window_left_open_refused
        claim_type: Violation → Error
        grounds:
          - errors[ERR_WINDOW_ALREADY_NETTED]
          - state_machines.TradeSubmission.LOCKED_IN_to_OPEN
        distinguishing_aspect: "ERR_WINDOW_ALREADY_NETTED is a distinct signal from ERR_INVALID_STATE: it fires when a trade mutation targets a trade whose window has already left OPEN, which the unmatch path reports instead of the generic state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants WN2 and WO2 are ACTIVE; Security WNT1 has an OPEN window; WN2 holds a locked-in matched BUY; the window is then netted."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Wnet Alpha", lei: "LEI-WN2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_wn2: $.data.id }
