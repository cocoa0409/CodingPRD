          - errors[ERR_STALE_PUMP_VERSION]
        distinguishing_aspect: "Covers concurrency_rules.irrigation-run-create-stale-pump on POST /irrigation-runs: the station is taken OFFLINE and brought back ONLINE, so it ends in exactly the state the client believed it was in, and only the version differs — the 412 must still fire, and it must be ERR_STALE_PUMP_VERSION rather than ERR_PUMP_OFFLINE."
        test_recipe:
          setup:
            - "One course with a 500000 gal allocation and a 5500 sq ft GREEN on hole 12."
            - "One WELL pump station read at version 1, then cycled OFFLINE and back ONLINE."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
