          - errors[ERR_UTILITY_CROSSOVER_INCOMPLETE]
          - validations[priority 15]
          - validations[priority 18]
          - validations[priority 20]
          - state_machines.SetJob.SET_COMPLETE_to_SET_COMPLETE
        distinguishing_aspect: |
          One SET_COMPLETE job violates four gates at once, and each is peeled off in
          strict priority order on the SAME final-inspection call: run by the site
          inspector it is ERR_SEGREGATION_OF_DUTIES (15); run by a different inspector
          it is ERR_ANCHOR_NOT_CERTIFIED (18); once certified it is
          ERR_SCOPE_SPLIT_INCOMPLETE (20); after the split it is
          ERR_UTILITY_CROSSOVER_INCOMPLETE (the second arm of 20). Only then does the
