    output: ReceiptCommitment
    side_effects:
      - "commitment created with commit_status PROPOSED, fulfillment_status AWAITING_SHIP, origin BUYER, cost_cents and open_cost_cents computed"
      - "increments PlanMonth.version by 1"
  - method: GET
    path: "/otb/receipt-commitments/{id}"
    description: "read one receipt commitment including both of its state dimensions"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer, VendorRep]
    code: 200
    input: []
    output: ReceiptCommitment
    side_effects: []
  - method: GET
    path: "/otb/receipt-commitments"
    description: "list receipt commitments filtered by month, item, vendor or either state dimension"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer, VendorRep]
    code: 200
    input: ["plan_month_id?", "assortment_item_id?", "vendor_id?", "commit_status?", "fulfillment_status?", "limit?", "offset?"]
    output: ReceiptCommitment[]
    side_effects: []
  - method: POST
    path: "/otb/receipt-commitments/{id}/commit"
    description: "move a PROPOSED commitment to COMMITTED, debiting the month's open-to-buy and recomputing plan posture"
    roles: [CategoryBuyer]
    code: 200
    input: []
    output: ReceiptCommitment
    side_effects:
      - "commit_status := COMMITTED; PlanMonth.otb_committed_cents and otb_open_cents recomputed"
      - "CategoryPlan.open_ratio_bps and otb_posture recomputed; a resulting FROZEN posture demotes PROPOSED items to DEFERRED"
      - "increments ReceiptCommitment.version by 1, PlanMonth.version by 1, CategoryPlan.version by 1"
  - method: POST
    path: "/otb/receipt-commitments/{id}/cancel"
    description: "withdraw a PROPOSED commitment or cancel a COMMITTED one, releasing open-to-buy and driving cascade-A"
    roles: [CategoryBuyer]
    code: 200
    input: ["cancel_reason?"]
    output: ReceiptCommitment
    side_effects:
      - "PROPOSED -> WITHDRAWN with fulfillment_status VOID and no month or plan change"
      - "COMMITTED -> CANCELLED driving cascade-A links 2..4: month OTB release, posture recomputation, DEFERRED item restoration for CARRYOVER and CORE items"
      - "increments ReceiptCommitment.version by 1 and, on the COMMITTED path, PlanMonth.version and CategoryPlan.version by 1 each"
  - method: POST
    path: "/otb/receipt-commitments/{id}/ship"
    description: "vendor marks a committed order as shipped; advances only the fulfillment dimension"
    roles: [VendorRep]
    code: 200
    input: []
    output: ReceiptCommitment
    side_effects:
      - "fulfillment_status := SHIPPED with commit_status untouched"
      - "increments ReceiptCommitment.version by 1"
  - method: POST
    path: "/otb/receipt-commitments/{id}/receipts"
    description: "vendor posts received units; partial receipts keep the commitment open, a full receipt closes the commit dimension"
    roles: [VendorRep]
    code: 200
    input: [received_units_delta]
    output: ReceiptCommitment
    side_effects:
      - "received_units, open_cost_cents and received_cost_cents recomputed; fulfillment_status := PARTIALLY_RECEIVED or RECEIVED"
      - "on a full receipt commit_status := CLOSED"
      - "PlanMonth.otb_committed_cents and otb_received_cents recomputed; increments PlanMonth.version by 1"
      - "increments ReceiptCommitment.version by 1"
  - method: POST
    path: "/otb/actuals-posts"
    description: "post one week of actual sales and receipts against an IN_SEASON month; drives reforecasting of the month's OTB and the plan's variance verdict"
    roles: [MerchOpsAdmin]
    code: 201
    input: [plan_month_id, week_index, actual_sales_cents, actual_receipts_cents, actual_units_received]
    output: ActualsPost
    side_effects:
      - "month.active_basis := PROJECTED_BASIS; calculations.markdown_reserve then calculations.plan_month_open_to_buy rewrite the month's reserve and OTB fields"
      - "calculations.variance_verdict rewrites CategoryPlan.sales_variance_bps and variance_status; calculations.otb_posture rewrites open_ratio_bps and otb_posture"
      - "a BREACH verdict on an APPROVED plan with reforecast_round < 3 drives CategoryPlan APPROVED -> REFORECAST_OPEN, creates a ReforecastCycle with trigger_reason VARIANCE_BREACH and supersedes ACTIVE overlays"
      - "increments PlanMonth.version by 1 and CategoryPlan.version by 1 or 2"
  - method: POST
    path: "/otb/category-plans/{id}/reforecasts"
    description: "open a director-requested reforecast cycle against an APPROVED plan; carries the OCC version of the plan"
    roles: [MerchandisePlanner]
    code: 201
    input: [reason_note, expected_category_plan_version]
    output: ReforecastCycle
    side_effects:
      - "cycle created with status OPEN, trigger_reason DIRECTOR_REQUEST, round_index := plan.reforecast_round + 1"
      - "plan.status := REFORECAST_OPEN, plan.reforecast_round += 1, ACTIVE overlays superseded"
      - "increments CategoryPlan.version by 1"
  - method: GET
    path: "/otb/reforecast-cycles/{id}"
