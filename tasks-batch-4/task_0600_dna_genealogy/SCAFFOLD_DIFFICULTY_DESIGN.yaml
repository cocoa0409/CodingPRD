  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dna_not_ready_beats_consent_required_on_health_report
        grounds:
          - "validations[priority=11]"
          - "validations[priority=14]"
          - "errors[ERR_DNA_NOT_READY]"
          - "errors[ERR_CONSENT_REQUIRED]"
        distinguishing_aspect: |
          Category pair = state (p11, ERR_DNA_NOT_READY) vs business_safety (p14,
          ERR_CONSENT_REQUIRED). A HEALTH_TRAIT report request that violates BOTH (no
          genotyped sample AND no HEALTH_TRAITS grant) must return ERR_DNA_NOT_READY (409),
          never ERR_CONSENT_REQUIRED (403).
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer N holds a PLUS subscription (access ACTIVE, tier permits health reports), has NO kit and therefore dna_status = NO_SAMPLE, and holds NO ConsentGrant at all."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "n@dna.test", display_name: "Nia" }
              as: PlatformAdmin
              captures: { cN: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cN}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cN}"
            - call: "GET /dna/customers/${cN}"
              payload: {}
              as: Customer
              as_user_id: "${cN}"
              captures: { cvN: $.data.version }
          trigger:
            - call: "POST /dna/customers/${cN}/reports"
              payload: { report_type: "HEALTH_TRAIT", variant: "PROVISIONAL", expected_customer_version: "${cvN}" }
              as: Customer
              as_user_id: "${cN}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_DNA_NOT_READY"
            - "GET /dna/reports?customer_id=${cN} returns 0 reports"

      - name: consent_required_beats_subscription_locked_on_health_report
        grounds:
