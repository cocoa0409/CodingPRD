            - "Milestone 2: actual 149 < target 150 -> attained == false"
            - "OnboardingCase.${case_id}: attained_milestone_count == 1 and missed_milestone_count == 1"

  - section: validations
    instances:
      - name: create_physician_missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID is rejected at priority 1 before anything else, with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. No", specialty: "PEDIATRICS", email: "no@x.com", hire_type: "NEW_GRAD" } }
          assert:
            - "Response 400 with data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and response_type == error"

      - name: segregation_of_duties_same_user_verify
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "When the item IS in DOCS_SUBMITTED (state precondition satisfied), the safety rule fires: the submitter cannot verify their own submission."
        test_recipe:
          setup: ["Physician + case; STATE_LICENSE item with docs submitted by cs-1"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Uma", specialty: "CARDIOLOGY", email: "uma@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
          trigger:
            - { call: "POST /onboarding/credential-items/${lic}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 422): submitted_by_user_id == X-User-ID"
            - "CredentialItem.${lic}.status remains DOCS_SUBMITTED; a subsequent verify as cs-2 succeeds (satisfaction path)"

      - name: file_blocked_until_dependency_approved
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ITEM_DEPENDENCY_NOT_APPROVED]", "state_machines.CredentialItem.VERIFIED_to_FILED"]
        distinguishing_aspect: "Cross-item graph gate: filing a VERIFIED DEA item whose license dependency is merely DOCS_SUBMITTED fails with ERR_ITEM_DEPENDENCY_NOT_APPROVED; approving the dependency unlocks the identical file call."
        test_recipe:
          setup: ["Physician + case; license DOCS_SUBMITTED; DEA (depends on license) VERIFIED"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Vic", specialty: "CARDIOLOGY", email: "vic@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "DEA_REGISTRATION", expires_on: "2028-06-01", depends_on_item_ids: ["${lic}"], document_ref: "doc-dea" }, as: CredentialingSpecialist, captures: { dea: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${dea}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${dea}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2" }
          trigger:
            - { call: "POST /onboarding/credential-items/${dea}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /onboarding/credential-items/${lic}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2" }
            - { call: "POST /onboarding/credential-items/${lic}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/approve", payload: {}, as: OnboardingDirector }
            - { call: "POST /onboarding/credential-items/${dea}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1", captures: { st: "$.data.status" } }
          assert:
            - "First DEA file rejected with error_id == ERR_ITEM_DEPENDENCY_NOT_APPROVED (HTTP 422) while the license is DOCS_SUBMITTED"
            - "After the license reaches APPROVED, the identical DEA file succeeds: status == FILED"

      - name: negotiation_round_limit_sixth_counter
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NEGOTIATION_ROUND_LIMIT]", "entities.Offer.fields.negotiation_round"]
        distinguishing_aspect: "Aggregate boundary: exactly five counter-offers are accepted (round increments 1..5); the sixth counter is rejected with ERR_NEGOTIATION_ROUND_LIMIT."
