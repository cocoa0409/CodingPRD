      - name: precision_per_session_rounding_precedes_summation
        claim_type: precision
        grounds:
          - calculations.topic_hours_ledger.precision
          - entities.Recruit.per_topic_credited_hours
        excluded_because:
          difficulty_instance: boundary_precision_check / per_session_rounding_before_summation_pins_1_14_not_1_13
          rationale: "The evaluation-order claim - round each AttendanceRecord product to 2 dp BEFORE summing, never sum-then-round - is that instance's whole subject, and it pins the one-cent difference the two orders produce."

      - name: variant_divergence_attended_and_scheduled_bases_disagree_on_partial_rows
        claim_type: variant_divergence
        grounds:
          - calculations.certified_hours_variant.variants
          - entities.Recruit.credited_hours_total
          - entities.Recruit.scheduled_basis_hours_total
        excluded_because:
          difficulty_instance: dual_variant_calc / attended_basis_vs_scheduled_basis_diverge_on_partial_attendance
          rationale: "That instance already drives both variants off one identical row set and asserts that only ATTENDED_BASIS gates academy_status -> COMPLETE, which subsumes a plain divergence check."

      - name: weighted_scoring_recency_weighted_competency_diverges_from_the_pooled_mean
        claim_type: weighted_scoring
        grounds:
          - calculations.field_training_competency_score.variants
          - entities.FieldTrainingRotation.competency_score
          - entities.FieldTrainingRotation.rolling_mean_score
        excluded_because:
          difficulty_instance: dual_variant_calc / terminal_weighted_vs_rolling_mean_diverge_on_late_slump
          rationale: "The 0.60 / 0.40 recency weighting, the min(3, N) window and the empty-EARLIER fallback are all exercised there, together with the fact that only TERMINAL_WEIGHTED gates the REMEDIAL flip."

      - name: constraint_propagation_probation_schedule_is_a_pinned_forward_pass
        claim_type: constraint_propagation
        grounds:
          - calculations.probation_schedule
          - entities.Recruit.probation_milestone_due_date
          - entities.Recruit.probation_scheduled_end
        excluded_because:
          difficulty_instance: combinatorial_formula / probation_schedule_pinned_four_step_forward_pass
          rationale: "The apparent circularity between milestone date, milestone score, extension days and scheduled end is exactly what that instance pins, including the wrong milestone date a fixed-point implementation would produce."

