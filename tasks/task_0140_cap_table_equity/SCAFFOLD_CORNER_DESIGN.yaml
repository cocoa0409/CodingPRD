      - name: immediate_consistency_issued_shares_in_same_response
        claim_type: immediate
        grounds:
          - entities.CapTable.fields.issued_shares
          - consistency_model
        distinguishing_aspect: "After a share issuance, GET /cap-tables/{id} immediately reflects updated issued_shares in the same request (no lag)."
        test_recipe:
          setup: ["OPEN cap table; COMMON class; issue 250 shares"]
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "ImmCo", authorized_shares: 1000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
