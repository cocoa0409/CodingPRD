              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
              captures: { g_v2: $.data.version }
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "GET /api/gang-orders/${g}"
              as: StevedoreSuperintendent
              captures: { g_v_now: $.data.version }
            - call: "PATCH /api/gang-orders/${g}"
              payload: { required_headcount: 1, expected_gang_order_version: "${g_v_now}" }
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GANG_FULL and HTTP status 409 (filled_headcount 1 == required_headcount 1: the slot count is exactly exhausted)"
            - "GangOrder.${g}: status == MANNED and filled_headcount remains 1"
