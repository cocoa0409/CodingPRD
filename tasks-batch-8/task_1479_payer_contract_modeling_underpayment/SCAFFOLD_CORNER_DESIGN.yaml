          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "no RateEscalator exists for ${contract_id} (list is empty)"

      - name: sm_flag_suspect_does_not_reprice_existing_claims
        claim_type: side_effect_execution
        grounds: ["state_machines.NetworkAgreement.VERIFIED_to_FLAGGED_SUSPECT", "calculations.pricing_contract_resolution"]
        distinguishing_aspect: "Flagging a VERIFIED agreement does NOT reprice claims already WRAP_CONFIRMED under it (claim1 stays 50000), while the next pricing run sees only REGISTERED/FLAGGED_SUSPECT and resolves SILENT_PPO_SUSPECT at full billed charges (claim2 == 100000)."
        test_recipe:
          setup:
            - "payer P with NO contract; agreement WrapNet 5000bp 2026-01-01..2026-12-31 VERIFIED"
            - "claim CL-FS1 (billed 100000, one line) priced -> WRAP_CONFIRMED expected 50000"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer FS", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapNet", wrap_rate_bp: 5000, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na_id: "$.data.id" }
            - call: "POST /api/network-agreements/${na_id}/verify"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-FS1", patient_account_number: "PA-FS1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100000 }
              as: RevenueIntegrityAnalyst
              captures: { claim1: "$.data.id" }
            - call: "POST /api/claims/${claim1}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 100000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim1}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-FS2", patient_account_number: "PA-FS2", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100000 }
              as: RevenueIntegrityAnalyst
              captures: { claim2: "$.data.id" }
            - call: "POST /api/claims/${claim2}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 100000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/network-agreements/${na_id}/flag_suspect"
              as: RevenueIntegrityAnalyst
            - call: "GET /api/claims/${claim1}"
              as: RevenueIntegrityAnalyst
              captures: { exp1: "$.data.expected_reimbursement_cents", nf1: "$.data.network_flag" }
            - call: "POST /api/claims/${claim2}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp2: "$.data.expected_reimbursement_cents", nf2: "$.data.network_flag" }
          assert:
            - "Claim.${claim1} unchanged after flag: expected_reimbursement_cents == 50000 and network_flag == WRAP_CONFIRMED (${exp1}/${nf1})"
            - "Claim.${claim2} priced after flag: network_flag == SILENT_PPO_SUSPECT and expected_reimbursement_cents == 100000 (full billed, no entitled discount) (${nf2}/${exp2})"

      - name: sm_appeal_file_sets_response_due_date
        claim_type: side_effect_execution
        grounds: ["state_machines.Appeal.DRAFT_to_FILED", "calculations.appeal_response_deadline", "entities.Appeal.fields.response_due_date"]
        distinguishing_aspect: "Filing a level-1 appeal on 2026-08-01 stamps filed_date 2026-08-01 and response_due_date 2026-08-31 (RESPONSE_DAYS_LEVEL_1 = 30 calendar days)."
        test_recipe:
          setup: ["case UNDER_REVIEW with DRAFT level-1 appeal (claim 200000, remittance 100000)"]
