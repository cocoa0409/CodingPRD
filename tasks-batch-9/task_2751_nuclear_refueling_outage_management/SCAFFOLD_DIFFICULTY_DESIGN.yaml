  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: rwp_approve_requires_owning_work_order_approved
        entity_pair: [RadiologicalWorkPermit, WorkOrder]
        grounds:
          - validations[priority=7]
          - state_machines.RadiologicalWorkPermit.DRAFT_to_APPROVED
          - errors[ERR_WORK_ORDER_NOT_APPROVED]
        distinguishing_aspect: |
          The gating entity is the permit's OWNING PARENT along the work_order_id foreign key:
          approving the permit is refused while WorkOrder.status is PLANNED and becomes legal the
          moment the very same work order reaches APPROVED, with no change to the permit itself.
          The outage-level guard is satisfied throughout, so the only moving part is the parent
          work order's state.
        test_recipe:
          setup:
            - "Rad area RA-8: dose_rate_mrem_per_hr 25, survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26 in SCOPE_LOCKED. WO1 is APPROVED purely so lock-scope had an approved work order to require; WO2 is PLANNED and owns the permit under test."
            - "RWP on WO2 in DRAFT with committed_dose_mrem 180.00 and alara_review_required false, so no ALARA rule can intrude."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-8", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
