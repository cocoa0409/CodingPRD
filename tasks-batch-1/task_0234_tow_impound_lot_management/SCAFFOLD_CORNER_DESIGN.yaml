# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims in
# §1.1–§1.7 not already probed by §1.8. Sections / claim_types are taken
# verbatim from references/claim-extraction-guide.md.
# Same seven-point per-instance contract as §1.8; same §1.5 reachability gates.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_impound_lot_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.ImpoundLot, endpoints]
        distinguishing_aspect: "POST /impound-lots with all required fields returns 201; status OPEN, rotation_cursor 0, version 1, daily rate echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /impound-lots"
              payload: { name: "Lot CR", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id, st: $.data.status, cur: $.data.rotation_cursor, v: $.data.version }
          assert:
            - "response.status == 201"
            - "ImpoundLot.${lot_id}.status == OPEN"
            - "ImpoundLot.${lot_id}.rotation_cursor == 0"
            - "ImpoundLot.${lot_id}.version == 1"
            - "ImpoundLot.${lot_id}.daily_storage_rate_cents == 5000"

      - name: get_tow_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.TowOrder, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /tow-orders/{nonexistent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tow-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_tow_order_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.TowOrder, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tow-orders omitting required vin -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Lot exists."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot RF", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_tow_order_invalid_enum_tow_type_returns_422
        claim_type: Type Constraints
        grounds: [entities.TowOrder.fields.tow_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tow_type outside {POLICE,PRIVATE,ABANDONED} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Lot exists."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot EN", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "HELICOPTER", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: tow_order_default_status_and_estimate_computed_at_intake
        claim_type: Computed Fields
        grounds: [entities.TowOrder.fields.estimated_storage_cents, entities.TowOrder.fields.status]
        distinguishing_aspect: "On intake, status defaults TOWED and estimated_storage_cents = 5000*30 = 150000 (client cannot set it)."
        test_recipe:
          setup: ["Lot daily=5000, statutory_hold_days=30."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot CF", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id, est: $.data.estimated_storage_cents, st: $.data.status }
          assert:
            - "TowOrder.${order_id}.status == TOWED"
            - "TowOrder.${order_id}.estimated_storage_cents == 150000"

      - name: tow_order_with_bad_lienholder_id_returns_404
        claim_type: Parent Relationships
        grounds: [entities.TowOrder.fields.lienholder_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Referencing a non-existent lienholder_id on intake -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Lot exists; no lienholder created."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot LH", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "PRIVATE", vin: "V", plate: "P", owner_name: "O", owner_address: "A", lienholder_id: "00000000-0000-4000-8000-000000000001" }
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_tow_orders_paginated_envelope
        claim_type: Listing
        grounds: [entities.TowOrder, endpoints]
        distinguishing_aspect: "GET /tow-orders returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One lot with one intaken order."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot PG", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /tow-orders"
              payload: { lot_id: "${lot_id}" }
              as: LotOperator
          assert:
            - "response.response_type == array"
            - "response.data has total_count and has_more fields"
            - "response.data total_count == 1"

      - name: immutable_storage_ledger_entry_has_no_version
        claim_type: Immutability
        grounds: [entities.StorageLedgerEntry]
        distinguishing_aspect: "StorageLedgerEntry has common_fields:false — entries carry id+created_at only, no version field, no mutation endpoint."
        test_recipe:
          setup: ["Order STORED so an ACCRUAL ledger entry exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot IM", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}/ledger-entries"
              payload: {}
              as: LotOperator
          assert:
            - "response.response_type == array"
            - "StorageLedgerEntry[0] has no version field"
            - "StorageLedgerEntry[0].kind == ACCRUAL"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: store_from_already_stored_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TowOrder.TOWED_to_STORED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling store on an order already STORED -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Order STORED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot S2", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: store_without_inventory_returns_inventory_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.TowOrder.TOWED_to_STORED, "errors[ERR_INVENTORY_REQUIRED]"]
        distinguishing_aspect: "store with zero InventoryItems documented -> ERR_INVENTORY_REQUIRED (409)."
        test_recipe:
          setup: ["Order TOWED with NO inventory items."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot IR", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVENTORY_REQUIRED"

      - name: terminal_released_order_rejects_void
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TowOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "void on a RELEASED (terminal) order -> ERR_INVALID_STATE (void only from TOWED/STORED)."
        test_recipe:
          setup: ["Order taken fully to RELEASED (5-day, paid net_due 32500 no lien)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot TL", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/payments"
              payload: { amount_cents: 32500 }
              as: Claimant
              as_user_id: "claimant-x"
            - call: "POST /tow-orders/${order_id}/authorize-release"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/release-records"
              payload: { amount_paid_cents: 0, released_to_name: "Owner" }
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/void"
              payload: {}
              as: PoliceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: send_lienholder_notice_without_lienholder_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Notification.DRAFT_to_SENT, "errors[ERR_NO_LIENHOLDER]"]
        distinguishing_aspect: "Sending a LIENHOLDER-recipient notice on an order with no lienholder_id -> ERR_NO_LIENHOLDER (409)."
        test_recipe:
          setup: ["Order STORED, no lienholder; LIENHOLDER notice in DRAFT."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot NL", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "LIENHOLDER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_LIENHOLDER"

      - name: mark_returned_on_non_certified_notice_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Notification.SENT_to_CERTIFIED_RETURNED, "errors[ERR_METHOD_NOT_CERTIFIED]"]
        distinguishing_aspect: "mark-returned on a SENT EMAIL notice (method != CERTIFIED_MAIL) -> ERR_METHOD_NOT_CERTIFIED (409)."
        test_recipe:
          setup: ["Order STORED; EMAIL owner notice SENT."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot MC", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "EMAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/mark-returned"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_METHOD_NOT_CERTIFIED"

      - name: lift_hold_when_none_returns_no_hold
        claim_type: Invalid Transitions
        grounds: [state_machines.TowOrder, "errors[ERR_NO_HOLD]"]
        distinguishing_aspect: "lift-hold on an order with hold_status NONE -> ERR_NO_HOLD (409) (parallel hold dimension)."
        test_recipe:
          setup: ["Order STORED, hold_status NONE."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot NH", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tow-orders/${order_id}/lift-hold"
              payload: {}
              as: PoliceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_HOLD"

      - name: rotation_expire_before_ttl_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RotationAssignment.OFFERED_to_EXPIRED, "errors[ERR_OFFER_NOT_EXPIRED]"]
        distinguishing_aspect: "expire called while clock <= expires_at -> ERR_OFFER_NOT_EXPIRED (409)."
        test_recipe:
          setup: ["Provider offered with default 30-min TTL; clock at offer instant (not expired)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot ET", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "PE", license_number: "LE", rotation_rank: 1 }
              as: LotOperator
              captures: { p_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /rotation-assignments/${ra}/expire"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OFFER_NOT_EXPIRED"

      - name: rotation_accept_after_ttl_returns_offer_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.RotationAssignment.OFFERED_to_ACCEPTED, "errors[ERR_OFFER_EXPIRED]", "validations[priority=10]"]
        distinguishing_aspect: "accept after clock passes expires_at (offer_ttl 30 min, clock +1h) -> ERR_OFFER_EXPIRED (409)."
        test_recipe:
          setup: ["Provider offered at 2026-01-01T00:00:00Z with 30-min TTL; clock advanced to 2026-01-01T01:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot OE", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "POE", license_number: "LOE", rotation_rank: 1 }
              as: LotOperator
              captures: { p_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}", offer_ttl_minutes: 30 }
              as: LotOperator
              captures: { ra: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: LotOperator
          trigger:
            - call: "POST /rotation-assignments/${ra}/accept"
              payload: {}
              as: TowProvider
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OFFER_EXPIRED"

      - name: auction_open_before_window_start_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Auction.SCHEDULED_to_OPEN, "errors[ERR_AUCTION_WINDOW_NOT_STARTED]"]
        distinguishing_aspect: "open called before window_start -> ERR_AUCTION_WINDOW_NOT_STARTED (409)."
        test_recipe:
          setup: ["Auction scheduled to start 2027-05-01; clock at 2027-04-01."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot AW", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /auctions"
              payload: { lot_id: "${lot_id}", window_start: "2027-05-01T00:00:00Z", window_end: "2027-05-01T06:00:00Z" }
              as: AuctionOfficial
              captures: { auc_id: $.data.id }
          trigger:
            - call: "POST /auctions/${auc_id}/open"
              payload: {}
              as: AuctionOfficial
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_AUCTION_WINDOW_NOT_STARTED"

      - name: reclaim_after_sweep_returns_already_in_auction
        claim_type: Precondition Enforcement
        grounds: [state_machines.TowOrder.AUCTION_ELIGIBLE_to_STORED, "errors[ERR_ALREADY_IN_AUCTION]"]
        distinguishing_aspect: "reclaim on an AUCTION_ELIGIBLE order already swept into an auction (auction_id set) -> ERR_ALREADY_IN_AUCTION (409)."
        test_recipe:
          setup: ["Order AUCTION_ELIGIBLE swept into an OPEN auction."]
          setup_api_calls:
            - call: "POST /_clock/set"
