            - "${e1_status} == DROPPED (now == min drop deadline exactly: the <= boundary is inclusive)"
            - "${e2_drop_err} == ERR_DROP_WINDOW_CLOSED (one second past the boundary)"
            - "${e2_status} == WITHDRAWN and ${e2_grade} == W"
