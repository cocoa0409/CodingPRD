          assert:
            - "err1 == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE (409)"
            - "TakeBackRequest.${tb1}.status remains CREDITED with credit_cents == 6000"

      - name: first_zone_bubbles_site_to_in_service_exactly_once
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CustomerSite.INSTALLED_to_IN_SERVICE
          - endpoints."POST /carpetloop/sites/{site_id}/zones"
        distinguishing_aspect: "The bubble-up fires on the first zone only: site version goes 2 (post-install) to 3 on zone one, and stays 3 after zone two — the parent is mutated exactly when its own status field changes."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED (100 m2); site INSTALLED by inst-bob (version 2)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
          trigger:
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 30 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - &c_get_site
              call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv1: $.data.version, st1: $.data.status }
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-2", area_m2: 20 }
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv2: $.data.version }
          assert:
            - "after zone one: st1 == IN_SERVICE and sv1 == 3 (bubble-up bumped the parent)"
            - "after zone two: sv2 == 3 (no second bubble; child add without parent field change does not bump version)"
            - "TileBatch.${b1}.available_m2 == 50 (100 - 30 - 20)"

      - name: decommission_cascades_to_zones_and_orders
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CustomerSite.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.InstalledZone.IN_SERVICE_to_RECLAIMED
          - state_machines.ReplacementOrder.MATCHED_to_CANCELLED
          - endpoints."POST /carpetloop/sites/{site_id}/decommission"
        distinguishing_aspect: "One decommission call cascades three levels: zones IN_SERVICE -> RECLAIMED, the DRAFT and MATCHED orders -> CANCELLED, and the MATCHED order's reservation release restores the batch from EXHAUSTED back to RELEASED with available_m2 30."
        test_recipe:
          setup:
            - "Collection GAT; batch DL-100 (100 m2) RELEASED. Site IN_SERVICE with zones Z-1 (30 m2) and Z-2 (40 m2) from DL-100 (available 30)."
            - "ORD-1 on Z-1 MATCHED against DL-100 (exact lot, quote 36000; reservation drives available to 0 -> EXHAUSTED)."
            - "ORD-2 on Z-2 left in DRAFT. No in-flight take-backs."
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 30 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-2", area_m2: 40 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z2: $.data.id }
            - *c_get_site
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-1R", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord1: $.data.id }
            - call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv2: $.data.version }
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z2}", reason: "DESIGN_CHANGE", new_zone_code: "Z-2R", expected_site_version: "${sv2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord2: $.data.id }
          trigger:
            - call: "POST /carpetloop/sites/${site1}/decommission"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/zones"
              payload: { site_id: "${site1}" }
              as: PlatformAdmin
            - call: "GET /carpetloop/replacement-orders"
              payload: { site_id: "${site1}" }
              as: PlatformAdmin
            - call: "GET /carpetloop/batches/${b1}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CustomerSite.${site1}.status == DECOMMISSIONED"
            - "both zones RECLAIMED (GET /carpetloop/zones?site_id= shows Z-1 and Z-2 RECLAIMED)"
            - "both orders CANCELLED (GET /carpetloop/replacement-orders?site_id=), ORD-1 cancelled out of MATCHED"
            - "TileBatch.${b1}.available_m2 == 30 and status == RELEASED (reservation release reverted EXHAUSTED)"

      - name: report_fail_revise_resubmit_cycle
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PCFReport.IN_VERIFICATION_to_REJECTED
          - state_machines.PCFReport.REJECTED_to_DRAFT
          - state_machines.PCFReport.DRAFT_to_SUBMITTED
          - endpoints."POST /carpetloop/pcf-reports/{report_id}/revise"
        distinguishing_aspect: "The report revision loop: verification FAIL (findings_count 1) rejects to REJECTED, revise clears the verification metadata and computed values back to DRAFT, and a fresh submit recomputes and lands SUBMITTED again — a legal cycle on a fourth entity beyond the difficulty instances' claim and order loops."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED; REP-1 submitted (operational 6.400) and IN_VERIFICATION under verifier_org EcoAssure."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
          trigger:
            - call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "FAIL", findings_count: 1 }
              as: Verifier
              as_user_id: "ver-dana"
            - call: "POST /carpetloop/pcf-reports/${rep1}/revise"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - *c_submit1
          assert:
            - "after FAIL: status == REJECTED"
            - "after revise: status == DRAFT with submitted_by, verifier_org, verified_by and both variant values cleared to null"
            - "after resubmit: status == SUBMITTED with operational_kgco2e_per_m2 == 6.400 recomputed"
            - "verification FAIL with findings_count 0 would be ERR_INVALID_REQUEST (findings_count >= 1)"

      - name: offsets_rejected_while_claim_is_draft
        claim_type: Precondition Enforcement
        grounds:
          - endpoints."POST /carpetloop/carbon-claims/{id}/offsets"
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Offset retirements are accepted only while the claim is IN_REVIEW or APPROVED: posting an offset to a DRAFT claim fails ERR_INVALID_STATE before any registry/vintage validation runs."
        test_recipe:
          setup: ["Collection GAT; report REP-1 created (still DRAFT — publication not required for claim creation); claim CL-1 created DRAFT."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_rep_gate
            - *c_claim_neutral
          trigger:
            - call: "POST /carpetloop/carbon-claims/${cl1}/offsets"
              payload: { registry: "VERRA", vintage_year: 2022, quantity_kgco2e: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409) — claim must be IN_REVIEW or APPROVED to accept offsets"
            - "CarbonClaim.${cl1}.retired_kgco2e remains 0 and offset_coverage == NONE"

      - name: collect_before_pickup_window_returns_422
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TakeBackRequest.SCHEDULED_to_COLLECTED
          - errors[ERR_COLLECT_WINDOW_NOT_OPEN]
        distinguishing_aspect: "The logical clock gates collection: at 2026-09-01 with the pickup window opening 2026-09-12, collect fails ERR_COLLECT_WINDOW_NOT_OPEN; after the clock advances into the window the same call succeeds."
        test_recipe:
          setup: ["Collection GAT; site INSTALLED; take-back scheduled into [2026-09-12, 2026-09-13]; clock still at 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
