        as: RightsManager
      trigger:
      - call: POST /deals/${deal_id}/payment-milestones/${ms_id}/record-payment
        payload: {}
        as: FinanceController
      assert:
      - PaymentMilestone.${ms_id}.status == CURED (not PAID — record-payment on OVERDUE
        milestone produces CURED)
      - PaymentMilestone.${ms_id}.late_fee_cents > 0 (28 days late × 0.0005 daily
        rate × escalated_amount)
- section: calculations
  instances:
  - name: cumulative_rating_only_counts_confirmed
    claim_type: input_set_filtering
    grounds:
    - entities.Deal.fields.cumulative_rating_basis_points
    - entities.AudienceMeasurement.fields.status
    distinguishing_aspect: Deal.cumulative_rating_basis_points includes only AudienceMeasurement
      rows with status == CONFIRMED; PROVISIONAL, DISPUTED, EXCLUDED all excluded
