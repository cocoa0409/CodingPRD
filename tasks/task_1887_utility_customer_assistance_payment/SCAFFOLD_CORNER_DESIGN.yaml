              as: FieldCrew
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED, HTTP 403"

      - name: specialist_cannot_post_charges
        claim_type: role_operations
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Charges are ProgramAdmin-exclusive; EligibilitySpecialist is denied."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "73 Charge Deny" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 5000 }
              as: EligibilitySpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED, HTTP 403"

      - name: customer_pays_own_account
        claim_type: role_operations
        grounds: [roles, entities.Payment]
        distinguishing_aspect: "Customer with X-User-ID == account id successfully posts a payment to their own account."
        test_recipe:
          setup: ["account with arrearage 3000"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "74 Selfpay St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 3000, effective_on: "2026-08-01" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 3000, tender_type: "CARD" }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { pay_id: "$.data.id", breakdown: "$.data.applied_breakdown" }
          assert:
            - "payment created (201); applied_breakdown.arrearage_cents == 3000; ownership check passed"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_dpa_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dpa-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "A DPA create carrying the account version observed before a successful DPA create is stale: the second create is rejected with 412 and the first DRAFT is NOT superseded."
        test_recipe:
          setup: ["account (v1) with arrearage 120000 (v2 after charge); version v2 captured"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "80 Occ Oaks" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v: "$.data.version" }
          trigger:
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              captures: { dpa1: "$.data.id" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 6, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/dpas"
              payload: { account_id: "${acct_id}" }
              as: ProgramAdmin
          assert:
            - "first create succeeds (account version advanced past the captured one)"
            - "second create with the stale captured version: error_id == ERR_STALE_ACCOUNT_VERSION, HTTP 412"
            - "GET /assistance/dpas?account_id shows total_count == 1 and that DPA's status == DRAFT (loser did not supersede)"

      - name: occ_application_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "Same OCC rule on the other guarded endpoint: an application create carrying a pre-supersede account version is rejected 412, so the older application is never silently withdrawn."
        test_recipe:
          setup: ["account (v1); version captured"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "81 Occ Oaks" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
          trigger:
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app1: "$.data.id" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 600000, current_month_income_cents: 50000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/applications/${app1}"
              payload: {}
              as: CustomerServiceRep
              captures: { app1_status: "$.data.status" }
          assert:
            - "first create succeeds (201)"
            - "second create with the stale captured version: error_id == ERR_STALE_ACCOUNT_VERSION, HTTP 412"
            - "app1 remains SUBMITTED (not withdrawn by the rejected create)"

      - name: selector_waterfall_tiebreak_created_at
        claim_type: selector_policy
        grounds: [calculations.fund_waterfall_allocation]
        distinguishing_aspect: "Equal priority_rank funds are ordered by created_at ASC (never by id): the earlier-created fund fills first; the batch splits 50000/10000 with allocation_sequence 1/2 under one batch_id."
        test_recipe:
          setup: ["account with ACTIVE TIER_1 enrollment; fund F1 (rank 5, 50000) created at clock 2026-08-01; fund F2 (rank 5, 50000) created at clock 2026-08-02; clock back at 2026-08-02 (FY still 2026)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "82 Selector St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "F1", funder_type: "STATE_GRANT", fiscal_year: 2026, appropriated_cents: 50000, priority_rank: 5, eligible_tiers: ["TIER_1"] }
              as: ProgramAdmin
              captures: { f1: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/funding-sources"
              payload: { name: "F2", funder_type: "UTILITY_TRUST", fiscal_year: 2026, appropriated_cents: 50000, priority_rank: 5, eligible_tiers: ["TIER_1"] }
              as: ProgramAdmin
              captures: { f2: "$.data.id" }
          trigger:
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 60000 }
              as: ProgramAdmin
              captures: { a0_fund: "$.data[0].funding_source_id", a0_amt: "$.data[0].amount_cents", a0_seq: "$.data[0].allocation_sequence", a0_batch: "$.data[0].batch_id", a1_fund: "$.data[1].funding_source_id", a1_amt: "$.data[1].amount_cents", a1_seq: "$.data[1].allocation_sequence", a1_batch: "$.data[1].batch_id" }
          assert:
            - "batch row 0: funding_source_id == ${f1}, amount_cents == 50000, allocation_sequence == 1 (earlier created_at wins the rank tie)"
            - "batch row 1: funding_source_id == ${f2}, amount_cents == 10000, allocation_sequence == 2"
            - "both rows share one batch_id; response is ordered by allocation_sequence"

      - name: sweep_idempotent_no_change_no_version_bump
        claim_type: ops_run_checkpoint
        grounds: [calculations.delinquency_tier_computation, entities.CustomerAccount.fields.version]
        distinguishing_aspect: "A sweep that changes nothing bumps nothing: all counters 0 and the account version is identical before and after."
        test_recipe:
          setup: ["account with arrearage 120000 charged 2026-08-01; clock 2026-08-15 (age 14 -> CURRENT, not shutoff-eligible; no certificates/DPAs/enrollments/referrals)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "83 Idle Inn" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_pre: "$.data.version" }
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { c_exp: "$.data.certificates_expired", e_lap: "$.data.enrollments_lapsed", d_def: "$.data.dpas_defaulted", d_bro: "$.data.dpas_broken", r_exp: "$.data.referrals_expired", o_new: "$.data.orders_created", o_blk: "$.data.orders_blocked", o_unb: "$.data.orders_unblocked", o_can: "$.data.orders_cancelled" }
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_post: "$.data.version" }
          assert:
            - "all nine sweep counters == 0 on both runs"
            - "CustomerAccount.${acct_id}.version unchanged across the sweeps (v_post == v_pre) — recomputation without value change is not a mutation"

      - name: suspended_fund_leaves_waterfall
        claim_type: selector_policy
        grounds: [calculations.fund_waterfall_allocation, state_machines.FundingSource.OPEN_to_SUSPENDED]
        distinguishing_aspect: "A SUSPENDED fund is excluded from the eligible set; with no other funds the allocation fails all-or-nothing with ERR_INSUFFICIENT_ASSISTANCE_FUNDS and nothing is pledged."
        test_recipe:
          setup: ["account with ACTIVE TIER_1 enrollment; fund FY2026 appropriated 100000, then suspended"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "84 Suspend St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "Trust 2026", funder_type: "UTILITY_TRUST", fiscal_year: 2026, appropriated_cents: 100000, priority_rank: 1, eligible_tiers: ["TIER_1"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/funding-sources/${fund_id}/suspend"
              payload: {}
              as: ProgramAdmin
              captures: { fund_status: "$.data.status" }
          trigger:
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 10000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/fund-allocations"
              payload: { account_id: "${acct_id}" }
              as: ProgramAdmin
          assert:
            - "fund status == SUSPENDED after suspend"
            - "allocation error_id == ERR_INSUFFICIENT_ASSISTANCE_FUNDS, HTTP 422; allocation list for the account is empty (all-or-nothing, no partial pledge)"

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "transitive_cascade / certificate_expiry_cascade"
          rationale: "N-level cascade end-to-end verification is asserted by the two transitive_cascade difficulty instances."

      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "dual_variant_calc / forgiveness_projected_vs_posted"
          rationale: "Both variants exercised with literal deltas by the two dual_variant_calc difficulty instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_payment_then_read
        claim_type: immediate_consistency
        grounds: [complexity_profile, calculations.payment_application_waterfall]
        distinguishing_aspect: "Immediate consistency: the payment's own response carries the waterfall breakdown, and the very next account read shows the mutated balances — no reconciliation lag."
        test_recipe:
          setup: ["account with arrearage 7000"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "90 Immediate Isle" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 7000, effective_on: "2026-08-01" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 7000, tender_type: "CASH" }
              as: CustomerServiceRep
              captures: { breakdown: "$.data.applied_breakdown" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { arr: "$.data.arrearage_balance_cents", since: "$.data.arrearage_since" }
          assert:
            - "payment response: applied_breakdown.arrearage_cents == 7000"
            - "immediate read: arrearage_balance_cents == 0 and arrearage_since == null in the same logical instant"
