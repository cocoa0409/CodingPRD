- rule_id: resource_temporal_overlap
  applies: true
  rationale: |
    Two independent interval resources exist with deliberately different interval
    semantics: TheatreEngagement books a theatre over a *buffered closed* interval (the
    changeover_buffer_days must separate two engagements), while WeeklyWrap occupies a
    *half-open* week [week_ending_date - 7 days, week_ending_date) per production. Getting
    one right does not give the other for free.
  instances:
  - name: theatre_engagement_buffered_closed_interval_collision
    grounds:
    - §1.1 Theatre.changeover_buffer_days (3)
    - §1.1 TheatreEngagement.start_date, .end_date (immutable entity, common_fields false)
    - §1.6 ERR_THEATRE_ENGAGEMENT_OVERLAP (409)
    distinguishing_aspect: |
      The collision predicate is new.start <= existing.end + buffer AND new.end >=
      existing.start - buffer. With an engagement on [2026-09-01, 2026-09-30] and a
      3-day buffer, a new engagement starting 2026-10-03 collides (it is exactly on the
      buffered edge) while one starting 2026-10-04 is accepted, and the same 2026-10-03
      window at a *different* theatre is always accepted. An implementation using a plain
      overlap test (ignoring the buffer) accepts 2026-10-01; one using a strict inequality
      on the buffered edge accepts 2026-10-03; one that scopes the check globally instead
      of per theatre rejects the second theatre.
    test_recipe:
      setup:
      - |-
        Two theatres, each with changeover_buffer_days 3, and two productions (one per
        theatre) so engagements can be booked. E1 books theatre A for
        [2026-09-01, 2026-09-30].
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /theatres
        payload:
          name: Cort Annex
          seat_count: 900
          top_ticket_price_cents: 14900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th2: $.data.id
      - call: POST /productions
        payload:
          title: The Ledger
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 2000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LLC
          capitalization_target_cents: 90000000
          reserve_target_cents: 1500000
          theatre_id: ${th2}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr2: $.data.id
      - call: POST /theatre-engagements
        payload:
          production_id: ${pr}
          theatre_id: ${th}
          engagement_type: PERFORMANCE_RUN
          start_date: '2026-09-01'
          end_date: '2026-09-30'
        as: GeneralManager
        captures:
          te1: $.data.id
      trigger:
      - call: POST /theatre-engagements
        payload:
          theatre_id: ${th}
          production_id: ${pr}
          engagement_type: PERFORMANCE_RUN
          start_date: '2026-10-03'
          end_date: '2026-11-30'
        as: GeneralManager
        captures:
          err: $.data.error_id
      - call: POST /theatre-engagements
        payload:
          theatre_id: ${th}
          production_id: ${pr}
          engagement_type: PERFORMANCE_RUN
          start_date: '2026-10-04'
          end_date: '2026-11-30'
        as: GeneralManager
        captures:
          te2: $.data.id
      - call: POST /theatre-engagements
        payload:
          theatre_id: ${th2}
          production_id: ${pr2}
          engagement_type: PERFORMANCE_RUN
          start_date: '2026-10-03'
          end_date: '2026-11-30'
        as: GeneralManager
        captures:
          te3: $.data.id
      - call: GET /theatre-engagements?theatre_id=${th}
        as: GeneralManager
      - call: GET /theatre-engagements?theatre_id=${th2}
        as: GeneralManager
      - call: GET /theatre-engagements/${te1}
        as: GeneralManager
      assert:
      - The 2026-10-03 booking at theatre ${th} returns HTTP 409 with error.code == "ERR_THEATRE_ENGAGEMENT_OVERLAP" (2026-09-30 + 3 buffer days == 2026-10-03, and the buffered edge is inclusive)
      - The 2026-10-04 booking at theatre ${th} returns HTTP 201 with start_date == "2026-10-04", end_date == "2026-11-30"
      - The 2026-10-03 booking at theatre ${th2} returns HTTP 201 (the check is scoped per theatre)
      - 'GET /theatre-engagements?theatre_id=${th}: total_count == 2 (${te1} plus the 2026-10-04 engagement)'
      - 'GET /theatre-engagements?theatre_id=${th2}: total_count == 1'
      - 'GET /theatre-engagements/${te1}: no version field is present (immutable entity, common_fields false)'
