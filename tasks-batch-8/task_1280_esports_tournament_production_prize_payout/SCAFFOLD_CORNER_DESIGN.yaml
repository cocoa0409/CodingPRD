        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_CASE_STATUS]", "state_machines.IntegrityCase"]
        distinguishing_aspect: "RESOLVE against a terminal IntegrityCase (RESOLVED_VIOLATION) is rejected with ERR_INVALID_CASE_STATUS — terminal lockdown on the case machine."
        test_recipe:
          setup: ["integrity case c1 already RESOLVED_VIOLATION"]
          setup_api_calls:
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/integrity-cases", payload: { player_id: "${p1}", evidence_summary: "sig 1" }, as: AntiCheatInvestigator, as_user_id: "ac-1", captures: { c1: $.data.id } }
            - { call: "POST /api/integrity-cases/${c1}/resolve", payload: { action: BEGIN_INVESTIGATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases/${c1}/resolve", payload: { action: RESOLVE, outcome: VIOLATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
          trigger:
            - { call: "POST /api/integrity-cases/${c1}/resolve", payload: { action: RESOLVE, outcome: CLEARED }, as: AntiCheatInvestigator, as_user_id: "ac-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_CASE_STATUS; IntegrityCase.${c1}.status == RESOLVED_VIOLATION and strike_issued == true (unchanged)"

  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check (priority 1 precedes all)."
        test_recipe:
          setup: ["one player exists"]
          setup_api_calls:
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /api/players/${p1}", as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "request is sent without X-User-Role and X-User-ID headers; response 401 with error_id == ERR_UNAUTHENTICATED"

      - name: player_cannot_generate_bracket_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles"]
        distinguishing_aspect: "Role check precedes state check: Player calling generate-bracket on a DRAFT tournament gets ERR_FORBIDDEN (403), not ERR_INVALID_TOURNAMENT_STATUS."
        test_recipe:
          setup: ["tournament t in DRAFT; player p1 exists"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "RBAC Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id, tv: $.data.version } }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: Player, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (http 403); Tournament.${t}.status == DRAFT"

      - name: team_manager_cannot_review_own_registration
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
