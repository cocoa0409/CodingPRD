              as_user_id: "${prv_a}"
            - call: "POST /support-sessions/${ssn_id}/complete"
              payload: { minutes_delivered: 30 }
              as: SupportProviderStaff
              as_user_id: "${prv_a}"
          assert:
            - "the first call returns HTTP 409 with ERR_SESSION_STATE_INVALID and ProctorSession.${ses_id}.status stays COMPLETED with score_percent 80.00 and no_show_note null"
            - "the second call returns HTTP 409 with ERR_PROVIDER_CENTER_MISMATCH because ${prv_b} sits at center ${ctr_b} while the placement sits at ${ctr_a}"
            - "the third call returns HTTP 201 on the identical interval with provider ${prv_a}, proving the refusal was about the center and not the interval"
            - "the fourth call returns HTTP 200 with SupportSession.${ssn_id}.status == COMPLETED and minutes_delivered == 45"
            - "the fifth call returns HTTP 409 with ERR_SUPPORT_SESSION_STATE_INVALID and minutes_delivered stays 45, not 30"
            - "Placement.${pl_id}.support_sessions_completed == 1 and SupportProvider.${prv_b}.scheduled_session_count == 0"

      - name: re_entry_request_below_readiness_threshold_rejected
