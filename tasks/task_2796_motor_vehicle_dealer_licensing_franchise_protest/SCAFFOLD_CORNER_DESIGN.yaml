            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_l1_id}/amend"
              payload: { proposed_effective_on: "2026-12-15" }
              as: Manufacturer
              as_user_id: "${mfr_l1_id}"
              captures: { fil_l1_v_fresh: $.data.version }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_l1_id}", protestant_dealer_id: "${dlr_l1_id}", grounds_code: "NO_GOOD_CAUSE_FOR_TERMINATION", expected_franchise_filing_version: "${fil_l1_v_stale}" }
              as: Dealer
              as_user_id: "${dlr_l1_id}"
            - call: "POST /dealer-board/protests"
