      - name: degradation_within_allowance_outranks_no_replaceable_module
        claim_type: priority_ordering
        grounds:
          - validations[priority=48]
          - validations[priority=49]
          - errors.ERR_DEGRADATION_WITHIN_ALLOWANCE
          - errors.ERR_NO_REPLACEABLE_MODULE
        distinguishing_aspect: |
          Both rules fire on the same assess call against a cabinet that has no
          INSTALLED modules at all, and they disagree about the answer: priority 48
          (the credit is zero, so there is nothing to claim, 422) must be reported
          ahead of priority 49 (there is nothing to swap, 409). The pair also has
          different HTTP statuses, so an implementation that runs the cheap
          "is a replaceable module available" lookup first returns 409 for the
          within-allowance case and silently changes the contract's story from
          "your wall is within warranty spec" to "we are out of spares".
