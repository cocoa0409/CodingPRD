              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - *cvH_cycle
            - *cvH_charge
            - *cvB_clk_0900
            - *cvH_start
            - *cvB_clk_1000
            - *cvH_cool
            - *cvB_clk_1035
            - *cvH_demold
            - *cvH_list_units
            - *cvH_trim1
            - *cvH_outfit1
            - *cvH_inspect1
