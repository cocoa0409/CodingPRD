              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9402", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-11T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { lv1_b_id: $.data.id }
            - call: "POST /exams/${lv1_b_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
