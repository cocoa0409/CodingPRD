# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# excluded_because stubs point at §1.8 instances that already cover the corner.
# Logical-clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_marina_returns_201_with_zeroed_counters
        claim_type: Creation
        grounds:
          - 'entities.Marina'
          - 'endpoints."POST /marina/marinas"'
        distinguishing_aspect: "POST with all required fields returns 201 and computed counters initialized to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marina/marinas"
              payload: { name: "New Marina", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 3 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
          assert:
            - "Marina.${marina_id}.available_slip_count == 0"
            - "Marina.${marina_id}.occupied_slip_count == 0"
            - "Marina.${marina_id}.liveaboard_count == 0"
            - "Marina.${marina_id}.waitlist_length == 0"
            - "Marina.${marina_id}.version == 1"

      - name: marina_negative_liveaboard_cap_returns_400
        claim_type: Type Constraints
        grounds:
          - 'entities.Marina.fields.liveaboard_cap'
          - 'errors[ERR_LIVEABOARD_CAP_NEGATIVE]'
        distinguishing_aspect: "liveaboard_cap of -1 is rejected with ERR_LIVEABOARD_CAP_NEGATIVE (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marina/marinas"
              payload: { name: "Bad", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: -1 }
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_LIVEABOARD_CAP_NEGATIVE"

      - name: marina_invalid_date_range_returns_400
        claim_type: Type Constraints
        grounds:
          - 'entities.Marina.fields.season_end_date'
          - 'errors[ERR_INVALID_DATE_RANGE]'
        distinguishing_aspect: "season_end before season_start is rejected with ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marina/marinas"
              payload: { name: "Bad", season_start_date: "2026-10-31", season_end_date: "2026-05-01", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_DATE_RANGE"

      - name: create_boater_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - 'entities.Boater.fields.residency_status'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "Omitting residency_status on boater create returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marina/boaters"
              payload: { full_name: "No Res", email: "nores@example.com" }
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_VALIDATION"

      - name: get_permit_not_found_returns_404
        claim_type: Not Found
        grounds:
          - 'endpoints."GET /marina/permits/{permit_id}"'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "GET on a non-existent permit id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /marina/permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_NOT_FOUND"

      - name: computed_fee_basis_copied_from_residency
        claim_type: Computed Fields
        grounds:
          - 'entities.Permit.fields.fee_basis'
          - 'entities.Permit.fields.priority_tier'
        excluded_because:
          difficulty_instance: "combinatorial_formula / permit_fee_gross_tiered_multiplier_mode_a"
          rationale: "That instance asserts fee_basis == NON_RESIDENT on the created permit, exercising the computed copy."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_active_permit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.Permit'
          - 'endpoints."POST /marina/permits/{permit_id}/cancel"'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "cancel targets WAITLISTED/OFFERED only; cancelling an ACTIVE permit returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE permit."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Cx", email: "cx@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Cxv", length_ft: 30, registration_number: "REG-CX", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
          trigger:
            - call: "POST /marina/permits/${permit_id}/cancel"
              payload: {}
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_STATE"
            - "Permit.${permit_id}.status == ACTIVE"

      - name: revoke_waitlisted_permit_returns_not_active
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.Permit'
          - 'endpoints."POST /marina/permits/{permit_id}/revoke"'
          - 'errors[ERR_PERMIT_NOT_ACTIVE]'
        distinguishing_aspect: "revoke requires ACTIVE/SUSPENDED; revoking a WAITLISTED permit returns ERR_PERMIT_NOT_ACTIVE."
        test_recipe:
          setup: ["A WAITLISTED permit (only berth already OFFERED to someone else)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "One", email: "one@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater1: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater1}", name: "V1", length_ft: 30, registration_number: "REG-W1", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel1: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater1}", vessel_id: "${vessel1}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit1: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Two", email: "two@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater2: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater2}", name: "V2", length_ft: 30, registration_number: "REG-W2", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel2: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater2}", vessel_id: "${vessel2}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit2: $.data.id }
          trigger:
            - call: "POST /marina/permits/${permit2}/revoke"
              payload: {}
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_PERMIT_NOT_ACTIVE"
            - "Permit.${permit2}.status == WAITLISTED"

      - name: draw_before_close_date_returns_not_closed
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.LotteryRound.OPEN_to_DRAWN'
          - 'validations[priority=13]'
          - 'errors[ERR_ROUND_NOT_CLOSED_FOR_DRAW]'
        distinguishing_aspect: "Draw while clock is still within the entry window returns ERR_ROUND_NOT_CLOSED_FOR_DRAW."
        test_recipe:
          setup: ["An OPEN round with entry_close 2026-04-10; clock at 2026-04-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/lottery-rounds"
              payload: { marina_id: "${marina_id}", season_year: 2026, berth_type: "SLIP", entry_open_date: "2026-04-01", entry_close_date: "2026-04-10", berth_ids: ["${berth_id}"] }
              as: Harbormaster
              captures: { round_id: $.data.id }
          trigger:
            - call: "POST /marina/lottery-rounds/${round_id}/draw"
              payload: {}
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_ROUND_NOT_CLOSED_FOR_DRAW"
            - "LotteryRound.${round_id}.status == OPEN"

      - name: claim_entry_not_won_returns_invalid
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.LotteryEntry.WON_to_CLAIMED'
          - 'errors[ERR_ENTRY_NOT_WON]'
        distinguishing_aspect: "Claiming an entry still in ENTERED (round not drawn) returns ERR_ENTRY_NOT_WON."
        test_recipe:
          setup: ["An ENTERED lottery entry in an undrawn round."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/lottery-rounds"
              payload: { marina_id: "${marina_id}", season_year: 2026, berth_type: "SLIP", entry_open_date: "2026-04-01", entry_close_date: "2026-04-10", berth_ids: ["${berth_id}"] }
              as: Harbormaster
              captures: { round_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Ent E", email: "ent@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Ev", length_ft: 30, registration_number: "REG-EN", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/lottery-entries"
              payload: { round_id: "${round_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}" }
              as: Harbormaster
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /marina/lottery-entries/${entry_id}/claim"
              payload: {}
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_ENTRY_NOT_WON"
            - "LotteryEntry.${entry_id}.status == ENTERED"

      - name: cancel_offered_permit_frees_berth_and_voids_invoice
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Permit.OFFERED_to_DECLINED'
          - 'state_machines.Berth.RESERVED_to_AVAILABLE'
          - 'state_machines.Invoice.UNPAID_to_VOID'
        distinguishing_aspect: "Cancelling an OFFERED permit sets it DECLINED, frees the berth to AVAILABLE, and VOIDs its invoice."
        test_recipe:
          setup: ["An OFFERED permit with an UNPAID invoice on a reserved berth."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Dec D", email: "dec@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Dv", length_ft: 30, registration_number: "REG-DC", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
          trigger:
            - call: "POST /marina/permits/${permit_id}/cancel"
              payload: {}
              as: Harbormaster
          assert:
            - "Permit.${permit_id}.status == DECLINED"
            - "Berth.${berth_id}.status == AVAILABLE"
            - "Invoice.${inv_id}.status == VOID"

      - name: derelict_impound_full_cascade
        claim_type: Cross-entity
        grounds:
          - 'state_machines.DerelictReport.NOTICE_SERVED_to_IMPOUNDED'
        excluded_because:
          difficulty_instance: "transitive_cascade / derelict_impound_revoke_release_promote_depth4"
          rationale: "The depth-4 cascade instance asserts vessel REVOKED, permit REVOKED, berth freed, and waitlist promotion."

  # ===========================================================================
  - section: calculations
    instances:
      - name: ramp_pass_fee_seasonal_nonresident_correct
        claim_type: Correct Result
        grounds:
          - 'calculations.ramp_pass_fee'
          - 'entities.RampPass.fields.fee_cents'
        distinguishing_aspect: "A SEASONAL ramp pass for a NON_RESIDENT boater is priced at exactly 20000 cents."
        test_recipe:
          setup: ["NON_RESIDENT boater with a registered vessel."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "RampNon N", email: "rn@example.com", residency_status: "NON_RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Skiff", length_ft: 18, registration_number: "REG-RN", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /marina/ramp-passes"
              payload: { boater_id: "${boater_id}", vessel_id: "${vessel_id}", pass_type: "SEASONAL", valid_from_date: "2026-05-01", valid_to_date: "2026-10-31" }
              as: Harbormaster
              captures: { pass_id: $.data.id }
          assert:
            - "RampPass.${pass_id}.fee_cents == 20000"
            - "RampPass.${pass_id}.fee_basis == NON_RESIDENT"

      - name: lottery_draw_resident_priority_over_entry_order
        claim_type: Correct Result
        grounds:
          - 'calculations.lottery_draw'
          - 'state_machines.LotteryRound.OPEN_to_DRAWN'
          - 'state_machines.LotteryEntry.ENTERED_to_WON'
          - 'state_machines.LotteryEntry.ENTERED_to_LOST'
        distinguishing_aspect: "With one berth, a RESIDENT entrant (entered second, draw_number 2) beats a NON_RESIDENT entrant (draw_number 1) because priority_tier ranks before draw_number."
        test_recipe:
          setup: ["Round for one SLIP berth; NON_RESIDENT enters first, RESIDENT enters second; draw after entry_close."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/lottery-rounds"
              payload: { marina_id: "${marina_id}", season_year: 2026, berth_type: "SLIP", entry_open_date: "2026-04-01", entry_close_date: "2026-04-10", berth_ids: ["${berth_id}"] }
              as: Harbormaster
              captures: { round_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "NonRes First", email: "nf@example.com", residency_status: "NON_RESIDENT" }
              as: Harbormaster
              captures: { boaterN: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boaterN}", name: "Nv", length_ft: 30, registration_number: "REG-LN", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vesselN: $.data.id }
            - call: "POST /marina/lottery-entries"
              payload: { round_id: "${round_id}", boater_id: "${boaterN}", vessel_id: "${vesselN}" }
              as: Harbormaster
              captures: { entryN: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Res Second", email: "rs@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boaterR: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boaterR}", name: "Rv", length_ft: 30, registration_number: "REG-LR", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vesselR: $.data.id }
            - call: "POST /marina/lottery-entries"
              payload: { round_id: "${round_id}", boater_id: "${boaterR}", vessel_id: "${vesselR}" }
              as: Harbormaster
              captures: { entryR: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/lottery-rounds/${round_id}/draw"
              payload: {}
              as: Harbormaster
          assert:
            - "LotteryEntry.${entryR}.status == WON"
            - "LotteryEntry.${entryR}.awarded_berth_id == ${berth_id}"
            - "LotteryEntry.${entryN}.status == LOST"

      - name: permit_fee_final_proration_rounding
        claim_type: Precision
        grounds:
          - 'calculations.permit_fee'
        excluded_because:
          difficulty_instance: "combinatorial_formula / permit_fee_proration_rounding_order_mode_b"
          rationale: "Per-component rounding order (157066 vs 157065) is asserted by the mode_b difficulty instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: pay_partial_amount_returns_amount_mismatch
        claim_type: Violation -> Error
        grounds:
          - 'validations[priority=12]'
          - 'errors[ERR_PAYMENT_AMOUNT_MISMATCH]'
        distinguishing_aspect: "Paying less than amount_due on an UNPAID invoice returns ERR_PAYMENT_AMOUNT_MISMATCH."
        test_recipe:
          setup: ["An OFFERED permit with an UNPAID PERMIT invoice for 120000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
