            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { prog_b: $.data.id }
