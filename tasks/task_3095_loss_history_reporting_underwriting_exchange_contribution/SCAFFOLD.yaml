# =============================================================================
# PRD Benchmark Scaffold — task_3095
# Loss History Reporting & Underwriting Exchange Contribution
# (shared insurance loss-history exchange, CLUE-style)
#
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9). Neither key
# appears here.
# =============================================================================

scenario: |
  Loss History Reporting & Underwriting Exchange Contribution (LexisNexis Risk
  Solutions): carrier contribution of claim records to a shared loss history
  exchange with standardized coding, report delivery at quote with matching on
  individual, address and vehicle identifiers, permissible purpose validation
  and consumer disclosure obligations, consumer file access and dispute of
  inaccurate loss records with reinvestigation timelines, match confidence
  handling to avoid attributing another household's losses, retention periods
  limiting how far back losses are reported, contributory data reciprocity
  requiring carriers to supply data to receive reports, adverse action support
  when a report influences pricing or declination

domain_name: loss-history-exchange
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - optimistic_concurrency
  difficulty_directive: |
    The scenario instruction demands a task much harder than expert level.
    This scaffold answers with structural density, not table count: three
    distinct tiered scoring formulas with per-instance match-grade inputs, a
    four-level match-disposition threshold ladder with exact-boundary
    semantics, a cascading freeze chain from a single compliance action
    (report freeze -> outstanding-inquiry rejection -> adverse-action
    obligation -> dispute reinvestigation clock), and a time-driven lifecycle
    (correction hold expiry, data freeze expiry, retention redaction, dispute
    reinvestigation deadlines) all driven by one logical clock. Every surface
    decision is pinned by an explicit rule — no fuzzy adjectives, no random
    tie-breaks, no unspecified selectors.
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: naic_code, type: string, source: input, description: "NAIC carrier code, unique", constraints: "unique across all carriers" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | ACTIVE | SUSPENDED | WITHDRAWN", default: "PROVISIONAL" }
      - { name: contribution_lag_days, type: integer, source: computed, description: "Days since the most recent ACCEPTED ContributionBatch in COMPLETED status; never negative" }
      - { name: accepted_batch_count, type: integer, source: computed, description: "Count of ContributionBatch rows in COMPLETED status", default: 0 }
      - { name: accepted_claim_count, type: integer, source: computed, description: "Count of LossClaim rows contributed by this carrier whose status is ACTIVE", default: 0 }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date of birth, YYYY-MM-DD" }
      - { name: address_line, type: string, source: input, description: "Current address line (free text)" }
      - { name: driver_license_number, type: string, source: input, description: "Driver license number used as an individual identifier" }
      - { name: file_frozen, type: boolean, source: system, description: "True while a data freeze is in force; blocks report issuance and file disclosure", default: false }
      - { name: frozen_until, type: datetime, source: system, description: "Logical-clock instant at which the freeze auto-lifts; null when not frozen", default: null }

  - name: ContributionBatch
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; contributing carrier" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: claim_count, type: integer, source: computed, description: "Number of claims recorded in this batch", default: 0 }
      - { name: accepted_count, type: integer, source: computed, description: "Claims accepted into the exchange", default: 0 }
      - { name: rejected_count, type: integer, source: computed, description: "Claims rejected with a standardized rejection code", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | VALIDATED | COMPLETED | FAILED | VOIDED" }

  - name: LossClaim
    parent: Carrier
    common_fields: true
    fields:
      - { name: contributing_carrier_id, type: string, source: system, description: "FK -> Carrier.id; carrier that contributed the claim" }
      - { name: batch_id, type: string, source: system, description: "FK -> ContributionBatch.id; batch this claim arrived in" }
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; consumer the loss is attributed to" }
      - { name: policy_number, type: string, source: input, description: "Contributing carrier's policy number" }
      - { name: claim_number, type: string, source: input, description: "Carrier-side claim number", constraints: "unique per contributing_carrier_id" }
      - { name: loss_date, type: string, source: input, description: "ISO 8601 date of loss, YYYY-MM-DD" }
      - { name: loss_type, type: enum, source: input, description: "COLLISION | COMPREHENSIVE | LIABILITY | PROPERTY | OTHER" }
      - { name: cause_of_loss_code, type: string, source: input, description: "Standardized cause-of-loss code, 1-8 uppercase alphanumerics", constraints: "^[A-Z0-9]{1,8}$" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Amount paid on the claim in cents; zero allowed (closed without payment)", constraints: ">= 0" }
      - { name: claim_status_code, type: enum, source: input, description: "OPEN | CLOSED_WITH_PAYMENT | CLOSED_WITHOUT_PAYMENT | SUBROGATED" }
      - { name: vehicle_identifier, type: string, source: input, description: "VIN or empty string when no vehicle is associated", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_DISPUTE | AMENDED | WITHDRAWN" }
      - { name: amendment_of_id, type: string, source: system, description: "FK -> LossClaim.id; the ACTIVE claim this row supersedes when created as an amendment", default: null }
      - { name: retention_expires_on, type: string, source: system, description: "ISO 8601 date loss_date + 7 years; claim is reportable strictly before this date" }

  - name: QuoteInquiry
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; inquiring carrier" }
      - { name: subject_name, type: string, source: input, description: "Applicant name to match" }
      - { name: subject_dob, type: string, source: input, description: "Applicant date of birth, YYYY-MM-DD" }
      - { name: subject_address, type: string, source: input, description: "Applicant address" }
      - { name: subject_driver_license, type: string, source: input, description: "Applicant driver license number" }
      - { name: subject_vehicle_identifier, type: string, source: input, description: "Applicant VIN or empty string", default: "" }
      - { name: permissible_purpose, type: enum, source: input, description: "UNDERWRITING | CLAIMS | CONSUMER_REQUEST" }
      - { name: matched_consumer_id, type: string, source: system, description: "FK -> Consumer.id; resolved subject consumer", default: null }
      - { name: individual_match_grade, type: enum, source: system, description: "EXACT | FUZZY | MISMATCH | ABSENT — highest grade across candidate bundles" }
      - { name: address_match_grade, type: enum, source: system, description: "EXACT | FUZZY | MISMATCH | ABSENT" }
      - { name: vehicle_match_grade, type: enum, source: system, description: "EXACT | FUZZY | MISMATCH | ABSENT" }
      - { name: match_score, type: integer, source: system, description: "Identity match score, 0..10050" }
      - { name: match_disposition, type: enum, source: system, description: "DEFINITE | PROBABLE | POSSIBLE | UNMATCHED" }
      - { name: report_id, type: string, source: system, description: "FK -> LossHistoryReport.id; the issued report", default: null }
      - { name: report_blocked_reason, type: enum, source: system, description: "NONE | FROZEN | RECIPROCITY — why no report was attached", default: "NONE" }
      - { name: status, type: enum, source: system, description: "RESOLVED" }

  - name: LossHistoryReport
    parent: QuoteInquiry
    common_fields: true
    fields:
      - { name: inquiry_id, type: string, source: system, description: "FK -> QuoteInquiry.id; generating inquiry" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; receiving carrier" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; matched subject" }
      - { name: match_disposition, type: enum, source: system, description: "DEFINITE | PROBABLE | POSSIBLE — UNMATCHED inquiries receive no report" }
      - { name: risk_score_certainty, type: number, source: computed, description: "Identity match certainty, 0.00..100.50 with 2 decimals" }
      - { name: risk_score_count, type: integer, source: computed, description: "Included loss count x risk_score_certainty (count variant)" }
      - { name: risk_score_premium_weighted_cents, type: integer, source: computed, description: "Premium-weighted risk score in cents" }
      - { name: claim_count_reported, type: integer, source: computed, description: "Number of claims included after retention and status filtering" }
      - { name: status, type: enum, source: system, description: "ISSUED | FROZEN" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock issuance timestamp" }

  - name: ReportClaimEntry
    parent: LossHistoryReport
    common_fields: false
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> LossHistoryReport.id; owning report" }
      - { name: loss_claim_id, type: string, source: system, description: "FK -> LossClaim.id; claim snapshotted into the report" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; subject (denormalized for reverse lookup)" }
      - { name: entry_sequence, type: integer, source: system, description: "Position within the report, 1-based, in loss_date DESC / created_at ASC order" }
      - { name: loss_date, type: string, source: system, description: "Snapshot of LossClaim.loss_date" }
      - { name: loss_type, type: string, source: system, description: "Snapshot of LossClaim.loss_type" }
      - { name: cause_of_loss_code, type: string, source: system, description: "Snapshot of LossClaim.cause_of_loss_code" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Snapshot of LossClaim.paid_amount_cents" }
      - { name: claim_status_code, type: string, source: system, description: "Snapshot of LossClaim.claim_status_code" }
      - { name: contributing_carrier_id, type: string, source: system, description: "FK -> Carrier.id; snapshot of the contributing carrier" }

  - name: ConsumerDispute
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; disputing consumer" }
      - { name: loss_claim_id, type: string, source: input, description: "FK -> LossClaim.id; disputed claim" }
      - { name: dispute_reason, type: enum, source: input, description: "NOT_MY_CLAIM | WRONG_AMOUNT | WRONG_DATE | ALREADY_REMOVED | OTHER" }
      - { name: dispute_statement, type: string, source: input, description: "Free-text consumer statement, max 2000 chars" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing timestamp" }
      - { name: reinvestigation_due_at, type: datetime, source: system, description: "Logical-clock reinvestigation deadline (filed_at + 30 days)" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock resolution timestamp", default: null }
      - { name: resolution_code, type: enum, source: system, description: "null | VERIFIED_ACCURATE | AMENDED | DELETED", default: null }
      - { name: resolution_notes, type: string, source: system, description: "Reinvestigation outcome notes", default: "" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REINVESTIGATION | RESOLVED_VERIFIED | RESOLVED_AMENDED | RESOLVED_DELETED" }

  - name: AdverseActionNotice
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; carrier taking adverse action" }
      - { name: report_id, type: string, source: input, description: "FK -> LossHistoryReport.id; report that influenced the decision" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; subject consumer (derived from the report)" }
      - { name: action_type, type: enum, source: input, description: "DECLINE | RATE_INCREASE | NON_RENEWAL | CANCELLATION" }
      - { name: notice_reason_codes, type: array, source: input, description: "Ordered list of reason codes, 1-5 items, each ^[A-Z0-9-]{2,16}$" }
      - { name: report_influence_rank, type: integer, source: input, description: "1 = report was the primary factor; 2 = contributing factor; 3 = marginal", constraints: "1..3" }
      - { name: disclosure_deadline, type: datetime, source: system, description: "Logical-clock timestamp, created_at + 5 days" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED | CANCELLED" }

  - name: ExchangeRule
    parent: null
    common_fields: true
    fields:
      - { name: retention_years, type: integer, source: system, description: "How far back losses are reportable", default: 7 }
      - { name: reinvestigation_days, type: integer, source: system, description: "Dispute reinvestigation deadline", default: 30 }
      - { name: correction_hold_days, type: integer, source: system, description: "Per-claim hold after a dispute is filed before a stale batch may freeze", default: 45 }
      - { name: data_freeze_days, type: integer, source: system, description: "Duration of a compliance data freeze", default: 60 }
      - { name: reciprocity_lag_threshold_days, type: integer, source: system, description: "Contribution lag at or beyond which reciprocity gating engages", default: 45 }
      - { name: max_outstanding_inquiries, type: integer, source: system, description: "Cap on outstanding (non-cancelled) adverse-action notices per carrier", default: 50 }
      - { name: min_batch_claims, type: integer, source: system, description: "Minimum claims per contribution batch", default: 1 }
      - { name: max_batch_claims, type: integer, source: system, description: "Maximum claims per contribution batch", default: 500 }
      - { name: disclosure_window_days, type: integer, source: system, description: "Adverse-action disclosure deadline", default: 5 }
      - { name: premium_weight_cap_cents, type: integer, source: system, description: "Per-claim cap applied before premium weighting", default: 500000 }

  - name: ContributionAuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; affected carrier" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; affected consumer, or null for carrier-scoped events", default: null }
      - { name: event_type, type: enum, source: system, description: "BATCH_RECEIVED | BATCH_COMPLETED | BATCH_FAILED | BATCH_VOIDED | BATCH_FROZEN_BY_CORRECTION | CLAIM_ACCEPTED | CLAIM_REJECTED | CLAIM_AMENDED | CLAIM_WITHDRAWN | REPORT_ISSUED | REPORT_FROZEN | DISPUTE_FILED | DISPUTE_REINVESTIGATED | DISPUTE_OVERDUE | DISPUTE_RESOLVED | ADVERSE_ACTION_FILED | ADVERSE_ACTION_SENT | ADVERSE_ACTION_ACKNOWLEDGED | DATA_FREEZE_APPLIED | DATA_FREEZE_LIFTED | CARRIER_SUSPENDED | CARRIER_REACTIVATED | RETENTION_REDACTED" }
      - { name: event_at, type: datetime, source: system, description: "Logical-clock event timestamp" }
      - { name: details, type: object, source: system, description: "Event payload (ids, counts, codes)", default: {} }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: PROVISIONAL
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "system (automatic when the carrier's first ContributionBatch reaches COMPLETED with accepted_count >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier.status -> ACTIVE"
          - "append ContributionAuditEvent CARRIER_REACTIVATED (same event type used for first activation and reactivation)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when contribution_lag_days >= ExchangeRule.reciprocity_lag_threshold_days at clock evaluation)"
        actor: system
        preconditions: []
        side_effects:
          - "append ContributionAuditEvent CARRIER_SUSPENDED with details.contribution_lag_days"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when a new COMPLETED batch brings contribution_lag_days back below the threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "append ContributionAuditEvent CARRIER_REACTIVATED"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /carriers/{carrierId}/withdraw"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "no ContributionBatch of this carrier is in RECEIVED or VALIDATED"
        side_effects:
          - "the carrier's ACTIVE LossClaims remain stored but are excluded from future reports"
          - "outstanding QuoteInquiry reads for this carrier are unaffected; new POST /carriers/{id}/inquiries is rejected"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /carriers/{carrierId}/withdraw"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "no ContributionBatch of this carrier is in RECEIVED or VALIDATED"
        side_effects:
          - "same as ACTIVE -> WITHDRAWN"

  - entity: ContributionBatch
    initial_state: RECEIVED
    terminal_states: [COMPLETED, FAILED, VOIDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "system (automatic on receipt, after per-claim standardized-coding validation has run and claim_count/accepted_count/rejected_count are recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "claim_count = number of claims in the payload"
          - "accepted_count/rejected_count recorded"
          - "append ContributionAuditEvent BATCH_RECEIVED"
      - from: VALIDATED
        to: COMPLETED
        trigger: "system (automatic immediately after validation when accepted_count >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "each accepted claim becomes LossClaim status ACTIVE with retention_expires_on = loss_date + ExchangeRule.retention_years years"
          - "Carrier.accepted_batch_count += 1; Carrier.accepted_claim_count += accepted_count"
          - "Carrier.contribution_lag_days recomputed from this batch's submitted_at"
          - "if Carrier was SUSPENDED and lag is now below threshold: Carrier -> ACTIVE (cascade)"
          - "if Carrier was PROVISIONAL and accepted_count >= 1: Carrier -> ACTIVE (cascade)"
          - "append ContributionAuditEvent BATCH_COMPLETED"
      - from: VALIDATED
        to: FAILED
        trigger: "system (automatic immediately after validation when accepted_count == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "append ContributionAuditEvent BATCH_FAILED"
      - from: RECEIVED
        to: VOIDED
        trigger: "POST /batches/{batchId}/void"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "batch status is RECEIVED or VALIDATED"
        side_effects:
          - "append ContributionAuditEvent BATCH_VOIDED"
      - from: VALIDATED
        to: VOIDED
        trigger: "POST /batches/{batchId}/void"
        actor: ExchangeComplianceOfficer
        preconditions: []
        side_effects:
          - "append ContributionAuditEvent BATCH_VOIDED"

  - entity: LossClaim
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: UNDER_DISPUTE
        trigger: "POST /consumers/{consumerId}/disputes (dispute filed against this claim)"
        actor: Consumer
        preconditions:
          - "claim status is ACTIVE"
          - "no other ConsumerDispute against this claim is in FILED or UNDER_REINVESTIGATION"
        side_effects:
          - "claim excluded from newly issued LossHistoryReport inclusion sets while UNDER_DISPUTE"
          - "append ContributionAuditEvent DISPUTE_FILED"
      - from: UNDER_DISPUTE
        to: ACTIVE
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code VERIFIED_ACCURATE"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects:
          - "claim returns to reportable population"
          - "append ContributionAuditEvent DISPUTE_RESOLVED"
      - from: UNDER_DISPUTE
        to: AMENDED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code AMENDED (the correcting claim is created in the same request)"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects:
          - "a new LossClaim is created ACTIVE with amendment_of_id = this claim's id and a new retention_expires_on"
          - "append ContributionAuditEvent CLAIM_AMENDED and DISPUTE_RESOLVED"
      - from: UNDER_DISPUTE
        to: WITHDRAWN
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code DELETED"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects:
          - "claim permanently excluded from all future reports"
          - "append ContributionAuditEvent CLAIM_WITHDRAWN and DISPUTE_RESOLVED"
      - from: ACTIVE
        to: AMENDED
        trigger: "system (automatic when a replacement LossClaim with amendment_of_id = this claim's id is created)"
        actor: system
        preconditions: []
        side_effects:
          - "the superseded claim leaves the reportable population"

  - entity: LossHistoryReport
    initial_state: ISSUED
    terminal_states: [FROZEN]
    transitions:
      - from: ISSUED
        to: FROZEN
        trigger: "system (automatic when POST /consumers/{consumerId}/freeze is applied to the report's subject consumer)"
        actor: system
        preconditions: []
        side_effects:
          - "all of the consumer's ISSUED reports transition to FROZEN"
          - "append ContributionAuditEvent REPORT_FROZEN for each"
          - "each carrier holding a FROZEN report that is referenced by an outstanding DRAFT or SENT AdverseActionNotice must resolve the notice (send or cancel) before filing new inquiries that would consume the report"

  - entity: ConsumerDispute
    initial_state: FILED
    terminal_states: [RESOLVED_VERIFIED, RESOLVED_AMENDED, RESOLVED_DELETED]
    transitions:
      - from: FILED
        to: UNDER_REINVESTIGATION
        trigger: "POST /disputes/{disputeId}/begin-reinvestigation"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects:
          - "append ContributionAuditEvent DISPUTE_REINVESTIGATED"
      - from: FILED
        to: RESOLVED_VERIFIED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code VERIFIED_ACCURATE"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["claim ACTIVE", "append ContributionAuditEvent DISPUTE_RESOLVED"]
      - from: FILED
        to: RESOLVED_AMENDED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code AMENDED"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["replacement LossClaim created ACTIVE with amendment_of_id set", "append ContributionAuditEvent CLAIM_AMENDED and DISPUTE_RESOLVED"]
      - from: FILED
        to: RESOLVED_DELETED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code DELETED"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["claim WITHDRAWN", "append ContributionAuditEvent CLAIM_WITHDRAWN and DISPUTE_RESOLVED"]
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_VERIFIED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code VERIFIED_ACCURATE"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["claim ACTIVE", "append ContributionAuditEvent DISPUTE_RESOLVED"]
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_AMENDED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code AMENDED"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["replacement LossClaim created ACTIVE with amendment_of_id set", "append ContributionAuditEvent CLAIM_AMENDED and DISPUTE_RESOLVED"]
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_DELETED
        trigger: "POST /disputes/{disputeId}/resolve with resolution_code DELETED"
        actor: ExchangeComplianceOfficer
        preconditions:
          - "logical clock strictly before reinvestigation_due_at"
        side_effects: ["claim WITHDRAWN", "append ContributionAuditEvent CLAIM_WITHDRAWN and DISPUTE_RESOLVED"]

  - entity: AdverseActionNotice
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /adverse-action-notices/{noticeId}/send"
        actor: CarrierUnderwriter
        preconditions:
          - "the acting carrier is notice.carrier_id"
          - "referenced report is in ISSUED status"
          - "carrier's outstanding (DRAFT + SENT) AdverseActionNotice count is strictly below ExchangeRule.max_outstanding_inquiries"
        side_effects:
          - "disclosure_deadline = logical clock + ExchangeRule.disclosure_window_days days"
          - "append ContributionAuditEvent ADVERSE_ACTION_SENT"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /adverse-action-notices/{noticeId}/acknowledge"
        actor: Consumer
        preconditions:
          - "the acting consumer is the notice's consumer_id"
        side_effects:
          - "append ContributionAuditEvent ADVERSE_ACTION_ACKNOWLEDGED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /adverse-action-notices/{noticeId}/cancel"
        actor: CarrierUnderwriter
        preconditions:
          - "the acting carrier is notice.carrier_id"
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: dispute-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /consumers/{consumerId}/disputes"
    occ_field: "expected_consumer_version"
    description: |
      Filing a ConsumerDispute against a Consumer whose version has advanced
      since the client last observed it is rejected. The version advances on
      every consumer mutation — including a prior dispute filing, a freeze, or
      a freeze lift — so a second dispute filed with a stale
      expected_consumer_version is rejected with 412 rather than silently
      double-filing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-amend-stale-claim
    parent_entity: LossClaim
    write_endpoint: "POST /claims/{claimId}/amendments"
    occ_field: "expected_claim_version"
    description: |
      Creating a replacement LossClaim via POST /claims/{claimId}/amendments
      supersedes the current ACTIVE row. If the claim's version has advanced
      since the client last read it (for example because a dispute filing or
      an earlier amendment already bumped it), the create is rejected with
      412 and no replacement is persisted.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: identity_match_score
    trigger: "POST /carriers/{carrierId}/inquiries — runs once per inquiry after the consumer-bundle candidate set is built"
    algorithm: weighted_scoring
    formula: |
      Grade points per signal (identifier_bundle_grades):
        EXACT = 50, FUZZY = 25, MISMATCH = 0, ABSENT = 0.
      Individual match grade is taken from the strongest individual signal:
      driver_license comparison dominates; if the inquiry supplies no
      driver_license and no consumer candidate matches one, the individual
      grade falls back to the name+date_of_birth comparison.
      match_score = 100 * individual_points
                  +  30 * vehicle_points
                  +  20 * address_points
                  +  50 * (included_loss_count_of_best_bundle)
      where included_loss_count_of_best_bundle is the number of ACTIVE
      LossClaims in the candidate bundle that pass the retention filter.
      The candidate bundle is the set of consumers whose (driver_license OR
      name+DOB OR address OR vehicle_identifier) shares at least one signal
      with the inquiry. The bundle with the highest match_score wins;
      ties break by earliest Consumer.created_at, never by id.
      match_disposition thresholds on match_score:
        >= 7000  -> DEFINITE
        >= 5500  -> PROBABLE
        >= 4000  -> POSSIBLE
        <  4000  -> UNMATCHED
      UNMATCHED inquiries receive matched_consumer_id = null and no report.
    input_set: "Consumers sharing at least one identifier signal with the inquiry; each candidate's ACTIVE LossClaims with loss_date strictly newer than (logical clock date - ExchangeRule.retention_years years)"
    constants:
      EXACT_PTS: 50
      FUZZY_PTS: 25
      INDIVIDUAL_W: 100
      VEHICLE_W: 30
      ADDRESS_W: 20
      LOSS_W: 50
      DEFINITE_MIN: 7000
      PROBABLE_MIN: 5500
      POSSIBLE_MIN: 4000
    precision: "integer score; thresholds compared with >="
    variants:
      - name: individual_dominant
        when: "individual grade is EXACT (driver_license match)"
        difference: "individual_points = 50 drives score to the DEFINITE band even with ABSENT vehicle and address"
      - name: household_ambiguous
        when: "individual grade is FUZZY (name+DOB only)"
        difference: "individual_points = 25 caps the achievable band at POSSIBLE unless vehicle and address both grade EXACT — this is the guard against attributing another household's losses"

  - name: risk_certainty_score
    trigger: "LossHistoryReport issuance — computed from the winning bundle and persisted on the report"
    algorithm: weighted_scoring
    formula: |
      risk_score_certainty = match_score / 100, expressed with 2 decimals,
      round_half_up (e.g. match_score 7550 -> 75.50).
      All downstream risk scores key off risk_score_certainty.
    input_set: "the winning candidate bundle from identity_match_score"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: risk_score_dual
    trigger: "LossHistoryReport issuance — both variants are computed and persisted on the same report"
    algorithm: weighted_scoring
    formula: |
      Let N = claim_count_reported (claims in the report after filtering).
      Variant count:
        risk_score_count = N * risk_score_certainty
        rounded to integer, round_half_up.
      Variant premium_weighted:
        base_cents = sum over included claims of
                     min(paid_amount_cents, ExchangeRule.premium_weight_cap_cents)
        risk_score_premium_weighted_cents =
          round_half_up(base_cents * risk_score_certainty / 100)
      The two variants diverge whenever the average capped paid amount per
      claim differs from 100 cents — i.e. almost always.
    input_set: "LossClaims of the matched consumer with status ACTIVE, loss_date strictly newer than (logical clock date - ExchangeRule.retention_years years); claims UNDER_DISPUTE are excluded; withdrawn carriers' claims are excluded"
    constants:
      PREMIUM_WEIGHT_CAP_CENTS: 500000
    precision: "integer cents, round_half_up"
    variants:
      - name: count
        when: "always computed; drives claim-frequency-based pricing"
        difference: "uses N (frequency) only — a consumer with 3 zero-payment claims scores higher than one with a single large paid loss"
      - name: premium_weighted
        when: "always computed; drives severity-based pricing"
        difference: "uses capped paid amounts — a single large loss outweighs several small ones"

  - name: report_inclusion_set
    trigger: "LossHistoryReport issuance — determines which claims become ReportClaimEntry rows"
    algorithm: aggregation
    formula: |
      included = [c for c in LossClaim where
        c.consumer_id == matched_consumer_id
        and c.status == ACTIVE
        and c.contributing_carrier.status != WITHDRAWN
        and c.loss_date > (logical clock date - ExchangeRule.retention_years years)]
      Ordering: loss_date DESC, then created_at ASC as tie-break (never id).
      claim_count_reported = len(included).
      Each included claim is snapshotted into a ReportClaimEntry with
      entry_sequence starting at 1 in the order above.
    input_set: "all LossClaims of the matched consumer"
    constants: {}
    precision: "date comparison is strict (>); a loss exactly retention_years old on the report date is EXCLUDED"

  - name: contribution_lag
    trigger: "logical clock evaluation (POST /_clock/set_current_utc) and every ContributionBatch COMPLETED transition"
    algorithm: aggregation
    formula: |
      If the carrier has no COMPLETED batch: contribution_lag_days is not
      defined for gating purposes and reciprocity does not engage (a
      PROVISIONAL carrier simply has no report access yet — inquiries are
      rejected with ERR_CARRIER_NOT_ACTIVE, not ERR_RECIPROCITY_REQUIRED).
      Otherwise:
        contribution_lag_days =
          days between the most recent COMPLETED batch's submitted_at and
          the logical clock, floor toward zero, never negative.
      Reciprocity gating engages when
      contribution_lag_days >= ExchangeRule.reciprocity_lag_threshold_days
      (boundary is inclusive: lag exactly equal to the threshold suspends).
    input_set: "ContributionBatch rows of the carrier in COMPLETED status"
    constants: {}
    precision: "whole days, floor"

  - name: dispute_reinvestigation_deadline
    trigger: "ConsumerDispute creation"
    algorithm: threshold
    formula: |
      reinvestigation_due_at = filed_at + ExchangeRule.reinvestigation_days days.
      begin-reinvestigation and resolve are both rejected with
      ERR_DISPUTE_OVERDUE when logical clock >= reinvestigation_due_at
      (the boundary is inclusive: at exactly due_at the dispute is overdue).
      When a FILED or UNDER_REINVESTIGATION dispute passes its due_at,
      a DISPUTE_OVERDUE ContributionAuditEvent is appended and the dispute
      remains open but unresolvable (terminal for action purposes; it can
      only be closed by a fresh dispute filing cycle after data correction).
    input_set: "the dispute's filed_at and the logical clock"
    constants: {}
    precision: "timestamp comparison, inclusive boundary"

  - name: correction_hold_window
    trigger: "ConsumerDispute creation — compares the dispute's filed_at against the contributing carrier's latest COMPLETED batch"
    algorithm: threshold
    formula: |
      hold_window_open = (filed_at - latest_completed_batch.submitted_at)
                         < ExchangeRule.correction_hold_days days.
      While hold_window_open, the disputed claim's contributing batch may be
      voided (BATCH_VOIDED) without freezing the carrier; once
      hold_window_open is false, voiding that batch additionally suspends the
      carrier (Carrier -> SUSPENDED) because the correction window has
      lapsed. Strict less-than: a dispute filed exactly
      correction_hold_days after the batch is outside the window.
    input_set: "the disputed claim's batch and the dispute's filed_at"
    constants: {}
    precision: "timestamp comparison, strict <"

  - name: outstanding_inquiry_cap
    trigger: "POST /adverse-action-notices and POST /adverse-action-notices/{id}/send"
    algorithm: threshold
    formula: |
      outstanding = count of the carrier's AdverseActionNotice rows with
      status in {DRAFT, SENT}.
      Filing or sending is rejected with ERR_INQUIRY_CAP_EXCEEDED when
      outstanding >= ExchangeRule.max_outstanding_inquiries
      (boundary inclusive: at exactly the cap, the next filing fails).
    input_set: "AdverseActionNotice rows of the acting carrier"
    constants: {}
    precision: "integer count, >= comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resources exist, validated left-to-right (carrier before consumer before dispute before notice)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-declared foreign keys exist, validated in the endpoint's input declaration order"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs (POST /carriers/{id}/batches consumer_id per claim, POST /consumers/{id}/disputes loss_claim_id, POST /carriers/{id}/adverse-action-notices report_id, POST /claims/{id}/amendments)"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation (batch not terminal, dispute open, claim ACTIVE for dispute, report ISSUED for notice send, notice DRAFT for send)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Consumer file not frozen: POST /consumers/{id}/file and report issuance both blocked while file_frozen is true"
    error_id: ERR_CONSUMER_FILE_FROZEN
    http_status: 409
    applies_to: "GET /consumers/{id}/file, POST /carriers/{id}/inquiries (report issuance leg)"

  - priority: 7
    category: business_safety
    check: "Permissible purpose: QuoteInquiry.permissible_purpose is one of UNDERWRITING | CLAIMS | CONSUMER_REQUEST; CONSUMER_REQUEST additionally requires the inquiry's subject identifiers to resolve to the acting consumer"
    error_id: ERR_PERMISSIBLE_PURPOSE
    http_status: 403
    applies_to: "POST /carriers/{id}/inquiries"

  - priority: 8
    category: business_referential
    check: "Contributory reciprocity: inquiring carrier is ACTIVE (not SUSPENDED, not PROVISIONAL, not WITHDRAWN) at inquiry time"
    error_id: ERR_RECIPROCITY_REQUIRED
    http_status: 409
    applies_to: "POST /carriers/{id}/inquiries (report issuance leg)"

  - priority: 9
    category: business_constraint
    check: "Standardized coding: every claim in a contribution batch carries a cause_of_loss_code matching ^[A-Z0-9]{1,8}$ and a declared loss_type and claim_status_code enum; malformed rows are rejected per-row and counted in rejected_count"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /carriers/{id}/batches"

  - priority: 10
    category: business_constraint
    check: "Batch size: claims array length within [ExchangeRule.min_batch_claims, ExchangeRule.max_batch_claims]; duplicate claim_number within the same carrier rejected"
    error_id: ERR_BATCH_CONSTRAINT
    http_status: 422
    applies_to: "POST /carriers/{id}/batches"

  - priority: 11
    category: business_temporal
    check: "Dispute reinvestigation clock: begin-reinvestigation and resolve rejected at or after reinvestigation_due_at; dispute filing rejected for claims already UNDER_DISPUTE or with an open dispute"
    error_id: ERR_DISPUTE_OVERDUE | ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /disputes/{id}/begin-reinvestigation, POST /disputes/{id}/resolve, POST /consumers/{id}/disputes"

  - priority: 12
    category: business_fiscal
    check: "Outstanding adverse-action notice cap for the acting carrier"
    error_id: ERR_INQUIRY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /carriers/{id}/adverse-action-notices, POST /adverse-action-notices/{id}/send"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Advancing the clock re-evaluates contribution lag (carrier suspension), retention redaction, freeze expiry, and dispute overdue events."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, suspended_carrier_ids: string[], reactivated_carrier_ids: string[], expired_freeze_consumer_ids: string[], overdue_dispute_ids: string[], retention_redacted_claim_ids: string[] }"
    side_effects:
      - "Carrier ACTIVE -> SUSPENDED where contribution_lag_days >= threshold"
      - "Consumer.file_frozen auto-lifts at frozen_until"
      - "DISPUTE_OVERDUE audit events for disputes past due_at"
      - "losses older than retention are redacted from future report inclusion sets"

  # --- ExchangeRule ---
  - method: POST
    path: "/exchange-rules"
    description: "Initialize the singleton ExchangeRule (fails if one already exists)"
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: ExchangeRule
    side_effects: ["all rule fields take their declared defaults"]

  - method: GET
    path: "/exchange-rules"
    description: "Read the singleton ExchangeRule"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward, CarrierUnderwriter, Consumer]
    code: 200
    input: []
    output: ExchangeRule
    side_effects: []

  - method: PATCH
    path: "/exchange-rules"
    description: "Update one or more ExchangeRule tunables"
    roles: [PlatformAdmin]
    code: 200
    input: ["retention_years?", "reinvestigation_days?", "correction_hold_days?", "data_freeze_days?", "reciprocity_lag_threshold_days?", "max_outstanding_inquiries?", "min_batch_claims?", "max_batch_claims?", "disclosure_window_days?", "premium_weight_cap_cents?"]
    output: ExchangeRule
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Register a carrier (starts PROVISIONAL)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, naic_code]
    output: Carrier
    side_effects: ["status=PROVISIONAL, contribution_lag_days undefined, counters 0"]

  - method: GET
    path: "/carriers/{carrierId}"
    description: "Get a carrier"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward, CarrierUnderwriter]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers"
    description: "List carriers"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/withdraw"
    description: "Withdraw a carrier from the exchange"
    roles: [ExchangeComplianceOfficer]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status -> WITHDRAWN; claims excluded from future reports"]

  # --- ContributionBatch ---
  - method: POST
    path: "/carriers/{carrierId}/batches"
    description: "Contribute a batch of loss claims. Carrier must not be WITHDRAWN. Each claim row is validated for standardized coding; accepted rows become ACTIVE LossClaims; the batch auto-transitions RECEIVED -> VALIDATED -> COMPLETED (accepted_count >= 1) or FAILED (accepted_count == 0)."
    roles: [CarrierDataSteward]
    code: 201
    input: [claims]
    output: ContributionBatch
    side_effects:
      - "batch auto-transitions per ContributionBatch state machine"
      - "Carrier counters and contribution_lag_days recomputed"
      - "Carrier PROVISIONAL/SUSPENDED -> ACTIVE cascade as applicable"

  - method: GET
    path: "/carriers/{carrierId}/batches"
    description: "List a carrier's contribution batches"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ContributionBatch[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/claims"
    description: "List loss claims contributed by a carrier"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LossClaim[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/report-entries"
    description: "List report claim entries that snapshot this carrier's contributed claims"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReportClaimEntry[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/audit-events"
    description: "List audit events affecting a carrier"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "ContributionAuditEvent[]"
    side_effects: []

  - method: GET
    path: "/batches/{batchId}"
    description: "Get a contribution batch"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward]
    code: 200
    input: []
    output: ContributionBatch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List contribution batches across carriers"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: "ContributionBatch[]"
    side_effects: []

  - method: POST
    path: "/batches/{batchId}/void"
    description: "Void a non-terminal batch. Outside the correction hold window this additionally suspends the contributing carrier."
    roles: [ExchangeComplianceOfficer]
    code: 200
    input: []
    output: ContributionBatch
    side_effects:
      - "status -> VOIDED"
      - "if correction_hold_window is closed for any open dispute on this batch's claims: Carrier -> SUSPENDED"

  # --- LossClaim ---
  - method: GET
    path: "/claims/{claimId}"
    description: "Get a loss claim"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward, Consumer]
    code: 200
    input: []
    output: LossClaim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List loss claims (filterable by contributing carrier, batch, consumer, or amendment lineage)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["contributing_carrier_id?", "batch_id?", "consumer_id?", "amendment_of_id?", "status?", "limit?", "offset?"]
    output: "LossClaim[]"
    side_effects: []

  - method: GET
    path: "/consumers/{consumerId}/claims"
    description: "List loss claims attributed to a consumer"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LossClaim[]"
    side_effects: []

  - method: GET
    path: "/batches/{batchId}/claims"
    description: "List loss claims that arrived in a batch"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "LossClaim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}/amendments"
    description: "List replacement claims that amend this claim (0 or 1 rows)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward, Consumer]
    code: 200
    input: []
    output: "LossClaim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}/disputes"
    description: "List disputes filed against this claim"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConsumerDispute[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/amendments"
    description: "Create a replacement LossClaim superseding an ACTIVE claim (OCC-guarded on the claim's version)"
    roles: [CarrierDataSteward]
    code: 201
    input: [loss_date, loss_type, cause_of_loss_code, paid_amount_cents, claim_status_code, expected_claim_version, "vehicle_identifier?"]
    output: LossClaim
    side_effects:
      - "new LossClaim ACTIVE with amendment_of_id = claimId and fresh retention_expires_on"
      - "original claim -> AMENDED"
      - "increments LossClaim.version lineage via the new row; the original row's version increments by 1"

  # --- Consumer ---
  - method: POST
    path: "/consumers"
    description: "Register a consumer file"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, date_of_birth, address_line, driver_license_number]
    output: Consumer
    side_effects: ["file_frozen=false, frozen_until=null"]

  - method: GET
    path: "/consumers/{consumerId}"
    description: "Get a consumer"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  - method: GET
    path: "/consumers"
    description: "List consumers"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Consumer[]"
