      - name: cascade_down_from_leg_cancellation
        claim_type: cascade_down
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_CANCELLED
          - endpoints.POST /flight-legs/{id}/cancel
        excluded_because:
          difficulty_instance: transitive_cascade / forecast_embargo_cascades_four_levels_to_net_payable
          rationale: "The parent-to-children release cascade and its money consequences are asserted end-to-end by the named §1.8 instance, which walks the identical four-level chain from a leg-level write down to Reservation.net_payable_amount."

      - name: compensation_reverses_original_side_effects
        claim_type: compensation
        grounds:
          - state_machines.SegmentAssignment.RESERVED_to_RELEASED
          - entities.FlightLeg.fields.booked_checked_count
        excluded_because:
          difficulty_instance: compensating_invariant / leg_routing_counter_returns_to_baseline_after_release
          rationale: "Undo-with-no-drift is exactly what the named §1.8 instance asserts, including the counter/posture baseline and the money identity after the release."

  - section: calculations
    instances:
      - name: container_exactly_meeting_every_requirement_is_compliant
        claim_type: precision
        grounds:
          - calculations.container_compliance_evaluation
          - entities.AnimalRecord.fields.container_compliance_state
        distinguishing_aspect: "Every comparison in container_compliance_evaluation is strict less-than, so a container sitting EXACTLY on all four derived requirements (height 43 = ceil(35 + 8), length 58 = ceil(50 * 1.15), ventilation 14 pct = 8 + ceil(27/5), 3 ventilated sides for a 27 kg chargeable weight) is COMPLIANT with an empty deficiency list."
        test_recipe:
          setup:
            - "Container K9-EXACT 58 x 40 x 43, tare 7, ventilation 14 pct over exactly 3 sides"
            - "A CHECKED reservation whose animal is 35 cm at the shoulder, 50 cm nose-to-tail and 20 kg declared, so gross weight is 27 and volumetric weight is 58*40*43/6000 = 16.63, making chargeable_weight_kg 27"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-EXACT", interior_length_cm: 58, interior_width_cm: 40, interior_height_cm: 43, tare_weight_kg: 7, ventilation_area_pct: 14, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_exact: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_exact}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 200"
            - "AnimalRecord.${an1}.chargeable_weight_kg == 27"
            - "AnimalRecord.${an1}.container_compliance_state == COMPLIANT"
            - "AnimalRecord.${an1}.deficiency_codes == []"
            - "AnimalRecord.${an1}.status == SCREENED"
            - "a container one centimetre shorter (interior_height_cm 42) yields DEFICIENT with deficiency_codes [HEIGHT]"

      - name: superseded_embargo_rule_is_excluded_from_the_candidate_set
        claim_type: input_set_filtering
        grounds:
          - calculations.embargo_determination
          - entities.TemperatureEmbargoRule.fields.status
          - endpoints.PUT /temperature-embargo-rules/{id}/status
        distinguishing_aspect: "embargo_determination only reads rules with status ACTIVE: the 29.5 rule that WOULD govern a 30-degree forecast has been superseded, and the remaining ACTIVE 35.0 rule does not match, so the leg stays OPEN with a null governing rule instead of being embargoed."
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US)"
            - "Rule A on HKG, direction ORIGIN, season 06-01 to 09-30, forecast_high_limit_c 29.5, later moved to status SUPERSEDED"
            - "Rule B on HKG, direction ORIGIN, same season, forecast_high_limit_c 35.0, status ACTIVE"
            - "AN101 HKG->LAX departing 2026-09-10T02:00Z created with forecast 25/15, so posture is OPEN"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /temperature-embargo-rules", payload: { station_id: "${st_hkg}", direction: "ORIGIN", season_start_month_day: "06-01", season_end_month_day: "09-30", forecast_high_limit_c: 29.5, forecast_low_limit_c: -5.0, applies_to_routings: ["CHECKED", "CARGO"] }, as: ProgramAdmin, as_user_id: "admin-01", captures: { emb_a: $.data.id } }
            - { call: "POST /temperature-embargo-rules", payload: { station_id: "${st_hkg}", direction: "ORIGIN", season_start_month_day: "06-01", season_end_month_day: "09-30", forecast_high_limit_c: 35.0, forecast_low_limit_c: -20.0, applies_to_routings: ["CHECKED", "CARGO"] }, as: ProgramAdmin, as_user_id: "admin-01", captures: { emb_b: $.data.id } }
            - { call: "PUT /temperature-embargo-rules/${emb_a}/status", payload: { status: "SUPERSEDED" }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
          trigger:
            - { call: "PUT /flight-legs/${leg1}/forecast", payload: { forecast_high_c: 30.0, forecast_low_c: 20.0 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 200"
            - "FlightLeg.${leg1}.governing_embargo_rule_id is null"
            - "FlightLeg.${leg1}.posture == OPEN"
            - "TemperatureEmbargoRule.${emb_a}.status == SUPERSEDED and TemperatureEmbargoRule.${emb_b}.status == ACTIVE"
            - "with rule A still ACTIVE the same forecast write would set governing_embargo_rule_id to ${emb_a} and posture EMBARGOED"

      - name: governing_embargo_rule_tie_breaks_on_created_at_not_id
        claim_type: correct_result
        grounds:
          - calculations.embargo_determination
          - entities.FlightLeg.fields.governing_embargo_rule_id
        distinguishing_aspect: "Two ACTIVE rules match with the SAME forecast_high_limit_c 29.5, so the primary sort key ties and the declared tie-break decides: created_at ASC picks the rule created first, and the random UUID id plays no part in the selection."
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US)"
            - "Rule EARLY on HKG, ORIGIN, season 06-01 to 09-30, forecast_high_limit_c 29.5, forecast_low_limit_c -5.0, created first"
            - "Rule LATE on HKG, ORIGIN, season 07-01 to 10-31, forecast_high_limit_c 29.5, forecast_low_limit_c -8.0, created second, so both rows tie on the sort key and both cover 09-10"
            - "AN101 HKG->LAX departing 2026-09-10T02:00Z created with forecast 25/15"
          setup_api_calls:
