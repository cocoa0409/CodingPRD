  - rule_id: combinatorial_formula
    instances:
      - name: incentive_cap_nests_band_ladder_yield_ceiling_and_coverage_factor
        grounds:
          - calculations.incentive_cap
          - calculations.economic_impact_estimate
          - calculations.citywide_block_readiness
          - entities.BidPackage.fields.incentive_cap_amount
          - entities.MeetingPlanner.fields.tier
          - state_machines.BidPackage.DRAFT_to_INCENTIVE_PENDING
        distinguishing_aspect: |
          Mode (a): the cap is a nested min/max over three independently-derived quantities - a marginal
          room-night band ladder (1800 nights -> 21600.00), a tier-keyed lodging-tax yield ceiling
          (59130.00 * 0.25 = 14782.50 because the planner is TIER_B), and a branch-selected coverage factor
          (block_coverage_pct 90.00 falls in [85.00, 95.00) -> 0.90), giving min(21600.00, 14782.50) * 0.90 =
          13304.25; getting any one of the three sub-results right in isolation still yields the wrong cap.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner CDA with legacy 2 definites / 6000 room nights, so relationship_score_lifetime 36 and tier TIER_B (tier_rate 0.25)"
            - "opportunity CDA Annual 2028 QUALIFIED with total_room_nights_requested 1800, peak_rooms_requested 1000, rate_ceiling_amount 219.00, attendance_estimate 8000, exhibit_sqft_requested 200000"
            - "citywide block COMMITTED at 900 of 1000 peak rooms, so Opportunity.block_coverage_pct == 90.00"
            - "incentive fund FY2028 OPEN with budget 500000.00 and uncommitted_amount 500000.00, so the fund clamp does not bind"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
