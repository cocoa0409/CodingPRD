  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: science_supersession_preserves_single_recorded_anchor
        grounds:
          - state_machines.SoilEvaluation.RECORDED_to_SUPERSEDED
          - state_machines.PercolationTest.RECORDED_to_SUPERSEDED
          - state_machines.SystemDesign.DRAFT_to_WITHDRAWN
          - entities.SoilEvaluation.fields.superseded_by_id
        distinguishing_aspect: |
          Conserved quantity = COUNT of RECORDED soil evaluations per site
          (and, symmetrically, the COUNT of DRAFT designs whose pinned
          science is fully RECORDED must drop to zero after supersession).
          Forward action: record E2 (count goes 1 -> 1 because E1 is
          superseded in the same transaction). Compensating check: every DRAFT
          design that pinned E1 is WITHDRAWN — the invariant
          |{designs: DRAFT and pinned eval RECORDED}| == 0 holds when the
          only RECORDED evaluation is one they do not pin.
        test_recipe:
          setup:
            - "Company/county WH; designer D1, manager M1, scientist SS1"
            - "Site S; E1/PT1 RECORDED at period 0; TWO DRAFT designs DA and DB both pin E1/PT1"
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "LOAM", limiting_layer_inches: 36 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { e1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/percolation-tests"
              payload: { evaluator_id: "${ss1}", minutes_per_inch: 12.0, test_pit_count: 4 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { pt1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 3, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { da: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 5, system_type: "PRESSURE_DISTRIBUTION" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { db: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "CLAY_LOAM", limiting_layer_inches: 40 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { e2: $.data.id }
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { status: "RECORDED" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { recorded_list: $.data }
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs/${da}"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { da_status: $.data.status }
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs/${db}"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { db_status: $.data.status }
          assert:
            - "Exactly one RECORDED soil evaluation remains for site ${s}: the filtered list has length 1 and its id == ${e2} (count conserved at 1 across the forward+supersede pair)"
            - "SoilEvaluation.${e1}.status == SUPERSEDED and superseded_by_id == ${e2}"
            - "Design.${da}.status == WITHDRAWN and Design.${db}.status == WITHDRAWN (compensating cascade left zero DRAFT designs pinning stale science)"

