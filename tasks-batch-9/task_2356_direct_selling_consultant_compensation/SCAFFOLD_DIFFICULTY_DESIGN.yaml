          assert:
            - "before: a_life_before == 23800, c_life_before == 23200, b_life_before == 0, all clawback balances 0, b_carry_before == 500, paid_total_before == 47000, carry_total_before == 500"
            - "invariant before: (23800 + 0) + (23200 + 0) + (0 + 0) + carry-forward 500 == 47500 == the run's gross_total_cents"
            - "run_state == REVERSED with run_reversed == 47000, run_paid_after == 0 and run_carry_after == 0"
            - "a_life_after == 0 and a_claw_after == 23800 ; c_life_after == 0 and c_claw_after == 23200 ; b_life_after == 0 and b_claw_after == 0 and b_carry_after == 0"
            - "invariant after: (0 + 23800) + (0 + 23200) + (0 + 0) + carry-forward 0 == 47000, and 47000 + the 500 released from carry-forward == 47500 — no cent was created or destroyed"
            - "a_hold_before == false and a_hold_after == true and c_hold_after == true (payout_hold is re-derived from a positive clawback balance)"
            - "stmt_status_0 == VOIDED and stmt_status_1 == VOIDED and stmt_status_2 == VOIDED, and every statement has payout_status VOIDED"

