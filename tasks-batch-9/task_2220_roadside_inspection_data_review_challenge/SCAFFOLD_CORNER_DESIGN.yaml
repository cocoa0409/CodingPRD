      - name: duplicate_report_acceptance_rescinds_and_links_master
        claim_type: cross_entity
        grounds:
          - state_machines.InspectionReport.SCORED_to_RESCINDED
          - state_machines.DataChallenge.UNDER_REVIEW_to_RESOLVED_ACCEPTED
          - calculations.basic_measure_recompute
          - calculations.screening_risk_recompute
        distinguishing_aspect: |
          Accepting a DUPLICATE_REPORT challenge rescinds the duplicate rather than deleting it:
          duplicate_master_report_id points at the surviving report, its violations move to REMOVED
          with removal_reason DUPLICATE_RESCINDED, relevant_inspection_count drops 2 -> 1 so the
          measure falls 1.000 -> 0.500 and the alert falls ALERT -> MONITOR, and the accepted
          resolution finally earns a data-quality credit (iss 17.5 pre-credit becomes 17.2).
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM, exposure 30.0, quota_limit 3); code 392.2S weight 5; threshold UNSAFE_DRIVING/MEDIUM 0.5 / 1.0 / 2.0."
