  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_access_group_stale_patch_rejected
        claim_type: stale_version_conflict
        grounds: ['concurrency_rules[access-group-patch-stale-version]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "PATCH carries expected_access_group_version; after a first successful PATCH advances version 1 -> 2, replaying the stale version yields 412."
        test_recipe:
          setup: ["Building B; access group G created (version 1)"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "OCC House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /access-groups"
              payload: { building_id: "${b}", name: "G", days_of_week: ["MON"], window_start_utc: "08:00", window_end_utc: "17:00" }
              as: SecurityAdmin
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "PATCH /access-groups/${g}"
              payload: { expected_access_group_version: "${g_v}", name: "G-Renamed" }
              as: SecurityAdmin
              captures: { g_v2: $.data.version }
          trigger:
            - call: "PATCH /access-groups/${g}"
              payload: { expected_access_group_version: "${g_v}", name: "G-Stale" }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "g_v == 1 and g_v2 == 2 (successful write incremented version)"
            - "err == ERR_STALE_VERSION (http 412)"
            - "GET /access-groups/${g} -> name == 'G-Renamed' (stale write not applied)"

      - name: occ_door_stale_patch_rejected
        claim_type: stale_version_conflict
        grounds: ['concurrency_rules[door-patch-stale-version]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "Same OCC pattern on Door: a threshold update at version 1 succeeds; replaying version 1 fails 412."
        test_recipe:
          setup: ["Building B; M -> C1; door D1 created (version 1)"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "OCC Door House" }
