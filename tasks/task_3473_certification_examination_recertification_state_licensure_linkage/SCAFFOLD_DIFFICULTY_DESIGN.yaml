  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics on
  # different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: attempt_slot_half_open_overlap
        grounds:
          - calculations.attempt_slot_overlap
          - errors[ERR_ATTEMPT_SLOT_OVERLAP]
        distinguishing_aspect: |
          Interval-intersection semantics over the candidate's exam calendar:
          [11:00,13:00) intersects an existing SCHEDULED [10:00,12:00) and is
          rejected, while the merely-touching [12:00,14:00) is allowed
          (half-open arithmetic — adjacency is not conflict).
        test_recipe:
          setup:
            - "Candidate with TWO approved applications (ATT_A, ATT_B) on the same basis; attempt1 SCHEDULED [2026-09-02T10:00Z, 2026-09-02T12:00Z) via ATT_A; no deliveries yet so no retake wait applies"
