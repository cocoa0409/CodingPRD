              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 400 and err == ERR_INVALID_REQUEST"

      - name: stale_avail_version_on_engagement_create_returns_412
        claim_type: Violation → Error
        grounds:
          - "validations.priority_23_business_fiscal"
          - "concurrency_rules[engagement-create-stale-avail]"
          - "errors.ERR_STALE_AVAIL_VERSION"
        distinguishing_aspect: "OCC on DateAvail.version: a stale expected_avail_version yields 412 ERR_STALE_AVAIL_VERSION, not 409."
        test_recipe:
          setup: ["Avail A1 created (version v); avail mutated once by another engagement that was then cancelled (version v+1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_1: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_1}/cancel"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 412 and err == ERR_STALE_AVAIL_VERSION (the stale expected_avail_version refers to the avail's pre-engagement version)"

  - section: endpoints
    instances:
      - name: get_engagement_returns_full_field_set
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/tours/{tourId}/engagements/{engagementId}"
