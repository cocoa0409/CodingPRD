              as: ProvisioningEngineer
          assert:
            - "Hop 1 — PowerCircuit.${cir1_id}.status == ENERGIZED, allocated_kw == 17.280, cooling_contribution_kw == 17.280, energized_at == 2026-08-01T00:00:00Z"
            - "Hop 2 — Cabinet.${cab1_id}.status == ACTIVE, allocated_power_kw == 17.280, cooling_load_kw == 17.280, energized_primary_circuit_count == 1"
            - "Hop 3 — FloorRow.${row_id}.occupied_slot_count == 2, density_ceiling_kw == 16.000, effective_ceiling_kw == 16.000, allocated_power_kw == 17.280, cooling_load_kw == 17.280, energized_cabinet_count == 1, row_status == DENSITY_CAPPED"
            - "Hop 3 — FloorRow.${row_id}.stranded_nameplate_kw == -1.280 and FloorRow.${row_id}.stranded_measured_kw == 16.000"
            - "Hop 4 — Cabinet.${cab2_id}.status == CAPACITY_HELD and Cabinet.${cab2_id}.contract_id == ${ctr_id}"
            - "Hop 5 — PowerCircuit.${cir2_id}.status == BLOCKED with allocated_kw == 0.000 and cooling_contribution_kw == 0.000"
            - "Contract.${ctr_id}.provisioned_power_kw == 17.280, stranded_commit_kw == 2.720, commit_utilization_pct == 86.4"
            - "A subsequent POST /colocation/cabinets {row_id: ${row_id}, ...} returns 409 ERR_ROW_NOT_ACCEPTING_SPACE because the row is DENSITY_CAPPED"

