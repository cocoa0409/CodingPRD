            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v3: $.data.version } }
            # Third enrollment at active == 2 < 3 -> SUCCESS (boundary allowed side)
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap03}", training_class_id: "${cls}", expected_training_class_version: "${v3}" }, as: TrainingCoordinator, captures: { en3: $.data.id } }
