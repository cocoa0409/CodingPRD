errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unknown X-User-Role header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed X-User-ID does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing/invalid field, bad enum value, non-positive weight, end_at <= start_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a from-state of the invoked transition; terminal lockdown" }
  - { id: ERR_PRESCRIPTION_NOT_VERIFIED, http: 409, condition: "compound-order creation/allocation while prescription not VERIFIED (and not EXPIRED)" }
  - { id: ERR_PRESCRIPTION_EXPIRED, http: 409, condition: "compound-order creation on an EXPIRED prescription" }
  - { id: ERR_ORDER_IN_PROGRESS, http: 409, condition: "another order of the prescription occupies an in-flight state" }
  - { id: ERR_RECALL_HOLD_ACTIVE, http: 409, condition: "action other than resume/cancel on a RECALL_HOLD order" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "credit payment against a SUSPENDED or CANCELLED enrollment" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "claim creation or payment against a LAPSED policy" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "flavoring allergen tag intersects pet allergies" }
  - { id: ERR_SPECIES_FLAVOR_INCOMPATIBLE, http: 422, condition: "pet species not in flavoring compatible_species" }
  - { id: ERR_CONTROLLED_DEA_REQUIRED, http: 422, condition: "controlled formula prescribed by a vet without DEA registration" }
  - { id: ERR_CONTROLLED_REFILL_FORBIDDEN, http: 422, condition: "refills authorized or requested on a C_II prescription" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "QA reviewer is the compounding pharmacist" }
  - { id: ERR_BENCH_NOT_CONTROLLED_CAPABLE, http: 422, condition: "controlled order started on a bench without controlled support" }
  - { id: ERR_PET_DECEASED, http: 422, condition: "refill/auto-ship operation for a deceased pet" }
  - { id: ERR_ENROLLMENT_PET_MISMATCH, http: 422, condition: "enrollment pet differs from prescription pet at credit payment" }
  - { id: ERR_CLAIM_AMOUNT_MISMATCH, http: 422, condition: "claimed_amount_cents differs from order provisional_price_cents" }
  - { id: ERR_RECALL_ACTIVE_ON_LOT, http: 409, condition: "operation touches a lot covered by an ACTIVE recall" }
  - { id: ERR_BENCH_OVERLAP, http: 409, condition: "bench reservation overlaps an existing reservation (half-open arithmetic)" }
  - { id: ERR_COOLER_CONDITIONING, http: 409, condition: "cooler still inside its mandatory reconditioning window" }
  - { id: ERR_COLD_CHAIN_COOLER_REQUIRED, http: 422, condition: "cooler missing for cold-chain drug or supplied for ambient drug" }
  - { id: ERR_DUPLICATE_LOT_NUMBER, http: 409, condition: "lot_number already exists for the drug" }
  - { id: ERR_POLICY_NUMBER_EXISTS, http: 409, condition: "policy_number already registered" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "FEFO candidates cannot cover the order quantity" }
  - { id: ERR_REFILLS_EXHAUSTED, http: 422, condition: "refill requested with refills_remaining == 0" }
  - { id: ERR_MAX_APPEALS_EXCEEDED, http: 422, condition: "appeal attempted beyond 2" }
  - { id: ERR_WASTE_EXCEEDS_ON_HAND, http: 422, condition: "waste qty exceeds lot qty_on_hand or would drive the controlled balance negative" }
  - { id: ERR_REFILL_TOO_EARLY, http: 422, condition: "fewer than ceil(0.75 * days_supply) days elapsed since last dispensed fill" }
  - { id: ERR_COLD_CHAIN_NOT_REQUIRED, http: 422, condition: "temperature reading on an ambient shipment, or non-monotonic recorded_at" }
  - { id: ERR_PAYMENT_REQUIRED, http: 402, condition: "shipment creation while payment_status != PAID" }
  - { id: ERR_CREDIT_LIMIT, http: 402, condition: "wellness credit cannot cover any share (zero credits, cap, or controlled not covered)" }

roles:
  - name: Owner
    description: "Pet owner customer"
    identity: "entity_backed:Owner"
    exclusive_operations: [pay orders, manage own enrollments, submit/appeal claims, manage own auto-ship schedules, acknowledge recall tasks]
    shared_operations: [read own pets, prescriptions, orders, shipments]
  - name: Veterinarian
    description: "Prescribing veterinarian"
    identity: "entity_backed:Veterinarian"
    exclusive_operations: [vet-confirm, vet-reject, request-clarification on own prescriptions]
    shared_operations: [read prescriptions, drugs, formulas]
  - name: Pharmacist
    description: "Licensed compounding pharmacist (opaque operator id; compounding vs QA segregation tracked via X-User-ID)"
    identity: "opaque"
    exclusive_operations: [start/complete compounding and flavoring, qa-pass, qa-fail, resume, refund, create shipments, advance shipment scans, create formulas]
    shared_operations: [read catalog, lots, orders]
  - name: PharmacyTech
    description: "Pharmacy technician handling intake and inventory"
    identity: "opaque"
    exclusive_operations: [script intake, submit-verification, resubmit, allocate, cancel orders, receive lots, record temperature readings]
    shared_operations: [read prescriptions, lots, orders]
  - name: ComplianceOfficer
    description: "Compliance officer for DEA log, vet credentialing, and recalls"
    identity: "opaque"
    exclusive_operations: [verify/suspend/reinstate/revoke vets, lot waste write-offs, draft/activate/complete recalls, mark recall tasks notified/failed]
    shared_operations: [read controlled-substance log, lots, recalls]
  - name: InsuranceAdjuster
    description: "Insurer-side adjudicator"
    identity: "opaque"
    exclusive_operations: [adjudicate claims, pay claims, lapse policies]
    shared_operations: [read policies, claims, orders]
  - name: PharmacyAdmin
    description: "Platform administrator for catalog/config and ops-run endpoints"
    identity: "opaque"
    exclusive_operations: [register owners/vets/drugs/flavorings/plans/benches/coolers, retire config entities, set logical clock, run auto-ship and expiration sweeps]
    shared_operations: [read everything]
