              captures: { e_credit_pool: $.data.error_id }
            - call: "POST /public-art/damage-incidents/${inc_pool}/file-claim"
              payload: { claim_basis: "ACV" }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /public-art/damage-incidents/${inc_pool}/resolve-claim"
              payload: { outcome: "SETTLE" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { e_zero: $.data.error_id }
            - call: "POST /public-art/damage-incidents/${inc_pool}/resolve-claim"
