              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:45:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t2}/temperature-readings"
