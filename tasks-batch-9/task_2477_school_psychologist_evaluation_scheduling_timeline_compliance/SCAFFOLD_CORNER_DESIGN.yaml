              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "DAS-II", instrument_code: "DAS2", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1799, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
