            - { call: "POST /endowment/donors", payload: { donor_name: "D SP", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { sp_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${sp_fund}", donor_id: "${sp_donor}", external_ref: "SP1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { sp_g: $.data.id } }
            - { call: "POST /endowment/funds/${sp_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/pools/${sp_pool}/suspend", payload: {}, as: EndowmentAdmin }
          trigger:
            - { call: "POST /endowment/gifts/${sp_g}/receive", payload: {}, as: DevelopmentOfficer, captures: { sp_err1: $.data.error_id } }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${sp_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { sp_err2: $.data.error_id } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${sp_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, captures: { sp_err3: $.data.error_id } }
            - { call: "POST /endowment/pools/${sp_pool}/resume", payload: {}, as: EndowmentAdmin }
            - { call: "POST /endowment/gifts/${sp_g}/receive", payload: {}, as: DevelopmentOfficer, captures: { sp_ok: $.data.gift_status } }
          assert:
            - "all three operations while SUSPENDED: http 409 ERR_POOL_SUSPENDED"
            - "after resume the same receive succeeds: gift_status == RECEIVED"

      - name: authorization_precedes_existence_forbidden_role_on_missing_resource
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=5]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A BoardMember calling activate on a NONEXISTENT fund id gets ERR_FORBIDDEN_ROLE (403, priority 2), not ERR_NOT_FOUND (404, priority 5) — role checks run before any id resolution."
        test_recipe:
