            - "the 2026-05-05 census day returns 422 with data.error_id == ERR_CENSUS_DATE_OUTSIDE_PERIOD"
            - "the second submission returns 422 with data.error_id == ERR_DUPLICATE_SUBMISSION"
            - "GET /census-days with submission_id ${sub} returns total_count == 1 and CensusDay.${c1}.resident_count is still 5"

      - name: configuration_uniqueness_and_shape_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 55 ERR_DUPLICATE_CCN]
          - validations[priority 56 ERR_DUPLICATE_PERIOD_CODE]
          - validations[priority 57 ERR_DUPLICATE_JOB_CATEGORY]
          - validations[priority 58 ERR_DUPLICATE_VENDOR_TAX_ID]
        distinguishing_aspect: "Each configuration entity carries its own uniqueness or shape rule, and two of them fold a second sub-check under the same error id: the period window ordering and the zero-credit requirement for non-direct-care classes."
        test_recipe:
          setup:
            - "One TX facility with ccn 675001, the 2026Q2 TX period, the RN and ADMIN job categories, and one vendor with tax_id 74-2210099"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_vend
          trigger:
            - call: "POST /facilities"
              payload: { ccn: "675001", name: "Duplicate Ridge Nursing", state_code: "TX", certified_bed_count: 80 }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /reporting-periods"
              payload: { period_code: "2026Q2", state_code: "TX", start_date: "2026-10-01", end_date: "2026-10-31", submission_deadline: "2027-02-14T23:59:59Z", correction_window_end: "2027-04-30T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /reporting-periods"
              payload: { period_code: "2026Q4", state_code: "TX", start_date: "2026-10-01", end_date: "2026-10-31", submission_deadline: "2027-02-14T23:59:59Z", correction_window_end: "2027-01-14T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /job-categories"
              payload: { code: "RN", cms_job_code: 6, direct_care_class: "DIRECT_CARE", nurse_group: "RN", direct_care_credit_pct: 1.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /job-categories"
              payload: { code: "HOUSEKEEPING", cms_job_code: 20, direct_care_class: "NON_DIRECT_CARE", nurse_group: "NONE", direct_care_credit_pct: 0.50 }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /vendors"
              payload: { facility_id: "${fac}", vendor_name: "Northgate Agency Staffing Two", tax_id: "74-2210099", attestation_contact: "ops2@northgate.example" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "the duplicate ccn call returns 422 with data.error_id == ERR_DUPLICATE_CCN"
            - "the repeated 2026Q2 TX period returns 422 with data.error_id == ERR_DUPLICATE_PERIOD_CODE, and the 2026Q4 period whose correction_window_end precedes its submission_deadline returns the same error id under the same rule"
            - "the repeated RN code returns 422 with data.error_id == ERR_DUPLICATE_JOB_CATEGORY, and the NON_DIRECT_CARE category with credit 0.50 returns the same error id under the same rule"
            - "the repeated vendor tax_id within facility ${fac} returns 422 with data.error_id == ERR_DUPLICATE_VENDOR_TAX_ID"
            - "GET /reporting-periods with state_code TX returns total_count == 1 and GET /job-categories with code RN returns total_count == 1"

      - name: vendor_roster_batch_shape_and_suspension_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 60 ERR_VENDOR_LINKAGE_INVALID]
          - validations[priority 61 ERR_VENDOR_LINES_EMPTY]
          - validations[priority 22 ERR_VENDOR_SUSPENDED]
        distinguishing_aspect: "Conditional validation on Worker: vendor_id must be present exactly when worker_type is AGENCY_CONTRACTOR, tested in both directions; and a suspended vendor's DRAFT batch can no longer be submitted."
        test_recipe:
          setup:
            - "An ACTIVE vendor with one AGENCY_CONTRACTOR worker and one DRAFT batch of a single 8.00-hour RN line, then the vendor is suspended"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_vend
            - *k_w_ag
            - *k_batch
            - call: "POST /vendors/${vend}/suspend"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-vendor-01"
          trigger:
            - call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Jules Employee", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01", vendor_id: "${vend}" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Robin Unlinked", worker_type: "AGENCY_CONTRACTOR", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /vendor-submissions"
              payload: { vendor_id: "${vend}", facility_id: "${fac}", reporting_period_id: "${per}", attested_by: "Northgate Ops Lead", lines: [] }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /vendor-submissions/${batch}/submit"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${vend}"
          assert:
            - "the EMPLOYEE with a vendor_id returns 422 with data.error_id == ERR_VENDOR_LINKAGE_INVALID"
            - "the AGENCY_CONTRACTOR without a vendor_id returns 422 with data.error_id == ERR_VENDOR_LINKAGE_INVALID under the same rule's other direction"
            - "the empty lines batch returns 422 with data.error_id == ERR_VENDOR_LINES_EMPTY"
            - "the submit of the existing DRAFT batch returns 409 with data.error_id == ERR_VENDOR_SUSPENDED and VendorHourSubmission.${batch}.status is still DRAFT"
            - "StaffingVendor.${vend}.status == SUSPENDED and GET /workers with facility_id ${fac} returns total_count == 4"
            - "GET /vendors with facility_id ${fac} and status SUSPENDED returns total_count == 1, and GET /vendor-submissions with vendor_id ${vend} returns total_count == 1 whose single row is still DRAFT"

      - name: submit_blocked_by_open_fatal_finding_then_allowed_after_waiver
        claim_type: violation_to_error
        grounds:
          - validations[priority 34 ERR_FATAL_FINDINGS_OPEN]
          - endpoints[POST /submissions/{id}/findings/{finding_id}/waive]
        distinguishing_aspect: "Cascading validation: validate must first raise the FATAL HPRD_IMPLAUSIBLE finding, which then blocks submit; waiving that finding is the only way to clear the count, after which the same submit succeeds without re-validating."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission with a single 16.00-hour RN shift on 2026-04-01 and one census day with resident_count 1, so hprd is 16.0000 against MAX_PLAUSIBLE_HPRD 12.0000"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "00:00", shift_end: "16:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { efat: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 1, mds_resident_count: 1 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { cfat: $.data.id }
            - *k_validate
            - call: "GET /submissions/${sub}/findings"
              payload: { code: "HPRD_IMPLAUSIBLE", status: "OPEN" }
              as: StateAuditor
              as_user_id: "auditor-find-01"
              captures: { fid: "$.data[0].id" }
          trigger:
            - call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /submissions/${sub}/findings/${fid}/waive"
              payload: { waiver_note: "Single-resident census confirmed against the MDS extract; hprd is real." }
              as: StateAuditor
              as_user_id: "auditor-find-01"
            - call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          assert:
            - "after validate, QuarterlySubmission.${sub}.hprd_reported == 16.0000 and open_fatal_finding_count == 1"
            - "the first submit returns 409 with data.error_id == ERR_FATAL_FINDINGS_OPEN and leaves status VALIDATED"
            - "the waive sets ValidationFinding.${fid}.status == WAIVED with waived_by_user_id auditor-find-01 and drops open_fatal_finding_count to 0"
            - "the second submit returns 200 with status SUBMITTED and attested_by_worker_id == ${w_admin}, without a re-validate"

      - name: sanctioned_facility_cannot_validate_a_later_period
        claim_type: violation_to_error
        grounds:
          - validations[priority 32 ERR_FACILITY_SANCTIONED]
          - state_machines.Facility
        distinguishing_aspect: "Cross-entity validation: substantiating a discrepancy case on the April submission sets the facility posture to SANCTIONED, which then blocks validation of an unrelated July submission — and it is not the priority 28 census guard that fires, because the later submission does have a census day."
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission, a manual UNSUPPORTED_HOURS discrepancy case walked to UNDER_REVIEW and substantiated, and a separate DRAFT 2026Q3 submission with one census day"
          setup_api_calls:
            - *k_fac
