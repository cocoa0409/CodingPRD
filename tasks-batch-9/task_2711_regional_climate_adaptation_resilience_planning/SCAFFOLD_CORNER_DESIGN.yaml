# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Claim Index)
# Task 2711 — Regional Climate Adaptation & Resilience Planning
# Sections are the nine claim-extraction-guide tables; claim_type values are
# taken only from that guide's per-section rows. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Every formula-derived literal below was produced by executing the matching
# calculations[].formula from SCAFFOLD.yaml as Decimal/ROUND_HALF_UP code.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: jurisdiction_creation_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints.post_jurisdictions
          - response_envelope.success
        distinguishing_aspect: "POST /resilience/jurisdictions with every required field returns 201 and a data object carrying all five input fields plus the computed svi_tier/disadvantaged_flag pair and the four common fields."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          assert:
            - "status 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "data.name == Harbor City, data.jurisdiction_code == CITY-HARBOR, data.population == 180000, data.svi_score == 0.62, data.endorsement_weight == 4"
            - "data.status == ACTIVE, data.svi_tier == HIGH, data.disadvantaged_flag == true"
            - "data.id, data.created_at, data.updated_at are present and data.version == 1"

      - name: jurisdiction_retrieval_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Jurisdiction
          - endpoints.get_jurisdiction_by_id
        distinguishing_aspect: "GET /resilience/jurisdictions/{jurisdiction_id} echoes the same field values the create call returned, including the computed svi_tier."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction with svi_score 0.62."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "GET /resilience/jurisdictions/${j_id}"
              payload: {}
              as: EquityOfficer
          assert:
            - "status 200 and data.id == ${j_id}"
            - "data.jurisdiction_code == CITY-HARBOR, data.svi_tier == HIGH, data.endorsement_weight == 4, data.version == 1"

      - name: assets_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.LifelineAsset
          - endpoints.get_assets
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three LifelineAssets and limit 2 / offset 0, the list returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and exactly three LifelineAssets in it."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "WATER", name: "Asset One", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "POWER", name: "Asset Two", replacement_value_cents: 400000000, service_population: 40000, redundancy_factor: 0.10 }
              as: RegionalAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "TRANSPORT", name: "Asset Three", replacement_value_cents: 800000000, service_population: 90000, redundancy_factor: 0.20 }
              as: RegionalAdministrator
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /resilience/assets"
              payload: { limit: 2, offset: 0 }
              as: RegionalAdministrator
            - call: "GET /resilience/assets"
              payload: { limit: 2, offset: 2 }
              as: RegionalAdministrator
            - call: "GET /resilience/assets"
              payload: { asset_class: "POWER" }
              as: RegionalAdministrator
          assert:
            - "first call: response_type == array, len(data) == 2, meta.total_count == 3, meta.has_more == true, meta.limit == 2, meta.offset == 0"
            - "second call: len(data) == 1, meta.total_count == 3, meta.has_more == false"
            - "third call: len(data) == 1, meta.total_count == 1, and data[0].id == ${a2_id}"
            - "no asset appears in both the offset-0 page and the offset-2 page"

      - name: asset_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.LifelineAsset
          - endpoints.get_asset_by_id
          - errors[ERR_ASSET_NOT_FOUND]
        distinguishing_aspect: "GET /resilience/assets/{asset_id} with the all-zero UUID returns 404 ERR_ASSET_NOT_FOUND in the error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /resilience/assets/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HazardAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "status 404, response_type == error, data.error_id == ERR_ASSET_NOT_FOUND"
            - "data.message is a non-empty string and no data.id field is present"

      - name: hazard_profile_creation_missing_exposure_index_rejected
        claim_type: Required Fields
        grounds:
          - entities.HazardProfile.fields.exposure_index
          - endpoints.post_hazard_profiles
          - validations.priority_7_ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting exposure_index — an input field with no default — returns 422 ERR_INVALID_REQUEST and persists no HazardProfile row."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "status 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /resilience/hazard-profiles returns meta.total_count == 0"

      - name: plan_cycle_creation_applies_quorum_and_revision_defaults
        claim_type: Defaults
        grounds:
          - entities.PlanCycle.fields.quorum_weight_bps
          - entities.PlanCycle.fields.max_revision_rounds
          - entities.PlanCycle.fields.required_session_count
          - endpoints.post_plan_cycles
        distinguishing_aspect: "Creating a PlanCycle with only cycle_label and endorsement_deadline yields the declared defaults for quorum_weight_bps, max_revision_rounds and required_session_count, with round_number 0 and revision_count 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Default Cycle", endorsement_deadline: "2026-12-01T00:00:00Z" }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
          assert:
            - "status 201 and data.status == DRAFT"
            - "data.quorum_weight_bps, data.max_revision_rounds and data.required_session_count all equal the defaults declared in entities.PlanCycle"
            - "data.round_number == 0, data.revision_count == 0, data.achieved_weight_bps == 0, data.adopted_at == null"

      - name: asset_creation_defaults_is_shared_false_and_upstream_null
        claim_type: Defaults
        grounds:
          - entities.LifelineAsset.fields.is_shared
          - entities.LifelineAsset.fields.upstream_asset_id
          - endpoints.post_assets
        distinguishing_aspect: "Omitting both optional inputs yields is_shared false and upstream_asset_id null, and the row starts with criticality_status UNRANKED and all three ranking outputs null."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "HEALTH", name: "Harbor Clinic", replacement_value_cents: 300000000, service_population: 25000, redundancy_factor: 0.05 }
              as: RegionalAdministrator
              captures: { a_id: $.data.id }
          assert:
            - "status 201, data.is_shared == false, data.upstream_asset_id == null"
            - "data.criticality_status == UNRANKED, data.consequence_score == null, data.criticality_tier == null, data.dependency_depth == null"

      - name: mutual_aid_pact_creation_defaults_max_concurrent_commitments_to_three
        claim_type: Defaults
        grounds:
          - entities.MutualAidPact.fields.max_concurrent_commitments
          - endpoints.post_mutual_aid_pacts
        distinguishing_aspect: "Omitting max_concurrent_commitments yields 3, and the fresh pact opens with reserved_units 0, free_units equal to pledged_units and status OPEN."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/mutual-aid-pacts"
              payload: { host_jurisdiction_id: "${j_id}", resource_class: "COOLING_UNITS", pledged_units: 12, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_id}"
              captures: { pact_id: $.data.id }
          assert:
            - "status 201 and data.max_concurrent_commitments == 3"
            - "data.reserved_units == 0, data.free_units == 12, data.status == OPEN, data.version == 1"

      - name: jurisdiction_svi_tier_and_disadvantaged_flag_are_computed_not_accepted
        claim_type: Computed Fields
        grounds:
          - calculations.svi_tier_assignment
          - entities.Jurisdiction.fields.svi_tier
          - entities.Jurisdiction.fields.disadvantaged_flag
        distinguishing_aspect: "svi_score 0.18 produces svi_tier LOW and disadvantaged_flag false while svi_score 0.81 produces SEVERE and true, so the two computed fields are derived from svi_score at write time rather than supplied by the caller."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_low_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Delta Village", jurisdiction_code: "VILL-DELTA", population: 12000, svi_score: 0.81, endorsement_weight: 2 }
              as: RegionalAdministrator
              captures: { j_sev_id: $.data.id }
          assert:
            - "Jurisdiction.${j_low_id}.svi_tier == LOW and disadvantaged_flag == false"
            - "Jurisdiction.${j_sev_id}.svi_tier == SEVERE and disadvantaged_flag == true"

      - name: asset_creation_ignores_client_supplied_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.LifelineAsset
          - endpoints.post_assets
        distinguishing_aspect: "A create payload carrying id, created_at, updated_at, version and consequence_score is accepted, but every one of those fields in the response is server-generated: version is 1 and consequence_score is null, not the submitted values."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "COMMS", name: "Harbor Radio Tower", replacement_value_cents: 200000000, service_population: 60000, redundancy_factor: 0.15 }
              as: RegionalAdministrator
              captures: { a_id: $.data.id }
          assert:
            - "data.id != 11111111-1111-1111-1111-111111111111 even when that value is smuggled into the create payload as an unrecognised field"
            - "data.version == 1 and data.created_at == data.updated_at on a freshly created row"
            - "data.consequence_score == null and data.criticality_status == UNRANKED regardless of any submitted values"

      - name: hazard_profile_creation_with_unknown_hazard_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.HazardProfile.fields.hazard_type
          - validations.priority_7_ERR_INVALID_REQUEST
        distinguishing_aspect: "hazard_type WILDFIRE is outside the declared enum {HEAT, FLOOD, DROUGHT, STORM} and returns 422 ERR_INVALID_REQUEST; the same call with FLOOD returns 201."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_id}", hazard_type: "WILDFIRE", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { err_id: $.data.error_id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp_id: $.data.id }
          assert:
            - "first call: status 422 and data.error_id == ERR_INVALID_REQUEST"
            - "second call: status 201 and data.hazard_type == FLOOD"

      - name: hazard_profile_creation_with_out_of_enum_horizon_year_rejected
        claim_type: Type Constraints
        grounds:
          - entities.HazardProfile.fields.horizon_year
          - entities.HazardProfile.fields.exposure_index
          - validations.priority_7_ERR_INVALID_REQUEST
        distinguishing_aspect: "horizon_year 2050 is rejected because the declared set is exactly {2040, 2060, 2080}, and exposure_index 1.20 is rejected because the declared range is 0.00 to 1.00 inclusive — two different numeric constraint kinds on the same endpoint."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_id}", hazard_type: "HEAT", scenario: "RCP45", horizon_year: 2050, exposure_index: 0.50, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { err_year: $.data.error_id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_id}", hazard_type: "HEAT", scenario: "RCP45", horizon_year: 2040, exposure_index: 1.20, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { err_exposure: $.data.error_id }
          assert:
            - "both calls: status 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /resilience/hazard-profiles returns meta.total_count == 0"

      - name: project_asset_link_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ProjectAssetLink
          - endpoints.post_project_asset_links
          - endpoints.get_asset_link_by_id
        distinguishing_aspect: "ProjectAssetLink is declared common_fields false: the created row exposes id and created_at only, has no updated_at and no version, and §1.5 declares no PATCH or DELETE for it."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle and one SCREENED_IN AdaptationProject, plus one LifelineAsset."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
          trigger:
            - call: "POST /resilience/projects/${p1_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 3333333, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { link_id: $.data.id }
            - call: "GET /resilience/asset-links/${link_id}"
              payload: {}
              as: BCAReviewer
          assert:
            - "status 201 then 200; data.id and data.created_at are present"
            - "data has no updated_at key and no version key"
            - "data.link_sequence == 1 on the first link of the project"
            - "§1.5 declares no PATCH and no DELETE for /resilience/asset-links/{link_id}, so the row can never be edited after creation"

      - name: project_creation_with_unknown_plan_cycle_parent_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.AdaptationProject.fields.plan_cycle_id
          - validations.priority_5_ERR_JURISDICTION_NOT_FOUND
          - errors[ERR_PLAN_CYCLE_NOT_FOUND]
        distinguishing_aspect: "A body foreign key pointing at a non-existent PlanCycle returns 404 ERR_PLAN_CYCLE_NOT_FOUND from validation priority 5, before any state or business check on the sponsoring jurisdiction runs."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and no PlanCycle rows at all."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "00000000-0000-0000-0000-000000000000", jurisdiction_id: "${j_id}", name: "Orphan Project", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "status 404 and data.error_id == ERR_PLAN_CYCLE_NOT_FOUND"
            - "GET /resilience/projects returns meta.total_count == 0"

      - name: project_asset_link_junction_supports_many_to_many_graph_topology
        claim_type: Creation
        grounds:
          - entities.ProjectAssetLink
          - complexity_profile.entity_topology
          - endpoints.get_asset_links
        distinguishing_aspect: "Two AdaptationProjects each link the same two LifelineAssets, producing four ProjectAssetLink rows; filtering by project_id yields 2 and filtering by asset_id yields 2, which no one-to-many model could satisfy."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle, two LifelineAssets and two SCREENED_IN AdaptationProjects."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "WATER", name: "Asset One", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "POWER", name: "Asset Two", replacement_value_cents: 400000000, service_population: 40000, redundancy_factor: 0.10 }
              as: RegionalAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_id}", name: "Project Alpha", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { p_alpha_id: $.data.id }
            - call: "POST /resilience/projects/${p_alpha_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_id}", name: "Project Beta", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { p_beta_id: $.data.id }
            - call: "POST /resilience/projects/${p_beta_id}/screen"
              payload: {}
              as: RegionalAdministrator
          trigger:
            - call: "POST /resilience/projects/${p_alpha_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 3333333, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { l_a1_id: $.data.id }
            - call: "POST /resilience/projects/${p_alpha_id}/asset-links"
              payload: { asset_id: "${a2_id}", avoided_loss_annual_cents: 1111111, benefit_reaches_disadvantaged: false }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { l_a2_id: $.data.id }
            - call: "POST /resilience/projects/${p_beta_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 2222222, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { l_b1_id: $.data.id }
            - call: "POST /resilience/projects/${p_beta_id}/asset-links"
              payload: { asset_id: "${a2_id}", avoided_loss_annual_cents: 1000000, benefit_reaches_disadvantaged: false }
              as: ProjectSponsor
              as_user_id: "${j_id}"
              captures: { l_b2_id: $.data.id }
          assert:
            - "all four calls return 201"
            - "GET /resilience/asset-links with project_id ${p_alpha_id} returns meta.total_count == 2"
            - "GET /resilience/asset-links with asset_id ${a1_id} returns meta.total_count == 2, one row per project"
            - "ProjectAssetLink.${l_a1_id}.link_sequence == 1 and ProjectAssetLink.${l_a2_id}.link_sequence == 2, numbered per project rather than globally"
            - "ProjectAssetLink.${l_b1_id}.link_sequence == 1, restarting the sequence for the second project"

      - name: asset_self_referential_dependency_cycle_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.LifelineAsset.fields.upstream_asset_id
          - validations.priority_30_ERR_ASSET_DEPENDENCY_CYCLE
          - calculations.asset_consequence_score
        distinguishing_aspect: "Re-pointing the root asset's upstream_asset_id at its own downstream child closes a two-hop loop and returns 409 ERR_ASSET_DEPENDENCY_CYCLE, while an unknown upstream id on the same PATCH returns 404 first — the graph constraint and the plain foreign key are separate checks at priorities 30 and 5."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and two LifelineAssets where the second declares the first as its upstream asset."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "POWER", name: "Root Substation", replacement_value_cents: 500000000, service_population: 100000, redundancy_factor: 0.20 }
              as: RegionalAdministrator
              captures: { a_root_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_id}", asset_class: "WATER", name: "Downstream Pump", replacement_value_cents: 300000000, service_population: 80000, redundancy_factor: 0.10, upstream_asset_id: "${a_root_id}" }
              as: RegionalAdministrator
              captures: { a_child_id: $.data.id }
          trigger:
            - call: "PATCH /resilience/assets/${a_root_id}"
              payload: { upstream_asset_id: "00000000-0000-0000-0000-000000000000" }
              as: RegionalAdministrator
              captures: { err_fk: $.data.error_id }
            - call: "PATCH /resilience/assets/${a_root_id}"
              payload: { upstream_asset_id: "${a_child_id}" }
              as: RegionalAdministrator
              captures: { err_cycle: $.data.error_id }
          assert:
            - "first call: status 404 and data.error_id == ERR_ASSET_NOT_FOUND, since the unknown upstream id fails body-FK existence at priority 5 before the cycle check at priority 30"
            - "second call: status 409 and data.error_id == ERR_ASSET_DEPENDENCY_CYCLE, because walking upstream from ${a_root_id} would revisit ${a_root_id} through ${a_child_id}"
            - "LifelineAsset.${a_root_id}.upstream_asset_id is still null and version is still 1, so neither rejected PATCH mutated the row"
            - "LifelineAsset.${a_child_id}.upstream_asset_id == ${a_root_id}"

      - name: vulnerability_score_computed_field_excluded
        claim_type: Computed Fields
        grounds:
          - calculations.vulnerability_score
          - entities.VulnerabilityAssessment.fields.vulnerability_score
        excluded_because:
          difficulty_instance: dual_variant_calc / vulnerability_score_multiplicative_vs_additive_diverges
          rationale: "Both computed outputs and their bands are asserted as literals by the named §1.8 instance."

      - name: benefit_cost_analysis_computed_fields_excluded
        claim_type: Computed Fields
        grounds:
          - calculations.benefit_cost_ratio
          - entities.BenefitCostAnalysis.fields.bcr
        excluded_because:
          difficulty_instance: dual_variant_calc / bca_discounted_npv_vs_annualized_equivalent_diverges
          rationale: "benefit_measure_cents, cost_measure_cents, bcr and grant_eligible are all pinned to literals by the named §1.8 instance."

      - name: capital_program_ledger_computed_fields_excluded
        claim_type: Computed Fields
        grounds:
          - calculations.program_funding_ledger
          - entities.CapitalProgram.fields.committed_cents
        excluded_because:
          difficulty_instance: compensating_invariant / program_authorized_cents_conserved_across_allocate_and_withdraw
          rationale: "committed_cents, available_cents, equity_committed_cents, equity_achieved_bps and funding_posture are asserted at four observation points by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: plan_cycle_starts_in_draft_and_opens_engagement
        claim_type: Initial State
        grounds:
          - state_machines.PlanCycle.initial_state
          - state_machines.PlanCycle.DRAFT_to_ENGAGEMENT
          - endpoints.post_plan_cycle_open_engagement
        distinguishing_aspect: "A freshly created PlanCycle reads DRAFT, and open-engagement moves it to ENGAGEMENT while leaving round_number at 0 — only open-endorsement-round advances the round counter."
        test_recipe:
          setup:
            - "One DRAFT PlanCycle."
          setup_api_calls:
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-engagement"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "the create response already read data.status == DRAFT with data.round_number == 0"
            - "status 200 and data.status == ENGAGEMENT"
            - "data.round_number == 0 and data.revision_count == 0"
            - "data.version == 2, one increment above the created row"

      - name: hazard_profile_publish_supersedes_the_prior_published_profile
        claim_type: Side Effect Execution
        grounds:
          - state_machines.HazardProfile.DRAFT_to_PUBLISHED
          - endpoints.post_hazard_profile_publish
        distinguishing_aspect: "Publishing a second profile with the same (jurisdiction_id, hazard_type, scenario, horizon_year) flips the first one to SUPERSEDED; a profile that differs in horizon_year is left PUBLISHED, so the supersede predicate is the full four-part key rather than jurisdiction plus hazard."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and two PUBLISHED HazardProfiles: one FLOOD/RCP85/2060 and one FLOOD/RCP85/2080."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp_2060_a_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp_2060_a_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2080, exposure_index: 0.90, annual_event_probability: 0.03, projected_annual_loss_cents: 400000000 }
              as: HazardAnalyst
              captures: { hp_2080_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp_2080_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.85, annual_event_probability: 0.02, projected_annual_loss_cents: 300000000 }
              as: HazardAnalyst
              captures: { hp_2060_b_id: $.data.id }
          trigger:
            - call: "POST /resilience/hazard-profiles/${hp_2060_b_id}/publish"
              payload: {}
              as: HazardAnalyst
          assert:
            - "status 200, data.status == PUBLISHED, data.published_version == 1 and data.published_at != null"
            - "HazardProfile.${hp_2060_a_id}.status == SUPERSEDED"
            - "HazardProfile.${hp_2080_id}.status == PUBLISHED, untouched because horizon_year differs"
            - "GET /resilience/hazard-profiles with status SUPERSEDED returns meta.total_count == 1"

      - name: hazard_profile_publish_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.HazardProfile.DRAFT_to_PUBLISHED.preconditions
          - validations.priority_11_ERR_HAZARD_PROFILE_ALREADY_PUBLISHED
        distinguishing_aspect: "The second publish on the same row returns 409 ERR_HAZARD_PROFILE_ALREADY_PUBLISHED rather than re-publishing at published_version 2 — only POST /revisions may advance published_version."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and one PUBLISHED HazardProfile."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
          trigger:
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and data.error_id == ERR_HAZARD_PROFILE_ALREADY_PUBLISHED"
            - "HazardProfile.${hp1_id}.published_version == 1 and version == 2, unchanged by the rejected call"

      - name: assessment_assess_against_a_draft_profile_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.VulnerabilityAssessment.DRAFT_to_ASSESSED.preconditions
          - validations.priority_12_ERR_HAZARD_PROFILE_NOT_PUBLISHED
        distinguishing_aspect: "Assessing against a HazardProfile still in DRAFT returns 409 ERR_HAZARD_PROFILE_NOT_PUBLISHED even though the assessment itself is in the permitted DRAFT state, so the precondition reads the parent profile rather than the assessment."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT HazardProfile, one LifelineAsset and one DRAFT VulnerabilityAssessment against the unpublished profile."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va1_id: $.data.id }
          trigger:
            - call: "POST /resilience/vulnerability-assessments/${va1_id}/assess"
              payload: {}
              as: HazardAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and data.error_id == ERR_HAZARD_PROFILE_NOT_PUBLISHED"
            - "VulnerabilityAssessment.${va1_id}.status == DRAFT with vulnerability_score == null and assessed_profile_version == null"

      - name: assessment_reassess_from_stale_recomputes_against_the_new_projection
        claim_type: Valid Transition
        grounds:
          - state_machines.VulnerabilityAssessment.STALE_to_ASSESSED
          - calculations.vulnerability_score
        distinguishing_aspect: "After a revision drops exposure_index from 0.80 to 0.50, re-assessing the STALE row rewrites vulnerability_score from 0.82 to 0.67 and vulnerability_band from EXTREME to HIGH, and stamps assessed_profile_version 2 — the stale reading is replaced, not merged."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction with svi_score 0.62 (svi_tier HIGH), one PUBLISHED HazardProfile at exposure_index 0.80, one LifelineAsset and one ASSESSED VulnerabilityAssessment reading 0.82 / EXTREME."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
