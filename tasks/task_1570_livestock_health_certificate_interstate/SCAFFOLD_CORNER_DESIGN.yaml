            - "Submit one day after expiry -> error_id == 'ERR_VET_NOT_CURRENT' (422); certificate stays 'DRAFT'"

      - name: transmission_failure_keeps_certificate_issued_append_only
        claim_type: side_effect_execution
        grounds:
          - state_machines.TransmissionAudit.QUEUED_to_FAILED
          - errors[ERR_TRANSMISSION_NOT_ADVANCEABLE]
          - entities.TransmissionAudit.fields.failure_reason
        distinguishing_aspect: |
          A FAILED audit leaves the certificate ISSUED and the trail append-only:
          a fresh transmit appends a second QUEUED row while the failed row is
          terminally locked (acknowledge on FAILED returns
          ERR_TRANSMISSION_NOT_ADVANCEABLE).
        test_recipe:
          setup:
            - "ISSUED certificate (NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S27", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/certificates/${cert_id}/transmit"
              payload: { channel: "XML_GATEWAY" }
              as: StateVetOfficer
              captures: { audit1: $.data.id }
            - call: "POST /api/transmission-audits/${audit1}/fail"
              payload: { failure_reason: "GATEWAY_TIMEOUT" }
              as: StateVetOfficer
              captures: { a1_status: $.data.status, a1_reason: $.data.failure_reason }
            - call: "GET /api/certificates/${cert_id}"
              as: StateAuditor
              captures: { cert_mid: $.data.status }
            - call: "POST /api/transmission-audits/${audit1}/acknowledge"
              as: StateVetOfficer
              captures: { err_ack: $.data.error_id }
            - call: "POST /api/certificates/${cert_id}/transmit"
              payload: { channel: "EMAIL" }
              as: StateVetOfficer
              captures: { audit2: $.data.id, a2_status: $.data.status }
            - call: "GET /api/certificates/${cert_id}/transmissions"
              as: StateAuditor
          assert:
            - "TransmissionAudit.${audit1}.status == 'FAILED' with failure_reason == 'GATEWAY_TIMEOUT'"
            - "Certificate.${cert_id}.status remains 'ISSUED' after the failure (no transition)"
            - "acknowledge on FAILED audit -> error_id == 'ERR_TRANSMISSION_NOT_ADVANCEABLE' (409; terminal lockdown)"
            - "Re-transmit appends a SECOND audit ${audit2} with status 'QUEUED'; transmissions list total_count == 2 (append-only trail)"

      - name: premises_accredit_happy_and_repeat_rejected
        claim_type: invalid_transition
