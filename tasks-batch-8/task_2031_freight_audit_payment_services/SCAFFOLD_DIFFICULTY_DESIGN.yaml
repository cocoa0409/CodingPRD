            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", shipment_id: "${sh}", invoice_number: "INV-0004", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 91000, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 78000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7800 }, { charge_code: "LIFTGATE", billed_amount_minor: 5200 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id, pay0: $.data.payment_status }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/finalize_audit", payload: {}, as: AuditAnalyst }
