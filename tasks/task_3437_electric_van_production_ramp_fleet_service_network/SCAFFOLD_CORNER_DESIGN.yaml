      - name: vehicle_results_rejected_when_campaign_not_active
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/evfleet/software-campaigns/{id}/vehicle-results
          - "errors[ERR_CAMPAIGN_NOT_ACTIVE]"
        distinguishing_aspect: "Results only flow while a campaign is in CANARY / EXPANDED / GENERAL: a result posted to a DRAFT campaign is 409 ERR_CAMPAIGN_NOT_ACTIVE."
