        excluded_because:
          difficulty_instance: dual_variant_calc / remediation_volume_provisional_grid_versus_final_surveyed
          rationale: "That §1.8 instance computes both variants on identical project data (29.63 vs 9.19) and asserts the delta."

      - name: trust_fund_variant_selection_by_application_stage
        claim_type: variant_selection
        grounds:
          - calculations.trust_fund_eligible_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / trust_fund_preliminary_estimate_versus_final_settlement_eligibility
          rationale: "That §1.8 instance asserts which variant applies at which stage and the one-deductible gap between them on identical claimed_costs_cents."

      - name: remediation_volume_basis_reconciliation_on_switch
        claim_type: reconciliation
        grounds:
          - state_machines.DecommissionWorkOrder.billing_status.INVOICED_to_RECONCILED
          - entities.TankProject.fields.remediation_volume_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / remediation_volume_provisional_grid_versus_final_surveyed
          rationale: "That §1.8 instance drives the RECONCILE switch and asserts that remediation_volume_basis and the stored volume are rewritten to the FINAL_SURVEYED figure."

  # ===========================================================================
  - section: validations
    instances:

      - name: claim_submit_passes_when_every_gate_is_satisfied
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=55]
          - validations[priority=71]
          - state_machines.TrustFundClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: "On a CLEARED project (contamination_disclosure_required false) an NJ claim of 200000 yields admin 7000 and eligible 143000, so both the disclosure gate and the eligibility gate pass and the submit returns 200 with status SUBMITTED."
        test_recipe:
          setup: ["One NJ project at CLEARED after a clean round-1 result; one DRAFT PRELIMINARY_ESTIMATE claim for 200000 cents."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "24 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Xia Gold", homeowner_email: "xia@example.com", insurance_carrier_code: "CARR-C-24" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
