  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: io_flight_closed_interval_plus_dark_day_buffer_on_placement
        grounds:
          - validations[priority=15]
          - entities.MediaPlacement.fields.min_dark_days
          - entities.InsertionOrder.fields.flight_start
          - entities.InsertionOrder.fields.flight_end
          - errors[ERR_PLACEMENT_FLIGHT_CONFLICT]
        distinguishing_aspect: |
          Interval semantics #1, on the MediaPlacement resource: CLOSED date intervals widened by a
          min_dark_days buffer. With an existing flight ending 2026-06-10 and min_dark_days 2, a new
          flight starting 2026-06-12 COLLIDES (only one dark day) while a flight starting 2026-06-13
