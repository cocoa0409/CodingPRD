# =============================================================================
# Task 1195: Airport Rescue & Firefighting Readiness (ARFF) — Seed Tables
# =============================================================================

scenario: |
  1195. Airport Rescue & Firefighting Readiness (ARFF): index determination
  from largest aircraft & staffing minimum, vehicle/agent inventory &
  readiness check, response-time drill & certification, live-fire training
  currency by firefighter, alert level classification & mutual aid, equipment
  out-of-service & index downgrade notification, incident report &
  post-incident review, annual FAA inspection

domain_name: airport-rescue-firefighting-readiness
api_prefix: /arff

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - derived_field_reconciliation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# Index ordering convention used throughout: A < B < C < D < E.
# =============================================================================
entities:
  - name: AirportOpsProfile
    parent: null
    common_fields: true
    description: "Singleton ARFF configuration and derived readiness posture for the airport."
    fields:
      - { name: airport_code, type: string, source: input, description: "IATA-style airport code; singleton profile enforced by ERR_PROFILE_ALREADY_EXISTS" }
      - { name: certificated_index, type: enum, source: input, constraints: "A | B | C | D | E", description: "FAA-certificated ARFF index" }
      - { name: required_index_by_aircraft, type: enum, source: computed, constraints: "A | B | C | D | E", description: "Index band of the longest qualifying AircraftType (in_scheduled_service=true AND avg_daily_departures >= 5.0); A when no aircraft qualifies" }
      - { name: supported_index_by_equipment, type: enum, source: computed, constraints: "A | B | C | D | E | NONE", description: "Highest index whose vehicle-count and agent-capacity requirements are met by IN_SERVICE vehicles whose latest ReadinessCheck result is PASS (measured basis); NONE when even Index A is unmet" }
      - { name: supported_index_by_staffing, type: enum, source: computed, constraints: "A | B | C | D | E | NONE", description: "Highest index whose staffing minimum is met by deployment-ready firefighters (status ACTIVE and is_training_current); NONE when even Index A is unmet" }
      - { name: effective_index, type: enum, source: computed, constraints: "A | B | C | D | E | NONE", description: "= INDEX_MIN(certificated_index, supported_index_by_equipment, supported_index_by_staffing); NONE dominates" }
      - { name: index_compliance_status, type: enum, source: computed, constraints: "COMPLIANT | DOWNGRADED | NONCOMPLIANT", description: "COMPLIANT iff effective_index == certificated_index AND certificated_index >= required_index_by_aircraft; NONCOMPLIANT iff effective_index < required_index_by_aircraft; otherwise DOWNGRADED" }

  - name: AircraftType
    parent: null
    common_fields: true
    description: "An aircraft model operating at the airport; drives required_index_by_aircraft."
    fields:
      - { name: model_name, type: string, source: input, description: "Aircraft model designation, e.g. B737-900" }
      - { name: length_ft, type: number, source: input, description: "Fuselage length in feet; must be > 0" }
      - { name: avg_daily_departures, type: number, source: input, description: "Average daily departures; must be >= 0" }
      - { name: in_scheduled_service, type: boolean, source: input, default: true, description: "Whether the aircraft operates scheduled service" }
      - { name: qualifies_for_index, type: boolean, source: computed, description: "true iff in_scheduled_service AND avg_daily_departures >= 5.0" }
      - { name: index_band, type: enum, source: computed, constraints: "A | B | C | D | E", description: "A iff length_ft < 90; B iff 90 <= L < 126; C iff 126 <= L < 159; D iff 159 <= L < 200; E iff L >= 200" }

  - name: ArffVehicle
    parent: null
    common_fields: true
    description: "An ARFF vehicle with rated agent capacities and cyclic readiness status."
    fields:
      - { name: call_sign, type: string, source: input, description: "Unique vehicle call sign, e.g. RED-1" }
      - { name: water_capacity_gal, type: number, source: input, description: "Rated water/AFFF tank capacity in gallons; > 0" }
      - { name: dry_chem_capacity_lb, type: number, source: input, description: "Rated dry-chemical capacity in pounds; >= 0" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, constraints: "IN_SERVICE | OUT_OF_SERVICE", description: "Readiness status; cycled by OutOfServiceEvent open/restore" }
      - { name: latest_readiness_result, type: enum, source: computed, constraints: "PASS | FAIL | NONE", description: "Result of the most recent ReadinessCheck by checked_at (tie-break: created_at DESC); NONE when no check exists" }
      - { name: open_oos_event_id, type: string, source: system, description: "id of the currently OPEN OutOfServiceEvent; null when IN_SERVICE" }

  - name: ReadinessCheck
    parent: null
    common_fields: true
    description: "A measured agent/agent-system readiness observation for one vehicle."
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> ArffVehicle.id; the checked vehicle" }
      - { name: water_available_gal, type: number, source: input, description: "Measured water/AFFF gallons on board; >= 0 and <= vehicle.water_capacity_gal" }
      - { name: dry_chem_available_lb, type: number, source: input, description: "Measured dry-chemical pounds on board; >= 0 and <= vehicle.dry_chem_capacity_lb" }
      - { name: discharge_system_ok, type: boolean, source: input, description: "Whether the discharge/turret system passed functional test" }
      - { name: checked_at, type: datetime, source: system, description: "Logical-clock timestamp of the check" }
      - { name: result, type: enum, source: computed, constraints: "PASS | FAIL", description: "PASS iff discharge_system_ok == true AND water_available_gal > 0" }

  - name: Firefighter
    parent: null
    common_fields: true
    description: "An ARFF firefighter; entity-backed identity for the Firefighter role."
    fields:
      - { name: employee_no, type: string, source: input, description: "Unique employee number" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "Roster status; cycled by suspend/reactivate" }
      - { name: last_live_fire_completed_on, type: string, source: computed, description: "ISO date of the most recent LiveFireTrainingRecord with result PASS (max completed_on; tie-break: record created_at DESC); null when none" }
      - { name: is_training_current, type: boolean, source: computed, description: "true iff a PASS record exists and month_index(now) - month_index(last_live_fire_completed_on) <= 12, where month_index = year*12 + month" }
      - { name: is_deployable, type: boolean, source: computed, description: "true iff status == ACTIVE AND is_training_current == true" }

  - name: LiveFireTrainingRecord
    parent: null
    common_fields: true
    description: "One live-fire training completion for a firefighter; only PASS records confer currency."
    fields:
      - { name: firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the trained firefighter" }
      - { name: completed_on, type: string, source: input, description: "ISO date of completion; must not be after the current logical date (ERR_TRAINING_DATE_IN_FUTURE)" }
      - { name: drill_type, type: enum, source: input, constraints: "AIRCRAFT | STRUCTURAL", description: "Live-fire drill category" }
      - { name: result, type: enum, source: input, constraints: "PASS | FAIL", description: "Training outcome; FAIL records never confer currency" }

  - name: ResponseDrill
    parent: null
    common_fields: true
    description: "A timed response-time drill on a runway; certification feeds FAA inspection."
    fields:
      - { name: runway_designator, type: string, source: input, description: "Runway identifier, e.g. 09L" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start; must be strictly before scheduled_end (ERR_DRILL_WINDOW_INVALID)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (exclusive; half-open semantics for overlap)" }
      - { name: first_vehicle_arrival_seconds, type: integer, source: input, description: "Seconds from alarm until first vehicle reaches midpoint of farthest runway; set at execute; >= 0" }
      - { name: all_vehicles_arrival_seconds, type: integer, source: input, description: "Seconds from alarm until all required vehicles are in position; set at execute; >= 0" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execute; null until executed" }
      - { name: outcome, type: enum, source: computed, constraints: "PASS | FAIL | null", description: "null until executed; then PASS iff first_vehicle_arrival_seconds <= 180 AND all_vehicles_arrival_seconds <= 240, else FAIL" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | EXECUTED | CERTIFIED | FAILED", description: "Drill lifecycle" }

  - name: IndexDetermination
    parent: null
    common_fields: true
    description: "A formal index-determination record; creating one supersedes the previous ACTIVE determination and may re-certificate the profile."
    fields:
      - { name: largest_aircraft_id, type: string, source: input, description: "FK -> AircraftType.id; the asserted largest qualifying aircraft" }
      - { name: new_certificated_index, type: enum, source: input, constraints: "A | B | C | D | E", description: "Certificated index to adopt; must be >= computed required_index (ERR_INDEX_BELOW_REQUIRED)" }
      - { name: required_index, type: enum, source: computed, constraints: "A | B | C | D | E", description: "Required index computed from all qualifying aircraft at creation time" }
      - { name: vehicle_requirement_met, type: boolean, source: computed, description: "Whether supported_index_by_equipment >= required_index at creation time" }
      - { name: staffing_requirement_met, type: boolean, source: computed, description: "Whether supported_index_by_staffing >= required_index at creation time" }
      - { name: supersedes_determination_id, type: string, source: system, description: "id of the previously ACTIVE determination now SUPERSEDED; null for the first" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUPERSEDED", description: "Exactly one ACTIVE determination at a time" }

  - name: AlertIncident
    parent: null
    common_fields: true
    description: "An aircraft emergency alert/incident with classified alert level."
    fields:
      - { name: alert_level, type: enum, source: input, constraints: "ALERT_1 | ALERT_2 | ALERT_3", description: "ALERT_1 minor difficulty; ALERT_2 major difficulty; ALERT_3 accident; ordering ALERT_1 < ALERT_2 < ALERT_3" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> AircraftType.id; optional involved aircraft; may be null" }
      - { name: location, type: string, source: input, description: "Incident location description" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: controlled_at, type: datetime, source: system, description: "Logical-clock timestamp of the CONTROLLED transition; null until controlled" }
      - { name: status, type: enum, source: system, constraints: "REPORTED | RESPONDING | CONTROLLED | CLOSED", description: "Incident lifecycle" }

  - name: MutualAidAgreement
    parent: null
    common_fields: true
    description: "A mutual-aid agreement with a partner airport/fire service over a closed date window."
    fields:
      - { name: partner_airport_code, type: string, source: input, description: "Partner airport identifier" }
      - { name: max_alert_level, type: enum, source: input, constraints: "ALERT_1 | ALERT_2 | ALERT_3", description: "Highest incident alert level this agreement covers" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive window start; must be <= end_date (ERR_AGREEMENT_WINDOW_INVALID)" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive window end (closed interval: a new agreement whose start_date equals an existing agreement's end_date conflicts)" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED", description: "DRAFT on create; ACTIVE via activate; EXPIRED automatically when current logical date > end_date; TERMINATED via terminate" }

  - name: MutualAidRequest
    parent: null
    common_fields: true
    description: "A mutual-aid request raised against an incident under an agreement."
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> AlertIncident.id; from the create path" }
      - { name: agreement_id, type: string, source: input, description: "FK -> MutualAidAgreement.id; agreement under which aid is requested" }
      - { name: units_requested, type: integer, source: input, description: "Number of mutual-aid units requested; >= 1" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | DEPLOYED | RELEASED | DECLINED", description: "Request lifecycle" }

  - name: OutOfServiceEvent
    parent: null
    common_fields: true
    description: "An equipment out-of-service interval for one vehicle; opening one cascades into index recomputation."
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> ArffVehicle.id; from the create path" }
      - { name: reason, type: string, source: input, description: "Free-text reason for removal from service" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp when the event opened" }
      - { name: restored_at, type: datetime, source: system, description: "Logical-clock timestamp of restore; null while OPEN" }
      - { name: status, type: enum, source: system, constraints: "OPEN | RESTORED", description: "OPEN until restored" }

  - name: IndexDowngradeNotification
    parent: null
    common_fields: true
    description: "Regulatory notification raised when effective_index drops below certificated_index; must be acknowledged and cured."
    fields:
      - { name: prior_index, type: enum, source: system, constraints: "A | B | C | D | E | NONE", description: "effective_index immediately before the downgrade" }
      - { name: downgraded_index, type: enum, source: system, constraints: "A | B | C | D | E | NONE", description: "effective_index after the downgrade" }
      - { name: cause, type: enum, source: system, constraints: "EQUIPMENT | STAFFING", description: "EQUIPMENT when supported_index_by_equipment < certificated_index at trigger time; otherwise STAFFING (EQUIPMENT wins ties)" }
      - { name: notified_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: cure_deadline, type: datetime, source: computed, description: "= notified_at + 30 days" }
      - { name: status, type: enum, source: system, constraints: "PENDING | ACKNOWLEDGED | RESOLVED | OVERDUE", description: "PENDING on create; ACKNOWLEDGED via FAA acknowledge; OVERDUE when clock passes cure_deadline while PENDING or ACKNOWLEDGED; RESOLVED when effective_index returns to certificated_index" }

  - name: IncidentReport
    parent: null
    common_fields: true
    description: "Post-incident report with agent-expenditure lines and a cyclic review loop."
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> AlertIncident.id; from the create path" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating SafetyOfficer" }
      - { name: narrative, type: string, source: input, description: "Incident narrative; must be >= 200 characters at creation (ERR_NARRATIVE_TOO_SHORT)" }
      - { name: agent_expenditure_lines, type: array, source: input, default: "[]", description: "Array of {vehicle_id, water_gal_used, dry_chem_lb_used}; quantities >= 0" }
      - { name: agent_expense_total_cents, type: integer, source: computed, description: "Per-line: round_half_up(water_gal_used*137 + dry_chem_lb_used*89); total = sum of rounded line cents (rounding order pinned: round per line, then sum)" }
      - { name: review_cycle_count, type: integer, source: computed, default: 0, description: "Number of times the report has been RETURNED" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SUBMITTED | RETURNED | ACCEPTED", description: "Review-loop lifecycle; RETURNED -> DRAFT via PATCH" }

  - name: PostIncidentReview
    parent: null
    common_fields: true
    description: "Post-incident review with corrective actions, opened on an ACCEPTED report."
    fields:
      - { name: incident_report_id, type: string, source: system, description: "FK -> IncidentReport.id; from the create path" }
      - { name: findings, type: string, source: input, description: "Review findings text" }
      - { name: corrective_actions_open, type: integer, source: input, description: "Count of still-open corrective actions; >= 0; decremented via PATCH" }
      - { name: status, type: enum, source: system, constraints: "OPEN | CLOSED", description: "OPEN until closed; close requires corrective_actions_open == 0" }

  - name: FaaInspection
    parent: null
    common_fields: true
    description: "Annual FAA certification inspection with findings and conclusion gates."
    fields:
      - { name: inspection_year, type: integer, source: input, description: "Calendar year of inspection; unique (ERR_DUPLICATE_INSPECTION_YEAR)" }
      - { name: scheduled_on, type: string, source: input, description: "ISO date the inspection is scheduled" }
      - { name: findings_count, type: integer, source: system, description: "Number of findings recorded at issue-findings; null until then" }
      - { name: concluded_outcome, type: enum, source: system, constraints: "PASS | FAIL | null", description: "Conclusion outcome; null until concluded" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | IN_PROGRESS | FINDINGS_ISSUED | CLOSED_PASS | CLOSED_FAIL", description: "Inspection lifecycle" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ArffVehicle
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /arff/vehicles/{id}/out-of-service-events"
        actor: ArffChief
        preconditions:
          - "Vehicle must be IN_SERVICE (ERR_VEHICLE_ALREADY_OUT_OF_SERVICE)"
        side_effects:
          - "Create OutOfServiceEvent(OPEN, started_at = logical clock); set vehicle.open_oos_event_id"
          - "Recompute profile.supported_index_by_equipment (calculation fire_suppression_capacity_score over remaining IN_SERVICE vehicles with latest_readiness_result == PASS)"
          - "Recompute profile.effective_index and profile.index_compliance_status; increment AirportOpsProfile.version"
          - "If effective_index dropped below certificated_index and no notification in {PENDING, ACKNOWLEDGED, OVERDUE} exists: create IndexDowngradeNotification(PENDING, cause per rule, cure_deadline = now + 30 days)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /arff/out-of-service-events/{id}/restore"
        actor: ArffChief
        preconditions:
          - "OutOfServiceEvent must be OPEN (ERR_OOS_EVENT_NOT_OPEN)"
          - "A ReadinessCheck for this vehicle with result PASS and checked_at >= event.started_at must exist (ERR_READINESS_RECHECK_REQUIRED)"
        side_effects:
          - "OutOfServiceEvent -> RESTORED (restored_at = logical clock); vehicle.open_oos_event_id = null"
          - "Recompute profile.supported_index_by_equipment, effective_index, index_compliance_status; increment AirportOpsProfile.version"
          - "If effective_index returns to certificated_index and a notification in {PENDING, ACKNOWLEDGED, OVERDUE} exists: that notification -> RESOLVED"

  - entity: Firefighter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /arff/firefighters/{id}/suspend"
        actor: ArffChief
        preconditions:
          - "Firefighter must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute firefighter.is_deployable (false)"
          - "Recompute profile.supported_index_by_staffing, effective_index, index_compliance_status; increment AirportOpsProfile.version"
          - "If effective_index dropped below certificated_index and no open notification exists: create IndexDowngradeNotification(PENDING)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /arff/firefighters/{id}/reactivate"
        actor: ArffChief
        preconditions:
          - "Firefighter must be SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute firefighter.is_deployable"
          - "Recompute profile.supported_index_by_staffing, effective_index, index_compliance_status; increment AirportOpsProfile.version"
          - "If effective_index returns to certificated_index and an open notification exists: notification -> RESOLVED"

  - entity: ResponseDrill
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED, FAILED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /arff/response-drills/{id}/execute"
        actor: ArffChief
        preconditions:
          - "Drill must be SCHEDULED (ERR_DRILL_NOT_EXECUTABLE)"
          - "Logical clock must be within [scheduled_start, scheduled_end] (ERR_DRILL_WINDOW_EXPIRED when now > scheduled_end; ERR_DRILL_WINDOW_INVALID when now < scheduled_start)"
        side_effects:
          - "Record first_vehicle_arrival_seconds, all_vehicles_arrival_seconds, executed_at"
          - "Compute outcome per drill_outcome_threshold calculation"
      - from: EXECUTED
        to: CERTIFIED
        trigger: "POST /arff/response-drills/{id}/certify"
        actor: ArffChief
        preconditions:
          - "Drill must be EXECUTED (ERR_DRILL_NOT_CERTIFIABLE)"
          - "outcome must be PASS (ERR_RESPONSE_TIME_EXCEEDED)"
        side_effects: []
      - from: EXECUTED
        to: FAILED
        trigger: "POST /arff/response-drills/{id}/fail"
        actor: ArffChief
        preconditions:
          - "Drill must be EXECUTED (ERR_DRILL_NOT_EXECUTABLE)"
        side_effects: []

  - entity: IndexDetermination
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a newer IndexDetermination is created)"
        actor: system
        preconditions: []
        side_effects:
          - "New determination records supersedes_determination_id = this determination's id"

  - entity: AlertIncident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: RESPONDING
        trigger: "POST /arff/incidents/{id}/respond"
        actor: ArffChief
        preconditions:
          - "Incident must be REPORTED (ERR_INCIDENT_NOT_OPEN)"
          - "profile.effective_index >= ALERT_INDEX_REQ[alert_level] where ALERT_INDEX_REQ = {ALERT_1: A, ALERT_2: B, ALERT_3: C} (ERR_INDEX_INSUFFICIENT_FOR_ALERT)"
        side_effects: []
      - from: RESPONDING
        to: CONTROLLED
        trigger: "POST /arff/incidents/{id}/control"
        actor: ArffChief
        preconditions:
          - "Incident must be RESPONDING (ERR_INCIDENT_NOT_RESPONDING)"
        side_effects:
          - "Set controlled_at = logical clock"
      - from: CONTROLLED
        to: CLOSED
        trigger: "POST /arff/incidents/{id}/close"
        actor: ArffChief
        preconditions:
          - "Incident must be CONTROLLED (ERR_INCIDENT_NOT_CONTROLLED)"
          - "No MutualAidRequest for this incident in {REQUESTED, DEPLOYED} (ERR_OPEN_REQUESTS_EXIST)"
        side_effects: []
      - from: REPORTED
        to: REPORTED
        trigger: "PATCH /arff/incidents/{id}/alert-level"
        actor: ArffChief
        preconditions:
          - "Incident must be REPORTED or RESPONDING (ERR_INCIDENT_NOT_OPEN)"
          - "new alert_level must be strictly higher than current (ERR_ALERT_LEVEL_NOT_ESCALATION)"
        side_effects:
          - "alert_level updated in place (self-transition)"
      - from: RESPONDING
        to: RESPONDING
        trigger: "PATCH /arff/incidents/{id}/alert-level"
        actor: ArffChief
        preconditions:
          - "Incident must be REPORTED or RESPONDING (ERR_INCIDENT_NOT_OPEN)"
          - "new alert_level must be strictly higher than current (ERR_ALERT_LEVEL_NOT_ESCALATION)"
        side_effects:
          - "alert_level updated in place (self-transition)"

  - entity: MutualAidAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /arff/mutual-aid-agreements/{id}/activate"
        actor: AirportManager
        preconditions:
          - "Agreement must be DRAFT (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /arff/mutual-aid-agreements/{id}/terminate"
        actor: AirportManager
        preconditions:
          - "Agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: DRAFT
        to: EXPIRED
        trigger: "system (logical clock advance past end_date)"
        actor: system
        preconditions:
          - "current logical date > end_date"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock advance past end_date)"
        actor: system
        preconditions:
          - "current logical date > end_date"
        side_effects: []

  - entity: MutualAidRequest
    initial_state: REQUESTED
    terminal_states: [RELEASED, DECLINED]
    transitions:
      - from: REQUESTED
        to: DEPLOYED
        trigger: "POST /arff/mutual-aid-requests/{id}/deploy"
        actor: ArffChief
        preconditions:
          - "Request must be REQUESTED (ERR_REQUEST_NOT_ACTIONABLE)"
        side_effects: []
      - from: DEPLOYED
        to: RELEASED
        trigger: "POST /arff/mutual-aid-requests/{id}/release"
        actor: ArffChief
        preconditions:
          - "Request must be DEPLOYED (ERR_REQUEST_NOT_ACTIONABLE)"
        side_effects: []
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /arff/mutual-aid-requests/{id}/decline"
        actor: ArffChief
        preconditions:
          - "Request must be REQUESTED (ERR_REQUEST_NOT_ACTIONABLE)"
        side_effects: []

  - entity: OutOfServiceEvent
    initial_state: OPEN
    terminal_states: [RESTORED]
    transitions:
      - from: OPEN
        to: RESTORED
        trigger: "POST /arff/out-of-service-events/{id}/restore"
        actor: ArffChief
        preconditions:
          - "See ArffVehicle OUT_OF_SERVICE -> IN_SERVICE preconditions"
        side_effects:
          - "See ArffVehicle OUT_OF_SERVICE -> IN_SERVICE side_effects"

  - entity: IndexDowngradeNotification
    initial_state: PENDING
    terminal_states: [RESOLVED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /arff/index-downgrade-notifications/{id}/acknowledge"
        actor: FaaInspector
        preconditions:
          - "Notification must be PENDING or OVERDUE (ERR_NOTIFICATION_NOT_ACKNOWLEDGEABLE)"
        side_effects: []
      - from: OVERDUE
        to: ACKNOWLEDGED
        trigger: "POST /arff/index-downgrade-notifications/{id}/acknowledge"
        actor: FaaInspector
        preconditions:
          - "Notification must be PENDING or OVERDUE (ERR_NOTIFICATION_NOT_ACKNOWLEDGEABLE)"
        side_effects: []
      - from: PENDING
        to: OVERDUE
        trigger: "system (logical clock passes cure_deadline)"
        actor: system
        preconditions:
          - "now > cure_deadline"
        side_effects: []
      - from: ACKNOWLEDGED
        to: OVERDUE
        trigger: "system (logical clock passes cure_deadline)"
        actor: system
        preconditions:
          - "now > cure_deadline"
        side_effects: []
      - from: PENDING
        to: RESOLVED
        trigger: "system (effective_index restored to certificated_index)"
        actor: system
        preconditions:
          - "effective_index == certificated_index after recompute"
        side_effects: []
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "system (effective_index restored to certificated_index)"
        actor: system
        preconditions:
          - "effective_index == certificated_index after recompute"
        side_effects: []
      - from: OVERDUE
        to: RESOLVED
        trigger: "system (effective_index restored to certificated_index)"
        actor: system
        preconditions:
          - "effective_index == certificated_index after recompute"
        side_effects: []

  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /arff/incident-reports/{id}/submit"
        actor: SafetyOfficer
        preconditions:
          - "Report must be DRAFT (ERR_REPORT_NOT_SUBMITTABLE)"
          - "X-User-ID must equal report.author_user_id (ERR_NOT_REPORT_AUTHOR)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /arff/incident-reports/{id}/accept"
        actor: AirportManager
        preconditions:
          - "Report must be SUBMITTED (ERR_REPORT_NOT_REVIEWABLE)"
          - "X-User-ID must NOT equal report.author_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /arff/incident-reports/{id}/return"
        actor: AirportManager
        preconditions:
          - "Report must be SUBMITTED (ERR_REPORT_NOT_REVIEWABLE)"
          - "X-User-ID must NOT equal report.author_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "review_cycle_count += 1"
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /arff/incident-reports/{id}"
        actor: SafetyOfficer
        preconditions:
          - "Report must be DRAFT or RETURNED (ERR_REPORT_NOT_EDITABLE)"
          - "X-User-ID must equal report.author_user_id (ERR_NOT_REPORT_AUTHOR)"
        side_effects:
          - "When previous status was RETURNED, status resets to DRAFT; narrative/agent_expenditure_lines updated; agent_expense_total_cents recomputed"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /arff/incident-reports/{id}"
        actor: SafetyOfficer
        preconditions:
          - "Report must be DRAFT or RETURNED (ERR_REPORT_NOT_EDITABLE)"
          - "X-User-ID must equal report.author_user_id (ERR_NOT_REPORT_AUTHOR)"
        side_effects:
          - "narrative/agent_expenditure_lines updated; agent_expense_total_cents recomputed"

  - entity: PostIncidentReview
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /arff/post-incident-reviews/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "Review must be OPEN (ERR_REVIEW_NOT_CLOSABLE)"
          - "corrective_actions_open must equal 0 (ERR_ACTIONS_STILL_OPEN)"
        side_effects: []

  - entity: FaaInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASS, CLOSED_FAIL]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /arff/faa-inspections/{id}/begin"
        actor: FaaInspector
        preconditions:
          - "Inspection must be SCHEDULED (ERR_INSPECTION_NOT_BEGINNABLE)"
        side_effects: []
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /arff/faa-inspections/{id}/issue-findings"
        actor: FaaInspector
        preconditions:
          - "Inspection must be IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
        side_effects:
          - "Set findings_count from input"
      - from: FINDINGS_ISSUED
        to: CLOSED_PASS
        trigger: "POST /arff/faa-inspections/{id}/conclude with outcome=PASS"
        actor: FaaInspector
        preconditions:
          - "Inspection must be FINDINGS_ISSUED (ERR_INSPECTION_NOT_CONCLUDABLE)"
          - "No IndexDowngradeNotification in {PENDING, ACKNOWLEDGED, OVERDUE} (ERR_INSPECTION_BLOCKING_NOTIFICATIONS)"
          - "At least one ResponseDrill in CERTIFIED with month_index(now) - month_index(executed_at) <= 12 (ERR_NO_VALID_CERTIFIED_DRILL)"
          - "profile.index_compliance_status == COMPLIANT (ERR_PROFILE_NOT_COMPLIANT)"
        side_effects:
          - "concluded_outcome = PASS"
      - from: FINDINGS_ISSUED
        to: CLOSED_FAIL
        trigger: "POST /arff/faa-inspections/{id}/conclude with outcome=FAIL"
        actor: FaaInspector
        preconditions:
          - "Inspection must be FINDINGS_ISSUED (ERR_INSPECTION_NOT_CONCLUDABLE)"
        side_effects:
          - "concluded_outcome = FAIL"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: index-determination-stale-profile
    parent_entity: AirportOpsProfile
    write_endpoint: "POST /arff/index-determinations"
    occ_field: expected_profile_version
    description: |
      Creating an IndexDetermination against an AirportOpsProfile whose
      version has advanced beyond expected_profile_version is rejected. This
      captures the case where another writer has just created a determination
      (which legitimately supersedes the prior ACTIVE one and re-certificates
      the profile) or any cascade has mutated the profile, so the current
      writer's view of the profile is stale.
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: index_band_for_aircraft
    trigger: "AircraftType create/update of length_ft"
    algorithm: threshold
    formula: |
      if length_ft < 90: A
      elif length_ft < 126: B      # 90 <= L < 126
      elif length_ft < 159: C      # 126 <= L < 159
      elif length_ft < 200: D      # 159 <= L < 200
      else: E                      # L >= 200
      Band lower bounds are inclusive; upper bounds exclusive.
    input_set: "The single AircraftType row being created or updated"
    constants:
      BAND_B_MIN_FT: 90
      BAND_C_MIN_FT: 126
      BAND_D_MIN_FT: 159
      BAND_E_MIN_FT: 200

  - name: required_index_by_aircraft
    trigger: "AircraftType create/update (length_ft, avg_daily_departures, in_scheduled_service); read of profile"
    algorithm: aggregation
    formula: |
      qualifying = [a for a in AircraftType if a.in_scheduled_service AND a.avg_daily_departures >= 5.0]
      if qualifying is empty: required_index_by_aircraft = "A"
      else: required_index_by_aircraft = index_band of the qualifying aircraft with the
            greatest length_ft; tie-break: greatest avg_daily_departures, then created_at ASC.
    input_set: "All AircraftType rows; only rows with in_scheduled_service == true AND avg_daily_departures >= 5.0 qualify (departure threshold is inclusive: exactly 5.0 qualifies)"
    constants:
      QUALIFYING_MIN_DAILY_DEPARTURES: 5.0

  - name: fire_suppression_capacity_score
    trigger: "vehicle create, readiness check create, OOS open/restore"
    algorithm: tiered_pricing
    formula: |
      # Measured basis (production rule for supported_index_by_equipment):
      fleet = [v for v in ArffVehicle if v.status == IN_SERVICE AND v.latest_readiness_result == PASS]
      For each vehicle in fleet, quantities come from its latest ReadinessCheck
      (max checked_at; tie-break created_at DESC).
      water_sum = sum(latest_check.water_available_gal for v in fleet)
      chem_sum  = sum(latest_check.dry_chem_available_lb for v in fleet)
      Evaluate indexes in descending order E, D, C, B, A; the FIRST index I met wins:
        chem_equiv_gal = chem_sum * 1.2
        eff_water(I) = water_sum + min(chem_equiv_gal, 0.5 * WATER_REQ[I])
        met(I) = (len(fleet) >= VEH_REQ[I]) AND (eff_water(I) >= WATER_REQ[I])
      supported_index_by_equipment = highest met index, or "NONE" if none met.
    input_set: "ArffVehicle rows with status == IN_SERVICE AND latest_readiness_result == PASS; quantities from each vehicle's most recent ReadinessCheck"
    constants:
      VEH_REQ: {A: 1, B: 2, C: 2, D: 3, E: 3}
      WATER_REQ: {A: 100, B: 1500, C: 3000, D: 4000, E: 6000}
      DRY_CHEM_WATER_EQUIV_GAL_PER_LB: 1.2
      MAX_SUBSTITUTION_PCT: 0.5
    precision: "gallons to 2 decimal places; comparisons exact"
    variants:
      - name: rated_capacity_basis
        when: "Exposed on GET /arff/airport-profile/readiness as rated_basis_supported_index for audit comparison only"
        difference: "Uses rated water_capacity_gal/dry_chem_capacity_lb of ALL IN_SERVICE vehicles regardless of readiness-check result; never used for supported_index_by_equipment"

  - name: staffing_supported_index
    trigger: "firefighter create/suspend/reactivate, training record create, logical clock advance"
    algorithm: aggregation
    formula: |
      # Deployment-ready basis (production rule for supported_index_by_staffing):
      ready = [f for f in Firefighter if f.status == ACTIVE AND f.is_training_current]
      Evaluate indexes in descending order E, D, C, B, A; the FIRST index I with
      len(ready) >= STAFF_REQ[I] wins; "NONE" if none.
    input_set: "Firefighter rows with status == ACTIVE AND is_training_current == true"
    constants:
      STAFF_REQ: {A: 2, B: 3, C: 3, D: 4, E: 5}
    variants:
      - name: roster_basis
        when: "Exposed on GET /arff/airport-profile/readiness as roster_basis_supported_index for audit comparison only"
        difference: "Counts all Firefighter rows with status == ACTIVE regardless of training currency; never used for supported_index_by_staffing"

  - name: training_currency_window
    trigger: "training record create, logical clock advance, firefighter read"
    algorithm: threshold
    formula: |
      month_index(d) = year(d) * 12 + month(d)      # month in 1..12
      last = firefighter.last_live_fire_completed_on
      is_training_current = (last is not null) AND (month_index(today) - month_index(last) <= 12)
      So training completed in month M confers currency through the end of month M+12.
      Only LiveFireTrainingRecord rows with result == PASS feed last_live_fire_completed_on.
    input_set: "LiveFireTrainingRecord rows for the firefighter with result == PASS; last = max completed_on (tie-break: record created_at DESC)"
    constants:
      TRAINING_CURRENCY_MONTHS: 12

  - name: drill_outcome_threshold
    trigger: "POST /arff/response-drills/{id}/execute"
    algorithm: threshold
    formula: |
      outcome = PASS iff first_vehicle_arrival_seconds <= 180 AND all_vehicles_arrival_seconds <= 240
      else FAIL. Thresholds are inclusive: exactly 180 and exactly 240 pass.
    input_set: "The ResponseDrill being executed"
    constants:
      DRILL_FIRST_MAX_SECONDS: 180
      DRILL_ALL_MAX_SECONDS: 240

  - name: agent_expenditure_total
    trigger: "IncidentReport create/PATCH"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per line, then sum.
      for each line in agent_expenditure_lines:
        line_cents = round_half_up(line.water_gal_used * 137 + line.dry_chem_lb_used * 89)
      agent_expense_total_cents = sum(line_cents)
    input_set: "agent_expenditure_lines of the IncidentReport"
    constants:
      WATER_COST_CENTS_PER_GAL: 137
      DRY_CHEM_COST_CENTS_PER_LB: 89
    precision: "integer cents; round_half_up per line BEFORE summation"

  - name: effective_index_recompute
    trigger: "any mutation that changes supported_index_by_equipment, supported_index_by_staffing, certificated_index, or required_index_by_aircraft"
    algorithm: constraint_propagation
    formula: |
      order: NONE < A < B < C < D < E (NONE dominates any minimum)
      effective_index = INDEX_MIN(certificated_index, supported_index_by_equipment, supported_index_by_staffing)
      index_compliance_status =
        NONCOMPLIANT if effective_index < required_index_by_aircraft
        COMPLIANT    else if effective_index == certificated_index AND certificated_index >= required_index_by_aircraft
        DOWNGRADED   otherwise
      Notification rules:
        CREATE: when a recompute changes effective_index from a value >= certificated_index
                to a value strictly below certificated_index AND no IndexDowngradeNotification
                in {PENDING, ACKNOWLEDGED, OVERDUE} exists, create one
                (prior_index = effective_index before this recompute,
                downgraded_index = effective_index after, cause = EQUIPMENT if
                supported_index_by_equipment < certificated_index else STAFFING).
                The initial profile-creation recompute has no previous value and never fires;
                build-up recomputes that never reach certificated_index also never fire.
        RESOLVE: when a recompute makes effective_index == certificated_index AND an
                IndexDowngradeNotification in {PENDING, ACKNOWLEDGED, OVERDUE} exists,
                that notification -> RESOLVED.
    input_set: "AirportOpsProfile computed fields"
    constants:
      CURE_DAYS: 30

  - name: downgrade_cure_deadline
    trigger: "IndexDowngradeNotification creation; logical clock advance"
    algorithm: chronological
    formula: |
      cure_deadline = notified_at + 30 days
      When now > cure_deadline and status in {PENDING, ACKNOWLEDGED}: status -> OVERDUE
      (evaluated on logical-clock advance and on every read).
    input_set: "IndexDowngradeNotification rows in {PENDING, ACKNOWLEDGED}"
    constants:
      CURE_DAYS: 30

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "The role must be permitted for this endpoint per the endpoint table"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Resource ids in the path, then FK ids in the body (left-to-right), must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PROFILE_NOT_FOUND, ERR_AIRCRAFT_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_FIREFIGHTER_NOT_FOUND, ERR_DRILL_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_OOS_EVENT_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_INSPECTION_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 3.5
    category: existence
    check: "Required request-body fields must be present with correct types (call_sign, employee_no, narrative, etc.)"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all POST/PATCH endpoints"
  - priority: 3.6
    category: existence
    check: "expected_profile_version must equal the current AirportOpsProfile.version (OCC)"
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412
    applies_to: "POST /arff/index-determinations"
  - priority: 4
    category: state
    check: "Target resource must be in the state required by the transition (vehicle IN_SERVICE for OOS open; drill SCHEDULED for execute; drill EXECUTED for certify/fail; incident REPORTED/RESPONDING/CONTROLLED per action; agreement DRAFT/ACTIVE per action; request REQUESTED/DEPLOYED per action; report DRAFT/SUBMITTED per action; review OPEN for close; inspection state per action; notification PENDING/OVERDUE for acknowledge; OOS event OPEN for restore; singleton profile absent for profile create)"
    error_id: "ERR_VEHICLE_ALREADY_OUT_OF_SERVICE | ERR_DRILL_NOT_EXECUTABLE | ERR_DRILL_NOT_CERTIFIABLE | ERR_INCIDENT_NOT_OPEN | ERR_INCIDENT_NOT_RESPONDING | ERR_INCIDENT_NOT_CONTROLLED | ERR_AGREEMENT_NOT_ACTIVE | ERR_REQUEST_NOT_ACTIONABLE | ERR_REPORT_NOT_SUBMITTABLE | ERR_REPORT_NOT_REVIEWABLE | ERR_REPORT_NOT_EDITABLE | ERR_REVIEW_NOT_CLOSABLE | ERR_REVIEW_NOT_EDITABLE | ERR_INSPECTION_NOT_BEGINNABLE | ERR_INSPECTION_NOT_IN_PROGRESS | ERR_INSPECTION_NOT_CONCLUDABLE | ERR_NOTIFICATION_NOT_ACKNOWLEDGEABLE | ERR_OOS_EVENT_NOT_OPEN | ERR_PROFILE_ALREADY_EXISTS | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Safety/regulatory gates: effective_index sufficient for incident alert level (respond); drill outcome PASS for certify; PASS readiness recheck after OOS start before restore; firefighter ACTIVE for new training record; no open downgrade notification / valid certified drill / COMPLIANT profile for inspection PASS"
    error_id: "ERR_INDEX_INSUFFICIENT_FOR_ALERT | ERR_RESPONSE_TIME_EXCEEDED | ERR_READINESS_RECHECK_REQUIRED | ERR_FIREFIGHTER_NOT_ACTIVE | ERR_INSPECTION_BLOCKING_NOTIFICATIONS | ERR_NO_VALID_CERTIFIED_DRILL | ERR_PROFILE_NOT_COMPLIANT"
    http_status: 422
    applies_to: "respond, certify, restore, training-record create, inspection conclude"
  - priority: 6
    category: business_referential
    check: "Referenced entity states: agreement must be ACTIVE for a mutual-aid request; agreement max_alert_level must cover incident alert_level; incident must be REPORTED/RESPONDING for request creation; report must be ACCEPTED for review creation and have no other OPEN review"
    error_id: "ERR_AGREEMENT_NOT_ACTIVE | ERR_ALERT_LEVEL_NOT_COVERED | ERR_INCIDENT_NOT_RESPONDING | ERR_REPORT_NOT_ACCEPTED | ERR_REVIEW_ALREADY_OPEN"
    http_status: 409
    applies_to: "mutual-aid-request create, post-incident-review create"
  - priority: 7
    category: business_temporal
    check: "Time-window rules: report creation within 10 days of incident controlled_at (inclusive); training completed_on not after current logical date; drill window start < end and execute within window; agreement start_date <= end_date"
    error_id: "ERR_REPORT_WINDOW_EXPIRED | ERR_TRAINING_DATE_IN_FUTURE | ERR_DRILL_WINDOW_INVALID | ERR_DRILL_WINDOW_EXPIRED | ERR_AGREEMENT_WINDOW_INVALID"
    http_status: 422
    applies_to: "report create, training-record create, drill create/execute, agreement create"
  - priority: 8
    category: business_constraint
    check: "Constraint rules: unique call_sign / employee_no / inspection_year; drill half-open runway overlap among SCHEDULED drills; agreement closed-window overlap per partner among DRAFT/ACTIVE; narrative >= 200 chars; alert-level escalation strictly increasing; incident close blocked by open requests; review close blocked by open actions; report author identity for submit/patch; reviewer not the author for accept/return; measured quantities <= rated capacities; determination aircraft qualifying / longest qualifying / new index >= required"
    error_id: "ERR_DUPLICATE_CALL_SIGN | ERR_DUPLICATE_EMPLOYEE_NO | ERR_DUPLICATE_INSPECTION_YEAR | ERR_DRILL_WINDOW_OVERLAP | ERR_AGREEMENT_WINDOW_OVERLAP | ERR_NARRATIVE_TOO_SHORT | ERR_ALERT_LEVEL_NOT_ESCALATION | ERR_OPEN_REQUESTS_EXIST | ERR_ACTIONS_STILL_OPEN | ERR_NOT_REPORT_AUTHOR | ERR_SELF_APPROVAL_FORBIDDEN | ERR_MEASURED_EXCEEDS_CAPACITY | ERR_AIRCRAFT_NOT_QUALIFYING | ERR_NOT_LARGEST_QUALIFYING_AIRCRAFT | ERR_INDEX_BELOW_REQUIRED"
    http_status: 422
    applies_to: "entity create/patch endpoints, incident close, review close, report submit/patch/accept/return, readiness-check create, index-determination create"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/arff/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [AirportManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Re-evaluate all time-derived fields (is_training_current, agreement EXPIRED, notification OVERDUE); run effective_index_recompute with its notification create/resolve rules"

  # --- Airport profile ---
  - method: POST
    path: "/arff/airport-profile"
    description: "Create the singleton airport ARFF profile"
    roles: [AirportManager]
    code: 201
    input: [airport_code, certificated_index]
    output: AirportOpsProfile
    side_effects: ["Initial recompute of all computed fields (notification create rule suppressed for the initial recompute)"]
  - method: GET
    path: "/arff/airport-profile"
    description: "Read the airport ARFF profile with computed posture fields"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: AirportOpsProfile
    side_effects: []
  - method: GET
    path: "/arff/airport-profile/readiness"
    description: "Computed readiness evaluation including both calculation variants"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: "{ certificated_index: string, required_index_by_aircraft: string, supported_index_by_equipment: string, supported_index_by_staffing: string, effective_index: string, index_compliance_status: string, rated_basis_supported_index: string, roster_basis_supported_index: string, effective_water_gal_at_certificated_index: number, in_service_passing_vehicle_count: integer, roster_active_count: integer, deployment_ready_count: integer, open_notification_id: string }"
    side_effects: []

  # --- Aircraft ---
  - method: POST
    path: "/arff/aircraft"
    description: "Register an aircraft type operating at the airport"
    roles: [AirportManager]
    code: 201
    input: [model_name, length_ft, avg_daily_departures, "in_scheduled_service?"]
    output: AircraftType
    side_effects: ["Recompute profile.required_index_by_aircraft and index_compliance_status; increment AirportOpsProfile.version"]
  - method: GET
    path: "/arff/aircraft"
    description: "List aircraft types"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["in_scheduled_service?", "limit?", "offset?"]
    output: "AircraftType[]"
    side_effects: []
  - method: GET
    path: "/arff/aircraft/{id}"
    description: "Get one aircraft type"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: AircraftType
    side_effects: []
  - method: PATCH
    path: "/arff/aircraft/{id}"
    description: "Update an aircraft type's service figures"
    roles: [AirportManager]
    code: 200
    input: ["model_name?", "length_ft?", "avg_daily_departures?", "in_scheduled_service?"]
    output: AircraftType
    side_effects: ["Recompute qualifies_for_index, index_band, profile.required_index_by_aircraft; increment AirportOpsProfile.version"]
  - method: GET
    path: "/arff/aircraft/{id}/index-determinations"
    description: "List index determinations that name this aircraft as largest"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "IndexDetermination[]"
    side_effects: []
  - method: GET
    path: "/arff/aircraft/{id}/incidents"
    description: "List incidents involving this aircraft"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "AlertIncident[]"
    side_effects: []

  # --- Vehicles & readiness ---
  - method: POST
    path: "/arff/vehicles"
    description: "Register an ARFF vehicle"
    roles: [ArffChief]
    code: 201
    input: [call_sign, water_capacity_gal, dry_chem_capacity_lb]
    output: ArffVehicle
    side_effects: ["Recompute supported_index_by_equipment (vehicle has latest_readiness_result NONE so it does not yet count)"]
  - method: GET
    path: "/arff/vehicles"
    description: "List ARFF vehicles"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ArffVehicle[]"
    side_effects: []
  - method: GET
    path: "/arff/vehicles/{id}"
    description: "Get one ARFF vehicle"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: ArffVehicle
    side_effects: []
  - method: GET
    path: "/arff/vehicles/{id}/readiness-checks"
    description: "List readiness checks for a vehicle"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReadinessCheck[]"
    side_effects: []
  - method: GET
    path: "/arff/vehicles/{id}/out-of-service-events"
    description: "List out-of-service events for a vehicle"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "OutOfServiceEvent[]"
    side_effects: []
  - method: POST
    path: "/arff/readiness-checks"
    description: "Record a readiness check for a vehicle (allowed in either vehicle status; required before restore)"
