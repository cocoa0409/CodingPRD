              as_user_id: "am-1"
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 10000, construction_window_start: "2027-06-01T00:00:00Z", construction_window_end: "2027-09-01T00:00:00Z", estimated_cost_cents: 300000 }
