        claim_type: satisfaction_pass
        grounds:
          - validations[priority=13]
          - calculations.credit_exposure
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Fiscal gate uses <= : a shipper with credit_limit_cents exactly 77400 confirms the first booking (154800 would fail); the second identical booking pushes the forward total to 154800 > 77400 and is rejected."
        test_recipe:
          setup: ["Shipper credit_limit_cents == 77400; two QUOTED LCL bookings (estimate 77400 each)"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME LIM", credit_limit_cents: 77400 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
