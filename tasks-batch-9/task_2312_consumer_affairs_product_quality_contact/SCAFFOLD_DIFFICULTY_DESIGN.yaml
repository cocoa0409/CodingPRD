            - { call: "POST /remedies/${rm1}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "First pass." }, captures: { s1: "$.data.status" } }
            - { call: "POST /remedies/${rm1}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: REQUEST_REVISION, decision_note: "Add the batch code." }, captures: { r1: "$.data.status", n1: "$.data.revision_count" } }
            - { call: "POST /remedies/${rm1}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "Second pass." }, captures: { s2: "$.data.status" } }
