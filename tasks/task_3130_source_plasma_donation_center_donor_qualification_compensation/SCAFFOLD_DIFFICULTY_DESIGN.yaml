  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict: three dual-failure
  # scenarios with DIFFERENT error-category pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: checkin_state_beats_fiscal_when_schedule_retired
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - state_machines.CompensationSchedule.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Error-category pair = state (priority 6) vs business_fiscal (priority 17).
          The second check-in on an already IN_PROGRESS visit violates BOTH the state
          precondition (ERR_VISIT_NOT_SCHEDULED) and the fiscal rule (the schedule was
          retired after the first check-in, so no ACTIVE schedule covers the instant);
          the state error MUST win.
        test_recipe:
          setup:
            - "Center with schedule S; donor with cleared screening; dv checked in successfully at 09:30 (payment pinned to S)"
            - "S then retired (version captured from its create response)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 2, donor_floor_beds: 2, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
              payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", base_cents_first_donation: 3000, base_cents_second_donation: 2500, base_cents_subsequent_donation: 2000, expected_center_version: "${cv}" }
              as: PlatformAdmin
              captures: { sch: $.data.id, schv: $.data.version }
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-000001", legal_first_name: "Jane", legal_last_name: "Doe", date_of_birth: "1990-04-12", weight_kg: 72.5, home_center_id: "${c}" }
              as: Recorder
              captures: { d: $.data.id }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:00:00Z" }
              as: Recorder
              captures: { s1: $.data.id }
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
