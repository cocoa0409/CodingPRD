  - section: endpoints
    instances:
      - name: field_get_response_envelope
        claim_type: retrieval
        grounds:
          - response_envelope
          - entities.Field
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == 'object' for single-resource GET."
        test_recipe:
          setup: ["field F1 exists"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - { call: "GET /api/fields/${f_id}", payload: {}, as: FarmManager }
          assert:
            - "response meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601"
            - "response response_type == 'object' and data.name == 'F1' and data.acreage == 100"

      - name: spot_sale_confirm_happy_path
        claim_type: conditional_action
        grounds:
          - state_machines.SpotSale.DRAFT_to_CONFIRMED
          - state_machines.PelletLot.RESERVED_to_SOLD
        distinguishing_aspect: "Confirm succeeds when a SELECTED sample exists and the credit limit equals the total exactly (478400 <= 478400): sale_total_cents == 478400 and the lot flips RESERVED -> SOLD."
        test_recipe:
          setup: ["pellet lot 736 AVAILABLE; sample SELECTED for (lot, CraftBrew); DRAFT sale price 650 limit 478400"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/samples", payload: { pellet_lot_id: "${pellet_id}", brewery_name: "CraftBrew" }, as: ContractManager, captures: { samp_id: $.data.id } }
            - { call: "POST /api/samples/${samp_id}/decide", payload: { outcome: "SELECTED" }, as: ContractManager }
            - { call: "POST /api/spot-sales", payload: { pellet_lot_id: "${pellet_id}", buyer_name: "CraftBrew", price_cents_per_lb: 650, buyer_credit_limit_cents: 478400 }, as: ContractManager, captures: { sale_id: $.data.id, qty: $.data.qty_lbs } }
          trigger:
            - { call: "POST /api/spot-sales/${sale_id}/confirm", payload: {}, as: ContractManager, captures: { st: $.data.status, total: $.data.sale_total_cents } }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: ContractManager, captures: { l_st: $.data.inventory_status } }
          assert:
            - "captured qty == 736 (whole-lot snapshot at draft)"
            - "captured st == CONFIRMED and total == 478400 (736 x 650)"
            - "captured l_st == SOLD"

      - name: rollover_completes_expired_contracts
        claim_type: conditional_action
        grounds:
          - state_machines.Contract.ACTIVE_to_COMPLETED
          - calculations.carryover_decay
        distinguishing_aspect: "Rollover at clock year 2027 completes an ACTIVE contract with term_end_year 2026 and CANCELS its leftover PROJECTED allocation."
        test_recipe:
          setup: ["contract term 2026-2026 ACTIVE; run 2026 leaves a PROJECTED allocation; clock advanced to 2027-01-15"]
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2026, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/ops/crop-year-rollover", payload: {}, as: FarmManager }
            - { call: "GET /api/contracts/${c_id}", payload: {}, as: ContractManager, captures: { c_st: $.data.status } }
            - { call: "GET /api/allocations/${a_id}", payload: {}, as: ContractManager, captures: { a_st: $.data.status } }
          assert:
            - "captured c_st == COMPLETED (term_end_year 2026 < clock year 2027)"
            - "captured a_st == CANCELLED (non-terminal allocation cleaned up by the completion cascade)"

  - section: state_machines
    instances:
      - name: sample_resend_after_rejection_increments_round
        claim_type: cyclic_shape
        grounds:
          - state_machines.BrewerySample
