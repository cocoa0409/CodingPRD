  - section: state_machines
    instances:

      - name: zone_version_activation_supersedes_the_earlier_window_and_bumps_the_store
        claim_type: side_effect_execution
        grounds:
          - state_machines.ZoneVersion.DRAFT_to_ACTIVE
          - entities.ZoneVersion.fields.supersedes_zone_version_id
          - entities.ZoneVersion.fields.activated_at
          - entities.Store.fields.active_zone_version_number
        distinguishing_aspect: "Activating the August window supersedes exactly the July window whose effective_to (2026-08-01T00:00:00Z) is <= the new effective_from, stamps supersedes_zone_version_id, and bumps Store.version by 1 while Store.active_zone_version_number re-derives to the newly ACTIVE version_number."
        test_recipe:
          setup:
            - "A store whose July zone version [2026-07-01, 2026-08-01) is already ACTIVE, plus a DRAFT August version [2026-08-01, 2026-09-01) with the same polygon."
            - "The logical clock sits at 2026-08-05T09:00:00Z, inside the August window."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv_jul_id: $.data.id, zv_jul_number: $.data.version_number }
            - call: "POST /store-ops/zone-versions/${zv_jul_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /store-ops/stores/${store_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { store_v2: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v2}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv_aug_id: $.data.id, zv_aug_number: $.data.version_number }
          trigger:
            - call: "POST /store-ops/zone-versions/${zv_aug_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "ZoneVersion.${zv_aug_id}.status == 'ACTIVE' and activated_at == '2026-08-05T09:00:00Z'"
            - "ZoneVersion.${zv_aug_id}.supersedes_zone_version_id == ${zv_jul_id}"
            - "ZoneVersion.${zv_jul_id}.status == 'SUPERSEDED'"
            - "${zv_aug_number} == ${zv_jul_number} + 1"
            - "Store.${store_id}.version == ${store_v2} + 1, the activation having bumped it exactly once"
            - "Store.${store_id}.active_zone_version_number == ${zv_aug_number}, because only the August window contains the logical clock"

      - name: activating_an_already_active_zone_version_is_rejected_as_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ZoneVersion.DRAFT_to_ACTIVE
          - validations.priority_12
          - errors.ERR_INVALID_ZONE_VERSION_STATE
        distinguishing_aspect: "The activate action is not idempotent: a second call on the same ACTIVE version fails with ERR_INVALID_ZONE_VERSION_STATE (409) and leaves activated_at, Store.version and the supersession lineage untouched."
        test_recipe:
          setup:
            - "A store with one ACTIVE zone version activated at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
