          rationale: "that §1.8 instance violates the priority 10 state rule and the priority 36 fiscal rule in one call and pins the returned error to the state error"

      - name: adjacent_priority_bands_conflict
        claim_type: Priority conflict
        grounds:
          - validations
        excluded_because:
          difficulty_instance: hearing_request_closed_period_error_wins_over_non_substantive_comment
          rationale: "that §1.8 instance pits the priority 17 temporal rule against the priority 25 referential rule on a single hearing request"

