      - name: coupon_item_adjudication_ladder_produces_all_five_branches
        claim_type: branching_fork
        grounds:
          - state_machines.CouponItem.transitions
          - calculations.duplicate_barcode_detection
          - calculations.misredemption_match
          - calculations.retailer_fraud_score
        distinguishing_aspect: |
          One finalize drives all five CouponItem outcomes plus both
          REJECTED_MISREDEEMED reject_codes out of a single six-item lot, and
          pins the ladder's precedence twice: item 2 is counterfeit even though
          it is also expired (step 1 before step 2) and item 4 is a duplicate
