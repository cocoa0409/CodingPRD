      - name: premium_components_round_at_each_jurisdiction_before_summing
        claim_type: precision
        grounds:
          - calculations.indicated_premium
          - entities.ExposureAssessment.fields.base_premium_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / premium_per_jurisdiction_round_then_sum_order
          rationale: "The named §1.8 instance pins the round-then-sum boundary (14278501 versus the 14278500 a sum-then-round implementation produces), which is exactly the precision claim for this calculation."

      - name: quote_and_bound_audit_variants_diverge_on_the_same_data
        claim_type: variant_divergence
        grounds:
          - calculations.indicated_premium
          - entities.Policy.fields.premium_variance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / premium_quote_vs_bound_audit_variant_divergence
          rationale: "The named §1.8 instance prices the QUOTE variant at 17360516 and the BOUND_AUDIT variant at 19844261 on identical applicant data and asserts the delta."

      - name: retention_variant_is_selected_by_the_claims_grouping_context
        claim_type: variant_selection
        grounds:
          - calculations.claim_retention
          - entities.Claim.fields.retention_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / retention_per_claim_vs_group_aggregated_variant_divergence
          rationale: "The named §1.8 instance asserts that PER_CLAIM applies while a claim is ungrouped and GROUP_AGGREGATED takes over on attachment, which is the variant-selection claim."

      - name: bound_audit_switch_posts_the_premium_variance_to_the_policy
        claim_type: reconciliation
        grounds:
          - entities.Policy.fields.bound_premium_cents
          - entities.Policy.fields.premium_variance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / premium_quote_vs_bound_audit_variant_divergence
          rationale: "The named §1.8 instance asserts premium_variance_cents == 2483745 at bind, which is the provisional-to-final delta reconciliation for this scaffold."

      - name: risk_credit_sums_only_active_risk_management_services
        claim_type: input_set_filtering
        grounds:
          - calculations.risk_credit_pct
          - entities.RiskManagementService.fields.status
        excluded_because:
          difficulty_instance: transitive_cascade / risk_service_revoke_cascade_depth_two
          rationale: "The named §1.8 instance asserts risk_credit_pct dropping from 0.13 to 0.08 when one service leaves ACTIVE, which is the input-set filtering claim for this calculation."

      - name: aggregate_ledger_is_correct_after_a_reversal
        claim_type: aggregation
        grounds:
          - entities.Policy.fields.indemnity_paid_cents
          - entities.Policy.fields.aggregate_limit_remaining_cents
        excluded_because:
          difficulty_instance: compensating_invariant / payment_void_restores_policy_indemnity_capital_exactly
          rationale: "The named §1.8 instance asserts the running indemnity total after an add and after a void, including the limit_posture return to OPEN, which is the aggregation-after-reversal claim."

  - section: validations
    instances:

      - name: duplicate_jurisdiction_code_rate_plan_name_and_firm_name_are_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors.ERR_DUPLICATE_JURISDICTION_CODE
          - errors.ERR_DUPLICATE_RATE_PLAN_NAME
          - errors.ERR_DUPLICATE_PANEL_FIRM_NAME
        distinguishing_aspect: "One priority-32 rule fans out into three distinct error ids keyed by which uniqueness scope was violated — Jurisdiction.code, RatePlan.name and DefensePanelFirm.name — and the collision is detected even though every other field in the retried payload differs."
        test_recipe:
          setup:
            - "Jurisdiction TX, RatePlan EPLI Standard 2026 and DefensePanelFirm Ashford & Vance LLP already exist."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { rp_id: $.data.id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Ashford & Vance LLP", tier: "NATIONAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 92000, associate_rate_cents_per_hour: 51000, paralegal_rate_cents_per_hour: 18000, capacity_open_matters: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas Republic", hazard_tier: "T4", admin_agency_name: "Some Other Agency", pre_suit_window_days: 300, wage_hour_multiplier: 1.90, class_action_propensity_pct: 55.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_code: $.data.error_id }
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 99999, min_premium_cents: 100000, wage_hour_sublimit_pct: 0.10, third_party_sublimit_pct: 0.10 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_plan: $.data.error_id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Ashford & Vance LLP", tier: "LOCAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 10000, associate_rate_cents_per_hour: 9000, paralegal_rate_cents_per_hour: 8000, capacity_open_matters: 1 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_firm: $.data.error_id }
          assert:
            - "the duplicate-code call returns 409 with error_id ERR_DUPLICATE_JURISDICTION_CODE"
            - "the duplicate-name rate-plan call returns 409 with error_id ERR_DUPLICATE_RATE_PLAN_NAME"
            - "the duplicate-name firm call returns 409 with error_id ERR_DUPLICATE_PANEL_FIRM_NAME"
            - "each error body carries response_type == error and a non-empty message"
            - "no new rows were created: RatePlan.${rp_id} still reports base_rate_per_employee_cents 41750 and DefensePanelFirm.${firm_id} still reports tier NATIONAL and capacity_open_matters 3"

      - name: headcount_allocation_must_sum_and_include_the_primary_jurisdiction
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_HEADCOUNT_ALLOCATION_MISMATCH
          - entities.Applicant.fields.jurisdiction_headcounts
        distinguishing_aspect: "ERR_HEADCOUNT_ALLOCATION_MISMATCH has two independent legs on the same priority: the per-jurisdiction headcounts summing to something other than total_headcount (40 + 30 != 100), and a primary_jurisdiction_code that is absent from the allocation even though the sum is right — and the second leg fires on PATCH as well as on create."
        test_recipe:
          setup:
            - "Jurisdictions TX and CA exist; applicant Harbor Lane Retail LLC has 100 headcount split TX 60 / CA 40 with primary TX."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Harbor Lane Retail LLC", total_headcount: 100, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 60 }, { code: "CA", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /epli/applicants"
              payload: { legal_name: "Sumless Holdings LLC", total_headcount: 100, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }, { code: "CA", headcount: 30 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_sum: $.data.error_id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Absentee Primary LLC", total_headcount: 100, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 100 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_primary: $.data.error_id }
            - call: "PATCH /epli/applicants/${app_id}"
              payload: { jurisdiction_headcounts: [{ code: "TX", headcount: 60 }, { code: "CA", headcount: 30 }] }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_patch: $.data.error_id }
          assert:
            - "the mismatched-sum create returns 422 with error_id ERR_HEADCOUNT_ALLOCATION_MISMATCH"
            - "the absent-primary create returns 422 with error_id ERR_HEADCOUNT_ALLOCATION_MISMATCH"
            - "the PATCH that would leave 60 + 30 against total_headcount 100 returns 422 with error_id ERR_HEADCOUNT_ALLOCATION_MISMATCH"
            - "Applicant.${app_id} is unchanged: total_headcount == 100, jurisdiction_headcounts still TX 60 / CA 40, version == ${app_v}"

      - name: the_logical_clock_refuses_to_move_backwards
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/epli/_clock/set_current_utc
        distinguishing_aspect: "to_iso8601 equal to the current logical clock is accepted (the rule is >=, not >), but any earlier instant — even one millisecond earlier — is refused with ERR_CLOCK_NOT_MONOTONIC and the clock stays where the last accepted call left it."
        test_recipe:
          setup:
            - "The server's logical clock is at its startup default 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T11:59:59.999Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_back: $.data.error_id }
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_start: $.data.error_id }
          assert:
            - "the equal-instant call returns 200 with current_utc == 2026-09-15T12:00:00.000Z"
            - "the 1 ms rewind returns 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "the rewind to the startup default returns 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "a following accepted call to 2026-09-15T12:00:00.001Z returns current_utc == 2026-09-15T12:00:00.001Z, proving the clock never regressed"

      - name: policy_periods_for_one_applicant_may_touch_but_not_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors.ERR_POLICY_PERIOD_OVERLAP
          - entities.Policy.fields.effective_from
        distinguishing_aspect: "The occupancy interval is HALF-OPEN, so a renewal starting at 2027-01-01 against an in-force term ending 2027-02-01 is refused, while a renewal starting exactly at 2027-02-01 — sharing the incumbent's endpoint — is accepted; the overlap scope is one applicant, so the same window is free for a different applicant."
