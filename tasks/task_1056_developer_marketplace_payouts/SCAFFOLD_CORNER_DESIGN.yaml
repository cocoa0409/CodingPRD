            - "${e_pur} == ERR_PURCHASE_NOT_FOUND"
            - "${e_ref} == ERR_REFUND_NOT_FOUND"
            - "${e_cb} == ERR_CHARGEBACK_NOT_FOUND"
            - "${e_pc} == ERR_POLICY_CASE_NOT_FOUND"
            - "${e_rs} == ERR_REVIEW_SUBMISSION_NOT_FOUND"
            - "${e_pb} == ERR_PAYOUT_BATCH_NOT_FOUND"
            - "${e_tj} == ERR_TAX_JURISDICTION_NOT_FOUND"
            - "${e_tf} == ERR_TAX_FORM_NOT_FOUND"
            - "Every one of the ten responses carries HTTP status 404"
