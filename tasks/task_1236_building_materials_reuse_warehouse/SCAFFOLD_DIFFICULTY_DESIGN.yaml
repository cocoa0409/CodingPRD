  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (4 instances, 4 different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sale_requires_active_account
        grounds:
          - state_machines.Sale (initial_state)
          - state_machines.ContractorAccount.PENDING_APPROVAL_to_ACTIVE
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Sale -> ContractorAccount: opening a CONTRACTOR_ACCOUNT sale is gated on
          the account being ACTIVE; PENDING_APPROVAL blocks it with 409.
        test_recipe:
          setup: ["Account J created but never approved (status PENDING_APPROVAL)"]
          setup_api_calls:
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor J", contact_email: "j@x.com", credit_limit_cents: 500000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id, acct_status: $.data.status }
          trigger:
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "POST /reuse/sales returns 409 ERR_ACCOUNT_NOT_ACTIVE while account is PENDING_APPROVAL"
            - "no Sale row is created for the rejected open"

      - name: job_schedule_requires_cleared_screening
        grounds:
          - state_machines.DeconstructionJob.CLEARED_to_SCHEDULED
          - state_machines.DeconstructionJob.SCREENING_PENDING_to_CLEARED
          - errors[ERR_JOB_NOT_CLEARED]
        distinguishing_aspect: |
          Pair DeconstructionJob -> HazmatScreening: the schedule transition exists only
          after a screening with outcome CLEARED flips the job to CLEARED; attempting it
          from SCREENING_PENDING fails, then succeeds after the clearing screening.
        test_recipe:
          setup:
            - "Technician T7, lead L7, vehicle V7; job J7 moved to SCREENING_PENDING"
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Seven", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead Seven", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-7", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job G", site_address_text: "8 Fir", quoted_fee_cents: 90000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
          trigger:
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-07-01T08:00:00Z", scheduled_end: "2026-07-01T16:00:00Z" }
              as: CrewCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-07-01T08:00:00Z", scheduled_end: "2026-07-01T16:00:00Z" }
              as: CrewCoordinator
              captures: { j_status: $.data.status }
          assert:
            - "First schedule attempt: 409 ERR_JOB_NOT_CLEARED (job gated on screening-derived CLEARED state)"
            - "After CLEARED screening: schedule succeeds, status == SCHEDULED"

      - name: receipt_requires_received_offer
        grounds:
          - state_machines.TaxReceipt (initial_state)
          - state_machines.DonationOffer.ACCEPTED_to_RECEIVED
          - errors[ERR_INVALID_OFFER_STATE]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair TaxReceipt -> DonationOffer: drafting a receipt requires the offer in
          RECEIVED; an ACCEPTED-but-not-received offer is rejected.
        test_recipe:
          setup:
            - "Category HARDWARE; donor D8; offer reviewed and ACCEPTED (DROPOFF, grade A)"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "HARDWARE", display_name: "Hardware", pricing_model: "PER_UNIT", base_rate_cents: 500, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D Eight", donor_type: "INDIVIDUAL", email: "d8@x.com", address_text: "8 Way" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "hinges box", estimated_quantity: 10, quantity_unit: "UNIT", condition_grade: "A", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
          trigger:
            - call: "POST /reuse/tax-receipts"
              payload: { offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { err: $.data.error_id }
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              as_user_id: "staff-r8"
            - call: "POST /reuse/tax-receipts"
              payload: { offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { rcpt_id: $.data.id, rcpt_status: $.data.status }
          assert:
            - "Receipt create while offer ACCEPTED: 409 ERR_INVALID_OFFER_STATE"
            - "After receive: receipt create succeeds with status DRAFT"

      - name: offer_receive_requires_completed_pickup
        grounds:
          - state_machines.DonationOffer.ACCEPTED_to_RECEIVED
          - state_machines.PickupAppointment.BOOKED_to_COMPLETED
          - errors[ERR_OFFER_NOT_RECEIVABLE_SOURCE]
        distinguishing_aspect: |
          Pair DonationOffer -> PickupAppointment: a PICKUP offer's receive transition is
          gated on a COMPLETED appointment for that offer; BOOKED is insufficient.
        test_recipe:
          setup:
            - "Category TILE8; donor D9; PICKUP offer ACCEPTED; vehicle V9; appointment BOOKED (fee 5000, donor tier NONE)"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "TILE8", display_name: "Tile 8", pricing_model: "PER_SQFT", base_rate_cents: 300, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D Nine", donor_type: "INDIVIDUAL", email: "d9@x.com", address_text: "9 Way" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "PICKUP", category_id: "${cat_id}", description_text: "tile lot", estimated_quantity: 100, quantity_unit: "SQFT", condition_grade: "B", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-9", capacity_lbs: 8000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/pickup-appointments"
              payload: { subject_type: "DONATION_OFFER", subject_id: "${offer_id}", vehicle_id: "${veh_id}", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: IntakeStaff
              captures: { appt_id: $.data.id, appt_fee: $.data.fee_cents }
          trigger:
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              captures: { err: $.data.error_id }
            - call: "POST /reuse/pickup-appointments/${appt_id}/complete"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              captures: { o_status: $.data.status, o_recv_by: $.data.received_by_user_id }
          assert:
            - "receive with BOOKED appointment: 409 ERR_OFFER_NOT_RECEIVABLE_SOURCE"
            - "PickupAppointment.${appt_id}.fee_cents == 5000 (donor tier NONE -> PICKUP_FEE_CENTS)"
            - "After appointment COMPLETED: receive succeeds, offer.status == RECEIVED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different resources and
  #          different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_member_half_open_overlap
        grounds:
          - calculations.crew_overlap_check
          - errors[ERR_CREW_TIME_OVERLAP]
        distinguishing_aspect: |
          Resource = CrewMember, half-open [start,end) semantics: touching windows are
          LEGAL (09:00-12:00 then 12:00-15:00 both accepted) while a true intersection
          (11:00-13:00) is rejected with ERR_CREW_TIME_OVERLAP.
        test_recipe:
          setup:
            - "Job J8 SCHEDULED 2026-06-10T08:00-16:00 with lead L8; worker W8 available"
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Eight", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead Eight", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Worker Eight", crew_type: "PAID, hourly_rate_cents: 3500", crew_type: "PAID", hourly_rate_cents: 3500 }
              as: CrewCoordinator
              captures: { worker_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-8", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job H", site_address_text: "4 Maple", quoted_fee_cents: 80000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T16:00:00Z" }
              as: CrewCoordinator
          trigger:
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${worker_id}", role_on_job: "WORKER", start_at: "2026-06-10T09:00:00Z", end_at: "2026-06-10T12:00:00Z" }
              as: CrewCoordinator
              captures: { a1: $.data.id }
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${worker_id}", role_on_job: "WORKER", start_at: "2026-06-10T12:00:00Z", end_at: "2026-06-10T15:00:00Z" }
              as: CrewCoordinator
              captures: { a2: $.data.id }
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${worker_id}", role_on_job: "WORKER", start_at: "2026-06-10T11:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: CrewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window 12:00-15:00 ACCEPTED (half-open: end == start is not overlap)"
            - "Intersecting window 11:00-13:00 rejected with 409 ERR_CREW_TIME_OVERLAP"
            - "Worker W8 has exactly 2 ASSIGNED assignments after the rejection"

      - name: vehicle_buffered_gap_overlap
        grounds:
          - calculations.vehicle_buffered_overlap_check
          - errors[ERR_VEHICLE_TIME_OVERLAP]
        distinguishing_aspect: |
          Resource = Vehicle, buffered semantics (PICKUP_BUFFER_MINUTES = 60): a window
          starting exactly at the prior window's end (gap 0 < 60) is REJECTED — the exact
          opposite of the crew half-open rule — while a window starting exactly
          end+buffer (gap == 60) is ACCEPTED.
        test_recipe:
          setup:
            - "Category TILE9; donor D10 with three ACCEPTED PICKUP offers O1/O2/O3; vehicle V10 AVAILABLE"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "TILE9", display_name: "Tile 9", pricing_model: "PER_SQFT", base_rate_cents: 300, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
