            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t_keep: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Ridgeline Towers", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t_drop: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v1: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v1}" }, as: AcquisitionAnalyst, captures: { val_1: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/carrier-tenancies/${t_drop}/status", payload: { status: "TERMINATED" }, as: ServicingAgent }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v2: $.data.version } }
