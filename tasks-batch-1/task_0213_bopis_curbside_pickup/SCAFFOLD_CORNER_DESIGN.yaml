              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v1: $.data.version }
            - call: "POST /store-inventory/${inv_id}/restock"
              payload: { delta_on_hand: 1, expected_inventory_version: "${inv_v1}" }
              as: StoreManager
              captures: { inv_v2: $.data.version }
          trigger:
