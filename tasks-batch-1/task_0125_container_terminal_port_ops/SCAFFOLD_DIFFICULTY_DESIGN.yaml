            - call: "POST /yard-slots"
              payload: { block: "F", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CROSS_ENTITY_STATE"
            - "Container.${cont_id}.handling_status == ON_VESSEL"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_window_half_open_overlap_adjacency_ok       # half-open, adjacency NOT a conflict
        grounds:
          - calculations.berth_clash_check
          - validations[priority=13]
          - entities.BerthWindow.fields.eta
        distinguishing_aspect: |
          On a Berth, two [eta,etd) windows conflict only on strict interval intersection; an adjacent window
          (B.eta == A.etd) is accepted but an overlapping one is rejected with ERR_BERTH_CONFLICT — pure
          half-open semantics with NO buffer.
        test_recipe:
          setup:
            - "A berth with an existing SCHEDULED window [2026-02-01T00:00:00Z, 2026-02-03T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-16", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000016", name: "Ovl V1", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_a_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000017", name: "Ovl V2", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_b_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_a_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-03T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_a_id: $.data.id }
          trigger:
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_b_id}", eta: "2026-02-02T12:00:00.000Z", etd: "2026-02-04T00:00:00.000Z" }
              as: BerthPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_BERTH_CONFLICT"

      - name: gate_slot_buffered_overlap_adjacency_conflicts     # buffer makes adjacency conflict
        grounds:
          - calculations.gate_slot_clash_check
          - validations[priority=15]
          - constants.GATE_BUFFER_MIN
        distinguishing_aspect: |
          On a GateAppointment (per container_id), each slot is widened by GATE_BUFFER_MIN=30min on the
          trailing edge before overlap testing, so a second slot starting exactly at the first's window_end
          (adjacent) STILL conflicts — buffered interval semantics distinct from the berth's unbuffered half-open.
        test_recipe:
          setup:
            - "A grounded, cleared container with one BOOKED appointment [2026-03-01T10:00:00Z, 2026-03-01T11:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-17", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000018", name: "Buf V", loa_m: 300, draft_m: 14.0, free_time_days: 60 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "BUFF170170", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "G", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: YardPlanner
              captures: { cont_v_now: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v_now}" }
              as: CustomsOfficer
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-170", window_start: "2026-03-01T10:00:00.000Z", window_end: "2026-03-01T11:00:00.000Z" }
              as: GateOperator
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-171", window_start: "2026-03-01T11:00:00.000Z", window_end: "2026-03-01T12:00:00.000Z" }
              as: GateOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_GATE_SLOT_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unberth_compensates_free_time_clock_to_null     # conserved: free_time_expires_at nullity
        grounds:
          - state_machines.BerthWindow.SCHEDULED_to_BERTHED
          - state_machines.BerthWindow.BERTHED_to_SCHEDULED
          - entities.Container.fields.free_time_expires_at
        distinguishing_aspect: |
          Invariant: for any container of a window, berth-then-unberth leaves free_time_expires_at exactly at
          its pre-berth value of null. Conserved quantity = the free-time clock state; the compensating
          unberth reverses the berth cascade with zero drift.
        test_recipe:
          setup:
            - "A SCHEDULED window with one container (free_time_expires_at null), berthed (free_time_expires_at set), then a clean unberth available (no cargo worked yet)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-18", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000019", name: "Comp V1", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v0: $.data.version }
            - call: "POST /containers"
              payload: { container_number: "COMP180180", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v0}" }
              as: BerthPlanner
          trigger:
            - call: "POST /berth-windows/${bw_id}/unberth"
              payload: {}
              as: BerthPlanner
          assert:
            - "Container.${cont_id}.free_time_expires_at == null"
            - "BerthWindow.${bw_id}.actual_berth_at == null"
            - "BerthWindow.${bw_id}.status == SCHEDULED"

      - name: customs_hold_release_conserves_active_hold_count   # conserved: active-hold count returns to 0
        grounds:
          - state_machines.Container.PENDING_to_HELD
          - state_machines.Container.HELD_to_CLEARED
          - entities.CustomsHold.fields.status
        distinguishing_aspect: |
          Invariant: place-then-release on a container leaves the count of ACTIVE CustomsHolds for that
          container at exactly 0 (its pre-place value), conserving active-hold count; a distinct conserved
          quantity from the free-time clock above. Released hold is stamped, container CLEARED.
        test_recipe:
          setup:
            - "A grounded container with zero active holds; a hold is placed (1 ACTIVE) then released (0 ACTIVE)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-19", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000020", name: "Comp V2", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "COMP190190", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "H", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /customs-holds"
              payload: { container_id: "${cont_id}", reason: "DOCUMENTATION" }
              as: CustomsOfficer
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /customs-holds/${hold_id}/release"
              payload: {}
              as: CustomsOfficer
          assert:
            - "CustomsHold.${hold_id}.status == RELEASED"
            - "CustomsHold.${hold_id}.released_at == 2026-02-01T00:00:00.000Z"
            - "Container.${cont_id}.customs_status == CLEARED"
