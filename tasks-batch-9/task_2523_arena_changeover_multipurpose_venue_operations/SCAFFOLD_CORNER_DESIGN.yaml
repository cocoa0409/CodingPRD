        distinguishing_aspect: "Both foreign keys resolve to existing rows, yet the booking is refused with 409 ERR_VENUE_SCOPE_MISMATCH because the profile belongs to the second arena — flat topology means each FK is validated for venue coherence, not merely for existence."
