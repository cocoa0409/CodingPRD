  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: vessel_allocation_blocked_inside_trailing_cleaning_buffer
        grounds:
          - validations[priority=70]
          - errors[ERR_VESSEL_OVERLAP]
          - entities.VesselAllocation.fields.start_at
          - entities.VesselAllocation.fields.end_at
          - concurrency_rules[allocation-reserve-stale-vessel]
        distinguishing_aspect: |
          VESSEL interval semantics: exclusive occupancy over a HALF-OPEN
          [start_at, end_at) window EXTENDED by a trailing 48-hour cleaning
          buffer. A window opening 2026-11-02T00:00:00Z — 24 hours after the
          incumbent's end_at — is rejected, while the same request opening at
          exactly 2026-11-03T00:00:00Z (end_at + 48h, the first free instant)
          succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Contract with tank_gallons_entitled 20000."
            - "One 4000-gallon TANK T-101 in CLEAN condition."
            - "One RESERVED allocation al1 on T-101 spanning 2026-09-01T00:00:00Z .. 2026-11-01T00:00:00Z for 4000 gallons; its trailing cleaning buffer runs to 2026-11-03T00:00:00Z."
            - "Vessel.version has already advanced to 2 because creating al1 bumped it, so the current version is read back before each attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, v1_ver: $.data.version }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 4000, expected_vessel_version: "${v1_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al1: $.data.id }
            - call: "GET /vessels/${v1}"
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { v1_ver2: $.data.version }
          trigger:
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-11-02T00:00:00Z", end_at: "2026-12-01T00:00:00Z", allocated_gallons: 3000, expected_vessel_version: "${v1_ver2}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { err: $.data.error_id }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-11-03T00:00:00Z", end_at: "2026-12-01T00:00:00Z", allocated_gallons: 3000, expected_vessel_version: "${v1_ver2}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al2: $.data.id, st2: $.data.status }
          assert:
            - "${err} == ERR_VESSEL_OVERLAP with HTTP 409 for the 2026-11-02T00:00:00Z window"
            - "${st2} == RESERVED for the 2026-11-03T00:00:00Z window (HTTP 201)"
            - "VesselAllocation.${al2}.start_at == 2026-11-03T00:00:00.000Z and end_at == 2026-12-01T00:00:00.000Z"
            - "Contract.${ct1}.gallons_allocated == 7000.00 after the successful reserve"
            - "Vessel.${v1}.condition == CLEAN throughout — an overlap rejection never dirties cooperage"

      - name: bottling_run_blocked_when_line_windows_touch_at_an_endpoint
        grounds:
          - validations[priority=70]
          - errors[ERR_LINE_SLOT_CONFLICT]
          - calculations.bottling_schedule
          - entities.BottlingRun.fields.scheduled_end
          - entities.BottlingLine.fields.changeover_minutes
        distinguishing_aspect: |
          BOTTLING LINE interval semantics are geometrically different from the
          vessel's: the occupancy window is CLOSED [scheduled_start,
          scheduled_end] with the changeover already inside it, so a run opening
          at exactly the incumbent's 13:45 end instant COLLIDES — the opposite of
          the vessel rule, where the first instant past the buffer is free.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "One ACTIVE Contract with one 3135.00-gallon Lot."
            - "One AVAILABLE BottlingLine L-1 at 180 cases/hour, 45 changeover minutes, 16 daily capacity hours."
            - "One SCHEDULED run of 500 cases of 750 ml starting 2026-10-05T10:00:00Z, giving run_hours 3.00 and scheduled_end 2026-10-05T13:45:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
