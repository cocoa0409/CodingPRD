# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Weigh Station Bypass & Fleet Compliance Service
# 9 rule_ids x 2-3 instances = 21 instances. Every instance replays from
# empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_invoice_divergence
        grounds:
          - calculations.subscription_period_invoice
          - calculations.provisional_invoice_projection
          - entities.Invoice.fields.gross_cents
        distinguishing_aspect: |
          Billing domain (Invoice): the forward-looking preview computed on 2026-08-01 projects the ACTIVE
          subscription billing all 31 days (gross 1799), while the final close on 2026-09-01 after a mid-period
          safety pause (2026-08-20) bills only 19 realized days (gross 1103) — identical subscription row, two
          algorithm variants, different cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01; config CA PARTICIPATING with weight clearance on, screen 0, cap 10000; station CA-S1 FIXED_SCALE/BOTH; carrier ACTIVE (snapshot iss 30 SATISFACTORY); vehicle VIN-0001 gvwr 80000; subscription ACTIVE window 2026-08-01..2026-12-31; credential TRANSPONDER ACTIVE"
            - "Preview for period 2026-08 taken while subscription ACTIVE: projects 31 billable days"
            - "On 2026-08-20 a snapshot iss 90 flips posture INELIGIBLE; cascade suspends credential and pauses subscription (paused_at 2026-08-20); on 2026-09-01 the period closes with 31-12=19 billable days"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: true, random_pull_in_rate_bps: 0, bypass_rate_cap_bps: 10000, credential_sets_required: ["IFTA", "IRP", "UCR"] }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_id}", station_code: "CA-S1", station_type: "FIXED_SCALE", supported_channel: "BOTH" }
              as: StateProgramManager
              captures: { st_id: $.data.id }
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { car_v2: $.data.version }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "GET /api/carriers/${car_id}/invoice-preview"
              payload: { period_year: 2026, period_month: 8 }
              as: FinanceAdmin
              captures: { prev_gross: $.data.gross_cents, prev_days: $.data.billed_line_count }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 90, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-20", expected_carrier_version: "${car_v2}" }
              as: SafetyDataFeed
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers/${car_id}/close-billing-period"
              payload: { period_year: 2026, period_month: 8 }
              as: FinanceAdmin
              captures: { inv_id: $.data.id, inv_gross: $.data.gross_cents }
          assert:
            - "preview gross_cents (${prev_gross}) == 1799 (projected 31 of 31 days)"
            - "final Invoice.${inv_id}.gross_cents == 1103 (realized 19 of 31 days: round_half_up(1799*19/31))"
            - "Invoice.${inv_id}.lines[0].billable_days == 19 and lines[0].line_net_cents == 1103"
            - "Invoice.${inv_id}.tier_applied == TIER_1 and billed_line_count == 1"
            - "divergence: 1799 != 1103 — same subscription, two variants"
            - "Invoice.${inv_id}.credit_applied_cents == 0 and amount_due_cents == 1103"

      - name: roi_standard_vs_conservative_divergence
        grounds:
          - calculations.roi_report
          - entities.BypassEvent.fields.weight_verified
          - entities.BypassEvent.fields.credentials_complete
        distinguishing_aspect: |
          Analytics domain (BypassEvent): identical 5-event August population (3 granted, 2 verified), STANDARD
          counts all 3 grants (savings 3825) while CONSERVATIVE counts only the 2 verified grants (savings 2550) —
          two variants of the same report over the same rows give different money; no invoice exists, so roi_bps
          is null in both (fees == 0 rule), and bypass_rate_bps floors to 6000.
        test_recipe:
          setup:
            - "Clock 2026-08-05T12:00:00Z; config CA PARTICIPATING, requires_weight_clearance FALSE, screen 0, cap 10000, credentials required [IFTA,IRP,UCR]; carrier ACTIVE (iss 30); vehicle gvwr 80000; credential ACTIVE; subscription ACTIVE"
            - "5 August approaches recorded: 2 verified grants (weight present and within limit, full credentials), 1 unverified grant (no weight reading; clearance not required), 1 PULL_IN CREDENTIALS_INCOMPLETE, 1 PULL_IN OVERWEIGHT (90000 > 84000)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: false, random_pull_in_rate_bps: 0, bypass_rate_cap_bps: 10000, credential_sets_required: ["IFTA", "IRP", "UCR"] }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_id}", station_code: "CA-S1", station_type: "FIXED_SCALE", supported_channel: "BOTH" }
              as: StateProgramManager
              captures: { st_id: $.data.id }
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-04T10:00:00Z", measured_weight_lbs: 80000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev1: $.data.id }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-04T11:00:00Z", credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev2: $.data.id }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T10:00:00Z", measured_weight_lbs: 80000, credentials_presented: ["IFTA"] }
              as: TelematicsGateway
              captures: { ev3: $.data.id }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T11:00:00Z", measured_weight_lbs: 80000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev4: $.data.id }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T11:30:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev5: $.data.id }
          trigger:
            - call: "GET /api/carriers/${car_id}/roi-report"
              payload: { period_year: 2026, period_month: 8, variant: "STANDARD" }
              as: FinanceAdmin
              captures: { roi_std_savings: $.data.estimated_savings_cents, roi_std_total: $.data.total_approaches, roi_std_verified: $.data.verified_bypasses, roi_std_rate: $.data.bypass_rate_bps }
            - call: "GET /api/carriers/${car_id}/roi-report"
              payload: { period_year: 2026, period_month: 8, variant: "CONSERVATIVE" }
              as: FinanceAdmin
              captures: { roi_con_savings: $.data.estimated_savings_cents }
          assert:
            - "STANDARD roi-report: total_approaches == 5, bypasses_granted == 3, pull_ins == 2, verified_bypasses == 2"
            - "STANDARD estimated_savings_cents == 3825 (3 x 1275)"
            - "CONSERVATIVE estimated_savings_cents == 2550 (2 x 1275) — same events, different variant"
            - "bypass_rate_bps == 6000 (floor(3*10000/5))"
            - "subscription_fees_cents == 0 (no invoice for 2026-08) and roi_bps is null in BOTH variants"
            - "event ${ev2}.weight_verified == false (no reading) yet decision == BYPASS_GRANTED; event ${ev5}.decision_reasons == [OVERWEIGHT]"

  - rule_id: combinatorial_formula
    instances:
      - name: decision_engine_branch_precedence_order
        grounds:
          - calculations.bypass_decision_evaluation
          - entities.BypassEvent.fields.decision_reasons
        distinguishing_aspect: |
          Mode (a) combinatorial: 12 ordered conditional checks over station/config/carrier/vehicle/credential/
          weight inputs; five approaches with overlapping failure sets prove the pinned precedence by yielding
          exactly the first failing reason each time: STATION_NOT_OPERATIONAL beats CARRIER_INELIGIBLE beats
          NO_ACTIVE_CREDENTIAL beats OVERWEIGHT, then a clean BYPASS_GRANTED with empty reasons.
        test_recipe:
          setup:
            - "Config CA PARTICIPATING (clearance true, screen 0, cap 10000); station CA-S1 FIXED_SCALE/BOTH; carrier ACTIVE with snapshot iss 30; vehicle gvwr 80000 IN_SERVICE; subscription ACTIVE 2026-08-01..2026-12-31; credential TRANSPONDER ACTIVE"
            - "Station patched CLOSED_TEMP; snapshot iss 90 (effective 2026-08-01) flips posture INELIGIBLE and cascade-suspends the credential (subscription PAUSED); clock 2026-08-05T12:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: true, random_pull_in_rate_bps: 0, bypass_rate_cap_bps: 10000, credential_sets_required: ["IFTA", "IRP", "UCR"] }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_id}", station_code: "CA-S1", station_type: "FIXED_SCALE", supported_channel: "BOTH" }
              as: StateProgramManager
              captures: { st_id: $.data.id }
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { car_v2: $.data.version }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "PATCH /api/stations/${st_id}"
              payload: { operational_status: "CLOSED_TEMP" }
              as: StateProgramManager
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 90, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v2}" }
              as: SafetyDataFeed
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T10:00:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { e1_dec: $.data.decision, e1_reasons: $.data.decision_reasons }
            - call: "PATCH /api/stations/${st_id}"
              payload: { operational_status: "OPERATIONAL" }
              as: StateProgramManager
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T10:30:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { e2_dec: $.data.decision, e2_reasons: $.data.decision_reasons }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { car_v3: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 20, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-05", expected_carrier_version: "${car_v3}" }
              as: SafetyDataFeed
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T11:00:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { e3_dec: $.data.decision, e3_reasons: $.data.decision_reasons }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T11:30:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { e4_dec: $.data.decision, e4_reasons: $.data.decision_reasons }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T12:00:00Z", measured_weight_lbs: 80000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { e5_dec: $.data.decision, e5_reasons: $.data.decision_reasons }
          assert:
            - "e1: decision PULL_IN with reasons [STATION_NOT_OPERATIONAL] although carrier also INELIGIBLE and weight 90000 over limit (check 1 beats 5 and 11)"
            - "e2: decision PULL_IN with reasons [CARRIER_INELIGIBLE] although credential is SUSPENDED and weight over limit (check 5 beats 8 and 11)"
            - "e3: after posture recovers to ELIGIBLE, PULL_IN with [NO_ACTIVE_CREDENTIAL] (check 8 beats 11; credential was never reactivated)"
            - "e4: after credential reactivation, PULL_IN with [OVERWEIGHT] (90000 > 84000 = 80000 + floor(80000*500/10000))"
            - "e5: BYPASS_GRANTED with decision_reasons == [] and weight_verified == true"
            - "credential reactivation also resumed subscription ${sub_id}: status ACTIVE with paused_days_current_period == 4 (2026-08-01 pause to 2026-08-05 resume)"

      - name: invoice_line_rounding_order_per_line_then_sum
        grounds:
          - calculations.subscription_period_invoice
          - entities.Invoice.fields.lines
          - entities.Invoice.fields.gross_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with TIER_1 rate 1799 and August (D=31), per-line round-then-sum gives
          round(1799*31/31)=1799, round(1799*17/31)=987, round(1799*24/31)=1393 => gross 4179, whereas the
          alternative sum-then-round gives round(1799*72/31)=4178 — the scaffold pins per-line-then-sum, so
          gross_cents must be 4179, not 4178.
        test_recipe:
          setup:
            - "Clock 2026-08-01; config CA PARTICIPATING (so home_state CA vehicles get NO pilot surcharge); carrier ACTIVE (iss 30); three vehicles (VIN-0001/2/3, home_state CA) with subscriptions: sub1 2026-08-01..2026-12-31 (31 overlap days), sub2 2026-08-15..2026-12-31 (17 days), sub3 2026-08-08..2026-12-31 (24 days); all ACTIVE; no credentials needed for billing"
            - "Clock advanced to 2026-09-01 (period fully elapsed)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: true, random_pull_in_rate_bps: 0, bypass_rate_cap_bps: 10000 }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh1: $.data.id }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0002", plate_number: "P-2", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh2: $.data.id }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0003", plate_number: "P-3", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh3: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh1}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh2}", service_start_date: "2026-08-15", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/vehicle-subscriptions"
