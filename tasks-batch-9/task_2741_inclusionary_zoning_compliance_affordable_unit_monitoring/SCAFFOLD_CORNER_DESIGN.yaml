      - name: invalid_transitions_and_supersession_across_the_resale_track
        claim_type: invalid_transition
        grounds:
          - validations.priority_18
          - errors[ERR_RESALE_STATE_INVALID]
          - state_machines.ResaleTransaction.SUBMITTED_to_SUPERSEDED
        distinguishing_aspect: |
          The resale machine is strictly linear until the ROFR fork, so each of its four action
          routes is legal from exactly one state and everything else is ERR_RESALE_STATE_INVALID:
          certify-buyer and close are refused on SUBMITTED, close is refused on PRICE_APPROVED,
          and a second rofr-decision is refused on ROFR_WAIVED. The instance also exercises the
          one non-action edge — submitting a fresh transaction for the same unit supersedes the
          open one — and shows that the superseded row is then frozen too.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units, approval 2026-01-15) screened SUBJECT, ONSITE elected, agreement recorded with resale_formula AMI_INDEXED, owner_appreciation_share_bps 2500 and max_refinance_ltv_bps 9000."
            - "OWNERSHIP 2-bedroom unit RS-101 at 5000 bps with its restriction recorded at original_purchase_price_cents 32500000 on 2026-08-01, so ami_income_at_purchase_cents is 12669800."
            - "Seller household H1 (size 3, income 6000000) certified into the unit with contract_rent_cents 0 (mandatory for OWNERSHIP), which makes the unit OCCUPIED and the project MONITORING."
            - "Because the ACTIVE AmiSchedule is still 2026, the AMI index factor is 1 and max_resale_price_cents is 32500000, so a proposed price of 32000000 is inside the ceiling."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Resale Street", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-RS-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "RS-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Ines Novak", household_size: 2, gross_annual_income_cents: 5000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
            - { call: "GET /iz-compliance/affordable-units/${u_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u_v1: $.data.version } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u_id}", expected_unit_version: "${u_v1}", proposed_price_cents: 32000000, appraised_value_cents: 40000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 500000 }, as: Resident, as_user_id: "${h1_id}", captures: { t1_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/resale-transactions/${t1_id}/certify-buyer", payload: { buyer_household_id: "${h2_id}", certification_id: "${c1_id}" }, as: HousingComplianceOfficer, as_user_id: "hco-2", captures: { err_certify_submitted: $.data.error_id } }
            - { call: "POST /iz-compliance/resale-transactions/${t1_id}/close", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2", captures: { err_close_submitted: $.data.error_id } }
            - { call: "POST /iz-compliance/resale-transactions/${t1_id}/rofr-decision", payload: { decision: "WAIVE" }, as: ProgramAdministrator, captures: { err_rofr_submitted: $.data.error_id } }
            - { call: "GET /iz-compliance/affordable-units/${u_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u_v2: $.data.version } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u_id}", expected_unit_version: "${u_v2}", proposed_price_cents: 31500000, appraised_value_cents: 40000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 500000 }, as: Resident, as_user_id: "${h1_id}", captures: { t2_id: $.data.id } }
            - { call: "POST /iz-compliance/resale-transactions/${t1_id}/approve-price", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_approve_superseded: $.data.error_id } }
            - { call: "POST /iz-compliance/resale-transactions/${t2_id}/approve-price", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/resale-transactions/${t2_id}/approve-price", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_approve_twice: $.data.error_id } }
            - { call: "POST /iz-compliance/resale-transactions/${t2_id}/close", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2", captures: { err_close_priced: $.data.error_id } }
            - { call: "POST /iz-compliance/resale-transactions/${t2_id}/rofr-decision", payload: { decision: "WAIVE" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/resale-transactions/${t2_id}/rofr-decision", payload: { decision: "EXERCISE" }, as: ProgramAdministrator, captures: { err_rofr_twice: $.data.error_id } }
          assert:
            - "certify-buyer, close and rofr-decision on the SUBMITTED ${t1_id} each return HTTP 409 with error_id ERR_RESALE_STATE_INVALID, and its state stays SUBMITTED"
            - "creating ${t2_id} for the same unit returns HTTP 201 and drives ResaleTransaction.${t1_id}.state to SUPERSEDED"
            - "approve-price on the SUPERSEDED ${t1_id} returns HTTP 409 with error_id ERR_RESALE_STATE_INVALID — supersession is terminal"
            - "approve-price on ${t2_id} returns HTTP 200: state PRICE_APPROVED, price_approved_at 2026-08-01T00:00:00Z, price_approved_by_user_id hco-1, rofr_deadline 2026-08-31T00:00:00Z"
            - "a second approve-price and a close on the PRICE_APPROVED ${t2_id} both return HTTP 409 with error_id ERR_RESALE_STATE_INVALID"
            - "rofr-decision WAIVE returns HTTP 200 with state ROFR_WAIVED and rofr_auto_waived false — it was an explicit in-window waiver, not a sweep"
            - "the follow-up EXERCISE returns HTTP 409 with error_id ERR_RESALE_STATE_INVALID and the state stays ROFR_WAIVED"
            - "AffordableUnit.${u_id}.original_purchase_price_cents is still 32500000 throughout — the basis only moves when a transaction closes"

  # ===========================================================================
  # SECTION 3 — Calculations (Table 3 rows + algorithm-type boundary rows)
  # ===========================================================================
  - section: calculations
    instances:
      - name: income_limits_and_rent_ceilings_are_correct_for_both_bedroom_counts
        claim_type: correct_result
        grounds:
          - calculations.income_limit
          - calculations.max_allowed_rent
        distinguishing_aspect: |
          Both calculations key off bedrooms + 1 as the imputed household size, so a
          2-bedroom and a 1-bedroom unit at the same 5000 bps affordability level produce
          different ceilings from the same schedule: limit 6334900 with rent 143872 for the
          2-bedroom (size 3, utility allowance 14500) and limit 5639000 with rent 129975 for
          the 1-bedroom (size 2, utility allowance 11000). The ami_pct_bps of the certified
          household is measured against its OWN household_size median, not the unit's imputed
          size, which is why a 5000000 income in a 1-bedroom reports 4433 bps.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 20 units, approval 2026-01-15) screened SUBJECT (2 units, 20000 bps), ONSITE elected, agreement recorded."
            - "Two RENTAL units at 5000 bps: EL-101 with 2 bedrooms (900 sqft against a 1000 sqft comparable) and EL-102 with 1 bedroom (600 sqft against a 700 sqft comparable)."
            - "Households H1 (size 3, income 6000000) and H2 (size 2, income 5000000) registered."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Eligibility Lane", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-EL-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "EL-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u2br_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "EL-102", bedrooms: 1, sqft: 600, market_comparable_sqft: 700, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u1br_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Ines Novak", household_size: 2, gross_annual_income_cents: 5000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u2br_id}", certified_income_cents: 6000000, contract_rent_cents: 143000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c2br_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u1br_id}", certified_income_cents: 5000000, contract_rent_cents: 129000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1br_id: $.data.id } }
          assert:
            - "IncomeCertification.${c2br_id}.income_limit_cents == 6334900 and max_rent_cents == 143872 and ami_pct_bps == 4736"
            - "IncomeCertification.${c1br_id}.income_limit_cents == 5639000 and max_rent_cents == 129975 and ami_pct_bps == 4433"
            - "AffordableUnit.${u2br_id}.max_allowed_rent_cents == 143872 and AffordableUnit.${u1br_id}.max_allowed_rent_cents == 129975"
            - "both certifications carry expires_at 2027-08-01 and state CERTIFIED"
            - "the two limits differ purely because bedrooms + 1 selects a different median (12669800 versus 11278000) and a different utility allowance (14500 versus 11000)"
            - "Project.${p_id}.state == MONITORING after the first certification and onsite_unit_equivalents_bps == 20000 with compliance_posture COMPLIANT_ONSITE"

      - name: a_superseded_ordinance_vintage_still_governs_an_earlier_approval
        claim_type: input_set_filtering
        grounds:
          - calculations.ordinance_vintage_selection
          - state_machines.Ordinance.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          The candidate set for vintage selection is every Ordinance row regardless of status,
          filtered only by effective_date <= approval_date; the ACTIVE / SUPERSEDED flag is not
          a filter. With three vintages on file, a project approved 2026-01-15 pins the
          SUPERSEDED 2024 ordinance while a project approved 2026-07-01 pins the ACTIVE 2026
          one, and the two therefore derive different obligations from the same 10 units in the
          same district. Filtering to ACTIVE rows would make the older project EXEMPT under the
          2026 rules' arithmetic; filtering to the earliest candidate would make it EXEMPT under
          the 2018 rules' 20-unit threshold.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Three ordinances published in ascending effective_date order, so the first two end up SUPERSEDED and only the last is ACTIVE:"
            - "  IZ-2018-01 effective 2018-01-01 with min_project_units_threshold 20 and R-2 set-aside 500 bps."
            - "  IZ-2024-01 effective 2024-01-01 with min_project_units_threshold 10 and R-2 set-aside 1000 bps."
            - "  IZ-2026-06 effective 2026-06-01 with min_project_units_threshold 10 and R-2 set-aside 1500 bps."
            - "AmiSchedule 2026 published."
