      - name: reach_capacity_rejected_when_touching_release_windows_aggregate_past_capacity
        grounds:
          - calculations.reach_capacity_availability
          - calculations.drawdown_volume_conservation
          - validations[priority=28]
          - errors[ERR_REACH_CAPACITY_EXCEEDED]
          - entities.RiverReach.fields.committed_release_cfs
          - concurrency_rules[drawdown-coordinate-stale-reach]
        distinguishing_aspect: |
          A different resource (RiverReach channel capacity, a summed rate rather than an engineer's
          exclusive time) with different interval semantics: the windows are CLOSED, so two releases
          that merely touch at 06:00 are treated as overlapping and their rates are summed. The
          rejection is also an aggregate one - neither order alone exceeds 1200 cfs - and equality at
          exactly 1200 cfs is allowed.
