# =============================================================================
# §1.8 Scaffold Difficulty Design — Structural Plan Review & Peer Check Services
# 9 Difficulty Rules × 2 instances each. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and carries a replay-verified structured test_recipe.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: fiscal/Engagement vs
  # temporal/ReviewCycle)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_estimated_vs_final_diverge_on_extra_cycles
        grounds:
          - calculations.estimated_fee
          - calculations.final_fee
          - entities.Engagement.fields.estimated_fee_cents
          - entities.Engagement.fields.final_fee_cents
        distinguishing_aspect: |
          Fiscal domain (Engagement): the estimated variant (registration-time,
          zero resubmittal component) and the final variant (seal-time, actual
          cycle_count) produce different fees for the same engagement because
          cycle_count=2 exceeds pinned_free_resubmittal_cycles=0 by 2 cycles.
        test_recipe:
          setup:
            - "Jurisdiction CA: VALUATION fee, BUSINESS SLA 15d, free_resubmittal_cycles=0"
            - "Reviewer holds CA PE license expiring 2030-01-01"
            - "Engagement: valuation 30000000 cents, FULL_REVIEW, no expedite -> estimated_fee_cents = 250000"
            - "Two review cycles completed (comment raised/issued/responded/verified), second cycle approved, record sealed"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", free_resubmittal_cycles: 0, requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R One", licenses: [{ state_code: "CA", license_type: "PE", license_number: "P1", expires_on: "2030-01-01" }], max_concurrent_assignments: 3 }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Fee Divergence", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000, requested_expedite: false }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://plans-v1" }
              as: ReviewCoordinator
              captures: { cyc1_id: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1_id}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "Wind load calc incomplete" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com1_id: $.data.id }
            - call: "POST /plan-review/cycles/${cyc1_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/comments/${com1_id}/responses"
              payload: { response_text: "Calc revised, see sheet S2.1" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://plans-v2" }
              as: ReviewCoordinator
              captures: { cyc2_id: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments/${com1_id}/verify"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc2_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "Engagement.${eng_id}.estimated_fee_cents == 250000"
            - "Engagement.${eng_id}.final_fee_cents == 400000"
            - "Engagement.${eng_id}.final_fee_cents != Engagement.${eng_id}.estimated_fee_cents (divergence = 2 extra cycles x 75000)"
            - "Engagement.${eng_id}.cycle_count == 2"

      - name: turnaround_business_vs_calendar_due_at
        grounds:
          - calculations.turnaround_sla
          - entities.ReviewCycle.fields.due_at
        distinguishing_aspect: |
          Temporal domain (ReviewCycle): identical received_at (Monday
          2026-08-03T10:00:00Z) and turnaround_days=15 produce due_at
          2026-08-24T23:59:59.999Z under BUSINESS vs 2026-08-18T10:00:00Z under
          CALENDAR — two valid interpretations of "15 days" that differ.
        test_recipe:
          setup:
            - "Two jurisdictions identical except sla_mode (CA=BUSINESS, NV=CALENDAR), turnaround_days=15"
            - "Two engagements, one per jurisdiction, same reviewer (licensed in both states)"
            - "Clock set to Monday 2026-08-03T10:00:00Z before either cycle is created"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", free_resubmittal_cycles: 2, requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_biz: $.data.id }
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "NV", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", free_resubmittal_cycles: 2, requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_cal: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Two", licenses: [{ state_code: "CA", license_type: "PE", license_number: "P2", expires_on: "2030-01-01" }, { state_code: "NV", license_type: "PE", license_number: "P3", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Biz SLA", jurisdiction_id: "${jur_biz}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_biz: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cal SLA", jurisdiction_id: "${jur_cal}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_cal: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_biz}", documents_ref: "s3://biz-v1" }
              as: ReviewCoordinator
              captures: { cyc_biz: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_cal}", documents_ref: "s3://cal-v1" }
              as: ReviewCoordinator
              captures: { cyc_cal: $.data.id }
          assert:
            - "ReviewCycle.${cyc_biz}.due_at == 2026-08-24T23:59:59.999Z (15th business day after Mon 2026-08-03, end of day)"
            - "ReviewCycle.${cyc_cal}.due_at == 2026-08-18T10:00:00Z (received_at + 15*24h)"
            - "ReviewCycle.${cyc_biz}.due_at != ReviewCycle.${cyc_cal}.due_at"
            - "ReviewCycle.${cyc_biz}.received_at == 2026-08-03T10:00:00Z"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) multi-input non-linear vs mode (b)
  # nested rounding with pinned order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fee_valuation_tier_crossing_with_scope_and_expedite
        grounds:
          - calculations.final_fee
          - calculations.estimated_fee
        distinguishing_aspect: |
          Mode (a): valuation 100000000 cents crosses all three marginal tiers
          (100000 + 300000 + 250000 = 650000 base), then multiplies by the
          PEER_REVIEW scope factor 0.8 and adds the expedite surcharge computed
          on the ROUNDED scoped base — >=3 inputs interacting non-linearly.
        test_recipe:
          setup:
            - "Jurisdiction NV: VALUATION, CALENDAR SLA 15d, free_resubmittal_cycles=2"
            - "Engagement: valuation 100000000 cents ($1M), scope PEER_REVIEW, requested_expedite=true"
            - "Single clean-approved cycle; record sealed"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "NV", ibc_edition: "IBC_2024", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", free_resubmittal_cycles: 2, requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Three", licenses: [{ state_code: "NV", license_type: "SE", license_number: "S1", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Tier Crossing", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "ESSENTIAL_FACILITY", risk_category: "IV", scope: "PEER_REVIEW", declared_valuation_cents: 100000000, floor_area_sqft: 20000, requested_expedite: true }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://peer-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "Engagement.${eng_id}.estimated_fee_cents == 780000 (scoped_base 520000 + expedite 260000)"
            - "Engagement.${eng_id}.final_fee_cents == 780000 (cycle_count 1 <= free 2, no deferred items)"
            - "Engagement.${eng_id}.status == APPROVED"

      - name: deferred_fee_per_item_rounding_then_sum
        grounds:
          - calculations.final_fee
          - entities.Engagement.fields.deferred_pending_count
        distinguishing_aspect: |
          Mode (b): per-item deferred fee round_half_up(333333 * 0.05) = 16667 is
          rounded PER ITEM then summed (2 items -> 33334); the alternative
          sum-then-round order yields 33333 — the pinned per-item-then-sum order
          is observable as a 1-cent difference in final_fee_cents.
        test_recipe:
          setup:
            - "Jurisdiction WA: VALUATION, BUSINESS 15d, free_resubmittal_cycles=2, deferred permitted"
            - "Engagement: valuation 111111000 cents -> tier base 555555; scope LATERAL_ONLY x0.6 -> scoped_base 333333"
            - "Cycle clean-approved; two TRUSS/ANCHOR deferred items registered, submitted, approved; record sealed"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "WA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_16", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", free_resubmittal_cycles: 2, requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Four", licenses: [{ state_code: "WA", license_type: "PE", license_number: "P4", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Deferred Rounding", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "LATERAL_ONLY", declared_valuation_cents: 111111000, floor_area_sqft: 9000, requested_expedite: false }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://lat-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/deferred-submittals"
              payload: { engagement_id: "${eng_id}", item_type: "TRUSS", description: "Roof truss package" }
              as: Applicant
              as_user_id: "app-1"
              captures: { def1: $.data.id }
            - call: "POST /plan-review/deferred-submittals"
              payload: { engagement_id: "${eng_id}", item_type: "ANCHOR", description: "Post-installed anchors" }
              as: Applicant
              as_user_id: "app-1"
              captures: { def2: $.data.id }
            - call: "POST /plan-review/deferred-submittals/${def1}/submit"
              payload: { documents_ref: "s3://truss-calcs" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/deferred-submittals/${def2}/submit"
              payload: { documents_ref: "s3://anchor-calcs" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/deferred-submittals/${def1}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/deferred-submittals/${def2}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "Engagement.${eng_id}.estimated_fee_cents == 333333"
            - "Engagement.${eng_id}.final_fee_cents == 366667 (333333 + 2 x 16667 per-item-rounded; sum-then-round would give 366666)"
            - "Engagement.${eng_id}.deferred_pending_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: Engagement vs
  # DeficiencyComment)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: engagement_revision_loop_in_progress_approved_in_progress
        grounds:
          - state_machines.Engagement.APPROVED_to_IN_PROGRESS
          - state_machines.Engagement.IN_PROGRESS_to_APPROVED
          - state_machines.ReviewRecord.DRAFT_to_SEALED
        distinguishing_aspect: |
          Engagement is cyclic: an APPROVED engagement accepts a revision cycle
          (record still DRAFT) and loops back to IN_PROGRESS, then re-approves —
          the DRAFT record's cycle_count_snapshot is refreshed from 1 to 2.
        test_recipe:
          setup:
            - "Jurisdiction UT: VALUATION, CALENDAR 15d, deferred permitted"
            - "Engagement with one clean-approved cycle (APPROVED, DRAFT record with cycle_count_snapshot=1)"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "UT", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Five", licenses: [{ state_code: "UT", license_type: "PE", license_number: "P5", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Revision Loop", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "RESIDENTIAL", risk_category: "I", scope: "FULL_REVIEW", declared_valuation_cents: 20000000, floor_area_sqft: 4000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://rev-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc1}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://rev-v2" }
              as: Applicant
              as_user_id: "app-1"
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc2}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_snap: "$.data[0].cycle_count_snapshot", rec_status: "$.data[0].status" }
          assert:
            - "ReviewCycle.${cyc2}.cycle_number == 2"
            - "after revision cycle creation Engagement.${eng_id} returned to IN_PROGRESS, after second approval Engagement.${eng_id}.status == APPROVED"
            - "${rec_status} == DRAFT (revision allowed only while record unsealed)"
            - "${rec_snap} == 2 (snapshot refreshed on re-approval)"
            - "ReviewCycle.${cyc1}.status == APPROVED (prior approval is terminal, not superseded)"

      - name: comment_open_addressed_reopened_addressed_verified_loop
        grounds:
          - state_machines.DeficiencyComment.OPEN_to_ADDRESSED
          - state_machines.DeficiencyComment.ADDRESSED_to_REOPENED
          - state_machines.DeficiencyComment.REOPENED_to_ADDRESSED
          - state_machines.DeficiencyComment.ADDRESSED_to_VERIFIED
        distinguishing_aspect: |
          DeficiencyComment is cyclic: a response (ADDRESSED) can be rejected
          back to REOPENED and answered again across a second resubmittal round
          before VERIFY closes it — the loop runs OPEN -> ADDRESSED -> REOPENED
          -> ADDRESSED -> VERIFIED.
        test_recipe:
          setup:
            - "Jurisdiction AZ: VALUATION, BUSINESS 15d"
            - "Cycle 1 issued one MAJOR comment; applicant responded (ADDRESSED)"
            - "Cycle 2 in review; reviewer reopens the comment; cycle 2 issues the reopened letter; applicant responds again; cycle 3 verifies"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "AZ", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Six", licenses: [{ state_code: "AZ", license_type: "PE", license_number: "P6", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Comment Loop", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://loop-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1605.2", reference_edition: "IBC_2021", severity: "MAJOR", category: "LOAD_PATH", comment_text: "Load path discontinuity at transfer girder" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com1: $.data.id }
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/comments/${com1}/responses"
              payload: { response_text: "Added collector, see S3.0" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://loop-v2" }
              as: Applicant
              as_user_id: "app-1"
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/comments/${com1}/reopen"
              payload: { reopen_note: "Collector overstressed at level 2" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc2}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/comments/${com1}/responses"
              payload: { response_text: "Collector upsized to W18, calc attached" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://loop-v3" }
              as: Applicant
              as_user_id: "app-1"
              captures: { cyc3: $.data.id, cyc3_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc3}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc3_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments/${com1}/verify"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { unresolved: $.data.unresolved_comment_count }
          assert:
            - "DeficiencyComment.${com1}.status == VERIFIED after the full OPEN -> ADDRESSED -> REOPENED -> ADDRESSED -> VERIFIED loop"
            - "DeficiencyComment.${com1}.response_count == 2"
            - "${unresolved} == 0 (REOPENED and ADDRESSED counted as unresolved until VERIFY)"
            - "ReviewCycle.${cyc1}.status == SUPERSEDED and ReviewCycle.${cyc2}.status == SUPERSEDED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers: cycle approve vs
  # engagement cancel)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: approve_cascade_cycle_to_engagement_to_record
        grounds:
          - state_machines.ReviewCycle.IN_REVIEW_to_APPROVED
          - state_machines.Engagement.IN_PROGRESS_to_APPROVED
          - entities.ReviewRecord
        distinguishing_aspect: |
          Depth-3 chain from POST /cycles/{id}/approve: cycle.status mutates
          (link 1), that mutation bubbles the engagement to APPROVED (link 2),
          and the engagement approval itself creates the DRAFT ReviewRecord
          with edition/cycle snapshots (link 3) — each link caused by the
          previous one, not by the original call.
        test_recipe:
          setup:
            - "Jurisdiction OR: VALUATION, CALENDAR 15d"
            - "Engagement with one cycle IN_REVIEW (assigned), zero comments"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "OR", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Seven", licenses: [{ state_code: "OR", license_type: "PE", license_number: "P7", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Approve Cascade", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "INDUSTRIAL", risk_category: "III", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 20000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://app-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_status: "$.data[0].status", rec_ibc: "$.data[0].pinned_ibc_edition", rec_cycles: "$.data[0].cycle_count_snapshot" }
            - call: "GET /plan-review/assignments/${asg_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { asg_status: $.data.status }
          assert:
            - "ReviewCycle.${cyc_id}.status == APPROVED (link 1)"
            - "Engagement.${eng_id}.status == APPROVED (link 2, bubble-up)"
            - "${rec_status} == DRAFT (link 3, record created by the engagement transition)"
            - "${rec_ibc} == IBC_2021 and ${rec_cycles} == 1"
            - "${asg_status} == COMPLETED (cycle-level side effect of approval)"

      - name: cancel_cascade_engagement_to_cycle_to_assignment
        grounds:
          - state_machines.Engagement.IN_PROGRESS_to_CANCELLED
          - state_machines.ReviewCycle.IN_REVIEW_to_CANCELLED
          - state_machines.ReviewAssignment.ACTIVE_to_RELEASED
          - calculations.reviewer_active_load
        distinguishing_aspect: |
          Depth-3 chain from POST /engagements/{id}/cancel — a different
          triggering transition than approval: engagement CANCELLED (link 1)
          forces its non-terminal cycle CANCELLED (link 2), and the cycle
          cancellation itself releases the ACTIVE assignment and decrements
          reviewer.active_assignment_count (link 3).
        test_recipe:
          setup:
            - "Jurisdiction CO: VALUATION, BUSINESS 15d"
            - "Engagement IN_PROGRESS with cycle IN_REVIEW and one ACTIVE assignment; reviewer count == 1"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CO", ibc_edition: "IBC_2018", asce7_edition: "ASCE7_16", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Eight", licenses: [{ state_code: "CO", license_type: "PE", license_number: "P8", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cancel Cascade", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://cxl-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /plan-review/engagements/${eng_id}/cancel"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /plan-review/cycles/${cyc_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { cyc_status: $.data.status }
            - call: "GET /plan-review/assignments/${asg_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { asg_status: $.data.status }
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { rev_load: $.data.active_assignment_count }
          assert:
            - "Engagement.${eng_id}.status == CANCELLED (link 1)"
            - "${cyc_status} == CANCELLED (link 2, caused by the engagement cancellation)"
            - "${asg_status} == RELEASED (link 3, caused by the cycle cancellation)"
            - "${rev_load} == 0 (capacity restored through the cascade)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs:
  # state vs business_constraint; business_safety vs business_referential)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_error_beats_unresolved_comments_error
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_CYCLE_NOT_IN_REVIEW]
          - errors[ERR_UNRESOLVED_COMMENTS_REMAIN]
        distinguishing_aspect: |
          Pair {state, business_constraint}: approving a COMMENTS_ISSUED cycle
          that still has an OPEN comment violates both the state gate and the
          unresolved-comments gate; the priority-7 state error must win.
        test_recipe:
          setup:
            - "Jurisdiction TX: VALUATION, CALENDAR 15d"
            - "Cycle COMMENTS_ISSUED with one comment still OPEN (no response posted)"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "TX", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Nine", licenses: [{ state_code: "TX", license_type: "PE", license_number: "P9", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Priority One", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://prio-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc_id}", code_section_ref: "2308.6.1", reference_edition: "IBC_2021", severity: "MINOR", category: "DETAILING", comment_text: "Anchor bolt spacing missing" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CYCLE_NOT_IN_REVIEW (state priority 7 beats business_constraint priority 9)"
            - "ReviewCycle.${cyc_id}.status remains COMMENTS_ISSUED (no side effects on failure)"

      - name: seal_license_error_beats_deferred_outstanding_error
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_LICENSE_WINDOW_INSUFFICIENT]
          - errors[ERR_DEFERRED_SUBMITTALS_OUTSTANDING]
        distinguishing_aspect: |
          Pair {business_safety, business_referential}: sealing with an expired
          state license while a deferred submittal is still pending violates
          both gates; the priority-8 licensing error must win over the
          priority-10 referential error.
        test_recipe:
          setup:
            - "Jurisdiction FL: VALUATION, CALENDAR 15d"
            - "Reviewer's FL license expires 2026-09-30 (valid through the CALENDAR due date 2026-08-16, i.e. default-clock 2026-08-01T00:00:00Z + 15 days)"
            - "Engagement approved clean; one deferred item left REGISTERED (never submitted)"
            - "Clock advanced to 2026-10-15 (license expired) before seal"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "FL", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Ten", licenses: [{ state_code: "FL", license_type: "PE", license_number: "P10", expires_on: "2026-09-30" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Priority Two", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://fl-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/deferred-submittals"
              payload: { engagement_id: "${eng_id}", item_type: "TRUSS", description: "Truss package" }
              as: Applicant
              as_user_id: "app-1"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LICENSE_WINDOW_INSUFFICIENT (business_safety priority 8 beats business_referential priority 10)"
            - "ReviewRecord.${rec_id}.status remains DRAFT"
            - "Engagement.${eng_id}.final_fee_cents remains null (seal side effects did not run)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics: assignment count vs
  # completion timestamp; different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_rejects_exactly_at_max
        grounds:
          - calculations.reviewer_active_load
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
          - entities.Reviewer.fields.max_concurrent_assignments
        distinguishing_aspect: |
          Metric = integer assignment count on POST /assignments: the gate is
          inclusive (active >= max), so the 3rd assignment on a max=3 reviewer
          succeeds while the 4th — at exactly max — is rejected.
        test_recipe:
          setup:
            - "Jurisdiction GA; reviewer max_concurrent_assignments=3"
            - "Three engagements each with a cycle assigned to the reviewer (active_assignment_count == 3)"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "GA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Eleven", licenses: [{ state_code: "GA", license_type: "PE", license_number: "P11", expires_on: "2030-01-01" }], max_concurrent_assignments: 3 }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cap One", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng1: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng1}", documents_ref: "s3://c1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cap Two", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng2: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng2}", documents_ref: "s3://c2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cap Three", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng3: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng3}", documents_ref: "s3://c3" }
              as: ReviewCoordinator
              captures: { cyc3: $.data.id, cyc3_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc3}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc3_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Cap Four", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng4: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng4}", documents_ref: "s3://c4" }
              as: ReviewCoordinator
              captures: { cyc4: $.data.id, cyc4_v: $.data.version }
          trigger:
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc4}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc4_v}" }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { load: $.data.active_assignment_count }
          assert:
            - "first three assignments succeeded (reviewer.active_assignment_count == 3 == max)"
            - "${err} == ERR_REVIEWER_CAPACITY_EXCEEDED (boundary >= rejects at exactly max)"
            - "${load} == 3 (failed assignment did not change the count)"
            - "ReviewCycle.${cyc4}.status == OPEN (rejection left the cycle unassigned)"

      - name: on_time_boundary_completed_exactly_at_due_at
        grounds:
          - calculations.on_time_evaluation
          - entities.ReviewCycle.fields.is_on_time
        distinguishing_aspect: |
          Metric = completion timestamp on POST /cycles/{id}/issue-comments: the
          comparison is <=, so completing at exactly due_at
          (2026-08-24T23:59:59.999Z) yields is_on_time == true — one millisecond
          later would flip it.
        test_recipe:
          setup:
            - "Jurisdiction IL: BUSINESS sla, turnaround_days=15"
            - "Cycle received Monday 2026-08-03T10:00:00Z -> due_at 2026-08-24T23:59:59.999Z; one comment raised; clock then advanced to exactly due_at"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
