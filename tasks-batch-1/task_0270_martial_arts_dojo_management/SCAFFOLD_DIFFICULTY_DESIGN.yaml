          assert:
            - "Member.${m_id}.outstanding_balance_cents == 12000 after pro-shop fulfilment (white belt -> 0% discount, net == gross)"
            - "The promotion-test attempt returns error_id == ERR_WAIVER_NOT_SIGNED (priority 9 safety beats priority 12 fiscal ERR_TEST_BALANCE_TOO_HIGH)"

      - name: state_vs_capacity_on_attendance
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: |
          A check-in against a CANCELLED (terminal) class that is ALSO at capacity must return
          ERR_INVALID_STATE (priority 8, state) rather than ERR_CLASS_FULL (priority 17,
          business_temporal) — a state-vs-temporal category pair, distinct from the safety-vs-fiscal pair.
        test_recipe:
          setup:
            - "A class of capacity 1 that already has one CONFIRMED attendance and is then CANCELLED."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
