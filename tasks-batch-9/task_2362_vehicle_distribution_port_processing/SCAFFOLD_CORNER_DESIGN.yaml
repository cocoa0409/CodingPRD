          assert:
            - "${dup_vin_error} == ERR_DUPLICATE_KEY with HTTP 409"
            - "${dup_port_error} == ERR_DUPLICATE_KEY with HTTP 409"
            - "GET /vpc/vehicles?vin=1VWSA7A3XFC000402 returns total_count == 1 and data[0].id == ${veh_id}"
            - "GET /vpc/processing-centers?port_code=USNPT returns total_count == 1 and Vessel.${vessel_id}.discharged_unit_count == 1"

      - name: corner_claim_filing_below_the_damage_threshold_is_not_warranted
        claim_type: Violation → Error
        grounds:
          - validations.priority_22
          - errors.ERR_CLAIM_NOT_WARRANTED
          - endpoints.POST_/vpc/damage-surveys/{surveyId}/claims
        distinguishing_aspect: "A submitted survey with a single INTERIOR line of 24 points has severity_index 24, one point below DAMAGE_OPEN_THRESHOLD, so filing a carrier claim returns ERR_CLAIM_NOT_WARRANTED 409 and the survey stays SUBMITTED."
        test_recipe:
          setup:
            - "One discharged unit with a SUBMITTED survey of severity_index 24 (INTERIOR, weight 1.0, single line)."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
