# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2881 - Aquatic Invasive Species Inspection & Decontamination
# Every instance grounds only in elements declared in SCAFFOLD.yaml SS1.1-1.7.
# Every numeric literal in an `assert:` was computed by executing the pinned
# formula in SS1.3 against its declared constants.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_arrival_basis_versus_screening_basis
        grounds:
          - calculations.watercraft_risk_score
          - calculations.watercraft_risk_band
          - entities.InspectionRecord.fields.risk_score
          - entities.InspectionRecord.fields.advisory_risk_score
          - entities.InspectionRecord.fields.dry_credit_points
          - state_machines.InspectionRecord.INITIATED_to_SCREENED
        distinguishing_aspect: |
          Both variants run in the SAME screening request over identical stored
          data and differ only in basis_instant - arrival_basis uses
          record.arrived_at and screening_basis uses the logical clock at the
          screening call - so the two-hour queue wait crosses a 24-hour dry-credit
          boundary and the authoritative risk_score (57) exceeds the advisory
          advisory_risk_score (52) by exactly 5 points; only the arrival variant
          feeds risk_band, decon_mandatory and dry_credit_points. Entity domain:
          InspectionRecord / Watercraft risk scoring.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "WaterBody 'Flathead Lake' with risk_tier HIGH and infestation_status CLEAN."
            - "InspectionStation 'Polson Access' guarding that lake, status OPEN, with one StationHours window covering all of July-September 2026."
            - "Inspector 'Ada Field' ACTIVE at LEVEL_1 after 8 credited training hours."
            - "Watercraft MT-1001, OPEN_HULL (vessel_factor 1.00), last_removed_at 2026-07-30T08:00:00Z."
            - "InspectionRecord in INITIATED with arrived_at 2026-08-01T07:00:00Z - 47 h of standing time at arrival, 49 h at screening."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 2, hot_water_capable: true, seal_stock_initial_count: 3 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18, last_water_body_id: "${wb_id}", last_removed_at: "2026-07-30T08:00:00Z" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-01T07:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_v}", residual_water_present: true, standing_water_ml: 250, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
          assert:
            - "InspectionRecord.${rec_id}.risk_score == 57"
            - "InspectionRecord.${rec_id}.advisory_risk_score == 52"
            - "InspectionRecord.${rec_id}.risk_score - InspectionRecord.${rec_id}.advisory_risk_score == 5"
            - "InspectionRecord.${rec_id}.dry_credit_points == 5"
            - "InspectionRecord.${rec_id}.risk_band == HIGH"
            - "InspectionRecord.${rec_id}.decon_mandatory == true"
            - "InspectionRecord.${rec_id}.quarantine_warranted == false"
            - "InspectionRecord.${rec_id}.inspection_status == SCREENED"
            - "InspectionRecord.${rec_id}.screening_completed_at == 2026-08-01T09:00:00Z"

      - name: campaign_effectiveness_pre_post_versus_control_corridor
        grounds:
          - calculations.campaign_effectiveness_score
          - entities.EducationCampaign.fields.effectiveness_score
          - entities.EducationCampaign.fields.alternate_effectiveness_score
          - entities.EducationCampaign.fields.baseline_compliance_rate
          - state_machines.EducationCampaign.RUNNING_to_EVALUATED
        distinguishing_aspect: |
          The two variants differ in the SHAPE of the baseline, not in the data:
          pre_post compares the target water body against itself over the
          equal-length window immediately before start_at (0.5), while
          control_corridor compares it against every water body over the SAME
          window (0.6667). On byte-identical records the same campaign therefore
          scores 52.00 under pre_post and 35.33 under control_corridor - a 16.67
          point divergence - and evaluation_method decides which lands in
          effectiveness_score. Entity domain: EducationCampaign outreach
          evaluation, disjoint from the risk-scoring domain of instance 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-25T00:00:00Z, past both campaigns' end_at."
            - "Target WaterBody 'Target Lake' (risk_tier LOW, CLEAN) with OPEN station 'Target Access'; second WaterBody 'Other Lake' (risk_tier LOW, CLEAN) with OPEN station 'Other Access'."
            - "Two InspectionRecords on the target lake in the pre-window 2026-07-31..2026-08-10: one PASSED, one REFUSED - baseline pre_post rate 1/2 = 0.5."
            - "Two InspectionRecords on the target lake inside the campaign window 2026-08-10..2026-08-20: one PASSED, one REFUSED - window rate 1/2 = 0.5."
            - "One extra PASSED InspectionRecord on the other lake inside the window, lifting the statewide window rate to 2/3 = 0.6667."
            - "Campaign 'Clean Drain Dry 2026' RUNNING with evaluation_method PRE_POST, impressions 12000 (bonus 2), and campaign 'Corridor Control 2026' RUNNING with evaluation_method CONTROL_CORRIDOR over the identical window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Target Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "LOW", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_t: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Other Lake", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "LOW", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_o: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Target Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_t}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 1 }
              as: ProgramAdmin
              captures: { st_t: $.data.id }
            - call: "POST /inspection-stations/${st_t}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_t}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspection-stations"
              payload: { name: "Other Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_o}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 1 }
              as: ProgramAdmin
              captures: { st_o: $.data.id }
            - call: "POST /inspection-stations/${st_o}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_o}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_t}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-2001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 16 }
              as: ProgramAdmin
              captures: { wc1: $.data.id, wc1_v: $.data.version }
            - call: "POST /watercraft"
              payload: { registration_number: "MT-2002", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 16 }
              as: ProgramAdmin
              captures: { wc2: $.data.id, wc2_v: $.data.version }
            - call: "POST /watercraft"
