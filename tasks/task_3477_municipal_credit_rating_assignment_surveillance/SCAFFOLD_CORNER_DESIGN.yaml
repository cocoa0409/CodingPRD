        distinguishing_aspect: "Publish is the hub side-effect: it stamps outlook/rationale/published_at on the rating, ends the engagement at PUBLISHED, spawns disclosure obligation period 1 (FYE 2027-06-30, due 2028-01-26), and logs RATING_PUBLISHED — all observable immediately."
        test_recipe:
          setup:
