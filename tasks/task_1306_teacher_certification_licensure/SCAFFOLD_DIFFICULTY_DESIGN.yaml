            - "EmergencyPermit.${perm}.status == 'REVOKED'"
            - "MisconductCase.${mc}.status == 'SANCTION_ISSUED'"

      - name: background_denial_cascades_application_and_permit
        grounds:
          - state_machines.BackgroundCheck.ADJUDICATION_to_DENIED
          - state_machines.CredentialApplication.BACKGROUND_REVIEW_to_DENIED
          - state_machines.EmergencyPermit.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (background adjudication DENIED):
          BackgroundCheck DENIED -> application BACKGROUND_REVIEW -> DENIED (1),
          application DENIED -> its ISSUED emergency permit REVOKED (2).
        test_recipe:
          setup:
            - "ALTERNATIVE SCIENCE application in BACKGROUND_REVIEW; deficiency plan COMPLETED; ISSUED permit D02; background check FLAGGED (FELONY_OTHER conviction ~2y old => 60 >= 40) and moved to ADJUDICATION"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Ida Id", email: "ida@x.com", date_of_birth: "1991-06-06T00:00:00Z", ssn_last4: "9999", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
