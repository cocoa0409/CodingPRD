            - "FindsBuy.${buy}.remaining_quantity == 0 and status == SOLD_OUT (hop B->C)"
            - "Store.${store}.finds_sell_through_pct == 100.0 (hop C->D)"

  # =====================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: tender_bid_state_before_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_TENDER_NOT_OPEN]
          - errors[ERR_BID_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): a bid on a DRAFT tender
          that also exceeds the bid ceiling must fail with ERR_TENDER_NOT_OPEN
          (state, priority 5), never ERR_BID_CEILING_EXCEEDED (fiscal, priority 9).
        test_recipe:
          setup:
            - "Category, CORE product, supplier, tender in DRAFT (never opened) with ceiling 1000"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
          trigger:
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 1500 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TENDER_NOT_OPEN (state priority 5 wins over fiscal priority 9)"
            - "HTTP status == 409"
            - "no TenderBid row created for supplier ${sup_a}"

      - name: labor_window_temporal_before_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_WINDOW_OVERLAP]
          - errors[ERR_WINDOW_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint): a 7th
          labor window in the same ISO week that also overlaps an existing window
          in the same aisle zone must fail with ERR_WINDOW_OVERLAP (temporal,
          priority 7), never ERR_WINDOW_LIMIT_EXCEEDED (constraint, priority 8).
        test_recipe:
          setup:
            - "Store S1 with 6 non-cancelled labor windows in ISO week of 2026-09-07, one of them 06:00-08:00 in aisle zone Z1"
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T10:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z2", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z2", role: "CASHIER", starts_at: "2026-09-08T06:00:00Z", ends_at: "2026-09-08T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z3", role: "CASHIER", starts_at: "2026-09-09T06:00:00Z", ends_at: "2026-09-09T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z3", role: "SHIFT_LEAD", starts_at: "2026-09-10T06:00:00Z", ends_at: "2026-09-10T07:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T07:00:00Z", ends_at: "2026-09-07T09:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_OVERLAP (temporal priority 7 wins over constraint priority 8)"
            - "HTTP status == 409"
            - "store still has exactly 6 non-cancelled labor windows"

