            - "Encounter.${enc_late_id}.mse_started_at == 2026-08-01T08:30:01Z and Encounter.${enc_late_id}.mse_timeliness == LATE"
            - "both encounters have clinical_state == MSE_IN_PROGRESS"
            - "Facility.${fac_id}.open_compliance_defect_count == 1 and Facility.${fac_id}.compliance_posture == OPEN"
            - "GET /facilities/${fac_id}/compliance-ledger-entries?event_type=SCREENING_DELAY returns total_count == 1 with severity == MAJOR, defect_counted == true and subject_id == ${enc_late_id}"
      - name: coverage_floor_hours_boundary_across_empty_and_exactly_floor_and_just_over_floor_histories
        grounds:
          - calculations.required_physician_coverage
          - entities.VolumeForecast.fields.forecast_basis
          - endpoints[POST /facilities/{id}/volume-forecasts]
        distinguishing_aspect: |
          A different metric (required physician hours per day against the statutory
          COVERAGE_FLOOR_HOURS_PER_DAY of 12, with quarter-hour ceiling) exercised through a
          different endpoint (POST /facilities/{id}/volume-forecasts). Three histories bracket the
          floor: [] takes the FLOOR_ONLY branch at 12.00, [18] computes exactly 12.00 so the floor
          and the computed value coincide while forecast_basis is HISTORY, and [19] computes 12.6667
          which ceilings to 12.75 and finally exceeds the floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN and no physician shifts at all, so every forecast's scheduled_physician_hours is 0.00"
            - "One forecast for period_start_date 2026-09-01, period_days 7, historical_daily_volumes [] and method TRAILING_MEAN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-09-01", period_days: 7, historical_daily_volumes: [], method: "TRAILING_MEAN" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_empty_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-09-08", period_days: 7, historical_daily_volumes: [18], method: "TRAILING_MEAN" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_at_floor_id: $.data.id }
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-09-15", period_days: 7, historical_daily_volumes: [19], method: "TRAILING_MEAN" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_over_floor_id: $.data.id }
          assert:
            - "VolumeForecast.${vf_empty_id}.forecast_basis == FLOOR_ONLY and VolumeForecast.${vf_empty_id}.forecast_daily_volume == 0.00"
            - "VolumeForecast.${vf_empty_id}.required_physician_hours_per_day == 12.00 and required_physician_hours_total == 84.00 and required_board_certified_hours_total == 63.00"
            - "VolumeForecast.${vf_at_floor_id}.forecast_basis == HISTORY and VolumeForecast.${vf_at_floor_id}.forecast_daily_volume == 18.00"
            - "VolumeForecast.${vf_at_floor_id}.required_physician_hours_per_day == 12.00 and required_physician_hours_total == 84.00 and required_board_certified_hours_total == 63.00"
            - "VolumeForecast.${vf_over_floor_id}.forecast_basis == HISTORY and VolumeForecast.${vf_over_floor_id}.forecast_daily_volume == 19.00"
            - "VolumeForecast.${vf_over_floor_id}.required_physician_hours_per_day == 12.75 and required_physician_hours_total == 89.25 and required_board_certified_hours_total == 66.94"
            - "VolumeForecast.${vf_over_floor_id}.scheduled_physician_hours == 0.00 and coverage_deficit_hours == 89.25"
            - "VolumeForecast.${vf_empty_id}.status == SUPERSEDED and VolumeForecast.${vf_at_floor_id}.status == SUPERSEDED and VolumeForecast.${vf_over_floor_id}.status == ACTIVE"
      - name: idr_award_at_the_inclusive_band_edge_is_accepted_while_one_cent_below_is_rejected
        grounds:
          - validations[priority=33]
          - errors[ERR_AWARD_OUT_OF_RANGE]
          - endpoints[POST /dispute-cases/{id}/award]
        distinguishing_aspect: |
          A third metric (award money against the inclusive negotiation band
          [min(last_offer_cents, last_counteroffer_cents), max(...)]) on a third endpoint
          (POST /dispute-cases/{id}/award). With last_offer 230000 and last_counteroffer 210000 the
          band is [210000, 230000]: 209999 is rejected with ERR_AWARD_OUT_OF_RANGE while the exact
          edge 210000 is accepted, and the failed attempt leaves the dispute in IDR_INITIATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN"
