            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1000.0, declared_container_count: 4, is_bulk: false }] }
              as: ReceivingClerk
          assert:
            - "WasteProfile.${prof_id}.status == DRAFT"
            - "response status == 409 and data.error_id == ERR_PROFILE_NOT_APPROVED"
            - "data.error_id != ERR_PROFILE_EXPIRED"
            - "GET /tsdf/manifests?generator_id=${gen_id} returns total_count == 0"
            - "Generator.${gen_id}.open_charge_cents == 0"

      - name: error_unit_posture_blocked_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors[ERR_UNIT_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: inspection_leak_condemn_unit_suspend_batch_hold_reserved_release
          rationale: |
            That §1.8 instance suspends a unit through the leak cascade and asserts that the next
            placement returns ERR_UNIT_POSTURE_BLOCKED; repeating it here would add no new grounds.

      - name: error_permit_not_active_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_PERMIT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: treatment_batch_start_blocked_by_facility_permit_expired
          rationale: |
            The expired-permit START is exactly that §1.8 instance, including the proof that the batch
            stays PLANNED and the reserved figures are untouched.

      - name: error_generator_suspended_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - errors[ERR_GENERATOR_SUSPENDED]
        excluded_because:
          difficulty_instance: profile_approval_blocked_by_generator_suspended
          rationale: |
            That §1.8 instance drives the suspended-generator gate on the approval path and shows the
            profile remaining in SAMPLE_PASSED.

      - name: error_profile_expired_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=15]
          - errors[ERR_PROFILE_EXPIRED]
        excluded_because:
          difficulty_instance: profile_suspension_deficient_unit_restricted_batch_hold
          rationale: |
            The recertification lapse and its ERR_PROFILE_EXPIRED placement refusal are asserted inside
            that §1.8 instance's expiry arm.

      - name: error_aisle_clearance_violation_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=29]
          - errors[ERR_AISLE_CLEARANCE_VIOLATION]
        excluded_because:
          difficulty_instance: aisle_clearance_on_empty_unit_passes_with_zero_containers
          rationale: |
            That §1.8 instance walks the aisle formula to and past 76 cm, asserting both the passing
            boundary and the ERR_AISLE_CLEARANCE_VIOLATION refusal one container later.

      - name: error_treatment_window_conflict_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=27]
          - errors[ERR_TREATMENT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: unit_batch_class_change_buffer_overlap_rejected
          rationale: |
            The decontamination-buffer overlap in that §1.8 instance is the sharpest trigger for this
            error; a plain overlap here would be strictly weaker.

      - name: error_facility_concurrency_exceeded_is_returned
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - errors[ERR_FACILITY_CONCURRENCY_EXCEEDED]
        excluded_because:
          difficulty_instance: facility_closed_interval_concurrency_touching_windows_counts
          rationale: |
            That §1.8 instance fills the facility's concurrency budget with touching windows and asserts
            this error on the batch that would exceed it.

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:
      - name: request_missing_x_user_headers_unauthenticated
        claim_type: other_role_exclusive_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication precedes everything, including role and payload checks: a well-formed facility
          create with no identity headers returns 401, never 403 or 422.
        test_recipe:
          setup:
            - "Empty system"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: null
          assert:
            - "response status == 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id != ERR_ROLE_NOT_PERMITTED"
            - "GET /tsdf/facilities as PlatformAdmin returns total_count == 0"

      - name: treatment_operator_creating_a_facility_unauthorized
        claim_type: other_role_exclusive_denied
        grounds:
          - rbac.roles.PlatformAdmin.exclusive_operations
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Facility creation is PlatformAdmin's alone. A TreatmentOperator — a role with wide authority
          on the treatment floor — is still refused with 403, and the refusal happens before the payload
          is even evaluated.
        test_recipe:
          setup:
            - "Empty system"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: TreatmentOperator
              as_user_id: "op-01"
          assert:
            - "response status == 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /tsdf/facilities as PlatformAdmin returns total_count == 0"
            - "The identical payload as PlatformAdmin returns 201"

      - name: generator_reading_another_generators_manifest_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - rbac.roles.Generator.identity
          - validations[priority=3]
          - errors[ERR_GENERATOR_SCOPE_VIOLATION]
        distinguishing_aspect: |
          The Generator role is entity-backed, so authorization is row-level: generator B may read its
          own manifest but is refused generator A's with a scope violation rather than a 404, and the
          distinction between "not yours" and "does not exist" is preserved.
        test_recipe:
          setup:
            - "Facility; two generators A and B; a manifest belonging to generator A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
