# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2144 — Antitrust & Competition Compliance Program
# 23 instances across the nine §0.5 Difficulty Rules.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: hsr_valuation_variant_divergence_on_transaction
        grounds:
          - calculations.hsr_size_of_transaction
          - entities.HsrAnalysis.fields.valuation_variant
          - entities.HsrAnalysis.fields.determination
          - state_machines.Transaction.DRAFT_to_EXEMPT
          - state_machines.Transaction.EXEMPT_to_ANALYZED
        distinguishing_aspect: |
          This dual-variant calculation lives on the Transaction / HsrAnalysis
          domain — merger-control valuation. The SIGNED_DEAL and MARKET_VALUE
          variants read the SAME Transaction row and land on opposite sides of
          HSR_SIZE_OF_TRANSACTION_THRESHOLD_CENTS, producing determination
          BELOW_THRESHOLD (filing_required false, Transaction EXEMPT) versus
          FILING_REQUIRED (filing_required true, Transaction ANALYZED).
        test_recipe:
          setup:
            - "One BusinessUnit, posture OPEN, no risk assessment."
            - "One Transaction in DRAFT with deal_value_cents 11_000_000_000, assumed_liabilities_cents 100_000_000 and market_valuation_cents 13_000_000_000 — the signed price is below the notification threshold, the market value is above it."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/transactions"
              payload: { business_unit_id: "${bu_id}", target_name: "Kelmar Coatings BV", deal_value_cents: 11000000000, assumed_liabilities_cents: 100000000, market_valuation_cents: 13000000000, acquirer_total_assets_cents: 50000000000, target_total_assets_cents: 5000000000, signed_at: "2026-06-01T00:00:00Z", exemption_code: "NONE" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { tx_id: $.data.id, tx_v1: $.data.version }
          trigger:
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_id}", valuation_variant: "SIGNED_DEAL", expected_transaction_version: "${tx_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { an_signed_id: $.data.id }
            - call: "GET /compliance/transactions/${tx_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { tx_v2: $.data.version }
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_id}", valuation_variant: "MARKET_VALUE", expected_transaction_version: "${tx_v2}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { an_market_id: $.data.id }
          assert:
            - "HsrAnalysis.${an_signed_id}.size_of_transaction_cents == 11100000000"
            - "HsrAnalysis.${an_signed_id}.determination == BELOW_THRESHOLD"
            - "HsrAnalysis.${an_signed_id}.filing_required == false"
            - "HsrAnalysis.${an_market_id}.size_of_transaction_cents == 13100000000"
            - "HsrAnalysis.${an_market_id}.determination == FILING_REQUIRED"
            - "HsrAnalysis.${an_market_id}.filing_required == true"
            - "HsrAnalysis.${an_signed_id}.status == SUPERSEDED"
            - "HsrAnalysis.${an_market_id}.status == ACTIVE"
            - "Transaction.${tx_id}.status == ANALYZED"

      - name: risk_index_variant_divergence_on_business_unit
        grounds:
          - calculations.market_risk_index
          - entities.RiskAssessment.fields.variant
          - entities.RiskAssessment.fields.incident_load
          - entities.BusinessUnit.fields.risk_band
          - state_machines.RiskAssessment.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          This dual-variant calculation lives on a different entity domain —
          market-position risk scoring on a BusinessUnit, not deal valuation.
          BASELINE and INCIDENT_ADJUSTED read the identical BusinessUnit row and
          the identical contact history, yet produce 46.00/MODERATE versus
          51.00/HIGH because only INCIDENT_ADJUSTED consults the escalated
          contact count.
        test_recipe:
          setup:
            - "One BusinessUnit with market_share_bps 3000, interaction_point_count 0, competitor_overlap_pct 5 — structural base exactly 46.00."
            - "One LEGAL-role employee (the training gate does not apply to LEGAL) with exactly one CompetitorContact escalated to ESCALATED."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 3000, interaction_point_count: 0, competitor_overlap_pct: 5, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "WRITTEN_FORMAL", topic_tags: ["STANDARDS"], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
            - call: "POST /compliance/competitor-contacts/${c_id}/review-opening"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/competitor-contacts/${c_id}/escalation"
              payload: { reason: "Written benchmarking request touched forward capacity plans" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
          trigger:
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "BASELINE", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_base_id: $.data.id }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v2: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "INCIDENT_ADJUSTED", expected_business_unit_version: "${bu_v2}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_inc_id: $.data.id }
          assert:
            - "RiskAssessment.${ra_base_id}.market_risk_index == 46.00"
            - "RiskAssessment.${ra_base_id}.risk_band == MODERATE"
            - "RiskAssessment.${ra_base_id}.incident_load == 0"
            - "RiskAssessment.${ra_base_id}.escalated_contact_count == 0"
            - "RiskAssessment.${ra_inc_id}.market_risk_index == 51.00"
            - "RiskAssessment.${ra_inc_id}.risk_band == HIGH"
            - "RiskAssessment.${ra_inc_id}.incident_load == 5"
            - "RiskAssessment.${ra_inc_id}.escalated_contact_count == 1"
            - "RiskAssessment.${ra_base_id}.status == SUPERSEDED"
            - "BusinessUnit.${bu_id}.risk_band == HIGH"
            - "BusinessUnit.${bu_id}.posture == RESTRICTED"
            - "BusinessUnit.${bu_id}.exposure_points == 8.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contact_exposure_nonlinear_stack_with_pre_multiplier_cap
        grounds:
          - calculations.contact_exposure_points
          - entities.CompetitorContact.fields.band_multiplier_applied
          - entities.CompetitorContact.fields.exposure_points_charged
          - entities.BusinessUnit.fields.risk_band
        distinguishing_aspect: |
          MODE (a) — a five-input formula with non-linear interaction: a per-tag
          sum capped at TAG_POINTS_CAP, the whole raw score capped at
          RAW_POINTS_CAP, and only then multiplied by a band-selected
          multiplier. Applying RAW_POINTS_CAP after the multiplier, or omitting
          the tag cap, gives 42.00 or 20.00 instead of the correct 40.00.
        test_recipe:
          setup:
            - "BusinessUnit with market_share_bps 5000, interaction_point_count 2, competitor_overlap_pct 10 and an ACTIVE BASELINE RiskAssessment scoring 78.00 -> band SEVERE (multiplier 2.0)."
            - "A PRICING-role employee whose mandatory pricing curriculum is COMPLETED and current."
            - "exposure_budget_points 200 so the fiscal gate does not fire."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Coatings North America", market_code: "NA-COAT", market_share_bps: 5000, interaction_point_count: 2, competitor_overlap_pct: 10, exposure_budget_points: 200, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Dario Peng", email: "dario.peng@example.com", role_category: "PRICING" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/training-curricula"
              payload: { code: "AT-PRICE-101", title: "Pricing Communications and Competition Law", target_role_categories: ["SALES", "PRICING"], duration_minutes: 90, validity_days: 365, is_mandatory: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { cur_id: $.data.id }
            - call: "POST /compliance/training-assignments"
              payload: { employee_id: "${emp_id}", curriculum_id: "${cur_id}", due_at: "2026-08-31T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { ta_id: $.data.id }
            - call: "POST /compliance/training-assignments/${ta_id}/start"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/training-assignments/${ta_id}/completion"
              payload: { score: 88 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "BASELINE", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Novamer GmbH", contact_channel: "IN_PERSON_UNSTRUCTURED", topic_tags: ["CUSTOMER_ALLOCATION", "BID", "BENCHMARKING"], pricing_topic: true, occurred_at: "2026-07-28T15:30:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
          assert:
            - "RiskAssessment.${ra_id}.market_risk_index == 78.00"
            - "RiskAssessment.${ra_id}.risk_band == SEVERE"
            - "CompetitorContact.${c_id}.band_multiplier_applied == 2.0"
            - "CompetitorContact.${c_id}.exposure_points_charged == 40.00"
            - "BusinessUnit.${bu_id}.exposure_points == 40.00"
            - "BusinessUnit.${bu_id}.posture == RESTRICTED"

      - name: leniency_penalty_round_per_year_then_sum
        grounds:
          - calculations.leniency_penalty_estimate
          - calculations.leniency_priority_rank
          - entities.LeniencyApplication.fields.estimated_penalty_cents
          - state_machines.LeniencyApplication.MARKER_REQUESTED_to_MARKER_GRANTED
          - state_machines.LeniencyApplication.DISCLOSURE_DRAFT_to_DISCLOSURE_SUBMITTED
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER changes the answer. Each
          affected year is rounded to whole cents first and the rounded figures
          are then summed (900000015); summing the commerce first and rounding
          once gives 900000014, and after the 1.20 duration uplift and the
          50 percent rank-2 reduction the two orders land on 540000009 versus
          540000008.
        test_recipe:
          setup:
            - "Two BusinessUnits, each with market_share_bps 5000 / interaction 0 / overlap 0, each carrying an ACTIVE BASELINE RiskAssessment of 70.00 -> band HIGH, so both qualify for a marker."
            - "Two LeniencyApplications on the same cartel_code EU-RESIN-2021, each with the same three affected years."
            - "Unit X's marker is granted at 2026-08-02T00:00:00Z, unit Y's at 2026-08-03T00:00:00Z, so Y ranks 2."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Resins X", market_code: "EU-RESIN", market_share_bps: 5000, interaction_point_count: 0, competitor_overlap_pct: 0, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bux_id: $.data.id }
            - call: "GET /compliance/business-units/${bux_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bux_v1: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bux_id}", variant: "BASELINE", expected_business_unit_version: "${bux_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { rax_id: $.data.id }
            - call: "POST /compliance/business-units"
              payload: { name: "Resins Y", market_code: "EU-RESIN", market_share_bps: 5000, interaction_point_count: 0, competitor_overlap_pct: 0, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { buy_id: $.data.id }
            - call: "GET /compliance/business-units/${buy_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { buy_v1: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${buy_id}", variant: "BASELINE", expected_business_unit_version: "${buy_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ray_id: $.data.id }
            - call: "POST /compliance/leniency-applications"
              payload: { business_unit_id: "${bux_id}", cartel_code: "EU-RESIN-2021", affected_years: [{ year: 2023, affected_commerce_cents: 1000000010 }, { year: 2024, affected_commerce_cents: 2000000030 }, { year: 2025, affected_commerce_cents: 3000000050 }] }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { lax_id: $.data.id }
            - call: "POST /compliance/leniency-applications"
              payload: { business_unit_id: "${buy_id}", cartel_code: "EU-RESIN-2021", affected_years: [{ year: 2023, affected_commerce_cents: 1000000010 }, { year: 2024, affected_commerce_cents: 2000000030 }, { year: 2025, affected_commerce_cents: 3000000050 }] }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { lay_id: $.data.id }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/leniency-applications/${lax_id}/marker-request"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/leniency-applications/${lax_id}/marker-decisions"
              payload: { decision: "GRANTED" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/leniency-applications/${lay_id}/marker-request"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/leniency-applications/${lay_id}/marker-decisions"
              payload: { decision: "GRANTED" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/leniency-applications/${lay_id}/disclosure-submission"
              payload: { gravity_pct: 15 }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          assert:
            - "LeniencyApplication.${lax_id}.priority_rank == 1"
            - "LeniencyApplication.${lay_id}.priority_rank == 2"
            - "LeniencyApplication.${lay_id}.gravity_pct == 15"
            - "LeniencyApplication.${lay_id}.disclosure_status == SUBMITTED"
            - "LeniencyApplication.${lay_id}.marker_status == MARKER_GRANTED"
            - "LeniencyApplication.${lay_id}.estimated_penalty_cents == 540000009"
            - "BusinessUnit.${buy_id}.posture == FROZEN"

      - name: participation_review_load_pinned_evaluation_order
        grounds:
          - calculations.participation_review_load_minutes
          - entities.AssociationParticipation.fields.review_load_minutes
          - entities.BusinessUnit.fields.review_minutes_consumed
          - state_machines.AssociationParticipation.APPROVAL_PENDING_to_PARTIALLY_APPROVED
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency pinned to one evaluation
          order. base_minutes is 95 for a TIER_3_HIGH association at 100 percent
          competitor density; the surcharge tier is keyed on base_minutes only,
          giving 110. The forbidden fixed-point reading (tier keyed on the
          running total) converges on 125 instead.
        test_recipe:
          setup:
            - "BusinessUnit with review_minutes_budget 480 and posture OPEN."
            - "A SALES employee with a current mandatory training completion."
            - "An APPROVED TIER_3_HIGH trade association with competitor_density_pct 100."
            - "A participation for that trio sitting in APPROVAL_PENDING."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Industrial Adhesives EMEA", market_code: "EU-ADHES", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ruth Adeyemi", email: "ruth.adeyemi@example.com", role_category: "SALES" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/training-curricula"
              payload: { code: "AT-SALES-101", title: "Competitor Contact Rules for Sales", target_role_categories: ["SALES", "PRICING"], duration_minutes: 90, validity_days: 365, is_mandatory: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { cur_id: $.data.id }
            - call: "POST /compliance/training-assignments"
              payload: { employee_id: "${emp_id}", curriculum_id: "${cur_id}", due_at: "2026-08-31T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { ta_id: $.data.id }
            - call: "POST /compliance/training-assignments/${ta_id}/start"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/training-assignments/${ta_id}/completion"
              payload: { score: 91 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/trade-associations"
              payload: { name: "European Adhesives Council", approval_tier: "TIER_3_HIGH", competitor_density_pct: 100 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /compliance/trade-associations/${assoc_id}/approval"
              payload: { decision: "APPROVED" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/participations"
              payload: { business_unit_id: "${bu_id}", association_id: "${assoc_id}", employee_id: "${emp_id}", purpose: "Standards committee observer" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { part_id: $.data.id }
            - call: "POST /compliance/participations/${part_id}/submission"
              payload: {}
              as: BusinessLead
              as_user_id: "${bu_id}"
          trigger:
            - call: "POST /compliance/participations/${part_id}/legal-clearance"
              payload: { decision: "CLEARED", notes: "Observer only, no pricing agenda items" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          assert:
            - "AssociationParticipation.${part_id}.review_load_minutes == 110"
            - "AssociationParticipation.${part_id}.review_minutes_reserved == 110"
            - "AssociationParticipation.${part_id}.status == PARTIALLY_APPROVED"
            - "AssociationParticipation.${part_id}.legal_cleared == true"
            - "AssociationParticipation.${part_id}.business_justified == false"
            - "BusinessUnit.${bu_id}.review_minutes_consumed == 110"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: competitor_contact_remediation_revision_cycle
        grounds:
          - state_machines.CompetitorContact.UNDER_REVIEW_to_REMEDIATION_REQUIRED
          - state_machines.CompetitorContact.REMEDIATION_REQUIRED_to_UNDER_REVIEW
          - state_machines.CompetitorContact.UNDER_REVIEW_to_CLEARED
          - entities.CompetitorContact.fields.remediation_response
        distinguishing_aspect: |
          CYCLIC shape on CompetitorContact: UNDER_REVIEW -> REMEDIATION_REQUIRED
          -> UNDER_REVIEW is traversed twice before the contact is cleared, and
          the second round overwrites remediation_response — a purely linear
          pipeline would reject the second remediation-order.
        test_recipe:
          setup:
            - "BusinessUnit posture OPEN, exposure_points 0.00."
            - "A LEGAL-role employee with one CompetitorContact already moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "WRITTEN_FORMAL", topic_tags: ["STANDARDS"], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
            - call: "POST /compliance/competitor-contacts/${c_id}/review-opening"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/competitor-contacts/${c_id}/remediation-order"
              payload: { instructions: "Produce the full written thread and the distribution list" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/competitor-contacts/${c_id}/remediation-response"
              payload: { response: "Thread attached; distribution list pending" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/competitor-contacts/${c_id}/remediation-order"
              payload: { instructions: "Distribution list still missing - resubmit" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
