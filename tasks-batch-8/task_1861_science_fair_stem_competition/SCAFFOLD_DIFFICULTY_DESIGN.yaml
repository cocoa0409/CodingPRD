  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_ethics_decision
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): an ethics decision submitted
          by the project's OWN mentor on a plan that is still in SUBMITTED (not yet
          UNDER_REVIEW) violates both the state precondition (priority 4) and the
          segregation-of-duties rule (priority 5); the state error wins because
          priority 4 < priority 5.
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; project P (human subjects) with plan RP in SUBMITTED (never began review); reviewer id equals project mentor (SoD breach)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "PV Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "BME", name: "Biomed", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Same", email: "ms@x.com" }
              as: FairDirector
              captures: { ms: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "HS Study", team_size: 1, involves_human_subjects: true, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${ms}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/research-plans"
              payload: { project_id: "${p}", plan_text: "plan", risk_level: "LOW" }
              as: Mentor
              as_user_id: "${ms}"
              captures: { rp: $.data.id }
            - call: "POST /science-fair/research-plans/${rp}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${ms}"
          trigger:
            - call: "POST /science-fair/research-plans/${rp}/decisions"
              payload: { reviewer_mentor_id: "${ms}", decision: "APPROVE" }
              as: EthicsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats SoD priority 5, even though reviewer == project mentor would also violate SoD)"
            - "http status == 409"
      - name: business_temporal_vs_business_constraint_on_booth
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_CONSTRAINT_VIOLATION]
        distinguishing_aspect: |
          Different error-category pair (business_temporal vs business_constraint):
          a booth assignment whose window is inverted (start >= end, temporal rule,
          priority 6 route via ERR_INVALID_WINDOW declared on the endpoint) AND whose
          (hall, booth_number) is already taken (constraint rule, priority 7) must
          surface the temporal error first. Distinct category pairing from instance 1.
        test_recipe:
          setup:
            - "Edition REGISTRATION_CLOSED; projects PA (CONFIRMED, booth A/1 taken with valid window) and PB (CONFIRMED, no booth)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "PV2 Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor V", email: "mv@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PA", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { pa: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PB", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { pb: $.data.id }
            - call: "POST /science-fair/projects/${pa}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/projects/${pb}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${pa}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
          trigger:
            - call: "POST /science-fair/projects/${pb}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-10T00:00:00Z", inspection_window_end: "2026-08-01T00:00:00Z" }
              as: OperationsLead
