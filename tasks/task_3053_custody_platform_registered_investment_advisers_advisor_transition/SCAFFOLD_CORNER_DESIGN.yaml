            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "ALTERNATIVE_ASSETS", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_alt_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_alt_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/alternatives"
              payload: { account_id: "${acct_id}", asset_name: "Coastal Infrastructure Fund V", unit_count: 5, stated_value_cents: 20000000, valuation_floor_cents: 30000000, valuation_as_of_date: "2025-12-04T00:00:00Z" }
              as: AdvisorOperationsLead
              captures: { alt_stale_id: $.data.id }
          trigger:
            - call: "POST /ria/alternatives/${alt_stale_id}/submit-valuation"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/alternatives/${alt_stale_id}/accept-valuation"
              payload: {}
              as: ComplianceReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "AlternativeAssetHolding.${alt_stale_id}.valuation_age_days == 271 and stale_valuation == true"
            - "the acceptance is rejected at HTTP 422 with err_id == ERR_VALUATION_STALE"
            - "err_id != ERR_VALUATION_BELOW_FLOOR even though the stated value is also below the floor"
            - "AlternativeAssetHolding.${alt_stale_id}.accepted_value_cents is null and fee_basis_eligible == false"
            - "Household.${h_id}.household_fee_basis_cents == 0"

      - name: sod_violation_when_drafter_executes_own_agreement
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=18]
          - errors[ERR_SOD_VIOLATION]
          - state_machines.CustodyAgreement.PENDING_SIGNATURE_to_EXECUTED
        distinguishing_aspect: "The same X-User-ID that submitted the agreement cannot countersign it: the execution is rejected with ERR_SOD_VIOLATION, and only a different officer's id lets the agreement reach EXECUTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with one submitted agreement whose drafter is operator-lead-1."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
          trigger:
            - call: "POST /ria/firms/${f_id}/custody-agreements/execute"
              payload: {}
              as: CustodyOperationsOfficer
              as_user_id: "operator-lead-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /ria/firms/${f_id}/custody-agreements/execute"
              payload: {}
              as: CustodyOperationsOfficer
              as_user_id: "custody-officer-7"
          assert:
            - "the first execution is rejected at HTTP 403 with err_id == ERR_SOD_VIOLATION"
            - "CustodyAgreement.${agr_draft_id}.agreement_status is still PENDING_SIGNATURE after the rejection"
            - "AdvisorFirm.${f_id}.firm_posture is still SUSPENDED"
            - "the second execution from a different user id succeeds and CustodyAgreement.${agr_draft_id}.agreement_status == EXECUTED"
            - "CustodyAgreement.${agr_draft_id}.executed_by_user_id == \"custody-officer-7\" and differs from drafted_by_user_id"

      - name: listing_cooldown_absent_until_a_first_listing_exists
        claim_type: Conditional validation
        grounds:
          - validations[priority=43]
          - state_machines.HouseholdAccount.OPEN_to_OPEN
        distinguishing_aspect: "The cooldown guard is conditional on a prior occupation: an account that has never been listed has last_listed_at null and can be listed immediately, while the second listing inside the hour is refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted TRADING_AUTHORIZATION, one OPEN account that has never been listed."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
