# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Auto Dealership Management (DMS) — EXPERT
# 9 Difficulty Rules x >=2 instances = 18 instances.
# All formula-derived asserts are pinned to literals computed from §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_payment_estimate_vs_final
        grounds:
          - calculations.monthly_payment
          - entities.Deal.fields.estimated_payment_cents
          - entities.FinanceContract.fields.monthly_payment_cents
          - state_machines.Deal.DRAFT_to_DESKING
          - state_machines.Deal.APPROVED_to_CONTRACTED
        distinguishing_aspect: |
          Same amount_financed (3291882 cents) yields a DIFFERENT monthly payment under the ESTIMATE
          variant (rate 699 bps / 72 mo -> Deal.estimated_payment_cents == 56108) versus the FINAL
          variant (sell 749 bps / 72 mo -> FinanceContract.monthly_payment_cents == 56901); the entity
          domain differs (Deal desking estimate vs FinanceContract final).
        test_recipe:
          setup:
            - "Vehicle V1 AVAILABLE (list_price 3200000), floored on FloorPlanLine principal 3000000."
            - "Customer C1 credit_tier TIER_A, drivers_license_valid true."
            - "LenderProgram LP_A tier TIER_A buy 549, max_markup 200, max_ltv 12500, max_pti 1800, max_term 72, active."
            - "Deal D1 FINANCE: sale 3200000, accessories 129500, doc_fee 59900, title_fee 7500, registration_fee 35000, tax_rate 725, cash_down 200000."
            - "Trade attached: allowance 900000, payoff 600000 (equity 300000). Incentive rebate 150000 applied. Two products: VSC sold 240000 (cost 180000), GAP sold 89500 (cost 50000). Deal desked to DESKING then APPROVED with an ACTIVE FinanceContract (markup 200, term 72)."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000001", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 3300000, list_price_cents: 3200000 }
              as: InventoryClerk
              captures: { v1_id: $.data.id }
            - call: "POST /vehicles/${v1_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 3000000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v1_ver0}" }
              as: InventoryClerk
              captures: { fp1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C One", email: "c1@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c1_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_a_id: $.data.id }
            - call: "POST /oem-incentives"
              payload: { program_code: "CASH1500", rebate_cents: 150000, eligible_condition: "ANY", eligible_make: null, min_model_year: null, stackable_with_finance: true, active: true }
              as: SalesManager
              captures: { inc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "VSC", name: "Vehicle Service Contract", cost_cents: 180000, max_retail_cents: 300000, taxable: false }
              as: FinanceManager
              captures: { fp_vsc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "GAP", name: "GAP Insurance", cost_cents: 50000, max_retail_cents: 120000, taxable: false }
              as: FinanceManager
              captures: { fp_gap_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v1_id}", customer_id: "${c1_id}", deal_type: "FINANCE", sale_price_cents: 3200000, accessories_cents: 129500, doc_fee_cents: 59900, title_fee_cents: 7500, registration_fee_cents: 35000, tax_rate_bps: 725, cash_down_cents: 200000 }
              as: SalesManager
              captures: { d1_id: $.data.id }
            - call: "POST /deals/${d1_id}/trade-ins"
              payload: { vin: "2HGAC1ANCM1000099", acv_cents: 900000, allowance_cents: 900000, payoff_cents: 600000 }
              as: SalesManager
            - call: "POST /deals/${d1_id}/apply-incentive"
              payload: { oem_incentive_id: "${inc_id}" }
              as: SalesManager
            - call: "POST /deals/${d1_id}/products"
              payload: { finance_product_id: "${fp_vsc_id}", sold_price_cents: 240000 }
              as: FinanceManager
            - call: "POST /deals/${d1_id}/products"
              payload: { finance_product_id: "${fp_gap_id}", sold_price_cents: 89500 }
              as: FinanceManager
            - call: "POST /deals/${d1_id}/desk"
              payload: {}
              as: SalesManager
              captures: { d1_est_payment: $.data.estimated_payment_cents }
            - call: "POST /deals/${d1_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://jacket/d1/creditapp.pdf" }
              as: SalesManager
            - call: "POST /deals/${d1_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d1_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_a_id}" }
              as: FinanceManager
              captures: { d1_ver_appr: $.data.version }
          trigger:
            - call: "POST /deals/${d1_id}/finance-contracts"
              payload: { lender_program_id: "${lp_a_id}", markup_bps: 200, term_months: 72, expected_deal_version: "${d1_ver_appr}" }
              as: FinanceManager
              captures: { fc1_payment: $.data.monthly_payment_cents }
          assert:
            - "Deal.${d1_id}.estimated_payment_cents == 56108"
            - "FinanceContract.${fc1_id}.monthly_payment_cents == 56901"
            - "FinanceContract.${fc1_id}.monthly_payment_cents != Deal.${d1_id}.estimated_payment_cents"

      - name: dual_variant_floor_plan_payoff_estimate_vs_actual
        grounds:
          - calculations.floor_plan_payoff
          - entities.FloorPlanLine.fields.principal_outstanding_cents
          - endpoints.POST_/floor-plan-lines/{id}/payoff-quote
        distinguishing_aspect: |
          The SAME FloorPlanLine (principal_outstanding 3000000, rate 825 bps) produces a DIFFERENT
          payoff under the forward-looking ESTIMATE as-of date (19 days -> interest 13063, payoff 3013063)
          versus the chronological ACTUAL as-of date (24 days -> interest 16500, payoff 3016500); the
          entity domain (FloorPlanLine) differs from the dual_variant_payment instance (Deal/FinanceContract).
        test_recipe:
          setup:
            - "Vehicle V2 AVAILABLE; floored 2026-05-01 on FloorPlanLine principal 3000000 at 825 bps."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "3HGAC1ANCM1000002", condition: "NEW", make: "ACME", model: "SUV", model_year: 2026, msrp_cents: 4000000, list_price_cents: 3800000 }
              as: InventoryClerk
              captures: { v2_id: $.data.id }
            - call: "POST /vehicles/${v2_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 3000000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v2_ver0}" }
              as: InventoryClerk
              captures: { fp2_id: $.data.id }
          trigger:
            - call: "POST /floor-plan-lines/${fp2_id}/payoff-quote"
              payload: { as_of_date: "2026-05-20T00:00:00.000Z" }
              as: FinanceManager
              captures: { est_payoff: $.data.payoff_cents }
            - call: "POST /floor-plan-lines/${fp2_id}/payoff-quote"
              payload: { as_of_date: "2026-05-25T00:00:00.000Z" }
              as: FinanceManager
              captures: { act_payoff: $.data.payoff_cents }
          assert:
            - "payoff-quote as_of 2026-05-20 returns interest_cents == 13063 and payoff_cents == 3013063 (ESTIMATE, 19 days)"
            - "payoff-quote as_of 2026-05-25 returns interest_cents == 16500 and payoff_cents == 3016500 (ACTUAL, 24 days)"
            - "${est_payoff} != ${act_payoff}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_amount_financed_multi_input_nonlinear
        grounds:
          - calculations.amount_financed
          - calculations.deal_tax
          - entities.Deal.fields.amount_financed_cents
          - entities.Deal.fields.trade_equity_cents
        distinguishing_aspect: |
          MODE (a): amount_financed combines >=7 inputs with non-linear interaction — sale_price,
          accessories, doc_fee, title_fee, registration_fee, computed total_tax (itself a max(0, sale-allowance)
          branch), F&I products sum, minus rebate + trade_equity + cash_down. With the D1 inputs the result
          is exactly 3291882 cents; changing any single input shifts the result.
        test_recipe:
          setup:
            - "Reuse the D1 desked deal (same inputs as dual_variant_payment_estimate_vs_final)."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000011", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 3300000, list_price_cents: 3200000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Two", email: "c2@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /oem-incentives"
              payload: { program_code: "CASH1500B", rebate_cents: 150000, eligible_condition: "ANY", eligible_make: null, min_model_year: null, stackable_with_finance: true, active: true }
              as: SalesManager
              captures: { inc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "VSC2", name: "VSC", cost_cents: 180000, max_retail_cents: 300000, taxable: false }
              as: FinanceManager
              captures: { fp_vsc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "GAP2", name: "GAP", cost_cents: 50000, max_retail_cents: 120000, taxable: false }
              as: FinanceManager
              captures: { fp_gap_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 3200000, accessories_cents: 129500, doc_fee_cents: 59900, title_fee_cents: 7500, registration_fee_cents: 35000, tax_rate_bps: 725, cash_down_cents: 200000 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/trade-ins"
              payload: { vin: "2HGAC1ANCM1000098", acv_cents: 900000, allowance_cents: 900000, payoff_cents: 600000 }
              as: SalesManager
            - call: "POST /deals/${d_id}/apply-incentive"
              payload: { oem_incentive_id: "${inc_id}" }
              as: SalesManager
            - call: "POST /deals/${d_id}/products"
              payload: { finance_product_id: "${fp_vsc_id}", sold_price_cents: 240000 }
              as: FinanceManager
            - call: "POST /deals/${d_id}/products"
              payload: { finance_product_id: "${fp_gap_id}", sold_price_cents: 89500 }
              as: FinanceManager
          trigger:
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
              captures: { af: $.data.amount_financed_cents, tax: $.data.total_tax_cents, te: $.data.trade_equity_cents }
          assert:
            - "Deal.${d_id}.total_tax_cents == 180482"
            - "Deal.${d_id}.trade_equity_cents == 300000"
            - "Deal.${d_id}.fi_products_total_cents == 329500"
            - "Deal.${d_id}.amount_financed_cents == 3291882"

      - name: combinatorial_deal_tax_round_per_line_then_sum
        grounds:
          - calculations.deal_tax
          - entities.Deal.fields.total_tax_cents
          - state_machines.Deal.DRAFT_to_DESKING
        distinguishing_aspect: |
          MODE (b): rounding order is pinned to round-per-line-then-sum. Taxable lines sale 1899500,
          accessories 129500, doc_fee 59900 at 725 bps give per-line {137714, 9389, 4343} summing to
          151446 cents; the sum-then-round alternative would give 151445. The pinned order yields 151446.
        test_recipe:
          setup:
            - "Vehicle VR AVAILABLE list_price 2200000; Deal DR FINANCE sale 1899500, accessories 129500, doc_fee 59900, title 7500, reg 35000, tax 725, no trade/rebate/down."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "5HGAC1ANCM1000005", condition: "USED", make: "ACME", model: "CPE", model_year: 2024, msrp_cents: 2400000, list_price_cents: 2200000 }
              as: InventoryClerk
              captures: { vr_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C R", email: "cr@x.com", monthly_income_cents: 1800000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { cr_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${vr_id}", customer_id: "${cr_id}", deal_type: "FINANCE", sale_price_cents: 1899500, accessories_cents: 129500, doc_fee_cents: 59900, title_fee_cents: 7500, registration_fee_cents: 35000, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /deals/${dr_id}/desk"
              payload: {}
              as: SalesManager
              captures: { dr_tax: $.data.total_tax_cents, dr_af: $.data.amount_financed_cents }
          assert:
            - "Deal.${dr_id}.total_tax_cents == 151446"
            - "Deal.${dr_id}.amount_financed_cents == 2282846"

      - name: combinatorial_finance_reserve_pinned_eval_order
        grounds:
          - calculations.finance_reserve
          - entities.FinanceContract.fields.finance_reserve_cents
          - entities.FinanceContract.fields.sell_rate_bps
        distinguishing_aspect: |
          MODE (c): finance_reserve has a pinned evaluation order — (1) effective_markup = min(markup, max_markup),
          (2) reserve_rate keyed on whether effective_markup <= MARKUP_TIER_BPS(150), (3) reserve = round(amount_financed*rate).
          For D1 (markup 200, capped at max_markup 200, > 150 -> HIGH 0.02, amount_financed 3291882) reserve == 65838;
          sell_rate_bps == 749 (buy 549 + markup 200).
        test_recipe:
          setup:
            - "Reuse the D1 APPROVED deal; create its FinanceContract with markup 200, term 72."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000021", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 3300000, list_price_cents: 3200000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Three", email: "c3@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /oem-incentives"
              payload: { program_code: "CASH1500C", rebate_cents: 150000, eligible_condition: "ANY", eligible_make: null, min_model_year: null, stackable_with_finance: true, active: true }
              as: SalesManager
              captures: { inc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "VSC3", name: "VSC", cost_cents: 180000, max_retail_cents: 300000, taxable: false }
              as: FinanceManager
              captures: { fp_vsc_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "GAP3", name: "GAP", cost_cents: 50000, max_retail_cents: 120000, taxable: false }
              as: FinanceManager
              captures: { fp_gap_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 3200000, accessories_cents: 129500, doc_fee_cents: 59900, title_fee_cents: 7500, registration_fee_cents: 35000, tax_rate_bps: 725, cash_down_cents: 200000 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/trade-ins"
              payload: { vin: "2HGAC1ANCM1000097", acv_cents: 900000, allowance_cents: 900000, payoff_cents: 600000 }
              as: SalesManager
            - call: "POST /deals/${d_id}/apply-incentive"
              payload: { oem_incentive_id: "${inc_id}" }
              as: SalesManager
            - call: "POST /deals/${d_id}/products"
              payload: { finance_product_id: "${fp_vsc_id}", sold_price_cents: 240000 }
              as: FinanceManager
            - call: "POST /deals/${d_id}/products"
              payload: { finance_product_id: "${fp_gap_id}", sold_price_cents: 89500 }
              as: FinanceManager
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://jacket/d/creditapp.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { d_ver: $.data.version }
          trigger:
            - call: "POST /deals/${d_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 200, term_months: 72, expected_deal_version: "${d_ver}" }
              as: FinanceManager
              captures: { reserve: $.data.finance_reserve_cents, sell: $.data.sell_rate_bps }
          assert:
            - "FinanceContract.${fc_id}.sell_rate_bps == 749"
            - "FinanceContract.${fc_id}.finance_reserve_cents == 65838"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_deal_cyclic_rehash_loop
        grounds:
          - state_machines.Deal.SUBMITTED_TO_LENDER_to_DESKING
          - state_machines.Deal.APPROVED_to_DESKING
          - state_machines.Deal.DESKING_to_DESKING
        distinguishing_aspect: |
          The Deal machine is CYCLIC: APPROVED -> DESKING (re-desk) returns an already-approved deal to
          negotiation, clearing approved_lender_program_id and SUPERSEDING the ACTIVE FinanceContract;
          the deal can then re-traverse DESKING -> SUBMITTED_TO_LENDER -> APPROVED. Entity: Deal.
        test_recipe:
          setup:
            - "D APPROVED with an ACTIVE FinanceContract (same build as combinatorial_finance_reserve_pinned_eval_order)."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000031", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 3300000, list_price_cents: 3200000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Four", email: "c4@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 3200000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://jacket/d/creditapp.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { d_ver_appr: $.data.version }
            - call: "POST /deals/${d_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 200, term_months: 72, expected_deal_version: "${d_ver_appr}" }
              as: FinanceManager
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
              captures: { d_status: $.data.status, d_appr: $.data.approved_lender_program_id }
          assert:
            - "Deal.${d_id}.status == DESKING"
            - "Deal.${d_id}.approved_lender_program_id == null"
            - "FinanceContract.${fc_id}.status == SUPERSEDED"

      - name: nonlinear_title_registration_reject_resubmit_cycle
        grounds:
          - state_machines.TitleRegistration.SUBMITTED_to_REJECTED
          - state_machines.TitleRegistration.REJECTED_to_SUBMITTED
          - entities.TitleRegistration.fields.resubmit_count
        distinguishing_aspect: |
          The TitleRegistration machine has a branching-revert CYCLE: SUBMITTED -> REJECTED -> SUBMITTED,
          incrementing resubmit_count and clearing rejection_reason on each loop. Entity: TitleRegistration
          (different entity from the Deal cyclic machine).
        test_recipe:
          setup:
            - "A FUNDED deal DF with its auto-created TitleRegistration (PENDING), ODOMETER doc present, submitted once and DMV-rejected."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000041", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver_create: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver_create}" }
              as: InventoryClerk
            - call: "POST /customers"
              payload: { full_name: "C Five", email: "c5@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
