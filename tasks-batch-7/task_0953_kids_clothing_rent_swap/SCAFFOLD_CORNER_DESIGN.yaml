      - name: corner_ep_box_items_filtered_by_settlement_status
        claim_type: Listing
        grounds: ["endpoints.GET_/kidswear/box-items", "entities.BoxItem.fields.settlement_status"]
        distinguishing_aspect: "Filtering box items by settlement_status OPEN returns the two allocated slots, while filtering by BOUGHT_OUT returns total_count 0 — proving the money axis is queryable independently of the fulfillment axis."
        test_recipe:
          setup: ["A 2-slot plan; one ACTIVE member with an OPEN cycle whose box holds two allocated items."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { e6_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${e6_plan}", email: "e6@kidswear.test", display_name: "Filter Items", child_size_code: "5" }
              as: PlatformAdmin
              captures: { e6_m: $.data.id }
            - call: "POST /kidswear/members/${e6_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-E6-5", name: "Filter Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { e6_st: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${e6_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { e6_u1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${e6_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { e6_u2: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${e6_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { e6_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${e6_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${e6_cyc}" }
              as: WarehouseOperator
              captures: { e6_box: $.data.id }
            - call: "POST /kidswear/boxes/${e6_box}/allocate"
              payload: { unit_id: "${e6_u1}" }
              as: WarehouseOperator
              captures: { e6_bi1: $.data.id }
            - call: "POST /kidswear/boxes/${e6_box}/allocate"
              payload: { unit_id: "${e6_u2}" }
