  - { method: POST, path: "/central-casting/bump-adjustments", description: "Claim a bump (wardrobe/props/special ability) against a voucher (voucher not SUBMITTED|PAID)", roles: [CastingAssociate], code: 201, input: [voucher_id, category, amount_cents, "justification?"], output: BumpAdjustment, side_effects: ["status PENDING; requested_by_user_id from header"] }
  - { method: GET, path: "/central-casting/bump-adjustments", description: "List bump adjustments", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "voucher_id?", "status?"], output: "BumpAdjustment[]", side_effects: [] }
  - { method: GET, path: "/central-casting/bump-adjustments/{id}", description: "Get bump adjustment", roles: *ALL_ROLES, code: 200, input: [], output: BumpAdjustment, side_effects: [] }
