      - name: automatic_transitions_fire_without_a_client_call
        claim_type: Initial State
        grounds:
          - state_machines.CatalogItem
          - state_machines.DistributionCenter
          - state_machines.Shipment
          - entities.CatalogItem.fields.curation_review_state
        distinguishing_aspect: "Three entities enter their machines automatically rather than through an action endpoint: a new CatalogItem is UNREVIEWED, a new DistributionCenter is OPEN and a new Shipment is STAGED — none of those three initial states is a client-supplied input, and each is observable on the creation response."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "IN-1001", description: "Initial state probe", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
