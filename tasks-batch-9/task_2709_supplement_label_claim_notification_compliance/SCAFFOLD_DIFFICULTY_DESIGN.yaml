  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_error_outranks_missing_accepted_dossier
        grounds:
          - validations[priority=14]
          - validations[priority=34]
          - state_machines.StructureFunctionClaim.UNDER_SUBSTANTIATION_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Category pair STATE (priority 14, ERR_CLAIM_STATE_INVALID) versus
          BUSINESS_REFERENTIAL (priority 34, ERR_DOSSIER_NOT_ACCEPTED): a DRAFT claim with
          no dossier at all violates both on one approve call, and the lower-numbered state
          check must win.
        test_recipe:
          setup:
            - "One GRANDFATHERED ingredient and one DRAFT product."
            - "One claim in substantiation_status DRAFT that has never been submitted and owns no SubstantiationDossier of any status."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "C-500", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/claims"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", claim_text: "Supports immune function", claim_type: "STRUCTURE_FUNCTION" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/claims/${claim_id}/approve"
              payload: {}
              as: ClaimApprovalOfficer
              as_user_id: "u_cao_01"
              captures: { err: $.data.error_id }
          assert:
            - "the approve call returns HTTP 409 with error_id == ERR_CLAIM_STATE_INVALID"
            - "error_id is NOT ERR_DOSSIER_NOT_ACCEPTED even though the claim has no ACCEPTED dossier"
            - "StructureFunctionClaim.${claim_id}.substantiation_status is still DRAFT with approved_by_user_id == null and approved_at == null"
            - "Product.${prod_id}.active_claim_count == 0"
      - name: mandatory_warning_error_outranks_panel_line_budget
        grounds:
          - validations[priority=21]
          - validations[priority=23]
          - calculations.required_warning_codes
          - calculations.panel_line_budget
          - entities.Ingredient.fields.allergen_code
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY (priority 21, ERR_MANDATORY_WARNING_MISSING) versus
          BUSINESS_CONSTRAINT (priority 23, ERR_PANEL_LINE_BUDGET_EXCEEDED) — a different
          pair of categories from the state/referential instance. A LINEAR panel needing 11
          printed lines against an allowance of 8 AND omitting the soybean allergen warning
          must report the safety violation; only after the warning is added does the budget
          error surface, proving the ordering rather than assuming it.
        test_recipe:
          setup:
            - "Three GRANDFATHERED ingredients: a soy botanical with allergen_code SOYBEAN and no rdi_mg, a ginkgo botanical with contraindication_code ANTICOAGULANT and rdi_mg 120, and ascorbic acid with rdi_mg 90."
            - "One DRAFT product (net_quantity_g 60, servings_per_container 30) with all three lines ACTIVE."
            - "One DRAFT panel with panel_format LINEAR (allowance fixed at 8 lines) whose declared_warning_codes omit ALLERGEN_SOYBEAN, and whose serving statement and serving count are both valid so no earlier check fires."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Soy Isoflavones", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 80, allergen_code: "SOYBEAN" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
