            - call: "POST /program-sessions"
              payload: { offering_id: "${off_id}", room_id: "${room_a_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_end_utc: "2026-08-05T12:55:00Z", forecast_attendance: 3, direct_supply_cost_cents: 23522 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /program-sessions"
              payload: { offering_id: "${off_id}", room_id: "${room_a_id}", scheduled_start_utc: "2026-08-12T12:00:00Z", scheduled_end_utc: "2026-08-12T12:55:00Z", forecast_attendance: 3, direct_supply_cost_cents: 0 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /program-sessions"
