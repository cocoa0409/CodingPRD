              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd1}/reporting-periods/${period_xd1}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_xd1: $.data.id }
            - call: "POST /banks/${bank_xd1}/reporting-periods/${period_xd1}/call-reports/${report_xd1}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd1}/reporting-periods/${period_xd1}/call-reports/${report_xd1}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_xd1}/reporting-periods/${period_xd1}/call-reports/${report_xd1}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_xd1}/stress-scenarios"
              payload: { scenario_code: "BASE-XD1", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_xd1: $.data.id }
            - call: "POST /banks/${bank_xd1}/stress-scenarios/${scen_xd1}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd1}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_xd1}", stress_scenario_id: "${scen_xd1}" }
              as: CapitalAnalyst
              captures: { plan_xd1: $.data.id }
            - call: "POST /banks/${bank_xd1}/capital-plans/${plan_xd1}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_xd1}/distribution-requests"
              payload: { capital_plan_id: "${plan_xd1}", reporting_period_id: "${period_xd1}", distribution_kind: "DIVIDEND", distribution_amount_cents: 50000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
