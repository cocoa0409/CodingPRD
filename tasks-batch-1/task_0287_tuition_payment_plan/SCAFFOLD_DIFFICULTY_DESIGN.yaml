  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: overdue_triggers_late_fee_then_hold_then_student_flag
        grounds:
          - state_machines.Installment.SCHEDULED_to_OVERDUE
          - calculations.late_fee_assessment
          - calculations.delinquency_evaluation
          - entities.Student.fields.has_active_hold
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: run-delinquency drives
          Installment SCHEDULED->OVERDUE (hop 1) -> that OVERDUE installment
          causes delinquency_evaluation to create a Hold (hop 2) -> the new
          ACTIVE Hold causes Student.has_active_hold to flip true (hop 3). Each
          link is caused by the previous, not by the original sweep directly.
        test_recipe:
          setup:
            - "Institution INST_G clock 2026-09-15; Term FALL2026; Student S7; Template 4PAY."
            - "Enrollment ACTIVE charges 500000 aid 100000 -> [80000 x4]; down 80000 SETTLED; clock 2026-10-28 so installments 1,2 OVERDUE (total 160000 >= 150000)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst G", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_g: $.data.id }
            - call: "POST /institutions/${inst_g}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_g}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_g: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_g}", external_ref: "S7", full_name: "Stu Seven", email: "s7@x.edu" }
              as: Registrar
              captures: { stu_7: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_g}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_g: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_7}", term_id: "${term_g}", plan_template_id: "${tpl_g}" }
              as: Registrar
              captures: { enr_7: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_7}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${enr_7}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_7}"
              as: Registrar
              captures: { enr7_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_7}/activate"
              payload: { expected_enrollment_version: "${enr7_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_7}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { pay_d7: $.data.id }
            - call: "POST /institutions/payments/${pay_d7}/settle"
              as: Bursar
            - call: "POST /institutions/${inst_g}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-28T00:00:00.000Z" }
              as: Registrar
          trigger:
            - call: "POST /institutions/enrollments/${enr_7}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/students/${stu_7}"
              as: Registrar
              captures: { s7_hold: $.data.has_active_hold }
          assert:
            - "Enrollment.${enr_7}.delinquent_installment_count == 2"
            - "A LateFee ASSESSED exists for enrollment ${enr_7} (hop 1 effect)"
            - "A Hold ACTIVE exists for enrollment ${enr_7} with reason == DELINQUENCY_AMOUNT (hop 2 effect)"
            - "Student.${stu_7}.has_active_hold == true (hop 3 effect)"

      - name: withdraw_cancels_installments_then_releases_hold_then_flag
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - calculations.delinquency_evaluation
          - entities.Hold.fields.status
          - entities.Student.fields.has_active_hold
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (withdraw, not run-delinquency):
          withdraw cancels remaining SCHEDULED/OVERDUE installments (hop 1) ->
          delinquent_installment_count drops to 0 so delinquency_evaluation
          releases the enrollment's ACTIVE Hold (hop 2) -> Hold RELEASED causes
          Student.has_active_hold to recompute to false (hop 3).
        test_recipe:
          setup:
            - "Continue from a delinquent-hold state: Institution INST_H clock 2026-09-15; Term FALL2026; Student S8; Template 4PAY."
            - "Enrollment ACTIVE charges 500000 aid 100000; down 80000 SETTLED; clock 2026-10-28; run-delinquency -> installments 1,2 OVERDUE, Hold ACTIVE (AMOUNT), has_active_hold true."
          setup_api_calls:
