# =============================================================================
# task_0817_weights_measures_device — §1.8 Scaffold Difficulty Design
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_full_year_vs_prorated_registration
        grounds:
          - calculations.registration_fee
          - entities.FeeInvoice.fields.amount_due_cents
          - entities.FeeInvoice.fields.proration_applied
        distinguishing_aspect: "A SCALE registered in July (Q3) yields amount_due_cents 6000 under the PRORATED rule (0.50 factor) versus 12000 under the naive FULL_YEAR variant — divergence proves the quarter factor is applied on the FeeInvoice domain."
        test_recipe:
          setup:
            - "Empty DB; logical clock advanced to 2026-07-01 (Q3); one establishment; one SCALE device registered under that clock so its FeeInvoice is prorated."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Q3 Store", jurisdiction: "CA-01" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-Q3", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
          trigger:
            - { call: "GET /fee-invoices?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { fee_amt: "$.data[0].amount_due_cents", fee_prorated: "$.data[0].proration_applied" } }
          assert:
            - "FeeInvoice for device ${dev_id}: amount_due_cents == 6000"
            - "FeeInvoice for device ${dev_id}: proration_applied == true"
            - "The FULL_YEAR variant would have been 12000; PRORATED 0.50 factor yields 6000"

      - name: accuracy_acceptance_vs_maintenance_tolerance
        grounds:
          - calculations.accuracy_tolerance
          - state_machines.Device.REGISTERED_to_SEALED
          - state_machines.Device.REGISTERED_to_CONDEMNED
        distinguishing_aspect: "An identical reading (applied_load 3000, indicated_value 3004, error 4g) PASSES on an in-service SEALED device (MAINTENANCE tol 6) but FAILS on a REGISTERED device (ACCEPTANCE tol 3) — dual variant on the Device domain, distinct from the FeeInvoice fee variant."
        test_recipe:
          setup:
            - "Device A first passes a clean accuracy test (error 0) to reach SEALED; device B stays REGISTERED. Both then get an identical 4g-error reading recorded on an in-progress inspection."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Tol Store", jurisdiction: "CA-02" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ivy P", badge_number: "BADGE-1" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-A", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devA_id: "$.data.id", devA_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devA_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z", expected_device_version: "${devA_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { insA1_id: "$.data.id" } }
            - { call: "POST /inspections/${insA1_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insA1_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insA1_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /devices/${devA_id}", payload: {}, as: ProgramAdmin, captures: { devA_v1: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devA_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T10:00:00Z", expected_device_version: "${devA_v1}" }, as: Inspector, as_user_id: "${insp_id}", captures: { insA2_id: "$.data.id" } }
            - { call: "POST /inspections/${insA2_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insA2_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-B", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devB_id: "$.data.id", devB_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devB_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-04T09:00:00Z", scheduled_end: "2026-03-04T10:00:00Z", expected_device_version: "${devB_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { insB1_id: "$.data.id" } }
            - { call: "POST /inspections/${insB1_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insB1_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${insA2_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { a2_outcome: "$.data.outcome" } }
            - { call: "POST /inspections/${insB1_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { b1_outcome: "$.data.outcome" } }
          assert:
            - "Inspection.${insA2_id}.outcome == PASS"
            - "Device.${devA_id}.status == SEALED"
            - "Inspection.${insB1_id}.outcome == FAIL"
            - "Device.${devB_id}.status == CONDEMNED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: accuracy_tiered_tolerance_mode_a
        grounds:
          - calculations.accuracy_tolerance
          - entities.Device.fields.device_class
          - entities.TestReading.fields.applied_load
        distinguishing_aspect: "Mode (a): applicable tolerance is a non-linear function of >=3 inputs — device_class (branch), applied_load (tiered selection), and status-driven variant — so tolerance at load 3000 CLASS_III is 3g whereas at load 8000 it is 12g on the same device_class."
        test_recipe:
          setup:
            - "A REGISTERED CLASS_III device receives a reading at load 8000 with error exactly 12g (tier 5000<load<=20000 -> maintenance 12, but device REGISTERED -> acceptance 6), so error 12 > acceptance 6 -> FAIL; contrast with load 3000 tier."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Tier Store", jurisdiction: "CA-03" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Tim T", badge_number: "BADGE-2" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-T", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 8000, indicated_value: 8012 }, as: Inspector, as_user_id: "${insp_id}", captures: { rd_err: "$.data.error_grams" } }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { outcome: "$.data.outcome" } }
          assert:
            - "TestReading.error_grams == 12"
            - "Inspection.${ins_id}.outcome == FAIL"
            - "Device.${dev_id}.status == CONDEMNED"
            - "Acceptance tolerance at load 8000 CLASS_III is 6 (maintenance 12 / 2); 12 > 6 so FAIL"

      - name: price_penalty_per_item_rounding_mode_b
        grounds:
          - calculations.penalty_amount
          - calculations.scanner_audit_evaluation
          - entities.Penalty.fields.amount_cents
        distinguishing_aspect: "Mode (b): per-item-then-sum rounding is authoritative — overcharges [33,47,20] give round(49.5)+round(70.5)+round(30)=50+71+30=151, not the sum-then-round 150; the pinned order changes the penalty by 1 cent."
        test_recipe:
          setup:
            - "A REGISTERED SCANNER device gets a PRICE_VERIFICATION inspection with 3 mismatched audit items (overcharges 33, 47, 20 cents); error_count 3 > MAX_ERRORS 2 -> FAIL; establishment has no prior condemnations so multiplier 1.0."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Scan Store", jurisdiction: "CA-04" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Pat V", badge_number: "BADGE-3" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCANNER", serial_number: "SN-SC" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "PRICE_VERIFICATION", scheduled_start: "2026-03-06T09:00:00Z", scheduled_end: "2026-03-06T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/audit-items", payload: { item_sku: "SKU1", posted_price_cents: 100, scanned_price_cents: 133 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/audit-items", payload: { item_sku: "SKU2", posted_price_cents: 200, scanned_price_cents: 247 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/audit-items", payload: { item_sku: "SKU3", posted_price_cents: 500, scanned_price_cents: 520 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { outcome: "$.data.outcome" } }
            - { call: "GET /penalties?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { pen_amt: "$.data[0].amount_cents", pen_type: "$.data[0].violation_type" } }
          assert:
            - "Inspection.${ins_id}.outcome == FAIL"
            - "Penalty for device ${dev_id}: amount_cents == 151"
            - "Penalty for device ${dev_id}: violation_type == PRICE_ERROR"
            - "Sum-then-round alternative would give 150; per-item order gives 151"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: device_seal_condemn_reseal_cycle
        grounds:
          - state_machines.Device.SEALED_to_CONDEMNED
          - state_machines.Device.CONDEMNED_to_SEALED
          - state_machines.CondemnationOrder.ISSUED_to_LIFTED
        distinguishing_aspect: "Device is cyclic: SEALED -> CONDEMNED (fail) -> SEALED (passing re-test) on the same row, and the ISSUED CondemnationOrder flips to LIFTED when the device returns to SEALED."
        test_recipe:
          setup:
            - "Device sealed by a clean accuracy pass, then condemned by a failing maintenance test (error 8 > maintenance tol 6), then a re-test with error 0 recorded on an in-progress inspection is ready to finalize back to SEALED."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Cycle Store", jurisdiction: "CA-05" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Cy C", badge_number: "BADGE-4" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-CY", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-07T09:00:00Z", scheduled_end: "2026-03-07T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins1_id: "$.data.id" } }
            - { call: "POST /inspections/${ins1_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins1_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins1_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /devices/${dev_id}", payload: {}, as: ProgramAdmin, captures: { dev_v1: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-08T09:00:00Z", scheduled_end: "2026-03-08T10:00:00Z", expected_device_version: "${dev_v1}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins2_id: "$.data.id" } }
            - { call: "POST /inspections/${ins2_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins2_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3008 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins2_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /devices/${dev_id}", payload: {}, as: ProgramAdmin, captures: { dev_v2: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-09T09:00:00Z", scheduled_end: "2026-03-09T10:00:00Z", expected_device_version: "${dev_v2}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins3_id: "$.data.id" } }
            - { call: "POST /inspections/${ins3_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins3_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins3_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { outcome3: "$.data.outcome" } }
            - { call: "GET /condemnations?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { cond_status: "$.data[0].status" } }
          assert:
            - "Inspection.${ins3_id}.outcome == PASS"
            - "Device.${dev_id}.status == SEALED"
            - "CondemnationOrder for device ${dev_id}: status == LIFTED"

      - name: inspection_finalize_pass_fail_branch
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
        distinguishing_aspect: "The single POST /finalize trigger forks: a PASS inspection creates a Seal (no Penalty), while a FAIL inspection creates a CondemnationOrder + Penalty (no Seal) — disjoint side-effect sets on different entities from the same transition endpoint."
        test_recipe:
          setup:
            - "Two REGISTERED CLASS_III devices, each with an in-progress accuracy inspection: device P has a passing reading (error 0), device F a failing reading (error 5 > acceptance tol 3)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Fork Store", jurisdiction: "CA-06" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Fay F", badge_number: "BADGE-5" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-P", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devP_id: "$.data.id", devP_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devP_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-10T09:00:00Z", scheduled_end: "2026-03-10T10:00:00Z", expected_device_version: "${devP_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { insP_id: "$.data.id" } }
            - { call: "POST /inspections/${insP_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insP_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-F", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devF_id: "$.data.id", devF_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devF_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-11T09:00:00Z", scheduled_end: "2026-03-11T10:00:00Z", expected_device_version: "${devF_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { insF_id: "$.data.id" } }
            - { call: "POST /inspections/${insF_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${insF_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3005 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${insP_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { p_outcome: "$.data.outcome" } }
            - { call: "POST /inspections/${insF_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { f_outcome: "$.data.outcome" } }
            - { call: "GET /seals?device_id=${devP_id}", payload: {}, as: ProgramAdmin, captures: { p_seal_status: "$.data[0].status" } }
            - { call: "GET /penalties?device_id=${devF_id}", payload: {}, as: ProgramAdmin, captures: { f_pen_type: "$.data[0].violation_type" } }
          assert:
            - "Inspection.${insP_id}.status == PASSED and outcome == PASS; a Seal with status ACTIVE exists for device ${devP_id}; no Penalty for device ${devP_id}"
            - "Inspection.${insF_id}.status == FAILED and outcome == FAIL; a CondemnationOrder and a Penalty (violation_type OUT_OF_TOLERANCE) exist for device ${devF_id}; no Seal for device ${devF_id}"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fail_condemn_penalty_balance_depth3
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
          - state_machines.Device.REGISTERED_to_CONDEMNED
          - calculations.penalty_amount
          - calculations.establishment_balance
        distinguishing_aspect: "One finalize FAIL propagates 3 caused hops: Inspection FAILED -> Device CONDEMNED -> Penalty ASSESSED (5000) -> Establishment.balance_due_cents 12000 -> 17000; each hop is caused by the previous, not by the original call."
        test_recipe:
          setup:
            - "Clock at Q1 (2026-03-01 default) so a SCALE registration fee is 12000 (balance 12000, unpaid); an accuracy inspection is in progress with a failing reading (error 4 > acceptance 3)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Casc A Store", jurisdiction: "CA-07" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Al A", badge_number: "BADGE-6" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-CA", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-12T09:00:00Z", scheduled_end: "2026-03-12T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { outcome: "$.data.outcome" } }
            - { call: "GET /penalties?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { pen_amt: "$.data[0].amount_cents", pen_type: "$.data[0].violation_type" } }
            - { call: "GET /establishments/${est_id}", payload: {}, as: ProgramAdmin, captures: { bal: "$.data.balance_due_cents" } }
          assert:
            - "Inspection.${ins_id}.outcome == FAIL and Device.${dev_id}.status == CONDEMNED"
            - "A CondemnationOrder with status ISSUED exists for device ${dev_id}"
            - "Penalty for device ${dev_id}: violation_type == OUT_OF_TOLERANCE, amount_cents == 5000"
            - "Establishment.${est_id}.balance_due_cents == 17000"

      - name: suspend_out_of_service_void_seal_depth3
        grounds:
          - state_machines.Establishment.ACTIVE_to_SUSPENDED
          - state_machines.Device.SEALED_to_OUT_OF_SERVICE
          - state_machines.Seal.ACTIVE_to_VOIDED
          - calculations.sealed_device_count
        distinguishing_aspect: "A suspend call propagates 3 caused hops from a different trigger: Establishment SUSPENDED -> Device OUT_OF_SERVICE -> Seal VOIDED -> sealed_device_count 1 -> 0."
        test_recipe:
          setup:
            - "One SCALE device sealed by a clean accuracy pass (sealed_device_count 1, seal ACTIVE); its 12000 registration fee is unpaid so balance_due_cents 12000 (> 0) permits suspension."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Casc B Store", jurisdiction: "CA-08" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Bo B", badge_number: "BADGE-7" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-CB", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-13T09:00:00Z", scheduled_end: "2026-03-13T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /establishments/${est_id}/suspend", payload: { reason: "nonpayment" }, as: ProgramAdmin, captures: { est_status: "$.data.status", sealed_ct: "$.data.sealed_device_count" } }
            - { call: "GET /seals?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { seal_status: "$.data[0].status" } }
            - { call: "GET /devices/${dev_id}", payload: {}, as: ProgramAdmin, captures: { dev_status: "$.data.status" } }
          assert:
            - "Establishment.${est_id}.status == SUSPENDED"
            - "Device.${dev_id}.status == OUT_OF_SERVICE"
            - "Seal for device ${dev_id}: status == VOIDED"
            - "Establishment.${est_id}.sealed_device_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_schedule
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_DEVICE_NOT_TESTABLE]
        distinguishing_aspect: "A POST /inspections that violates BOTH state (device RETIRED, priority 6) and business_temporal (inspector overlap, priority 9) returns ERR_DEVICE_NOT_TESTABLE — the state error, not ERR_INSPECTOR_SCHEDULE_CONFLICT."
        test_recipe:
          setup:
            - "Inspector I already holds a SCHEDULED inspection on device Y for window [10:00,11:00); device X is RETIRED. The failing call targets device X with an overlapping window."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Conf1 Store", jurisdiction: "CA-09" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Cora C", badge_number: "BADGE-8" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-Y", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devY_id: "$.data.id", devY_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devY_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-14T10:00:00Z", scheduled_end: "2026-03-14T11:00:00Z", expected_device_version: "${devY_v0}" }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-X", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devX_id: "$.data.id" } }
            - { call: "POST /devices/${devX_id}/retire", payload: { reason: "scrapped" }, as: ProgramAdmin }
            - { call: "GET /devices/${devX_id}", payload: {}, as: ProgramAdmin, captures: { devX_v: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${devX_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-14T10:30:00Z", scheduled_end: "2026-03-14T11:30:00Z", expected_device_version: "${devX_v}" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_DEVICE_NOT_TESTABLE (state priority 6 outranks temporal priority 9)"

      - name: referential_beats_temporal_on_schedule
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_COMPLAINT_REQUIRED]
        distinguishing_aspect: "A POST /inspections that violates BOTH business_referential (COMPLAINT_RETEST with no complaint, priority 8) and business_temporal (device 60-min buffer, priority 10) returns ERR_COMPLAINT_REQUIRED — a different error-category pair (referential vs temporal) than the state/temporal conflict."
        test_recipe:
          setup:
            - "Device D holds a SCHEDULED accuracy inspection for window [10:00,11:00); the failing call schedules a COMPLAINT_RETEST (no complaint_id) with a window [11:30,12:30) only 30 min after (< 60 buffer)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Conf2 Store", jurisdiction: "CA-10" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Dan D", badge_number: "BADGE-9" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-D", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devD_id: "$.data.id", devD_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devD_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-15T10:00:00Z", scheduled_end: "2026-03-15T11:00:00Z", expected_device_version: "${devD_v0}" }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /devices/${devD_id}", payload: {}, as: ProgramAdmin, captures: { devD_v1: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${devD_id}", inspector_id: "${insp_id}", inspection_type: "COMPLAINT_RETEST", scheduled_start: "2026-03-15T11:30:00Z", scheduled_end: "2026-03-15T12:30:00Z", expected_device_version: "${devD_v1}" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_COMPLAINT_REQUIRED (referential priority 8 outranks temporal priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: accuracy_error_equals_tolerance_passes
        grounds:
          - calculations.accuracy_tolerance
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
        distinguishing_aspect: "At load 3000 CLASS_III REGISTERED (acceptance tol 3), an error of exactly 3g PASSES because the check is error <= tol (inclusive); an error of 4g would FAIL. Boundary reached through POST /inspections/{id}/finalize."
        test_recipe:
          setup:
            - "A REGISTERED CLASS_III device with an in-progress accuracy inspection carrying a reading of applied_load 3000, indicated_value 3003 (error exactly 3)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Bnd1 Store", jurisdiction: "CA-11" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ben B", badge_number: "BADGE-10" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-BND", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-16T09:00:00Z", scheduled_end: "2026-03-16T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3003 }, as: Inspector, as_user_id: "${insp_id}", captures: { err_g: "$.data.error_grams" } }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { outcome: "$.data.outcome" } }
          assert:
            - "TestReading.error_grams == 3"
            - "Inspection.${ins_id}.outcome == PASS"
            - "Device.${dev_id}.status == SEALED"

      - name: fee_quarter_boundary_april_first
        grounds:
          - calculations.registration_fee
          - entities.FeeInvoice.fields.amount_due_cents
        distinguishing_aspect: "A SCALE registered exactly at 2026-04-01T00:00:00Z (first instant of Q2, month 4) is prorated at factor 0.75 -> 9000; a registration one day earlier (Q1) would be 12000. Boundary reached through POST /devices, a different endpoint and metric than the accuracy boundary."
        test_recipe:
          setup:
            - "Clock set to 2026-04-01T00:00:00Z (Q2 start); one establishment; register a SCALE device."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Bnd2 Store", jurisdiction: "CA-12" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-APR", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
          trigger:
            - { call: "GET /fee-invoices?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { fee_amt: "$.data[0].amount_due_cents", fee_prorated: "$.data[0].proration_applied" } }
          assert:
            - "FeeInvoice for device ${dev_id}: amount_due_cents == 9000"
            - "FeeInvoice for device ${dev_id}: proration_applied == true"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: inspection_start_requires_testable_device
        grounds:
          - state_machines.Inspection.SCHEDULED_to_IN_PROGRESS
          - state_machines.Device.SEALED_to_RETIRED
          - errors[ERR_DEVICE_NOT_TESTABLE]
        distinguishing_aspect: "Inspection SCHEDULED->IN_PROGRESS depends on Device state (pair Inspection->Device): starting an inspection whose device was RETIRED after scheduling is rejected with ERR_DEVICE_NOT_TESTABLE."
        test_recipe:
          setup:
            - "A device has a SCHEDULED inspection, then the device is RETIRED (allowed because the inspection is not yet IN_PROGRESS)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Dep1 Store", jurisdiction: "CA-13" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Eve E", badge_number: "BADGE-11" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-DEP1", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-17T09:00:00Z", scheduled_end: "2026-03-17T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /devices/${dev_id}/retire", payload: { reason: "removed" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_DEVICE_NOT_TESTABLE"
            - "Inspection.${ins_id}.status remains SCHEDULED"

      - name: seal_requires_active_establishment
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - state_machines.Device.REGISTERED_to_SEALED
          - errors[ERR_ESTABLISHMENT_SUSPENDED]
        distinguishing_aspect: "Device REGISTERED->SEALED depends on Establishment state (pair Device->Establishment): a passing finalize on a device whose establishment is SUSPENDED is rejected with ERR_ESTABLISHMENT_SUSPENDED — a different entity pair than Inspection->Device."
        test_recipe:
          setup:
            - "A device has an in-progress accuracy inspection with a passing reading; its establishment is then SUSPENDED (balance 12000 from the unpaid registration fee permits suspension)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Dep2 Store", jurisdiction: "CA-14" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Fin F", badge_number: "BADGE-12" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-DEP2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-18T09:00:00Z", scheduled_end: "2026-03-18T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /establishments/${est_id}/suspend", payload: { reason: "nonpayment" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_ESTABLISHMENT_SUSPENDED"
            - "Device.${dev_id}.status remains REGISTERED (no seal created)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_window_overlap
        grounds:
          - validations[priority=9]
          - entities.Inspection.fields.scheduled_start
          - entities.Inspection.fields.scheduled_end
          - errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Inspector windows are half-open [start,end): a new window [11:00,12:00) adjacent to an existing [10:00,11:00) is ACCEPTED, but an overlapping [10:30,11:30) is rejected with ERR_INSPECTOR_SCHEDULE_CONFLICT — resource = Inspector, semantics = adjacency-allowed."
        test_recipe:
          setup:
            - "Inspector I has a SCHEDULED inspection on device1 for [10:00,11:00); device2 and device3 are REGISTERED and ready to schedule."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Ovl1 Store", jurisdiction: "CA-15" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Gus G", badge_number: "BADGE-13" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-O1", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev1_id: "$.data.id", dev1_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev1_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-19T10:00:00Z", scheduled_end: "2026-03-19T11:00:00Z", expected_device_version: "${dev1_v0}" }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-O2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev2_id: "$.data.id", dev2_v0: "$.data.version" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-O3", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev3_id: "$.data.id", dev3_v0: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${dev2_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-19T11:00:00Z", scheduled_end: "2026-03-19T12:00:00Z", expected_device_version: "${dev2_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ok_id: "$.data.id", ok_status: "$.data.status" } }
            - { call: "POST /inspections", payload: { device_id: "${dev3_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-19T10:30:00Z", scheduled_end: "2026-03-19T11:30:00Z", expected_device_version: "${dev3_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { conflict_err: "$.data.error_id" } }
          assert:
            - "First trigger (adjacent [11:00,12:00)) succeeds: Inspection.${ok_id}.status == SCHEDULED"
            - "Second trigger (overlapping [10:30,11:30)) fails: error_id == ERR_INSPECTOR_SCHEDULE_CONFLICT"

      - name: device_buffer_window_overlap
        grounds:
          - validations[priority=10]
          - entities.Inspection.fields.scheduled_start
          - errors[ERR_DEVICE_RETEST_BUFFER]
        distinguishing_aspect: "Device windows are CLOSED and expanded by a 60-minute buffer: a new inspection on the same device starting 30 min after a prior window's end is rejected with ERR_DEVICE_RETEST_BUFFER, whereas one starting exactly 60 min later would be allowed — resource = Device, semantics = buffer (distinct from Inspector adjacency)."
        test_recipe:
          setup:
            - "Device D has a SCHEDULED inspection for [10:00,11:00); the failing call schedules another inspection on D for [11:30,12:30) (gap 30 < 60 buffer)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Ovl2 Store", jurisdiction: "CA-16" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Hal H", badge_number: "BADGE-14" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-BUF", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { devD_id: "$.data.id", devD_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${devD_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-20T10:00:00Z", scheduled_end: "2026-03-20T11:00:00Z", expected_device_version: "${devD_v0}" }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /devices/${devD_id}", payload: {}, as: ProgramAdmin, captures: { devD_v1: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${devD_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-20T11:30:00Z", scheduled_end: "2026-03-20T12:30:00Z", expected_device_version: "${devD_v1}" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_DEVICE_RETEST_BUFFER"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: balance_conserved_penalty_assess_then_waive
        grounds:
          - calculations.establishment_balance
          - state_machines.Device.REGISTERED_to_CONDEMNED
          - state_machines.Penalty.ASSESSED_to_WAIVED
        distinguishing_aspect: "Conserved quantity = money: balance_due_cents == sum(DUE FeeInvoice.amount_due_cents) + sum(ASSESSED Penalty.amount_cents). Assessing a 5000 penalty raises balance 12000->17000; waiving it returns it to exactly 12000 (the fee-only total), leaving no drift."
        test_recipe:
          setup:
            - "Clock at Q1; SCALE device registered (fee 12000 DUE, balance 12000); a failing accuracy inspection assesses a 5000 OUT_OF_TOLERANCE penalty (balance 17000)."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Inv1 Store", jurisdiction: "CA-17" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ida I", badge_number: "BADGE-15" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-INV1", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-21T09:00:00Z", scheduled_end: "2026-03-21T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /establishments/${est_id}", payload: {}, as: ProgramAdmin, captures: { bal_before: "$.data.balance_due_cents" } }
            - { call: "GET /penalties?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { pen_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /penalties/${pen_id}/waive", payload: { reason: "adjudicated" }, as: ProgramAdmin, captures: { pen_status: "$.data.status" } }
            - { call: "GET /establishments/${est_id}", payload: {}, as: ProgramAdmin, captures: { bal_after: "$.data.balance_due_cents" } }
          assert:
            - "balance_due_cents before waive == 17000"
            - "Penalty.${pen_id}.status == WAIVED after trigger"
            - "balance_due_cents after waive == 12000 (equal to the sole DUE FeeInvoice; penalty component nets to 0)"

      - name: sealed_count_conserved_seal_then_condemn
        grounds:
          - calculations.sealed_device_count
          - state_machines.Device.REGISTERED_to_SEALED
          - state_machines.Device.SEALED_to_CONDEMNED
        distinguishing_aspect: "Conserved quantity = a count: sealed_device_count == count(Devices status==SEALED). Sealing a device raises it 0->1; a later failing test condemns it, returning the count to 0 with no residual — a different conserved quantity type than money."
        test_recipe:
          setup:
            - "A SCALE device is sealed by a clean accuracy pass (sealed_device_count 1), then a second inspection records a failing maintenance reading (error 8 > maintenance tol 6) in progress ready to finalize."
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Inv2 Store", jurisdiction: "CA-18" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Jon J", badge_number: "BADGE-16" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
