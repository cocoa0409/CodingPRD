scenario: |
  1256. Piano Dealer & Institutional Instrument Sales (Steinway dealer): inventory (new/used/consignment) & trade-in valuation, institutional bid & state contract compliance, delivery, moving & climate/placement requirements, tuning/regulation service plan attach, financing/rent-to-own program, warranty & manufacturer registration, restoration referral & appraisal, showroom event & artist series

domain_name: piano-dealer-institutional-sales
api_prefix: /piano-dealer

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel   # SalesOrder payment_status x fulfillment_status; plus cyclic machines on TradeInAppraisal / BidPackage / DeliveryJob / Instrument
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # bid preparer (InstitutionalBidOfficer) cannot compliance-approve own bid
  consistency_model: immediate
  difficulty_target: beyond_expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology, FK-linked peers)
# =============================================================================
entities:
  - name: Consignor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consignor legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: commission_pct, type: number, source: input, description: "Dealer commission fraction, e.g. 0.20" }
      - { name: split_mode, type: enum, source: input, description: "GROSS_SPLIT | NET_SPLIT — selects consignment_payout variant" }
      - { name: payout_method, type: string, source: input, description: "CHECK | ACH | WIRE" }
      - { name: outstanding_payout_cents, type: integer, source: computed, default: 0, description: "Ledger balance owed to consignor; += payout on consignment sale, -= reversal on completed return" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer or institution name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: customer_type, type: enum, source: input, description: "INDIVIDUAL | INSTITUTIONAL" }
      - { name: institution_type, type: enum, source: input, description: "EDUCATION | GOVERNMENT | NONPROFIT | CORPORATE; required iff customer_type == INSTITUTIONAL", default: null }
      - { name: tax_exempt, type: boolean, source: input, default: false, description: "Tax-exempt institution flag" }
      - { name: state_contract_ceiling_cents, type: integer, source: input, default: null, description: "State-contract price ceiling applied to institutional bids (null = no ceiling)" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Maximum financable principal" }
      - { name: risk_score, type: integer, source: computed, default: 700, description: "Starts 700; -25 on warranty voided by return; -150 on financing default; clamped to [300, 850]" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; globally unique across instruments" }
      - { name: category, type: enum, source: input, description: "GRAND | UPRIGHT | DIGITAL | HYBRID" }
      - { name: manufacturer, type: string, source: input, description: "e.g. Steinway, Yamaha" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: year_built, type: integer, source: input, description: "Four-digit year of manufacture" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR" }
      - { name: acquisition_type, type: enum, source: input, description: "NEW | USED | CONSIGNMENT" }
      - { name: consignor_id, type: string, source: input, default: null, description: "FK -> Consignor.id; required iff acquisition_type == CONSIGNMENT, else null" }
      - { name: list_price_cents, type: integer, source: input, description: "Asking price" }
      - { name: floor_price_cents, type: integer, source: input, description: "Minimum acceptable sell price; bid floor guard" }
      - { name: recoverable_costs_cents, type: integer, source: input, default: 0, description: "Prep/restoration costs recoverable off the top in NET_SPLIT consignment payout" }
      - { name: status, type: enum, source: system, description: "IN_PREP | AVAILABLE | RESERVED | SOLD | DELIVERED | RESTORATION_HOLD | REPOSSESSION_HOLD | RETURNED_TO_CONSIGNOR" }

  - name: TradeInAppraisal
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: category, type: enum, source: input, description: "GRAND | UPRIGHT | DIGITAL | HYBRID" }
      - { name: manufacturer, type: string, source: input, description: "Trade-in manufacturer" }
      - { name: model, type: string, source: input, description: "Trade-in model" }
      - { name: year_built, type: integer, source: input, description: "Trade-in year of manufacture" }
      - { name: condition_grade, type: enum, source: input, description: "Customer-reported EXCELLENT | GOOD | FAIR | POOR" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "Desktop estimate from trade_in_valuation PROVISIONAL variant, computed at creation" }
      - { name: reconditioning_cost_cents, type: integer, source: input, default: null, description: "In-shop reconditioning estimate, set at evaluate" }
      - { name: market_adjustment_pct, type: number, source: input, default: null, description: "Market adjustment fraction, clamped to [-0.15, +0.15], set at evaluate" }
      - { name: final_value_cents, type: integer, source: computed, default: null, description: "In-shop value from trade_in_valuation FINAL variant, computed at evaluate" }
      - { name: counter_value_cents, type: integer, source: input, default: null, description: "Customer counter-offer value, set at counter" }
      - { name: offered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of latest transition into OFFERED; offer expires 14 days later" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | OFFERED | COUNTERED | ACCEPTED | DECLINED | EXPIRED" }

  - name: BidPackage
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must be INSTITUTIONAL" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the creating InstitutionalBidOfficer; drives segregation-of-duties check" }
      - { name: lines, type: array, source: input, description: "Array of { instrument_id, unit_price_cents }" }
      - { name: quantity, type: integer, source: computed, description: "= count of lines" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line unit_price_cents" }
      - { name: tier_discount_pct, type: number, source: computed, description: "Quantity tier from institutional_bid_price" }
      - { name: institution_multiplier, type: number, source: computed, description: "Institution-type multiplier from institutional_bid_price" }
      - { name: ceiling_cents, type: integer, source: computed, default: null, description: "Customer state-contract ceiling snapshot at pricing time" }
      - { name: total_cents, type: integer, source: computed, description: "Final bid price per institutional_bid_price (min with ceiling)" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Increments on every POST /revisions (create-with-supersede)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | AWARDED | LOST | WITHDRAWN" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: items, type: array, source: input, description: "Array of { instrument_id, unit_price_cents, discount_pct }; >= 1 line" }
      - { name: trade_in_appraisal_id, type: string, source: input, default: null, description: "FK -> TradeInAppraisal.id; optional; must reference an ACCEPTED appraisal owned by customer" }
      - { name: bid_package_id, type: string, source: input, default: null, description: "FK -> BidPackage.id; optional; must reference an AWARDED bid owned by customer" }
      - { name: tax_rate, type: number, source: input, description: "Sales-tax fraction, e.g. 0.08; 0 allowed for tax-exempt" }
      - { name: distance_miles, type: integer, source: input, description: "One-way delivery distance; feeds delivery_fee tiers" }
      - { name: stairs_count, type: integer, source: input, description: "Stair flights at placement site; feeds delivery_fee" }
      - { name: climate_controlled_required, type: boolean, source: input, description: "True when placement site requires climate-controlled truck/crew" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded line totals (order_total)" }
      - { name: trade_in_credit_cents, type: integer, source: computed, default: 0, description: "min(appraisal.final_value_cents, round(0.40 * subtotal_cents))" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "delivery_fee calculation" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((subtotal - trade_in_credit) * tax_rate); 0 when tax_rate == 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal - trade_in_credit + delivery_fee + tax" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of posted payments" }
      - { name: balance_cents, type: integer, source: computed, description: "= total_cents - amount_paid_cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | FINANCED_ACTIVE | COLLECTIONS | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "AWAITING_SCHEDULING | DELIVERY_SCHEDULED | OUT_FOR_DELIVERY | DELIVERED | INSTALLED | RETURNED | CANCELLED" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set when delivery job completes" }
      - { name: installed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set at confirm-installation; anchors 14-day return window" }

  - name: DeliveryCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Crew label" }
      - { name: climate_certified, type: boolean, source: input, description: "True if crew operates climate-controlled trucks" }

  - name: DeliveryJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> DeliveryCrew.id" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (ISO8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | COMPLETED | FAILED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification_level, type: enum, source: input, description: "STANDARD | MASTER" }

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; order must be INSTALLED" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM" }
      - { name: price_cents, type: integer, source: computed, description: "service_plan_price; loyalty discount 10% when customer has any prior EXHAUSTED or CANCELLED plan" }
      - { name: visits_total, type: integer, source: computed, description: "BASIC 2 | STANDARD 4 | PREMIUM 6" }
      - { name: visits_used, type: integer, source: system, default: 0, description: "Completed visits" }
      - { name: visits_booked, type: integer, source: system, default: 0, description: "Open BOOKED visits" }
      - { name: visits_available, type: integer, source: computed, description: "= visits_total - visits_used - visits_booked; invariant visits_used + visits_booked + visits_available == visits_total" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXHAUSTED | CANCELLED" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> ServicePlan.id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id" }
      - { name: window_start, type: datetime, source: input, description: "Visit window start (ISO8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Visit window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED" }

  - name: FinancingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; order payment_status must be UNPAID" }
      - { name: program, type: enum, source: input, description: "STANDARD | RENT_TO_OWN" }
      - { name: principal_cents, type: integer, source: input, description: "Must equal order.total_cents at creation" }
      - { name: apr, type: number, source: input, default: null, description: "Annual percentage rate fraction; required for STANDARD, ignored for RENT_TO_OWN" }
      - { name: term_months, type: integer, source: input, description: "Number of scheduled monthly payments" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "financing_schedule: STANDARD annuity or RENT_TO_OWN flat rent" }
      - { name: payments_made, type: integer, source: system, default: 0, description: "Count of posted monthly payments" }
      - { name: missed_payments, type: integer, source: computed, default: 0, description: "max(0, whole months between activated_at and current logical clock - payments_made)" }
      - { name: purchase_credit_cents, type: integer, source: computed, default: 0, description: "RENT_TO_OWN: round_half_up(0.60 * monthly_amount_cents * min(payments_made, 24))" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of approve" }
      - { name: status, type: enum, source: system, description: "APPLIED | ACTIVE | PAID_OFF | DEFAULTED | CONVERTED_TO_PURCHASE | CANCELLED" }

  - name: WarrantyRegistration
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; order must be DELIVERED or INSTALLED" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; instrument must appear in order items" }
      - { name: term_months, type: integer, source: system, default: 24, description: "Base manufacturer warranty term" }
      - { name: registered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of manufacturer confirmation" }
      - { name: coverage_end, type: datetime, source: computed, default: null, description: "order.delivered_at + 24 months, + 12 more months when registered within 30 days of delivery" }
      - { name: status, type: enum, source: system, description: "PENDING | REGISTERED | VOID | EXPIRED" }

  - name: RestorationReferral
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: shop_name, type: string, source: input, description: "Referred restoration shop" }
      - { name: condition_score, type: integer, source: input, default: null, description: "1-100 assessment score, set at assess" }
      - { name: estimate_low_cents, type: integer, source: input, default: null, description: "Low estimate, set at assess" }
      - { name: estimate_high_cents, type: integer, source: input, default: null, description: "High estimate, set at assess" }
      - { name: final_quote_cents, type: integer, source: input, default: null, description: "Binding quote, set at quote" }
      - { name: status, type: enum, source: system, description: "REFERRED | ASSESSED | QUOTED | COMMISSIONED | DECLINED" }

  - name: ShowroomEvent
    parent: null
    common_fields: true
    fields:
      - { name: room, type: enum, source: input, description: "MAIN_SHOWROOM | RECITAL_HALL" }
      - { name: title, type: string, source: input, description: "Event title (artist series)" }
      - { name: start_at, type: datetime, source: input, description: "Event start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Event end; must be > start_at" }
      - { name: capacity, type: integer, source: input, description: "Max cumulative RSVP seats" }
      - { name: artist_guarantee_cents, type: integer, source: input, description: "Minimum artist payout" }
      - { name: split_pct, type: number, source: input, description: "Artist share of gross ticket receipts, e.g. 0.70" }
      - { name: rsvp_count, type: integer, source: computed, default: 0, description: "Cumulative reserved seats" }
      - { name: gross_cents, type: integer, source: input, default: null, description: "Gross ticket receipts, provided at settle" }
      - { name: payout_cents, type: integer, source: computed, default: null, description: "artist_payout = max(artist_guarantee_cents, round_half_up(split_pct * gross_cents))" }
      - { name: status, type: enum, source: system, description: "PLANNED | RSVP_OPEN | SETTLED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Instrument
    initial_state: IN_PREP
    terminal_states: [RETURNED_TO_CONSIGNOR]
    transitions:
      - from: IN_PREP
        to: AVAILABLE
        trigger: "POST /piano-dealer/instruments/{id}/list-for-sale"
        actor: StoreManager
        preconditions: ["Instrument.status == IN_PREP (else ERR_INVALID_REQUEST via state check -> 409 ERR_INSTRUMENT_NOT_AVAILABLE)"]
        side_effects: []
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /piano-dealer/sales-orders (side effect per line item)"
        actor: SalesAssociate
        preconditions: ["Every item instrument must be AVAILABLE (else ERR_INSTRUMENT_NOT_AVAILABLE)"]
        side_effects: ["Instrument.status -> RESERVED for each order line"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /piano-dealer/sales-orders/{id}/cancel (side effect)"
        actor: SalesAssociate
        preconditions: []
        side_effects: ["Each line instrument returns to AVAILABLE"]
      - from: RESERVED
        to: SOLD
        trigger: "SalesOrder.payment_status -> PAID_IN_FULL or FINANCED_ACTIVE (side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "For each CONSIGNMENT line instrument: compute consignment_payout per its Consignor.split_mode and add to Consignor.outstanding_payout_cents"
      - from: SOLD
        to: DELIVERED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/complete (side effect)"
        actor: ServiceCoordinator
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: IN_PREP
        trigger: "POST /piano-dealer/sales-orders/{id}/complete-return (cascade link 1)"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Cascade link 2: any WarrantyRegistration with instrument_id == this instrument and status == REGISTERED -> VOID"
          - "Cascade link 3: each such warranty void subtracts 25 from Customer.risk_score (floor 300)"
      - from: AVAILABLE
        to: RESTORATION_HOLD
        trigger: "POST /piano-dealer/restoration-referrals/{id}/record-decision decision=COMMISSIONED (side effect)"
        actor: StoreManager
        preconditions: ["Instrument.status == AVAILABLE (else ERR_INSTRUMENT_NOT_AVAILABLE)"]
        side_effects: []
      - from: RESTORATION_HOLD
        to: IN_PREP
        trigger: "POST /piano-dealer/instruments/{id}/complete-restoration"
        actor: StoreManager
        preconditions: ["Instrument.status == RESTORATION_HOLD"]
        side_effects: []
      - from: DELIVERED
        to: REPOSSESSION_HOLD
        trigger: "POST /piano-dealer/financing-agreements/{id}/declare-default (cascade link 2)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: REPOSSESSION_HOLD
        to: AVAILABLE
        trigger: "POST /piano-dealer/instruments/{id}/release-hold"
        actor: StoreManager
        preconditions: ["Instrument.status == REPOSSESSION_HOLD"]
        side_effects: []
      - from: AVAILABLE
        to: RETURNED_TO_CONSIGNOR
        trigger: "POST /piano-dealer/instruments/{id}/return-to-consignor"
        actor: StoreManager
        preconditions:
          - "Instrument.acquisition_type == CONSIGNMENT (else ERR_INVALID_REQUEST)"
          - "Instrument.status == AVAILABLE (else ERR_INSTRUMENT_NOT_AVAILABLE)"
        side_effects: []

  - entity: TradeInAppraisal
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /piano-dealer/trade-in-appraisals/{id}/evaluate"
        actor: StoreManager
        preconditions: ["status == SUBMITTED or COUNTERED (else ERR_APPRAISAL_NOT_OFFERED)"]
        side_effects:
          - "Compute final_value_cents via trade_in_valuation FINAL variant"
          - "offered_at := current logical clock"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /piano-dealer/trade-in-appraisals/{id}/counter"
        actor: Customer
        preconditions:
          - "status == OFFERED (else ERR_APPRAISAL_NOT_OFFERED)"
          - "X-User-ID == appraisal.customer_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["counter_value_cents recorded"]
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /piano-dealer/trade-in-appraisals/{id}/evaluate"
        actor: StoreManager
        preconditions: ["status == SUBMITTED or COUNTERED (else ERR_APPRAISAL_NOT_OFFERED)"]
        side_effects: ["Recompute final_value_cents; offered_at := current logical clock (resets 14-day offer window)"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /piano-dealer/trade-in-appraisals/{id}/accept"
        actor: Customer
        preconditions:
          - "status == OFFERED (else ERR_APPRAISAL_NOT_OFFERED)"
          - "current logical clock <= offered_at + 14 days (else transition to EXPIRED and fail with ERR_APPRAISAL_EXPIRED)"
          - "X-User-ID == appraisal.customer_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /piano-dealer/trade-in-appraisals/{id}/decline"
        actor: Customer
        preconditions: ["status == OFFERED (else ERR_APPRAISAL_NOT_OFFERED)", "X-User-ID == appraisal.customer_id"]
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (lazy: any accept/counter attempted after offered_at + 14 days)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; request fails with ERR_APPRAISAL_EXPIRED"]

  - entity: BidPackage
    initial_state: DRAFT
    terminal_states: [AWARDED, LOST, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /piano-dealer/bid-packages/{id}/submit"
        actor: InstitutionalBidOfficer
        preconditions:
          - "status == DRAFT (else ERR_BID_NOT_ACTIONABLE)"
          - "total_cents >= sum of each line instrument's floor_price_cents (else ERR_BID_BELOW_FLOOR)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /piano-dealer/bid-packages/{id}/compliance-approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_BID_NOT_ACTIONABLE)"
          - "Segregation of duties: X-User-ID != prepared_by_user_id (else ERR_SOD_SELF_APPROVAL)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /piano-dealer/bid-packages/{id}/return-for-revision"
        actor: ComplianceOfficer
        preconditions: ["status == SUBMITTED (else ERR_BID_NOT_ACTIONABLE)"]
        side_effects: []
      - from: APPROVED
        to: AWARDED
        trigger: "POST /piano-dealer/bid-packages/{id}/record-outcome outcome=AWARDED"
        actor: InstitutionalBidOfficer
        preconditions: ["status == APPROVED (else ERR_BID_NOT_ACTIONABLE)"]
        side_effects: []
      - from: APPROVED
        to: LOST
        trigger: "POST /piano-dealer/bid-packages/{id}/record-outcome outcome=LOST"
        actor: InstitutionalBidOfficer
        preconditions: ["status == APPROVED (else ERR_BID_NOT_ACTIONABLE)"]
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /piano-dealer/bid-packages/{id}/withdraw"
        actor: InstitutionalBidOfficer
        preconditions: ["status == DRAFT or SUBMITTED (else ERR_BID_NOT_ACTIONABLE)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /piano-dealer/bid-packages/{id}/withdraw"
        actor: InstitutionalBidOfficer
        preconditions: ["status == DRAFT or SUBMITTED (else ERR_BID_NOT_ACTIONABLE)"]
        side_effects: []

  - entity: SalesOrder.payment_status
    initial_state: UNPAID
    terminal_states: [PAID_IN_FULL, REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /piano-dealer/sales-orders/{id}/payments with amount_cents < balance_cents"
        actor: SalesAssociate
        preconditions:
          - "payment_status in {UNPAID, DEPOSIT_PAID} (else ERR_ORDER_NOT_PAYABLE)"
          - "amount_cents <= balance_cents (else ERR_OVERPAYMENT)"
        side_effects: ["amount_paid_cents += amount_cents; balance_cents recomputed"]
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /piano-dealer/sales-orders/{id}/payments with amount_cents == balance_cents"
        actor: SalesAssociate
        preconditions: ["payment_status in {UNPAID, DEPOSIT_PAID} (else ERR_ORDER_NOT_PAYABLE)", "amount_cents <= balance_cents (else ERR_OVERPAYMENT)"]
        side_effects: ["Line instruments RESERVED -> SOLD; consignment payouts posted"]
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /piano-dealer/sales-orders/{id}/payments with amount_cents == balance_cents"
        actor: SalesAssociate
        preconditions: ["payment_status in {UNPAID, DEPOSIT_PAID} (else ERR_ORDER_NOT_PAYABLE)", "amount_cents <= balance_cents (else ERR_OVERPAYMENT)"]
        side_effects: ["Line instruments RESERVED -> SOLD; consignment payouts posted"]
      - from: UNPAID
        to: FINANCED_ACTIVE
        trigger: "POST /piano-dealer/financing-agreements/{id}/approve (side effect)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["Line instruments RESERVED -> SOLD; consignment payouts posted"]
      - from: FINANCED_ACTIVE
        to: PAID_IN_FULL
        trigger: "FinancingAgreement -> PAID_OFF or CONVERTED_TO_PURCHASE (side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINANCED_ACTIVE
        to: COLLECTIONS
        trigger: "POST /piano-dealer/financing-agreements/{id}/declare-default (cascade link 1)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["Cascade link 2: line instruments DELIVERED -> REPOSSESSION_HOLD"]
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "POST /piano-dealer/sales-orders/{id}/complete-return (side effect)"
        actor: StoreManager
        preconditions: []
        side_effects: []

  - entity: SalesOrder.fulfillment_status
    initial_state: AWAITING_SCHEDULING
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: AWAITING_SCHEDULING
        to: DELIVERY_SCHEDULED
        trigger: "POST /piano-dealer/delivery-jobs (side effect)"
        actor: ServiceCoordinator
        preconditions: ["fulfillment_status == AWAITING_SCHEDULING", "payment_status in {DEPOSIT_PAID, PAID_IN_FULL, FINANCED_ACTIVE} (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: []
      - from: DELIVERY_SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /piano-dealer/delivery-jobs/{id}/start (side effect)"
        actor: ServiceCoordinator
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: DELIVERY_SCHEDULED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/fail (side effect)"
        actor: ServiceCoordinator
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/complete (side effect)"
        actor: ServiceCoordinator
        preconditions: []
        side_effects: ["delivered_at := current logical clock; line instruments SOLD -> DELIVERED"]
      - from: DELIVERED
        to: INSTALLED
        trigger: "POST /piano-dealer/sales-orders/{id}/confirm-installation"
        actor: "StoreManager or Customer (self)"
        preconditions: ["fulfillment_status == DELIVERED (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: ["installed_at := current logical clock"]
      - from: INSTALLED
        to: RETURNED
        trigger: "POST /piano-dealer/sales-orders/{id}/complete-return"
        actor: StoreManager
        preconditions:
          - "fulfillment_status == INSTALLED (else ERR_DELIVERY_NOT_ACTIONABLE)"
          - "payment_status == PAID_IN_FULL (else ERR_ORDER_NOT_PAYABLE)"
          - "current logical clock <= installed_at + 14 days (else ERR_RETURN_WINDOW_CLOSED)"
        side_effects:
          - "Cascade link 1: payment_status -> REFUNDED"
          - "Cascade link 2: line instruments DELIVERED -> IN_PREP"
          - "Cascade link 3: REGISTERED warranties on those instruments -> VOID; Customer.risk_score -= 25 per voided warranty (floor 300)"
          - "If a FinancingAgreement with order_id == this order is ACTIVE: -> CANCELLED"
      - from: AWAITING_SCHEDULING
        to: CANCELLED
        trigger: "POST /piano-dealer/sales-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions: ["payment_status == UNPAID (else ERR_ORDER_NOT_PAYABLE)", "fulfillment_status == AWAITING_SCHEDULING (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: ["Line instruments RESERVED -> AVAILABLE"]

  - entity: DeliveryJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /piano-dealer/delivery-jobs/{id}/start"
        actor: ServiceCoordinator
        preconditions: ["status == SCHEDULED (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: ["Order fulfillment -> OUT_FOR_DELIVERY"]
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/complete"
        actor: ServiceCoordinator
        preconditions: ["status == EN_ROUTE (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: ["Order fulfillment -> DELIVERED; order.delivered_at := now; instruments -> DELIVERED"]
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/fail"
        actor: ServiceCoordinator
        preconditions: ["status == EN_ROUTE (else ERR_DELIVERY_NOT_ACTIONABLE)"]
        side_effects: ["Order fulfillment -> DELIVERY_SCHEDULED"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /piano-dealer/delivery-jobs/{id}/reschedule"
        actor: ServiceCoordinator
        preconditions:
          - "status == FAILED (else ERR_DELIVERY_NOT_ACTIONABLE)"
          - "New window passes crew overlap+buffer and climate checks (same as create)"
        side_effects: []

  - entity: ServicePlan
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /piano-dealer/service-plans/{id}/suspend"
        actor: ServiceCoordinator
        preconditions: ["status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /piano-dealer/service-plans/{id}/resume"
        actor: ServiceCoordinator
        preconditions: ["status == SUSPENDED (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (when visits_used == visits_total and visits_booked == 0, evaluated on every plan mutation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /piano-dealer/service-plans/{id}/cancel"
        actor: ServiceCoordinator
        preconditions: ["status in {ACTIVE, SUSPENDED} (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["All BOOKED ServiceVisits -> CANCELLED; visits_booked := 0"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /piano-dealer/service-plans/{id}/cancel"
        actor: ServiceCoordinator
        preconditions: ["status in {ACTIVE, SUSPENDED} (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["All BOOKED ServiceVisits -> CANCELLED; visits_booked := 0"]

  - entity: ServiceVisit
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /piano-dealer/service-visits/{id}/complete"
        actor: ServiceCoordinator
        preconditions: ["status == BOOKED (else ERR_INVALID_REQUEST state check)"]
        side_effects: ["plan.visits_booked -= 1; plan.visits_used += 1; plan auto-EXHAUSTED when visits_used == visits_total and visits_booked == 0"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /piano-dealer/service-visits/{id}/cancel"
        actor: ServiceCoordinator
        preconditions: ["status == BOOKED"]
        side_effects: ["plan.visits_booked -= 1 (compensating release; visits_used unchanged)"]

  - entity: FinancingAgreement
    initial_state: APPLIED
    terminal_states: [PAID_OFF, DEFAULTED, CONVERTED_TO_PURCHASE, CANCELLED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /piano-dealer/financing-agreements/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "status == APPLIED (else ERR_INVALID_REQUEST state check)"
          - "principal_cents <= customer.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: ["activated_at := current logical clock; order.payment_status UNPAID -> FINANCED_ACTIVE; line instruments -> SOLD with consignment payouts"]
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /piano-dealer/financing-agreements/{id}/payments when payments_made reaches term_months"
        actor: FinanceOfficer
        preconditions: ["status == ACTIVE", "amount_cents == monthly_amount_cents (else ERR_INVALID_REQUEST)"]
        side_effects: ["order.payment_status FINANCED_ACTIVE -> PAID_IN_FULL"]
      - from: ACTIVE
        to: CONVERTED_TO_PURCHASE
        trigger: "POST /piano-dealer/financing-agreements/{id}/convert-to-purchase"
        actor: FinanceOfficer
        preconditions: ["status == ACTIVE (else ERR_AGREEMENT_NOT_CONVERTIBLE)", "program == RENT_TO_OWN (else ERR_AGREEMENT_NOT_CONVERTIBLE)"]
        side_effects: ["purchase_credit_cents computed; order.payment_status FINANCED_ACTIVE -> PAID_IN_FULL"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /piano-dealer/financing-agreements/{id}/declare-default"
        actor: FinanceOfficer
        preconditions: ["status == ACTIVE", "missed_payments >= 3 (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "Cascade link 1: order.payment_status FINANCED_ACTIVE -> COLLECTIONS"
          - "Cascade link 2: line instruments DELIVERED -> REPOSSESSION_HOLD"
          - "Customer.risk_score -= 150 (floor 300)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /piano-dealer/sales-orders/{orderId}/complete-return (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyRegistration
    initial_state: PENDING
    terminal_states: [VOID, EXPIRED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /piano-dealer/warranty-registrations/{id}/confirm"
        actor: StoreManager
        preconditions: ["status == PENDING (else ERR_INVALID_REQUEST state check)"]
        side_effects: ["registered_at := current logical clock; coverage_end computed per warranty_coverage_end"]
      - from: REGISTERED
        to: VOID
        trigger: "POST /piano-dealer/sales-orders/{id}/complete-return (cascade link 3)"
        actor: system
        preconditions: []
        side_effects: ["Customer.risk_score -= 25 (floor 300)"]
      - from: REGISTERED
        to: EXPIRED
        trigger: "system (lazy: on GET, when current logical clock > coverage_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RestorationReferral
    initial_state: REFERRED
    terminal_states: [COMMISSIONED, DECLINED]
    transitions:
      - from: REFERRED
        to: ASSESSED
        trigger: "POST /piano-dealer/restoration-referrals/{id}/assess"
        actor: StoreManager
        preconditions: ["status == REFERRED (else ERR_REFERRAL_NOT_ACTIONABLE)"]
        side_effects: []
      - from: ASSESSED
        to: QUOTED
        trigger: "POST /piano-dealer/restoration-referrals/{id}/quote"
        actor: StoreManager
        preconditions: ["status == ASSESSED (else ERR_REFERRAL_NOT_ACTIONABLE)"]
        side_effects: []
      - from: QUOTED
        to: COMMISSIONED
        trigger: "POST /piano-dealer/restoration-referrals/{id}/record-decision decision=COMMISSIONED"
        actor: StoreManager
        preconditions: ["status == QUOTED (else ERR_REFERRAL_NOT_ACTIONABLE)", "instrument.status == AVAILABLE (else ERR_INSTRUMENT_NOT_AVAILABLE)"]
        side_effects: ["Instrument AVAILABLE -> RESTORATION_HOLD"]
      - from: QUOTED
        to: DECLINED
        trigger: "POST /piano-dealer/restoration-referrals/{id}/record-decision decision=DECLINED"
        actor: StoreManager
        preconditions: ["status == QUOTED (else ERR_REFERRAL_NOT_ACTIONABLE)"]
        side_effects: []

  - entity: ShowroomEvent
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RSVP_OPEN
        trigger: "POST /piano-dealer/showroom-events/{id}/open-rsvp"
        actor: StoreManager
        preconditions: ["status == PLANNED (else ERR_EVENT_NOT_SETTLABLE)"]
        side_effects: []
      - from: RSVP_OPEN
        to: SETTLED
        trigger: "POST /piano-dealer/showroom-events/{id}/settle"
        actor: StoreManager
        preconditions: ["status == RSVP_OPEN (else ERR_EVENT_NOT_SETTLABLE)", "current logical clock >= end_at (else ERR_EVENT_NOT_SETTLABLE)"]
        side_effects: ["payout_cents := artist_payout(gross_cents)"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /piano-dealer/showroom-events/{id}/cancel"
        actor: StoreManager
        preconditions: ["status in {PLANNED, RSVP_OPEN} (else ERR_EVENT_NOT_SETTLABLE)"]
        side_effects: ["Cancelled events no longer participate in room-overlap checks"]
      - from: RSVP_OPEN
        to: CANCELLED
        trigger: "POST /piano-dealer/showroom-events/{id}/cancel"
        actor: StoreManager
        preconditions: ["status in {PLANNED, RSVP_OPEN} (else ERR_EVENT_NOT_SETTLABLE)"]
        side_effects: ["Cancelled events no longer participate in room-overlap checks"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: bid-revision-stale-package
    parent_entity: BidPackage
    write_endpoint: "POST /piano-dealer/bid-packages/{id}/revisions"
    occ_field: "expected_bid_version"
    description: |
      Creating a new revision of a BidPackage whose version has advanced
      since the client last observed it is rejected. Under the create-with-
      supersede rule a new revision legitimately supersedes the prior one, so
      a writer holding a stale version of the package must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-amend-stale-order
    parent_entity: SalesOrder
    write_endpoint: "PATCH /piano-dealer/sales-orders/{id}"
    occ_field: "expected_order_version"
    description: |
      Amending a SalesOrder whose version has advanced since the client last
      observed it is rejected. Each successful amendment legitimately
      supersedes the prior pricing snapshot, so an amendment carrying a stale
      expected_order_version must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: trade_in_valuation
    trigger: "PROVISIONAL variant on POST /trade-in-appraisals; FINAL variant on POST /trade-in-appraisals/{id}/evaluate"
    algorithm: decay_function
    formula: |
      age = year(current_logical_clock) - year_built
      age_factor = max(AGE_FACTOR_FLOOR, 1 - AGE_DEPRECIATION_PER_YEAR * age)
      base = BASE_VALUE_CENTS[category]
      PROVISIONAL: value = round_half_up(base * age_factor * (1 - WEAR_PCT[condition_grade]))
      FINAL: adj = clamp(market_adjustment_pct, -0.15, +0.15)
             value = round_half_up((provisional_value_cents - reconditioning_cost_cents) * (1 + adj))
      Evaluation order pinned: provisional first, then subtract reconditioning, then multiply by (1 + adj), single final rounding.
    input_set: "The TradeInAppraisal being computed; age uses the logical clock year (default clock 2026-05-01 => year 2026)"
    constants:
      BASE_VALUE_CENTS: { GRAND: 2800000, UPRIGHT: 900000, DIGITAL: 250000, HYBRID: 600000 }
      AGE_DEPRECIATION_PER_YEAR: 0.03
      AGE_FACTOR_FLOOR: 0.40
      WEAR_PCT: { EXCELLENT: 0.0, GOOD: 0.05, FAIR: 0.15, POOR: 0.30 }
      MARKET_ADJ_CLAMP: 0.15
      OFFER_TTL_DAYS: 14
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "At appraisal creation (customer self-reported condition)"
        difference: "No reconditioning deduction, no market adjustment"
      - name: FINAL
        when: "At dealer in-shop evaluation"
        difference: "Subtracts reconditioning_cost_cents then applies market_adjustment_pct clamped to +/-0.15; produces a different value from PROVISIONAL for identical instrument data"

  - name: consignment_payout
    trigger: "Instrument transitions RESERVED -> SOLD (full payment or financing approval) for a CONSIGNMENT line"
    algorithm: aggregation
    formula: |
      GROSS_SPLIT: payout = round_half_up(sale_price_cents * (1 - commission_pct))
      NET_SPLIT:   payout = round_half_up((sale_price_cents - recoverable_costs_cents) * (1 - commission_pct))
      where sale_price_cents is the order line's rounded line total for that instrument.
      Consignor.outstanding_payout_cents += payout.
      Compensating action: complete-return subtracts the same payout (reversal) so the
      ledger returns to its pre-sale value exactly.
    input_set: "Order lines whose instrument.acquisition_type == CONSIGNMENT, at the moment of RESERVED -> SOLD"
    constants:
      COMMISSION_SOURCE: "Consignor.commission_pct"
    precision: "integer cents, round_half_up"
    variants:
      - name: GROSS_SPLIT
        when: "Consignor.split_mode == GROSS_SPLIT"
        difference: "Commission computed on full sale price"
      - name: NET_SPLIT
        when: "Consignor.split_mode == NET_SPLIT"
        difference: "Recoverable costs deducted before commission; lower payout for identical sale price"

  - name: institutional_bid_price
    trigger: "On POST /bid-packages and on POST /bid-packages/{id}/revisions"
    algorithm: tiered_pricing
    formula: |
      quantity = count(lines)
      subtotal = sum(line.unit_price_cents)
      tier_discount_pct = 0.15 if quantity >= 11 else 0.12 if quantity >= 6 else 0.08 if quantity >= 3 else 0.0
      after_tier = round_half_up(subtotal * (1 - tier_discount_pct))
      mult = INSTITUTION_MULTIPLIER[customer.institution_type]
      after_mult = round_half_up(after_tier * mult)
      total_cents = min(after_mult, customer.state_contract_ceiling_cents) when ceiling is not null, else after_mult
      Evaluation order pinned: tier first, institution multiplier second, ceiling min last.
    input_set: "BidPackage lines (each referencing an existing Instrument) and the Customer's institution_type + state_contract_ceiling_cents"
    constants:
      TIER_BOUNDARIES: { "3": 0.08, "6": 0.12, "11": 0.15 }
      INSTITUTION_MULTIPLIER: { EDUCATION: 0.95, GOVERNMENT: 0.93, NONPROFIT: 0.97, CORPORATE: 1.00 }
    precision: "integer cents, round_half_up at each multiplication step"
    variants: []

  - name: order_total
    trigger: "On POST /sales-orders and on PATCH /sales-orders/{id}"
    algorithm: aggregation
    formula: |
      Per line: line_total = round_half_up(unit_price_cents * (1 - discount_pct))   # round PER LINE first
      subtotal_cents = sum(line_total)                                              # then sum (pinned order: per-line round, then sum)
      trade_in_credit_cents = 0 when no trade_in_appraisal_id else
          min(appraisal.final_value_cents, round_half_up(TRADE_IN_CAP_PCT * subtotal_cents))   # cap is inclusive: credit == cap allowed
      taxable_base = subtotal_cents - trade_in_credit_cents
      tax_cents = 0 when tax_rate == 0 else round_half_up(taxable_base * tax_rate)
      delivery_fee_cents = delivery_fee(distance_miles, stairs_count, climate_controlled_required)
      total_cents = subtotal_cents - trade_in_credit_cents + delivery_fee_cents + tax_cents
      balance_cents = total_cents - amount_paid_cents
    input_set: "Order items, referenced ACCEPTED TradeInAppraisal (if any), delivery attributes"
    constants:
      TRADE_IN_CAP_PCT: 0.40
    precision: "integer cents, round_half_up; rounding order is normative: round each line, then sum"
    variants: []

  - name: delivery_fee
    trigger: "Inside order_total whenever an order is created or amended"
    algorithm: tiered_pricing
    formula: |
      fee = BASE_FEE_CENTS
          + PER_STAIR_CENTS * stairs_count
          + (0 if distance_miles <= 25 else TIER2_FEE_CENTS if distance_miles <= 60 else TIER3_FEE_CENTS)
          + (CLIMATE_SURCHARGE_CENTS if climate_controlled_required else 0)
    input_set: "Order delivery attributes"
    constants:
      BASE_FEE_CENTS: 15000
      PER_STAIR_CENTS: 2500
      TIER2_FEE_CENTS: 12000
      TIER3_FEE_CENTS: 24000
      CLIMATE_SURCHARGE_CENTS: 20000
    precision: "integer cents (no rounding needed)"
    variants: []

  - name: financing_schedule
    trigger: "On POST /financing-agreements (monthly_amount_cents), on convert-to-purchase (purchase_credit_cents), missed_payments recomputed on every read/write of the agreement"
    algorithm: chronological
    formula: |
      STANDARD: r = apr / 12
                monthly_amount_cents = round_half_up(principal_cents * r / (1 - (1 + r)^(-term_months)))
      RENT_TO_OWN: monthly_amount_cents = round_half_up(principal_cents * RTO_MONTHLY_RATE)
                purchase_credit_cents = round_half_up(RTO_CREDIT_PCT * monthly_amount_cents * min(payments_made, RTO_CREDIT_CAP_MONTHS))
                conversion payoff = principal_cents - purchase_credit_cents
      missed_payments = max(0, whole_months_between(activated_at, current_logical_clock) - payments_made)
      whole_months_between: calendar months elapsed, counting a month only when the day-of-month has been reached.
    input_set: "The FinancingAgreement and the logical clock"
    constants:
      RTO_MONTHLY_RATE: 0.012
      RTO_CREDIT_PCT: 0.60
      RTO_CREDIT_CAP_MONTHS: 24
      DEFAULT_THRESHOLD_MISSED: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: STANDARD
        when: "program == STANDARD"
        difference: "Annuity payment from apr and term_months"
      - name: RENT_TO_OWN
        when: "program == RENT_TO_OWN"
        difference: "Flat 1.2% monthly rent with 60%-of-rents purchase credit (capped at 24 months); produces a different monthly amount for identical principal"

  - name: service_plan_price
    trigger: "On POST /service-plans"
    algorithm: threshold
    formula: |
      base = TIER_PRICE_CENTS[tier]; visits_total = TIER_VISITS[tier]
      loyalty = customer has any other ServicePlan with status in {EXHAUSTED, CANCELLED}
      price_cents = round_half_up(base * (1 - LOYALTY_PCT)) when loyalty else base
    input_set: "New plan tier + all other plans of the same customer (via order.customer_id)"
    constants:
      TIER_PRICE_CENTS: { BASIC: 30000, STANDARD: 55000, PREMIUM: 85000 }
      TIER_VISITS: { BASIC: 2, STANDARD: 4, PREMIUM: 6 }
      LOYALTY_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants: []

  - name: warranty_coverage_end
    trigger: "On POST /warranty-registrations/{id}/confirm"
    algorithm: projection
    formula: |
      coverage_end = order.delivered_at + BASE_TERM_MONTHS months
      if registered_at <= order.delivered_at + EXTENSION_WINDOW_DAYS days:
          coverage_end += EXTENSION_MONTHS months
    input_set: "The WarrantyRegistration, its order.delivered_at, and the logical clock"
    constants:
      BASE_TERM_MONTHS: 24
      EXTENSION_MONTHS: 12
      EXTENSION_WINDOW_DAYS: 30
      REGISTRATION_WINDOW_DAYS: 60
    precision: "datetime, calendar-month arithmetic"
    variants: []

  - name: artist_payout
    trigger: "On POST /showroom-events/{id}/settle"
    algorithm: threshold
    formula: |
      payout_cents = max(artist_guarantee_cents, round_half_up(split_pct * gross_cents))
    input_set: "The ShowroomEvent and the gross_cents supplied at settle"
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: on compliance-approve, X-User-ID != BidPackage.prepared_by_user_id; on Customer self-service endpoints, X-User-ID == resource customer_id; on Consignor endpoints, X-User-ID == consignor id", error_id: ERR_SOD_SELF_APPROVAL, http_status: 403, applies_to: ["POST /piano-dealer/bid-packages/{id}/compliance-approve", "POST /piano-dealer/trade-in-appraisals/{id}/counter", "POST /piano-dealer/trade-in-appraisals/{id}/accept", "POST /piano-dealer/trade-in-appraisals/{id}/decline", "GET /piano-dealer/consignors/{id}"] }
  - { priority: 4, category: existence, check: "Every path id and body FK reference exists (instrument, customer, consignor, order, appraisal, bid, plan, agreement, warranty, referral, event, crew, technician, job, visit), validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource is in a state that permits the operation (per state machine preconditions): instrument AVAILABLE for order lines; order payable for payments; appraisal OFFERED for accept/counter/decline; bid in required state; plan ACTIVE for booking; agreement ACTIVE for payments/convert/default; job in required state; event in required state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints; surfaced as the domain-specific state error (ERR_INSTRUMENT_NOT_AVAILABLE, ERR_ORDER_NOT_PAYABLE, ERR_APPRAISAL_NOT_OFFERED, ERR_BID_NOT_ACTIONABLE, ERR_PLAN_NOT_ACTIVE, ERR_DELIVERY_NOT_ACTIONABLE, ERR_EVENT_NOT_SETTLABLE, ERR_REFERRAL_NOT_ACTIONABLE, ERR_AGREEMENT_NOT_CONVERTIBLE)" }
  - { priority: 6, category: business_safety, check: "Delivery scheduling: when order.climate_controlled_required is true, the assigned crew must have climate_certified == true", error_id: ERR_CLIMATE_REQUIREMENT_UNMET, http_status: 422, applies_to: ["POST /piano-dealer/delivery-jobs", "POST /piano-dealer/delivery-jobs/{id}/reschedule"] }
  - { priority: 7, category: business_temporal, check: "Clock-driven windows: appraisal accept within offered_at + 14 days; warranty registration within delivered_at + 60 days; complete-return within installed_at + 14 days; event settle not before end_at", error_id: ERR_APPRAISAL_EXPIRED, http_status: 409, applies_to: ["accept (ERR_APPRAISAL_EXPIRED)", "POST /piano-dealer/warranty-registrations (ERR_WARRANTY_WINDOW_CLOSED, 422)", "POST /piano-dealer/sales-orders/{id}/complete-return (ERR_RETURN_WINDOW_CLOSED, 422)", "POST /piano-dealer/showroom-events/{id}/settle (ERR_EVENT_NOT_SETTLABLE, 409)"] }
  - { priority: 8, category: business_constraint, check: "Uniqueness (instrument serial_number globally unique), resource overlap rules (crew window+30min buffer, technician closed-window overlap and max 4 visits per UTC day, room half-open adjacency), capacity (event rsvp_count + party_size <= capacity; plan visits_available > 0 else ERR_PLAN_EXHAUSTED)", error_id: ERR_DUPLICATE_SERIAL, http_status: 409, applies_to: ["create/schedule endpoints; surfaced as ERR_DUPLICATE_SERIAL, ERR_CREW_WINDOW_CONFLICT, ERR_TECHNICIAN_WINDOW_CONFLICT, ERR_TECHNICIAN_DAY_CAPACITY_REACHED, ERR_ROOM_WINDOW_CONFLICT, ERR_EVENT_CAPACITY_EXCEEDED, ERR_PLAN_EXHAUSTED"] }
  - { priority: 9, category: business_referential, check: "Referenced-object state: trade_in_appraisal must be ACCEPTED and owned by customer (ERR_TRADE_IN_NOT_ACCEPTED); bid_package must be AWARDED and owned by customer (ERR_BID_NOT_ACTIONABLE); warranty instrument must appear in the order's items (ERR_INVALID_REQUEST)", error_id: ERR_TRADE_IN_NOT_ACCEPTED, http_status: 422, applies_to: ["POST /piano-dealer/sales-orders", "POST /piano-dealer/warranty-registrations"] }
  - { priority: 10, category: business_fiscal, check: "Money rules last: payment amount <= balance (ERR_OVERPAYMENT); bid total >= sum of line floor prices at submit (ERR_BID_BELOW_FLOOR); financing principal <= customer credit limit at approve (ERR_CREDIT_LIMIT_EXCEEDED)", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: ["POST /piano-dealer/sales-orders/{id}/payments", "POST /piano-dealer/bid-packages/{id}/submit", "POST /piano-dealer/financing-agreements/{id}/approve"] }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - { method: POST, path: "/piano-dealer/_clock/set_current_utc", description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z (fixed default, never wall-clock).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Recomputes lazy EXPIRED transitions on next access"] }

  # --- consignors ---
  - { method: POST, path: "/piano-dealer/consignors", description: "Register a consignor", roles: [StoreManager], code: 201, input: [full_name, email, commission_pct, split_mode, payout_method], output: Consignor, side_effects: [] }
  - { method: GET, path: "/piano-dealer/consignors/{id}", description: "Read consignor (self or manager)", roles: [StoreManager, Consignor], code: 200, input: [], output: Consignor, side_effects: [] }
  - { method: GET, path: "/piano-dealer/consignors/{id}/instruments", description: "List instruments consigned by this consignor", roles: [StoreManager, Consignor], code: 200, input: ["limit?", "offset?"], output: "Instrument[]", side_effects: [] }

  # --- customers ---
  - { method: POST, path: "/piano-dealer/customers", description: "Register a customer or institution", roles: [SalesAssociate], code: 201, input: [full_name, email, customer_type, "institution_type?", "tax_exempt?", "state_contract_ceiling_cents?", "credit_limit_cents?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/piano-dealer/customers/{id}", description: "Read customer", roles: [SalesAssociate, StoreManager, FinanceOfficer, InstitutionalBidOfficer, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # --- instruments ---
  - { method: POST, path: "/piano-dealer/instruments", description: "Intake an instrument (new/used/consignment); starts IN_PREP; serial_number unique", roles: [StoreManager], code: 201, input: [serial_number, category, manufacturer, model, year_built, condition_grade, acquisition_type, "consignor_id?", list_price_cents, floor_price_cents, "recoverable_costs_cents?"], output: Instrument, side_effects: [] }
  - { method: GET, path: "/piano-dealer/instruments/{id}", description: "Read instrument", roles: [StoreManager, SalesAssociate, InstitutionalBidOfficer, Consignor], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/piano-dealer/instruments/{id}/list-for-sale", description: "IN_PREP -> AVAILABLE (also REPOSSESSION_HOLD is NOT eligible here)", roles: [StoreManager], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/piano-dealer/instruments/{id}/complete-restoration", description: "RESTORATION_HOLD -> IN_PREP", roles: [StoreManager], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/piano-dealer/instruments/{id}/release-hold", description: "REPOSSESSION_HOLD -> AVAILABLE", roles: [StoreManager], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/piano-dealer/instruments/{id}/return-to-consignor", description: "AVAILABLE consignment instrument -> RETURNED_TO_CONSIGNOR", roles: [StoreManager], code: 200, input: [], output: Instrument, side_effects: [] }

  # --- trade-in appraisals ---
  - { method: POST, path: "/piano-dealer/trade-in-appraisals", description: "Customer trade-in submission; computes provisional_value_cents", roles: [SalesAssociate], code: 201, input: [customer_id, category, manufacturer, model, year_built, condition_grade], output: TradeInAppraisal, side_effects: ["trade_in_valuation PROVISIONAL"] }
  - { method: GET, path: "/piano-dealer/trade-in-appraisals/{id}", description: "Read appraisal", roles: [SalesAssociate, Customer], code: 200, input: [], output: TradeInAppraisal, side_effects: [] }
  - { method: GET, path: "/piano-dealer/trade-in-appraisals", description: "List appraisals, optional customer filter", roles: [SalesAssociate], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "TradeInAppraisal[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/trade-in-appraisals/{id}/evaluate", description: "SUBMITTED or COUNTERED -> OFFERED; computes final_value_cents; refreshes offered_at", roles: [StoreManager], code: 200, input: [reconditioning_cost_cents, market_adjustment_pct], output: TradeInAppraisal, side_effects: ["trade_in_valuation FINAL"] }
  - { method: POST, path: "/piano-dealer/trade-in-appraisals/{id}/counter", description: "OFFERED -> COUNTERED (customer, self)", roles: [Customer], code: 200, input: [counter_value_cents], output: TradeInAppraisal, side_effects: [] }
  - { method: POST, path: "/piano-dealer/trade-in-appraisals/{id}/accept", description: "OFFERED -> ACCEPTED (customer, self); lazy expiry check", roles: [Customer], code: 200, input: [], output: TradeInAppraisal, side_effects: [] }
  - { method: POST, path: "/piano-dealer/trade-in-appraisals/{id}/decline", description: "OFFERED -> DECLINED (customer, self)", roles: [Customer], code: 200, input: [], output: TradeInAppraisal, side_effects: [] }

  # --- institutional bids ---
  - { method: POST, path: "/piano-dealer/bid-packages", description: "Create DRAFT bid; computes institutional_bid_price; customer must be INSTITUTIONAL", roles: [InstitutionalBidOfficer], code: 201, input: [customer_id, lines], output: BidPackage, side_effects: ["institutional_bid_price; prepared_by_user_id := X-User-ID"] }
  - { method: GET, path: "/piano-dealer/bid-packages/{id}", description: "Read bid", roles: [InstitutionalBidOfficer, ComplianceOfficer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: GET, path: "/piano-dealer/bid-packages", description: "List bids, optional customer filter", roles: [InstitutionalBidOfficer, ComplianceOfficer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "BidPackage[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/submit", description: "DRAFT -> SUBMITTED; floor guard: total >= sum of line floor prices", roles: [InstitutionalBidOfficer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/compliance-approve", description: "SUBMITTED -> APPROVED; segregation of duties enforced", roles: [ComplianceOfficer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/return-for-revision", description: "SUBMITTED -> DRAFT (revision cycle)", roles: [ComplianceOfficer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/record-outcome", description: "APPROVED -> AWARDED | LOST", roles: [InstitutionalBidOfficer], code: 200, input: [outcome], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/withdraw", description: "DRAFT|SUBMITTED -> WITHDRAWN", roles: [InstitutionalBidOfficer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/piano-dealer/bid-packages/{id}/revisions", description: "Create-with-supersede revision from SUBMITTED; OCC on expected_bid_version; recomputes pricing; revision_number += 1", roles: [InstitutionalBidOfficer], code: 200, input: [expected_bid_version, lines], output: BidPackage, side_effects: ["institutional_bid_price recompute", "increments BidPackage.version by 1", "revision_number += 1"] }

  # --- sales orders ---
  - { method: POST, path: "/piano-dealer/sales-orders", description: "Create order (payment UNPAID, fulfillment AWAITING_SCHEDULING); computes order_total; reserves instruments", roles: [SalesAssociate], code: 201, input: [customer_id, items, "trade_in_appraisal_id?", "bid_package_id?", tax_rate, distance_miles, stairs_count, climate_controlled_required], output: SalesOrder, side_effects: ["order_total", "line instruments AVAILABLE -> RESERVED"] }
  - { method: GET, path: "/piano-dealer/sales-orders/{id}", description: "Read order", roles: [SalesAssociate, StoreManager, FinanceOfficer, ServiceCoordinator, Customer], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: GET, path: "/piano-dealer/sales-orders", description: "List orders with optional filters", roles: [SalesAssociate, StoreManager, FinanceOfficer], code: 200, input: ["customer_id?", "trade_in_appraisal_id?", "bid_package_id?", "limit?", "offset?"], output: "SalesOrder[]", side_effects: [] }
  - { method: PATCH, path: "/piano-dealer/sales-orders/{id}", description: "Amend an UNPAID order; OCC on expected_order_version; recomputes order_total", roles: [SalesAssociate], code: 200, input: [expected_order_version, "items?", "tax_rate?", "distance_miles?", "stairs_count?", "climate_controlled_required?"], output: SalesOrder, side_effects: ["order_total recompute", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/piano-dealer/sales-orders/{id}/payments", description: "Post a payment; < balance -> DEPOSIT_PAID, == balance -> PAID_IN_FULL", roles: [SalesAssociate], code: 200, input: [amount_cents, method], output: SalesOrder, side_effects: ["on PAID_IN_FULL: instruments -> SOLD, consignment payouts posted"] }
  - { method: POST, path: "/piano-dealer/sales-orders/{id}/confirm-installation", description: "DELIVERED -> INSTALLED; sets installed_at", roles: [StoreManager, Customer], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/piano-dealer/sales-orders/{id}/complete-return", description: "INSTALLED + PAID_IN_FULL + within 14 days -> RETURNED/REFUNDED with full cascade", roles: [StoreManager], code: 200, input: [], output: SalesOrder, side_effects: ["cascade: instruments -> IN_PREP, warranties -> VOID, risk_score -= 25 per voided warranty, ACTIVE financing -> CANCELLED"] }
  - { method: POST, path: "/piano-dealer/sales-orders/{id}/cancel", description: "UNPAID + AWAITING_SCHEDULING -> fulfillment CANCELLED; releases reservations", roles: [SalesAssociate], code: 200, input: [], output: SalesOrder, side_effects: ["instruments RESERVED -> AVAILABLE"] }

  # --- delivery resources ---
  - { method: POST, path: "/piano-dealer/delivery-crews", description: "Register a delivery crew", roles: [StoreManager], code: 201, input: [crew_name, climate_certified], output: DeliveryCrew, side_effects: [] }
  - { method: POST, path: "/piano-dealer/technicians", description: "Register a service technician", roles: [StoreManager], code: 201, input: [full_name, certification_level], output: Technician, side_effects: [] }
  - { method: POST, path: "/piano-dealer/delivery-jobs", description: "Schedule delivery; crew half-open window overlap with mandatory 30-min post-job travel buffer; climate-certified crew required when order demands it", roles: [ServiceCoordinator], code: 201, input: [order_id, crew_id, window_start, window_end], output: DeliveryJob, side_effects: ["order fulfillment AWAITING_SCHEDULING -> DELIVERY_SCHEDULED"] }
  - { method: GET, path: "/piano-dealer/delivery-jobs/{id}", description: "Read delivery job", roles: [ServiceCoordinator], code: 200, input: [], output: DeliveryJob, side_effects: [] }
  - { method: GET, path: "/piano-dealer/delivery-jobs", description: "List delivery jobs with optional filters", roles: [ServiceCoordinator, StoreManager], code: 200, input: ["order_id?", "crew_id?", "limit?", "offset?"], output: "DeliveryJob[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/delivery-jobs/{id}/start", description: "SCHEDULED -> EN_ROUTE; order -> OUT_FOR_DELIVERY", roles: [ServiceCoordinator], code: 200, input: [], output: DeliveryJob, side_effects: [] }
  - { method: POST, path: "/piano-dealer/delivery-jobs/{id}/complete", description: "EN_ROUTE -> COMPLETED; order -> DELIVERED (delivered_at), instruments -> DELIVERED", roles: [ServiceCoordinator], code: 200, input: [], output: DeliveryJob, side_effects: [] }
  - { method: POST, path: "/piano-dealer/delivery-jobs/{id}/fail", description: "EN_ROUTE -> FAILED; order back to DELIVERY_SCHEDULED", roles: [ServiceCoordinator], code: 200, input: [], output: DeliveryJob, side_effects: [] }
  - { method: POST, path: "/piano-dealer/delivery-jobs/{id}/reschedule", description: "FAILED -> SCHEDULED with new window (same overlap/climate checks as create)", roles: [ServiceCoordinator], code: 200, input: [window_start, window_end], output: DeliveryJob, side_effects: [] }

  # --- service plans & visits ---
  - { method: POST, path: "/piano-dealer/service-plans", description: "Attach a service plan to an INSTALLED order; computes service_plan_price", roles: [ServiceCoordinator], code: 201, input: [order_id, tier], output: ServicePlan, side_effects: ["service_plan_price"] }
  - { method: GET, path: "/piano-dealer/service-plans/{id}", description: "Read plan", roles: [ServiceCoordinator, Customer], code: 200, input: [], output: ServicePlan, side_effects: [] }
  - { method: GET, path: "/piano-dealer/service-plans", description: "List plans, optional order filter", roles: [ServiceCoordinator], code: 200, input: ["order_id?", "limit?", "offset?"], output: "ServicePlan[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/service-plans/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [ServiceCoordinator], code: 200, input: [], output: ServicePlan, side_effects: [] }
  - { method: POST, path: "/piano-dealer/service-plans/{id}/resume", description: "SUSPENDED -> ACTIVE", roles: [ServiceCoordinator], code: 200, input: [], output: ServicePlan, side_effects: [] }
  - { method: POST, path: "/piano-dealer/service-plans/{id}/cancel", description: "ACTIVE|SUSPENDED -> CANCELLED; cancels open visits", roles: [ServiceCoordinator], code: 200, input: [], output: ServicePlan, side_effects: ["BOOKED visits -> CANCELLED; visits_booked := 0"] }
  - { method: POST, path: "/piano-dealer/service-visits", description: "Book a tuning/regulation visit; technician closed-interval overlap; max 4 visits per technician per UTC day; consumes one plan credit while BOOKED", roles: [ServiceCoordinator], code: 201, input: [plan_id, technician_id, window_start, window_end], output: ServiceVisit, side_effects: ["plan.visits_booked += 1"] }
  - { method: GET, path: "/piano-dealer/service-visits/{id}", description: "Read visit", roles: [ServiceCoordinator], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: GET, path: "/piano-dealer/service-visits", description: "List visits with optional filters", roles: [ServiceCoordinator], code: 200, input: ["plan_id?", "technician_id?", "limit?", "offset?"], output: "ServiceVisit[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/service-visits/{id}/complete", description: "BOOKED -> COMPLETED; plan visits_booked -= 1, visits_used += 1; plan may auto-EXHAUST", roles: [ServiceCoordinator], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: POST, path: "/piano-dealer/service-visits/{id}/cancel", description: "BOOKED -> CANCELLED; releases the held credit", roles: [ServiceCoordinator], code: 200, input: [], output: ServiceVisit, side_effects: ["plan.visits_booked -= 1"] }

  # --- financing ---
  - { method: POST, path: "/piano-dealer/financing-agreements", description: "Apply for financing on an UNPAID order; principal must equal order.total_cents; computes financing_schedule", roles: [FinanceOfficer], code: 201, input: [order_id, program, principal_cents, "apr?", term_months], output: FinancingAgreement, side_effects: ["financing_schedule"] }
  - { method: GET, path: "/piano-dealer/financing-agreements/{id}", description: "Read agreement", roles: [FinanceOfficer, Customer], code: 200, input: [], output: FinancingAgreement, side_effects: [] }
  - { method: GET, path: "/piano-dealer/financing-agreements", description: "List agreements, optional order filter", roles: [FinanceOfficer], code: 200, input: ["order_id?", "limit?", "offset?"], output: "FinancingAgreement[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/financing-agreements/{id}/approve", description: "APPLIED -> ACTIVE; credit-limit check; order -> FINANCED_ACTIVE, instruments -> SOLD", roles: [FinanceOfficer], code: 200, input: [], output: FinancingAgreement, side_effects: ["activated_at := now"] }
  - { method: POST, path: "/piano-dealer/financing-agreements/{id}/payments", description: "Post exactly one monthly payment; payments_made reaching term_months -> PAID_OFF and order -> PAID_IN_FULL", roles: [FinanceOfficer], code: 200, input: [amount_cents], output: FinancingAgreement, side_effects: [] }
  - { method: POST, path: "/piano-dealer/financing-agreements/{id}/convert-to-purchase", description: "RENT_TO_OWN ACTIVE -> CONVERTED_TO_PURCHASE; computes purchase_credit; order -> PAID_IN_FULL", roles: [FinanceOfficer], code: 200, input: [], output: FinancingAgreement, side_effects: [] }
  - { method: POST, path: "/piano-dealer/financing-agreements/{id}/declare-default", description: "ACTIVE with missed_payments >= 3 -> DEFAULTED; order -> COLLECTIONS; instruments -> REPOSSESSION_HOLD; risk_score -= 150", roles: [FinanceOfficer], code: 200, input: [], output: FinancingAgreement, side_effects: ["cascade to order and instruments"] }

  # --- warranties ---
  - { method: POST, path: "/piano-dealer/warranty-registrations", description: "Start manufacturer registration; order DELIVERED/INSTALLED; within delivered_at + 60 days", roles: [SalesAssociate], code: 201, input: [order_id, instrument_id], output: WarrantyRegistration, side_effects: [] }
  - { method: GET, path: "/piano-dealer/warranty-registrations/{id}", description: "Read warranty (lazy EXPIRED applied on read)", roles: [SalesAssociate, StoreManager], code: 200, input: [], output: WarrantyRegistration, side_effects: ["lazy EXPIRED transition"] }
  - { method: GET, path: "/piano-dealer/warranty-registrations", description: "List warranties with optional filters", roles: [SalesAssociate, StoreManager], code: 200, input: ["order_id?", "instrument_id?", "limit?", "offset?"], output: "WarrantyRegistration[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/warranty-registrations/{id}/confirm", description: "PENDING -> REGISTERED; sets registered_at and computes coverage_end", roles: [StoreManager], code: 200, input: [], output: WarrantyRegistration, side_effects: ["warranty_coverage_end"] }

  # --- restoration referrals ---
  - { method: POST, path: "/piano-dealer/restoration-referrals", description: "Refer an instrument to a restoration shop", roles: [StoreManager], code: 201, input: [instrument_id, shop_name], output: RestorationReferral, side_effects: [] }
  - { method: GET, path: "/piano-dealer/restoration-referrals/{id}", description: "Read referral", roles: [StoreManager], code: 200, input: [], output: RestorationReferral, side_effects: [] }
  - { method: GET, path: "/piano-dealer/restoration-referrals", description: "List referrals, optional instrument filter", roles: [StoreManager], code: 200, input: ["instrument_id?", "limit?", "offset?"], output: "RestorationReferral[]", side_effects: [] }
  - { method: POST, path: "/piano-dealer/restoration-referrals/{id}/assess", description: "REFERRED -> ASSESSED", roles: [StoreManager], code: 200, input: [condition_score, estimate_low_cents, estimate_high_cents], output: RestorationReferral, side_effects: [] }
  - { method: POST, path: "/piano-dealer/restoration-referrals/{id}/quote", description: "ASSESSED -> QUOTED", roles: [StoreManager], code: 200, input: [final_quote_cents], output: RestorationReferral, side_effects: [] }
  - { method: POST, path: "/piano-dealer/restoration-referrals/{id}/record-decision", description: "QUOTED -> COMMISSIONED (instrument -> RESTORATION_HOLD) | DECLINED", roles: [StoreManager], code: 200, input: [decision], output: RestorationReferral, side_effects: ["COMMISSIONED: instrument AVAILABLE -> RESTORATION_HOLD"] }

  # --- showroom events ---
  - { method: POST, path: "/piano-dealer/showroom-events", description: "Create event; room half-open overlap (back-to-back allowed) vs non-CANCELLED events in same room", roles: [StoreManager], code: 201, input: [room, title, start_at, end_at, capacity, artist_guarantee_cents, split_pct], output: ShowroomEvent, side_effects: [] }
  - { method: GET, path: "/piano-dealer/showroom-events/{id}", description: "Read event", roles: [StoreManager, SalesAssociate], code: 200, input: [], output: ShowroomEvent, side_effects: [] }
  - { method: POST, path: "/piano-dealer/showroom-events/{id}/open-rsvp", description: "PLANNED -> RSVP_OPEN", roles: [StoreManager], code: 200, input: [], output: ShowroomEvent, side_effects: [] }
  - { method: POST, path: "/piano-dealer/showroom-events/{id}/rsvps", description: "Add party_size seats (default 1); rsvp_count + party_size <= capacity", roles: [SalesAssociate], code: 201, input: ["party_size?"], output: ShowroomEvent, side_effects: ["rsvp_count += party_size"] }
  - { method: POST, path: "/piano-dealer/showroom-events/{id}/settle", description: "RSVP_OPEN + clock >= end_at -> SETTLED; computes artist_payout", roles: [StoreManager], code: 200, input: [gross_cents], output: ShowroomEvent, side_effects: ["artist_payout"] }
  - { method: POST, path: "/piano-dealer/showroom-events/{id}/cancel", description: "PLANNED|RSVP_OPEN -> CANCELLED; frees the room window", roles: [StoreManager], code: 200, input: [], output: ShowroomEvent, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint, or self-service identity mismatch (Customer acting on another customer's resource, Consignor reading another consignor)" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "ComplianceOfficer attempts to approve a bid whose prepared_by_user_id equals the officer's own X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed interval (end <= start), principal mismatch, non-exact financing payment, or other schema/semantic rejection not covered below" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id or body FK reference does not exist" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Instrument serial_number already exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_INSTRUMENT_NOT_AVAILABLE, http: 409, condition: "Instrument not in the state required by the operation (order line requires AVAILABLE; referral commission requires AVAILABLE; return-to-consignor requires AVAILABLE)" }
  - { id: ERR_ORDER_NOT_PAYABLE, http: 409, condition: "Payment/cancel/return attempted when payment_status does not permit it" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds order balance" }
  - { id: ERR_APPRAISAL_NOT_OFFERED, http: 409, condition: "Appraisal not in OFFERED (for accept/counter/decline) or not in SUBMITTED/COUNTERED (for evaluate)" }
  - { id: ERR_APPRAISAL_EXPIRED, http: 409, condition: "Accept/counter attempted after offered_at + 14 days; appraisal transitions to EXPIRED" }
  - { id: ERR_TRADE_IN_NOT_ACCEPTED, http: 422, condition: "trade_in_appraisal_id references an appraisal that is not ACCEPTED or not owned by the order customer" }
  - { id: ERR_BID_NOT_ACTIONABLE, http: 409, condition: "Bid not in the state required by the transition, or order creation references a bid that is not AWARDED" }
  - { id: ERR_BID_BELOW_FLOOR, http: 422, condition: "Bid total_cents below the sum of line instruments' floor_price_cents at submit" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Financing principal exceeds customer.credit_limit_cents at approve" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Delivery window collides with another SCHEDULED/EN_ROUTE job of the same crew under half-open + 30-minute travel-buffer semantics" }
  - { id: ERR_CLIMATE_REQUIREMENT_UNMET, http: 422, condition: "Order requires climate-controlled delivery but assigned crew is not climate_certified" }
  - { id: ERR_DELIVERY_NOT_ACTIONABLE, http: 409, condition: "Delivery/order fulfillment state does not permit the operation (e.g., scheduling an UNPAID order, starting a non-SCHEDULED job, installing a non-DELIVERED order)" }
  - { id: ERR_TECHNICIAN_WINDOW_CONFLICT, http: 409, condition: "Service visit collides with another BOOKED visit of the same technician under closed-interval semantics (shared endpoints conflict)" }
  - { id: ERR_TECHNICIAN_DAY_CAPACITY_REACHED, http: 409, condition: "Technician already has 4 BOOKED visits on the same UTC calendar day" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Service plan not in the state required (booking requires ACTIVE; suspend requires ACTIVE; resume requires SUSPENDED)" }
  - { id: ERR_PLAN_EXHAUSTED, http: 409, condition: "Booking attempted when visits_available == 0" }
  - { id: ERR_AGREEMENT_NOT_CONVERTIBLE, http: 409, condition: "convert-to-purchase attempted on a non-ACTIVE or non-RENT_TO_OWN agreement" }
  - { id: ERR_WARRANTY_WINDOW_CLOSED, http: 422, condition: "Registration attempted more than 60 days after order.delivered_at" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "complete-return attempted more than 14 days after installed_at" }
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "Event window overlaps a non-CANCELLED event in the same room under half-open semantics (end == start of another event is allowed)" }
  - { id: ERR_EVENT_CAPACITY_EXCEEDED, http: 409, condition: "rsvp_count + party_size would exceed event capacity" }
  - { id: ERR_EVENT_NOT_SETTLABLE, http: 409, condition: "Event not in the required state, or settle attempted before end_at" }
  - { id: ERR_REFERRAL_NOT_ACTIONABLE, http: 409, condition: "Referral not in the state required by assess/quote/record-decision" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Test-driving operator; controls the logical clock only"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/_clock/set_current_utc"]
    shared_operations: []
  - name: StoreManager
    description: "Dealer principal; owns inventory lifecycle, consignors, appraisals evaluation, returns, warranties confirmation, restoration, events, crews/technicians"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/consignors", "POST /piano-dealer/instruments", "instrument lifecycle actions", "POST /piano-dealer/trade-in-appraisals/{id}/evaluate", "POST /piano-dealer/sales-orders/{id}/complete-return", "POST /piano-dealer/delivery-crews", "POST /piano-dealer/technicians", "warranty confirm", "restoration referral lifecycle", "showroom event lifecycle (create/open/settle/cancel)"]
    shared_operations: ["GET reads on consignors/customers/orders/warranties/events", "POST /piano-dealer/sales-orders/{id}/confirm-installation"]
  - name: SalesAssociate
    description: "Retail salesperson; owns customers, order intake, payments, appraisal intake, warranty initiation, RSVPs"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/customers", "POST /piano-dealer/sales-orders", "PATCH /piano-dealer/sales-orders/{id}", "POST /piano-dealer/sales-orders/{id}/payments", "POST /piano-dealer/sales-orders/{id}/cancel", "POST /piano-dealer/trade-in-appraisals", "POST /piano-dealer/warranty-registrations", "POST /piano-dealer/showroom-events/{id}/rsvps"]
    shared_operations: ["GET reads on instruments/appraisals/orders/warranties/events"]
  - name: InstitutionalBidOfficer
    description: "Prepares and submits institutional bids; records outcomes; cannot compliance-approve"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/bid-packages", "POST /piano-dealer/bid-packages/{id}/submit", "POST /piano-dealer/bid-packages/{id}/record-outcome", "POST /piano-dealer/bid-packages/{id}/withdraw", "POST /piano-dealer/bid-packages/{id}/revisions"]
    shared_operations: ["GET /piano-dealer/bid-packages*", "GET /piano-dealer/customers/{id}", "GET /piano-dealer/instruments/{id}"]
  - name: ComplianceOfficer
    description: "State-contract compliance reviewer; approves or returns bids; barred from approving bids prepared by the same X-User-ID"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/bid-packages/{id}/compliance-approve", "POST /piano-dealer/bid-packages/{id}/return-for-revision"]
    shared_operations: ["GET /piano-dealer/bid-packages*"]
  - name: ServiceCoordinator
    description: "Schedules delivery crews and tuning technicians; manages service plans and visits"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/delivery-jobs", "delivery job start/complete/fail/reschedule", "POST /piano-dealer/service-plans", "service plan suspend/resume/cancel", "POST /piano-dealer/service-visits", "service visit complete/cancel"]
    shared_operations: ["GET reads on orders/jobs/plans/visits"]
  - name: FinanceOfficer
    description: "Owns financing lifecycle from application through default"
    identity: opaque
    exclusive_operations: ["POST /piano-dealer/financing-agreements", "approve", "payments", "convert-to-purchase", "declare-default"]
    shared_operations: ["GET reads on orders/customers/agreements"]
  - name: Customer
    description: "Retail or institutional buyer; self-service on own appraisals and order visibility"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /piano-dealer/trade-in-appraisals/{id}/counter", "POST /piano-dealer/trade-in-appraisals/{id}/accept", "POST /piano-dealer/trade-in-appraisals/{id}/decline"]
    shared_operations: ["GET own orders/appraisals/plans/agreements", "POST /piano-dealer/sales-orders/{id}/confirm-installation (own order)"]
  - name: Consignor
    description: "Instrument consignor; read-only access to own record and consigned instruments"
    identity: "entity_backed:Consignor"
    exclusive_operations: []
    shared_operations: ["GET /piano-dealer/consignors/{id} (self)", "GET /piano-dealer/consignors/{id}/instruments (self)", "GET /piano-dealer/instruments/{id}"]
