      - name: hour_approve_reverse_conserves_hours
        grounds:
          - state_machines.HourEntry.PENDING_to_APPROVED
          - state_machines.HourEntry.APPROVED_to_REVERSED
          - calculations.recognition_points_weighted
        distinguishing_aspect: |
          Conserved quantity = volunteer service hours and recognition points (third
          distinct quantity): approve(120min PATIENT_FACING) moves total_service_hours
          0.00 -> 2.00 and points 0.00 -> 3.00; the compensating reverse returns both to
          EXACTLY 0.00 with tier back to NONE.
