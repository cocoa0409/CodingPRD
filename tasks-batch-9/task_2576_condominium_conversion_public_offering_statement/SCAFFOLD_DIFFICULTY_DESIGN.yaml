        grounds:
          - state_machines.PublicOfferingStatement.EFFECTIVE_to_AMENDMENT_FILED
          - state_machines.PurchaseAgreement.HARD_to_SIGNED
          - calculations.rescission_deadline
          - calculations.warrantability_ratios
          - entities.PublicOfferingStatement.fields.last_material_amendment_at
          - entities.PurchaseAgreement.fields.rescission_restart_count
          - entities.Unit.fields.sale_status
          - entities.ConversionProject.fields.posture
        distinguishing_aspect: |
          The triggering transition is PublicOfferingStatement EFFECTIVE -> AMENDMENT_FILED with
          material_change true, and each hop is caused by the previous one: writing
          last_material_amendment_at forces the HARD PurchaseAgreement back to SIGNED with a
          restarted rescission deadline, the agreement leaving HARD forces
          Unit.sale_status HARD_CONTRACT -> UNDER_CONTRACT, and that unit demotion drops
          ConversionProject.presale_sold_pct to 0.00 - a POS-rooted chain, distinct from the
          Unit-withdrawal-rooted chain of the sibling instance.
