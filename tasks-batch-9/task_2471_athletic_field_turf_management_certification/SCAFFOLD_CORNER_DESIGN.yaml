              as_user_id: ${s_coord}
              captures: { b_sy: $.data.id }
            - call: "POST /turf/usage-bookings/${b_ng}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: ${s_coord}
            - call: "POST /turf/usage-bookings/${b_sy}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: ${s_coord}
            - call: "POST /_clock/set_current_utc"
