  - section: rbac
    instances:

      - name: peer_role_boundaries_reject_operations_owned_by_other_roles
        claim_type: peer_roles
        grounds:
          - roles[ReceivingTech]
          - roles[InventoryLead]
          - roles[CircClinician]
          - roles[VendorRep]
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Four exclusive operations are each attempted by a role that does not own them and every attempt returns ERR_UNAUTHORIZED (403): ReceivingTech creating a vendor, CircClinician running an ops-run, RevenueIntegrityAnalyst drafting a field action, and VendorRep reading a patient."
        test_recipe:
          setup: ["One Vendor and one Patient exist so the reads have real targets."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
