# =============================================================================
# task_0773_personal_concierge — §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims from §1.1–§1.7 not already covered by §1.8.
# Same 7-point per-instance contract as §1.8. Structured, reachable chains.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: member_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Member.fields.status, entities.Member.fields.lifetime_billed_cents]
        distinguishing_aspect: "POST /concierge/members returns 201 with status PENDING, lifetime_billed_cents 0, server-minted id, and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /concierge/members", payload: { full_name: "Ann", email: "ann@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "Member.${m_id}.status == PENDING"
            - "Member.${m_id}.lifetime_billed_cents == 0"
            - "Member.${m_id}.version == 1"

      - name: member_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET./concierge/members/{id}"]
        distinguishing_aspect: "GET on a non-existent member id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /concierge/members/00000000-0000-4000-8000-000000000000", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: member_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "validations[priority=5]"]
        distinguishing_aspect: "POST /concierge/members without the required email field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /concierge/members", payload: { full_name: "NoEmail" }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: retainer_plan_default_markup_applied
        claim_type: Defaults
        grounds: [entities.RetainerPlan.fields.default_markup_pct]
        distinguishing_aspect: "Omitting default_markup_pct on plan create applies the default 0.15."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /concierge/retainer-plans", payload: { name: "Base", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "RetainerPlan.${plan_id}.default_markup_pct == 0.15"

      - name: request_priority_score_computed
        claim_type: Computed Fields
        grounds: [calculations.request_priority_score, entities.ServiceRequest.fields.priority_score]
        distinguishing_aspect: "A GOLD membership's rush TRAVEL request has priority_score == TIER_WEIGHT[GOLD]3 + CATEGORY_WEIGHT[TRAVEL]3 + RUSH_BONUS 2 == 8."
        test_recipe:
          setup: ["ACTIVE member + ACTIVE GOLD membership"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Gp", email: "gp@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "TRAVEL", title: "flight", rush: true }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          assert:
            - "ServiceRequest.${sr_id}.priority_score == 8"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: accept_from_fulfilled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.SUBMITTED_to_IN_PROGRESS, state_machines.ServiceRequest.IN_PROGRESS_to_FULFILLED]
        distinguishing_aspect: "Accepting a request that is already FULFILLED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE member + membership; one request accepted then fulfilled"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "S1", email: "s1@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "t" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr_id}/fulfill", payload: {}, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/accept", payload: { scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T10:00:00Z" }, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: fulfill_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.IN_PROGRESS_to_FULFILLED]
        distinguishing_aspect: "Fulfilling a SUBMITTED (never accepted) request returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE member + membership; one SUBMITTED request"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "S2", email: "s2@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "t" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/fulfill", payload: {}, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: reconcile_from_proposed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.VendorEngagement.CONFIRMED_to_RECONCILED]
        distinguishing_aspect: "Reconciling a PROPOSED (unconfirmed) engagement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE member + membership; BOOKING request; PROPOSED engagement"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "S3", email: "s3@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/reconcile", payload: { actual_cost_lines: [1000] }, as: FinanceOps, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: time_entry_double_reverse_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TimeEntry.FINALIZED_to_REVERSED]
        distinguishing_aspect: "Reversing an already REVERSED time entry a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE member + membership; one time entry logged then reversed"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "S4", email: "s4@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "t" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/time-entries", payload: { minutes: 30 }, as: ConciergeAgent, captures: { te_id: "$.data.id" } }
            - { call: "POST /concierge/time-entries/${te_id}/reverse", payload: {}, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/time-entries/${te_id}/reverse", payload: {}, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: membership_cancel_blocked_by_active_request
        claim_type: Precondition Enforcement
        grounds: [state_machines.Membership.ACTIVE_to_CANCELLED, "validations[priority=22]"]
        distinguishing_aspect: "Cancelling a membership that has a SUBMITTED request returns ERR_CYCLE_HAS_ACTIVE_REQUESTS (409)."
        test_recipe:
          setup: ["ACTIVE member + ACTIVE membership with one SUBMITTED request"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "S5", email: "s5@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "t" }, as: Member, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /concierge/memberships/${ms_id}/cancel", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_CYCLE_HAS_ACTIVE_REQUESTS"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: passthrough_charge_has_no_markup
        claim_type: Correct Result
        grounds: [calculations.engagement_client_charge, entities.VendorEngagement.fields.billing_mode]
        distinguishing_aspect: "A PASS_THROUGH engagement with lines [1000,2000] confirms to client_charge_cents == 3000 (plain sum, no markup)."
        test_recipe:
          setup: ["ACTIVE member + membership; ACTIVE BOOKING vendor; BOOKING request; PASS_THROUGH engagement lines [1000,2000] each <= max_pass_through 40000"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "C1", email: "c1@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "PASS_THROUGH", estimated_cost_lines: [1000,2000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
          assert:
            - "VendorEngagement.${eng_id}.client_charge_cents == 3000"
            - "VendorEngagement.${eng_id}.charge_basis == PROVISIONAL"

      - name: outstanding_excludes_proposed_engagement
        claim_type: Input Set Filtering
        grounds: [calculations.membership_outstanding_balance, entities.VendorEngagement.fields.status]
        distinguishing_aspect: "A PROPOSED (unconfirmed) engagement does not enter outstanding_balance_cents, which stays 0."
        test_recipe:
          setup: ["ACTIVE member + membership; BOOKING request; PROPOSED engagement (never confirmed)"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "C2", email: "c2@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent }
          trigger:
            - { call: "GET /concierge/memberships/${ms_id}", payload: {}, as: AccountManager }
          assert:
            - "Membership.${ms_id}.outstanding_balance_cents == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: category_not_eligible_travel_for_standard_tier
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", entities.Membership.fields.vip_tier]
        distinguishing_aspect: "A STANDARD-tier ACTIVE membership requesting TRAVEL returns ERR_CATEGORY_NOT_ELIGIBLE (422) with the membership active (isolating the eligibility rule)."
        test_recipe:
          setup: ["ACTIVE member + ACTIVE STANDARD membership"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "V1", email: "v1@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "TRAVEL", title: "flight" }, as: Member, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_CATEGORY_NOT_ELIGIBLE"

      - name: passthrough_line_over_limit_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", entities.RetainerPlan.fields.max_pass_through_cents]
        distinguishing_aspect: "A PASS_THROUGH engagement whose vendor category matches the request but whose line 60000 exceeds max_pass_through 50000 returns ERR_PASS_THROUGH_LIMIT_EXCEEDED (422)."
        test_recipe:
          setup: ["ACTIVE member + membership; ACTIVE BOOKING vendor matching a BOOKING request; plan max_pass_through 50000"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "V2", email: "v2@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "PASS_THROUGH", estimated_cost_lines: [60000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_PASS_THROUGH_LIMIT_EXCEEDED"

      - name: markup_on_pass_through_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", entities.VendorEngagement.fields.markup_pct]
        distinguishing_aspect: "A PASS_THROUGH engagement carrying markup_pct 0.10 returns ERR_MARKUP_ON_PASS_THROUGH (422)."
        test_recipe:
          setup: ["ACTIVE member + membership; ACTIVE BOOKING vendor; BOOKING request"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "V3", email: "v3@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
