# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances, all grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calcs on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: attainment_provisional_vs_final_season_domain
        grounds:
          - calculations.forecast_attainment_pct
          - entities.CookieSeason.fields.forecast_attainment_pct
        distinguishing_aspect: |
          Entity domain = CookieSeason supply metrics. For identical data (1
          CONFIRMED order of 120 units + 1 SUBMITTED order of 60 units against
          purchased_units=200), the provisional variant reports
          (120+60)/200 = 90.00 while the final/gate variant reports 120/200 =
          60.00 — same inputs, different numbers, and the gate uses ONLY final.
        test_recipe:
          setup:
            - "Season COOKIE-2027 in OPEN with ordering window covering 2027-01-10"
            - "One product TM (price 600, proceeds 100, case 1)"
            - "One site S1 capacity 10000; PO for TM quantity 200 placed (purchased_units=200)"
            - "Troop T1 account; order A INITIAL 120 units CONFIRMED; order B INITIAL 60 units SUBMITTED (pending)"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2027", name: "Season 2027", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: ["WHEAT"], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 200, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 120 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_b: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_b}/lines"
              payload: { product_id: "${p_tm}", package_qty: 60 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_b}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
          trigger:
            - call: "GET /cookie-program/seasons/${s_id}"
              payload: {}
              as: CouncilAdmin
              captures: { s_read: $.data }
          assert:
            - "CookieSeason.${s_id}.forecast_attainment_pct == 60.00 (final variant: 120/200, pending order B excluded from gate numerator)"
            - "CookieSeason.${s_id}.pending_commit_units == 60"
            - "CookieSeason.${s_id}.initial_commit_units == 120"
            - "CookieSeason.${s_id}.status == OPEN (gate 80.00 not met by final variant even though provisional would be 90.00)"

      - name: proceeds_settlement_offset_vs_payable_troop_domain
        grounds:
          - calculations.troop_proceeds_settlement
          - calculations.per_unit_proceeds_blended
          - state_machines.CookieSeason.RECONCILIATION_to_CLOSED
        distinguishing_aspect: |
          Entity domain = TroopAccount money (distinct from the CookieSeason
          supply-metric instance above). Same accrued proceeds produce two
          different observable outcomes depending on balance sign: a troop with
          balance_cents > proceeds sees payable = 0 and a reduced debt, while a
          troop with balance_cents <= proceeds sees balance 0-or-credit and
          payable = remainder. Computed here: proceeds 12000 vs charge 72000 ->
          balance 60000, payable 0.
        test_recipe:
          setup:
            - "Season SELLING->RECONCILIATION with troop T1 having one CONFIRMED INITIAL order: 120 units of TM (unit 600, proceeds 100)"
            - "Account: balance_cents = 72000 (charge), proceeds_accrued_cents = 12000"
            - "No transfers in flight, no PENDING booth requests, no uncollected agreements, no DRAFT recalls"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2028", name: "Season 2028", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 150, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
              captures: { acct1: $.data.id }
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 120 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/begin-reconciliation"
              payload: {}
              as: CouncilAdmin
              captures: { s_recon: $.data.status }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/close-out"
              payload: {}
              as: CouncilAdmin
              captures: { close_out: $.data }
          assert:
            - "close_out.total_proceeds_offset_cents == 12000"
            - "GET account shows balance_cents == 60000 (72000 - 12000 offset; proceeds did not exceed debt so payable == 0)"
            - "CookieSeason.${s_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes (a) vs (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: digital_order_total_mode_a_nonlinear_donation_blend
        grounds:
          - calculations.digital_order_total
          - entities.DigitalOrder.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear conditional interaction —
          total depends on per-item price x qty, PLUS donation_units priced at
          the season-wide average (round_half_up) which itself depends on the
          product catalog cardinality. Inputs: item qtys (12 TM @600), item
          prices, donation_units (3), catalog prices (600, 700 -> avg 650).
          Expected: 12*600 + 3*650 = 7200 + 1950 = 9150.
        test_recipe:
          setup:
            - "Season SELLING with products TM (600) and SD (700), case 1 each"
            - "Troop T1 active"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2029", name: "Season 2029", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "SD", name: "Samoas", unit_price_cents: 700, troop_proceeds_cents: 110, allergen_tags: ["TREE_NUT"], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_sd: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 1000, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 800 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/digital-orders"
              payload:
                troop_id: "${t1}"
                customer_email: "c1@example.com"
                fulfillment_type: "SHIPPED"
                donation_units: 3
                items: [{ product_id: "${p_tm}", package_qty: 12 }]
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { do1: $.data.id, do1_total: $.data.total_amount_cents }
          assert:
            - "DigitalOrder.${do1}.total_amount_cents == 9150 (items 12*600=7200; donation avg round_half_up((600+700)/2)=650; 3*650=1950; 7200+1950)"

      - name: closeout_waterfall_mode_c_order_pinned_forfeit_then_offset
        grounds:
          - calculations.troop_proceeds_settlement
          - state_machines.ParticipantAgreement.PENDING_to_FORFEITED
          - state_machines.CookieSeason.RECONCILIATION_to_CLOSED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          close-out balance depends on proceeds offset, but proceeds offset
          applies only AFTER forfeiture charges post; and forfeiture amount
          itself depends on outstanding_cents which feeds uncollected/balance.
          Scaffold pins: forfeit first, then proceeds offset. With
          outstanding 5000 (forfeiture charge) and proceeds 12000 vs prior
          charge 72000: balance = 72000 + 5000 - 12000 = 65000. If the order
          were reversed (offset then forfeit) the intermediate values differ
          even though the final matches — the pinned order is observable via
          the close-out response's forfeited_agreements and offset fields and
          via intermediate agreement/account reads.
        test_recipe:
          setup:
            - "Season RECONCILIATION; troop T1: confirmed order 120 units TM (charge 72000, proceeds 12000)"
            - "ParticipantAgreement for T1: assigned 10 packages, paid 0 -> outstanding = 10 * 600 = 6000 (season has only TM at 600); status PENDING"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2030", name: "Season 2030", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 150, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
              captures: { acct1: $.data.id }
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 120 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops/${t1}/agreements"
              payload: { season_id: "${s_id}", participant_name: "Scout A", parent_name: "Parent A", signed_responsibility: true, assigned_packages: 10, paid_amount_cents: 0 }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { ag1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/begin-reconciliation"
              payload: {}
              as: CouncilAdmin
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/close-out"
              payload: {}
              as: CouncilAdmin
              captures: { close_out: $.data }
          assert:
            - "close_out.forfeited_agreements == 1"
            - "close_out.total_proceeds_offset_cents == 12000"
            - "TroopAccount balance_cents == 66000 (72000 + 6000 forfeiture - 12000 proceeds offset, in pinned order)"
            - "ParticipantAgreement.${ag1}.status == FORFEITED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_ship_signature_retraction_cycle
        grounds:
          - state_machines.InventoryTransfer.REQUESTED_to_SHIPPER_SIGNED
          - state_machines.InventoryTransfer.SHIPPER_SIGNED_to_REQUESTED
          - calculations.site_available_units
        distinguishing_aspect: |
          Cycle on InventoryTransfer: REQUESTED -> SHIPPER_SIGNED -> REQUESTED
          via retract-ship-signature. The cycle is observable through the site
          hold: sign-ship places hold (hold_units += qty), retract releases it
          (hold_units -= qty) — completing the loop must restore the site's
          pre-cycle available_units exactly.
        test_recipe:
          setup:
            - "Season SELLING; site S1 received 500 TM; troop T1 with account"
            - "Cupboard-to-troop transfer of 24 TM from site S1 to T1"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2031", name: "S31", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 12 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 600, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/record-delivery"
              payload: { delivered_now: 600 }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 480 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/transfers"
              payload: { season_id: "${s_id}", product_id: "${p_tm}", package_qty: 24, dest_troop_id: "${t1}", site_id: "${site1}" }
              as: CouncilAdmin
              captures: { tr1: $.data.id, tr1_v: $.data.version }
            - call: "POST /cookie-program/transfers/${tr1}/sign-ship"
              payload: {}
              as: CouncilAdmin
          trigger:
            - call: "POST /cookie-program/transfers/${tr1}/retract-ship-signature"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { tr1_after: $.data }
          assert:
            - "InventoryTransfer.${tr1}.status == REQUESTED (cycle back to origin)"
            - "InventoryTransfer.${tr1}.shipper_signed_by_troop_id == null"
            - "DistributionSite.${site1}.hold_units == 0 (hold released)"
            - "DistributionSite.${site1}.available_units == 600 (restored to pre-cycle)"

      - name: digital_order_parallel_payment_and_fulfillment_dims
        grounds:
          - state_machines.DigitalOrder
          - entities.DigitalOrder.fields.payment_status
          - entities.DigitalOrder.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on DigitalOrder: payment_status and
          fulfillment_status evolve independently. Sequence: pay (PENDING->PAID)
          then refund (PAID->REFUNDED) is rejected once DELIVERED — but the
          deliver transition is guarded by payment==PAID, so the two dims
          interlock asymmetrically: deliver requires PAID; refund requires
          not-DELIVERED. The instance exercises payment PAID -> deliver ->
          refund rejected with ERR_ALREADY_DELIVERED while payment stays PAID
          and fulfillment stays DELIVERED (neither dim rolls back).
        test_recipe:
          setup:
            - "Season SELLING; troop T1; digital order 12 TM SHIPPED, paid then delivered"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
