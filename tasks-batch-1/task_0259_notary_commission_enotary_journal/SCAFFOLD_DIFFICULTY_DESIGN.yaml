# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Notary Commission & E-Notary Journal — Expert
# 9 rules × 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain is empty-DB executable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_fee_per_act_vs_aggregate_cap
        grounds:
          - calculations.session_act_fees
          - calculations.session_total_fee
          - entities.Session.fields.act_fees_total_cents
          - entities.Session.fields.session_total_fee_cents
          - state_machines.Session.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          On the SAME two documents (ACK requested 1500, JURAT requested 800), the
          PER_ACT basis yields act_fees_total_cents == 1600 and session_total_fee_cents
          == 4100, while the AGGREGATE basis yields act_fees_total_cents == 1200 and
          session_total_fee_cents == 3700 — this dual-variant lives on the Session
          fee domain.
        test_recipe:
          setup:
            - "Jurisdiction TX (ron_allowed, session_act_fee_cap_cents=1200, ron_surcharge_cap_cents=2500); fee schedules ACK max=1000, JURAT max=600"
            - "ACTIVE enotary-authorized notary with an ACTIVE bond; one PER_ACT session and one AGGREGATE session, each with ACK(1500)+JURAT(800) notarized"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /jurisdictions/${jx_tx}/fee-schedules"
              payload: { act_type: "ACKNOWLEDGMENT", max_act_fee_cents: 1000 }
              as: CommissionAuthority
            - call: "POST /jurisdictions/${jx_tx}/fee-schedules"
              payload: { act_type: "JURAT", max_act_fee_cents: 600 }
              as: CommissionAuthority
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N One", email: "n1@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-10T15:00:00Z", scheduled_end_at: "2026-06-10T16:00:00Z", requested_surcharge_cents: 4000, fee_basis: "AGGREGATE" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess_agg: $.data.id }
            - call: "POST /sessions/${sess_agg}/signers"
              payload: { full_name: "S A", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn_agg: $.data.id }
            - call: "POST /sessions/${sess_agg}/documents"
              payload: { signer_id: "${sgn_agg}", act_type: "ACKNOWLEDGMENT", requested_fee_cents: 1500 }
              as: Notary
              as_user_id: "${nota}"
              captures: { agg_doc1: $.data.id }
            - call: "POST /sessions/${sess_agg}/documents"
              payload: { signer_id: "${sgn_agg}", act_type: "JURAT", requested_fee_cents: 800 }
              as: Notary
              as_user_id: "${nota}"
              captures: { agg_doc2: $.data.id }
            - call: "POST /sessions/${sess_agg}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_agg}/resolve-identity"
              payload: { outcome: "VERIFIED" }
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_agg}/start"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_agg}/documents/${agg_doc1}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_agg}/documents/${agg_doc2}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_agg}/complete"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
              captures: { agg_total: $.data.session_total_fee_cents }
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-11T15:00:00Z", scheduled_end_at: "2026-06-11T16:00:00Z", requested_surcharge_cents: 4000, fee_basis: "PER_ACT" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess_pa: $.data.id }
            - call: "POST /sessions/${sess_pa}/signers"
              payload: { full_name: "S P", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn_pa: $.data.id }
            - call: "POST /sessions/${sess_pa}/documents"
              payload: { signer_id: "${sgn_pa}", act_type: "ACKNOWLEDGMENT", requested_fee_cents: 1500 }
              as: Notary
              as_user_id: "${nota}"
              captures: { pa_doc1: $.data.id }
            - call: "POST /sessions/${sess_pa}/documents"
              payload: { signer_id: "${sgn_pa}", act_type: "JURAT", requested_fee_cents: 800 }
              as: Notary
              as_user_id: "${nota}"
              captures: { pa_doc2: $.data.id }
            - call: "POST /sessions/${sess_pa}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_pa}/resolve-identity"
              payload: { outcome: "VERIFIED" }
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_pa}/start"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_pa}/documents/${pa_doc1}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess_pa}/documents/${pa_doc2}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
          trigger:
            - call: "POST /sessions/${sess_pa}/complete"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
              captures: { pa_total: $.data.session_total_fee_cents }
          assert:
            - "Session.${sess_pa}.act_fees_total_cents == 1600"
            - "Session.${sess_pa}.session_total_fee_cents == 4100"
            - "Session.${sess_agg}.act_fees_total_cents == 1200"
            - "Session.${sess_agg}.session_total_fee_cents == 3700"
            - "Session.${sess_pa}.session_total_fee_cents != Session.${sess_agg}.session_total_fee_cents"

      - name: notary_risk_provisional_vs_final_score
        grounds:
          - calculations.notary_risk_score
          - entities.Notary.fields.risk_score
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Complaint.SUBSTANTIATED_to_SETTLED
        distinguishing_aspect: |
          The risk-score dual-variant lives on the Notary domain (NOT the Session
          fee domain): a FEE_OVERCHARGE complaint scores risk_score==20 provisionally
          at SUBSTANTIATED and the score stays 20 (final) after SETTLED because the
          complaint remains in the {SUBSTANTIATED,SETTLED} include-set — a different
          subject and different formula from session_act_fees.
        test_recipe:
          setup:
            - "ACTIVE notary with ACTIVE bond (face 1000000), one FILED FEE_OVERCHARGE complaint (claim 100000), opened to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N Risk", email: "nrisk@x.com", enotary_requested: false }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /complaints"
              payload: { notary_id: "${nota}", category: "FEE_OVERCHARGE", claim_amount_cents: 100000 }
              as: CommissionAuthority
              as_user_id: "auditor-7"
              captures: { cmp: $.data.id }
            - call: "POST /complaints/${cmp}/open-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-7"
          trigger:
            - call: "POST /complaints/${cmp}/substantiate"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-7"
            - call: "POST /complaints/${cmp}/settle"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-7"
          assert:
            - "Notary.${nota}.risk_score == 20"
            - "Complaint.${cmp}.status == SETTLED"
            - "Complaint.${cmp}.settled_claim_cents == 100000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aggregate_waterfall_nonlinear_share
        grounds:
          - calculations.session_act_fees
          - calculations.document_capped_fee
          - entities.Document.fields.capped_fee_cents
          - entities.Session.fields.fee_basis
        distinguishing_aspect: |
          MODE (a) non-linear: per-document capped_fee_cents under AGGREGATE depends on
          three inputs interacting (each doc requested_fee, the running waterfall remainder,
          and jurisdiction.session_act_fee_cap_cents) plus a branch on fee_basis — the
          earliest-created doc absorbs min(1500,1200)=1200 and the next gets min(800,0)=0.
        test_recipe:
          setup:
            - "ACTIVE enotary notary, AGGREGATE session with session_act_fee_cap_cents=1200, ACK(1500) created before JURAT(800), both notarized"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /jurisdictions/${jx_tx}/fee-schedules"
              payload: { act_type: "ACKNOWLEDGMENT", max_act_fee_cents: 1000 }
              as: CommissionAuthority
            - call: "POST /jurisdictions/${jx_tx}/fee-schedules"
              payload: { act_type: "JURAT", max_act_fee_cents: 600 }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N Agg", email: "nagg@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-12T09:00:00Z", scheduled_end_at: "2026-06-12T10:00:00Z", requested_surcharge_cents: 0, fee_basis: "AGGREGATE" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/signers"
              payload: { full_name: "S Agg", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn: $.data.id }
            - call: "POST /sessions/${sess}/documents"
              payload: { signer_id: "${sgn}", act_type: "ACKNOWLEDGMENT", requested_fee_cents: 1500 }
              as: Notary
              as_user_id: "${nota}"
              captures: { d1: $.data.id }
            - call: "POST /sessions/${sess}/documents"
              payload: { signer_id: "${sgn}", act_type: "JURAT", requested_fee_cents: 800 }
              as: Notary
              as_user_id: "${nota}"
              captures: { d2: $.data.id }
            - call: "POST /sessions/${sess}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess}/resolve-identity"
              payload: { outcome: "VERIFIED" }
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess}/start"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess}/documents/${d1}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess}/documents/${d2}/notarize"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
          trigger:
            - call: "POST /sessions/${sess}/complete"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
          assert:
            - "Document.${d1}.capped_fee_cents == 1200"
            - "Document.${d2}.capped_fee_cents == 0"
            - "Session.${sess}.act_fees_total_cents == 1200"
            - "Session.${sess}.session_total_fee_cents == 1200"

      - name: renewal_grace_deadline_evaluation_order
        grounds:
          - calculations.renewal_grace_eligibility
          - entities.Renewal.fields.filed_within_grace
          - validations[priority=9]
          - state_machines.Renewal.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          MODE (c) circular-looking dependency with pinned evaluation order:
          grace_deadline = commission_expires_at + renewal_grace_days is computed FIRST
          (step 1), then filed_within_grace = (now <= grace_deadline) (step 2). Filing at
          a clock instant exactly ONE day past the deadline yields filed_within_grace==false
          and approve is rejected ERR_RENEWAL_OUT_OF_GRACE — distinct mode from the
          AGGREGATE min/max waterfall.
        test_recipe:
          setup:
            - "ACTIVE notary commissioned at 2026-06-01 with 48-month term (expires 2030-06-01) in a jurisdiction with renewal_grace_days=30; a second ACTIVE bond exists for the renewal"
            - "Clock advanced past 2030-07-01 (deadline 2030-07-01) so a renewal filed at 2030-07-02 is out of grace"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N Grace", email: "ngrace@x.com", enotary_requested: false }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond1: $.data.id }
            - call: "POST /bonds/${bond1}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "GET /notaries/${nota}"
              payload: {}
              as: CommissionAuthority
              captures: { nv: $.data.version }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2030-06-01T00:00:00Z", coverage_end_at: "2034-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond2: $.data.id }
            - call: "POST /bonds/${bond2}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-07-02T00:00:00Z" }
              as: CommissionAuthority
            - call: "POST /renewals"
              payload: { notary_id: "${nota}", expected_notary_version: "${nv}", new_bond_id: "${bond2}" }
              as: CommissionAuthority
              captures: { rnw: $.data.id, fw: $.data.filed_within_grace }
          trigger:
            - call: "POST /renewals/${rnw}/approve"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "Renewal.${rnw}.filed_within_grace == false"
            - "trigger response error_id == ERR_RENEWAL_OUT_OF_GRACE"
            - "Renewal.${rnw}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_review_info_request_cycle
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Complaint.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Complaint.fields.status
        distinguishing_aspect: |
          The Complaint machine is CYCLIC on a different entity than the Session branch:
          UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW returns to a previously-visited
          state, then substantiate proceeds — a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE notary with one FILED complaint opened to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N Cyc", email: "ncyc@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /complaints"
              payload: { notary_id: "${nota}", category: "RECORDKEEPING" }
              as: CommissionAuthority
              as_user_id: "auditor-1"
              captures: { cmp: $.data.id }
            - call: "POST /complaints/${cmp}/open-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-1"
            - call: "POST /complaints/${cmp}/request-info"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /complaints/${cmp}/resume-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-1"
          assert:
            - "Complaint.${cmp}.status == UNDER_REVIEW"

      - name: session_identity_branch_verified_vs_failed
        grounds:
          - state_machines.Session.IDENTITY_PENDING_to_ID_VERIFIED
          - state_machines.Session.IDENTITY_PENDING_to_ID_FAILED
          - entities.Signer.fields.id_status
        distinguishing_aspect: |
          The Session machine BRANCHES from IDENTITY_PENDING into two divergent targets
          on a different entity than the Complaint cycle: outcome=FAILED drives
          status ID_FAILED and the under-verified signer's id_status FAILED, a different
          side-effect set than the VERIFIED branch.
        test_recipe:
          setup:
            - "ACTIVE enotary notary, SCHEDULED session with one signer that has kba_passed=false"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N Br", email: "nbr@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-13T09:00:00Z", scheduled_end_at: "2026-06-13T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/signers"
              payload: { full_name: "S Bad", kba_passed: false, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn: $.data.id }
            - call: "POST /sessions/${sess}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
          trigger:
            - call: "POST /sessions/${sess}/resolve-identity"
              payload: { outcome: "FAILED" }
              as: Notary
              as_user_id: "${nota}"
          assert:
            - "Session.${sess}.status == ID_FAILED"
