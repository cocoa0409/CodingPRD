              as: Evaluator
            - call: "POST /ei/referrals/${ref2_id}/entry-outcomes"
              payload: { measurement_date: "2026-09-01", rating_social: 3, rating_knowledge: 3, rating_needs: 4 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref1_id}"
              as: ProgramAdmin
              captures: { ref1_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref1_id}", ifsp_type: "INITIAL", meeting_date: "2026-09-01", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref1_v}" }
              as: ProgramAdmin
              captures: { ifsp1_id: $.data.id }
            - call: "GET /ei/referrals/${ref2_id}"
              as: ProgramAdmin
              captures: { ref2_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref2_id}", ifsp_type: "INITIAL", meeting_date: "2026-09-01", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref2_v}" }
              as: ProgramAdmin
              captures: { ifsp2_id: $.data.id }
            - call: "POST /ei/ifsp-services"
