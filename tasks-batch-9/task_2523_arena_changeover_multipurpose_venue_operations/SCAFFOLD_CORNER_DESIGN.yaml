          difficulty_instance: non_linear_state_machine / booking_traverses_held_challenged_held_cycle_twice_with_expiry_preserved_and_asymmetric_credit_ledger
          rationale: "The named §1.8 instance traverses the cycle twice and asserts the preserved expiry plus the asymmetric credit ledger."

      - name: ice_sheet_cover_cycle_terminates_at_the_cover_cycle_limit
        claim_type: cyclic
        grounds:
          - state_machines.IceSheet.transitions.COVERED_to_IN_SERVICE
          - state_machines.IceSheet.transitions.COVERED_to_MELTING
        excluded_because:
          difficulty_instance: non_linear_state_machine / ice_sheet_cover_uncover_cycle_terminates_by_auto_meltout_on_the_fourth_cover
          rationale: "The named §1.8 instance walks the IN_SERVICE <-> COVERED loop to the COVER_CYCLE_LIMIT and asserts the automatic melt-out."

      - name: three_changeover_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ChangeoverOrder.transitions.IN_PROGRESS_to_IN_PROGRESS
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / three_parallel_changeover_dimensions_advance_independently_and_rework_resets_only_one_axis
          rationale: "The named §1.8 instance advances each axis separately and asserts that rework resets only the named dimension."

      - name: booking_loss_cascades_down_into_dock_reservations_and_orders
        claim_type: Cascade down
        grounds:
          - state_machines.EventBooking.transitions.HELD_to_RELEASED.side_effects
          - state_machines.ChangeoverOrder.transitions.PLANNED_to_ABANDONED
        excluded_because:
          difficulty_instance: transitive_cascade / hold_expiry_sweep_releases_two_bookings_in_expiry_order_and_cascades_into_one_shared_order
          rationale: "The named §1.8 instance verifies the full four-level chain and that already-terminal children are left alone."

      - name: covering_changeover_signoff_cascades_only_when_the_turnaround_is_covering
        claim_type: Conditional cascade
        grounds:
          - state_machines.ChangeoverOrder.transitions.READY_FOR_SIGNOFF_to_SIGNED_OFF.side_effects
          - state_machines.IceSheet.transitions.IN_SERVICE_to_COVERED
        excluded_because:
          difficulty_instance: transitive_cascade / signoff_of_a_covering_changeover_cascades_into_ice_cover_and_then_auto_meltout
          rationale: "The named §1.8 instance asserts the conditional ice-cover hop and the auto-melt-out that follows it."

      - name: displacement_adjusts_equipment_and_labor_ledgers_on_other_entities
        claim_type: Cross-entity
        grounds:
          - state_machines.EventBooking.transitions.CHALLENGED_to_DISPLACED.side_effects
          - state_machines.LaborCall.transitions.CALLED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / upheld_challenge_displacement_cascades_four_hops_from_ruling_to_equipment_and_labor_ledgers
          rationale: "The named §1.8 instance asserts each downstream entity's state and fields after the ruling."

      - name: hold_counters_are_compensated_when_a_hold_ends
        claim_type: Compensation
        grounds:
          - entities.Venue.fields.open_hold_count
          - entities.AnchorTenant.fields.holds_consumed
        excluded_because:
          difficulty_instance: compensating_invariant / hold_ledgers_reconcile_to_zero_after_confirm_and_release_although_the_two_counters_move_on_different_events
          rationale: "The named §1.8 instance reconciles both counters to zero and shows they move on different events."

  # =========================================================================
  - section: calculations
    instances:
      - name: overnight_shift_flag_flips_at_the_local_hour_boundaries_of_22_and_6
        claim_type: threshold
        grounds:
          - calculations.overnight_shift_flag
          - calculations.labor_call_cost_cents
          - entities.Venue.fields.overnight_shift_start_local_hour
        distinguishing_aspect: "Four otherwise identical eight-hour STAGEHAND calls for ten heads price at 518400 cents when call_start_utc maps to local hour 22 or 05 and at 384000 cents when it maps to local hour 21 or 06, isolating both edges of the overnight predicate at the -4 hour venue offset."
        test_recipe:
          setup:
            - "One venue with overnight_shift_start_local_hour 22, PROFILE ICE, and one HELD booking to scope the labor calls to."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk: $.data.id }
            - call: "POST /event-bookings/${bk}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "POST /labor-calls"
              payload: { craft: "STAGEHAND", headcount: 10, call_start_utc: "2026-09-10T02:00:00Z", call_end_utc: "2026-09-10T10:00:00Z", booking_id: "${bk}" }
              as: LaborCoordinator
              captures: { l_2200: $.data.id, on_2200: $.data.overnight, est_2200: $.data.estimated_cost_cents }
            - call: "POST /labor-calls"
              payload: { craft: "STAGEHAND", headcount: 10, call_start_utc: "2026-09-10T01:00:00Z", call_end_utc: "2026-09-10T09:00:00Z", booking_id: "${bk}" }
              as: LaborCoordinator
              captures: { l_2100: $.data.id, on_2100: $.data.overnight, est_2100: $.data.estimated_cost_cents }
            - call: "POST /labor-calls"
              payload: { craft: "STAGEHAND", headcount: 10, call_start_utc: "2026-09-10T09:00:00Z", call_end_utc: "2026-09-10T17:00:00Z", booking_id: "${bk}" }
              as: LaborCoordinator
              captures: { l_0500: $.data.id, on_0500: $.data.overnight, est_0500: $.data.estimated_cost_cents }
            - call: "POST /labor-calls"
              payload: { craft: "STAGEHAND", headcount: 10, call_start_utc: "2026-09-10T10:00:00Z", call_end_utc: "2026-09-10T18:00:00Z", booking_id: "${bk}" }
              as: LaborCoordinator
              captures: { l_0600: $.data.id, on_0600: $.data.overnight, est_0600: $.data.estimated_cost_cents }
          assert:
            - "on_2200 == true and est_2200 == 518400, from per-head round_half_up(4800 * 8 * 1.35) == 51840 times 10 heads"
            - "on_2100 == false and est_2100 == 384000, from per-head 4800 * 8 == 38400 times 10 heads"
            - "on_0500 == true and est_0500 == 518400, because local hour 5 is below OVERNIGHT_END_LOCAL_HOUR 6"
            - "on_0600 == false and est_0600 == 384000, because local hour 6 is not below 6"
            - "all four LaborCall rows read guaranteed_hours == 4 (the default) and status == CALLED, so only the overnight multiplier separates them"

