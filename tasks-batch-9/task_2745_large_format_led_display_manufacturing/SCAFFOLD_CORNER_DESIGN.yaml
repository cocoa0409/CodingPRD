      - name: second_abort_on_the_same_run_rejected
        claim_type: idempotency
        grounds:
          - state_machines.BurnInRun
          - endpoints[POST /burn-in-runs/{burn_in_run_id}/abort]
          - errors.ERR_INVALID_RUN_STATE
        excluded_because:
          difficulty_instance: burn_in_schedule_and_abort_conserve_chamber_reserved_slots
          rationale: |
            That §1.8 compensating-invariant instance already replays the abort on
            an ABORTED run and asserts both the ERR_INVALID_RUN_STATE refusal and
            the invariant that matters — the chamber's reserved slot count is
            released exactly once, so a second abort cannot credit the chamber
            twice. Repeating it here would only re-check the status code.

      - name: both_project_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.DisplayProject
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: project_engineering_and_production_dimensions_advance_independently
          rationale: |
            The parallel-shape claim for DisplayProject — engineering_state and
            production_state moving on the same row without either dragging the
            other, and the combined (APPROVED, BLOCKED) pair being legal — is the
            whole subject of that §1.8 non_linear_state_machine instance, which
            walks both dimensions through their full sequences in one recipe.

      - name: module_rework_loop_terminates_in_scrapped
        claim_type: valid_transition
        grounds:
          - state_machines.Module
          - calculations.module_rework_cycle_accounting
        excluded_because:
          difficulty_instance: module_rework_self_loop_bounded_then_scrapped
          rationale: |
            The MANUFACTURED <-> REWORK self-loop, the monotonic rework_cycles
            counter, the strict > MAX_REWORK_CYCLES comparison and the terminal
            SCRAPPED landing (plus the refusal of any further pixel-test) are all
            asserted cycle by cycle in that §1.8 instance; a duplicate here would
            re-derive the same counter arithmetic.

  - section: calculations
    instances:
      - name: color_bin_letter_and_digit_sit_on_their_own_thresholds
        claim_type: constants_applied
        grounds:
          - calculations.module_color_bin_assignment
          - entities.Module.fields.color_bin
          - entities.Module.fields.color_bin_rank
        distinguishing_aspect: |
          Three constants meet in one formula and each must be read off its own
          comparison. CHROMA_A_BIN_TOLERANCE (0.003) is an inner threshold with
          <=, so 0.0030 is still letter A and 0.0031 is already letter B even
          though both calibrate. BRIGHTNESS_BIN_1_FRACTION applies through a ceil:
          ceil(5000 x 0.96) = 4800, so exactly 4800 nits is digit 1 and 4799 is
          digit 2. chroma_error is the MAX of the two axis deltas, not their sum
          or their Euclidean distance, and the rank map must follow the string.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel (reference_color 0.3128 / 0.3290, rated 5000 nits) and three PIXEL_TESTED modules."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-A" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { ma: $.data.id }
            - call: "POST /modules/${ma}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-B" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { mb: $.data.id }
            - call: "POST /modules/${mb}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-C" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { mc: $.data.id }
            - call: "POST /modules/${mc}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /modules/${ma}/calibrate"
              payload: { measured_brightness_nits: 4800, measured_color_x: 0.3158, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${mb}/calibrate"
              payload: { measured_brightness_nits: 4800, measured_color_x: 0.3159, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${mc}/calibrate"
              payload: { measured_brightness_nits: 4799, measured_color_x: 0.3128, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
          assert:
            - "trigger call 1 -> 200: Module.${ma}.chroma_error == 0.0030 and color_bin == 'A1' and color_bin_rank == 0   # exactly at CHROMA_A_BIN_TOLERANCE"
            - "trigger call 2 -> 200: Module.${mb}.chroma_error == 0.0031 and color_bin == 'B1' and color_bin_rank == 2   # one ten-thousandth past it"
            - "trigger call 3 -> 200: Module.${mc}.chroma_error == 0.0000 and color_bin == 'A2' and color_bin_rank == 1   # 4799 < ceil(5000 x 0.96)"
            - "all three modules: module_state == CALIBRATED, rework_cycles == 0, calibrated_by_user_id == 'op-1'"
            - "Module.${ma}.color_bin != 'B1' and Module.${mb}.color_bin != 'A1'   # the letter split is at 0.003, not at 0.008"
            - "Module.${mc}.color_bin != 'A1'   # the digit split is a ceil, not a floor or a round"

      - name: chroma_three_band_ladder_calibrates_reworks_and_rejects
        claim_type: correct_result
        grounds:
          - calculations.module_color_bin_assignment
          - calculations.module_rework_cycle_accounting
          - errors.ERR_CHROMA_OUT_OF_TOLERANCE
        distinguishing_aspect: |
          The same endpoint has three outcomes separated by two constants, and the
          boundaries belong to the LOWER band each time: 0.0080 still calibrates
          (as letter B), 0.0081 reworks and burns a rework cycle, and 0.0201 is a
          hard 422 that stores nothing at all — not the measurements, not a rework
          cycle, not a state change. Only the middle case is allowed to touch
          rework_cycles.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel and three PIXEL_TESTED modules ${md}, ${me}, ${mf} (CHROMA_CALIBRATED_TOLERANCE 0.008, CHROMA_REWORK_TOLERANCE 0.020)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
