              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { b_life: "$.data.lifecycle_state", b_repl: "$.data.replacement_for_unit_id" }
            - call: "POST /recommerce/resale-orders/${ord_id}/settle-return"
              payload: { resolution: "REFUND" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { st: "$.data.status", restock: "$.data.restock_fee_minor", r_cash: "$.data.refund_cash_minor", r_credit: "$.data.refund_credit_minor" }
            - call: "GET /recommerce/resale-units/${unit_a}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { a_life: "$.data.lifecycle_state", a_chan: "$.data.listed_channel_id", a_acct: "$.data.accounting_state" }
          assert:
            - "${err} == ERR_ORDER_RETURN_NOT_SETTLEABLE  # HTTP 409; the candidate unit exists, so this is not ERR_NO_REPLACEMENT_UNIT"
            - "${b_life} == LISTED and ${b_repl} is null — the refused call consumed no substitute"
            - "${gross} == 19500 and ${fee} == 1755 and ${cash} == 21255"
            - "${st} == RETURNED and ${restock} == 2340  # ceil(19500*1200/10000)"
            - "${r_cash} == 17160  # 21255 - (1755 + 2340); the channel fee is not refunded on a remorse return"
            - "${r_credit} == 0 and ${a_life} == RETURNED and ${a_chan} is null and ${a_acct} == CAPITALIZED"

