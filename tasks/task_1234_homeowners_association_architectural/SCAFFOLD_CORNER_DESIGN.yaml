scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_owner_success_returns_system_fields
        claim_type: creation
        grounds: [entities.Owner, "endpoints.POST /arc/associations/{id}/owners"]
        distinguishing_aspect: "POST owners with all required fields returns 201 with server-minted id, version == 1, and echoed inputs."
        test_recipe:
          setup: ["Association exists"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Base HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
          trigger:
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { oid: $.data.id, over: $.data.version, oname: $.data.full_name } }
          assert:
            - "response Owner.id is a server-minted UUID (no type prefix)"
            - "Owner.version == 1 and Owner.full_name == 'Ann A'"
            - "Owner.association_id == ${assoc}"

      - name: create_owner_missing_email_rejected
        claim_type: required_fields
        grounds: [entities.Owner.fields.email, "validations[priority=4]"]
        distinguishing_aspect: "Omitting required email is rejected with ERR_INVALID_REQUEST (400); no owner row is created."
        test_recipe:
          setup: ["Association exists"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Base HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
          trigger:
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "No Email" }, as: Manager, captures: { err: $.data.error_id } }
            - { call: "GET /arc/associations/${assoc}/owners", as: Manager }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "subsequent owner list is empty (data length == 0)"

      - name: create_application_invalid_project_type_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Application.fields.project_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "project_type 'POOL' is not a declared enum member; creation fails with ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["Association, owner, property exist"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Enum HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "N-1", address: "1 Enum Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: POOL, guideline_section: "SEC-6.6", description: "pool", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM"

      - name: get_nonexistent_application_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown application id returns 404 ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "NF HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager }
          trigger:
            - { call: "GET /arc/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Manager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_FOUND (HTTP 404)"

      - name: property_computed_defaults_on_creation
        claim_type: computed_fields
        grounds: [entities.Property.fields.compliance_posture, entities.Property.fields.outstanding_fine_balance_cents, entities.Property.fields.open_permit_count]
        distinguishing_aspect: "A freshly created property reports outstanding_fine_balance_cents == 0, open_permit_count == 0, compliance_posture == CLEAR without any client input."
        test_recipe:
          setup: ["Association and owner exist"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Def HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
          trigger:
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "D-1", address: "1 Default Dr", primary_owner_id: "${owner_a}" }, as: Manager, captures: { bal: $.data.outstanding_fine_balance_cents, opc: $.data.open_permit_count, posture: $.data.compliance_posture } }
          assert:
            - "outstanding_fine_balance_cents == 0, open_permit_count == 0, compliance_posture == CLEAR"

      - name: application_version_progression_on_mutations
        claim_type: system_fields
        grounds: [entities.Application, state_machines.Application.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Application.version starts at 1 on create and increments by exactly 1 per mutation: submit -> 2, start-review -> 3."
        test_recipe:
          setup: ["Complete DRAFT application exists at default clock"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Ver HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "V-1", address: "1 Version Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "repaint", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id, v0: $.data.version } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "elev", uri: "s3://v/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "chip", uri: "s3://v/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
          trigger:
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}", captures: { v1: $.data.version } }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager, captures: { v2: $.data.version } }
          assert:
            - "version at create == 1; after submit == 2; after start-review == 3 (attachments do not bump the parent version)"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Application]
        distinguishing_aspect: "A newly created application reports status == DRAFT and decision_outcome == NONE."
        test_recipe:
          setup: ["Association, owner, property exist"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Init HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "I-1", address: "1 Init Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { st: $.data.status, oc: $.data.decision_outcome } }
          assert:
            - "status == DRAFT and decision_outcome == NONE"

      - name: submit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUBMIT is defined only from DRAFT; a second submit from SUBMITTED fails with ERR_INVALID_STATE and stamps nothing."
        test_recipe:
          setup: ["Complete application already SUBMITTED at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Twice HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "T-2", address: "2 Twice Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://t/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://t/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
          trigger:
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
          assert:
            - "second submit: error_id == ERR_INVALID_STATE; application remains SUBMITTED"

      - name: decide_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECIDE is defined only from UNDER_REVIEW; calling it on a DRAFT application fails with ERR_INVALID_STATE even when the payload is well-formed."
        test_recipe:
          setup: ["DRAFT application exists (never submitted)"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Draft HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "D-2", address: "2 Draft Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: [] }, as: Manager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; application remains DRAFT"

      - name: terminal_lockdown_appeal_denied_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application, state_machines.Appeal.PENDING_to_OVERRULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After the board OVERRULES an appeal the application lands in terminal APPEAL_DENIED; any further transition attempt (request-revision) fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Application denied by committee (ballots A,D,D under supermajority), appealed by the owner, appeal OVERRULED by a clean board member"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Term HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Dee D", email: "dee.d@x.com" }, as: Manager, captures: { owner_d: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "T-9", address: "9 Term Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "tall fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://t9/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://t9/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { denial_reason: "exceeds fence height cap" }, as: Manager, captures: { denied: $.data.status } }
            - { call: "POST /arc/applications/${app}/appeals", payload: { grounds: "neighbor precedent" }, as: Homeowner, as_user_id: "${owner_a}", captures: { appeal: $.data.id } }
            - { call: "POST /arc/appeals/${appeal}/decide", payload: { outcome: OVERRULED, board_note: "guideline is unambiguous" }, as: BoardMember, as_user_id: "${owner_d}", captures: { appeal_status: $.data.status } }
          trigger:
            - { call: "POST /arc/applications/${app}/request-revision", payload: { revision_notes: "try again" }, as: CommitteeMember, as_user_id: "${owner_b}", captures: { err: $.data.error_id } }
            - { call: "GET /arc/applications/${app}", as: Manager, captures: { final_status: $.data.status } }
          assert:
            - "committee decide left status == DENIED; appeal decide left Appeal.status == OVERRULED"
            - "request-revision on terminal APPEAL_DENIED: error_id == ERR_INVALID_STATE"
            - "Application final status == APPEAL_DENIED (terminal lockdown)"

      - name: application_revision_loop_excluded
        claim_type: invalid_transition
        grounds: [state_machines.Application.UNDER_REVIEW_to_REVISION_REQUESTED]
        excluded_because:
          difficulty_instance: application_revision_loop_cycles
          rationale: "Cyclic traversal of UNDER_REVIEW <-> REVISION_REQUESTED with hold accounting is asserted by the named §1.8 instance."

      - name: inspection_cycle_excluded
        claim_type: valid_transition
        grounds: [state_machines.Inspection.FAILED_REMEDIATION_to_SCHEDULED]
        excluded_because:
          difficulty_instance: inspection_fail_remediate_reschedule_cycle
          rationale: "SCHEDULED -> FAILED_REMEDIATION -> SCHEDULED cycle with attempt_no progression is asserted by the named §1.8 instance."

      - name: permit_expiry_cascade_creates_violation_and_fine
        claim_type: side_effect_execution
        grounds: [state_machines.ConstructionPermit.ACTIVE_to_EXPIRED, entities.Violation.fields.kind]
        distinguishing_aspect: "Sweep past window_end with no PASSED inspection expires the permit and cascades: Violation OPEN kind=INCOMPLETE_CONSTRUCTION, Fine ACCRUING at base 10000, property balance 10000 / posture FINES_OUTSTANDING."
        test_recipe:
          setup:
            - "Approved application with permit window [2026-06-01, 2026-06-10); no inspection requested; clock advanced to 2026-06-11"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Expire HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "E-9", address: "9 Expire Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "repaint", requested_window_start: "2026-06-01", requested_window_end: "2026-06-10" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "elev", uri: "s3://e9/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "chip", uri: "s3://e9/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: [] }, as: Manager }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { expired: $.data.permits_expired } }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit_status: "$.data[0].status" } }
            - { call: "GET /arc/applications/${app}/violations", as: Manager, captures: { vio_kind: "$.data[0].kind", vio_status: "$.data[0].status", vio_id: "$.data[0].id" } }
            - { call: "GET /arc/violations/${vio_id}/fines", as: Manager, captures: { fine_status: "$.data[0].status", fine_accrued: "$.data[0].accrued_cents" } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { bal: $.data.outstanding_fine_balance_cents, posture: $.data.compliance_posture, opc: $.data.open_permit_count } }
          assert:
            - "sweep reports permits_expired == 1; permit status == EXPIRED"
            - "Violation created: kind == INCOMPLETE_CONSTRUCTION, status == OPEN"
            - "Fine created: status == ACCRUING, accrued_cents == 10000 (base; expiry step runs after the accrual step so no same-day increment)"
            - "Property: outstanding_fine_balance_cents == 10000, compliance_posture == FINES_OUTSTANDING, open_permit_count == 0"

  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: review_clock_excludes_applicant_hold_days
        claim_type: correct_result
        grounds: [calculations.statutory_deadline_check, entities.Application.fields.applicant_hold_days]
        distinguishing_aspect: "A 3-day applicant hold shifts the deemed-approval date by exactly 3 days: at 2026-05-08 elapsed is 7-3=4 (< 5, no deeming); at 2026-05-09 elapsed is 8-3=5 (deemed). Pins the hold-exclusion arithmetic."
        test_recipe:
          setup:
            - "Association CALENDAR statutory_response_days 5; application SUBMITTED + UNDER_REVIEW at 2026-05-01; revision requested 2026-05-02; resubmitted 2026-05-05 (hold = 3)"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Hold HOA", statutory_response_days: 5, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "H-1", address: "1 Hold Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "repaint", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "elev", uri: "s3://h/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "chip", uri: "s3://h/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/applications/${app}/request-revision", payload: { revision_notes: "add color board" }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/applications/${app}/resubmit", as: Homeowner, as_user_id: "${owner_a}", captures: { hold: $.data.applicant_hold_days } }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { deemed_d8: $.data.applications_deemed_approved } }
            - { call: "GET /arc/applications/${app}", as: Manager, captures: { status_d8: $.data.status } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { deemed_d9: $.data.applications_deemed_approved } }
            - { call: "GET /arc/applications/${app}", as: Manager, captures: { status_d9: $.data.status } }
          assert:
            - "applicant_hold_days == 3 after resubmit (days in (2026-05-02, 2026-05-05])"
            - "at 2026-05-08: elapsed 7 - 3 = 4 < 5 -> applications_deemed_approved == 0, status == UNDER_REVIEW"
            - "at 2026-05-09: elapsed 8 - 3 = 5 >= 5 -> applications_deemed_approved == 1, status == DEEMED_APPROVED"

      - name: fine_tier_boundary_day_grace_exact
        claim_type: constants_applied
        grounds: [calculations.fine_accrual, entities.Fine.fields.grace_days_snapshot]
        distinguishing_aspect: "Tier boundary precision: with grace_days=3 the day-3 increment is still the base 1000 and the day-4 increment is the escalated 2000 (day_index > grace_days escalates). Accrued reads 13000 after day 3 and 15000 after day 4."
        test_recipe:
          setup: ["Association TIERED base 10000 daily 1000 grace 3 mult 20000bp; violation at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Tier HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: TIERED_ESCALATION, base_fine_cents: 10000, daily_fine_cents: 1000, grace_days: 3, escalation_multiplier_bp: 20000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
