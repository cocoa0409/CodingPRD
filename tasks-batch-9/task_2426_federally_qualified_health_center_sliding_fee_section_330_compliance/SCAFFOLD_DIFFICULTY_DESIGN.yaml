            - "${cap5_status} == SUBMITTED and SiteVisitFinding.${f5_id}.status was CAP_SUBMITTED before the trigger"
            - "${cap5_final} == ACCEPTED"
            - "hop 1: SiteVisitFinding.${f5_id}.status == RESOLVED and HealthCenter.${hc_id}.open_condition_count == 0"
            - "hop 2: HealthCenter.${hc_id}.operational_status == ACTIVE and scope_posture == OPEN"
            - "hop 3: ScopeChangeRequest.${scr_id}.status == SUBMITTED and held_from_status == null"
            - "hop 4: ServiceSite.${site2_id}.status == PROPOSED and hold_reason == null"
            - "HealthCenter.${hc_id}.in_scope_site_count == 1 and in_scope_service_count == 1  # cardinalities restored exactly, no drift"
            - "SiteVisitFinding.${f5_id}.escalated_at != null  # the escalation is remembered even though the condition is cleared"
