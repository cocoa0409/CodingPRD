  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: survey_parallel_dimensions_out_of_step
        grounds:
          - state_machines.Survey.VERIFIED_to_SUBMITTED
          - state_machines.Survey.DISCREPANCY_OPEN_to_DISCREPANCY_RESOLVED
          - entities.Survey.fields.af_certification_level
        distinguishing_aspect: |
          af_status and af_certification_level evolve INDEPENDENTLY on the same
          Survey row, so a granted reanalysis rewinds af_status to SUBMITTED
          while af_certification_level is separately set to
          CERTIFICATION_WITHDRAWN, leaving the two dimensions observably out of
          step — a PARALLEL shape on Survey, a different entity from the
          compound-cyclic ReleaseCycle chain the second instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0's baseline survey is VERIFIED/CERTIFIED and a reanalysis against it is UNDER_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests"
              payload: { survey_id: "${sp0_id}", subset_selector: [{ measure_code: "o1" }], supporting_documents: [{ document_code: "HAND_HYGIENE", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "ICU_STAFFING", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "BARCODE_MED_ADMIN", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "SAFE_SURGERY_CHECKLIST", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "CAUTI_BUNDLE", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "CLABSI_BUNDLE", issued_on: "2026-05-01T00:00:00Z" }] }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { rq0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests/${rq0_id}/decide"
              payload: { decision: "START_REVIEW" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests/${rq0_id}/decide"
              payload: { decision: "GRANT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { rq0_status: $.data.status }
            - call: "GET /hospital-safety-rating/surveys/${sp0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { af_status_now: $.data.af_status, af_cert_now: $.data.af_certification_level }
          assert:
            - "ReanalysisRequest.${rq0_id}.status == GRANTED"
            - "Survey.${sp0_id}.af_status == SUBMITTED"
            - "Survey.${sp0_id}.af_certification_level == CERTIFICATION_WITHDRAWN"
            - "the two dimensions are out of step: af_status is SUBMITTED while af_certification_level is CERTIFICATION_WITHDRAWN"
            - "a later POST /surveys/${sp0_id}/verify with ACCEPT sets af_status == VERIFIED and af_certification_level == CERTIFIED, so the dimensions realign"

      - name: release_cycle_compound_with_corrected_to_scored_cycle
        grounds:
          - state_machines.ReleaseCycle.OPEN_REVIEW_to_CORRECTION_CLOSED
          - state_machines.ReleaseCycle.CORRECTION_CLOSED_to_EMBARGOED
          - state_machines.Grade.CORRECTED_to_SCORED
          - state_machines.Grade.SCORED_to_CORRECTED
        distinguishing_aspect: |
          ReleaseCycle.state is COMPOUND — derived from its Grade and
          HospitalReview children and never set directly — and the Grade child
          runs a cycle (SCORED → CORRECTED → SCORED) that can move the parent
          backward as well as forward, a different entity from the
          parallel-dimension Survey the first instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Cycle C0 is DRAFT with one SCORED grade for hospital P0; the correction window ends at 2026-06-30T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/release-cycles"
              payload: { label: "Baseline Grades", methodology_version_id: "${meth_b0_id}", preliminary_release_date: "2026-06-01T00:00:00Z", correction_window_ends_at: "2026-06-30T00:00:00Z", publication_date: "2026-07-15T00:00:00Z" }
              as: RatingAdmin
              captures: { rc_b0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 60.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/refresh-measures"
              payload: { expected_hospital_version: "${p0_v0}" }
              as: RatingEngine
              captures: { p0_v1: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/score-runs"
              payload: { methodology_version_id: "${meth_b0_id}", release_cycle_id: "${rc_b0_id}", expected_hospital_version: "${p0_v1}" }
              as: RatingEngine
              captures: { run_p0_id: $.data.id, p0_v2: $.data.version }
            - call: "POST /hospital-safety-rating/release-cycles/${rc_b0_id}/open-review"
              payload: {}
              as: RatingEngine
              captures: { rc_state: $.data.state, rc_v: $.data.version }
            - call: "GET /hospital-safety-rating/release-cycles/${rc_b0_id}/grades"
              payload: { hospital_id: "${p0_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { grade_p0_id: "$.data[0].id" }
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}/reviews"
              payload: { release_cycle_id: "${rc_b0_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { rev_p0_id: "$.data[0].id" }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/preliminary-results/${rev_p0_id}/corrections"
              payload: { correction_type: "MEASURE_VALUE_ERROR", corrected_measure_codes: ["o1"], supporting_reference: "Corrected o1 source extract from the 2026 Q1 abstract" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { cor_p0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/preliminary-results/${rev_p0_id}/corrections/${cor_p0_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RatingEngine
              as_user_id: "re-cara"
              captures: { cor_status: $.data.status }
            - call: "GET /hospital-safety-rating/grades/${grade_p0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { grade_status: $.data.status }
          assert:
            - "the cycle read before any correction returns state OPEN_REVIEW, derived from its children rather than set by the caller"
            - "CorrectionRequest.${cor_p0_id}.status == ACCEPTED"
            - "Grade.${grade_p0_id}.status == CORRECTED"
            - "a final REJECT decision on the remaining open correction returns Grade.${grade_p0_id}.status to SCORED, so the child cycle moves the parent backward"
            - "after the clock passes 2026-06-30T00:00:00Z the derived cycle state settles at EMBARGOED, having passed through CORRECTION_CLOSED without any caller action, with every pending review forced to ACCEPTED"

  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: reanalysis_grant_four_hop_cascade_into_cycle
        grounds:
          - state_machines.ReanalysisRequest.UNDER_REVIEW_to_GRANTED
          - state_machines.HospitalMeasureSet.INCOMPLETE_to_READY
          - state_machines.HospitalMeasureSet.READY_to_READY
          - state_machines.Grade.SCORED_to_SCORED
          - state_machines.ReleaseCycle.DRAFT_to_OPEN_REVIEW
        distinguishing_aspect: |
          Depth 4: the GRANT mutates a SurveyMeasure, whose own mutation
          returns the HospitalMeasureSet to INCOMPLETE, whose own change drives
          the refresh-and-score pair that re-derives the Grade, whose own
          change re-derives the parent ReleaseCycle state — each hop caused by
          the previous hop, never by the original action.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P1 holds a SCORED grade at composite 60.38 in cycle C_MAIN and a reanalysis request against its survey is UNDER_REVIEW."
