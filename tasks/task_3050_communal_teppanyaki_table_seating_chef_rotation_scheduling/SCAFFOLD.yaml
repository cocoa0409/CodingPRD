  - method: GET
    path: "/service-floor/reservations"
    description: "List bookings, filterable by owning venue, party, table or chef"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: ["venue_id?", "party_id?", "tier_id?", "table_id?", "chef_assignment_id?", "current_seating_id?", "current_sushi_show_id?", "current_grill_show_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/service-floor/reservations/{reservation_id}"
    description: "Get one booking"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/holds"
    description: "Grant a hold window on a grill table, or re-park an expired hold onto another table"
    roles: [Host]
    code: 200
    input: [expected_table_version, "table_id?"]
    output: Reservation
    side_effects:
      - "Reservation -> HELD with table_id and hold_until = clock + HOLD_WINDOW_MINUTES (the hold window is 20 minutes: HOLD_WINDOW_MINUTES = 20, and hold_count is capped at HOLD_MAX_COUNT = 3); hold_count += 1"
      - "quote_final_cents recomputed per §1.3 quote variant"
      - "when a different table is named while the booking is already HELD, the previous table is released first"
      - "increments GrillTable.version by 1"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/seat"
    description: "Seat a held booking at its assigned table"
    roles: [Host]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "Reservation -> SEATED with chef_assignment_id set by §1.3 chef_rotation"
      - "Reservation.current_seating_id, current_sushi_show_id and current_grill_show_id are stamped by the GrillTable transition's cascade"
      - "the GrillTable AVAILABLE -> SEATED transition fires with its full side-effect set"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/events"
    description: "Post a booking event (SUBMIT, MARK_NO_SHOW)"
    roles: [Host]
    code: 200
    input: [event_type]
    output: Reservation
    side_effects:
      - "SUBMIT: DRAFT -> REQUESTED, quote recomputed"
      - "MARK_NO_SHOW: REQUESTED or HELD -> NO_SHOW, Party.no_show_count += 1, posted ledger entries voided"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/party-size"
    description: "Add arriving guests to a seated booking, or move it up a tier"
    roles: [Host]
    code: 200
    input: [party_size, "celebration?"]
    output: Reservation
    side_effects:
      - "SEATED -> SEATED with party_size raised; quote_final_cents recomputed and the §1.3 settlement variant may switch"
      - "rejected with ERR_TABLE_OVER_CAPACITY when the new party size exceeds the table's seat capacity"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/close"
    description: "Close a seated booking and settle the check"
    roles: [Host]
    code: 200
    input: [expected_reservation_version, "credit_to_apply_cents?"]
    output: Reservation
    side_effects:
      - "SEATED -> CLOSED; final_bill_cents and check_cents recomputed per §1.3 final variant"
      - "credit_application and celebration_credit_application evaluated per §1.3 pinned order"
      - "a TABLE_MINIMUM_TRUEUP ledger entry is posted when the bill falls under the tier minimum"
      - "every ACTIVE TableSeating row for this reservation -> VACATED; the table -> TURNING"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/service-floor/reservations/{reservation_id}/reopen"
    description: "Reopen a booking that was abandoned by a ventilation hold"
    roles: [Host]
    code: 200
    input: ["table_id?"]
    output: Reservation
    side_effects:
      - "ABANDONED -> HELD with a fresh table_id and hold_until; ledger entries voided by the abandon cascade return to POSTED"
      - "increments Reservation.version by 1"

