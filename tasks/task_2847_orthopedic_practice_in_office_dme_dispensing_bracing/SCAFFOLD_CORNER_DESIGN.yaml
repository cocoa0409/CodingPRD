      - name: corner_return_window_and_refit_eligibility_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=54]
          - validations[priority=56]
          - validations[priority=38]
          - errors[ERR_RETURN_WINDOW_EXPIRED]
          - errors[ERR_REFIT_REASON_NOT_ELIGIBLE]
          - errors[ERR_REFIT_SAME_FITTER]
          - state_machines.ProductReturn.REQUESTED_to_DESTROYED
          - state_machines.ProductReturn.RESTOCKED_to_REFIT_ISSUED
          - endpoints[POST /dme/encounters/{id}/returns]
          - endpoints[POST /dme/returns/{id}/refit]
        distinguishing_aspect: |
          The return window is per-reason, so 31 days after delivery the SAME
          clinic can refuse a POOR_FIT return (30-day window, priority 54) and
          accept a DEFECT return (90-day window) on an identical device -- one
          clock, two answers. The 31st day also crosses RESTOCK_WINDOW_DAYS,
          so the DEFECT return inspected as SELLABLE still lands in DESTROYED
          rather than RESTOCKED, and its refund is nevertheless the full
