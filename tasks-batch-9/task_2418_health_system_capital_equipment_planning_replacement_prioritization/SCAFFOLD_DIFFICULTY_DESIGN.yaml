  - rule_id: resource_temporal_overlap
    instances:
      - name: department_downtime_buffered_half_open_boundary
        grounds:
          - validations[priority=84]
          - entities.InstallationProject.fields.downtime_start
          - entities.InstallationProject.fields.downtime_end
          - errors.ERR_DOWNTIME_WINDOW_CONFLICT
        distinguishing_aspect: >-
          Resource = the DEPARTMENT's clinical downtime slot, semantics = half-open interval with a
          24h buffer applied only to the INCOMING window: a start of 2027-03-05T23:59:59.999Z is
          rejected because 2027-03-04T23:59:59.999Z < the stored end 2027-03-05T00:00:00Z, while
          2027-03-06T00:00:00Z passes because the buffered start lands exactly on that end and the
          test is strict.
