scaffold_corner_design:

  # =======================================================================
  # Section: entities
  # =======================================================================
  - section: entities
    instances:
      - name: household_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - "entities.Household.fields.annual_allowance_items"
          - "entities.Household.fields.status"
        distinguishing_aspect: "Omitting annual_allowance_items yields default 4 and status ACTIVE with version 1; system fields id/created_at/updated_at are server-stamped."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /curbside/households"
              payload: { street_address: "100 Default Dr", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id, allow: $.data.annual_allowance_items, st: $.data.status, v: $.data.version }
          assert:
            - "Household.${hh_id}.annual_allowance_items == 4"
            - "Household.${hh_id}.status == ACTIVE"
            - "Household.${hh_id}.version == 1"
            - "Household.${hh_id}.suspension_reason == null"

      - name: household_get_not_found
        claim_type: not_found
        grounds:
          - "endpoints.GET_/curbside/households/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /curbside/households/00000000-0000-0000-0000-000000000000"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: pickup_item_invalid_category_rejected
        claim_type: type_constraint
        grounds:
          - "entities.PickupItem.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "An item whose category is not a declared enum member (e.g. 'SOFA') is rejected with ERR_INVALID_REQUEST 400 at add time."
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH ACTIVE; request R in DRAFT"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "2 Enum Ave", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "SOFA", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: pickup_item_duplicate_sequence_no_rejected
        claim_type: type_constraint
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Two items on the same request with the same sequence_no violate the per-request uniqueness constraint."
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH; DRAFT request already holding item sequence_no=1"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "3 Seq St", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "ELECTRONICS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "request still holds exactly 1 item"

      - name: pickup_request_computed_fields_rejected_as_input
        claim_type: computed_field
        grounds:
          - "entities.PickupRequest.fields.load_units"
          - "entities.PickupRequest.fields.provisional_total_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Computed fields are not client-writable: sending load_units or provisional_total_cents in the create body is rejected with ERR_INVALID_REQUEST (strict payload contract); a clean create returns both computed at 0."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_EAST"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "9 Computed Ct", service_zone: "ZONE_EAST" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}", load_units: 99, provisional_total_cents: 99999 }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { lu: $.data.load_units, pt: $.data.provisional_total_cents, st: $.data.status }
          assert:
            - "create with computed fields in body fails with error_id == ERR_INVALID_REQUEST"
            - "clean create returns load_units == 0, provisional_total_cents == 0, status == DRAFT"

      - name: fk_reverse_reachability_items_of_request
        claim_type: parent_relationship
        grounds:
          - "entities.PickupItem.fields.pickup_request_id"
          - "endpoints.GET_/curbside/pickup-requests/{id}/items"
        distinguishing_aspect: "Items are discoverable from the parent request via the sub-resource GET; empty request returns an empty array, not 404."
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_WEST; empty DRAFT request"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "4 FK Ln", service_zone: "ZONE_WEST" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /curbside/pickup-requests/${req_id}/items"
              as: Resident
              as_user_id: "${hh_id}"
          assert:
            - "response is 200 with data == [] and total_count == 0"

  # =======================================================================
  # Section: state_machines
  # =======================================================================
  - section: state_machines
    instances:
      - name: request_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.PickupRequest"
        distinguishing_aspect: "A freshly created request is DRAFT with route_day_id null, final_total_cents null, amnesty_applied false."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_NORTH"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "6 Init St", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { st: $.data.status, rd: $.data.route_day_id, ft: $.data.final_total_cents, am: $.data.amnesty_applied }
          assert:
            - "status == DRAFT, route_day_id == null, final_total_cents == null, amnesty_applied == false"

      - name: submit_without_items_returns_invalid_request
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.PickupRequest.DRAFT_to_SUBMITTED"
          - "validations[priority=14]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Submitting an item-less DRAFT fails with ERR_INVALID_REQUEST (zero-item edge), and no FeeAssessment is created."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_NORTH; empty DRAFT request"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "7 Zero Ave", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
            - call: "GET /curbside/pickup-requests/${req_id}/fee-assessments"
              as: Inspector
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "PickupRequest.${req_id}.status == DRAFT"
            - "fee-assessments list is empty"

      - name: submit_with_unacknowledged_preparation_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.PickupRequest.DRAFT_to_SUBMITTED"
          - "errors[ERR_PREPARATION_NOT_ACKED]"
        distinguishing_aspect: "An item with preparation_ack=false blocks submit with ERR_PREPARATION_NOT_ACKED 422 (distinct from ERR_PROHIBITED_ITEM)."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_SOUTH; DRAFT request with one MATTRESS item preparation_ack=false"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "8 Prep Pl", service_zone: "ZONE_SOUTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "MATTRESS", is_oversize: false, preparation_ack: false }
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PREPARATION_NOT_ACKED and http status == 422"
            - "status remains DRAFT"

      - name: cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.PickupRequest"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal: cancel on a completed request fails with ERR_INVALID_STATE; no side effects fire (invoice stays PENDING)."
        test_recipe:
          setup:
            - "Full happy path to COMPLETED: clock 2026-08-05, Household H ZONE_NORTH, RouteDay R 2026-08-10, 1-item request scheduled, clock advanced to 2026-08-10, route dispatched, request completed clean"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "11 Terminal Ter", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/pickup-requests/${req_id}/complete"
              payload: {}
              as: Driver
            - call: "GET /curbside/pickup-requests/${req_id}"
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_v_done: $.data.version }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/cancel"
              payload: { expected_request_version: "${req_v_done}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "FINAL_INVOICE assessment remains PENDING (no waiver fired)"

      - name: double_refuse_is_idempotency_error
        claim_type: idempotency
        grounds:
          - "state_machines.PickupRequest.SCHEDULED_to_REFUSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Repeating refuse on an already-REFUSED request fails with ERR_INVALID_STATE (no duplicate notifications, no double capacity release)."
        test_recipe:
          setup:
            - "Scheduled request on dispatched route, already REFUSED once with BLOCKED_ACCESS; route committed_load_units already released"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "13 Idem St", service_zone: "ZONE_EAST" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_EAST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/pickup-requests/${req_id}/refuse"
              payload: { refusal_reason_code: "BLOCKED_ACCESS" }
              as: Driver
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/refuse"
              payload: { refusal_reason_code: "UNSAFE_SETOUT" }
              as: Driver
              captures: { err: $.data.error_id }
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { load: $.data.committed_load_units }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "PickupRequest.${req_id}.refusal_reason_code == BLOCKED_ACCESS (first refusal stands)"
            - "RouteDay.${rd_id}.committed_load_units == 0 (released exactly once)"

      - name: route_close_blocked_while_stop_scheduled
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.RouteDay.DISPATCHED_to_CLOSED"
          - "errors[ERR_ROUTE_NOT_EMPTY]"
        distinguishing_aspect: "Bubble-up gate: close fails with ERR_ROUTE_NOT_EMPTY while any request on the route is still SCHEDULED."
        test_recipe:
          setup:
            - "Dispatched route with two stops; one COMPLETED, one still SCHEDULED"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "21 Close Ct", service_zone: "ZONE_WEST" }
              as: Dispatcher
              captures: { hh1: $.data.id }
            - call: "POST /curbside/households"
              payload: { street_address: "22 Close Ct", service_zone: "ZONE_WEST" }
              as: Dispatcher
              captures: { hh2: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh1}" }
              as: Resident
              as_user_id: "${hh1}"
              captures: { req1: $.data.id }
            - call: "POST /curbside/pickup-requests/${req1}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests/${req1}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests/${req1}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh1}"
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh2}" }
              as: Resident
              as_user_id: "${hh2}"
              captures: { req2: $.data.id }
            - call: "POST /curbside/pickup-requests/${req2}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/pickup-requests/${req2}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/pickup-requests/${req2}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/pickup-requests/${req1}/complete"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /curbside/route-days/${rd_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_NOT_EMPTY"
            - "RouteDay.${rd_id}.status == DISPATCHED"

      - name: dispatch_empty_route_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.RouteDay.OPEN_to_DISPATCHED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Dispatching a route with committed_stops == 0 fails with ERR_INVALID_STATE; dispatch requires at least one scheduled stop."
        test_recipe:
          setup: ["Clock 2026-08-10; empty RouteDay R ZONE_NORTH 2026-08-10 OPEN"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
          trigger:
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (empty-route dispatch precondition failure)"
            - "RouteDay.${rd_id}.status == OPEN"

  # =======================================================================
  # Section: calculations
  # =======================================================================
  - section: calculations
    instances:
      - name: load_units_oversize_multiplier
        claim_type: correct_result
        grounds:
          - "calculations.request_load_units"
        distinguishing_aspect: "An oversize STANDARD_FURNITURE item contributes 2*2=4 load units while its non-oversize twin contributes 2; load_units recomputes on item add and remove."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_NORTH; DRAFT request"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "31 Load Ln", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
