          - state_machines.ChargeItem.ACTIVE_to_INACTIVE
          - entities.RevenueCode.fields.status
          - entities.ChargeItem.fields.revenue_code_id
          - validations[priority=25]
          - errors.ERR_REVENUE_CODE_RETIRED
          - calculations.markup_compliance_ratio
        distinguishing_aspect: |
          The dependency crosses the ChargeItem -> RevenueCode pair: two distinct ChargeItem
          transitions (APPROVED -> ACTIVE on one item and INACTIVE -> ACTIVE on another) both become
          inadmissible purely because the referenced RevenueCode moved ACTIVE -> RETIRED, while
          nothing about either ChargeItem's own two status dimensions changed.
