          assert:
            - "Payment.${pay_1}.processing_status == REVERSED, total_offset_cents == 0, disbursed_cents == 0"
            - "both offsets of payment ${pay_1} are REVERSED (link 1)"
            - "Debt.${debt_1}: status ACTIVE, current_balance_cents == 30000 (link 2 — reopened from PAID_IN_FULL)"
            - "Debt.${debt_2}: status ACTIVE, current_balance_cents == 20000 (link 2)"
            - "CreditorAgency.${cred_fed}.remitted_net_total_cents == 0 (link 3 — 48500 credited at execute, 29100 + 19400 debited at reversal)"
            - "CreditorAgency.${cred_fed}.remitted_gross_ytd_cents == 0 and outstanding_receivable_cents == 50000"

      - name: dnp_record_creation_depth2
        grounds:
          - state_machines.Payment.VERIFIED_to_HELD
          - state_machines.Payment.HELD_to_VERIFIED
