            - call: "POST /sublicense-grants/${g3_id}/activate"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "Before the trigger: SublicenseGrant.${g1_id}.status == ACTIVE, ${g2_id}.status == PROPOSED, ${g3_id}.status == PROPOSED, Variety.${v_id}.active_sublicense_count == 1"
            - "Activating G2 returns 409 with data.error_id == ERR_EXCLUSIVITY_CONFLICT: 2027-01-15 falls inside G1's buffered window which ends 2027-01-30, even though it is 15 days AFTER G1's raw expiry 2026-12-31"
            - "After that rejection SublicenseGrant.${g2_id}.status is still PROPOSED and Variety.${v_id}.active_sublicense_count == 1"
            - "Activating G3 SUCCEEDS: 2027-02-05 is clear of the 2027-01-30 buffer boundary"
            - "SublicenseGrant.${g3_id}.status == ACTIVE and Variety.${v_id}.active_sublicense_count == 2"
            - "A NON_EXCLUSIVE grant on the same (variety, US-WA) with window [2027-01-15, 2027-03-31] would still conflict, because the rule fires when EITHER grant is EXCLUSIVE and G1 is"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: voiding_an_issued_tag_order_restores_quota_unit_inventory_exactly
        grounds:
          - calculations.quota_tag_inventory
          - state_machines.TagOrder.status.REQUESTED_to_ISSUED
          - state_machines.TagOrder.status.ISSUED_to_VOIDED
          - entities.ProductionQuota.fields.units_available
          - entities.ProductionQuota.fields.tags_committed_units
          - entities.ProductionQuota.fields.tags_activated_units
        distinguishing_aspect: |
          Conserved quantity type: TAG UNITS - a physical traceability inventory.
          Invariant I1, allocated_units == units_available + tags_committed_units,
          must hold at every observable instant, and void is the exact
          compensation of issue: units_available returns to the literal 20000 it
          held before issuance, with tags_activated_units never having moved.
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B PropagatorAgreement for US-WA."
            - "One ACTIVE ProductionQuota with allocated_units 20000, so before any tag activity units_available is 20000 and tags_committed_units is 0."
            - "One TagOrder REQUESTED for 12000 units - a request commits nothing."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Kettle Ridge Apple", species: "Malus domestica", breeder_code: "KR", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Kettle Ridge Growers", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id, q_ver: $.data.version }
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 12000, expected_quota_version: "${q_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /tag-orders/${t_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /tag-orders/${t_id}/void"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "Before the trigger: ProductionQuota.${q_id}.tags_committed_units == 0, units_available == 20000, tags_activated_units == 0, and I1 holds: 20000 == 20000 + 0"
            - "After issue: TagOrder.${t_id}.status == ISSUED, ProductionQuota.${q_id}.tags_committed_units == 12000, units_available == 8000, and I1 holds: 20000 == 8000 + 12000"
            - "After issue: TagOrder.${t_id}.serial_prefix == \"KR-2026S1-0001\" and ProductionQuota.${q_id}.tags_activated_units == 0"
            - "After void: TagOrder.${t_id}.status == VOIDED and voided_units == 12000"
            - "After void: ProductionQuota.${q_id}.tags_committed_units == 0 and units_available == 20000 - the exact pre-issue literal, with no drift"
            - "After void: ProductionQuota.${q_id}.tags_activated_units == 0 (never touched by either leg)"
            - "After void: I1 holds again: 20000 == 20000 + 0"
            - "A second POST /tag-orders/${t_id}/void returns ERR_TERMINAL_STATE (409) and leaves the inventory untouched"

      - name: reversing_a_settlement_restores_propagator_royalty_payable_exactly
        grounds:
          - calculations.propagator_royalty_ledger
          - state_machines.RoyaltyReport.settlement_status.UNSETTLED_to_SETTLED
          - state_machines.RoyaltyReport.settlement_status.SETTLED_to_REVERSED
          - entities.Propagator.fields.royalty_payable_cents
          - entities.Propagator.fields.royalty_settled_cents
          - validations[priority=12]
        distinguishing_aspect: |
          A different conserved-quantity type: MONEY, in integer cents, on a
          different entity pair (RoyaltyReport settlement dimension against the
          Propagator ledger). Invariant I2, royalty_payable_cents +
          royalty_settled_cents == the sum of booked_amount_cents over ACCEPTED
          reports, holds across both legs, and reverse restores
          royalty_payable_cents to the exact literal 458850 it held pre-settle
          rather than recomputing an approximation.
        test_recipe:
          setup:
            - "The royalty base chain with reported_units 12000 exactly matching tags_activated_units 12000, so no overrun penalty arises: base_royalty_cents_per_plant 35, TIER_A, DOMESTIC, volume band 0.95, effective_rate_cents 38.2375."
            - "The report is submitted on time and ACCEPTED by officer-2 (distinct from countersigner officer-1), giving booked_amount_cents 458850."
            - "Settlement will be performed by officer-3, distinct from the accepting officer-2, so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Wheatland Gala", species: "Malus domestica", breeder_code: "WG", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Wheatland Propagation", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_A", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id, q_ver: $.data.version }
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 12000, expected_quota_version: "${q_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { t_id: $.data.id }
            - call: "POST /tag-orders/${t_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /tag-orders/${t_id}/reconcile"
              payload: { activated_units: 12000 }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 12000, expected_report_version: "${r_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /royalty-reports/${r_id}/settle"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-3"
            - call: "POST /royalty-reports/${r_id}/reverse"
              payload: { reversal_note: "bank return" }
              as: LicensingOfficer
              as_user_id: "officer-3"
          assert:
            - "Before the trigger: RoyaltyReport.${r_id}.booked_amount_cents == 458850, settlement_status == UNSETTLED, Propagator.${p_id}.royalty_payable_cents == 458850, royalty_settled_cents == 0, and I2 holds: 458850 + 0 == 458850"
            - "After settle: RoyaltyReport.${r_id}.settlement_status == SETTLED and settled_by_user_id == \"officer-3\""
            - "After settle: Propagator.${p_id}.royalty_payable_cents == 0 and royalty_settled_cents == 458850, and I2 holds: 0 + 458850 == 458850"
            - "After reverse: RoyaltyReport.${r_id}.settlement_status == REVERSED and settled_by_user_id is null"
            - "After reverse: Propagator.${p_id}.royalty_payable_cents == 458850 - the exact pre-settle literal - and royalty_settled_cents == 0, and I2 holds again: 458850 + 0 == 458850"
            - "After reverse: RoyaltyReport.${r_id}.review_status is still ACCEPTED and booked_amount_cents is still 458850 - the reversal compensates the settlement only"
            - "A POST /royalty-reports/${r_id}/settle attempted by officer-2 (the acceptor) would return ERR_SEGREGATION_OF_DUTIES (403), so the compensation pair is only reachable through a third officer"
            - "A second POST /royalty-reports/${r_id}/reverse returns ERR_TERMINAL_STATE (409), because REVERSED is terminal on the settlement dimension"
