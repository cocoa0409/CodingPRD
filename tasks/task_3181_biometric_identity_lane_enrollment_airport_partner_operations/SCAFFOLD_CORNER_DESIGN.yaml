              captures: { s4: $.data.id }
            - call: "POST /venues/${ven_id}/payout-settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", verification_revenue_cents: 0, events_count: 5, venue_capacity_seats: 8000 }
              as: VenueOps
              captures: { s5: $.data.id }
          assert:
            - "AgreementSettlement.${s4}.fee_cents == 5000 (variable 160 below floor)"
            - "AgreementSettlement.${s5}.fee_cents == 6160 (160 + 5*1200 — fee earned on all 5 events at threshold crossing)"

