        distinguishing_aspect: "The 30-day dispute window is measured from returned_at on the logical clock: returned 2026-09-10, a dispute at 2026-10-11 (31 days later) fails 409 ERR_DISPUTE_WINDOW_EXPIRED; this setup also exercises the null-appraisal path (computed_depreciation_cents == 0 when no ACCEPTED valuation exists)."
