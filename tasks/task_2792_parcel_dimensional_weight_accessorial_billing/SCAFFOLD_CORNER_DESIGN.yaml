              payload: { outcome: "UPHELD" }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { e6: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-09T00:00:00Z" }
              as: BillingOps
              captures: { e7: $.data.error_id }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "MANUAL_REWEIGH", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 9.0, expected_shipment_version: "${p_v}" }
