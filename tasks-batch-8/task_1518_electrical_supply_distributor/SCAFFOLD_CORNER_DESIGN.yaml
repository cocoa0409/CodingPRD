# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Electrical Supply Distributor
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_contractor_initializes_computed_balances
        claim_type: creation
        grounds: [entities.Contractor.fields.invoiced_balance_cents, entities.Contractor.fields.committed_balance_cents]
        distinguishing_aspect: "A new contractor starts with all computed credit balances at 0 and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Romeo Electric", credit_limit_cents: 250000 }
              as: CreditManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /distributor/contractors/${c_id}"
              as: CreditManager
          assert:
            - "Contractor.${c_id}.invoiced_balance_cents == 0"
            - "Contractor.${c_id}.committed_balance_cents == 0"
            - "Contractor.${c_id}.credit_used_cents == 0"
            - "Contractor.${c_id}.version == 1"

      - name: create_contractor_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Contractor.fields.invoiced_balance_cents]
        distinguishing_aspect: "Client-supplied computed fields are ignored, not stored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributor/contractors"
              payload: { name: "Sierra Electric", credit_limit_cents: 100000, invoiced_balance_cents: 99999 }
              as: CreditManager
              captures: { c_id: $.data.id }
          assert:
            - "Contractor.${c_id}.invoiced_balance_cents == 0 (client input 99999 ignored)"

      - name: create_catalog_item_missing_sku_rejected
        claim_type: required_fields
        grounds: [entities.CatalogItem.fields.sku, "validations[priority=3]"]
        distinguishing_aspect: "Missing required field sku is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributor/catalog-items"
              payload: { manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 2500 }
              as: WarehouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: foot_item_missing_min_cut_rejected
        claim_type: type_constraints
        grounds: [entities.CatalogItem.fields.min_cut_ft, "validations[priority=3]"]
        distinguishing_aspect: "A FOOT item without min_cut_ft violates the conditional reel-field constraint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributor/catalog-items"
              payload: { sku: "THHN-12CU", manufacturer_name: "Southwire", sell_uom: "FOOT", list_price_cents: 45.25, reel_length_ft: 500, cut_charge_cents: 1500 }
              as: WarehouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (min_cut_ft required when sell_uom == FOOT)"

      - name: get_unknown_quote_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_QUOTE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent quote id returns 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /distributor/quotes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_NOT_FOUND and http status == 404"

      - name: contractors_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count + has_more."
        test_recipe:
          setup: ["three contractors exist"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "C1", credit_limit_cents: 100000 }
              as: CreditManager
            - call: "POST /distributor/contractors"
              payload: { name: "C2", credit_limit_cents: 100000 }
              as: CreditManager
            - call: "POST /distributor/contractors"
              payload: { name: "C3", credit_limit_cents: 100000 }
              as: CreditManager
          trigger:
            - call: "GET /distributor/contractors"
              payload: { limit: 2, offset: 0 }
              as: SalesRep
          assert:
            - "response page 1: 2 items, total_count == 3, has_more == true"
            - "GET with limit 2 offset 2: 1 item, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_created_in_draft_initial
        claim_type: initial_state
        grounds: [state_machines.Quote]
        distinguishing_aspect: "A new quote starts in DRAFT with revision_no 1."
        test_recipe:
          setup: ["contractor + FIRM job exist"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Tango Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Init Job", jobsite_address: "24 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.status == DRAFT"
            - "Quote.${q_id}.revision_no == 1"
            - "Quote.${q_id}.award_index_value == null"

      - name: award_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Quote.SUBMITTED_to_AWARDED, "errors[ERR_QUOTE_NOT_SUBMITTED]"]
        distinguishing_aspect: "Award requires SUBMITTED; a DRAFT quote cannot be awarded."
        test_recipe:
          setup: ["contractor, FIRM job, DRAFT quote"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Uniform Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Draft Job", jobsite_address: "25 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_NOT_SUBMITTED and Quote.${q_id}.status remains DRAFT"

      - name: revise_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Quote.SUBMITTED_to_DRAFT, "errors[ERR_QUOTE_NOT_SUBMITTED]"]
        distinguishing_aspect: "Revise requires SUBMITTED; a DRAFT quote with a matching version still fails on state."
        test_recipe:
          setup: ["contractor, FIRM job, DRAFT quote (version 1)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Victor Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Revise Job", jobsite_address: "26 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id, q_v: $.data.version }
          trigger:
            - call: "POST /distributor/quotes/${q_id}/revise"
              payload: { expected_quote_version: "${q_v}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_NOT_SUBMITTED (OCC version matched, state gate fires)"

      - name: submit_quote_with_no_lines_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Quote.DRAFT_to_SUBMITTED, "errors[ERR_QUOTE_HAS_NO_LINES]"]
        distinguishing_aspect: "Submit is blocked until the BOM takeoff has at least one line."
        test_recipe:
          setup: ["contractor, FIRM job, DRAFT quote with zero lines"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Whiskey Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Empty Job", jobsite_address: "27 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_HAS_NO_LINES and Quote.${q_id}.status remains DRAFT"

      - name: expired_quote_lazy_transition_on_read
        claim_type: invalid_transition
        grounds: [state_machines.Quote.SUBMITTED_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "When the logical clock passes valid_until, reads report EXPIRED and submit is refused with ERR_QUOTE_EXPIRED."
        test_recipe:
          setup: ["quote valid_until 2026-08-10 with one line, SUBMITTED; clock then set to 2026-08-20"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Xray Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 2500 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Expiry Job", jobsite_address: "28 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2026-08-10" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 1, unit_price_cents: 2500 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_EXPIRED"
            - "Quote.${q_id}.status == EXPIRED (lazy transition applied)"

      - name: cancel_terminal_release_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Release.REQUESTED_to_CANCELLED, "errors[ERR_RELEASE_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A CANCELLED release is terminal; a second cancel fails."
        test_recipe:
          setup: ["release in REQUESTED (contractor, FIRM job, awarded quote with BRK-20A line qty 1 @ 5000)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Yankee Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 5000 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Cancel Job", jobsite_address: "29 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r_id: $.data.id }
            - call: "POST /distributor/releases/${r_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /distributor/releases/${r_id}/cancel"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RELEASE_NOT_CANCELLABLE and Release.${r_id}.status remains CANCELLED"

      - name: deliver_requires_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Release.SCHEDULED_to_DELIVERED, "errors[ERR_RELEASE_NOT_SCHEDULED]"]
        distinguishing_aspect: "Deliver is only valid from SCHEDULED; an ALLOCATED release cannot be delivered."
        test_recipe:
          setup: ["release through ALLOCATED (stock 5 on hand)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Zulu Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 5000 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/catalog-items/${item_id}/stock-receipts"
              payload: { qty: 5 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Deliver Job", jobsite_address: "30 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r_id: $.data.id }
            - call: "POST /distributor/releases/${r_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r_id}/allocate"
              payload: {}
              as: WarehouseManager
          trigger:
            - call: "POST /distributor/releases/${r_id}/deliver"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RELEASE_NOT_SCHEDULED and Release.${r_id}.status remains ALLOCATED"

      - name: invoice_requires_delivered_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Release.DELIVERED_to_INVOICED, "errors[ERR_RELEASE_NOT_DELIVERED]"]
        distinguishing_aspect: "Invoice is only valid from DELIVERED; a SCHEDULED release cannot be invoiced."
        test_recipe:
          setup: ["release through SCHEDULED (stock 5)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Alpha Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 5000 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/catalog-items/${item_id}/stock-receipts"
              payload: { qty: 5 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Invoice Job", jobsite_address: "31 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r_id: $.data.id }
            - call: "POST /distributor/releases/${r_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-10", window_start_hour: 8, window_end_hour: 12 }
              as: Dispatcher
          trigger:
            - call: "POST /distributor/releases/${r_id}/invoice"
              payload: {}
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RELEASE_NOT_DELIVERED and Release.${r_id}.status remains SCHEDULED"

      - name: cancel_partial_release_cancels_backorders
        claim_type: side_effect_execution
        grounds: [state_machines.Release.PARTIALLY_ALLOCATED_to_CANCELLED, state_machines.BackorderAllocation.OPEN_to_CANCELLED]
        distinguishing_aspect: "Cancelling a PARTIALLY_ALLOCATED release returns allocated stock AND cancels its OPEN backorders (conditional cascade)."
        test_recipe:
          setup: ["THHN-12CU stock 100; release [{THHN, 300}] approved + allocated -> PARTIALLY_ALLOCATED (line allocated 100, backorder qty_open 200)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Bravo Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "THHN-12CU", manufacturer_name: "Southwire", sell_uom: "FOOT", list_price_cents: 45.25, reel_length_ft: 500, min_cut_ft: 50, cut_charge_cents: 1500 }
              as: WarehouseManager
              captures: { thhn_id: $.data.id }
            - call: "POST /distributor/catalog-items/${thhn_id}/stock-receipts"
              payload: { qty: 100 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Partial Job", jobsite_address: "32 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${thhn_id}", qty: 300, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${thhn_id}", qty: 300 }] }
              as: SalesRep
              captures: { r_id: $.data.id }
            - call: "POST /distributor/releases/${r_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "GET /distributor/release-lines"
              payload: { release_id: "${r_id}" }
              as: WarehouseManager
              captures: { rl_id: $.data.0.id }
            - call: "GET /distributor/backorder-allocations"
              payload: { release_line_id: "${rl_id}" }
              as: WarehouseManager
              captures: { bo_id: $.data.0.id }
          trigger:
            - call: "POST /distributor/releases/${r_id}/cancel"
              payload: {}
              as: SalesRep
          assert:
            - "BackorderAllocation.${bo_id}.status == CANCELLED"
            - "ReleaseLine.${rl_id}.status == CANCELLED"
            - "CatalogItem.${thhn_id}.stock_on_hand == 100 and stock_allocated == 0"
            - "Contractor.${c_id}.committed_balance_cents == 0"

      - name: close_job_with_open_release_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.JobAccount.OPEN_to_CLOSED, "errors[ERR_JOB_HAS_OPEN_RELEASES]"]
        distinguishing_aspect: "Close is guarded by child state: a job with a non-terminal release cannot close."
        test_recipe:
          setup: ["job with a release in REQUESTED"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Charlie Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 5000 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Close Job", jobsite_address: "33 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
