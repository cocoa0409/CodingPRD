            - "Transaction.${tx_b}.coordination_status is still REVIEW"
            - "the matched pair returns 200 and Transaction.${tx_a}.coordination_status == CLOSED"
            - "GET /agents/${agent_id}/open-client-counts returns active_client_count == 1 (only one cascade fired)"

      - name: run_ops_marks_a_confirmed_tour_as_cancelled_no_show_after_the_grace
        claim_type: Conditional action
        grounds:
          - calculations.tour_no_show_timeout
          - endpoints.POST_/regions/{id}/run-ops
