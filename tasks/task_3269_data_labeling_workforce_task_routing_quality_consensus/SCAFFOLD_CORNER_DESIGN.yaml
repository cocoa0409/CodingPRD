              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${owner_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${other_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the mismatched identity is refused with ERR_UNAUTHORIZED at status 403"
            - "the assignment stays DISPATCHED and its committed_value remains null"
            - "the true owner committing the same assignment with the same payload succeeds at 200"
            - "the owner may then read the assignment at GET /api/commits/${c1_id} at 200, so reads are broader than the ownership-bound write"

      - name: only_the_admin_may_move_the_logical_clock
        claim_type: hierarchical_override
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/api/_clock/set_current_utc
        distinguishing_aspect: "The logical clock is admin exclusive, so neither the reviewer nor the worker role can advance it, and the server default holds until an admin sets it."
        test_recipe:
          setup:
            - "Empty database; a worker exists whose identity the worker-role clock call will carry."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformReviewer
              captures: { err: "$.data.error_id" }
          assert:
            - "the reviewer clock call returns ERR_UNAUTHORIZED at status 403"
            - "the worker clock call also returns ERR_UNAUTHORIZED at status 403"
            - "the same call as PlatformAdmin succeeds at 200 and the clock then reads 2026-09-15T00:00:00Z"
            - "before any admin call the clock reads exactly 2026-09-01T00:00:00Z rather than wall clock time"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_program_version_blocks_spec_unit_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[spec-unit-create-stale-program]
          - errors[ERR_STALE_VERSION]
          - entities.CustomerProgram.version
        distinguishing_aspect: "A decomposition submitted against a version the client read before the engagement advanced is refused at priority 4 with the OCC error, and the advancing write that moved the version is the engagement open cascade."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement created and then opened, which advanced its version past the create response."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v_open: "$.data.version" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
              captures: { prog_v_after_open: "$.data.version" }
          trigger:
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v_open}" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the create is refused with ERR_STALE_VERSION at status 412, because the open cascade advanced the engagement version"
            - "the current version is greater than the version the client read, confirming the stale input"
            - "re-issuing the identical create with expected_program_version set to the current version succeeds at 201"
            - "the rejected create left no unit row behind, so a unit list on the engagement still returns zero rows"

      - name: gold_grade_with_a_stale_item_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[gold-grade-stale-item]
          - errors[ERR_STALE_VERSION]
          - entities.LabelingItem.version
        distinguishing_aspect: "Grading an audit against a piece version the reviewer read before the piece advanced is refused, and the stale version is reached by an intervening rework open rather than by any engagement level write."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit at panel_size 1 holding one committed piece whose single member has been paid, then an audit created against it."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "priya-nair" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 1.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${w_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
            - call: "POST /api/commits/${c1_id}/gold-audits"
              payload: { gold_task_key: "gold-000001" }
              as: PlatformReviewer
              captures: { g1_id: "$.data.id" }
            - call: "GET /api/items/${it1_id}"
              payload: {}
              as: PlatformReviewer
              captures: { it_v_before: "$.data.version" }
            - call: "POST /api/items/${it1_id}/reviewer-action"
              payload: { reviewer_action: "OPEN_REWORK" }
              as: PlatformReviewer
          trigger:
            - call: "POST /api/gold-audits/${g1_id}/grade-audit"
              payload: { gold_outcome: "PASSED", expected_item_version: "${it_v_before}" }
              as: PlatformReviewer
              captures: { err: "$.data.error_id" }
          assert:
            - "the grade is refused with ERR_STALE_VERSION at status 412, because the rework open advanced the piece version after the reviewer read it"
            - "the piece rework_cycles is 1 and consensus_status is REWORK, confirming the intervening write"
            - "re-issuing the identical grade with the current piece version succeeds at 200 and records gold_outcome PASSED"
            - "the refused grade left the qualification counters untouched"

      - name: sensitive_program_withholds_the_payload_handle_and_restricted_class_requires_expert
        claim_type: multi_tenancy
        grounds:
          - entities.LabelingItem.payload_uri
          - entities.WorkerQualification.restricted_accessible
          - calculations.worker_selection
        distinguishing_aspect: "Engagement sensitivity gates both the read surface and the pool: SENSITIVE hides the payload handle while RESTRICTED additionally requires an EXPERT qualification that is still QUALIFIED."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX RESTRICTED engagement with one published unit at panel_size 1 holding one released piece, and one worker whose es-MX qualification is PROFICIENT."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Restricted", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "RESTRICTED", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/secret/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
          trigger:
            - call: "GET /api/items/${it1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seen_uri: "$.data.payload_uri" }
          assert:
            - "the piece read returns 200 and payload_uri is absent or null, because the engagement class is RESTRICTED"
            - "the same read against a STANDARD engagement returns payload_uri \"s3://ax/secret/0001\", so the withholding is sensitivity driven"
            - "a dispatch against the RESTRICTED engagement with a PROFICIENT qualification in the pool returns ERR_NO_ELIGIBLE_WORKER at status 422, because restricted access needs an EXPERT qualification"
            - "the same worker upgraded to EXPERT and verified becomes eligible and the dispatch succeeds at 200"
            - "an EXPERT qualification on an incident restricted worker is still excluded, so the two eligibility terms are independent"

      - name: dispatching_fulfills_the_panel_within_one_request
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_/api/items/{id}/dispatch-panel
          - entities.SpecUnit.panel_size
          - errors[ERR_PANEL_ALREADY_DISPATCHED]
        distinguishing_aspect: "Panel dispatch is all or nothing per request: a partial pool produces a partial panel rather than a rollback, and a fully dispatched panel refuses any further top-up."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit at panel_size 3 holding one released piece and a pool of two verified es-MX workers."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "mira-vega" }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { b_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 3 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 3 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${a_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${a_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/workers/${b_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${b_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
          trigger:
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
              captures: { ok: "$.data.id" }
          assert:
            - "the dispatch succeeds at 200 even though the pool is one member short of panel_size 3, so a partial panel is dispatched rather than rolled back"
            - "the commit list on the piece then holds exactly 2 assignments rather than 3"
            - "the tie-break gate still demands the engagement quorum of 3, so the under-filled panel cannot certify without a reviewer action"
            - "a second dispatch before any commit is not refused, because the count is 2 and strictly below panel_size"
            - "the piece never creates a third assignment from the same member, because the selector excludes owners of existing assignments"

      - name: duplicate_unit_code_is_refused_by_the_uniqueness_gate
        claim_type: bulk_operations
        grounds:
          - errors[ERR_UNIT_CODE_DUPLICATE]
          - entities.SpecUnit.unit_code
          - entities.LabelingItem.item_key
        distinguishing_aspect: "Uniqueness is scoped to the parent: a unit code repeats freely across programmes but never inside one, and an item key repeats freely across units but never inside its unit."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "One es-MX engagement holding a unit U-1 with a piece keyed i-0001."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id", prog_v2: "$.data.version" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 5, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v2}" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the second unit with the same code returns ERR_UNIT_CODE_DUPLICATE at status 409"
            - "the same code is accepted under a second engagement, so the scope is per engagement rather than global"
            - "attaching a second piece with item_key i-0001 to the same unit is also refused, while the same key is accepted on a different unit"
            - "the failed creates left the unit and item counts unchanged"


      - name: dispatch_gate_on_parent_unit_state_already_exercised
        claim_type: cross_entity_validation
        grounds:
          - state_machines.SpecUnit.DRAFT_to_ACTIVE
          - state_machines.LabelingItem.PENDING_to_ROUTED
        excluded_because:
          difficulty_instance: item_release_requires_parent_unit_active
          rationale: "The cross-entity gate where a piece may not dispatch while its parent unit is still DRAFT is asserted as the failure path of the named §1.8 cross-entity instance."

      - name: engagement_and_unit_accuracy_dual_variant_already_exercised
        claim_type: dual_variant_calculation
        grounds:
          - calculations.program_accuracy.variants[accepted]
          - calculations.program_accuracy.variants[provisional]
        excluded_because:
          difficulty_instance: accepted_vs_provisional_program_accuracy_split
          rationale: "The divergence between the accepted and provisional accuracy numerators on the same audit set is the subject of the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: derived_counts_are_visible_in_the_same_request_that_changes_them
        claim_type: immediate
        grounds:
          - entities.SpecUnit.item_count
          - entities.CustomerProgram.demand_points
          - endpoints.POST_/api/spec-units/{id}/items
        distinguishing_aspect: "The denormalised counters are consistent inside the mutating response itself, so no read-then-recompute step is needed to observe them."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement holding one published unit with two attached pieces."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0002", payload_uri: "s3://ax/0002" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0003", payload_uri: "s3://ax/0003" }
              as: PlatformAdmin
              captures: { parent_count: "$.data.id" }
          assert:
            - "after the third attachment the unit item_count is 3 and remaining_item_slots is 7, both of them readable without a second call"
            - "engagement demand_points reflects the STANDARD weight of 1 times max_items 10, so it reads 10 from the one unit"
            - "the third piece carries item_seq 3, so the insertion sequence is assigned inside the mutating request"
            - "a unit with max_items 10 refuses an eleventh attachment once item_count has reached the ceiling"

      - name: program_freeze_compensates_the_whole_production_state
        claim_type: saga
        grounds:
          - state_machines.CustomerProgram.ACTIVE_to_FROZEN
          - state_machines.Commit.DISPATCHED_to_COMMIT_EXPIRED
