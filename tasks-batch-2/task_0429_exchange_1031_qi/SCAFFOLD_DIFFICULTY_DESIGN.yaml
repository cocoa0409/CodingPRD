              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "ACQUISITION", amount: 999999, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "dual-op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (priority-6 safety beats priority-13 fiscal; officer dual-op == coordinator dual-op)"
            - "HTTP status == 403"

  # =====================================================================
