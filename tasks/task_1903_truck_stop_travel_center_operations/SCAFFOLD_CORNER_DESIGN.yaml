  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: endpoint_response_envelope_shape
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Every response uses the fixed envelope: success has meta.api_request_id + response_type object/array + data; error has response_type error + data.error_id + data.message."
        test_recipe:
          setup: ["One site"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site E1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager }
            - { call: "GET /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: GeneralManager, captures: { err: "$.data.error_id" } }
          assert:
            - "success body: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data holds the site"
            - "error body: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

      - name: endpoint_dashboard_computed_read
        claim_type: computed_read
        grounds:
          - "endpoints.GET /sites/{id}/dashboard"
        distinguishing_aspect: "Dashboard is a computed read over live state: 2 pumps with 1 IN_USE, 1 ACTIVE parking reservation, 1 QUEUED shower ticket, 1 low-stock item; all six counters asserted literally."
