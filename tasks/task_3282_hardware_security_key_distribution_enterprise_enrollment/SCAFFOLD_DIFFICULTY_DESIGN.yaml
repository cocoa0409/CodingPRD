        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org17}/purchase-orders/${po17}/keys
        payload:
          keys:
          - serial_number: Q-001
            firmware_version: 5.4.3
        as: LogisticsCoordinator
        as_user_id: logc1
        captures:
          k17: $.data[0].id
      trigger:
      - call: POST /v1/organizations/${org17}/security-keys/${k17}/assign
        payload:
          identity_account_id: ${acct17}
        as: SecurityAdmin
        as_user_id: seca1
      - call: GET /v1/organizations/${org17}/security-keys
        payload:
          hardware_status: ASSIGNED
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          assigned_count: $.meta.total_count
      - call: POST /v1/organizations/${org17}/security-keys/${k17}/return-to-stock
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          k17_final: $.data.hardware_status
          k17_acct: $.data.assigned_identity_account_id
      - call: GET /v1/organizations/${org17}/security-keys
        payload:
          hardware_status: ASSIGNED
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          assigned_after: $.meta.total_count
      - call: GET /v1/organizations/${org17}/security-keys
        payload:
          assigned_identity_account_id: ${acct17}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          acct_keys_after: $.meta.total_count
      assert:
      - assigned_count == 1 (forward action)
      - k17_final == PRE_REGISTERED
      - k17_acct == null
      - assigned_after == 0 and acct_keys_after == 0 (compensating action restored the conserved quantity)
