            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C16", title: "Corner cascade probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000116" }
