            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
            - *c_t1p
            - *c_t1a
            - *c_d1t
            - *c_d1d
            - *c_d1c
            - call: "POST /evfleet/uptime-contracts"
              payload: { fleet_customer_id: "${cust_id}", committed_uptime_pct: 97.0, monthly_service_fee_cents: 2000000, pro_rating: "ROUTE_DAY", measurement_start_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { uc_id: $.data.id }
          trigger:
