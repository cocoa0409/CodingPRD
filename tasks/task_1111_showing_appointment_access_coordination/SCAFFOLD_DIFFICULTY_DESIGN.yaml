            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB18", contact_email: "sb18@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "101 Strike St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/cancel", payload: { reason: "late change" }, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { pts_mid: $.data.active_strike_points } }
            - { call: "GET /showing-desk/agents/${ba_id}/strikes", payload: {}, as: PlatformAdmin, captures: { strike_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /showing-desk/strikes/${strike_id}/forgive", payload: { reason: "first offense" }, as: PlatformAdmin, captures: { sk_st: $.data.status } }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { pts_end: $.data.active_strike_points, standing_end: $.data.standing } }
          assert:
            - "after late cancel: active_strike_points == 10"
            - "after forgive: strike status == FORGIVEN, active_strike_points == 0, standing == GOOD_STANDING"
