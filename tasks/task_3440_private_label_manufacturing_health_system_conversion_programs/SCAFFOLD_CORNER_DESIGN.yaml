              payload: { lot_code: "LOT-RB2", product_id: "${rp_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_UNAUTHORIZED_ROLE"
      - name: sod_lot_self_disposition_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6.3]", "errors[ERR_SOD_LOT_DISPOSITION]", "roles[ManufacturingPlanner]", "roles[QualityManager]"]
        distinguishing_aspect: "Segregation of duties is person-keyed: even with the QualityManager role, X-User-ID equal to lot.created_by ('planner-1') is rejected."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL non-sterile product NP; lot L created by planner-1"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "RB3-P", name: "SoD item", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { np_id: $.data.id }
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-RB3", product_id: "${np_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QualityManager
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_SOD_LOT_DISPOSITION"
            - "ManufacturingLot.${lot_id}.status remains AWAITING_QA"
      - name: sod_tray_self_approval_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6.4]", "errors[ERR_SOD_SELF_APPROVAL]"]
        distinguishing_aspect: "The tray proposer cannot record the approval decision: proposed_by == acting X-User-ID fails with ERR_SOD_SELF_APPROVAL, while a different admin approves."
        test_recipe:
          setup: ["Facility F; product C1; tray T proposed by admin-1 (PENDING_APPROVAL)"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac RB4", health_system_name: "HS RB4", facility_type: "SURGERY_CENTER", ship_to_address: "60 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "RB4-C", name: "Tray comp", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /supply/tray-templates"
              payload: { facility_id: "${fac_id}", name: "SoD tray", procedure_type: "GENERAL", sterile_assembly: false, components: [ { product_id: "${c1_id}", quantity: 1 } ] }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_id: $.data.id, tray_v1: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 2 } ], expected_template_version: "${tray_v1}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /supply/tray-templates/${tray_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /supply/tray-templates/${tray_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: SupplyChainAdmin
              as_user_id: "admin-2"
              captures: { st: $.data.status }
          assert:
            - "admin-1 (the proposer): HTTP 403 with error_id == ERR_SOD_SELF_APPROVAL"
            - "admin-2 (different person, same role): HTTP 200, status == ACTIVE"
      - name: facility_director_cannot_touch_other_facility_tray
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FACILITY_MISMATCH]", "roles[FacilitySupplyDirector]"]
        distinguishing_aspect: "entity_backed ownership: FacilitySupplyDirector with X-User-ID == facility A proposing a change on facility B's tray is rejected with ERR_FACILITY_MISMATCH."
        test_recipe:
          setup: ["Facilities FA and FB; product C1; tray TB belonging to FB (version captured)"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac A5", health_system_name: "HS 5", facility_type: "CLINIC", ship_to_address: "61 Vine St" }
              as: SupplyChainAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /supply/facilities"
              payload: { name: "Fac B5", health_system_name: "HS 5", facility_type: "CLINIC", ship_to_address: "62 Vine St" }
              as: SupplyChainAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "RB5-C", name: "Tray comp 5", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /supply/tray-templates"
              payload: { facility_id: "${fb_id}", name: "B tray", procedure_type: "GENERAL", sterile_assembly: false, components: [ { product_id: "${c1_id}", quantity: 1 } ] }
              as: SupplyChainAdmin
              captures: { tb_id: $.data.id, tb_v1: $.data.version }
          trigger:
            - call: "POST /supply/tray-templates/${tb_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 5 } ], expected_template_version: "${tb_v1}" }
              as: FacilitySupplyDirector
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FACILITY_MISMATCH"
            - "TrayTemplate.${tb_id} remains DRAFT at version 1"

  - section: complexity_layers
    instances:
      - name: occ_tray_propose_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tray-propose-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale expected_template_version is rejected 412 even though the transition itself (PENDING_APPROVAL self-loop) is legal — OCC is the only failure."
        test_recipe:
          setup: ["Facility F; product C1; tray T (version 1) already proposed once (version 2, PENDING_APPROVAL)"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac OCC1", health_system_name: "HS O1", facility_type: "SURGERY_CENTER", ship_to_address: "63 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "OC-1", name: "OCC comp", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /supply/tray-templates"
              payload: { facility_id: "${fac_id}", name: "OCC tray", procedure_type: "GENERAL", sterile_assembly: false, components: [ { product_id: "${c1_id}", quantity: 1 } ] }
              as: SupplyChainAdmin
              captures: { tray_id: $.data.id, tray_v1: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 2 } ], expected_template_version: "${tray_v1}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_v2: $.data.version }
          trigger:
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 3 } ], expected_template_version: "${tray_v1}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_VERSION (expected 1 but version is 2)"
            - "TrayTemplate.${tray_id}.version remains 2 and components unchanged (quantity 2)"
      - name: occ_disruption_allocation_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disruption-allocation-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale expected_disruption_version on an allocation is rejected 412; the first allocation's version bump is what the loser observes."
        test_recipe:
          setup: ["Facility F; product DP; disruption D disrupted_quantity 100 (version 1); first allocation of 10 applied (version 2)"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac OCC2", health_system_name: "HS O2", facility_type: "ACUTE_CARE", ship_to_address: "64 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "OC-D", name: "Scarce OCC", brand_type: "BRANDED", category: "EXAM_GLOVES", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 20 }
              as: SupplyChainAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /supply/supply-disruptions"
              payload: { product_id: "${dp_id}", disrupted_quantity: 100, reason: "DEMAND_SURGE", severity: "LOW", expected_resolution_date: "2026-12-01" }
              as: SupplyChainAdmin
              captures: { dis_id: $.data.id, dis_v1: $.data.version }
            - call: "POST /supply/supply-disruptions/${dis_id}/allocations"
              payload: { facility_id: "${fac_id}", quantity: 10, expected_disruption_version: "${dis_v1}" }
              as: SupplyChainAdmin
              captures: { dis_v2: $.data.version }
          trigger:
            - call: "POST /supply/supply-disruptions/${dis_id}/allocations"
              payload: { facility_id: "${fac_id}", quantity: 5, expected_disruption_version: "${dis_v1}" }
              as: SupplyChainAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_VERSION (expected 1 but version is 2)"
            - "remaining_pool remains 90 and allocated_total remains 10"
      - name: quarantine_cascade_skips_terminal_lots
        claim_type: cascading_side_effects
        grounds: ["state_machines.ManufacturingLot.AWAITING_QA_to_QUARANTINED", "state_machines.SterilizationBatch.SCHEDULED_to_COMPLETED"]
        distinguishing_aspect: "Conditional cascade: a FAILED batch quarantines only lots still AWAITING_QA; the lot already REJECTED (terminal) keeps its state and disposition fields."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL sterile product SP; lots L1 and L2 (created by planner-1) in batch B; L2 already REJECTED by qm-1 while batched"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "QC-P", name: "Quarantine item", brand_type: "PRIVATE_LABEL", category: "STERILIZATION_SUPPLIES", sterile: true, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-Q1", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { l1_id: $.data.id }
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-Q2", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { l2_id: $.data.id }
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "B-QC", chamber_id: "CH-3", scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", lot_ids: ["${l1_id}", "${l2_id}"] }
              as: ManufacturingPlanner
              captures: { b_id: $.data.id }
            - call: "POST /supply/manufacturing-lots/${l2_id}/qa-disposition"
              payload: { disposition: "REJECT" }
              as: QualityManager
              as_user_id: "qm-1"
          trigger:
            - call: "POST /supply/sterilization-batches/${b_id}/record-sterility-result"
              payload: { result: "FAILED" }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "GET /supply/manufacturing-lots/${l1_id}"
              payload: {}
              as: QualityManager
              captures: { l1_status: $.data.status, l1_ster: $.data.sterility_status }
            - call: "GET /supply/manufacturing-lots/${l2_id}"
              payload: {}
              as: QualityManager
              captures: { l2_status: $.data.status, l2_by: $.data.qa_disposition_by }
          assert:
            - "L1: status == QUARANTINED and sterility_status == FAILED (cascade fired)"
            - "L2: status remains REJECTED with qa_disposition_by == 'qm-1' (terminal lot skipped by the cascade)"
      - name: fill_rate_dual_variant
        claim_type: dual_variant_calculation
        grounds: [calculations.order_fill_rate]
        excluded_because:
          difficulty_instance: fill_rate_provisional_undercuts_final_on_cancelled_units
          rationale: "Both variants and their divergence asserted by the named §1.8 instance."
      - name: rebate_dual_variant
        claim_type: dual_variant_calculation
        grounds: [calculations.rebate_amount]
        excluded_because:
          difficulty_instance: rebate_provisional_ignores_bonus_and_compliance
          rationale: "Provisional vs validated divergence asserted by the named §1.8 instance."
      - name: breach_cascade_mutes_programs
        claim_type: cascading_side_effects
        grounds: ["state_machines.PrimeVendorAgreement.ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: receive_breach_cascades_suspend_and_mutes_programs
          rationale: "Depth-3 cascade including the program muting asserted by the named §1.8 instance; recovery un-muting asserted by rolling_window_excludes_stale_orders above."
      - name: reorder_threshold_boundaries
        claim_type: rate_threshold_triggers
        grounds: [calculations.reorder_suggestion]
        excluded_because:
          difficulty_instance: reorder_point_inclusive_boundary_and_zero_critical
          rationale: "DUE-at-equality and CRITICAL-at-zero boundaries asserted by the named §1.8 instance."
      - name: tray_change_cycle_layer
        claim_type: cascading_side_effects
        grounds: ["state_machines.TrayTemplate"]
        excluded_because:
          difficulty_instance: tray_template_change_management_cycle
          rationale: "Full change-management cycle with version pinning asserted by the named §1.8 instance."
      - name: substitution_resolve_cascade_layer
        claim_type: cascading_side_effects
        grounds: ["state_machines.SupplyDisruption.MITIGATING_to_RESOLVED"]
        excluded_because:
          difficulty_instance: substitution_approval_resolves_and_rejects_pending
          rationale: "Auto-resolve and pending-request auto-rejection asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_action_response_reflects_mutation
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.\"POST /supply/manufacturing-lots/{id}/qa-disposition\"", "endpoints.\"GET /supply/manufacturing-lots/{id}\""]
        distinguishing_aspect: "Immediate consistency: the action response carries the post-mutation state (status RELEASED, version 2) and a subsequent read returns identical values with no lag."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL non-sterile product NP; lot L (creator planner-1)"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "IC-P", name: "Immediate item", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { np_id: $.data.id }
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-IC1", product_id: "${np_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QualityManager
              as_user_id: "qm-9"
              captures: { resp_status: $.data.status, resp_v: $.data.version, resp_by: $.data.qa_disposition_by }
            - call: "GET /supply/manufacturing-lots/${lot_id}"
              payload: {}
              as: QualityManager
              captures: { get_status: $.data.status, get_v: $.data.version }
          assert:
            - "Action response: status == RELEASED, version == 2, qa_disposition_by == 'qm-9'"
            - "Immediate re-read returns identical status and version (no asynchronous reconciliation)"
