              payload: { sized_amount: 5000000, expected_program_version: "${pv_stale}" }
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { err: $.data.error_id }
            - call: "GET /fof/programs/${prog}"
              payload: {}
