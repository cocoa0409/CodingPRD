  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: study_scheduling_requires_authorized_order
        grounds:
          - state_machines.SleepStudy (creation guard)
          - state_machines.ReferralOrder.AUTH_IN_PROGRESS_to_AUTH_DENIED
          - validations[priority=7]
        distinguishing_aspect: |
          Pair SleepStudy x ReferralOrder: scheduling is gated on the ORDER's state — an
          AUTH_DENIED order rejects study creation with ERR_ORDER_NOT_AUTHORIZED even though
          the study payload itself is valid.
        test_recipe:
          setup:
            - "Order whose authorization was DENIED (order AUTH_DENIED)"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D7A-01", full_name: "Pat Thirteen", date_of_birth: "1982-01-13" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "DENIED" }, as: Scheduler }
          trigger:
            - call: "POST /sleep-studies"
              payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_ORDER_NOT_AUTHORIZED"
            - "ReferralOrder.${o1}.status == AUTH_DENIED (unchanged); no SleepStudy created for ${o1}"

      - name: prescription_requires_signed_report
        grounds:
          - state_machines.TherapyPrescription (creation guard)
          - state_machines.InterpretationReport.DRAFT_to_SIGNED
          - validations[priority=7]
        distinguishing_aspect: |
          Pair TherapyPrescription x InterpretationReport: prescription creation is gated on
          the REPORT's state — a DRAFT report rejects with ERR_REPORT_INVALID_STATE even
          with valid device fields and a matching OCC version; different entity pair than
          study-vs-order.
