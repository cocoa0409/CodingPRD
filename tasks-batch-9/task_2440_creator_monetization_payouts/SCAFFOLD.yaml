scenario: |
  Generate task harder than expert level!

  2440. Creator Monetization Payouts (content platform creator monetization): monetization eligibility with follower, watch time and policy compliance thresholds and periodic re-evaluation, revenue share calculation across advertising, subscriptions, tips and commerce with per-product terms, tax documentation collection with withholding by country and treaty rates, payment threshold, schedule and method with failed payment handling, demonetization events with content-level ad suitability ratings and appeal processes, revenue hold during policy investigations with retroactive clawback for violations, creator fund allocation methodologies with transparency and predictability tradeoffs, earnings reporting, dispute resolution and audit support for creators

domain_name: creator-monetization-payouts
api_prefix: /monetization

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection directly under /monetization; parent-child
  # links are body-level foreign keys, never URL nesting. Only two sub-resource
  # reads exist (ledger-entries, fund-allocations) because those two children are
  # append-only/derived and have no standalone collection of their own.

  state_machine_shape: parallel
  # Creator carries two independent state dimensions (eligibility_status x
  # payout_state) that evolve on the same row without gating each other; Appeal
  # is cyclic (UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW);
  # Payout is branching + cyclic (PROCESSING -> {PAID, FAILED}, FAILED ->
  # PROCESSING retry, exhaustion -> ABANDONED); EarningsStatement is cyclic
  # (FINALIZED -> UNDER_DISPUTE -> FINALIZED); EarningsPeriod is compound (its
  # FINALIZED state is derived from its children statements).

  relationship_patterns:
    - one_to_many        # Creator -> ContentItem / RevenueEvent / EarningsStatement / Payout / Investigation / LedgerEntry
    - cross_aggregate    # EarningsStatement.payout_id crosses the payout aggregate; CreatorFund.period_id crosses the period aggregate
    - polymorphic        # LedgerEntry.source_entity + LedgerEntry.source_id point at five different entity types

  role_model: segregation_of_duties
  # PolicyReviewer who opened an Investigation may not resolve it; PolicyReviewer
  # who last rated a ContentItem may not decide its Appeal. Money-moving
  # operations belong exclusively to FinanceOperator, configuration exclusively
  # to PlatformAdmin, and Auditor is read-only.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public channel name.
        constraints: "1..120 chars, non-blank"
      - name: country_code
        type: enum
        source: input
        description: Tax residence country of the creator; drives withholding and payout-method rules.
        constraints: "one of US, GB, DE, IN, BR, JP"
      - name: follower_count
        type: integer
        source: input
        description: Followers as of the last metrics ingestion.
        constraints: ">= 0"
      - name: watch_time_minutes_365d
        type: integer
        source: input
        description: Trailing-365-day watch minutes as of the last metrics ingestion; also the fund ranking metric.
        constraints: ">= 0"
      - name: active_strike_count
        type: integer
        source: system
        description: Number of unlapsed policy strikes; incremented by POST /creators/{id}/policy-strikes and by Investigation substantiation, reset to 0 at period close when last_strike_at + STRIKE_ACTIVE_DAYS <= close time.
        default: 0
        constraints: ">= 0"
      - name: last_strike_at
        type: datetime
        source: system
        description: Logical-clock time of the most recent strike increment; null when active_strike_count has never been incremented.
        default: null
      - name: eligibility_status
        type: enum
        source: computed
        description: "Monetization dimension of the Creator's parallel state machine; written only by calculations.eligibility_evaluation (POST /creators/{id}/evaluate, POST /creators/{id}/policy-strikes cascade, and period close step 3)."
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, ELIGIBLE, INELIGIBLE, SUSPENDED"
      - name: payout_state
        type: enum
        source: computed
        description: "Disbursement dimension of the Creator's parallel state machine; recomputed by calculations.payout_state_resolution after every mutation that touches outstanding_clawback_cents, Investigation state, or Payout state."
        default: ACCRUING
        constraints: "one of ACCRUING, HOLD, PAYOUT_IN_FLIGHT, ARREARS"
      - name: payout_threshold_cents
        type: integer
        source: input
        description: Minimum available_balance_cents required before a Payout may be created.
        default: 10000
        constraints: ">= 1000"
      - name: payout_method
        type: enum
        source: input
        description: Disbursement rail used for the next Payout; snapshotted onto Payout.method at creation.
        default: BANK_TRANSFER
        constraints: "one of BANK_TRANSFER, INSTANT_DEBIT, CHECK"
      - name: consecutive_payment_failures
        type: integer
        source: system
        description: Count of consecutive failed settlement outcomes since the last PAID payout; reset to 0 on a PAID settlement and on any POST /creators/{id}/payout-settings call that changes payout_method.
        default: 0
        constraints: ">= 0"
      - name: fund_credit_balance_cents
        type: integer
        source: system
        description: Unpaid creator-fund money credited by CreatorFund disbursement; consumed (set to 0) when a Payout is created and restored when that Payout leaves for FAILED/VOIDED/ABANDONED.
        default: 0
        constraints: ">= 0"
      - name: outstanding_clawback_cents
        type: integer
        source: system
        description: Clawback receivable that no statement could absorb; drives payout_state ARREARS and is offset at period close step 5.
        default: 0
        constraints: ">= 0"
      - name: lifetime_paid_cents
        type: integer
        source: system
        description: Sum of Payout.amount_cents over this creator's Payouts with state == PAID.
        default: 0
        constraints: ">= 0"
      - name: evaluation_count
        type: integer
        source: system
        description: Number of completed eligibility evaluations (on-demand plus period-close re-evaluations).
        default: 0
        constraints: ">= 0"
      - name: last_evaluated_at
        type: datetime
        source: system
        description: Logical-clock time of the most recent eligibility evaluation; null before the first evaluation.
        default: null
      - name: last_evaluation_failed_criteria
        type: array
        source: computed
        description: "Criterion codes that failed at the most recent evaluation, emitted in this fixed order: FOLLOWER_MINIMUM, WATCH_TIME_MINIMUM, POLICY_COMPLIANCE. Empty array when the evaluation returned ELIGIBLE."
        default: []
      - name: ledger_balance_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over all LedgerEntry rows with creator_id == this Creator.id (no status filter, all entry_types, signed)."
      - name: held_cents
        type: integer
        source: computed
        description: "Sum of Investigation.hold_amount_cents over this creator's Investigations with state == OPEN and hold_payouts == true."
      - name: statement_payable_cents
        type: integer
        source: computed
        description: "Sum of (net_payable_cents - clawback_applied_cents + dispute_adjustment_cents) over this creator's EarningsStatements with status IN {FINALIZED, ADJUSTED} and payout_id == null."
      - name: available_balance_cents
        type: integer
        source: computed
        description: "statement_payable_cents + fund_credit_balance_cents - held_cents. May be negative; POST /monetization/payouts rejects non-positive values."
  - name: TaxProfile
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id; the creator whose documentation this is.
      - name: form_type
        type: enum
        source: input
        description: Tax form collected from the creator.
        constraints: "one of W9, W8BEN"
      - name: country_code
        type: enum
        source: input
        description: Country declared on the form; must equal Creator.country_code.
        constraints: "one of US, GB, DE, IN, BR, JP"
      - name: tin_provided
        type: boolean
        source: input
        description: Whether a taxpayer identification number was supplied; a treaty claim without a TIN is denied treaty benefits.
        default: false
      - name: treaty_claimed
        type: boolean
        source: input
        description: Whether the creator claims a tax-treaty reduced rate.
        default: false
      - name: treaty_rate_bps
        type: integer
        source: input
        description: Claimed treaty withholding rate in basis points; required when treaty_claimed is true, must be null otherwise.
        default: null
        constraints: "0..3000 inclusive when treaty_claimed == true"
      - name: status
        type: enum
        source: system
        description: Documentation lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, VERIFIED, REJECTED, SUPERSEDED, EXPIRED"
      - name: withholding_rate_bps
        type: integer
        source: computed
        description: "Effective withholding rate produced by calculations.withholding_rate_resolution; recomputed on every status change of this profile."
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock time of POST /tax-profiles/{id}/submit; null while DRAFT.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock time of a VERIFY decision; null unless the profile reached VERIFIED.
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: verified_at + TAX_FORM_VALIDITY_DAYS; null unless the profile reached VERIFIED.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Reviewer note recorded on a REJECT decision; null otherwise.
        default: null
  - name: RevenueProduct
    parent: null
    common_fields: true
    fields:
      - name: product_type
        type: enum
        source: input
        description: Monetization surface this product bills for.
        constraints: "one of ADVERTISING, SUBSCRIPTIONS, TIPS, COMMERCE"
      - name: name
        type: string
        source: input
        description: Human-readable product name.
        constraints: "1..120 chars, non-blank"
      - name: creator_share_bps
        type: integer
        source: input
        description: Per-product creator share in basis points before tier bonus and suitability multiplier.
        constraints: "0..9000 inclusive"
      - name: platform_fee_bps
        type: integer
        source: input
        description: Per-product platform fee in basis points; must satisfy creator_share_bps + platform_fee_bps == 10000.
        constraints: "0..10000 inclusive"
      - name: min_payable_cents
        type: integer
        source: input
        description: Minimum per-event creator share that accrues; a computed share strictly below this value accrues nothing.
        default: 0
        constraints: ">= 0"
      - name: terms_version
        type: integer
        source: input
        description: Version of the per-product terms snapshotted onto each RevenueEvent.
        default: 1
        constraints: ">= 1"
      - name: suitability_sensitive
        type: boolean
        source: computed
        description: "true if and only if product_type == ADVERTISING; only suitability-sensitive products apply the content suitability multiplier."
      - name: status
        type: enum
        source: system
        description: Product availability for new accruals.
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock time of POST /revenue-products/{id}/retire; null while ACTIVE.
        default: null
  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id; owner of the content.
      - name: title
        type: string
        source: input
        description: Content title.
        constraints: "1..200 chars, non-blank"
      - name: published_at
        type: datetime
        source: input
        description: Publication timestamp of the content.
      - name: suitability_rating
        type: enum
        source: system
        description: Advertiser suitability rating; GREEN at creation, changed only by POST /content-items/{id}/rate or by an upheld Appeal.
        default: GREEN
        constraints: "one of GREEN, YELLOW, RED"
      - name: monetization_state
        type: enum
        source: computed
        description: "Derived strictly from suitability_rating: GREEN -> MONETIZED, YELLOW -> LIMITED, RED -> DEMONETIZED."
        default: MONETIZED
        constraints: "one of MONETIZED, LIMITED, DEMONETIZED"
      - name: rating_source
        type: enum
        source: system
        description: Provenance of the current suitability_rating.
        default: DEFAULT
        constraints: "one of DEFAULT, AUTOMATED, MANUAL, APPEAL"
      - name: last_rated_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyReviewer who last set suitability_rating via POST /content-items/{id}/rate; null while rating_source == DEFAULT or APPEAL.
        default: null
      - name: last_rated_at
        type: datetime
        source: system
        description: Logical-clock time of the last rating change; null while rating_source == DEFAULT.
        default: null
      - name: open_appeal_count
        type: integer
        source: computed
        description: "Count of Appeals with content_item_id == this ContentItem.id and state IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}."
  - name: RevenueEvent
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id; the earning creator.
      - name: product_id
        type: string
        source: input
        description: FK -> RevenueProduct.id; per-product terms applied to this event.
      - name: content_item_id
        type: string
        source: input
        description: FK -> ContentItem.id; null for revenue not attributable to a single content item (SUBSCRIPTIONS, TIPS, COMMERCE).
        default: null
      - name: period_id
        type: string
        source: system
        description: FK -> EarningsPeriod.id; the EarningsPeriod with status == OPEN whose [period_start, period_end) contains occurred_at, resolved at creation.
      - name: gross_amount_cents
        type: integer
        source: input
        description: Gross platform revenue attributed to this event.
        constraints: "> 0"
      - name: occurred_at
        type: datetime
        source: input
        description: Revenue attribution timestamp; decides both the period and clawback-window membership.
      - name: terms_version_at_accrual
        type: integer
        source: computed
        description: Snapshot of RevenueProduct.terms_version at accrual.
      - name: suitability_rating_at_accrual
        type: enum
        source: computed
        description: Snapshot of the linked ContentItem.suitability_rating at accrual; GREEN when content_item_id is null.
        constraints: "one of GREEN, YELLOW, RED"
      - name: effective_share_bps
        type: integer
        source: computed
        description: "capped_share_bps * suitability_multiplier_bps / 10000, as produced by calculations.revenue_share_split."
      - name: creator_share_cents
        type: integer
        source: computed
        description: "Creator's cut of gross_amount_cents per calculations.revenue_share_split; recomputed on suitability re-rating and on an upheld Appeal."
      - name: status
        type: enum
        source: system
        description: Accrual status of this event.
        default: ACCRUED
        constraints: "one of ACCRUED, BELOW_MINIMUM, REVERSED, CLAWED_BACK"
      - name: last_status_change_at
        type: datetime
        source: system
        description: Logical-clock time of the most recent status write.
  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: input
        description: FK -> ContentItem.id; the demonetized or limited content under appeal.
      - name: creator_id
        type: string
        source: system
        description: FK -> Creator.id; copied from the appealed ContentItem.creator_id at creation.
      - name: requested_rating
        type: enum
        source: input
        description: Rating the creator asks the platform to restore.
        constraints: "one of GREEN, YELLOW"
      - name: statement_text
        type: string
        source: input
        description: Creator's justification.
        constraints: "1..2000 chars, non-blank"
      - name: state
        type: enum
        source: system
        description: Appeal lifecycle state (cyclic through INFO_REQUESTED).
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, UPHELD, DENIED"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed creator responses to information requests; incremented by POST /appeals/{id}/respond.
        default: 0
        constraints: "0..APPEAL_MAX_ROUNDS"
      - name: info_request
        type: string
        source: system
        description: Most recent reviewer information request; null until the first request.
        default: null
      - name: response_statement
        type: string
        source: system
        description: Most recent creator response; null until the first response.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyReviewer who decided the appeal; null until decided.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock time of the decision; null until decided.
        default: null
      - name: rationale
        type: string
        source: system
        description: Decision rationale; null until decided.
        default: null
  - name: EarningsPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Human-readable period label.
        constraints: "1..60 chars, non-blank"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive lower bound of the half-open attribution window [period_start, period_end).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive upper bound of the half-open attribution window; must be strictly after period_start.
      - name: status
        type: enum
        source: computed
        description: "OPEN at creation; CLOSED by POST /earnings-periods/{id}/close; FINALIZED automatically once every child EarningsStatement has status IN {FINALIZED, ADJUSTED, PAID}."
        default: OPEN
        constraints: "one of OPEN, CLOSED, FINALIZED"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock time of close; null while OPEN.
        default: null
      - name: statement_count
        type: integer
        source: computed
        description: "Count of EarningsStatements with period_id == this EarningsPeriod.id (all statuses)."
      - name: finalized_statement_count
        type: integer
        source: computed
        description: "Count of EarningsStatements with period_id == this EarningsPeriod.id and status IN {FINALIZED, ADJUSTED, PAID}."
  - name: EarningsStatement
    parent: null
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: system
        description: FK -> EarningsPeriod.id; the period whose close created this statement.
      - name: creator_id
        type: string
        source: system
        description: FK -> Creator.id; the statement's creator.
      - name: payout_id
        type: string
        source: system
        description: FK -> Payout.id; set when the statement is attached to a Payout, reset to null when that Payout leaves for FAILED, VOIDED or ABANDONED.
        default: null
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of RevenueEvent.gross_amount_cents over events with period_id == this period_id, creator_id == this creator_id and status == ACCRUED at close time."
      - name: creator_share_cents
        type: integer
        source: computed
        description: "Sum of RevenueEvent.creator_share_cents over the same event set as gross_cents."
      - name: event_count
        type: integer
        source: computed
        description: Number of RevenueEvents in that same event set.
      - name: withholding_rate_bps
        type: integer
        source: computed
        description: "TaxProfile.withholding_rate_bps of the creator's non-SUPERSEDED TaxProfile at the moment the current withholding_variant was computed (BACKUP_WITHHOLDING_BPS when no such profile exists)."
      - name: withholding_variant
        type: enum
        source: computed
        description: "Which variant of calculations.statement_withholding produced withholding_cents: PROVISIONAL at period close (aggregate-then-round), FINAL at statement finalization (per-event-then-sum)."
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINAL"
      - name: withholding_cents
        type: integer
        source: computed
        description: Tax withheld, per the active withholding_variant.
      - name: net_payable_cents
        type: integer
        source: computed
        description: creator_share_cents - withholding_cents.
      - name: clawback_applied_cents
        type: integer
        source: system
        description: Cumulative clawback absorbed by this statement (investigation waterfall plus period-close arrears offset).
        default: 0
        constraints: ">= 0"
      - name: dispute_adjustment_cents
        type: integer
        source: system
        description: Credit granted by an upheld dispute; 0 otherwise.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Statement lifecycle state (cyclic through UNDER_DISPUTE).
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINALIZED, UNDER_DISPUTE, ADJUSTED, PAID"
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock time of finalization; null while PROVISIONAL.
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: Reason supplied by the creator when the statement was disputed; null if never disputed.
        default: null
      - name: dispute_claimed_amount_cents
        type: integer
        source: system
        description: Amount the creator claims is missing; null if never disputed.
        default: null
      - name: dispute_resolution
        type: enum
        source: system
        description: Outcome of the last dispute; null if never resolved.
        default: null
        constraints: "one of UPHELD, REJECTED"
  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id; the payee.
      - name: method
        type: enum
        source: computed
        description: Snapshot of Creator.payout_method at creation; the fee tier is selected from this snapshot, not from the creator's later setting.
        constraints: "one of BANK_TRANSFER, INSTANT_DEBIT, CHECK"
      - name: payable_before_fee_cents
        type: integer
        source: computed
        description: Snapshot of Creator.available_balance_cents at creation; the fee tier is keyed on this value.
      - name: fee_cents
        type: integer
        source: computed
        description: Disbursement fee per calculations.payout_fee_and_amount.
      - name: amount_cents
        type: integer
        source: computed
        description: payable_before_fee_cents - fee_cents.
      - name: fund_credit_cents
        type: integer
        source: computed
        description: Portion of payable_before_fee_cents that came from Creator.fund_credit_balance_cents; restored to the creator on FAILED, VOIDED or ABANDONED.
      - name: statement_count
        type: integer
        source: computed
        description: "Count of EarningsStatements with payout_id == this Payout.id."
      - name: state
        type: enum
        source: system
        description: Disbursement lifecycle state (branching plus retry cycle).
        default: PENDING
        constraints: "one of PENDING, PROCESSING, PAID, FAILED, VOIDED, ABANDONED"
      - name: failure_code
        type: enum
        source: input
        description: Processor failure reason recorded by the last FAILED settlement; null otherwise.
        default: null
        constraints: "one of INSUFFICIENT_DETAILS, BANK_REJECTED, ACCOUNT_CLOSED"
      - name: retry_count
        type: integer
        source: system
        description: Number of POST /payouts/{id}/retry calls accepted on this payout.
        default: 0
        constraints: "0..MAX_PAYOUT_RETRIES"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock time of the most recent submit or retry; null while PENDING.
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock time of the terminal settlement; null until PAID or ABANDONED.
        default: null
  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id; the creator under investigation.
      - name: scope
        type: string
        source: input
        description: Description of the suspected policy violation.
        constraints: "1..500 chars, non-blank"
      - name: violation_window_start
        type: datetime
        source: input
        description: Inclusive lower bound of the closed clawback window [violation_window_start, violation_window_end].
      - name: violation_window_end
        type: datetime
        source: input
        description: Inclusive upper bound of the closed clawback window; must be at or after violation_window_start.
      - name: hold_payouts
        type: boolean
        source: input
        description: Whether opening this investigation encumbers the creator's balance and forces payout_state HOLD.
        default: true
      - name: hold_amount_cents
        type: integer
        source: computed
        description: "max(Creator.available_balance_cents, 0) snapshotted immediately before the hold is applied; 0 when hold_payouts == false."
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyReviewer who opened the investigation; the segregation-of-duties comparand for substantiate and clear.
      - name: state
        type: enum
        source: system
        description: Investigation lifecycle state (branching with divergent side-effect sets).
        default: OPEN
        constraints: "one of OPEN, SUBSTANTIATED, CLEARED"
      - name: finding
        type: string
        source: input
        description: Reviewer's written finding recorded at resolution; null while OPEN.
        default: null
      - name: clawback_base_cents
        type: integer
        source: computed
        description: "Total clawback assessed per calculations.clawback_waterfall; 0 unless state == SUBSTANTIATED."
        default: 0
      - name: clawback_recovered_cents
        type: integer
        source: computed
        description: Portion of clawback_base_cents absorbed by the creator's unattached statements at substantiation.
        default: 0
      - name: clawback_unrecovered_cents
        type: integer
        source: computed
        description: clawback_base_cents - clawback_recovered_cents; added to Creator.outstanding_clawback_cents.
        default: 0
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyReviewer who substantiated or cleared; null while OPEN.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock time of resolution; null while OPEN.
        default: null
  - name: CreatorFund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Fund name.
        constraints: "1..120 chars, non-blank"
      - name: period_id
        type: string
        source: input
        description: FK -> EarningsPeriod.id; the period this fund supplements.
      - name: total_pool_cents
        type: integer
        source: input
        description: Fixed pool to distribute.
        constraints: "> 0"
      - name: methodology
        type: enum
        source: input
        description: Allocation methodology; PRO_RATA_WATCH_TIME maximizes transparency, GUARANTEED_FLOOR_WATERFALL maximizes small-creator predictability.
        constraints: "one of PRO_RATA_WATCH_TIME, GUARANTEED_FLOOR_WATERFALL"
      - name: min_watch_time_minutes
        type: integer
        source: input
        description: Minimum Creator.watch_time_minutes_365d required to enter the candidate pool.
        default: 0
        constraints: ">= 0"
      - name: max_allocation_cents
        type: integer
        source: input
        description: Per-recipient cap; capped excess is NOT redistributed and remains in unallocated_remainder_cents.
        default: 2000000
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "DRAFT at creation and after void-allocations; ALLOCATED after allocate; DISBURSED after disburse."
        default: DRAFT
        constraints: "one of DRAFT, ALLOCATED, DISBURSED"
      - name: allocation_run_count
        type: integer
        source: system
        description: Number of accepted allocate calls, including supersede runs.
        default: 0
        constraints: ">= 0"
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of FundAllocation.amount_cents over allocations with fund_id == this CreatorFund.id and status == ACTIVE."
      - name: unallocated_remainder_cents
        type: integer
        source: computed
        description: total_pool_cents - allocated_cents; the conserved slack of the pool.
      - name: recipient_count
        type: integer
        source: computed
        description: "Count of FundAllocations with fund_id == this CreatorFund.id and status == ACTIVE."
      - name: disbursed_at
        type: datetime
        source: system
        description: Logical-clock time of disbursement; null until DISBURSED.
        default: null
  - name: FundAllocation
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: system
        description: FK -> CreatorFund.id; the fund that produced this allocation.
      - name: creator_id
        type: string
        source: system
        description: FK -> Creator.id; the recipient.
      - name: amount_cents
        type: integer
        source: computed
        description: Allocated amount per calculations.fund_allocation.
        constraints: ">= 0"
      - name: rank
        type: integer
        source: computed
        description: "1-based rank of the recipient under the ordering watch_time_minutes_365d DESC, created_at ASC."
        constraints: ">= 1"
      - name: methodology_snapshot
        type: enum
        source: computed
        description: Snapshot of CreatorFund.methodology at the allocation run that produced this row.
        constraints: "one of PRO_RATA_WATCH_TIME, GUARANTEED_FLOOR_WATERFALL"
      - name: watch_time_minutes_at_allocation
        type: integer
        source: computed
        description: Snapshot of Creator.watch_time_minutes_365d at the allocation run.
      - name: status
        type: enum
        source: system
        description: ACTIVE until superseded by a later allocation run or voided.
        default: ACTIVE
        constraints: "one of ACTIVE, VOIDED"
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock time at which the allocation was voided or superseded; null while ACTIVE.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason recorded by void-allocations, or the literal "SUPERSEDED_BY_REALLOCATION" when a later allocate run replaced this row; null while ACTIVE.
        default: null
  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: creator_id
        type: string
        source: system
        description: FK -> Creator.id; the creator whose balance this entry moves.
      - name: entry_type
        type: enum
        source: system
        description: Economic reason for the entry.
        constraints: "one of ACCRUAL, ACCRUAL_REVERSAL, ACCRUAL_RESTORE, WITHHOLDING, WITHHOLDING_TRUE_UP, FUND_CREDIT, PAYOUT_DEBIT, PAYOUT_FEE, PAYOUT_REVERSAL, CLAWBACK, DISPUTE_ADJUSTMENT"
      - name: amount_cents
        type: integer
        source: system
        description: Signed movement in cents; credits are positive, debits negative. Entries with amount_cents == 0 are never written.
      - name: balance_after_cents
        type: integer
        source: system
        description: Creator.ledger_balance_cents immediately after this entry was appended.
      - name: source_entity
        type: enum
        source: system
        description: Entity type that caused the entry (polymorphic pointer, paired with source_id).
        constraints: "one of REVENUE_EVENT, EARNINGS_STATEMENT, PAYOUT, INVESTIGATION, FUND_ALLOCATION"
      - name: source_id
        type: string
        source: system
        description: Id of the row named by source_entity; not a declared foreign key because the target type varies.
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock time at which the entry was appended.
      - name: memo
        type: string
        source: system
        description: Fixed machine-readable memo string describing the causing transition.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Creator carries TWO independent state dimensions on the same row.
  # Dimension A (eligibility_status) gates revenue ACCRUAL only.
  # Dimension B (payout_state) gates DISBURSEMENT only.
  # Neither dimension is a precondition of the other: a SUSPENDED creator may
  # still be paid out, and an ARREARS creator may still be re-evaluated ELIGIBLE.
  # ---------------------------------------------------------------------------
  - entity: Creator
    initial_state: "eligibility_status=PENDING_REVIEW; payout_state=ACCRUING"
    terminal_states: []
    transitions:
      - from: "eligibility_status=PENDING_REVIEW"
        to: "eligibility_status=ELIGIBLE"
        trigger: "POST /monetization/creators/{creator_id}/evaluate"
        actor: FinanceOperator
        preconditions:
          - "follower_count >= MIN_FOLLOWERS"
          - "watch_time_minutes_365d >= MIN_WATCH_MINUTES_365D"
          - "active_strike_count == 0"
        side_effects:
          - "evaluation_count += 1; last_evaluated_at = current logical time"
          - "last_evaluation_failed_criteria = []"
        note: "Dimension A only; payout_state is untouched."
      - from: "eligibility_status IN {PENDING_REVIEW, ELIGIBLE, SUSPENDED}"
        to: "eligibility_status=INELIGIBLE"
        trigger: "POST /monetization/creators/{creator_id}/evaluate"
        actor: FinanceOperator
        preconditions:
          - "active_strike_count == 0"
          - "follower_count < MIN_FOLLOWERS OR watch_time_minutes_365d < MIN_WATCH_MINUTES_365D"
        side_effects:
          - "evaluation_count += 1; last_evaluated_at = current logical time"
          - "last_evaluation_failed_criteria = the failing codes in order FOLLOWER_MINIMUM, WATCH_TIME_MINIMUM"
      - from: "eligibility_status IN {PENDING_REVIEW, ELIGIBLE, INELIGIBLE}"
        to: "eligibility_status=SUSPENDED"
        trigger: "POST /monetization/creators/{creator_id}/evaluate, POST /monetization/creators/{creator_id}/policy-strikes, POST /monetization/investigations/{investigation_id}/substantiate, or period-close step 3"
        actor: "FinanceOperator | PolicyReviewer | system"
        preconditions:
          - "active_strike_count >= 1 (the policy-compliance criterion outranks the metric criteria)"
        side_effects:
          - "evaluation_count += 1; last_evaluated_at = current logical time"
          - "last_evaluation_failed_criteria = [POLICY_COMPLIANCE]"
        note: "Reached as the second hop of the strike cascade: the strike increment itself forces this re-evaluation."
      - from: "eligibility_status=SUSPENDED"
        to: "eligibility_status=ELIGIBLE"
        trigger: "POST /monetization/earnings-periods/{period_id}/close (steps 2 then 3)"
        actor: system
        preconditions:
          - "last_strike_at + STRIKE_ACTIVE_DAYS <= close logical time (all strikes lapse together, so active_strike_count becomes 0 in step 2)"
          - "follower_count >= MIN_FOLLOWERS AND watch_time_minutes_365d >= MIN_WATCH_MINUTES_365D"
        side_effects:
          - "active_strike_count = 0 in step 2 before the step-3 re-evaluation runs"
          - "evaluation_count += 1; last_evaluated_at = close logical time"
      - from: "payout_state=ACCRUING"
        to: "payout_state=HOLD"
        trigger: "POST /monetization/investigations (hold_payouts == true)"
        actor: PolicyReviewer
        preconditions:
          - "outstanding_clawback_cents == 0 (ARREARS outranks HOLD in payout_state_resolution)"
        side_effects:
          - "Investigation.hold_amount_cents = max(available_balance_cents, 0) snapshotted before the hold applies"
          - "held_cents recomputed; available_balance_cents drops by hold_amount_cents"
        note: "Dimension B only; eligibility_status is untouched. HOLD also supersedes PAYOUT_IN_FLIGHT per the precedence order in calculations.payout_state_resolution."
      - from: "payout_state=HOLD"
        to: "payout_state IN {ACCRUING, PAYOUT_IN_FLIGHT}"
        trigger: "POST /monetization/investigations/{investigation_id}/clear"
        actor: PolicyReviewer
        preconditions:
          - "no other Investigation of this creator has state == OPEN AND hold_payouts == true"
          - "outstanding_clawback_cents == 0"
        side_effects:
          - "held_cents recomputed to 0; payout_state recomputed (PAYOUT_IN_FLIGHT when a PENDING or PROCESSING Payout still exists, else ACCRUING)"
      - from: "payout_state=ACCRUING"
        to: "payout_state=PAYOUT_IN_FLIGHT"
        trigger: "POST /monetization/payouts"
        actor: "Creator | FinanceOperator"
        preconditions:
          - "a Payout row reached state PENDING for this creator"
        side_effects:
          - "fund_credit_balance_cents = 0 (consumed into Payout.fund_credit_cents)"
          - "every EarningsStatement with status IN {FINALIZED, ADJUSTED} and payout_id == null is attached to the new Payout"
      - from: "payout_state=PAYOUT_IN_FLIGHT"
        to: "payout_state=ACCRUING"
        trigger: "POST /monetization/payouts/{payout_id}/record-settlement, or the ARREARS void cascade"
        actor: "FinanceOperator | system"
        preconditions:
          - "no Payout of this creator remains in state PENDING or PROCESSING"
          - "outstanding_clawback_cents == 0 and no OPEN holding Investigation exists"
        side_effects:
          - "payout_state recomputed by calculations.payout_state_resolution"
      - from: "payout_state IN {ACCRUING, HOLD, PAYOUT_IN_FLIGHT}"
        to: "payout_state=ARREARS"
        trigger: "POST /monetization/investigations/{investigation_id}/substantiate"
        actor: PolicyReviewer
        preconditions:
          - "the clawback waterfall left outstanding_clawback_cents > 0"
        side_effects:
          - "every Payout of this creator with state == PENDING transitions to VOIDED (third hop of the substantiation cascade)"
      - from: "payout_state=ARREARS"
        to: "payout_state=ACCRUING"
        trigger: "POST /monetization/earnings-periods/{period_id}/close (step 5)"
        actor: system
        preconditions:
          - "the arrears offset reduced outstanding_clawback_cents to exactly 0"
        side_effects:
          - "EarningsStatement.clawback_applied_cents increased by the offset amount; a CLAWBACK LedgerEntry is appended for -offset"
  - entity: TaxProfile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /monetization/tax-profiles/{tax_profile_id}/submit"
        actor: Creator
        preconditions:
          - "status == DRAFT"
          - "treaty_rate_bps is non-null when treaty_claimed == true"
        side_effects:
          - "submitted_at = current logical time"
          - "withholding_rate_bps recomputed (still the backup rate: only VERIFIED profiles earn statutory or treaty rates)"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /monetization/tax-profiles/{tax_profile_id}/verify (decision == VERIFY)"
        actor: FinanceOperator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "verified_at = current logical time; expires_at = verified_at + TAX_FORM_VALIDITY_DAYS"
          - "withholding_rate_bps recomputed per calculations.withholding_rate_resolution"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /monetization/tax-profiles/{tax_profile_id}/verify (decision == REJECT)"
        actor: FinanceOperator
        preconditions:
          - "status == SUBMITTED"
          - "rejection_reason present"
        side_effects:
          - "withholding_rate_bps = BACKUP_WITHHOLDING_BPS"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /monetization/tax-profiles/{tax_profile_id}/revise"
        actor: Creator
        preconditions:
          - "status == REJECTED"
        side_effects:
          - "supplied fields overwrite form_type / tin_provided / treaty_claimed / treaty_rate_bps; rejection_reason = null"
      - from: "status IN {DRAFT, SUBMITTED, VERIFIED, REJECTED}"
        to: SUPERSEDED
        trigger: "POST /monetization/tax-profiles (a newer profile for the same creator)"
        actor: Creator
        preconditions:
          - "the new profile passed the expected_creator_version OCC check"
        side_effects:
          - "the prior profile's withholding_rate_bps is frozen at its current value and no longer participates in withholding resolution"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /monetization/earnings-periods/{period_id}/close (step 1)"
        actor: system
        preconditions:
          - "expires_at <= close logical time"
        side_effects:
          - "withholding_rate_bps = BACKUP_WITHHOLDING_BPS, so statements created later in the same close use the backup rate"
  - entity: ContentItem
    initial_state: "suitability_rating=GREEN (monetization_state=MONETIZED)"
    terminal_states: []
    transitions:
      - from: "suitability_rating IN {GREEN, YELLOW}"
        to: "suitability_rating=RED (monetization_state=DEMONETIZED)"
        trigger: "POST /monetization/content-items/{content_item_id}/rate"
        actor: PolicyReviewer
        preconditions:
          - "requested suitability_rating != current suitability_rating"
        side_effects:
          - "monetization_state recomputed to DEMONETIZED; rating_source = the supplied rating_source; last_rated_by_user_id = X-User-ID; last_rated_at = now"
          - "every RevenueEvent with content_item_id == this item, status == ACCRUED and a suitability_sensitive product is re-scored by calculations.revenue_share_split (multiplier 0) and set to REVERSED"
          - "each re-scored event itself appends an ACCRUAL_REVERSAL LedgerEntry for -(previous creator_share_cents), which itself lowers Creator.ledger_balance_cents"
      - from: "suitability_rating=GREEN"
        to: "suitability_rating=YELLOW (monetization_state=LIMITED)"
        trigger: "POST /monetization/content-items/{content_item_id}/rate"
        actor: PolicyReviewer
        preconditions:
          - "requested suitability_rating != current suitability_rating"
        side_effects:
          - "monetization_state recomputed to LIMITED; last_rated_by_user_id = X-User-ID"
          - "ACCRUED events on suitability_sensitive products are re-scored with SUITABILITY_MULT_BPS[YELLOW] and keep status ACCRUED unless the new share falls below RevenueProduct.min_payable_cents, in which case they become BELOW_MINIMUM"
          - "an ACCRUAL_REVERSAL LedgerEntry is appended for the (negative) delta of each re-scored event"
      - from: "suitability_rating IN {YELLOW, RED}"
        to: "suitability_rating=GREEN (monetization_state=MONETIZED)"
        trigger: "POST /monetization/appeals/{appeal_id}/decide (decision == UPHELD, requested_rating == GREEN)"
        actor: PolicyReviewer
        preconditions:
          - "the deciding PolicyReviewer's X-User-ID != last_rated_by_user_id"
        side_effects:
          - "rating_source = APPEAL; last_rated_by_user_id = null; last_rated_at = now"
          - "every RevenueEvent on this item with status == REVERSED is re-scored and set back to ACCRUED (second hop of the appeal cascade)"
          - "each restored event itself appends an ACCRUAL_RESTORE LedgerEntry for +creator_share_cents, which itself raises Creator.ledger_balance_cents (third and fourth hops)"
        note: "EarningsStatements whose period is already CLOSED or FINALIZED are never retroactively recomputed; the restoration reaches the creator through the ledger and the next payout."
      - from: "suitability_rating=RED"
        to: "suitability_rating=YELLOW (monetization_state=LIMITED)"
        trigger: "POST /monetization/appeals/{appeal_id}/decide (decision == UPHELD, requested_rating == YELLOW)"
        actor: PolicyReviewer
        preconditions:
          - "the deciding PolicyReviewer's X-User-ID != last_rated_by_user_id"
        side_effects:
          - "REVERSED events on this item are re-scored with SUITABILITY_MULT_BPS[YELLOW] and set to ACCRUED (or BELOW_MINIMUM when below min_payable_cents)"
          - "an ACCRUAL_RESTORE LedgerEntry is appended for each restored event"
  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /monetization/appeals/{appeal_id}/start-review"
        actor: PolicyReviewer
        preconditions:
          - "state == SUBMITTED"
        side_effects: ["no field other than state and updated_at changes"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /monetization/appeals/{appeal_id}/request-info"
        actor: PolicyReviewer
        preconditions:
          - "state == UNDER_REVIEW"
        side_effects: ["info_request = supplied text"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /monetization/appeals/{appeal_id}/respond"
        actor: Creator
        preconditions:
          - "state == INFO_REQUESTED"
          - "revision_round < APPEAL_MAX_ROUNDS"
        side_effects:
          - "revision_round += 1; response_statement = supplied text"
        note: "This edge closes the cycle SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED; the round counter is the termination condition."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /monetization/appeals/{appeal_id}/decide (decision == UPHELD)"
        actor: PolicyReviewer
        preconditions:
          - "state == UNDER_REVIEW"
          - "X-User-ID != ContentItem.last_rated_by_user_id of the appealed item"
        side_effects:
          - "decided_by_user_id, decided_at, rationale written"
          - "the appealed ContentItem's suitability_rating becomes requested_rating (first hop of the appeal cascade)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /monetization/appeals/{appeal_id}/decide (decision == DENIED)"
        actor: PolicyReviewer
        preconditions:
          - "state == UNDER_REVIEW"
          - "X-User-ID != ContentItem.last_rated_by_user_id of the appealed item"
        side_effects:
          - "decided_by_user_id, decided_at, rationale written"
          - "the ContentItem is left untouched: no rating change, no event re-scoring, no ledger entry"
  - entity: EarningsPeriod
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /monetization/earnings-periods/{period_id}/close"
        actor: FinanceOperator
        preconditions:
          - "status == OPEN"
          - "no other EarningsPeriod with status == OPEN has period_start < this period's period_start (periods close oldest-first)"
        side_effects:
          - "step 1: every TaxProfile with status == VERIFIED and expires_at <= close time becomes EXPIRED"
          - "step 2: every Creator with active_strike_count > 0 and last_strike_at + STRIKE_ACTIVE_DAYS <= close time has active_strike_count reset to 0"
          - "step 3: every Creator is re-evaluated by calculations.eligibility_evaluation (evaluation_count += 1)"
          - "step 4: one EarningsStatement is created per Creator holding at least one RevenueEvent with period_id == this period and status == ACCRUED, with withholding_variant = PROVISIONAL; a WITHHOLDING LedgerEntry is appended for -withholding_cents when non-zero"
          - "step 5: for every Creator with outstanding_clawback_cents > 0 that received a statement in step 4, offset = min(outstanding_clawback_cents, statement.net_payable_cents) is applied to that statement's clawback_applied_cents, outstanding_clawback_cents drops by offset, a CLAWBACK LedgerEntry for -offset is appended, and payout_state is recomputed"
          - "step 6: status = CLOSED; closed_at = close logical time"
        note: "Ops-run checkpoint. The step order is normative: strike lapse (2) precedes re-evaluation (3), and tax expiry (1) precedes statement withholding resolution (4)."
      - from: CLOSED
        to: FINALIZED
        trigger: "system, evaluated after every POST /monetization/earnings-statements/{statement_id}/finalize"
        actor: system
        preconditions:
          - "statement_count >= 1"
          - "finalized_statement_count == statement_count"
        side_effects:
          - "status = FINALIZED (compound state derived from the children statements; no statement field changes)"
  - entity: EarningsStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /monetization/earnings-statements/{statement_id}/finalize"
        actor: FinanceOperator
        preconditions:
          - "status == PROVISIONAL"
          - "EarningsPeriod.status == CLOSED"
        side_effects:
          - "withholding_variant = FINAL; withholding_rate_bps re-resolved from the creator's current non-SUPERSEDED TaxProfile; withholding_cents and net_payable_cents recomputed by the FINAL variant"
          - "a WITHHOLDING_TRUE_UP LedgerEntry is appended for (provisional withholding_cents - final withholding_cents) when that delta is non-zero"
          - "finalized_at = current logical time"
          - "the parent EarningsPeriod re-evaluates its compound FINALIZED condition"
      - from: "status IN {FINALIZED, ADJUSTED}"
        to: UNDER_DISPUTE
        trigger: "POST /monetization/earnings-statements/{statement_id}/dispute"
        actor: Creator
        preconditions:
          - "status IN {FINALIZED, ADJUSTED}"
          - "payout_id == null"
          - "dispute_claimed_amount_cents <= net_payable_cents"
        side_effects:
          - "dispute_reason and dispute_claimed_amount_cents written"
          - "the statement leaves the payable set, so Creator.statement_payable_cents and available_balance_cents drop by (net_payable_cents - clawback_applied_cents + dispute_adjustment_cents)"
      - from: UNDER_DISPUTE
        to: FINALIZED
        trigger: "POST /monetization/earnings-statements/{statement_id}/resolve-dispute (decision == REJECTED)"
        actor: FinanceOperator
        preconditions:
          - "status == UNDER_DISPUTE"
          - "adjustment_cents == 0"
        side_effects:
          - "dispute_resolution = REJECTED; dispute_adjustment_cents unchanged; no LedgerEntry is appended"
        note: "Closes the cycle FINALIZED -> UNDER_DISPUTE -> FINALIZED with the statement's money exactly restored."
      - from: UNDER_DISPUTE
        to: ADJUSTED
        trigger: "POST /monetization/earnings-statements/{statement_id}/resolve-dispute (decision == UPHELD)"
        actor: FinanceOperator
        preconditions:
          - "status == UNDER_DISPUTE"
          - "0 < adjustment_cents <= dispute_claimed_amount_cents"
        side_effects:
          - "dispute_resolution = UPHELD; dispute_adjustment_cents = adjustment_cents"
          - "a DISPUTE_ADJUSTMENT LedgerEntry is appended for +adjustment_cents"
      - from: "status IN {FINALIZED, ADJUSTED}"
        to: ADJUSTED
        trigger: "POST /monetization/investigations/{investigation_id}/substantiate (clawback waterfall) or period-close step 5"
        actor: "PolicyReviewer | system"
        preconditions:
          - "payout_id == null"
          - "the waterfall assigned a positive amount to this statement"
        side_effects:
          - "clawback_applied_cents increased by the assigned amount (second hop of the substantiation cascade)"
      - from: "status IN {FINALIZED, ADJUSTED}"
        to: PAID
        trigger: "POST /monetization/payouts/{payout_id}/record-settlement (outcome == SUCCEEDED)"
        actor: FinanceOperator
        preconditions:
          - "payout_id == the settling Payout.id"
        side_effects:
          - "no monetary field changes; the money already left the ledger at payout creation"
  - entity: Payout
    initial_state: PENDING
    terminal_states: [PAID, VOIDED, ABANDONED]
    transitions:
      - from: PENDING
        to: PROCESSING
        trigger: "POST /monetization/payouts/{payout_id}/submit"
        actor: FinanceOperator
        preconditions:
          - "state == PENDING"
          - "Creator.payout_state != HOLD"
        side_effects:
          - "submitted_at = current logical time"
      - from: PROCESSING
        to: PAID
        trigger: "POST /monetization/payouts/{payout_id}/record-settlement (outcome == SUCCEEDED)"
        actor: FinanceOperator
        preconditions:
          - "state == PROCESSING"
        side_effects:
          - "settled_at = now; Creator.lifetime_paid_cents += amount_cents; Creator.consecutive_payment_failures = 0"
          - "every attached EarningsStatement transitions to PAID"
          - "Creator.payout_state recomputed (ACCRUING when nothing else encumbers it)"
          - "no LedgerEntry is appended: the debit was taken at payout creation"
      - from: PROCESSING
        to: FAILED
        trigger: "POST /monetization/payouts/{payout_id}/record-settlement (outcome == FAILED)"
        actor: FinanceOperator
        preconditions:
          - "state == PROCESSING"
          - "retry_count < MAX_PAYOUT_RETRIES"
        side_effects:
          - "failure_code = supplied code; Creator.consecutive_payment_failures += 1"
          - "a PAYOUT_REVERSAL LedgerEntry is appended for +(amount_cents + fee_cents)"
          - "attached EarningsStatements are detached (payout_id = null) and keep their pre-payout status"
          - "Creator.fund_credit_balance_cents += fund_credit_cents; payout_state recomputed"
      - from: FAILED
        to: PROCESSING
        trigger: "POST /monetization/payouts/{payout_id}/retry"
        actor: FinanceOperator
        preconditions:
          - "state == FAILED"
          - "retry_count < MAX_PAYOUT_RETRIES"
          - "Creator.available_balance_cents >= amount_cents + fee_cents (the reversed money is still there)"
        side_effects:
          - "retry_count += 1; submitted_at = now; failure_code = null"
          - "a PAYOUT_DEBIT LedgerEntry for -amount_cents and a PAYOUT_FEE LedgerEntry for -fee_cents are appended again; the same statements are re-attached"
        note: "Closes the retry cycle PROCESSING -> FAILED -> PROCESSING. amount_cents and fee_cents are never recomputed on retry."
      - from: PROCESSING
        to: ABANDONED
        trigger: "POST /monetization/payouts/{payout_id}/record-settlement (outcome == FAILED)"
        actor: FinanceOperator
        preconditions:
          - "state == PROCESSING"
          - "retry_count == MAX_PAYOUT_RETRIES"
        side_effects:
          - "settled_at = now; failure_code = supplied code; Creator.consecutive_payment_failures += 1"
          - "a PAYOUT_REVERSAL LedgerEntry is appended for +(amount_cents + fee_cents); statements are detached; fund credits restored"
        note: "Divergent branch of the same trigger as PROCESSING -> FAILED; the discriminator is retry_count."
      - from: PENDING
        to: VOIDED
        trigger: "POST /monetization/investigations/{investigation_id}/substantiate (ARREARS cascade)"
        actor: system
        preconditions:
          - "state == PENDING"
          - "Creator.payout_state became ARREARS in this same request"
        side_effects:
          - "a PAYOUT_REVERSAL LedgerEntry is appended for +(amount_cents + fee_cents) (fifth hop of the substantiation cascade)"
          - "attached EarningsStatements are detached; Creator.fund_credit_balance_cents += fund_credit_cents"
          - "Creator.consecutive_payment_failures is NOT incremented: no payment was attempted"
  - entity: Investigation
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, CLEARED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /monetization/investigations/{investigation_id}/substantiate"
        actor: PolicyReviewer
        preconditions:
          - "state == OPEN"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "hop 1: state = SUBSTANTIATED; resolved_by_user_id, resolved_at, finding written; clawback_base_cents computed by calculations.clawback_waterfall; every RevenueEvent in the closed violation window with status == ACCRUED becomes CLAWED_BACK; Creator.active_strike_count += 1 and last_strike_at = now, which itself forces the eligibility re-evaluation to SUSPENDED"
          - "hop 2: because clawback_base_cents > 0 the waterfall debits the creator's statements with status IN {FINALIZED, ADJUSTED} and payout_id == null in period_start ASC, created_at ASC order, raising each clawback_applied_cents and setting status ADJUSTED"
          - "hop 3: because statements absorbed only part of the base, a CLAWBACK LedgerEntry for -clawback_recovered_cents is appended and Creator.outstanding_clawback_cents += clawback_unrecovered_cents"
          - "hop 4: because outstanding_clawback_cents > 0, payout_state is recomputed to ARREARS"
          - "hop 5: because payout_state became ARREARS, every PENDING Payout of the creator becomes VOIDED, each appending a PAYOUT_REVERSAL LedgerEntry and detaching its statements"
          - "held_cents recomputed to 0 (this investigation is no longer OPEN)"
        note: "The waterfall in hop 2 runs exactly once, before the hop-5 void; statements freed by the void are NOT re-swept in the same request."
      - from: OPEN
        to: CLEARED
        trigger: "POST /monetization/investigations/{investigation_id}/clear"
        actor: PolicyReviewer
        preconditions:
          - "state == OPEN"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "state = CLEARED; resolved_by_user_id, resolved_at, finding written"
          - "clawback_base_cents, clawback_recovered_cents and clawback_unrecovered_cents stay 0; no RevenueEvent, EarningsStatement or LedgerEntry changes"
          - "held_cents recomputed to 0 and payout_state recomputed, releasing the hold"
        note: "Divergent branch of the same fork as SUBSTANTIATED: identical preconditions, disjoint side-effect sets."
  - entity: CreatorFund
    initial_state: DRAFT
    terminal_states: [DISBURSED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /monetization/creator-funds/{fund_id}/allocate"
        actor: FinanceOperator
        preconditions:
          - "status == DRAFT"
          - "expected_fund_version == version"
          - "the candidate pool is non-empty"
        side_effects:
          - "one FundAllocation per recipient is created per calculations.fund_allocation; allocation_run_count += 1"
          - "allocated_cents, unallocated_remainder_cents and recipient_count recomputed"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /monetization/creator-funds/{fund_id}/allocate (supersede run)"
        actor: FinanceOperator
        preconditions:
          - "status == ALLOCATED"
          - "expected_fund_version == version"
          - "the candidate pool is non-empty"
        side_effects:
          - "every existing FundAllocation with status == ACTIVE becomes VOIDED with void_reason = SUPERSEDED_BY_REALLOCATION"
          - "a fresh set of FundAllocations is created from the current candidate pool; allocation_run_count += 1"
        note: "Legitimate self-loop: a re-run supersedes the prior allocation set, which is why the write needs OCC rather than a state precondition."
      - from: ALLOCATED
        to: DRAFT
        trigger: "POST /monetization/creator-funds/{fund_id}/void-allocations"
        actor: FinanceOperator
        preconditions:
          - "status == ALLOCATED"
          - "expected_fund_version == version"
        side_effects:
          - "every FundAllocation with status == ACTIVE becomes VOIDED with the supplied reason"
          - "allocated_cents returns to 0 and unallocated_remainder_cents returns to total_pool_cents"
      - from: ALLOCATED
        to: DISBURSED
        trigger: "POST /monetization/creator-funds/{fund_id}/disburse"
        actor: FinanceOperator
        preconditions:
          - "status == ALLOCATED"
          - "recipient_count >= 1"
        side_effects:
          - "for each ACTIVE FundAllocation: a FUND_CREDIT LedgerEntry for +amount_cents is appended and the recipient's fund_credit_balance_cents += amount_cents"
          - "disbursed_at = current logical time"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version`, per SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: tax-profile-create-stale-creator
    parent_entity: Creator
    write_endpoint: "POST /monetization/tax-profiles"
    occ_field: "expected_creator_version"
    description: |
      Creating a TaxProfile against a Creator whose version has advanced since
      the client last observed it is rejected. A new profile legitimately
      supersedes the creator's prior profile, so a second sequential create is
      valid product behaviour and cannot be distinguished by any state
      precondition; the stale expected_creator_version is what identifies the
      writer whose view of the creator (including which profile is current) is
      out of date.
    error_id: ERR_STALE_CREATOR_VERSION
    http_status: 412
  - rule_id: fund-allocate-stale-fund
    parent_entity: CreatorFund
    write_endpoint: "POST /monetization/creator-funds/{fund_id}/allocate"
    occ_field: "expected_fund_version"
    description: |
      Running an allocation against a CreatorFund whose version has advanced
      since the client last observed it is rejected. Allocation is idempotent in
      shape but not in content: an ALLOCATED fund accepts a supersede run that
      replaces the whole allocation set, so a second sequential allocate would
      itself succeed under the product rules. The stale expected_fund_version is
      the only signal that the caller computed its intent from a candidate pool
      or pool size that no longer holds.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
# Global money/rate conventions (apply to every rule below unless overridden):
#   * All monetary fields are signed integer cents. No floats are persisted.
#   * All rate fields are integer basis points (bps); 10000 bps == 100%.
#   * bps-on-bps arithmetic FLOORS to an integer bps before it is applied to
#     money (see revenue_share_split step 4). Money produced from an exact
#     rational is rounded ROUND_HALF_UP to a whole cent.
#   * "current logical time" is the value maintained by
#     POST /monetization/_clock/set_current_utc (default 2026-08-01T00:00:00Z).
#   * No rule may use an entity `id` as a decision input. Every ordering,
#     ranking and tie-break below uses `created_at ASC` (or a named business
#     field) as its final discriminator.
# =============================================================================
calculations:
  - name: revenue_share_split
    trigger: >-
      Runs on POST /monetization/revenue-events (initial accrual); re-runs on
      POST /monetization/content-items/{content_item_id}/rate and on
      POST /monetization/appeals/{appeal_id}/decide (decision == UPHELD) for
      every affected RevenueEvent. Writes RevenueEvent.effective_share_bps,
      RevenueEvent.creator_share_cents, RevenueEvent.status and
      RevenueEvent.terms_version_at_accrual /
      RevenueEvent.suitability_rating_at_accrual on the initial accrual only.
    algorithm: tiered_pricing
    formula: |
      INPUTS: event.gross_amount_cents (> 0),
              product = RevenueProduct[event.product_id],
              creator = Creator[event.creator_id],
              rating   = event.suitability_rating_at_accrual

      step 1  base_share_bps = product.creator_share_bps

      step 2  tier_bonus_bps = TIER_BONUS_BPS bucket selected by
                creator.lifetime_paid_cents, read as of THIS evaluation
                (a re-score after a payout therefore may pick a higher tier
                than the initial accrual did):
                  lifetime_paid_cents  <     100000 -> 0
                  100000  <= lifetime_paid_cents <   1000000 -> 200
                  1000000 <= lifetime_paid_cents <  10000000 -> 400
                  10000000 <= lifetime_paid_cents           -> 600

      step 3  capped_share_bps = min(base_share_bps + tier_bonus_bps,
                                     MAX_EFFECTIVE_SHARE_BPS)
              (the cap is applied BEFORE the suitability multiplier; applying
               the multiplier first and capping afterwards is a different and
               WRONG number for any event whose bonused share exceeds the cap)

      step 4  suitability_multiplier_bps =
                  product.suitability_sensitive
                    ? SUITABILITY_MULT_BPS[rating]
                    : 10000
              effective_share_bps = floor(capped_share_bps
                                          * suitability_multiplier_bps / 10000)
              (FLOOR to integer bps here; this is the only place a bps value is
               truncated, and it is truncated BEFORE touching money)

      step 5  raw_cents = event.gross_amount_cents * effective_share_bps / 10000
                          (exact rational, no intermediate rounding)
              share_cents = ROUND_HALF_UP(raw_cents) to a whole cent

      step 6  min-payable threshold, strictly-below semantics:
                if share_cents < product.min_payable_cents:
                    creator_share_cents = 0
                    status = BELOW_MINIMUM
                else:
                    creator_share_cents = share_cents
                    status = ACCRUED
              (share_cents EQUAL to min_payable_cents accrues in full)

      step 7  ledger side effect, keyed on the DELTA against the value this
              event carried before the run:
                delta = new creator_share_cents - previous creator_share_cents
                if delta > 0 -> append LedgerEntry(entry_type =
                     ACCRUAL on the initial accrual, else ACCRUAL_RESTORE,
                     amount_cents = +delta)
                if delta < 0 -> append LedgerEntry(entry_type =
                     ACCRUAL_REVERSAL, amount_cents = delta)
                if delta == 0 -> NO LedgerEntry is written
              (LedgerEntry.balance_after_cents is stamped with
               Creator.ledger_balance_cents after the append.)
    input_set: >-
      One RevenueEvent at a time. On a re-score triggered by a rating change,
      the affected set is every RevenueEvent with content_item_id == the rated
      item, RevenueProduct.suitability_sensitive == true, and status IN
      {ACCRUED, BELOW_MINIMUM} for a downgrade or status IN {REVERSED,
      BELOW_MINIMUM} for an appeal restore. Events with status == CLAWED_BACK
      are NEVER re-scored. The affected set is processed in
      occurred_at ASC, created_at ASC order so the appended LedgerEntry rows
      carry a deterministic balance_after_cents sequence.
    constants:
      MAX_EFFECTIVE_SHARE_BPS: 9000
      TIER_BONUS_BPS: { T0: 0, T1: 200, T2: 400, T3: 600 }
      TIER_BOUNDARIES_LIFETIME_PAID_CENTS: { T1: 100000, T2: 1000000, T3: 10000000 }
      SUITABILITY_MULT_BPS: { GREEN: 10000, YELLOW: 6000, RED: 0 }
    precision: "integer cents; bps floored at step 4, money ROUND_HALF_UP at step 5"
    variants:
      - name: INITIAL_ACCRUAL
        when: "POST /monetization/revenue-events"
        difference: >-
          terms_version_at_accrual and suitability_rating_at_accrual are
          snapshotted from RevenueProduct.terms_version and the linked
          ContentItem.suitability_rating (GREEN when content_item_id is null);
          previous creator_share_cents is treated as 0, so step 7 emits an
          ACCRUAL entry.
      - name: RESCORE_ON_RERATING
        when: "POST /monetization/content-items/{content_item_id}/rate"
        difference: >-
          suitability_rating_at_accrual is OVERWRITTEN with the new rating and
          the split is recomputed; terms_version_at_accrual is NOT refreshed,
          so a later PATCH of the product's terms never reaches an old event.
          A RED rating yields effective_share_bps == 0, creator_share_cents == 0
          and status == REVERSED (not BELOW_MINIMUM) — the reversal status wins
          over the threshold status whenever the multiplier is 0.
      - name: RESTORE_ON_APPEAL
        when: "POST /monetization/appeals/{appeal_id}/decide (decision == UPHELD)"
        difference: >-
          suitability_rating_at_accrual is overwritten with Appeal.requested_rating
          and the split is recomputed with the tier bonus read from the CURRENT
          lifetime_paid_cents; status returns to ACCRUED, or BELOW_MINIMUM when
          the restored share is strictly below product.min_payable_cents. Step 7
          emits ACCRUAL_RESTORE.

  - name: eligibility_evaluation
    trigger: >-
      Runs on POST /monetization/creators/{creator_id}/evaluate, as the second
      hop of the POST /monetization/creators/{creator_id}/policy-strikes
      cascade, as the second hop of the
      POST /monetization/investigations/{investigation_id}/substantiate cascade,
      and once per Creator in step 3 of
      POST /monetization/earnings-periods/{period_id}/close. Writes
      Creator.eligibility_status, Creator.last_evaluation_failed_criteria,
      Creator.evaluation_count and Creator.last_evaluated_at.
    algorithm: threshold
    formula: |
      INPUTS: creator.follower_count, creator.watch_time_minutes_365d,
              creator.active_strike_count

      step 1  POLICY GATE (short-circuits — outranks both metric criteria):
                if creator.active_strike_count >= 1:
                    eligibility_status = SUSPENDED
                    last_evaluation_failed_criteria = ["POLICY_COMPLIANCE"]
                    GOTO step 3
                (the metric criteria are NOT appended in this branch even when
                 they also fail — the array has exactly one element)

      step 2  METRIC GATE, evaluated in the fixed emission order
              FOLLOWER_MINIMUM then WATCH_TIME_MINIMUM (both are evaluated;
              neither short-circuits the other):
                failed = []
                if creator.follower_count < MIN_FOLLOWERS:
                    failed.append("FOLLOWER_MINIMUM")
                if creator.watch_time_minutes_365d < MIN_WATCH_MINUTES_365D:
                    failed.append("WATCH_TIME_MINIMUM")
                eligibility_status = (failed is empty) ? ELIGIBLE : INELIGIBLE
                last_evaluation_failed_criteria = failed

      step 3  evaluation_count += 1
              last_evaluated_at = current logical time
              (both counters advance on EVERY evaluation, including one whose
               eligibility_status is unchanged — an ELIGIBLE -> ELIGIBLE
               no-op evaluation still increments evaluation_count)

      BOUNDARY: follower_count == MIN_FOLLOWERS PASSES (>=), 
                follower_count == MIN_FOLLOWERS - 1 FAILS.
                Likewise watch_time_minutes_365d == MIN_WATCH_MINUTES_365D
                PASSES.
    input_set: >-
      Exactly one Creator row; no child entity is consulted. Creator.payout_state
      is neither read nor written by this rule — the two dimensions of the
      Creator state machine are independent.
    constants:
      MIN_FOLLOWERS: 10000
      MIN_WATCH_MINUTES_365D: 240000
      STRIKE_ACTIVE_DAYS: 90
      CRITERION_EMISSION_ORDER: ["FOLLOWER_MINIMUM", "WATCH_TIME_MINIMUM", "POLICY_COMPLIANCE"]
    precision: "integer comparisons only; no rounding"
    variants:
      - name: ON_DEMAND
        when: "POST /monetization/creators/{creator_id}/evaluate"
        difference: >-
          Reads active_strike_count exactly as stored — no strike lapse is
          applied first, so a creator whose only strike is older than
          STRIKE_ACTIVE_DAYS still evaluates to SUSPENDED here.
      - name: PERIOD_CLOSE
        when: "POST /monetization/earnings-periods/{period_id}/close step 3"
        difference: >-
          Runs strictly AFTER close step 2 has zeroed active_strike_count for
          every Creator whose last_strike_at + STRIKE_ACTIVE_DAYS <= close
          time. Identical creator state therefore yields SUSPENDED under
          ON_DEMAND and ELIGIBLE/INELIGIBLE under PERIOD_CLOSE.

  - name: withholding_rate_resolution
    trigger: >-
      Runs on POST /monetization/tax-profiles (new profile), on
      .../submit, .../verify, .../revise, on the period-close step-1 expiry
      sweep, and whenever a rate is needed by statement_withholding. Writes
      TaxProfile.withholding_rate_bps.
    algorithm: constraint_propagation
    formula: |
      CURRENT PROFILE SELECTION (selector — the only place a profile is chosen
      by description rather than by id):
        eligibility filter : TaxProfile.creator_id == creator.id
                             AND status IN {DRAFT, SUBMITTED, VERIFIED,
                                            REJECTED, EXPIRED}
                             (i.e. every status except SUPERSEDED)
        ranking expression : created_at DESC
        tie-break          : none required — POST /monetization/tax-profiles
                             supersedes every prior non-SUPERSEDED profile of
                             the creator in the same request, so the candidate
                             set holds at most one row by construction
        empty-set fallback : rate = BACKUP_WITHHOLDING_BPS (no profile at all)

      RATE OF THE SELECTED PROFILE:
        if status != VERIFIED:              # DRAFT, SUBMITTED, REJECTED, EXPIRED
            rate = BACKUP_WITHHOLDING_BPS
        elif form_type == W9:               # US person, country_code == US
            rate = tin_provided ? 0 : BACKUP_WITHHOLDING_BPS
        else:                               # form_type == W8BEN, non-US person
            if treaty_claimed == false:            rate = NRA_DEFAULT_BPS
            elif tin_provided == false:            rate = NRA_DEFAULT_BPS
            elif TREATY_MIN_RATE_BPS[country_code] is null:
                                                   rate = NRA_DEFAULT_BPS
            else:
                rate = max(treaty_rate_bps,
                           TREATY_MIN_RATE_BPS[country_code])
            # a claim BELOW the country's treaty floor is silently lifted to the
            # floor; it is not an error. A claim ABOVE the floor is honoured
            # as-is (the creator may over-withhold).

      TaxProfile.withholding_rate_bps is written on every status change of the
      profile. A SUPERSEDED profile keeps its last computed value frozen and is
      excluded from selection forever after.
    input_set: >-
      One TaxProfile per creator (the non-SUPERSEDED one). Creator.country_code
      is not read here — TaxProfile.country_code is, and validation priority 27
      guarantees the two agree at creation time.
    constants:
      BACKUP_WITHHOLDING_BPS: 2400
      NRA_DEFAULT_BPS: 3000
      TAX_FORM_VALIDITY_DAYS: 1095
      TREATY_MIN_RATE_BPS: { US: null, GB: 0, DE: 0, IN: 1500, JP: 1000, BR: null }
    precision: "integer bps; no rounding"
    variants: []

  - name: statement_withholding
    trigger: >-
      PROVISIONAL variant runs once per created EarningsStatement in step 4 of
      POST /monetization/earnings-periods/{period_id}/close. FINAL variant runs
      on POST /monetization/earnings-statements/{statement_id}/finalize. Writes
      EarningsStatement.withholding_rate_bps, .withholding_variant,
      .withholding_cents and .net_payable_cents.
    algorithm: aggregation
    formula: |
      FROZEN EVENT SET of a statement S (identical for both variants, fixed at
      the instant the period closed and never re-derived afterwards):

        event_basis(e) = SUM of LedgerEntry.amount_cents over entries with
                           source_entity == REVENUE_EVENT
                           AND source_id == e.id
                           AND entry_type IN {ACCRUAL, ACCRUAL_REVERSAL,
                                              ACCRUAL_RESTORE}
                           AND occurred_at <= EarningsPeriod.closed_at
        E(S)           = { e : RevenueEvent
                             AND e.period_id  == S.period_id
                             AND e.creator_id == S.creator_id
                             AND event_basis(e) > 0 }
                         ordered by occurred_at ASC, created_at ASC

        By construction SUM(event_basis(e) for e in E(S)) == S.creator_share_cents,
        because a BELOW_MINIMUM event never produced an ACCRUAL entry and a
        REVERSED event's ACCRUAL and ACCRUAL_REVERSAL entries cancel to 0. A
        rating change made AFTER closed_at appends entries with a later
        occurred_at and therefore CANNOT move E(S) or any event_basis — this is
        the mechanism that makes a CLOSED period's statement immutable.

      COMMON step 0 — rate resolution:
        rate_bps = calculations.withholding_rate_resolution(S.creator_id)
                   evaluated AT THE MOMENT THIS VARIANT RUNS
        S.withholding_rate_bps = rate_bps

      VARIANT PROVISIONAL  (aggregate-then-round — ONE rounding operation):
        S.withholding_cents = ROUND_HALF_UP(S.creator_share_cents * rate_bps / 10000)

      VARIANT FINAL  (per-event-then-sum — N rounding operations):
        S.withholding_cents = SUM over e in E(S) of
                                ROUND_HALF_UP(event_basis(e) * rate_bps / 10000)

      COMMON tail:
        S.net_payable_cents = S.creator_share_cents - S.withholding_cents
        (net_payable_cents may therefore CHANGE at finalization even when the
         rate did not move, purely because the rounding order changed)

      TRUE-UP LEDGER ENTRY (finalize only):
        delta = provisional withholding_cents - final withholding_cents
        if delta != 0 -> append LedgerEntry(entry_type = WITHHOLDING_TRUE_UP,
                                            amount_cents = +delta)
        if delta == 0 -> no entry is written
        (delta > 0 means the FINAL variant withheld LESS, so the creator is
         credited; delta < 0 debits the creator.)

      WORKED DIVERGENCE (both variants, rate_bps = 3000, three events of
      creator_share_cents 335, 335, 335; creator_share_cents == 1005):
        PROVISIONAL: ROUND_HALF_UP(1005 * 0.30)        = ROUND_HALF_UP(301.5) = 302
        FINAL:       3 * ROUND_HALF_UP(335 * 0.30)     = 3 * ROUND_HALF_UP(100.5) = 3 * 101 = 303
        delta = 302 - 303 = -1 -> WITHHOLDING_TRUE_UP of -1 cent.
    input_set: >-
      E(S) as defined above — RevenueEvents of one creator inside one period
      whose ledger-derived accrual basis as of EarningsPeriod.closed_at is
      strictly positive. Events created after closed_at belong to a later OPEN
      period and are never members. Events whose status later becomes
      CLAWED_BACK stay members: a clawback moves money through
      EarningsStatement.clawback_applied_cents, never through withholding.
    constants:
      BACKUP_WITHHOLDING_BPS: 2400
    precision: "integer cents, ROUND_HALF_UP; the rounding ORDER is the variant discriminator"
    variants:
      - name: PROVISIONAL
        when: "EarningsPeriod close step 4 — statement is born PROVISIONAL"
        difference: >-
          Aggregate-then-round: one ROUND_HALF_UP applied to
          creator_share_cents * rate_bps. Uses the rate resolved at close time,
          i.e. AFTER close step 1 has expired stale VERIFIED tax profiles.
      - name: FINAL
        when: "POST /monetization/earnings-statements/{statement_id}/finalize"
        difference: >-
          Per-event-then-sum: ROUND_HALF_UP applied once per member of E(S) and
          then summed. Also re-resolves the rate against the creator's current
          non-SUPERSEDED TaxProfile, so a profile verified between close and
          finalize changes the rate as well as the rounding order. The two
          effects are independent and both land in the single
          WITHHOLDING_TRUE_UP entry.

  - name: payout_fee_and_amount
    trigger: >-
      Runs exactly once, on POST /monetization/payouts. Writes Payout.method,
      Payout.payable_before_fee_cents, Payout.fee_cents, Payout.amount_cents and
      Payout.fund_credit_cents. NEVER re-runs — POST /monetization/payouts/{payout_id}/retry
      reuses the stored fee_cents and amount_cents verbatim.
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS NORMATIVE. The fee tier is keyed on the PRE-fee
      payable, while the disbursed amount is the payable NET of that fee. Re-deriving
      the tier from amount_cents after step 7 is the canonical wrong answer:
      it changes the tier for every payable within fee_cents of a boundary.

      step 1  payable = Creator.available_balance_cents snapshotted BEFORE any
                        field of this request is written
                        (= statement_payable_cents + fund_credit_balance_cents
                           - held_cents; held_cents is 0 because creation
                           requires payout_state == ACCRUING)
              Payout.payable_before_fee_cents = payable
              Payout.method = Creator.payout_method   (snapshot, not a live read)

      step 2  volume tier selected from `payable`, INCLUSIVE lower bounds:
                payable <  50000                    -> tier T1, mult 10000
                50000  <= payable <  500000         -> tier T2, mult  7500
                500000 <= payable                   -> tier T3, mult  5000
              (payable == 50000 is T2; payable == 49999 is T1)

      step 3  gross_fee = FEE_FLAT_CENTS[method]
                        + ceil(payable * FEE_PCT_BPS[method] / 10000)
              (CEIL, not round — the percentage component always rounds up)

      step 4  tiered_fee = ceil(gross_fee * tier_mult / 10000)

      step 5  capped_fee = min(tiered_fee, FEE_CAP_CENTS[method])

      step 6  fee_cents = min(capped_fee, payable - 1)
              (floor guarantee: a Payout always disburses at least 1 cent, so a
               payable of 1 cent yields fee_cents == 0. Unreachable in practice
               because creation also requires payable >= payout_threshold_cents
               >= 1000, but the clamp is part of the contract.)

      step 7  amount_cents = payable - fee_cents

      step 8  fund_credit_cents = min(Creator.fund_credit_balance_cents, payable)
              Creator.fund_credit_balance_cents = 0

      step 9  ledger side effects, in this order:
                append LedgerEntry(PAYOUT_DEBIT, -amount_cents)
                append LedgerEntry(PAYOUT_FEE,   -fee_cents)   [omitted when fee_cents == 0]

      WORKED BOUNDARY (method == BANK_TRANSFER, FEE_PCT_BPS 0, FEE_FLAT 200):
        payable = 49999 -> T1: ceil(200*10000/10000)=200, fee 200, amount 49799
        payable = 50000 -> T2: ceil(200* 7500/10000)=150, fee 150, amount 49850
      WORKED BOUNDARY (method == INSTANT_DEBIT, FEE_PCT_BPS 150, FEE_FLAT 100):
        payable = 500000 -> T3: gross ceil(500000*150/10000)=7500, +100 = 7600;
                            tiered ceil(7600*5000/10000) = 3800;
                            cap 4000 -> fee 3800; amount 496200
    input_set: >-
      One Creator and its derived available_balance_cents at the instant of
      creation. The EarningsStatements attached by the same request are the ones
      with status IN {FINALIZED, ADJUSTED} and payout_id == null, attached in
      EarningsPeriod.period_start ASC, EarningsStatement.created_at ASC order.
    constants:
      FEE_FLAT_CENTS: { BANK_TRANSFER: 200, INSTANT_DEBIT: 100, CHECK: 500 }
      FEE_PCT_BPS: { BANK_TRANSFER: 0, INSTANT_DEBIT: 150, CHECK: 0 }
      FEE_CAP_CENTS: { BANK_TRANSFER: 1500, INSTANT_DEBIT: 4000, CHECK: 500 }
      VOLUME_TIER_LOWER_BOUNDS_CENTS: { T2: 50000, T3: 500000 }
      VOLUME_TIER_MULT_BPS: { T1: 10000, T2: 7500, T3: 5000 }
      MAX_PAYOUT_RETRIES: 2
    precision: "integer cents; CEIL at steps 3 and 4, no ROUND_HALF_UP anywhere in this rule"
    variants: []

  - name: clawback_waterfall
    trigger: >-
      SUBSTANTIATION_SWEEP variant runs on
      POST /monetization/investigations/{investigation_id}/substantiate.
      PERIOD_CLOSE_ARREARS_OFFSET variant runs in step 5 of
      POST /monetization/earnings-periods/{period_id}/close. Writes
      Investigation.clawback_base_cents / .clawback_recovered_cents /
      .clawback_unrecovered_cents, EarningsStatement.clawback_applied_cents,
      EarningsStatement.status and Creator.outstanding_clawback_cents.
    algorithm: waterfall_allocation
    formula: |
      ---------- VARIANT SUBSTANTIATION_SWEEP ----------

      step 1  ASSESSMENT — the violation window is CLOSED on BOTH ends:
                W = { e : RevenueEvent
                        AND e.creator_id == investigation.creator_id
                        AND e.status == ACCRUED
                        AND investigation.violation_window_start
                              <= e.occurred_at
                              <= investigation.violation_window_end }
                clawback_base_cents = SUM of e.creator_share_cents over W
                every e in W gets status = CLAWED_BACK and
                last_status_change_at = current logical time
                (events already REVERSED, BELOW_MINIMUM or CLAWED_BACK are NOT
                 re-assessed; an event exactly ON either endpoint IS in W)

      step 2  BUCKET ORDER — the creator's absorbing statements:
                B = [ s : EarningsStatement
                        AND s.creator_id == investigation.creator_id
                        AND s.status IN {FINALIZED, ADJUSTED}
                        AND s.payout_id == null ]
                    ordered by EarningsPeriod[s.period_id].period_start ASC,
                             then s.created_at ASC
                (oldest period first. Statements that are PROVISIONAL,
                 UNDER_DISPUTE or PAID, and statements already attached to a
                 Payout, are NOT buckets — they cannot absorb anything.)

      step 3  WATERFALL, single pass, no revisiting:
                remaining = clawback_base_cents
                for s in B:
                    if remaining == 0: break
                    capacity = max(s.net_payable_cents
                                   - s.clawback_applied_cents
                                   + s.dispute_adjustment_cents, 0)
                    take = min(remaining, capacity)
                    if take > 0:
                        s.clawback_applied_cents += take
                        s.status = ADJUSTED
                        remaining -= take
                clawback_recovered_cents   = clawback_base_cents - remaining
                clawback_unrecovered_cents = remaining

      step 4  if clawback_recovered_cents > 0:
                  append LedgerEntry(CLAWBACK, -clawback_recovered_cents,
                                     source_entity = INVESTIGATION,
                                     source_id = investigation.id)
              if clawback_unrecovered_cents > 0:
                  Creator.outstanding_clawback_cents += clawback_unrecovered_cents
                  (no LedgerEntry — an unrecovered clawback is a receivable, not
                   a ledger movement; it lands on the ledger only when a later
                   period-close offset absorbs it)

      step 5  Creator.payout_state recomputed by payout_state_resolution. The
              hop-5 void of PENDING Payouts happens AFTER step 3, so statements
              detached by that void are NOT re-swept in this request.

      ---------- VARIANT PERIOD_CLOSE_ARREARS_OFFSET ----------

      Runs per Creator with outstanding_clawback_cents > 0 that received a
      statement S in close step 4 (a creator with arrears but no step-4
      statement is skipped entirely and keeps its full arrears):

        offset = min(Creator.outstanding_clawback_cents, S.net_payable_cents)
        if offset > 0:
            S.clawback_applied_cents += offset
            S.status is UNCHANGED (S is PROVISIONAL at this instant and stays
              PROVISIONAL — the ADJUSTED status of the sweep variant does not
              apply here)
            Creator.outstanding_clawback_cents -= offset
            append LedgerEntry(CLAWBACK, -offset,
                               source_entity = EARNINGS_STATEMENT,
                               source_id = S.id)
            Creator.payout_state recomputed
        Creators are processed in Creator.created_at ASC order so the appended
        entries carry a deterministic balance_after_cents sequence.
    input_set: >-
      SUBSTANTIATION_SWEEP: all RevenueEvents of the creator inside the closed
      violation window with status == ACCRUED (any period, OPEN or CLOSED), and
      all unattached FINALIZED/ADJUSTED statements as buckets.
      PERIOD_CLOSE_ARREARS_OFFSET: exactly one statement — the one this close
      just created for this creator — and its net_payable_cents as the only
      capacity term.
    constants: {}
    precision: "integer cents; no rounding — the waterfall only ever moves whole existing cents"
    variants:
      - name: SUBSTANTIATION_SWEEP
        when: "POST /monetization/investigations/{investigation_id}/substantiate"
        difference: >-
          Base is derived from RevenueEvents in a closed window; capacity is
          net_payable_cents - clawback_applied_cents + dispute_adjustment_cents;
          absorbing statements are pushed to ADJUSTED; multiple buckets are
          consumed in period_start ASC order; unabsorbed residue becomes
          Creator.outstanding_clawback_cents.
      - name: PERIOD_CLOSE_ARREARS_OFFSET
        when: "POST /monetization/earnings-periods/{period_id}/close step 5"
        difference: >-
          Base is the stored Creator.outstanding_clawback_cents; capacity is
          plain net_payable_cents (clawback_applied_cents and
          dispute_adjustment_cents are ignored because a freshly created
          statement has both at 0); exactly ONE bucket is consulted; the
          statement stays PROVISIONAL; the LedgerEntry's source_entity is
          EARNINGS_STATEMENT rather than INVESTIGATION.

  - name: fund_allocation
    trigger: >-
      Runs on POST /monetization/creator-funds/{fund_id}/allocate (first run and
      supersede run). Creates FundAllocation rows and writes
      CreatorFund.allocation_run_count; CreatorFund.allocated_cents,
      .unallocated_remainder_cents and .recipient_count are derived from the
      resulting ACTIVE rows.
    algorithm: waterfall_allocation
    formula: |
      step 1  CANDIDATE POOL (selector):
                eligibility filter : Creator.eligibility_status == ELIGIBLE
                                     AND Creator.watch_time_minutes_365d
                                           >= fund.min_watch_time_minutes
                                     AND Creator.watch_time_minutes_365d > 0
                ranking expression : watch_time_minutes_365d DESC
                tie-break          : created_at ASC
                empty-set fallback : the request is rejected with
                                     ERR_FUND_POOL_EMPTY (422); no row is
                                     created, allocation_run_count does not
                                     advance, existing ACTIVE rows survive
              rank = 1-based position in that ordering.
              FundAllocation.watch_time_minutes_at_allocation and
              .methodology_snapshot are snapshotted here.
              Creator.payout_state is NOT part of the filter: an ARREARS or HOLD
              creator still receives an allocation.

      step 2a METHODOLOGY PRO_RATA_WATCH_TIME (transparency-maximising):
                total_wt = SUM of wt_i over the pool
                provisional_i = floor(fund.total_pool_cents * wt_i / total_wt)
                amount_i = min(provisional_i, fund.max_allocation_cents)
                remainder = fund.total_pool_cents - SUM(amount_i)
                SINGLE remainder pass, rank ASC:
                  for i in rank order:
                      if remainder == 0: break
                      if amount_i < fund.max_allocation_cents:
                          amount_i += 1 ; remainder -= 1
                (at most ONE cent per recipient; the pass is not repeated.
                 Whatever `remainder` is left is NOT redistributed and shows up
                 as CreatorFund.unallocated_remainder_cents.)

      step 2b METHODOLOGY GUARANTEED_FLOOR_WATERFALL (predictability-maximising):
                N = |pool| ; floor_c = FUND_GUARANTEED_FLOOR_CENTS
                if fund.total_pool_cents < N * floor_c:
                    # under-funded: strict rank waterfall, later ranks get nothing
                    pool_left = fund.total_pool_cents
                    for i in rank order:
                        amount_i = min(floor_c, pool_left)
                        pool_left -= amount_i
                    # the boundary rank may receive a PARTIAL floor
                else:
                    surplus = fund.total_pool_cents - N * floor_c
                    share_i = floor(surplus * wt_i / total_wt)
                    amount_i = min(floor_c + share_i, fund.max_allocation_cents)
                    remainder = fund.total_pool_cents - SUM(amount_i)
                    SINGLE remainder pass in rank ASC order, identical to 2a
                A recipient whose amount_i == 0 gets NO FundAllocation row at
                all (rows are created only for amount_cents > 0), so
                recipient_count < |pool| is normal for an under-funded fund.

      step 3  SUPERSEDE: when the fund was already ALLOCATED, every existing
              FundAllocation with status == ACTIVE is first set to VOIDED with
              voided_at = current logical time and
              void_reason = "SUPERSEDED_BY_REALLOCATION"; the new rows are then
              created. allocation_run_count += 1 in both cases.
              CreatorFund.version increments by 1 (OCC — see §1.2.1
              fund-allocate-stale-fund).

      CONSERVATION INVARIANT (must hold after every allocate, void-allocations
      and disburse call):
        CreatorFund.allocated_cents + CreatorFund.unallocated_remainder_cents
          == CreatorFund.total_pool_cents
      and allocated_cents == SUM of FundAllocation.amount_cents over rows with
      status == ACTIVE. Voided rows keep their amount_cents but leave the sum.

      WORKED PRO_RATA (pool 100000, max_allocation 1000000, three ELIGIBLE
      creators with wt 500000 / 300000 / 200001, total_wt 1000001):
        provisional = floor(100000*500000/1000001)=49999,
                      floor(100000*300000/1000001)=29999,
                      floor(100000*200001/1000001)=20000
        sum = 99998 -> remainder 2 -> ranks 1 and 2 each +1
        amounts = 50000 / 30000 / 20000 ; unallocated_remainder_cents = 0
      WORKED GUARANTEED_FLOOR on the SAME pool (floor 5000, N=3,
      3*5000 = 15000 <= 100000, surplus 85000):
        share = floor(85000*500000/1000001)=42499,
                floor(85000*300000/1000001)=25499,
                floor(85000*200001/1000001)=17000
        amounts before remainder = 47499 / 30499 / 22000 ; sum 99998
        remainder 2 -> ranks 1 and 2 each +1 -> 47500 / 30500 / 22000
      Identical inputs, different per-recipient results: the transparency /
      predictability trade-off is observable at the cent level.
    input_set: >-
      Every Creator row in the candidate pool defined in step 1, evaluated at
      the instant of the allocate call. Creators outside the pool are not
      represented by any row. No RevenueEvent, EarningsStatement or Payout is
      read: fund money is additive to statement money and flows to the creator
      only through Creator.fund_credit_balance_cents at disburse time.
    constants:
      FUND_GUARANTEED_FLOOR_CENTS: 5000
    precision: "integer cents; FLOOR on the pro-rata quotient, then a single rank-ordered +1-cent remainder pass"
    variants:
      - name: PRO_RATA_WATCH_TIME
        when: "CreatorFund.methodology == PRO_RATA_WATCH_TIME"
        difference: >-
          Every recipient's amount is strictly proportional to
          watch_time_minutes_365d, so the smallest creator in the pool can
          receive a few cents; there is no guaranteed minimum and no rank
          cliff.
      - name: GUARANTEED_FLOOR_WATERFALL
        when: "CreatorFund.methodology == GUARANTEED_FLOOR_WATERFALL"
        difference: >-
          Every recipient is first lifted to FUND_GUARANTEED_FLOOR_CENTS and
          only the surplus is proportional, which redistributes money from the
          largest to the smallest creators for the same pool; when the pool
          cannot cover N floors the allocation becomes a hard rank cliff in
          which low-ranked candidates receive nothing at all.

  - name: payout_state_resolution
    trigger: >-
      Recomputed at the end of every request that touches
      Creator.outstanding_clawback_cents, any Investigation.state /
      Investigation.hold_payouts, or any Payout.state. Writes
      Creator.payout_state.
    algorithm: constraint_propagation
    formula: |
      STRICT PRECEDENCE — first matching clause wins:
        1. if Creator.outstanding_clawback_cents > 0
               -> ARREARS
        2. elif EXISTS Investigation with creator_id == creator.id
                     AND state == OPEN AND hold_payouts == true
               -> HOLD
        3. elif EXISTS Payout with creator_id == creator.id
                     AND state IN {PENDING, PROCESSING}
               -> PAYOUT_IN_FLIGHT
        4. else
               -> ACCRUING

      Consequences pinned by this ordering:
        * ARREARS masks an open holding investigation; clearing that
          investigation while arrears remain leaves payout_state at ARREARS.
        * HOLD masks an in-flight payout, so opening a holding investigation on
          a creator with a PENDING Payout flips PAYOUT_IN_FLIGHT -> HOLD, and
          POST /monetization/payouts/{payout_id}/submit is then rejected.
        * The rule is a pure function of stored state — it never depends on the
          previous value of payout_state, so it is idempotent.
      This dimension NEVER reads or writes Creator.eligibility_status.
    input_set: >-
      One Creator plus its Investigations with state == OPEN and its Payouts
      with state IN {PENDING, PROCESSING}. Payouts in PAID, FAILED, VOIDED or
      ABANDONED are ignored, which is why a FAILED payout awaiting retry leaves
      the creator ACCRUING and re-payable.
    constants: {}
    precision: "enumerated result; no arithmetic"
    variants: []

  - name: creator_balance_projection
    trigger: >-
      Evaluated on every read of a Creator (GET /monetization/creators,
      GET /monetization/creators/{creator_id},
      GET /monetization/creators/{creator_id}/earnings-summary) and on every
      write that needs a balance (payout creation, investigation hold snapshot).
      Writes nothing persistent — all four fields are derived on read.
    algorithm: aggregation
    formula: |
      ledger_balance_cents =
        SUM of LedgerEntry.amount_cents over ALL entries with
        creator_id == creator.id (no entry_type filter, no time window, signed).

      held_cents =
        SUM of Investigation.hold_amount_cents over this creator's
        Investigations with state == OPEN AND hold_payouts == true.

      statement_payable_cents =
        SUM of (net_payable_cents - clawback_applied_cents
                + dispute_adjustment_cents)
        over this creator's EarningsStatements with
        status IN {FINALIZED, ADJUSTED} AND payout_id == null.
        (PROVISIONAL, UNDER_DISPUTE and PAID statements contribute nothing, and
         neither does a statement already attached to a Payout — that money has
         already left as PAYOUT_DEBIT.)

      available_balance_cents =
        statement_payable_cents + fund_credit_balance_cents - held_cents
        (may be negative or zero; POST /monetization/payouts rejects any value
         <= 0 with ERR_NO_PAYABLE_BALANCE before the threshold check runs)

      CONSERVED-QUANTITY INVARIANTS (each is a forward action paired with its
      compensating action; the named quantity must return to its exact prior
      value):

        I1  LEDGER BALANCE ACROSS A PAYOUT ROUND TRIP.
            For any payout p, the entries PAYOUT_DEBIT(-amount_cents),
            PAYOUT_FEE(-fee_cents) and PAYOUT_REVERSAL(+(amount_cents +
            fee_cents)) sum to exactly 0. Therefore
            Creator.ledger_balance_cents after PENDING->VOIDED,
            PROCESSING->FAILED or PROCESSING->ABANDONED equals its value
            immediately before POST /monetization/payouts, and
            Creator.fund_credit_balance_cents is restored to its pre-payout
            value by the +fund_credit_cents restore. A retry re-debits the same
            two amounts, so N failures followed by N reversals also net to 0.

        I2  FUND POOL CONSERVATION.
            CreatorFund.allocated_cents + CreatorFund.unallocated_remainder_cents
            == CreatorFund.total_pool_cents holds after allocate, after a
            supersede allocate, and after void-allocations (which returns
            allocated_cents to 0 and unallocated_remainder_cents to
            total_pool_cents). Disbursement moves allocated_cents into
            SUM(Creator.fund_credit_balance_cents) over recipients, so
            SUM over recipients of FUND_CREDIT LedgerEntry.amount_cents
            == CreatorFund.allocated_cents at disburse time.

        I3  ACCRUAL REVERSIBILITY ACROSS A RATING ROUND TRIP.
            For any RevenueEvent, SUM of its ACCRUAL + ACCRUAL_REVERSAL +
            ACCRUAL_RESTORE entries == its current creator_share_cents. A
            GREEN -> RED re-rating followed by an UPHELD appeal restoring GREEN
            therefore returns Creator.ledger_balance_cents to its pre-rating
            value, provided the creator's TIER_BONUS_BPS bucket did not change
            in between.

        I4  DISPUTE ROUND TRIP.
            A FINALIZED -> UNDER_DISPUTE -> FINALIZED cycle resolved REJECTED
            appends no LedgerEntry and leaves dispute_adjustment_cents at its
            prior value, so both ledger_balance_cents and
            statement_payable_cents return to their pre-dispute values exactly.
    input_set: >-
      All LedgerEntry rows of the creator; the creator's Investigations with
      state == OPEN; the creator's EarningsStatements with
      status IN {FINALIZED, ADJUSTED} and payout_id == null.
    constants: {}
    precision: "integer cents; pure summation, no rounding"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (STRICTLY ORDERED BY PRIORITY)
# =============================================================================
# The list below is a TOTAL order. When a single request violates several rows,
# the row with the LOWEST `priority` number produces the response; no other row
# is evaluated and no side effect fires. `applies_to: all` rows are evaluated
# before any endpoint-specific row of a higher number, in the order shown.
#
# Group boundaries:
#     1 -  4   authentication and authorization
#     5 -  9   request shape (pagination, required fields, types, ranges, text)
#    10 - 11   existence of path resources, then of body foreign keys
#        12    resource-ownership scoping for the entity-backed Creator role
#    13 - 41   state preconditions, including cross-entity state preconditions
#    42 - 43   optimistic-concurrency version checks  (DELIBERATELY AFTER STATE)
#    44 - 48   business_safety: segregation of duties and tax/policy compliance
#    49 - 61   business_referential: cross-field and cross-entity consistency
#    62 - 65   business_constraint: uniqueness and closure constraints
#    66 - 73   business_temporal: interval validity and interval overlap
#    74 - 79   business_fiscal: balance, threshold, pool and capacity checks
#
# PINNED PRIORITY CONFLICTS (each pair is a different error-category pair, and
# each is reachable by a single request that violates both rows at once):
#   C1  state vs business_fiscal — POST /monetization/payouts for a creator
#       whose payout_state == ARREARS and whose available_balance_cents == 0
#       returns ERR_CREATOR_NOT_PAYABLE (priority 37), NOT
#       ERR_NO_PAYABLE_BALANCE (priority 74).
#   C2  state vs business_safety — POST /monetization/investigations/{id}/substantiate
#       sent by the opening reviewer against an already SUBSTANTIATED
#       investigation returns ERR_INVESTIGATION_NOT_OPEN (priority 31), NOT
#       ERR_SEGREGATION_OF_DUTIES (priority 44).
#   C3  business_safety vs business_fiscal — POST /monetization/payouts for a
#       creator with no VERIFIED TaxProfile whose available_balance_cents is
#       below payout_threshold_cents returns ERR_TAX_DOCUMENTATION_MISSING
#       (priority 47), NOT ERR_BELOW_PAYOUT_THRESHOLD (priority 75).
#   C4  business_referential vs business_temporal — POST /monetization/revenue-events
#       whose content_item_id belongs to another creator AND whose occurred_at
#       falls outside every OPEN period returns ERR_CONTENT_CREATOR_MISMATCH
#       (priority 49), NOT ERR_NO_OPEN_PERIOD_FOR_EVENT (priority 71).
#   C5  state vs optimistic concurrency — POST /monetization/creator-funds/{fund_id}/allocate
#       on a DISBURSED fund carrying a stale expected_fund_version returns
#       ERR_FUND_NOT_ALLOCATABLE 409 (priority 40), NOT ERR_STALE_FUND_VERSION
#       412 (priority 42).
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-blank"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of Creator, PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "When X-User-Role == Creator, X-User-ID equals the id of an existing Creator row (identity: entity_backed:Creator)"
    error_id: ERR_CREATOR_IDENTITY_UNKNOWN
    http_status: 401
    applies_to: all
  - priority: 4
    category: auth
    check: "X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET list endpoint"
  - priority: 6
    category: business_constraint
    check: "Every field marked required in the endpoint's input list is present and non-null"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 7
    category: business_constraint
    check: "Every supplied field has the declared JSON type; every enum field holds a declared member; datetime fields parse as ISO 8601 UTC"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 8
    category: business_constraint
    check: "Every supplied numeric field satisfies its §1.1 constraint (gross_amount_cents > 0, total_pool_cents > 0, payout_threshold_cents >= 1000, follower_count >= 0, watch_time_minutes_365d >= 0, creator_share_bps in 0..9000, platform_fee_bps in 0..10000, treaty_rate_bps in 0..3000, adjustment_cents >= 0, max_allocation_cents > 0, min_watch_time_minutes >= 0)"
    error_id: ERR_FIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 9
    category: business_constraint
    check: "Free-text fields are non-blank and within their length bounds (display_name 1..120, title 1..200, statement_text 1..2000, scope 1..500, label 1..60, name 1..120, finding/reason/rationale/info_request/response_statement/dispute_reason 1..2000)"
    error_id: ERR_INVALID_FIELD_VALUE
