              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/crew-members"
              payload: { full_name: "Bob", visa_type: "US_CITIZEN", visa_expiry_date: "2099-01-01", hourly_rate_cents: 2000 }
              as: HarvestOperator
              captures: { crew_b: $.data.id }
            - call: "POST /harvest/crew-members/${crew_b}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
