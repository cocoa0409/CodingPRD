scenario: "651. Siding & Exterior Remodel (James Hardie contractor): measure & material/color selection, scope (siding/trim/wrap) & sq-ft estimate, permit & HOA, material order & delivery, crew & weather scheduling, change order & progress draw, lifetime/workmanship warranty, financing"
domain_name: "siding-exterior-remodel"
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation     # estimate vs final reconciled cost; provisional vs realized draw release
    - cascading_side_effects       # change-order approval ripples estimate -> draw schedule -> material order
    - optimistic_concurrency       # OCC on Project.version for draw-release races and schedule supersede
    - rate_threshold_triggers      # weather wind-speed thresholds, retainage caps, financing DTI gate

  entity_topology: hybrid
  # Project is the aggregate root (hierarchical: Measurement, Estimate, ChangeOrder, ProgressDraw,
  # WorkSchedule, Warranty under it) with cross-cutting flat references (Permit, HOAApproval,
  # MaterialOrder, FinancingApplication reference Project and EstimateLineItem by FK).

  state_machine_shape: parallel
  # Project carries TWO independent state axes (workflow_status x compliance_status). ChangeOrder
  # is cyclic (SUBMITTED->NEGOTIATING->SUBMITTED revision loop). MaterialOrder branches
  # (CONFIRMED -> {DELIVERED, BACKORDERED} -> ...). ProgressDraw is branching-with-revert.

  relationship_patterns:
    - one_to_many        # Project -> Estimate, ChangeOrder, ProgressDraw, WorkSchedule
    - cross_aggregate    # ChangeOrder references EstimateLineItem; ProgressDraw references WorkSchedule milestone
    - self_referential   # ChangeOrder.supersedes_change_order_id (revision chain)

  role_model: segregation_of_duties
  # ProjectManager scopes/estimates and approves change orders but CANNOT release a draw they
  # authored the change order for; Estimator measures and estimates; HomeownerClient approves
  # change orders and HOA; FinanceOfficer releases draws and decides financing; Anonymous registers.

  consistency_model: immediate

# ===========================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> HomeownerClient.id; the homeowner who owns this remodel project."
      - name: project_manager_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the assigned ProjectManager. Must be a StaffMember whose role_code == PROJECT_MANAGER."
      - name: property_address
        type: string
        source: input
        description: "Street address of the home being re-sided."
      - name: hoa_required
        type: boolean
        source: input
        description: "Whether the property sits in an HOA whose architectural approval is required before scheduling."
        default: false
      - name: workflow_status
        type: enum
        source: system
        description: "Primary workflow axis. Independent of compliance_status."
        default: DRAFT
        constraints: "one of {DRAFT, MEASURED, ESTIMATED, ORDERED, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Independent regulatory-clearance axis tracking permit + HOA gates. Evolves separately from workflow_status."
        default: PENDING_CLEARANCE
        constraints: "one of {PENDING_CLEARANCE, PERMIT_FILED, CLEARED, BLOCKED}"
      - name: contract_total_cents
        type: integer
        source: computed
        description: "Realized contract total = approved baseline estimate total + sum of APPROVED ChangeOrder.delta_cents. Recomputed on every change-order approval. See calc realized_contract_total."
        default: 0
      - name: retainage_held_cents
        type: integer
        source: computed
        description: "Cumulative retainage withheld across released draws (capped). See calc draw_release_amount."
        default: 0
      - name: amount_released_cents
        type: integer
        source: computed
        description: "Cumulative cash released to the contractor across all RELEASED ProgressDraw rows."
        default: 0
      - name: cancelled_reason
        type: string
        source: input
        description: "Free-text reason supplied when cancelling; null until cancelled."

  - name: HomeownerClient
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login identity for the homeowner; unique across HomeownerClient rows (case-insensitive)."
        constraints: "unique, lowercased before comparison"
      - name: full_name
        type: string
        source: input
        description: "Homeowner's full legal name as it appears on the contract."
      - name: annual_income_cents
        type: integer
        source: input
        description: "Self-reported annual gross income, used by financing DTI gate."
      - name: monthly_debt_cents
        type: integer
        source: input
        description: "Self-reported total monthly debt obligations, used by financing DTI gate."

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login identity for staff; unique across StaffMember rows (case-insensitive)."
        constraints: "unique, lowercased before comparison"
      - name: full_name
        type: string
        source: input
        description: "Staff member's full name."
      - name: role_code
        type: enum
        source: input
        description: "Operational role this staff member fills."
        constraints: "one of {ESTIMATOR, PROJECT_MANAGER, FINANCE_OFFICER}"

  - name: Measurement
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this on-site measurement belongs to."
      - name: estimator_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the Estimator who recorded the measurement. Must have role_code == ESTIMATOR."
      - name: gross_wall_sqft
        type: number
        source: input
        description: "Total measured exterior wall area in square feet, before subtracting openings."
        constraints: ">= 0"
      - name: opening_sqft
        type: number
        source: input
        description: "Total square footage of windows/doors/openings to subtract from gross wall area."
        constraints: ">= 0"
      - name: linear_trim_ft
        type: number
        source: input
        description: "Linear feet of trim (corners, fascia, window surrounds) to be installed."
        constraints: ">= 0"
      - name: net_siding_sqft
        type: number
        source: computed
        description: "Net sidable area = max(gross_wall_sqft - opening_sqft, 0). See calc net_siding_area."
      - name: color_code
        type: string
        source: input
        description: "Selected James Hardie color/product SKU code (e.g., 'ARCTIC_WHITE_HZ10')."

  - name: Estimate
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this estimate prices out."
      - name: measurement_id
        type: string
        source: input
        description: "FK -> Measurement.id; the measurement this estimate is priced from."
      - name: status
        type: enum
        source: system
        description: "Estimate lifecycle. Only one BASELINE estimate per project at a time; a second baseline attempt is rejected (ERR_BASELINE_EXISTS) rather than superseding."
        default: DRAFT
        constraints: "one of {DRAFT, BASELINE}"
      - name: waste_factor_pct
        type: number
        source: input
        description: "Material waste/overage percentage applied to siding area, e.g., 0.10 for 10%."
        default: 0.10
        constraints: ">= 0 and <= 0.50"
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: "Sum of all EstimateLineItem.extended_cents on this estimate. See calc estimate_subtotal."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Sales tax applied to the line subtotal. See calc estimate_total (per-line-then-sum rounding order pinned)."
        default: 0
      - name: estimate_total_cents
        type: integer
        source: computed
        description: "line_subtotal_cents + tax_cents. The baseline contract amount when this estimate becomes BASELINE. See calc estimate_total."
        default: 0

  - name: EstimateLineItem
    parent: Estimate
    common_fields: true
    fields:
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id; the estimate this scope line belongs to."
      - name: scope_kind
        type: enum
        source: input
        description: "Which scope category this line prices."
        constraints: "one of {SIDING, TRIM, WRAP}"
      - name: quantity
        type: number
        source: input
        description: "Quantity in the scope's natural unit: sqft for SIDING and WRAP, linear ft for TRIM."
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents for this scope line."
        constraints: ">= 0"
      - name: extended_cents
        type: integer
        source: computed
        description: "Effective quantity x unit_price_cents, rounded per-line. SIDING applies the estimate's waste_factor; TRIM and WRAP do not. See calc line_extended_amount."
        default: 0

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this building permit covers."
      - name: jurisdiction
        type: string
        source: input
        description: "Issuing municipality / building department name."
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle."
        default: FILED
        constraints: "one of {FILED, ISSUED, REJECTED}"
      - name: permit_number
        type: string
        source: input
        description: "Municipality-assigned permit number; set when ISSUED."

  - name: HOAApproval
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this HOA architectural review covers."
      - name: status
        type: enum
        source: system
        description: "HOA architectural-review lifecycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED}"
      - name: reviewed_color_code
        type: string
        source: input
        description: "The color/product SKU submitted to the HOA for architectural approval."

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this material purchase order supplies."
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id; the BASELINE estimate whose siding line drives ordered_sqft."
      - name: status
        type: enum
        source: system
        description: "Purchase-order lifecycle. Branches at confirmation into delivered vs backordered."
        default: PLACED
        constraints: "one of {PLACED, CONFIRMED, BACKORDERED, DELIVERED, CANCELLED}"
      - name: ordered_sqft
        type: number
        source: computed
        description: "Siding area to order = net_siding_sqft x (1 + waste_factor_pct), ceil to whole sqft. See calc material_order_qty."
        default: 0
      - name: delivery_eta_iso
        type: datetime
        source: input
        description: "Promised delivery date/time (ISO 8601 UTC), set at confirmation."

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this change order modifies."
      - name: target_line_item_id
        type: string
        source: input
        description: "FK -> EstimateLineItem.id; the baseline line item this change order adjusts (cross-aggregate reference)."
      - name: supersedes_change_order_id
        type: string
        source: input
        description: "FK -> ChangeOrder.id; the prior change order this revision supersedes (self-referential revision chain); null for an original."
      - name: status
        type: enum
        source: system
        description: "Change-order lifecycle with a NEGOTIATING revision cycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, NEGOTIATING, APPROVED, REJECTED, WITHDRAWN}"
      - name: delta_cents
        type: integer
        source: input
        description: "Signed dollar delta (cents) this change order adds to (positive) or removes from (negative) the contract total."
      - name: pm_approved
        type: boolean
        source: system
        description: "Whether the ProjectManager has signed off. Both PM and client sign-off required before APPROVED."
        default: false
      - name: client_approved
        type: boolean
        source: system
        description: "Whether the HomeownerClient has signed off."
        default: false

  - name: WorkSchedule
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this crew work window belongs to."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the crew assigned to this work window."
      - name: milestone
        type: enum
        source: input
        description: "Which billable milestone this window represents (drives draw eligibility)."
        constraints: "one of {WRAP_INSTALL, SIDING_INSTALL, TRIM_FINISH}"
      - name: window_start_iso
        type: datetime
        source: input
        description: "Scheduled crew window start (ISO 8601 UTC, half-open interval start, inclusive)."
      - name: window_end_iso
        type: datetime
        source: input
        description: "Scheduled crew window end (ISO 8601 UTC, half-open interval end, exclusive)."
      - name: forecast_wind_mph
        type: number
        source: input
        description: "Forecast peak wind speed (mph) for this window; gates weather-safe confirmation."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Schedule-window lifecycle."
        default: PROPOSED
        constraints: "one of {PROPOSED, CONFIRMED, COMPLETED, CANCELLED, WEATHER_HOLD}"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew name / call sign."
      - name: max_wind_mph
        type: number
        source: input
        description: "Maximum forecast wind (mph) at which this crew will install Hardie panels; threshold for WEATHER_HOLD."
        default: 25
        constraints: "> 0"

  - name: ProgressDraw
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this progress draw bills against."
      - name: work_schedule_id
        type: string
        source: input
        description: "FK -> WorkSchedule.id; the completed milestone window this draw bills (cross-aggregate reference)."
      - name: status
        type: enum
        source: system
        description: "Draw lifecycle, branching-with-revert (RELEASED can be CLAWED_BACK)."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, RELEASED, CLAWED_BACK, REJECTED}"
      - name: approved_by_staff_id
        type: string
        source: system
        description: "X-User-ID of the ProjectManager StaffMember who approved this draw; used for the segregation-of-duties check at release. Null until approved."
      - name: milestone_pct
        type: number
        source: input
        description: "Percent of contract this milestone bills (e.g., 0.30 for 30%)."
        constraints: "> 0 and <= 1"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Gross draw = round(contract_total_cents x milestone_pct). See calc draw_release_amount."
        default: 0
      - name: retainage_cents
        type: integer
        source: computed
        description: "Retainage withheld from this draw, subject to the cumulative cap. See calc draw_release_amount."
        default: 0
      - name: net_released_cents
        type: integer
        source: computed
        description: "Cash actually released = gross_amount_cents - retainage_cents. See calc draw_release_amount."
        default: 0

  - name: Warranty
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this warranty covers."
      - name: warranty_kind
        type: enum
        source: input
        description: "Which warranty this row represents."
        constraints: "one of {LIFETIME_MATERIAL, WORKMANSHIP}"
      - name: status
        type: enum
        source: system
        description: "Warranty lifecycle; activated only when project COMPLETED."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, VOID}"
      - name: workmanship_years
        type: integer
        source: input
        description: "Coverage term in years (WORKMANSHIP); LIFETIME_MATERIAL ignores this."
        default: 0

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this financing application funds."
      - name: client_id
        type: string
        source: input
        description: "FK -> HomeownerClient.id; the homeowner applying for financing."
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Loan principal requested in cents."
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: "Requested repayment term in months."
        constraints: "one of {60, 120, 180}"
      - name: status
        type: enum
        source: system
        description: "Financing decision lifecycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DECLINED}"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Amortized monthly payment at the term's APR tier. See calc financing_monthly_payment."
        default: 0
      - name: dti_ratio
        type: number
        source: computed
        description: "(monthly_debt_cents + monthly_payment_cents) / monthly_income; the financing DTI gate decides on this. See calc financing_dti."
        default: 0

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  # ---- Project: PARALLEL DIMENSIONS (workflow_status x compliance_status) ----
  - entity: Project
    initial_state: "workflow_status=DRAFT; compliance_status=PENDING_CLEARANCE"
    terminal_states: ["workflow_status=COMPLETED", "workflow_status=CANCELLED", "compliance_status=BLOCKED"]
    note: "Two independent axes evolve on the same row. workflow_status tracks build progress; compliance_status tracks permit/HOA clearance. Scheduling is gated on BOTH axes (see WorkSchedule PROPOSED->CONFIRMED)."
    transitions:
      # --- workflow axis ---
      - from: "workflow_status=DRAFT"
        to: "workflow_status=MEASURED"
        trigger: "POST /projects/{id}/measurements (first measurement recorded)"
        actor: Estimator
        preconditions: ["project workflow_status == DRAFT"]
        side_effects: ["set Project.workflow_status = MEASURED"]
      - from: "workflow_status=MEASURED"
        to: "workflow_status=ESTIMATED"
        trigger: "POST /estimates/{id}/baseline (an estimate becomes BASELINE)"
        actor: ProjectManager
        preconditions: ["project workflow_status == MEASURED", "estimate has >=1 EstimateLineItem", "no other BASELINE estimate exists for this project"]
        side_effects: ["set Estimate.status = BASELINE", "set Project.workflow_status = ESTIMATED", "recompute Project.contract_total_cents = estimate.estimate_total_cents", "create one PENDING Warranty per warranty_kind {LIFETIME_MATERIAL, WORKMANSHIP}"]
      - from: "workflow_status=ESTIMATED"
        to: "workflow_status=ORDERED"
        trigger: "POST /material-orders (first material order placed for the BASELINE estimate)"
        actor: ProjectManager
        preconditions: ["project workflow_status == ESTIMATED", "a BASELINE estimate exists"]
        side_effects: ["set Project.workflow_status = ORDERED", "compute MaterialOrder.ordered_sqft (calc material_order_qty)"]
      - from: "workflow_status=ORDERED"
        to: "workflow_status=SCHEDULED"
        trigger: "POST /work-schedules/{id}/confirm (first WorkSchedule confirmed)"
        actor: ProjectManager
        preconditions: ["project workflow_status == ORDERED", "project compliance_status == CLEARED", "the MaterialOrder for this project is DELIVERED"]
        side_effects: ["set WorkSchedule.status = CONFIRMED", "set Project.workflow_status = SCHEDULED"]
        note: "CROSS-ENTITY + parallel-axis gate: workflow advance requires compliance_status==CLEARED AND MaterialOrder DELIVERED."
      - from: "workflow_status=SCHEDULED"
        to: "workflow_status=IN_PROGRESS"
        trigger: "POST /work-schedules/{id}/start"
        actor: ProjectManager
        preconditions: ["project workflow_status == SCHEDULED", "the WorkSchedule is CONFIRMED"]
        side_effects: ["set Project.workflow_status = IN_PROGRESS"]
      - from: "workflow_status=IN_PROGRESS"
        to: "workflow_status=COMPLETED"
        trigger: "POST /projects/{id}/complete"
        actor: ProjectManager
        preconditions: ["project workflow_status == IN_PROGRESS", "every WorkSchedule for the project is in {COMPLETED, CANCELLED}", "every ProgressDraw for the project is in {RELEASED, REJECTED} (none REQUESTED or APPROVED)"]
        side_effects: ["set Project.workflow_status = COMPLETED", "activate all PENDING Warranty rows -> ACTIVE", "release residual retainage: set Project.amount_released_cents += Project.retainage_held_cents, set Project.retainage_held_cents = 0"]
        note: "Bubble-up compound gate: completion depends on all child WorkSchedule and ProgressDraw states."
      - from: "workflow_status IN {DRAFT, MEASURED, ESTIMATED, ORDERED, SCHEDULED}"
        to: "workflow_status=CANCELLED"
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["project workflow_status NOT IN {IN_PROGRESS, COMPLETED, CANCELLED}", "expected_project_version matches Project.version", "cancelled_reason provided"]
        side_effects: ["set Project.workflow_status = CANCELLED", "cascade: every non-terminal MaterialOrder (status IN {PLACED, CONFIRMED, BACKORDERED}) -> CANCELLED; that order's cancellation itself sets every PROPOSED/CONFIRMED WorkSchedule -> CANCELLED; each cancelled WorkSchedule in turn sets any REQUESTED/APPROVED ProgressDraw on it -> REJECTED", "void all PENDING Warranty rows -> VOID", "increments Project.version by 1"]
        note: "DEPTH-3 cascade: Project.cancel -> MaterialOrder.CANCELLED -> WorkSchedule.CANCELLED -> ProgressDraw.REJECTED."
      # --- compliance axis (independent) ---
      - from: "compliance_status=PENDING_CLEARANCE"
        to: "compliance_status=PERMIT_FILED"
        trigger: "POST /permits (a permit is filed for the project)"
        actor: ProjectManager
        preconditions: ["project compliance_status == PENDING_CLEARANCE"]
        side_effects: ["create Permit (status FILED)", "set Project.compliance_status = PERMIT_FILED"]
      - from: "compliance_status=PERMIT_FILED"
        to: "compliance_status=CLEARED"
        trigger: "POST /permits/{id}/issue (system re-evaluates compliance)"
        actor: ProjectManager
        preconditions: ["project compliance_status == PERMIT_FILED", "Permit.status == FILED", "if Project.hoa_required then an HOAApproval with status==APPROVED exists for the project"]
        side_effects: ["set Permit.status = ISSUED", "set Permit.permit_number", "set Project.compliance_status = CLEARED"]
        note: "CROSS-ENTITY: clearance depends on HOAApproval state when hoa_required."
      - from: "compliance_status IN {PENDING_CLEARANCE, PERMIT_FILED}"
        to: "compliance_status=BLOCKED"
        trigger: "POST /permits/{id}/reject OR POST /hoa-approvals/{id}/deny"
        actor: ProjectManager
        preconditions: ["project compliance_status IN {PENDING_CLEARANCE, PERMIT_FILED}"]
        side_effects: ["set the Permit.status = REJECTED or HOAApproval.status = DENIED", "set Project.compliance_status = BLOCKED"]

  # ---- ChangeOrder: CYCLIC (SUBMITTED <-> NEGOTIATING revision loop) ----
  - entity: ChangeOrder
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    note: "Cyclic negotiation: a change order may bounce SUBMITTED->NEGOTIATING->SUBMITTED any number of rounds before APPROVED/REJECTED."
    transitions:
      - from: SUBMITTED
        to: NEGOTIATING
        trigger: "POST /change-orders/{id}/negotiate"
        actor: HomeownerClient
        preconditions: ["ChangeOrder.status == SUBMITTED", "parent Project.workflow_status NOT IN {COMPLETED, CANCELLED}"]
        side_effects: ["set ChangeOrder.status = NEGOTIATING", "reset pm_approved=false and client_approved=false"]
        note: "CROSS-ENTITY: ChangeOrder transition guarded on parent Project workflow_status."
      - from: NEGOTIATING
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/revise (new delta_cents proposed)"
        actor: ProjectManager
        preconditions: ["ChangeOrder.status == NEGOTIATING"]
        side_effects: ["set ChangeOrder.status = SUBMITTED", "update ChangeOrder.delta_cents to revised value"]
        note: "Closes the revision cycle; loop may repeat."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/sign"
        actor: "ProjectManager | HomeownerClient"
        preconditions: ["ChangeOrder.status == SUBMITTED"]
        side_effects: ["set pm_approved=true (if actor ProjectManager) OR client_approved=true (if actor HomeownerClient)"]
        note: "Self-loop accumulating dual sign-off; does NOT change status."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: ProjectManager
        preconditions: ["ChangeOrder.status == SUBMITTED", "pm_approved == true", "client_approved == true", "parent Project.workflow_status NOT IN {COMPLETED, CANCELLED}", "expected_project_version matches Project.version"]
        side_effects: ["set ChangeOrder.status = APPROVED", "recompute Project.contract_total_cents (calc realized_contract_total: baseline + sum APPROVED delta)", "adjust the target EstimateLineItem.extended_cents by delta_cents (cross-aggregate)", "increments Project.version by 1"]
        note: "DEPTH-2 cascade origin: approve -> Project.contract_total_cents recompute -> (downstream draw gross changes on next draw request)."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: ProjectManager
        preconditions: ["ChangeOrder.status == SUBMITTED"]
        side_effects: ["set ChangeOrder.status = REJECTED"]
      - from: "SUBMITTED | NEGOTIATING"
        to: WITHDRAWN
        trigger: "POST /change-orders/{id}/withdraw"
        actor: HomeownerClient
        preconditions: ["ChangeOrder.status IN {SUBMITTED, NEGOTIATING}"]
        side_effects: ["set ChangeOrder.status = WITHDRAWN"]

  # ---- MaterialOrder: BRANCHING (CONFIRMED -> {DELIVERED, BACKORDERED}) ----
  - entity: MaterialOrder
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Branches at confirmation: a confirmed order either delivers directly or goes BACKORDERED, then later delivers."
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /material-orders/{id}/confirm"
        actor: ProjectManager
        preconditions: ["MaterialOrder.status == PLACED", "delivery_eta_iso provided"]
        side_effects: ["set MaterialOrder.status = CONFIRMED", "set delivery_eta_iso"]
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /material-orders/{id}/deliver"
        actor: ProjectManager
        preconditions: ["MaterialOrder.status == CONFIRMED", "current_clock >= delivery_eta_iso"]
        side_effects: ["set MaterialOrder.status = DELIVERED"]
        note: "TEMPORAL: delivery cannot be recorded before the promised ETA (clock-gated)."
      - from: CONFIRMED
        to: BACKORDERED
        trigger: "POST /material-orders/{id}/backorder"
        actor: ProjectManager
        preconditions: ["MaterialOrder.status == CONFIRMED"]
        side_effects: ["set MaterialOrder.status = BACKORDERED", "push delivery_eta_iso to revised date"]
      - from: BACKORDERED
        to: DELIVERED
        trigger: "POST /material-orders/{id}/deliver"
        actor: ProjectManager
        preconditions: ["MaterialOrder.status == BACKORDERED", "current_clock >= delivery_eta_iso"]
        side_effects: ["set MaterialOrder.status = DELIVERED"]
      - from: "PLACED | CONFIRMED | BACKORDERED"
        to: CANCELLED
        trigger: "POST /material-orders/{id}/cancel OR cascade from Project cancel"
        actor: "ProjectManager | system"
        preconditions: ["MaterialOrder.status IN {PLACED, CONFIRMED, BACKORDERED}"]
        side_effects: ["set MaterialOrder.status = CANCELLED", "cascade: every PROPOSED/CONFIRMED WorkSchedule for the project -> CANCELLED"]
        note: "Cascade hop 2 of the Project-cancel depth-3 chain."

  # ---- WorkSchedule: BRANCHING WITH WEATHER_HOLD revert ----
  - entity: WorkSchedule
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Confirmation is weather-gated; a confirmed window can revert to WEATHER_HOLD and back."
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /work-schedules/{id}/confirm"
        actor: ProjectManager
        preconditions: ["WorkSchedule.status == PROPOSED", "forecast_wind_mph <= assigned Crew.max_wind_mph", "no overlapping CONFIRMED WorkSchedule for the same crew_id (half-open [start,end) overlap, no buffer)", "no CONFIRMED WorkSchedule for the same project_id within a 24h-buffered closed interval (site sequencing)", "project compliance_status == CLEARED", "the project's MaterialOrder is DELIVERED"]
        side_effects: ["set WorkSchedule.status = CONFIRMED", "if Project.workflow_status == ORDERED then set Project.workflow_status = SCHEDULED"]
        note: "TWO temporal-overlap rules with different interval semantics: crew (half-open, no buffer) and project site (closed, +/-24h buffer). Plus weather threshold + cross-entity gates."
      - from: PROPOSED
        to: WEATHER_HOLD
        trigger: "POST /work-schedules/{id}/confirm when forecast_wind_mph > Crew.max_wind_mph"
        actor: ProjectManager
        preconditions: ["WorkSchedule.status == PROPOSED", "forecast_wind_mph > assigned Crew.max_wind_mph"]
        side_effects: ["set WorkSchedule.status = WEATHER_HOLD"]
        note: "THRESHOLD branch: confirm with too-high wind parks the window on weather hold instead of confirming."
      - from: WEATHER_HOLD
        to: CONFIRMED
        trigger: "POST /work-schedules/{id}/reweather (new lower forecast)"
        actor: ProjectManager
        preconditions: ["WorkSchedule.status == WEATHER_HOLD", "revised forecast_wind_mph <= assigned Crew.max_wind_mph", "no overlapping CONFIRMED WorkSchedule for the same crew_id (half-open)", "no CONFIRMED WorkSchedule for the same project_id within a 24h-buffered closed interval (site sequencing)", "project compliance_status == CLEARED", "the project's MaterialOrder is DELIVERED"]
        side_effects: ["update forecast_wind_mph", "set WorkSchedule.status = CONFIRMED"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /work-schedules/{id}/complete"
        actor: ProjectManager
        preconditions: ["WorkSchedule.status == CONFIRMED", "project workflow_status == IN_PROGRESS"]
        side_effects: ["set WorkSchedule.status = COMPLETED"]
      - from: "PROPOSED | CONFIRMED | WEATHER_HOLD"
        to: CANCELLED
        trigger: "POST /work-schedules/{id}/cancel OR cascade from MaterialOrder cancel"
        actor: "ProjectManager | system"
        preconditions: ["WorkSchedule.status IN {PROPOSED, CONFIRMED, WEATHER_HOLD}"]
        side_effects: ["set WorkSchedule.status = CANCELLED", "cascade: any ProgressDraw on this window in {REQUESTED, APPROVED} -> REJECTED", "free the crew/site occupancy this window held"]
        note: "Cascade hop 3 of the Project-cancel depth-3 chain. COMPENSATION of crew/site occupancy: confirm occupies the crew_id and project_id interval; cancel frees it. Conserved quantity CREW_OCCUPANCY: after confirm(A)+cancel(A), the set of CONFIRMED windows for that crew/project is identical to before A, so a previously-blocked overlapping window becomes confirmable again."

  # ---- ProgressDraw: BRANCHING WITH REVERT (RELEASED -> CLAWED_BACK) ----
  - entity: ProgressDraw
    initial_state: REQUESTED
    terminal_states: [REJECTED, CLAWED_BACK]
    note: "Release is segregation-of-duties gated. Released draws can be clawed back, which restores held cash/retainage (compensating action)."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /progress-draws/{id}/approve"
        actor: ProjectManager
        preconditions: ["ProgressDraw.status == REQUESTED", "the referenced WorkSchedule.status == COMPLETED", "project workflow_status == IN_PROGRESS"]
        side_effects: ["set ProgressDraw.status = APPROVED", "compute gross_amount_cents, retainage_cents, net_released_cents (calc draw_release_amount)"]
        note: "CROSS-ENTITY: draw approval depends on the WorkSchedule milestone being COMPLETED."
      - from: APPROVED
        to: RELEASED
        trigger: "POST /progress-draws/{id}/release"
        actor: FinanceOfficer
        preconditions: ["ProgressDraw.status == APPROVED", "actor is FinanceOfficer (NOT the ProjectManager who approved)", "expected_project_version matches Project.version"]
        side_effects: ["set ProgressDraw.status = RELEASED", "Project.amount_released_cents += net_released_cents", "Project.retainage_held_cents += retainage_cents", "increments Project.version by 1"]
        note: "SEGREGATION OF DUTIES + OCC on Project.version. Conserved-quantity invariant CASH: amount_released + retainage_held + sum(unreleased gross) preserved."
      - from: RELEASED
        to: CLAWED_BACK
        trigger: "POST /progress-draws/{id}/clawback"
        actor: FinanceOfficer
        preconditions: ["ProgressDraw.status == RELEASED", "expected_project_version matches Project.version"]
        side_effects: ["set ProgressDraw.status = CLAWED_BACK", "Project.amount_released_cents -= net_released_cents", "Project.retainage_held_cents -= retainage_cents", "increments Project.version by 1"]
        note: "COMPENSATION: exactly reverses the release side-effects; conserved CASH quantity unchanged after release+clawback."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /progress-draws/{id}/reject OR cascade from WorkSchedule cancel"
        actor: "ProjectManager | system"
        preconditions: ["ProgressDraw.status IN {REQUESTED, APPROVED}"]
        side_effects: ["set ProgressDraw.status = REJECTED"]

  # ---- FinancingApplication: BRANCHING (approve/decline) ----
  - entity: FinancingApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    note: "Single decision step gated on the DTI threshold."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{id}/decide (system computes DTI)"
        actor: FinanceOfficer
        preconditions: ["FinancingApplication.status == SUBMITTED", "computed dti_ratio <= DTI_MAX (0.43)", "requested_amount_cents <= Project.contract_total_cents"]
        side_effects: ["compute monthly_payment_cents (calc financing_monthly_payment) then dti_ratio (calc financing_dti)", "set FinancingApplication.status = APPROVED"]
        note: "THRESHOLD on dti_ratio (<= boundary)."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{id}/decide (system computes DTI)"
        actor: FinanceOfficer
        preconditions: ["FinancingApplication.status == SUBMITTED", "computed dti_ratio > DTI_MAX (0.43) OR requested_amount_cents > Project.contract_total_cents"]
        side_effects: ["compute monthly_payment_cents then dti_ratio", "set FinancingApplication.status = DECLINED"]

# ===========================================================================
# 1.2.1 Concurrency Rules (OCC on Project.version only)
# ===========================================================================
concurrency_rules:
  - rule_id: draw-release-stale-project
    parent_entity: Project
    write_endpoint: "POST /progress-draws/{id}/release"
    occ_field: "expected_project_version"
    description: |
      Releasing a ProgressDraw against a Project whose version has advanced
      since the FinanceOfficer last observed it is rejected as a stale-version
      write. This captures the case where a change order was just approved
      (legitimately advancing the contract total and Project.version) so the
      finance officer's view of the project — and therefore the cash figures
      they intend to release against — is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: changeorder-approve-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders/{id}/approve"
    occ_field: "expected_project_version"
    description: |
      Approving a ChangeOrder against a Project whose version has advanced
      since the ProjectManager last observed it is rejected as a stale-version
      write. Another change order may have already been approved (legitimately
      adjusting contract_total_cents and bumping Project.version), so this
      approver's view of the contract baseline is stale and must be refreshed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: net_siding_area
    trigger: "on POST /projects/{id}/measurements"
    algorithm: aggregation
    formula: |
      net_siding_sqft = max(gross_wall_sqft - opening_sqft, 0)
    input_set: "the single Measurement row being created"
    constants: {}
    precision: "store as number with 2 decimal places, round_half_up"
    variants: []

  - name: line_extended_amount
    trigger: "on POST /estimates/{id}/line-items and on ChangeOrder approve (adjusting target line)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs with conditional branch on scope_kind (non-linear interaction)
      if scope_kind == SIDING:
          effective_qty = quantity * (1 + estimate.waste_factor_pct)   # waste applies to siding only
      else:  # TRIM or WRAP
          effective_qty = quantity
      extended_cents = round_half_up(effective_qty * unit_price_cents)   # per-line rounding
    input_set: "the single EstimateLineItem being created or adjusted; estimate.waste_factor_pct read from parent Estimate"
    constants: {}
    precision: "round_half_up to whole cents, PER LINE (before any summation)"
    variants:
      - name: siding_with_waste
        when: "scope_kind == SIDING"
        difference: "multiplies quantity by (1 + waste_factor_pct) before pricing"
      - name: trim_wrap_no_waste
        when: "scope_kind IN {TRIM, WRAP}"
        difference: "no waste multiplier; effective_qty == quantity"

  - name: estimate_subtotal
    trigger: "on POST /estimates/{id}/line-items (recompute) and on /estimates/{id}/baseline"
    algorithm: aggregation
    formula: |
      line_subtotal_cents = sum(EstimateLineItem.extended_cents for items WHERE estimate_id == this estimate)
    input_set: "all EstimateLineItem rows whose estimate_id == this Estimate.id (no status filter; line items have no lifecycle)"
    constants: {}
    precision: "integer cents; inputs already per-line rounded"
    variants: []

  - name: estimate_total
    trigger: "on POST /estimates/{id}/line-items (recompute) and on /estimates/{id}/baseline"
    algorithm: aggregation
    formula: |
      # MODE (b): nested rounding ORDER pinned. Tax is computed on the ALREADY
      # per-line-rounded subtotal (round per-line THEN sum THEN tax), NOT on a
      # raw float sum. This is the canonical 'round-per-line-then-sum' order.
      line_subtotal_cents = sum(extended_cents)            # each extended already round_half_up per line
      tax_cents = round_half_up(line_subtotal_cents * SALES_TAX_RATE)
      estimate_total_cents = line_subtotal_cents + tax_cents
    input_set: "all EstimateLineItem rows on this estimate"
    constants:
      SALES_TAX_RATE: 0.0825
    precision: "round_half_up to whole cents; rounding order: per-line first (in line_extended_amount), then sum, then tax"
    variants: []

  - name: material_order_qty
    trigger: "on POST /material-orders (ORDERED transition)"
    algorithm: threshold
    formula: |
      base_net = Measurement.net_siding_sqft   # from the measurement linked to the BASELINE estimate
      ordered_sqft = ceil(base_net * (1 + estimate.waste_factor_pct))   # ceil to whole sqft, never partial panels
    input_set: "the BASELINE Estimate's measurement net_siding_sqft and waste_factor_pct"
    constants: {}
    precision: "ceil to integer sqft (no fractional panel orders)"
    variants: []

  - name: realized_contract_total
    trigger: "on /estimates/{id}/baseline and on /change-orders/{id}/approve"
    algorithm: aggregation
    formula: |
      # MODE (c): circular-looking dependency, evaluation order pinned.
      # contract_total depends on baseline + approved deltas; but each draw's
      # gross depends on contract_total. Order: (1) set baseline at /baseline,
      # (2) on each ChangeOrder approve, recompute contract_total BEFORE any
      # subsequent draw approval reads it. A draw approved earlier keeps its
      # frozen gross; only draws approved AFTER the change-order approval see
      # the new contract_total.
      contract_total_cents = baseline_estimate.estimate_total_cents
                            + sum(co.delta_cents for co in ChangeOrder
                                  WHERE co.project_id == this project AND co.status == APPROVED)
    input_set: "the BASELINE Estimate total plus every ChangeOrder with status==APPROVED on this project"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_looking_contract
        when: "computing the contract baseline used to price a NOT-YET-APPROVED draw"
        difference: "uses the live contract_total_cents at the moment of draw APPROVAL (includes change orders approved up to that instant)"
      - name: frozen_at_approval_contract
        when: "a draw already APPROVED before a later change order"
        difference: "the draw's gross_amount_cents stays frozen at its approval-time value; later change orders do NOT retroactively re-bill released/approved draws"

  - name: draw_release_amount
    trigger: "on /progress-draws/{id}/approve (compute) and read at /release"
    algorithm: waterfall_allocation
    formula: |
      # >=3 inputs, non-linear: retainage is capped cumulatively across the project.
      gross_amount_cents = round_half_up(contract_total_cents * milestone_pct)
      raw_retainage = round_half_up(gross_amount_cents * RETAINAGE_RATE)
      # Cumulative retainage cap: total retainage held across the project may
      # never exceed RETAINAGE_CAP_RATE of contract_total. Allocate only the
      # remaining headroom to this draw (waterfall: prior draws fill the cap first).
      cap_total = round_half_up(contract_total_cents * RETAINAGE_CAP_RATE)
      headroom = max(cap_total - Project.retainage_held_cents, 0)
      retainage_cents = min(raw_retainage, headroom)
      net_released_cents = gross_amount_cents - retainage_cents
    input_set: "contract_total_cents and milestone_pct on this draw; Project.retainage_held_cents for the cap headroom"
    constants:
      RETAINAGE_RATE: 0.10
      RETAINAGE_CAP_RATE: 0.05
    precision: "round_half_up to whole cents at each named step"
    variants:
      - name: under_cap
        when: "Project.retainage_held_cents + raw_retainage <= cap_total"
        difference: "full raw_retainage withheld; headroom not binding"
      - name: cap_binding
        when: "raw_retainage would push cumulative retainage past cap_total"
        difference: "only the remaining headroom is withheld; the rest is released as cash"

  - name: financing_monthly_payment
    trigger: "on /financing-applications/{id}/decide"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (principal, term, tier APR) with tiered-rate selection by term_months.
      monthly_rate = APR_BY_TERM[term_months] / 12
      n = term_months
      P = requested_amount_cents
      if monthly_rate == 0:
          monthly_payment_cents = ceil(P / n)
      else:
          monthly_payment_cents = ceil( P * monthly_rate * (1+monthly_rate)**n
                                         / ((1+monthly_rate)**n - 1) )
    input_set: "this FinancingApplication's requested_amount_cents and term_months"
    constants:
      APR_BY_TERM: { 60: 0.0599, 120: 0.0799, 180: 0.0999 }
    precision: "ceil to whole cents (lender rounds payment up)"
    variants: []

  - name: financing_dti
    trigger: "on /financing-applications/{id}/decide (after monthly_payment computed)"
    algorithm: threshold
    formula: |
      monthly_income = HomeownerClient.annual_income_cents / 12
      dti_ratio = (HomeownerClient.monthly_debt_cents + monthly_payment_cents) / monthly_income
      decision: APPROVED if dti_ratio <= DTI_MAX else DECLINED   # <= boundary
    input_set: "the applicant HomeownerClient's annual_income_cents and monthly_debt_cents, plus the computed monthly_payment_cents"
    constants:
      DTI_MAX: 0.43
    precision: "dti_ratio to 4 decimal places, round_half_up; threshold compare on rounded value"
    variants: []

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /clients/register, POST /staff/register and GET endpoints that are public"
  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "segregation of duties: the FinanceOfficer releasing a draw must not be the same StaffMember who approved it; on /progress-draws/{id}/release, X-User-ID != ProgressDraw.approved_by_staff_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /progress-draws/{id}/release"
  - priority: 4
    category: existence
    check: "all path-referenced resources exist (validated left-to-right in path) and all body FKs resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "request body required fields present and types valid (enum membership, numeric ranges)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is allowed (state-machine from-state check)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "uniqueness: at most one BASELINE Estimate per project; promoting a second to BASELINE is rejected"
    error_id: ERR_BASELINE_EXISTS
    http_status: 409
    applies_to: "POST /estimates/{id}/baseline"
  - priority: 8
    category: business_referential
    check: "an Estimate cannot become BASELINE with zero EstimateLineItem rows"
    error_id: ERR_EMPTY_ESTIMATE
    http_status: 422
    applies_to: "POST /estimates/{id}/baseline"
  - priority: 9
    category: business_safety
    check: "compliance gate: confirming a WorkSchedule requires Project.compliance_status == CLEARED"
    error_id: ERR_COMPLIANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /work-schedules/{id}/confirm, POST /work-schedules/{id}/reweather"
  - priority: 10
    category: business_referential
    check: "material gate: confirming a WorkSchedule requires the project's MaterialOrder.status == DELIVERED"
    error_id: ERR_MATERIAL_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /work-schedules/{id}/confirm, POST /work-schedules/{id}/reweather"
  - priority: 11
    category: business_safety
    check: "weather gate: a WorkSchedule whose forecast_wind_mph > assigned Crew.max_wind_mph cannot be CONFIRMED (goes WEATHER_HOLD instead); reweather with still-too-high wind is rejected"
    error_id: ERR_WIND_EXCEEDS_LIMIT
    http_status: 409
    applies_to: "POST /work-schedules/{id}/reweather"
  - priority: 12
    category: business_temporal
    check: "crew double-booking: a WorkSchedule cannot be CONFIRMED if its [window_start_iso, window_end_iso) HALF-OPEN interval overlaps another CONFIRMED window for the same crew_id (adjacency allowed: end==next start does NOT collide; no buffer)"
    error_id: ERR_CREW_OVERLAP
    http_status: 409
    applies_to: "POST /work-schedules/{id}/confirm, POST /work-schedules/{id}/reweather"
  - priority: 13
    category: business_temporal
    check: "site sequencing: a WorkSchedule cannot be CONFIRMED if its window, EXPANDED by SITE_BUFFER_HOURS=24 on each side and treated as a CLOSED interval, overlaps or touches another CONFIRMED window for the same project_id (only one trade crew on a single home site, with a mandatory 24h buffer between trades). Distinct interval semantics from crew overlap: closed endpoints + buffer, scoped to project_id rather than crew_id."
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /work-schedules/{id}/confirm, POST /work-schedules/{id}/reweather"
  - priority: 14
    category: business_temporal
    check: "material delivery cannot be recorded before its promised delivery_eta_iso (current logical clock < delivery_eta_iso)"
    error_id: ERR_DELIVERY_TOO_EARLY
    http_status: 409
    applies_to: "POST /material-orders/{id}/deliver"
  - priority: 15
    category: business_constraint
    check: "a ChangeOrder cannot be APPROVED unless both pm_approved and client_approved are true"
    error_id: ERR_DUAL_SIGNOFF_INCOMPLETE
    http_status: 409
    applies_to: "POST /change-orders/{id}/approve"
  - priority: 16
    category: business_constraint
    check: "a ProgressDraw cannot be APPROVED unless its referenced WorkSchedule.status == COMPLETED"
    error_id: ERR_MILESTONE_INCOMPLETE
    http_status: 409
    applies_to: "POST /progress-draws/{id}/approve"
  - priority: 17
    category: business_fiscal
    check: "financing DTI gate: dti_ratio > DTI_MAX (0.43) declines the application"
    error_id: ERR_DTI_EXCEEDED
    http_status: 422
    applies_to: "POST /financing-applications/{id}/decide"
  - priority: 18
    category: business_fiscal
    check: "financing principal gate: requested_amount_cents > Project.contract_total_cents declines the application"
    error_id: ERR_PRINCIPAL_EXCEEDS_CONTRACT
    http_status: 422
    applies_to: "POST /financing-applications/{id}/decide"
  - priority: 19
    category: business_fiscal
    check: "OCC: expected_project_version must equal current Project.version on draw release and change-order approve"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /progress-draws/{id}/release, POST /change-orders/{id}/approve"
  - priority: 20
    category: business_constraint
    check: "project completion requires all WorkSchedule in {COMPLETED, CANCELLED} and all ProgressDraw in {RELEASED, REJECTED}"
    error_id: ERR_OPEN_MILESTONES
    http_status: 409
    applies_to: "POST /projects/{id}/complete"
  - priority: 21
    category: business_constraint
    check: "cancellation requires a non-empty cancelled_reason and a non-terminal, non-IN_PROGRESS workflow_status"
    error_id: ERR_CANCEL_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /projects/{id}/cancel"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- identity / registration ----
  - method: POST
    path: "/clients/register"
    description: "Register a HomeownerClient. Public."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, annual_income_cents, monthly_debt_cents]
    output: HomeownerClient
    side_effects: ["create HomeownerClient"]
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a HomeownerClient."
    roles: [ProjectManager, FinanceOfficer, HomeownerClient]
    code: 200
    input: []
    output: HomeownerClient
    side_effects: []
  - method: POST
    path: "/staff/register"
    description: "Register a StaffMember with a role_code. Public bootstrap."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, role_code]
    output: StaffMember
    side_effects: ["create StaffMember"]
  - method: GET
    path: "/staff/{id}"
    description: "Fetch a StaffMember."
    roles: [ProjectManager, FinanceOfficer, Estimator]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # ---- project ----
  - method: POST
    path: "/projects"
    description: "Create a remodel Project (workflow_status=DRAFT, compliance_status=PENDING_CLEARANCE)."
    roles: [ProjectManager]
    code: 201
    input: [client_id, project_manager_id, property_address, "hoa_required?"]
    output: Project
    side_effects: ["create Project at DRAFT/PENDING_CLEARANCE"]
  - method: GET
    path: "/projects"
    description: "List projects (paginated). Reverse-reachability for Project.client_id and Project.project_manager_id."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: ["client_id?", "project_manager_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a Project including both status axes and computed cash fields."
    roles: [ProjectManager, FinanceOfficer, HomeownerClient]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/complete"
    description: "Mark project COMPLETED; activates warranties and releases residual retainage."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["workflow_status -> COMPLETED", "PENDING Warranty -> ACTIVE", "release residual retainage into amount_released_cents"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project; depth-3 cascade through material orders, schedules, draws. OCC-guarded."
    roles: [ProjectManager]
    code: 200
    input: [cancelled_reason, expected_project_version]
    output: Project
    side_effects: ["workflow_status -> CANCELLED", "cascade MaterialOrder->CANCELLED->WorkSchedule->CANCELLED->ProgressDraw->REJECTED", "PENDING Warranty -> VOID", "increments Project.version by 1"]

  # ---- measurement ----
  - method: POST
    path: "/projects/{id}/measurements"
    description: "Record an on-site measurement; computes net_siding_sqft and advances DRAFT->MEASURED."
    roles: [Estimator]
    code: 201
    input: [estimator_id, gross_wall_sqft, opening_sqft, linear_trim_ft, color_code]
    output: Measurement
    side_effects: ["compute net_siding_sqft", "if project DRAFT -> MEASURED"]
  - method: GET
    path: "/measurements/{id}"
    description: "Fetch a Measurement."
    roles: [ProjectManager, FinanceOfficer, Estimator]
    code: 200
    input: []
    output: Measurement
    side_effects: []
  - method: GET
    path: "/measurements"
    description: "List measurements. Reverse-reachability for Measurement.project_id and Measurement.estimator_id."
    roles: [ProjectManager, FinanceOfficer, Estimator]
    code: 200
    input: ["project_id?", "estimator_id?", "limit?", "offset?"]
    output: Measurement[]
    side_effects: []

  # ---- estimate + line items ----
  - method: POST
    path: "/estimates"
