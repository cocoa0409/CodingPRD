              as: AreaDirector
              captures: { agr_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { agr_v: $.data.version }
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol2_id}", classroom_label: "Room 8", teacher_email: "t8@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
