        grounds: "§1.4 priority 18 ERR_UNIT_NOT_ELIGIBLE (409) 'the unit's eligibility_status is PENDING, INELIGIBLE or INDETERMINATE when reservation, listing or release is attempted'; §1.2 the nightly-run screening-expiry cascade sets eligibility_status INDETERMINATE with reason SCREENING_EXPIRED."
        distinguishing_aspect: "Eligibility is revoked by the batch rather than by a human decision, and the refusal lands at reservation time — an endpoint that priority 13 explicitly does NOT cover — so ERR_UNIT_NOT_ELIGIBLE cannot be shadowed by ERR_MATERNAL_SCREENING_INCOMPLETE even though the underlying screening is exactly what lapsed."
