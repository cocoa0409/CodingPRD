        test_recipe:
          setup: ["host ACTIVE with waiver; hive installed; removal job REQUESTED"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Dup Rem", email: "duprem@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "25 Rem St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
