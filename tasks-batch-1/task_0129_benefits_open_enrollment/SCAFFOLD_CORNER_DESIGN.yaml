              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 0, employer_contribution_pct: 0.0, rate_per_1000_monthly_cents: 25 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_amount_cents: 30000000, coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-eoi"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /eoi-requests?enrollment_id=${enr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { eoi_id: $.data.0.id }
          trigger:
            - call: "POST /eoi-requests/${eoi_id}/decide"
              payload: { decision: "DENIED" }
              as: ComplianceOfficer
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { st: $.data.status }
            - call: "GET /carrier-feed-records?enrollment_id=${enr_id}"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "Enrollment.${enr_id}.status == DRAFT (reverted)"
            - "Zero CarrierFeedRecord rows exist for ${enr_id} (no ADD emitted on denial)"

      - name: rate_threshold_aca_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.compute_aca_affordability]
        excluded_because:
          difficulty_instance: "boundary_precision_check / aca_affordability_at_threshold_is_affordable"
          rationale: "The affordability threshold boundary (<=) is the named §1.8 boundary instance."

      - name: derived_field_per_paycheck_recompute_on_activate
        claim_type: derived_field_reconciliation
        grounds: [entities.Enrollment.per_paycheck_deduction_cents]
        excluded_because:
          difficulty_instance: "combinatorial_formula / per_paycheck_deduction_tier_and_schedule_branch"
          rationale: "Derived per_paycheck_deduction_cents recompute on activate is asserted in the named §1.8 combinatorial instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_costs_in_activate_response
        claim_type: immediate
        grounds: [entities.Enrollment.monthly_employee_cost_cents, state_machines.Enrollment.DRAFT_to_ACTIVE]
        excluded_because:
          difficulty_instance: "combinatorial_formula / per_paycheck_deduction_tier_and_schedule_branch"
          rationale: "Computed cost fields are present in the same activate response (immediate consistency) — verified by the named §1.8 instance which captures them from the activate response."
