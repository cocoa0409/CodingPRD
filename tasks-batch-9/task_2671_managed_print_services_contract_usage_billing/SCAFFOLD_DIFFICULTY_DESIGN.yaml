  - rule_id: transitive_cascade
    instances:
      - name: read_acceptance_cascades_to_device_counters_auto_order_and_site_commitment
        grounds:
          - state_machines.MeterRead.PENDING_VALIDATION_to_ACCEPTED
          - state_machines.Device.SUPPLY_OK_to_SUPPLY_LOW
          - state_machines.Device.SUPPLY_LOW_to_SUPPLY_ORDERED
          - calculations.consumable_waste_flag
          - entities.Site.fields.open_toner_units
          - entities.ServiceContract.fields.consumables_committed_cents
        distinguishing_aspect: |
          Depth-4 chain from a single meter-read intake: hop 1 accepts the read, hop 2 writes the device's
          watermarks and toner_level_pct 12, hop 3 is caused by that toner write (SUPPLY_OK -> SUPPLY_LOW ->
          SUPPLY_ORDERED, minting an AUTO_THRESHOLD ConsumableOrder), hop 4 is caused by that order's
          creation (Site.open_toner_units 0 -> 1 and ServiceContract.consumables_committed_cents 0 -> 8900).
