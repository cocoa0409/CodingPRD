scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: autopsy_estimate_vs_final_diverge_on_exam
        grounds:
          - calculations.autopsy_fee_estimate
          - calculations.autopsy_fee_final
          - state_machines.AutopsyExam.SCHEDULED_to_COMPLETED
          - entities.AutopsyExam.fields.estimated_fee_cents
          - entities.AutopsyExam.fields.final_fee_cents
        distinguishing_aspect: |
          On the AutopsyExam entity, estimated_fee_cents (forward_looking, no specimen add-on)
          and final_fee_cents (chronological, +2 billable specimens) diverge for identical
          scheduled inputs: 230000 vs 240000.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z; NATURAL case ACCEPTED then INVESTIGATING with one body."
            - "AutopsyExam scheduled_for 2026-05-10T00:00:00Z, duration 120 min -> estimated_fee_cents 230000."
            - "Two specimens collected from the body and both SENT_TO_LAB before completion."
            - "Complete the exam at clock 2026-05-10T00:00:00Z (elapsed 0) -> final_fee_cents 240000."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv A", badge_no: "B-1" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "Path A", license_no: "L-1", is_medical_examiner: false }
              as: Admin
              captures: { path_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Admin
            - call: "POST /cases"
              payload: { decedent_name: "Doe", reported_death_at: "2026-05-09T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-1" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /cases/${case_id}/autopsy-exams"
              payload: { pathologist_user_id: "${path_id}", scheduled_for: "2026-05-10T00:00:00Z", duration_minutes: 120 }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { exam_id: $.data.id, est_fee: $.data.estimated_fee_cents }
            - call: "POST /bodies/${body_id}/specimens"
              payload: { specimen_type: "BLOOD" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { spec1_id: $.data.id }
            - call: "POST /bodies/${body_id}/specimens"
              payload: { specimen_type: "URINE" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { spec2_id: $.data.id }
            - call: "POST /specimens/${spec1_id}/send-to-lab"
              payload: {}
              as: Pathologist
              as_user_id: "${path_id}"
            - call: "POST /specimens/${spec2_id}/send-to-lab"
              payload: {}
              as: Pathologist
              as_user_id: "${path_id}"
          trigger:
            - call: "POST /autopsy-exams/${exam_id}/complete"
              payload: { primary_finding: "cardiac", cause_of_death: "MI" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { final_fee: $.data.final_fee_cents }
          assert:
            - "AutopsyExam.${exam_id}.estimated_fee_cents == 230000"
            - "AutopsyExam.${exam_id}.final_fee_cents == 240000"
            - "AutopsyExam.${exam_id}.final_fee_cents != AutopsyExam.${exam_id}.estimated_fee_cents"

      - name: indigent_payable_estate_offset_variant
        grounds:
          - calculations.indigent_county_payable
          - state_machines.IndigentDisposition.DECLARED_to_APPROVED
          - entities.IndigentDisposition.fields.county_payable_cents
          - entities.PropertyItem.fields.valuation_cents
        distinguishing_aspect: |
          On the IndigentDisposition entity (different domain from AutopsyExam), the estate-offset
          variant lowers county_payable_cents to 350000 when 150000 of HELD property offsets a
          500000 itemized cost under a 400000 allowance, vs 400000 with no estate.
        test_recipe:
          setup:
            - "NATURAL case ACCEPTED then INVESTIGATING with a body; no verified next-of-kin."
            - "One HELD PropertyItem valued 150000; certificate signed so case CERTIFIED (indigent still declarable independently)."
            - "IndigentDisposition declared with statutory_allowance_cents 400000, itemized_cost_cents 500000."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv B", badge_no: "B-2" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME B", license_no: "L-2", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Unknown", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-2" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "watch", valuation_cents: 150000 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/indigent-disposition"
              payload: { statutory_allowance_cents: 400000, itemized_cost_cents: 500000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /indigent-dispositions/${disp_id}/approve"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { payable: $.data.county_payable_cents }
          assert:
            - "IndigentDisposition.${disp_id}.county_payable_cents == 350000"
            - "IndigentDisposition.${disp_id}.disposition_status == APPROVED"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: autopsy_final_nonlinear_max_ceil_conditional
        grounds:
          - calculations.autopsy_fee_final
          - state_machines.AutopsyExam.SCHEDULED_to_COMPLETED
          - entities.AutopsyExam.fields.final_fee_cents
        distinguishing_aspect: |
          Mode (a): final_fee combines >=3 inputs with non-linear interaction — max(elapsed,duration),
          ceil into 30-min blocks, per-specimen add-on, and a conditional HOMICIDE *1.5 multiplier
          applied AFTER the add-on; HOMICIDE exam 90 min completed 150 min late with 0 specimens = 375000.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z; HOMICIDE case INVESTIGATING with a body."
            - "AutopsyExam scheduled_for 2026-05-10T00:00:00Z, duration 90 min."
            - "Advance clock to 2026-05-10T02:30:00Z (150 min elapsed); no billable specimens."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv C", badge_no: "B-3" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "Path C", license_no: "L-3", is_medical_examiner: false }
              as: Admin
              captures: { path_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Admin
            - call: "POST /cases"
              payload: { decedent_name: "Vic", reported_death_at: "2026-05-09T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "HOMICIDE" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-3" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/autopsy-exams"
              payload: { pathologist_user_id: "${path_id}", scheduled_for: "2026-05-10T00:00:00Z", duration_minutes: 90 }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T02:30:00Z" }
              as: Admin
          trigger:
            - call: "POST /autopsy-exams/${exam_id}/complete"
              payload: { primary_finding: "gsw", cause_of_death: "gunshot" }
              as: Pathologist
              as_user_id: "${path_id}"
          assert:
            - "AutopsyExam.${exam_id}.final_fee_cents == 375000"

      - name: indigent_payable_pinned_evaluation_order
        grounds:
          - calculations.indigent_county_payable
          - state_machines.IndigentDisposition.DECLARED_to_APPROVED
          - entities.IndigentDisposition.fields.county_payable_cents
        distinguishing_aspect: |
          Mode (c): pinned evaluation order — estate offset MUST apply before the statutory cap.
          With itemized 300000, allowance 400000, estate 350000: estate-first yields max(300000-350000,0)=0
          then min(0,400000)=0; cap-first would wrongly yield 300000. Result 0 pins order.
        test_recipe:
          setup:
            - "NATURAL case INVESTIGATING with a body, no verified kin."
            - "One HELD PropertyItem valued 350000."
            - "IndigentDisposition declared: statutory_allowance_cents 400000, itemized_cost_cents 300000."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv D", badge_no: "B-4" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME D", license_no: "L-4", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Unknown2", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-4" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "ring", valuation_cents: 350000 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/indigent-disposition"
              payload: { statutory_allowance_cents: 400000, itemized_cost_cents: 300000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /indigent-dispositions/${disp_id}/approve"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
          assert:
            - "IndigentDisposition.${disp_id}.county_payable_cents == 0"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tox_screen_amend_loop
        grounds:
          - state_machines.ToxScreen.RESULTED_to_AMENDED
          - state_machines.ToxScreen.AMENDED_to_AMENDED
          - entities.ToxScreen.fields.result_status
          - entities.ToxScreen.fields.interpretation
        distinguishing_aspect: |
          ToxScreen is cyclic: RESULTED->AMENDED then AMENDED->AMENDED (self-loop). Re-amending an
          already AMENDED screen from 90 to 40 mg/dL recomputes interpretation POSITIVE->NEGATIVE and
          keeps result_status == AMENDED.
        test_recipe:
          setup:
            - "A specimen SENT_TO_LAB with a ToxScreen ORDERED, then RESULTED at ethanol 90 (POSITIVE), then AMENDED to 85 (POSITIVE)."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv E", badge_no: "B-5" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "Path E", license_no: "L-5" }
              as: Admin
              captures: { path_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe E", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-5" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/specimens"
              payload: { specimen_type: "BLOOD" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /specimens/${spec_id}/send-to-lab"
              payload: {}
              as: Pathologist
              as_user_id: "${path_id}"
            - call: "POST /specimens/${spec_id}/tox-screens"
              payload: { panel: "BASIC" }
              as: LabTech
              captures: { tox_id: $.data.id }
            - call: "POST /tox-screens/${tox_id}/result"
              payload: { ethanol_mg_dl: 90 }
              as: LabTech
            - call: "POST /tox-screens/${tox_id}/amend"
              payload: { ethanol_mg_dl: 85 }
              as: LabTech
          trigger:
            - call: "POST /tox-screens/${tox_id}/amend"
              payload: { ethanol_mg_dl: 40 }
              as: LabTech
          assert:
            - "ToxScreen.${tox_id}.result_status == AMENDED"
            - "ToxScreen.${tox_id}.interpretation == NEGATIVE"
            - "ToxScreen.${tox_id}.ethanol_mg_dl == 40"

      - name: certificate_branch_draft_to_signed_and_void
        grounds:
          - state_machines.DeathCertificate.DRAFT_to_SIGNED
          - state_machines.DeathCertificate.DRAFT_to_VOID
          - state_machines.DeathCertificate.SIGNED_to_AMENDED
          - entities.DeathCertificate.fields.cert_status
        distinguishing_aspect: |
          DeathCertificate (different entity from ToxScreen) branches from DRAFT to {SIGNED, VOID}
          with divergent side-effects, and SIGNED loops to AMENDED. Voiding a DRAFT cert reaches the
          VOID terminal and never cascades the Case to CERTIFIED.
        test_recipe:
          setup:
            - "NATURAL case INVESTIGATING with a body; DeathCertificate drafted (DRAFT)."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv F", badge_no: "B-6" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME F", license_no: "L-6", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe F", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-6" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/death-certificate"
              payload: { cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /death-certificates/${cert_id}/void"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
          assert:
            - "DeathCertificate.${cert_id}.cert_status == VOID"
            - "Case.${case_id}.status == INVESTIGATING"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sign_cert_cascades_case_certified_then_body_unblocked
        grounds:
          - state_machines.DeathCertificate.DRAFT_to_SIGNED
          - state_machines.Case.INVESTIGATING_to_CERTIFIED
          - entities.Case.fields.status
          - entities.Body.fields.release_blocked
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger: sign -> DeathCertificate SIGNED (link1) -> that
          SIGNED status cascades Case INVESTIGATING->CERTIFIED (link2) -> the CERTIFIED case clears the
          STORED Body's release_blocked (link3), each link caused by the previous.
        test_recipe:
          setup:
            - "NATURAL case INVESTIGATING with a body STORED in a cooler (release_blocked=true); DeathCertificate DRAFT; no autopsy required."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv G", badge_no: "B-7" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME G", license_no: "L-7", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cooler-units"
              payload: { label: "COOLER-G", slot_capacity: 2 }
              as: Admin
              captures: { cooler_id: $.data.id, cooler_v: $.data.version }
            - call: "POST /cases"
              payload: { decedent_name: "Doe G", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-7" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/store"
              payload: { cooler_unit_id: "${cooler_id}", expected_cooler_version: "${cooler_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/death-certificate"
              payload: { cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { cert_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /death-certificates/${cert_id}/sign"
              payload: { expected_case_version: "${case_v2}" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
          assert:
            - "DeathCertificate.${cert_id}.cert_status == SIGNED"
            - "Case.${case_id}.status == CERTIFIED"
            - "Body.${body_id}.release_blocked == false"

      - name: tox_result_cascades_specimen_consumed
        grounds:
          - state_machines.ToxScreen.ORDERED_to_RESULTED
          - state_machines.Specimen.SENT_TO_LAB_to_CONSUMED
          - entities.Specimen.fields.chain_status
          - entities.ToxScreen.fields.result_status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than the sign chain: result -> ToxScreen RESULTED
          (link1) -> that resulting cascades the parent Specimen SENT_TO_LAB->CONSUMED (link2).
        test_recipe:
          setup:
            - "A specimen SENT_TO_LAB with a ToxScreen ORDERED (panel BASIC)."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv H", badge_no: "B-8" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "Path H", license_no: "L-8" }
              as: Admin
              captures: { path_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe H", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-8" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/specimens"
              payload: { specimen_type: "BLOOD" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /specimens/${spec_id}/send-to-lab"
              payload: {}
              as: Pathologist
              as_user_id: "${path_id}"
            - call: "POST /specimens/${spec_id}/tox-screens"
              payload: { panel: "BASIC" }
              as: LabTech
              captures: { tox_id: $.data.id }
          trigger:
            - call: "POST /tox-screens/${tox_id}/result"
              payload: { ethanol_mg_dl: 10 }
              as: LabTech
          assert:
            - "ToxScreen.${tox_id}.result_status == RESULTED"
            - "Specimen.${spec_id}.chain_status == CONSUMED"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sign_segregation_beats_manner_inconsistent
        grounds:
          - validations[priority=12]
          - validations[priority=23]
          - errors[ERR_SEGREGATION_VIOLATION]
          - errors[ERR_MANNER_INCONSISTENT]
        distinguishing_aspect: |
          business_safety (priority 12 segregation) vs business_referential (priority 23 manner)
          conflict: an ME who both performed the autopsy AND asserts a manner inconsistent with the
          HOMICIDE case gets ERR_SEGREGATION_VIOLATION (403), not ERR_MANNER_INCONSISTENT.
        test_recipe:
          setup:
            - "HOMICIDE case INVESTIGATING with body; autopsy COMPLETED by ME who also holds is_medical_examiner."
            - "DeathCertificate DRAFT asserting manner NATURAL (inconsistent with HOMICIDE)."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv I", badge_no: "B-9" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME I", license_no: "L-9", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
