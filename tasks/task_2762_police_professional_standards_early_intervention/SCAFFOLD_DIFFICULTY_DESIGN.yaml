            - "GET /appeals/${ap2_id}/reinstatements returns 1 PENDING row with reversed_days 24 and GET /appeals/${ap1_id}/reinstatements returns 1 PENDING row with reversed_days 30"

      - name: open_case_load_is_conserved_across_assignment_reassignment_void_and_close
        grounds:
          - entities.Officer.fields.open_case_load
          - endpoints["POST /investigations/{id}/assignments"]
          - state_machines.Complaint.UNDER_INVESTIGATION_to_WITHDRAWN
          - state_machines.Investigation.PENDING_REVIEW_to_CLOSED
          - endpoints["POST /investigations/{id}/close"]
        distinguishing_aspect: |
          Every path that ends an assignment moves exactly one unit of caseload: reassignment
          decrements the old holder and increments the new one in the same request, a withdrawal
          cascade that voids the investigation decrements whoever holds it at that moment, and a
          normal close decrements once, so the sum of open_case_load over all officers equals the
          number of non-terminal investigations after every step and returns to 0.
        test_recipe:
          setup:
            - "Two CLASS_II complaints each carry one offense_class C allegation against Officer Vance, and both investigations are assigned to Investigator Ahn, giving him open_case_load 2."
            - "Investigator Bly sits in the Internal Affairs unit with certification_level 3 and open_case_load 0, so he is a legal reassignment target."
            - "The second investigation already has a SCHEDULED session for 2026-08-05T09:00:00Z so it can be carried all the way to closure."
            - "The logical clock stands at 2026-08-01T00:00:00Z at the start of the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
