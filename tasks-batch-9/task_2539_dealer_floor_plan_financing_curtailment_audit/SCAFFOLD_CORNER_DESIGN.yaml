  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_x_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
          - endpoints["GET /floorplan/dealers/{id}"]
        distinguishing_aspect: "The auth gate is priority 10, so a request that omits X-User-ID entirely returns 401 ERR_UNAUTHENTICATED before the dealer even has to exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Auth Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "PA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c28_d: "$.data.id" }
          trigger:
            - call: "GET /floorplan/dealers/${c28_d}"
              payload: {}
              as: CreditOfficer
              captures: { c28_err: "$.data.error_id" }
          assert:
            - "the request is sent with an X-User-Role header of CreditOfficer and NO X-User-ID header"
            - "HTTP status is 401 and ${c28_err} == \"ERR_UNAUTHENTICATED\""
            - "the body is the error envelope with response_type \"error\" and a non-empty data.message"
            - "the same GET with both headers present returns 200"

      - name: unrecognized_role_header_is_rejected_before_authorization
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Only the six declared roles exist, so a plausible-sounding role such as FloorManager fails the priority-10 header check with 401 ERR_UNAUTHENTICATED rather than the priority-20 authorization check with 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Bad Role Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "PA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c29_d: "$.data.id" }
          trigger:
            - call: "GET /floorplan/dealers/${c29_d}"
              payload: {}
              as: FloorManager
              as_user_id: "u-fm-1"
              captures: { c29_err: "$.data.error_id" }
          assert:
            - "HTTP status is 401 and ${c29_err} == \"ERR_UNAUTHENTICATED\", not 403 ERR_UNAUTHORIZED"
            - "no row of any entity is created or mutated by the rejected request"
            - "Dealer.${c29_d}.version is still 1"

      - name: dealer_principal_reading_another_dealers_record_is_forbidden
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors.ERR_DEALER_SCOPE_VIOLATION
          - roles.DealerPrincipal
        distinguishing_aspect: "DealerPrincipal identity is entity-backed, so the scope rule at priority 30 blocks even a plain GET of a sibling dealer with 403 ERR_DEALER_SCOPE_VIOLATION, distinct from the priority-20 role error."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two Dealers exist, dealer A and dealer B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Scope Read A LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "NY" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c30_da: "$.data.id" }
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Scope Read B LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "NY" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c30_db: "$.data.id" }
          trigger:
            - call: "GET /floorplan/dealers/${c30_db}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${c30_da}"
              captures: { c30_err: "$.data.error_id" }
          assert:
            - "HTTP status is 403 and ${c30_err} == \"ERR_DEALER_SCOPE_VIOLATION\""
            - "the same call with as_user_id ${c30_db} returns 200 with data.id == ${c30_db}"
            - "GET /floorplan/dealers/${c30_da} as DealerPrincipal ${c30_da} also returns 200 - the rule is scope, not role"

