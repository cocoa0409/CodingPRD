  - section: state_machines
    instances:

      - name: defect_determination_moves_campaign_from_draft_to_defect_determined
        claim_type: valid_transition
        grounds:
          - state_machines.RecallCampaign.campaign_status.DRAFT_to_DEFECT_DETERMINED
          - entities.RecallCampaign.fields.determined_by_user_id
        distinguishing_aspect: |
          The declared entry transition on the campaign_status dimension: DRAFT -> DEFECT_DETERMINED
          records the determining user for later segregation-of-duties enforcement and leaves the
          independent remedy_status dimension untouched at REMEDY_UNDER_DEVELOPMENT.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-200 exists; clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-200", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z", risk_severity: "HIGH" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          assert:
            - "HTTP status is 200"
            - "response.data.campaign_status == \"DEFECT_DETERMINED\""
            - "response.data.remedy_status == \"REMEDY_UNDER_DEVELOPMENT\""
            - "response.data.risk_severity == \"HIGH\""
            - "response.data.defect_determination_date == \"2026-08-03T09:00:00Z\""
            - "response.data.determined_by_user_id == \"u-eng-1\""

      - name: second_defect_determination_from_filed_returns_invalid_campaign_state
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_CAMPAIGN_STATE]
          - state_machines.RecallCampaign.campaign_status.DRAFT_to_DEFECT_DETERMINED
        distinguishing_aspect: |
          DRAFT is the only legal source state for defect-determination; once the Part 573 notice is
          filed the campaign is FILED, so re-determining must fail 409 ERR_INVALID_CAMPAIGN_STATE and
          must NOT overwrite defect_determination_date or recompute filing_deadline_utc.
        test_recipe:
          setup:
            - "Campaign 26V-201 determined 2026-08-03T09:00:00Z and DEFECT_NOTICE filed by u-comp-1, so campaign_status is FILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-201", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-201" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-05T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == \"ERR_INVALID_CAMPAIGN_STATE\""
            - "GET /recall-campaigns/${camp_id} still shows campaign_status == \"FILED\", defect_determination_date == \"2026-08-03T09:00:00Z\" and filing_deadline_utc == \"2026-08-10T23:59:59Z\""

      - name: interim_advisory_places_stop_sale_hold_on_dealer_stock_vehicle
        claim_type: side_effect_execution
        grounds:
          - state_machines.RecallCampaign.campaign_status.FILED_to_INTERIM_NOTIFIED
          - entities.Vehicle.fields.stop_sale_hold
          - endpoints[POST /recall-campaigns/{id}/interim-advisory]
        distinguishing_aspect: |
          The interim notice does more than move campaign_status: its side effect reaches across the
          aggregate boundary and stamps stop_sale_hold on the underlying Vehicle rows that are still
          in dealer inventory, which is what later blocks the retail sale.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-202 with one IN_DEALER_STOCK NE build record matched into the population; remedy is still under development."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-202", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
