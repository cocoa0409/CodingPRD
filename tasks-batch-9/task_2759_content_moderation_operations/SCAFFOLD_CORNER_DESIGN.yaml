        grounds:
          - validations[priority=52]
        excluded_because:
          difficulty_instance: exposure_cap_exactly_at_limit_allows_assignment
          rationale: "Individually legal assignments that collectively reach the daily exposure cap are asserted there, including the <= boundary that makes the last one legal."
      - name: cross_entity_validation_covered_by_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=64]
        excluded_because:
          difficulty_instance: publish_blocked_by_open_appeal_in_period
          rationale: "Report publication validity depends on the state of Appeal rows in a different aggregate, and that instance tests both the blocked and the permitted configuration."

  - section: endpoints
