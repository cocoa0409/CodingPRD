  - name: success_and_error_responses_share_the_meta_envelope
    claim_type: standard_crud
    grounds:
    - response_envelope
    - endpoints[GET /customer-programs/{id}]
    - errors[ERR_PROGRAM_NOT_FOUND]
    distinguishing_aspect: 'Every response carries meta.api_request_id and meta.api_request_timestamp: the successful
      single read answers response_type object with the row under data, while the failing read of an unknown id
      keeps the same meta block but switches response_type to error and puts error_id and message under data.'
    test_recipe:
      setup:
      - One INDUSTRIAL program PGM-1 exists; no program carries the unknown id used in the follow-up read.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      trigger:
      - call: GET /customer-programs/${prog_id}
        payload: {}
        as: PlantAdmin
      assert:
      - HTTP 200
      - response_type == 'object'
      - meta.api_request_id is a non-empty string
      - meta.api_request_timestamp is an ISO8601 string
      - data.id == ${prog_id}
      - data.program_code == 'PGM-1'
      - data.delivery_posture == 'BLOCKED'
      - a follow-up GET /customer-programs/11111111-1111-4111-8111-111111111111 as PlantAdmin answers HTTP 404
        with response_type 'error', data.error_id == 'ERR_PROGRAM_NOT_FOUND' and a non-empty data.message, and
        still carries meta.api_request_id
