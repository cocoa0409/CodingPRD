            - "SPEC1 (SHIC-1.0, SB1) DRAFT with LIGHTING CORE_ONOFF (MANDATORY 20); SPEC2 (SHIC-2.0, SB1) RATIFIED with LIGHTING CORE_ONOFF (MANDATORY 20)."
