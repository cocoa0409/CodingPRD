              as: CrematoryOperator
              captures: { a1: $.data.id }
            - call: "POST /cases/${a1}/memorial-addons"
              payload: { addon_type: "VIEWING_SESSION", viewing_room_code: "ROOM-1", viewing_start: "2026-03-17T10:00:00Z", viewing_end: "2026-03-17T11:00:00Z" }
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "A2", species: "DOG", weight_lbs: 20, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /cases/${a2}/memorial-addons"
              payload: { addon_type: "VIEWING_SESSION", viewing_room_code: "ROOM-1", viewing_start: "2026-03-17T11:15:00Z", viewing_end: "2026-03-17T12:00:00Z" }
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VIEWING_ROOM_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_cooler_slots_conserved
        grounds:
          - calculations.cooler_occupancy
          - state_machines.Case.RECEIVED_to_IN_COOLER
          - state_machines.Case.INTAKE_PENDING_to_CANCELLED
        distinguishing_aspect: >
          Conserved quantity = cooler physical slots: occupied_count + available_capacity ==
          total_capacity holds before and after a store followed by its compensating release
          (case cancel), with available_capacity restored to total_capacity.
        test_recipe:
          setup:
            - "Clock 2026-03-18T00:00:00Z; cooler cap=2; a RECEIVED case stored then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-18T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /coolers"
              payload: { label: "CO-INV", total_capacity: 2 }
              as: CrematoryAdmin
              captures: { cooler_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner IV", email: "owneriv@x.com", phone: "555-0017" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Iv", species: "CAT", weight_lbs: 10, service_type: "PRIVATE", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "V", driver_name: "T" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/store"
              payload: { cooler_id: "${cooler_id}" }
              as: CrematoryOperator
          trigger:
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: CrematoryOperator
          assert:
            - "Cooler.${cooler_id}.occupied_count == 0"
            - "Cooler.${cooler_id}.available_capacity == 2"
            - "Cooler.${cooler_id}.status == AVAILABLE"
            - "Case.${case_id}.custody_status == CANCELLED"
            - "Case.${case_id}.cooler_id == null"

      - name: invariant_clinic_outstanding_conserved_on_void
        grounds:
          - calculations.clinic_outstanding_balance
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Clinic.fields.outstanding_balance_cents
        distinguishing_aspect: >
          Conserved quantity = clinic outstanding money (different from cooler slots): issuing
          a clinic-account invoice then voiding it returns outstanding_balance_cents to its
          pre-issue value (0) — the forward charge and its compensating void cancel exactly.
        test_recipe:
          setup:
            - "Clock 2026-04-04T00:00:00Z; clinic CL-D credit_limit 500000; clinic-billed PRIVATE case CREMATED and invoiced (total 18000, outstanding 18000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
