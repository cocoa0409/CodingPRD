  - name: error_possession_permit_on_a_wild_collection_clearance_is_a_type_mismatch
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_PERMIT_TYPE_MISMATCH (422)
    - §1.4 priority 27 (WILD_COLLECTION requires IMPORT, any other source requires POSSESSION)
    - §1.4 priority 26 (ERR_PERMIT_NOT_ISSUED)
    - §1.3 permit_document_requirement BASE_DOCUMENTS POSSESSION
    distinguishing_aspect: The dossier is complete, ISSUED and in date — it is simply the WRONG KIND of permit for a wild take, so priority 26 passes and priority 27 fires with 422. Adding a correctly typed IMPORT permit alongside it clears the request without touching the POSSESSION permit.
