  - section: state_machines
    instances:
      - name: equipment_audit_initial_state_is_scheduled
        claim_type: initial_state
        grounds:
          - state_machines.EquipmentAudit.initial_state
          - entities.EquipmentAudit.fields.auditor_user_id
        distinguishing_aspect: |
          A freshly created audit is SCHEDULED with finding_count 0,
          retroactive_billing_total_cents 0 and auditor_user_id equal to the acting X-User-ID —
          it does not start IN_PROGRESS and no billing totals are pre-seeded.
        test_recipe:
          setup:
            - "One tower exists."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Audit Init Knoll", structure_type: "MONOPOLE", rated_capacity_load_units: 5000, min_colocation_elevation_ft: 50, max_elevation_ft: 200, ground_space_total_sqft: 5000 }
              as: PortfolioAdmin
              captures: { ai_t_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/equipment-audits"
              payload: { tower_id: "${ai_t_id}", audit_date: "2026-07-31", basis: "INSTALL_DATE_BASIS" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 201"
            - "response.data.status == SCHEDULED"
            - "response.data.finding_count == 0"
            - "response.data.retroactive_billing_total_cents == 0"
            - "response.data.auditor_user_id == aud-1"
            - "response.data.basis == INSTALL_DATE_BASIS"

      - name: submit_moves_draft_application_into_structural_review
        claim_type: valid_transition
        grounds:
          - state_machines.ColocationApplication.transitions.DRAFT_to_SUBMITTED
          - state_machines.ColocationApplication.transitions.SUBMITTED_to_UNDER_STRUCTURAL_REVIEW
          - calculations.review_deadline
          - entities.Tower.fields.open_review_count
        distinguishing_aspect: |
          On an OPEN tower the submit call lands the application in UNDER_STRUCTURAL_REVIEW in the
          same request (never resting in SUBMITTED), stamps submitted_at 2026-08-01T00:00:00Z,
          sets review_deadline_at to 2026-09-15T00:00:00Z from the 45-day standard commitment, and
          drives Tower.open_review_count from 0 to 1.
        test_recipe:
          setup:
            - "Tower SUB (rated 9000, OPEN) with tenant SUB and an ACTIVE master lease with no expedited commitment; one DRAFT application carrying a single 500.0-load-unit equipment line."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Submit Summit", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { sm_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Submit Wireless", carrier_code: "SUB" }
              as: PortfolioAdmin
              captures: { sm_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${sm_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { sm_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${sm_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${sm_t_id}", master_lease_agreement_id: "${sm_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 300 }
              as: Tenant
              as_user_id: "${sm_ten_id}"
              captures: { sm_app_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${sm_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "SM-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${sm_ten_id}"
          trigger:
            - call: "POST /tower-colo/colocation-applications/${sm_app_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${sm_ten_id}"
          assert:
            - "response.status == 200"
            - "response.data.status == UNDER_STRUCTURAL_REVIEW"
            - "response.data.submitted_at == 2026-08-01T00:00:00Z"
            - "response.data.review_deadline_at == 2026-09-15T00:00:00Z"
            - "response.data.total_load_units == 500.0"
            - "response.data.sla_breached == false"
            - "Tower.${sm_t_id}.open_review_count == 1"
            - "Tower.${sm_t_id}.reserved_load_units == 0.0"
            - "Tower.${sm_t_id}.capacity_posture == OPEN"

      - name: expedited_application_uses_master_lease_review_commitment
        claim_type: side_effect_execution
        grounds:
          - calculations.review_deadline
          - entities.MasterLeaseAgreement.fields.expedited_review_days
          - entities.ColocationApplication.fields.expedited_requested
        distinguishing_aspect: |
          With expedited_requested true and the master lease committing expedited_review_days 15,
          submit sets review_deadline_at to 2026-08-16T00:00:00Z rather than the 45-day
          2026-09-15T00:00:00Z — the commitment comes from the master lease, not from the
          application's flag alone.
        test_recipe:
          setup:
            - "Tower XPD (rated 9000, OPEN); tenant XPD holds an ACTIVE master lease with expedited_review_days 15; one DRAFT application with expedited_requested true and one equipment line."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Expedited Edge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
