          trigger:
            - call: "POST /plans"
              payload: { name: "X", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: Participant
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "$.data.error_id == ERR_FORBIDDEN"

      - name: custodian_can_read_plans_but_not_activate
        claim_type: role_denial
        grounds:
          - roles[Custodian]
          - endpoints[GET /plans]
          - endpoints[POST /plans/{id}/activate]
        distinguishing_aspect: "Custodian role allowed on GET /plans (success) and denied on POST /plans/{id}/activate (403)."
        test_recipe:
          setup:
            - "DRAFT plan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Cust", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Custodian
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: Custodian
              as_user_id: "00000000-0000-0000-0000-000000000002"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "$.data.error_id == ERR_FORBIDDEN"
            - "Plan.${plan_id}.status == DRAFT"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Calling GET /plans without X-User-Role / X-User-ID returns 401 ERR_UNAUTHENTICATED. Captured via instance_name pattern (negative test)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /plans"
              payload: {}
              as: "ANONYMOUS_MISSING_HEADERS"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "$.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: optimistic_concurrency_stale_version_on_plan_terminate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-terminate-stale-version]
        excluded_because:
          difficulty_instance: plan_terminate_cascades_to_loan_default_depth_3
          rationale: "OCC version is exercised in the difficulty instance's terminate call. A pure stale-version test is also covered by err_stale_version_triggerable_via_terminate above (errors section)."

      - name: cascade_partial_failure_does_not_partially_apply
        claim_type: cascade_atomicity
        grounds:
          - state_machines.Plan.ACTIVE_to_TERMINATED
        distinguishing_aspect: "Plan terminate with stale expected_plan_version returns 412 without partially terminating any Participant or defaulting any Loan."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; ACTIVE plan; ENROLLED participant with DISBURSED loan; freeze then unfreeze to bump plan version so the stored expected_plan_version becomes stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Atomic", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { v_pre: $.data.version }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Aa", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 20000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
            - call: "POST /plans/${plan_id}/freeze"
              payload: {}
              as: PlanAdmin
            - call: "POST /plans/${plan_id}/unfreeze"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /plans/${plan_id}/terminate"
              payload: { expected_plan_version: "${v_pre}" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "$.data.error_id == ERR_STALE_VERSION"
            - "Plan.${plan_id}.status == ACTIVE"
            - "Participant.${p_id}.enrollment_status == ENROLLED"
            - "Loan.${loan_id}.status == DISBURSED"

      - name: derived_field_reconciliation_after_loan_default
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Loan.DISBURSED_to_DEFAULTED
          - entities.Participant.fields.vested_employer_balance_cents
          - entities.Participant.fields.outstanding_loan_principal_cents
        distinguishing_aspect: "Operator-initiated loan default debits employer_balance, recomputes vested_employer_balance, and zeroes outstanding_loan_principal in one transaction."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; ACTIVE GRADED_6 plan; ENROLLED yos=8 participant; one CLOSED ContributionPeriod gross=10000000 (employer_balance=46441); one DISBURSED Loan principal=20000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "DR", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Dr", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 20000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /loans/${loan_id}/default"
              payload: {}
              as: PlanAdmin
          assert:
            - "Loan.${loan_id}.status == DEFAULTED"
            - "Participant.${p_id}.employer_balance_cents == 26441"
            - "Participant.${p_id}.vested_employer_balance_cents == 26441"
            - "Participant.${p_id}.outstanding_loan_principal_cents == 0"

      - name: pagination_with_filter_status
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /contribution-periods]
        distinguishing_aspect: "GET /contribution-periods?participant_id=X&status=CLOSED returns only CLOSED periods for that participant; OPEN periods are excluded."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; ACTIVE plan; ENROLLED participant with one CLOSED and one OPEN ContributionPeriod."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "PF", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "PF", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-05-31T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_closed_id: $.data.id }
            - call: "POST /contribution-periods/${cp_closed_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_open_id: $.data.id }
          trigger:
            - call: "GET /contribution-periods"
              payload: { participant_id: "${p_id}", status: "CLOSED" }
              as: PlanAdmin
          assert:
            - "response includes ${cp_closed_id}"
            - "response excludes ${cp_open_id}"

