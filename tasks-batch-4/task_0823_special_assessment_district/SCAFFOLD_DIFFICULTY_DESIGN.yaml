              payload: { bond_id: "${biy}", installment_year: 1, due_date: "2027-07-01T00:00:00Z", principal_cents: 1000 }
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INSTALLMENT_YEAR_CONFLICT"

      - name: bond_amortization_window_continuous_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_BOND_TERM_OVERLAP]
          - entities.ImprovementBond.fields.term_years
        distinguishing_aspect: "Issuing a second bond whose amortization window [2030,2035) overlaps the ISSUED bond's window [2026,2036) is rejected by CONTINUOUS half-open range overlap on the District resource — different interval arithmetic than the discrete-year point collision."
