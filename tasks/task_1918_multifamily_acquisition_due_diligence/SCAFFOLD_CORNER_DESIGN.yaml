  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id, response_type object|array and data; errors have response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /acquisitions", payload: { property_name: "Env Deal", address: "46 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "GET /acquisitions/00000000-0000-0000-0000-000000000000", payload: {}, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "Success body: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data holds the entity"
            - "Error body: response_type == error, data.error_id == ERR_ACQUISITION_NOT_FOUND, data.message present"
            - "List responses use response_type == array and expose limit/offset/total_count/has_more"

      - name: closing_cascade_side_effects_covered
        claim_type: side_effect_execution
        grounds: ["endpoints[POST /acquisitions/{id}/execute-closing]"]
        excluded_because:
          difficulty_instance: execute_closing_cascade_depth4
          rationale: "All execute-closing side effects asserted hop-by-hop in §1.8."

      - name: adjustment_apply_endpoint_side_effects_covered
        claim_type: conditional_action
        grounds: ["endpoints[POST /acquisitions/adjustments/{id}/apply]"]
        excluded_because:
          difficulty_instance: adjustment_fork_join_divergent_amounts
          rationale: "Auto-creation of the true-up statement and per-branch line amounts asserted in §1.8."

  # ===================================================================
  # Section: rbac
  # ===================================================================
  - section: rbac
    instances:
      - name: rbac_hrpartner_cannot_create_acquisition
        claim_type: rbac_denial
        grounds: ["roles[HRPartner]", "roles[AcquisitionsAnalyst]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "HRPartner may not create acquisitions (403 ERR_FORBIDDEN) but shares all GET endpoints (200)."
        test_recipe:
          setup: ["One acquisition exists (created by an analyst)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "RBAC Deal", address: "47 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
          trigger:
            - { call: "POST /acquisitions", payload: { property_name: "HR Attempt", address: "48 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: HRPartner, as_user_id: "hr-1", captures: { err: $.data.error_id } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: HRPartner, as_user_id: "hr-1", captures: { got: $.data.id } }
          assert:
            - "POST as HRPartner: HTTP 403 ERR_FORBIDDEN"
            - "GET as HRPartner: HTTP 200 with the acquisition (shared read)"

      - name: rbac_analyst_cannot_approve_tax_projection
        claim_type: rbac_denial
        grounds: ["roles[UnderwritingManager]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The analyst who computed a projection cannot approve it — approval is UnderwritingManager-exclusive."
        test_recipe:
          setup: ["Acquisition with a COMPUTED projection"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "RBAC Two", address: "49 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id, acq_v: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
          trigger:
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 ERR_FORBIDDEN; projection remains COMPUTED"

      - name: rbac_authorization_precedes_existence
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A VendorManager calling queue-escrow on a NONEXISTENT deposit id still gets 403 (authorization, priority 2) — never 404 (existence, priority 3)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /acquisitions/deposits/00000000-0000-0000-0000-000000000000/queue-escrow", payload: {}, as: VendorManager, as_user_id: "vm-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 ERR_FORBIDDEN (role gate fires before the 404 the id would otherwise produce)"

      - name: rbac_non_admin_cannot_set_clock
        claim_type: rbac_denial
        grounds: ["roles[PlatformAdmin]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The logical clock is PlatformAdmin-exclusive; an analyst gets 403."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 ERR_FORBIDDEN"

  # ===================================================================
  # Section: cross-cutting complexity layers
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_tax_projection_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tax-projection-create-stale-acquisition]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second projection create carrying the pre-first-create acquisition version is rejected 412; the current version succeeds and each create increments Acquisition.version by exactly 1."
        test_recipe:
          setup: ["Acquisition created (version captured)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "OCC One", address: "50 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id, acq_v1: $.data.version } }
          trigger:
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj1: $.data.id } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: AcquisitionsAnalyst, captures: { acq_v2: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "INCOME_APPROACH", cap_rate: 0.055, noi_t12_cents: 16500000, expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "INCOME_APPROACH", cap_rate: 0.055, noi_t12_cents: 16500000, expected_acquisition_version: "${acq_v2}" }, as: AcquisitionsAnalyst, captures: { proj2: $.data.id } }
          assert:
            - "First create succeeds; Acquisition.version advanced by exactly 1 (acq_v2 == acq_v1 + 1)"
            - "Replay with the stale version: HTTP 412 ERR_STALE_VERSION, no projection created"
            - "Replay with the current version: 201, second projection DRAFT"

