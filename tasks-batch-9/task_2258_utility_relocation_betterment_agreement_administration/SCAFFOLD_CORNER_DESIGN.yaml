# =============================================================================
# 1.9 Scaffold Corner Design — task_2258 Utility Relocation & Betterment
#     Agreement Administration
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7. Conventions used throughout:
#
#   * Each error_id in §1.6 is triggered exactly ONCE across this file, in the
#     `errors` section, unless a §1.8 instance already asserts it - in which case
#     the `errors` section carries an `excluded_because:` stub naming that
#     instance. Other sections therefore assert positive paths, side effects,
#     filtering, precision and priority behaviour rather than re-triggering the
#     same error ids.
#   * The logical clock starts at 2026-08-01T00:00:00Z; only instances that need
#     lateness move it with POST /_clock/set_current_utc.
#   * Recurring fixture: project (row_acquisition_year 1975, construction
#     2027-03-01 .. 2028-06-30, contract_daily_overhead_cents 250000), private
#     ELECTRIC owner at indirect_cost_rate_pct 12.5, BURIED_ELECTRIC facility
#     (depth_in 48, installed_year 1968, PRIVATE_EASEMENT) -> RECORD_BASIS
#     share 100, plan 40000000 / 32000000 / 1.25 -> betterment_ratio 0.360000
#     and betterment_amount_cents 14400000, agreement NTE 45000000 ->
#     state_share_cents 29070000.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: project_creation_returns_every_declared_field_with_derived_defaults
        claim_type: Creation
        grounds: ["entities.Project", "endpoints.POST_/uro/projects"]
        distinguishing_aspect: "A create with all eight required inputs returns 201 and the response already carries the four derived counters at their empty-world values (open_conflict_count 0, estimated_state_liability_cents 0, total_committed_reimbursement_cents 0, aggregate_compensable_delay_days 0) plus status PLANNING and clearance_posture CLEARANCE_PENDING."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "Project.${p1}.status == PLANNING"
            - "Project.${p1}.clearance_posture == CLEARANCE_PENDING"
            - "Project.${p1}.open_conflict_count == 0"
            - "Project.${p1}.estimated_state_liability_cents == 0"
            - "Project.${p1}.total_committed_reimbursement_cents == 0"
            - "Project.${p1}.aggregate_compensable_delay_days == 0"
            - "Project.${p1}.version == 1 and id, created_at, updated_at are present"
            - "The response envelope has meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: facility_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds: ["entities.UtilityFacility", "endpoints.GET_/uro/facilities/{id}"]
        distinguishing_aspect: "GET /uro/facilities/{id} echoes every stored input field byte for byte, including the float offset_ft 12.5 and station_begin 100.0, with no rounding to integers."
        test_recipe:
          setup: ["One owner and one facility."]
          setup_api_calls:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
          trigger:
            - { call: "GET /uro/facilities/${f1}", payload: {}, as: UtilityCoordinator, captures: { f1_offset: "$.data.offset_ft", f1_owner: "$.data.owner_id" } }
          assert:
            - "HTTP 200 and response_type == object"
            - "UtilityFacility.${f1}.owner_id == ${o1}"
            - "UtilityFacility.${f1}.offset_ft == 12.5 and station_begin == 100.0 and station_end == 140.0"
            - "UtilityFacility.${f1}.depth_in == 48 and installed_year == 1968"
            - "UtilityFacility.${f1}.occupancy_basis == PRIVATE_EASEMENT and record_source == AS_BUILT"

      - name: conflict_listing_paginates_and_filters_by_project_and_status
        claim_type: Listing
        grounds: ["endpoints.GET_/uro/conflicts", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Three conflicts exist on one project; limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 offset 2 returns 1 row with has_more false, and a status filter of RESOLUTION_SELECTED narrows to the single triaged row."
        test_recipe:
          setup: ["One project, one owner, three facilities, three conflicts; exactly one conflict has been triaged with set-resolution."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { fa: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "GAS_MAIN", station_begin: 200.0, station_end: 240.0, offset_ft: 14.0, depth_in: 42, material: "Coated steel", installed_year: 1968, occupancy_basis: "FRANCHISE", record_source: "OWNER_ATLAS" }, as: UtilityCoordinator, captures: { fb: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "FIBER_CONDUIT", station_begin: 300.0, station_end: 330.0, offset_ft: 9.0, depth_in: 36, material: "HDPE conduit", installed_year: 1990, occupancy_basis: "PERMIT", record_source: "VERBAL" }, as: UtilityCoordinator, captures: { fc: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fa}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { ca: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fb}", conflict_station: 220.0, clearance_deficiency_in: 12 }, as: UtilityCoordinator, captures: { cb: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fc}", conflict_station: 320.0, clearance_deficiency_in: 6 }, as: UtilityCoordinator, captures: { cc: "$.data.id" } }
            - { call: "POST /uro/conflicts/${ca}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
          trigger:
            - { call: "GET /uro/conflicts", payload: { project_id: "${p1}", limit: 2, offset: 0 }, as: UtilityCoordinator, captures: { first_page_head: "$.data[0].id" } }
            - { call: "GET /uro/conflicts", payload: { project_id: "${p1}", limit: 2, offset: 2 }, as: UtilityCoordinator, captures: { second_page_head: "$.data[0].id" } }
            - { call: "GET /uro/conflicts", payload: { project_id: "${p1}", status: "RESOLUTION_SELECTED" }, as: UtilityCoordinator, captures: { triaged_head: "$.data[0].id" } }
          assert:
            - "First page: response_type == array, 2 items, meta pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 item, total_count == 3, has_more == false"
            - "Status-filtered call: exactly 1 item and it is ${ca}"
            - "Project.${p1}.open_conflict_count == 3"

      - name: unknown_conflict_id_is_not_found_on_reads_and_on_sub_resource_listings
        claim_type: Not Found
        grounds: ["errors[ERR_CONFLICT_NOT_FOUND]", "validations[priority=4]", "endpoints.GET_/uro/conflicts/{id}/relocation-plans"]
        distinguishing_aspect: "A syntactically valid but unknown conflict id must yield ERR_CONFLICT_NOT_FOUND (404) on the entity read AND on each of its four sub-resource listings, rather than an empty 200 array - the listing endpoints must resolve the parent before filtering."
        test_recipe:
          setup: ["Empty database (no conflict has ever existed)."]
          setup_api_calls: []
          trigger:
            - { call: "GET /uro/conflicts/00000000-0000-0000-0000-000000000000", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/conflicts/00000000-0000-0000-0000-000000000000/relocation-plans", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/conflicts/00000000-0000-0000-0000-000000000000/permits", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/conflicts/00000000-0000-0000-0000-000000000000/prior-rights", payload: {}, as: UtilityCoordinator }
          assert:
            - "All four calls return HTTP 404 with error_id ERR_CONFLICT_NOT_FOUND"
            - "None of the sub-resource calls returns 200 with an empty data array"
            - "response_type == error on every one of the four responses"
      - name: project_create_missing_required_letting_date_is_rejected
        claim_type: Required Fields
        grounds: ["entities.Project.fields.letting_date", "validations[priority=3]"]
        distinguishing_aspect: "letting_date has source input, required true and no default, and every other required field is supplied; omitting only that one field must fail with ERR_INVALID_REQUEST (400) rather than defaulting to the construction start date."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /uro/projects returns total_count == 0"

      - name: owner_create_omitting_is_public_agency_applies_the_declared_false_default
        claim_type: Defaults
        grounds: ["entities.UtilityOwner.fields.is_public_agency", "endpoints.POST_/uro/utility-owners"]
        distinguishing_aspect: "is_public_agency is the only optional input on owner creation and carries default false; omitting it must store false, not null, because prior_rights_state_share branches on it and a null would silently skip the PUBLIC_AGENCY_CREDIT_PCT test."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id", o1_public: "$.data.is_public_agency" } }
          assert:
            - "HTTP 201"
            - "UtilityOwner.${o1}.is_public_agency == false"
            - "UtilityOwner.${o1}.delinquency_strikes == 0"
            - "UtilityOwner.${o1}.reimbursement_hold == false"
            - "UtilityOwner.${o1}.open_commitment_days == 0"
            - "UtilityOwner.${o1}.assessed_delay_liability_cents == 0"

      - name: investigation_contradicts_record_is_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.SubsurfaceInvestigation.fields.contradicts_record", "calculations.prior_rights_state_share"]
        distinguishing_aspect: "The client posts contradicts_record false alongside a measured depth 12 inches off the record; the stored value must be the computed true, so the submitted value is ignored rather than trusted."
        test_recipe:
          setup: ["One project, one owner, one facility recorded at depth_in 48."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${f1}", quality_level: "QL_A", method: "VACUUM_TEST_HOLE", measured_depth_in: 60, station_at_investigation: 120.0, contradicts_record: false }, as: UtilityCoordinator, captures: { inv1: "$.data.id", inv1_flag: "$.data.contradicts_record" } }
          assert:
            - "HTTP 201"
            - "SubsurfaceInvestigation.${inv1}.contradicts_record == true (computed from abs(60 - 48) > 6, the posted false is ignored)"
            - "SubsurfaceInvestigation.${inv1}.measured_depth_in == 60"
            - "SubsurfaceInvestigation.${inv1}.performed_at is stamped from the logical clock 2026-08-01T00:00:00Z"

      - name: project_system_fields_are_generated_and_client_input_ignored
        claim_type: System Fields
        grounds: ["entities.Project", "complexity_profile.consistency_model"]
        distinguishing_aspect: "A create that posts id, created_at, version and the derived counters must ignore all of them: version is 1, the counters are 0, and the returned id is not the submitted string."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000, id: "client-supplied-id", version: 99, open_conflict_count: 42, estimated_state_liability_cents: 777 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "Project.${p1}.id != client-supplied-id"
            - "Project.${p1}.version == 1"
            - "Project.${p1}.open_conflict_count == 0"
            - "Project.${p1}.estimated_state_liability_cents == 0"
            - "created_at and updated_at are system-generated from the logical clock 2026-08-01T00:00:00Z"

      - name: facility_create_with_invalid_occupancy_basis_enum_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.UtilityFacility.fields.occupancy_basis", "validations[priority=3]"]
        distinguishing_aspect: "occupancy_basis drives the BASE_BY_OCCUPANCY table in prior_rights_state_share, so an unrecognised value such as HANDSHAKE must be rejected at the boundary with 400 rather than stored and later defaulted to 0 percent entitlement."
        test_recipe:
          setup: ["One owner."]
          setup_api_calls:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "HANDSHAKE", record_source: "AS_BUILT" }, as: UtilityCoordinator }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /uro/utility-owners/${o1}/facilities returns 0 rows: nothing was persisted"

      - name: owner_indirect_cost_rate_above_thirtyfive_percent_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.UtilityOwner.fields.indirect_cost_rate_pct", "validations[priority=3]"]
        distinguishing_aspect: "The audited indirect rate is constrained to 0..35 with at most two decimals; 35.00 is accepted and 35.01 is rejected, so the constraint is enforced at the ceiling rather than merely as a non-negative check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Ceiling Rate Utility", utility_type: "TELECOM", is_public_agency: false, indirect_cost_rate_pct: 35.00 }, as: ProgramAdmin, captures: { o_ok: "$.data.id" } }
          trigger:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Over Ceiling Utility", utility_type: "TELECOM", is_public_agency: false, indirect_cost_rate_pct: 35.01 }, as: ProgramAdmin }
          assert:
            - "The setup call at exactly 35.00 returned 201 and UtilityOwner.${o_ok}.indirect_cost_rate_pct == 35.00"
            - "The trigger returns 400 with error_id ERR_INVALID_REQUEST"

      - name: investigation_is_immutable_with_no_update_path
        claim_type: Immutability
        grounds: ["entities.SubsurfaceInvestigation", "endpoints.GET_/uro/investigations/{id}"]
        distinguishing_aspect: "SubsurfaceInvestigation is the only entity declared with common_fields false: §1.5 exposes exactly two reads and one create for it and no mutation endpoint at all, so a field record can never be edited after the hole is dug - a later contradicting hole must be filed as a new row."
        test_recipe:
          setup: ["One project, one owner, one facility, one QL_D record-research investigation."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${f1}", quality_level: "QL_D", method: "RECORD_RESEARCH", measured_depth_in: 48, station_at_investigation: 120.0 }, as: UtilityCoordinator, captures: { inv1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${f1}", quality_level: "QL_A", method: "VACUUM_TEST_HOLE", measured_depth_in: 61, station_at_investigation: 120.0 }, as: UtilityCoordinator, captures: { inv2: "$.data.id" } }
          assert:
            - "SubsurfaceInvestigation.${inv1} exposes no version field and §1.5 declares no PATCH or action endpoint for investigations"
            - "SubsurfaceInvestigation.${inv1}.measured_depth_in is still 48 and contradicts_record is still false after the second filing"
            - "SubsurfaceInvestigation.${inv2}.contradicts_record == true"
            - "GET /uro/investigations with facility_id ${f1} returns both rows, total_count == 2"

      - name: body_foreign_keys_are_resolved_before_type_and_state_checks
        claim_type: Parent Relationships
        grounds: ["validations[priority=5]", "errors[ERR_OWNER_NOT_FOUND]", "complexity_profile.entity_topology"]
        distinguishing_aspect: "In this flat topology every write names its parents in the body rather than in the path, so body-level existence is checked at priority 5 by the receiving endpoint: a well-formed facility create whose owner_id matches no row must return ERR_OWNER_NOT_FOUND (404) - not ERR_INVALID_REQUEST and not a 201 with a dangling reference - and must persist nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/facilities", payload: { owner_id: "00000000-0000-0000-0000-000000000000", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator }
          assert:
            - "HTTP 404 with error_id ERR_OWNER_NOT_FOUND"
            - "No UtilityFacility row was created"
      - name: commitment_denormalises_project_facility_and_owner_from_the_plan_chain
        claim_type: Parent Relationships
        grounds: ["entities.ScheduleCommitment.fields.owner_id", "endpoints.POST_/uro/commitments", "complexity_profile.entity_topology"]
        distinguishing_aspect: "In this flat topology a commitment names only plan_id, yet its project_id, facility_id and owner_id must be resolved through plan -> conflict -> facility -> owner; a solution that leaves them null breaks the owner-scope rule and the owner_open_commitment_days aggregate that both read them."
        test_recipe:
          setup: ["Base chain to an APPROVED plan on a private ELECTRIC owner's PRIVATE_EASEMENT facility."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: "$.data.id" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: "$.data.version" } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: "$.data.id" } }
