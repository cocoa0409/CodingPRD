scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ride_capacity_theoretical_and_operational_diverge_on_one_row
        grounds:
          - calculations.ride_system_hourly_capacity
          - entities.RideSystem.fields.theoretical_hourly_capacity_guests
          - entities.RideSystem.fields.operational_hourly_capacity_guests
          - entities.RideSystem.fields.dispatch_interval_seconds
        distinguishing_aspect: |
          The two variants of calculations.ride_system_hourly_capacity are surfaced side by side on the SAME RideSystem
          row in ONE response: theoretical_design stops after the 3600/dispatch step and reports 1440, while
          operational_derated multiplies by the capped-and-floored derate 0.819 and reports 1179, a delta of 261 guests
          per hour that no single-variant implementation can produce.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One AttractionProject 'Skyward Saga' with design_day_attendance 8000 and peak_hour_share 0.10, so required_hourly_capacity_guests is 800."
            - "One CANDIDATE RideSystem with vehicle_count 12, riders_per_vehicle 8, block_zone_count 14, cycle_time_seconds 240, availability_pct 96, load_efficiency_pct 90, show_stops_per_hour 1.5."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-DV1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
          trigger:
            - call: "GET /ride-systems/${rs}"
              as: RideEngineer
              as_user_id: "u-eng-1"
          assert:
            - "RideSystem.${rs}.dispatch_interval_seconds == 20"
            - "RideSystem.${rs}.theoretical_hourly_capacity_guests == 1440"
            - "RideSystem.${rs}.operational_hourly_capacity_guests == 1179"
            - "RideSystem.${rs}.theoretical_hourly_capacity_guests - RideSystem.${rs}.operational_hourly_capacity_guests == 261"
            - "RideSystem.${rs}.status == CANDIDATE"
            - "AttractionProject.${proj}.required_hourly_capacity_guests == 800"

      - name: budget_committed_and_forecast_diverge_with_in_flight_ve_and_open_finding
        grounds:
          - calculations.project_budget_position
          - entities.AttractionProject.fields.committed_cost_cents
          - entities.AttractionProject.fields.forecast_cost_cents
          - endpoints[GET /attraction-projects/{id}/budget-position]
        distinguishing_aspect: |
          Over one identical ledger the committed_basis variant reports 3080000000 (chronological replay of realised
          entries only) while the forecast_basis variant reports 3008499995 because it subtracts the 83500005 net saving
          of the UNDER_REVIEW value-engineering item and adds the 12000000 remediation estimate of the OPEN MAJOR
          finding — a 71500005 divergence produced by rows the committed variant cannot see.
        test_recipe:
          setup:
            - "Project 'Skyward Saga' at design_phase DESIGN_DEVELOPMENT with budget_ceiling_cents 3600000000."
            - "One APPROVED DesignPackage with base_construction_cost_cents 2500000000, so total_cost_of_work_cents is 3080000000 and the approval minted one COMMITMENT ledger entry."
            - "One IN_REVIEW-turned-FINDINGS_ISSUED SafetyReview carrying one OPEN MAJOR SafetyFinding with remediation_cost_estimate_cents 12000000."
            - "One UNDER_REVIEW ValueEngineeringItem whose net_saving_cents is 83500005."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-DV2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv2: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC", expected_project_version: "${pv2}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv3: $.data.version }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Integrated Set A", discipline_scope: "INTEGRATED", base_construction_cost_cents: 2500000000, expected_project_version: "${pv3}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
            - call: "POST /design-packages/${pkg}/submit"
              payload: {}
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkgv1: $.data.version }
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv4: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEVELOPMENT", expected_project_version: "${pv4}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /design-packages/${pkg}/approve"
              payload: { expected_package_version: "${pkgv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /design-packages/${pkg}"
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { pkgv2: $.data.version }
            - call: "POST /safety-reviews"
              payload: { design_package_id: "${pkg}", standard_code: "ASTM_F2291", expected_package_version: "${pkgv2}" }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { rev: $.data.id }
            - call: "POST /safety-findings"
              payload: { safety_review_id: "${rev}", severity: "MAJOR", description: "Evacuation walkway handrail height below standard on lift hill", remediation_cost_estimate_cents: 12000000 }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { find1: $.data.id }
            - call: "POST /value-engineering-items"
              payload: { project_id: "${proj}", title: "Substitute sculpted rockwork with pre-cast panels", gross_saving_cents: 350000021, rework_loss_pct: 75, implementation_cost_cents: 4000000, capacity_impact_guests_per_hour: -300, scope_impact_delta_cents: -346000021 }
              as: ContractorPM
              as_user_id: "u-cpm-1"
              captures: { ve1: $.data.id }
            - call: "POST /value-engineering-items/${ve1}/open-review"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "response.data.committed_cost_cents == 3080000000"
            - "response.data.forecast_cost_cents == 3008499995"
            - "response.data.committed_cost_cents - response.data.forecast_cost_cents == 71500005"
            - "response.data.budget_ceiling_cents == 3600000000"
            - "response.data.headroom_cents == 520000000"
            - "response.data.restricted_utilisation_cents == 3240000000"
            - "response.data.readiness_posture == RESTRICTED"
            - "response.data.ve_program_net_savings_cents == 0"
            - "ValueEngineeringItem.${ve1}.net_saving_cents == 83500005"
            - "ValueEngineeringItem.${ve1}.status == UNDER_REVIEW"

  # =====================================================================
  # RULE 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ride_derate_nested_min_max_lands_on_floor_not_on_capped_subtraction
        grounds:
          - calculations.ride_system_hourly_capacity
          - entities.RideSystem.fields.operational_hourly_capacity_guests
        distinguishing_aspect: |
          Mode (a) nested min/max: the show-stop penalty is capped by min(0.20, 10 * 0.03) BEFORE the derate floor
          max(0.35, 0.48 - 0.20) is applied, so the row reports 327 guests per hour; swapping the two guards
          (floor the raw derate first, then subtract the cap) yields 262, a different observable integer.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One AttractionProject with design_day_attendance 8000 and peak_hour_share 0.10."
            - "One CANDIDATE RideSystem with vehicle_count 8, riders_per_vehicle 6, block_zone_count 10, cycle_time_seconds 180, availability_pct 60, load_efficiency_pct 80 and show_stops_per_hour 10 (penalty 0.30 before the 0.20 cap)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CF1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Intamin", system_type: "BOAT_FLUME", vehicle_count: 8, riders_per_vehicle: 6, block_zone_count: 10, cycle_time_seconds: 180, availability_pct: 60, load_efficiency_pct: 80, show_stops_per_hour: 10 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs_floor: $.data.id }
          assert:
            - "RideSystem.${rs_floor}.dispatch_interval_seconds == 23"
            - "RideSystem.${rs_floor}.theoretical_hourly_capacity_guests == 936"
            - "RideSystem.${rs_floor}.operational_hourly_capacity_guests == 327"
            - "RideSystem.${rs_floor}.operational_hourly_capacity_guests != 262"

      - name: ve_program_savings_round_per_item_then_sum
        grounds:
          - calculations.ve_item_net_saving
          - entities.ValueEngineeringItem.fields.net_saving_cents
          - state_machines.ValueEngineeringItem.UNDER_REVIEW_to_ADOPTED
        distinguishing_aspect: |
          Mode (b) order of aggregation vs rounding: the two ADOPTED items' exact retained savings are 87500005.25 and
          17500005.25; rounding each to whole cents FIRST and then subtracting the implementation costs yields a program
          total of exactly 100000010, whereas summing the exact retained savings, rounding once and then subtracting
          yields 100000011.
        test_recipe:
          setup:
            - "Project at design_phase DESIGN_DEVELOPMENT with budget_ceiling_cents 3600000000 and committed_cost_cents 3080000000 from one APPROVED DesignPackage."
            - "Two ADOPTED ValueEngineeringItem rows: item A gross_saving_cents 350000021 / rework_loss_pct 75 / implementation_cost_cents 4000000 / capacity_impact_guests_per_hour -300, item B gross_saving_cents 70000021 / rework_loss_pct 75 / implementation_cost_cents 1000000 / capacity_impact_guests_per_hour 0."
            - "Each item carries three ballots: OwnerRep APPROVE, ContractorPM APPROVE, CreativeDirector ABSTAIN."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CF2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv2: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC", expected_project_version: "${pv2}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv3: $.data.version }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Integrated Set A", discipline_scope: "INTEGRATED", base_construction_cost_cents: 2500000000, expected_project_version: "${pv3}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
            - call: "POST /design-packages/${pkg}/submit"
              payload: {}
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkgv1: $.data.version }
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv4: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEVELOPMENT", expected_project_version: "${pv4}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /design-packages/${pkg}/approve"
              payload: { expected_package_version: "${pkgv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /value-engineering-items"
              payload: { project_id: "${proj}", title: "Substitute sculpted rockwork with pre-cast panels", gross_saving_cents: 350000021, rework_loss_pct: 75, implementation_cost_cents: 4000000, capacity_impact_guests_per_hour: -300, scope_impact_delta_cents: -346000021 }
              as: ContractorPM
              as_user_id: "u-cpm-1"
              captures: { ve1: $.data.id }
            - call: "POST /value-engineering-items/${ve1}/open-review"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve1}", party_role: "OwnerRep", decision: "APPROVE", comment: "Saving accepted" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve1}", party_role: "ContractorPM", decision: "APPROVE" }
              as: ContractorPM
              as_user_id: "u-cpm-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve1}", party_role: "CreativeDirector", decision: "ABSTAIN" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /value-engineering-items"
              payload: { project_id: "${proj}", title: "Reduce practical flame effects to two positions", gross_saving_cents: 70000021, rework_loss_pct: 75, implementation_cost_cents: 1000000, capacity_impact_guests_per_hour: 0, scope_impact_delta_cents: -69000021 }
              as: ContractorPM
              as_user_id: "u-cpm-1"
              captures: { ve2: $.data.id }
            - call: "POST /value-engineering-items/${ve2}/open-review"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve2}", party_role: "OwnerRep", decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve2}", party_role: "ContractorPM", decision: "APPROVE" }
              as: ContractorPM
              as_user_id: "u-cpm-1"
            - call: "POST /ve-ballots"
              payload: { value_engineering_item_id: "${ve2}", party_role: "CreativeDirector", decision: "ABSTAIN" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
          trigger:
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "ValueEngineeringItem.${ve1}.net_saving_cents == 83500005"
            - "ValueEngineeringItem.${ve2}.net_saving_cents == 16500005"
            - "ValueEngineeringItem.${ve1}.status == ADOPTED"
            - "ValueEngineeringItem.${ve2}.status == ADOPTED"
            - "response.data.ve_program_net_savings_cents == 100000010"
            - "response.data.ve_program_net_savings_cents != 100000011"
            - "response.data.committed_cost_cents == 2979999990"

      - name: design_package_tier_keyed_on_base_not_on_running_total
        grounds:
          - calculations.design_package_cost_of_work
          - entities.DesignPackage.fields.design_fee_cents
          - entities.DesignPackage.fields.contingency_cents
          - entities.DesignPackage.fields.total_cost_of_work_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the fee/contingency tier is keyed on base_construction_cost_cents ONLY, so a
          base of 2500000001 falls in the 8.5%/10% band and totals 2983750001, which is 96249999 LESS than the
          3080000000 produced by a base of 2500000000 in the 10%/12% band — an inversion no tier-on-running-total
          implementation can reproduce.
        test_recipe:
          setup:
            - "Project at design_phase SCHEMATIC with a SELECTED RideSystem and budget_ceiling_cents 9000000000."
            - "One DRAFT DesignPackage already created with base_construction_cost_cents 2500000000 (total 3080000000)."
          setup_api_calls:
            - call: "POST /attraction-projects"
