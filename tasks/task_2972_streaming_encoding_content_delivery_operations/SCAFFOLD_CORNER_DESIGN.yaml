      - name: patch_lowering_committed_gbps_below_reserved_is_rejected_then_accepted_at_equality
        claim_type: triggerable
        grounds:
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
          - endpoints.PATCH_/cdn-vendors/{id}
