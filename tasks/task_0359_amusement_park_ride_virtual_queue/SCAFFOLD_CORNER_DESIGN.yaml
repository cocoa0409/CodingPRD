  # =================================================================
  - section: consistency_model
    instances:
      - name: admission_day_phase_visible_in_same_response
        claim_type: immediate
        grounds: [entities.Park.fields.day_phase, entities.Park.fields.admitted_count]
        distinguishing_aspect: "Immediate consistency: the admission that crosses gate_capacity returns the park with day_phase already FULL and admitted_count updated in the same request."
        test_recipe:
          setup: ["Park gate_capacity 1; one guest+ticket; admit crosses to FULL"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 1, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
