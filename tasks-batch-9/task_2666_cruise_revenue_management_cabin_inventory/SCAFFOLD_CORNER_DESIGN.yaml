              as: ReservationAgent
              captures: { bk_ada: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_gb}", cabin_category_id: "${cat_ia}", guest_id: "${g_bo}", occupancy_adults: 2, group_block_id: "${blk_alpha}" }
              as: ReservationAgent
