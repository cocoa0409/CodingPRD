        distinguishing_aspect: "The alert machine is cyclic through DISMISSED→OPEN: after OPEN→TRIAGED→DISMISSED a reopen returns the alert to OPEN with reopen_count 1, and because the resolution was DISMISS rather than CONFIRM the card's risk_posture is still CLEAR throughout."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 9000 cents."
