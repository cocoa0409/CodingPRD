          The lessee-procedures gate is per crew member, not per crew: the captain holds a QUALIFIED
          CrewQualification for this lease (which is what let the lease activate at all) while the
          first officer holds none, and that alone is a 409. Both pilots are B738-type-rated, so
          priority 50 is satisfied and cannot mask the result, and no leg row may be created.
          
