      - name: permit_expiry_at_the_clock_freezes_venue_courses_waves_and_festival_services
        grounds:
          - state_machines.LandUsePermit.APPROVED_to_EXPIRED
          - state_machines.Venue.OPEN_to_FROZEN
          - state_machines.Course.PUBLISHED_to_SUSPENDED
          - state_machines.Wave.SCHEDULED_to_HELD
          - state_machines.FestivalService.OPEN_to_CLOSED
          - calculations.course_readiness_posture
        distinguishing_aspect: |
          The same four-link freeze is reached from an entirely different origin: no operator
          acts on the venue at all, the clock simply steps past the governing permit's
          valid_until_utc. The cascade is therefore triggered by POST /ocr/_clock/set_current_utc,
          which must also report the expired permit in expired_permit_ids, and it fans out
          sideways to every OPEN FestivalService as well as downward to courses and waves. The
