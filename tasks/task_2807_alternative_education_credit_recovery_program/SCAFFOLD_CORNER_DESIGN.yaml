        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_course_enrollments_course_enrollment_id_award_credit
          - calculations.cohort_accountability
        excluded_because:
          difficulty_instance: award_credit_cascade_to_cohort_flag
          rationale: "The four-hop award cascade (award row, student ledger, plan posture and completion, then the home school's cohort_flag) is already walked end-to-end hop by hop, including the ordering sensitivity of the plan completion feeding the student's GRADUATED status before the cohort figures are re-derived; a second corner instance would only re-check the same chain with different names."

      - name: seat_time_and_competency_variants_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.credit_award_credits
        excluded_because:
          difficulty_instance: seat_time_vs_competency_award_same_progress_inputs
          rationale: "The declared seat_time_award and competency_award variants are already driven from one identical progress record so the delta is visible in a single instance, and the GPA policy variants are covered alongside it; a breadth instance would duplicate the same two-variant comparison."

