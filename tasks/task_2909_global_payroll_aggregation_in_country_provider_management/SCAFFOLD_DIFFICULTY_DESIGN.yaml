  - rule_id: non_linear_state_machine
    instances:
      - name: gtn_run_returned_then_resubmitted_reenters_cleared
        grounds:
          - state_machines.GrossToNetRun
          - state_machines.GrossToNetRun.ESCALATED_to_RETURNED
          - state_machines.GrossToNetRun.RETURNED_to_SUBMITTED
          - calculations.gross_to_net_variance
          - endpoints.POST_payroll_gross_to_net_runs_id_resubmit
        distinguishing_aspect: |
          Cycle in the GrossToNetRun review machine: the same run traverses
          SUBMITTED -> ESCALATED -> RETURNED -> SUBMITTED -> CLEARED, so a state
          already visited is re-entered on a later pass and the re-entry is scored
          afresh (the second pass clears with variance 0.00 where the first pass
          escalated at 15.00). The run id never changes and no new run row is created.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
            - "PayrollCycle 2026-08 with an APPROVED baseline run of gross_minor 10000000 over 200 employees"
            - "PayrollCycle 2026-09 with prior_cycle_id 2026-08, inputs locked from a 230-record extract declaring gross 10800000 (15.00 percent headcount drift, below the 20.00 percent rejection ceiling, and both run passes stay inside the 10 percent declared-gross tolerance)"
            - "the provider submits gross_minor 11500000 over 230 employees, which escalates at 15.00 percent on the ABSOLUTE_TOTAL basis"
            - "the controller returns the run with a written reason"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
