scaffold_corner_design:
  - section: entities
    instances:
      - name: store_created_returns_201_with_fields
        claim_type: creation
        grounds:
          - "endpoints.POST_/cold-chain/stores"
          - "entities.Store"
        distinguishing_aspect: "Happy-path creation: 201, all input fields echoed, common fields present with version == 1."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "POST /cold-chain/stores"
              payload: { name: "Corner Store", region: "US-SE", demographic_index: 50, weekly_category_velocity_index: 55, competitor_density_index: 30, available_sqft: 60, distance_miles_from_plant: 4.5 }
              as: PlatformAdmin
              captures: { st_id: $.data.id, st_version: $.data.version }
          assert:
            - "http 201; response echoes all seven input fields"
            - "id is a prefix-less UUID; created_at == updated_at == logical now; version == 1"
      - name: get_store_not_found_returns_404
        claim_type: not_found
        grounds:
          - "endpoints.GET_/cold-chain/stores/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "GET /cold-chain/stores/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404; error_id == ERR_NOT_FOUND; error envelope has meta + response_type error"
      - name: create_store_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "endpoints.POST_/cold-chain/stores"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required demographic_index yields 400 ERR_VALIDATION; no row is persisted."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "POST /cold-chain/stores"
              payload: { name: "No Demo", region: "US-SE", weekly_category_velocity_index: 55, competitor_density_index: 30, available_sqft: 60, distance_miles_from_plant: 4.5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_VALIDATION"
      - name: chiller_batch_mints_sequential_serials
        claim_type: system_fields
        grounds:
          - "endpoints.POST_/cold-chain/chillers"
          - "entities.Chiller.fields.serial_no"
        distinguishing_aspect: "System-minted serial_no: a batch of 2 with prefix SN yields SN-0001 and SN-0002 in creation order; capacity_units and footprint_sqft derive from model."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "POST /cold-chain/chillers"
              payload: { model: "COMPACT", serial_prefix: "SN", quantity: 2 }
              as: ProductionPlanner
              captures: { ch1_serial: "$.data[0].serial_no", ch2_serial: "$.data[1].serial_no", ch1_cap: "$.data[0].capacity_units" }
          assert:
            - "http 201; two rows returned"
            - "serials == SN-0001 and SN-0002"
            - "capacity_units == 120 and footprint_sqft == 5 for COMPACT; status == IN_STOCK; version == 1"
      - name: temperature_reading_immutable_shape_no_version
        claim_type: immutability
        grounds:
          - "entities.TemperatureReading"
          - "endpoints.POST_/cold-chain/chillers/{id}/temperature-readings"
        distinguishing_aspect: "common_fields: false — reading responses carry id and created_at but no version and no updated_at; readings are append-only (no update endpoint exists)."
        test_recipe:
          setup:
            - "Store Alpha fixture with ELIGIBLE evaluation, SIGNED agreement, STANDARD chiller, ACTIVE placement (chiller INSTALLED)."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
          trigger:
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-01T00:30:00Z", temp_c: 2.5, duration_minutes: 10 }
              as: PlatformAdmin
              captures: { rd_id: $.data.id, rd_exc: $.data.is_excursion }
          assert:
            - "http 201; response has id, created_at, chiller_id, recorded_at, temp_c, duration_minutes, is_excursion"
            - "response has NO version field and NO updated_at field (common_fields false)"
            - "is_excursion == false for 2.5 C inside the inclusive band"
      - name: site_evaluation_spoofed_composite_score_returns_400
        claim_type: computed_fields
        grounds:
          - "entities.SiteEvaluation.fields.composite_score"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Client-supplied computed field (composite_score) in the request body is an undeclared field and is rejected 400 ERR_VALIDATION — computed fields are server-owned."
        test_recipe:
          setup: ["Store exists."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16, composite_score: 99.99 }
              as: PlacementManager
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_VALIDATION (undeclared field rejected, not silently ignored)"
  - section: state_machines
    instances:
      - name: agreement_created_in_proposed_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.PlacementAgreement"
        distinguishing_aspect: "A new agreement starts in PROPOSED with null signed_at/terminated_at and version 1."
        test_recipe:
          setup: ["Store exists."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_status: $.data.status, ag_signed: $.data.signed_at }
          assert:
            - "status == PROPOSED; signed_at == null; terminated_at == null; version == 1"
      - name: sign_terminated_agreement_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PlacementAgreement"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "TERMINATED is terminal: sign after terminate is rejected ERR_INVALID_STATE 409; terminated_at stays set."
        test_recipe:
          setup: ["Store with PROPOSED agreement."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/terminate"
              payload: {}
              as: PlacementManager
          trigger:
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { err: $.data.error_id }
          assert:
            - "http 409; error_id == ERR_INVALID_STATE"
            - "agreement remains TERMINATED (GET /stores/{id}/placement-agreements shows status TERMINATED)"
      - name: decommission_installed_chiller_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Chiller"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Decommission is only valid from IN_STOCK; an INSTALLED chiller (actively placed) is rejected."
        test_recipe:
          setup: ["Full ACTIVE placement on Store Alpha fixture."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
          trigger:
            - call: "POST /cold-chain/chillers/${ch_id}/decommission"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 409; error_id == ERR_INVALID_STATE; chiller remains INSTALLED"
      - name: decommission_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Chiller"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "DECOMMISSIONED is terminal: the second decommission of the same IN_STOCK-then-decommissioned chiller fails ERR_INVALID_STATE; fleet count unchanged."
        test_recipe:
          setup: ["One IN_STOCK chiller."]
          setup_api_calls:
            - call: "POST /cold-chain/chillers"
              payload: { model: "COMPACT", serial_prefix: "DC", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/chillers/${ch_id}/decommission"
              payload: {}
              as: PlatformAdmin
              captures: { ch_status: $.data.status }
          trigger:
            - call: "POST /cold-chain/chillers/${ch_id}/decommission"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first decommission: status == DECOMMISSIONED (200)"
            - "second decommission: http 409, error_id == ERR_INVALID_STATE"
            - "GET /chillers total_count still 1 (decommission changes status, never count)"
      - name: lot_release_false_rejects_terminally
        claim_type: valid_transition
        grounds:
          - "state_machines.ProductLot"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_LOT_NOT_RELEASED]"
        distinguishing_aspect: "release with qc_passed false drives QUARANTINE -> REJECTED (terminal); a second release attempt fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot of 50 units in QUARANTINE; Store Alpha with an ACTIVE placement (for the shipment attempt)."]
          setup_api_calls:
            - call: "POST /cold-chain/product-lots"
              payload: { sku: "CHICKEN-2LB", produced_at: "2026-09-01T00:00:00Z", quantity_units: 50 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id, lot_status0: $.data.status }
          trigger:
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: false }
              as: ProductionPlanner
              captures: { lot_status1: $.data.status }
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: true }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "initial status == QUARANTINE"
            - "release(false) -> status == REJECTED (200)"
            - "second release -> http 409 ERR_INVALID_STATE (terminal lockdown)"
      - name: shipment_window_boundary_48h_inclusive_then_spoiled
        claim_type: valid_transition
        grounds:
          - "state_machines.Shipment"
          - "errors[ERR_TRANSIT_WINDOW_EXCEEDED]"
        distinguishing_aspect: "Transit window boundary: deliver at exactly departed_at + 48h succeeds (inclusive); at +48h+1s the deliver persists SPOILED and returns 422."
        test_recipe:
          setup:
            - "Full ACTIVE placement (forecast 200 fixture, safety stock 240) and a RELEASED lot of 100 units."
            - "Two shipments of 10 units each, both departed at 2026-09-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/product-lots"
              payload: { sku: "BEEF-5LB", produced_at: "2026-09-01T00:00:00Z", quantity_units: 100 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: true }
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/shipments"
              payload: { store_id: "${st_id}", lot_id: "${lot_id}", quantity_units: 10 }
              as: LogisticsCoordinator
              captures: { sh_a: $.data.id }
            - call: "POST /cold-chain/shipments"
              payload: { store_id: "${st_id}", lot_id: "${lot_id}", quantity_units: 10 }
              as: LogisticsCoordinator
              captures: { sh_b: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/shipments/${sh_a}/deliver"
              payload: { accepted_units: 10, rejected_units: 0 }
              as: LogisticsCoordinator
              captures: { sh_a_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T09:00:01Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/shipments/${sh_b}/deliver"
              payload: { accepted_units: 10, rejected_units: 0 }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /cold-chain/shipments/${sh_b}"
              as: LogisticsCoordinator
              captures: { sh_b_status: $.data.status }
          assert:
            - "shipment A delivered at exactly departed+48h: 200, status DELIVERED (boundary inclusive)"
            - "shipment B at +48h+1s: http 422, error_id == ERR_TRANSIT_WINDOW_EXCEEDED"
            - "GET shows shipment B status == SPOILED (failed deliver persisted the spoil transition)"
            - "lot buckets: in_store_qty == 10, spoiled_qty == 10, in_transit_qty == 0, unshipped_qty == 80"
      - name: dispatch_invalid_window_and_double_resolve_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceTicket.OPEN_to_DISPATCHED"
          - "errors[ERR_WINDOW_INVALID]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Dispatch rejects a zero/negative-length window (400 ERR_WINDOW_INVALID); resolve is legal from OPEN; a second resolve on the terminal ticket fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Store Alpha placement installed; one MANUAL OPEN ticket on the chiller."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
            - call: "POST /cold-chain/service-tickets"
              payload: { chiller_id: "${ch_id}", issue_summary: "rattling fan" }
              as: ServiceDispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/service-tickets/${tk_id}/dispatch"
              payload: { window_start: "2026-09-03T11:00:00Z", window_end: "2026-09-03T11:00:00Z" }
              as: ServiceDispatcher
              captures: { err_window: $.data.error_id }
            - call: "POST /cold-chain/service-tickets/${tk_id}/resolve"
              payload: { resolution_note: "tightened fan mount without dispatch" }
              as: FieldTechnician
              captures: { tk_status: $.data.status }
            - call: "POST /cold-chain/service-tickets/${tk_id}/resolve"
              payload: { resolution_note: "second attempt" }
              as: FieldTechnician
              captures: { err_second: $.data.error_id }
          assert:
            - "zero-length window: http 400, error_id == ERR_WINDOW_INVALID; ticket stays OPEN"
            - "resolve directly from OPEN succeeds: status == RESOLVED (dispatch is optional)"
            - "second resolve: http 409, error_id == ERR_INVALID_STATE (terminal lockdown)"
      - name: evaluate_retired_placement_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.Placement"
          - "errors[ERR_PLACEMENT_NOT_ACTIVE]"
        distinguishing_aspect: "evaluate-performance on a RETIRED placement is rejected ERR_PLACEMENT_NOT_ACTIVE; retired dimension values stay frozen."
        test_recipe:
          setup: ["Store Alpha placement with streak 2, retired via REMOVE UNDERPERFORMANCE_REMOVAL."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 10 }
              as: PlacementManager
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 20 }
              as: PlacementManager
            - call: "POST /cold-chain/placements/${pl_id}/retire"
              payload: { mode: "REMOVE", removal_reason: "UNDERPERFORMANCE_REMOVAL" }
              as: PlacementManager
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 90 }
              as: PlacementManager
              captures: { err: $.data.error_id }
          assert:
            - "http 409; error_id == ERR_PLACEMENT_NOT_ACTIVE"
            - "placement remains RETIRED with performance_status UNDERPERFORMING and underperforming_streak 2 (frozen)"
      - name: trial_campaign_auto_completes_after_window
        claim_type: valid_transition
        grounds:
          - "state_machines.TrialCampaign"
        distinguishing_aspect: "System lazy transition: a campaign whose end_date has passed (now > end_date + 1 day) materializes COMPLETED on read without any write."
        test_recipe:
          setup: ["Store Alpha with ACTIVE placement and one campaign [2026-09-10, 2026-09-20]."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
