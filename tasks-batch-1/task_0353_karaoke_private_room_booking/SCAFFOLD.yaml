    output: Payment
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this operation, or Customer acting on a reservation they do not own"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced venue/room/room_type/package/customer/reservation/child resource does not exist in scope"

  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, invalid enum, slot_end_utc not after slot_start_utc, numeric out of declared range"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid state for the requested transition (e.g. confirm non-HELD, check-in non-CONFIRMED, play non-PENDING, play when parent not CHECKED_IN, void non-PLACED)"

  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_room_version does not match the room's current version on reservation create"

  - id: ERR_STALE_RESERVATION_VERSION
    http: 412
    condition: "expected_reservation_version does not match the reservation's current version on extension create"

  - id: ERR_TIMING_WINDOW
    http: 409
    condition: "Confirm after slot_start_utc; check-in after slot_start_utc+grace_minutes; close with actual_end_utc before checked_in_at"

  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "party_size exceeds the reservation's room_type capacity"

  - id: ERR_ROOM_TYPE_MISMATCH
    http: 422
    condition: "Room not of requested room_type, room_type inactive, or package included_room_type_id != room's room_type_id"

  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "Requested [slot_start_utc, slot_end_utc) overlaps an active reservation (HELD/CONFIRMED/CHECKED_IN) on the same room"

  - id: ERR_EXTENSION_CONFLICT
    http: 409
    condition: "Extension window [old_end, new_end) overlaps a later active reservation on the same room"

  - id: ERR_ROOM_NOT_AVAILABLE
    http: 409
    condition: "Room must be AVAILABLE to be taken OUT_OF_SERVICE"

  - id: ERR_NOT_QUEUE_HEAD
    http: 409
    condition: "play attempted on a queue entry that is not play_order == 1 among PENDING entries"

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body validation failure not covered by a more specific 422 (defensive catch-all for field-level type errors)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VenueManager
    description: "Configures venue pricing/policy, room types, rooms, group packages, song catalog; runs ops/maintenance."
    identity: "opaque"
    exclusive_operations:
      - "POST /venues — create venue"
      - "POST /room-types — create room type"
      - "POST /rooms — create room"
      - "POST /rooms/{id}/maintenance — toggle room maintenance"
      - "POST /group-packages — create group package"
    shared_operations:
      - "POST /songs — add song (with FrontDesk)"
      - "POST /venues/{id}/_clock/set, POST /venues/{id}/_ops/run (with FrontDesk)"
      - "all GET reads"

  - name: FrontDesk
    description: "Operates the venue floor: check-in, close, queue playback, F&B voids, ops sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations/{id}/check-in — check in"
      - "POST /reservations/{id}/close — close & settle"
      - "POST /queue-entries/{id}/play — play head of queue"
      - "POST /queue-entries/{id}/skip — skip queue entry"
      - "POST /fb-orders/{id}/void — void F&B line"
    shared_operations:
      - "POST /customers — register customer (with Customer)"
      - "POST /reservations — create reservation (with Customer)"
      - "POST /reservations/{id}/confirm, /cancel (with owning Customer)"
      - "POST /reservations/{id}/extensions (with owning Customer)"
      - "POST /reservations/{id}/queue, /reservations/{id}/fb-orders (with owning Customer)"
      - "POST /songs, /venues/{id}/_clock/set, /venues/{id}/_ops/run (with VenueManager)"
      - "all GET reads"

  - name: Customer
    description: "Books and manages own reservations: create, confirm, cancel, extend, queue songs, place F&B orders."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /customers — self-register (with FrontDesk)"
      - "POST /reservations — create own reservation (with FrontDesk)"
      - "POST /reservations/{id}/confirm — confirm own reservation"
      - "POST /reservations/{id}/cancel — cancel own reservation"
      - "POST /reservations/{id}/extensions — extend own reservation"
      - "POST /reservations/{id}/queue — queue song in own reservation"
      - "DELETE /queue-entries/{id} — cancel own queued song"
      - "POST /reservations/{id}/fb-orders — order F&B on own reservation"
      - "all GET reads"
