              captures: { own2_err: $.data.error_id }
            - call: "POST /allocations/${alloc1_id}/fill"
              payload: { expected_allocation_version: "${alloc1_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { own3_status: $.data.status }
          assert:
            - "${own1_err} == ERR_NOT_RESOURCE_OWNER with HTTP 403, not ERR_UNAUTHORIZED and not ERR_ALLOCATION_NOT_FOUND"
            - "${own2_err} == ERR_NOT_RESOURCE_OWNER — the ownership guard covers the read as well as the write"
            - "${own3_status} == FILLED for the owning distributor with the SAME expected_allocation_version, proving the earlier refusal did not consume the version"

      - name: distributor_cannot_create_an_allocation_for_another_account
        claim_type: ownership_denial
        grounds:
          - "validations.V-OWN-2"
          - "errors.ERR_NOT_RESOURCE_OWNER"
        distinguishing_aspect: |
          V-OWN-2 reads the BODY's distributor_id rather than an existing row's, so it is the
          only ownership check that applies on a create. A PlantAdmin sending the identical
          payload is unaffected, which shows the rule keys on the role and not on the field.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *distCert
            - *rmResin
            - *rmStab
