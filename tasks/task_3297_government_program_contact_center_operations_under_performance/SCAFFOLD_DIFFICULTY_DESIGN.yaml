scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: asa_provisional_vs_official_after_late_answer
    grounds:
    - calculations.measured_asa
    - endpoints.POST_/invoices/{id}/recompute
    - state_machines.Call.WAITING_to_ASSIGNED
    distinguishing_aspect: 'On the Call/measurement domain, the provisional ASA variant (input set

      frozen at prepare) differs from the official variant (input set

      re-taken at recompute): a call answered after prepare enters the

      official set and drags the mean from 20 seconds to 30 seconds on

      identical period data.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. ACTIVE contract with one EFFECTIVE ASA SL (target 30). Two certified agents and one OPEN queue.
      - Call A enqueued 09:00 answered 09:00:20 (answer_seconds 20); call B enqueued 10:00 still WAITING at prepare time.
      - 'Invoice for 2026-09 prepared while B is WAITING: provisional ASA = 20 (B excluded — not yet ANSWERED).'
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /contracts
        payload:
          agency_name: State Benefits Agency
          measurement_tz: UTC
          cap_absolutes: false
        as: PlatformAdmin
        captures:
          c_id: $.data.id
          c_id_v0: $.data.version
      - &id005
        call: POST /service-levels
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          metric: ASA
          target: 30
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          sl_asa_id: $.data.id
      - &id006
        call: POST /service-levels/${sl_asa_id}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${c_id_v0}
        as: OpsManager
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent Two
          languages:
          - en
        as: OpsManager
        captures:
          a2_id: $.data.id
      - &id003
        call: POST /training-courses
        payload:
          program_code: MEDICAID
          required: true
        as: KnowledgeManager
        captures:
          course_id: $.data.id
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a2_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - &id004
        call: POST /queues
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          queue_type: GENERAL
        as: OpsManager
        captures:
          q_id: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-10T09:00:00Z'
        as: Supervisor
        captures:
          call_a: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${call_a}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        as_user_id: sup-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T09:00:20Z'
        as: PlatformAdmin
      - call: POST /calls/${call_a}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-10T10:00:00Z'
        as: Supervisor
        captures:
          call_b: $.data.id
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          inv_id: $.data.id
      - call: POST /invoices/${inv_id}/prepare
        payload: {}
        as: BillingAnalyst
        captures:
          inv_v: $.data.version
      trigger:
      - call: POST /calls/${call_b}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        as_user_id: sup-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T10:00:40Z'
        as: PlatformAdmin
      - call: POST /calls/${call_b}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a2_id}
      - call: POST /invoices/${inv_id}/recompute
        payload: {}
        as: BillingAnalyst
      assert:
      - 'after prepare, the ASA InvoiceLine on Invoice.${inv_id} had measured_value == 20 (provisional: only call A''s 20s counts)'
      - 'after recompute, the same line''s measured_value == 30 (official: (20 + 40) / 2)'
      - the line's compliant flag is true at 30 because measured_value <= target 30 uses <=
      - Invoice.${inv_id}.version advanced across the recompute
  - name: qa_avg_provisional_vs_official_after_dispute_upheld
    grounds:
    - calculations.measured_qa_avg
    - state_machines.QualityReview.DISPUTED_to_UPHELD
    - endpoints.POST_/invoices/{id}/recompute
    distinguishing_aspect: 'On the QualityReview/scoring domain (different entity domain than the

      ASA instance), the provisional QA_AVG excludes a review still DISPUTED

      at prepare time; once the dispute resolves UPHELD the official variant

      admits it, moving the mean from 50.00 to 65.00 — a null/empty-set and

      finality-gating difference, not a second provisional/final copy on ASA.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract with EFFECTIVE QA_AVG SL (target 80).
      - 'Two COMPLETED calls in 2026-09, each with a QualityReview: R1 ACCEPTED with total 50; R2 DISPUTED with total 80 at prepare time.'
      - 'Invoice prepared while R2 is DISPUTED: provisional QA_AVG = 50.00 (R2 not final).'
      setup_api_calls:
      - *id001
      - *id002
      - call: POST /service-levels
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          metric: QA_AVG
          target: 80
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          sl_qa_id: $.data.id
      - call: POST /service-levels/${sl_qa_id}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${c_id_v0}
        as: OpsManager
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent Two
          languages:
          - en
        as: OpsManager
        captures:
          a2_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a2_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          qcall_1: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:05:00Z'
        as: Supervisor
        captures:
          qcall_2: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${qcall_1}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${qcall_1}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:01:00Z'
        as: PlatformAdmin
      - call: POST /calls/${qcall_1}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:05:00Z'
        as: PlatformAdmin
      - call: POST /calls/${qcall_2}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${qcall_2}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a2_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:06:00Z'
        as: PlatformAdmin
      - call: POST /calls/${qcall_2}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${a2_id}
      - call: POST /quality-reviews
        payload:
          call_id: ${qcall_1}
          accuracy_score: 50
          compliance_score: 50
        as: QualityAnalyst
        captures:
          rev_1: $.data.id
      - call: POST /quality-reviews/${rev_1}/transition
        payload:
          to_status: ACCEPTED
        as: QualityAnalyst
      - call: POST /quality-reviews
        payload:
          call_id: ${qcall_2}
          accuracy_score: 80
          compliance_score: 80
        as: QualityAnalyst
        captures:
          rev_2: $.data.id
      - call: POST /quality-reviews/${rev_2}/transition
        payload:
          to_status: DISPUTED
        as: Agent
        as_user_id: ${a2_id}
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          qinv_id: $.data.id
      - call: POST /invoices/${qinv_id}/prepare
        payload: {}
        as: BillingAnalyst
      trigger:
      - call: POST /quality-reviews/${rev_2}/transition
        payload:
          to_status: UPHELD
        as: QualityAnalyst
      - call: POST /invoices/${qinv_id}/recompute
        payload: {}
        as: BillingAnalyst
      assert:
      - after prepare, the QA_AVG InvoiceLine measured_value == 50.00 (only the final R1 counts)
      - after recompute, measured_value == 65.00 (mean of 50 and 80, 2dp)
      - QualityReview.${rev_2}.final == true after UPHELD
      - the line's compliant flag is false at 65.00 because 65.00 < target 80
- rule_id: combinatorial_formula
  instances:
  - name: quality_total_score_single_rounding
    grounds:
    - calculations.quality_total_score
    - entities.QualityReview.fields.total_score
    distinguishing_aspect: 'Mode (b) nested rounding: the weighted sum 0.3*55 + 0.7*62 = 59.9 is

      rounded ONCE to 60; the rejected component-first rounding

      (round(16.5) + round(43.4) = 17 + 43 = 60 happens to agree, so the

      discriminating probe is 0.3*55 + 0.7*63 = 60.6 -> 61 vs

      round(16.5)=17 + round(44.1)=44 = 61 — the scaffold pins

      single-rounding via the .5 half-up case 0.3*55+0.7*62 where any

      round-half-even drift would surface).

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract, queue, certified agent, one COMPLETED call.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          scall: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${scall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${scall}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /calls/${scall}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${a1_id}
      trigger:
      - call: POST /quality-reviews
        payload:
          call_id: ${scall}
          accuracy_score: 55
          compliance_score: 62
          accuracy_weight: 0.3
        as: QualityAnalyst
        captures:
          srev: $.data.id
      - call: POST /quality-reviews
        payload:
          call_id: ${scall}
          accuracy_score: 55
          compliance_score: 63
          accuracy_weight: 0.3
        as: QualityAnalyst
        captures:
          srev2: $.data.id
      assert:
      - QualityReview.${srev}.total_score == 60 (0.3*55 + 0.7*62 = 59.9, single round_half_up)
      - QualityReview.${srev2}.total_score == 61 (0.3*55 + 0.7*63 = 60.6)
      - 'total_score never double-rounds: 59.9 must not become 59 via round-half-even or component-first paths that differ'
  - name: gross_fee_evaluation_order_and_rounding
    grounds:
    - calculations.gross_fee
    - calculations.staffing_target
    - entities.Invoice.fields.gross_cents
    distinguishing_aspect: 'Mode (a)+(c) hybrid on the invoice domain: gross has a >=3-input non-linear interaction (per-program agent counts
      x cert counts x max(1.0, surge multiplier) tier selection) with a pinned evaluation order — per-program subtotals at full precision, summed,
      rounded ONCE. With one MEDICAID program, 1 active agent with 1 standing cert and surge factor 1.25: 50000 + round_half_up(4000 * 1 * 1.25)
      = 55000; the pinned order also governs the circular-looking dependency between gross (which needs the surge multiplier) and the staffing
      target (which reads the same selector) — both derive from the same window resolution, computed before any withholding.'
    test_recipe:
      setup:
      - Clock at 2026-09-20 (inside surge window 2026-09-15..2026-09-30). ACTIVE contract with EFFECTIVE ASA SL; one ACTIVE certified agent for
        MEDICAID; surge window factor 1.25 ACTIVE.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - call: POST /surge-windows
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          surge_type: ENROLLMENT_PERIOD
          starts_on: '2026-09-15T00:00:00Z'
          ends_on: '2026-09-30T00:00:00Z'
          expected_volume_factor: 1.25
        as: OpsManager
        captures:
          sw_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          ginv_id: $.data.id
      trigger:
      - call: POST /invoices/${ginv_id}/prepare
        payload: {}
        as: BillingAnalyst
      assert:
      - SurgeWindow.${sw_id}.status == ACTIVE (auto-transition at clock 2026-09-20)
      - Invoice.${ginv_id}.gross_cents == 55000 (50000 + round_half_up(4000 * 1 * 1.25) = 50000 + 5000, single rounding of the summed subtotal)
      - the ASA InvoiceLine.staffing_target == 13 (ceil(10 * 1.25))
      - the line's staffing_actual == 1, so compliant == false regardless of measured ASA
- rule_id: non_linear_state_machine
  instances:
  - name: invoice_revision_loop_restores_draft_and_recomputes
    grounds:
    - state_machines.Invoice.REJECTED_to_DRAFT
    - state_machines.Invoice.SUBMITTED_to_REJECTED
    - endpoints.POST_/invoices/{id}/transition
    distinguishing_aspect: 'Invoice is cyclic: DRAFT -> SUBMITTED -> REJECTED -> DRAFT is a true

      loop (not a long linear pipeline), and re-entering DRAFT the second

      time preserves the synthesized lines while /recompute refreshes them

      against the official variant — the cycle''s re-entry semantics are the

      observable.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract with EFFECTIVE ASA SL; invoice prepared and submitted.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          rinv_id: $.data.id
      - call: POST /invoices/${rinv_id}/prepare
        payload: {}
        as: BillingAnalyst
      - call: POST /invoices/${rinv_id}/transition
        payload:
          to_status: SUBMITTED
        as: BillingAnalyst
      trigger:
      - call: POST /invoices/${rinv_id}/transition
        payload:
          to_status: REJECTED
        as: OpsManager
      - call: POST /invoices/${rinv_id}/transition
        payload:
          to_status: DRAFT
        as: BillingAnalyst
      - call: POST /invoices/${rinv_id}/recompute
        payload: {}
        as: BillingAnalyst
      assert:
      - Invoice.${rinv_id}.status == DRAFT after the REJECTED -> DRAFT hop
      - GET /invoices/${rinv_id}/lines still returns 1 line (lines retained through the loop)
      - the recomputed line's measured_value == 0 (empty ASA input set yields 0, compliant)
      - Invoice.${rinv_id} may transition SUBMITTED again after the loop
  - name: quality_review_dispute_cycle_overturned_excludes_from_qa
    grounds:
    - state_machines.QualityReview.SUBMITTED_to_DISPUTED
    - state_machines.QualityReview.DISPUTED_to_OVERTURNED
    distinguishing_aspect: 'QualityReview is branching/cyclic-shaped (SUBMITTED -> DISPUTED ->

      {UPHELD, OVERTURNED}), a different entity than Invoice: the

      OVERTURNED branch keeps final == false forever, so the review is

      excluded from QA_AVG — the two branches of the fork carry different

      side-effect sets (UPHELD fires the coaching cascade; OVERTURNED

      does not).

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract, queue, certified agent a1, one COMPLETED call with a SUBMITTED review scoring 65 (below the auto-coach
        threshold 70), disputed by the answering agent.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          dcall: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${dcall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${dcall}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /calls/${dcall}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /quality-reviews
        payload:
          call_id: ${dcall}
          accuracy_score: 65
          compliance_score: 65
        as: QualityAnalyst
        captures:
          drev: $.data.id
      - call: POST /quality-reviews/${drev}/transition
        payload:
          to_status: DISPUTED
        as: Agent
        as_user_id: ${a1_id}
      trigger:
      - call: POST /quality-reviews/${drev}/transition
        payload:
          to_status: OVERTURNED
        as: QualityAnalyst
      assert:
      - QualityReview.${drev}.status == OVERTURNED and final == false
      - GET /coaching-plans?agent_id=${a1_id} returns 0 rows (OVERTURNED branch fires no coaching cascade, unlike UPHELD at score 65 < 70)
      - a subsequent transition attempt on ${drev} fails ERR_INVALID_STATE (terminal lockdown)
- rule_id: transitive_cascade
  instances:
  - name: publish_invalidates_cert_unroutes_agent_forces_overflow
    grounds:
    - state_machines.KnowledgeArticle.DRAFT_to_PUBLISHED
    - calculations.queue_selector
    - calculations.agent_selector
    distinguishing_aspect: 'Depth-3 cascade from article publish: publish KnowledgeArticle -> mutates Certification (invalidated_at set because
      training completion predates effective_at) -> that mutation empties the certified-agent pool on every queue for the program -> routing the
      next call fails ERR_NO_ELIGIBLE_QUEUE (both primary and overflow pools empty). Each link is caused by the previous one, not fan-out from
      the publish.'
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract; primary queue MEDICAID/en with overflow to a second MEDICAID/en queue; single certified agent a1
        (certified 2026-09-01 via course completion).
      - Article for MEDICAID with effective_at 2026-09-10 published on 2026-09-10; a1's certification predates the rule.
      - One WAITING call routed after the publish.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
