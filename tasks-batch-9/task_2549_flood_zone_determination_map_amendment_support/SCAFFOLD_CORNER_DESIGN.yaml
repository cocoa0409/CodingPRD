      - name: corner_datum_conversion_rounds_twice_at_one_decimal
        claim_type: precision
        grounds:
          - calculations.elevation_certificate_conversion
          - entities.ElevationCertificate.converted_lowest_floor_ft
        distinguishing_aspect: "A TX certificate whose shifted elevation lands on 8.19 against a BFE of 8.05 separates the pinned round-then-subtract order (0.2) from a single terminal rounding (0.1), and the lag value exercises round_half_up on an exact .05 tie."
        test_recipe:
          setup:
            - "TX community (DATUM_OFFSET_FT[TX] == -0.87), panel seq 1 EFFECTIVE zone AE with base_flood_elevation_ft 8.05"
            - "certificate on the structure: datum NGVD29, raw_lowest_floor_elevation_ft 9.06, raw_lowest_adjacent_grade_ft 8.94, survey_date 2026-07-01 (inside CERTIFICATE_VALIDITY_DAYS 365 of the 2026-08-01 clock)"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
