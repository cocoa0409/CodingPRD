  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: termination_forfeiture_cascade_depth_four
        grounds:
          - state_machines.Participant.ACTIVE_to_TERMINATED
          - state_machines.VestingTranche.UNVESTED_to_FORFEITED
          - state_machines.Grant.GRANTED_to_PARTIALLY_FORFEITED
          - calculations.termination_vesting_resolution
          - calculations.fungible_weighted_shares
          - calculations.share_reserve_ledger
          - calculations.burn_rate_variants
          - calculations.post_termination_exercise_period
          - entities.EquityPlan.fields.reserve_posture
        distinguishing_aspect: |
          Trigger POST /participants/{id}/terminate drives a four-link chain in which every
          link is caused by the previous one: tranche 2 forfeits (hop 1), which forces the
          owning Grant to recompute weighted_reserve_shares 60000 -> 22500 and move to
          PARTIALLY_FORFEITED (hop 2), which credits 37500 shares back to the plan ledger
          (hop 3), which alone lifts available_reserve_shares from 40000 to 77500 and flips
          reserve_posture RESTRICTED -> OPEN (hop 4).
