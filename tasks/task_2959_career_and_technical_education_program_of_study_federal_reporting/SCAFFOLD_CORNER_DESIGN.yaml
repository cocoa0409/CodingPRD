      - name: alignment_index_reaches_its_ceiling_and_loses_the_breadth_bonus_below_the_articulation_floor
        claim_type: weighted_scoring
        grounds:
          - calculations.program_alignment_index
          - entities.ProgramOfStudy.fields.alignment_index
          - endpoints[PATCH /cte/sequence-courses/{id}]
          - endpoints[POST /cte/programs-of-study/{id}/submit]
        distinguishing_aspect: |
          The three weights DEPTH_WEIGHT 0.6, BRIDGE_WEIGHT 0.3 and BREADTH_BONUS 0.1 sum to exactly 1.0, so a program
          that saturates both factors must land on the 1.0000 ceiling and no higher. Shaving the articulated hours from
          3.00 to 2.99 then crosses ARTICULATION_FLOOR downwards, which removes the whole 0.1 bonus AND scales the bridge
          factor, so the index drops by more than the bonus alone: 0.8990, not 0.9000. An implementation that rounds each
          weighted term separately, or that treats the floor as exclusive at 3.00, cannot produce both literals.
        test_recipe:
