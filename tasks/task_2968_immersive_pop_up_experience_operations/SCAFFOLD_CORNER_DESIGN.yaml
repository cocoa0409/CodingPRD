      - name: themed_room_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ThemedRoom
          - endpoints[POST /themed-rooms]
          - endpoints[GET /themed-rooms/{roomId}]
        distinguishing_aspect: |
          ThemedRoom is the one entity declared common_fields: false. Its rows therefore carry no
          version and no status, and §1.5 offers no PATCH and no DELETE for them — the only way to
          change the run's room set is to create another room while the run is still PLANNED. The
          falsifiable consequence: the create response and the GET response must have no version
          key at all, while a sibling entity created in the same chain does have one.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation."
          setup_api_calls:
