  - { method: GET, path: "/jurisdictions/{jurisdictionId}", description: "Get a jurisdiction", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Jurisdiction, side_effects: [] }

  # --- Operator ---
  - { method: POST, path: "/operators", description: "Register an operator (PENDING)", roles: [TaxAdmin], code: 201, input: [jurisdiction_id, legal_name, filing_frequency], output: Operator, side_effects: ["status=PENDING; account_balance_cents=0"] }
  - { method: GET, path: "/operators", description: "List/filter operators", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["jurisdiction_id?", "status?", "limit?", "offset?"], output: "Operator[]", side_effects: [] }
  - { method: GET, path: "/operators/{operatorId}", description: "Get an operator", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Operator, side_effects: [] }
  - { method: POST, path: "/operators/{operatorId}/activate", description: "Issue certificate, activate", roles: [TaxAdmin], code: 200, input: [], output: Operator, side_effects: ["mint certificate_number; status->ACTIVE"] }
  - { method: POST, path: "/operators/{operatorId}/suspend", description: "Suspend operator", roles: [TaxAdmin], code: 200, input: ["reason?"], output: Operator, side_effects: ["status->SUSPENDED"] }
  - { method: POST, path: "/operators/{operatorId}/reinstate", description: "Reinstate suspended operator", roles: [TaxAdmin], code: 200, input: [], output: Operator, side_effects: ["status->ACTIVE (re-eval DELINQUENT)"] }
  - { method: POST, path: "/operators/{operatorId}/revoke", description: "Revoke certificate", roles: [TaxAdmin], code: 200, input: [], output: Operator, side_effects: ["status->REVOKED"] }
  - { method: POST, path: "/operators/{operatorId}/close", description: "Close operator account", roles: [TaxAdmin], code: 200, input: [], output: Operator, side_effects: ["status->CLOSED"] }
  - { method: POST, path: "/operators/{operatorId}/liens", description: "Record a tax lien (OCC on operator.version)", roles: [TaxAdmin], code: 201, input: [expected_operator_version], output: Lien, side_effects: ["snapshot amount_cents=account_balance_cents; status=RECORDED; increments Operator.version by 1"] }
  - { method: GET, path: "/operators/{id}/liens", description: "List liens for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["status?"], output: "Lien[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/properties", description: "List properties for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/ota-agreements", description: "List OTA agreements for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "OTAAgreement[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/returns", description: "List returns for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["filing_status?", "settlement_status?"], output: "TaxReturn[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/audits", description: "List audits for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "Audit[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/refund-claims", description: "List refund claims for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "RefundClaim[]", side_effects: [] }
  - { method: GET, path: "/operators/{id}/ledger-entries", description: "List ledger entries for an operator (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "LedgerEntry[]", side_effects: [] }

  # --- Property ---
  - { method: POST, path: "/properties", description: "Create a property under an operator", roles: [TaxAdmin, Operator], code: 201, input: [operator_id, name, address], output: Property, side_effects: ["active=true"] }
  - { method: GET, path: "/properties/{propertyId}", description: "Get a property", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Property, side_effects: [] }

  # --- OTA Platform & Agreement ---
  - { method: POST, path: "/ota-platforms", description: "Create an OTA platform", roles: [TaxAdmin], code: 201, input: [name, "registered?"], output: OTAPlatform, side_effects: [] }
  - { method: GET, path: "/ota-platforms/{platformId}", description: "Get an OTA platform", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: OTAPlatform, side_effects: [] }
  - { method: POST, path: "/ota-agreements", description: "Propose an OTA collection agreement", roles: [TaxAdmin, Operator], code: 201, input: [operator_id, platform_id, collection_method, effective_date, "end_date?"], output: OTAAgreement, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/ota-agreements", description: "List/filter OTA agreements (FK reverse by platform)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["platform_id?", "operator_id?", "status?"], output: "OTAAgreement[]", side_effects: [] }
  - { method: GET, path: "/ota-agreements/{agreementId}", description: "Get an OTA agreement", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: OTAAgreement, side_effects: [] }
  - { method: POST, path: "/ota-agreements/{agreementId}/activate", description: "Activate an OTA agreement", roles: [TaxAdmin], code: 200, input: [], output: OTAAgreement, side_effects: ["status->ACTIVE"] }
  - { method: POST, path: "/ota-agreements/{agreementId}/terminate", description: "Terminate an OTA agreement", roles: [TaxAdmin], code: 200, input: [], output: OTAAgreement, side_effects: ["status->TERMINATED"] }

  # --- Tax Return ---
  - { method: POST, path: "/returns", description: "Create a draft return", roles: [TaxAdmin, Operator], code: 201, input: [operator_id, period_start, period_end, "reporting_method?", line_items], output: TaxReturn, side_effects: ["filing_status=DRAFT; settlement_status=UNPAID; compute due_date, gross_receipts_cents"] }
  - { method: GET, path: "/returns/{returnId}", description: "Get a return", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: TaxReturn, side_effects: [] }
  - { method: POST, path: "/returns/{returnId}/file", description: "File a return", roles: [Operator], code: 200, input: [], output: TaxReturn, side_effects: ["filing_status->FILED; compute tax; post ledger; possible penalty/interest & DELINQUENT cascade"] }
  - { method: POST, path: "/returns/{returnId}/amend", description: "Amend a filed return", roles: [Operator], code: 200, input: ["line_items?"], output: TaxReturn, side_effects: ["filing_status->AMENDED; recompute tax; post ADJUSTMENT ledger delta"] }
  - { method: GET, path: "/returns/{id}/exemptions", description: "List exemption claims for a return (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["status?"], output: "ExemptionClaim[]", side_effects: [] }
  - { method: GET, path: "/returns/{id}/remittances", description: "List remittances for a return (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "Remittance[]", side_effects: [] }

  # --- Exemption Claim ---
  - { method: POST, path: "/exemptions", description: "Claim an exemption on a return", roles: [TaxAdmin, Operator], code: 201, input: [tax_return_id, exemption_type, guest_ref, "stay_nights?", amount_cents], output: ExemptionClaim, side_effects: ["status=CLAIMED"] }
  - { method: GET, path: "/exemptions/{exemptionId}", description: "Get an exemption claim", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: ExemptionClaim, side_effects: [] }
  - { method: POST, path: "/exemptions/{exemptionId}/verify", description: "Verify an exemption", roles: [TaxAdmin], code: 200, input: [], output: ExemptionClaim, side_effects: ["status->VERIFIED"] }
  - { method: POST, path: "/exemptions/{exemptionId}/reject", description: "Reject an exemption", roles: [TaxAdmin], code: 200, input: [], output: ExemptionClaim, side_effects: ["status->REJECTED; move amount to taxable; recompute tax; post ADJUSTMENT"] }

  # --- Remittance ---
  - { method: POST, path: "/remittances", description: "Record a remittance against a return", roles: [TaxAdmin, Operator], code: 201, input: [tax_return_id, remitter, amount_cents, "ota_agreement_id?"], output: Remittance, side_effects: ["status=RECEIVED"] }
  - { method: GET, path: "/remittances", description: "List/filter remittances (FK reverse by return & agreement)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["tax_return_id?", "ota_agreement_id?", "status?"], output: "Remittance[]", side_effects: [] }
  - { method: GET, path: "/remittances/{remittanceId}", description: "Get a remittance", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Remittance, side_effects: [] }
  - { method: POST, path: "/remittances/{remittanceId}/clear", description: "Clear a remittance", roles: [TaxAdmin], code: 200, input: [], output: Remittance, side_effects: ["status->CLEARED; post ledger; recompute settlement; DELINQUENT->ACTIVE + lien release cascade"] }
  - { method: POST, path: "/remittances/{remittanceId}/reverse", description: "Reverse a cleared remittance", roles: [TaxAdmin], code: 200, input: [], output: Remittance, side_effects: ["status->REVERSED; post reversal ledger; recompute settlement"] }

  # --- Audit & Assessment ---
  - { method: POST, path: "/audits", description: "Open an audit on an operator", roles: [Auditor], code: 201, input: [operator_id, period_start, period_end], output: Audit, side_effects: ["status=OPENED"] }
  - { method: GET, path: "/audits/{auditId}", description: "Get an audit", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Audit, side_effects: [] }
  - { method: POST, path: "/audits/{auditId}/begin-fieldwork", description: "Begin fieldwork", roles: [Auditor], code: 200, input: [], output: Audit, side_effects: ["status->FIELDWORK"] }
  - { method: POST, path: "/audits/{auditId}/assessments", description: "Propose an assessment", roles: [Auditor], code: 201, input: [audited_taxable_cents, classification], output: Assessment, side_effects: ["Audit.status->PROPOSED; Audit.classification set; Assessment status=PROPOSED; compute assessed_tax/deficiency/penalty/interest"] }
  - { method: GET, path: "/audits/{id}/assessments", description: "List assessments for an audit (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "Assessment[]", side_effects: [] }
  - { method: POST, path: "/audits/{auditId}/record-response", description: "Record taxpayer response", roles: [Auditor], code: 200, input: ["note?"], output: Audit, side_effects: ["status->RESPONSE"] }
  - { method: POST, path: "/audits/{auditId}/reopen-fieldwork", description: "Return to fieldwork (cyclic)", roles: [Auditor], code: 200, input: [], output: Audit, side_effects: ["status->FIELDWORK; PROPOSED assessment->ABATED"] }
  - { method: POST, path: "/audits/{auditId}/close-no-change", description: "Close audit with no change", roles: [Auditor], code: 200, input: [], output: Audit, side_effects: ["status->CLOSED_NO_CHANGE"] }
  - { method: GET, path: "/assessments/{assessmentId}", description: "Get an assessment", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Assessment, side_effects: [] }
  - { method: POST, path: "/assessments/{assessmentId}/issue", description: "Issue an assessment (TaxAdmin four-eyes)", roles: [TaxAdmin], code: 200, input: [], output: Assessment, side_effects: ["Assessment & Audit ->ISSUED; post ASSESSMENT ledger; DELINQUENT cascade"] }
  - { method: POST, path: "/assessments/{assessmentId}/appeals", description: "Submit an appeal", roles: [Operator], code: 201, input: [grounds], output: Appeal, side_effects: ["Assessment->APPEALED; Appeal status=SUBMITTED"] }
  - { method: GET, path: "/assessments/{id}/appeals", description: "List appeals for an assessment (FK reverse)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: "Appeal[]", side_effects: [] }

  # --- Appeal ---
  - { method: GET, path: "/appeals/{appealId}", description: "Get an appeal", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: POST, path: "/appeals/{appealId}/begin-review", description: "Begin appeal review", roles: [TaxAdmin], code: 200, input: [], output: Appeal, side_effects: ["status->UNDER_REVIEW"] }
  - { method: POST, path: "/appeals/{appealId}/request-info", description: "Request more info (cyclic)", roles: [TaxAdmin], code: 200, input: [], output: Appeal, side_effects: ["status->INFO_REQUESTED"] }
  - { method: POST, path: "/appeals/{appealId}/provide-info", description: "Provide requested info (cyclic)", roles: [Operator], code: 200, input: [], output: Appeal, side_effects: ["status->UNDER_REVIEW; round_count+=1"] }
  - { method: POST, path: "/appeals/{appealId}/decide", description: "Decide an appeal", roles: [TaxAdmin], code: 200, input: [decision, "reduced_total_cents?"], output: Appeal, side_effects: ["status->DECIDED; drive Assessment FINAL/ABATED cascade"] }

  # --- Refund Claim ---
  - { method: POST, path: "/refund-claims", description: "Request a refund", roles: [TaxAdmin, Operator], code: 201, input: [operator_id, reason, principal_cents, overpayment_date, "tax_return_id?"], output: RefundClaim, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/refund-claims", description: "List/filter refund claims (FK reverse by return)", roles: [TaxAdmin, Operator, Auditor], code: 200, input: ["operator_id?", "tax_return_id?", "status?"], output: "RefundClaim[]", side_effects: [] }
  - { method: GET, path: "/refund-claims/{refundId}", description: "Get a refund claim", roles: [TaxAdmin, Operator, Auditor], code: 200, input: [], output: RefundClaim, side_effects: [] }
  - { method: POST, path: "/refund-claims/{refundId}/approve", description: "Approve a refund (compute interest)", roles: [TaxAdmin], code: 200, input: [], output: RefundClaim, side_effects: ["status->APPROVED; compute interest_cents/total_refund_cents"] }
  - { method: POST, path: "/refund-claims/{refundId}/deny", description: "Deny a refund", roles: [TaxAdmin], code: 200, input: [], output: RefundClaim, side_effects: ["status->DENIED"] }
  - { method: POST, path: "/refund-claims/{refundId}/pay", description: "Pay an approved refund", roles: [TaxAdmin], code: 200, input: [], output: RefundClaim, side_effects: ["status->PAID; post REFUND ledger"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: [TaxAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set; re-evaluates due_date/penalty windows on next mutation"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Operator identity does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, negative amount, invalid enum, or missing reduced_total_cents on REDUCED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the transition" }
  - { id: ERR_STALE_OPERATOR_VERSION, http: 412, condition: "expected_operator_version does not match Operator.version (lien record)" }
  - { id: ERR_OPERATOR_NOT_ACTIVE, http: 409, condition: "Filing requires parent Operator ACTIVE or DELINQUENT" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Return period overlaps another non-SUPERSEDED return for the operator" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "OTA agreement coverage overlaps another ACTIVE agreement for same operator+platform" }
  - { id: ERR_PLATFORM_NOT_REGISTERED, http: 409, condition: "OTA platform not registered" }
  - { id: ERR_OTA_AGREEMENT_INACTIVE, http: 409, condition: "Referenced OTA agreement not ACTIVE or does not cover the period" }
  - { id: ERR_EXEMPTION_INELIGIBLE, http: 422, condition: "LONG_TERM_30DAY stay_nights below jurisdiction minimum" }
  - { id: ERR_RECEIPTS_MISMATCH, http: 422, condition: "Sum of honored exemptions exceeds gross_receipts_cents (taxable would be negative) on file" }
  - { id: ERR_REMITTANCE_EXCEEDS_DUE, http: 422, condition: "Remittance amount exceeds remaining amount due" }
  - { id: ERR_REFUND_EXCEEDS_OVERPAYMENT, http: 422, condition: "Refund principal exceeds held overpayment credit" }
  - { id: ERR_BELOW_LIEN_THRESHOLD, http: 422, condition: "Delinquent balance does not strictly exceed lien_threshold_cents" }
  - { id: ERR_RETURN_UNDER_ASSESSMENT, http: 409, condition: "Cannot amend a return covered by an ISSUED/FINAL assessment" }
  - { id: ERR_NO_RETURNS_IN_PERIOD, http: 409, condition: "Audit has no FILED/AMENDED returns in its period to assess" }
  - { id: ERR_OPERATOR_NOT_SETTLED, http: 409, condition: "Cannot close operator with non-zero balance" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "Cannot close operator with an open audit" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TaxAdmin
    description: "Jurisdiction administrator: configures jurisdictions/platforms, registers & manages operators, verifies exemptions, clears/reverses remittances, issues assessments, decides appeals, records liens, approves refunds"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /operators, /operators/{id}/activate|suspend|reinstate|revoke|close|liens"
      - "POST /ota-platforms, /ota-agreements/{id}/activate|terminate"
      - "POST /exemptions/{id}/verify|reject"
      - "POST /remittances/{id}/clear|reverse"
      - "POST /assessments/{id}/issue"
      - "POST /appeals/{id}/begin-review|request-info|decide"
      - "POST /refund-claims/{id}/approve|deny|pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /operators (with Operator via delegated create for properties/agreements/returns/exemptions/remittances/refund-claims)"
  - name: Operator
    description: "Registered lodging operator: manages own properties, proposes OTA agreements, files/amends returns, claims exemptions, records remittances, submits appeals, provides appeal info, requests refunds"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /returns/{id}/file|amend"
      - "POST /assessments/{id}/appeals"
      - "POST /appeals/{id}/provide-info"
    shared_operations:
      - "POST /properties, /ota-agreements, /returns, /exemptions, /remittances, /refund-claims (shared create with TaxAdmin)"
      - "GET endpoints"
  - name: Auditor
    description: "Tax auditor: opens audits, conducts fieldwork, proposes assessments and classification, records responses, closes-no-change; cannot issue assessments (four-eyes: issuance is TaxAdmin)"
    identity: opaque
    exclusive_operations:
      - "POST /audits, /audits/{id}/begin-fieldwork|assessments|record-response|reopen-fieldwork|close-no-change"
    shared_operations:
      - "GET endpoints"
