# §1.9 Scaffold Corner Design — breadth index for task 2409
# (Fountain Beverage Equipment Service & Syrup Supply)
#
# Companion to SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8, the depth index). Every
# section / claim_type below comes verbatim from
# references/claim-extraction-guide.md; every grounds: ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by a named §1.8 instance
# carry an `excluded_because:` stub instead of a test_recipe.
#
# Logical clock: every chain pins it explicitly to 2026-08-01T00:00:00Z (the
# scaffold's declared default) so date arithmetic in the asserts is stable.

scaffold_corner_design:

  # ===========================================================================
  # ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: outlet_creation_with_all_input_fields_returns_full_entity
        claim_type: creation
        grounds:
          - endpoints[POST /fountain-network/outlets]
          - entities.Outlet.fields.throughput_tier
          - entities.Outlet.fields.water_hardness_gpg
        distinguishing_aspect: "POST /fountain-network/outlets with every declared input field returns 201 and echoes name, account_code, region_code, throughput_tier LARGE and water_hardness_gpg 25 alongside the server-stamped status ACTIVE."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST", throughput_tier: "LARGE", water_hardness_gpg: 25 }
              as: NetworkAdmin
              captures: { o: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Outlet.${o}.name == \"Riverside Diner\""
            - "Outlet.${o}.account_code == \"OUT-1001\""
            - "Outlet.${o}.region_code == \"R-WEST\""
            - "Outlet.${o}.throughput_tier == LARGE"
            - "Outlet.${o}.water_hardness_gpg == 25"
            - "Outlet.${o}.status == ACTIVE"
            - "Outlet.${o}.version == 1"

      - name: outlet_creation_omitting_optionals_applies_tier_and_hardness_defaults
        claim_type: defaults
        grounds:
          - entities.Outlet.fields.throughput_tier
          - entities.Outlet.fields.water_hardness_gpg
        distinguishing_aspect: "Omitting throughput_tier and water_hardness_gpg yields exactly MEDIUM and 10 — the two declared defaults — not null and not a rejection."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Corner Deli", account_code: "OUT-1002", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
          assert:
            - "Outlet.${o}.throughput_tier == MEDIUM"
            - "Outlet.${o}.water_hardness_gpg == 10"

      - name: outlet_system_and_computed_fields_stamped_on_create
        claim_type: system_fields
        grounds:
          - entities.Outlet.fields.status
          - entities.Outlet.fields.service_posture
          - entities.Outlet.fields.open_compliance_hold_count
          - entities.Outlet.fields.overdue_task_count
          - entities.Outlet.fields.last_hold_placed_by_user_id
        distinguishing_aspect: "status, service_posture, both counters, last_hold_placed_by_user_id and version are absent from the endpoint's input: schema and are stamped by the server as ACTIVE / OPEN / 0 / 0 / null / 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
          assert:
            - "Outlet.${o}.id is a non-null string and ${ov} == 1"
            - "Outlet.${o}.created_at is a non-null ISO 8601 UTC timestamp"
            - "Outlet.${o}.status == ACTIVE"
            - "Outlet.${o}.service_posture == OPEN"
            - "Outlet.${o}.open_compliance_hold_count == 0"
            - "Outlet.${o}.overdue_task_count == 0"
            - "Outlet.${o}.last_hold_placed_by_user_id == null"

      - name: outlet_creation_missing_account_code_rejected
        claim_type: required_fields
        grounds:
          - entities.Outlet.fields.account_code
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "account_code has source: input and no default, so omitting it returns ERR_INVALID_REQUEST 400 and no Outlet row is created."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /fountain-network/outlets returns total_count == 0"

      - name: outlet_undeclared_throughput_tier_enum_member_rejected
        claim_type: type_constraints
        grounds:
          - entities.Outlet.fields.throughput_tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "throughput_tier accepts only SMALL, MEDIUM or LARGE; the undeclared member HUGE returns ERR_INVALID_REQUEST 400 rather than falling back to the MEDIUM default."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST", throughput_tier: "HUGE" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /fountain-network/outlets returns total_count == 0"

      - name: outlet_retrieval_returns_stored_field_values
        claim_type: retrieval
        grounds:
          - endpoints[GET /fountain-network/outlets/{id}]
        distinguishing_aspect: "GET /fountain-network/outlets/{id} read back by a different role (SupplyPlanner) returns exactly the values persisted by the NetworkAdmin create call."
        test_recipe:
          setup:
            - "One Outlet created with account_code OUT-1001, region R-WEST, tier LARGE, hardness 25."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST", throughput_tier: "LARGE", water_hardness_gpg: 25 }
              as: NetworkAdmin
              captures: { o: $.data.id }
          trigger:
            - call: "GET /fountain-network/outlets/${o}"
              as: SupplyPlanner
          assert:
            - "HTTP status == 200"
            - "response envelope response_type == \"object\""
            - "Outlet.${o}.account_code == \"OUT-1001\""
            - "Outlet.${o}.throughput_tier == LARGE"
            - "Outlet.${o}.water_hardness_gpg == 25"
            - "Outlet.${o}.service_posture == OPEN"

      - name: outlet_listing_default_pagination_envelope_shape
        claim_type: listing
        grounds:
          - endpoints[GET /fountain-network/outlets]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three Outlets and no query parameters the list envelope reports limit 10, offset 0, total_count 3, has_more false and response_type \"array\"."
        test_recipe:
          setup:
            - "Three Outlets exist with account codes OUT-1001, OUT-1002, OUT-1003."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Corner Deli", account_code: "OUT-1002", region_code: "R-WEST" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Harbor Cafe", account_code: "OUT-1003", region_code: "R-EAST" }
              as: NetworkAdmin
          trigger:
            - call: "GET /fountain-network/outlets"
              as: NetworkAdmin
          assert:
            - "HTTP status == 200"
            - "response envelope response_type == \"array\""
            - "pagination limit == 10"
            - "pagination offset == 0"
            - "pagination total_count == 3"
            - "pagination has_more == false"
            - "the returned array holds 3 Outlet rows"

      - name: outlet_listing_limit_and_offset_paging_flips_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /fountain-network/outlets]
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit=2&offset=0 returns 2 rows with has_more true and total_count 3; limit=2&offset=2 returns 1 row with has_more false and the same total_count 3."
        test_recipe:
          setup:
            - "Three Outlets exist with account codes OUT-1001, OUT-1002, OUT-1003."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Corner Deli", account_code: "OUT-1002", region_code: "R-WEST" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Harbor Cafe", account_code: "OUT-1003", region_code: "R-EAST" }
              as: NetworkAdmin
          trigger:
            - call: "GET /fountain-network/outlets?limit=2&offset=0"
              as: NetworkAdmin
            - call: "GET /fountain-network/outlets?limit=2&offset=2"
              as: NetworkAdmin
          assert:
            - "first trigger: the returned array holds 2 Outlet rows, total_count == 3, has_more == true"
            - "second trigger: the returned array holds 1 Outlet row, total_count == 3, has_more == false"

      - name: outlet_listing_limit_above_maximum_rejected
