            - "after technical-review PASS: status == PUBLIC_COMMENT, technical_review_state == PASSED, public_comment_state == OPEN, public_comment_count == 0, total_estimate_cents == 115210677 (unchanged by the technical branch)"
            - "after public-comment-close: status == PUBLIC_COMMENT, public_comment_state == CLOSED, public_comment_count == 7, technical_review_state == PASSED (unchanged by the comment branch)"
            - "after approve: RemedialActionPlan.${planA_id}.status == APPROVED and approved_by_user_id == 'reviewer-alpha'"
