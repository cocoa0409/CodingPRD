# =============================================================================
# Task 1300: Retail Store Fixture Manufacturing & Rollout — seed tables
# =============================================================================

scenario: |
  Retail Store Fixture Manufacturing & Rollout (store fixture manufacturer): fixture prototype & value engineering, store-by-store kit configuration, production wave aligned to rollout calendar, warehouse staging & install-crew delivery, damage/missing part hotline & replacement, installation instruction & photo signoff, attic stock & re-order, program closeout & disposition

domain_name: fixture-rollout
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic    # prototype VE loop + signoff resubmit loop + ledger deplete/replenish loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain     # Engineer/Coordinator/Agent/Crew submit; ProgramManager/StoreManager approve
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK prefix canonical)
# =============================================================================
entities:
  - name: RolloutProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Human-readable program name (e.g. 'Holiday 2026 Gondola Refresh')" }
      - { name: retailer_code, type: string, source: input, description: "Retail chain code the program serves" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total fixture budget in cents; must be > 0" }
      - { name: contingency_budget_cents, type: integer, source: input, description: "Budget reserved for damage/missing-part replacements in cents; must be >= 0" }
      - { name: recalled_part_numbers, type: array, source: input, default: [], description: "Part numbers under recall hold; claims for these parts cannot be approved" }
      - { name: attic_valuation_method, type: enum, source: input, default: "PROGRAM_AVERAGE", description: "PROGRAM_AVERAGE | LIQUIDATION — selects attic stock recovery valuation variant at disposition" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "Read-only = budget_total_cents − Σ kit_total_cost_cents over kits in {FROZEN, RELEASED, FULFILLED} − Σ wave_release_charge_cents over released kits" }
      - { name: contingency_spent_cents, type: integer, source: computed, default: 0, description: "Read-only = Σ replacement_cost_cents over DamageClaims in {APPROVED}" }
      - { name: fulfilled_kit_count, type: integer, source: computed, default: 0, description: "Read-only count of kits that reached FULFILLED" }
      - { name: closeout_recovery_cents, type: integer, source: computed, default: 0, description: "Read-only = Σ recovery_value_cents over AtticStockLedgers in {DISPOSED}" }
      - { name: final_reconciliation_cents, type: integer, source: computed, description: "Read-only, null until finalize-closeout: remaining_budget_cents − contingency_spent_cents + closeout_recovery_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSEOUT_PENDING | CLOSED" }

  - name: FixturePrototype
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id; program this prototype is designed for" }
      - { name: fixture_code, type: string, source: input, description: "Fixture model code (e.g. 'GONDOLA-4FT')" }
      - { name: bom_lines, type: array, source: input, description: "Bill of materials: [{part_number, quantity, list_unit_cost_cents, negotiated_unit_cost_cents?}]; quantity >= 1" }
      - { name: target_cost_cents, type: integer, source: input, description: "Cost target; value engineering is gated on provisional cost exceeding this" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Read-only = Σ round_half_up(quantity × list_unit_cost_cents) per BOM line; list-price basis, never rewritten by VE" }
      - { name: engineered_cost_cents, type: integer, source: computed, description: "Read-only = Σ round_half_up(quantity × COALESCE(negotiated_unit_cost_cents, list_unit_cost_cents)) per BOM line; recomputed on every BOM patch" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Read-only, null until approval: engineered_cost_cents if ve_round_count > 0 else provisional_cost_cents" }
      - { name: ve_round_count, type: integer, source: system, default: 0, description: "Number of VALUE_ENGINEERING rounds entered" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submit-review call" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFT | ENGINEERING_REVIEW | VALUE_ENGINEERING | APPROVED | LOCKED" }

  - name: StoreKitConfig
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id" }
      - { name: prototype_id, type: string, source: input, description: "FK -> FixturePrototype.id; prototype this kit is derived from" }
      - { name: store_code, type: string, source: input, description: "Destination store code (e.g. 'STORE-0114')" }
      - { name: config_lines, type: array, source: input, default: [], description: "Kit contents: [{part_number, quantity, unit_cost_cents}]; quantity >= 1; editable only while DRAFT" }
      - { name: total_components, type: integer, source: computed, default: 0, description: "Read-only = Σ quantity over config_lines" }
      - { name: kit_total_cost_cents, type: integer, source: computed, default: 0, description: "Read-only = Σ round_half_up(quantity × unit_cost_cents × (1 + HANDLING_PCT)) per line, then summed (per-line rounding pinned)" }
      - { name: wave_release_charge_cents, type: integer, source: computed, description: "Read-only production surcharge debited at release; null until RELEASED" }
      - { name: wave_id, type: string, source: system, description: "FK -> ProductionWave.id; null until released" }
      - { name: status, type: enum, source: system, description: "DRAFT | FROZEN | RELEASED | FULFILLED | CANCELLED" }

  - name: ProductionWave
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id" }
      - { name: wave_label, type: string, source: input, description: "Wave label (e.g. 'WAVE-1 NORTHEAST')" }
      - { name: start_date, type: string, source: input, description: "Production window start, ISO date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Production window end, ISO date; must be > start_date" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum component units this wave can produce; must be >= 1" }
      - { name: committed_units, type: integer, source: computed, default: 0, description: "Read-only = Σ total_components of RELEASED kits on this wave + Σ replacement_component_count of APPROVED claims whose kit rides this wave" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "Read-only = round_half_up(committed_units / capacity_units × 100, 1 decimal)" }
      - { name: utilization_posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | AT_RISK — AT_RISK when utilization_pct >= 90.0 (boundary inclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMMITTED | IN_PRODUCTION | COMPLETE | CANCELLED" }

  - name: StagingReservation
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> StoreKitConfig.id; released kit being staged" }
      - { name: staging_bay_code, type: string, source: input, description: "Warehouse bay identifier the window occupies" }
      - { name: start_ts, type: datetime, source: input, description: "Staging window start, ISO 8601 UTC" }
      - { name: end_ts, type: datetime, source: input, description: "Staging window end, ISO 8601 UTC; must be > start_ts; half-open [start_ts, end_ts)" }
      - { name: status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED | EXPIRED" }

  - name: InstallDelivery
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> StoreKitConfig.id; kit delivered to its store" }
      - { name: crew_code, type: string, source: input, description: "Install crew identifier whose daily capacity is consumed" }
      - { name: delivery_date, type: string, source: input, description: "Calendar date of delivery/install, ISO date YYYY-MM-DD" }
      - { name: estimated_install_hours, type: integer, source: input, description: "Crew-hours booked on delivery_date; must be >= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCHED | DELIVERED | COMPLETE | FAILED" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> InstallDelivery.id; delivery the damage/miss was reported against" }
      - { name: part_number, type: string, source: input, description: "Reported part number" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGED | MISSING" }
      - { name: replacement_component_count, type: integer, source: input, description: "Units to remanufacture; must be >= 1; debits the kit's wave capacity on approval" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Quoted replacement cost; debits program contingency on approval; must be >= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | APPROVED | REJECTED" }

  - name: InstallSignoff
    parent: null
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> InstallDelivery.id; delivery this photo signoff evidences" }
      - { name: photo_urls, type: array, source: input, description: "Photo evidence URLs; must contain >= 1 entry" }
      - { name: notes, type: string, source: input, description: "Optional installer notes" }
      - { name: submission_count, type: integer, source: system, default: 1, description: "Number of submissions; increments on each resubmit" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the (re)submitter" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the latest reviewer; null until first review" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at rejection; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }

  - name: AtticStockLedger
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: system, description: "FK -> StoreKitConfig.id; ledger is auto-created by signoff approval cascade, one per kit" }
      - { name: store_code, type: string, source: system, description: "Copied from the kit at creation" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Read-only; initialized to ceil(total_components × ATTIC_STOCK_PCT) at creation; mutated by adjust" }
      - { name: reorder_point, type: integer, source: input, default: 2, description: "Reorder threshold; updatable via adjust" }
      - { name: reorder_required, type: boolean, source: computed, default: false, description: "Read-only = quantity_on_hand <= reorder_point (equality triggers)" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Read-only = round_half_up(kit_total_cost_cents / total_components, 0) of the source kit at creation" }
      - { name: disposition_type, type: enum, source: system, description: "RETURN_VENDOR | SCRAP | DONATE; null until disposed" }
      - { name: recovery_value_cents, type: integer, source: computed, description: "Read-only, null until disposed; valuation per program attic_valuation_method" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | DISPOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RolloutProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rollout-programs/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "program.status == DRAFT (ERR_PROGRAM_NOT_ACTIVE)"
          - "budget_total_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "status → ACTIVE"
      - from: ACTIVE
        to: CLOSEOUT_PENDING
        trigger: "POST /rollout-programs/{id}/initiate-closeout"
        actor: ProgramManager
        preconditions:
          - "program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "no StoreKitConfig of this program in {DRAFT, FROZEN, RELEASED} (ERR_CLOSEOUT_BLOCKED)"
          - "no DamageClaim of this program (via delivery → kit → program) in {OPEN} (ERR_CLOSEOUT_BLOCKED)"
          - "all ProductionWaves of this program in {COMPLETE, CANCELLED} (ERR_CLOSEOUT_BLOCKED)"
        side_effects:
          - "status → CLOSEOUT_PENDING"
      - from: CLOSEOUT_PENDING
        to: CLOSED
        trigger: "POST /rollout-programs/{id}/finalize-closeout"
        actor: ProgramManager
        preconditions:
          - "program.status == CLOSEOUT_PENDING (ERR_PROGRAM_NOT_CLOSEOUT_PENDING)"
          - "all AtticStockLedgers of this program's kits in {DEPLETED, DISPOSED} (ERR_UNDISPOSED_STOCK_REMAINS)"
        side_effects:
          - "final_reconciliation_cents = remaining_budget_cents − contingency_spent_cents + closeout_recovery_cents (calculation closeout_reconciliation)"
          - "status → CLOSED"

  - entity: FixturePrototype
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ENGINEERING_REVIEW
        trigger: "POST /fixture-prototypes/{id}/submit-review"
        actor: FixtureEngineer
        preconditions:
          - "prototype.status ∈ {DRAFT, VALUE_ENGINEERING} (ERR_PROTOTYPE_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "status → ENGINEERING_REVIEW"
      - from: VALUE_ENGINEERING
        to: ENGINEERING_REVIEW
        trigger: "POST /fixture-prototypes/{id}/submit-review (resubmission after VE)"
        actor: FixtureEngineer
        preconditions:
          - "prototype.status ∈ {DRAFT, VALUE_ENGINEERING} (ERR_PROTOTYPE_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "engineered_cost_cents recomputed from current bom_lines (calculation prototype_cost_estimate, ENGINEERED variant)"
          - "status → ENGINEERING_REVIEW"
      - from: ENGINEERING_REVIEW
        to: VALUE_ENGINEERING
        trigger: "POST /fixture-prototypes/{id}/request-value-engineering"
        actor: ProgramManager
        preconditions:
          - "prototype.status == ENGINEERING_REVIEW (ERR_PROTOTYPE_INVALID_STATE)"
          - "provisional_cost_cents > target_cost_cents (ERR_VE_NOT_REQUIRED)"
        side_effects:
          - "ve_round_count += 1"
          - "status → VALUE_ENGINEERING"
      - from: ENGINEERING_REVIEW
        to: APPROVED
        trigger: "POST /fixture-prototypes/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "prototype.status ∈ {ENGINEERING_REVIEW, VALUE_ENGINEERING} (ERR_PROTOTYPE_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_PROTOTYPE_SELF_APPROVAL)"
        side_effects:
          - "final_cost_cents = engineered_cost_cents if ve_round_count > 0 else provisional_cost_cents (calculation prototype_cost_estimate, variant selection)"
          - "approved_by_user_id = X-User-ID"
          - "status → APPROVED"
      - from: VALUE_ENGINEERING
        to: APPROVED
        trigger: "POST /fixture-prototypes/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "prototype.status ∈ {ENGINEERING_REVIEW, VALUE_ENGINEERING} (ERR_PROTOTYPE_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_PROTOTYPE_SELF_APPROVAL)"
        side_effects:
          - "final_cost_cents finalized as above"
          - "approved_by_user_id = X-User-ID"
          - "status → APPROVED"
      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic when the first StoreKitConfig referencing this prototype is frozen)"
        actor: system
        preconditions: []
        side_effects:
          - "status → LOCKED; bom_lines and target_cost_cents become immutable (PATCH rejected with ERR_PROTOTYPE_INVALID_STATE)"

  - entity: StoreKitConfig
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "POST /store-kit-configs/{id}/freeze"
        actor: ConfigCoordinator
        preconditions:
          - "kit.status == DRAFT (ERR_KIT_INVALID_STATE)"
          - "program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "prototype.status ∈ {APPROVED, LOCKED} (ERR_PROTOTYPE_NOT_APPROVED)"
          - "config_lines non-empty (ERR_KIT_EMPTY)"
          - "kit_total_cost_cents <= program.remaining_budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "program.remaining_budget_cents -= kit_total_cost_cents (calculation kit_total_cost)"
          - "prototype: APPROVED → LOCKED when this is the first frozen referencing kit (bubble-up cascade hop 1)"
          - "status → FROZEN"
      - from: FROZEN
        to: RELEASED
        trigger: "POST /store-kit-configs/{id}/release"
        actor: ConfigCoordinator
        preconditions:
          - "kit.status == FROZEN (ERR_KIT_INVALID_STATE)"
          - "wave referenced by wave_id exists (ERR_WAVE_NOT_FOUND)"
          - "wave.program_id == kit.program_id (ERR_WAVE_NOT_FOUND)"
          - "wave.status ∈ {COMMITTED, IN_PRODUCTION} (ERR_WAVE_NOT_RELEASABLE)"
          - "wave.committed_units + kit.total_components <= wave.capacity_units (ERR_WAVE_CAPACITY_EXCEEDED; equality allowed)"
          - "wave_release_charge_cents <= program.remaining_budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "wave_release_charge_cents computed (calculation wave_release_charge) and debited from program.remaining_budget_cents"
          - "kit.wave_id = wave_id"
          - "wave.committed_units += kit.total_components (cascade hop 1)"
          - "wave.utilization_pct and utilization_posture recomputed (calculation wave_utilization; cascade hop 2 — posture may flip NORMAL → AT_RISK)"
          - "status → RELEASED"
      - from: RELEASED
        to: FULFILLED
        trigger: "system (automatic when an InstallSignoff for a delivery of this kit is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "program.fulfilled_kit_count += 1 (cascade hop 3 of the signoff-approval chain)"
          - "AtticStockLedger auto-created for this kit: quantity_on_hand = ceil(total_components × ATTIC_STOCK_PCT), unit_cost_cents = round_half_up(kit_total_cost_cents / total_components, 0), status ACTIVE (cascade hop 4)"
          - "status → FULFILLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /store-kit-configs/{id}/cancel"
        actor: ConfigCoordinator
        preconditions:
          - "kit.status ∈ {DRAFT, FROZEN} (ERR_KIT_INVALID_STATE)"
        side_effects:
          - "status → CANCELLED"
      - from: FROZEN
        to: CANCELLED
        trigger: "POST /store-kit-configs/{id}/cancel"
        actor: ConfigCoordinator
        preconditions:
          - "kit.status ∈ {DRAFT, FROZEN} (ERR_KIT_INVALID_STATE)"
        side_effects:
          - "program.remaining_budget_cents += kit_total_cost_cents (compensating refund of the freeze debit)"
          - "status → CANCELLED"

  - entity: ProductionWave
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /production-waves/{id}/commit"
        actor: ProductionPlanner
        preconditions:
          - "wave.status == PLANNED (ERR_WAVE_INVALID_STATE)"
          - "program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "status → COMMITTED"
      - from: COMMITTED
        to: IN_PRODUCTION
        trigger: "system (automatic when POST /_clock/set_current_utc advances the logical clock to a date >= wave.start_date)"
        actor: system
        preconditions: []
        side_effects:
          - "status → IN_PRODUCTION"
      - from: COMMITTED
        to: COMPLETE
        trigger: "POST /production-waves/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "wave.status ∈ {COMMITTED, IN_PRODUCTION} (ERR_WAVE_INVALID_STATE)"
        side_effects:
          - "status → COMPLETE"
      - from: IN_PRODUCTION
        to: COMPLETE
        trigger: "POST /production-waves/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "wave.status ∈ {COMMITTED, IN_PRODUCTION} (ERR_WAVE_INVALID_STATE)"
        side_effects:
          - "status → COMPLETE"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /production-waves/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "wave.status == PLANNED (ERR_WAVE_INVALID_STATE; only never-committed waves can be cancelled — a COMMITTED wave may already hold released kits)"
        side_effects:
          - "status → CANCELLED"

  - entity: StagingReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "system (automatic when an InstallDelivery is created for the same kit: the HELD reservation with earliest start_ts, tie-break created_at ASC, is consumed)"
        actor: system
        preconditions: []
        side_effects:
          - "status → CONSUMED"
      - from: HELD
        to: RELEASED
        trigger: "POST /staging-reservations/{id}/release"
        actor: WarehouseLead
        preconditions:
          - "reservation.status == HELD (ERR_RESERVATION_NOT_HELD)"
        side_effects:
          - "status → RELEASED"
      - from: HELD
        to: EXPIRED
        trigger: "system (automatic when POST /_clock/set_current_utc advances the logical clock past reservation.end_ts)"
        actor: system
        preconditions: []
        side_effects:
          - "status → EXPIRED"

  - entity: InstallDelivery
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, FAILED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /install-deliveries/{id}/dispatch"
        actor: InstallCrewLead
        preconditions:
          - "delivery.status == SCHEDULED (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "status → DISPATCHED"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /install-deliveries/{id}/confirm-delivery"
        actor: InstallCrewLead
        preconditions:
          - "delivery.status == DISPATCHED (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "status → DELIVERED"
      - from: DELIVERED
        to: COMPLETE
        trigger: "system (automatic when an InstallSignoff for this delivery is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "status → COMPLETE (cascade hop 2 of the signoff-approval chain)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /install-deliveries/{id}/fail"
        actor: InstallCrewLead
        preconditions:
          - "delivery.status ∈ {SCHEDULED, DISPATCHED} (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "status → FAILED; its estimated_install_hours stop counting toward crew-day capacity (committed-hours invariant restores)"
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /install-deliveries/{id}/fail"
        actor: InstallCrewLead
        preconditions:
          - "delivery.status ∈ {SCHEDULED, DISPATCHED} (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "status → FAILED; crew-day capacity restored"

  - entity: DamageClaim
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /damage-claims/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "claim.status == OPEN (ERR_CLAIM_NOT_OPEN)"
          - "claim.part_number ∉ program.recalled_part_numbers (ERR_PART_RECALL_HOLD)"
          - "claim.replacement_cost_cents <= program.contingency_budget_cents − program.contingency_spent_cents (ERR_CONTINGENCY_EXCEEDED)"
        side_effects:
          - "program.contingency_spent_cents += replacement_cost_cents (cascade hop 1)"
          - "wave of the claim's kit (claim.delivery_id → InstallDelivery.kit_id → StoreKitConfig.wave_id): committed_units += replacement_component_count (cascade hop 2; claims may push committed_units above capacity_units — emergency replacement bypasses the release-time capacity check)"
          - "that wave's utilization_pct and utilization_posture recomputed (calculation wave_utilization; cascade hop 3 — posture may flip NORMAL → AT_RISK)"
          - "status → APPROVED"
      - from: OPEN
        to: REJECTED
        trigger: "POST /damage-claims/{id}/reject"
        actor: ProgramManager
        preconditions:
          - "claim.status == OPEN (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "rejection recorded; no budget or capacity side effects"
          - "status → REJECTED"

  - entity: InstallSignoff
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /install-signoffs/{id}/approve"
        actor: StoreManager
        preconditions:
          - "signoff.status == SUBMITTED (ERR_SIGNOFF_INVALID_STATE)"
          - "X-User-ID != signoff.submitted_by_user_id (ERR_SIGNOFF_SELF_APPROVAL)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "status → APPROVED"
          - "delivery (signoff.delivery_id) → COMPLETE (cascade hop 2)"
          - "kit (delivery.kit_id) → FULFILLED; program.fulfilled_kit_count += 1 (cascade hop 3)"
          - "AtticStockLedger auto-created for the kit with computed quantity_on_hand and unit_cost_cents (cascade hop 4)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /install-signoffs/{id}/reject"
        actor: StoreManager
        preconditions:
          - "signoff.status == SUBMITTED (ERR_SIGNOFF_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; rejection_reason recorded"
          - "status → REJECTED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /install-signoffs/{id}/resubmit"
        actor: InstallCrewLead
        preconditions:
          - "signoff.status == REJECTED (ERR_SIGNOFF_INVALID_STATE)"
          - "photo_urls non-empty (ERR_PHOTO_EVIDENCE_REQUIRED)"
        side_effects:
          - "photo_urls replaced; rejection_reason cleared; submitted_by_user_id = X-User-ID"
          - "submission_count += 1"
          - "status → SUBMITTED"

  - entity: AtticStockLedger
    initial_state: ACTIVE
    terminal_states: [DISPOSED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when adjust drives quantity_on_hand to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "status → DEPLETED"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (automatic when adjust raises quantity_on_hand above 0)"
        actor: system
        preconditions: []
        side_effects:
          - "status → ACTIVE"
      - from: ACTIVE
        to: DISPOSED
        trigger: "POST /attic-stock-ledgers/{id}/dispose"
        actor: ProgramManager
        preconditions:
          - "ledger.status ∈ {ACTIVE, DEPLETED} (ERR_LEDGER_INVALID_STATE)"
          - "program of the ledger's kit == CLOSEOUT_PENDING (ERR_PROGRAM_NOT_CLOSEOUT_PENDING)"
        side_effects:
          - "recovery_value_cents computed (calculation attic_stock_valuation, variant per program.attic_valuation_method)"
          - "program.closeout_recovery_cents += recovery_value_cents (cascade hop 1 of the dispose chain)"
          - "status → DISPOSED"
      - from: DEPLETED
        to: DISPOSED
        trigger: "POST /attic-stock-ledgers/{id}/dispose"
        actor: ProgramManager
        preconditions:
          - "ledger.status ∈ {ACTIVE, DEPLETED} (ERR_LEDGER_INVALID_STATE)"
          - "program of the ledger's kit == CLOSEOUT_PENDING (ERR_PROGRAM_NOT_CLOSEOUT_PENDING)"
        side_effects:
          - "recovery_value_cents = 0 when quantity_on_hand == 0"
          - "program.closeout_recovery_cents += recovery_value_cents"
          - "status → DISPOSED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: kit-config-patch-stale-version
    parent_entity: StoreKitConfig
    write_endpoint: "PATCH /store-kit-configs/{id}"
    occ_field: "expected_config_version"
    description: |
      Patching a DRAFT kit's config_lines against a kit version the client did
      not last observe is rejected. The client's expected_config_version must
      equal the kit's current version; a writer holding an older version has
      missed an intervening patch or cascade and must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: attic-adjust-stale-version
    parent_entity: AtticStockLedger
    write_endpoint: "POST /attic-stock-ledgers/{id}/adjust"
    occ_field: "expected_ledger_version"
    description: |
      Adjusting an attic stock ledger against a ledger version the client did
      not last observe is rejected. The client's expected_ledger_version must
      equal the ledger's current version, so a quantity/reorder-point change
      always builds on the latest observed state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prototype_cost_estimate
    trigger: "prototype create (both variants), PATCH bom_lines (recompute both), submit-review from VALUE_ENGINEERING (recompute ENGINEERED), approve (finalize final_cost_cents)"
    algorithm: aggregation
    formula: |
      Per BOM line: line_provisional = round_half_up(quantity × list_unit_cost_cents, 0)
      provisional_cost_cents = Σ line_provisional
      Per BOM line: line_engineered = round_half_up(quantity × COALESCE(negotiated_unit_cost_cents, list_unit_cost_cents), 0)
      engineered_cost_cents = Σ line_engineered
      At approve: final_cost_cents = engineered_cost_cents if ve_round_count > 0 else provisional_cost_cents
    input_set: "All bom_lines of the prototype, regardless of prototype status"
    precision: "0 decimal places (integer cents), round_half_up per line then sum"
    variants:
      - name: PROVISIONAL
        when: "List-price basis; the only variant before any VE round"
        difference: "Uses list_unit_cost_cents exclusively; never rewritten by VE activity"
      - name: ENGINEERED
        when: "Value-engineered basis; diverges once any negotiated_unit_cost_cents differs from list"
        difference: "Uses negotiated_unit_cost_cents where present, else list; becomes final_cost_cents at approval when ve_round_count > 0"

  - name: kit_total_cost
    trigger: "kit create and every PATCH of config_lines; result is debited at freeze"
    algorithm: aggregation
    formula: |
      Rounding order PINNED — per-line first, then sum:
      Per config line: line_amount = round_half_up(quantity × unit_cost_cents × (1 + HANDLING_PCT), 0)
      kit_total_cost_cents = Σ line_amount
      total_components = Σ quantity (unrounded integer sum)
      (Sum-then-round is FORBIDDEN: Σ raw amounts rounded once yields a different
      cent value whenever two or more lines produce fractional cents.)
    input_set: "All config_lines of the kit"
    constants:
      HANDLING_PCT: 0.06
    precision: "0 decimal places (integer cents), round_half_up per line, then integer sum"

  - name: wave_release_charge
    trigger: "POST /store-kit-configs/{id}/release (charged per kit release)"
    algorithm: tiered_pricing
    formula: |
      utilization_after = (wave.committed_units + kit.total_components) / wave.capacity_units × 100
      tier_multiplier = 1.0  if utilization_after < 70
                        1.15 if 70 <= utilization_after < 90
                        1.35 if utilization_after >= 90
      rush_multiplier = 1.25 if wave.status == IN_PRODUCTION at release time, else 1.0
      Evaluation order pinned: charge = round_half_up(kit.total_components × BASE_RATE_CENTS × tier_multiplier × rush_multiplier, 0)
    input_set: "The releasing kit's total_components, the target wave's committed_units/capacity_units/status at release time"
    constants:
      BASE_RATE_CENTS: 150
      RUSH_MULTIPLIER: 1.25
    precision: "0 decimal places (integer cents), round_half_up"

  - name: wave_utilization
    trigger: "wave create, kit release, kit cancel of a RELEASED kit is impossible (never subtracts), damage claim approve (replacement components), and recompute on any committed_units change"
    algorithm: threshold
    formula: |
      utilization_pct = round_half_up(committed_units / capacity_units × 100, 1 decimal)
      utilization_posture = AT_RISK if utilization_pct >= 90.0 else NORMAL
      (Boundary is INCLUSIVE: exactly 90.0 flips to AT_RISK.)
    input_set: "The wave's own committed_units and capacity_units"
    constants:
      AT_RISK_THRESHOLD_PCT: 90.0
    precision: "1 decimal place, round_half_up"

  - name: staging_overlap_check
    trigger: "POST /staging-reservations"
    algorithm: interval_merge
    formula: |
      Intervals are HALF-OPEN [start_ts, end_ts).
      New reservation R conflicts with an existing HELD reservation X on the same
      staging_bay_code iff: R.start_ts < X.end_ts AND X.start_ts < R.end_ts.
      Adjacency is allowed: R.start_ts == X.end_ts or R.end_ts == X.start_ts is NOT a conflict.
      Only HELD reservations occupy a bay (CONSUMED/RELEASED/EXPIRED do not).
      Conflict → ERR_STAGING_BAY_OVERLAP.
    input_set: "All StagingReservations with the same staging_bay_code in status HELD"
    precision: "ISO 8601 timestamp comparison, exact"

  - name: crew_daily_capacity_check
    trigger: "POST /install-deliveries"
    algorithm: aggregation
    formula: |
      Aggregate-capacity semantics (NOT pairwise interval overlap):
      committed_hours(crew_code, date) = Σ estimated_install_hours over InstallDeliveries
        with matching crew_code and delivery_date and status ∈ {SCHEDULED, DISPATCHED, DELIVERED}
      New delivery rejected when committed_hours + new.estimated_install_hours > DAILY_CAPACITY_HOURS.
      Equality (total == DAILY_CAPACITY_HOURS) is ALLOWED.
      FAILED and COMPLETE deliveries consume no capacity.
    input_set: "All InstallDeliveries sharing the new delivery's crew_code and delivery_date in statuses {SCHEDULED, DISPATCHED, DELIVERED}"
    constants:
      DAILY_CAPACITY_HOURS: 8
    precision: "integer hours, exact"

  - name: attic_reorder_check
    trigger: "ledger creation and every adjust"
    algorithm: threshold
    formula: |
      reorder_required = (quantity_on_hand <= reorder_point)
      (Boundary is INCLUSIVE: quantity exactly at reorder_point triggers reorder.)
    input_set: "The ledger's own quantity_on_hand and reorder_point"
    precision: "integer comparison, exact"

  - name: attic_stock_valuation
    trigger: "POST /attic-stock-ledgers/{id}/dispose"
    algorithm: aggregation
    formula: |
      recovery_rate(disposition_type) = 0.80 RETURN_VENDOR | 0.05 SCRAP | 0.00 DONATE
      Variant PROGRAM_AVERAGE:
        recovery_value_cents = round_half_up(quantity_on_hand × unit_cost_cents × recovery_rate, 0)
      Variant LIQUIDATION:
        recovery_value_cents = round_half_up(quantity_on_hand × LIQUIDATION_UNIT_CENTS × recovery_rate, 0)
    input_set: "The disposed ledger's quantity_on_hand, unit_cost_cents, disposition_type, and the program's attic_valuation_method"
    constants:
      LIQUIDATION_UNIT_CENTS: 2500
      ATTIC_STOCK_PCT: 0.05
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: PROGRAM_AVERAGE
        when: "program.attic_valuation_method == PROGRAM_AVERAGE (the default)"
        difference: "Values stock at the source kit's average unit cost (kit_total_cost_cents / total_components)"
      - name: LIQUIDATION
        when: "program.attic_valuation_method == LIQUIDATION"
        difference: "Values stock at the flat LIQUIDATION_UNIT_CENTS market rate regardless of kit cost; diverges from PROGRAM_AVERAGE whenever kit average unit cost != 2500"

  - name: closeout_reconciliation
    trigger: "POST /rollout-programs/{id}/finalize-closeout"
    algorithm: aggregation
    formula: |
      final_reconciliation_cents = remaining_budget_cents − contingency_spent_cents + closeout_recovery_cents
      Input set pinned: kits in {FROZEN, RELEASED, FULFILLED} contribute their kit_total_cost_cents
      to remaining_budget_cents' deduction; kits in {DRAFT, CANCELLED} contribute nothing;
      claims in {APPROVED} contribute replacement_cost_cents to contingency_spent_cents;
      ledgers in {DISPOSED} contribute recovery_value_cents to closeout_recovery_cents;
      ledgers in {ACTIVE, DEPLETED} block finalization instead (ERR_UNDISPOSED_STOCK_REMAINS).
    input_set: "Program aggregates at finalization time, filtered by the statuses above"
    precision: "integer cents, exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource id must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PROGRAM_NOT_FOUND, ERR_PROTOTYPE_NOT_FOUND, ERR_KIT_CONFIG_NOT_FOUND, ERR_WAVE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_DELIVERY_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_SIGNOFF_NOT_FOUND, ERR_LEDGER_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "Body-referenced ids must exist: prototype_id/program_id (kit create), program_id (prototype/wave create), kit_id (reservation/delivery create), delivery_id (claim/signoff create), wave_id (kit release); cross-program wave reference on release reports ERR_WAVE_NOT_FOUND"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PROTOTYPE_NOT_FOUND | ERR_KIT_CONFIG_NOT_FOUND | ERR_WAVE_NOT_FOUND | ERR_DELIVERY_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with body FKs and POST /store-kit-configs/{id}/release"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the operation (per §1.2 preconditions: program ACTIVE/CLOSEOUT_PENDING gates, kit DRAFT/FROZEN, prototype review/approval states, wave PLANNED/COMMITTED/IN_PRODUCTION, claim OPEN, signoff SUBMITTED/REJECTED, delivery SCHEDULED/DISPATCHED, ledger ACTIVE/DEPLETED, reservation HELD)"
    error_id: "ERR_PROGRAM_NOT_ACTIVE | ERR_PROGRAM_NOT_CLOSEOUT_PENDING | ERR_CLOSEOUT_BLOCKED | ERR_UNDISPOSED_STOCK_REMAINS | ERR_PROTOTYPE_INVALID_STATE | ERR_PROTOTYPE_NOT_APPROVED | ERR_KIT_INVALID_STATE | ERR_WAVE_INVALID_STATE | ERR_WAVE_NOT_RELEASABLE | ERR_RESERVATION_NOT_HELD | ERR_DELIVERY_INVALID_STATE | ERR_CLAIM_NOT_OPEN | ERR_SIGNOFF_INVALID_STATE | ERR_LEDGER_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints and creates gated on a parent's state"

  - priority: 6
    category: business_safety
    check: "Segregation of duties and recall holds: prototype approver != submitted_by_user_id (ERR_PROTOTYPE_SELF_APPROVAL); signoff approver != signoff.submitted_by_user_id (ERR_SIGNOFF_SELF_APPROVAL); claim part not under recall hold (ERR_PART_RECALL_HOLD)"
    error_id: "ERR_PROTOTYPE_SELF_APPROVAL | ERR_SIGNOFF_SELF_APPROVAL | ERR_PART_RECALL_HOLD"
    http_status: 403
    applies_to: "POST /fixture-prototypes/{id}/approve; POST /install-signoffs/{id}/approve; POST /damage-claims/{id}/approve"

  - priority: 7
    category: business_constraint
    check: "Shape/consistency constraints: required fields present and typed, enums valid, quantities >= 1 (ERR_INVALID_REQUEST); end_date/end_ts strictly after start (ERR_INVALID_WINDOW); VE only when provisional_cost_cents > target_cost_cents (ERR_VE_NOT_REQUIRED); kit config_lines non-empty at freeze (ERR_KIT_EMPTY); signoff photo_urls non-empty at create/resubmit (ERR_PHOTO_EVIDENCE_REQUIRED); no second SUBMITTED signoff while one is pending for the same delivery (ERR_SIGNOFF_ALREADY_PENDING); ledger adjust may not drive quantity_on_hand below 0 (ERR_STOCK_UNDERFLOW)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WINDOW | ERR_VE_NOT_REQUIRED | ERR_KIT_EMPTY | ERR_PHOTO_EVIDENCE_REQUIRED | ERR_SIGNOFF_ALREADY_PENDING | ERR_STOCK_UNDERFLOW"
    http_status: 400
    applies_to: "create and PATCH endpoints; freeze; request-value-engineering; signoff create/resubmit; ledger adjust"

  - priority: 8
    category: business_temporal
    check: "Temporal resource conflicts: staging bay half-open window overlap (calculation staging_overlap_check); crew daily capacity aggregate (calculation crew_daily_capacity_check)"
    error_id: "ERR_STAGING_BAY_OVERLAP | ERR_CREW_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /staging-reservations; POST /install-deliveries"

  - priority: 9
    category: business_fiscal
    check: "Money last: kit freeze requires kit_total_cost_cents <= program.remaining_budget_cents (ERR_BUDGET_EXCEEDED); kit release requires wave_release_charge_cents <= program.remaining_budget_cents (ERR_BUDGET_EXCEEDED); wave capacity committed_units + total_components <= capacity_units (ERR_WAVE_CAPACITY_EXCEEDED); claim approve requires replacement_cost_cents <= remaining contingency (ERR_CONTINGENCY_EXCEEDED)"
    error_id: "ERR_BUDGET_EXCEEDED | ERR_WAVE_CAPACITY_EXCEEDED | ERR_CONTINGENCY_EXCEEDED"
    http_status: 402
    applies_to: "POST /store-kit-configs/{id}/freeze; POST /store-kit-configs/{id}/release; POST /damage-claims/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RolloutProgram ---
  - method: POST
    path: "/rollout-programs"
    description: "Create a rollout program (status DRAFT)"
    roles: [ProgramManager]
    code: 201
    input: [program_name, retailer_code, budget_total_cents, contingency_budget_cents, "recalled_part_numbers?", "attic_valuation_method?"]
    output: RolloutProgram
    side_effects: ["status = DRAFT", "remaining_budget_cents = budget_total_cents", "contingency_spent_cents = 0", "fulfilled_kit_count = 0", "closeout_recovery_cents = 0"]

  - method: GET
    path: "/rollout-programs"
    description: "List rollout programs"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RolloutProgram[]"
    side_effects: []

  - method: GET
    path: "/rollout-programs/{id}"
    description: "Get a rollout program"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: []

  - method: POST
    path: "/rollout-programs/{id}/activate"
    description: "Activate a DRAFT program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: ["status → ACTIVE", "increments RolloutProgram.version by 1"]

  - method: POST
    path: "/rollout-programs/{id}/initiate-closeout"
    description: "Move an ACTIVE program to CLOSEOUT_PENDING when all kits/claims/waves are terminal"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: ["status → CLOSEOUT_PENDING", "increments RolloutProgram.version by 1"]

  - method: POST
    path: "/rollout-programs/{id}/finalize-closeout"
    description: "Finalize closeout: compute final_reconciliation_cents and close the program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: ["calculation closeout_reconciliation", "status → CLOSED", "increments RolloutProgram.version by 1"]

  # --- FixturePrototype ---
  - method: POST
    path: "/fixture-prototypes"
    description: "Create a fixture prototype for a program (allowed while program is DRAFT or ACTIVE)"
    roles: [FixtureEngineer]
    code: 201
    input: [program_id, fixture_code, bom_lines, target_cost_cents]
    output: FixturePrototype
    side_effects: ["calculation prototype_cost_estimate (both variants)", "status = DRAFT", "ve_round_count = 0"]

  - method: GET
    path: "/fixture-prototypes"
    description: "List fixture prototypes"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "FixturePrototype[]"
    side_effects: []

  - method: GET
    path: "/fixture-prototypes/{id}"
    description: "Get a fixture prototype"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: FixturePrototype
    side_effects: []

  - method: PATCH
    path: "/fixture-prototypes/{id}"
    description: "Update bom_lines/target_cost_cents; allowed only while DRAFT or VALUE_ENGINEERING"
    roles: [FixtureEngineer]
    code: 200
    input: ["bom_lines?", "target_cost_cents?"]
    output: FixturePrototype
    side_effects: ["calculation prototype_cost_estimate recomputed (both variants)", "increments FixturePrototype.version by 1"]

  - method: POST
    path: "/fixture-prototypes/{id}/submit-review"
    description: "Submit prototype for engineering review (from DRAFT, or resubmit from VALUE_ENGINEERING)"
    roles: [FixtureEngineer]
    code: 200
    input: []
    output: FixturePrototype
    side_effects: ["status → ENGINEERING_REVIEW", "submitted_by_user_id = X-User-ID", "increments FixturePrototype.version by 1"]

  - method: POST
    path: "/fixture-prototypes/{id}/request-value-engineering"
    description: "Send prototype into a value-engineering round (gated on provisional > target)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: FixturePrototype
    side_effects: ["status → VALUE_ENGINEERING", "ve_round_count += 1", "increments FixturePrototype.version by 1"]

  - method: POST
    path: "/fixture-prototypes/{id}/approve"
    description: "Approve a prototype under review; finalizes final_cost_cents; approver must differ from submitter"
    roles: [ProgramManager]
    code: 200
    input: []
    output: FixturePrototype
    side_effects: ["final_cost_cents finalized per calculation prototype_cost_estimate", "status → APPROVED", "approved_by_user_id = X-User-ID", "increments FixturePrototype.version by 1"]

  # --- StoreKitConfig ---
  - method: POST
    path: "/store-kit-configs"
    description: "Create a store kit config derived from a prototype (status DRAFT; program DRAFT or ACTIVE)"
    roles: [ConfigCoordinator]
    code: 201
    input: [program_id, prototype_id, store_code, "config_lines?"]
    output: StoreKitConfig
    side_effects: ["status = DRAFT", "calculation kit_total_cost on provided lines (else 0)"]

  - method: GET
    path: "/store-kit-configs"
    description: "List store kit configs"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["program_id?", "prototype_id?", "wave_id?", "status?", "limit?", "offset?"]
    output: "StoreKitConfig[]"
    side_effects: []

  - method: GET
    path: "/store-kit-configs/{id}"
    description: "Get a store kit config"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: StoreKitConfig
    side_effects: []

  - method: PATCH
    path: "/store-kit-configs/{id}"
    description: "Replace config_lines while DRAFT; OCC via expected_config_version"
    roles: [ConfigCoordinator]
    code: 200
    input: [config_lines, expected_config_version]
    output: StoreKitConfig
    side_effects: ["calculation kit_total_cost recomputed", "increments StoreKitConfig.version by 1"]

  - method: POST
    path: "/store-kit-configs/{id}/freeze"
    description: "Freeze a DRAFT kit: debits program budget, locks the prototype on first freeze"
    roles: [ConfigCoordinator]
    code: 200
    input: []
    output: StoreKitConfig
    side_effects: ["status → FROZEN", "program.remaining_budget_cents -= kit_total_cost_cents", "prototype APPROVED → LOCKED on first freeze", "increments StoreKitConfig.version by 1"]

  - method: POST
    path: "/store-kit-configs/{id}/release"
    description: "Release a FROZEN kit to a production wave; charges tiered/rush surcharge and debits wave capacity"
    roles: [ConfigCoordinator]
    code: 200
    input: [wave_id]
    output: StoreKitConfig
    side_effects: ["calculation wave_release_charge; debited from program.remaining_budget_cents", "kit.wave_id = wave_id", "wave.committed_units += total_components", "calculation wave_utilization recomputed on the wave", "status → RELEASED", "increments StoreKitConfig.version by 1"]

  - method: POST
    path: "/store-kit-configs/{id}/cancel"
    description: "Cancel a DRAFT or FROZEN kit; FROZEN cancellation refunds the budget debit"
    roles: [ConfigCoordinator]
    code: 200
    input: []
    output: StoreKitConfig
    side_effects: ["if FROZEN: program.remaining_budget_cents += kit_total_cost_cents", "status → CANCELLED", "increments StoreKitConfig.version by 1"]

  # --- ProductionWave ---
  - method: POST
    path: "/production-waves"
    description: "Create a production wave (status PLANNED; program DRAFT or ACTIVE)"
    roles: [ProductionPlanner]
    code: 201
    input: [program_id, wave_label, start_date, end_date, capacity_units]
    output: ProductionWave
    side_effects: ["status = PLANNED", "committed_units = 0", "utilization_posture = NORMAL"]

  - method: GET
    path: "/production-waves"
    description: "List production waves"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "ProductionWave[]"
    side_effects: []

  - method: GET
    path: "/production-waves/{id}"
    description: "Get a production wave"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []

  - method: POST
    path: "/production-waves/{id}/commit"
    description: "Commit a PLANNED wave (program must be ACTIVE)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionWave
    side_effects: ["status → COMMITTED", "increments ProductionWave.version by 1"]

  - method: POST
    path: "/production-waves/{id}/complete"
    description: "Mark a COMMITTED or IN_PRODUCTION wave complete"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionWave
    side_effects: ["status → COMPLETE", "increments ProductionWave.version by 1"]

  - method: POST
    path: "/production-waves/{id}/cancel"
    description: "Cancel a PLANNED wave that was never committed"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionWave
    side_effects: ["status → CANCELLED", "increments ProductionWave.version by 1"]

  # --- StagingReservation ---
  - method: POST
    path: "/staging-reservations"
    description: "Hold a half-open staging window on a warehouse bay for a RELEASED kit"
    roles: [WarehouseLead]
    code: 201
    input: [kit_id, staging_bay_code, start_ts, end_ts]
    output: StagingReservation
    side_effects: ["calculation staging_overlap_check", "status = HELD"]

  - method: GET
    path: "/staging-reservations"
    description: "List staging reservations"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["kit_id?", "staging_bay_code?", "status?", "limit?", "offset?"]
    output: "StagingReservation[]"
    side_effects: []

  - method: GET
    path: "/staging-reservations/{id}"
    description: "Get a staging reservation"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: StagingReservation
    side_effects: []

  - method: POST
    path: "/staging-reservations/{id}/release"
    description: "Release a HELD staging reservation"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: StagingReservation
    side_effects: ["status → RELEASED", "increments StagingReservation.version by 1"]

  # --- InstallDelivery ---
  - method: POST
    path: "/install-deliveries"
    description: "Schedule an install-crew delivery for a RELEASED kit; consumes the kit's earliest HELD reservation"
    roles: [InstallCrewLead]
    code: 201
    input: [kit_id, crew_code, delivery_date, estimated_install_hours]
    output: InstallDelivery
    side_effects: ["calculation crew_daily_capacity_check", "earliest HELD StagingReservation for kit (start_ts ASC, tie-break created_at ASC) → CONSUMED", "status = SCHEDULED"]

  - method: GET
    path: "/install-deliveries"
    description: "List install deliveries"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["kit_id?", "crew_code?", "delivery_date?", "status?", "limit?", "offset?"]
    output: "InstallDelivery[]"
    side_effects: []

  - method: GET
    path: "/install-deliveries/{id}"
    description: "Get an install delivery"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: InstallDelivery
    side_effects: []

  - method: POST
    path: "/install-deliveries/{id}/dispatch"
    description: "Dispatch a SCHEDULED delivery"
    roles: [InstallCrewLead]
    code: 200
    input: []
    output: InstallDelivery
    side_effects: ["status → DISPATCHED", "increments InstallDelivery.version by 1"]

  - method: POST
    path: "/install-deliveries/{id}/confirm-delivery"
    description: "Confirm a DISPATCHED delivery as DELIVERED"
    roles: [InstallCrewLead]
    code: 200
    input: []
    output: InstallDelivery
    side_effects: ["status → DELIVERED", "increments InstallDelivery.version by 1"]

  - method: POST
    path: "/install-deliveries/{id}/fail"
    description: "Fail a SCHEDULED or DISPATCHED delivery; releases its crew-day capacity"
    roles: [InstallCrewLead]
    code: 200
    input: []
    output: InstallDelivery
    side_effects: ["status → FAILED", "estimated_install_hours excluded from crew_daily_capacity_check thereafter", "increments InstallDelivery.version by 1"]

  # --- DamageClaim ---
  - method: POST
    path: "/damage-claims"
    description: "Hotline: file a damage/missing-part claim against a DELIVERED or COMPLETE delivery"
    roles: [HotlineAgent]
    code: 201
    input: [delivery_id, part_number, claim_type, replacement_component_count, replacement_cost_cents]
    output: DamageClaim
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/damage-claims"
    description: "List damage claims"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["delivery_id?", "status?", "limit?", "offset?"]
    output: "DamageClaim[]"
    side_effects: []

  - method: GET
    path: "/damage-claims/{id}"
    description: "Get a damage claim"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: POST
    path: "/damage-claims/{id}/approve"
    description: "Approve an OPEN claim: debits contingency and the kit's wave capacity, recomputes wave posture"
    roles: [ProgramManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["program.contingency_spent_cents += replacement_cost_cents", "wave.committed_units += replacement_component_count (may exceed capacity_units)", "calculation wave_utilization recomputed on the wave", "status → APPROVED", "increments DamageClaim.version by 1"]

  - method: POST
    path: "/damage-claims/{id}/reject"
    description: "Reject an OPEN claim (no budget/capacity effects)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status → REJECTED", "increments DamageClaim.version by 1"]

  # --- InstallSignoff ---
  - method: POST
    path: "/install-signoffs"
    description: "Submit installation photo signoff for a DELIVERED delivery"
    roles: [InstallCrewLead]
    code: 201
    input: [delivery_id, photo_urls, "notes?"]
    output: InstallSignoff
    side_effects: ["status = SUBMITTED", "submission_count = 1", "submitted_by_user_id = X-User-ID"]

  - method: GET
    path: "/install-signoffs"
    description: "List install signoffs"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["delivery_id?", "status?", "limit?", "offset?"]
    output: "InstallSignoff[]"
    side_effects: []

  - method: GET
    path: "/install-signoffs/{id}"
    description: "Get an install signoff"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: InstallSignoff
    side_effects: []

  - method: POST
    path: "/install-signoffs/{id}/approve"
    description: "Approve a SUBMITTED signoff; fires the delivery → kit → program → attic-ledger cascade"
    roles: [StoreManager]
    code: 200
    input: []
    output: InstallSignoff
    side_effects: ["status → APPROVED", "delivery → COMPLETE", "kit → FULFILLED", "program.fulfilled_kit_count += 1", "AtticStockLedger auto-created (calculation attic quantity = ceil(total_components × ATTIC_STOCK_PCT))", "increments InstallSignoff.version by 1"]

  - method: POST
    path: "/install-signoffs/{id}/reject"
    description: "Reject a SUBMITTED signoff with a reason"
    roles: [StoreManager]
    code: 200
    input: [reason]
    output: InstallSignoff
    side_effects: ["status → REJECTED", "rejection_reason = reason", "reviewed_by_user_id = X-User-ID", "increments InstallSignoff.version by 1"]

  - method: POST
    path: "/install-signoffs/{id}/resubmit"
    description: "Resubmit a REJECTED signoff with fresh photo evidence"
    roles: [InstallCrewLead]
    code: 200
    input: [photo_urls, "notes?"]
    output: InstallSignoff
    side_effects: ["status → SUBMITTED", "submission_count += 1", "rejection_reason cleared", "submitted_by_user_id = X-User-ID", "increments InstallSignoff.version by 1"]

  # --- AtticStockLedger ---
  - method: GET
    path: "/attic-stock-ledgers"
    description: "List attic stock ledgers"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: ["kit_id?", "status?", "limit?", "offset?"]
    output: "AtticStockLedger[]"
    side_effects: []

  - method: GET
    path: "/attic-stock-ledgers/{id}"
    description: "Get an attic stock ledger"
    roles: [Any, ProgramManager, FixtureEngineer, ConfigCoordinator, ProductionPlanner, WarehouseLead, InstallCrewLead, HotlineAgent, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: AtticStockLedger
    side_effects: []

  - method: POST
    path: "/attic-stock-ledgers/{id}/adjust"
    description: "Adjust quantity_on_hand and/or reorder_point; OCC via expected_ledger_version; auto-flips ACTIVE/DEPLETED at 0"
    roles: [WarehouseLead]
    code: 200
    input: [delta, "reorder_point?", expected_ledger_version]
    output: AtticStockLedger
    side_effects: ["quantity_on_hand += delta (>= 0 else ERR_STOCK_UNDERFLOW)", "calculation attic_reorder_check", "status flips ACTIVE ⇄ DEPLETED at quantity 0", "increments AtticStockLedger.version by 1"]

  - method: POST
    path: "/attic-stock-ledgers/{id}/dispose"
    description: "Dispose of a ledger during closeout; computes recovery value per program valuation method"
    roles: [ProgramManager]
    code: 200
    input: [disposition_type]
    output: AtticStockLedger
    side_effects: ["calculation attic_stock_valuation (variant per program.attic_valuation_method)", "program.closeout_recovery_cents += recovery_value_cents", "status → DISPOSED", "increments AtticStockLedger.version by 1"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Side effects: COMMITTED waves with start_date <= new time auto-transition to IN_PRODUCTION; HELD reservations with end_ts <= new time auto-transition to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601", "waves COMMITTED with start_date <= now → IN_PRODUCTION", "reservations HELD with end_ts <= now → EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed field, invalid enum value, quantity < 1, budget_total_cents <= 0, negative capacity" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "end_date/end_ts not strictly after start_date/start_ts" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "RolloutProgram id does not exist" }
  - { id: ERR_PROTOTYPE_NOT_FOUND, http: 404, condition: "FixturePrototype id does not exist" }
  - { id: ERR_KIT_CONFIG_NOT_FOUND, http: 404, condition: "StoreKitConfig id does not exist" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "ProductionWave id does not exist, or wave belongs to a different program on release" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "StagingReservation id does not exist" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "InstallDelivery id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "DamageClaim id does not exist" }
  - { id: ERR_SIGNOFF_NOT_FOUND, http: 404, condition: "InstallSignoff id does not exist" }
  - { id: ERR_LEDGER_NOT_FOUND, http: 404, condition: "AtticStockLedger id does not exist" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires program ACTIVE (freeze, wave commit, initiate-closeout from non-ACTIVE)" }
  - { id: ERR_PROGRAM_NOT_CLOSEOUT_PENDING, http: 409, condition: "Operation requires program CLOSEOUT_PENDING (dispose, finalize-closeout)" }
  - { id: ERR_CLOSEOUT_BLOCKED, http: 409, condition: "initiate-closeout blocked: kits in {DRAFT,FROZEN,RELEASED}, claims OPEN, or waves not in {COMPLETE,CANCELLED}" }
  - { id: ERR_UNDISPOSED_STOCK_REMAINS, http: 409, condition: "finalize-closeout blocked: attic ledgers still ACTIVE or DEPLETED" }
  - { id: ERR_PROTOTYPE_INVALID_STATE, http: 409, condition: "Prototype not in required state for submit-review/request-VE/approve/PATCH" }
  - { id: ERR_PROTOTYPE_NOT_APPROVED, http: 409, condition: "Kit freeze requires prototype APPROVED or LOCKED" }
  - { id: ERR_PROTOTYPE_SELF_APPROVAL, http: 403, condition: "Approver X-User-ID equals submitted_by_user_id" }
  - { id: ERR_VE_NOT_REQUIRED, http: 409, condition: "request-value-engineering requires provisional_cost_cents > target_cost_cents" }
  - { id: ERR_KIT_INVALID_STATE, http: 409, condition: "Kit not in required state (PATCH/freeze require DRAFT; release requires FROZEN; cancel requires DRAFT/FROZEN; reservation/delivery require RELEASED)" }
  - { id: ERR_KIT_EMPTY, http: 422, condition: "Freeze requires at least one config line" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "kit_total_cost_cents or wave_release_charge_cents exceeds program.remaining_budget_cents" }
  - { id: ERR_WAVE_INVALID_STATE, http: 409, condition: "Wave not in required state for commit/complete" }
  - { id: ERR_WAVE_NOT_RELEASABLE, http: 409, condition: "Release requires wave COMMITTED or IN_PRODUCTION" }
  - { id: ERR_WAVE_CAPACITY_EXCEEDED, http: 409, condition: "committed_units + total_components > capacity_units (equality allowed)" }
  - { id: ERR_STAGING_BAY_OVERLAP, http: 409, condition: "Half-open staging window overlaps a HELD reservation on the same bay" }
  - { id: ERR_RESERVATION_NOT_HELD, http: 409, condition: "Reservation release requires status HELD" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "Crew-day committed hours + new estimated_install_hours > 8" }
  - { id: ERR_DELIVERY_INVALID_STATE, http: 409, condition: "Delivery not in required state for dispatch/confirm/fail, or claim/signoff creation requires DELIVERED/COMPLETE" }
  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "Claim approve/reject requires status OPEN" }
  - { id: ERR_PART_RECALL_HOLD, http: 422, condition: "Claim part_number is on the program's recalled_part_numbers hold list" }
  - { id: ERR_CONTINGENCY_EXCEEDED, http: 402, condition: "replacement_cost_cents exceeds remaining contingency budget" }
  - { id: ERR_SIGNOFF_INVALID_STATE, http: 409, condition: "Signoff approve/reject requires SUBMITTED; resubmit requires REJECTED" }
  - { id: ERR_SIGNOFF_SELF_APPROVAL, http: 403, condition: "Signoff approver X-User-ID equals submitted_by_user_id" }
  - { id: ERR_SIGNOFF_ALREADY_PENDING, http: 409, condition: "A SUBMITTED signoff already exists for this delivery" }
  - { id: ERR_PHOTO_EVIDENCE_REQUIRED, http: 422, condition: "photo_urls must contain at least one entry" }
  - { id: ERR_LEDGER_INVALID_STATE, http: 409, condition: "Adjust requires ACTIVE or DEPLETED; dispose requires ACTIVE or DEPLETED" }
  - { id: ERR_STOCK_UNDERFLOW, http: 422, condition: "Adjust would drive quantity_on_hand below 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the resource's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Owns the rollout program lifecycle, prototype approvals, claim adjudication, and closeout disposition"
    identity: opaque
    exclusive_operations:
      - "POST /rollout-programs; POST /rollout-programs/{id}/activate; POST /rollout-programs/{id}/initiate-closeout; POST /rollout-programs/{id}/finalize-closeout"
      - "POST /fixture-prototypes/{id}/request-value-engineering; POST /fixture-prototypes/{id}/approve"
      - "POST /damage-claims/{id}/approve; POST /damage-claims/{id}/reject"
      - "POST /attic-stock-ledgers/{id}/dispose"
    shared_operations:
      - "All GET endpoints"

  - name: FixtureEngineer
    description: "Designs fixture prototypes and runs value-engineering revisions"
    identity: opaque
    exclusive_operations:
      - "POST /fixture-prototypes; PATCH /fixture-prototypes/{id}; POST /fixture-prototypes/{id}/submit-review"
    shared_operations:
      - "All GET endpoints"

  - name: ConfigCoordinator
    description: "Builds store-by-store kit configurations, freezes and releases them to production waves"
    identity: opaque
    exclusive_operations:
      - "POST /store-kit-configs; PATCH /store-kit-configs/{id}; POST /store-kit-configs/{id}/freeze; POST /store-kit-configs/{id}/release; POST /store-kit-configs/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: ProductionPlanner
    description: "Plans production waves aligned to the rollout calendar"
    identity: opaque
    exclusive_operations:
      - "POST /production-waves; POST /production-waves/{id}/commit; POST /production-waves/{id}/complete; POST /production-waves/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: WarehouseLead
    description: "Manages warehouse staging bays and attic stock levels"
    identity: opaque
    exclusive_operations:
      - "POST /staging-reservations; POST /staging-reservations/{id}/release; POST /attic-stock-ledgers/{id}/adjust"
    shared_operations:
      - "All GET endpoints"

  - name: InstallCrewLead
    description: "Schedules and executes install-crew deliveries; submits photo signoffs"
    identity: opaque
    exclusive_operations:
      - "POST /install-deliveries; POST /install-deliveries/{id}/dispatch; POST /install-deliveries/{id}/confirm-delivery; POST /install-deliveries/{id}/fail"
      - "POST /install-signoffs; POST /install-signoffs/{id}/resubmit"
    shared_operations:
      - "All GET endpoints"

  - name: HotlineAgent
    description: "Staffs the damage/missing-part hotline and files claims"
    identity: opaque
    exclusive_operations:
      - "POST /damage-claims"
    shared_operations:
      - "All GET endpoints"

  - name: StoreManager
    description: "Retail-side store manager who reviews and approves/rejects installation photo signoffs"
    identity: opaque
    exclusive_operations:
      - "POST /install-signoffs/{id}/approve; POST /install-signoffs/{id}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: PlatformAdmin
    description: "Operator role for the test-driving logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
