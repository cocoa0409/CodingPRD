        distinguishing_aspect: "GET /tickets honors limit/offset and reports total_count + has_more per the fixed envelope: 3 tickets, limit 2 -> page 1 has has_more true, page 2 has has_more false."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE; three PENDING tickets"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site PG", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
