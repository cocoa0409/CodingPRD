              as: PlatformAdmin
              captures: { company_q_id: $.data.id }
            - &k_company_q_admin
              call: "POST /api/companies/${company_q_id}/users"
              payload: { company_id: "${company_q_id}", email: "admin@q.example", display_name: "Q Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_q_admin_id: $.data.id }
            - call: "POST /api/companies/${company_q_id}/users/${company_q_admin_id}/accept"
