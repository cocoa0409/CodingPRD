            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { cg_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-CE2", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { cg_jp: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-CE2", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-CE2", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { cg_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${cg_c}", grove_id: "${cg_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { cg_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${cg_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${cg_gr}", assignment_id: "${cg_a}", gross_boxes: 40, tare_boxes: 0 }, as: FieldSupervisor, captures: { cg_d: "$.data.id", cg_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${cg_d}", fancy_boxes: 40, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${cg_d_v}" }, as: LineOperator, as_user_id: "op_ce2", captures: { cg_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${cg_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_ce2" }
            - { call: "POST /packinghouse/sort-runs/${cg_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_ce2" }
            - { call: "POST /packinghouse/export-lots", payload: { destination_market: JAPAN, variety: HAMLIN, grade: FANCY, boxes: 10, source_channel_id: "${cg_jp}", source_grove_id: "${cg_gr}", cold_treatment_hours: 24 }, as: ComplianceOfficer, as_user_id: "co_ce2_a", captures: { cg_lot: "$.data.id" } }
            - { call: "POST /packinghouse/export-lots/${cg_lot}/request-inspection", payload: {}, as: ComplianceOfficer, as_user_id: "co_ce2_a" }
            - { call: "POST /packinghouse/export-lots/${cg_lot}/phytosanitary-certificates", payload: { certificate_number: "PC-CE2", inspection_result: PASS }, as: ComplianceOfficer, as_user_id: "co_ce2_b", captures: { cg_cert: "$.data.id" } }
