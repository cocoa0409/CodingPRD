  - section: calculations
    instances:

      - name: rate_band_boundary_makes_a_thirty_one_mile_haul_cheaper_than_a_thirty_mile_haul
        claim_type: tiered_pricing
        grounds:
          - calculations.load_haul_pay
          - entities.Load.fields.rate_cents_per_ton_mile
          - entities.Load.fields.provisional_haul_pay_cents
        distinguishing_aspect: |
          The rate band is selected on the WHOLE distance as an average rate, not as a
          marginal waterfall, so crossing from 30 to 31 miles drops the rate from 26 to 22
          cents per ton-mile and the identical 26.50-ton load is priced 22220 cents over 30
          miles but only 19428 cents over 31 miles.
        test_recipe:
          setup:
            - "MillContract A quota 500 tons, ACTIVE tract, compliant carrier, one truck"
            - "Route A runs 30 miles to Mill A; a second route runs 31 miles to the same mill"
            - "Both loads carry 26.50 estimated tons on non-overlapping closed haul intervals"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
