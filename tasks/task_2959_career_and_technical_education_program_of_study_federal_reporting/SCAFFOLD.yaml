scenario: |
  2959. Career and Technical Education Program of Study & Federal Reporting (district career and
  technical education office): program of study sequence approval with secondary-to-postsecondary
  alignment, industry-recognized credential list and student attainment tracking, concentrator
  definition and cohort identification for accountability, advisory committee membership and meeting
  documentation, equipment and consumable budgeting with allowable-use rules under federal grants,
  teacher certification pathways including industry experience routes, performance indicator targets,
  negotiated levels and improvement plans, comprehensive local needs assessment cycle
domain_name: cte-program-of-study-federal-reporting
api_prefix: /cte

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Collections live directly under the
  # `/cte` prefix (`/cte/expenditures/{id}`, `/cte/sequence-courses/{id}`), and creation
  # endpoints use a one-level `/cte/<owner-collection>/{id}/<child-collection>` form only
  # to name the owning FK — no entity id ever appears twice in a path.

  state_machine_shape: cyclic
  # ProgramOfStudy carries TWO independent state axes on the same row:
  #   approval_status: DRAFT -> SUBMITTED -> COMMITTEE_REVIEW -> CHANGES_REQUESTED -> SUBMITTED (cycle)
  #                    and STATE_APPROVED -> SUSPENDED -> CHANGES_REQUESTED (cycle)
  #   clna_phase:      NOT_STARTED -> DATA_COLLECTION -> STAKEHOLDER_CONSULTATION -> GAP_ANALYSIS
  #                    -> CERTIFIED -> EXPIRED -> DATA_COLLECTION (cycle)
  # ImprovementPlan cycles SUBMITTED -> RETURNED -> SUBMITTED; PerformanceIndicator cycles
  # NEGOTIATING -> NEGOTIATING (alternating-offer negotiation) and NOT_MET -> NOT_MET.
  # Expenditure branches REQUESTED -> {CERTIFIED, DISALLOWED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - self_referential      # SequenceCourse.prerequisite_course_id -> SequenceCourse.id (prerequisite DAG)
    - cross_aggregate       # Expenditure spans GrantAward and ProgramOfStudy; ImprovementPlan spans
                            # PerformanceIndicator and Expenditure
    - many_to_many          # CommitteeMeeting.attendee_member_ids resolves many CommitteeMembers per meeting

  role_model: segregation_of_duties
  # Federal-grant controls: the operator (X-User-ID) who authors a ProgramOfStudy may not certify its
  # CLNA; the operator who requests an Expenditure may not certify its allowability; the party that
  # made the last negotiated-level offer may not accept that offer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: ProgramOfStudy
    parent: null
    common_fields: true
    fields:
      - name: cip_code
        type: string
        source: input
        description: Federal CIP code identifying the program of study.
        constraints: "matches ^[0-9]{2}\\.[0-9]{4}$; unique across all ProgramOfStudy rows"
      - name: title
        type: string
        source: input
        description: Local program title printed on the state approval packet.
        constraints: "1..120 characters"
      - name: cluster
        type: enum
        source: input
        description: Career cluster the program belongs to.
        constraints: "one of {HEALTH_SCIENCE, ADVANCED_MANUFACTURING, INFORMATION_TECHNOLOGY, CONSTRUCTION, AGRICULTURE}"
      - name: approval_status
        type: enum
        source: system
        description: Sequence-approval axis of the program lifecycle (see §1.2 machine 1).
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, COMMITTEE_REVIEW, CHANGES_REQUESTED, STATE_APPROVED, SUSPENDED}"
      - name: clna_phase
        type: enum
        source: system
        description: Comprehensive Local Needs Assessment axis, independent of approval_status (see §1.2 machine 2).
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, DATA_COLLECTION, STAKEHOLDER_CONSULTATION, GAP_ANALYSIS, CERTIFIED, EXPIRED}"
      - name: approval_round
        type: integer
        source: system
        description: Number of times the program has been submitted for approval; increments on every DRAFT/CHANGES_REQUESTED -> SUBMITTED transition.
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: Operator identifier (X-User-ID) that created the program; the segregation-of-duties anchor for CLNA certification.
      - name: clna_certified_by_user_id
        type: string
        source: system
        description: Operator identifier that certified the CLNA; null until GAP_ANALYSIS -> CERTIFIED fires.
        default: null
      - name: labor_market_data_asof
        type: string
        source: input
        description: Calendar date of the labor-market dataset backing the CLNA.
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: clna_certified_on
        type: string
        source: system
        description: Calendar date on which the CLNA was certified (logical clock date at certification).
        default: null
      - name: clna_expires_on
        type: string
        source: system
        description: clna_certified_on + CLNA_VALIDITY_DAYS; the instant after which clna_phase lazily becomes EXPIRED.
        default: null
      - name: alignment_index
        type: number
        source: computed
        description: Secondary-to-postsecondary alignment score produced by calculations.program_alignment_index; null before the first submit.
        default: null
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: alignment_index_variant
        type: enum
        source: computed
        description: Which variant of program_alignment_index produced the stored alignment_index.
        default: null
        constraints: "one of {PROVISIONAL_LOCAL, FEDERAL_CERTIFIED}"
      - name: secondary_credit_total
        type: number
        source: computed
        description: Credit-hour subtotal of the SECONDARY segment under the active variant's include set.
        default: 0
        constraints: "2 decimal places"
      - name: postsecondary_credit_total
        type: number
        source: computed
        description: Credit-hour subtotal of the POSTSECONDARY segment under the active variant's include set.
        default: 0
        constraints: "2 decimal places"
      - name: articulated_credit_total
        type: number
        source: computed
        description: Articulated (dual-credit) hour subtotal under the active variant's include set.
        default: 0
        constraints: "2 decimal places"
      - name: federal_reporting_eligible
        type: boolean
        source: computed
        description: True only while approval_status == STATE_APPROVED; drives whether the program appears in the federal Perkins submission.
        default: false
      - name: open_finding_codes
        type: array
        source: system
        description: Append-only list of state review finding codes raised by request-changes and by performance cascades.
        default: []
      - name: narrative_url
        type: string
        source: input
        description: Link to the narrative packet supplied on the most recent submit.
        default: null

  - name: SequenceCourse
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: code
        type: string
        source: input
        description: Local course code.
        constraints: "1..24 characters; unique per pos_id"
      - name: title
        type: string
        source: input
        description: Course title.
      - name: segment
        type: enum
        source: input
        description: Which half of the secondary-to-postsecondary sequence this course sits in.
        constraints: "one of {SECONDARY, POSTSECONDARY}"
      - name: position
        type: integer
        source: input
        description: Ordinal position of the course inside its program sequence.
        constraints: "1..8"
      - name: credit_hours
        type: number
        source: input
        description: Credit hours the course carries.
        constraints: "> 0, 2 decimal places"
      - name: articulated_credit_hours
        type: number
        source: input
        description: Portion of credit_hours that articulates to the postsecondary partner.
        default: 0
        constraints: ">= 0 and <= credit_hours, 2 decimal places"
      - name: articulation_verified
        type: boolean
        source: input
        description: True once the postsecondary partner has countersigned the articulation agreement; only verified hours enter the FEDERAL_CERTIFIED variant.
        default: false
      - name: prerequisite_course_id
        type: string
        source: input
        description: "FK -> SequenceCourse.id; null when the course opens the sequence"
        default: null
      - name: status
        type: enum
        source: input
        description: Curriculum status; only ACTIVE courses enter the FEDERAL_CERTIFIED alignment variant.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: depth_from_root
        type: integer
        source: computed
        description: Number of prerequisite hops from this course back to a course with prerequisite_course_id == null.
        default: 0

  - name: Credential
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: code
        type: string
        source: input
        description: Industry-recognized credential code on the district's approved list.
        constraints: "1..32 characters; unique per pos_id"
      - name: title
        type: string
        source: input
        description: Credential title.
      - name: tier
        type: enum
        source: input
        description: Recognition tier of the credential.
        constraints: "one of {STATE_RECOGNIZED, NATIONAL, LOCAL}"
      - name: exam_required
        type: boolean
        source: input
        description: Whether attainment requires a proctored exam score.
        default: true
      - name: counts_toward_indicator
        type: boolean
        source: computed
        description: True iff tier IN {STATE_RECOGNIZED, NATIONAL}; LOCAL credentials never enter performance-indicator numerators.
        default: false
      - name: verified_attainment_count
        type: integer
        source: computed
        description: Count of CredentialAttainment rows for this credential whose verification_status == VERIFIED.
        default: 0

  - name: Student
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: state_student_id
        type: string
        source: input
        description: State-assigned student identifier.
        constraints: "matches ^[0-9]{9}$; unique per pos_id"
      - name: cohort_year
        type: integer
        source: input
        description: Accountability cohort year the student is reported under.
        constraints: "2020..2035"
      - name: special_population_codes
        type: array
        source: input
        description: Federal special-population membership codes.
        default: []
        constraints: "each element one of {ECON_DISADV, IEP, EL, SINGLE_PARENT, NONTRADITIONAL}; no duplicates"
      - name: cte_credits_earned
        type: number
        source: computed
        description: Running sum of credit_delta across all credit postings against ACTIVE SequenceCourse rows of the student's program.
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: concentrator_status
        type: enum
        source: computed
        description: Accountability classification produced by calculations.concentrator_cohort_classification.
        default: PARTICIPANT
        constraints: "one of {PARTICIPANT, CONCENTRATOR, COMPLETER}"
      - name: verified_qualifying_attainment_count
        type: integer
        source: computed
        description: Count of this student's CredentialAttainment rows with counted_for_indicator == true.
        default: 0
      - name: exited_on
        type: string
        source: system
        description: Calendar date the student left the program; null while enrolled.
        default: null
      - name: exit_reason
        type: enum
        source: input
        description: Reason recorded on exit.
        default: null
        constraints: "one of {GRADUATED, TRANSFERRED, WITHDREW}"

  - name: CredentialAttainment
    parent: Student
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; taken from the {id} path segment of the creating call"
      - name: credential_id
        type: string
        source: input
        description: "FK -> Credential.id; must belong to the same ProgramOfStudy as the student"
      - name: attained_on
        type: string
        source: input
        description: Calendar date the credential was earned.
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: exam_score
        type: number
        source: input
        description: Proctored exam score; required when the credential has exam_required == true.
        default: null
        constraints: "0..100, 2 decimal places"
      - name: verification_status
        type: enum
        source: input
        description: Whether the district has evidence on file for the attainment.
        constraints: "one of {SELF_REPORTED, VERIFIED}"
      - name: counted_for_indicator
        type: boolean
        source: computed
        description: True iff verification_status == VERIFIED and the referenced Credential has counts_toward_indicator == true.
        default: false

  - name: AdvisoryCommittee
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: name
        type: string
        source: input
        description: Committee name recorded in the approval packet.
      - name: quorum_min_members
        type: integer
        source: input
        description: Minimum number of eligible members that must be present for a meeting to carry quorum.
        constraints: "3..15"
      - name: employer_seat_min
        type: integer
        source: input
        description: Minimum number of present members whose sector == EMPLOYER.
        constraints: "1..8; must be <= quorum_min_members"
      - name: status
        type: enum
        source: system
        description: FORMING until membership thresholds are met; DISSOLVED when a newer committee is created on the same program.
        default: FORMING
        constraints: "one of {FORMING, ACTIVE, DISSOLVED}"
      - name: active_member_count
        type: integer
        source: computed
        description: Count of CommitteeMember rows on this committee with status == ACTIVE.
        default: 0
      - name: employer_member_count
        type: integer
        source: computed
        description: Count of CommitteeMember rows on this committee with status == ACTIVE and sector == EMPLOYER.
        default: 0
      - name: chair_member_id
        type: string
        source: computed
        description: Identifier of the single CommitteeMember on this committee with status == ACTIVE and is_chair == true; mirrors that CommitteeMember.id. Null while no such member exists.
        default: null

  - name: CommitteeMember
    parent: AdvisoryCommittee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: system
        description: "FK -> AdvisoryCommittee.id; taken from the {id} path segment of the creating call"
      - name: full_name
        type: string
        source: input
        description: Member name recorded in the membership roster.
      - name: sector
        type: enum
        source: input
        description: Stakeholder sector the member represents.
        constraints: "one of {EMPLOYER, POSTSECONDARY, LABOR, PARENT, STUDENT}"
      - name: seat_code
        type: string
        source: input
        description: Named seat the member occupies; at most one ACTIVE member may occupy a seat_code over any given date range.
        constraints: "matches ^[A-Z]{3}-[0-9]{1,2}$"
      - name: term_start_on
        type: string
        source: input
        description: First calendar date of the member's term (inclusive).
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: term_end_on
        type: string
        source: input
        description: Exclusive upper bound of the member's term; the seat is free again on this exact date.
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be strictly after term_start_on"
      - name: is_chair
        type: boolean
        source: input
        description: True for the single chairing member; the CommitteeChair role authenticates as this member's id.
        default: false
      - name: status
        type: enum
        source: system
        description: ACTIVE while the logical clock date is inside [term_start_on, term_end_on); EXPIRED once the clock date reaches term_end_on.
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRED}"

  - name: CommitteeMeeting
    parent: AdvisoryCommittee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: system
        description: "FK -> AdvisoryCommittee.id; taken from the {id} path segment of the creating call"
      - name: agenda_kind
        type: enum
        source: input
        description: Documented purpose of the meeting; each purpose unlocks a different downstream gate.
        constraints: "one of {CLNA_STAKEHOLDER, POS_ENDORSEMENT, EQUIPMENT_REVIEW}"
      - name: scheduled_for
        type: datetime
        source: input
        description: Scheduled meeting instant.
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: held_at
        type: datetime
        source: input
        description: Instant the meeting actually convened; supplied when minutes are recorded.
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: attendee_member_ids
        type: array
        source: input
        description: CommitteeMember identifiers recorded present in the minutes; each element mirrors a CommitteeMember.id on the same committee_id.
        default: []
      - name: vote_yes
        type: integer
        source: input
        description: Affirmative votes recorded in the minutes.
        default: 0
        constraints: ">= 0"
      - name: vote_no
        type: integer
        source: input
        description: Negative votes recorded in the minutes.
        default: 0
        constraints: ">= 0"
      - name: minutes_url
        type: string
        source: input
        description: Link to the signed minutes document.
        default: null
      - name: amendment_reason
        type: string
        source: input
        description: Reason supplied when minutes already FINALIZED are re-recorded.
        default: null
      - name: minutes_status
        type: enum
        source: system
        description: Documentation state of the meeting (see §1.2 machine 6).
        default: SCHEDULED
        constraints: "one of {SCHEDULED, FINALIZED, AMENDED}"
      - name: eligible_attendee_count
        type: integer
        source: computed
        description: Number of attendee_member_ids that resolve to a CommitteeMember on this committee whose term covers held_at.
        default: 0
      - name: employer_attendee_count
        type: integer
        source: computed
        description: Number of eligible attendees whose sector == EMPLOYER.
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: Output of calculations.committee_quorum_evaluation.
        default: false
      - name: endorsement_passed
        type: boolean
        source: computed
        description: True iff quorum_met and vote_yes > vote_no and (vote_yes + vote_no) <= eligible_attendee_count.
        default: false

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Federal fiscal year of the award.
        constraints: "2020..2035; unique across all GrantAward rows"
      - name: allocation_cents
        type: integer
        source: input
        description: Total federal allocation in cents.
        constraints: "> 0"
      - name: obligation_window_start
        type: string
        source: input
        description: First calendar date on which funds may be obligated (inclusive).
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: obligation_window_end
        type: string
        source: input
        description: Last calendar date on which funds may be obligated (inclusive).
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be strictly after obligation_window_start"
      - name: status
        type: enum
        source: system
        description: OPEN while the logical clock date is within [obligation_window_start, obligation_window_end]; CLOSED once the clock date passes obligation_window_end.
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: direct_obligated_cents
        type: integer
        source: computed
        description: Sum of Expenditure.approved_cents over expenditures on this award whose status IN {CERTIFIED, OBLIGATED}; each addend is already rounded per line (see calculations.grant_obligation_rollup).
        default: 0
      - name: indirect_rate
        type: number
        source: computed
        description: Indirect-cost rate selected by tier lookup on direct_obligated_cents.
        default: 0.0812
        constraints: "4 decimal places"
      - name: indirect_pool_cents
        type: integer
        source: computed
        description: round_half_up(direct_obligated_cents * indirect_rate); recomputed from scratch on every expenditure state change, never accumulated incrementally.
        default: 0
      - name: obligated_cents
        type: integer
        source: computed
        description: direct_obligated_cents + indirect_pool_cents.
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: allocation_cents - obligated_cents; the conserved-quantity anchor of the grant-funds invariant.
        default: 0
      - name: admin_cap_cents
        type: integer
        source: computed
        description: round_half_up(allocation_cents * ADMIN_CAP_PCT); ceiling on cumulative ADMINISTRATION-category obligations.
        default: 0
      - name: admin_obligated_cents
        type: integer
        source: computed
        description: Sum of Expenditure.approved_cents over expenditures on this award with category == ADMINISTRATION and status IN {CERTIFIED, OBLIGATED}.
        default: 0

  - name: Expenditure
    parent: GrantAward
    common_fields: true
    fields:
      - name: grant_award_id
        type: string
        source: system
        description: "FK -> GrantAward.id; taken from the {id} path segment of the creating call"
      - name: pos_id
        type: string
        source: input
        description: "FK -> ProgramOfStudy.id; the program the purchase is charged to"
      - name: category
        type: enum
        source: input
        description: Federal allowable-use category driving federal_share_pct and category-specific gates.
        constraints: "one of {EQUIPMENT, CONSUMABLE, PROFESSIONAL_DEVELOPMENT, ADMINISTRATION, ENTERTAINMENT}"
      - name: description
        type: string
        source: input
        description: Purchase description recorded in the grant file.
      - name: unit_cost_cents
        type: integer
        source: input
        description: Per-unit cost in cents; compared against CAPITAL_THRESHOLD_CENTS for the capital-review gate.
        constraints: "> 0"
      - name: quantity
        type: integer
        source: input
        description: Number of units purchased.
        constraints: ">= 1"
      - name: gross_cents
        type: integer
        source: computed
        description: unit_cost_cents * quantity.
        default: 0
      - name: federal_share_pct
        type: number
        source: computed
        description: Category federal share selected from calculations.expenditure_federal_share constants.
        default: 0
        constraints: "4 decimal places"
      - name: approved_cents
        type: integer
        source: computed
        description: round_half_up(gross_cents * federal_share_pct); null until the expenditure is certified.
        default: null
      - name: asset_tag
        type: string
        source: input
        description: District asset tag for equipment purchases; when non-null it reserves the asset over the service period on the award.
        default: null
        constraints: "matches ^[A-Z0-9-]{3,24}$"
      - name: service_period_start
        type: string
        source: input
        description: First calendar date of the service/possession period (inclusive).
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: service_period_end
        type: string
        source: input
        description: Last calendar date of the service/possession period (inclusive).
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be >= service_period_start"
      - name: status
        type: enum
        source: system
        description: Allowability lifecycle (see §1.2 machine 5).
        default: REQUESTED
        constraints: "one of {REQUESTED, CERTIFIED, OBLIGATED, DISALLOWED, VOIDED, BLOCKED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: Operator identifier that created the request; the segregation-of-duties anchor for certification.
      - name: certified_by_user_id
        type: string
        source: system
        description: Operator identifier that certified or disallowed the request.
        default: null
      - name: finding_code
        type: enum
        source: system
        description: Allowability finding recorded on a DISALLOWED expenditure.
        default: null
        constraints: "one of {ENTERTAINMENT_PROHIBITED, ADMIN_CAP, NO_CAPITAL_REVIEW, OUTSIDE_WINDOW, OTHER}"
      - name: obligation_reference
        type: string
        source: input
        description: Purchase-order reference stamped when the expenditure is obligated.
        default: null
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the expenditure is voided.
        default: null

  - name: PerformanceIndicator
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: indicator_code
        type: enum
        source: input
        description: Federal performance indicator being negotiated and reported.
        constraints: "one of {1S1_GRAD_RATE, 2S1_ACADEMIC, 3S1_POST_PROGRAM, 4S1_CREDENTIAL, 5S3_WORK_BASED}; the triple (pos_id, indicator_code, reporting_year) is unique"
      - name: reporting_year
        type: integer
        source: input
        description: Federal reporting year the indicator is negotiated for.
        constraints: "2020..2035"
      - name: cohort_year
        type: integer
        source: input
        description: Student cohort_year whose members form the denominator.
        constraints: "2020..2035"
      - name: baseline_pct
        type: number
        source: input
        description: Prior-year performance used as the arbitration fallback level.
        constraints: "0.00..100.00, 2 decimal places"
      - name: negotiated_level_pct
        type: number
        source: system
        description: Agreed or arbitrated target level; null until the indicator reaches AGREED or ARBITRATED.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: last_offer_pct
        type: number
        source: system
        description: Level carried by the most recent negotiation offer.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: last_offer_by_user_id
        type: string
        source: system
        description: Operator identifier that made the most recent offer; the segregation-of-duties anchor for accept-level.
        default: null
      - name: last_offer_by_role
        type: enum
        source: system
        description: Role that made the most recent offer; the next offer must come from the other role.
        default: null
        constraints: "one of {CteDirector, StateComplianceReviewer}"
      - name: negotiation_round
        type: integer
        source: system
        description: Count of offers exchanged; increments on every negotiation offer.
        default: 0
      - name: denominator_count
        type: integer
        source: computed
        description: Count of Student rows with pos_id == this indicator's pos_id, cohort_year == this indicator's cohort_year, and concentrator_status IN {CONCENTRATOR, COMPLETER}.
        default: 0
      - name: numerator_count
        type: integer
        source: computed
        description: Count of the denominator students whose verified_qualifying_attainment_count >= 1.
        default: 0
      - name: small_cohort_flag
        type: boolean
        source: computed
        description: True iff denominator_count < SMALL_COHORT_MIN; suppresses scoring under the FINAL variant only.
        default: true
      - name: preliminary_actual_pct
        type: number
        source: computed
        description: PRELIMINARY_UNADJUSTED variant output of calculations.performance_indicator_actual; always recomputed on read, never suppressed for small cohorts.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: preliminary_status_projection
        type: enum
        source: computed
        description: What the PRELIMINARY_UNADJUSTED variant would score, ignoring the small-cohort suppression.
        default: UNDEFINED
        constraints: "one of {MET, NOT_MET, UNDEFINED}"
      - name: actual_pct
        type: number
        source: computed
        description: FINAL_SMALL_COHORT_ADJUSTED variant output persisted when the reporting year is closed; null before the first close.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: met_threshold_pct
        type: number
        source: computed
        description: round_half_up(negotiated_level_pct * PERFORMANCE_TOLERANCE, 2); null while negotiated_level_pct is null.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: consecutive_miss_count
        type: integer
        source: system
        description: Number of consecutive closed reporting years scored NOT_MET; reset to 0 when an improvement plan is accepted.
        default: 0
      - name: status
        type: enum
        source: system
        description: Negotiation and accountability lifecycle (see §1.2 machine 4).
        default: PROPOSED
        constraints: "one of {PROPOSED, NEGOTIATING, AGREED, ARBITRATED, MET, NOT_MET, NOT_SCORED, IMPROVEMENT_REQUIRED, MONITORING, SANCTIONED}"
      - name: closed_on
        type: string
        source: system
        description: Calendar date of the most recent close-reporting-year call.
        default: null

  - name: ImprovementPlan
    parent: PerformanceIndicator
    common_fields: true
    fields:
      - name: performance_indicator_id
        type: string
        source: system
        description: "FK -> PerformanceIndicator.id; taken from the {id} path segment of the creating call"
      - name: funding_expenditure_id
        type: string
        source: input
        description: "FK -> Expenditure.id; the certified purchase financing the plan, or null for an unfunded plan"
        default: null
      - name: milestones
        type: array
        source: input
        description: Ordered milestone objects, each with a `label` string and a `due_on` ISO calendar date.
        constraints: "each element { label: string, due_on: YYYY-MM-DD }"
      - name: milestone_count
        type: integer
        source: computed
        description: Length of milestones.
        default: 0
      - name: revision_round
        type: integer
        source: system
        description: Number of times the plan has been returned for revision.
        default: 0
      - name: status
        type: enum
        source: system
        description: Plan review lifecycle (see §1.2 machine 3).
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED, ACCEPTED, REJECTED_FINAL}"
      - name: return_reasons
        type: array
        source: system
        description: Append-only list of return_reason strings recorded on each return.
        default: []
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance.
        default: null

  - name: Educator
    parent: ProgramOfStudy
    common_fields: true
    fields:
      - name: pos_id
        type: string
        source: system
        description: "FK -> ProgramOfStudy.id; taken from the {id} path segment of the creating call"
      - name: full_name
        type: string
        source: input
        description: Instructor name on the certification file.
      - name: certification_route
        type: enum
        source: input
        description: Certification pathway the instructor is credentialed through.
        constraints: "one of {TRADITIONAL, INDUSTRY_EXPERIENCE, ALTERNATIVE}"
      - name: claimed_industry_hours
        type: integer
        source: input
        description: Industry work hours the instructor claims; caps how many hours may be verified.
        default: 0
        constraints: ">= 0"
      - name: verified_industry_hours
        type: integer
        source: computed
        description: Running sum of verified_hours across all industry-hour verifications.
        default: 0
      - name: credential_expires_on
        type: string
        source: input
        description: Calendar date the teaching credential lapses.
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: Certification eligibility (see §1.2 machine 7).
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, ELIGIBLE, LAPSED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- machine 1: sequence-approval axis on ProgramOfStudy (cyclic) -------
  - entity: ProgramOfStudy
    initial_state: DRAFT
    terminal_states: []
    note: |
      Axis A of two independent axes on the same row. Field: approval_status. Evolves independently
      of clna_phase (machine 2) — a program may sit in STATE_APPROVED while its clna_phase walks
      CERTIFIED -> EXPIRED, and in DRAFT while clna_phase reaches CERTIFIED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cte/programs-of-study/{id}/submit"
        actor: CteDirector
        preconditions:
          - "clna_phase IN {CERTIFIED, EXPIRED} (the CLNA has been certified at least once)"
          - "current_utc <= clna_expires_on (clna_phase has not lazily expired)"
          - "at least one SequenceCourse with pos_id == this program, status == ACTIVE, segment == SECONDARY"
          - "at least one SequenceCourse with pos_id == this program, status == ACTIVE, segment == POSTSECONDARY"
          - "at least one Credential with pos_id == this program"
          - "at least one Educator with pos_id == this program and status == ELIGIBLE"
        side_effects:
          - "approval_round += 1"
          - "narrative_url := request narrative_url"
          - "recompute calculations.program_alignment_index under variant PROVISIONAL_LOCAL; write alignment_index, alignment_index_variant := PROVISIONAL_LOCAL, secondary_credit_total, postsecondary_credit_total, articulated_credit_total"
          - "increments ProgramOfStudy.version by 1; refreshes updated_at"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /cte/programs-of-study/{id}/submit"
        actor: CteDirector
        note: "Revision loop — this is the cycle edge; the same endpoint re-enters SUBMITTED after a state finding."
        preconditions:
          - "same six preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "approval_round += 1"
          - "open_finding_codes := [] (findings cleared on resubmission)"
          - "recompute calculations.program_alignment_index under variant PROVISIONAL_LOCAL; write alignment_index and alignment_index_variant := PROVISIONAL_LOCAL"
          - "increments ProgramOfStudy.version by 1"
      - from: SUBMITTED
        to: COMMITTEE_REVIEW
        trigger: "system side effect of POST /cte/committee-meetings/{id}/minutes when the meeting's agenda_kind == POS_ENDORSEMENT and the recomputed endorsement_passed == true"
        actor: system
        preconditions:
          - "the meeting's committee_id belongs to an AdvisoryCommittee whose pos_id == this program and whose status == ACTIVE"
          - "approval_status == SUBMITTED at the moment the minutes are finalized"
        side_effects:
          - "increments ProgramOfStudy.version by 1"
      - from: COMMITTEE_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /cte/programs-of-study/{id}/request-changes"
        actor: StateComplianceReviewer
        preconditions:
          - "approval_status == COMMITTEE_REVIEW"
        side_effects:
          - "open_finding_codes := request finding_codes"
          - "increments ProgramOfStudy.version by 1"
      - from: COMMITTEE_REVIEW
        to: STATE_APPROVED
        trigger: "POST /cte/programs-of-study/{id}/state-approve"
        actor: StateComplianceReviewer
        preconditions:
          - "clna_phase IN {CERTIFIED, EXPIRED} and current_utc <= clna_expires_on"
          - "a CommitteeMeeting exists on this program's ACTIVE AdvisoryCommittee with agenda_kind == POS_ENDORSEMENT, minutes_status IN {FINALIZED, AMENDED} and endorsement_passed == true"
          - "calculations.program_alignment_index under variant FEDERAL_CERTIFIED evaluates to >= ALIGNMENT_APPROVAL_FLOOR"
        side_effects:
          - "recompute calculations.program_alignment_index under variant FEDERAL_CERTIFIED; overwrite alignment_index, alignment_index_variant := FEDERAL_CERTIFIED, secondary_credit_total, postsecondary_credit_total, articulated_credit_total"
          - "federal_reporting_eligible := true"
          - "open_finding_codes := []"
          - "increments ProgramOfStudy.version by 1"
      - from: STATE_APPROVED
        to: SUSPENDED
        trigger: "system cascade link 3 of POST /cte/performance-indicators/{id}/close-reporting-year — fired by link 2 (PerformanceIndicator NOT_MET -> IMPROVEMENT_REQUIRED), not by the close call itself"
        actor: system
        preconditions:
          - "a PerformanceIndicator with pos_id == this program has just entered IMPROVEMENT_REQUIRED"
          - "approval_status == STATE_APPROVED"
        side_effects:
          - "federal_reporting_eligible := false"
          - "open_finding_codes append 'PERF_SUSPENSION'"
          - "cascade link 4 (caused by this suspension): every Expenditure with pos_id == this program and status == REQUESTED transitions REQUESTED -> BLOCKED"
          - "increments ProgramOfStudy.version by 1"
      - from: SUSPENDED
        to: CHANGES_REQUESTED
        trigger: "system cascade link 3 of POST /cte/improvement-plans/{id}/accept — fired by link 2 (PerformanceIndicator IMPROVEMENT_REQUIRED -> MONITORING with consecutive_miss_count reset to 0), not by the accept call itself"
        actor: system
        preconditions:
          - "approval_status == SUSPENDED"
          - "the accepted plan's PerformanceIndicator has pos_id == this program and its consecutive_miss_count has just been reset to 0"
        side_effects:
          - "open_finding_codes append 'PERF_IMPROVEMENT_ACCEPTED'"
          - "cascade link 4 (caused by this un-suspension): every Expenditure with pos_id == this program and status == BLOCKED transitions BLOCKED -> REQUESTED"
          - "increments ProgramOfStudy.version by 1"

  # ---- machine 2: CLNA axis on ProgramOfStudy (parallel + cyclic) ---------
  - entity: ProgramOfStudy
    initial_state: NOT_STARTED
    terminal_states: []
    note: |
      Axis B of two independent axes on the same row. Field: clna_phase. All explicit advances go
      through POST /cte/programs-of-study/{id}/clna-advance with a `to_phase` body field naming the
      target; the CERTIFIED -> EXPIRED edge is the only system-driven one.
    transitions:
      - from: NOT_STARTED
        to: DATA_COLLECTION
        trigger: "POST /cte/programs-of-study/{id}/clna-advance with to_phase == DATA_COLLECTION"
        actor: CteDirector
        preconditions:
          - "labor_market_data_asof is non-null"
        side_effects:
          - "increments ProgramOfStudy.version by 1"
      - from: DATA_COLLECTION
        to: STAKEHOLDER_CONSULTATION
        trigger: "POST /cte/programs-of-study/{id}/clna-advance with to_phase == STAKEHOLDER_CONSULTATION"
        actor: CteDirector
        preconditions:
          - "(current_utc date - labor_market_data_asof) <= LABOR_MARKET_DATA_MAX_AGE_DAYS days"
        side_effects:
          - "increments ProgramOfStudy.version by 1"
      - from: STAKEHOLDER_CONSULTATION
        to: GAP_ANALYSIS
        trigger: "POST /cte/programs-of-study/{id}/clna-advance with to_phase == GAP_ANALYSIS"
        actor: CteDirector
        preconditions:
          - "at least CLNA_STAKEHOLDER_MEETINGS_MIN CommitteeMeeting rows exist on this program's ACTIVE AdvisoryCommittee with agenda_kind == CLNA_STAKEHOLDER, minutes_status IN {FINALIZED, AMENDED} and quorum_met == true"
        side_effects:
          - "increments ProgramOfStudy.version by 1"
      - from: GAP_ANALYSIS
        to: CERTIFIED
        trigger: "POST /cte/programs-of-study/{id}/clna-advance with to_phase == CERTIFIED"
        actor: CteDirector
        preconditions:
          - "X-User-ID != authored_by_user_id (segregation of duties: the author may not certify)"
        side_effects:
          - "clna_certified_by_user_id := X-User-ID"
          - "clna_certified_on := current_utc date"
          - "clna_expires_on := clna_certified_on + CLNA_VALIDITY_DAYS days"
          - "increments ProgramOfStudy.version by 1"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system lazy re-evaluation performed as the first step of every write endpoint whose path begins /cte/programs-of-study/{id} and of POST /cte/expenditures/{id}/certify-allowability, whenever current_utc date > clna_expires_on"
        actor: system
        preconditions:
          - "clna_phase == CERTIFIED"
          - "current_utc date > clna_expires_on"
        side_effects:
          - "increments ProgramOfStudy.version by 1"
        note: "Deterministic and clock-driven only: no request field can move this edge, and it is evaluated before any other validation on the affected endpoints."
      - from: EXPIRED
        to: DATA_COLLECTION
        trigger: "POST /cte/programs-of-study/{id}/clna-advance with to_phase == DATA_COLLECTION"
        actor: CteDirector
        note: "Cycle edge — a lapsed needs assessment restarts the four-phase walk."
        preconditions:
          - "labor_market_data_asof is non-null"
        side_effects:
          - "clna_certified_on := null, clna_expires_on := null, clna_certified_by_user_id := null"
          - "increments ProgramOfStudy.version by 1"

  # ---- machine 3: ImprovementPlan review loop (cyclic) -------------------
  - entity: ImprovementPlan
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED_FINAL]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cte/improvement-plans/{id}/submit"
        actor: CteDirector
        preconditions:
          - "milestone_count >= MIN_PLAN_MILESTONES"
          - "funding_expenditure_id is null, OR the referenced Expenditure has status IN {CERTIFIED, OBLIGATED} and its pos_id equals the plan's PerformanceIndicator.pos_id"
        side_effects:
          - "submitted_at := current_utc"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /cte/improvement-plans/{id}/return"
        actor: StateComplianceReviewer
        preconditions:
          - "revision_round + 1 < MAX_PLAN_REVISION_ROUNDS (the counter is incremented first and the branch is chosen on the incremented value, so pre-call revision_round IN {0, 1})"
        side_effects:
          - "revision_round += 1"
          - "return_reasons append request return_reason"
          - "increments ImprovementPlan.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /cte/improvement-plans/{id}/submit"
        actor: CteDirector
        note: "Cycle edge — the plan may be resubmitted up to MAX_PLAN_REVISION_ROUNDS times."
        preconditions:
          - "milestone_count >= MIN_PLAN_MILESTONES"
          - "funding_expenditure_id is null, OR the referenced Expenditure has status IN {CERTIFIED, OBLIGATED} and its pos_id equals the plan's PerformanceIndicator.pos_id"
        side_effects:
          - "submitted_at := current_utc"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED_FINAL
        trigger: "POST /cte/improvement-plans/{id}/return when revision_round + 1 == MAX_PLAN_REVISION_ROUNDS"
        actor: StateComplianceReviewer
        note: "Branch sibling of SUBMITTED -> RETURNED with a divergent side-effect set: the loop terminates instead of continuing."
        preconditions:
          - "revision_round + 1 == MAX_PLAN_REVISION_ROUNDS (pre-call revision_round == 2, so this is the third return)"
        side_effects:
          - "revision_round += 1"
          - "return_reasons append request return_reason"
          - "the plan's PerformanceIndicator transitions IMPROVEMENT_REQUIRED -> SANCTIONED"
          - "the PerformanceIndicator's ProgramOfStudy stays SUSPENDED and open_finding_codes append 'PERF_SANCTION'"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cte/improvement-plans/{id}/accept"
        actor: StateComplianceReviewer
        preconditions:
          - "the plan's PerformanceIndicator.status == IMPROVEMENT_REQUIRED"
        side_effects:
          - "accepted_at := current_utc"
          - "cascade link 2 (caused by this acceptance): the plan's PerformanceIndicator transitions IMPROVEMENT_REQUIRED -> MONITORING and consecutive_miss_count := 0"
          - "cascade link 3 (caused by link 2's reset): that indicator's ProgramOfStudy transitions SUSPENDED -> CHANGES_REQUESTED"
          - "cascade link 4 (caused by link 3): every Expenditure with that pos_id and status == BLOCKED transitions BLOCKED -> REQUESTED"
          - "increments ImprovementPlan.version by 1"

  # ---- machine 4: PerformanceIndicator negotiation + accountability -------
  - entity: PerformanceIndicator
    initial_state: PROPOSED
    terminal_states: [MET, NOT_SCORED, SANCTIONED]
    note: "Alternating-offer negotiation: NEGOTIATING -> NEGOTIATING is a self-loop, and NOT_MET -> NOT_MET is a second self-loop across successive closed reporting years."
    transitions:
      - from: PROPOSED
        to: NEGOTIATING
        trigger: "POST /cte/performance-indicators/{id}/negotiation-offers"
        actor: StateComplianceReviewer
        preconditions:
          - "negotiation_round == 0"
          - "acting role is StateComplianceReviewer (the state opens the negotiation)"
        side_effects:
          - "negotiation_round := 1"
          - "last_offer_pct := request offered_level_pct; last_offer_by_user_id := X-User-ID; last_offer_by_role := StateComplianceReviewer"
          - "increments PerformanceIndicator.version by 1"
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /cte/performance-indicators/{id}/negotiation-offers"
        actor: CteDirector | StateComplianceReviewer
        note: "Cycle edge — counter-offer. The acting role MUST differ from last_offer_by_role and the acting X-User-ID MUST differ from last_offer_by_user_id."
        preconditions:
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "acting role != last_offer_by_role"
          - "X-User-ID != last_offer_by_user_id (segregation of duties)"
        side_effects:
          - "negotiation_round += 1"
          - "last_offer_pct := request offered_level_pct; last_offer_by_user_id := X-User-ID; last_offer_by_role := acting role"
          - "increments PerformanceIndicator.version by 1"
      - from: NEGOTIATING
        to: AGREED
        trigger: "POST /cte/performance-indicators/{id}/accept-level"
        actor: CteDirector | StateComplianceReviewer
        preconditions:
          - "last_offer_pct is non-null"
          - "acting role != last_offer_by_role and X-User-ID != last_offer_by_user_id (the offering party may not accept its own offer)"
        side_effects:
          - "negotiated_level_pct := last_offer_pct"
          - "met_threshold_pct := round_half_up(negotiated_level_pct * PERFORMANCE_TOLERANCE, 2)"
          - "increments PerformanceIndicator.version by 1"
      - from: NEGOTIATING
        to: ARBITRATED
        trigger: "POST /cte/performance-indicators/{id}/negotiation-offers when negotiation_round == MAX_NEGOTIATION_ROUNDS"
        actor: CteDirector | StateComplianceReviewer
        note: "Branch sibling of the NEGOTIATING self-loop with a divergent side-effect set: the offered level is discarded and the federal fallback (baseline_pct) becomes binding."
        preconditions:
          - "negotiation_round == MAX_NEGOTIATION_ROUNDS"
          - "acting role != last_offer_by_role and X-User-ID != last_offer_by_user_id"
        side_effects:
          - "negotiation_round += 1"
          - "negotiated_level_pct := baseline_pct (the request's offered_level_pct is recorded in last_offer_pct but is NOT binding)"
          - "last_offer_pct := request offered_level_pct; last_offer_by_user_id := X-User-ID; last_offer_by_role := acting role"
          - "met_threshold_pct := round_half_up(baseline_pct * PERFORMANCE_TOLERANCE, 2)"
          - "increments PerformanceIndicator.version by 1"
      - from: AGREED
        to: MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN"
          - "calculations.performance_indicator_actual variant FINAL_SMALL_COHORT_ADJUSTED yields actual_pct >= met_threshold_pct"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on"
          - "consecutive_miss_count := 0"
          - "increments PerformanceIndicator.version by 1"
      - from: AGREED
        to: NOT_MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        note: "Branch sibling of AGREED -> MET; divergent side effects (miss counter, possible cascade)."
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN"
          - "FINAL variant actual_pct < met_threshold_pct"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on"
          - "cascade link 1: consecutive_miss_count += 1"
          - "if consecutive_miss_count >= MISS_TOLERANCE then cascade link 2 (caused by link 1 reaching the tolerance) fires: NOT_MET -> IMPROVEMENT_REQUIRED"
          - "increments PerformanceIndicator.version by 1"
      - from: AGREED
        to: NOT_SCORED
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        note: "Small-cohort suppression branch. Its side-effect set diverges from both scoring branches: the miss counter is left untouched."
        preconditions:
          - "denominator_count < SMALL_COHORT_MIN (includes denominator_count == 0)"
        side_effects:
          - "actual_pct := FINAL variant output (null when denominator_count == 0, otherwise the unsuppressed percentage); closed_on := request closed_on"
          - "consecutive_miss_count unchanged"
          - "increments PerformanceIndicator.version by 1"
      - from: ARBITRATED
        to: MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct >= met_threshold_pct"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on; consecutive_miss_count := 0"
          - "increments PerformanceIndicator.version by 1"
      - from: ARBITRATED
        to: NOT_MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct < met_threshold_pct"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on; consecutive_miss_count += 1"
          - "if consecutive_miss_count >= MISS_TOLERANCE then NOT_MET -> IMPROVEMENT_REQUIRED fires"
          - "increments PerformanceIndicator.version by 1"
      - from: ARBITRATED
        to: NOT_SCORED
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count < SMALL_COHORT_MIN"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on; consecutive_miss_count unchanged"
          - "increments PerformanceIndicator.version by 1"
      - from: NOT_MET
        to: NOT_MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        note: "Cycle edge — a second consecutive miss re-enters NOT_MET before the IMPROVEMENT_REQUIRED escalation fires."
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct < met_threshold_pct"
          - "request closed_on > closed_on (each close advances the reporting year)"
        side_effects:
          - "cascade link 1: consecutive_miss_count += 1"
          - "actual_pct := FINAL variant output; closed_on := request closed_on"
          - "if consecutive_miss_count >= MISS_TOLERANCE then cascade link 2 fires: NOT_MET -> IMPROVEMENT_REQUIRED"
          - "increments PerformanceIndicator.version by 1"
      - from: NOT_MET
        to: IMPROVEMENT_REQUIRED
        trigger: "system cascade link 2 of POST /cte/performance-indicators/{id}/close-reporting-year — fired by link 1 (consecutive_miss_count reaching MISS_TOLERANCE), not by the close call itself"
        actor: system
        preconditions:
          - "consecutive_miss_count >= MISS_TOLERANCE immediately after link 1"
        side_effects:
          - "cascade link 3 (caused by this escalation): the indicator's ProgramOfStudy transitions STATE_APPROVED -> SUSPENDED"
          - "increments PerformanceIndicator.version by 1"
      - from: NOT_MET
        to: MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct >= met_threshold_pct"
          - "request closed_on > closed_on"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on; consecutive_miss_count := 0"
          - "increments PerformanceIndicator.version by 1"
      - from: IMPROVEMENT_REQUIRED
        to: MONITORING
        trigger: "system cascade link 2 of POST /cte/improvement-plans/{id}/accept"
        actor: system
        preconditions:
          - "an ImprovementPlan on this indicator has just transitioned SUBMITTED -> ACCEPTED"
        side_effects:
          - "consecutive_miss_count := 0"
          - "cascade link 3 (caused by this reset): the indicator's ProgramOfStudy transitions SUSPENDED -> CHANGES_REQUESTED"
          - "increments PerformanceIndicator.version by 1"
      - from: IMPROVEMENT_REQUIRED
        to: SANCTIONED
        trigger: "system side effect of POST /cte/improvement-plans/{id}/return when the plan's revision_round == MAX_PLAN_REVISION_ROUNDS"
        actor: system
        preconditions:
          - "the plan has just transitioned SUBMITTED -> REJECTED_FINAL"
        side_effects:
          - "increments PerformanceIndicator.version by 1"
      - from: MONITORING
        to: MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct >= met_threshold_pct"
          - "request closed_on > closed_on"
        side_effects:
          - "actual_pct := FINAL variant output; closed_on := request closed_on; consecutive_miss_count := 0"
          - "increments PerformanceIndicator.version by 1"
      - from: MONITORING
        to: NOT_MET
        trigger: "POST /cte/performance-indicators/{id}/close-reporting-year"
        actor: StateComplianceReviewer
        preconditions:
          - "denominator_count >= SMALL_COHORT_MIN and FINAL variant actual_pct < met_threshold_pct"
          - "request closed_on > closed_on"
        side_effects:
          - "consecutive_miss_count += 1; actual_pct := FINAL variant output; closed_on := request closed_on"
          - "if consecutive_miss_count >= MISS_TOLERANCE then NOT_MET -> IMPROVEMENT_REQUIRED fires"
          - "increments PerformanceIndicator.version by 1"

  # ---- machine 5: Expenditure allowability (branching + compensation) -----
  - entity: Expenditure
    initial_state: REQUESTED
    terminal_states: [DISALLOWED, VOIDED]
    transitions:
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /cte/expenditures/{id}/certify-allowability with decision == CERTIFY"
        actor: GrantFiscalOfficer
        preconditions:
          - "X-User-ID != requested_by_user_id (segregation of duties)"
          - "the Expenditure's ProgramOfStudy has approval_status == STATE_APPROVED"
          - "that ProgramOfStudy has clna_phase IN {CERTIFIED, EXPIRED} and current_utc date <= clna_expires_on"
          - "the GrantAward has status == OPEN and current_utc date is within [obligation_window_start, obligation_window_end]"
          - "category != ENTERTAINMENT"
          - "if category == EQUIPMENT and unit_cost_cents >= CAPITAL_THRESHOLD_CENTS: a CommitteeMeeting on the program's ACTIVE AdvisoryCommittee with agenda_kind == EQUIPMENT_REVIEW, minutes_status IN {FINALIZED, AMENDED}, quorum_met == true and held_at within CAPITAL_REVIEW_WINDOW_DAYS days before current_utc exists"
          - "if category == ADMINISTRATION: admin_obligated_cents + this expenditure's approved_cents <= admin_cap_cents"
          - "the GrantAward's recomputed remaining_cents after this certification is >= 0"
        side_effects:
          - "federal_share_pct and approved_cents written per calculations.expenditure_federal_share"
          - "certified_by_user_id := X-User-ID"
          - "ledger sync: GrantAward.direct_obligated_cents, indirect_rate, indirect_pool_cents, obligated_cents, remaining_cents, admin_obligated_cents all recomputed from scratch per calculations.grant_obligation_rollup"
          - "increments GrantAward.version by 1"
          - "increments Expenditure.version by 1"
      - from: REQUESTED
        to: DISALLOWED
        trigger: "POST /cte/expenditures/{id}/certify-allowability with decision == DISALLOW"
        actor: GrantFiscalOfficer
        note: "Branch sibling of REQUESTED -> CERTIFIED. Divergent side-effect set: the grant ledger is NOT touched and approved_cents stays null."
        preconditions:
          - "X-User-ID != requested_by_user_id"
          - "request finding_code is non-null"
        side_effects:
          - "finding_code := request finding_code; certified_by_user_id := X-User-ID"
          - "approved_cents stays null; no GrantAward field changes and GrantAward.version is NOT incremented"
          - "increments Expenditure.version by 1"
      - from: CERTIFIED
        to: OBLIGATED
        trigger: "POST /cte/expenditures/{id}/obligate"
        actor: GrantFiscalOfficer
        preconditions:
          - "current_utc date <= the GrantAward's obligation_window_end"
        side_effects:
          - "obligation_reference := request obligation_reference"
          - "increments Expenditure.version by 1"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /cte/expenditures/{id}/void"
        actor: GrantFiscalOfficer
        note: "Compensating action for REQUESTED -> CERTIFIED."
        preconditions: []
        side_effects:
          - "void_reason := request void_reason; approved_cents := null so the row can never re-enter the rollup"
          - "ledger sync: GrantAward.direct_obligated_cents, indirect_rate, indirect_pool_cents, obligated_cents, remaining_cents, admin_obligated_cents recomputed from scratch per calculations.grant_obligation_rollup, restoring remaining_cents to exactly its pre-certification value"
          - "increments GrantAward.version by 1"
          - "increments Expenditure.version by 1"
      - from: OBLIGATED
        to: VOIDED
        trigger: "POST /cte/expenditures/{id}/void"
        actor: GrantFiscalOfficer
        note: "Compensating action for the two-step CERTIFIED -> OBLIGATED path."
        preconditions: []
        side_effects:
          - "void_reason := request void_reason; obligation_reference retained"
          - "ledger sync identical to CERTIFIED -> VOIDED"
          - "increments GrantAward.version by 1"
          - "increments Expenditure.version by 1"
      - from: REQUESTED
        to: BLOCKED
        trigger: "system cascade link 4 of POST /cte/performance-indicators/{id}/close-reporting-year — fired by link 3 (ProgramOfStudy STATE_APPROVED -> SUSPENDED)"
        actor: system
        preconditions:
          - "the Expenditure's ProgramOfStudy has just transitioned STATE_APPROVED -> SUSPENDED"
        side_effects:
          - "increments Expenditure.version by 1"
      - from: BLOCKED
        to: REQUESTED
        trigger: "system cascade link 4 of POST /cte/improvement-plans/{id}/accept — fired by link 3 (ProgramOfStudy SUSPENDED -> CHANGES_REQUESTED)"
        actor: system
        preconditions:
          - "the Expenditure's ProgramOfStudy has just transitioned SUSPENDED -> CHANGES_REQUESTED"
        side_effects:
          - "increments Expenditure.version by 1"

  # ---- machine 6: CommitteeMeeting minutes documentation -----------------
  - entity: CommitteeMeeting
    initial_state: SCHEDULED
    terminal_states: [AMENDED]
    transitions:
      - from: SCHEDULED
        to: FINALIZED
        trigger: "POST /cte/committee-meetings/{id}/minutes without amendment_reason"
        actor: CommitteeChair
        preconditions:
          - "held_at >= scheduled_for"
          - "calculations.committee_quorum_evaluation yields quorum_met == true"
          - "vote_yes + vote_no <= eligible_attendee_count"
        side_effects:
          - "held_at, attendee_member_ids, vote_yes, vote_no, minutes_url written from the request"
          - "eligible_attendee_count, employer_attendee_count, quorum_met, endorsement_passed recomputed"
          - "if agenda_kind == POS_ENDORSEMENT and endorsement_passed == true and the committee's ProgramOfStudy has approval_status == SUBMITTED: that program transitions SUBMITTED -> COMMITTEE_REVIEW"
          - "increments CommitteeMeeting.version by 1"
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /cte/committee-meetings/{id}/minutes with a non-null amendment_reason"
        actor: CommitteeChair
        preconditions:
          - "amendment_reason is non-null"
          - "calculations.committee_quorum_evaluation on the amended attendee list yields quorum_met == true"
        side_effects:
          - "amendment_reason recorded; attendee_member_ids, vote_yes, vote_no, minutes_url overwritten"
          - "quorum_met and endorsement_passed recomputed on the amended figures"
          - "increments CommitteeMeeting.version by 1"

  # ---- machine 7: Educator certification pathway --------------------------
  - entity: Educator
    initial_state: PROVISIONAL
    terminal_states: [LAPSED]
    transitions:
      - from: PROVISIONAL
        to: ELIGIBLE
        trigger: "POST /cte/educators/{id}/verify-industry-hours"
        actor: StateComplianceReviewer
        preconditions:
          - "certification_route == TRADITIONAL and verified_industry_hours after this verification >= 0, OR certification_route == ALTERNATIVE and verified_industry_hours after this verification >= ALT_ROUTE_HOURS_MIN, OR certification_route == INDUSTRY_EXPERIENCE and verified_industry_hours after this verification >= INDUSTRY_HOURS_MIN"
          - "current_utc date <= credential_expires_on"
        side_effects:
          - "verified_industry_hours += request verified_hours"
          - "increments Educator.version by 1"
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "POST /cte/educators/{id}/verify-industry-hours when the route's hour floor is still not met"
        actor: StateComplianceReviewer
        note: "Self-loop: partial verifications accumulate without conferring eligibility."
        preconditions:
          - "verified_industry_hours after this verification < the route's hour floor"
          - "current_utc date <= credential_expires_on"
        side_effects:
          - "verified_industry_hours += request verified_hours"
          - "increments Educator.version by 1"
      - from: PROVISIONAL
        to: LAPSED
        trigger: "system lazy re-evaluation on POST /cte/educators/{id}/verify-industry-hours and on POST /cte/programs-of-study/{id}/submit whenever current_utc date > credential_expires_on"
        actor: system
        preconditions:
          - "current_utc date > credential_expires_on"
        side_effects:
          - "increments Educator.version by 1"
      - from: ELIGIBLE
        to: LAPSED
        trigger: "system lazy re-evaluation on POST /cte/educators/{id}/verify-industry-hours and on POST /cte/programs-of-study/{id}/submit whenever current_utc date > credential_expires_on"
        actor: system
        preconditions:
          - "current_utc date > credential_expires_on"
        side_effects:
          - "increments Educator.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: committee-create-stale-program
    parent_entity: ProgramOfStudy
    write_endpoint: "POST /cte/programs-of-study/{id}/advisory-committees"
    occ_field: "expected_program_of_study_version"
    description: |
      Creating an AdvisoryCommittee against a ProgramOfStudy whose version has advanced since the
      client last observed it is rejected with a stale-version error. A new committee legitimately
      supersedes the prior one on the same program (the prior committee moves to DISSOLVED), so the
      second create is not blocked by any state precondition — the client's stale view of the program
      is the only thing that distinguishes it.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: expenditure-create-stale-grant
    parent_entity: GrantAward
    write_endpoint: "POST /cte/grant-awards/{id}/expenditures"
    occ_field: "expected_grant_award_version"
    description: |
      Creating an Expenditure against a GrantAward whose version has advanced since the client last
      observed it is rejected with a stale-version error. Two distinct purchase requests against one
      award are both legitimate under the product semantics, so no state precondition rejects the
      second; the stale version is what signals that the client budgeted against a superseded
      remaining_cents figure.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: program_alignment_index
    trigger: "on ProgramOfStudy DRAFT->SUBMITTED and CHANGES_REQUESTED->SUBMITTED (variant PROVISIONAL_LOCAL), and on COMMITTEE_REVIEW->STATE_APPROVED (variant FEDERAL_CERTIFIED, evaluated both as the approval precondition and as the persisted value)"
    algorithm: weighted_scoring
    formula: |
      # include_set is fixed by the variant (see `variants` below).
      secondary_credits = sum(SequenceCourse.credit_hours
                              where pos_id == P and segment == SECONDARY and status IN include_set)
      postsec_credits   = sum(SequenceCourse.credit_hours
                              where pos_id == P and segment == POSTSECONDARY and status IN include_set)
      articulated       = sum(SequenceCourse.articulated_credit_hours
                              where pos_id == P and segment == POSTSECONDARY
                                and status IN include_set
                                and (articulation_verified == true OR variant == PROVISIONAL_LOCAL))
      depth_factor  = min(1.0, secondary_credits / MIN_SECONDARY_CREDITS)
      bridge_factor = min(1.0, articulated / max(1.0, postsec_credits))
      breadth_bonus = BREADTH_BONUS if (secondary_credits > 0 and postsec_credits > 0
                                        and articulated >= ARTICULATION_FLOOR) else 0.0
      alignment_index = round_half_up(
          min(1.0, DEPTH_WEIGHT * depth_factor
                 + BRIDGE_WEIGHT * bridge_factor
                 + breadth_bonus), 4)
      # Evaluation order is fixed: the three sums first, then the three factors, then the
      # weighted combination, then the min(1.0, ...) clamp, then the single rounding step.
      # There is no intermediate rounding of depth_factor or bridge_factor.
    input_set: "SequenceCourse rows with pos_id == the program under evaluation, filtered to status IN include_set; RETIRED courses are excluded by both variants."
    constants:
      MIN_SECONDARY_CREDITS: 4.0
      ARTICULATION_FLOOR: 3.0
      DEPTH_WEIGHT: 0.60
      BRIDGE_WEIGHT: 0.30
      BREADTH_BONUS: 0.10
      ALIGNMENT_APPROVAL_FLOOR: 0.7500
    precision: "4 decimal places, round_half_up, applied exactly once at the end"
    variants:
      - name: PROVISIONAL_LOCAL
        when: "computed on every submit transition and stored with alignment_index_variant == PROVISIONAL_LOCAL"
        difference: "include_set = {DRAFT, ACTIVE}; the articulated sum ignores articulation_verified and counts every POSTSECONDARY course's articulated_credit_hours."
      - name: FEDERAL_CERTIFIED
        when: "computed as the COMMITTEE_REVIEW->STATE_APPROVED precondition and stored with alignment_index_variant == FEDERAL_CERTIFIED"
        difference: "include_set = {ACTIVE} only; the articulated sum counts a POSTSECONDARY course only when its articulation_verified == true. Identical curriculum data therefore yields a strictly lower or equal index than PROVISIONAL_LOCAL, and only this variant is compared against ALIGNMENT_APPROVAL_FLOOR."

  - name: concentrator_cohort_classification
    trigger: "on POST /cte/students/{id}/credit-postings and on POST /cte/students/{id}/exit and on POST /cte/students/{id}/credential-attainments; writes Student.cte_credits_earned, Student.verified_qualifying_attainment_count and Student.concentrator_status"
    algorithm: threshold
    formula: |
      cte_credits_earned = round_half_up(
          sum(credit_delta over every accepted credit posting for this student
              whose target SequenceCourse.status == ACTIVE at posting time), 2)
      verified_qualifying_attainment_count =
          count(CredentialAttainment where student_id == S and counted_for_indicator == true)
      if cte_credits_earned >= CONCENTRATOR_CREDIT_MIN
         and exited_on is not null
         and verified_qualifying_attainment_count >= 1:
          concentrator_status = COMPLETER
      elif cte_credits_earned >= CONCENTRATOR_CREDIT_MIN:
          concentrator_status = CONCENTRATOR
      else:
          concentrator_status = PARTICIPANT
      # The comparison is inclusive: exactly CONCENTRATOR_CREDIT_MIN credits classifies as
      # CONCENTRATOR. 1.99 does not.
    input_set: "Credit postings whose sequence_course_id resolves to a SequenceCourse with status == ACTIVE and pos_id == the student's pos_id; CredentialAttainment rows with counted_for_indicator == true."
    constants:
      CONCENTRATOR_CREDIT_MIN: 2.0
    precision: "cte_credits_earned to 2 decimal places, round_half_up"

  - name: performance_indicator_actual
    trigger: "PRELIMINARY_UNADJUSTED is recomputed on every read of a PerformanceIndicator and on every cascade that changes any Student.concentrator_status in the indicator's cohort; FINAL_SMALL_COHORT_ADJUSTED runs on POST /cte/performance-indicators/{id}/close-reporting-year"
    algorithm: aggregation
    formula: |
      denominator_count = count(Student
          where pos_id == I.pos_id
            and cohort_year == I.cohort_year
            and concentrator_status IN {CONCENTRATOR, COMPLETER})
      numerator_count = count(those same students
          where verified_qualifying_attainment_count >= 1)
      small_cohort_flag = (denominator_count < SMALL_COHORT_MIN)
      if denominator_count == 0:
          raw_pct = null
      else:
          raw_pct = round_half_up(100 * numerator_count / denominator_count, 2)
      # variant split — see `variants`
    input_set: "Student rows scoped by (pos_id, cohort_year) whose concentrator_status IN {CONCENTRATOR, COMPLETER}; PARTICIPANT rows are excluded from both numerator and denominator. Membership is evaluated at call time, not snapshotted."
    constants:
      SMALL_COHORT_MIN: 5
      PERFORMANCE_TOLERANCE: 0.90
      MISS_TOLERANCE: 2
      MAX_NEGOTIATION_ROUNDS: 4
      MAX_PLAN_REVISION_ROUNDS: 3
      MIN_PLAN_MILESTONES: 3
    precision: "2 decimal places, round_half_up; met_threshold_pct = round_half_up(negotiated_level_pct * PERFORMANCE_TOLERANCE, 2) and the comparison actual_pct >= met_threshold_pct is inclusive"
    variants:
      - name: PRELIMINARY_UNADJUSTED
        when: "surfaced on every PerformanceIndicator read as preliminary_actual_pct / preliminary_status_projection"
        difference: "Ignores small_cohort_flag entirely. preliminary_actual_pct := raw_pct; preliminary_status_projection := MET when raw_pct >= met_threshold_pct, NOT_MET when raw_pct < met_threshold_pct, UNDEFINED when raw_pct is null or met_threshold_pct is null."
      - name: FINAL_SMALL_COHORT_ADJUSTED
        when: "the only variant that may persist actual_pct and drive a status transition, on close-reporting-year"
        difference: "actual_pct := raw_pct, but when small_cohort_flag == true the indicator transitions to NOT_SCORED and consecutive_miss_count is left untouched regardless of how raw_pct compares to met_threshold_pct. Identical student data therefore yields preliminary_status_projection == NOT_MET while the FINAL variant records NOT_SCORED."

  - name: expenditure_federal_share
    trigger: "on Expenditure REQUESTED->CERTIFIED; writes Expenditure.federal_share_pct and Expenditure.approved_cents"
    algorithm: tiered_pricing
    formula: |
      gross_cents = unit_cost_cents * quantity
      federal_share_pct = FEDERAL_SHARE_BY_CATEGORY[category]
      approved_cents = round_half_up(gross_cents * federal_share_pct, 0)
      # PINNED ROUNDING ORDER: the multiplication is rounded to whole cents HERE, per
      # expenditure line. calculations.grant_obligation_rollup then sums these already
      # rounded integers. Summing gross_cents across lines first and rounding the product
      # once at the end is FORBIDDEN and produces different cents. Worked divergence:
      #   two lines, each gross_cents = 250010, federal_share_pct = 0.85
      #   round-per-line-then-sum : round_half_up(212508.5) = 212509 ; 2 * 212509 = 425018
      #   sum-then-round (WRONG)  : round_half_up(500020 * 0.85) = round_half_up(425017.0) = 425017
      # The scaffold pins 425018.
    input_set: "The single Expenditure being certified. ENTERTAINMENT never reaches this calculation — it is rejected at validation priority 15."
    constants:
      FEDERAL_SHARE_BY_CATEGORY:
        EQUIPMENT: 0.8500
        CONSUMABLE: 0.8500
        PROFESSIONAL_DEVELOPMENT: 1.0000
        ADMINISTRATION: 0.8500
        ENTERTAINMENT: 0.0000
      CAPITAL_THRESHOLD_CENTS: 500000
      CAPITAL_REVIEW_WINDOW_DAYS: 365
    precision: "whole cents, round_half_up, applied once per expenditure line"

  - name: grant_obligation_rollup
    trigger: "on Expenditure REQUESTED->CERTIFIED, CERTIFIED->VOIDED and OBLIGATED->VOIDED; recomputes the whole GrantAward ledger from scratch"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 — direct total. Sum the ALREADY-ROUNDED per-line integers. Ordering is
      # irrelevant because every addend is an integer, but the input set is pinned:
      direct_obligated_cents = sum(Expenditure.approved_cents
          where grant_award_id == G and status IN {CERTIFIED, OBLIGATED})
      # STEP 2 — tier lookup. The rate is keyed on STEP 1's direct total ONLY. It is
      # never keyed on obligated_cents or remaining_cents, even though obligated_cents
      # contains the pool that this rate produces.
      if   direct_obligated_cents <  INDIRECT_TIER_1_CEILING: indirect_rate = INDIRECT_RATE_TIER_1
      elif direct_obligated_cents <  INDIRECT_TIER_2_CEILING: indirect_rate = INDIRECT_RATE_TIER_2
      else:                                                   indirect_rate = INDIRECT_RATE_TIER_3
      # STEP 3 — pool, rounded once, computed from scratch (never incremented or
      # decremented against its previous value).
      indirect_pool_cents = round_half_up(direct_obligated_cents * indirect_rate, 0)
      # STEP 4
      obligated_cents = direct_obligated_cents + indirect_pool_cents
      # STEP 5
      remaining_cents = allocation_cents - obligated_cents
      # STEP 6 — administrative sub-ledger, same input-set discipline.
      admin_obligated_cents = sum(Expenditure.approved_cents
          where grant_award_id == G and category == ADMINISTRATION
            and status IN {CERTIFIED, OBLIGATED})
      admin_cap_cents = round_half_up(allocation_cents * ADMIN_CAP_PCT, 0)
      # Worked divergence for the pinned STEP 2 key, allocation_cents = 10000000 and a single
      # PROFESSIONAL_DEVELOPMENT line with approved_cents = 4900000:
      #   keyed on direct (CORRECT): rate 0.0812 -> pool 397880 -> obligated 5297880 -> remaining 4702120
      #   keyed on obligated (WRONG): 5297880 >= 5000000 picks 0.0650 -> pool 318500 -> obligated 5218500
      # The scaffold pins 397880 / 5297880 / 4702120.
      # INVARIANT (enforced after every recomputation):
      #   allocation_cents == obligated_cents + remaining_cents
    input_set: "Expenditure rows on the award with status IN {CERTIFIED, OBLIGATED}. REQUESTED, BLOCKED, DISALLOWED and VOIDED rows are excluded, which is what makes void an exact compensation."
    constants:
      INDIRECT_RATE_TIER_1: 0.0812
      INDIRECT_RATE_TIER_2: 0.0650
      INDIRECT_RATE_TIER_3: 0.0500
      INDIRECT_TIER_1_CEILING: 5000000
      INDIRECT_TIER_2_CEILING: 20000000
      ADMIN_CAP_PCT: 0.05
    precision: "whole cents, round_half_up; indirect_rate carried at 4 decimal places"

  - name: committee_quorum_evaluation
    trigger: "on POST /cte/committee-meetings/{id}/minutes (both SCHEDULED->FINALIZED and FINALIZED->AMENDED); writes eligible_attendee_count, employer_attendee_count, quorum_met, endorsement_passed"
    algorithm: aggregation
    formula: |
      eligible = [ m for m in CommitteeMember
                   where m.committee_id == meeting.committee_id
                     and m.id IN meeting.attendee_member_ids
                     and m.term_start_on <= date(held_at) < m.term_end_on ]
      eligible_attendee_count = len(eligible)
      employer_attendee_count = count(m in eligible where m.sector == EMPLOYER)
      quorum_met = (eligible_attendee_count >= committee.quorum_min_members)
                   and (employer_attendee_count >= committee.employer_seat_min)
                   and (2 * employer_attendee_count >= eligible_attendee_count)
      endorsement_passed = quorum_met
                           and (vote_yes > vote_no)
                           and (vote_yes + vote_no <= eligible_attendee_count)
      # The employer-parity clause is inclusive: employers holding exactly half the eligible
      # attendance satisfies it. Attendee ids that do not resolve to an ACTIVE-term member on
      # this committee are silently dropped from `eligible` rather than raising an error.
    input_set: "CommitteeMember rows on the meeting's committee whose half-open term interval [term_start_on, term_end_on) contains date(held_at) and whose id appears in attendee_member_ids."
    constants:
      CLNA_STAKEHOLDER_MEETINGS_MIN: 2
    precision: "integer counts; no rounding"

# =====================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the five roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's `roles:` list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: every field marked required in the endpoint's §1.5 `input:` is present; enums are members of their declared set; strings match their declared pattern; integers/numbers respect their declared bounds (unit_cost_cents > 0, quantity >= 1, credit_hours > 0, position 1..8, articulated_credit_hours <= credit_hours, vote_yes/vote_no >= 0, cohort_year and reporting_year 2020..2035, baseline_pct and offered_level_pct 0.00..100.00, limit 1..100, offset >= 0); dates parse as YYYY-MM-DD and datetimes as ISO 8601 UTC; term_end_on > term_start_on; obligation_window_end > obligation_window_start; service_period_end >= service_period_start; special_population_codes has no duplicates."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path-parameterised resource exists, validated left to right: /cte/programs-of-study/{id} -> ERR_PROGRAM_NOT_FOUND; /cte/sequence-courses/{id} -> ERR_COURSE_NOT_FOUND; /cte/students/{id} -> ERR_STUDENT_NOT_FOUND; /cte/credential-attainments/{id} -> ERR_ATTAINMENT_NOT_FOUND; /cte/advisory-committees/{id} -> ERR_COMMITTEE_NOT_FOUND; /cte/committee-members/{id} -> ERR_MEMBER_NOT_FOUND; /cte/committee-meetings/{id} -> ERR_MEETING_NOT_FOUND; /cte/grant-awards/{id} -> ERR_GRANT_NOT_FOUND; /cte/expenditures/{id} -> ERR_EXPENDITURE_NOT_FOUND; /cte/performance-indicators/{id} -> ERR_INDICATOR_NOT_FOUND; /cte/improvement-plans/{id} -> ERR_PLAN_NOT_FOUND; /cte/educators/{id} -> ERR_EDUCATOR_NOT_FOUND."
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves: pos_id -> ERR_PROGRAM_NOT_FOUND; prerequisite_course_id and sequence_course_id -> ERR_COURSE_NOT_FOUND; credential_id -> ERR_CREDENTIAL_NOT_FOUND; funding_expenditure_id -> ERR_EXPENDITURE_NOT_FOUND. Elements of attendee_member_ids are NOT existence-checked — unresolvable ids are dropped by calculations.committee_quorum_evaluation."
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /cte/grant-awards/{id}/expenditures, POST /cte/programs-of-study/{id}/sequence-courses, PATCH /cte/sequence-courses/{id}, POST /cte/students/{id}/credential-attainments, POST /cte/students/{id}/credit-postings, POST /cte/performance-indicators/{id}/improvement-plans"

  - priority: 6
    category: auth
    check: "Identity binding for the entity-backed role: when X-User-Role == CommitteeChair, X-User-ID must equal the id of a CommitteeMember whose committee_id is the target committee (directly, or the committee of the target meeting), whose status == ACTIVE and whose is_chair == true."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /cte/advisory-committees/{id}/meetings, POST /cte/committee-meetings/{id}/minutes"

  - priority: 7
    category: business_safety
    check: "Segregation of duties on X-User-ID: (a) clna-advance to_phase == CERTIFIED requires X-User-ID != ProgramOfStudy.authored_by_user_id; (b) certify-allowability requires X-User-ID != Expenditure.requested_by_user_id; (c) negotiation-offers and accept-level require X-User-ID != PerformanceIndicator.last_offer_by_user_id and X-User-Role != PerformanceIndicator.last_offer_by_role whenever last_offer_by_user_id is non-null."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cte/programs-of-study/{id}/clna-advance, POST /cte/expenditures/{id}/certify-allowability, POST /cte/performance-indicators/{id}/negotiation-offers, POST /cte/performance-indicators/{id}/accept-level"

  - priority: 8
    category: state
    check: "Optimistic concurrency: expected_program_of_study_version must equal the target ProgramOfStudy.version (ERR_STALE_PROGRAM_VERSION); expected_grant_award_version must equal the target GrantAward.version (ERR_STALE_GRANT_VERSION)."
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /cte/programs-of-study/{id}/advisory-committees, POST /cte/grant-awards/{id}/expenditures"

  - priority: 9
    category: state
    check: "The target entity's current state admits the requested transition per §1.2. Mapping: ProgramOfStudy.approval_status -> ERR_INVALID_APPROVAL_TRANSITION; ProgramOfStudy.clna_phase (including a to_phase that is not the declared successor of the current phase) -> ERR_INVALID_CLNA_PHASE_TRANSITION; Expenditure.status -> ERR_INVALID_EXPENDITURE_STATE; PerformanceIndicator.status -> ERR_INVALID_INDICATOR_STATE; ImprovementPlan.status -> ERR_INVALID_PLAN_STATE; CommitteeMeeting.minutes_status (AMENDED admits nothing further) -> ERR_INVALID_MEETING_STATE; Educator.status (LAPSED is terminal) -> ERR_INVALID_EDUCATOR_STATE. Two cross-entity state gates are checked at this same priority: POST /cte/performance-indicators/{id}/improvement-plans requires the target PerformanceIndicator.status == IMPROVEMENT_REQUIRED, and POST /cte/improvement-plans/{id}/accept requires the parent PerformanceIndicator.status == IMPROVEMENT_REQUIRED — both raise ERR_INVALID_INDICATOR_STATE. One deliberate carve-out: a PerformanceIndicator whose status is already ARBITRATED is NOT mapped here for POST /cte/performance-indicators/{id}/negotiation-offers or POST /cte/performance-indicators/{id}/accept-level; those two calls fall through to priority 30, which reports the spent negotiation budget as ERR_NEGOTIATION_ROUNDS_EXHAUSTED. Every other call against an ARBITRATED indicator is still handled here."
    error_id: ERR_INVALID_APPROVAL_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 10
    category: state
    check: "Cross-entity state gate: certify-allowability requires the Expenditure's ProgramOfStudy.approval_status == STATE_APPROVED."
    error_id: ERR_POS_NOT_APPROVED
    http_status: 422
    applies_to: "POST /cte/expenditures/{id}/certify-allowability"

  - priority: 11
    category: business_temporal
    check: "The governing ProgramOfStudy has clna_phase IN {CERTIFIED, EXPIRED}, i.e. its comprehensive local needs assessment has been certified at least once. NOT_STARTED, DATA_COLLECTION, STAKEHOLDER_CONSULTATION and GAP_ANALYSIS all fail here."
    error_id: ERR_CLNA_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/submit, POST /cte/programs-of-study/{id}/state-approve, POST /cte/expenditures/{id}/certify-allowability"

  - priority: 12
    category: business_temporal
    check: "After the lazy CERTIFIED -> EXPIRED re-evaluation, current_utc date <= ProgramOfStudy.clna_expires_on (clna_certified_on + 730 days). A program whose clna_phase is EXPIRED passes priority 11 and fails here."
    error_id: ERR_CLNA_EXPIRED
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/submit, POST /cte/programs-of-study/{id}/state-approve, POST /cte/expenditures/{id}/certify-allowability"

  - priority: 13
    category: business_temporal
    check: "The GrantAward is inside its obligation window: obligation_window_start <= current_utc date <= obligation_window_end (both bounds inclusive)."
    error_id: ERR_GRANT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /cte/grant-awards/{id}/expenditures, POST /cte/expenditures/{id}/certify-allowability, POST /cte/expenditures/{id}/obligate"

  - priority: 14
    category: business_temporal
    check: "Labor-market data freshness: (current_utc date - ProgramOfStudy.labor_market_data_asof) <= 730 days when advancing DATA_COLLECTION -> STAKEHOLDER_CONSULTATION."
    error_id: ERR_LABOR_MARKET_DATA_STALE
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/clna-advance"

  - priority: 15
    category: business_safety
    check: "Federal allowable-use category rule: an Expenditure whose category == ENTERTAINMENT can never be certified; the only lawful decision is DISALLOW with finding_code == ENTERTAINMENT_PROHIBITED."
    error_id: ERR_UNALLOWABLE_USE
    http_status: 422
    applies_to: "POST /cte/expenditures/{id}/certify-allowability"

  - priority: 16
    category: business_safety
    check: "Capital-review gate: an EQUIPMENT expenditure with unit_cost_cents >= 500000 may only be certified when a CommitteeMeeting on the program's ACTIVE AdvisoryCommittee has agenda_kind == EQUIPMENT_REVIEW, minutes_status IN {FINALIZED, AMENDED}, quorum_met == true and held_at no earlier than 365 days before current_utc."
    error_id: ERR_CAPITAL_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /cte/expenditures/{id}/certify-allowability"

  - priority: 17
    category: business_constraint
    check: "Meeting quorum headcount: eligible_attendee_count >= AdvisoryCommittee.quorum_min_members."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /cte/committee-meetings/{id}/minutes"

  - priority: 18
    category: business_constraint
    check: "Employer representation: employer_attendee_count >= AdvisoryCommittee.employer_seat_min AND 2 * employer_attendee_count >= eligible_attendee_count (employers holding exactly half of eligible attendance passes)."
    error_id: ERR_EMPLOYER_SEAT_SHORTFALL
    http_status: 422
    applies_to: "POST /cte/committee-meetings/{id}/minutes"

  - priority: 19
    category: business_constraint
    check: "Vote arithmetic: vote_yes + vote_no <= eligible_attendee_count."
    error_id: ERR_VOTE_COUNT_EXCEEDS_ATTENDANCE
    http_status: 422
    applies_to: "POST /cte/committee-meetings/{id}/minutes"

  - priority: 20
    category: business_referential
    check: "Prerequisite integrity: the referenced prerequisite SequenceCourse has the same pos_id as the course being written; it is not the course itself; a SECONDARY course may not name a POSTSECONDARY prerequisite (the reverse is allowed); and the prerequisite's position is strictly less than the course's position."
    error_id: ERR_PREREQUISITE_INVALID
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/sequence-courses, PATCH /cte/sequence-courses/{id}"

  - priority: 21
    category: business_referential
    check: "Prerequisite acyclicity: following prerequisite_course_id from the written course must reach a course with prerequisite_course_id == null without revisiting any course."
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/sequence-courses, PATCH /cte/sequence-courses/{id}"

  - priority: 22
    category: business_temporal
    check: "Committee seat occupancy uses HALF-OPEN intervals [term_start_on, term_end_on): a new CommitteeMember is rejected when an existing member on the same committee_id with the same seat_code and status == ACTIVE satisfies new.term_start_on < existing.term_end_on AND existing.term_start_on < new.term_end_on. Adjacency is therefore legal — a term starting exactly on the incumbent's term_end_on is accepted, and a zero-length gap is not an overlap."
    error_id: ERR_SEAT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /cte/advisory-committees/{id}/members"

  - priority: 23
    category: business_temporal
    check: "Tagged-asset occupancy uses CLOSED intervals inflated by a 14-day mobilisation buffer on both sides: when asset_tag is non-null, a new Expenditure is rejected if any existing Expenditure on the same grant_award_id with the same asset_tag and status IN {REQUESTED, CERTIFIED, OBLIGATED, BLOCKED} satisfies new.service_period_start <= existing.service_period_end + 14 days AND new.service_period_end >= existing.service_period_start - 14 days. Adjacency is therefore ILLEGAL — a gap of exactly 14 days is rejected and a gap of 15 days is accepted."
    error_id: ERR_ASSET_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /cte/grant-awards/{id}/expenditures"

  - priority: 24
    category: business_constraint
    check: "Sequence completeness at submit: at least one SequenceCourse with status == ACTIVE and segment == SECONDARY AND at least one with status == ACTIVE and segment == POSTSECONDARY exist on the program."
    error_id: ERR_SEQUENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/submit"

  - priority: 25
    category: business_constraint
    check: "Credential list non-empty at submit: at least one Credential row exists with pos_id == the program."
    error_id: ERR_CREDENTIAL_LIST_EMPTY
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/submit"

  - priority: 26
    category: business_constraint
    check: "Instructor coverage at submit: at least one Educator with pos_id == the program has status == ELIGIBLE after the lazy credential-lapse re-evaluation."
    error_id: ERR_NO_ELIGIBLE_INSTRUCTOR
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/submit"

  - priority: 27
    category: business_constraint
    check: "CLNA stakeholder evidence: at least 2 CommitteeMeeting rows on the program's ACTIVE AdvisoryCommittee have agenda_kind == CLNA_STAKEHOLDER, minutes_status IN {FINALIZED, AMENDED} and quorum_met == true when advancing STAKEHOLDER_CONSULTATION -> GAP_ANALYSIS."
    error_id: ERR_CLNA_STAKEHOLDER_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/clna-advance"

  - priority: 28
    category: business_constraint
    check: "Committee endorsement on file at state-approve: a CommitteeMeeting on the program's ACTIVE AdvisoryCommittee has agenda_kind == POS_ENDORSEMENT, minutes_status IN {FINALIZED, AMENDED} and endorsement_passed == true."
    error_id: ERR_COMMITTEE_ENDORSEMENT_MISSING
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/state-approve"

  - priority: 29
    category: business_constraint
    check: "Alignment floor at state-approve: calculations.program_alignment_index evaluated under variant FEDERAL_CERTIFIED is >= 0.7500 (inclusive)."
    error_id: ERR_ALIGNMENT_INDEX_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /cte/programs-of-study/{id}/state-approve"

  - priority: 30
    category: business_constraint
    check: "Negotiation budget: MAX_NEGOTIATION_ROUNDS is 4. A negotiation-offers call when negotiation_round is strictly below 4 counter-offers normally; a negotiation-offers call when negotiation_round is exactly 4 drives NEGOTIATING -> ARBITRATED and pins negotiated_level_pct := baseline_pct. Once the indicator is ARBITRATED the budget is spent and the arbitrated level is binding, so a further POST /cte/performance-indicators/{id}/negotiation-offers or POST /cte/performance-indicators/{id}/accept-level against that indicator is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED (priority 9 deliberately does not map ARBITRATED for these two calls). The same error is returned when accept-level is attempted with last_offer_pct null."
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /cte/performance-indicators/{id}/negotiation-offers, POST /cte/performance-indicators/{id}/accept-level"

  - priority: 31
    category: business_constraint
    check: "Improvement plan substance: milestone_count >= 3."
    error_id: ERR_MILESTONES_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cte/improvement-plans/{id}/submit"

  - priority: 32
    category: business_referential
    check: "Improvement plan funding: when funding_expenditure_id is non-null, the referenced Expenditure has status IN {CERTIFIED, OBLIGATED} and its pos_id equals the plan's PerformanceIndicator.pos_id."
    error_id: ERR_PLAN_FUNDING_INVALID
    http_status: 422
    applies_to: "POST /cte/performance-indicators/{id}/improvement-plans, POST /cte/improvement-plans/{id}/submit"

  - priority: 33
    category: business_constraint
    check: "Industry-hour ceiling: request verified_hours >= 1 and Educator.verified_industry_hours + verified_hours <= Educator.claimed_industry_hours."
    error_id: ERR_INDUSTRY_HOURS_EXCEED_CLAIM
    http_status: 422
    applies_to: "POST /cte/educators/{id}/verify-industry-hours"

  - priority: 34
    category: business_constraint
    check: "Attainment integrity: the referenced Credential's pos_id equals the student's pos_id (else ERR_CREDENTIAL_PROGRAM_MISMATCH); exam_score is non-null when the Credential has exam_required == true (else ERR_EXAM_SCORE_REQUIRED); and no CredentialAttainment already exists for the same (student_id, credential_id) pair (else ERR_DUPLICATE_ATTAINMENT)."
    error_id: ERR_DUPLICATE_ATTAINMENT
    http_status: 409
    applies_to: "POST /cte/students/{id}/credential-attainments"

  - priority: 35
    category: business_constraint
    check: "Uniqueness: ProgramOfStudy.cip_code globally (ERR_CIP_CODE_DUPLICATE); SequenceCourse.code per pos_id (ERR_COURSE_CODE_DUPLICATE); Credential.code per pos_id (ERR_CREDENTIAL_CODE_DUPLICATE); Student.state_student_id per pos_id (ERR_STUDENT_ID_DUPLICATE); GrantAward.fiscal_year globally (ERR_FISCAL_YEAR_DUPLICATE); (pos_id, indicator_code, reporting_year) on PerformanceIndicator (ERR_INDICATOR_DUPLICATE); at most one CommitteeMember per committee with is_chair == true and status == ACTIVE (ERR_CHAIR_ALREADY_SEATED)."
    error_id: ERR_CIP_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /cte/programs-of-study, POST /cte/programs-of-study/{id}/sequence-courses, POST /cte/programs-of-study/{id}/credentials, POST /cte/programs-of-study/{id}/students, POST /cte/grant-awards, POST /cte/programs-of-study/{id}/performance-indicators, POST /cte/advisory-committees/{id}/members"

  - priority: 36
    category: state
    check: "Credit postings and exits are blocked while the student's ProgramOfStudy.approval_status == SUSPENDED."
    error_id: ERR_CREDIT_POSTING_BLOCKED
    http_status: 422
    applies_to: "POST /cte/students/{id}/credit-postings, POST /cte/students/{id}/exit"

  - priority: 37
    category: business_constraint
    check: "Credit posting arithmetic: the target SequenceCourse has pos_id == the student's pos_id and status == ACTIVE (else ERR_COURSE_NOT_ACTIVE), and Student.cte_credits_earned + credit_delta >= 0 (else ERR_CREDIT_BALANCE_NEGATIVE). credit_delta may be negative, which is how a posting is reversed."
    error_id: ERR_COURSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /cte/students/{id}/credit-postings"

  - priority: 38
    category: business_fiscal
    check: "Administrative cost cap: for category == ADMINISTRATION, admin_obligated_cents + this expenditure's approved_cents <= admin_cap_cents (5% of allocation_cents, rounded half-up)."
    error_id: ERR_ADMIN_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /cte/expenditures/{id}/certify-allowability"

  - priority: 39
    category: business_fiscal
    check: "Grant capacity: the GrantAward's remaining_cents recomputed per calculations.grant_obligation_rollup with this expenditure included must be >= 0. This is the LAST business check — every state, compliance, constraint and referential rule above it wins a dual-failure request."
    error_id: ERR_GRANT_FUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /cte/expenditures/{id}/certify-allowability"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---------------- Read surface: ProgramOfStudy and its children ----
  - method: GET
    path: "/cte/programs-of-study"
    description: "List programs of study, newest created_at first, with optional filters."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: ["approval_status?", "cluster?", "clna_phase?", "limit?", "offset?"]
    output: "ProgramOfStudy[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}"
    description: "Retrieve one program of study, including its computed alignment index and CLNA phase."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: []
    output: ProgramOfStudy
    side_effects: ["lazy re-evaluation of clna_phase CERTIFIED -> EXPIRED when current_utc date > clna_expires_on"]

  - method: GET
    path: "/cte/programs-of-study/{id}/sequence-courses"
    description: "List the sequence courses of a program in ascending position order (FK reverse lookup for SequenceCourse.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: ["segment?", "status?", "limit?", "offset?"]
    output: "SequenceCourse[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/credentials"
    description: "List the industry-recognized credentials on a program's approved list (FK reverse lookup for Credential.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/students"
    description: "List students enrolled in a program (FK reverse lookup for Student.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, SchoolRegistrar]
    code: 200
    input: ["cohort_year?", "concentrator_status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/advisory-committees"
    description: "List the advisory committees attached to a program (FK reverse lookup for AdvisoryCommittee.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AdvisoryCommittee[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/expenditures"
    description: "List expenditures charged to a program (FK reverse lookup for Expenditure.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "Expenditure[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/performance-indicators"
    description: "List the accountability indicators negotiated for a program (FK reverse lookup for PerformanceIndicator.pos_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer]
    code: 200
    input: ["reporting_year?", "status?", "limit?", "offset?"]
    output: "PerformanceIndicator[]"
    side_effects: []

  - method: GET
    path: "/cte/programs-of-study/{id}/educators"
    description: "List educators assigned to a program (FK reverse lookup for Educator.pos_id)."
    roles: [CteDirector, StateComplianceReviewer]
    code: 200
    input: ["status?", "certification_route?", "limit?", "offset?"]
    output: "Educator[]"
    side_effects: ["lazy re-evaluation of Educator.status ELIGIBLE -> LAPSED when current_utc date > credential_expires_on"]

  # ---------------- Read surface: sequence, students, credentials ----
  - method: GET
    path: "/cte/sequence-courses/{id}"
    description: "Retrieve one sequence course."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: []
    output: SequenceCourse
    side_effects: []

  - method: GET
    path: "/cte/sequence-courses/{id}/dependents"
    description: "List the sequence courses that name this course as their prerequisite (FK reverse lookup for SequenceCourse.prerequisite_course_id)."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: ["limit?", "offset?"]
    output: "SequenceCourse[]"
    side_effects: []

  - method: GET
    path: "/cte/credentials/{id}"
    description: "Retrieve one industry-recognized credential definition."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: GET
