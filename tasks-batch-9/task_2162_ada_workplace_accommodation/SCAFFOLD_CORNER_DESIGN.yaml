scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: corner_employee_creation_returns_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Employee.fields.employment_status
          - entities.Employee.fields.open_case_count
          - entities.Employee.fields.lifetime_denial_count
          - endpoints[POST /employees]
        distinguishing_aspect: "POST /employees with every required field returns 201 and the server-initialized defaults employment_status ACTIVE, open_case_count 0, lifetime_denial_count 0, version 1."
        test_recipe:
          setup:
            - "A DRAFT JobProfile exists; no employees exist yet."
          setup_api_calls:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-01", title: "Corner Profile", department_code: "CN1", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c1_jp: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employee_number: "C-E-01", full_name: "Corner One", department_code: "CN1", job_title: "Operator", hire_date: "2024-03-01", job_profile_id: "${c1_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c1_emp: $.data.id, c1_ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Employee.${c1_emp}.employment_status == ACTIVE"
            - "Employee.${c1_emp}.open_case_count == 0 and Employee.${c1_emp}.lifetime_denial_count == 0"
            - "Employee.${c1_emp}.version == 1"
            - "Employee.${c1_emp}.id is a bare RFC 4122 UUID with no type prefix, and created_at is ISO 8601 UTC with exactly three fractional-second digits"
            - "The response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_employee_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /employees/{id}]
          - entities.Employee.fields.employee_number
        distinguishing_aspect: "GET /employees/{id} returns exactly the row created, field for field, with response_type object."
        test_recipe:
          setup:
            - "One JobProfile and one Employee C-E-02 exist."
          setup_api_calls:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-02", title: "Corner Profile 2", department_code: "CN2", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c2_jp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-E-02", full_name: "Corner Two", department_code: "CN2", job_title: "Operator", hire_date: "2024-03-02", job_profile_id: "${c2_jp}", is_people_manager: false, annual_salary_cents: 4100000 }
              as: AccommodationCoordinator
              captures: { c2_emp: $.data.id }
          trigger:
            - call: "GET /employees/${c2_emp}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "AUD-1"
          assert:
            - "HTTP status is 200 and data.id == ${c2_emp}"
            - "data.employee_number == C-E-02 and data.job_profile_id == ${c2_jp}"
            - "data.annual_salary_cents == 4100000"

      - name: corner_employee_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /employees]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three employees on one profile, GET /employees filtered by job_profile_id with limit 2 and offset 0 returns two rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "One JobProfile with exactly three employees attached."
          setup_api_calls:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-03", title: "Corner Profile 3", department_code: "CN3", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c3_jp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-E-03A", full_name: "Corner 3A", department_code: "CN3", job_title: "Operator", hire_date: "2024-03-03", job_profile_id: "${c3_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-03B", full_name: "Corner 3B", department_code: "CN3", job_title: "Operator", hire_date: "2024-03-04", job_profile_id: "${c3_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-03C", full_name: "Corner 3C", department_code: "CN3", job_title: "Operator", hire_date: "2024-03-05", job_profile_id: "${c3_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
          trigger:
            - call: "GET /employees"
              payload: { job_profile_id: "${c3_jp}", limit: 2, offset: 0 }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
          assert:
            - "HTTP status is 200 and response_type == array"
            - "len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "A second call with offset 2 returns 1 row and has_more == false"

      - name: corner_job_profile_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=26]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /job-profiles]
        distinguishing_aspect: "Omitting employer_annual_budget_cents, a required input with no default, returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
          trigger:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-04", title: "Corner Profile 4", department_code: "CN4", department_annual_budget_cents: 1500000 }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c4_err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "No JobProfile row with job_code C-JP-04 exists afterwards"

      - name: corner_essential_function_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.EssentialFunction.fields.is_essential
          - entities.EssentialFunction.fields.marginal_reassignable
          - entities.EssentialFunction.fields.status
        distinguishing_aspect: "Omitting is_essential and marginal_reassignable yields true and false respectively, and status defaults to ACTIVE."
        test_recipe:
          setup:
            - "One DRAFT JobProfile exists."
          setup_api_calls:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-05", title: "Corner Profile 5", department_code: "CN5", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c5_jp: $.data.id }
          trigger:
            - call: "POST /job-profiles/${c5_jp}/essential-functions"
              payload: { function_code: "C-EF-05", description: "Default probe duty", criticality_weight: 7, frequency_per_week: 10 }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c5_ef: $.data.id }
          assert:
            - "HTTP status is 201"
            - "EssentialFunction.${c5_ef}.is_essential == true"
            - "EssentialFunction.${c5_ef}.marginal_reassignable == false"
            - "EssentialFunction.${c5_ef}.status == ACTIVE"
            - "JobProfile.${c5_jp}.essential_function_count == 1 and JobProfile.${c5_jp}.total_essential_weight == 7"

      - name: corner_option_computed_fields_are_server_derived_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.option_net_cost
          - calculations.essential_function_coverage
          - entities.AccommodationOption.fields.option_net_cost_cents
          - entities.AccommodationOption.fields.coverage_ratio
        distinguishing_aspect: "option_net_cost_cents and coverage_ratio are absent from the endpoint input schema and are computed on the server: one_time 50000 with recurring 0 yields 37000 and covering the single essential function yields 1.000000."
        test_recipe:
          setup:
            - "A case in stage OPTION_EXPLORATION on a profile with one ACTIVE essential function of weight 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-06", title: "Corner Profile 6", department_code: "CN6", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c6_jp: $.data.id }
            - call: "POST /job-profiles/${c6_jp}/essential-functions"
              payload: { function_code: "C-EF-06", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { c6_ef: $.data.id }
            - call: "POST /job-profiles/${c6_jp}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-06", full_name: "Corner Six", department_code: "CN6", job_title: "Operator", hire_date: "2024-03-06", job_profile_id: "${c6_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c6_emp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-M-06", full_name: "Corner Six Mgr", department_code: "CN6", job_title: "Manager", hire_date: "2019-03-06", job_profile_id: "${c6_jp}", is_people_manager: true, annual_salary_cents: 9000000 }
              as: AccommodationCoordinator
              captures: { c6_mgr: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c6_emp}", request_channel: "WRITTEN", requested_accommodation_text: "Corner accommodation", disability_obvious: true }
              as: Employee
              as_user_id: "${c6_emp}"
              captures: { c6_req: $.data.id }
            - call: "POST /accommodation-requests/${c6_req}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${c6_req}/function-analyses"
              payload: { essential_function_id: "${c6_ef}", can_perform_unaided: false, limitation_severity: 2, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${c6_mgr}"
            - call: "POST /accommodation-requests/${c6_req}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
          trigger:
            - call: "POST /accommodation-requests/${c6_req}/options"
              payload: { option_code: "C-OPT-06", category: "TELEWORK", one_time_cost_cents: 50000, recurring_monthly_cost_cents: 0, implementation_days: 5, coverage_function_ids: ["${c6_ef}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c6_opt: $.data.id }
          assert:
            - "HTTP status is 201"
            - "AccommodationOption.${c6_opt}.option_net_cost_cents == 37000"
            - "AccommodationOption.${c6_opt}.coverage_ratio == 1.0"
            - "AccommodationOption.${c6_opt}.status == PROPOSED and committed_cost_cents == 0"
            - "AccommodationOption.${c6_opt}.proposed_by_role == AccommodationCoordinator"

      - name: corner_accommodation_request_system_fields_pin_profile_version
        claim_type: system_fields
        grounds:
          - entities.AccommodationRequest.fields.job_profile_id
          - entities.AccommodationRequest.fields.pinned_profile_version_label
          - entities.AccommodationRequest.fields.stage
        distinguishing_aspect: "The case copies job_profile_id and pinned_profile_version_label from the employee's PUBLISHED profile at intake; neither is a client input and stage starts at INTAKE."
        test_recipe:
          setup:
            - "PUBLISHED JobProfile labelled 2026.7 with one ACTIVE essential function, and employee C-E-07 attached to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-07", title: "Corner Profile 7", department_code: "CN7", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c7_jp: $.data.id }
            - call: "POST /job-profiles/${c7_jp}/essential-functions"
              payload: { function_code: "C-EF-07", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
            - call: "POST /job-profiles/${c7_jp}/publish"
              payload: { profile_version_label: "2026.7" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-07", full_name: "Corner Seven", department_code: "CN7", job_title: "Operator", hire_date: "2024-03-07", job_profile_id: "${c7_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c7_emp: $.data.id }
          trigger:
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c7_emp}", request_channel: "HR_INITIATED", requested_accommodation_text: "Corner accommodation seven" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c7_req: $.data.id }
          assert:
            - "HTTP status is 201"
            - "AccommodationRequest.${c7_req}.stage == INTAKE and confidentiality_posture == STANDARD"
            - "AccommodationRequest.${c7_req}.job_profile_id == ${c7_jp}"
            - "AccommodationRequest.${c7_req}.pinned_profile_version_label == 2026.7"
            - "AccommodationRequest.${c7_req}.disability_obvious == false (default applied)"
            - "AccommodationRequest.${c7_req}.medical_doc_request_limit == 2 and documentation_budget_remaining == 2"
            - "Employee.${c7_emp}.open_case_count == 1"

      - name: corner_essential_function_weight_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.EssentialFunction.fields.criticality_weight
          - validations[priority=26]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "criticality_weight is constrained to 1..10, so the value 11 is rejected with 400 ERR_INVALID_REQUEST and no EssentialFunction row is created."
        test_recipe:
          setup:
            - "One DRAFT JobProfile exists."
          setup_api_calls:
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-08", title: "Corner Profile 8", department_code: "CN8", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c8_jp: $.data.id }
          trigger:
            - call: "POST /job-profiles/${c8_jp}/essential-functions"
              payload: { function_code: "C-EF-08", description: "Out of range duty", criticality_weight: 11, frequency_per_week: 10, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c8_err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /job-profiles/${c8_jp}/essential-functions returns an empty array with total_count 0"
            - "JobProfile.${c8_jp}.total_essential_weight == 0"

      - name: corner_medical_disclosure_is_append_only_immutable_row
        claim_type: immutability
        grounds:
          - entities.MedicalDisclosure.fields.authorized
          - calculations.disclosure_authorization
          - endpoints[POST /accommodation-requests/{id}/medical-disclosures]
        distinguishing_aspect: "MedicalDisclosure is declared common_fields false, so it exposes id and created_at only, has no update endpoint at all, and an authorized disclosure to the MedicalReviewOfficer is written with authorized true."
        test_recipe:
          setup:
            - "A case in stage INTAKE on a PUBLISHED profile."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-09", title: "Corner Profile 9", department_code: "CN9", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c9_jp: $.data.id }
            - call: "POST /job-profiles/${c9_jp}/essential-functions"
              payload: { function_code: "C-EF-09", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
            - call: "POST /job-profiles/${c9_jp}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-09", full_name: "Corner Nine", department_code: "CN9", job_title: "Operator", hire_date: "2024-03-09", job_profile_id: "${c9_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c9_emp: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c9_emp}", request_channel: "WRITTEN", requested_accommodation_text: "Corner accommodation nine", disability_obvious: true }
              as: Employee
              as_user_id: "${c9_emp}"
              captures: { c9_req: $.data.id }
          trigger:
            - call: "POST /accommodation-requests/${c9_req}/medical-disclosures"
              payload: { disclosed_to_role: "MedicalReviewOfficer", disclosed_to_user_id: "MRO-1", disclosure_purpose: "AUDIT", fields_disclosed: ["diagnosis", "treatment_plan"] }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { c9_disc: $.data.id, c9_auth: $.data.authorized }
          assert:
            - "HTTP status is 201 and MedicalDisclosure.${c9_disc}.authorized == true (MedicalReviewOfficer is a FULL_ACCESS_ROLE, so no field restriction applies)"
            - "AccommodationRequest.${c9_req}.confidentiality_posture == STANDARD (an authorized disclosure does not seal)"
            - "AccommodationRequest.${c9_req}.interactive_process_integrity_score == 100"
            - "GET /accommodation-requests/${c9_req}/medical-disclosures returns exactly one row with total_count 1"
            - "The §1.5 table declares no PUT, PATCH or DELETE on medical-disclosures"

      - name: corner_essential_function_requires_existing_parent_profile
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - errors[ERR_JOB_PROFILE_NOT_FOUND]
          - entities.EssentialFunction.fields.job_profile_id
        distinguishing_aspect: "Creating an essential function under a job_profile_id that does not resolve returns 404 ERR_JOB_PROFILE_NOT_FOUND rather than creating an orphan."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
          trigger:
            - call: "POST /job-profiles/00000000-0000-4000-8000-00000000aaaa/essential-functions"
              payload: { function_code: "C-EF-10", description: "Orphan duty", criticality_weight: 5, frequency_per_week: 10, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c10_err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_JOB_PROFILE_NOT_FOUND"

      - name: corner_function_analysis_junction_links_request_and_function
        claim_type: graph
        grounds:
          - entities.FunctionAnalysis.fields.request_id
          - entities.FunctionAnalysis.fields.essential_function_id
          - entities.FunctionAnalysis.fields.manager_id
          - endpoints[GET /function-analyses]
        distinguishing_aspect: "FunctionAnalysis is the many-to-many junction between AccommodationRequest and EssentialFunction, and the filtered list resolves it from either side plus from the signing manager."
        test_recipe:
          setup:
            - "A case in stage FUNCTION_ANALYSIS with one recorded analysis signed by manager C-M-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-11", title: "Corner Profile 11", department_code: "CNB", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c11_jp: $.data.id }
            - call: "POST /job-profiles/${c11_jp}/essential-functions"
              payload: { function_code: "C-EF-11", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { c11_ef: $.data.id }
            - call: "POST /job-profiles/${c11_jp}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-11", full_name: "Corner Eleven", department_code: "CNB", job_title: "Operator", hire_date: "2024-03-11", job_profile_id: "${c11_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c11_emp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-M-11", full_name: "Corner Eleven Mgr", department_code: "CNB", job_title: "Manager", hire_date: "2019-03-11", job_profile_id: "${c11_jp}", is_people_manager: true, annual_salary_cents: 9000000 }
              as: AccommodationCoordinator
              captures: { c11_mgr: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c11_emp}", request_channel: "WRITTEN", requested_accommodation_text: "Corner accommodation eleven", disability_obvious: true }
              as: Employee
              as_user_id: "${c11_emp}"
              captures: { c11_req: $.data.id }
            - call: "POST /accommodation-requests/${c11_req}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${c11_req}/function-analyses"
              payload: { essential_function_id: "${c11_ef}", can_perform_unaided: false, limitation_severity: 2, proposed_treatment: "RESTRUCTURE" }
              as: Manager
              as_user_id: "${c11_mgr}"
              captures: { c11_fa: $.data.id }
          trigger:
            - call: "GET /function-analyses"
              payload: { essential_function_id: "${c11_ef}" }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { c11_found: "$.data[0].id" }
            - call: "GET /function-analyses"
              payload: { manager_id: "${c11_mgr}" }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
          assert:
            - "Filtering by essential_function_id returns exactly one row whose id == ${c11_fa} and whose request_id == ${c11_req}"
            - "Filtering by manager_id returns the same single row with total_count 1"
            - "FunctionAnalysis.${c11_fa}.manager_id == ${c11_mgr} (stamped from X-User-ID, not from the body)"
            - "FunctionAnalysis.${c11_fa}.status == RECORDED"

  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_advance_to_function_analysis_without_obvious_disability_rejected
        claim_type: precondition_enforcement
        grounds:
