          - entities.WeightProgram.fields.program_kind
        distinguishing_aspect: |
          The dual variant lives on the PaxDistributionLine / LoadPlan balance
          domain: for byte-identical passenger counts the STANDARD program yields
          planned_payload_kg 12290 / index_zfw 85.24 / mac_zfw_pct 15.30 while the
          ACTUAL program yields 12090 / 84.95 / 15.23 on a second flight built
