              as: SafetyManager
          trigger:
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 1" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
