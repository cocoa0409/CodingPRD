# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2494 - Artificial Intelligence Governance & Model Approval
#
# Nine SKILL.md 0.5 difficulty rules, two differentiated instances each (18 total).
# Every numeric literal in an `assert:` line below was computed from the SCAFFOLD.yaml
# formulas by code before being written down, never estimated.
#
# Standard actors used throughout:
#   usr_req_1   Requester            usr_legal_1 LegalReviewer
#   usr_priv_1  PrivacyReviewer      usr_sec_1   SecurityReviewer
#   usr_biz_1   BusinessReviewer     usr_gov_1   GovernanceOfficer
#   usr_gov_2   GovernanceOfficer (second officer, for segregation-of-duties setups)
# The logical clock is pinned to 2026-08-01T00:00:00Z at the head of every recipe.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: use_case_risk_provisional_versus_deployment_final
        grounds: "calculations.risk_classification_score declares variants INTAKE_PROVISIONAL and DEPLOYMENT_FINAL over identical declared intake fields; the provisional variant pins vendor_penalty = 0 and control_credit = 0 by definition, the final variant substitutes the accepted vendor grade and the accumulated control evidence, so one UseCase carries two scores and can carry two different tiers at once."
        distinguishing_aspect: "the variant selector is the CALLING TRANSITION (classify vs approve), the divergent quantity is a 0..100 risk score that crosses a tier band boundary (74 HIGH -> 64 LIMITED), and the consequence is a different reassessment interval (180 vs 365 days). Both snapshots survive side by side in ClassificationSnapshot, so the divergence is directly observable in one list response."
        test_recipe:
          setup: "Register a third-party ModelAsset, get a grade-B vendor assessment accepted, approve the asset for use, then drive one HIGH-tier use case (affects_individuals true, CONSEQUENTIAL, HUMAN_ON_LOOP, INTERNAL, reach 12000, jurisdictions EU+UK) all the way to READY_FOR_APPROVAL: classify, pin the binding, file and approve a DUAL_REVIEW oversight design, publish both notices, pass all four evaluations, clear all four gates."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Northwind AI", model_name: "nw-adjudicate", model_version: "3.2.0", hosting: "VENDOR_API", modality: "TEXT", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/vendor-assessments", payload: {vendor_name: "Northwind AI", training_data_provenance: "DOCUMENTED_MIXED", output_rights: "LICENSE_WITH_RESTRICTIONS", retention_days: 60, retention_opt_out: true, subprocessors_disclosed: true}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {va: "$.data.id", va_points: "$.data.terms_risk_points"}}
            - {call: "POST /vendor-assessments/{id}/decide", payload: {decision: "ACCEPT", terms_variant: "CONSERVATIVE_LEGAL", decision_rationale: "mixed provenance documented, 60-day retention with opt-out"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Benefits eligibility adjudication assistant", business_unit: "Claims", description: "drafts eligibility determinations for adjudicator sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "CONSEQUENTIAL", jurisdictions: ["EU", "UK"], deployed_headcount_reach: 12000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version", prov_score: "$.data.risk_score"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${uc_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v3: "$.data.version"}}
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "DUAL_REVIEW", sample_pct: 0, escalation_sla_hours: 6, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${uc_v3}"}, as: Requester, as_user_id: "usr_req_1", captures: {od: "$.data.id"}}
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1"}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "UK", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 1}, as: Requester, as_user_id: "usr_req_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ev_bias: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.8600, sample_size: 1200}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "ROBUSTNESS", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ev_rob: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {adversarial_pass_rate: 0.9300, sample_size: 1500}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "HALLUCINATION", window_start_at: "2026-08-04T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ev_hal: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {grounded_accuracy: 0.9700, sample_size: 1100}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "SECURITY_REDTEAM", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-06T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ev_red: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {adversarial_pass_rate: 0.9600, sample_size: 1000}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_legal: "$.data[0].id", g_priv: "$.data[1].id", g_sec: "$.data[2].id", g_biz: "$.data[3].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: LegalReviewer, as_user_id: "usr_legal_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "licence and notices reviewed"}, as: LegalReviewer, as_user_id: "usr_legal_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "DPIA filed"}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "red-team passed"}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v_ready: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/approve", payload: {expected_use_case_version: "${uc_v_ready}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "the approve call returns 200 and UseCase.status == APPROVED"
            - "the INTAKE_PROVISIONAL snapshot is untouched: risk_score == 74, risk_tier == HIGH, vendor_penalty == 0, control_credit == 0, cleared_gate_count == 0, passed_eval_count == 0"
            - "UseCase.risk_score is still 74 and UseCase.risk_tier is still HIGH (the provisional pair is never overwritten)"
            - "UseCase.vendor_penalty == 5 (grade B) and UseCase.control_credit == 15 (capped: 3*4 gates + 2*4 evals = 20, capped at 15)"
            - "UseCase.final_risk_score == 64 and UseCase.final_risk_tier == LIMITED - the two variants disagree by 10 points and land in different tier bands"
            - "GET /use-cases/{uc}/classification-snapshots returns exactly 2 rows; row 0 has variant INTAKE_PROVISIONAL with risk_score 74 and risk_tier HIGH, row 1 has variant DEPLOYMENT_FINAL with base_score 74, vendor_penalty 5, control_credit 15, risk_score 64, risk_tier LIMITED, and both rows carry cycle_index 1"
            - "UseCase.reassessment_interval_days == 365 (LIMITED), NOT 180 - the final variant, not the provisional one, drives the interval"
            - "UseCase.approval_expires_at == 2027-08-01T00:00:00Z and reassessment_due_at is the same instant"
            - "the required_gate_types array is still the HIGH-tier list [LEGAL, PRIVACY, SECURITY, BUSINESS] even though the final tier is LIMITED: the gate demand was fixed by the provisional variant"

      - name: vendor_terms_conservative_versus_documented_variant
        grounds: "calculations.vendor_terms_grade declares variants CONSERVATIVE_LEGAL and DOCUMENTED_TERMS. The conservative variant replaces retention_days with ASSUMED_WORST_RETENTION_DAYS = 3650 whenever retention_opt_out is false, and surcharges UNDISCLOSED provenance; the documented variant takes the declared retention_days verbatim. The same stored assessment row therefore grades in two different bands."
        distinguishing_aspect: "different entity (VendorModelAssessment, not UseCase), different variant selector (a body field terms_variant supplied by the deciding officer, not the calling transition), and a different divergent quantity - an integer day count that is 182x larger under one variant, driving a two-band letter-grade swing C -> A. The first instance's variants both run automatically; here the caller chooses, and choosing DOCUMENTED_TERMS on a row with null retention_days is a hard error instead."
        test_recipe:
          setup: "Register a third-party ModelAsset and submit one vendor assessment declaring fully licensed provenance, full output-rights assignment, a 20-day retention term, NO retention opt-out, and disclosed subprocessors. Submission always grades it under CONSERVATIVE_LEGAL, which replaces the 20 days with the assumed-worst 3650 and adds the no-opt-out points: effective_retention_days 3650, terms_risk_points 24, terms_grade C."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Cartwright Labs", model_name: "cl-summarize", model_version: "1.4.1", hosting: "VENDOR_API", modality: "TEXT", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset2: "$.data.id"}}
            - {call: "POST /model-assets/{id}/vendor-assessments", payload: {vendor_name: "Cartwright Labs", training_data_provenance: "DOCUMENTED_LICENSED", output_rights: "FULL_ASSIGNMENT", retention_days: 20, retention_opt_out: false, subprocessors_disclosed: true}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {va2: "$.data.id", cons_points: "$.data.terms_risk_points", cons_grade: "$.data.terms_grade", cons_retention: "$.data.effective_retention_days"}}
            - {call: "GET /model-assets/{id}/vendor-assessments", payload: {status: "SUBMITTED"}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {submitted_grade: "$.data[0].terms_grade"}}
          trigger:
            - {call: "POST /vendor-assessments/{id}/decide", payload: {decision: "ACCEPT", terms_variant: "DOCUMENTED_TERMS", decision_rationale: "retention term is contractually documented at 20 days, no opt-out needed"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "at submission time, under CONSERVATIVE_LEGAL: effective_retention_days == 3650, terms_risk_points == 24, terms_grade == C (0 provenance + 0 output rights + 18 retention band + 6 no-opt-out + 0 subprocessors)"
            - "after the decide call, on the SAME row: effective_retention_days == 20, terms_risk_points == 6, terms_grade == A (0 + 0 + 0 retention band + 6 no-opt-out + 0)"
            - "terms_variant == DOCUMENTED_TERMS and status == ACCEPTED"
            - "the declared inputs are unchanged: retention_days is still 20 and retention_opt_out is still false - only the variant moved"
            - "ModelAsset.vendor_terms_grade == A, so a later approval of a use case bound to this asset would take vendor_penalty 0 instead of the 12 that grade C would have cost"
            - "re-deciding is refused with ERR_ASSESSMENT_ALREADY_DECIDED (409), so the two variant results cannot both be persisted on the row"

  - rule_id: combinatorial_formula
    instances:

      - name: oversight_adequacy_nested_cap_and_zero_clamp_mode_a
        grounds: "calculations.oversight_adequacy_score is mode (a): a nested min inside a sum inside a min - sample_component = min(SAMPLE_COMPONENT_CAP, floor(sample_pct * SAMPLE_WEIGHT)), sla_component = max(0, SLA_BASE_POINTS - floor(escalation_sla_hours / SLA_HOURS_PER_POINT)), and the whole sum is wrapped in min(100, ...). Three separate clamps and two separate floors sit in one expression."
        distinguishing_aspect: "mode (a) - nested aggregate with an inner cap and an inner floor clamp. The chosen inputs make BOTH inner clamps bind simultaneously (sample_pct 100 hits the cap exactly, escalation_sla_hours 126 drives the SLA term negative so max(0, .) fires), and the resulting score sits EXACTLY on required_adequacy_score, so an implementation that skips either clamp gets 69 and wrongly rejects the design."
        test_recipe:
          setup: "Create a LIMITED-tier use case with HUMAN_ON_LOOP autonomy (MATERIAL impact, INTERNAL sensitivity, reach 5000, no listed jurisdictions) and classify it: 25 + 18 + 6 + 2 + 0 = 51, tier LIMITED. REQUIRED_ADEQUACY[LIMITED][HUMAN_ON_LOOP] is 70."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Shift roster optimiser", business_unit: "Operations", description: "proposes weekly shift rosters with supervisor sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_l: "$.data.id", ucl_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucl_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucl_v2: "$.data.version", ucl_tier: "$.data.risk_tier"}}
          trigger:
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "SAMPLED", sample_pct: 100, escalation_sla_hours: 126, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${ucl_v2}"}, as: Requester, as_user_id: "usr_req_1", captures: {od_l: "$.data.id", adequacy: "$.data.adequacy_score"}}
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "UseCase.risk_score == 51 and risk_tier == LIMITED"
            - "OversightDesign.required_adequacy_score == 70 (REQUIRED_ADEQUACY[LIMITED][HUMAN_ON_LOOP])"
            - "OversightDesign.adequacy_score == 70 exactly: mode_base 30 + sample_component min(30, floor(100*0.3)) = 30 + sla_component max(0, 20 - floor(126/6)) = max(0, -1) = 0 + override 10"
            - "the score is NOT 69 - an implementation that drops the max(0, .) clamp computes 30 + 30 + (20 - 21) + 10 = 69 and then wrongly raises ERR_OVERSIGHT_DESIGN_INADEQUATE"
            - "the score is NOT 100 - an implementation that drops the inner min(30, .) cap on the sample component would still cap at 30 here, so the cap must be verified separately: filing sample_pct 100 with escalation_sla_hours 0 must yield 90, not 100 + something"
            - "the decide call returns 200 and OversightDesign.status == APPROVED, because the comparison is >= and 70 >= 70"
            - "no ERR_OVERSIGHT_DESIGN_INADEQUATE is raised anywhere in the trigger"

      - name: control_debt_round_per_gate_then_sum_mode_b
        grounds: "calculations.control_debt_index is mode (b): the per-gate value is rounded to 2 decimals AT THE GATE by round_half_up, and control_debt_index_total is the sum of the ALREADY-ROUNDED per-gate values. Summing the unrounded products and rounding once at the end produces a different cent."
        distinguishing_aspect: "mode (b) - pinned rounding ORDER inside a multi-step chain, as opposed to instance one's nested min/max clamps. Nothing here is clamped; the entire difficulty is that round-then-sum and sum-then-round differ by one cent (2.94 vs 2.93) on the chosen condition counts, and the total is read back through a different endpoint (GET /inventory-summary) than the one that produced the per-gate values."
        test_recipe:
          setup: "Classify the HIGH-tier use case (74 -> HIGH) so four gates exist with pinned_risk_tier HIGH, then have each reviewer open its gate and issue conditions: LEGAL 2 conditions, PRIVACY 1, SECURITY 1, BUSINESS 1. GATE_WEIGHT is LEGAL 1.35, PRIVACY 1.25, SECURITY 1.15, BUSINESS 0.75; OPEN_CONDITION_DIVISOR is 3; TIER_MULTIPLIER[HIGH] is 1.5."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Credit line pre-screening", business_unit: "Lending", description: "ranks applicants for adjudicator review", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "CONSEQUENTIAL", jurisdictions: ["EU", "UK"], deployed_headcount_reach: 12000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_d: "$.data.id", ucd_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucd_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucd_tier: "$.data.risk_tier"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {dg_legal: "$.data[0].id", dg_priv: "$.data[1].id", dg_sec: "$.data[2].id", dg_biz: "$.data[3].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: LegalReviewer, as_user_id: "usr_legal_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["obtain written output-rights assignment", "add EU AI Act Article 50 notice text"], decision_note: "two legal gaps"}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {legal_debt: "$.data.control_debt_index"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["complete the DPIA appendix"]}, as: PrivacyReviewer, as_user_id: "usr_priv_1", captures: {priv_debt: "$.data.control_debt_index"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["add prompt-injection monitoring"]}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {sec_debt: "$.data.control_debt_index"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["quantify the adjudicator time saving"]}, as: BusinessReviewer, as_user_id: "usr_biz_1", captures: {biz_debt: "$.data.control_debt_index"}}
          trigger:
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {debt_total: "$.data.control_debt_index_total"}}
          assert:
            - "the four per-gate values are each rounded at the gate: LEGAL control_debt_index == 1.35 (1.35 * 2/3 * 1.5 = 1.35 exactly), PRIVACY == 0.63 (1.25 * 1/3 * 1.5 = 0.625 -> round_half_up -> 0.63), SECURITY == 0.58 (1.15 * 1/3 * 1.5 = 0.575 -> 0.58), BUSINESS == 0.38 (0.75 * 1/3 * 1.5 = 0.375 -> 0.38)"
            - "control_debt_index_total == 2.94, the sum of the four already-rounded values"
            - "control_debt_index_total is NOT 2.93 - summing the unrounded products gives 2.925, and rounding once at the end gives 2.93"
            - "each of the three half-cent cases rounds AWAY FROM ZERO, not to even: 0.625 -> 0.63 not 0.62, 0.575 -> 0.58 not 0.57, 0.375 -> 0.38 not 0.38-by-accident"
            - "UseCase.open_conditions_count == 5 and UseCase.status == CHANGES_REQUESTED"
            - "each gate's pinned_risk_tier == HIGH, so all four multipliers used 1.5 and not the LIMITED 1.0"

  - rule_id: non_linear_state_machine
    instances:

      - name: classify_forks_to_review_or_prohibited_terminal
        grounds: "SM UseCase gives POST /use-cases/{id}/classify two mutually exclusive target states from the same source state DRAFT: DRAFT -> UNDER_REVIEW when the prohibited combination does not hold, and DRAFT -> REJECTED (a terminal state) when it does. The fork is decided inside calculations.risk_classification_score, not by any request field."
        distinguishing_aspect: "a one-call FORK on a single trigger, where one branch is terminal and the two branches have disjoint side-effect sets (gates created vs no gates created, rejection_reason set vs not, CLASSIFICATION_REJECTED ledger entry vs none). The branch selector is a four-field conjunction on the declaration, and the forced branch overrides the numeric score band entirely."
        test_recipe:
          setup: "Create two use cases in DRAFT. U_ok declares MATERIAL impact, HUMAN_IN_LOOP autonomy, INTERNAL sensitivity, reach 5000, jurisdictions [EU] -> 25 + 8 + 6 + 2 + 3 = 44, tier LIMITED. U_stop declares the prohibited conjunction: affects_individuals true, CONSEQUENTIAL impact, FULLY_AUTOMATED autonomy, SPECIAL_CATEGORY sensitivity, reach 500, jurisdictions [EU] -> 40 + 30 + 24 + 0 + 3 = 97."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Supplier invoice triage", business_unit: "Finance", description: "routes invoices to the right approver", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: ["EU"], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_ok: "$.data.id", ucok_v1: "$.data.version"}}
            - {call: "POST /use-cases", payload: {title: "Autonomous medical benefit denial", business_unit: "Claims", description: "issues final benefit denials without a reviewer", affects_individuals: true, decision_autonomy: "FULLY_AUTOMATED", data_sensitivity: "SPECIAL_CATEGORY", individual_impact: "CONSEQUENTIAL", jurisdictions: ["EU"], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_stop: "$.data.id", ucstop_v1: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucok_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ok_status: "$.data.status"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucstop_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {stop_status: "$.data.status"}}
          assert:
            - "U_ok: status == UNDER_REVIEW, risk_score == 44, risk_tier == LIMITED, required_gate_types == [PRIVACY, BUSINESS], rejection_reason is null"
            - "GET /use-cases/{uc_ok}/review-gates returns exactly 2 rows in canonical order - row 0 gate_type PRIVACY, row 1 gate_type BUSINESS, both status PENDING with pinned_risk_tier LIMITED and pinned_classification_index 1"
            - "U_stop: status == REJECTED, risk_score == 97, risk_tier == PROHIBITED, forced_prohibited == true on its snapshot, rejection_reason == PROHIBITED_COMBINATION"
            - "GET /use-cases/{uc_stop}/review-gates returns 0 rows and required_gate_types == [] - REQUIRED_GATES[PROHIBITED] is empty, so the rejected branch creates no gates at all"
            - "GET /use-cases/{uc_stop}/ledger-entries contains exactly one entry, entry_type CLASSIFICATION_REJECTED with reach_delta 0 and debt_delta 0.00; GET /use-cases/{uc_ok}/ledger-entries contains 0 entries"
            - "both use cases advanced version by exactly 1 and both carry classification_cycle_index 1"
            - "U_stop is terminal: a second classify on it fails with ERR_USE_CASE_TERMINAL (409), while U_ok can still be re-classified"

      - name: review_gate_condition_loop_traversed_twice_then_reopened
        grounds: "SM ReviewGate is cyclic in two independent ways: IN_REVIEW -> CONDITIONS_ISSUED -> IN_REVIEW can be walked any number of times via issue-conditions/start-review, and CLEARED -> IN_REVIEW re-enters the loop from the terminal-looking cleared state via reopen. The parent UseCase ping-pongs UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW alongside it."
        distinguishing_aspect: "a REVISITED state rather than a fork: the same (gate, state) pair is entered three times in one recipe, and the test proves the transition is idempotent in shape but not in data (assigned_reviewer_user_id is overwritten, conditions are emptied, debt is zeroed and later restored). Different entity from instance one, and the cycle is driven by three different endpoints instead of one."
        test_recipe:
          setup: "Create and classify a LIMITED use case with no listed jurisdictions (MATERIAL, HUMAN_ON_LOOP, CONFIDENTIAL, reach 5000, jurisdictions []) -> 25 + 18 + 14 + 2 + 0 = 59, tier LIMITED, gates [PRIVACY, BUSINESS]. Empty jurisdictions makes the PRIVACY disclosure precondition vacuous, so the loop can be walked without publishing notices."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal knowledge assistant", business_unit: "Shared Services", description: "answers staff policy questions from internal documents", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_c: "$.data.id", ucc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucc_tier: "$.data.risk_tier"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cg_priv: "$.data[0].id", cg_biz: "$.data[1].id"}}
          trigger:
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["restrict the document corpus to non-HR sources", "add a retention schedule"]}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_2"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["publish the retention schedule to staff"]}, as: PrivacyReviewer, as_user_id: "usr_priv_2"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "schedule published, cleared straight out of conditions"}, as: PrivacyReviewer, as_user_id: "usr_priv_2"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "benefit case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/reopen", payload: {decision_note: "new corpus added, privacy must look again"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "the PRIVACY gate visited IN_REVIEW three times - after the first start-review, after the second start-review, and again after the reopen - and CONDITIONS_ISSUED twice"
            - "after the first issue-conditions: gate open_condition_count == 2, control_debt_index == 0.83 (1.25 * 2/3 * 1.0 = 0.8333 -> 0.83), UseCase.status == CHANGES_REQUESTED, UseCase.open_conditions_count == 2"
            - "the second start-review empties the loop state: conditions == [], open_condition_count == 0, control_debt_index == 0.00, assigned_reviewer_user_id == usr_priv_2 (overwritten from usr_priv_1), and UseCase.status returns to UNDER_REVIEW"
            - "after the second issue-conditions: open_condition_count == 1, control_debt_index == 0.42 (1.25 * 1/3 * 1.0 = 0.4167 -> 0.42), UseCase.status == CHANGES_REQUESTED again"
            - "clearing straight out of CONDITIONS_ISSUED records debt_before_clear == 0.42 and sets control_debt_index to 0.00 - the loop does not have to be exited through IN_REVIEW"
            - "the BUSINESS start-review from PENDING while the use case sits in CHANGES_REQUESTED returns it to UNDER_REVIEW, because open_conditions_count is already 0"
            - "clearing BUSINESS bubbles the use case to READY_FOR_APPROVAL with cleared_gate_count == 2"
            - "the reopen re-enters the cycle from CLEARED: PRIVACY gate status == IN_REVIEW, control_debt_index restored to 0.42, cleared_by_user_id == null, cleared_at == null, UseCase.status == UNDER_REVIEW, cleared_gate_count == 1"
            - "a second reopen on the same gate now fails with ERR_GATE_NOT_IN_REVIEWABLE_STATE (409) because the gate is no longer CLEARED - the cycle is only re-enterable from the cleared state"

  - rule_id: transitive_cascade
    instances:

      - name: revoke_cascades_four_hops_to_vendor_assessment_expiry
        grounds: "SM UseCase's APPROVED -> REVOKED row declares an explicitly numbered four-hop chain: hop 1 revokes the use case, hop 2 retires its ModelBinding rows, hop 3 decrements ModelAsset.active_binding_count and pushes a third-party asset with zero remaining bindings to RESTRICTED, hop 4 expires every ACCEPTED VendorModelAssessment on that asset and nulls the asset's vendor_terms_grade. Each hop is caused by the previous hop's write, not by the request."
        distinguishing_aspect: "depth 4, triggered by an explicit governance decision (revoke) and terminating in a THIRD aggregate (the vendor's contractual assessment) two entities removed from the request target. The chain also has a width component - notices are withdrawn and ledger entries are appended per affected row - and its last hop is conditional on a count reaching exactly zero, so a use case sharing the asset with another live binding would stop the cascade at hop 3."
        test_recipe:
          setup: "Run the full HIGH-tier approval chain and approve it: a third-party asset with an ACCEPTED grade-B assessment, one PINNED binding, an APPROVED DUAL_REVIEW oversight design, EU and UK notices published, four PASSED evaluations, four CLEARED gates, then approve. At the end of setup the asset is APPROVED_FOR_USE with active_binding_count 1 and vendor_terms_grade B."
