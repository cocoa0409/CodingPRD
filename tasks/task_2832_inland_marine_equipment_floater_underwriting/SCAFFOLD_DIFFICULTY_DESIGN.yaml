  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: constructive_total_loss_threshold_inclusive_boundary
        grounds:
          - calculations.claim_loss_valuation
          - calculations.claim_settlement_amount
          - validations[priority=67]
          - errors[ERR_CONSTRUCTIVE_TOTAL_LOSS]
          - state_machines.Claim.INSPECTED_to_REPAIR_APPROVED
        distinguishing_aspect: |
          The constructive-total-loss gate is INCLUSIVE at 6120000 (75 percent of
          the 8160000 insured value): a repair_estimate_cents of exactly 6120000
          makes REPAIR unselectable and returns ERR_CONSTRUCTIVE_TOTAL_LOSS 409,
          while 6119999 - one cent lower - is approved and pays 6019999, so an
          implementation using a strict > comparison flips both outcomes.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, rated_premium_cents 346636."
            - "Two ACTIVE EquipmentItems A and B, both insured_value_cents 8160000, so both claims carry constructive_total_loss_threshold_cents 6120000."
            - "Logical clock at 2026-08-20T00:00:00Z."
            - "Claim AT on item A: INSPECTED with repair_estimate_cents exactly 6120000, actual_value_at_loss_cents 8160000."
            - "Claim BELOW on item B: INSPECTED with repair_estimate_cents 6119999, actual_value_at_loss_cents 8160000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
