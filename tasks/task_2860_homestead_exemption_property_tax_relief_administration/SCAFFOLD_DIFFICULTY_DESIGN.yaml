  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: portable_freeze_value_is_conserved_across_two_partial_ports
        grounds:
          - calculations.portable_freeze_allocation
          - calculations.parcel_value_decomposition
          - entities.ExemptionGrant.fields.portable_balance_cents
          - entities.ExemptionGrant.fields.frozen_value_cents
          - state_machines.ExemptionGrant.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          The conserved quantity is FROZEN VALUE, and the invariant is checked after each of two
          partial ports to different parcels: source.portable_balance_cents plus the frozen values of
          every child grant always equals the source's original frozen_value_cents (33600000), and the
          source stays ACTIVE because neither port empties the balance. The compensation is spatial
          (value moved between parcels), not a reversal in time.
        test_recipe:
          setup:
            - "SENIOR_FREEZE program (freeze_enabled true, relief_pct_bps 1000, max_exempt_value_cents 5000000, priority_rank 20) is OPEN."
            - "Parcel P1 has assessed_value_cents 33600000; Parcels P3 and P4 each have assessed_value_cents 40000000 and no grants."
            - "TaxpayerAccount T (born 1955-03-10) has three non-overlapping VERIFIED PRIMARY_RESIDENCE records: P1 [2019-06-01, 2026-03-01), P3 [2026-03-01, 2026-09-01), P4 [2026-09-01, open)."
            - "ACTIVE grant G1 on P1 has frozen_value_cents 33600000, portable_balance_cents 33600000 and benefit_amount_cents 3360000."
            - "The logical clock is moved to 2026-04-01 for the first port and 2026-10-01 for the second, so each destination record covers its own transfer date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
