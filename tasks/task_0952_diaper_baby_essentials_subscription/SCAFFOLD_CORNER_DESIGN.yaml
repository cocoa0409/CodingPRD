              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "roleforbid@example.com", full_name: "Role Forbid", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: SupportAgent
              as_user_id: "cs-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "HTTP status is 403"
            - "Cycle.${c1}.status == PLANNED"

      - name: corner_support_agent_cannot_write_the_catalog
        claim_type: role_denial
        grounds: ["validations[priority=4]", "errors[ERR_CATALOG_WRITE_FORBIDDEN]"]
        distinguishing_aspect: "SupportAgent creating a SKU is caught by the catalog-specific rung 4 with ERR_CATALOG_WRITE_FORBIDDEN (403), NOT by the generic rung-5 ERR_FORBIDDEN_ROLE."
