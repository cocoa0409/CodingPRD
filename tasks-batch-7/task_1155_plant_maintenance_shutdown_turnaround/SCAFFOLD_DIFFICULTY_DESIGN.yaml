            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-13", shift_type: "DAY", starts_at: "2026-06-13T08:00:00Z", ends_at: "2026-06-13T16:00:00Z", planned_headcount: 3 }, as: Planner, captures: { sa_id: "$.data.id" } }
            - { call: "POST /shifts/${sa_id}/assignments", payload: { worker_id: "${wk_id}", planned_hours: 8 }, as: Planner }
            - { call: "POST /workers/${wk_id}/badge-transition", payload: { to: "SUSPENDED" }, as: PermitCoordinator }
