          assert:
            - "s1_selected == 56.5 and s1_rate == 54.0 and s1_indirect == 5400000 (clamped at the cap)"
            - "s2_rate == 54.0 and s2_indirect == 5400000 (selected == cap is admitted, not rejected)"

      - name: cost_share_floor_boundary
        grounds:
          - calculations.cost_share_requirement
          - entities.Proposal.fields.is_cost_share_adequate
        distinguishing_aspect: |
          Metric: cents; endpoint: route. With required floor 1540000
          (10% x 15400000), approval totaling 1539999 fails routing with
          ERR_COST_SHARE_INADEQUATE; adding exactly 1 cent (1540000 == 1540000)
          routes — the >= boundary is inclusive.
        test_recipe:
          setup:
            - "Opportunity requires_cost_share, min 10.00%; eligible PI; 54% rate; proposal TDC with one PERSONNEL line 10000000 -> total_request 15400000, BUDGET_LOCKED"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "CS", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: true, min_cost_share_pct_of_request: 10.00 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Fourteen", department_code: "CHEM", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Floor", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 1539999 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs1: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs1}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
          trigger:
            - call: "POST /pre-award/proposals/${prop_id}/route"
              payload: {}
              as: PreAwardAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 1 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs2: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs2}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - call: "POST /pre-award/proposals/${prop_id}/route"
              payload: {}
              as: PreAwardAnalyst
              captures: { st2: $.data.status, eff2: $.data.total_effective_cost_share_cents }
          assert:
            - "err1 == ERR_COST_SHARE_INADEQUATE (1539999 < 1540000 by exactly 1 cent)"
            - "st2 == ROUTED and eff2 == 1540000 (== floor is adequate)"

      - name: internal_deadline_boundary
        grounds:
          - calculations.internal_deadline
          - state_machines.Proposal.INSTITUTIONALLY_APPROVED_to_SUBMITTED
        distinguishing_aspect: |
          Metric: timestamp; endpoint: submit. At exactly
          internal_deadline_at (2026-08-31T17:00:00Z) submit succeeds (inclusive
          <= boundary); one second later (17:00:01) submit fails with
          ERR_INTERNAL_DEADLINE_PASSED while the opportunity is still PUBLISHED
          (sponsor deadline 2026-09-05 not yet passed).
        test_recipe:
          setup:
            - "Opportunity: sponsor_deadline 2026-09-05T17:00:00Z, lead 5 -> internal 2026-08-31T17:00:00Z; eligible PI; 54% rate"
            - "Proposals P1 and P2 both INSTITUTIONALLY_APPROVED (non-overlapping windows to keep effort valid)"
          setup_api_calls:
