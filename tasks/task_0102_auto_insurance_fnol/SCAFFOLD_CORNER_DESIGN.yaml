# =============================================================================
# Task 0102: Auto Insurance Claims (FNOL) — §1.9 Scaffold Corner Design
# Breadth probe: every testable claim §1.1-§1.7 declares that §1.8 does not cover.
# Same seven-point contract as §1.8. excluded_because stubs cite §1.8 instance names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "POST /policies with all required fields returns 201; status defaults ACTIVE, version=1, id/created_at system-minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policyholder_name: "New Co", policy_number: "POL-NEW-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z" }
              as: ClaimsSupervisor
              captures: { pid: $.data.id, st: $.data.status, ver: $.data.version, cfr: $.data.comparative_fault_rule }
          assert:
            - "response.status == 201"
            - "Policy.${pid}.status == ACTIVE"
            - "Policy.${pid}.version == 1"
            - "Policy.${pid}.comparative_fault_rule == MODIFIED_50"

      - name: create_policy_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Policy.fields.policy_number, "validations[priority=4]"]
        distinguishing_aspect: "POST /policies omitting policy_number -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policyholder_name: "No Number Co", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z" }
              as: ClaimsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_claim_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Claim, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /claims/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: claim_create_defaults_insured_fault_and_disposition
        claim_type: Defaults
        grounds: [entities.Claim.fields.insured_fault_pct, entities.Claim.fields.disposition, entities.Claim.fields.status]
        distinguishing_aspect: "POST /claims omitting insured_fault_pct/salvage defaults insured_fault_pct=0, disposition=null, settlement_cents=0, status=FNOL_SUBMITTED."
        test_recipe:
          setup: ["A policy with a COLLISION coverage."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Def Co", policy_number: "POL-DEF-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id, f: $.data.insured_fault_pct, st: $.data.status, sc: $.data.settlement_cents }
          assert:
            - "Claim.${claim}.insured_fault_pct == 0"
            - "Claim.${claim}.status == FNOL_SUBMITTED"
            - "Claim.${claim}.settlement_cents == 0"

      - name: claim_create_bad_loss_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Claim.fields.loss_type, "validations[priority=4]"]
        distinguishing_aspect: "POST /claims with loss_type='FLOOD' (not in {COLLISION, COMPREHENSIVE}) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A policy exists."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Enum Co", policy_number: "POL-ENUM-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "FLOOD", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: claim_create_fault_pct_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Claim.fields.insured_fault_pct, "validations[priority=4]"]
        distinguishing_aspect: "POST /claims with insured_fault_pct=150 (outside 0..100) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A policy exists."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Rng Co", policy_number: "POL-RNG-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000, insured_fault_pct: 150 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: claim_create_unknown_policy_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Claim.fields.policy_id, "validations[priority=3]"]
        distinguishing_aspect: "POST /claims with a policy_id that does not exist -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An adjuster exists; no such policy."]
          setup_api_calls:
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "00000000-0000-4000-8000-000000000999", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_claims_pagination_envelope
        claim_type: Listing
        grounds: [entities.Claim, endpoints]
        distinguishing_aspect: "GET /claims?limit=1 returns an array with meta.total_count and has_more reflecting pagination over two claims."
        test_recipe:
          setup: ["A policy and two FNOL claims on it."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Pag Co", policy_number: "POL-PAG-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-02T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 700000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
          trigger:
            - call: "GET /claims?policy_id=${pol}&limit=1&offset=0"
              payload: {}
              as: ClaimsSupervisor
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response.response_type == array"
            - "meta-level total_count == 2 and has_more == true for limit=1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: verify_coverage_from_already_verified_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.FNOL_SUBMITTED_to_COVERAGE_VERIFIED, entities.Claim.fields.status]
        distinguishing_aspect: "Calling verify-coverage on a claim already COVERAGE_VERIFIED -> ERR_INVALID_STATE (no verify transition from COVERAGE_VERIFIED)."
        test_recipe:
          setup: ["A verified claim (status COVERAGE_VERIFIED)."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Iv Co", policy_number: "POL-IV-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
          trigger:
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: settle_from_under_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.REPAIR_APPROVED_to_SETTLED, entities.Claim.fields.status]
        distinguishing_aspect: "Settle on a claim still UNDER_REVIEW (no disposition decided) -> ERR_INVALID_STATE; settle only valid from REPAIR_APPROVED or TOTAL_LOSS."
        test_recipe:
          setup: ["A claim UNDER_REVIEW (assigned, no disposition)."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Su Co", policy_number: "POL-SU-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /claims/${claim}/settle"
              payload: { expected_claim_version: "${c_v2}" }
              as: ClaimsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_closed_claim_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim.SETTLED_to_CLOSED, entities.Claim.fields.status]
        distinguishing_aspect: "From terminal CLOSED, reopen is not defined -> ERR_INVALID_STATE (reopen is only from COVERAGE_DENIED)."
        test_recipe:
          setup: ["A claim driven to CLOSED (REPAIR settled, no open subrogation/rental, then closed)."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Cl Co", policy_number: "POL-CL-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "body", labor_cents: 400000, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${c_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v3: $.data.version }
            - call: "POST /claims/${claim}/settle"
              payload: { expected_claim_version: "${c_v3}" }
              as: ClaimsSupervisor
            - call: "POST /claims/${claim}/close"
              payload: {}
              as: ClaimsSupervisor
          trigger:
            - call: "POST /claims/${claim}/reopen"
              payload: {}
              as: ClaimsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: coverage_denied_when_loss_outside_policy_window
        claim_type: Side Effect Execution
        grounds: [state_machines.Claim.FNOL_SUBMITTED_to_COVERAGE_DENIED, entities.CoverageVerification.fields.denial_reason]
        distinguishing_aspect: "verify-coverage on a claim whose loss_datetime is before the policy effective_date -> claim COVERAGE_DENIED, a CoverageVerification with denial_reason=OUTSIDE_COVERAGE_WINDOW is created."
        test_recipe:
          setup: ["A policy effective 2026-06-01; a claim with loss_datetime 2026-05-01 (before window) and a matching coverage."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Win Co", policy_number: "POL-WIN-1", effective_date: "2026-06-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-05-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { st: $.data.status }
            - call: "GET /claims/${claim}/coverage-verifications"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cv_outcome: "$.data[0].outcome", cv_reason: "$.data[0].denial_reason" }
          assert:
            - "Claim.${claim}.status == COVERAGE_DENIED"
            - "CoverageVerification[0].outcome == DENIED"
            - "CoverageVerification[0].denial_reason == OUTSIDE_COVERAGE_WINDOW"

      - name: reopen_denied_claim_allows_reverification_cycle
        claim_type: cyclic
        grounds: [state_machines.Claim.COVERAGE_DENIED_to_REOPENED, state_machines.Claim.REOPENED_to_COVERAGE_VERIFIED]
        distinguishing_aspect: "A COVERAGE_DENIED claim can be reopened (-> REOPENED) and then re-verified once the policy is corrected, completing the recovery cycle to COVERAGE_VERIFIED."
        test_recipe:
          setup: ["A claim DENIED because no matching coverage existed; a matching COLLISION coverage is then added; claim reopened."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Re Co", policy_number: "POL-RE-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /claims/${claim}/reopen"
              payload: {}
              as: ClaimsSupervisor
          trigger:
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim}.status == COVERAGE_VERIFIED"

      - name: rental_reject_when_no_rental_coverage
        claim_type: Side Effect Execution
        grounds: [state_machines.RentalReimbursement.PENDING_to_REJECTED, entities.RentalReimbursement.fields.status]
        distinguishing_aspect: "A rental reimbursement on a claim whose policy has no RENTAL coverage computes reimbursement_cents=0 and can be REJECTED."
        test_recipe:
          setup: ["A verified claim whose policy has only COLLISION coverage (no RENTAL); a PENDING rental reimbursement with reimbursement_cents=0 (no rental coverage to cap against)."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "NoRent Co", policy_number: "POL-NR-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /rental-reimbursements"
              payload: { claim_id: "${claim}", rental_start_date: "2026-06-01T00:00:00.000Z", rental_end_date: "2026-06-08T00:00:00.000Z", daily_rate_cents: 6000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { rr: $.data.id, reimb: $.data.reimbursement_cents }
          trigger:
            - call: "POST /rental-reimbursements/${rr}/reject"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { st: $.data.status }
          assert:
            - "RentalReimbursement.${rr}.reimbursement_cents == 0"
            - "RentalReimbursement.${rr}.status == REJECTED"

      - name: subrogation_resolve_no_recovery_closes_case
        claim_type: Valid Transition
        grounds: [state_machines.SubrogationCase.DEMAND_SENT_to_CLOSED_NO_RECOVERY, entities.SubrogationCase.fields.status]
        distinguishing_aspect: "Resolving a DEMAND_SENT subrogation case with recovered_cents=0 transitions it to CLOSED_NO_RECOVERY and creates no disbursement."
        test_recipe:
          setup: ["A settled claim with a THIRD_PARTY; an OPEN subrogation case (PURE, fault 0, demand 400000) with demand sent (DEMAND_SENT)."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "NoRec Co", policy_number: "POL-NREC-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
