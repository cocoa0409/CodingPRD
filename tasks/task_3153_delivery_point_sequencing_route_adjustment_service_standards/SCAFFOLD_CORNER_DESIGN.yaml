              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/delivery-units/${unit_id}/routes/${route_id}"
              payload: {}
              as: RouteSupervisor
              captures: { mid_status: $.data.status, mid_minutes: $.data.current_evaluated_minutes }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/delivery-units/${unit_id}/routes/${route_id}"
              payload: {}
              as: RouteSupervisor
          assert:
            - "at 2026-09-05 (before effective_date): route status UNDER_ADJUSTMENT and current_evaluated_minutes still 480"
            - "at 2026-09-08 (effective_date): RouteAdjustment.${adj_id}.status == EFFECTIVE, route status STANDARD, current_evaluated_minutes == 545"
            - "RouteEvaluation.${eval_id}.status == CLOSED_ADOPTED only after the effective date"

      - name: clock_default_is_fixed_startup_time
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — a hold with start 2026-09-02 created without touching the clock is still SCHEDULED, proving the default is not wall-clock."
        test_recipe:
          setup:
            - "Fresh server, clock never set. Unit DU51 with OCCUPIED point and a hold starting 2026-09-02."
          setup_api_calls:
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU51", office_name: "Default Clock Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0005100", full_name: "Gus Iro", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C510", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "5 Clock St", city: "Culver City", state_code: "CA", zip11: "902300105101", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p_id}/activate"
