            verification to assert the 409 while the registration axis is untouched.

      - name: registration_at_an_unauthorized_center
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_CENTER_NOT_AUTHORIZED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / testing_center_authorization_branch_divergent_side_effects"
          rationale: |
            That instance attempts session creation and registration while the center is still APPLIED
            and asserts the 409 before any authorization branch is taken.

      - name: registration_at_a_suspended_center
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_CENTER_SUSPENDED]
        excluded_because:
          difficulty_instance: "transitive_cascade / center_suspension_room_session_registration_voucher_depth4"
          rationale: |
            The depth-4 cascade suspends an authorized center and then attempts a fresh registration,
            asserting the 409 as the final rung of the cascade.

      - name: registration_on_a_session_that_is_not_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_SESSION_NOT_OPEN_FOR_REGISTRATION]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / exam_registration_requires_scheduled_session"
          rationale: |
            That instance registers against DRAFT, CANCELLED and COMPLETED sessions in turn and contrasts
            them with the SCHEDULED session that accepts registration.

  - section: endpoints
    instances:
      - name: class_section_standard_crud_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /class-sections]
          - endpoints[GET /class-sections/{sectionId}]
          - endpoints[GET /class-sections]
        distinguishing_aspect: |
          The list endpoint carries two independent filters (program_track, status) on top of pagination,
          so the claim is not merely "a list is returned" but that filters compose with offset paging:
          three sections across two tracks and two statuses are created, and each filter combination
          returns exactly the matching subset with a total_count that reflects the filter rather than the
          collection size.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Three class sections: two HSE_PREP (one left PLANNED, one moved to OPEN) and one ESL_ACQUISITION moved to OPEN."
          setup_api_calls:
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Morning", instructor_user_id: "instructor-31", min_efl_level: 2, max_efl_level: 6, seats_total: 20, weekly_hours: 9.00 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Evening", instructor_user_id: "instructor-32", min_efl_level: 3, max_efl_level: 6, seats_total: 15, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /class-sections"
              payload: { program_track: "ESL_ACQUISITION", title: "ESL Beginners", instructor_user_id: "instructor-33", min_efl_level: 1, max_efl_level: 3, seats_total: 12, weekly_hours: 4.00 }
              as: ProgramCoordinator
              captures: { s3: $.data.id }
            - call: "POST /class-sections/${s2}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /class-sections/${s3}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
          trigger:
            - call: "GET /class-sections/${s2}"
              as: Instructor
              captures: { got: $.data.title }
            - call: "GET /class-sections?program_track=HSE_PREP&limit=10&offset=0"
              as: Registrar
              captures: { t_track: "$.data[0].id" }
            - call: "GET /class-sections?status=OPEN&limit=1&offset=1"
              as: Registrar
              captures: { page2: "$.data[0].id" }
            - call: "GET /class-sections?program_track=ESL_ACQUISITION&status=PLANNED&limit=10&offset=0"
              as: StateAuthority
          assert:
            - "GET /class-sections/${s2} returns 200 with data.title == 'HSE Evening', data.status == 'OPEN', data.seats_taken == 0 and data.version == 2"
            - "the HSE_PREP filter returns total_count == 2 and has_more == false - the ESL section is excluded even though it exists"
            - "the OPEN filter with limit=1&offset=1 returns exactly one row, total_count == 2 and has_more == false - the filter is applied before the window, not after"
            - "the ESL_ACQUISITION + PLANNED combination returns total_count == 0 and an empty data array - both filters must match the same row"

      - name: voucher_adjustment_action_endpoint_credits_then_debits_the_balance
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /students/{studentId}/voucher-adjustments]
          - entities[Student.voucher_balance_cents]
        distinguishing_aspect: |
          The endpoint takes a signed delta rather than an absolute balance, so the claim is that the
          balance is a running ledger: a credit, a second credit and a debit must compose in issue order,
          and the response of each call must already show the post-adjustment balance rather than the
          pre-adjustment one. A zero delta is accepted and leaves the balance untouched, which separates
          "no-op" from "rejected".
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one student intaken with the default voucher balance of 0."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Omar Tessier", email: "omar.tessier@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "GET /students/${s}"
              as: Registrar
              captures: { start_balance: $.data.voucher_balance_cents }
          trigger:
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: 5000 }
              as: ProgramCoordinator
              captures: { b1: $.data.voucher_balance_cents }
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: 1400 }
              as: StateAuthority
              captures: { b2: $.data.voucher_balance_cents }
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: -2400 }
              as: ProgramCoordinator
              captures: { b3: $.data.voucher_balance_cents }
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: 0 }
              as: ProgramCoordinator
              captures: { b4: $.data.voucher_balance_cents }
            - call: "GET /students/${s}"
              as: Registrar
              captures: { final_balance: $.data.voucher_balance_cents }
          assert:
            - "the student started with data.voucher_balance_cents == 0"
            - "the three adjustments return 200 with data.voucher_balance_cents == 5000, then 6400, then 4000 - each response already reflects its own delta"
            - "the zero delta returns 200 with data.voucher_balance_cents == 4000 - a no-op is accepted, not rejected"
            - "GET /students/${s} reports data.voucher_balance_cents == 4000 - the ledger is the sum of the deltas, not the last one"

      - name: allocation_preview_computed_read_matches_the_committed_run
        claim_type: computed_read
        grounds:
          - endpoints[GET /funding-periods/{periodId}/allocation-preview]
          - endpoints[POST /funding-periods/{periodId}/allocation-run]
          - concurrency_rules[allocation-run-stale-period]
          - errors[ERR_STALE_FUNDING_PERIOD_VERSION]
        distinguishing_aspect: |
          The preview and the run must agree to the cent while differing completely in effect: the preview
          is read-only (period version and committed_cents unchanged, outcome rows still UNALLOCATED after
          it), and the run commits exactly the previewed figure. The version the preview reports is then
          consumed by the run, and re-using that now-stale version proves the OCC rule declared in §1.2.1
          fires on the second attempt rather than double-committing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. An OPEN funding period FY27-H1 with rate_cents_per_weight 8000 and total_cents 400000."
            - "Two students, each with one CERTIFIED outcome: EMPLOYMENT_Q2 (weight 1.25) and POSTSECONDARY_ENROLLMENT (weight 1.40)."
            - "Recording and certifying use different X-User-IDs so priority 52 is satisfied."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "FY27-H1", start_date: "2026-08-01", end_date: "2027-02-01", rate_cents_per_weight: 8000, total_cents: 400000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id, fpv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Ilse Vogt", email: "ilse.vogt@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Kwame Osei", email: "kwame.osei@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { s2: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s1}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "ev-ilse-q2" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o1: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s2}", funding_period_id: "${fp}", measure_type: "POSTSECONDARY_ENROLLMENT", evidence_ref: "ev-kwame-ps" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o2: $.data.id }
            - call: "POST /outcome-records/${o1}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records/${o2}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
          trigger:
            - call: "GET /funding-periods/${fp}/allocation-preview?variant=FINAL"
              as: ProgramCoordinator
              as_user_id: "coord-1"
            - call: "GET /funding-periods/${fp}"
              as: StateAuthority
              as_user_id: "state-1"
              captures: { v_after_preview: $.data.version }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${v_after_preview}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { run_total: $.data.committed_cents }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${v_after_preview}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { e1: $.data.error_id }
          assert:
            - "the preview returns 200 with data.total_allocated_cents == 21200 - 1.25 x 8000 == 10000 plus 1.40 x 8000 == 11200"
            - "the preview lists both outcome lines with allocated_cents 10000 and 11200 and never mutates: data.version == ${fpv} on the follow-up read and GET /outcome-records?funding_period_id=${fp}&allocation_status=UNALLOCATED&limit=10&offset=0 still returns total_count == 2 before the run"
            - "the run returns 200 with data.committed_cents == 21200 and data.available_cents == 378800 - identical to the preview figure"
            - "GET /outcome-records?funding_period_id=${fp}&allocation_status=COMMITTED&limit=10&offset=0 returns total_count == 2 immediately after the run"
            - "the repeated run with the pre-run version returns 412 with data.error_id == 'ERR_STALE_FUNDING_PERIOD_VERSION' and GET /funding-periods/${fp} still reports data.committed_cents == 21200 - the pool is not double-committed"

      - name: test_event_cross_reference_link_binds_the_event_to_an_enrollment
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /test-events]
          - endpoints[GET /test-events]
          - entities[TestEvent.enrollment_id]
        distinguishing_aspect: |
          enrollment_id is an optional cross-reference: a PRE_TEST is scheduled before any enrollment
          exists and therefore carries none, while a POST_TEST is bound to the enrollment whose hour
          ledger justified it. The claim is that the link is stored, filterable, and that the unlinked and
          linked events coexist for the same student - the filter must return only the linked one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a PLACED student (unlinked PRE_TEST already scored) enrolled and ACTIVE on an OPEN section with 40.00 posted hours, and the clock advanced 30 days."
