    grounds:
    - validations.priority_13.ERR_PROGRAM_FROZEN
    - calculations.compliance_posture
    - state_machines.TransplantProgram.compliance_posture.OPEN_to_FROZEN
    - state_machines.ExchangeChain.VALIDATED_to_COMMITTED
    distinguishing_aspect: A different entity pair, ExchangeChain <-> TransplantProgram, and the dependency
      runs UPWARD to a parent's derived governance field rather than sideways to sibling clinical rows.
      The chain is itself perfectly valid; only the parent program's compliance_posture forbids the write.
      The freeze is established BEFORE the chain exists, so the suspend cascade never touched this chain
      and it is genuinely VALIDATED - which is what makes the posture the only possible reason for refusal.
