      - name: offer_and_claim_lifecycle_errors_are_all_reachable
        claim_type: Triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_CLAIMS]
          - errors[ERR_OFFER_NOT_OPEN]
          - errors[ERR_CLAIM_NOT_WITHDRAWABLE]
          - validations[priority 56]
          - validations[priority 28]
          - validations[priority 30]
        distinguishing_aspect: >-
          The allocation path has three lifecycle refusals that only exist in a specific order: allocate
          before anyone claims, claim after allocation has closed the offer, and withdraw a claim twice.
          Reaching all three in one run proves the offer's fulfillment dimension really moves and is not
          simply recomputed from the claims.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two venues HRB (priority_rank 1) and GDN (priority_rank 2)."
            - "One distributor with an allocated RED wine and an offer of 10 bottles, deadline 2026-09-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Garden Table", venue_code: "GDN", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
            - call: "POST /beverage-program/distributors"
              payload: { name: "Coastal Selections", license_number: "LIC-0001", allocation_tier: "A" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 5000, bottle_size_ml: 750, case_pack: 6, is_allocated: true }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d1_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 5000, response_deadline: "2026-09-30T00:00:00Z" }
              as: DistributorRep
              as_user_id: "${d1_id}"
              captures: { off_id: $.data.id, off_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/allocation-offers/${off_id}/allocate"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v1_id}", requested_bottles: 6, expected_offer_version: "${off_v1}" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /beverage-program/allocation-offers/${off_id}/allocate"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { off_v3: $.data.version }
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v2_id}", requested_bottles: 4, expected_offer_version: "${off_v3}" }
              as: VenueSommelier
              as_user_id: "${v2_id}"
            - call: "POST /beverage-program/allocation-claims/${c1_id}/withdraw"
              payload: {}
              as: VenueSommelier
