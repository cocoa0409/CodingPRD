# =============================================================================
# Task 1131: Bulk Liquid Terminal & Transload (Kinder Morgan style)
# Difficulty target: beyond expert (dense coupling, 12 entities, 63 endpoints)
# =============================================================================

scenario: |
  generate task hard than expert level! 1131. Bulk Liquid Terminal & Transload
  (Kinder Morgan style terminal): tank allocation & customer lease agreement,
  receipt/discharge scheduling by vessel/rail/truck, gauging & custody transfer
  measurement, product quality sampling & retain, throughput fee & minimum volume
  commitment, heel/loss allowance & shrinkage, safety & vapor control permit,
  demurrage & dwell charges

domain_name: bulk-liquid-terminal
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite tank capacity leased, reserved, committed, released
  secondary_archetype: temporal_windowing    # berth/rack/bay scheduling windows with overlap semantics
  complexity_layers:
    - optimistic_concurrency                 # OCC on LeaseAgreement.version for amendment proposals
    - cascading_side_effects                 # certify -> tank inventory -> statement rollup -> lease suspension
    - dual_variant_calculation               # provisional vs certified custody volume; estimated vs actual demurrage
    - rate_threshold_triggers                # minimum commitment shortfall, demurrage free-hours, loss-control cap
  entity_topology: graph                     # many-to-many Lease<->Tank via TankAllocation; cross-aggregate FKs
  state_machine_shape: cyclic                # lease suspend/reactivate loop; custody dispute/resolve loop; plus parallel dims on Movement
  relationship_patterns: [many_to_many, cross_aggregate]
  role_model: segregation_of_duties          # gauger != certifier; sample collector != result recorder
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: tank_code, type: string, source: input, description: "Unique tank identifier code", constraints: "unique across all tanks" }
      - { name: product_grade, type: enum, source: input, description: "Grade stored", constraints: "GASOLINE | DIESEL | JET | ETHANOL | CRUDE" }
      - { name: capacity_bbl, type: number, source: input, description: "Shell capacity in barrels", constraints: "> 0" }
      - { name: safe_fill_pct, type: number, source: input, default: 0.95, description: "Maximum safe fill fraction", constraints: "0 < x <= 1" }
      - { name: heel_bbl, type: number, source: input, default: 0, description: "Unpumpable bottom heel in barrels", constraints: ">= 0" }
      - { name: vapor_control_class, type: enum, source: input, default: "NONE", description: "Vapor control requirement", constraints: "NONE | VRU_REQUIRED" }
      - { name: working_capacity_bbl, type: number, source: computed, description: "Read-only = floor(capacity_bbl * safe_fill_pct) - heel_bbl (calculation tank_working_capacity)" }
      - { name: current_inventory_bbl, type: number, source: computed, default: 0, description: "Read-only certified inventory: sum of certified RECEIPT volumes minus certified DISCHARGE volumes over CustodyTransfer status in {CERTIFIED, DISPUTED} (calculation tank_inventory_reconciliation)" }
      - { name: provisional_inventory_bbl, type: number, source: computed, default: 0, description: "Read-only = current_inventory_bbl + net signed volume of PROVISIONAL custody transfers" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE | RESTRICTED; RESTRICTED auto-set when certified inventory leaves [heel_bbl, working_capacity_bbl]" }

  - name: TerminalResource
    parent: null
    common_fields: true
    fields:
      - { name: resource_code, type: string, source: input, description: "Unique resource code", constraints: "unique across all resources" }
      - { name: resource_type, type: enum, source: input, description: "DOCK serves VESSEL, RAIL_RACK serves RAIL, TRUCK_BAY serves TRUCK", constraints: "DOCK | RAIL_RACK | TRUCK_BAY" }
      - { name: concurrent_capacity, type: integer, source: input, default: 1, description: "Max concurrently occupied windows; must be 1 for DOCK/RAIL_RACK, may be > 1 for TRUCK_BAY", constraints: ">= 1; > 1 only when resource_type == TRUCK_BAY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: product_grade, type: enum, source: input, description: "Leased product grade", constraints: "GASOLINE | DIESEL | JET | ETHANOL | CRUDE" }
      - { name: committed_capacity_bbl, type: number, source: input, description: "Total committed storage barrels", constraints: "> 0" }
      - { name: min_monthly_throughput_bbl, type: number, source: input, description: "Minimum volume commitment per calendar month", constraints: ">= 0" }
      - { name: throughput_fee_per_bbl, type: number, source: input, description: "Base throughput fee per barrel (tier 1 rate)", constraints: "> 0" }
      - { name: shortfall_fee_per_bbl, type: number, source: input, description: "Fee per shortfall barrel below minimum commitment", constraints: ">= 0" }
      - { name: loss_allowance_pct, type: number, source: input, description: "Contractual heel/loss allowance as fraction of declared volume (e.g. 0.005)", constraints: ">= 0" }
      - { name: excess_loss_rate_per_bbl, type: number, source: input, description: "Charge per excess-loss barrel beyond allowance", constraints: ">= 0" }
      - { name: start_date, type: string, source: input, description: "Lease start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Lease end date YYYY-MM-DD (inclusive); lease EXPIRED when clock date > end_date", constraints: "end_date >= start_date" }
      - { name: reserved_capacity_bbl, type: number, source: computed, default: 0, description: "Read-only = sum of allocated_bbl over TankAllocation with status ACTIVE for this lease" }
      - { name: suspension_reason, type: enum, source: system, description: "Null unless SUSPENDED; MANUAL (operator action) or LOSS_CONTROL (auto, statement excess loss cap breach)", constraints: "MANUAL | LOSS_CONTROL | null" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> SUSPENDED -> EXPIRED | TERMINATED" }

  - name: LeaseAmendment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id; amended lease" }
      - { name: proposed_committed_capacity_bbl, type: number, source: input, description: "Proposed new committed capacity; at least one proposed_* field required", constraints: "> 0; optional" }
      - { name: proposed_throughput_fee_per_bbl, type: number, source: input, description: "Proposed new base fee; optional", constraints: "> 0; optional" }
      - { name: proposed_min_monthly_throughput_bbl, type: number, source: input, description: "Proposed new minimum commitment; optional", constraints: ">= 0; optional" }
      - { name: base_lease_version, type: integer, source: system, description: "LeaseAgreement.version observed at proposal time (version pinned); approval rejects if lease version has advanced" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPROVED | REJECTED" }

  - name: TankAllocation
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id; allocation's lease" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; allocated tank" }
      - { name: allocated_bbl, type: number, source: input, description: "Barrels allocated to the lease in this tank", constraints: "> 0 and <= tank working_capacity_bbl" }
      - { name: period_start, type: string, source: input, description: "Allocation period start YYYY-MM-DD (inclusive)" }
      - { name: period_end, type: string, source: input, description: "Allocation period end YYYY-MM-DD (inclusive, closed range)", constraints: "within lease start_date..end_date; period_end >= period_start" }
      - { name: status, type: enum, source: system, description: "RESERVED -> ACTIVE -> RELEASED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: permit_type, type: enum, source: input, description: "Permit kind", constraints: "VAPOR_CONTROL | HOT_WORK" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; tank the permit covers" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (inclusive)", constraints: "valid_until > valid_from" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> REVOKED | EXPIRED; EXPIRED is lazily applied when clock passes valid_until" }

  - name: Movement
    parent: null
    common_fields: true
    fields:
      - { name: sequence_no, type: integer, source: system, description: "Monotonic per-terminal intake sequence starting at 1; used only as deterministic tie-break after created_at" }
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id; leasing customer contract" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; source/destination tank" }
      - { name: resource_id, type: string, source: system, description: "FK -> TerminalResource.id; nullable until scheduled" }
      - { name: direction, type: enum, source: input, description: "RECEIPT (into tank) | DISCHARGE (out of tank)", constraints: "RECEIPT | DISCHARGE" }
      - { name: mode, type: enum, source: input, description: "Transport mode; maps to resource type VESSEL->DOCK, RAIL->RAIL_RACK, TRUCK->TRUCK_BAY", constraints: "VESSEL | RAIL | TRUCK" }
      - { name: product_grade, type: enum, source: input, description: "Product moved; must equal lease and tank product_grade", constraints: "GASOLINE | DIESEL | JET | ETHANOL | CRUDE" }
      - { name: declared_volume_bbl, type: number, source: input, description: "Nominated / bill-of-lading volume", constraints: "> 0 and <= allocated_bbl of the ACTIVE allocation covering (lease, tank)" }
      - { name: window_start, type: datetime, source: input, description: "Requested occupation window start (inclusive); half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Requested occupation window end (exclusive)", constraints: "window_end > window_start" }
      - { name: actual_arrival_at, type: datetime, source: system, description: "Logical clock timestamp recorded by arrive" }
      - { name: actual_start_at, type: datetime, source: system, description: "Logical clock timestamp recorded by start" }
      - { name: actual_complete_at, type: datetime, source: system, description: "Logical clock timestamp recorded by complete" }
      - { name: demurrage_estimated_amount, type: number, source: computed, description: "Forward-looking variant of demurrage_charge computed at schedule from window duration" }
      - { name: demurrage_actual_amount, type: number, source: computed, description: "Actual-settlement variant of demurrage_charge computed at complete from actual timestamps" }
      - { name: status, type: enum, source: system, description: "NOMINATED -> SCHEDULED -> ARRIVED -> IN_PROGRESS -> COMPLETED; SUSPENDED on permit revoke; CANCELLED from NOMINATED/SCHEDULED" }
      - { name: billing_status, type: enum, source: system, description: "Parallel dimension independent of status: UNBILLED -> ACCRUED (statement close) -> INVOICED (statement invoice)" }

  - name: GaugeTicket
    parent: null
    common_fields: false
    fields:
      - { name: movement_id, type: string, source: system, description: "FK -> Movement.id; ticket's movement (path-scoped)" }
      - { name: ticket_type, type: enum, source: input, description: "OPENING (before pumping) | CLOSING (after pumping); at most one of each per movement", constraints: "OPENING | CLOSING" }
      - { name: observed_volume_bbl, type: number, source: input, description: "Observed tank volume in barrels", constraints: ">= 0" }
      - { name: observed_temp_f, type: number, source: input, description: "Observed product temperature in Fahrenheit" }
      - { name: observed_at, type: datetime, source: input, description: "Gauge observation timestamp" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Gauger; used for segregation-of-duties checks" }

  - name: QualitySample
    parent: null
    common_fields: true
    fields:
      - { name: movement_id, type: string, source: system, description: "FK -> Movement.id; sampled movement (path-scoped)" }
      - { name: sample_type, type: enum, source: input, description: "Sampling point", constraints: "FIRST_FOOT | INLINE | ALL_LEVELS" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of collecting QualityInspector" }
      - { name: lab_result, type: enum, source: system, description: "PENDING -> PASSED | FAILED via record-result" }
      - { name: specific_gravity, type: number, source: input, description: "Lab-measured specific gravity; required when lab_result recorded; feeds certified custody variant", constraints: "> 0" }
      - { name: result_recorded_by_user_id, type: string, source: system, description: "X-User-ID recording the lab result; must differ from collected_by_user_id" }
      - { name: retain_until, type: datetime, source: computed, description: "Read-only = created_at + RETAIN_DAYS (30) days; retain release blocked before this instant" }
      - { name: retain_status, type: enum, source: system, description: "RETAINED -> RELEASED" }

  - name: CustodyTransfer
    parent: null
    common_fields: true
    fields:
      - { name: movement_id, type: string, source: system, description: "FK -> Movement.id; 1:1 with movement, auto-created PROVISIONAL at movement complete" }
      - { name: provisional_volume_bbl, type: number, source: computed, description: "Provisional variant volume (whole bbl) from gauge pair at creation" }
      - { name: certified_volume_bbl, type: number, source: computed, description: "Certified variant volume (whole bbl) computed at certify using lab specific_gravity" }
      - { name: shrinkage_bbl, type: number, source: computed, description: "declared_volume_bbl - certified_volume_bbl (RECEIPT); signed" }
      - { name: allowed_loss_bbl, type: number, source: computed, description: "round_half_up(declared_volume_bbl * lease.loss_allowance_pct, 0)" }
      - { name: excess_loss_bbl, type: number, source: computed, description: "max(0, shrinkage_bbl - allowed_loss_bbl)" }
      - { name: excess_loss_charge, type: number, source: computed, description: "round_half_up(excess_loss_bbl * lease.excess_loss_rate_per_bbl, 2); rounded per custody transfer (per-line) at certify" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying TerminalManager; must differ from gauge recorder" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> CERTIFIED -> DISPUTED -> CERTIFIED; CERTIFIED | DISPUTED -> VOID" }

  - name: MonthlyStatement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> LeaseAgreement.id; statement's lease (path-scoped)" }
      - { name: period, type: string, source: input, description: "Calendar month YYYY-MM; unique per lease", constraints: "format YYYY-MM" }
      - { name: period_start, type: datetime, source: computed, description: "First day of period 00:00:00Z (inclusive)" }
      - { name: period_end_exclusive, type: datetime, source: computed, description: "First day of next month 00:00:00Z (exclusive); close requires clock >= this" }
      - { name: total_throughput_bbl, type: number, source: computed, default: 0, description: "Sum of certified_volume_bbl over custody transfers with status in {CERTIFIED, DISPUTED} whose movement actual_complete_at falls in [period_start, period_end_exclusive)" }
      - { name: throughput_fee_amount, type: number, source: computed, default: 0, description: "Tiered fee on total_throughput_bbl (calculation throughput_fee_tiered)" }
      - { name: shortfall_bbl, type: number, source: computed, default: 0, description: "max(0, min_monthly_throughput_bbl - total_throughput_bbl)" }
      - { name: shortfall_fee_amount, type: number, source: computed, default: 0, description: "shortfall_bbl * shortfall_fee_per_bbl (2dp)" }
      - { name: total_excess_loss_bbl, type: number, source: computed, default: 0, description: "Sum of excess_loss_bbl over the statement input set" }
      - { name: excess_loss_amount, type: number, source: computed, default: 0, description: "Sum of per-line rounded excess_loss_charge values (round-per-line-then-sum, calculation monthly_statement_aggregation)" }
      - { name: total_demurrage_amount, type: number, source: computed, default: 0, description: "Sum of demurrage_actual_amount for COMPLETED VESSEL/RAIL movements completing in period" }
      - { name: total_dwell_amount, type: number, source: computed, default: 0, description: "Sum of demurrage_actual_amount for COMPLETED TRUCK movements completing in period" }
      - { name: statement_total_amount, type: number, source: computed, default: 0, description: "throughput_fee_amount + shortfall_fee_amount + excess_loss_amount + total_demurrage_amount + total_dwell_amount" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> INVOICED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tank
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /tanks/{tankId}/enter-maintenance"
        actor: TerminalOperator
        preconditions:
          - "No Movement on this tank in status ARRIVED, IN_PROGRESS, or SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /tanks/{tankId}/return-to-service"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Re-evaluate RESTRICTED posture is not applied here; inventory bounds only re-checked on custody certify/void"
      - from: AVAILABLE
        to: RESTRICTED
        trigger: "system (automatic on custody certify/resolve/void recompute when current_inventory_bbl > working_capacity_bbl or < heel_bbl)"
        actor: system
        preconditions: []
        side_effects:
          - "While RESTRICTED, allocation create/activate and movement create on this tank fail with ERR_TANK_NOT_AVAILABLE"
      - from: RESTRICTED
        to: AVAILABLE
        trigger: "system (automatic on custody certify/resolve/void recompute when current_inventory_bbl returns within [heel_bbl, working_capacity_bbl])"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TerminalResource
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /terminal-resources/{resourceId}/out-of-service"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Existing SCHEDULED/ARRIVED/IN_PROGRESS movements are NOT displaced; new schedule attempts fail with ERR_RESOURCE_UNAVAILABLE"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /terminal-resources/{resourceId}/return-to-service"
        actor: TerminalOperator
        preconditions: []
        side_effects: []

  - entity: LeaseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /lease-agreements/{leaseId}/activate"
        actor: TerminalManager
        preconditions:
          - "At least one TankAllocation for this lease in status ACTIVE (ERR_NO_ACTIVE_ALLOCATION)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lease-agreements/{leaseId}/suspend OR system (auto when a recomputed OPEN MonthlyStatement.total_excess_loss_bbl > LOSS_CONTROL_CAP_BBL)"
        actor: TerminalManager | system
        preconditions: []
        side_effects:
          - "suspension_reason = MANUAL for operator action, LOSS_CONTROL for system"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lease-agreements/{leaseId}/reactivate"
        actor: TerminalManager
        preconditions: []
        side_effects:
          - "suspension_reason cleared to null"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy, applied on any read or precondition evaluation when logical clock date > end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (lazy, same rule as ACTIVE -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lease-agreements/{leaseId}/terminate"
        actor: TerminalManager
        preconditions:
          - "No Movement for this lease in status SCHEDULED, ARRIVED, IN_PROGRESS, or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "All TankAllocation in RESERVED or ACTIVE -> RELEASED; reserved_capacity_bbl recomputed to 0"

  - entity: LeaseAmendment
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /lease-amendments/{amendmentId}/approve"
        actor: TerminalManager
        preconditions:
          - "LeaseAgreement.status == ACTIVE or SUSPENDED (ERR_LEASE_NOT_ACTIVE)"
          - "amendment.base_lease_version == current LeaseAgreement.version (ERR_AMENDMENT_STALE_BASE)"
        side_effects:
          - "Apply each non-null proposed_* field onto the LeaseAgreement"
          - "increments LeaseAgreement.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lease-amendments/{amendmentId}/reject"
        actor: TerminalManager
        preconditions: []
        side_effects: []

  - entity: TankAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /tank-allocations/{allocationId}/activate"
        actor: TerminalOperator
        preconditions:
          - "LeaseAgreement.status in {DRAFT, ACTIVE} (ERR_LEASE_NOT_ACTIVE)"
          - "Tank.status == AVAILABLE (ERR_TANK_NOT_AVAILABLE)"
          - "Aggregate capacity recheck passes (calculation allocation_capacity_sweep) (ERR_ALLOCATION_CAPACITY_EXCEEDED)"
        side_effects:
          - "LeaseAgreement.reserved_capacity_bbl recomputed (sum of ACTIVE allocations); increments LeaseAgreement.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /tank-allocations/{allocationId}/release"
        actor: TerminalOperator
        preconditions:
          - "No Movement on this (lease, tank) in status SCHEDULED, ARRIVED, IN_PROGRESS, or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "LeaseAgreement.reserved_capacity_bbl recomputed; increments LeaseAgreement.version by 1"

  - entity: Permit
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /permits/{permitId}/approve"
        actor: TerminalManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /permits/{permitId}/revoke"
        actor: TerminalManager
        preconditions: []
        side_effects:
          - "Every Movement on permit.tank_id in status IN_PROGRESS whose mode requires vapor control (tank vapor_control_class == VRU_REQUIRED) transitions to SUSPENDED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy, applied when logical clock > valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (lazy, applied when logical clock > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Movement
    initial_state: NOMINATED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: NOMINATED
        to: SCHEDULED
        trigger: "POST /movements/{movementId}/schedule OR system (waitlist promotion after a cancel frees a window)"
        actor: Scheduler | system
        preconditions:
          - "LeaseAgreement.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "Tank.status == AVAILABLE (ERR_TANK_NOT_AVAILABLE)"
          - "TerminalResource.status == ACTIVE and resource_type matches mode mapping (ERR_RESOURCE_UNAVAILABLE / ERR_RESOURCE_TYPE_MISMATCH)"
          - "Window occupation rule passes (calculation resource_window_occupation) (ERR_WINDOW_CONFLICT)"
          - "ACTIVE allocation covering (lease, tank) exists (ERR_NO_ACTIVE_ALLOCATION) and declared_volume_bbl <= allocated_bbl (ERR_VOLUME_EXCEEDS_ALLOCATION)"
        side_effects:
          - "resource_id set; demurrage_estimated_amount computed (demurrage_charge scheduled_estimate variant)"
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /movements/{movementId}/arrive"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "actual_arrival_at = logical clock now"
      - from: ARRIVED
        to: IN_PROGRESS
        trigger: "POST /movements/{movementId}/start"
        actor: Scheduler
        preconditions:
          - "OPENING GaugeTicket exists for this movement (ERR_GAUGE_MISSING)"
          - "If tank vapor_control_class == VRU_REQUIRED: an APPROVED VAPOR_CONTROL Permit exists for the tank (ERR_VAPOR_PERMIT_REQUIRED) whose [valid_from, valid_until] covers now (ERR_PERMIT_WINDOW_INSUFFICIENT)"
          - "now <= window_end + LATE_GRACE_MINUTES (30) (ERR_WINDOW_LAPSED)"
        side_effects:
          - "actual_start_at = logical clock now"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /movements/{movementId}/complete"
        actor: Scheduler
        preconditions:
          - "CLOSING GaugeTicket exists for this movement (ERR_GAUGE_MISSING)"
        side_effects:
          - "actual_complete_at = logical clock now"
          - "demurrage_actual_amount computed (demurrage_charge actual_settlement variant)"
          - "CustodyTransfer auto-created in PROVISIONAL with provisional_volume_bbl (custody_transfer_volume provisional variant)"
          - "Tank.provisional_inventory_bbl recomputed"
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (cascade from POST /permits/{permitId}/revoke on this tank)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /movements/{movementId}/resume"
        actor: Scheduler
        preconditions:
          - "If tank vapor_control_class == VRU_REQUIRED: an APPROVED VAPOR_CONTROL Permit exists covering now (ERR_VAPOR_PERMIT_REQUIRED / ERR_PERMIT_WINDOW_INSUFFICIENT)"
        side_effects: []
      - from: NOMINATED
        to: CANCELLED
        trigger: "POST /movements/{movementId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /movements/{movementId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "resource window freed; waitlist promotion runs (calculation waitlist_promotion_selector): highest-ranked fitting NOMINATED movement auto-transitions NOMINATED -> SCHEDULED on the freed resource, which sets its resource_id and computes its demurrage_estimated_amount"

  - entity: QualitySample
    initial_state: RETAINED
    terminal_states: [RELEASED]
    transitions:
      - from: RETAINED
        to: RELEASED
        trigger: "POST /quality-samples/{sampleId}/release-retain"
        actor: QualityInspector
        preconditions:
          - "The movement's CustodyTransfer status == CERTIFIED (ERR_CUSTODY_NOT_CERTIFIED)"
          - "logical clock >= retain_until (ERR_RETAIN_PERIOD_ACTIVE)"
        side_effects: []
    note: "lab_result is a parallel attribute: PENDING -> PASSED | FAILED via POST /quality-samples/{sampleId}/record-result (not a status machine transition; record-result requires result_recorded_by != collected_by per segregation of duties)"

  - entity: CustodyTransfer
    initial_state: PROVISIONAL
    terminal_states: [VOID]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /custody-transfers/{ctId}/certify"
        actor: TerminalManager
        preconditions:
          - "A QualitySample for the movement exists with lab_result == PASSED (ERR_QUALITY_NOT_PASSED)"
          - "X-User-ID != recorded_by_user_id of the movement's gauge tickets (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_volume_bbl computed (custody_transfer_volume certified variant); shrinkage_bbl, allowed_loss_bbl, excess_loss_bbl, excess_loss_charge computed (shrinkage_and_excess_loss)"
          - "certified_by_user_id = X-User-ID"
          - "Tank.current_inventory_bbl and provisional_inventory_bbl recomputed (tank_inventory_reconciliation); Tank auto-transitions AVAILABLE <-> RESTRICTED per inventory bounds"
          - "If an OPEN MonthlyStatement exists for (lease, period of movement actual_complete_at): statement recomputed (monthly_statement_aggregation)"
          - "If recomputed statement.total_excess_loss_bbl > LOSS_CONTROL_CAP_BBL (100): LeaseAgreement auto-transitions ACTIVE -> SUSPENDED with suspension_reason LOSS_CONTROL"
      - from: CERTIFIED
        to: DISPUTED
        trigger: "POST /custody-transfers/{ctId}/dispute"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == lease.customer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Tank inventory contribution unchanged: DISPUTED transfers still count at certified_volume_bbl"
      - from: DISPUTED
        to: CERTIFIED
        trigger: "POST /custody-transfers/{ctId}/resolve"
        actor: TerminalManager
        preconditions: []
        side_effects:
          - "Statement recompute if OPEN statement exists (same rules as certify)"
      - from: CERTIFIED
        to: VOID
        trigger: "POST /custody-transfers/{ctId}/void"
        actor: TerminalManager
        preconditions: []
        side_effects:
          - "Transfer excluded from tank_inventory_reconciliation and statement input sets; Tank.current_inventory_bbl recomputed (compensating invariant inventory_conservation)"
          - "OPEN statement recomputed; lease is NOT auto-reactivated even if total_excess_loss_bbl falls back to <= cap"
      - from: DISPUTED
        to: VOID
        trigger: "POST /custody-transfers/{ctId}/void"
        actor: TerminalManager
        preconditions: []
        side_effects:
          - "Same compensation side effects as CERTIFIED -> VOID"

  - entity: MonthlyStatement
    initial_state: OPEN
    terminal_states: [INVOICED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /monthly-statements/{statementId}/close"
        actor: BillingClerk
        preconditions:
          - "logical clock >= period_end_exclusive (ERR_STATEMENT_PERIOD_NOT_ENDED)"
        side_effects:
          - "Full deterministic recompute (calculations throughput_fee_tiered, minimum_commitment_shortfall, monthly_statement_aggregation) over the pinned input set"
          - "Every COMPLETED Movement of this lease with actual_complete_at in the period: billing_status UNBILLED -> ACCRUED"
      - from: CLOSED
        to: INVOICED
        trigger: "POST /monthly-statements/{statementId}/invoice"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Every Movement of this lease in the period with billing_status == ACCRUED transitions to INVOICED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-lease
    parent_entity: LeaseAgreement
    write_endpoint: "POST /lease-agreements/{leaseId}/amendments"
    occ_field: expected_lease_version
    description: |
      Creating a LeaseAmendment against a LeaseAgreement whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just proposed an amendment (which legitimately
      supersedes the prior negotiation basis) or the lease terms changed, so the
      current writer's view of the lease is stale. The amendment records
      base_lease_version from the accepted expected_lease_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tank_working_capacity
    trigger: "Tank create (and whenever capacity_bbl, safe_fill_pct, or heel_bbl would change)"
    algorithm: static_formula
    formula: |
      working_capacity_bbl = floor(capacity_bbl * safe_fill_pct) - heel_bbl
    input_set: "the Tank row itself"
    constants:
      DEFAULT_SAFE_FILL_PCT: 0.95
    precision: "integer barrels (floor applied before heel subtraction)"
    variants: []

  - name: allocation_capacity_sweep
    trigger: "TankAllocation create and RESERVED -> ACTIVE activation"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity overlap over CLOSED date ranges [period_start, period_end].
      # For every calendar date d covered by the candidate allocation period:
      #   sum(d) = SUM(allocated_bbl) over allocations A of the same tank with
      #            A.status in {RESERVED, ACTIVE} and A.period_start <= d <= A.period_end
      # Reject if for any d: sum(d) + candidate.allocated_bbl > tank.working_capacity_bbl
      # Equality (sum == working_capacity_bbl) is ALLOWED (<= boundary).
      # Sweep is evaluated at the finite set of period boundary dates only
      # (candidate and existing period_start/period_end values), since sums are
      # constant between boundary dates.
    input_set: "TankAllocation rows for the same tank with status in {RESERVED, ACTIVE}; the candidate allocation"
    constants: {}
    precision: "whole-barrel comparison, no rounding"
    variants: []

  - name: custody_transfer_volume
    trigger: "CustodyTransfer auto-creation (provisional variant) and POST /custody-transfers/{ctId}/certify (certified variant)"
    algorithm: measurement_correction
    formula: |
      # Temperature-corrected observed volume:
      #   V_corr(ticket) = observed_volume_bbl * (1 - CTL_COEFF * (observed_temp_f - REF_TEMP_F))
      # raw = V_corr(closing) - V_corr(opening)
      # RECEIPT uses raw directly; DISCHARGE uses -raw. transferred = abs(value).
      # provisional: round_half_up(transferred, 0)  -> provisional_volume_bbl
      # certified:   round_half_up(transferred * (sample.specific_gravity / GRADE_STD_SG[movement.product_grade]), 0) -> certified_volume_bbl
      # The sample used is the movement's QualitySample with lab_result == PASSED;
      # exactly one PASSED sample is required at certify time.
    input_set: "the movement's OPENING and CLOSING GaugeTicket; for the certified variant also the PASSED QualitySample"
    constants:
      CTL_COEFF: 0.0006
      REF_TEMP_F: 60
      GRADE_STD_SG: { GASOLINE: 0.74, DIESEL: 0.85, JET: 0.80, ETHANOL: 0.79, CRUDE: 0.87 }
    precision: "0 decimal places (whole barrels), round_half_up; rounding applied exactly once per variant computation"
    variants:
      - name: provisional
        when: "auto-created at movement complete, before lab results are consumed"
        difference: "volume corrected only to reference temperature; standard gravity assumed"
      - name: certified
        when: "POST /custody-transfers/{ctId}/certify after sample PASSED"
        difference: "additional specific-gravity ratio factor from the lab sample; diverges from provisional whenever specific_gravity != GRADE_STD_SG[product_grade]"

  - name: shrinkage_and_excess_loss
    trigger: "POST /custody-transfers/{ctId}/certify (after certified variant volume is computed)"
    algorithm: threshold
    formula: |
      shrinkage_bbl       = movement.declared_volume_bbl - certified_volume_bbl
      allowed_loss_bbl    = round_half_up(movement.declared_volume_bbl * lease.loss_allowance_pct, 0)
      excess_loss_bbl     = max(0, shrinkage_bbl - allowed_loss_bbl)
      excess_loss_charge  = round_half_up(excess_loss_bbl * lease.excess_loss_rate_per_bbl, 2)
      # A negative shrinkage (gain) yields excess_loss_bbl == 0; allowance is NOT banked.
    input_set: "the CustodyTransfer row, its Movement, and the governing LeaseAgreement"
    constants:
      LOSS_CONTROL_CAP_BBL: 100
    precision: "allowed_loss at 0dp round_half_up; charge at 2dp round_half_up, rounded per custody transfer (per-line) at certify time"
    variants: []

  - name: demurrage_charge
    trigger: "scheduled_estimate variant at POST /movements/{id}/schedule; actual_settlement variant at POST /movements/{id}/complete"
    algorithm: threshold
    formula: |
      free_hours = FREE_HOURS_BY_MODE[movement.mode]
      rate       = RATE_PER_HOUR_BY_MODE[movement.mode]
      # scheduled_estimate (forward-looking):
      #   window_hours = (window_end - window_start) in hours (exact rational)
      #   demurrage_estimated_amount = max(0, window_hours - free_hours) * rate, rounded 2dp
      # actual_settlement (chronological):
      #   elapsed_hours = ceil((actual_complete_at - actual_arrival_at) in seconds / 3600)
      #   chargeable    = max(0, elapsed_hours - free_hours)   # strict > : elapsed == free yields 0
      #   demurrage_actual_amount = chargeable * rate, rounded 2dp
    input_set: "the Movement row (mode, window, actual timestamps)"
    constants:
      FREE_HOURS_BY_MODE: { VESSEL: 24, RAIL: 48, TRUCK: 4 }
      RATE_PER_HOUR_BY_MODE: { VESSEL: 1200.00, RAIL: 85.00, TRUCK: 60.00 }
      LATE_GRACE_MINUTES: 30
    precision: "2 decimal places, round_half_up; per-movement line rounding at computation time"
    variants:
      - name: scheduled_estimate
        when: "at schedule time; stored on demurrage_estimated_amount"
        difference: "computed from the requested window duration, forward-looking"
      - name: actual_settlement
        when: "at complete time; stored on demurrage_actual_amount"
        difference: "computed from actual arrival/complete timestamps with ceil-to-hour; same window can yield a different amount"

  - name: throughput_fee_tiered
    trigger: "MonthlyStatement close (and OPEN-statement recompute after certify/resolve/void)"
    algorithm: tiered_pricing
    formula: |
      # Marginal tier allocation over total_throughput_bbl (whole barrels):
      #   tier 1: [0, TIER1_CAP)              at 1.00 * throughput_fee_per_bbl
      #   tier 2: [TIER1_CAP, TIER2_CAP)      at 0.90 * throughput_fee_per_bbl
      #   tier 3: [TIER2_CAP, +inf)           at 0.75 * throughput_fee_per_bbl
      # Exactly TIER1_CAP barrels all price in tier 1 (half-open tiers).
      # throughput_fee_amount = round_half_up(sum of marginal tier amounts, 2)
      # Evaluation order pinned: total_throughput_bbl first (aggregation over the
      # statement input set), then tier split, then single final rounding.
    input_set: "CustodyTransfer rows with status in {CERTIFIED, DISPUTED} whose movement.actual_complete_at in [period_start, period_end_exclusive)"
    constants:
      TIER1_CAP: 50000
      TIER2_CAP: 200000
      TIER2_DISCOUNT: 0.90
      TIER3_DISCOUNT: 0.75
    precision: "2 decimal places, round_half_up, single final rounding (sum-then-round within this fee only)"
    variants: []

  - name: minimum_commitment_shortfall
    trigger: "MonthlyStatement close (and OPEN-statement recompute)"
    algorithm: threshold
    formula: |
      # Boundary pinned: total_throughput_bbl >= min_monthly_throughput_bbl yields NO shortfall.
      shortfall_bbl        = max(0, lease.min_monthly_throughput_bbl - total_throughput_bbl)
      shortfall_fee_amount = round_half_up(shortfall_bbl * lease.shortfall_fee_per_bbl, 2)
    input_set: "the MonthlyStatement row and its LeaseAgreement"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: monthly_statement_aggregation
    trigger: "MonthlyStatement close; OPEN-statement recompute after custody certify/resolve/void"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: round-per-line-then-sum.
      #   excess_loss_amount     = SUM(excess_loss_charge)         # each line already rounded 2dp at certify
      #   total_demurrage_amount = SUM(demurrage_actual_amount)    # each line already rounded 2dp at complete
      #   total_dwell_amount     = SUM(demurrage_actual_amount)    # TRUCK mode lines only
      # Demurrage lines: movements COMPLETED with actual_complete_at in the period;
      #   VESSEL and RAIL feed total_demurrage_amount, TRUCK feeds total_dwell_amount.
      # statement_total_amount = throughput_fee_amount + shortfall_fee_amount
      #                        + excess_loss_amount + total_demurrage_amount + total_dwell_amount
      # (alternative sum-then-round of raw unrounded line values is FORBIDDEN and
      #  produces different cents, e.g. 111.12 vs 111.11 for two 55.555 lines)
    input_set: "CustodyTransfer status in {CERTIFIED, DISPUTED} for the period (throughput/loss); Movement status COMPLETED with actual_complete_at in [period_start, period_end_exclusive) for demurrage/dwell; PROVISIONAL and VOID custody transfers EXCLUDED"
    constants: {}
    precision: "line values pre-rounded 2dp; sums exact; statement_total_amount is an exact sum of 2dp values"
    variants: []

  - name: tank_inventory_reconciliation
    trigger: "custody certify / resolve / void (recompute); movement complete (provisional_inventory_bbl only)"
    algorithm: projection
    formula: |
      # Conservation invariant (compensating-invariant anchor):
      #   current_inventory_bbl = SUM(sign * certified_volume_bbl)
      #     over CustodyTransfer of this tank with status in {CERTIFIED, DISPUTED},
      #     sign = +1 for RECEIPT movements, -1 for DISCHARGE movements.
      #   VOID and PROVISIONAL transfers contribute 0.
      #   certify-then-void MUST leave current_inventory_bbl unchanged.
      # provisional_inventory_bbl = current_inventory_bbl + SUM(sign * provisional_volume_bbl)
      #   over PROVISIONAL transfers of this tank.
    input_set: "CustodyTransfer rows joined to their Movement for the tank; status filter as pinned above"
    constants: {}
    precision: "whole-barrel arithmetic (volumes already whole barrels)"
    variants: []

  - name: waitlist_promotion_selector
    trigger: "POST /movements/{id}/cancel when the cancelled movement was SCHEDULED (window freed)"
    algorithm: selector_ranking
    formula: |
      # Eligibility filter: Movement.status == NOMINATED
      #   AND mode maps to the freed resource's resource_type
      #   AND the movement's [window_start, window_end) does not conflict with any
      #       remaining SCHEDULED/ARRIVED/IN_PROGRESS/SUSPENDED occupation on that resource
      #       (same resource_window_occupation rule as schedule).
      # Ranking: created_at ASC; tie-break: sequence_no ASC (never id).
      # The single top-ranked eligible movement is promoted; after promotion the
      # selection repeats until no candidate fits (at most one promotion per freed
      # unit of concurrent_capacity per pass).
      # Empty candidate set: no-op (deferred; no error).
    input_set: "all Movement rows; the freed TerminalResource"
    constants: {}
    precision: "n/a"
    variants: []

  - name: resource_window_occupation
    trigger: "POST /movements/{id}/schedule; waitlist promotion evaluation"
    algorithm: interval_merge
    formula: |
      # Exclusive-occupation semantics for DOCK and RAIL_RACK (concurrent_capacity == 1):
      #   windows are HALF-OPEN [window_start, window_end).
      #   Adjacency is allowed: existing.end == candidate.start does NOT conflict.
      #   Conflict iff candidate.start < existing.end AND existing.start < candidate.end
      #   over movements on the same resource with status in
      #   {SCHEDULED, ARRIVED, IN_PROGRESS, SUSPENDED}.
      # Aggregate-capacity semantics for TRUCK_BAY (concurrent_capacity N > 1 allowed):
      #   conflict iff at any instant the number of overlapping occupations would
      #   exceed concurrent_capacity (i.e. max concurrent overlap count + 1 > N).
    input_set: "Movement rows on the target resource with status in {SCHEDULED, ARRIVED, IN_PROGRESS, SUSPENDED}"
    constants: {}
    precision: "datetime comparison, second precision"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: for CustomerRep operations (POST /lease-agreements, POST /lease-agreements/{id}/amendments, POST /custody-transfers/{id}/dispute) the target/customer linkage must equal X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /lease-agreements, POST /lease-agreements/{leaseId}/amendments, POST /custody-transfers/{ctId}/dispute"
  - priority: 4
    category: business_constraint
    check: "Request schema: required fields present, value types/enum members valid, date/datetime formats valid; amendment create requires at least one proposed_* field"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Path template ids resolve, validated left-to-right; then body FK fields resolve. Variant per entity: ERR_CUSTOMER_NOT_FOUND, ERR_TANK_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_AMENDMENT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_MOVEMENT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_CUSTODY_TRANSFER_NOT_FOUND, ERR_STATEMENT_NOT_FOUND"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "all (entity-specific variants: ERR_TANK_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_AMENDMENT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_MOVEMENT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_CUSTODY_TRANSFER_NOT_FOUND, ERR_STATEMENT_NOT_FOUND)"
  - priority: 6
    category: state
    check: "State-machine from-state matches the attempted transition; terminal states reject all transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "LeaseAgreement.status == ACTIVE for movement create/schedule; in {DRAFT, ACTIVE} for allocation create/activate; in {ACTIVE, SUSPENDED} for amendment create/approve; not EXPIRED/TERMINATED for statement create"
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /movements, POST /movements/{id}/schedule, POST /lease-agreements/{id}/allocations, POST /tank-allocations/{id}/activate, POST /lease-agreements/{id}/amendments, POST /lease-amendments/{id}/approve, POST /lease-agreements/{id}/statements"
  - priority: 8
    category: state
    check: "Tank.status == AVAILABLE for allocation create/activate and movement create"
    error_id: ERR_TANK_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /lease-agreements/{id}/allocations, POST /tank-allocations/{id}/activate, POST /movements, POST /movements/{id}/schedule"
  - priority: 9
    category: state
    check: "TerminalResource.status == ACTIVE for schedule"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /movements/{id}/schedule"
  - priority: 10
    category: state
    check: "start requires an existing OPENING GaugeTicket; complete requires an existing CLOSING GaugeTicket"
    error_id: ERR_GAUGE_MISSING
    http_status: 409
    applies_to: "POST /movements/{id}/start, POST /movements/{id}/complete"
  - priority: 11
    category: state
    check: "release-retain requires the movement's CustodyTransfer status == CERTIFIED"
    error_id: ERR_CUSTODY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /quality-samples/{id}/release-retain"
  - priority: 12
    category: state
    check: "Amendment approval requires amendment.base_lease_version == current LeaseAgreement.version (version pinned at proposal)"
    error_id: ERR_AMENDMENT_STALE_BASE
    http_status: 409
    applies_to: "POST /lease-amendments/{id}/approve"
  - priority: 13
    category: business_safety
    check: "Segregation of duties: custody certify X-User-ID must differ from the movement's gauge recorded_by_user_id; sample record-result X-User-ID must differ from collected_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /custody-transfers/{id}/certify, POST /quality-samples/{id}/record-result"
  - priority: 14
    category: business_safety
    check: "Movement start/resume on a VRU_REQUIRED tank requires an APPROVED VAPOR_CONTROL permit for that tank"
    error_id: ERR_VAPOR_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST /movements/{id}/start, POST /movements/{id}/resume"
  - priority: 15
    category: business_safety
    check: "The vapor-control permit's [valid_from, valid_until] must cover the logical clock now (a permit past valid_until is EXPIRED and insufficient)"
    error_id: ERR_PERMIT_WINDOW_INSUFFICIENT
    http_status: 409
    applies_to: "POST /movements/{id}/start, POST /movements/{id}/resume"
  - priority: 16
    category: business_safety
    check: "Custody certify requires a QualitySample for the movement with lab_result == PASSED (PENDING or FAILED rejects)"
    error_id: ERR_QUALITY_NOT_PASSED
    http_status: 409
    applies_to: "POST /custody-transfers/{id}/certify"
  - priority: 17
    category: business_safety
    check: "Sample retain release requires logical clock >= retain_until"
    error_id: ERR_RETAIN_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /quality-samples/{id}/release-retain"
  - priority: 18
    category: business_constraint
    check: "Movement product_grade must equal both the lease's and the tank's product_grade"
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /movements"
  - priority: 19
    category: business_constraint
    check: "Gauge sequence: at most one OPENING and one CLOSING per movement; CLOSING requires an existing OPENING; gauge creation requires movement status in {ARRIVED, IN_PROGRESS} (OPENING) or IN_PROGRESS (CLOSING)"
    error_id: ERR_GAUGE_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /movements/{id}/gauge-tickets"
  - priority: 20
    category: business_constraint
    check: "window_end must be strictly after window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /movements"
  - priority: 21
    category: business_constraint
    check: "Allocation period must satisfy period_end >= period_start and lie within the lease's [start_date, end_date]"
    error_id: ERR_ALLOCATION_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /lease-agreements/{id}/allocations"
  - priority: 22
    category: business_constraint
    check: "Resource type must match mode mapping (VESSEL->DOCK, RAIL->RAIL_RACK, TRUCK->TRUCK_BAY); TerminalResource concurrent_capacity > 1 requires resource_type == TRUCK_BAY"
    error_id: ERR_RESOURCE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /movements/{id}/schedule, POST /terminal-resources"
  - priority: 23
    category: business_constraint
    check: "MonthlyStatement period is unique per lease"
    error_id: ERR_STATEMENT_EXISTS
    http_status: 409
    applies_to: "POST /lease-agreements/{id}/statements"
  - priority: 24
    category: business_temporal
    check: "Resource window occupation: half-open interval conflict for DOCK/RAIL_RACK; aggregate concurrent_capacity for TRUCK_BAY (calculation resource_window_occupation)"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /movements/{id}/schedule"
  - priority: 25
    category: business_temporal
    check: "Movement start rejected when logical clock now > window_end + LATE_GRACE_MINUTES (30 min)"
    error_id: ERR_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /movements/{id}/start"
  - priority: 26
    category: business_temporal
    check: "Statement close requires logical clock >= period_end_exclusive"
    error_id: ERR_STATEMENT_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /monthly-statements/{id}/close"
  - priority: 27
    category: business_fiscal
    check: "Allocation capacity sweep: overlapping allocated sum must be <= tank working_capacity_bbl (calculation allocation_capacity_sweep)"
    error_id: ERR_ALLOCATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lease-agreements/{id}/allocations, POST /tank-allocations/{id}/activate"
  - priority: 28
    category: business_fiscal
    check: "An ACTIVE TankAllocation covering (lease, tank) must exist for movement create/schedule; lease activation requires at least one ACTIVE allocation"
    error_id: ERR_NO_ACTIVE_ALLOCATION
    http_status: 409
    applies_to: "POST /movements, POST /movements/{id}/schedule, POST /lease-agreements/{id}/activate"
  - priority: 29
    category: business_fiscal
    check: "declared_volume_bbl <= allocated_bbl of the ACTIVE allocation covering (lease, tank)"
    error_id: ERR_VOLUME_EXCEEDS_ALLOCATION
    http_status: 422
    applies_to: "POST /movements, POST /movements/{id}/schedule"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/customers", description: "Create a customer", roles: [TerminalManager], code: 201, input: [name, contact_email], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers", description: "List customers", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/customers/{customerId}", description: "Get a customer", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Tank ---
  - { method: POST, path: "/tanks", description: "Create a tank; working_capacity_bbl computed", roles: [TerminalOperator], code: 201, input: [tank_code, product_grade, capacity_bbl, "safe_fill_pct?", "heel_bbl?", "vapor_control_class?"], output: Tank, side_effects: ["working_capacity_bbl computed (tank_working_capacity)", "status = AVAILABLE", "current_inventory_bbl = 0"] }
  - { method: GET, path: "/tanks", description: "List tanks", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["status?", "limit?", "offset?"], output: "Tank[]", side_effects: [] }
  - { method: GET, path: "/tanks/{tankId}", description: "Get a tank", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: Tank, side_effects: [] }
  - { method: POST, path: "/tanks/{tankId}/enter-maintenance", description: "AVAILABLE -> MAINTENANCE", roles: [TerminalOperator], code: 200, input: [], output: Tank, side_effects: ["status -> MAINTENANCE"] }
  - { method: POST, path: "/tanks/{tankId}/return-to-service", description: "MAINTENANCE -> AVAILABLE", roles: [TerminalOperator], code: 200, input: [], output: Tank, side_effects: ["status -> AVAILABLE"] }

  # --- TerminalResource ---
  - { method: POST, path: "/terminal-resources", description: "Create a dock/rail-rack/truck-bay resource", roles: [TerminalOperator], code: 201, input: [resource_code, resource_type, "concurrent_capacity?"], output: TerminalResource, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/terminal-resources", description: "List resources", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["resource_type?", "status?", "limit?", "offset?"], output: "TerminalResource[]", side_effects: [] }
  - { method: GET, path: "/terminal-resources/{resourceId}", description: "Get a resource", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: TerminalResource, side_effects: [] }
  - { method: POST, path: "/terminal-resources/{resourceId}/out-of-service", description: "ACTIVE -> OUT_OF_SERVICE", roles: [TerminalOperator], code: 200, input: [], output: TerminalResource, side_effects: ["status -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/terminal-resources/{resourceId}/return-to-service", description: "OUT_OF_SERVICE -> ACTIVE", roles: [TerminalOperator], code: 200, input: [], output: TerminalResource, side_effects: ["status -> ACTIVE"] }

  # --- LeaseAgreement ---
  - { method: POST, path: "/lease-agreements", description: "Create lease in DRAFT (CustomerRep for own customer_id)", roles: [CustomerRep], code: 201, input: [customer_id, product_grade, committed_capacity_bbl, min_monthly_throughput_bbl, throughput_fee_per_bbl, shortfall_fee_per_bbl, loss_allowance_pct, excess_loss_rate_per_bbl, start_date, end_date], output: LeaseAgreement, side_effects: ["status = DRAFT", "reserved_capacity_bbl = 0"] }
  - { method: GET, path: "/lease-agreements", description: "List leases", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "LeaseAgreement[]", side_effects: ["lazy EXPIRED evaluation per lease row"] }
  - { method: GET, path: "/lease-agreements/{leaseId}", description: "Get a lease", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: LeaseAgreement, side_effects: ["lazy EXPIRED evaluation"] }
  - { method: POST, path: "/lease-agreements/{leaseId}/activate", description: "DRAFT -> ACTIVE; requires >= 1 ACTIVE allocation", roles: [TerminalManager], code: 200, input: [], output: LeaseAgreement, side_effects: ["status -> ACTIVE", "increments LeaseAgreement.version by 1"] }
  - { method: POST, path: "/lease-agreements/{leaseId}/suspend", description: "ACTIVE -> SUSPENDED (reason MANUAL)", roles: [TerminalManager], code: 200, input: [], output: LeaseAgreement, side_effects: ["status -> SUSPENDED", "suspension_reason = MANUAL", "increments LeaseAgreement.version by 1"] }
  - { method: POST, path: "/lease-agreements/{leaseId}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [TerminalManager], code: 200, input: [], output: LeaseAgreement, side_effects: ["status -> ACTIVE", "suspension_reason = null", "increments LeaseAgreement.version by 1"] }
  - { method: POST, path: "/lease-agreements/{leaseId}/terminate", description: "ACTIVE -> TERMINATED; releases allocations", roles: [TerminalManager], code: 200, input: [], output: LeaseAgreement, side_effects: ["status -> TERMINATED", "RESERVED/ACTIVE allocations -> RELEASED", "reserved_capacity_bbl = 0", "increments LeaseAgreement.version by 1"] }

  # --- LeaseAmendment ---
  - { method: POST, path: "/lease-agreements/{id}/amendments", description: "Propose amendment (OCC on lease version; lease must be ACTIVE or SUSPENDED)", roles: [CustomerRep], code: 201, input: [expected_lease_version, "proposed_committed_capacity_bbl?", "proposed_throughput_fee_per_bbl?", "proposed_min_monthly_throughput_bbl?"], output: LeaseAmendment, side_effects: ["base_lease_version = expected_lease_version", "status = PROPOSED", "increments LeaseAgreement.version by 1"] }
  - { method: GET, path: "/lease-agreements/{id}/amendments", description: "List amendments of a lease", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "LeaseAmendment[]", side_effects: [] }
  - { method: POST, path: "/lease-amendments/{amendmentId}/approve", description: "Apply amendment; rejects stale base version", roles: [TerminalManager], code: 200, input: [], output: LeaseAmendment, side_effects: ["status -> APPROVED", "proposed_* fields applied to LeaseAgreement", "increments LeaseAgreement.version by 1"] }
  - { method: POST, path: "/lease-amendments/{amendmentId}/reject", description: "Reject amendment", roles: [TerminalManager], code: 200, input: [], output: LeaseAmendment, side_effects: ["status -> REJECTED"] }

  # --- TankAllocation ---
  - { method: POST, path: "/lease-agreements/{id}/allocations", description: "Create allocation in RESERVED; capacity sweep + period checks", roles: [TerminalOperator], code: 201, input: [tank_id, allocated_bbl, period_start, period_end], output: TankAllocation, side_effects: ["status = RESERVED"] }
  - { method: GET, path: "/lease-agreements/{id}/allocations", description: "List allocations of a lease", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "TankAllocation[]", side_effects: [] }
  - { method: GET, path: "/tanks/{id}/allocations", description: "List allocations of a tank", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "TankAllocation[]", side_effects: [] }
  - { method: GET, path: "/tank-allocations/{allocationId}", description: "Get an allocation", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: TankAllocation, side_effects: [] }
  - { method: POST, path: "/tank-allocations/{allocationId}/activate", description: "RESERVED -> ACTIVE; rechecks capacity sweep", roles: [TerminalOperator], code: 200, input: [], output: TankAllocation, side_effects: ["status -> ACTIVE", "LeaseAgreement.reserved_capacity_bbl recomputed", "increments LeaseAgreement.version by 1"] }
  - { method: POST, path: "/tank-allocations/{allocationId}/release", description: "ACTIVE -> RELEASED (compensating action of activate)", roles: [TerminalOperator], code: 200, input: [], output: TankAllocation, side_effects: ["status -> RELEASED", "LeaseAgreement.reserved_capacity_bbl recomputed", "increments LeaseAgreement.version by 1"] }

  # --- Permit ---
  - { method: POST, path: "/permits", description: "Request a permit (REQUESTED)", roles: [TerminalOperator], code: 201, input: [permit_type, tank_id, valid_from, valid_until], output: Permit, side_effects: ["status = REQUESTED"] }
  - { method: GET, path: "/permits", description: "List permits", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["tank_id?", "permit_type?", "status?", "limit?", "offset?"], output: "Permit[]", side_effects: ["lazy EXPIRED evaluation per permit row"] }
  - { method: GET, path: "/permits/{permitId}", description: "Get a permit", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: Permit, side_effects: ["lazy EXPIRED evaluation"] }
  - { method: POST, path: "/permits/{permitId}/approve", description: "REQUESTED -> APPROVED", roles: [TerminalManager], code: 200, input: [], output: Permit, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/permits/{permitId}/revoke", description: "APPROVED -> REVOKED; suspends in-progress vapor-controlled movements on the tank", roles: [TerminalManager], code: 200, input: ["revoked_reason?"], output: Permit, side_effects: ["status -> REVOKED", "IN_PROGRESS movements on permit.tank_id (VRU_REQUIRED tanks) -> SUSPENDED"] }

  # --- Movement ---
  - { method: POST, path: "/movements", description: "Nominate a receipt/discharge movement (NOMINATED)", roles: [Scheduler], code: 201, input: [lease_id, tank_id, direction, mode, product_grade, declared_volume_bbl, window_start, window_end], output: Movement, side_effects: ["status = NOMINATED", "billing_status = UNBILLED", "sequence_no assigned"] }
  - { method: GET, path: "/movements", description: "List movements", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["lease_id?", "tank_id?", "resource_id?", "status?", "limit?", "offset?"], output: "Movement[]", side_effects: [] }
  - { method: GET, path: "/movements/{movementId}", description: "Get a movement", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: Movement, side_effects: [] }
  - { method: POST, path: "/movements/{movementId}/schedule", description: "NOMINATED -> SCHEDULED with resource assignment and window occupation check", roles: [Scheduler], code: 200, input: [resource_id], output: Movement, side_effects: ["status -> SCHEDULED", "resource_id set", "demurrage_estimated_amount computed (scheduled_estimate variant)"] }
  - { method: POST, path: "/movements/{movementId}/arrive", description: "SCHEDULED -> ARRIVED; stamps actual_arrival_at", roles: [Scheduler], code: 200, input: [], output: Movement, side_effects: ["status -> ARRIVED", "actual_arrival_at = clock now"] }
  - { method: POST, path: "/movements/{movementId}/start", description: "ARRIVED -> IN_PROGRESS; opening gauge + vapor permit + window-lapse gates", roles: [Scheduler], code: 200, input: [], output: Movement, side_effects: ["status -> IN_PROGRESS", "actual_start_at = clock now"] }
  - { method: POST, path: "/movements/{movementId}/complete", description: "IN_PROGRESS -> COMPLETED; requires closing gauge; creates PROVISIONAL custody transfer and actual demurrage", roles: [Scheduler], code: 200, input: [], output: Movement, side_effects: ["status -> COMPLETED", "actual_complete_at = clock now", "demurrage_actual_amount computed (actual_settlement variant)", "CustodyTransfer auto-created PROVISIONAL with provisional_volume_bbl", "Tank.provisional_inventory_bbl recomputed"] }
  - { method: POST, path: "/movements/{movementId}/cancel", description: "NOMINATED|SCHEDULED -> CANCELLED; frees window and runs waitlist promotion", roles: [Scheduler], code: 200, input: [], output: Movement, side_effects: ["status -> CANCELLED", "if was SCHEDULED: window freed; waitlist_promotion_selector runs and may promote a NOMINATED movement to SCHEDULED"] }
  - { method: POST, path: "/movements/{movementId}/resume", description: "SUSPENDED -> IN_PROGRESS; re-checks vapor permit", roles: [Scheduler], code: 200, input: [], output: Movement, side_effects: ["status -> IN_PROGRESS"] }

  # --- GaugeTicket ---
  - { method: POST, path: "/movements/{id}/gauge-tickets", description: "Record OPENING/CLOSING gauge (append-only; recorder pinned from X-User-ID)", roles: [Gauger], code: 201, input: [ticket_type, observed_volume_bbl, observed_temp_f, observed_at], output: GaugeTicket, side_effects: ["recorded_by_user_id = X-User-ID"] }
  - { method: GET, path: "/movements/{id}/gauge-tickets", description: "List gauge tickets of a movement", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "GaugeTicket[]", side_effects: [] }

  # --- QualitySample ---
  - { method: POST, path: "/movements/{id}/samples", description: "Collect a quality sample (movement IN_PROGRESS or COMPLETED); retain_until = created_at + 30d", roles: [QualityInspector], code: 201, input: [sample_type], output: QualitySample, side_effects: ["lab_result = PENDING", "retain_status = RETAINED", "retain_until computed"] }
  - { method: GET, path: "/movements/{id}/samples", description: "List samples of a movement", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "QualitySample[]", side_effects: [] }
  - { method: GET, path: "/quality-samples/{sampleId}", description: "Get a sample", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: QualitySample, side_effects: [] }
  - { method: POST, path: "/quality-samples/{sampleId}/record-result", description: "Record lab result; recorder must differ from collector (SoD)", roles: [QualityInspector], code: 200, input: [lab_result, specific_gravity], output: QualitySample, side_effects: ["lab_result set", "result_recorded_by_user_id = X-User-ID"] }
  - { method: POST, path: "/quality-samples/{sampleId}/release-retain", description: "Release retained sample after certification and retain period", roles: [QualityInspector], code: 200, input: [], output: QualitySample, side_effects: ["retain_status -> RELEASED"] }

  # --- CustodyTransfer ---
  - { method: GET, path: "/movements/{id}/custody-transfers", description: "List custody transfers of a movement (0 or 1)", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "CustodyTransfer[]", side_effects: [] }
  - { method: GET, path: "/custody-transfers/{ctId}", description: "Get a custody transfer", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: CustodyTransfer, side_effects: [] }
  - { method: POST, path: "/custody-transfers/{ctId}/certify", description: "PROVISIONAL -> CERTIFIED; SoD vs gauge recorder; cascades to tank inventory, statement rollup, loss-control suspension", roles: [TerminalManager], code: 200, input: [], output: CustodyTransfer, side_effects: ["certified variant volume + loss fields computed", "Tank.current_inventory_bbl recomputed; tank AVAILABLE<->RESTRICTED re-evaluated", "OPEN MonthlyStatement recomputed", "lease auto-SUSPENDED (LOSS_CONTROL) if statement.total_excess_loss_bbl > 100"] }
  - { method: POST, path: "/custody-transfers/{ctId}/dispute", description: "CERTIFIED -> DISPUTED by owning customer", roles: [CustomerRep], code: 200, input: [], output: CustodyTransfer, side_effects: ["status -> DISPUTED; inventory contribution unchanged"] }
  - { method: POST, path: "/custody-transfers/{ctId}/resolve", description: "DISPUTED -> CERTIFIED", roles: [TerminalManager], code: 200, input: [], output: CustodyTransfer, side_effects: ["status -> CERTIFIED", "OPEN statement recomputed"] }
  - { method: POST, path: "/custody-transfers/{ctId}/void", description: "CERTIFIED|DISPUTED -> VOID; compensating action reversing inventory and statement contributions", roles: [TerminalManager], code: 200, input: [], output: CustodyTransfer, side_effects: ["status -> VOID", "Tank.current_inventory_bbl recomputed (transfer excluded)", "OPEN statement recomputed; lease NOT auto-reactivated"] }

  # --- MonthlyStatement ---
  - { method: POST, path: "/lease-agreements/{id}/statements", description: "Create OPEN statement for a period (unique per lease)", roles: [BillingClerk], code: 201, input: [period], output: MonthlyStatement, side_effects: ["status = OPEN", "period_start/period_end_exclusive derived"] }
  - { method: GET, path: "/lease-agreements/{id}/statements", description: "List statements of a lease", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "MonthlyStatement[]", side_effects: [] }
  - { method: GET, path: "/monthly-statements/{statementId}", description: "Get a statement", roles: [TerminalManager, TerminalOperator, Scheduler, Gauger, QualityInspector, BillingClerk, CustomerRep], code: 200, input: [], output: MonthlyStatement, side_effects: [] }
  - { method: POST, path: "/monthly-statements/{statementId}/close", description: "OPEN -> CLOSED after period end; full charge recompute; movements ACCRUED", roles: [BillingClerk], code: 200, input: [], output: MonthlyStatement, side_effects: ["all charge fields recomputed", "period COMPLETED movements billing_status -> ACCRUED"] }
  - { method: POST, path: "/monthly-statements/{statementId}/invoice", description: "CLOSED -> INVOICED; movements INVOICED", roles: [BillingClerk], code: 200, input: [], output: MonthlyStatement, side_effects: ["status -> INVOICED", "period ACCRUED movements billing_status -> INVOICED"] }

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. The logical clock stamps every entity created_at/updated_at, every Movement actual_arrival_at/actual_start_at/actual_complete_at, and every lazy EXPIRED evaluation."
    roles: [TerminalManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; lazy EXPIRED transitions apply on next access"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "CustomerRep acting on a resource not owned by X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted a segregated step (gauge recorder certifying; sample collector recording result)" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customerId path/body reference does not resolve" }
  - { id: ERR_TANK_NOT_FOUND, http: 404, condition: "tankId path/body reference does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "resourceId path/body reference does not resolve" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "leaseId path/body reference does not resolve" }
  - { id: ERR_AMENDMENT_NOT_FOUND, http: 404, condition: "amendmentId path reference does not resolve" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "allocationId path reference does not resolve" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permitId path reference does not resolve" }
  - { id: ERR_MOVEMENT_NOT_FOUND, http: 404, condition: "movementId path/body reference does not resolve" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "sampleId path reference does not resolve" }
  - { id: ERR_CUSTODY_TRANSFER_NOT_FOUND, http: 404, condition: "ctId path reference does not resolve" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "statementId path reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, malformed value, or no proposed_* field supplied on amendment create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state mismatch or terminal-state transition attempt" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Lease not in a status permitting the operation (DRAFT/SUSPENDED/EXPIRED/TERMINATED as applicable)" }
  - { id: ERR_TANK_NOT_AVAILABLE, http: 409, condition: "Tank in MAINTENANCE or RESTRICTED for allocation/movement operations" }
  - { id: ERR_RESOURCE_UNAVAILABLE, http: 409, condition: "TerminalResource OUT_OF_SERVICE for schedule" }
  - { id: ERR_GAUGE_MISSING, http: 409, condition: "Required OPENING (start) or CLOSING (complete) gauge ticket absent" }
  - { id: ERR_GAUGE_SEQUENCE_INVALID, http: 409, condition: "Duplicate OPENING/CLOSING, CLOSING before OPENING, or gauge outside permitted movement status" }
  - { id: ERR_CUSTODY_NOT_CERTIFIED, http: 409, condition: "Sample retain release attempted before custody certification" }
  - { id: ERR_AMENDMENT_STALE_BASE, http: 409, condition: "Amendment base_lease_version no longer matches current lease version at approval" }
  - { id: ERR_VAPOR_PERMIT_REQUIRED, http: 409, condition: "Start/resume on VRU_REQUIRED tank without an APPROVED VAPOR_CONTROL permit" }
  - { id: ERR_PERMIT_WINDOW_INSUFFICIENT, http: 409, condition: "Approved permit exists but its validity window does not cover the current logical time" }
  - { id: ERR_QUALITY_NOT_PASSED, http: 409, condition: "Certify attempted with sample PENDING or FAILED (or no sample)" }
  - { id: ERR_RETAIN_PERIOD_ACTIVE, http: 409, condition: "Retain release attempted before retain_until" }
  - { id: ERR_PRODUCT_MISMATCH, http: 422, condition: "Movement product_grade differs from lease or tank product_grade" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window_end not strictly after window_start" }
  - { id: ERR_ALLOCATION_PERIOD_INVALID, http: 422, condition: "Allocation period inverted or outside lease [start_date, end_date]" }
  - { id: ERR_RESOURCE_TYPE_MISMATCH, http: 422, condition: "Resource type does not match movement mode; or concurrent_capacity > 1 on non-TRUCK_BAY" }
  - { id: ERR_STATEMENT_EXISTS, http: 409, condition: "MonthlyStatement already exists for (lease, period)" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Requested window collides with existing occupation on the resource (resource_window_occupation)" }
  - { id: ERR_WINDOW_LAPSED, http: 409, condition: "Start attempted after window_end + 30 minute grace" }
  - { id: ERR_STATEMENT_PERIOD_NOT_ENDED, http: 409, condition: "Statement close attempted before period_end_exclusive" }
  - { id: ERR_ALLOCATION_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping allocation sum would exceed tank working_capacity_bbl" }
  - { id: ERR_NO_ACTIVE_ALLOCATION, http: 409, condition: "No ACTIVE allocation covering (lease, tank); or lease activation without any ACTIVE allocation" }
  - { id: ERR_VOLUME_EXCEEDS_ALLOCATION, http: 422, condition: "declared_volume_bbl exceeds the ACTIVE allocation's allocated_bbl" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version does not match current LeaseAgreement.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TerminalManager
    description: "Terminal authority: customers, lease lifecycle, amendment and permit approval, custody certification, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /lease-agreements/{leaseId}/activate|suspend|reactivate|terminate"
      - "POST /lease-amendments/{amendmentId}/approve|reject"
      - "POST /permits/{permitId}/approve|revoke"
      - "POST /custody-transfers/{ctId}/certify|resolve|void"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: TerminalOperator
    description: "Operations superintendent: tanks, terminal resources, tank allocations, permit requests"
    identity: opaque
    exclusive_operations:
      - "POST /tanks and tank maintenance actions"
      - "POST /terminal-resources and resource status actions"
      - "POST /lease-agreements/{leaseId}/allocations"
      - "POST /tank-allocations/{allocationId}/activate|release"
      - "POST /permits"
    shared_operations: ["all GET endpoints"]
  - name: Scheduler
    description: "Movement scheduler/dispatcher: nominates and drives receipt/discharge movements through their lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /movements"
      - "POST /movements/{movementId}/schedule|arrive|start|complete|cancel|resume"
    shared_operations: ["all GET endpoints"]
  - name: Gauger
    description: "Independent gauger: records opening/closing gauge tickets; barred from certifying custody of own gauges (SoD)"
    identity: opaque
    exclusive_operations: ["POST /movements/{movementId}/gauge-tickets"]
    shared_operations: ["all GET endpoints"]
  - name: QualityInspector
    description: "Lab/quality inspector: collects samples, records lab results, releases retains; collector cannot record own result (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /movements/{movementId}/samples"
      - "POST /quality-samples/{sampleId}/record-result"
      - "POST /quality-samples/{sampleId}/release-retain"
    shared_operations: ["all GET endpoints"]
  - name: BillingClerk
    description: "Billing: monthly statement creation, close, invoice"
    identity: opaque
    exclusive_operations:
      - "POST /lease-agreements/{leaseId}/statements"
      - "POST /monthly-statements/{statementId}/close|invoice"
    shared_operations: ["all GET endpoints"]
  - name: CustomerRep
    description: "Customer representative acting as their Customer entity; creates leases and amendments, disputes custody transfers"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /lease-agreements"
      - "POST /lease-agreements/{leaseId}/amendments"
      - "POST /custody-transfers/{ctId}/dispute"
    shared_operations: ["all GET endpoints"]
