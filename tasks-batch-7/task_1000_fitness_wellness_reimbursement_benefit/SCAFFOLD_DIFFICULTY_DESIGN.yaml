      - name: filing_deadline_day_90
        grounds:
          - validations[priority=6]
          - errors[ERR_CLAIM_FILING_DEADLINE]
        distinguishing_aspect: |
          Boundary on the days-since-service metric via the claim-create endpoint: with the clock
          at 2026-05-10, service_date 2026-02-09 is exactly 90 days old and accepted; 2026-02-08
          is 91 days old and rejected.
        test_recipe:
          setup: ["Standard fixture; logical clock advanced to 2026-05-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
