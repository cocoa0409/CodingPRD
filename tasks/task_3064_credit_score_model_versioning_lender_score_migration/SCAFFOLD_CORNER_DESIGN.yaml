            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-active", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-rs-1", age_years: 39, is_protected_class: false}, as: FairLendingOfficer, captures: {c: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs: $.data.id}}
            - {call: "GET /reference-sets/${rs}", payload: {}, as: FairLendingOfficer, captures: {rsv0: $.data.version}}
            - {call: "POST /reference-sets/${rs}/attach-reason-code", payload: {reason_code_id: "${rc}", expected_reference_set_version: "${rsv0}"}, as: FairLendingOfficer}
          trigger:
            - {call: "GET /reference-sets/${rs}", payload: {}, as: FairLendingOfficer, captures: {rsv1: $.data.version, rs_st: $.data.status}}
            - {call: "POST /reference-sets/${rs}/reconcile", payload: {expected_reference_set_version: "${rsv1}"}, as: FairLendingOfficer, captures: {err: $.data.error_id}}
            - {call: "POST /reference-sets/${rs}/detach-reason-code", payload: {expected_reference_set_version: "${rsv1}"}, as: FairLendingOfficer, captures: {det_st: $.data.status, rc_after: $.data.reason_code_id}}
          assert:
            - "data.rs_st == \"BOUND\" before the reconcile attempt"
            - "the reconcile returns 409 with data.err == \"ERR_REASON_CODE_ACTIVE\""
            - "the detach returns 200 with data.det_st == \"COMPILED\" and data.rc_after null — the declared alternative out-edge from BOUND"

  # ===========================================================================
  - section: calculations
    instances:

      - name: recalibration_variants_agree_when_the_curves_are_identical
        claim_type: Variant Selection
        grounds:
          - calculations.cutoff_recalibration
          - entities.ScoreVariant.fields.double_odds_points
        distinguishing_aspect: "Where source and target share ref_score, base_odds and double_odds_points the two recalibration variants collapse to the same integer cutoff, so cutoff_disagreement_points is exactly 0 — the selection of variant is observable through the disagreement field."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "M2 (PRIME-SHIFT-V2) in DEVELOPMENT with a released AUTO variant carrying the identical curve, so the two recalibration variants must agree."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v2: $.data.id}}
            - {call: "POST /score-variants/${v2}/release", payload: {}, as: ModelDeveloper}
          trigger:
            - {call: "POST /migration-events", payload: {lender_code: "LEND-IDENT", from_score_variant_id: "${v1}", to_score_variant_id: "${v2}", event_type: "RECALIBRATED", evidence_ref: "WS-IDENT-1", old_cutoff_score: 640}, as: ComplianceOfficer, captures: {sp: $.data.new_cutoff_score_preserving, op: $.data.new_cutoff_odds_preserving, dis: $.data.cutoff_disagreement_points}}
          assert:
            - "data.sp == 640 && data.op == 640 — both variants hold the old cutoff when the curves match"
            - "data.dis == 0, so the disagreement diagnostic reports agreement rather than being omitted"

      - name: composite_score_over_an_empty_capture_returns_zero
        claim_type: Input Set Filtering
        grounds:
          - calculations.composite_score
          - endpoints.POST_/validation-studies/{studyId}/run
        distinguishing_aspect: "With no postings on the study's model the captured set is empty, so both composite variants return 0 and reconciliation_variance is 0 rather than a divide-by-zero."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant and a FILED MODEL_RISK_REPORT; one VALIDATION-kind archive sample for M1; no licence and therefore no postings."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "XFER-EMPTY", record_count: 3000, segment_name: "PRIME", sample_kind: "VALIDATION", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s: $.data.id}}
            - {call: "POST /validation-studies", payload: {score_model_id: "${m1}", sample_id: "${s}", study_path: "CROSS_BUREAU", performed_by: "va-empty"}, as: ValidationAnalyst, captures: {study: $.data.id}}
          trigger:
            - {call: "GET /validation-studies/${study}", payload: {}, as: ValidationAnalyst, captures: {studv: $.data.version}}
            - {call: "POST /validation-studies/${study}/run", payload: {expected_study_version: "${studv}"}, as: ValidationAnalyst, captures: {wc: $.data.weighted_composite, uc: $.data.unweighted_composite, rv: $.data.reconciliation_variance, run_st: $.data.status}}
          assert:
            - "data.run_st == \"VALIDATION_COMPLETE\" and the study did not fail on an empty capture"
            - "data.wc == 0.0 && data.uc == 0.0 && data.rv == 0.0"
            - "GET /score-results with no filter reports total_count == 0, confirming the capture really was empty"

      - name: disparate_impact_ratio_reports_the_pinned_parts_per_million_value
        claim_type: Correct Result
        grounds:
          - calculations.disparate_impact_ratio
          - endpoints.POST_/validation-studies/{studyId}/run
          - entities.ValidationStudy.fields.disparate_impact_ratio_ppm
        distinguishing_aspect: "Six approvals and four declines among protected-class postings against eighteen approvals and two declines among the rest gives 666667 ppm, so the pinned integer is observable and the partition is taken over the model's postings rather than over a single consumer."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; one ACTIVE PRIMARY reason code; one DEVELOPMENT-kind sample for M1; one PROTECTED_CLASS study."
            - "Postings on M1 partition 6 approve / 4 decline for protected-class consumers and 18 approve / 2 decline for the rest, so the protected rate is 0.6 and the comparison rate is 0.9."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-di", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-di-P", age_years: 34, is_protected_class: true}, as: FairLendingOfficer, captures: {cp: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-di-Q", age_years: 45, is_protected_class: false}, as: FairLendingOfficer, captures: {cq: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_3", entitled_count: 5000, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-DI", record_count: 6000, segment_name: "PRIME", sample_kind: "DEVELOPMENT", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s: $.data.id}}
            - {call: "POST /validation-studies", payload: {score_model_id: "${m1}", sample_id: "${s}", study_path: "PROTECTED_CLASS", performed_by: "va-di"}, as: ValidationAnalyst, captures: {study: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${cp}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {pk1: $.data.decision}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${cp}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 714, expected_license_version: "${licv2}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {pk2: $.data.decision}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv3: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${cq}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${licv3}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {qk1: $.data.decision}}
          trigger:
            - {call: "GET /validation-studies/${study}", payload: {}, as: ValidationAnalyst, captures: {studv: $.data.version}}
            - {call: "POST /validation-studies/${study}/run", payload: {expected_study_version: "${studv}"}, as: ValidationAnalyst, captures: {ppm: $.data.disparate_impact_ratio_ppm, rv: $.data.reconciliation_variance}}
          assert:
            - "the fixture's three postings return data.pk1 == \"APPROVE\" (raw 716 -> effective 701) and data.pk2 == \"DECLINE\" (raw 714 -> effective 699) and data.qk1 == \"APPROVE\""
            - "with the protected rate at 0.6 and the comparison rate at 0.9 the pinned ratio is round_half_up(0.6 / 0.9 * 1000000, 0) == 666667, so data.ppm == 666667 when the fixture is scaled to 6/4 and 18/2"
            - "data.rv is null, because the PROTECTED_CLASS path leaves the cross-bureau diagnostic unset while the CROSS_BUREAU path leaves disparate_impact_ratio_ppm unset"

      - name: score_effective_odds_carry_four_decimal_places
        claim_type: Precision
        grounds:
          - calculations.score_effective_and_odds
          - entities.ScoreResult.fields.odds_at_posted_score
        distinguishing_aspect: "The odds field is pinned at four decimal places with round_half_up: at a score of 700 on the CREDIT-DUAL-V1 AUTO curve the value is 28.2843, so the declared precision is observable rather than incidental."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE licence; consumer 'cons-prec'."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-prec", age_years: 31, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
          trigger:
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr: $.data.id, odds: $.data.odds_at_posted_score, eff: $.data.effective_score}}
          assert:
            - "data.eff == 700, so the odds are read at the effective rather than the raw score"
            - "data.odds == 28.2843 — round_half_up(18.0 * 2 ** ((700 - 700) / 35) + 1.0 + (700 / 700), 4)"
            - "the stored row read back through GET /score-results/${sr} carries the same four-decimal value"

      - name: bubble_up_weight_reaches_only_the_immediate_parent
        claim_type: Constants Applied
        grounds:
          - calculations.composite_reason_code
          - entities.ReasonCode.fields.weight_received_pct
          - entities.ReasonCode.fields.weight_effective_pct
        distinguishing_aspect: "The 0.05 bubble-up floor is applied one hop only: an archived grandchild below the floor routes its weight to its immediate parent and not to the grandparent, and a sibling above the floor routes nothing."
        test_recipe:
          setup:
            - "One DEVELOPMENT model M1 carrying a released AUTO variant; three reason codes forming a three-level tree on it — root 'A' at weight 0.20 with parent null, middle 'B' at weight 0.20 with parent A, leaf 'C' at weight 0.03 with parent B, and a sibling leaf 'D' at weight 0.30 with parent B."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "PRIMARY", trigger_feature_code: "A-ROOT", code_label: "rc-a", weight_pct: 0.20}, as: ReasonCodeAdministrator, captures: {rc_a: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "SECONDARY", trigger_feature_code: "B-MID", code_label: "rc-b", weight_pct: 0.20, parent_reason_code_id: "${rc_a}"}, as: ReasonCodeAdministrator, captures: {rc_b: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "TERTIARY", trigger_feature_code: "C-LEAF", code_label: "rc-c", weight_pct: 0.03, parent_reason_code_id: "${rc_b}"}, as: ReasonCodeAdministrator, captures: {rc_c: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "TERTIARY", trigger_feature_code: "D-LEAF", code_label: "rc-d", weight_pct: 0.30, parent_reason_code_id: "${rc_b}"}, as: ReasonCodeAdministrator, captures: {rc_d: $.data.id}}
          trigger:
            - {call: "POST /reason-codes/${rc_c}/archive", payload: {}, as: ReasonCodeAdministrator, captures: {b_recv: $.data.weight_received_pct}}
            - {call: "GET /reason-codes/${rc_b}", payload: {}, as: ReasonCodeAdministrator, captures: {b_weight: $.data.weight_received_pct, b_eff: $.data.weight_effective_pct}}
            - {call: "GET /reason-codes/${rc_a}", payload: {}, as: ReasonCodeAdministrator, captures: {a_weight: $.data.weight_received_pct}}
          assert:
            - "the archive response carries data.b_recv == 0.03, so the routed share lands on the immediate parent"
            - "data.b_weight == 0.03 && data.b_eff == 0.23 — the effective weight is weight_pct plus the received share, rounded to 4 decimals"
            - "data.a_weight == 0, so routing is one hop and the grandparent receives nothing"
            - "the sibling D at weight 0.30 is above the 0.05 floor and never leaves ACTIVE, so it routes nothing either way"

# ===========================================================================
  - section: validations
    instances:

      - name: validation_returns_unauthenticated_without_a_role_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request naming a role that §1.7 does not declare is rejected at priority 1 with 401 ERR_UNAUTHENTICATED before any existence or state work runs."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "AUTH-V1", min_input_count: 100}, as: UnknownRole, captures: {err: $.data.error_id}}
          assert:
            - "the response status is 401 and data.err == \"ERR_UNAUTHENTICATED\""
            - "GET /score-models with no filter reports total_count == 0"

      - name: validation_returns_unauthorized_for_a_role_outside_the_endpoint_list
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.ModelDeveloper
        distinguishing_aspect: "A ModelDeveloper calling a BureauAdministrator-exclusive endpoint is rejected at priority 2 with 403 ERR_UNAUTHORIZED, which is a different error from the unauthenticated case."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "POST /bureaus", payload: {bureau_code: "EXP", display_name: "Experian"}, as: ModelDeveloper, captures: {err: $.data.error_id}}
          assert:
