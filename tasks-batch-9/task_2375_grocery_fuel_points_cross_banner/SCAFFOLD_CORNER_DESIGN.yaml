            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 99, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { min_err: $.data.error_id }
            - call: "POST /fuel-redemptions"
