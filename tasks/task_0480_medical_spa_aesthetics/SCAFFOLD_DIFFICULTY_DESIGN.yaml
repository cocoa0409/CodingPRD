              as: Provider
              as_user_id: "${ci_inj}"
              captures: { ci_plan_v1: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${ci_plan}", standing_order_id: "${ci_so}", injector_provider_id: "${ci_inj}", injectable_lot_id: "${ci_lot}", planned_units: 30, loyalty_points_redeemed: 0, expected_treatment_plan_version: "${ci_plan_v1}" }
              as: Provider
