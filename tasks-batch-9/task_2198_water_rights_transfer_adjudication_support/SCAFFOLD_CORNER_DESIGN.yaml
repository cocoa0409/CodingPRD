          assert:
            - "Activate: HTTP 200, response_type 'object', and the data block is a complete WaterRight — status ACTIVE, refreshed forfeiture_risk_score / forfeiture_risk_band / consecutive_nonuse_years, all four ledger buckets and an incremented version — not a partial patch document."
            - "Study creation: HTTP 201 (a new row), status DRAFT; certify: HTTP 200 returning the full HcuStudy with status CERTIFIED, certified_hcu_af 195.00 and certified_by_user_id set."
            - "Deposit: HTTP 200 and the data block is the WaterBankAccount (deposited_credit_af 90.00, available_credit_af 90.00, posture OPEN), NOT a deposit resource — the API declares no deposit entity and returns no deposit id."
