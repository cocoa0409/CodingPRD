            - "RepairAuthorization.${rep}.lessee_preauthorized == false (reset by revise)"
            - "RepairAuthorization.${rep}.status == APPROVED (approve succeeds without preauthorization)"

      - name: statement_dispute_recompute_cycle
        grounds:
          - state_machines.CarHireStatement.PROVISIONAL_to_DISPUTED
          - state_machines.CarHireStatement.DISPUTED_to_PROVISIONAL
          - state_machines.CarHireStatement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          CarHireStatement cycles PROVISIONAL -> DISPUTED -> PROVISIONAL before FINALIZED; the
          lessee balance stays 0 through the whole loop and moves only at finalize (224000).
        test_recipe:
          setup:
            - "Tariffs 9000/55; lessee limit 10000000; FULL_SERVICE lease ACTIVE; car GATX7003 delivered 2026-08-01 for 2026-08-01..2026-12-31"
            - "August report loaded 1000 empty 200 validated as-is; statement generated (provisional net 224000)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 10000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX7003", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /mileage-reports", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", report_month: "2026-08", loaded_miles: 1000, empty_miles: 200 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id" } }
            - { call: "POST /mileage-reports/${rep}/validate", payload: {}, as: BillingAnalyst }
            - { call: "POST /car-hire-statements/generate", payload: { statement_month: "2026-08" }, as: BillingAnalyst, captures: { stmt: "$.data[0].id" } }
          trigger:
            - { call: "POST /car-hire-statements/${stmt}/dispute", payload: { dispute_reason: "mileage mismatch claim" }, as: LesseeRep, as_user_id: "${les}" }
            - { call: "GET /lessees/${les}", payload: {}, as: BillingAnalyst, captures: { bal_loop: "$.data.outstanding_balance_cents" } }
            - { call: "POST /car-hire-statements/${stmt}/recompute", payload: {}, as: BillingAnalyst }
            - { call: "POST /car-hire-statements/${stmt}/finalize", payload: {}, as: BillingAnalyst }
          assert:
            - "dispute moves CarHireStatement.${stmt}.status to DISPUTED; recompute returns it to PROVISIONAL (cycle)"
            - "Lessee.${les}.outstanding_balance_cents == 0 throughout the dispute loop"
            - "after recompute: provisional_net_cents == 224000 (279000 - 1000 x 55, unchanged inputs)"
            - "after finalize: status == FINALIZED, final_net_cents == 224000, Lessee balance == 224000"

  - rule_id: transitive_cascade
    instances:
      - name: directive_promote_two_hop_cascade
        grounds:
          - state_machines.ComplianceDirective.ANNOUNCED_to_EFFECTIVE
          - state_machines.LeaseAssignment.SCHEDULED_to_CANCELLED
          - entities.Railcar.fields.compliance_posture
        distinguishing_aspect: |
          Depth-2 chained cascade from the promote trigger: directive promote mutates
          Railcar.compliance_posture (hop 1), and that posture flip itself cancels every
          SCHEDULED assignment on the car (hop 2) — the assignment cancellation is caused by
          the posture change, not directly by the promote call.
        test_recipe:
          setup:
            - "TANK_GENERAL tariffs 12000/60 for 2026-01-01..2027-01-01; lessee; FULL_SERVICE lease ACTIVE 2026-08-01..2027-07-31"
            - "Tank car GATX8001 (built 2018) assigned CRUDE_OIL 2026-08-10..2026-09-10 (SCHEDULED)"
            - "Directive DOT-117R ANNOUNCED covering TANK_GENERAL (posture already RETROFIT_DUE)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "TANK_GENERAL", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 12000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "TANK_GENERAL", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 60 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "PetroTrans", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX8001", car_type: "TANK_GENERAL", built_year: 2018 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 6000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "CRUDE_OIL", scheduled_start: "2026-08-10", scheduled_end: "2026-09-10" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /compliance-directives", payload: { directive_code: "DOT-117R", description: "Tank car retrofit", applies_to_car_types: ["TANK_GENERAL"], retrofit_deadline: "2026-12-31", grace_days: 30, daily_penalty_cents: 25000, penalty_cap_cents: 500000 }, as: ComplianceOfficer, captures: { dir: "$.data.id" } }
          trigger:
            - { call: "POST /compliance-directives/${dir}/promote", payload: {}, as: ComplianceOfficer }
          assert:
            - "ComplianceDirective.${dir}.status == EFFECTIVE and effective_date == 2026-08-01 (default logical clock)"
            - "Railcar.${car}.compliance_posture == NON_COMPLIANT (hop 1: promoted directive, no CERTIFIED retrofit)"
            - "LeaseAssignment.${asg}.status == CANCELLED and cancellation_reason == DIRECTIVE_EFFECTIVE (hop 2: caused by hop-1 posture flip)"

      - name: statement_finalize_three_hop_suspension_cascade
        grounds:
          - state_machines.CarHireStatement.PROVISIONAL_to_FINALIZED
          - state_machines.Lessee.ACTIVE_to_SUSPENDED
          - entities.Lessee.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-3 chained cascade from the finalize trigger (different trigger than promote):
          finalize settles the statement (hop 1), the settlement debits Lessee.
          outstanding_balance_cents (hop 2), and that balance mutation itself flips the Lessee
          to SUSPENDED because 224000 > credit_limit 200000 (hop 3).
        test_recipe:
          setup:
            - "Tariffs 9000/55; lessee credit_limit 200000; FULL_SERVICE lease ACTIVE; car GATX8002 delivered 2026-08-01 for 2026-08-01..2026-12-31"
            - "August report loaded 1000 empty 200 validated; statement generated PROVISIONAL (net 224000)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "ThinCredit LLC", credit_tier: "TIER_C", credit_limit_cents: 200000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX8002", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /mileage-reports", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", report_month: "2026-08", loaded_miles: 1000, empty_miles: 200 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id" } }
            - { call: "POST /mileage-reports/${rep}/validate", payload: {}, as: BillingAnalyst }
            - { call: "POST /car-hire-statements/generate", payload: { statement_month: "2026-08" }, as: BillingAnalyst, captures: { stmt: "$.data[0].id" } }
          trigger:
            - { call: "POST /car-hire-statements/${stmt}/finalize", payload: {}, as: BillingAnalyst }
            - { call: "GET /lessees/${les}", payload: {}, as: BillingAnalyst }
          assert:
            - "CarHireStatement.${stmt}.status == FINALIZED and final_net_cents == 224000 (hop 1)"
            - "Lessee.${les}.outstanding_balance_cents == 224000 (hop 2)"
            - "Lessee.${les}.status == SUSPENDED (hop 3: 224000 > credit_limit 200000, fired by the balance mutation)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_error_beats_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_ASSIGNMENT_NOT_RETURNED]
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: settle is called while the assignment is
          still ON_LEASE (state violation, priority 7) AND an INVOICED-unpaid assessment exists
          (fiscal violation, priority 12); the state error ERR_ASSIGNMENT_NOT_RETURNED must win.
        test_recipe:
          setup:
            - "Tariffs 9000/55; lessee limit 100000000; lease ACTIVE; car GATX9001 delivered 2026-08-01 (assignment still ON_LEASE)"
            - "Damage assessment on the assignment submitted, finalized, invoiced (INVOICED, unpaid: lessee_liable 17250)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9001", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /damage-assessments", payload: { lease_assignment_id: "${asg}", railcar_id: "${car}" }, as: MaintenanceController, captures: { da: "$.data.id" } }
            - { call: "POST /damage-assessments/${da}/submit", payload: { line_items: [ { component: "GRAB_IRON", severity: "MINOR", cause: "LESSEE_DAMAGE", parts_cents: 10000, labor_hours: 0.5, replaced: false } ] }, as: MaintenanceController }
            - { call: "POST /damage-assessments/${da}/finalize", payload: {}, as: MaintenanceController }
            - { call: "POST /damage-assessments/${da}/invoice", payload: {}, as: BillingAnalyst }
          trigger:
            - { call: "POST /lease-assignments/${asg}/settle", payload: {}, as: BillingAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "settle returns 409 with error_id == ERR_ASSIGNMENT_NOT_RETURNED (state, priority 7), not ERR_OUTSTANDING_BALANCE (fiscal, priority 12)"
            - "LeaseAssignment.${asg}.status remains ON_LEASE"
      - name: assignment_safety_error_beats_temporal_error
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_AGE_LIMIT_EXCEEDED]
          - errors[ERR_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair than the other
          instance): the request violates the age limit (car_age_years 50 >= 50, priority 8)
          AND overlaps an existing assignment window (priority 10); ERR_AGE_LIMIT_EXCEEDED wins.
        test_recipe:
          setup:
            - "At logical 2025-06-01: tariffs 9000/55 covering 2025-01-01..2027-01-01; lease ACTIVE 2025-06-01..2027-05-31"
            - "Car GATX9002 built 1976 (age 49 in 2025): assignment 2026-08-10..2026-08-20 created successfully"
            - "Logical clock advanced to 2026-08-01: car_age_years becomes 50"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-06-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2025-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2025-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9002", car_type: "COVERED_HOPPER", built_year: 1976 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2025-06-01", end_date: "2027-05-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-10", scheduled_end: "2026-08-20" }, as: FleetPlanner, captures: { asg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-15", scheduled_end: "2026-08-25" }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "create returns 422 with error_id == ERR_AGE_LIMIT_EXCEEDED (safety, priority 8), not ERR_ASSIGNMENT_OVERLAP (temporal, priority 10)"
            - "Railcar.${car}.car_age_years == 50 (trigger uses >=, so exactly 50 fails)"
            - "LeaseAssignment.${asg1}.status remains SCHEDULED"

  - rule_id: boundary_precision_check
    instances:
      - name: assignment_age_boundary_49_vs_50
        grounds:
          - validations[priority=8]
          - entities.Railcar.fields.car_age_years
          - errors[ERR_AGE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric car_age_years via POST /lease-assignments: the limit is >= 50, so a car built
          1977 (age 49 at the 2026 clock) is assignable while a car built 1976 (age exactly 50)
          is rejected — the boundary itself is the failing value.
        test_recipe:
          setup:
            - "Default clock 2026-08-01; tariffs 9000/55 (2026-01-01..2027-01-01); lessee; lease ACTIVE 2026-08-01..2027-07-31"
            - "Car GATX9101 built 1977 (age 49) and car GATX9102 built 1976 (age 50), both AVAILABLE"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9101", car_type: "COVERED_HOPPER", built_year: 1977 }, as: FleetPlanner, captures: { c49: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9102", car_type: "COVERED_HOPPER", built_year: 1976 }, as: FleetPlanner, captures: { c50: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${c49}", planned_commodity: "GRAIN", scheduled_start: "2026-08-05", scheduled_end: "2026-08-15" }, as: FleetPlanner, captures: { ok_asg: "$.data.id" } }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${c50}", planned_commodity: "GRAIN", scheduled_start: "2026-08-05", scheduled_end: "2026-08-15" }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "age-49 car: assignment created (201), status SCHEDULED"
            - "age-50 car: 422 with error_id == ERR_AGE_LIMIT_EXCEEDED (boundary value 50 fails because the rule is >= 50, not > 50)"

      - name: mileage_tier_exact_threshold_vs_beyond
        grounds:
          - calculations.calc_mileage_credit
          - entities.CarHireStatement.fields.tier_excess_miles
        distinguishing_aspect: |
          Metric cumulative lease-year loaded miles via POST /car-hire-statements/generate:
          reaching exactly 120000 validated miles leaves tier_excess_miles == 0 (threshold is
          strict "beyond"), while the NEXT mile prices at the 80% excess rate (credit 44 for
          1 excess mile at rate 55).
        test_recipe:
          setup:
            - "Clock 2026-07-01; tariffs 9000/55; lease ACTIVE 2026-07-01..2027-06-30; car GATX9103 delivered 2026-07-01 for 2026-07-01..2026-12-31"
            - "July report loaded 119000 empty 0 validated; August report loaded 1000 empty 0 validated (cumulative exactly 120000)"
