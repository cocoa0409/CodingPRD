# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0464_scuba_dive_certification — Expert
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.6. Every setup_api_calls chain drives empty-DB -> setup.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rental_charge_estimated_vs_actual_diverge
        grounds:
          - calculations.rental_charge
          - entities.RentalAgreement.fields.estimated_cost_cents
          - entities.RentalAgreement.fields.actual_cost_cents
          - state_machines.RentalAgreement.ACTIVE_to_RETURNED
        distinguishing_aspect: |
          Same RentalAgreement, two variants on different ledger fields: the
          estimated (forward-looking on scheduled_return_at) charge is 9000 at
          checkout while the actual (chronological on actual_return_at, with
          1.5x late surcharge) charge is 22500 at check-in — a non-zero delta
          on the RentalAgreement entity domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-10T09:00:00Z. One Diver. A rental checked out for a 2-day window (planned return 2026-06-12T09:00:00Z) at daily_rate 4500, deposit 20000."
            - "Diver returns the gear late at 2026-06-13T15:00:00Z (3 days 6 hours after checkout)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /divers"
              payload: { full_name: "Rita Renter", email: "rita@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { diver_id: "${diver_id}", item_description: "BCD + reg set", daily_rate_cents: 4500, deposit_cents: 20000, scheduled_return_at: "2026-06-12T09:00:00Z" }
              as: ShopAdmin
              captures: { rental_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T15:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /rental-agreements/${rental_id}/checkin"
              payload: {}
              as: ShopAdmin
              captures: { actual: $.data.actual_cost_cents }
          assert:
            - "RentalAgreement.${rental_id}.estimated_cost_cents == 9000"
            - "RentalAgreement.${rental_id}.actual_cost_cents == 22500"
            - "RentalAgreement.${rental_id}.actual_cost_cents != RentalAgreement.${rental_id}.estimated_cost_cents"

      - name: trip_total_solo_vs_group_diverge
        grounds:
          - calculations.trip_booking_total
          - entities.TripBooking.fields.total_cents
          - entities.TripBooking.fields.party_size
        distinguishing_aspect: |
          On the TripBooking entity domain, two valid variants of the same
          fare formula diverge: a solo booking (party_size=1) totals 15000
          while an identical group booking (party_size=4) totals 12750 after
          the 15% group discount — a different entity domain from the rental
          dual-variant above.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. A Boat (capacity 10). One OPEN_WATER DiveTrip on it (base_fare 12000, fill_addon 1500, min_cert_level OPEN_WATER)."
            - "Two OPEN_WATER-certified divers with active waivers: one books solo (party_size 1, 2 tanks), one books as a group of 4 (party_size 4, 2 tanks)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /boats"
              payload: { name: "Sea Star", capacity: 10 }
              as: ShopAdmin
              captures: { boat_id: $.data.id }
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-06-20T08:00:00Z", ends_at: "2026-06-20T12:00:00Z", min_cert_level: "OPEN_WATER", base_fare_cents: 12000, fill_addon_cents: 1500 }
              as: ShopAdmin
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Solo Sam", email: "sam@x.com" }
              as: ShopAdmin
              captures: { d_solo: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Group Gail", email: "gail@x.com" }
              as: ShopAdmin
              captures: { d_grp: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${d_solo}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /waivers"
              payload: { diver_id: "${d_grp}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Ivy Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-05T08:00:00Z", ends_at: "2026-06-05T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${d_solo}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_solo: $.data.id }
            - call: "POST /enrollments/${enr_solo}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_solo}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_solo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_solo}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /enrollments/${enr_solo}/recompute-eligibility"
              payload: {}
              as: ShopAdmin
              captures: { enr_solo_v: $.data.version }
            - call: "POST /enrollments/${enr_solo}/issue-certification"
              payload: { expected_enrollment_version: "${enr_solo_v}" }
              as: ShopAdmin
          trigger:
            - call: "POST /trip-bookings"
              payload: { trip_id: "${trip_id}", diver_id: "${d_solo}", tanks: 2, party_size: 1, expected_trip_version: "${trip_v}" }
              as: ShopAdmin
              captures: { tb_solo: $.data.id, total_solo: $.data.total_cents, trip_v2: $.data.version }
            - call: "POST /trip-bookings"
              payload: { trip_id: "${trip_id}", diver_id: "${d_grp}", tanks: 2, party_size: 4, expected_trip_version: "${trip_v2}" }
              as: ShopAdmin
              captures: { tb_grp: $.data.id, total_grp: $.data.total_cents }
          assert:
            - "TripBooking.${tb_solo}.total_cents == 15000"
            - "TripBooking.${tb_grp}.total_cents == 12750"
            - "TripBooking.${tb_solo}.total_cents != TripBooking.${tb_grp}.total_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fill_price_tiered_three_inputs_mode_a
        grounds:
          - calculations.fill_price
          - entities.FillService.fields.price_cents
          - entities.FillService.fields.o2_pct
          - entities.FillService.fields.tank_capacity_liters
        distinguishing_aspect: |
          Mode (a): non-linear formula with 3 inputs (gas, o2_pct, tank_capacity_liters)
          — the o2_pct tier selection (<=32 / <=36 / 37..40) interacts
          multiplicatively with the large-tank factor (>12L => x1.25). A 36%
          fill in a 15L tank prices at round_half_up((1200+1400)*1.25) = 3250.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. One nitrox-certified Diver (holds an ENRICHED_AIR certification card)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /divers"
              payload: { full_name: "Nina Nitrox", email: "nina@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "Nitrox Specialty (OW)", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 30000, grants_specialty: "ENRICHED_AIR" }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ed Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_id}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /enrollments/${enr_id}/recompute-eligibility"
              payload: {}
              as: ShopAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/issue-certification"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ShopAdmin
          trigger:
            - call: "POST /fill-services"
              payload: { diver_id: "${diver_id}", gas: "NITROX", o2_pct: 36, tank_capacity_liters: 15 }
              as: ShopAdmin
              captures: { fill_id: $.data.id, price: $.data.price_cents }
          assert:
            - "FillService.${fill_id}.price_cents == 3250"

      - name: trip_total_round_after_discount_mode_b
        grounds:
          - calculations.trip_booking_total
          - entities.TripBooking.fields.total_cents
          - entities.TripBooking.fields.deposit_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — the 15% discount is applied to
          the SUMMED subtotal (base_fare + tanks*fill_addon) and the result is
          rounded ONCE, not per line item. With base 12000, 2 tanks @ 1500,
          party 4: round_half_up(15000*0.85)=12750, deposit round_half_up(12750*0.30)=3825.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. A Boat (capacity 10), an OPEN_WATER DiveTrip (base_fare 12000, fill_addon 1500). One OPEN_WATER-certified diver with active waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /boats"
              payload: { name: "Reef Runner", capacity: 10 }
              as: ShopAdmin
              captures: { boat_id: $.data.id }
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-06-22T08:00:00Z", ends_at: "2026-06-22T12:00:00Z", min_cert_level: "OPEN_WATER", base_fare_cents: 12000, fill_addon_cents: 1500 }
              as: ShopAdmin
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Pat Party", email: "pat@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Iris Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_id}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /enrollments/${enr_id}/recompute-eligibility"
              payload: {}
              as: ShopAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/issue-certification"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ShopAdmin
          trigger:
            - call: "POST /trip-bookings"
              payload: { trip_id: "${trip_id}", diver_id: "${diver_id}", tanks: 2, party_size: 4, expected_trip_version: "${trip_v}" }
              as: ShopAdmin
              captures: { tb_id: $.data.id }
          assert:
            - "TripBooking.${tb_id}.total_cents == 12750"
            - "TripBooking.${tb_id}.deposit_cents == 3825"
            - "TripBooking.${tb_id}.balance_due_cents == 8925"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_active_eligible_revert_cycle
        grounds:
          - state_machines.Enrollment.ACTIVE_to_ELIGIBLE
          - state_machines.Enrollment.ELIGIBLE_to_ACTIVE
          - state_machines.Session.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Cycle on the Enrollment entity: ACTIVE -> ELIGIBLE (all prerequisites
          met) then ELIGIBLE -> ACTIVE when the qualifying session is cancelled
          and the attendance prerequisite no longer holds — a genuine A->B->A
          loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. ADVANCED course (required_pool 0, required_ow 1). A diver with active waiver, e-learning 100, and one ATTENDED OW session -> enrollment is ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "Adv Cert", course_type: "ADVANCED", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 60000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Cy Cycle", email: "cy@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Ike Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_id}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: ShopAdmin
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: ShopAdmin
              captures: { enr_status: $.data.status }
          assert:
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "Enrollment.${enr_id}.open_water_sessions_attended == 0"
            - "Enrollment.${enr_id}.completion_pct == 50"

      - name: rental_branching_returned_vs_voided
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_RETURNED
          - state_machines.RentalAgreement.ACTIVE_to_VOIDED
          - entities.RentalAgreement.fields.deposit_refund_cents
        distinguishing_aspect: |
          Branching fork on the RentalAgreement entity: ACTIVE forks to two
          terminal states with divergent side-effect sets — RETURNED runs the
          actual-charge + settlement calc (refund 6500 in the late example),
          while VOIDED short-circuits to actual_cost 0 and full deposit refund.
          A different entity from the Enrollment cycle above.
        test_recipe:
          setup:
            - "Clock 2026-06-10T09:00:00Z. One diver. Two identical rentals checked out (daily 4500, deposit 20000, planned return 2026-06-12T09:00:00Z). One will be voided immediately; the other returned late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /divers"
              payload: { full_name: "Ronan Rent", email: "ronan@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { diver_id: "${diver_id}", item_description: "Wetsuit", daily_rate_cents: 4500, deposit_cents: 20000, scheduled_return_at: "2026-06-12T09:00:00Z" }
              as: ShopAdmin
              captures: { rental_void: $.data.id }
            - call: "POST /rental-agreements"
              payload: { diver_id: "${diver_id}", item_description: "Fins", daily_rate_cents: 4500, deposit_cents: 20000, scheduled_return_at: "2026-06-12T09:00:00Z" }
              as: ShopAdmin
              captures: { rental_return: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${rental_void}/void"
              payload: {}
              as: ShopAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T15:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental-agreements/${rental_return}/checkin"
              payload: {}
              as: ShopAdmin
          assert:
            - "RentalAgreement.${rental_void}.status == VOIDED"
            - "RentalAgreement.${rental_void}.actual_cost_cents == 0"
            - "RentalAgreement.${rental_void}.deposit_refund_cents == 20000"
            - "RentalAgreement.${rental_return}.status == RETURNED"
            - "RentalAgreement.${rental_return}.actual_cost_cents == 22500"
            - "RentalAgreement.${rental_return}.deposit_refund_cents == 6500"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: session_cancel_cascade_depth3_to_enrollment
        grounds:
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - state_machines.SessionBooking.ATTENDED_to_CANCELLED
          - state_machines.Enrollment.ELIGIBLE_to_ACTIVE
          - entities.Enrollment.fields.open_water_sessions_attended
        distinguishing_aspect: |
          Depth-3 chain from the Session cancel trigger: Session -> CANCELLED
          (hop1) causes its ATTENDED SessionBooking -> CANCELLED (hop2), which
          in turn decrements the owning Enrollment's attendance and reverts it
          ELIGIBLE -> ACTIVE (hop3). Each hop is caused by the prior hop, not by
          the original cancel directly.
        test_recipe:
          setup:
            - "Clock 2026-06-04T09:00:00Z. Same shape as enrollment cycle: an ELIGIBLE enrollment whose only OW attendance came from one session, plus an active waiver and e-learning 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "Adv Cert", course_type: "ADVANCED", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 60000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Cara Cascade", email: "cara@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Ivo Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
