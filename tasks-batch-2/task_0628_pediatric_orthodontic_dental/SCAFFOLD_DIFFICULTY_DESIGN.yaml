# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# All formula-derived asserts are pre-computed integer-cent literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_benefit_on_plan_vs_actual_drawdown_on_policy
        grounds:
          - calculations.estimated_insurance_benefit
          - calculations.actual_benefit_drawdown
          - entities.TreatmentPlan.fields.estimated_insurance_benefit_cents
          - entities.InsurancePolicy.fields.remaining_max_cents
          - state_machines.InsuranceClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The forward-looking estimate lives on TreatmentPlan (estimated_insurance_benefit_cents,
          pinned at activation = 200000) while the chronological drawdown lives on the
          InsurancePolicy/InsuranceClaim domain; an earlier emergency claim consumes the pool so the
          plan's own claim is awarded 150000, not the 200000 the plan estimated — two different
          entity domains, divergent results.
        test_recipe:
          setup:
            - "Family + minor patient registered; patient has FINALIZED PANO + CEPH."
            - "Policy: ortho_rider true, coverage 0.50, lifetime_max 200000."
            - "Plan BRACES with one phase 400000; PROPOSED then ACTIVE (no siblings -> 0% discount); net_fee 400000, estimated_insurance_benefit 200000."
            - "An EMERGENCY claim billed 100000 is APPROVED first (benefit 50000, remaining_max -> 150000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Reyes", billing_email: "reyes@x.com", guardian_user_id: "guardian-reyes" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Ana Reyes", date_of_birth: "2012-05-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-1", full_name: "Dr. Vega", npi: "1234567890" }
              as: ClinicAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-1"
              captures: { pano_id: $.data.id }
            - call: "POST /growth-records/${pano_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-1"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-1"
              captures: { ceph_id: $.data.id }
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-1"
            - call: "POST /insurance-policies"
              payload: { patient_id: "${pat_id}", carrier_name: "Delta", ortho_rider: true, ortho_coverage_pct: 0.50, lifetime_max_cents: 200000 }
              as: BillingSpecialist
              captures: { pol_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", policy_id: "${pol_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${plan_id}", sequence_no: 1, label: "Full braces", phase_fee_cents: 400000 }
              as: Orthodontist
              as_user_id: "ortho-1"
            - call: "POST /treatment-plans/${plan_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-1"
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-reyes"
            - call: "POST /insurance-claims"
              payload: { policy_id: "${pol_id}", plan_id: "${plan_id}", billed_amount_cents: 100000 }
              as: BillingSpecialist
              captures: { emerg_claim_id: $.data.id }
            - call: "POST /insurance-claims/${emerg_claim_id}/approve"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /insurance-claims"
              payload: { policy_id: "${pol_id}", plan_id: "${plan_id}", billed_amount_cents: 400000 }
              as: BillingSpecialist
              captures: { main_claim_id: $.data.id }
            - call: "POST /insurance-claims/${main_claim_id}/approve"
              payload: {}
              as: BillingSpecialist
              captures: { main_benefit: $.data.benefit_cents }
          assert:
            - "TreatmentPlan.${plan_id}.estimated_insurance_benefit_cents == 200000"
            - "InsuranceClaim.${main_claim_id}.benefit_cents == 150000"
            - "InsurancePolicy.${pol_id}.remaining_max_cents == 0"
            - "InsuranceClaim.${main_claim_id}.benefit_cents != TreatmentPlan.${plan_id}.estimated_insurance_benefit_cents"

      - name: net_fee_pinned_estimate_vs_chronological_pool_exhaustion_two_plans
        grounds:
          - calculations.estimated_insurance_benefit
          - calculations.actual_benefit_drawdown
          - entities.TreatmentPlan.fields.estimated_patient_responsibility_cents
          - state_machines.InsuranceClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Two plans share one policy's pool; the second plan's estimate (pinned on the Plan entity at
          activation = 100000) overstates its actual benefit because the first plan's claim already
          drained the policy pool to 50000 before the second plan's claim is approved — the divergence
          is observed on the Policy/Claim chronological side, not the Plan estimate side.
        test_recipe:
          setup:
            - "One patient, one policy: rider true, coverage 0.50, lifetime_max 250000."
            - "Two BRACES plans (P1 net 400000, P2 net 200000), both ACTIVE; P1 estimate 200000, P2 estimate 100000."
            - "P1 claim billed 400000 APPROVED first -> benefit 200000, remaining_max -> 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Cho", billing_email: "cho@x.com", guardian_user_id: "guardian-cho" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Min Cho", date_of_birth: "2011-03-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-2", full_name: "Dr. Lin", npi: "2234567890" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-2"
              captures: { pano_id: $.data.id }
            - call: "POST /growth-records/${pano_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-2"
              captures: { ceph_id: $.data.id }
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /insurance-policies"
              payload: { patient_id: "${pat_id}", carrier_name: "Aetna", ortho_rider: true, ortho_coverage_pct: 0.50, lifetime_max_cents: 250000 }
              as: BillingSpecialist
              captures: { pol_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", policy_id: "${pol_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-2"
              captures: { p1_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${p1_id}", sequence_no: 1, label: "P1", phase_fee_cents: 400000 }
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /treatment-plans/${p1_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /treatment-plans/${p1_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-cho"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", policy_id: "${pol_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-2"
              captures: { p2_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${p2_id}", sequence_no: 1, label: "P2", phase_fee_cents: 200000 }
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /treatment-plans/${p2_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-2"
            - call: "POST /treatment-plans/${p2_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-cho"
            - call: "POST /insurance-claims"
              payload: { policy_id: "${pol_id}", plan_id: "${p1_id}", billed_amount_cents: 400000 }
              as: BillingSpecialist
              captures: { c1_id: $.data.id }
            - call: "POST /insurance-claims/${c1_id}/approve"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /insurance-claims"
              payload: { policy_id: "${pol_id}", plan_id: "${p2_id}", billed_amount_cents: 200000 }
              as: BillingSpecialist
              captures: { c2_id: $.data.id }
            - call: "POST /insurance-claims/${c2_id}/approve"
              payload: {}
              as: BillingSpecialist
          assert:
            - "TreatmentPlan.${p2_id}.estimated_insurance_benefit_cents == 100000"
            - "InsuranceClaim.${c2_id}.benefit_cents == 50000"
            - "InsurancePolicy.${pol_id}.remaining_max_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: net_fee_modality_and_sibling_discount_with_cap_mode_a
        grounds:
          - calculations.net_plan_fee
          - calculations.family_discount_tier
          - entities.TreatmentPlan.fields.net_fee_cents
          - state_machines.TreatmentPlan.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): net_fee_cents combines >=3 inputs (summed phase fees, INVISALIGN modality
          multiplier 1.15, family discount tier) with a conditional modality branch and a nested
          min() cap on the discount; for an INVISALIGN plan that is the family's 2nd in-treatment
          plan (5% tier), gross=575000, discount=28750, net_fee=546250.
        test_recipe:
          setup:
            - "Family with one already-ACTIVE BRACES plan (patient A); activating a 2nd plan makes n==2 -> 5% tier."
            - "2nd plan (patient B) INVISALIGN, phases sum 500000; both patients have FINALIZED PANO+CEPH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Okafor", billing_email: "ok@x.com", guardian_user_id: "guardian-ok" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-3", full_name: "Dr. Park", npi: "3234567890" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "A Okafor", date_of_birth: "2010-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { patA_id: $.data.id }
            - call: "POST /growth-records"
              payload: { patient_id: "${patA_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { a_pano: $.data.id }
            - call: "POST /growth-records/${a_pano}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /growth-records"
              payload: { patient_id: "${patA_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { a_ceph: $.data.id }
            - call: "POST /growth-records/${a_ceph}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${patA_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { planA_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${planA_id}", sequence_no: 1, label: "A", phase_fee_cents: 300000 }
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /treatment-plans/${planA_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /treatment-plans/${planA_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-ok"
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "B Okafor", date_of_birth: "2013-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { patB_id: $.data.id }
            - call: "POST /growth-records"
              payload: { patient_id: "${patB_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { b_pano: $.data.id }
            - call: "POST /growth-records/${b_pano}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /growth-records"
              payload: { patient_id: "${patB_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { b_ceph: $.data.id }
            - call: "POST /growth-records/${b_ceph}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${patB_id}", modality: "INVISALIGN" }
              as: Orthodontist
              as_user_id: "ortho-3"
              captures: { planB_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${planB_id}", sequence_no: 1, label: "B", phase_fee_cents: 500000 }
              as: Orthodontist
              as_user_id: "ortho-3"
            - call: "POST /treatment-plans/${planB_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-3"
          trigger:
            - call: "POST /treatment-plans/${planB_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-ok"
              captures: { net: $.data.net_fee_cents }
          assert:
            - "TreatmentPlan.${planB_id}.gross_fee_cents == 575000"
            - "TreatmentPlan.${planB_id}.discount_pct_applied == 0.05"
            - "TreatmentPlan.${planB_id}.net_fee_cents == 546250"

      - name: installment_schedule_floor_then_remainder_mode_b
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount_cents
          - entities.Contract.fields.financed_amount_cents
        distinguishing_aspect: |
          Mode (b): rounding ORDER is pinned — floor(financed/term) for installments 1..term-1 and the
          exact remainder on the final installment, so installments sum to financed with zero drift;
          for financed=100000, term=3 the schedule is [33333, 33333, 33334], NOT three round_half_up
          values that would drift to 99999.
        test_recipe:
          setup:
            - "Plan ACTIVE, BRACES, self-pay (no policy), single phase 100000 -> net 100000, estimate 0 -> est_resp 100000."
            - "Contract down_payment 0, term 3 -> financed 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Diaz", billing_email: "diaz@x.com", guardian_user_id: "guardian-diaz" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Leo Diaz", date_of_birth: "2012-09-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-4", full_name: "Dr. Roy", npi: "4234567890" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-4"
              captures: { pano_id: $.data.id }
            - call: "POST /growth-records/${pano_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-4"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-4"
              captures: { ceph_id: $.data.id }
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-4"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-4"
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${plan_id}", sequence_no: 1, label: "Full", phase_fee_cents: 100000 }
              as: Orthodontist
              as_user_id: "ortho-4"
            - call: "POST /treatment-plans/${plan_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-4"
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "guardian-diaz"
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /contracts"
              payload: { plan_id: "${plan_id}", expected_plan_version: "${plan_v}", down_payment_cents: 0, term_months: 3 }
              as: BillingSpecialist
              captures: { contract_id: $.data.id }
          assert:
            - "Contract.${contract_id}.financed_amount_cents == 100000"
            - "Installment(contract=${contract_id}, sequence_no=1).amount_cents == 33333"
            - "Installment(contract=${contract_id}, sequence_no=2).amount_cents == 33333"
            - "Installment(contract=${contract_id}, sequence_no=3).amount_cents == 33334"
            - "sum of Installment.amount_cents for contract ${contract_id} == 100000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_proposed_to_draft_revision_cycle
        grounds:
          - state_machines.TreatmentPlan.PROPOSED_to_DRAFT
          - state_machines.TreatmentPlan.DRAFT_to_PROPOSED
          - entities.TreatmentPlan.fields.status
        distinguishing_aspect: |
          TreatmentPlan is cyclic: PROPOSED -> DRAFT (revise) -> PROPOSED again, each transition
          bumping version; after one revise-then-repropose round the status returns to PROPOSED with
          version advanced by exactly 2 over the first PROPOSED.
        test_recipe:
          setup:
            - "Plan in DRAFT with one phase; proposed once (version captured)."
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Ng", billing_email: "ng@x.com", guardian_user_id: "guardian-ng" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Eve Ng", date_of_birth: "2012-02-02T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-5", full_name: "Dr. Sun", npi: "5234567890" }
              as: ClinicAdmin
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-5"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${plan_id}", sequence_no: 1, label: "P", phase_fee_cents: 300000 }
              as: Orthodontist
              as_user_id: "ortho-5"
            - call: "POST /treatment-plans/${plan_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-5"
              captures: { v_proposed1: $.data.version }
          trigger:
            - call: "POST /treatment-plans/${plan_id}/revise"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-5"
              captures: { v_draft: $.data.version }
            - call: "POST /treatment-plans/${plan_id}/propose"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-5"
              captures: { v_proposed2: $.data.version }
          assert:
            - "TreatmentPlan.${plan_id}.status == PROPOSED"
            - "v_draft == v_proposed1 + 1"
            - "v_proposed2 == v_proposed1 + 2"

      - name: contract_parallel_billing_and_lifecycle_axes
        grounds:
          - state_machines.Contract.billing_status=CURRENT_to_billing_status=DELINQUENT
          - state_machines.Contract.billing_status=DELINQUENT_to_billing_status=CURRENT
          - entities.Contract.fields.billing_status
          - entities.Contract.fields.lifecycle_status
        distinguishing_aspect: |
          Contract carries two independent state dimensions on one row: billing_status cycles
          CURRENT->DELINQUENT->CURRENT driven by installment MISSED/cure, while lifecycle_status stays
          ACTIVE throughout; the two axes evolve independently (billing flips twice while lifecycle is
          unchanged).
        test_recipe:
          setup:
            - "Plan ACTIVE self-pay net 90000; contract down 0 term 3 -> installments [30000,30000,30000]."
            - "Clock advanced to >= installment 1 due_at; charge FAILED -> installment 1 MISSED, contract DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Pera", billing_email: "pera@x.com", guardian_user_id: "guardian-pera" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Ivo Pera", date_of_birth: "2012-04-04T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
