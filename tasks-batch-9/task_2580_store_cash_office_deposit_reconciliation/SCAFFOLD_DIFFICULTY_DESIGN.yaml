  - rule_id: resource_temporal_overlap
    instances:
      - name: cashier_shift_half_open_allows_adjacency_rejects_one_minute_overlap
        grounds:
          - validations[priority=58]
          - errors.ERR_CASHIER_SHIFT_OVERLAP
          - entities.TillSession.fields.shift_start_at
          - entities.TillSession.fields.shift_end_at
          - endpoints["POST /cash-ops/till-sessions"]
        distinguishing_aspect: |
          The contended resource is the Cashier and the interval semantics are HALF-OPEN
          [shift_start_at, shift_end_at): a 17:00-21:00 shift booked immediately after a 09:00-17:00
          shift is accepted because the shared 17:00 instant belongs to only one interval, while a
          16:59-21:00 shift is rejected with ERR_CASHIER_SHIFT_OVERLAP for a single minute of true
          intersection.
        test_recipe:
          setup:
            - "Store S-1015 registered, MANUAL safe SAFE-A with 500000 (open_state LOCKED — starting-bank issuance needs no physical open)"
            - "Cashier E-100 enrolled and ELIGIBLE with coaching_state NONE"
            - "Sales journal for 2026-08-03, no sessions yet"
            - "Logical clock is 2026-08-03T08:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1015", name: "Store 1015", region_code: "SOUTH" }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { session_a_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 2, shift_start_at: "2026-08-03T17:00:00Z", shift_end_at: "2026-08-03T21:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { session_b_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 3, shift_start_at: "2026-08-03T16:59:00Z", shift_end_at: "2026-08-03T21:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
          assert:
            - "the adjacent 17:00-21:00 call returns 201 and TillSession.${session_b_id}.status == ACTIVE"
            - "the overlapping 16:59-21:00 call returns 409 with error_id == ERR_CASHIER_SHIFT_OVERLAP"
            - "GET /cash-ops/till-sessions?cashier_id=${cashier_id} returns exactly 2 sessions"
            - "SalesJournal.${journal_id}.session_count == 2"
            - "Safe.${safe_id}.balance_cents == 460000"

      - name: pickup_window_buffer_expansion_makes_touching_windows_conflict
        grounds:
          - validations[priority=58]
          - errors.ERR_PICKUP_WINDOW_CONFLICT
          - entities.Store.fields.pickup_buffer_minutes
          - entities.Deposit.fields.pickup_window_start
          - entities.Deposit.fields.pickup_window_end
          - endpoints["POST /cash-ops/deposits/{id}/schedule-pickup"]
        distinguishing_aspect: |
          The contended resource is the Store and the interval semantics are CLOSED and expanded by
          pickup_buffer_minutes 30 on both sides: an existing 10:00-10:30 window occupies
          09:30-11:00, so a new 11:00-11:30 window that merely TOUCHES it is rejected with
