            - "AccessGrant.${g_id}.status == REQUESTED"

      - name: stale_policy_ack_sign_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_POLICY_VERSION_STALE]", state_machines.Acknowledgment.PENDING_to_SIGNED]
        distinguishing_aspect: "Publish supersedes only SIGNED acks; a still-PENDING v1 ack remains PENDING but unsignable after v2 is published -> signing it fails 409 ERR_POLICY_VERSION_STALE; the freshly re-issued v2 ack signs cleanly."
        test_recipe:
          setup: ["employee PREBOARDING with auto v1 ack; policy published to v2 (v1 PENDING ack left in place; new v2 PENDING ack issued)"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Stale Ack", email: "stale@x.com", department: "ENG", role_title: "SDE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_v1: "$.data[0].id" }
            - call: "POST /api/program/policy/publish"
              payload: { new_version: "v2" }
              as: IPCounsel
          trigger:
            - call: "POST /api/acknowledgments/${ack_v1}/sign"
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING", policy_version: "v2" }
              as: HRPartner
              captures: { ack_v2: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_v2}/sign"
              as: Employee
              as_user_id: "${emp_id}"
          assert:
            - "err == ERR_POLICY_VERSION_STALE (ack policy_version v1 != current v2)"
            - "Acknowledgment.${ack_v1}.status == PENDING (left in place by publish)"
            - "Acknowledgment.${ack_v2}.status == SIGNED (fresh v2 ack signs cleanly)"

      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no role headers at all -> 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/assets"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (priority 1 fires before role/existence checks)"

