# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Biorepository & Specimen Consent Management
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: donor_creation_returns_system_fields
        claim_type: creation
        grounds:
          - "entities.Donor"
          - "endpoints[POST /biobank/donors]"
        distinguishing_aspect: "POST with required fields returns 201 with server-minted id, status ENROLLED, version 1, created_at set; input supplies only donor_reference_code."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
          assert:
            - "response 201; data.id is a UUID; data.status == ENROLLED; data.version == 1; data.created_at is set; data.donor_reference_code == D-ENT1"

      - name: consent_record_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.ConsentRecord.fields.excluded_uses"
          - "entities.ConsentRecord.fields.allow_reidentification"
        distinguishing_aspect: "Omitting excluded_uses and allow_reidentification applies defaults [] and false on the created ConsentRecord."
        test_recipe:
          setup: ["donor exists"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH", "DISEASE_SPECIFIC"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
          assert:
            - "response 201; data.excluded_uses == [] and data.allow_reidentification == false; data.status == ACTIVE; data.grace_deadline == null"

      - name: specimen_get_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints[GET /biobank/specimens/{specimenId}]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /biobank/specimens/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 404; data.error_id == ERR_NOT_FOUND"

      - name: collection_kit_missing_kit_type_rejected
        claim_type: required_fields
        grounds:
          - "entities.CollectionKit.fields.kit_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /collection-kits without required kit_type returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/collection-kits", payload: { expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_INVALID_REQUEST"

      - name: specimen_invalid_enum_specimen_type_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Specimen.fields.specimen_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "specimen_type outside {BLOOD, SALIVA, TISSUE, PLASMA} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["donor with ACTIVE consent and RETURNED kit"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT5" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
          trigger:
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "URINE", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_INVALID_REQUEST"

      - name: donor_create_unknown_field_rejected
        claim_type: creation
        grounds:
          - "validations[priority=3.6]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Strict input schema: an unknown request field triggers 400 ERR_INVALID_REQUEST rather than being silently ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT6", nickname: "x" }, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_INVALID_REQUEST"

      - name: specimen_list_pagination
        claim_type: listing
        grounds:
          - "endpoints[GET /biobank/specimens]"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "GET /biobank/specimens honors limit/offset with total_count and has_more: 3 specimens, limit 2 -> page 1 has_more true, page 2 (offset 2) returns 1 row has_more false."
        test_recipe:
          setup: ["one donor, one ACTIVE consent, three RETURNED kits, three accessioned specimens"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT7" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k1: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k1}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k1}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "SALIVA", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k2: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k2}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k2}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "TISSUE", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k3: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k3}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k3}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k1}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k2}", consent_record_id: "${c_id}", specimen_type: "SALIVA", initial_volume_ml: 10.0, collected_at: "2026-05-02T01:00:00Z" }, as: LabTechnician }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k3}", consent_record_id: "${c_id}", specimen_type: "TISSUE", initial_volume_ml: 10.0, collected_at: "2026-05-02T02:00:00Z" }, as: LabTechnician }
          trigger:
            - { call: "GET /biobank/specimens", payload: { limit: 2, offset: 0 }, as: LabTechnician }
            - { call: "GET /biobank/specimens", payload: { limit: 2, offset: 2 }, as: LabTechnician }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"

      - name: custody_events_append_only_ordered
        claim_type: immutability
        grounds:
          - "entities.CustodyEvent"
          - "endpoints[GET /biobank/collection-kits/{kitId}/custody-events]"
        distinguishing_aspect: "CustodyEvent has no update/delete surface (common_fields false); distribute then receive-return yields exactly two events ordered created_at ASC: DISTRIBUTED then RETURNED with the acting user id recorded."
        test_recipe:
          setup: ["donor and IN_STOCK kit"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-ENT8" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator, as_user_id: "coord-1" }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator, as_user_id: "coord-2" }
            - { call: "GET /biobank/collection-kits/${k_id}/custody-events", payload: {}, as: ConsentCoordinator }
          assert:
            - "exactly 2 events; first event_type == DISTRIBUTED with actor_user_id == coord-1; second event_type == RETURNED with actor_user_id == coord-2"
            - "events carry id and created_at only (no updated_at/version)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: kit_distribute_from_returned_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.CollectionKit.IN_STOCK_to_DISTRIBUTED"
          - "errors[ERR_KIT_NOT_DISTRIBUTABLE]"
        distinguishing_aspect: "Distribute is only valid from IN_STOCK; a RETURNED kit rejects with ERR_KIT_NOT_DISTRIBUTABLE and records no custody event."
        test_recipe:
          setup: ["kit distributed to donor and returned (status RETURNED)"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
          trigger:
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_KIT_NOT_DISTRIBUTABLE"
            - "GET /biobank/collection-kits/${k_id}/custody-events still has exactly 2 events"

      - name: consent_withdraw_from_withdrawn_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ConsentRecord.WITHDRAWAL_PENDING_to_WITHDRAWN"
          - "errors[ERR_CONSENT_NOT_ACTIVE]"
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw after the sweep finalization fails with ERR_CONSENT_NOT_ACTIVE."
        test_recipe:
          setup: ["consent withdrawn at default clock and finalized by sweep at the grace deadline"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: BiobankAdmin }
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_CONSENT_NOT_ACTIVE; consent remains WITHDRAWN"

      - name: vote_on_draft_request_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.SampleRequest"
          - "errors[ERR_REQUEST_NOT_UNDER_REVIEW]"
        distinguishing_aspect: "Votes require UNDER_REVIEW; voting on a DRAFT request fails with ERR_REQUEST_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["agreement ACTIVE; request created but not submitted (DRAFT)"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni V", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-DRAFT", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_REQUEST_NOT_UNDER_REVIEW"

      - name: specimen_initial_state_depends_on_slot
        claim_type: initial_state
        grounds:
          - "state_machines.Specimen"
          - "entities.Specimen.fields.lifecycle_status"
        distinguishing_aspect: "Accession without storage_slot_id starts ACCESSIONED; with an AVAILABLE slot it starts IN_STORAGE."
        test_recipe:
          setup: ["donor, ACTIVE consent, two RETURNED kits, unit with slot"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM4" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k1: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k1}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k1}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k2: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k2}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k2}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-SM4", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k1}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp1: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k2}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T01:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp2: "$.data.id" } }
          assert:
            - "GET /biobank/specimens/${sp1} -> lifecycle_status == ACCESSIONED"
            - "GET /biobank/specimens/${sp2} -> lifecycle_status == IN_STORAGE"

      - name: rescind_after_grace_expired_rejected
        claim_type: guarded_transition
        grounds:
          - "state_machines.ConsentRecord.WITHDRAWAL_PENDING_to_ACTIVE"
          - "errors[ERR_WITHDRAWAL_GRACE_EXPIRED]"
        distinguishing_aspect: "Rescind is guarded by the clock: at or after grace_deadline (strict < fails) it returns ERR_WITHDRAWAL_GRACE_EXPIRED even though the sweep has not run yet and status is still WITHDRAWAL_PENDING."
        test_recipe:
          setup: ["consent withdrawn at default clock 2026-05-01T00:00:00Z (deadline 2026-05-04T00:00:00Z); clock advanced exactly to the deadline; no sweep"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM5" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/consent-records/${c_id}/rescind-withdrawal", payload: {}, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_WITHDRAWAL_GRACE_EXPIRED; status remains WITHDRAWAL_PENDING until the sweep"

      - name: kit_expired_by_sweep
        claim_type: auto_transition
        grounds:
          - "state_machines.CollectionKit.IN_STOCK_to_EXPIRED"
          - "endpoints[POST /biobank/sweeps/process-due]"
        distinguishing_aspect: "Sweep expires an IN_STOCK kit whose expires_at equals the current clock (inclusive >= boundary) and appends an EXPIRED custody event."
        test_recipe:
          setup: ["kit with expires_at 2026-05-02T00:00:00Z; clock set to exactly 2026-05-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "SALIVA", expires_at: "2026-05-02T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin, captures: { n_kits: "$.data.kits_expired" } }
          assert:
            - "sweep response data.kits_expired == 1"
            - "GET /biobank/collection-kits/${k_id} -> status == EXPIRED; custody events contain an EXPIRED event with actor_user_id == system"

      - name: aliquot_void_then_checkout_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Aliquot.IN_STORAGE_to_VOID"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "VOID is terminal: checkout of a voided aliquot returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["specimen 50ml with one aliquot 20ml voided"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM7" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 20.0, expected_specimen_version: "${sp_v}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/aliquots/${a_id}/void", payload: {}, as: LabTechnician }
          trigger:
            - { call: "POST /biobank/aliquots/${a_id}/checkout", payload: { request_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_ALREADY_TERMINAL"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: quorum_rejection_threshold
        claim_type: correct_result
        grounds:
          - "calculations.committee_quorum"
          - "state_machines.SampleRequest.UNDER_REVIEW_to_REJECTED"
        distinguishing_aspect: "Rejection threshold COMMITTEE_SIZE - QUORUM_COUNT + 1 == 3 is also inclusive: two REJECT votes leave the request UNDER_REVIEW; the third flips it to REJECTED."
        test_recipe:
          setup: ["agreement ACTIVE; request UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni R", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-REJ", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "REJECT", rationale: "committee rejection rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "REJECT", rationale: "committee rejection rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "REJECT", rationale: "committee rejection rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          assert:
            - "After vote 2: GET /biobank/sample-requests/${rq_id} -> votes_against == 2 and status == UNDER_REVIEW"
            - "After vote 3: votes_against == 3 and status == REJECTED"

      - name: withdrawal_grace_boundary_inclusive
        claim_type: boundary
        grounds:
          - "calculations.withdrawal_grace_deadline"
        distinguishing_aspect: "The sweep finalizes at current_utc >= grace_deadline (inclusive): at exactly the deadline the consent is finalized."
        test_recipe:
          setup: ["consent withdrawn at default clock 2026-05-01T00:00:00Z; clock set to exactly grace_deadline 2026-05-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CAL2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin, captures: { n_wd: "$.data.withdrawals_finalized" } }
          assert:
            - "sweep response data.withdrawals_finalized == 1"
            - "GET /biobank/consent-records/${c_id} -> status == WITHDRAWN"

      - name: destruction_completed_late_strict_boundary
        claim_type: boundary
        grounds:
          - "calculations.destruction_sla"
          - "entities.DestructionOrder.fields.completed_late"
        distinguishing_aspect: "completed_late uses strict >: confirmation at exactly due_at is on time (false); confirmation one minute past due_at is late (true)."
        test_recipe:
          setup: ["two donors/consents/kits/specimens; two PENDING destruction orders created at default clock 2026-05-01T00:00:00Z (due_at 2026-05-03T00:00:00Z), created by qo-1"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CAL3a" }, as: ConsentCoordinator, captures: { d1: "$.data.id" } }
            - { call: "POST /biobank/donors/${d1}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k1: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k1}/distribute", payload: { donor_id: "${d1}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k1}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d1}", kit_id: "${k1}", consent_record_id: "${c1}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp1: "$.data.id" } }
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CAL3b" }, as: ConsentCoordinator, captures: { d2: "$.data.id" } }
            - { call: "POST /biobank/donors/${d2}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c2: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k2: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k2}/distribute", payload: { donor_id: "${d2}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k2}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d2}", kit_id: "${k2}", consent_record_id: "${c2}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp2: "$.data.id" } }
            - { call: "POST /biobank/destruction-orders", payload: { specimen_id: "${sp1}", reason: "QUALITY_FAILURE" }, as: QualityOfficer, as_user_id: "qo-1", captures: { o1: "$.data.id" } }
            - { call: "POST /biobank/destruction-orders", payload: { specimen_id: "${sp2}", reason: "OTHER" }, as: QualityOfficer, as_user_id: "qo-1", captures: { o2: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: BiobankAdmin }
            - { call: "POST /biobank/destruction-orders/${o1}/confirm-execution", payload: {}, as: QualityOfficer, as_user_id: "qo-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:01:00Z" }, as: BiobankAdmin }
            - { call: "POST /biobank/destruction-orders/${o2}/confirm-execution", payload: {}, as: QualityOfficer, as_user_id: "qo-2" }
          assert:
            - "GET /biobank/destruction-orders/${o1} -> status == COMPLETED and completed_late == false (confirm exactly at due_at)"
            - "GET /biobank/destruction-orders/${o2} -> status == COMPLETED and completed_late == true (confirm one minute past due_at)"
            - "GET /biobank/specimens/${sp1} -> lifecycle_status == DESTROYED; same for ${sp2}"

      - name: handling_fee_rounding_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.handling_fee_cents"
        excluded_because:
          difficulty_instance: combinatorial_formula / handling_fee_per_aliquot_rounding
          rationale: "Per-aliquot-then-sum rounding order and the 1002-vs-1003 divergence are asserted by the named difficulty instance."

      - name: volume_invariant_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.specimen_volume_reconciliation"
        excluded_because:
          difficulty_instance: compensating_invariant / aliquot_create_void_volume_invariant
          rationale: "Residual-volume recompute on both create and void is asserted by the named difficulty instance."

      - name: excursion_variants_covered_by_difficulty
        claim_type: variant_divergence
        grounds:
          - "calculations.freezer_excursion_assessment"
        excluded_because:
          difficulty_instance: dual_variant_calc / freezer_excursion_peak_vs_cumulative
          rationale: "Peak (5.0) vs cumulative (540.0) divergence on identical readings is asserted by the named difficulty instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call without X-User-ID/X-User-Role headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL1" }, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: researcher_cannot_create_donor
        claim_type: rbac_denial
        grounds:
          - "validations[priority=2]"
          - "roles[Researcher]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Researcher role is not in the POST /donors role list; denial is 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL2" }, as: Researcher, as_user_id: "researcher-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403; data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: consent_withdrawn_blocks_accession
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CONSENT_NOT_ACTIVE]"
        distinguishing_aspect: "Accession cross-checks the referenced consent: a WITHDRAWN consent (kit properly RETURNED) fails with ERR_CONSENT_NOT_ACTIVE."
        test_recipe:
          setup: ["kit RETURNED; consent withdrawn and finalized by sweep"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL3" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: BiobankAdmin }
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_CONSENT_NOT_ACTIVE"

      - name: donor_mismatch_at_accession_rejected
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_DONOR_MISMATCH]"
        distinguishing_aspect: "The kit was distributed to donor A but accession names donor B: ERR_DONOR_MISMATCH (400) — referential coherence across Donor/CollectionKit/Specimen."
        test_recipe:
          setup: ["donors A and B each with ACTIVE consent; kit distributed to A and returned"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL4a" }, as: ConsentCoordinator, captures: { d_a: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_a}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_a: "$.data.id" } }
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL4b" }, as: ConsentCoordinator, captures: { d_b: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_a}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
          trigger:
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_b}", kit_id: "${k_id}", consent_record_id: "${c_a}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_DONOR_MISMATCH"

      - name: agreement_scope_insufficient_at_request_create
        claim_type: conditional_validation
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_AGREEMENT_SCOPE_INSUFFICIENT]"
        distinguishing_aspect: "Request creation validates required_uses against agreement scope_uses; GENETIC_ANALYSIS against a GENERAL_RESEARCH-only agreement fails with ERR_AGREEMENT_SCOPE_INSUFFICIENT."
        test_recipe:
          setup: ["agreement ACTIVE with scope GENERAL_RESEARCH only"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni S", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-SCOPE", required_uses: ["GENETIC_ANALYSIS"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_AGREEMENT_SCOPE_INSUFFICIENT"

      - name: duplicate_vote_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_DUPLICATE_VOTE]"
        distinguishing_aspect: "The same reviewer casting a second vote in the same review round fails with ERR_DUPLICATE_VOTE."
        test_recipe:
          setup: ["agreement ACTIVE; request UNDER_REVIEW with one APPROVE vote by rev-1"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni D", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-DUP", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "REJECT", rationale: "changed my mind on this one" }, as: CommitteeReviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 409; data.error_id == ERR_DUPLICATE_VOTE; votes_for remains 1 and votes_against remains 0"

      - name: requester_cannot_vote_on_own_request
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties: a CommitteeReviewer whose X-User-ID equals the request's requester_user_id is rejected with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["agreement ACTIVE; request UNDER_REVIEW created by researcher-1"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni SD", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-SOD", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "self review should never pass here" }, as: CommitteeReviewer, as_user_id: "researcher-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403; data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: destruction_confirm_by_creator_rejected
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.DestructionOrder.PENDING_to_COMPLETED"
        distinguishing_aspect: "Two-person destruction control: the QualityOfficer who created the order cannot confirm it; same X-User-ID yields ERR_SEGREGATION_OF_DUTIES, and a different officer succeeds."
        test_recipe:
          setup: ["specimen accessioned; destruction order created by qo-1"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL9" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id" } }
            - { call: "POST /biobank/destruction-orders", payload: { specimen_id: "${sp_id}", reason: "QUALITY_FAILURE" }, as: QualityOfficer, as_user_id: "qo-1", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/destruction-orders/${o_id}/confirm-execution", payload: {}, as: QualityOfficer, as_user_id: "qo-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /biobank/destruction-orders/${o_id}/confirm-execution", payload: {}, as: QualityOfficer, as_user_id: "qo-2" }
          assert:
            - "First confirm (creator qo-1) -> 403 ERR_SEGREGATION_OF_DUTIES; order stays PENDING"
            - "Second confirm (qo-2) -> 200; order COMPLETED; GET /biobank/specimens/${sp_id} -> lifecycle_status == DESTROYED"

      - name: reveal_without_active_grant_forbidden
        claim_type: conditional_validation
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_NO_ACTIVE_GRANT]"
        distinguishing_aspect: "Reveal requires a grant whose CLOSED window contains the current clock; a future-window grant (clock 2026-05-01, window 2026-06-01..2026-06-02) yields ERR_NO_ACTIVE_GRANT even with SoD satisfied."
        test_recipe:
          setup: ["specimen with de-identification key (consent allow_reidentification true); grant with future window for grantee officer-a"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL10" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z", allow_reidentification: true }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id" } }
            - { call: "POST /biobank/deidentification-keys", payload: { specimen_id: "${sp_id}" }, as: ConsentCoordinator, captures: { key_id: "$.data.id" } }
            - { call: "POST /biobank/deidentification-keys/${key_id}/grants", payload: { grantee_user_id: "officer-a", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T17:00:00Z", purpose: "scheduled audit" }, as: ConsentCoordinator, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/deidentification-keys/${key_id}/reveal", payload: { grant_id: "${g_id}", justification: "regulatory investigation request" }, as: QualityOfficer, as_user_id: "qo-9", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403; data.error_id == ERR_NO_ACTIVE_GRANT; GET /biobank/deidentification-keys/${key_id} -> reveal_count == 0"

      - name: vote_rationale_too_short_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_JUSTIFICATION_TOO_SHORT]"
        distinguishing_aspect: "Rationale under 20 characters returns 400 ERR_JUSTIFICATION_TOO_SHORT."
        test_recipe:
          setup: ["agreement ACTIVE; request UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni J", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-JST", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "short" }, as: CommitteeReviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_JUSTIFICATION_TOO_SHORT"

      - name: temperature_reading_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_INVALID_TEMPERATURE_READING]"
        distinguishing_aspect: "temp_c 50.0 is outside the plausibility range -100.0..+25.0 and returns 400 ERR_INVALID_TEMPERATURE_READING without altering posture."
        test_recipe:
          setup: ["unit FRZ-VAL OPERATIONAL"]
          setup_api_calls:
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-VAL", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T00:00:00Z", temp_c: 50.0 }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400; data.error_id == ERR_INVALID_TEMPERATURE_READING; GET /biobank/storage-units/${u_id} -> posture == OPERATIONAL"

      - name: aliquot_volume_equality_boundary
        claim_type: boundary
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INSUFFICIENT_SPECIMEN_VOLUME]"
        distinguishing_aspect: "Volume check is inclusive (<=): an aliquot equal to residual (100.0 of 100.0) succeeds and leaves residual 0.0; a further 0.01ml aliquot then fails with ERR_INSUFFICIENT_SPECIMEN_VOLUME."
        test_recipe:
          setup: ["specimen SP-VB 100.0ml ACCESSIONED"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-VAL13" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 100.0, expected_specimen_version: "${sp_v}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "GET /biobank/specimens/${sp_id}", payload: {}, as: LabTechnician, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 0.01, expected_specimen_version: "${sp_v2}" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "First aliquot (equality) -> 201; GET /biobank/specimens/${sp_id} -> residual_volume_ml == 0.0"
            - "Second aliquot (0.01 > 0.0) -> 422 ERR_INSUFFICIENT_SPECIMEN_VOLUME"

