errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted on endpoint, or ownership check failed (LabelRep filing a dispute for a title owned by another label)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path or payload FK id does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_chart_version does not match chart.version at OCC-guarded write"
  - id: ERR_CHART_FROZEN
    http: 409
    condition: "operation blocked while a ChartFreeze with status ACTIVE exists for the chart"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity not in a state from which the requested transition is declared"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "provider SUSPENDED at report accept, or label account SUSPENDED at signal escalation"
  - id: ERR_WEEK_NOT_CLOSED
    http: 409
    condition: "week lock attempted before logical clock reaches closes_at"
  - id: ERR_NO_ACTIVE_METHODOLOGY
    http: 409
    condition: "compute attempted with no ACTIVE methodology version, or the ACTIVE version's effective_from is after week.opens_at"
  - id: ERR_REPORTING_CUTOFF_PASSED
    http: 422
    condition: "report event_time outside [opens_at, reporting_cutoff) (including after a holiday-adjusted cutoff)"
  - id: ERR_WEEK_WINDOW_OVERLAP
    http: 409
    condition: "new chart week window strictly overlaps an existing week of the same chart (adjacent touch permitted)"
  - id: ERR_AVAILABILITY_WINDOW
    http: 422
    condition: "title outside its availability_policy window at the week's opens_at"
  - id: ERR_COMPONENT_KIND_MISMATCH
    http: 422
    condition: "report component_kind not permitted by provider.feed_kind"
  - id: ERR_DUPLICATE_REPORT_BATCH
    http: 409
    condition: "same provider re-submits an identical file_fingerprint"
  - id: ERR_GENRE_MISMATCH
    http: 422
    condition: "title genre_tag does not match GENRE chart's genre_tag, or product_kind mismatches chart_kind"
  - id: ERR_DISPUTE_INVALID
    http: 422
    condition: "dispute filed against a MAIN chart, or claimed_genre equals current genre_tag"
  - id: ERR_RECLASSIFICATION_TARGET_MISMATCH
    http: 422
    condition: "resolution RECLASSIFY supplies new_genre_tag different from dispute chart's genre_tag"
  - id: ERR_SIGNAL_ALREADY_ESCALATED
    http: 409
    condition: "second escalation attempt for a signal that already has an Investigation"
  - id: ERR_DUTY_SEGREGATION_VIOLATION
    http: 403
    condition: "escalating ChartOps user names themselves as assigned investigator, or resolving Investigator is not the assigned investigator"
  - id: ERR_TITLE_DISQUALIFIED
    http: 409
    condition: "operation targets or includes a title whose eligibility_posture is DISQUALIFIED"
  - id: ERR_PRICE_BELOW_FLOOR
    http: 422
    condition: "title.base_price_cents below the global price floor constant at compute"
  - id: ERR_RELEASE_WINDOW_VIOLATION
    http: 422
    condition: "first chart entry attempted for a week opening before the title's release_date"
  - id: ERR_BUNDLE_CHANNEL_INVALID
    http: 422
    condition: "sale batch against a non-ALBUM title"
  - id: ERR_HOLIDAY_WINDOW_INVALID
    http: 422
    condition: "holiday adjustment with new cutoff not strictly earlier than current cutoff, or before opens_at, or week not OPEN"

roles:
  - name: PlatformAdmin
    description: "Platform operator; manages providers and label accounts, drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /providers", "POST /providers/{id}/suspend", "POST /labels", "POST /_clock/set_current_utc"]
    shared_operations: [all read endpoints]
  - name: ChartManager
    description: "Chart methodology authority; owns charts, methodology versions, weeks, freezes, dispute resolution, recurrent rules, and reinstatements"
    identity: opaque
    exclusive_operations: ["POST /charts", "POST /charts/{id}/methodology-versions", "POST /charts/{id}/methodology-versions/{mid}/activate", "POST /charts/{id}/freeze", "POST /charts/{id}/freeze/{fid}/resolve", "POST /charts/{id}/weeks", "POST /chart-weeks/{id}/lock", "POST /chart-weeks/{id}/compute", "POST /chart-weeks/{id}/publish", "POST /chart-weeks/{id}/holiday-adjust", "POST /genre-disputes/{id}/resolve", "POST /recurrent-rules", "POST /label-accounts/{id}/reinstate", "POST /titles/{id}/reinstate"]
    shared_operations: [all read endpoints]
  - name: ChartOps
    description: "Chart operations analyst; triages consumption reports, files and escalates manipulation signals, reviews disputes, records sale batches; forbidden from investigating signals they escalated"
    identity: opaque
    exclusive_operations: ["POST /consumption-reports/{id}/accept", "POST /consumption-reports/{id}/quarantine", "POST /consumption-reports/{id}/reject", "POST /manipulation-signals", "POST /manipulation-signals/{id}/dismiss", "POST /manipulation-signals/{id}/escalate", "POST /genre-disputes/{id}/review"]
    shared_operations: ["POST /titles/{id}/sale-batches (shared with LabelRep)", all read endpoints]
  - name: DataProvider
    description: "External data provider integration identity; submits consumption reports for its own provider registration"
    identity: "entity_backed:Provider"
    exclusive_operations: ["POST /providers/{id}/reports"]
    shared_operations: [all read endpoints]
  - name: LabelRep
    description: "Label representative; registers titles, files genre disputes for titles owned by their label, records sale batches"
    identity: "entity_backed:LabelAccount"
    exclusive_operations: ["POST /titles", "POST /genre-disputes"]
    shared_operations: ["POST /titles/{id}/sale-batches (shared with ChartOps)", all read endpoints]
  - name: Investigator
    description: "Independent manipulation investigator; resolves investigations assigned to them; segregation of duties forbids resolving self-escalated cases"
    identity: opaque
    exclusive_operations: ["POST /investigations/{id}/resolve"]
    shared_operations: [all read endpoints]


