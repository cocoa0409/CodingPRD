# =============================================================================
# Task 1852: Karting League & Race Series Management — Scaffold Seed Tables
# =============================================================================

scenario: |
  1852. Karting League & Race Series Management (kart club race series): driver
  registration & class by age/weight, kart rental vs owner-driver rules, points
  system across season & drop rounds, qualifying/heat/main event format,
  technical inspection & weight compliance, penalty & incident review protocol,
  championship tiebreak & awards banquet, track time booking & practice sessions

domain_name: karting-league-race-series
api_prefix: /karting

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert band
# =============================================================================
complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Temporal windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid          # season→event tree + flat drivers/karts/bookings with cross-aggregate FKs
  state_machine_shape: cyclic      # EventEntry re-inspection loop; Incident appeal loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties  # incident reporter cannot adjudicate the same incident
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LeagueSeason
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season display name" }
      - { name: year, type: integer, source: input, description: "Competition year" }
      - { name: drop_rounds, type: integer, source: input, default: 0, description: "Number of each driver's lowest-scoring rounds dropped in final standings; >= 0" }
      - { name: points_scheme, type: array, source: input, description: "Array of integers; points_scheme[p-1] = base points for finish position p; positions beyond array length score 0" }
      - { name: fastest_lap_bonus_points, type: integer, source: input, default: 0, description: "Bonus points for session fastest lap when finisher places at or before FASTEST_LAP_MAX_POSITION" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | FINALIZED | AWARDS_CONCLUDED" }
      - { name: rounds_completed, type: integer, source: computed, description: "Count of child RaceEvents in COMPLETED or FINALIZED status" }
      - { name: collected_fees_cents, type: integer, source: computed, description: "Sum of entry_fee_cents over all EventEntry rows under this season whose fee_status == PAID" }

  - name: RaceClass
    parent: LeagueSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> LeagueSeason.id; parent season" }
      - { name: code, type: enum, source: input, description: "CADET | JUNIOR | SENIOR | HEAVY; unique per season" }
      - { name: min_age, type: integer, source: input, description: "Minimum driver age in whole years (inclusive), age measured at event_date" }
      - { name: max_age, type: integer, source: input, description: "Maximum driver age in whole years (inclusive)" }
      - { name: min_combined_weight_kg, type: number, source: input, description: "Minimum driver+kart combined weight at technical inspection; > 0" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Per-event entry fee for this class; >= 0" }
      - { name: rental_kart_allowed, type: boolean, source: input, description: "Whether RENTAL entries are permitted in this class" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD; used for class age eligibility at event_date" }
      - { name: body_weight_kg, type: number, source: input, description: "Declared driver body weight; > 0" }
      - { name: license_type, type: enum, source: input, description: "RENTAL | OWNER; RENTAL license holders may only create RENTAL entries" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED" }

  - name: RentalKart
    parent: null
    common_fields: true
    fields:
      - { name: fleet_number, type: string, source: input, description: "Unique fleet identifier string" }
      - { name: eligible_class_codes, type: array, source: input, description: "Array of RaceClass.code values this kart may race in" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_MAINTENANCE | RETIRED" }

  - name: RaceEvent
    parent: LeagueSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> LeagueSeason.id; parent season" }
      - { name: round_number, type: integer, source: input, description: "Round ordinal within the season; unique per season; >= 1" }
      - { name: event_date, type: datetime, source: input, description: "Race date (ISO 8601); used for driver age eligibility" }
      - { name: track_name, type: string, source: input, description: "Track display name" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REGISTRATION_OPEN | IN_PROGRESS | COMPLETED | FINALIZED | CANCELLED" }

  - name: EventEntry
    parent: RaceEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> RaceEvent.id; parent event" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; entered driver" }
      - { name: class_id, type: string, source: input, description: "FK -> RaceClass.id; class within the event's season" }
      - { name: entry_type, type: enum, source: input, description: "RENTAL | OWNER_DRIVER" }
      - { name: kart_id, type: string, source: input, description: "FK -> RentalKart.id; required iff entry_type == RENTAL, must be null for OWNER_DRIVER" }
      - { name: status, type: enum, source: system, description: "ENTERED | TECH_CHECK | TECH_FAILED | TECH_PASSED | GRID_LOCKED | WITHDRAWN | DISQUALIFIED" }
      - { name: entry_fee_cents, type: integer, source: computed, description: "Snapshot of RaceClass.entry_fee_cents at entry creation" }
      - { name: fee_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED" }
      - { name: tech_fail_count, type: integer, source: computed, description: "Count of TechInspection rows with outcome FAIL on this entry" }
      - { name: event_points, type: integer, source: computed, description: "Sum of SessionResult.points_awarded for this entry across the event's sessions with session_type in {HEAT, MAIN}" }

  - name: RaceSession
    parent: RaceEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> RaceEvent.id; parent event" }
      - { name: session_type, type: enum, source: input, description: "PRACTICE | QUALIFYING | HEAT | MAIN" }
      - { name: sequence, type: integer, source: input, description: "Ordering ordinal within the event; unique per event; >= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | SCORED" }

  - name: SessionResult
    parent: RaceSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> RaceSession.id; parent session" }
      - { name: entry_id, type: string, source: input, description: "FK -> EventEntry.id; must be a GRID_LOCKED entry of the session's event" }
      - { name: finish_position, type: integer, source: input, description: "Recorded finishing position; >= 1; re-ranked by penalty application" }
      - { name: best_lap_ms, type: integer, source: input, description: "Best lap time in milliseconds; > 0" }
      - { name: total_time_ms, type: integer, source: input, description: "Total race time in milliseconds; > 0" }
      - { name: penalty_seconds_applied, type: integer, source: computed, description: "Cumulative TIME_SECONDS penalties from UPHELD incidents, minus reversals; >= 0" }
      - { name: is_fastest_lap, type: boolean, source: computed, description: "True for the result with min best_lap_ms in the session at score time; tie broken by lower finish_position" }
      - { name: points_awarded, type: integer, source: computed, description: "Points per calculations.session_points; 0 for PRACTICE/QUALIFYING sessions and for results of DISQUALIFIED entries" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | AMENDED | FINAL" }

  - name: TechInspection
    parent: EventEntry
    common_fields: false
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> EventEntry.id; inspected entry" }
      - { name: measured_combined_weight_kg, type: number, source: input, description: "Scale reading of driver+kart combined weight; > 0" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL per calculations.weight_compliance" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the RaceDirector who recorded the inspection" }
      - { name: notes, type: string, source: input, description: "Optional inspector notes" }

  - name: Incident
    parent: RaceEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> RaceEvent.id; parent event" }
      - { name: entry_id, type: string, source: input, description: "FK -> EventEntry.id; entry the report is against" }
      - { name: session_id, type: string, source: input, description: "FK -> RaceSession.id; session where the incident occurred" }
      - { name: description, type: string, source: input, description: "Free-text report" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporting official" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | UPHELD | DISMISSED | APPEALED" }
      - { name: penalty_kind, type: enum, source: input, description: "NONE | TIME_SECONDS | DISQUALIFICATION; set at adjudication when decision == UPHELD" }
      - { name: penalty_seconds, type: integer, source: input, description: "Required and > 0 iff penalty_kind == TIME_SECONDS; null otherwise" }
      - { name: adjudicator_user_id, type: string, source: system, description: "X-User-ID of the Steward who last adjudicated" }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed; max 1" }

  - name: PracticeBooking
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; booking driver" }
      - { name: kart_id, type: string, source: input, description: "FK -> RentalKart.id; reserved rental kart" }
      - { name: start_time, type: datetime, source: input, description: "Window start (ISO 8601 UTC); half-open interval [start_time, end_time)" }
      - { name: end_time, type: datetime, source: input, description: "Window end; must be strictly after start_time" }
      - { name: pricing_mode, type: enum, source: input, description: "FLAT | METERED; selects calculations.practice_billing variant" }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED" }
      - { name: minutes_used, type: integer, source: computed, description: "Set at check-out: (end_time - start_time) in whole minutes; null until COMPLETED" }
      - { name: fee_cents, type: integer, source: computed, description: "Set at check-out per calculations.practice_billing; null until COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LeagueSeason
    field: status
    initial_state: SCHEDULED
    terminal_states: [AWARDS_CONCLUDED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /karting/seasons/{id}/activate"
        actor: LeagueAdmin
        preconditions:
          - "At least one RaceClass exists for the season"
        side_effects: []
      - from: ACTIVE
        to: FINALIZED
        trigger: "POST /karting/seasons/{id}/finalize"
        actor: LeagueAdmin
        preconditions:
          - "At least one child RaceEvent in FINALIZED status"
        side_effects:
          - "Final standings become authoritative: GET standings ranks by final_points with calculations.championship_tiebreak (before FINALIZED, ranks use provisional_points)"
      - from: FINALIZED
        to: AWARDS_CONCLUDED
        trigger: "POST /karting/seasons/{id}/conclude-awards"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "Awards banquet held; per-class champion is the rank-1 row of the final standings"
          - "Season locked: no further class/event creation (ERR_INVALID_STATE)"

  - entity: Driver
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "PATCH /karting/drivers/{driver_id} with status=ACTIVE"
        actor: LeagueAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /karting/drivers/{driver_id} with status=SUSPENDED"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "Suspended driver may not create entries or practice bookings"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /karting/drivers/{driver_id} with status=ACTIVE"
        actor: LeagueAdmin
        preconditions: []
        side_effects: []

  - entity: RentalKart
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "PATCH /karting/karts/{kart_id} with status=IN_MAINTENANCE"
        actor: LeagueAdmin
        preconditions:
          - "Kart is not referenced by any EventEntry in {ENTERED, TECH_CHECK, TECH_FAILED, TECH_PASSED, GRID_LOCKED} and has no PracticeBooking in {RESERVED, CHECKED_IN}"
        side_effects: []
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "PATCH /karting/karts/{kart_id} with status=AVAILABLE"
        actor: LeagueAdmin
        preconditions: []
        side_effects: []
      - from: [AVAILABLE, IN_MAINTENANCE]
        to: RETIRED
        trigger: "PATCH /karting/karts/{kart_id} with status=RETIRED"
        actor: LeagueAdmin
        preconditions:
          - "Same no-active-reference precondition as IN_MAINTENANCE"
        side_effects: []

  - entity: RaceEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "POST /karting/events/{id}/open-registration"
        actor: LeagueAdmin
        preconditions:
          - "Parent LeagueSeason.status == ACTIVE (ERR_SEASON_NOT_ACTIVE)"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: IN_PROGRESS
        trigger: "POST /karting/events/{id}/start"
        actor: RaceDirector
        preconditions:
          - "At least one EventEntry in {TECH_PASSED, GRID_LOCKED}"
        side_effects:
          - "Registration closes: entry creation now fails with ERR_EVENT_REGISTRATION_CLOSED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /karting/events/{id}/complete"
        actor: RaceDirector
        preconditions:
          - "Every child RaceSession is in SCORED status"
        side_effects: []
      - from: COMPLETED
        to: FINALIZED
        trigger: "POST /karting/events/{id}/finalize"
        actor: RaceDirector
        preconditions:
          - "No child Incident in {REPORTED, UNDER_REVIEW, APPEALED} (ERR_OPEN_INCIDENTS)"
        side_effects:
          - "All SessionResult rows of the event's sessions: PROVISIONAL/AMENDED -> FINAL"
          - "Event now counts toward standings (rounds_completed includes COMPLETED and FINALIZED)"
      - from: [SCHEDULED, REGISTRATION_OPEN, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /karting/events/{id}/cancel"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "Cascade B hop 1: every child EventEntry in {ENTERED, TECH_CHECK, TECH_FAILED, TECH_PASSED, GRID_LOCKED} -> WITHDRAWN"
          - "Cascade B hop 2: each withdrawn entry with fee_status == PAID -> REFUNDED, recomputing LeagueSeason.collected_fees_cents (= sum of entry_fee_cents over PAID entries)"
          - "Event excluded from standings calculations"

  - entity: EventEntry
    field: status
    initial_state: ENTERED
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: ENTERED
        to: TECH_CHECK
        trigger: "POST /karting/entries/{id}/inspections (first inspection)"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "Then immediately resolves by outcome: PASS -> TECH_PASSED, FAIL -> TECH_FAILED"
      - from: TECH_CHECK
        to: TECH_PASSED
        trigger: "system (inspection outcome == PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TECH_CHECK
        to: TECH_FAILED
        trigger: "system (inspection outcome == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "tech_fail_count += 1"
          - "If tech_fail_count >= TECH_FAIL_DISQUALIFY_THRESHOLD (2): entry -> DISQUALIFIED"
      - from: TECH_FAILED
        to: TECH_CHECK
        trigger: "POST /karting/entries/{id}/inspections (re-inspection)"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "Re-inspection loop: entry may cycle TECH_FAILED -> TECH_CHECK -> TECH_PASSED any number of times until tech_fail_count reaches the threshold"
      - from: [TECH_PASSED, GRID_LOCKED]
        to: TECH_CHECK
        trigger: "POST /karting/entries/{id}/inspections (post-race re-weigh)"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "If outcome FAIL from GRID_LOCKED: entry -> DISQUALIFIED immediately (post-race weight failure)"
      - from: TECH_PASSED
        to: GRID_LOCKED
        trigger: "POST /karting/events/{id}/lock-grid"
        actor: RaceDirector
        preconditions:
          - "fee_status == PAID (ERR_ENTRY_FEE_UNPAID)"
          - "Event status == IN_PROGRESS"
        side_effects:
          - "Applies to all TECH_PASSED entries of the event in one call; any non-WITHDRAWN entry not in TECH_PASSED fails the whole call (ERR_TECH_NOT_PASSED)"
      - from: [ENTERED, TECH_CHECK, TECH_FAILED, TECH_PASSED]
        to: WITHDRAWN
        trigger: "POST /karting/entries/{id}/withdraw or system (event cancelled)"
        actor: "Driver (own entry) or LeagueAdmin or system"
        preconditions:
          - "GRID_LOCKED and DISQUALIFIED entries cannot withdraw (ERR_INVALID_STATE)"
        side_effects:
          - "If fee_status == PAID: fee_status -> REFUNDED and LeagueSeason.collected_fees_cents recomputed"
          - "If entry_type == RENTAL: kart reservation for the event released"
      - from: [TECH_CHECK, TECH_PASSED, GRID_LOCKED]
        to: DISQUALIFIED
        trigger: "system (2nd failed inspection; post-race FAIL from GRID_LOCKED; Incident adjudicated UPHELD with penalty_kind == DISQUALIFICATION)"
        actor: system
        preconditions: []
        side_effects:
          - "All SessionResult rows of this entry in the event: points_awarded -> 0 (finish_position unchanged, no position compression)"
          - "EventEntry.event_points recomputed (-> 0 for this event)"
          - "LeagueSeason standings reflect on next read"

  - entity: RaceSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [SCORED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "PATCH /karting/sessions/{session_id} with status=OPEN"
        actor: RaceDirector
        preconditions:
          - "Parent RaceEvent.status == IN_PROGRESS"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /karting/sessions/{session_id} with status=CLOSED"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "Result submission (POST /sessions/{id}/results) is accepted only while CLOSED"
      - from: CLOSED
        to: SCORED
        trigger: "POST /karting/sessions/{id}/score"
        actor: RaceDirector
        preconditions:
          - "Session CLOSED (ERR_SESSION_NOT_CLOSED from OPEN)"
          - "Every GRID_LOCKED entry of the parent event has a SessionResult row (ERR_RESULTS_INCOMPLETE)"
        side_effects:
          - "computations.session_points evaluated for every result; is_fastest_lap assigned"
          - "EventEntry.event_points recomputed for all entries with results in this session"
          - "Results immutable after SCORED (further POST results -> ERR_INVALID_STATE)"

  - entity: SessionResult
    field: status
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    transitions:
      - from: PROVISIONAL
        to: AMENDED
        trigger: "system (Incident UPHELD with TIME_SECONDS caused a finish_position change for this result)"
        actor: system
        preconditions: []
        side_effects:
          - "points_awarded recomputed after re-rank"
      - from: AMENDED
        to: AMENDED
        trigger: "system (further penalty application or penalty reversal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PROVISIONAL, AMENDED]
        to: FINAL
        trigger: "system (parent RaceEvent finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Incident
    field: status
    initial_state: REPORTED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /karting/incidents/{incident_id}/open-review"
        actor: Steward
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /karting/incidents/{incident_id}/adjudicate with decision=UPHELD"
        actor: Steward
        preconditions:
          - "X-User-ID != reporter_user_id (ERR_SELF_ADJUDICATION)"
          - "penalty_kind == TIME_SECONDS requires incident.session_id's session status == SCORED and parent event in {IN_PROGRESS, COMPLETED}"
          - "penalty_kind == DISQUALIFICATION requires entry in {TECH_CHECK, TECH_PASSED, GRID_LOCKED}"
        side_effects:
          - "Cascade A hop 1 (TIME_SECONDS): SessionResult of the incident entry in the incident session gets penalty_seconds_applied += penalty_seconds"
          - "Cascade A hop 1 (DISQUALIFICATION): entry -> DISQUALIFIED with its side effects"
          - "Cascade A hop 2: all results of the session re-ranked by effective_total_ms = total_time_ms + penalty_seconds_applied*1000 ASC (tie: previous finish_position ASC); finish_position rewritten; changed results -> AMENDED"
          - "Cascade A hop 3: points_awarded recomputed for every result of the session; EventEntry.event_points recomputed; standings reflect on next read"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /karting/incidents/{incident_id}/adjudicate with decision=DISMISSED"
        actor: Steward
        preconditions:
          - "X-User-ID != reporter_user_id (ERR_SELF_ADJUDICATION)"
        side_effects:
          - "Compensation when re-adjudicating after appeal: penalty_seconds_applied -= penalty_seconds on the affected result, re-rank and recompute exactly as the UPHELD cascade, restoring pre-penalty positions and points"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /karting/incidents/{incident_id}/appeal"
        actor: "Driver (must be the incident entry's driver, ERR_NOT_ENTRY_DRIVER)"
        preconditions:
          - "appeal_count < 1 (ERR_APPEAL_LIMIT)"
        side_effects:
          - "appeal_count += 1"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /karting/incidents/{incident_id}/open-review"
        actor: Steward
        preconditions: []
        side_effects: []

  - entity: PracticeBooking
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /karting/practice-bookings/{booking_id}/check-in"
        actor: "Driver (own booking)"
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /karting/practice-bookings/{booking_id}/check-out"
        actor: "Driver (own booking)"
        preconditions: []
        side_effects:
          - "minutes_used = (end_time - start_time) in whole minutes"
          - "fee_cents computed per calculations.practice_billing variant selected by pricing_mode"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /karting/practice-bookings/{booking_id}/cancel"
        actor: "Driver (own booking) or LeagueAdmin"
        preconditions: []
        side_effects:
          - "Kart window released: subsequent overlapping bookings for the same kart are accepted"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: session-create-stale-event
    parent_entity: RaceEvent
    write_endpoint: "POST /karting/events/{id}/sessions"
    occ_field: "expected_event_version"
    description: |
      Creating a RaceSession against a RaceEvent whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just added a session (or otherwise mutated the
      event) and the current writer's view of the event's session lineup is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: result-submit-stale-session
    parent_entity: RaceSession
    write_endpoint: "POST /karting/sessions/{id}/results"
    occ_field: "expected_session_version"
    description: |
      Submitting a result batch against a RaceSession whose version has
      advanced since the client last observed it is rejected. A result batch
      submitted while the session is CLOSED legitimately supersedes the prior
      batch, so the superseding writer must present the current session
      version; a stale version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: class_eligibility
    trigger: "POST /karting/events/{id}/entries"
    algorithm: constraint_propagation
    formula: |
      age_years = floor((RaceEvent.event_date - Driver.date_of_birth) / 365.25 days)
      Eligible iff RaceClass.min_age <= age_years <= RaceClass.max_age.
      Additionally: Driver.license_type == RENTAL forces entry_type == RENTAL;
      entry_type == RENTAL requires RaceClass.rental_kart_allowed == true;
      entry_type == OWNER_DRIVER requires Driver.license_type == OWNER.
    input_set: "The EventEntry being created, its Driver, RaceClass, and parent RaceEvent"
    constants: {}
    precision: "age in whole years, floor"
    variants: []

  - name: weight_compliance
    trigger: "POST /karting/entries/{id}/inspections"
    algorithm: threshold
    formula: |
      outcome = PASS iff measured_combined_weight_kg >= RaceClass.min_combined_weight_kg
      Boundary: exact equality PASSES (>=, not >).
    input_set: "The new TechInspection and the entry's RaceClass"
    constants: {}
    precision: "weights compared as given, 1 decimal place"
    variants: []

  - name: session_points
    trigger: "POST /karting/sessions/{id}/score; re-run for all results of a session on Incident adjudication (UPHELD TIME_SECONDS re-rank, DISMISSED-after-appeal reversal, DISQUALIFICATION)"
    algorithm: aggregation
    formula: |
      For session_type in {PRACTICE, QUALIFYING}: points_awarded = 0 for all results.
      For session_type in {HEAT, MAIN}, per result r:
        base = points_scheme[r.finish_position - 1] if r.finish_position <= len(points_scheme) else 0
        is_fastest_lap: the result with min best_lap_ms in the session; tie -> lowest finish_position wins
        bonus = fastest_lap_bonus_points if (is_fastest_lap AND r.finish_position <= FASTEST_LAP_MAX_POSITION) else 0
        points_awarded = (base + bonus) if entry.status != DISQUALIFIED else 0
      EventEntry.event_points = sum(points_awarded) over the entry's results in HEAT/MAIN sessions of the event.
    input_set: "All SessionResult rows of the session; season's points_scheme and fastest_lap_bonus_points"
    constants:
      FASTEST_LAP_MAX_POSITION: 10
    precision: "integer points, no rounding"
    variants: []

  - name: season_standings
    trigger: "GET /karting/seasons/{id}/standings (computed on read); rank basis pinned at LeagueSeason finalize"
    algorithm: aggregation
    formula: |
      Counted events: child RaceEvents with status in {COMPLETED, FINALIZED} (CANCELLED excluded).
      Per driver d with an entry in class c:
        per-event score e_i = EventEntry.event_points of d's entry in event i (drivers appear once per event)
        provisional_points = sum(e_i) over ALL counted events
        final_points: order the e_i ascending; drop the first drop_rounds values
          (tie at the drop boundary: drop the event with the lower round_number first);
          final_points = sum of the remaining values; dropped_round_numbers = round_numbers dropped
        If drop_rounds >= number of counted events for d: final_points = 0, dropped_round_numbers = all.
      rank: season FINALIZED -> order by final_points using calculations.championship_tiebreak;
            otherwise order by provisional_points DESC, tie -> Driver.created_at ASC.
    input_set: "All EventEntry rows whose event is counted, grouped by (driver_id, class_id)"
    constants: {}
    precision: "integer points"
    variants:
      - name: provisional
        when: "Always computed; rank basis before season FINALIZED"
        difference: "No rounds dropped: provisional_points = sum over all counted events"
      - name: final
        when: "Always computed; becomes the rank basis once season status == FINALIZED"
        difference: "Drops the drop_rounds lowest per-event scores; identical data yields different totals whenever a driver's lowest round score is nonzero"

  - name: championship_tiebreak
    trigger: "Standings ranking when season status == FINALIZED and final_points tie"
    algorithm: weighted_scoring
    formula: |
      Over the driver's COUNTED (non-dropped) events only, using MAIN-session finish_position:
      1. final_points DESC
      2. count of 1st-place MAIN finishes DESC, then 2nd places DESC, then 3rd, ... (countback)
      3. latest_best_round: the highest round_number at which the driver achieved their best
         counted MAIN finish DESC (more recent best result wins)
      4. Driver.created_at ASC (earlier-registered driver wins)
    input_set: "Tied drivers' counted events and their MAIN SessionResult finish positions"
    constants: {}
    precision: "integer comparisons"
    variants: []

  - name: practice_billing
    trigger: "POST /karting/practice-bookings/{booking_id}/check-out"
    algorithm: tiered_pricing
    formula: |
      minutes_used = (end_time - start_time) in whole minutes
      Variant selected by PracticeBooking.pricing_mode:
        FLAT:    fee_cents = FLAT_SESSION_FEE_CENTS
        METERED: fee_cents = round_half_up(minutes_used * RATE_CENTS_PER_MINUTE * (1 + TAX_RATE))
      Rounding order is PINNED: tax+rounding is applied per booking at check-out,
      never over a sum of bookings. Any per-driver/day total is the plain sum of the
      already-rounded per-booking fee_cents values.
    input_set: "The completing PracticeBooking only"
    constants:
      FLAT_SESSION_FEE_CENTS: 4000
      RATE_CENTS_PER_MINUTE: 150
      TAX_RATE: 0.0825
    precision: "integer cents, round_half_up per booking"
    variants:
      - name: flat
        when: "pricing_mode == FLAT"
        difference: "Fixed fee regardless of minutes_used"
      - name: metered
        when: "pricing_mode == METERED"
        difference: "Time-proportional fee with per-booking tax rounding; identical session length yields a different fee than FLAT"

  - name: kart_booked_minutes
    trigger: "PracticeBooking create / cancel (availability read model)"
    algorithm: aggregation
    formula: |
      booked_minutes(kart, day) = sum(end_time - start_time in minutes) over the kart's
      bookings on that day with status in {RESERVED, CHECKED_IN}.
      COMPLETED and CANCELLED bookings contribute 0.
    input_set: "PracticeBooking rows for one kart, status-filtered"
    constants: {}
    precision: "integer minutes"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of LeagueAdmin|RaceDirector|Steward|Driver; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.5 roles; segregation of duties: incident adjudicator != reporter (ERR_SELF_ADJUDICATION); appeal filed only by the incident entry's driver (ERR_NOT_ENTRY_DRIVER); driver-scoped mutations (pay/withdraw/check-in/check-out/cancel booking) only by the owning Driver"
    error_id: "ERR_FORBIDDEN | ERR_SELF_ADJUDICATION | ERR_NOT_ENTRY_DRIVER"
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, enum values valid, end_time > start_time, RENTAL entry includes kart_id, OWNER_DRIVER entry omits kart_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path id and referenced FK exists and belongs to the declared parent scope (class belongs to season, event to season, entry to event, session to event)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_event_version / expected_session_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /karting/events/{id}/sessions; POST /karting/sessions/{id}/results"
  - priority: 6
    category: state
    check: "State-machine preconditions: season ACTIVE for events/registration; event REGISTRATION_OPEN for entries (ERR_EVENT_REGISTRATION_CLOSED); driver ACTIVE for entries/bookings (ERR_DRIVER_NOT_ACTIVE); kart AVAILABLE for entries/bookings (ERR_KART_UNAVAILABLE); event COMPLETED with no open incidents for finalize (ERR_OPEN_INCIDENTS); sessions SCORED for event complete; incident status flow; appeal_count < 1 (ERR_APPEAL_LIMIT); session CLOSED for results; score from CLOSED (ERR_SESSION_NOT_CLOSED); all GRID_LOCKED entries have results (ERR_RESULTS_INCOMPLETE); lock-grid entries TECH_PASSED (ERR_TECH_NOT_PASSED)"
    error_id: "ERR_INVALID_STATE | ERR_SEASON_NOT_ACTIVE | ERR_EVENT_REGISTRATION_CLOSED | ERR_DRIVER_NOT_ACTIVE | ERR_KART_UNAVAILABLE | ERR_OPEN_INCIDENTS | ERR_APPEAL_LIMIT | ERR_SESSION_NOT_CLOSED | ERR_RESULTS_INCOMPLETE | ERR_TECH_NOT_PASSED"
    http_status: 409
    applies_to: "state-transition and guarded endpoints"
  - priority: 7
    category: business_safety
    check: "Class & equipment eligibility: driver age at event_date within [min_age, max_age] (ERR_CLASS_MISMATCH); RENTAL entry only in class with rental_kart_allowed (ERR_RENTAL_NOT_ALLOWED); RENTAL kart's eligible_class_codes contains the entry class code (ERR_KART_CLASS_INELIGIBLE); license_type vs entry_type consistency (ERR_CLASS_MISMATCH)"
    error_id: "ERR_CLASS_MISMATCH | ERR_RENTAL_NOT_ALLOWED | ERR_KART_CLASS_INELIGIBLE"
    http_status: 422
    applies_to: "POST /karting/events/{id}/entries"
  - priority: 8
    category: business_temporal
    check: "Practice booking kart overlap: no existing booking of the same kart with status in {RESERVED, CHECKED_IN} whose half-open window [start_time, end_time) intersects the requested window; touching endpoints (existing.end == new.start or new.end == existing.start) do NOT intersect"
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /karting/practice-bookings"
  - priority: 9
    category: business_constraint
    check: "Uniqueness & capacity: one non-WITHDRAWN entry per (driver, event) (ERR_DUPLICATE_ENTRY); round_number unique per season (ERR_DUPLICATE_ROUND); class code unique per season (ERR_DUPLICATE_CLASS_CODE); at most one result batch row per entry per submission and no second batch while a batch exists without supersede semantics (ERR_DUPLICATE_RESULT); kart not already assigned to a non-WITHDRAWN entry of the same event (ERR_KART_UNAVAILABLE); track aggregate capacity: count of bookings (any kart, status in {RESERVED, CHECKED_IN}) intersecting the requested window must be < TRACK_CAPACITY_KARTS (ERR_TRACK_CAPACITY_EXCEEDED)"
    error_id: "ERR_DUPLICATE_ENTRY | ERR_DUPLICATE_ROUND | ERR_DUPLICATE_CLASS_CODE | ERR_DUPLICATE_RESULT | ERR_KART_UNAVAILABLE | ERR_TRACK_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 10
    category: business_fiscal
    check: "Grid lock requires every non-WITHDRAWN entry's fee_status == PAID"
    error_id: ERR_ENTRY_FEE_UNPAID
    http_status: 402
    applies_to: "POST /karting/events/{id}/lock-grid"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Seasons ---
  - method: POST
    path: "/karting/seasons"
    description: "Create a season (status SCHEDULED, counters 0)"
    roles: [LeagueAdmin]
    code: 201
    input: [name, year, "drop_rounds?", points_scheme, "fastest_lap_bonus_points?"]
    output: LeagueSeason
    side_effects: []
  - method: GET
    path: "/karting/seasons/{season_id}"
    description: "Get season incl. computed rounds_completed and collected_fees_cents"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: LeagueSeason
    side_effects: []
  - method: POST
    path: "/karting/seasons/{id}/activate"
    description: "SCHEDULED -> ACTIVE (requires >= 1 class)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: LeagueSeason
    side_effects: ["increments LeagueSeason.version by 1"]
  - method: POST
    path: "/karting/seasons/{id}/finalize"
    description: "ACTIVE -> FINALIZED; final standings (drop rounds + tiebreak) become the rank basis"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: LeagueSeason
    side_effects: ["increments LeagueSeason.version by 1"]
  - method: POST
    path: "/karting/seasons/{id}/conclude-awards"
    description: "FINALIZED -> AWARDS_CONCLUDED (awards banquet; champions crowned per class)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: LeagueSeason
    side_effects: ["increments LeagueSeason.version by 1"]
  - method: GET
    path: "/karting/seasons/{id}/standings"
    description: "Computed standings rows per driver for the given class: provisional vs final points, dropped rounds, rank"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: [class_id]
    output: "{ season_id: string, class_id: string, rows: array }"
    side_effects: []

  # --- Classes ---
  - method: POST
    path: "/karting/seasons/{id}/classes"
    description: "Create a race class config for the season"
    roles: [LeagueAdmin]
    code: 201
    input: [code, min_age, max_age, min_combined_weight_kg, entry_fee_cents, rental_kart_allowed]
    output: RaceClass
    side_effects: []
  - method: GET
    path: "/karting/seasons/{id}/classes"
    description: "List classes of a season"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceClass[]
    side_effects: []
  - method: GET
    path: "/karting/classes/{class_id}"
    description: "Get one class"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceClass
    side_effects: []

  # --- Drivers ---
  - method: POST
    path: "/karting/drivers"
    description: "Register a driver (status PENDING). Driver role self-registers; LeagueAdmin may register on behalf."
    roles: [LeagueAdmin, Driver]
    code: 201
    input: [full_name, date_of_birth, body_weight_kg, license_type]
    output: Driver
    side_effects: []
  - method: GET
    path: "/karting/drivers/{driver_id}"
    description: "Get a driver"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: PATCH
    path: "/karting/drivers/{driver_id}"
    description: "Driver status transitions: PENDING->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE"
    roles: [LeagueAdmin]
    code: 200
    input: [status]
    output: Driver
    side_effects: ["increments Driver.version by 1"]

  # --- Rental karts ---
  - method: POST
    path: "/karting/karts"
    description: "Add a rental kart (status AVAILABLE)"
    roles: [LeagueAdmin]
    code: 201
    input: [fleet_number, eligible_class_codes]
    output: RentalKart
    side_effects: []
  - method: GET
    path: "/karting/karts/{kart_id}"
    description: "Get a kart"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RentalKart
    side_effects: []
  - method: GET
    path: "/karting/karts"
    description: "List karts; optional status filter; paginated"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RentalKart[]
    side_effects: []
  - method: PATCH
    path: "/karting/karts/{kart_id}"
    description: "Kart status transitions: AVAILABLE<->IN_MAINTENANCE, ->RETIRED"
    roles: [LeagueAdmin]
    code: 200
    input: [status]
    output: RentalKart
    side_effects: ["increments RentalKart.version by 1"]

  # --- Events ---
  - method: POST
    path: "/karting/seasons/{id}/events"
    description: "Create a race event (round) in the season"
    roles: [LeagueAdmin]
    code: 201
    input: [round_number, event_date, track_name]
    output: RaceEvent
    side_effects: []
  - method: GET
    path: "/karting/seasons/{id}/events"
    description: "List events of a season"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceEvent[]
    side_effects: []
  - method: GET
    path: "/karting/events/{event_id}"
    description: "Get an event"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceEvent
    side_effects: []
  - method: POST
    path: "/karting/events/{id}/open-registration"
    description: "SCHEDULED -> REGISTRATION_OPEN (season must be ACTIVE)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: RaceEvent
    side_effects: ["increments RaceEvent.version by 1"]
  - method: POST
    path: "/karting/events/{id}/start"
    description: "REGISTRATION_OPEN -> IN_PROGRESS; closes entry creation"
    roles: [RaceDirector]
    code: 200
    input: []
    output: RaceEvent
    side_effects: ["increments RaceEvent.version by 1"]
  - method: POST
    path: "/karting/events/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED (all sessions SCORED)"
    roles: [RaceDirector]
    code: 200
    input: []
    output: RaceEvent
    side_effects: ["increments RaceEvent.version by 1"]
  - method: POST
    path: "/karting/events/{id}/finalize"
    description: "COMPLETED -> FINALIZED (no open incidents); results -> FINAL"
    roles: [RaceDirector]
    code: 200
    input: []
    output: RaceEvent
    side_effects:
      - "increments RaceEvent.version by 1"
      - "SessionResult rows of the event -> FINAL"
  - method: POST
    path: "/karting/events/{id}/cancel"
    description: "SCHEDULED/REGISTRATION_OPEN/IN_PROGRESS -> CANCELLED; entries WITHDRAWN; paid fees REFUNDED"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: RaceEvent
    side_effects:
      - "increments RaceEvent.version by 1"
      - "Cascade B: entries -> WITHDRAWN; PAID fees -> REFUNDED; LeagueSeason.collected_fees_cents recomputed"
  - method: POST
    path: "/karting/events/{id}/lock-grid"
    description: "All TECH_PASSED entries -> GRID_LOCKED (event IN_PROGRESS; every non-WITHDRAWN entry TECH_PASSED and PAID)"
    roles: [RaceDirector]
    code: 200
    input: []
    output: RaceEvent
    side_effects: ["increments RaceEvent.version by 1"]

  # --- Entries ---
  - method: POST
    path: "/karting/events/{id}/entries"
    description: "Enter a driver into the event (status ENTERED, fee snapshot from class)"
    roles: [LeagueAdmin, Driver]
    code: 201
    input: [driver_id, class_id, entry_type, "kart_id?"]
    output: EventEntry
    side_effects: ["EventEntry.entry_fee_cents := RaceClass.entry_fee_cents; fee_status := UNPAID"]
  - method: GET
    path: "/karting/events/{id}/entries"
    description: "List entries of an event; paginated"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: EventEntry[]
    side_effects: []
  - method: GET
    path: "/karting/entries/{entry_id}"
    description: "Get one entry incl. computed event_points, tech_fail_count"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: EventEntry
    side_effects: []
  - method: GET
    path: "/karting/entries"
    description: "Filtered list of entries across events"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: ["driver_id?", "class_id?", "kart_id?", "limit?", "offset?"]
    output: EventEntry[]
    side_effects: []
  - method: POST
    path: "/karting/entries/{id}/pay"
    description: "fee_status UNPAID -> PAID; LeagueSeason.collected_fees_cents recomputed"
    roles: [LeagueAdmin, Driver]
    code: 200
    input: []
    output: EventEntry
    side_effects: ["increments EventEntry.version by 1", "LeagueSeason.collected_fees_cents += entry_fee_cents"]
  - method: POST
    path: "/karting/entries/{id}/withdraw"
    description: "Entry -> WITHDRAWN (not from GRID_LOCKED/DISQUALIFIED); PAID fee -> REFUNDED"
    roles: [LeagueAdmin, Driver]
    code: 200
    input: []
    output: EventEntry
    side_effects: ["increments EventEntry.version by 1", "if PAID: LeagueSeason.collected_fees_cents -= entry_fee_cents"]

  # --- Technical inspections ---
  - method: POST
    path: "/karting/entries/{id}/inspections"
    description: "Record a weigh-in; computes PASS/FAIL; drives EventEntry tech state machine incl. re-inspection loop and disqualification thresholds"
    roles: [RaceDirector]
    code: 201
    input: [measured_combined_weight_kg, "notes?"]
    output: TechInspection
    side_effects:
      - "EventEntry: ENTERED/TECH_FAILED/TECH_PASSED/GRID_LOCKED -> TECH_CHECK, then PASS -> TECH_PASSED or FAIL -> TECH_FAILED (+tech_fail_count)"
      - "2nd FAIL -> DISQUALIFIED; FAIL from GRID_LOCKED -> DISQUALIFIED"
  - method: GET
    path: "/karting/entries/{id}/inspections"
    description: "List inspections of an entry (append-only)"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: TechInspection[]
    side_effects: []

  # --- Sessions & results ---
  - method: POST
    path: "/karting/events/{id}/sessions"
    description: "Create a session (OCC on event version; event must be IN_PROGRESS)"
    roles: [RaceDirector]
    code: 201
    input: [session_type, sequence, expected_event_version]
    output: RaceSession
    side_effects: ["increments RaceEvent.version by 1"]
  - method: GET
    path: "/karting/events/{id}/sessions"
    description: "List sessions of an event"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceSession[]
    side_effects: []
  - method: GET
    path: "/karting/sessions/{session_id}"
    description: "Get a session"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: RaceSession
    side_effects: []
  - method: PATCH
    path: "/karting/sessions/{session_id}"
    description: "Session transitions: SCHEDULED->OPEN, OPEN->CLOSED"
    roles: [RaceDirector]
    code: 200
    input: [status]
    output: RaceSession
    side_effects: ["increments RaceSession.version by 1"]
  - method: POST
    path: "/karting/sessions/{id}/results"
    description: "Submit the full result batch (supersedes any prior batch while CLOSED; OCC on session version)"
    roles: [RaceDirector]
    code: 201
    input: [results, expected_session_version]
    output: SessionResult[]
    side_effects: ["increments RaceSession.version by 1", "replaces prior batch: previous rows discarded, new rows PROVISIONAL"]
  - method: POST
    path: "/karting/sessions/{id}/score"
    description: "CLOSED -> SCORED; computes is_fastest_lap and points_awarded; recomputes EventEntry.event_points"
    roles: [RaceDirector]
    code: 200
    input: []
    output: RaceSession
    side_effects: ["increments RaceSession.version by 1", "EventEntry.event_points recomputed for all entries in the session"]
  - method: GET
    path: "/karting/sessions/{id}/results"
    description: "List results of a session"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: SessionResult[]
    side_effects: []
  - method: GET
    path: "/karting/entries/{id}/results"
    description: "List results of an entry across sessions"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: SessionResult[]
    side_effects: []

  # --- Incidents ---
  - method: POST
    path: "/karting/events/{id}/incidents"
    description: "Report an incident against an entry in a session (status REPORTED; reporter_user_id := X-User-ID)"
    roles: [RaceDirector, Steward]
    code: 201
    input: [entry_id, session_id, description]
    output: Incident
    side_effects: []
  - method: GET
    path: "/karting/events/{id}/incidents"
    description: "List incidents of an event"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/karting/incidents/{incident_id}"
    description: "Get an incident"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/karting/incidents"
    description: "Filtered list of incidents"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: ["entry_id?", "session_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/karting/incidents/{incident_id}/open-review"
    description: "REPORTED|APPEALED -> UNDER_REVIEW"
    roles: [Steward]
    code: 200
    input: []
    output: Incident
    side_effects: ["increments Incident.version by 1"]
  - method: POST
    path: "/karting/incidents/{incident_id}/adjudicate"
    description: "UNDER_REVIEW -> UPHELD | DISMISSED; segregation of duties enforced; UPHELD applies penalty cascade"
    roles: [Steward]
    code: 200
    input: [decision, "penalty_kind?", "penalty_seconds?"]
    output: Incident
    side_effects:
      - "increments Incident.version by 1"
      - "UPHELD + TIME_SECONDS: penalty_seconds_applied applied; session re-ranked; points and event_points recomputed"
      - "UPHELD + DISQUALIFICATION: entry -> DISQUALIFIED"
      - "DISMISSED after appeal: penalty reversed (compensation)"
  - method: POST
    path: "/karting/incidents/{incident_id}/appeal"
    description: "UPHELD -> APPEALED (max 1 appeal; only the incident entry's driver)"
    roles: [Driver]
    code: 200
    input: []
    output: Incident
    side_effects: ["increments Incident.version by 1", "appeal_count += 1"]

  # --- Practice bookings ---
  - method: POST
    path: "/karting/practice-bookings"
    description: "Book track time with a rental kart (half-open window; kart overlap + track capacity checks)"
    roles: [Driver]
    code: 201
    input: [driver_id, kart_id, start_time, end_time, pricing_mode]
    output: PracticeBooking
    side_effects: []
  - method: GET
    path: "/karting/practice-bookings"
    description: "Filtered list of practice bookings"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: ["driver_id?", "kart_id?", "limit?", "offset?"]
    output: PracticeBooking[]
    side_effects: []
  - method: GET
    path: "/karting/practice-bookings/{booking_id}"
    description: "Get a booking"
    roles: [LeagueAdmin, RaceDirector, Steward, Driver]
    code: 200
    input: []
    output: PracticeBooking
    side_effects: []
  - method: POST
    path: "/karting/practice-bookings/{booking_id}/check-in"
    description: "RESERVED -> CHECKED_IN (own booking)"
    roles: [Driver]
    code: 200
    input: []
    output: PracticeBooking
    side_effects: ["increments PracticeBooking.version by 1"]
  - method: POST
    path: "/karting/practice-bookings/{booking_id}/check-out"
    description: "CHECKED_IN -> COMPLETED; sets minutes_used and fee_cents per pricing_mode"
    roles: [Driver]
    code: 200
    input: []
    output: PracticeBooking
    side_effects: ["increments PracticeBooking.version by 1", "computations.practice_billing evaluated"]
  - method: POST
    path: "/karting/practice-bookings/{booking_id}/cancel"
    description: "RESERVED -> CANCELLED (own booking or LeagueAdmin); kart window released"
    roles: [LeagueAdmin, Driver]
    code: 200
    input: []
    output: PracticeBooking
    side_effects: ["increments PracticeBooking.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or driver-scoped mutation attempted by a non-owner" }
  - { id: ERR_SELF_ADJUDICATION, http: 403, condition: "Steward adjudicating an incident whose reporter_user_id equals their own X-User-ID" }
  - { id: ERR_NOT_ENTRY_DRIVER, http: 403, condition: "Appeal filed by a Driver who is not the incident entry's driver" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, end_time <= start_time, kart_id presence inconsistent with entry_type" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or is out of the declared parent scope" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (invalid from-state for the requested transition)" }
  - { id: ERR_SEASON_NOT_ACTIVE, http: 409, condition: "Season not ACTIVE for event creation / registration opening / class changes" }
  - { id: ERR_EVENT_REGISTRATION_CLOSED, http: 409, condition: "Entry creation attempted while event not in REGISTRATION_OPEN" }
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Driver PENDING or SUSPENDED when entering an event or booking practice" }
  - { id: ERR_KART_UNAVAILABLE, http: 409, condition: "Kart IN_MAINTENANCE/RETIRED, or already assigned to a non-WITHDRAWN entry of the same event" }
  - { id: ERR_CLASS_MISMATCH, http: 422, condition: "Driver age at event_date outside class [min_age, max_age], or license_type inconsistent with entry_type" }
  - { id: ERR_RENTAL_NOT_ALLOWED, http: 422, condition: "RENTAL entry into a class with rental_kart_allowed == false" }
  - { id: ERR_KART_CLASS_INELIGIBLE, http: 422, condition: "Kart's eligible_class_codes does not contain the entry's class code" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Driver already has a non-WITHDRAWN entry in the event" }
  - { id: ERR_DUPLICATE_ROUND, http: 409, condition: "round_number already used in the season" }
  - { id: ERR_DUPLICATE_CLASS_CODE, http: 409, condition: "Class code already exists in the season" }
  - { id: ERR_DUPLICATE_RESULT, http: 409, condition: "Result batch contains two rows for the same entry" }
  - { id: ERR_TECH_NOT_PASSED, http: 409, condition: "lock-grid: a non-WITHDRAWN entry is not in TECH_PASSED" }
  - { id: ERR_ENTRY_FEE_UNPAID, http: 402, condition: "lock-grid: a non-WITHDRAWN entry's fee_status != PAID" }
  - { id: ERR_SESSION_NOT_CLOSED, http: 409, condition: "score attempted while session not CLOSED" }
  - { id: ERR_RESULTS_INCOMPLETE, http: 409, condition: "score attempted before every GRID_LOCKED entry of the event has a result" }
  - { id: ERR_OPEN_INCIDENTS, http: 409, condition: "Event finalize blocked by incidents in REPORTED/UNDER_REVIEW/APPEALED" }
  - { id: ERR_APPEAL_LIMIT, http: 409, condition: "Appeal attempted when appeal_count >= 1" }
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "Practice booking window intersects an existing RESERVED/CHECKED_IN booking of the same kart (half-open semantics)" }
  - { id: ERR_TRACK_CAPACITY_EXCEEDED, http: 409, condition: "Practice booking would push intersecting-window booking count to TRACK_CAPACITY_KARTS or more" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "League operator: seasons, classes, events lifecycle, karts, driver approvals, awards"
    identity: opaque
    exclusive_operations:
      - "POST /karting/seasons, /activate, /finalize, /conclude-awards"
      - "POST /karting/seasons/{id}/classes, /karting/seasons/{id}/events"
      - "POST /karting/karts; PATCH /karting/karts/{id}; PATCH /karting/drivers/{id}"
      - "POST /karting/events/{id}/open-registration, /cancel"
    shared_operations:
      - "POST /karting/drivers (on behalf), POST entries / pay / withdraw, cancel practice bookings"
      - "All GET endpoints"
  - name: RaceDirector
    description: "On-track official: runs sessions, records results and inspections, locks grids, reports incidents"
    identity: opaque
    exclusive_operations:
      - "POST /karting/events/{id}/start, /complete, /finalize, /lock-grid"
      - "POST /karting/events/{id}/sessions; PATCH /karting/sessions/{id}; POST results; POST score"
      - "POST /karting/entries/{id}/inspections"
    shared_operations:
      - "POST /karting/events/{id}/incidents (shared with Steward)"
      - "All GET endpoints"
  - name: Steward
    description: "Judicial official: reviews and adjudicates incidents; may also report; cannot adjudicate own report"
    identity: opaque
    exclusive_operations:
      - "POST /karting/incidents/{id}/open-review, /adjudicate"
    shared_operations:
      - "POST /karting/events/{id}/incidents (shared with RaceDirector)"
      - "All GET endpoints"
  - name: Driver
    description: "Registered driver: self-registration, own entries/fees, practice bookings, appeals"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /karting/practice-bookings and own booking check-in/check-out/cancel"
      - "POST /karting/incidents/{id}/appeal (own entry's incident)"
    shared_operations:
      - "POST /karting/drivers (self-registration), POST entries / pay / withdraw (own)"
      - "All GET endpoints"
