# =============================================================================
# SCAFFOLD.yaml — task_3147_reverse_marketplace_nurse_hiring_employer_application_flow
# Reverse Marketplace Nurse Hiring & Employer Application Flow (Incredible Health)
#
# §1.0–§1.7 only. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8) and corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Reverse Marketplace Nurse Hiring & Employer Application Flow (Incredible Health):
  nurse profile creation with license verification, specialty certifications and
  shift preferences, employer-initiated applications where hospitals apply to
  candidates rather than the reverse, matching by specialty, unit experience and
  geography with candidate response deadlines, interview scheduling with rapid
  time-to-offer targets and employer response service levels, credential
  verification, background screening and onboarding document collection, offer
  acceptance and start-date coordination with unit staffing needs, employer
  subscription or placement fee structures with guarantee periods, candidate
  confidentiality from a current employer.

domain_name: reverse-nurse-marketplace
api_prefix: /marketplace

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: quota-allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse legal full name" }
      - { name: email, type: string, source: input, description: "Login email; unique across nurses" }
      - { name: home_state, type: string, source: input, description: "Two-letter US state of residence" }
      - { name: primary_specialty, type: enum, source: input, description: "ICU | ER | MED_SURG | TELEMETRY | OR | PEDIATRICS | LABOR_DELIVERY | ONCOLOGY" }
      - { name: years_experience, type: integer, source: input, description: "Whole years of RN experience; 0-60" }
      - { name: desired_shift, type: enum, source: input, description: "DAY | NIGHT | ROTATING" }
      - { name: desired_hourly_rate_cents, type: integer, source: input, description: "Minimum acceptable gross hourly rate in cents; >= 2000" }
      - { name: max_commute_miles, type: integer, source: input, description: "Maximum one-way commute in whole miles; 1-500" }
      - { name: current_employer_name, type: string, source: input, description: "Name of the nurse's current employer; empty string if unemployed" }
      - { name: confidentiality_exclusions, type: array, source: input, description: "Array of employer ids the nurse hides their profile from; current employer auto-added at profile activation; default []", default: "[]" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_VERIFICATION | ACTIVE | INACTIVE | HIRED | WITHDRAWN" }
      - { name: license_verified, type: boolean, source: computed, description: "True iff the nurse has exactly one LicenseVerification in VERIFIED whose license_state == home_state and whose expiry_date > clock now; recomputed on every verification transition and clock advance" }
      - { name: active_application_count, type: integer, source: computed, description: "Count of Applications for this nurse in SUBMITTED or UNDER_REVIEW" }

  - name: LicenseVerification
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; the nurse whose license is being verified" }
      - { name: license_number, type: string, source: input, description: "State-issued RN license number; unique per (license_state)" }
      - { name: license_state, type: string, source: input, description: "Two-letter issuing state" }
      - { name: expiry_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) on which the license lapses" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | EXPIRED" }
      - { name: rejection_reason, type: string, source: input, description: "Required only on the reject action; ignored otherwise" }

  - name: Certification
    parent: null
    common_fields: false
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; owning nurse" }
      - { name: cert_code, type: enum, source: input, description: "BLS | ACLS | PALS | CCRN | CEN | RNC | ONC" }
      - { name: expires_on, type: string, source: input, description: "ISO 8601 date; must be strictly after the clock's current date at creation" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Hospital or health-system legal name" }
      - { name: facility_state, type: string, source: input, description: "Two-letter state of the hiring facility" }
      - { name: fee_model, type: enum, source: input, description: "SUBSCRIPTION | PER_PLACEMENT — the billing model this employer is contracted under" }
      - { name: subscription_tier, type: enum, source: input, description: "BASIC | PRO | ENTERPRISE — meaningful only when fee_model == SUBSCRIPTION" }
      - { name: sla_response_hours, type: integer, source: input, description: "Employer response service level in whole hours; 24-168" }
      - { name: guarantee_days, type: integer, source: input, description: "Placement guarantee window in whole days; 30-120" }
      - { name: placement_fee_bps, type: integer, source: input, description: "Placement fee in basis points of annualized salary; 500-3000; meaningful only when fee_model == PER_PLACEMENT" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Refundable credits accrued from guarantee-period refunds; starts at 0; may be negative never" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; owning employer" }
      - { name: specialty, type: enum, source: input, description: "Same enum as Nurse.primary_specialty" }
      - { name: unit_name, type: string, source: input, description: "Hospital unit, e.g. 'ICU-4West'" }
      - { name: required_certs, type: array, source: input, description: "Array of Certification.cert_code values every matched nurse must hold unexpired; may be []" }
      - { name: facility_state, type: string, source: input, description: "Two-letter state where the unit sits; drives geography matching" }
      - { name: distance_from_facility_miles, type: integer, source: input, description: "Facility-relative distance tag used for geography matching; 0-500" }
      - { name: shift, type: enum, source: input, description: "DAY | NIGHT | ROTATING" }
      - { name: offered_hourly_rate_cents, type: integer, source: input, description: "Gross hourly rate offered; >= 2000" }
      - { name: openings_total, type: integer, source: input, description: "Total seats this requisition funds; 1-20" }
      - { name: openings_filled, type: integer, source: computed, description: "Count of Placements for this requisition in GUARANTEE_ACTIVE or COMPLETED; invariant openings_filled <= openings_total" }
      - { name: status, type: enum, source: system, description: "OPEN | PAUSED | FILLED | CLOSED" }

  - name: Match
    parent: null
    common_fields: false
    fields:
      - { name: nurse_id, type: string, source: system, description: "FK -> Nurse.id; matched nurse" }
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; matched requisition" }
      - { name: match_score, type: integer, source: computed, description: "0-100 score from calculation match_score_rule; recomputed on generation" }
      - { name: suppressed, type: boolean, source: computed, description: "True iff the requisition's employer_id appears in the nurse's confidentiality_exclusions at generation time; suppressed matches are persisted but never returned to Employer role" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock timestamp when the match was generated" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: input, description: "FK -> Requisition.id; the requisition the employer is applying the nurse to" }
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; the candidate being applied to" }
      - { name: employer_id, type: string, source: computed, description: "Copied from Requisition.employer_id at creation; immutable thereafter" }
      - { name: proposed_hourly_rate_cents, type: integer, source: input, description: "Employer-proposed gross hourly rate; >= Requisition.offered_hourly_rate_cents" }
      - { name: proposed_shift, type: enum, source: input, description: "DAY | NIGHT | ROTATING — must equal Requisition.shift" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INTERVIEWING | OFFER_EXTENDED | ACCEPTED | DECLINED | WITHDRAWN | EXPIRED" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "SUBMITTED_at + 72h on the logical clock; nurse response deadline" }
      - { name: revision_count, type: integer, source: computed, description: "Number of employer counter-offer revisions; starts at 0; increments on each counter; hard cap 2" }
      - { name: deadline_extended, type: boolean, source: computed, description: "True once a counter extends the response deadline by a further 48h; may only flip once" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; interview belongs to this application" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC start; must be strictly after clock now at scheduling" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC end; ends_at > starts_at; duration 30-240 minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: scheduled_by_employer_at, type: datetime, source: system, description: "Logical-clock timestamp of scheduling; SLA baseline" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; offer is attached to exactly one application" }
      - { name: offered_hourly_rate_cents, type: integer, source: input, description: "Gross hourly rate on the offer; must equal the application's current proposed_hourly_rate_cents at issuance" }
      - { name: start_date, type: string, source: input, description: "ISO 8601 date; must be 14-90 days after the clock's current date at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACCEPTED | DECLINED | RESCINDED | EXPIRED" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "Issued_at + 48h on the logical clock" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }

  - name: Screening
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; one screening per application (unique)" }
      - { name: credential_status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED — independent axis of the parallel state pair" }
      - { name: background_status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED — independent axis of the parallel state pair" }
      - { name: overall_status, type: enum, source: computed, description: "Derived compound: COMPLETE iff credential_status==VERIFIED and background_status==CLEARED; BLOCKED iff either is FAILED or FLAGGED; otherwise IN_PROGRESS" }

  - name: OnboardingDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; document belongs to this application's onboarding packet" }
      - { name: doc_type, type: enum, source: input, description: "I9 | W4 | DIRECT_DEPOSIT | HEALTH_RECORD | SIGNED_CONTRACT" }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPROVED | REJECTED" }
      - { name: review_note, type: string, source: input, description: "Required only on the reject action; ignored otherwise" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: computed, description: "FK -> Application.id; copied from the accepted offer's application" }
      - { name: requisition_id, type: string, source: computed, description: "FK -> Requisition.id; copied from the application" }
      - { name: nurse_id, type: string, source: computed, description: "FK -> Nurse.id; copied from the application" }
      - { name: employer_id, type: string, source: computed, description: "FK -> Employer.id; copied from the application" }
      - { name: hourly_rate_cents, type: integer, source: computed, description: "Copied from the accepted offer's offered_hourly_rate_cents" }
      - { name: annualized_salary_cents, type: integer, source: computed, description: "hourly_rate_cents * 2080 (40h * 52w); computed once at acceptance" }
      - { name: start_date, type: string, source: computed, description: "Copied from the accepted offer's start_date" }
      - { name: guarantee_ends_on, type: string, source: computed, description: "start_date + Employer.guarantee_days days" }
      - { name: status, type: enum, source: system, description: "PENDING_START | GUARANTEE_ACTIVE | COMPLETED | TERMINATED_IN_GUARANTEE" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: computed, description: "FK -> Employer.id; billed employer" }
      - { name: placement_id, type: string, source: computed, description: "FK -> Placement.id; the placement being billed; null for subscription renewal invoices" }
      - { name: invoice_kind, type: enum, source: system, description: "PLACEMENT_FEE | SUBSCRIPTION_RENEWAL" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Provisional amount at issuance; placement fee variant depends on fee_model and guarantee state per placement_fee_rule" }
      - { name: amount_credited_cents, type: integer, source: computed, description: "Cumulative guarantee refunds credited against this invoice; 0 at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_CREDITED | SETTLED | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Nurse
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_VERIFICATION
        trigger: "POST /marketplace/nurses/{id}/submit"
        actor: Candidate
        preconditions:
          - "nurse.status == DRAFT"
          - "nurse has at least one LicenseVerification in PENDING or VERIFIED"
        side_effects:
          - "increments nurse.version by 1"
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "system — fires the moment a LicenseVerification for this nurse enters VERIFIED with license_state == nurse.home_state and expiry_date > clock now"
        actor: system
        preconditions:
          - "license_verified recomputes to true"
        side_effects:
          - "if nurse.current_employer_name is non-empty and an Employer row exists with legal_name == nurse.current_employer_name, that employer's id is appended to nurse.confidentiality_exclusions"
          - "increments nurse.version by 1"
      - from: PENDING_VERIFICATION
        to: DRAFT
        trigger: "system — fires when the nurse's last non-EXPIRED LicenseVerification enters REJECTED and none remain PENDING"
        actor: system
        preconditions: []
        side_effects:
          - "increments nurse.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /marketplace/nurses/{id}/deactivate"
        actor: Candidate
        preconditions:
          - "nurse.status == ACTIVE"
          - "nurse.active_application_count == 0 (no Application in SUBMITTED, UNDER_REVIEW, INTERVIEWING or OFFER_EXTENDED)"
        side_effects:
          - "increments nurse.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /marketplace/nurses/{id}/reactivate"
        actor: Candidate
        preconditions:
          - "nurse.status == INACTIVE"
          - "license_verified == true at reactivation time"
        side_effects:
          - "increments nurse.version by 1"
      - from: ACTIVE
        to: HIRED
        trigger: "system — fires on offer acceptance (see Offer ISSUED_to_ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "all other Applications for this nurse in SUBMITTED or UNDER_REVIEW or INTERVIEWING or OFFER_EXTENDED transition to WITHDRAWN with system actor"
          - "increments nurse.version by 1"
      - from: HIRED
        to: ACTIVE
        trigger: "system — fires when the nurse's Placement enters TERMINATED_IN_GUARANTEE"
        actor: system
        preconditions: []
        side_effects:
          - "increments nurse.version by 1"
      - from: [ACTIVE, INACTIVE]
        to: WITHDRAWN
        trigger: "POST /marketplace/nurses/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "nurse has no Placement in PENDING_START or GUARANTEE_ACTIVE"
        side_effects:
          - "all Applications for this nurse in SUBMITTED or UNDER_REVIEW or INTERVIEWING transition to WITHDRAWN with system actor; any in OFFER_EXTENDED cascade their Offer to RESCINDED"
          - "increments nurse.version by 1"

  - entity: LicenseVerification
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /marketplace/license-verifications/{id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "verification.status == PENDING"
          - "verification.expiry_date > clock current date"
        side_effects:
          - "recompute nurse.license_verified; if it flips true and nurse.status == PENDING_VERIFICATION, trigger Nurse PENDING_VERIFICATION_to_ACTIVE cascade"
          - "increments verification.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /marketplace/license-verifications/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "verification.status == PENDING"
          - "rejection_reason present in request body"
        side_effects:
          - "if no other LicenseVerification for this nurse remains PENDING or VERIFIED and nurse.status == PENDING_VERIFICATION, nurse reverts to DRAFT"
          - "increments verification.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system — fires on any clock advance past expiry_date"
        actor: system
        preconditions:
          - "clock current date >= verification.expiry_date"
        side_effects:
          - "recompute nurse.license_verified; if it flips false while nurse.status == ACTIVE, nurse transitions to INACTIVE"
          - "increments verification.version by 1"

  - entity: Employer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /marketplace/employers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "employer.status == ACTIVE"
        side_effects:
          - "blocks new applications and offer issuance for this employer (ERR_NO_OPENINGS at validation priority 10)"
          - "increments employer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /marketplace/employers/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "employer.status == SUSPENDED"
        side_effects:
          - "increments employer.version by 1"

  - entity: Requisition
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PAUSED
        trigger: "POST /marketplace/requisitions/{id}/pause"
        actor: Employer
        preconditions:
          - "requisition.status == OPEN"
          - "acting employer owns the requisition (X-User-ID == requisition.employer_id)"
        side_effects:
          - "increments requisition.version by 1"
      - from: PAUSED
        to: OPEN
        trigger: "POST /marketplace/requisitions/{id}/resume"
        actor: Employer
        preconditions:
          - "requisition.status == PAUSED"
          - "requisition.openings_filled < requisition.openings_total"
          - "acting employer owns the requisition"
        side_effects:
          - "increments requisition.version by 1"
      - from: OPEN
        to: FILLED
        trigger: "system — fires when openings_filled reaches openings_total (on Placement creation)"
        actor: system
        preconditions: []
        side_effects:
          - "all Applications against this requisition in SUBMITTED or UNDER_REVIEW or INTERVIEWING transition to WITHDRAWN with system actor; any in OFFER_EXTENDED cascade their Offer to RESCINDED"
          - "increments requisition.version by 1"
      - from: FILLED
        to: OPEN
        trigger: "system — fires when a Placement for this requisition enters TERMINATED_IN_GUARANTEE (opening is refunded to the pool)"
        actor: system
        preconditions: []
        side_effects:
          - "increments requisition.version by 1"
      - from: [OPEN, PAUSED, FILLED]
        to: CLOSED
        trigger: "POST /marketplace/requisitions/{id}/close"
        actor: Employer
        preconditions:
          - "no Application against this requisition is in OFFER_EXTENDED"
          - "acting employer owns the requisition"
        side_effects:
          - "all Applications against this requisition in SUBMITTED or UNDER_REVIEW or INTERVIEWING transition to WITHDRAWN with system actor"
          - "increments requisition.version by 1"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /marketplace/applications/{id}/review"
        actor: Candidate
        preconditions:
          - "application.status == SUBMITTED"
          - "acting nurse owns the application (X-User-ID == application.nurse_id)"
          - "clock now < application.response_deadline_at"
        side_effects:
          - "increments application.version by 1"
      - from: UNDER_REVIEW
        to: INTERVIEWING
        trigger: "POST /marketplace/applications/{id}/interviews (first interview scheduled)"
        actor: Employer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "clock now < application.response_deadline_at"
        side_effects:
          - "requisition posture unchanged; application remains deadline-bound"
          - "increments application.version by 1"
      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: "POST /marketplace/applications/{id}/offers (offer issuance)"
        actor: Employer
        preconditions:
          - "application.status == INTERVIEWING"
          - "application has at least one Interview in COMPLETED"
          - "requisition.status == OPEN and requisition.openings_filled < requisition.openings_total"
          - "clock now < application.response_deadline_at"
        side_effects:
          - "increments application.version by 1"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /marketplace/applications/{id}/counter (employer revises terms)"
        actor: Employer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.revision_count < 2"
        side_effects:
          - "application.revision_count += 1"
          - "if application.deadline_extended is false: application.response_deadline_at += 48h and deadline_extended flips true; otherwise deadline unchanged"
          - "increments application.version by 1"
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING]
        to: DECLINED
        trigger: "POST /marketplace/applications/{id}/decline"
        actor: Candidate
        preconditions:
          - "acting nurse owns the application"
        side_effects:
          - "recompute nurse.active_application_count"
          - "increments application.version by 1"
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING]
        to: WITHDRAWN
        trigger: "POST /marketplace/applications/{id}/withdraw (employer) or system cascade (nurse withdraw / requisition fill / requisition close)"
        actor: Employer
        preconditions:
          - "when actor is Employer: acting employer owns application.employer_id"
        side_effects:
          - "any Interview in SCHEDULED for this application transitions to CANCELLED"
          - "recompute nurse.active_application_count"
          - "increments application.version by 1"
      - from: OFFER_EXTENDED
        to: ACCEPTED
        trigger: "POST /marketplace/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "see Offer ISSUED_to_ACCEPTED preconditions"
        side_effects:
          - "see Offer ISSUED_to_ACCEPTED side effects (Placement creation, nurse HIRED, sibling withdrawal)"
      - from: OFFER_EXTENDED
        to: DECLINED
        trigger: "POST /marketplace/offers/{id}/decline"
        actor: Candidate
        preconditions:
          - "acting nurse owns the application"
        side_effects:
          - "the attached Offer transitions to DECLINED"
          - "increments application.version by 1"
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING]
        to: EXPIRED
        trigger: "system — fires on any clock advance that reaches application.response_deadline_at"
        actor: system
        preconditions:
          - "clock now >= application.response_deadline_at"
        side_effects:
          - "any Interview in SCHEDULED transitions to CANCELLED"
          - "recompute nurse.active_application_count"
          - "increments application.version by 1"

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /marketplace/interviews/{id}/complete"
        actor: Employer
        preconditions:
          - "interview.status == SCHEDULED"
          - "clock now >= interview.ends_at"
        side_effects:
          - "increments interview.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /marketplace/interviews/{id}/cancel (employer) or system cascade (application withdraw/expire)"
        actor: Employer
        preconditions:
          - "interview.status == SCHEDULED"
        side_effects:
          - "increments interview.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /marketplace/interviews/{id}/no-show"
        actor: Employer
        preconditions:
          - "interview.status == SCHEDULED"
          - "clock now > interview.ends_at"
        side_effects:
          - "increments interview.version by 1"

  - entity: Offer
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, RESCINDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /marketplace/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "offer.status == ISSUED"
          - "clock now < offer.offer_expires_at"
          - "acting nurse owns offer.application.nurse_id"
          - "application.status == OFFER_EXTENDED"
          - "Screening for this application exists and screening.overall_status == COMPLETE"
          - "an OnboardingDocument with doc_type == SIGNED_CONTRACT and status == APPROVED exists for this application"
          - "requisition.openings_filled < requisition.openings_total"
        side_effects:
          - "Placement created (PENDING_START) copying application linkage and offer terms; annualized_salary_cents computed"
          - "requisition.openings_filled += 1; if openings_filled == openings_total, requisition transitions OPEN_to_FILLED (which itself cascades sibling applications to WITHDRAWN/RESCINDED)"
          - "nurse transitions ACTIVE_to_HIRED (cascades this nurse's other live applications to WITHDRAWN)"
          - "application transitions to ACCEPTED"
          - "Invoice created (ISSUED) per placement_fee_rule PROVISIONAL variant"
          - "increments offer.version by 1"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /marketplace/offers/{id}/decline"
        actor: Candidate
        preconditions:
          - "offer.status == ISSUED"
          - "acting nurse owns offer.application.nurse_id"
        side_effects:
          - "application transitions OFFER_EXTENDED_to_DECLINED"
          - "increments offer.version by 1"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /marketplace/offers/{id}/rescind (employer) or system cascade (requisition FILLED/CLOSED, nurse WITHDRAWN)"
        actor: Employer
        preconditions:
          - "offer.status == ISSUED"
          - "when actor is Employer: acting employer owns application.employer_id"
        side_effects:
          - "application transitions OFFER_EXTENDED to WITHDRAWN"
          - "increments offer.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system — fires on any clock advance that reaches offer.offer_expires_at"
        actor: system
        preconditions:
          - "clock now >= offer.offer_expires_at"
        side_effects:
          - "application transitions OFFER_EXTENDED to EXPIRED"
          - "increments offer.version by 1"

  - entity: Screening
    initial_state: "PENDING/PENDING (credential_status=PENDING, background_status=PENDING — parallel axes)"
    terminal_states: []
    transitions:
      - from: "credential_status: PENDING"
        to: "credential_status: VERIFIED"
        trigger: "POST /marketplace/screenings/{id}/verify-credentials"
        actor: PlatformAdmin
        preconditions:
          - "credential_status == PENDING"
          - "nurse on the parent application holds every cert_code in the requisition's required_certs with expires_on > clock current date"
        side_effects:
          - "recompute screening.overall_status"
          - "increments screening.version by 1"
      - from: "credential_status: PENDING"
        to: "credential_status: FAILED"
        trigger: "POST /marketplace/screenings/{id}/fail-credentials"
        actor: PlatformAdmin
        preconditions:
          - "credential_status == PENDING"
        side_effects:
          - "recompute screening.overall_status (becomes BLOCKED)"
          - "if the application's offer is ISSUED, the offer transitions to RESCINDED and the application to WITHDRAWN"
          - "increments screening.version by 1"
      - from: "background_status: PENDING"
        to: "background_status: CLEARED"
        trigger: "POST /marketplace/screenings/{id}/clear-background"
        actor: PlatformAdmin
        preconditions:
          - "background_status == PENDING"
        side_effects:
          - "recompute screening.overall_status"
          - "increments screening.version by 1"
      - from: "background_status: PENDING"
        to: "background_status: FLAGGED"
        trigger: "POST /marketplace/screenings/{id}/flag-background"
        actor: PlatformAdmin
        preconditions:
          - "background_status == PENDING"
        side_effects:
          - "recompute screening.overall_status (becomes BLOCKED)"
          - "if the application's offer is ISSUED, the offer transitions to RESCINDED and the application to WITHDRAWN"
          - "increments screening.version by 1"

  - entity: OnboardingDocument
    initial_state: RECEIVED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /marketplace/onboarding-documents/{id}/approve"
        actor: Employer
        preconditions:
          - "document.status == RECEIVED"
          - "acting employer owns document.application.employer_id"
        side_effects:
          - "increments document.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /marketplace/onboarding-documents/{id}/reject"
        actor: Employer
        preconditions:
          - "document.status == RECEIVED"
          - "review_note present in request body"
          - "acting employer owns document.application.employer_id"
        side_effects:
          - "increments document.version by 1"

  - entity: Placement
    initial_state: PENDING_START
    terminal_states: [COMPLETED, TERMINATED_IN_GUARANTEE]
    transitions:
      - from: PENDING_START
        to: GUARANTEE_ACTIVE
        trigger: "system — fires on any clock advance that reaches placement.start_date"
        actor: system
        preconditions:
          - "clock current date >= placement.start_date"
        side_effects:
          - "increments placement.version by 1"
      - from: GUARANTEE_ACTIVE
        to: COMPLETED
        trigger: "system — fires on any clock advance past placement.guarantee_ends_on"
        actor: system
        preconditions:
          - "clock current date > placement.guarantee_ends_on"
        side_effects:
          - "linked PLACEMENT_FEE invoice transitions to SETTLED (provisional fee becomes final; no refund possible)"
          - "increments placement.version by 1"
      - from: [PENDING_START, GUARANTEE_ACTIVE]
        to: TERMINATED_IN_GUARANTEE
        trigger: "POST /marketplace/placements/{id}/terminate"
        actor: Employer
        preconditions:
          - "placement.status in {PENDING_START, GUARANTEE_ACTIVE}"
          - "clock current date <= placement.guarantee_ends_on"
          - "acting employer owns placement.employer_id"
        side_effects:
          - "requisition.openings_filled -= 1; if requisition.status == FILLED it transitions FILLED_to_OPEN"
          - "nurse transitions HIRED_to_ACTIVE"
          - "linked PLACEMENT_FEE invoice: amount_credited_cents set per placement_fee_rule GUARANTEE_REFUND variant; invoice transitions to PARTIALLY_CREDITED (or VOID if fully credited); employer.credit_balance_cents increased by the credited amount"
          - "increments placement.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /marketplace/invoices/{id}/settle or system (placement COMPLETED)"
        actor: Employer
        preconditions:
          - "invoice.status in {ISSUED, PARTIALLY_CREDITED}"
        side_effects:
          - "employer.credit_balance_cents decreased by min(credit_balance_cents, amount_due_cents - amount_credited_cents) when the employer applies credit at settle time"
          - "increments invoice.version by 1"
      - from: ISSUED
        to: PARTIALLY_CREDITED
        trigger: "system — fires on guarantee refund (Placement TERMINATED_IN_GUARANTEE) when 0 < refund < amount_due_cents"
        actor: system
        preconditions: []
        side_effects:
          - "increments invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system — fires on guarantee refund when refund == amount_due_cents (placement terminated in PENDING_START before start_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: application-create-stale-nurse
    parent_entity: Nurse
    write_endpoint: "POST /marketplace/applications"
    occ_field: "expected_nurse_version"
    description: |
      Creating an Application against a Nurse whose version has advanced since
      the employer last observed the nurse is rejected. This captures the case
      where another employer has just applied to the same nurse (each
      application legitimately raises the nurse's active_application_count and
      the second employer's view of the nurse is stale).
    error_id: ERR_STALE_NURSE_VERSION
    http_status: 412
  - rule_id: offer-issue-stale-requisition
    parent_entity: Requisition
    write_endpoint: "POST /marketplace/applications/{id}/offers"
    occ_field: "expected_requisition_version"
    description: |
      Issuing an Offer against a Requisition whose version has advanced since
      the employer last observed it is rejected. This captures the case where
      a sibling application was accepted, filling the last opening, between
      the employer's read of the requisition and this issuance.
    error_id: ERR_STALE_REQUISITION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: match_score_rule
    trigger: "POST /marketplace/requisitions/{id}/generate-matches"
    algorithm: weighted_scoring
    formula: |
      candidate pool: nurses with status == ACTIVE, license_verified == true,
      primary_specialty == requisition.specialty, and employer_id NOT IN
      nurse.confidentiality_exclusions (those are still scored but persisted
      with suppressed = true and excluded from Employer-visible reads).
      score = 0
      + 40 if nurse.home_state == requisition.facility_state else 0
      + 25 * min(nurse.years_experience, 10) / 10            # experience ramp, capped at 10 years
      + 20 if nurse.desired_shift == requisition.shift
        else (10 if nurse.desired_shift == ROTATING or requisition.shift == ROTATING else 0)
      + 15 if nurse.max_commute_miles >= requisition.distance_from_facility_miles else 0
      - 20 if requisition.required_certs non-empty and nurse lacks any unexpired required cert (hard penalty, not exclusion)
      clamp score into [0, 100]; final = round_half_up(score) as integer
      ranking for the returned list: match_score DESC, then nurse.created_at ASC;
      ties beyond that are impossible by construction (created_at unique).
    input_set: "ACTIVE, license-verified nurses of the requisition's specialty; includes suppressed (confidentiality-excluded) nurses, flagged but retained"
    constants:
      GEO_WEIGHT: 40
      EXP_WEIGHT: 25
      EXP_CAP_YEARS: 10
      SHIFT_WEIGHT: 20
      SHIFT_PARTIAL: 10
      COMMUTE_WEIGHT: 15
      CERT_PENALTY: -20
    precision: "integer score, round_half_up at the final step only (no intermediate rounding)"
    variants:
      - name: STRICT
        when: "requisition.required_certs is non-empty — the candidate set EXCLUDES nurses missing any unexpired required cert instead of penalizing them"
        difference: "STRICT filters the pool before scoring; base variant penalizes by -20 and keeps the nurse ranked"
      - name: BASE
        when: "requisition.required_certs is empty"
        difference: "penalty term is 0 because required_certs is empty"

  - name: unit_interview_capacity_rule
    trigger: "POST /marketplace/applications/{id}/interviews"
    algorithm: interval_merge
    formula: |
      Aggregate-capacity semantics (DIFFERENT from interview_overlap_rule's
      per-nurse buffered half-open rule): for the requisition's unit
      (facility_state, unit_name pair), a calendar day D accepts at most 6
      interview-starts across all applications of all requisitions sharing
      that (facility_state, unit_name). The day's window is the CLOSED-CLOSED
      interval [00:00, 23:59] of D on the logical clock — an interview
      starting at exactly 23:59 counts toward that day, and an interview
      starting at exactly 00:00 counts toward the new day, not the previous.
      Reject when the target day already carries 6 interview-starts. Unlike
      the per-nurse rule there is no buffer and no interval arithmetic — only
      a start-day bucket count against an inclusive day boundary.
    input_set: "SCHEDULED and COMPLETED interviews whose starts_at calendar day equals the new interview's start day, across every application of every requisition with the same (facility_state, unit_name)"
    constants:
      MAX_UNIT_INTERVIEWS_PER_DAY: 6
    precision: "calendar-day bucketing on logical-clock UTC; day boundary inclusive on both ends of the closed day window"

  - name: response_deadline_rule
    trigger: "application creation and employer counter"
    algorithm: forward_looking
    formula: |
      On creation: response_deadline_at = submitted_at + 72h (logical clock).
      On counter: if deadline_extended is false, response_deadline_at += 48h and
      deadline_extended flips true; a second counter leaves the deadline
      unchanged but still increments revision_count (cap 2).
      Expiry check on clock advance: application in SUBMITTED/UNDER_REVIEW/
      INTERVIEWING with clock now >= response_deadline_at transitions to EXPIRED.
      Boundary: now == response_deadline_at expires the application (>=).
    input_set: "the single application under mutation"
    constants:
      INITIAL_DEADLINE_HOURS: 72
      COUNTER_EXTENSION_HOURS: 48
      MAX_REVISIONS: 2
    precision: "timestamps at millisecond precision; comparison uses >="

  - name: interview_overlap_rule
    trigger: "POST /marketplace/applications/{id}/interviews"
    algorithm: interval_merge
    formula: |
      For the nurse on the parent application, collect all Interviews in
      SCHEDULED status across ALL of that nurse's applications.
      Reject when the new interval [starts_at, ends_at) overlaps any existing
      [s, e) after expanding each existing interval by a 30-minute buffer on
      BOTH sides: overlap iff starts_at < e + 30min AND s - 30min < ends_at.
      Adjacency is allowed only when the gap between the new interval and the
      buffered existing interval is >= 0 — i.e. new.starts_at == existing
      .ends_at + 30min exactly is ACCEPTED (half-open, buffered semantics).
      Duration check (separate): 30 <= (ends_at - starts_at) minutes <= 240.
    input_set: "SCHEDULED interviews of the same nurse across all applications (not just this one)"
    constants:
      BUFFER_MINUTES: 30
      MIN_DURATION_MINUTES: 30
      MAX_DURATION_MINUTES: 240
    precision: "millisecond timestamps; comparisons strict on the buffered half-open form"

  - name: shift_window_overlap_rule
    trigger: "POST /marketplace/requisitions (creation-time validation) and POST /marketplace/nurses (profile validation)"
    algorithm: interval_merge
    formula: |
      A requisition whose shift is DAY occupies the closed interval
      [07:00, 19:00]; NIGHT occupies [19:00, 07:00) wrapping midnight (half-
      open at the wrap: 19:00 belongs to NIGHT, 07:00 belongs to DAY);
      ROTATING occupies both windows and therefore overlaps everything.
      A nurse whose desired_shift is ROTATING matches any requisition shift;
      DAY and NIGHT are treated as NON-overlapping for preference scoring
      partial credit (see match_score_rule SHIFT_PARTIAL).
      The two interval semantics differ deliberately: DAY is closed-closed,
      NIGHT is half-open across the midnight wrap.
    input_set: "the shift enums on nurse profile and requisition"
    constants:
      DAY_START: "07:00"
      DAY_END: "19:00"
      NIGHT_START: "19:00"
      NIGHT_END: "07:00"
    precision: "minute granularity; DAY boundary endpoints inclusive, NIGHT start inclusive / end exclusive"

  - name: placement_fee_rule
    trigger: "offer acceptance (PROVISIONAL) and placement termination-in-guarantee (GUARANTEE_REFUND)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL (at Invoice creation on offer acceptance) — pinned
      evaluation order, because the tier lookup and the salary derivation
      form a circular-looking pair: the provisional fee must exist before the
      guarantee window can later refund a fraction of it, while the fee is
      computed from a salary that is itself only well-defined on the
      Placement row created by the same accept.
        step 1: placement.annualized_salary_cents = offer.hourly_rate_cents * 2080
                (40h * 52w; computed once, stored on the Placement row — the
                Placement, not the Offer, is the billable source of truth
                because the Offer row may be terminal-locked from further
                mutation)
        step 2: if employer.fee_model == PER_PLACEMENT:
                  amount_due_cents = round_half_up(annualized_salary_cents * employer.placement_fee_bps / 10000)
                else (SUBSCRIPTION): tiered flat fee by subscription_tier:
                  BASIC:      2500000 cents
                  PRO:        2000000 cents
                  ENTERPRISE: 1500000 cents
        step 3: invoice.amount_due_cents set to step-2 result; invoice issued
      GUARANTEE_REFUND (at TERMINATED_IN_GUARANTEE) — nested rounding, pinned
      order:
        days_served = max(0, (clock current date - placement.start_date) in whole days)
        if placement was terminated while PENDING_START: refund_fraction_numerator = employer.guarantee_days
        else: refund_fraction_numerator = max(0, employer.guarantee_days - days_served)
        rounding order pinned: refund_cents =
          round_half_up(invoice.amount_due_cents * refund_fraction_numerator / employer.guarantee_days)
          — round the final quotient ONCE; do NOT round the intermediate
          fraction (rounding fraction first yields different cents).
        invoice.amount_credited_cents += refund_cents;
        invoice transitions VOID iff refund_cents == amount_due_cents else PARTIALLY_CREDITED;
        employer.credit_balance_cents += refund_cents.
    input_set: "the placement, its invoice, its employer"
    constants:
      HOURS_PER_YEAR: 2080
      BASIC_FEE_CENTS: 2500000
      PRO_FEE_CENTS: 2000000
      ENTERPRISE_FEE_CENTS: 1500000
    precision: "integer cents, round_half_up applied to the product only"
    variants:
      - name: PROVISIONAL
        when: "invoice issuance at offer acceptance"
        difference: "full fee billed up-front; refund path not yet evaluated"
      - name: GUARANTEE_REFUND
        when: "placement terminated on or before guarantee_ends_on"
        difference: "credits a prorated fraction of the same invoice; identical inputs (fee, dates) produce a different observable amount than PROVISIONAL alone"

  - name: employer_sla_breach_rule
    trigger: "computed read GET /marketplace/requisitions/{id}/sla-report"
    algorithm: threshold
    formula: |
      For every Application against the requisition whose status left
      SUBMITTED, measure employer_first_action_hours = hours from application
      creation to the EARLIEST of (first interview scheduled_at, first counter,
      offer issued_at, employer withdraw) on the logical clock.
      SLA breach count = applications where employer_first_action_hours >
      employer.sla_response_hours. Boundary: exactly == sla_response_hours is
      NOT a breach (>).
      time_to_offer_hours for accepted placements = hours from application
      creation to offer issued_at; the report's rapid_offer_target_met is true
      iff time_to_offer_hours <= 120 for the accepted application.
    input_set: "all applications for the requisition that have left SUBMITTED, plus the accepted placement if any"
    constants:
      RAPID_OFFER_TARGET_HOURS: 120
    precision: "whole hours, truncated toward zero (floor); boundary comparisons strict as noted"

  - name: openings_conservation_rule
    trigger: "every mutation touching Placement or Requisition"
    algorithm: aggregation
    formula: |
      INVARIANT: for every requisition,
        openings_filled == count(Placements of this requisition with status in
        {PENDING_START, GUARANTEE_ACTIVE, COMPLETED})
      and 0 <= openings_filled <= openings_total.
      TERMINATED_IN_GUARANTEE placements are EXCLUDED — the seat returns to the
      pool (FILLED_to_OPEN) and the invariant re-balances on the same request.
    input_set: "placements of one requisition"
    precision: "integer counts; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.7; for ownership-scoped endpoints, X-User-ID matches the owning entity (nurse_id / employer_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path and body referenced ids exist, validated left-to-right (nurse, employer, requisition, application, interview, offer, screening, document, placement, invoice)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 5
    category: business_temporal
    check: "logical-clock deadline checks: application response_deadline_at not reached for review/interview/counter/offer actions; offer_expires_at not reached for accept; interview ends_at reached for complete"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "application review/interview/counter/offer endpoints, offer accept, interview complete"
  - priority: 6
    category: business_safety
    check: "confidentiality: an employer in the nurse's confidentiality_exclusions cannot create an Application naming that nurse; the suppressed-match filter applies to all employer-visible match reads"
    error_id: ERR_CANDIDATE_CONFIDENTIAL
    http_status: 403
    applies_to: "POST /marketplace/applications, GET match endpoints (filter, not error)"
  - priority: 7
    category: business_referential
    check: "credential gates: application requires nurse ACTIVE + license_verified; offer accept requires screening.overall_status == COMPLETE and an APPROVED SIGNED_CONTRACT document"
    error_id: ERR_CREDENTIALS_INCOMPLETE
    http_status: 422
    applies_to: "POST /marketplace/applications, POST /marketplace/offers/{id}/accept"
  - priority: 8
    category: business_constraint
    check: "matching-field constraints: proposed_shift == requisition.shift; proposed_hourly_rate_cents >= requisition.offered_hourly_rate_cents; offer rate == application current proposed rate; start_date within 14-90 days; interview duration 30-240 min; revision_count < 2"
    error_id: ERR_TERMS_MISMATCH
    http_status: 422
    applies_to: "application create/counter, offer issue, interview schedule"
  - priority: 9
    category: business_constraint
    check: "temporal overlap and capacity: interview does not collide with the nurse's other SCHEDULED interviews under the buffered half-open rule (interview_overlap_rule); unit day-capacity under the closed-day bucket rule not exceeded (unit_interview_capacity_rule)"
    error_id: ERR_INTERVIEW_CONFLICT
    http_status: 409
    applies_to: "POST /marketplace/applications/{id}/interviews"
  - priority: 9.5
    category: business_constraint
    check: "unit interview day-capacity: the target calendar day already carries MAX_UNIT_INTERVIEWS_PER_DAY interview-starts for the (facility_state, unit_name) bucket"
    error_id: ERR_UNIT_DAY_CAPACITY
    http_status: 409
    applies_to: "POST /marketplace/applications/{id}/interviews"
  - priority: 10
    category: business_fiscal
    check: "quota: requisition has openings remaining (openings_filled < openings_total) for offer issuance and offer acceptance; employer.status == ACTIVE"
    error_id: ERR_NO_OPENINGS
    http_status: 409
    applies_to: "offer issue, offer accept"
  - priority: 11
    category: business_fiscal
    check: "duplicate guards: one Screening per application; one non-terminal Offer per application; unique nurse email; unique license_number per license_state"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "screening create, offer issue, nurse create, license-verification create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, declared per §1.5 priority ladder) ---
  - method: POST
    path: "/marketplace/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock fires every due system transition in deterministic order: license expirations first, then application deadline expirations, then offer expirations, then placement start/guarantee transitions; each fires its documented cascades."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, fired_transitions: integer }"
    side_effects: ["fires due system transitions per state machines"]

  # --- Nurse ---
  - method: POST
    path: "/marketplace/nurses"
    description: "Create nurse profile (DRAFT)"
    roles: [Candidate]
    code: 201
    input: [full_name, email, home_state, primary_specialty, years_experience, desired_shift, desired_hourly_rate_cents, max_commute_miles, current_employer_name, "confidentiality_exclusions?"]
    output: Nurse
    side_effects: ["nurse created in DRAFT, version 1"]
  - method: GET
    path: "/marketplace/nurses/{id}"
    description: "Read nurse profile. Employer role sees the profile only if the acting employer is not in the nurse's confidentiality_exclusions and the nurse is not DRAFT or WITHDRAWN; otherwise 404."
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Nurse
    side_effects: []
  - method: GET
    path: "/marketplace/nurses"
    description: "List nurses with pagination; Employer sees only ACTIVE nurses not excluding them"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: ["status?", "primary_specialty?", "limit?", "offset?"]
    output: "Nurse[]"
    side_effects: []
  - method: POST
    path: "/marketplace/nurses/{id}/submit"
    description: "Submit profile for verification (DRAFT -> PENDING_VERIFICATION)"
    roles: [Candidate]
    code: 200
    input: []
    output: Nurse
    side_effects: ["nurse transition per state machine"]
  - method: POST
    path: "/marketplace/nurses/{id}/deactivate"
    description: "Deactivate an ACTIVE nurse with no live applications"
    roles: [Candidate]
    code: 200
    input: []
    output: Nurse
    side_effects: ["nurse transition per state machine"]
  - method: POST
    path: "/marketplace/nurses/{id}/reactivate"
    description: "Reactivate an INACTIVE nurse whose license is still verified"
    roles: [Candidate]
    code: 200
    input: []
    output: Nurse
    side_effects: ["nurse transition per state machine"]
  - method: POST
    path: "/marketplace/nurses/{id}/withdraw"
    description: "Permanently withdraw a nurse; cascades live applications"
    roles: [Candidate]
    code: 200
    input: []
    output: Nurse
    side_effects: ["cascade per Nurse state machine"]
  - method: GET
    path: "/marketplace/nurses/{id}/license-verifications"
    description: "List license verifications for a nurse"
    roles: [Candidate, PlatformAdmin]
    code: 200
    input: []
    output: "LicenseVerification[]"
    side_effects: []
  - method: GET
    path: "/marketplace/nurses/{id}/certifications"
    description: "List certifications for a nurse"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: "Certification[]"
    side_effects: []
  - method: GET
    path: "/marketplace/nurses/{id}/applications"
    description: "List applications naming this nurse"
    roles: [Candidate, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: GET
    path: "/marketplace/nurses/{id}/matches"
    description: "List generated Match rows naming this nurse (reverse reachability for Match.nurse_id); includes suppressed rows for Candidate and PlatformAdmin"
    roles: [Candidate, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Match[]"
    side_effects: []

  # --- LicenseVerification ---
  - method: POST
    path: "/marketplace/license-verifications"
    description: "Submit a license for verification (PENDING)"
    roles: [Candidate]
    code: 201
    input: [nurse_id, license_number, license_state, expiry_date]
    output: LicenseVerification
    side_effects: []
  - method: GET
    path: "/marketplace/license-verifications/{id}"
    description: "Read one verification"
    roles: [Candidate, PlatformAdmin]
    code: 200
    input: []
    output: LicenseVerification
    side_effects: []
  - method: POST
    path: "/marketplace/license-verifications/{id}/verify"
    description: "Mark a PENDING verification VERIFIED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LicenseVerification
    side_effects: ["nurse license_verified recompute + possible nurse activation cascade"]
  - method: POST
    path: "/marketplace/license-verifications/{id}/reject"
    description: "Reject a PENDING verification"
    roles: [PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: LicenseVerification
    side_effects: ["possible nurse revert to DRAFT"]

  # --- Certification ---
  - method: POST
    path: "/marketplace/certifications"
    description: "Attach a certification to a nurse (immutable row)"
    roles: [Candidate]
    code: 201
    input: [nurse_id, cert_code, expires_on]
    output: Certification
    side_effects: []
  - method: GET
    path: "/marketplace/certifications/{id}"
    description: "Read one certification"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: []

  # --- Employer ---
  - method: POST
    path: "/marketplace/employers"
    description: "Register an employer (ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, facility_state, fee_model, subscription_tier, sla_response_hours, guarantee_days, placement_fee_bps]
    output: Employer
    side_effects: ["credit_balance_cents = 0"]
  - method: GET
    path: "/marketplace/employers/{id}"
    description: "Read employer"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: []
  - method: GET
    path: "/marketplace/employers/{id}/requisitions"
    description: "List an employer's requisitions"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Requisition[]"
    side_effects: []
  - method: GET
    path: "/marketplace/employers/{id}/invoices"
    description: "List an employer's invoices"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/marketplace/employers/{id}/suspend"
    description: "Suspend an ACTIVE employer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["blocks new applications and offer issuance per ERR_NO_OPENINGS"]
  - method: POST
    path: "/marketplace/employers/{id}/reinstate"
    description: "Reinstate a SUSPENDED employer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # --- Requisition ---
  - method: POST
    path: "/marketplace/requisitions"
    description: "Create a requisition (OPEN)"
    roles: [Employer]
    code: 201
    input: [employer_id, specialty, unit_name, required_certs, facility_state, distance_from_facility_miles, shift, offered_hourly_rate_cents, openings_total]
    output: Requisition
    side_effects: ["openings_filled = 0"]
  - method: GET
    path: "/marketplace/requisitions/{id}"
    description: "Read requisition"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Requisition
    side_effects: []
  - method: POST
    path: "/marketplace/requisitions/{id}/pause"
    description: "Pause an OPEN requisition"
    roles: [Employer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["requisition transition"]
  - method: POST
    path: "/marketplace/requisitions/{id}/resume"
    description: "Resume a PAUSED requisition"
    roles: [Employer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["requisition transition"]
  - method: POST
    path: "/marketplace/requisitions/{id}/close"
    description: "Close a requisition; cascades live applications"
    roles: [Employer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["cascade per Requisition state machine"]
  - method: POST
    path: "/marketplace/requisitions/{id}/generate-matches"
    description: "Generate Match rows for this requisition per match_score_rule"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: "Match[]"
    side_effects: ["Match rows created (idempotent per requisition generation: prior non-suppressed Match rows for this requisition are replaced)"]
  - method: GET
    path: "/marketplace/requisitions/{id}/matches"
    description: "List generated matches ranked per match_score_rule; Employer role never sees suppressed rows"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: ["include_suppressed?", "limit?", "offset?"]
    output: "Match[]"
    side_effects: []
  - method: GET
    path: "/marketplace/requisitions/{id}/sla-report"
    description: "Computed SLA report per employer_sla_breach_rule"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: "{ breach_count: integer, evaluated_count: integer, rapid_offer_target_met: boolean }"
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/marketplace/applications"
    description: "Employer initiates an application to a nurse (reverse marketplace). OCC-guarded on the nurse's version."
    roles: [Employer]
    code: 201
    input: [requisition_id, nurse_id, proposed_hourly_rate_cents, proposed_shift, expected_nurse_version]
    output: Application
    side_effects:
      - "application created SUBMITTED; response_deadline_at = now + 72h"
      - "increments nurse.version by 1"
      - "recompute nurse.active_application_count"
  - method: GET
    path: "/marketplace/applications/{id}"
    description: "Read application"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/marketplace/applications"
    description: "Filtered list of applications"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: ["nurse_id?", "employer_id?", "requisition_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: POST
    path: "/marketplace/applications/{id}/review"
    description: "Nurse moves SUBMITTED -> UNDER_REVIEW"
    roles: [Candidate]
    code: 200
    input: []
    output: Application
    side_effects: ["application transition"]
  - method: POST
    path: "/marketplace/applications/{id}/counter"
    description: "Employer revises proposed terms; extends deadline once"
    roles: [Employer]
    code: 200
    input: [proposed_hourly_rate_cents, "proposed_shift?"]
    output: Application
    side_effects: ["revision_count += 1; deadline extension per response_deadline_rule"]
  - method: POST
    path: "/marketplace/applications/{id}/decline"
    description: "Nurse declines an application (or the attached offer via offer decline)"
    roles: [Candidate]
    code: 200
    input: []
    output: Application
    side_effects: ["application transition; recompute nurse.active_application_count"]
  - method: POST
    path: "/marketplace/applications/{id}/withdraw"
    description: "Employer withdraws an application"
    roles: [Employer]
    code: 200
    input: []
    output: Application
    side_effects: ["interview cascade per state machine"]
  - method: GET
    path: "/marketplace/applications/{id}/interviews"
    description: "List interviews for an application"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: "Interview[]"
    side_effects: []
  - method: GET
    path: "/marketplace/applications/{id}/offers"
    description: "List offers for an application (0..n; at most one non-terminal)"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: "Offer[]"
    side_effects: []
  - method: GET
    path: "/marketplace/applications/{id}/screenings"
    description: "List screenings for an application (0..1)"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: "Screening[]"
    side_effects: []
  - method: GET
    path: "/marketplace/applications/{id}/onboarding-documents"
    description: "List onboarding documents for an application"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: "OnboardingDocument[]"
    side_effects: []

  # --- Interview ---
  - method: POST
    path: "/marketplace/applications/{id}/interviews"
    description: "Schedule an interview; moves application UNDER_REVIEW -> INTERVIEWING on first schedule; enforces buffered overlap rule"
    roles: [Employer]
    code: 201
    input: [starts_at, ends_at]
    output: Interview
    side_effects: ["application may transition to INTERVIEWING"]
  - method: GET
    path: "/marketplace/interviews/{id}"
    description: "Read interview"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: POST
    path: "/marketplace/interviews/{id}/complete"
    description: "Mark a SCHEDULED interview COMPLETED once its window has passed"
    roles: [Employer]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: POST
    path: "/marketplace/interviews/{id}/cancel"
    description: "Cancel a SCHEDULED interview"
    roles: [Employer]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: POST
    path: "/marketplace/interviews/{id}/no-show"
    description: "Mark a SCHEDULED interview NO_SHOW once its window has passed"
    roles: [Employer]
    code: 200
    input: []
    output: Interview
    side_effects: []

  # --- Offer ---
  - method: POST
    path: "/marketplace/applications/{id}/offers"
    description: "Issue an offer on an INTERVIEWING application. OCC-guarded on the requisition's version."
    roles: [Employer]
    code: 201
    input: [offered_hourly_rate_cents, start_date, expected_requisition_version]
    output: Offer
    side_effects:
      - "offer created ISSUED; offer_expires_at = now + 48h"
      - "application transitions to OFFER_EXTENDED"
      - "increments requisition.version by 1"
  - method: GET
    path: "/marketplace/offers/{id}"
    description: "Read offer"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: POST
    path: "/marketplace/offers/{id}/accept"
    description: "Nurse accepts an offer; fires the full placement cascade"
    roles: [Candidate]
    code: 200
    input: []
    output: Placement
    side_effects: ["per Offer ISSUED_to_ACCEPTED side effects"]
  - method: POST
    path: "/marketplace/offers/{id}/decline"
    description: "Nurse declines an offer"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["application transitions to DECLINED"]
  - method: POST
    path: "/marketplace/offers/{id}/rescind"
    description: "Employer rescinds an ISSUED offer"
    roles: [Employer]
    code: 200
    input: []
    output: Offer
    side_effects: ["application transitions to WITHDRAWN"]

  # --- Screening ---
  - method: POST
    path: "/marketplace/screenings"
    description: "Open a screening package for an application (one per application)"
    roles: [Employer]
    code: 201
    input: [application_id]
    output: Screening
    side_effects: ["overall_status computed as IN_PROGRESS"]
  - method: GET
    path: "/marketplace/screenings/{id}"
    description: "Read screening"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: []
  - method: POST
    path: "/marketplace/screenings/{id}/verify-credentials"
    description: "Verify the credential axis"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: ["overall_status recompute"]
  - method: POST
    path: "/marketplace/screenings/{id}/fail-credentials"
    description: "Fail the credential axis; rescinds any ISSUED offer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: ["overall_status recompute; offer rescind cascade"]
  - method: POST
    path: "/marketplace/screenings/{id}/clear-background"
    description: "Clear the background axis"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: ["overall_status recompute"]
  - method: POST
    path: "/marketplace/screenings/{id}/flag-background"
    description: "Flag the background axis; rescinds any ISSUED offer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: ["overall_status recompute; offer rescind cascade"]

  # --- OnboardingDocument ---
  - method: POST
    path: "/marketplace/onboarding-documents"
    description: "Upload an onboarding document (RECEIVED)"
    roles: [Candidate]
    code: 201
    input: [application_id, doc_type]
    output: OnboardingDocument
    side_effects: []
  - method: GET
    path: "/marketplace/onboarding-documents/{id}"
    description: "Read document"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: OnboardingDocument
    side_effects: []
  - method: POST
    path: "/marketplace/onboarding-documents/{id}/approve"
    description: "Approve a RECEIVED document"
    roles: [Employer]
    code: 200
    input: []
    output: OnboardingDocument
    side_effects: []
  - method: POST
    path: "/marketplace/onboarding-documents/{id}/reject"
    description: "Reject a RECEIVED document with a review note"
    roles: [Employer]
    code: 200
    input: [review_note]
    output: OnboardingDocument
    side_effects: []

  # --- Placement ---
  - method: GET
    path: "/marketplace/placements/{id}"
    description: "Read placement"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: GET
    path: "/marketplace/placements"
    description: "Filtered list of placements"
    roles: [Candidate, Employer, PlatformAdmin]
    code: 200
    input: ["nurse_id?", "employer_id?", "requisition_id?", "application_id?", "status?", "limit?", "offset?"]
    output: "Placement[]"
    side_effects: []
  - method: POST
    path: "/marketplace/placements/{id}/terminate"
    description: "Terminate a placement inside its guarantee window; fires refund + reopening cascade"
    roles: [Employer]
    code: 200
    input: []
    output: Placement
    side_effects: ["per Placement *_to_TERMINATED_IN_GUARANTEE side effects"]

  # --- Invoice ---
  - method: GET
    path: "/marketplace/invoices/{id}"
    description: "Read invoice"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/marketplace/invoices"
    description: "Filtered list of invoices"
    roles: [Employer, PlatformAdmin]
    code: 200
    input: ["employer_id?", "placement_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/marketplace/invoices/{id}/settle"
    description: "Settle an invoice, applying employer credit balance first"
    roles: [Employer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["employer.credit_balance_cents drawn down per Invoice state machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID for an entity_backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or X-User-ID does not match the owning entity on ownership-scoped endpoints" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist; also used when an Employer reads a nurse who excludes them (confidentiality cloaking)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Logical clock has reached the application response deadline or offer expiry; action no longer permitted" }
  - { id: ERR_CANDIDATE_CONFIDENTIAL, http: 403, condition: "Employer named in the nurse's confidentiality_exclusions attempted to create an Application for that nurse" }
  - { id: ERR_CREDENTIALS_INCOMPLETE, http: 422, condition: "Nurse not ACTIVE/license-verified at application creation; or screening incomplete / missing APPROVED SIGNED_CONTRACT at offer acceptance" }
  - { id: ERR_TERMS_MISMATCH, http: 422, condition: "Proposed shift != requisition shift; proposed rate below requisition floor; offer rate != current application rate; start_date outside 14-90 day window; interview duration outside 30-240 min; revision cap (2) exceeded" }
  - { id: ERR_INTERVIEW_CONFLICT, http: 409, condition: "Interview collides with another SCHEDULED interview of the same nurse under the buffered half-open overlap rule" }
  - { id: ERR_NO_OPENINGS, http: 409, condition: "Requisition has no remaining openings (openings_filled >= openings_total) or is not OPEN; or employer SUSPENDED" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Second Screening for one application; second non-terminal Offer; duplicate nurse email; duplicate license_number within license_state" }
  - { id: ERR_STALE_NURSE_VERSION, http: 412, condition: "expected_nurse_version does not match the nurse's current version at application creation" }
  - { id: ERR_STALE_REQUISITION_VERSION, http: 412, condition: "expected_requisition_version does not match the requisition's current version at offer issuance" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, enum out of range, or numeric range violation (e.g. rate < 2000 cents, sla_response_hours outside 24-168)" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "License expiry_date is not strictly after the clock's current date at verification time, or certification expires_on not in the future at creation" }
  - { id: ERR_NURSE_HAS_LIVE_APPLICATIONS, http: 409, condition: "Deactivation attempted while the nurse has any application in SUBMITTED, UNDER_REVIEW, INTERVIEWING or OFFER_EXTENDED" }
  - { id: ERR_PLACEMENT_GUARANTEE_EXPIRED, http: 409, condition: "Termination attempted after placement.guarantee_ends_on; the placement is COMPLETE and the fee is final" }
  - { id: ERR_REVIEW_NOTE_REQUIRED, http: 400, condition: "review_note missing on document reject, or rejection_reason missing on license reject" }
  - { id: ERR_UNIT_DAY_CAPACITY, http: 409, condition: "The interview's calendar day already carries 6 interview-starts for the (facility_state, unit_name) bucket per unit_interview_capacity_rule" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Candidate
    description: "A nurse acting on their own profile, applications, offers and documents. X-User-ID is the Nurse id."
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /marketplace/nurses/{id}/submit, /deactivate, /reactivate, /withdraw (own id only)"
      - "POST /marketplace/license-verifications (own nurse_id only)"
      - "POST /marketplace/certifications (own nurse_id only)"
      - "POST /marketplace/applications/{id}/review, /decline (own nurse_id only)"
      - "POST /marketplace/offers/{id}/accept, /decline (own nurse_id only)"
      - "POST /marketplace/onboarding-documents (application naming own nurse_id only)"
    shared_operations:
      - "GET reads on own nurse, applications, interviews, offers, documents, placements"
      - "POST /marketplace/nurses (self-registration)"
  - name: Employer
    description: "A hospital acting on its requisitions, applications it initiated, interviews, offers, screenings, documents review, placements and invoices. X-User-ID is the Employer id."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /marketplace/requisitions and requisition pause/resume/close/generate-matches (own employer_id only)"
      - "POST /marketplace/applications and applications/{id}/counter, /withdraw (own employer_id only)"
      - "POST /marketplace/applications/{id}/interviews and interview complete/cancel/no-show (own employer_id only)"
      - "POST /marketplace/applications/{id}/offers and offers/{id}/rescind (own employer_id only)"
      - "POST /marketplace/screenings (own employer_id only)"
      - "POST /marketplace/onboarding-documents/{id}/approve, /reject (own employer_id only)"
      - "POST /marketplace/placements/{id}/terminate, /marketplace/invoices/{id}/settle (own employer_id only)"
    shared_operations:
      - "GET reads on non-excluded nurses, own requisitions/matches/applications/offers/screenings/documents/placements/invoices"
  - name: PlatformAdmin
    description: "Marketplace operator. X-User-ID is an operator identifier not tied to any entity row."
    identity: "opaque"
    exclusive_operations:
      - "POST /marketplace/_clock/set_current_utc"
      - "POST /marketplace/employers and employers/{id}/suspend, /reinstate"
      - "POST /marketplace/license-verifications/{id}/verify, /reject"
      - "POST /marketplace/screenings/{id}/verify-credentials, /fail-credentials, /clear-background, /flag-background"
    shared_operations:
      - "GET reads across all entities"
