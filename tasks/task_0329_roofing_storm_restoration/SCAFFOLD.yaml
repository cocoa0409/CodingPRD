    output: ChangeOrder
    side_effects: ["status -> APPROVED; version+1"]

  - method: POST
    path: "/change-orders/{id}/apply"
    description: "Apply an approved change order (OCC on Job.version; cascades to contract/ledger/material order)"
    roles: [ProductionManager]
    code: 200
    input: [expected_job_version]
    output: ChangeOrder
    side_effects:
      - "status -> APPLIED; Job.contract_value_cents += delta_cents; remaining_billable re-derived"
      - "ORDERED material order re-sized when extra_shingle_squares>0; Job.version+1"

  - method: POST
    path: "/change-orders/{id}/void"
    description: "Void a proposed or approved change order"
    roles: [ProductionManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> VOIDED; version+1"]

  # ---- Warranty ----
  - method: POST
    path: "/warranties"
    description: "Create a PENDING workmanship warranty for a job"
    roles: [ProductionManager]
    code: 201
    input: [job_id, premium_cents, "term_months?"]
    output: Warranty
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/warranties/{id}"
    description: "Get a warranty"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: GET
    path: "/warranties"
    description: "List warranties, filterable by job_id"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: ["job_id?", "status?"]
    output: Warranty[]
    side_effects: []

  - method: POST
    path: "/warranties/{id}/activate"
    description: "Activate a warranty (job must be COMPLETED); releases retainage"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status -> ACTIVE; start_at stamped; Job.retainage_held_cents -> 0 (released); version+1"]

  - method: POST
    path: "/warranties/{id}/cancel"
    description: "Cancel an active warranty; computes refund (PRORATED or SHORT_RATE)"
    roles: [ProductionManager]
    code: 200
    input: [cancel_basis]
    output: Warranty
    side_effects: ["status -> CANCELLED; refund_cents computed (§1.3 warranty_refund); version+1"]

  - method: POST
    path: "/warranties/{id}/expire"
    description: "Expire a warranty whose term has elapsed"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status -> EXPIRED; version+1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving; affects warranty start_at, elapsed months, expiry)"
    roles: [ProductionManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "A referenced foreign key in the body (job_id, crew_id, estimate_id, permit_id, assigned_estimator_id) does not resolve" }
  - { id: ERR_MISSING_FIELD, http: 400, condition: "A required body field is absent" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Enum/range/interval violation (bad enum, squares<=0, cumulative_pct out of (0,1], window_end<=window_start, scheduled_end<=scheduled_start, retainage_pct out of range)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_ALREADY_CONTRACTED, http: 409, condition: "Job already has a bound estimate; cannot contract again" }
  - { id: ERR_NO_PASSED_ASSESSMENT, http: 409, condition: "mark-inspected without a PASSED DAMAGE_ASSESSMENT inspection" }
  - { id: ERR_NO_FINALIZED_ESTIMATE, http: 409, condition: "mark-estimated without a FINALIZED estimate" }
  - { id: ERR_EMPTY_ESTIMATE, http: 409, condition: "finalize an estimate with no line items" }
  - { id: ERR_SEVERITY_REQUIRED, http: 422, condition: "Completing a DAMAGE_ASSESSMENT as PASS without damage_severity" }
  - { id: ERR_MATERIALS_NOT_DELIVERED, http: 409, condition: "start-production without a DELIVERED material order" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "start-production without an ISSUED permit" }
  - { id: ERR_JOB_NOT_IN_PRODUCTION, http: 409, condition: "Draw create or crew check-in when the job is not IN_PRODUCTION" }
  - { id: ERR_CREW_INACTIVE, http: 409, condition: "Booking/checking-in an inactive crew" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "New crew window overlaps an existing BOOKED/CHECKED_IN window for the same crew (half-open semantics)" }
  - { id: ERR_INSPECTION_BUFFER_CONFLICT, http: 409, condition: "New PERMIT_FINAL inspection window is within BUFFER_HOURS of another PERMIT_FINAL window on the same job (closed + buffer semantics)" }
  - { id: ERR_PERMIT_FINAL_NEEDS_PERMIT, http: 422, condition: "Inspection kind=PERMIT_FINAL without permit_id, or kind=DAMAGE_ASSESSMENT with permit_id" }
  - { id: ERR_PCT_NOT_INCREASING, http: 409, condition: "Draw cumulative_pct does not strictly exceed Job.billed_pct" }
  - { id: ERR_PCT_OUT_OF_RANGE, http: 422, condition: "Draw cumulative_pct outside (0, 1]" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version does not equal current Job.version (draw create / change-order apply)" }
  - { id: ERR_CONTRACT_BELOW_DISBURSED, http: 409, condition: "Applying a change order would drop contract_value_cents below disbursed_gross_cents" }
  - { id: ERR_FINAL_DRAW_MISSING, http: 409, condition: "Job complete without billed_pct == 1.0" }
  - { id: ERR_FINAL_INSPECTION_MISSING, http: 409, condition: "Job complete without a PASSED PERMIT_FINAL inspection" }
  - { id: ERR_OPEN_CHANGE_ORDER, http: 409, condition: "Job complete while a ChangeOrder is PROPOSED or APPROVED" }
  - { id: ERR_JOB_NOT_COMPLETED, http: 409, condition: "Warranty activate when the job is not COMPLETED" }
  - { id: ERR_WARRANTY_NOT_EXPIRED, http: 409, condition: "Warranty expire before start_at + term_months" }
  - { id: ERR_VALIDATION, http: 400, condition: "Pagination params out of bounds (limit<1 or >100, offset<0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FieldAdjuster
    description: "Owns leads and inspections: creates jobs, schedules and completes inspections, marks the inspection milestone, loses dead leads."
    identity: opaque
    exclusive_operations:
      - "POST /jobs — create a lead"
      - "POST /jobs/{id}/mark-inspected"
      - "POST /jobs/{id}/lose"
      - "POST /inspections — schedule an inspection"
      - "POST /inspections/{id}/complete"
    shared_operations:
      - "GET reads on jobs, inspections, estimates, permits, draws, change-orders, warranties, crews, estimators, material-orders, crew-assignments"

  - name: Estimator
    description: "Owns scope & measurement: creates estimators/estimates, appends line items, finalizes, marks estimated, binds the contract, may propose change orders."
    identity: entity_backed:Estimator
    exclusive_operations:
      - "POST /jobs/{id}/mark-estimated"
      - "POST /jobs/{id}/contract"
      - "POST /estimates — create estimate"
      - "POST /estimates/{id}/line-items"
      - "POST /estimates/{id}/finalize"
    shared_operations:
      - "POST /estimators (with ProductionManager)"
      - "POST /change-orders (with ProductionManager)"
      - "GET reads across all collections"

  - name: ProductionManager
    description: "Owns production: materials, crews, permits, draws, change-order approval/apply, warranties, production milestones, and the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /crews"
      - "POST /jobs/{id}/start-production"
      - "POST /jobs/{id}/complete"
      - "POST /material-orders and /deliver and /cancel"
      - "POST /crew-assignments and /check-in /complete /cancel"
      - "POST /permits and /issue /expire"
      - "POST /draws"
      - "POST /change-orders/{id}/approve /apply /void"
      - "POST /warranties and /activate /cancel /expire"
      - "POST /_clock/set"
    shared_operations:
      - "POST /estimators (with Estimator)"
      - "POST /change-orders (with Estimator)"
      - "GET reads across all collections"
