      - name: commissioning_gate_errors_script_level_loadbank_and_witness_identity
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SCRIPT_NOT_APPROVED] (409, a load bank run is created or started while its package's script_status != SCRIPT_APPROVED)"
          - "errors[ERR_LEVEL_PREREQ_NOT_MET] (409, a package's script is approved while a lower level of the same hall is neither CERTIFIED nor SUPERSEDED)"
          - "errors[ERR_LOADBANK_PREREQ_MISSING] (409, an L4/L5 script is executed without a COMPLETED PASS load bank run whose measured_kw >= target_load_kw)"
          - "errors[ERR_WITNESS_SAME_AS_EXECUTOR] (422, the witnessing X-User-ID equals the package's executed_by_user_id)"
          - "validations[19], validations[20], validations[38] and the CommissioningPackage witness transition in §1.2"
        distinguishing_aspect: "Four distinct commissioning gates that a naive implementation merges into one 'not ready' error, each with its own code and its own trigger surface: the load-bank gate is checked when a RUN is created (19) and again when an L4/L5 SCRIPT is executed (38); the level gate looks at lower levels that were ALREADY CREATED and demands certification, not mere script approval (approving L1's script does not unblock L2); and the witness gate compares acting user identity, not role, so a CommissioningAgent user wearing the WitnessAuthority role is still rejected."
