            - "ReviewerVisit.${visit_id}.report_count is still 1 and state is still REPORTED"
            - "ReviewCycle.${cycle_id}.state is still REPORT_RECEIVED with addendum_round == 0 — a refused filing does not open an addendum round"
            - "the reports list returns total_count == 1: the surviving report still has recommendation IMPROVE, finding_codes [F-ENROLL] and sequence_number == 1"
            - "ExternalReviewer.${rev_id}.visit_count is still 1"

      - name: the_seat_ledger_refuses_over_release_and_refuses_to_drop_a_held_guarantee
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - validations[priority=39]
          - validations[priority=12]
          - errors[ERR_SEAT_NOT_COMMITTED]
          - errors[ERR_GUARANTEE_HAS_COMMITMENTS]
          - errors[ERR_GUARANTEE_STATE_INVALID]
