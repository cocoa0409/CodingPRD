          setup:
            - "TYPE_C_CONV + ELEC-155; CA 2026-2027 PUBLISHED with min_seat_capacity 78, min_emergency_exit_count 6, min_joint_strength_kn 62.5, required_route_range_mi 75.0, ROLLING terrain, every optional flag true"
