            - "${enrollment_after} == PENDING_WAITING_PERIOD and ${enrollment_version_after} == 1  # in-force coverage is deliberately untouched by the partner cascade"
            - "${e_new_campaign} == ERR_PARTNER_NOT_ACTIVE with HTTP 409"
            - "the three withdrawn campaigns are processed in created_at ASC order; with the clock pinned to a single instant their created_at values tie, so only the resulting set and the per-campaign version bumps are asserted, not the internal order"

      - name: cc_dual_variant_cancellation_cash_refund_versus_bill_insert_credit
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cancellation_refund_proration
          - calculations.cancellation_refund_proration.variants.direct_bill_cash_refund
          - calculations.cancellation_refund_proration.variants.bill_insert_credit
          - endpoints[POST /enrollments/{enrollmentId}/cancellation]
          - entities.LedgerEntry
        distinguishing_aspect: "Two enrollments identical in product, term_start and cancellation date diverge purely on billing_mode: DIRECT_BILL returns refund_cents 18897 against prepaid premium with credit_cents 0, while BILL_INSERT ignores prepaid_amount_cents entirely and grants credit_cents 1083 for the remainder of the final billed month with refund_cents 0 - a 17814-cent divergence from the same inputs."
        test_recipe:
          setup:
            - "Two premises on one ACTIVE partner, both enrolled in the same 2499-cent product on 2026-08-05 and activated by the batch on 2026-09-10; one DIRECT_BILL with prepaid_amount_cents 29988 and one BILL_INSERT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_cash: $.data.id, premises_cash_v1: $.data.version }
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "22 Birch Lane", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_insert: $.data.id, premises_insert_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_cash}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_cash_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_cash: $.data.id, cash_term_start: $.data.term_start, cash_prepaid: $.data.prepaid_amount_cents }
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_insert}", product_id: "${product_id}", billing_mode: "BILL_INSERT", expected_premises_version: "${premises_insert_v1}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_insert: $.data.id, insert_term_start: $.data.term_start, insert_prepaid: $.data.prepaid_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { activated: $.data.activated_enrollment_ids }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-18T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /enrollments/${enrollment_cash}/cancellation"
              payload: { reason: "CUSTOMER_REQUEST", requested_effective_date: "2026-11-18" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { cash_refund: $.data.refund_cents, cash_credit: $.data.credit_cents, cash_fee: $.data.cancellation_fee_cents, cash_coverage: $.data.coverage_status, cash_billing: $.data.billing_status, cash_effective: $.data.cancellation_effective_date }
            - call: "POST /enrollments/${enrollment_insert}/cancellation"
              payload: { reason: "CUSTOMER_REQUEST", requested_effective_date: "2026-11-18" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { insert_refund: $.data.refund_cents, insert_credit: $.data.credit_cents, insert_fee: $.data.cancellation_fee_cents, insert_coverage: $.data.coverage_status, insert_billing: $.data.billing_status }
            - call: "GET /ledger-entries?enrollment_id=${enrollment_cash}&entry_type=PRORATION_REFUND"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { cash_row_total: $.data.total_count, cash_row_amount: "$.data.items[0].amount_cents", cash_row_kind: "$.data.items[0].ledger_kind" }
            - call: "GET /ledger-entries?enrollment_id=${enrollment_insert}&entry_type=PRORATION_CREDIT"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { insert_row_total: $.data.total_count, insert_row_amount: "$.data.items[0].amount_cents" }
            - call: "GET /ledger-entries?enrollment_id=${enrollment_insert}&entry_type=PRORATION_REFUND"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { insert_no_refund_total: $.data.total_count }
          assert:
            - "${cash_term_start} == 2026-08-05, ${insert_term_start} == 2026-08-05, ${cash_prepaid} == 29988 and ${insert_prepaid} == 0  # BILL_INSERT defaults prepaid_amount_cents to 0"
            - "${activated} contains both ${enrollment_cash} and ${enrollment_insert}"
            - "${cash_refund} == 18897, ${cash_credit} == 0 and ${cash_fee} == 2500  # earned_premium_cents 8591 = 2177 + 2499 + 2499 + 1416, each month rounded before the sum; 29988 - 8591 - 2500"
            - "${insert_credit} == 1083 and ${insert_refund} == 0  # days_remaining = 30 - 18 + 1 = 13, round_half_up(2499 * 13 / 30) = 1083; prepaid_amount_cents is irrelevant to this variant"
            - "${insert_fee} == 2500  # §1.3 GAP: cancellation_fee_cents is computed by the shared step outside both variants, so the elapsed-105-day fee is recorded on the bill-insert cancellation too even though only the cash variant nets it against the payout"
            - "${cash_coverage} == CANCELLED, ${cash_billing} == REFUND_ISSUED, ${insert_coverage} == CANCELLED and ${insert_billing} == CREDIT_ISSUED"
            - "${cash_effective} == 2026-11-18  # the effective date itself is not earned - the covered span is half-open"
            - "${cash_row_total} == 1, ${cash_row_amount} == -18897 and ${cash_row_kind} == CASH"
            - "${insert_row_total} == 1 and ${insert_row_amount} == -1083"
            - "${insert_no_refund_total} == 0  # the bill-insert variant writes a PRORATION_CREDIT row and never a PRORATION_REFUND row"
            - "the two payouts differ by 17814 cents on identical product, term_start and cancellation date"

