              captures: { order_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_1}", customer_order_id: "${order_id}", units: 2, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_1}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_1: $.data.id }
            - call: "POST /delivery-waves/${wave_1}/slot-orders"
              payload: { customer_order_id: "${order_id}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_1}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_id}", limit: 10, offset: 0 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_id: "$.data[0].id" }
            - call: "POST /totes"
              payload: { wave_id: "${wave_1}", pick_station_id: "${station_id}", tote_code: "T1", temperature_zone: "AMBIENT" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { tote_id: $.data.id }
            - call: "POST /pick-tasks/${task_id}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_id}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
          trigger:
            - call: "POST /pick-tasks/${task_id}/complete"
              payload: { picked_units: 1 }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "GET /substitution-proposals"
              payload: { order_line_id: "${line_id}", limit: 10, offset: 0 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { prop_id: "$.data[0].id" }
          assert:
            - "trigger 1 returns HTTP 200 with PickTask.${task_id}.status == SHORT and picked_units == 1"
            - "trigger 2 returns total_count == 1: exactly one proposal was auto-created"
            - "SubstitutionProposal.${prop_id}.substitute_sku_id == ${sku_down} -- the 650-cent SKU, not the 750-cent one, because abs(650-700) == abs(750-700) forces the unit_price_cents ASC key to decide"
            - "SubstitutionProposal.${prop_id}.status == DRAFT, round_no == 1, expires_at == null"
            - "SubstitutionProposal.${prop_id}.proposed_price_delta_cents == -100 (650 x 2 - provisional 1400): the delta is negative and is NOT clamped at zero"
            - "the substitute is neither ${sku_thin} (on_hand_units 1 < ordered_qty 2) nor ${sku_block} (GridZone.${zone_two}.status == AUDIT_HOLD), although both are at price distance 0 and would have won the ranking"
            - "GridZone.${zone_two}.status == AUDIT_HOLD while GridZone.${zone_amb}.status == OPERATIONAL, and DeliveryWave.${wave_1}.posture == RESTRICTED (dispatch-blocked member order), not FROZEN"
            - "no units of ${sku_down} are allocated yet: allocated_units == 0 until the proposal is approved"

      - name: cascading_side_effects_four_hop_chain_excluded
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.PickTask.RETRIEVING->SHORT.side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / short_pick_cascade_to_wave_posture"
          rationale: "The depth probe already walks the full four-hop chain (task SHORT -> line SHORT/PENDING -> auto DRAFT proposal -> order dispatch_blocked + waterfall re-run -> wave posture RESTRICTED) end to end and asserts each hop's fields, and its sibling instance order_cancel_cascade_to_waitlist_promotion covers the ordering-sensitivity and reversal half of this layer."

      - name: dual_variant_calculation_both_variants_excluded
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.order_line_catchweight_price.variants
          - calculations.zone_inventory_accuracy.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / catchweight_line_price_provisional_vs_final"
          rationale: "Both declared dual-variant calculations are owned by the depth probe: catchweight_line_price_provisional_vs_final drives the provisional/final divergence and the ledger delta on switch, and zone_inventory_accuracy_unit_vs_sku_weighted drives the two accuracy variants and which one the AUDIT_HOLD gate reads."

  - section: consistency_model
    instances:
      - name: immediate_consistency_shows_every_derived_change_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /slot-bookings.side_effects
          - endpoints.POST /delivery-waves/{waveId}/slot-orders.side_effects
        distinguishing_aspect: "One booking request settles four different entities' derived state, and every one of them is already correct in the responses of that same request round: the booking body carries the frozen surge and quoted fee, the slot's ledger and recomputed surge are readable immediately with no second write, the order's waterfall fields are filled, and the wave's order_count / posture are already updated in the slot-orders response body itself rather than on a later read."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, SKU AMB-1 (700 cents, 100 units), a slot 8 hours after the boot clock with total_capacity_units 5 and withheld_units 0, and a BASIC customer with a DRAFT order holding 4 x AMB-1."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-01T08:00:00.000Z", window_end: "2026-08-01T10:00:00.000Z", total_capacity_units: 5, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_1: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 4 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_1}", customer_order_id: "${order_id}", units: 4, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "GET /delivery-slots/${slot_1}"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_1}", wave_code: "W1", cutoff_at: "2026-08-01T06:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_1: $.data.id }
            - call: "POST /delivery-waves/${wave_1}/slot-orders"
              payload: { customer_order_id: "${order_id}" }
              as: WavePlanner
              as_user_id: "planner-1"
          assert:
            - "the slot was created with surge_multiplier == 1.20 (lead_hours 8 < 12 gives +0.20; utilization 0 and no active wave add nothing)"
            - "trigger 1's own 201 body already carries surge_multiplier_at_booking == 1.20 and quoted_fee_cents == 719 (round_half_up(599 x 1.20) = round_half_up(718.8))"
            - "trigger 2, issued immediately after with no intervening write, shows held_units == 4, confirmed_units == 0, available_units == 1 and surge_multiplier == 1.55 (utilization 4/5 == 0.80 >= 0.60 gives +0.15, plus lead 0.20, plus congestion 0.00)"
            - "trigger 3 shows the waterfall already applied: merchandise_subtotal_cents == 2800, delivery_fee_cents == 719, loyalty_discount_cents == 0, order_total_cents == 3519"
            - "trigger 4's body shows status == CONFIRMED, and the order read back shows fulfillment_status == SLOTTED with billing_status == AUTHORIZED and authorized_amount_cents == 3519"
            - "trigger 6's own 200 body -- not a later GET -- already shows DeliveryWave.${wave_1}.order_count == 1 and posture == OPEN, and the order read back shows fulfillment_status == WAVED"
            - "the booking's quoted_fee_cents stays 719 even though the slot's surge_multiplier has since moved to 1.55, so the frozen quote and the live slot value are both visible in the same request round"
