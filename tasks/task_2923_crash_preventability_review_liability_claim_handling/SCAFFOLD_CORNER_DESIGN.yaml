              payload: { expected_review_case_version: "${v3}", vote: "NON_PREVENTABLE", criterion_scores: { speed_and_spacing: 1, hazard_recognition: 1, vehicle_condition_precheck: 1, regulatory_compliance: 1, evasive_action: 1 } }
              as: CommitteeMember
              as_user_id: "cm-003"
            - call: "POST /review-cases/${rc_id}/decide"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { det: $.data.determination, basis: $.data.decision_basis }
          trigger:
            - call: "POST /review-cases/${rc_id}/appeal"
              payload: { appeal_grounds: "the preserved ECM snapshot shows the tractor was stationary", appeal_grounds_code: "NEW_EVIDENCE", appeal_evidence_item_id: "${ev_cited}" }
              as: SafetyManager
              as_user_id: "sm-002"
              captures: { link_after: $.data.appeal_evidence_item_id, status_after: $.data.status, code_after: $.data.appeal_grounds_code }
            - call: "GET /review-cases"
              payload: { appeal_evidence_item_id: "${ev_cited}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { by_cited: $.data }
            - call: "GET /review-cases"
              payload: { appeal_evidence_item_id: "${ev_uncited}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { by_uncited: $.data }
            - call: "GET /evidence-items/${ev_cited}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { ev_state_after: $.data.preservation_state, ev_ver_after: $.data.version, ev_crash: $.data.crash_id }
          assert:
            - "${det} == NON_PREVENTABLE with ${basis} == UNWEIGHTED_MAJORITY and ${link_before} == null before the appeal"
            - "${link_after} == ${ev_cited} with ${status_after} == DELIBERATION and ${code_after} == NEW_EVIDENCE — the grant writes the association onto the ReviewCase"
            - "${by_cited} has exactly 1 row, ${rc_id}, with meta.pagination.total_count == 1 — the link is reachable from the evidence id, which is what makes ERR_EVIDENCE_ITEM_NOT_FOUND on that filter verifiable"
            - "${by_uncited} has 0 rows with total_count 0 — the preserved item on the other crash was never associated"
            - "${ev_state_after} == ${ev_state_before} == PRESERVED and ${ev_ver_after} == ${ev_ver_before} — citing an item in an appeal does not touch the item, so the link is one-directional in storage and two-directional only in query"
            - "${ev_crash} == ${c_id} — the cited item still belongs to the case's own crash, which is what priority 52 checked before the grant"

