            - { call: "POST /jurisdictions", payload: { code: "AL-OPEN", name: "Alabama" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-ENV", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          assert:
            - "HTTP 201; envelope has meta.api_request_id and meta.api_request_timestamp; response_type == object"
            - "data carries the Order with computed subtotal_cents == 5000, tax_cents == 413, total_cents == 5413"

      - name: account_read_reflects_outstanding
        claim_type: computed_read
        grounds:
          - entities.ContractorAccount.fields.outstanding_balance_cents
        distinguishing_aspect: "outstanding_balance_cents equals the unpaid order total 5413 after creation and drops to 0 after pay."
        test_recipe:
          setup: ["account with one unpaid order (total 5413)"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Out Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "GA-OPEN", name: "Georgia" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-OUT", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin }
          assert:
            - "before pay: outstanding_balance_cents == 5413"
            - "after pay: outstanding_balance_cents == 0"

  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: error_shape
        grounds:
          - response_envelope
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Every error response uses the fixed error envelope: response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: CorporateAdmin }
          assert:
            - "HTTP 404; envelope response_type == error; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string; meta block present"

      - name: every_catalog_error_is_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: suspended_account_beats_credit_limit
          rationale: "Domain state-error routing through the catalog is exercised by the named section 1.8 instance and by the invalid-transition corners above; remaining catalog rows map one-to-one onto declared validations (section 4) covered by their own corners."

  - section: rbac
    instances:
      - name: specwriter_cannot_approve_own_spec
        claim_type: role_denial
        grounds:
          - roles[SpecWriter]
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "SpecWriter writes but cannot review: approve called by SpecWriter fails 403 (segregation between writing and approval)."
        test_recipe:
          setup: ["product; SUBMITTED spec sheet"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-RB1", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-RB", architect_name: "A", title: "T", lines: [{ product_id: "${prod}", specified_qty: 5 }] }, as: SpecWriter, captures: { sheet: "$.data.id" } }
            - { call: "POST /spec-sheets/${sheet}/submit", payload: {}, as: SpecWriter }
          trigger:
            - { call: "POST /spec-sheets/${sheet}/approve", payload: {}, as: SpecWriter }
          assert: ["HTTP 403 ERR_FORBIDDEN_ROLE; SpecSheet.${sheet}.status remains SUBMITTED"]

      - name: associate_cannot_dispatch_delivery
        claim_type: role_denial
        grounds:
          - roles[StoreAssociate]
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Delivery dispatch is StoreManager-exclusive; StoreAssociate is refused 403 even on a perfectly dispatchable delivery."
        test_recipe:
          setup: ["paid order with SCHEDULED delivery"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "RB2 Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "SC-OPEN", name: "South Carolina" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-RB2", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T10:00:00Z" }, as: StoreManager, captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /deliveries/${d1}/dispatch", payload: {}, as: StoreAssociate }
          assert: ["HTTP 403 ERR_FORBIDDEN_ROLE; Delivery.${d1}.status remains SCHEDULED"]

      - name: contractor_cannot_manage_catalog
        claim_type: role_denial
        grounds:
          - roles[Contractor]
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Contractor is a customer role: catalog administration (POST /products) is refused even for its own account id."
        test_recipe:
          setup: ["one contractor account"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "RB3 Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "POST /products", payload: { sku: "P-RB3", name: "Hack", category: "FLAT", voc_gpl: 100, list_price_cents: 1, tintable: false }, as: Contractor, as_user_id: "${acct}" }
          assert: ["HTTP 403 ERR_FORBIDDEN_ROLE"]

  - section: complexity_layers
    instances:
      - name: occ_stale_version_on_account_patch
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[account-patch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH /contractor-accounts/{id} with the pre-mutation version succeeds once (version advances), and the identical replay then fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["one account at version 1"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Occ Co", credit_limit_cents: 1000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av: "$.data.version" } }
          trigger:
            - { call: "PATCH /contractor-accounts/${acct}", payload: { expected_contractor_account_version: "${av}", credit_limit_cents: 70000 }, as: CorporateAdmin }
            - { call: "PATCH /contractor-accounts/${acct}", payload: { expected_contractor_account_version: "${av}", credit_limit_cents: 80000 }, as: CorporateAdmin }
          assert:
            - "first PATCH succeeds: version becomes ${av} + 1, credit_limit_cents == 70000"
            - "second PATCH with the same captured version fails: HTTP 412 ERR_STALE_VERSION; credit_limit_cents stays 70000"

      - name: occ_stale_version_on_order_create
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[order-create-stale-account]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "POST /orders carries the account version observed before the first create; after the first create bumped it, the replayed version is stale and rejected 412."
        test_recipe:
          setup: ["account, job, product; version captured at account creation"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Occ2 Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "KY-OPEN", name: "Kentucky" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-OCC2", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate }
          assert:
            - "first create succeeds and bumps the account version"
            - "second create with the same captured version fails: HTTP 412 ERR_STALE_VERSION; only one order exists for the account"

      - name: clock_default_is_fixed_instant
        claim_type: scheduled_actions
        grounds:
          - "endpoints.POST /_clock/set_current_utc"
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z — a delivery window earlier than that is in the past by default."
        test_recipe:
          setup: ["account, job, one order; no clock call is ever made"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Clk Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "SD-OPEN", name: "South Dakota" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-CLK", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-04-30T09:00:00Z", window_end: "2026-04-30T10:00:00Z" }, as: StoreManager }
          assert: ["HTTP 422 ERR_DELIVERY_WINDOW_PAST (default clock 2026-05-01T00:00:00Z governs, not wall-clock time)"]

      - name: version_pinning_blocks_discontinued_on_new_lines
        claim_type: conditional_validation
        grounds:
          - validations[priority=33]
          - "errors[ERR_PRODUCT_DISCONTINUED]"
        excluded_because:
          difficulty_instance: spec_approve_blocked_by_discontinued_product
          rationale: "The version-pinning gate on approval against a discontinued product is asserted in the named section 1.8 instance; the POST /orders side of priority 33 is asserted by the voc_limit_equality_compliant chain's success path and the catalog corners."

  - section: consistency_model
    instances:
      - name: create_response_carries_computed_totals
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_totals
        distinguishing_aspect: "Immediate consistency: the POST /orders response itself carries fully computed subtotal/tax/total — no re-fetch or delay is needed to observe derived fields."
        test_recipe:
          setup: ["account, job, product list 5000"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Imm Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "WI-OPEN", name: "Wisconsin" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-IMM", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 2 }] }, as: StoreAssociate }
          assert:
            - "the create response data already shows subtotal_cents == 10000, tax_cents == 825, total_cents == 10825 (no subsequent GET required)"
