            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev1_id}", finding_id: "${f2_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: ManagingEditor
              captures: { a2_id: $.data.id }
            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev2_id}", finding_id: "${f1_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: ManagingEditor
              captures: { a3_id: $.data.id }
