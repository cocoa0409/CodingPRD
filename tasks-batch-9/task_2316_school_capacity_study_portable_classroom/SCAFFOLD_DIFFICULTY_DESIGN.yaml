      - name: fire_access_hose_lay_exactly_at_maximum_distance
        grounds:
          calculations: [site_feasibility_assessment]
          entities: [PlacementSite, School]
          endpoints: ["POST /facilities/placement-sites/{id}/assess"]
        metric: "distance_to_fire_lane_ft, the hose-lay distance from the pad to the nearest fire apparatus lane, and the school's fire_lane_clear_width_ft"
        boundary: "FIRE_ACCESS_MAX_DISTANCE_FT = 150 evaluated with <= (150.0 passes, 150.1 fails) and FIRE_LANE_MIN_CLEAR_WIDTH_FT = 20 evaluated with >= (20.0 passes, 19.9 fails)"
        distinguishing_aspect: >
          Three pads on a compliant campus sit at 149.9, 150.0 and 150.1 ft of
          hose lay. The first two assess FEASIBLE and the third assesses INFEASIBLE
          with infeasible_reason FIRE_ACCESS, so the comparison must be inclusive
          and must not truncate the tenth of a foot. A fourth pad only 40 ft from a
          19.9 ft wide lane is also INFEASIBLE for FIRE_ACCESS, proving the two fire
          criteria are independent conjuncts rather than one distance test.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/schools"
            payload: { name: "Compliant Lane Middle", grade_configuration: "MIDDLE_68", site_acreage: 11.0, fire_lane_clear_width_ft: 20.0, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Narrow Lane Middle", grade_configuration: "MIDDLE_68", site_acreage: 11.0, fire_lane_clear_width_ft: 19.9, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { narrow_school_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${school_id}", pad_code: "PAD-149", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 149.9, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { under_site_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${school_id}", pad_code: "PAD-150", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 150.0, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { exact_site_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${school_id}", pad_code: "PAD-151", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 150.1, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { over_site_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${narrow_school_id}", pad_code: "PAD-NARROW", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40.0, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { narrow_site_id: id }
          - call: "POST /facilities/placement-sites/${under_site_id}/assess"
            payload: { candidate_size_class: "SINGLE_24x40" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
        trigger:
          call: "POST /facilities/placement-sites/${exact_site_id}/assess"
          payload: { candidate_size_class: "SINGLE_24x40" }
          as: FacilitiesPlanner
          as_user_id: "planner-1"
        asserts:
          - "response status is 200"
          - "data.feasibility_status == \"FEASIBLE\""
          - "data.infeasible_reason == null"
          - "data.assessed_for_size_class == \"SINGLE_24x40\""
          - "data.mitigation_flags == []"
          - "boundary minus one tenth: GET /facilities/placement-sites/${under_site_id} returns data.feasibility_status == \"FEASIBLE\" and data.infeasible_reason == null"
          - "boundary plus one tenth: POST /facilities/placement-sites/${over_site_id}/assess returns 200 with data.feasibility_status == \"INFEASIBLE\" and data.infeasible_reason == \"FIRE_ACCESS\""
          - "independent conjunct: POST /facilities/placement-sites/${narrow_site_id}/assess returns 200 with data.feasibility_status == \"INFEASIBLE\" and data.infeasible_reason == \"FIRE_ACCESS\" even though the hose lay is only 40.0 ft"

      - name: empty_eligible_unit_pool_at_auto_assign
        grounds:
          calculations: [eligible_unit_selection]
          entities: [PortableUnit, PlacementRequest, PlacementSite]
          endpoints: ["POST /facilities/placement-requests/{id}/auto-assign-unit"]
        metric: "size of the eligible candidate pool after the five eligibility filters are applied"
        boundary: "pool size 0 versus 1: an empty pool is an ERR_NO_ELIGIBLE_UNIT rejection, never a null assignment or an arbitrary pick"
        distinguishing_aspect: >
          The district owns four portables and every one is excluded by exactly one
          different filter: grade D, condition UNSAFE, already INSTALLED elsewhere,
          and a triple-wide that cannot fit the 60 by 34 ft pad once 5 ft of
          clearance is added on each side. The pool is therefore empty and the call
          must fail with ERR_NO_ELIGIBLE_UNIT while leaving the request in DRAFT.
          Adding a single eligible unit lifts the pool to 1 and the same call
          succeeds, and adding a second eligible unit exposes the grade tie-break
          because both start with zero accumulated relocation cost. An
          implementation that drops any one filter, or that returns 200 with a null
          unit on an empty pool, is caught here.
