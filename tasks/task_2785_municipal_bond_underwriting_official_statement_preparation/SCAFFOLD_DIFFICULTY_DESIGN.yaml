            - call: "POST /bond-offerings/os-sections/${s_cd_id}/approve"
              payload: {}
              as: BondCounsel
              as_user_id: "bc_reviewer"
            - call: "POST /bond-offerings/os-sections/${s_uw_id}/approve"
              payload: {}
              as: BondCounsel
              as_user_id: "bc_reviewer"
            - call: "POST /bond-offerings/official-statements/${os_id}/submit-for-review"
              payload: {}
              as: BondCounsel
