          - entities.FlightBank.fields.staffing_coverage_pct
          - errors[ERR_STAFFING_COVERAGE_INSUFFICIENT]
          - state_machines.FlightBank.SUBMITTED_to_APPROVED
          - state_machines.FlightBank.SUBMITTED_to_REVISION_REQUIRED
          - state_machines.FlightBank.REVISION_REQUIRED_to_DRAFT
        distinguishing_aspect: |
          A THIRD metric on a THIRD endpoint: the staffing_coverage_pct ratio, reached through
          POST /flight-banks/{flightBankId}/staffing-transitions. Approval demands
          `staffing_coverage_pct >= 100.00`, so 66.67 percent is refused with
          ERR_STAFFING_COVERAGE_INSUFFICIENT while exactly 100.00 percent is approved.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 is PUBLISHED with three TOWING_ONLY turns, so required_headcount is 3."
            - "planned_headcount is 2, giving staffing_coverage_pct 66.67, and the plan has been SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX401", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX402", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T08:00:00Z", scheduled_out: "2026-04-10T08:20:00Z" }
              as: DutyOfficer
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX403", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T10:00:00Z", scheduled_out: "2026-04-10T10:20:00Z" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
              captures: { cov_before: $.data.staffing_coverage_pct, req_before: $.data.required_headcount }
          trigger:
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
              as_user_id: "sm-01"
              captures: { err_cov: $.data.error_id }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "REJECT" }
              as: StationManager
              as_user_id: "sm-01"
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "REVISE", planned_headcount: 3 }
              as: DutyOfficer
              captures: { cov_after: $.data.staffing_coverage_pct }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
              as_user_id: "sm-02"
              captures: { ss_final: $.data.staffing_status }
          assert:
            - "${req_before} == 3"
            - "${cov_before} == 66.67"
            - "${err_cov} == ERR_STAFFING_COVERAGE_INSUFFICIENT"
            - "HTTP status of the 66.67 percent APPROVE is 422"
            - "${cov_after} == 100.00"
            - "${ss_final} == APPROVED"
            - "FlightBank.${fb_id}.bank_status == PUBLISHED"
            - "FlightBank.${fb_id}.last_staffing_decision_by_user_id == sm-02"

  # =======================================================================
  # Rule 7 - cross-entity state dependencies across different entity pairs
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: turn_start_blocked_by_flight_bank_staffing_status
        grounds:
          - state_machines.Turn.RESOURCED_to_IN_PROGRESS
          - entities.FlightBank.fields.staffing_status
          - errors[ERR_STAFFING_NOT_APPROVED]
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair TURN -> FLIGHTBANK: the Turn is in a perfectly valid RESOURCED state and
          every one of its own preconditions holds, yet START is refused with
          ERR_STAFFING_NOT_APPROVED purely because the sibling FlightBank's staffing_status is
          SUBMITTED; approving the bank's plan makes the identical call succeed.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 is PUBLISHED and its staffing plan is SUBMITTED but NOT yet approved, with planned_headcount 1 against required_headcount 1."
            - "Turn LX318 (TOWING_ONLY) is RESOURCED with one agent occupation and one GSE occupation."
