scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deadline_provisional_vs_final
        grounds:
          - calculations.case_response_deadline
          - entities.Case.fields.provisional_due_at
          - entities.Case.fields.final_due_at
          - state_machines.Case.NEW_to_IN_PROGRESS
        distinguishing_aspect: "On the Case domain, the provisional deadline (created_at + DEFAULT_WINDOW_HOURS[HEALTHCARE]=120h) and the final deadline (triaged_at + min(100*0.5+12,720)=62h) resolve to different instants for the same case."
        test_recipe:
          setup:
            - "Representative + constituent (data_sharing_consent true) + active HEALTHCARE template with response_window_hours=100."
            - "A HEALTHCARE case created at the default clock 2026-03-01T00:00:00Z, then the clock advanced to 2026-03-02T00:00:00Z before triage at priority HIGH."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep A", chamber: "HOUSE", district_name: "CA-12", state_code: "CA", office_email: "a@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy A", email: "cy@x.com", address: "1 St", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HEALTHCARE", body_template: "Dear constituent", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Medicaid", description: "help", category: "HEALTHCARE" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "HIGH", assignee_staff_id: "staff-1" }
              as: Caseworker
          assert:
            - "Case.${case_id}.provisional_due_at == \"2026-03-06T00:00:00.000Z\""
            - "Case.${case_id}.final_due_at == \"2026-03-04T14:00:00.000Z\""
            - "Case.${case_id}.effective_window_hours == 62"

      - name: recurring_index_raw_vs_trend
        grounds:
          - calculations.recurring_issue_index
          - endpoints.GET_/analytics/recurring-issues
        distinguishing_aspect: "On the analytics domain, RAW (all-time, weight only) yields index 6.50 over 3 HOUSING cases while TREND (30-day window, weight*1.25) yields index 3.75 over 2 cases for the same representative."
        test_recipe:
          setup:
            - "One representative with three HOUSING cases created at 2026-01-01, 2026-02-20, 2026-02-25 and triaged to priority URGENT, HIGH, NORMAL respectively; clock returned to 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep B", chamber: "SENATE", district_name: "NY-3", state_code: "NY", office_email: "b@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy B", email: "cyb@x.com", address: "2 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HOUSING", body_template: "Re: housing", response_window_hours: 120, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Rent A", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_a: $.data.id }
            - call: "POST /cases/${case_a}/triage"
              payload: { template_id: "${tmpl_id}", priority: "URGENT", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Rent B", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_b: $.data.id }
            - call: "POST /cases/${case_b}/triage"
              payload: { template_id: "${tmpl_id}", priority: "HIGH", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-25T00:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Rent C", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_c: $.data.id }
            - call: "POST /cases/${case_c}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "GET /analytics/recurring-issues"
              payload: { representative_id: "${rep_id}", category: "HOUSING", variant: "RAW" }
              as: Caseworker
            - call: "GET /analytics/recurring-issues"
              payload: { representative_id: "${rep_id}", category: "HOUSING", variant: "TREND", window_days: 30 }
              as: Caseworker
          assert:
            - "GET recurring-issues variant=RAW returns data.index == 6.50 and data.case_count == 3"
            - "GET recurring-issues variant=TREND returns data.index == 3.75 and data.case_count == 2"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deadline_effective_window_nested_min
        grounds:
          - calculations.case_response_deadline
          - entities.Case.fields.effective_window_hours
          - state_machines.Case.NEW_to_IN_PROGRESS
        distinguishing_aspect: "Mode (a): effective_window combines >=3 inputs (template window 200, PRIORITY_MULTIPLIER[URGENT]=0.25, CATEGORY_SURCHARGE_HOURS[IMMIGRATION]=24) via multiply-then-add nested inside min(...,720) = 74."
        test_recipe:
          setup:
            - "Representative + constituent + active IMMIGRATION template response_window_hours=200; one IMMIGRATION case triaged URGENT at clock 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep C", chamber: "HOUSE", district_name: "TX-1", state_code: "TX", office_email: "c@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy C", email: "cyc@x.com", address: "3 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "IMMIGRATION", body_template: "Re: visa", response_window_hours: 200, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Visa", description: "d", category: "IMMIGRATION" }
              as: Caseworker
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "URGENT", assignee_staff_id: "s1" }
              as: Caseworker
          assert:
            - "Case.${case_id}.effective_window_hours == 74"
            - "Case.${case_id}.final_due_at == \"2026-03-04T02:00:00.000Z\""

      - name: recurring_index_round_then_sum
        grounds:
          - calculations.recurring_issue_index
          - endpoints.GET_/analytics/recurring-issues
        distinguishing_aspect: "Mode (b): two URGENT cases give per-case round(3.5*1.25=4.375,2)=4.38; pinned round-then-sum yields 4.38+4.38=8.76, whereas sum-then-round would yield round(8.75)=8.75."
        test_recipe:
          setup:
            - "One representative with two URGENT HOUSING cases created at 2026-02-25T00:00:00Z; clock at 2026-03-01T00:00:00Z for the TREND query."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep D", chamber: "HOUSE", district_name: "OH-2", state_code: "OH", office_email: "d@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy D", email: "cyd@x.com", address: "4 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HOUSING", body_template: "Re", response_window_hours: 120, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-25T00:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "U1", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_1: $.data.id }
            - call: "POST /cases/${case_1}/triage"
              payload: { template_id: "${tmpl_id}", priority: "URGENT", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "U2", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_2: $.data.id }
            - call: "POST /cases/${case_2}/triage"
              payload: { template_id: "${tmpl_id}", priority: "URGENT", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "GET /analytics/recurring-issues"
              payload: { representative_id: "${rep_id}", category: "HOUSING", variant: "TREND", window_days: 30 }
              as: Caseworker
          assert:
            - "GET recurring-issues variant=TREND returns data.index == 8.76 and data.case_count == 2"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_await_constituent_cycle
        grounds:
          - state_machines.Case.IN_PROGRESS_to_AWAITING_CONSTITUENT
          - state_machines.Case.AWAITING_CONSTITUENT_to_IN_PROGRESS
        distinguishing_aspect: "The Case machine cycles IN_PROGRESS -> AWAITING_CONSTITUENT -> IN_PROGRESS -> AWAITING_CONSTITUENT; re-entry into AWAITING_CONSTITUENT after a resume proves the loop, which no linear pipeline permits."
        test_recipe:
          setup:
            - "A triaged (IN_PROGRESS) HEALTHCARE case owned by a constituent."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep E", chamber: "HOUSE", district_name: "FL-5", state_code: "FL", office_email: "e@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy E", email: "cye@x.com", address: "5 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HEALTHCARE", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "H", description: "d", category: "HEALTHCARE" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
          trigger:
            - call: "POST /cases/${case_id}/request-info"
              payload: { message: "please send docs" }
              as: Caseworker
            - call: "POST /cases/${case_id}/constituent-reply"
              payload: { message: "here they are" }
              as: Constituent
              as_user_id: "${con_id}"
            - call: "POST /cases/${case_id}/request-info"
              payload: { message: "one more thing" }
              as: Caseworker
          assert:
            - "After constituent-reply Case.${case_id}.status == IN_PROGRESS"
            - "After the second request-info Case.${case_id}.status == AWAITING_CONSTITUENT"

      - name: referral_branch_resolve_vs_reject
        grounds:
          - state_machines.AgencyReferral.SENT_to_RESOLVED
          - state_machines.AgencyReferral.SENT_to_REJECTED
          - entities.Case.fields.reject_count
          - entities.Case.fields.last_agency_outcome
        distinguishing_aspect: "The AgencyReferral SENT fork branches to RESOLVED (last_agency_outcome=RESOLVED, reject_count stays 0) versus REJECTED (last_agency_outcome=REJECTED, reject_count increments to 1) — divergent side-effect sets on the parent Case."
        test_recipe:
          setup:
            - "A triaged case with data_sharing_consent, an ACTIVE agency; one referral sent+resolved, then a second referral sent+rejected."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep F", chamber: "HOUSE", district_name: "GA-4", state_code: "GA", office_email: "f@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy F", email: "cyf@x.com", address: "6 St", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "State DMV", jurisdiction: "GA", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "OTHER", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Reg", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}", referral_notes: "n1" }
              as: Caseworker
              captures: { ref1_id: $.data.id }
            - call: "POST /agency-referrals/${ref1_id}/send"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /agency-referrals/${ref1_id}/resolve"
              payload: { response_summary: "done" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}", referral_notes: "n2" }
              as: Caseworker
              captures: { ref2_id: $.data.id }
            - call: "POST /agency-referrals/${ref2_id}/send"
              payload: {}
              as: Caseworker
            - call: "POST /agency-referrals/${ref2_id}/reject"
              payload: { reason: "not us" }
              as: Caseworker
          assert:
            - "After resolve: Case.${case_id}.last_agency_outcome == RESOLVED and Case.${case_id}.reject_count == 0"
            - "After reject: Case.${case_id}.last_agency_outcome == REJECTED and Case.${case_id}.reject_count == 1"
            - "AgencyReferral.${ref1_id}.status == RESOLVED and AgencyReferral.${ref2_id}.status == REJECTED"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: purge_constituent_depth3_cascade
        grounds:
          - state_machines.Constituent.ACTIVE_to_PURGED
          - state_machines.Case.IN_PROGRESS_to_WITHDRAWN
          - state_machines.AgencyReferral.SENT_to_RECALLED
          - entities.Agency.fields.open_referral_count
        distinguishing_aspect: "Depth-3 chain from constituent purge: purge -> Case WITHDRAWN (hop1) -> that case's SENT referral RECALLED (hop2) -> that referral's Agency.open_referral_count decremented 1->0 (hop3); each hop is caused by the prior."
        test_recipe:
          setup:
            - "Constituent (consent true) with a triaged case referred and SENT to an ACTIVE agency (agency.open_referral_count==1, case AWAITING_AGENCY)."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep G", chamber: "HOUSE", district_name: "AZ-6", state_code: "AZ", office_email: "g@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy G", email: "cyg@x.com", address: "7 St", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "USCIS", jurisdiction: "US", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "IMMIGRATION", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Case", description: "d", category: "IMMIGRATION" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
              captures: { ref_id: $.data.id }
            - call: "POST /agency-referrals/${ref_id}/send"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /constituents/${con_id}/purge"
              payload: {}
              as: OfficeAdmin
          assert:
            - "Constituent.${con_id}.status == PURGED and Constituent.${con_id}.full_name == \"REDACTED\""
            - "Case.${case_id}.status == WITHDRAWN"
            - "AgencyReferral.${ref_id}.status == RECALLED"
            - "Agency.${agency_id}.open_referral_count == 0"

      - name: event_cancel_depth2_cascade
        grounds:
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - state_machines.EventRegistration.REGISTERED_to_CANCELLED
          - entities.Constituent.fields.upcoming_event_count
        distinguishing_aspect: "Depth-2 chain from a different trigger (event cancel): cancel -> EventRegistration CANCELLED (hop1) -> that registration decrements its Constituent.upcoming_event_count 1->0 (hop2)."
        test_recipe:
          setup:
            - "A scheduled, open event with one REGISTERED constituent (registered_count==1, constituent.upcoming_event_count==1)."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep H", chamber: "HOUSE", district_name: "WA-7", state_code: "WA", office_email: "h@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy H", email: "cyh@x.com", address: "8 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Hall", capacity: 50 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-05-01T18:00:00Z", end_at: "2026-05-01T19:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: OfficeAdmin
          assert:
            - "Event.${event_id}.lifecycle_status == CANCELLED"
            - "EventRegistration.${reg_id}.status == CANCELLED"
            - "Event.${event_id}.registered_count == 0"
            - "Constituent.${con_id}.upcoming_event_count == 0"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referral_state_beats_consent
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: "On POST /cases/{id}/referrals a case still in NEW with a non-consenting constituent violates both state (priority 7) and business_safety consent (priority 8); the state error wins, so ERR_CASE_INVALID_STATE is returned, not ERR_CONSENT_REQUIRED."
        test_recipe:
          setup:
            - "A NEW (un-triaged) case whose constituent has data_sharing_consent=false, plus an ACTIVE agency."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep I", chamber: "HOUSE", district_name: "CO-1", state_code: "CO", office_email: "i@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy I", email: "cyi@x.com", address: "9 St", data_sharing_consent: false }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "IRS", jurisdiction: "US", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Tax", description: "d", category: "TAX" }
              as: Caseworker
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
          assert:
            - "Response is 409 with data.error_id == ERR_CASE_INVALID_STATE (not ERR_CONSENT_REQUIRED)"

      - name: referral_consent_beats_agency_inactive
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: "On POST /cases/{id}/referrals an IN_PROGRESS case with a non-consenting constituent AND an INACTIVE agency violates business_safety consent (priority 8) and business_referential agency-inactive (priority 10); consent wins, returning ERR_CONSENT_REQUIRED not ERR_AGENCY_INACTIVE."
        test_recipe:
          setup:
            - "A triaged (IN_PROGRESS) case whose constituent has data_sharing_consent=false, and an INACTIVE agency."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep J", chamber: "HOUSE", district_name: "NV-2", state_code: "NV", office_email: "j@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy J", email: "cyj@x.com", address: "10 St", data_sharing_consent: false }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dead Agency", jurisdiction: "NV", status: "INACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "BENEFITS", body_template: "Re", response_window_hours: 96, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "SNAP", description: "d", category: "BENEFITS" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
          trigger:
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
          assert:
            - "Response is 403 with data.error_id == ERR_CONSENT_REQUIRED (not ERR_AGENCY_INACTIVE)"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strict_greater_than
        grounds:
          - calculations.case_net_response_time
          - entities.Case.fields.breached
          - entities.Case.fields.net_elapsed_hours
        distinguishing_aspect: "With effective_window_hours=48 and no pauses, at exactly 48h elapsed net_elapsed_hours==48.00 and breached==false because the comparison is strict net > window (49h would breach)."
        test_recipe:
          setup:
            - "A TAX case triaged NORMAL (effective window 48h) at 2026-03-01T00:00:00Z; clock advanced to exactly 2026-03-03T00:00:00Z (48h later) with no AWAITING pauses."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep K", chamber: "HOUSE", district_name: "OR-3", state_code: "OR", office_email: "k@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy K", email: "cyk@x.com", address: "11 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "TAX", body_template: "Re", response_window_hours: 48, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Refund", description: "d", category: "TAX" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Caseworker
          assert:
            - "Case.${case_id}.effective_window_hours == 48"
            - "Case.${case_id}.net_elapsed_hours == 48.00"
            - "Case.${case_id}.breached == false"

      - name: event_capacity_full_at_equal
        grounds:
          - validations[priority=15]
          - state_machines.EventRegistration.REGISTERED_to_REGISTERED
          - entities.Event.fields.registration_status
        distinguishing_aspect: "With capacity=1, the registration at registered_count 0->1 succeeds and flips registration_status to FULL; a second registration at registered_count==capacity is rejected with ERR_EVENT_FULL (< vs <= boundary), a different metric and endpoint than the SLA breach."
        test_recipe:
          setup:
            - "A scheduled open event of capacity 1 and two active constituents."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep L", chamber: "HOUSE", district_name: "UT-1", state_code: "UT", office_email: "l@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy L1", email: "cyl1@x.com", address: "12 St" }
              as: OfficeAdmin
              captures: { con1_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy L2", email: "cyl2@x.com", address: "13 St" }
              as: OfficeAdmin
              captures: { con2_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Small Hall", capacity: 5 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-05-02T18:00:00Z", end_at: "2026-05-02T19:00:00Z", capacity: 1 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
          trigger:
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con1_id}" }
              as: OfficeAdmin
              captures: { reg1_id: $.data.id }
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con2_id}" }
              as: OfficeAdmin
          assert:
            - "First registration succeeds; Event.${event_id}.registered_count == 1 and Event.${event_id}.registration_status == FULL"
            - "Second registration is 409 with data.error_id == ERR_EVENT_FULL"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_referral_gated_by_constituent_consent
        grounds:
          - state_machines.Case.IN_PROGRESS_to_AWAITING_AGENCY
          - entities.Constituent.fields.data_sharing_consent
          - validations[priority=8]
        distinguishing_aspect: "The Case IN_PROGRESS->AWAITING_AGENCY transition is gated by the Constituent's data_sharing_consent: with consent=false the referral is rejected ERR_CONSENT_REQUIRED; after PATCHing consent=true the same referral succeeds (Case->AWAITING_AGENCY) — pair Case<->Constituent."
        test_recipe:
          setup:
            - "A triaged IN_PROGRESS case whose constituent starts with data_sharing_consent=false; an ACTIVE agency."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep M", chamber: "HOUSE", district_name: "MI-8", state_code: "MI", office_email: "m@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy M", email: "cym@x.com", address: "14 St", data_sharing_consent: false }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "HUD", jurisdiction: "US", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HOUSING", body_template: "Re", response_window_hours: 120, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Sec8", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
          trigger:
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
            - call: "PATCH /constituents/${con_id}"
              payload: { data_sharing_consent: true }
              as: OfficeAdmin
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
              captures: { ref_id: $.data.id }
          assert:
            - "First referral attempt is 403 with data.error_id == ERR_CONSENT_REQUIRED"
            - "After PATCH consent=true, the second attempt creates AgencyReferral.${ref_id} (status DRAFT) and Case.${case_id}.status == AWAITING_AGENCY"

      - name: registration_gated_by_event_registration_status
        grounds:
          - state_machines.EventRegistration.REGISTERED_to_REGISTERED
          - entities.Event.fields.registration_status
          - validations[priority=7]
        distinguishing_aspect: "Creating an EventRegistration is gated by the Event.registration_status: while the event is SCHEDULED but registration CLOSED the attempt fails ERR_EVENT_INVALID_STATE; after open-registration the same request succeeds — pair EventRegistration<->Event, distinct from Case<->Constituent."
        test_recipe:
          setup:
            - "A scheduled event with registration still CLOSED and an active constituent."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep N", chamber: "HOUSE", district_name: "PA-9", state_code: "PA", office_email: "n@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy N", email: "cyn@x.com", address: "15 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Civic Hall", capacity: 100 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-05-03T18:00:00Z", end_at: "2026-05-03T19:00:00Z", capacity: 20 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
              captures: { reg_id: $.data.id }
          assert:
            - "First registration attempt is 409 with data.error_id == ERR_EVENT_INVALID_STATE"
            - "After open-registration, EventRegistration.${reg_id}.status == REGISTERED"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_buffered_overlap_rejected
        grounds:
          - validations[priority=13]
          - entities.Event.fields.venue_id
          - entities.Event.fields.start_at
        distinguishing_aspect: "Two events on the SAME venue with a 15-minute gap (10:00-11:00 then 11:15-12:00) are rejected ERR_VENUE_CONFLICT because the venue interval is expanded by a 30-minute buffer on both sides — buffered interval semantics on the Venue resource."
        test_recipe:
          setup:
            - "Two different representatives, one shared venue, and a first event booked 10:00-11:00."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep O1", chamber: "HOUSE", district_name: "IL-1", state_code: "IL", office_email: "o1@leg.gov" }
              as: OfficeAdmin
              captures: { rep1_id: $.data.id }
            - call: "POST /representatives"
              payload: { full_name: "Rep O2", chamber: "HOUSE", district_name: "IL-2", state_code: "IL", office_email: "o2@leg.gov" }
              as: OfficeAdmin
              captures: { rep2_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Shared Venue", capacity: 200 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep1_id}", venue_id: "${venue_id}", title: "E1", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T11:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event1_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { representative_id: "${rep2_id}", venue_id: "${venue_id}", title: "E2", start_at: "2026-04-01T11:15:00Z", end_at: "2026-04-01T12:00:00Z", capacity: 10 }
              as: OfficeAdmin
          assert:
            - "The second event is 409 with data.error_id == ERR_VENUE_CONFLICT"

      - name: representative_halfopen_adjacent_allowed
        grounds:
          - validations[priority=14]
          - entities.Event.fields.representative_id
          - entities.Event.fields.end_at
        distinguishing_aspect: "For the SAME representative across different venues, a back-to-back booking (10:00-11:00 then 11:00-12:00, end==start) is ALLOWED because representative intervals are half-open, while a truly overlapping 10:30-11:30 booking is rejected ERR_REPRESENTATIVE_CONFLICT — distinct interval semantics from the buffered venue rule."
        test_recipe:
          setup:
            - "One representative, three distinct venues, and a first event booked 10:00-11:00 at venue 1."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep P", chamber: "HOUSE", district_name: "IL-3", state_code: "IL", office_email: "p@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V1", capacity: 200 }
              as: OfficeAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V2", capacity: 200 }
              as: OfficeAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V3", capacity: 200 }
              as: OfficeAdmin
              captures: { v3_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${v1_id}", title: "E1", start_at: "2026-04-02T10:00:00Z", end_at: "2026-04-02T11:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event1_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${v2_id}", title: "E2", start_at: "2026-04-02T11:00:00Z", end_at: "2026-04-02T12:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event2_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${v3_id}", title: "E3", start_at: "2026-04-02T10:30:00Z", end_at: "2026-04-02T11:30:00Z", capacity: 10 }
              as: OfficeAdmin
          assert:
            - "The back-to-back event E2 is created (201); Event.${event2_id}.lifecycle_status == SCHEDULED"
            - "The overlapping event E3 is 409 with data.error_id == ERR_REPRESENTATIVE_CONFLICT"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: agency_open_referral_count_conserved
        grounds:
          - state_machines.AgencyReferral.DRAFT_to_SENT
          - state_machines.AgencyReferral.SENT_to_RESOLVED
          - entities.Agency.fields.open_referral_count
        distinguishing_aspect: "Invariant Agency.open_referral_count == count(AgencyReferral where agency_id==A and status==SENT): send (+1) then resolve (-1) returns the counter to its pre-send value 0 with zero drift."
        test_recipe:
          setup:
            - "A triaged case with consent, an ACTIVE agency, a referral created and SENT (agency.open_referral_count==1)."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep Q", chamber: "HOUSE", district_name: "MA-1", state_code: "MA", office_email: "q@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy Q", email: "cyq@x.com", address: "16 St", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "VA", jurisdiction: "US", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "OTHER", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Vet", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
              captures: { ref_id: $.data.id }
            - call: "POST /agency-referrals/${ref_id}/send"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /agency-referrals/${ref_id}/resolve"
              payload: { response_summary: "closed" }
              as: Caseworker
          assert:
            - "Before resolve Agency.${agency_id}.open_referral_count == 1"
            - "After resolve Agency.${agency_id}.open_referral_count == 0 (equals the pre-send value)"
            - "AgencyReferral.${ref_id}.status == RESOLVED and Case.${case_id}.status == IN_PROGRESS"

      - name: event_registered_count_conserved
        grounds:
          - state_machines.EventRegistration.REGISTERED_to_REGISTERED
          - state_machines.EventRegistration.REGISTERED_to_CANCELLED
          - entities.Event.fields.registered_count
        distinguishing_aspect: "Invariant Event.registered_count == count(EventRegistration where event_id==E and status==REGISTERED): register (+1) then cancel (-1) returns registered_count and the constituent's upcoming_event_count to 0 with zero drift — a conserved quantity distinct from the agency referral ledger."
        test_recipe:
          setup:
            - "A scheduled open event and one active constituent registered (registered_count==1, upcoming_event_count==1)."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep R", chamber: "HOUSE", district_name: "MA-2", state_code: "MA", office_email: "r@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy R", email: "cyr@x.com", address: "17 St" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Town Hall R", capacity: 40 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-05-04T18:00:00Z", end_at: "2026-05-04T19:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /event-registrations/${reg_id}/cancel"
              payload: {}
              as: OfficeAdmin
          assert:
            - "Before cancel Event.${event_id}.registered_count == 1"
            - "After cancel Event.${event_id}.registered_count == 0 (equals the pre-register value)"
            - "Constituent.${con_id}.upcoming_event_count == 0 and EventRegistration.${reg_id}.status == CANCELLED"
