              captures: { cp_v3: $.data.version, preview2: $.data.consent_agreement_preview_cents }
            - call: "POST /product-safety/civil-penalty-cases/${cp_id}/offers"
              payload: { amount_cents: 12000000, offered_by: "AGENCY", expected_case_version: "${cp_v3}" }
              as: PenaltyCounsel
              captures: { cp_v4: $.data.version, preview3: $.data.consent_agreement_preview_cents }
            - call: "POST /product-safety/civil-penalty-cases/${cp_id}/offers"
              payload: { amount_cents: 12000001, offered_by: "RESPONDENT", expected_case_version: "${cp_v4}" }
              as: PenaltyCounsel
              captures: { cp_v5: $.data.version, preview4: $.data.consent_agreement_preview_cents }
          assert:
            - "${hp_risk} == 36.00 and ${days_late} == 0 and ${report_due} == 2026-03-11T00:00:00Z"
            - "${assessed} == 13000000"
            - "${preview0} == 10400000 — no offer stands yet, so the base is the assessment and the tier is TIER_3 (13000000 > 12000000), credit 2600000"
            - "${preview1} == 4499999 — base 4999999 is TIER_1 at 0.10, credit round_half_up(499999.9) == 500000"
            - "${preview2} == 4250000 — base 5000000 is TIER_2 exactly at TIER_2_FLOOR_CENTS, credit 750000"
            - "${preview3} == 10200000 — base 12000000 is still TIER_2 at TIER_2_CEILING_CENTS, credit 1800000"
            - "${preview4} == 9600001 — base 12000001 crosses into TIER_3 at 0.20, credit 2400000"
            - "credit + total == base at every step, so no rounding residue escapes"
            - "CivilPenaltyCase.${cp_id}.current_offer_round == 4 and status == COUNTERED"
            - "CivilPenaltyCase.${cp_id}.cooperation_credit_tier == null and consent_agreement_total_cents == null throughout — preview mode binds nothing"

      - name: consent_preview_rebases_on_the_standing_offer_but_only_acceptance_binds
        claim_type: Variant Selection
        grounds:
          - calculations.consent_agreement_total.variants
          - state_machines[CivilPenaltyCase].transitions[OFFER_MADE -> AGREED]
        distinguishing_aspect: |
          Variant SELECTION rather than divergence: the same formula runs three
          times on one case and the mode is chosen by the calling endpoint. At
          creation the preview variant has no standing offer and must fall back to
          assessed_penalty_cents (10400000); after an AGENCY offer of 5000000 the
          preview must re-base on the OFFER (4250000) while still binding nothing;
          only offer-resolution ACCEPTED may write the five settlement fields and
