          assert:
            - "The first release attempt is refused with error_id == ERR_RELEASE_BLOCKED while the case is OPEN"
            - "After the case is DISMISSED, release_blocked == false on ${score_id} and the retry succeeds with ExamScore.status == RELEASED, ExamScore.ap_score == 5"
  - rule_id: resource_temporal_overlap
    instances:
      - name: alternate_buffer_interval_touching_merge_occupancy
        grounds:
          - calculations.alternate_seat_occupancy
          - state_machines.AlternateExamRequest.UNDER_REVIEW_to_APPROVED
          - entities.AlternateExamRequest.fields.seat_block_conflict
        distinguishing_aspect: "Buffer-interval-merge semantics: each alternate interval is widened by a 30-minute buffer on both sides to [T-30min, T+225min], touching intervals merge because the buffer must stay unoccupied, and approval is refused when the requesting interval overlaps an existing merged block or when the merged-minute total exceeds seat_capacity * BUFFER_BEFORE_MINUTES, so capacity 1 admits only 30 seat-minutes and therefore overflows on the very first 255-minute block."
        test_recipe:
          setup:
            - "A school with seat_capacity 2 and two students; an approved alternate request on 2027-05-10T09:00:00Z; clock at 2027-04-01T00:00:00Z"
