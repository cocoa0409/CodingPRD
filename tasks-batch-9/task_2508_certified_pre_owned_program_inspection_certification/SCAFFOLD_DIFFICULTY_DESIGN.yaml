          assert:
            - "Inspection.${i1}.slot_end_at == 2026-07-31T11:00:00Z, so its buffered interval is [2026-07-31T08:30:00Z, 2026-07-31T11:30:00Z]"
            - "trigger call 1 returns 409 ERR_TECHNICIAN_SLOT_CONFLICT: the candidate buffers to [11:30, 14:30] and touches the occupied interval at exactly 11:30"
            - "trigger call 2 returns 201: [11:31, 14:31] clears the occupied interval by one minute"
            - "trigger call 3 returns 409 ERR_TECHNICIAN_SLOT_CONFLICT: [05:30, 08:30] touches the occupied interval at exactly 08:30 from below"
            - "trigger call 4 returns 201: [05:29, 08:29] clears it by one minute"
