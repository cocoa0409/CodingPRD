      - name: pulp_divert_cascade_frees_machine_window_through_order_deschedule
        grounds:
          - state_machines.PulpBatch.DEINK_HOLD_to_DIVERTED
          - state_machines.ProductionRun.SCHEDULED_to_ABORTED
          - state_machines.CustomerOrder.SCHEDULED_to_SUBMITTED
          - entities.CustomerOrder.fields.shortfall_tons
          - validations.priority_63
          - errors.ERR_MACHINE_WINDOW_CONFLICT
        distinguishing_aspect: |
          The trigger is a pulping-side disposal decision (/divert out of DEINK_HOLD) and the
          terminal hop is a temporal effect rather than a status change: after the run is aborted
          and the order falls back to SUBMITTED with shortfall_tons 8.00, PM2's buffered
          occupancy interval no longer covers the released window, which is proven by
          successfully re-creating a run over the byte-identical window that previously would
          have raised ERR_MACHINE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "FiberGrade DLK_37 and PaperGradeSpec TIS_16 (requires_deink_pulp true, min_brightness_iso 80.0) declared; PaperMachine PM2 (wire_width 2800, max_tons_per_hour 12.00, changeover_buffer 30) RUNNABLE; Customer Softline ACTIVE with wrap_spec KRAFT_ONLY."
            - "A DIP_LINE PulpBatch charging 15.000 tons is driven to DEINK_HOLD by one deink pass closed at brightness 70.0."
            - "ProductionRun R2 is created SCHEDULED on PM2 over 2026-08-06T00:00:00Z..06:00:00Z against that batch with pulp_draw_tons 10.000."
            - "CustomerOrder for 8.00 tons of TIS_16 is SCHEDULED onto R2, so allocated_tons is 0.000 and shortfall_tons will recompute to the full ordered_tons."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 3 }, as: FiberBuyer, as_user_id: "fb_1" }
