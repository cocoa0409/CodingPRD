# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: scenario_create_defaults_applied
        claim_type: defaults
        grounds: [entities.MonitoringScenario.fields.baseline_weight_amount, entities.MonitoringScenario.fields.stale_alert_days, entities.MonitoringScenario.fields.status]
        distinguishing_aspect: "Omitting optional fields applies defaults (baseline weights 0.5/0.3/0.2, stale_alert_days 30) and the initial state is DRAFT."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "VELOCITY-WIRE-1D", name: "Wire velocity 1d", applies_to_txn_types: ["WIRE_OUT"], direction_filter: "DEBIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_status: $.data.status } }
          assert:
            - "MonitoringScenario.${sc1}.baseline_weight_amount == 0.5, baseline_weight_velocity == 0.3, baseline_weight_geo == 0.2, stale_alert_days == 30"
            - "status == DRAFT (initial state); version == 1; id is a server-minted UUID"

      - name: customer_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Customer.fields.country_risk, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A create missing the required enum country_risk is rejected with 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id == ERR_INVALID_REQUEST"
            - "No Customer exists afterwards (a subsequent GET on any returned id is impossible — none returned)"

      - name: transaction_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Transaction.fields.txn_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-range enum value (CRYPTO) for txn_type is rejected with 400 even though every other field is valid."
        test_recipe:
          setup: ["Customer with one account"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8001" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
          trigger:
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 1000, txn_type: "CRYPTO", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-01T00:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 ERR_INVALID_REQUEST; GET /accounts/${ac1}/transactions returns an empty list"

      - name: customer_create_extra_id_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Customer, response_envelope]
        distinguishing_aspect: "Client-supplied id/version on create are ignored: the server mints its own UUID and starts version at 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99, full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id, cu1_v: $.data.version } }
          assert:
            - "201 created; Customer.${cu1}.id != '8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2' (server-minted)"
            - "Customer.${cu1}.version == 1, not 99"

      - name: customer_create_computed_risk_input_ignored
        claim_type: computed_fields
        grounds: [entities.Customer.fields.risk_score_standard, entities.Customer.fields.risk_rating, calculations.customer_risk_rating_recompute]
        distinguishing_aspect: "Client-supplied risk fields are ignored: a fresh customer always computes risk_score_standard == 100, risk_score_enhanced == 100, risk_rating == LOW, sar_filings_365d == 0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW", risk_rating: "PROHIBITED", risk_score_standard: 9999 }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
          assert:
            - "Customer.${cu1}.risk_score_standard == 100 and risk_score_enhanced == 100 (base), risk_rating == LOW"
            - "sar_filings_365d == 0 and open_le_inquiry_count == 0 and any_account_exited == false"

      - name: alert_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /alerts/{id}"]
        distinguishing_aspect: "A well-formed UUID that does not exist yields 404 ERR_NOT_FOUND, not a 500 or empty 200."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /alerts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 404 with error_id == ERR_NOT_FOUND"

      - name: transaction_immutable_event_record
        claim_type: immutability
        grounds: [entities.Transaction]
        distinguishing_aspect: "Transaction has common_fields: false — the create response carries id and created_at but no version/updated_at, and the API surface declares no update or delete endpoint for transactions."
        test_recipe:
          setup: ["Customer with one account"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8002" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
          trigger:
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 250000, txn_type: "WIRE_OUT", direction: "DEBIT", counterparty_country: "GB", posted_at: "2026-05-01T09:00:00Z", channel: "WIRE_DESK" }, as: ComplianceAdmin, captures: { tx1: $.data.id } }
          assert:
            - "Transaction.${tx1} response has id and created_at but no version field (common_fields: false)"
            - "No PUT/PATCH/DELETE /transactions endpoint exists in §1.5 — the record is append-only"

      - name: account_create_with_unknown_customer_returns_404
        claim_type: parent_relationships
        grounds: [entities.Account.fields.customer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Nested creation under a non-existent parent id fails existence validation (path checked left-to-right) with 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accounts", payload: { account_number: "ACC-8003" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 404 ERR_NOT_FOUND"

  - section: state_machines
    instances:
      - name: dismiss_new_alert_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Alert.UNDER_TRIAGE_to_DISMISSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dismiss is declared only from UNDER_TRIAGE; from NEW it fails with 409 ERR_INVALID_STATE and leaves the alert untouched."
        test_recipe:
          setup: ["Scenario ACTIVE with ACTIVE threshold; account firing 3 x 400000 = 1200000 >= 1000000; alert al1 generated and still NEW"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8101" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
          trigger:
            - { call: "POST /alerts/${al1}/dismiss", payload: { dismissal_rationale: "Premature dismissal attempt" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 ERR_INVALID_STATE; Alert.${al1}.status remains NEW and dismissal_rationale remains null"

      - name: auto_closed_alert_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Alert.NEW_to_AUTO_CLOSED, state_machines.Alert]
        distinguishing_aspect: "AUTO_CLOSED is terminal: after the sweep closes a stale alert (age strictly > 30 days), triage is rejected and no transition out of AUTO_CLOSED exists."
        test_recipe:
          setup: ["Alert al1 generated at 2026-05-01T00:00:00Z (default clock), scenario stale_alert_days 30; clock advanced to 2026-06-01T00:00:00Z (age 31 days) and the sweep has run"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8102" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT", stale_alert_days: 30 }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { swept: $.data.alerts_auto_closed } }
          trigger:
            - { call: "POST /alerts/${al1}/triage", as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "Sweep reported alerts_auto_closed == 1; Alert.${al1}.status == AUTO_CLOSED with closure_reason == STALE_EXPIRY"
            - "Triage on the AUTO_CLOSED alert: 409 ERR_INVALID_STATE; status stays AUTO_CLOSED"

      - name: closed_case_decision_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Case.PENDING_QA_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is operator-terminal: sar-decision on a CLOSED case is rejected (only the system reopen via continuing-activity review can leave CLOSED, never the decision endpoint)."
        test_recipe:
          setup: ["Case k1 driven to CLOSED via the NO_SAR path (create -> assign -> start -> decision NO_SAR -> qa PASS)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { k1: $.data.id } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${k1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { k1_v: $.data.version } }
            - { call: "POST /cases/${k1}/sar-decision", payload: { decision: "NO_SAR", decision_rationale: "Documented legitimate activity", expected_case_version: "${k1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${k1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "GET /cases/${k1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { k1_v_closed: $.data.version } }
          trigger:
            - { call: "POST /cases/${k1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Second thoughts", expected_case_version: "${k1_v_closed}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE — OCC version is correct, so the rejection is purely the state gate"
            - "Case.${k1}.status remains CLOSED and decision remains NO_SAR"

      - name: retired_scenario_activate_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MonitoringScenario, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: activate on a RETIRED scenario fails; the retire precondition (no open alerts) is also exercised by the successful retirement."
        test_recipe:
          setup: ["Scenario with an APPROVED threshold, activated, then retired (zero alerts exist)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/retire", as: BSAManager, as_user_id: "${mg1}", captures: { sc1_state: $.data.status } }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
          assert:
            - "Retire succeeded with status RETIRED (no NEW/UNDER_TRIAGE alerts existed)"
            - "Re-activate attempt: 409 ERR_INVALID_STATE; scenario stays RETIRED"

      - name: review_complete_before_start_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ContinuingReview.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A continuing review cannot complete directly from SCHEDULED — the IN_PROGRESS step is mandatory."
        test_recipe:
          setup: ["SAR1 filed at default clock 2026-05-01T00:00:00Z; its ContinuingReview exists in SCHEDULED"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version } }
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /sar-reports/${sar1}/continuing-reviews", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1: "$.data[0].id" } }
          trigger:
            - { call: "POST /continuing-reviews/${rev1}/complete", payload: { outcome: "CLOSE_MONITORING" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE (SCHEDULED -> COMPLETED is not a declared transition); review remains SCHEDULED with outcome NONE"

      - name: executed_decision_reverse_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AccountDecision.APPROVED_to_REVERSED, state_machines.AccountDecision.APPROVED_to_EXECUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The compensating reverse action exists only from APPROVED; once EXECUTED the account exit is final and reverse fails with 409."
        test_recipe:
          setup: ["Customer with account ac1; EXIT decision proposed, approved, and already EXECUTED (account EXITED, customer EXITED)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
