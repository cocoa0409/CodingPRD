            - "AllocationLine(${run}, ${t1}, ORDINARY).amount_cents == 1822000 (6000bps x 181d + 4000bps x 184d)"
            - "AllocationLine(${run}, ${t2}, ORDINARY).amount_cents == 1828000"
            - "sum == 3650000 (zero-sum holds under proration)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: priority_ordering_covered_by_difficulty
        claim_type: priority_ordering
        grounds: [validations]
        excluded_because:
          difficulty_instance: k1_approve_state_beats_stale_fiscal
          rationale: "Dual-failure priority (state vs business_fiscal and business_safety vs business_temporal) is asserted by the two Rule-5 instances."

      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request without X-User-Role fails priority 1 before everything else."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ""
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_MISSING_AUTH_CONTEXT, http 400 (not 404 — auth precedes existence)"

      - name: not_found_beats_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 5): approving a random-uuid K1 returns 404 ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /funds/k1-packages/00000000-0000-0000-0000-000000000000/approve"
              payload: {}
              as: TaxReviewer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

