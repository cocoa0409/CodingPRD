  - name: missing_auth_headers_return_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors.ERR_UNAUTHENTICATED
    - roles
    distinguishing_aspect: |
      Priority 1 is the only §1.4 rule that runs before path resolution, so it is the one whose evidence must be a request that WOULD otherwise succeed and a request that would otherwise 404 — both must return 401 rather than 200 or 404, which proves the header check is not layered behind resource lookup.
    test_recipe:
      setup:
