        grounds:
          - state_machines.Booking.fulfillment_status.TICKETED_to_CHECKED_IN
          - state_machines.PortCall.OPEN_FOR_SALE_to_IN_PORT
          - validations[19].ERR_INVALID_BOOKING_ACTION
          - validations[37].ERR_CHECKIN_WINDOW_CLOSED
          - endpoints[POST /shore-excursions/bookings/{bookingId}/fulfillment-actions]
        distinguishing_aspect: |
          Entity pair Booking x PortCall: the clock is deliberately inside the check-in window
          [meeting - 45, meeting + 10], so the temporal rule at priority 37 is satisfied and the ONLY
