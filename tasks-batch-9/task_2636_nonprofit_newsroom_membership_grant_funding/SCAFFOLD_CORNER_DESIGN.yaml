      - name: rbac_undeclared_role_header_is_unauthenticated_not_unauthorized
        claim_type: Exclusive operation denied to other roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: >-
          A role string outside the five declared roles fails the presence check at priority 1
          with a 401, ahead of the endpoint role check at priority 2 that would have produced a
          403; the same 401 is returned when the X-User-ID header is absent.
        test_recipe:
          setup: "Empty database. The first call sends X-User-Role: Auditor, which is not one of the five declared roles; the second sends a declared role with no X-User-ID header at all."
          setup_api_calls: []
