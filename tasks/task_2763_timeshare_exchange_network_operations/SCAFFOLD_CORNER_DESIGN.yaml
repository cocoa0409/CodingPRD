      - name: affiliation_before_any_season_band_is_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority 29]", "errors[ERR_AFFILIATION_REQUIRES_SEASON_BANDS]", "state_machines.Resort.affiliation_status"]
        distinguishing_aspect: >-
          A resort cannot be activated until its trading calendar exists, because every deposit
          valuation depends on resolving a season band. The check is a cross-entity existence count
          performed on a state-transition endpoint that takes no body at all, so the only way to fail
          it correctly is to look at the child collection rather than at the request.
        test_recipe:
          setup: >-
            A single resort created and still PENDING_AFFILIATION. No SeasonBand rows exist anywhere in
            the network.
          setup_api_calls:
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_AFFILIATION_REQUIRES_SEASON_BANDS, not ERR_INVALID_STATE_TRANSITION — PENDING_AFFILIATION to ACTIVE is a legal edge, the guard is the missing calendar"
            - "GET /exchange-network/resorts/${resort_a} — affiliation_status still \"PENDING_AFFILIATION\" and affiliated_on still null"
            - "GET /exchange-network/season-bands?resort_id=${resort_a} — total_count == 0"
            - "after adding one GOLD band 04-01..06-30 the identical call returns HTTP 200 with affiliation_status \"ACTIVE\" and affiliated_on \"2026-08-01\""

      - name: withdrawn_deposit_named_as_funding_is_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority 13]", "errors[ERR_DEPOSIT_NOT_AVAILABLE]", "state_machines.Deposit.deposit_status"]
        distinguishing_aspect: >-
          The funding deposit's own state, not the requester's, decides whether a request may be filed,
          and WITHDRAWN is terminal, so the row is permanently unusable as collateral even though it is
          still readable and still owned by the member. The rejection must precede the priority 31-33
          fiscal checks, so a member with a full wallet still gets 409 rather than a charge.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated, member M1 on PLUS with dues paid. M1 banks a ONE_BR week
            checking in 2027-06-15 worth 82 and then withdraws it, so trading_power_balance returns to
            0 while wallet_credit_cents stays at 80100.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
