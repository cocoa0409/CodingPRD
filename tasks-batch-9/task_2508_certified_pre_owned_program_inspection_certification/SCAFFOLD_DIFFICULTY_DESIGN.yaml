            - "after trigger call 3: Dealer.${d1}.fee_billed_cents_total == 240800, fee_credited_cents_total == 120400, fee_balance_cents == 120400"
            - "after trigger call 4: Certification.${c2}.status == DECERTIFIED with decertification_reason ADMIN_ACTION and fee_credited_cents == 0"
