            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /editor-assignments/${ea_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /reviewers"
              payload: { email: "rev_v@inst.org", full_name: "Reviewer V", affiliation: "Univ Delta", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_v_id: $.data.id }
            - call: "GET /reviewers/${rv_v_id}"
              as: SystemAdmin
              captures: { rv_v_open_before: $.data.open_invitation_count, rv_v_score_before: $.data.reliability_score_rolling }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}", reviewer_id: "${rv_v_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_v_id: $.data.id }
            - call: "GET /reviewers/${rv_v_id}"
              as: SystemAdmin
