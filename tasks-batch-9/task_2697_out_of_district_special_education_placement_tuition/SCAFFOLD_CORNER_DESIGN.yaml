              as_user_id: "u-admin-1"
            - call: "PATCH /ood-placements/private-schools/${sch_id}/approval-status"
              payload: { approval_status: "REVOKED" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          assert:
            - "The setup create returned approval_status == PROVISIONAL, active_rate_schedule_id == null and version == 1"
            - "The first PATCH returns HTTP 200 with data.approval_status == APPROVED and data.version == 2"
            - "The second PATCH returns HTTP 200 with data.approval_status == REVOKED and data.version == 3"
            - "data.name, data.state_approval_id and data.residential_capable are unchanged throughout"
