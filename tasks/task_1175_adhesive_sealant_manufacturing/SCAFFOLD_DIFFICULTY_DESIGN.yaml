  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: pot_life_inclusive_boundary_on_run_complete
        grounds:
          - calculations.pot_life_window_check
          - state_machines.PackagingRun.OPEN_to_SEALED
