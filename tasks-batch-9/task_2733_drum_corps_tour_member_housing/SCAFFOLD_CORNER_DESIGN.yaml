              as: TourManager
              captures: { completed_show_id: "$.data.id" }
            - call: "POST /tour-stops/${confirmed_show_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${rehearsal_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${completed_show_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-21T00:00:00Z" }
              as: TourManager
            - call: "POST /tour-stops/${rehearsal_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${completed_show_id}/complete"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${confirmed_show_id}", appearance_fee_cents: 100000, prize_pool_cents: 500000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { not_completed_err: "$.data.error_id" }
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${rehearsal_id}", appearance_fee_cents: 100000, prize_pool_cents: 500000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { rehearsal_err: "$.data.error_id" }
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${completed_show_id}", appearance_fee_cents: 100000, prize_pool_cents: 500000, projected_placement: 7 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_id: "$.data.id" }
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${completed_show_id}", appearance_fee_cents: 100000, prize_pool_cents: 500000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { duplicate_err: "$.data.error_id" }
          assert:
            - "${not_completed_err} == ERR_STOP_NOT_COMPLETED with HTTP 409 — CONFIRMED is not COMPLETED"
            - "${rehearsal_err} == ERR_STOP_NOT_COMPLETED with HTTP 409 — a COMPLETED stop whose stop_type is REHEARSAL_ONLY is still outside the input set, and its settlement_state stayed NONE at completion"
            - "the legal draft returns 201 with the tail prize band applied: provisional_prize_cents == 25000 (placement 7 uses PLACEMENT_PRIZE_PCT_TAIL 0.05), provisional_gross_cents == 125000, provisional_circuit_fee_cents == 5000 and provisional_net_cents == 120000"
            - "${duplicate_err} == ERR_SETTLEMENT_ALREADY_EXISTS with HTTP 409 and ShowSettlement.${settlement_id} is unchanged"
            - "Season.${season_id}.tour_revenue_cents == 0 — a DRAFT settlement contributes nothing"

      - name: installment_schedule_rounding_order
        claim_type: precision
        grounds:
          - calculations.installment_schedule
        excluded_because:
          difficulty_instance: installment_schedule_whole_principal_surcharge_then_integer_split
          rationale: "The precision corner for this calculation is the pinned rounding order itself — surcharge the whole principal once, then split the financed total — and that §1.8 combinatorial_formula instance already asserts the full EXTENDED_6 schedule (financed 409898, dues 68317/68317/68316/68316/68316/68316) against the forbidden per-line alternative that lands two cents short."

      - name: transport_plan_dimension_combination
        claim_type: correct_result
        grounds:
          - calculations.transport_plan
        excluded_because:
          difficulty_instance: transport_plan_four_dimension_truck_requirement
          rationale: "That §1.8 combinatorial_formula instance already computes total_load_cuft / total_load_lbs / trucks_required for the (40, 95, 25, 352) load and its (40, 95, 24, 349) neighbour, proving the two additive surcharges are applied to the max() of the two ceilings rather than folded into them."

      - name: stop_meal_cost_per_class_rounding
        claim_type: precision
        grounds:
          - calculations.stop_meal_cost
        excluded_because:
          difficulty_instance: stop_meal_cost_per_dietary_class_rounding_before_multiplication
          rationale: "The per-dietary-class rounding boundary (12939 versus the forbidden 12937) and the ON_TOUR-only input set are both asserted by that §1.8 instance, which builds a mixed-diet roster and reads meal_cost_cents off the confirm snapshot."

      - name: circuit_fee_tier_boundaries_and_half_up_ties
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.show_settlement_payout.constants
        excluded_because:
          difficulty_instance: circuit_fee_tier_boundary_and_half_up_tie_at_settlement_draft
          rationale: "That §1.8 boundary_precision_check instance already probes gross 1499999 versus 1500000 (fee 60000 versus 82500, the tier read off the full gross rather than marginally) and the exact .5 tie at 94.50 -> 95, so a second tier-boundary corner would re-assert the same two constants."

      - name: withdrawal_variant_selection_and_delta
        claim_type: variant_divergence
        grounds:
          - calculations.member_withdrawal_obligation.variants
        excluded_because:
          difficulty_instance: withdrawal_prorated_spring_versus_liquidated_ladder_obligation
          rationale: "Variant divergence, variant selection and the ledger delta for this calculation are the entire subject of that §1.8 dual_variant_calc instance (402782 on 2027-06-11 versus 314925 on 2027-06-12, a delta of 87857 on identical contracts), including the admin fee added after rounding."

      - name: bed_night_aggregation_after_release_and_rebooking
        claim_type: aggregation_running_total
        grounds:
          - calculations.housing_bed_night_capacity
        excluded_because:
          difficulty_instance: housing_release_and_rebooking_restore_bed_night_ledgers_without_drift
          rationale: "The aggregation corner (running total correct after add, after reversal, and against the minimum-bed floor) is asserted by that §1.8 compensating_invariant instance, which walks occupied_bed_nights 10 -> 20 -> 25 and back with the agreement, school and season ledgers reconciled at every step."

      - name: interval_adjacency_for_stays_and_shifts
        claim_type: interval_merge_adjacency
        grounds:
          - calculations.housing_bed_night_capacity
          - validations.priority_43_ERR_VOLUNTEER_SHIFT_OVERLAP
        excluded_because:
          difficulty_instance: touching_housing_stays_allowed_while_overlapping_stay_is_rejected
          rationale: "Adjacent-interval acceptance (gap exactly zero) versus overlap rejection is the defining pair of that §1.8 resource_temporal_overlap instance for housing stays, and its sibling instance touching_volunteer_shifts_allowed_while_overlapping_shift_is_rejected covers the shift half of the same claim."

  - section: validations
    instances:
      - name: call_with_missing_x_user_id_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: "Priority 1 outranks everything: a request with no identity headers must be ERR_UNAUTHENTICATED (401) even when the path id does not exist and the body is malformed, while a well-identified request with the wrong role on the same route is ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One season exists so that the role check can be isolated on a real path."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "GET /seasons/33333333-3333-4333-8333-333333333333"
              as: NONE
              note: "sent with no X-User-Role and no X-User-ID header at all"
              captures: { unauth_err: "$.data.error_id" }
            - call: "POST /seasons"
              payload: { year: 2027 }
              as: NONE
              note: "no identity headers AND a body missing four required fields"
              captures: { unauth_over_schema_err: "$.data.error_id" }
            - call: "POST /seasons"
              payload: { name: "Pirate Season", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: TourManager
              captures: { forbidden_err: "$.data.error_id" }
          assert:
            - "${unauth_err} == ERR_UNAUTHENTICATED with HTTP 401 — priority 1 outranks the priority 7 existence check on the unknown season id"
            - "${unauth_over_schema_err} == ERR_UNAUTHENTICATED with HTTP 401 — priority 1 also outranks the priority 3 schema check"
            - "${forbidden_err} == ERR_UNAUTHORIZED with HTTP 403 because POST /seasons is exclusive to CorpsDirector"
            - "exactly one Season exists after the three rejected calls"

      - name: housing_stay_must_fall_inside_the_agreement_window
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_41_ERR_STAY_OUTSIDE_AGREEMENT_WINDOW
          - calculations.housing_bed_night_capacity
        distinguishing_aspect: "Pass and fail sides of one temporal rule: a stay whose check_out_date equals the agreement end_date is INSIDE the half-open window and must be accepted for the full 26 nights, while a stay starting one day before start_date and a stay ending one day after end_date must both be refused — and the refusals must not touch the agreement version or its bed-night ledger."
        test_recipe:
          setup:
            - "A SIGNED spring-training agreement runs 2027-05-10 to 2027-06-05 at a 30-space school with no minimum billable beds. Two adult members exist."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 500, minimum_billable_beds: 0 }
              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_a_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Blair Osei", email: "blair@corps.test", date_of_birth: "2004-07-19", section: "PERCUSSION", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_b_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v1: "$.data.version" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_a_id}", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-06-05", expected_facility_agreement_version: "${agreement_v1}" }
              as: MembershipCoordinator
              captures: { housing_a_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v2: "$.data.version" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_b_id}", space_index: 2, check_in_date: "2027-05-09", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_v2}" }
              as: MembershipCoordinator
              captures: { early_err: "$.data.error_id" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_b_id}", space_index: 2, check_in_date: "2027-05-20", check_out_date: "2027-06-06", expected_facility_agreement_version: "${agreement_v2}" }
              as: MembershipCoordinator
              captures: { late_err: "$.data.error_id" }
          assert:
            - "the exact-fit stay returns 201 with HousingAssignment.${housing_a_id}.nights == 26 and occupant_is_minor == false"
            - "${early_err} == ERR_STAY_OUTSIDE_AGREEMENT_WINDOW with HTTP 409 (check_in_date one day before start_date)"
            - "${late_err} == ERR_STAY_OUTSIDE_AGREEMENT_WINDOW with HTTP 409 (check_out_date one day after end_date)"
            - "FacilityAgreement.${agreement_id}.occupied_bed_nights == 26, billable_bed_nights == 26 and billable_cents == 13000 — the two refusals changed nothing"
            - "${agreement_v2} == ${agreement_v1} + 1 and the agreement version is still ${agreement_v2} after both refusals, so a rejected write never bumps the OCC field"
            - "HostSchool.${school_id}.reserved_bed_nights == 26 and Season.${season_id}.housing_cost_cents == 13000"

      - name: conditional_credential_and_show_fields_track_their_flag
