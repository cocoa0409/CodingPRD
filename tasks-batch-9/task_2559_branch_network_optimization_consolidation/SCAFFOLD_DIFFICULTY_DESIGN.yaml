        distinguishing_aspect: |
          A decimal input (miles) is funnelled through round_half_up into an integer point score and
          simultaneously tested against a second, unrounded inclusive gate. 5.0 vs 4.9 miles changes
          the score by one point AND flips the >= 5.0 LMI extension (120 vs 90 days); dropping the
          lmi flag at the same 5.0 miles lands the score on 34, exactly one point under
          TIER_MODERATE_MIN 35. The two thresholds are crossed by different input dimensions.
