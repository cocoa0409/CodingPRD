  - section: errors
    instances:
      - name: unauthenticated_requests_are_rejected_before_role_and_state
        claim_type: authentication
        grounds:
          - "errors.ERR_UNAUTHENTICATED"
          - "validations[priority=1]"
          - "errors.ERR_ROLE_FORBIDDEN"
          - "errors.ERR_INVALID_STATE_TRANSITION"
        distinguishing_aspect: >-
          Authentication is the first gate, so a request with no X-User-ID and no X-User-Role header is 401
          ERR_UNAUTHENTICATED on a read, on a write and on a transition that would also have failed its
          state check - the response never reveals which later rule would have fired, and no row is
          created or mutated.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 exists in permit_state PROVISIONED with version 1"
            - "each triggering call below is sent with neither an X-User-ID nor an X-User-Role header"
            - "ACTIVATE_PERMIT on Z1 would fail its own precondition anyway, because the zone has no APPROVED segment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "GET /service-zones/${z}"
            - call: "POST /service-zones"
              payload: { name: "Sunset", municipality_code: "SFS", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
          assert:
            - "all three calls return 401 with error_id ERR_UNAUTHENTICATED"
            - "none of the three responses carries error_id ERR_ROLE_FORBIDDEN or ERR_INVALID_STATE_TRANSITION"
            - "each response has response_type == error and data keys exactly error_id and message"
            - "ServiceZone.${z}.permit_state == PROVISIONED and ServiceZone.${z}.version == 1"
            - "GET /service-zones as PlatformAdmin reports total_count == 1, so the unauthenticated create wrote nothing"
      - name: wrong_role_on_a_write_is_rejected_with_role_forbidden
        claim_type: authorization
        grounds:
          - "errors.ERR_ROLE_FORBIDDEN"
          - "validations[priority=2]"
          - "roles.FleetDispatcher.exclusive_operations"
          - "roles.SafetyOfficer.exclusive_operations"
          - "roles.CustomerSupport.exclusive_operations"
        distinguishing_aspect: >-
          The role matrix is enforced per endpoint and the refusal is 403 ERR_ROLE_FORBIDDEN regardless of
          how senior the caller is: a FleetDispatcher may not provision a zone and may not touch the health
          dimension, and a PlatformAdmin may not spend the remedy budget - the exclusive operations of a role
          are exclusive against every other role, not merely against the weakest one.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with one APPROVED segment"
            - "Robot R1 exists in the zone with duty_state AVAILABLE and health_state NOMINAL"
