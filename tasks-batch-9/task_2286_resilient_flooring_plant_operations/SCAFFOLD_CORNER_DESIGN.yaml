            - &wcRaw
              call: "POST /warranty-claims"
              payload: { claim_code: "WC-RAW", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: DELAMINATION, claimed_area_sqm: 25.50, installed_on: "2026-08-05T00:00:00Z", reported_on: "2029-08-05T00:00:00Z" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { wc_raw_id: $.data.id, wc_raw_status: $.data.status, wc_raw_reviews: $.data.required_reviews }
          trigger:
            - call: "POST /warranty-claims/${wc_raw_id}/adjudicate"
              payload: { decision: APPROVE }
              as: WarrantyAdjuster
