        claim_type: optimistic_concurrency
        grounds: [entities.Quote.fields.version, state_machines.Quote.PRICED_to_APPROVED]
        distinguishing_aspect: "A successful Quote approve increments Quote.version by exactly 1 over its PRICED value."
        excluded_because:
          difficulty_instance: dual_variant_calc / quote_estimate_vs_workorder_actual_cost_diverge
          rationale: "That instance captures q_v at PRICE and approves with it successfully; the version-bump side effect is exercised when the subsequent flow proceeds."

