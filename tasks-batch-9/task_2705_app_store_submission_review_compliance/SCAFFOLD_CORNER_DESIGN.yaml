          setup:
            - "Build 100 of Northwind Wallet is IN_REVIEW, signed with the ACTIVE PROVISIONING_PROFILE."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /signing-credentials/${prof_id}/revoke"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409 and error.error_id == ERR_CREDENTIAL_IN_USE"
            - "SigningCredential.${prof_id}.status == ACTIVE"
            - "Submission.${sub_id}.status == IN_REVIEW"

      - name: revoking_an_already_revoked_credential_is_refused_by_terminal_lockdown
            
        claim_type: Terminal State Lockdown
