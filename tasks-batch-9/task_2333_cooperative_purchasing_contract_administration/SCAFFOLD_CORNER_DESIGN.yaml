      - name: a_suspension_between_award_and_execution_blocks_execution_but_not_contract_creation
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_25
          - errors.ERR_SUPPLIER_NOT_QUALIFIED
          - state_machines.Supplier.qualification_status.QUALIFIED_to_SUSPENDED
          - state_machines.Supplier.qualification_status.SUSPENDED_to_QUALIFIED
          - state_machines.MasterContract.status.PENDING_EXECUTION_to_ACTIVE
        distinguishing_aspect: >-
          Priority 25 does not list POST /coop/master-contracts, so a contract may be papered for a supplier that is already SUSPENDED; the gate bites only at EXECUTE. The suspension also proves it cascades nothing here, because the contract was PENDING_EXECUTION rather than ACTIVE, and REINSTATE is permitted because performance_tier is PREFERRED, not PROBATION.
