# =============================================================================
# §1.9 Scaffold Corner Design — task 0989 compost-pickup
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Plan shorthand (same literals as §1.8):
#   RES: weekly 1200, credit_rate 10, allowance 2, BIN_35L (20 kg)
#   COM: base 3000, per-kg 7, included 40, credit_rate 5, allowance 4,
#        BIN_240L (60 kg)
# Clock default 2026-05-01T00:00:00Z. Mondays: 2026-05-04/11/18/25, 06-01/08/15/22.
# =============================================================================

scaffold_corner_design:
  # ============================================================== entities ==
  - section: entities
    instances:
      - name: create_subscriber_applies_defaults
        claim_type: defaults
        grounds: ["entities.Subscriber.fields.account_standing", "entities.Subscriber.fields.credit_balance_cents"]
        distinguishing_aspect: "A fresh subscriber is created with account_standing GOOD_STANDING, credit_balance_cents 0, version 1 — computed fields are not client-settable."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "GET /subscribers/${sub_a}", payload: {}, as: OperationsManager }
          assert:
            - "Subscriber.${sub_a}.account_standing == GOOD_STANDING"
            - "Subscriber.${sub_a}.credit_balance_cents == 0 and version == 1"

      - name: create_subscription_missing_required_plan_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /subscriptions without plan_id is rejected 400 ERR_INVALID_REQUEST before any existence or state check runs."
        test_recipe:
          setup: ["one subscriber exists"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", route_id: "00000000-0000-4000-8000-000000000000", start_date: "2026-05-01" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (shape check at priority 3 fires before the 404 on route_id)"

      - name: create_subscriber_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Subscriber.fields.subscriber_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "subscriber_type 'HOUSEHOLD' is not in {RESIDENTIAL, COMMERCIAL} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "HOUSEHOLD", address: "1 A St" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_unknown_subscriber_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /subscribers/00000000-0000-4000-8000-000000000000", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: create_subscriber_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Subscriber.fields.credit_balance_cents", "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied id / version / credit_balance_cents on create are ignored: server mints its own id, version starts at 1, balance is 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St", id: "11111111-1111-4111-8111-111111111111", version: 99, credit_balance_cents: 777 }, as: Anonymous, captures: { sub_a: $.data.id } }
          assert:
            - "Subscriber.${sub_a}.id != 11111111-1111-4111-8111-111111111111"
            - "Subscriber.${sub_a}.version == 1 and credit_balance_cents == 0"

      - name: create_subscription_type_mismatch_returns_invalid_request
        claim_type: type_constraints
        grounds: ["endpoints.POST /subscriptions", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A RESIDENTIAL subscriber cannot subscribe to a COMMERCIAL plan -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["COM plan, route, two clean BIN_240L bins, one RESIDENTIAL subscriber"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "COM", name: "Commercial", subscriber_type: "COMMERCIAL", bin_type: "BIN_240L", included_bins: 1, weekly_price_cents: 0, metered_base_cents: 3000, per_kg_rate_cents: 7, included_kg_per_week: 40, credit_rate_cents_per_kg: 5, skip_allowance_per_quarter: 4 }, as: OperationsManager, captures: { plan_com: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_com}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_subscription_unknown_route_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Subscription.fields.route_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a route_id that does not exist -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["RES plan and subscriber exist"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "00000000-0000-4000-8000-000000000000", start_date: "2026-05-01" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ========================================================= state_machines ==
  - section: state_machines
    instances:
      - name: subscription_initial_state_active
        claim_type: initial_state
        grounds: ["state_machines.Subscription"]
        distinguishing_aspect: "A new subscription starts ACTIVE with strike_count 0, skips_used_this_quarter 0, empty pause_windows."
        test_recipe:
          setup: ["RES plan, route, one clean bin, subscriber"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
          trigger:
            - { call: "GET /subscriptions/${subs_a}", payload: {}, as: OperationsManager }
          assert:
            - "Subscription.${subs_a}.service_status == ACTIVE, strike_count == 0, skips_used_this_quarter == 0, pause_windows == []"

      - name: pickup_initial_state_scheduled
        claim_type: initial_state
        grounds: ["state_machines.PickupEvent"]
        distinguishing_aspect: "generate-stops creates PickupEvents in SCHEDULED with final_kg null and no bins recorded yet."
        test_recipe:
          setup: ["RES plan, route, one clean bin, one ACTIVE subscription"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
          trigger:
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
          assert:
            - "PickupEvent.${pk1}.status == SCHEDULED and final_kg is null and collected_bin_id is null"

      - name: cancel_already_cancelled_subscription_returns_state_conflict
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Subscription", "errors[ERR_SUBSCRIPTION_STATE_CONFLICT]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected and nothing mutates."
        test_recipe:
          setup: ["one ACTIVE subscription, already cancelled once"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions/${subs_a}/cancel", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/cancel", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSCRIPTION_STATE_CONFLICT and service_status remains CANCELLED"

      - name: terminal_subscription_rejects_plan_change
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Subscription", "concurrency_rules[plan-change-stale-subscription]"]
        distinguishing_aspect: "plan-change on a CANCELLED subscription fails the state gate even with the correct (final) version."
        test_recipe:
          setup: ["RES plan plus second RES plan, one CANCELLED subscription with known version"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /service-plans", payload: { code: "RES2", name: "Residential Plus", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1500, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 12, skip_allowance_per_quarter: 3 }, as: OperationsManager, captures: { plan_res2: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions/${subs_a}/cancel", payload: {}, as: OperationsManager }
            - { call: "GET /subscriptions/${subs_a}", payload: {}, as: OperationsManager, captures: { sub_v: $.data.version } }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/plan-change", payload: { new_plan_id: "${plan_res2}", expected_subscription_version: "${sub_v}" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSCRIPTION_STATE_CONFLICT (state gate fires even though expected_subscription_version matches)"

      - name: complete_missed_pickup_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PickupEvent.SCHEDULED_to_COMPLETED", "errors[ERR_PICKUP_NOT_ACTIONABLE]"]
        distinguishing_aspect: "MISSED is terminal for the driver: completing a MISSED pickup -> ERR_PICKUP_NOT_ACTIONABLE, no credit created."
        test_recipe:
          setup: ["one ACTIVE subscription; week 2026-06-01 generated and marked MISSED"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/miss", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PICKUP_NOT_ACTIONABLE"
            - "Subscriber.${sub_a}.credit_balance_cents == 0 (no EARNED_ESTIMATED entry exists for ${pk1})"

      - name: resume_from_active_returns_state_conflict
        claim_type: invalid_transition
        grounds: ["state_machines.Subscription.PAUSED_to_ACTIVE", "errors[ERR_SUBSCRIPTION_STATE_CONFLICT]"]
        distinguishing_aspect: "resume is only legal from PAUSED; on an ACTIVE subscription it is rejected."
        test_recipe:
          setup: ["one ACTIVE subscription"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSCRIPTION_STATE_CONFLICT"

      - name: pay_already_paid_invoice_returns_not_payable
        claim_type: invalid_transition
        grounds: ["state_machines.Invoice.ISSUED_to_PAID", "errors[ERR_INVOICE_NOT_PAYABLE]"]
        distinguishing_aspect: "Paying a PAID invoice is rejected; totals unchanged, no second INVOICE_APPLICATION_DEBIT appears."
        test_recipe:
          setup: ["RES subscription; week 2026-05-04 completed (credit 100); billing run issued invoice (subtotal 1200, applied 100, total 1100); invoice paid once"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_a}" }, as: OperationsManager, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /invoices/${inv1}/pay", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
          trigger:
            - { call: "POST /invoices/${inv1}/pay", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_NOT_PAYABLE and Invoice.${inv1}.status remains PAID with total_cents == 1100"

      - name: fulfill_cancelled_redemption_returns_not_fulfillable
        claim_type: invalid_transition
        grounds: ["state_machines.CreditRedemption", "errors[ERR_REDEMPTION_NOT_FULFILLABLE]"]
        distinguishing_aspect: "CANCELLED redemptions cannot be fulfilled; the released stock reservation is not re-taken."
        test_recipe:
          setup: ["RES subscription; week 2026-06-01 (SUMMER x1.2) completed at 0.5 then weighed net 40.00 -> final 40.00 kg (est credit 120, final credit round(40 x 10 x 1.2) = 480, adjustment +360, balance 480); ops adjustment +2000 -> balance 2480; 1-bag redemption created then cancelled"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /routes/${route1}/weigh-tickets", payload: { service_date: "2026-06-01", gross_kg: 45.0, tare_kg: 5.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /subscribers/${sub_a}/credit-adjustments", payload: { amount_cents: 2000, reason: "promo" }, as: OperationsManager }
