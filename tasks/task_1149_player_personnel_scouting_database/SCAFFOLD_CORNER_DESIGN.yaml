              as: GeneralManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OUTCOME_NOT_DRAFTED, HTTP 409"

      - name: authz_precedes_existence_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "Priority conflict auth(2) vs existence(4): an AreaScout reading a non-existent budget gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["one AREA scout"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /scouting/budgets/00000000-0000-0000-0000-000000000000"
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (auth beats existence)"

      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /scouting/prospects"
              captures: { err: $.data.error_id }
          assert:
