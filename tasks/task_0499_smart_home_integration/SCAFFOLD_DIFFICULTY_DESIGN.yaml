            # --- project 3 (Visit C) ---
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "15C Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { p3_id: $.data.id, p3_v0: $.data.version }
            - call: "POST /projects/${p3_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${p3_v0}" }
              as: SystemsDesigner
              captures: { p3_prop: $.data.id }
            - call: "POST /projects/${p3_id}/proposals/${p3_prop}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${p3_id}/proposals/${p3_prop}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${p3_id}/proposals/${p3_prop}/accept"
