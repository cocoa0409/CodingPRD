      - name: audit_chain_genesis_and_verify
        claim_type: correct_result
        grounds: [calculations.audit_hash_chain, entities.AuditEvent]
        distinguishing_aspect: "After exactly 4 mutating calls (clock set, branch, customer, one below-threshold deposit) the chain has 4 events, sequence_no starts at 1 with the 64-zero genesis prev_hash, and verify-chain reports chain_valid true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
