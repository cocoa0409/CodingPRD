          The transfer branch of the affiliation endpoint carries a CE gate the issuance branch does not:
          a freshly issued licensee has ce_hours_valid 0 against an ACTIVE requirement of 12, so the
          very first transfer is refused with the same error reactivation uses, and only a 12-hour CE
