              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p3_id}", put_up: "CUT", requested_length_ft: 2500, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
          trigger:
            - call: "POST /quotes/${q_id}/issue"
