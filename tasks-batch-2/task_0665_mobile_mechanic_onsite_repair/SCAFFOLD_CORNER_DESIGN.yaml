  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_dispatch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-stale-request]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on dispatch: after the request version advances (an abort+revert bumps it), a dispatch carrying the pre-advance version is rejected with ERR_STALE_VERSION (412); a retry with the current version succeeds."
        test_recipe:
          setup:
            - "Customer C26 Z1; Mechanic K26 Z1 TIER2; SR APPROVED; dispatched then aborted so the request version advanced beyond the stale value captured before the first dispatch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c26@x.com", full_name: "C TwentySix", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c26: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K26", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c26}", vehicle_vin: "1HGCM82633A100026", symptom_text: "x" }
              as: Customer
              as_user_id: "${c26}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /quotes/${q}/approve"
              payload: { expected_service_request_version: "${v1}" }
              as: Customer
              as_user_id: "${c26}"
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v_stale: $.data.version }
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${v_stale}" }
              as: Dispatcher
              captures: { jv: $.data.id }
            - call: "POST /job-visits/${jv}/abort"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-03T09:00:00Z", scheduled_end_utc: "2026-04-03T10:00:00Z", expected_service_request_version: "${v_stale}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412"
            - "ServiceRequest.${sr}.status == APPROVED (no new JobVisit dispatched from the stale call)"

      - name: occ_quote_approve_stale_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-approve-stale-request]
        excluded_because:
          difficulty_instance: dual_variant_calc / estimate_vs_final_total_diverge_on_service_request
          rationale: "Quote-approve OCC happy path is exercised throughout §1.8 setups; the dedicated stale-version dispatch corner above covers the negative OCC path for the same parent entity. A quote-approve stale negative is structurally identical, so a separate corner is omitted."

