# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Shift Scheduling & Fair Workweek — 9 rules x >=2 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7; setup_api_calls drive
# empty-DB -> precondition state with only §1.5 endpoints.
#
# Shared conventions used across instances:
#  - Mutating actions act as Manager with as_user_id "mgr-1" (opaque operator id).
#  - Worker-owned actions (confirm/bid/swap/time-off) pass as_user_id = ${worker_id}.
#  - Clock is pinned with POST /_clock/set_current_utc before time-sensitive steps.
#  - For pure cost/cap tests, locations disable predictability_pay_enabled and set
#    advance_notice_days:1 so no predictability noise enters the numbers; for
#    predictability tests it is enabled with advance_notice_days:14.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_finalized_cost_diverge_on_noshow
        grounds:
          - calculations.provisional_assignment_cost
          - calculations.finalize_assignment_cost
          - entities.Assignment.fields.provisional_cost_cents
          - entities.Assignment.fields.finalized_cost_cents
          - state_machines.Assignment.SCHEDULED_to_NO_SHOW
          - state_machines.Assignment.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Same Friday assignment yields provisional_cost_cents=30000 (projected on
          40 scheduled prior pay-week hours, all overtime) but finalized_cost_cents=20000
          (Monday no-show drops 10h, leaving 30 realized prior hours, so Friday's 10h are
          all regular); this dual-variant lives on the Assignment cost domain.
        test_recipe:
          setup:
            - "Location L (OT threshold 40h, multiplier 1.5, predictability off, advance_notice 1)"
            - "Worker W, base 2000 cents/hr, not a minor"
            - "PayPeriod PP covering 2026-06-01..2026-06-08"
            - "Five 10h shifts Mon..Fri posted and assigned to W in order (when Friday is scheduled, prior pay-week scheduled hours = 40, so its provisional = all overtime)"
            - "Clock advanced past Monday's start; Monday assignment marked NO_SHOW; remaining shifts completed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1, overtime_weekly_threshold_hours: 40, overtime_multiplier: 1.5 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { pp: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s_mon: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s_mon}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s_mon}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_mon: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s_tue: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s_tue}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s_tue}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_tue: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s_wed: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s_wed}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s_wed}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_wed: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-04T09:00:00Z", end_utc: "2026-06-04T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s_thu: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s_thu}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s_thu}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_thu: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s_fri: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s_fri}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s_fri}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_fri: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:01Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments/${a_mon}/no-show"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T19:00:01Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts/${s_tue}/complete"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts/${s_wed}/complete"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts/${s_thu}/complete"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/shifts/${s_fri}/complete"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "GET /assignments/${a_fri}"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          assert:
            - "Assignment.${a_fri}.provisional_cost_cents == 30000"
            - "Assignment.${a_fri}.finalized_cost_cents == 20000"
            - "Assignment.${a_fri}.status == COMPLETED"

      - name: minor_daily_vs_weekly_cap_window_divergence
        grounds:
          - calculations.minor_hour_cap_projection
          - entities.Worker.fields.minor_daily_cap_hours
          - entities.Worker.fields.minor_weekly_cap_hours
          - validations[priority=12]
          - errors[ERR_MINOR_HOUR_CAP_EXCEEDED]
        distinguishing_aspect: |
          The minor cap evaluates two windows from the same hours sum: a single
          location-local calendar DAY (cap 8h) and the pay-WEEK (cap 18h). A 6h
          + 4h pair on the same day (10h) passes the weekly cap but breaches the
          daily cap; this dual-window logic lives on the Worker labor-law domain,
          distinct from the Assignment cost domain of the sibling instance.
        test_recipe:
          setup:
            - "Location L (predictability off, advance_notice 1)"
            - "Minor worker M, daily cap 8h, weekly cap 18h, base 2000"
            - "PayPeriod covering 2026-06-01..2026-06-08"
            - "M already SCHEDULED to a 6h shift on Mon 2026-06-01"
            - "A second 4h shift on the SAME Monday is posted; assigning M to it would make Monday total 10h"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "M", email: "m@x.com", base_hourly_rate_cents: 2000, is_minor: true, minor_daily_cap_hours: 8, minor_weekly_cap_hours: 18 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { m: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T14:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s6: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s6}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s6}", worker_id: "${m}" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-01T15:00:00Z", end_utc: "2026-06-01T19:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s4: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s4}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s4}", worker_id: "${m}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MINOR_HOUR_CAP_EXCEEDED"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ot_straddle_clamp_three_inputs_mode_a
        grounds:
          - calculations.provisional_assignment_cost
          - entities.Location.fields.overtime_weekly_threshold_hours
          - entities.Location.fields.overtime_multiplier
          - entities.Assignment.fields.provisional_cost_cents
        distinguishing_aspect: |
          Mode (a): provisional cost is a non-linear formula over >=3 inputs
          (prior pay-week hours, this shift's hours, the OT threshold) using a
          clamp/min/max straddle — a shift that crosses the 40h boundary is split
          into reg=clamp(40-prior,0,h) and ot=h-reg, then a SINGLE rounding.
        test_recipe:
          setup:
            - "Location L (OT threshold 40h, multiplier 1.5, predictability off, advance_notice 1)"
            - "Worker W base 2000"
            - "PayPeriod 2026-06-01..2026-06-08"
            - "W already scheduled to a 36h shift earlier in the pay-week (so prior=36)"
            - "An 8h shift is posted; assigning W straddles the OT boundary (4 reg + 4 ot)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1, overtime_weekly_threshold_hours: 40, overtime_multiplier: 1.5 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-01T06:00:00Z", end_utc: "2026-06-02T18:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s36: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s36}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s36}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s8: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s8}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s8}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a8: $.data.id }
          assert:
            - "Assignment.${a8}.provisional_cost_cents == 20000"

      - name: guardrail_depends_on_tiered_provisional_mode_c
        grounds:
          - calculations.pay_period_projected_cost
          - calculations.provisional_assignment_cost
          - entities.PayPeriod.fields.projected_labor_cost_cents
          - entities.Location.fields.overtime_cost_guardrail_cents
          - validations[priority=14]
          - errors[ERR_OVERTIME_GUARDRAIL_EXCEEDED]
        distinguishing_aspect: |
          Mode (c): the guardrail check has a circular-looking dependency that the
          scaffold pins by evaluation order — the projected pay-period total is the
          sum of per-assignment provisional costs, but each provisional cost itself
          depends on the running pay-week hour tier; the second 8h assignment is
          first costed (16000, prior=8 so all regular), then added to the projected
          total (16000+16000=32000) which strictly exceeds the 20000 guardrail.
        test_recipe:
          setup:
            - "Location L (guardrail 20000 cents, OT threshold 40, predictability off, advance_notice 1)"
            - "Worker W base 2000"
            - "PayPeriod 2026-06-01..2026-06-08"
            - "W already assigned one 8h shift (provisional 16000); projected total = 16000"
            - "A second 8h shift posted; assigning W projects 32000 > guardrail"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 20000, predictability_pay_enabled: false, advance_notice_days: 1, overtime_weekly_threshold_hours: 40, overtime_multiplier: 1.5 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { sa: $.data.id }
            - call: "POST /locations/${loc}/shifts/${sa}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${sa}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { sb: $.data.id }
            - call: "POST /locations/${loc}/shifts/${sb}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${sb}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_OVERTIME_GUARDRAIL_EXCEEDED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: swap_cyclic_proposed_countered_proposed_loop
        grounds:
          - state_machines.SwapRequest.PROPOSED_to_COUNTERED
          - state_machines.SwapRequest.COUNTERED_to_PROPOSED
          - entities.SwapRequest.fields.counter_assignment_id
        distinguishing_aspect: |
          SwapRequest is cyclic: counter (PROPOSED->COUNTERED) sets
          counter_assignment_id, then repropose (COUNTERED->PROPOSED) clears it and
          re-enters PROPOSED, a genuine revision loop on the SwapRequest entity.
        test_recipe:
          setup:
            - "Location L, two workers WA and WB, each owns one SCHEDULED assignment"
            - "WA initiates a swap of its assignment to WB (PROPOSED)"
            - "WB counters with its own assignment (COUNTERED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "WA", email: "wa@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { wa: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "WB", email: "wb@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { wb: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { sa: $.data.id }
            - call: "POST /locations/${loc}/shifts/${sa}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${sa}", worker_id: "${wa}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_a: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { sb: $.data.id }
            - call: "POST /locations/${loc}/shifts/${sb}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${sb}", worker_id: "${wb}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a_b: $.data.id }
            - call: "POST /locations/${loc}/swaps"
              payload: { from_assignment_id: "${a_a}", to_worker_id: "${wb}" }
              as: Worker
              as_user_id: "${wa}"
              captures: { sw: $.data.id }
            - call: "POST /locations/${loc}/swaps/${sw}/counter"
              payload: { counter_assignment_id: "${a_b}" }
              as: Worker
              as_user_id: "${wb}"
          trigger:
            - call: "POST /locations/${loc}/swaps/${sw}/repropose"
              payload: {}
              as: Worker
              as_user_id: "${wa}"
              captures: { st: $.data.status }
          assert:
            - "SwapRequest.${sw}.status == PROPOSED"
            - "SwapRequest.${sw}.counter_assignment_id == null"

      - name: shift_fully_staffed_reverts_to_open_on_cancel
        grounds:
          - state_machines.Shift.OPEN_to_FULLY_STAFFED
          - state_machines.Shift.FULLY_STAFFED_to_OPEN
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - entities.Shift.fields.headcount_filled
        distinguishing_aspect: |
          Shift is cyclic on a different entity than SwapRequest: it bubbles
          OPEN->FULLY_STAFFED when the last seat fills, then bubbles
          FULLY_STAFFED->OPEN when an assignment is cancelled and headcount_filled
          drops below headcount_required.
        test_recipe:
          setup:
            - "Location L, single-seat shift S posted (OPEN), worker W assigned -> S FULLY_STAFFED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
