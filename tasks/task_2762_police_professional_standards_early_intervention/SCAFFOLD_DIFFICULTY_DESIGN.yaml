              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-601", full_name: "Officer Pike", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2017-04-03T00:00:00Z" }
              as: SystemAdmin
              captures: { pike_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-602", full_name: "Officer Quill", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2017-04-03T00:00:00Z" }
              as: SystemAdmin
              captures: { quill_id: $.data.id }
          trigger:
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-02-02T00:00:00Z", source_reference: "UOF-180" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { pike_e1_weight: $.data.base_weight }
            - call: "POST /officers/${quill_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-02-01T00:00:00Z", source_reference: "UOF-181" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /officers/${pike_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { pike_count1: $.data.event_count, pike_total1: $.data.weighted_total, pike_score1: $.data.composite_score, pike_level1: $.data.alert_level, pike_window_start: $.data.window_start }
            - call: "GET /officers/${quill_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { quill_count1: $.data.event_count, quill_total1: $.data.weighted_total, quill_score1: $.data.composite_score, quill_level1: $.data.alert_level }
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2025-08-01T00:00:00Z", source_reference: "UOF-365" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /officers/${pike_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
