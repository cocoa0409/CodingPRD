      - name: laundry_plant_capacity_breached_only_by_the_aggregate_of_overlapping_batches
        grounds:
          - validations[priority=27]
          - errors[ERR_LAUNDRY_CAPACITY_EXCEEDED]
          - calculations.laundry_turnaround
          - entities.Property.fields.laundry_capacity_sets
        distinguishing_aspect: |
          The contended resource is a shared CAPACITY POOL rather than a single row, so overlap is
          aggregate rather than pairwise: batches of 150 and 100 sets coexist happily inside a plant
          capacity of 300, and a third batch of only 60 sets - individually trivial - is refused because
          the three windows share the interval [11:00, 12:00) for a total of 310. The same 60-set batch
          is accepted once its window is moved to [13:00, 16:00), which touches but does not overlap the
          half-open window ending at 13:00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with laundry_capacity_sets 300 and laundry_sla_minutes 240."
            - "One KING room 101, so par_required_sets is 2."
            - "SHEET_SET linen line with total_owned_sets 400 and initial_soiled_sets 400, so on_hand_clean is 0 and soiled_queue is 400 - ample soiled stock for every dispatch."
            - "Two QUEUED cycles already dispatched: 150 sets over [08:00, 12:00) and 100 sets over [10:00, 13:00), so 250 of the 300 sets of capacity are committed over [10:00, 12:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
