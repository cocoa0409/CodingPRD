  # ===========================================================================
  - section: rbac
    instances:
      - name: driver_cannot_fulfill_will_call_order
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "Conditional RBAC on /fulfill: RouteDriver may fulfill ROUTE orders only; a WILL_CALL fulfillment attempt is ERR_FORBIDDEN."
        test_recipe:
          setup: ["CASH order confirmed, paid, STAGED, fulfillment WILL_CALL"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-RB1", name: "Counter Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-RB1", name: "Marker", category: "HARDGOOD", retail_price_cents: 900 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/pay"
              payload: { amount_cents: 900 }
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN  (driver may not run will-call fulfillment)"

      - name: repair_approve_forbidden_for_service_tech
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "Per-target RBAC on repair advance: ServiceTech may quote but to=APPROVED is BranchManager-only (quote approval segregation)."
        test_recipe:
          setup: ["customer; ticket at QUOTED (quote 8000)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-RB2", name: "Fix Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cid}", machine_desc: "Hypertherm 45", issue_desc: "Arc drops" }
              as: ServiceTech
              captures: { tid: $.data.id }
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "DIAGNOSING" }
              as: ServiceTech
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "QUOTED", quote_cents: 8000 }
              as: ServiceTech
          trigger:
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "APPROVED" }
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN  (quote approval requires BranchManager)"

      - name: trainer_cannot_void_invoice
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Invoice void is BranchManager-exclusive; Trainer gets ERR_FORBIDDEN even with a real invoice id."
        test_recipe:
          setup: ["NET30 customer with fulfilled order -> OPEN invoice"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-RB3", name: "Void Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-RB3", name: "Table", category: "HARDGOOD", retail_price_cents: 5000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv: $.data.invoice_id }
          trigger:
            - call: "POST /invoices/${inv}/void"
              payload: {}
              as: Trainer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: service_tech_cannot_create_training_class
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Class scheduling is Trainer/BranchManager; ServiceTech gets ERR_FORBIDDEN."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /training-classes"
              payload: { title: "TIG Intro", room: "ROOM_A", start_at: "2026-10-01T09:00:00Z", end_at: "2026-10-01T11:00:00Z", capacity: 6, price_cents: 10000 }
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: counter_rep_cannot_waive_rental
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Demurrage waiver is a BranchManager override power; CounterRep gets ERR_FORBIDDEN (authz at priority 2, before the OCC check)."
        test_recipe:
          setup: ["CASH customer; DEMURRAGE rental with 1200 accrued at 2026-08-20"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-RB4", name: "Waive Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-RB4", gas_grade: "ARGON", size: "SMALL" }
              as: BranchManager
              captures: { aid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "CYLINDER", cylinder_asset_id: "${aid}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra}"
              as: CounterRep
              captures: { ra_v: $.data.version }
          trigger:
            - call: "POST /rental-agreements/${ra}/waive"
              payload: { waive_amount_cents: 1200, reason: "loyalty", expected_rental_agreement_version: "${ra_v}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN  (waiver is manager-exclusive)"

      - name: branch_manager_fulfills_route_order_override
        claim_type: role_allow
        grounds: [roles]
        distinguishing_aspect: "Hierarchical override: BranchManager may fulfill a ROUTE order (the driver-scoped path) once the route is DISPATCHED."
        test_recipe:
          setup: ["CASH customer; product stock 1; ROUTE order confirmed+paid+staged; route DISPATCHED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-RB5", name: "Mgr Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-RB5", name: "Stand", category: "HARDGOOD", retail_price_cents: 7000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-08", truck_capacity_units: 4 }
              as: CounterRep
              captures: { rid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/pay"
              payload: { amount_cents: 9500 }
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /delivery-routes/${rid}/dispatch"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: BranchManager
              captures: { st: $.data.fulfillment_status }
          assert:
            - "st == FULFILLED  (manager override covers the driver path)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_payment_stale_customer_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-stale-customer-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Payment 1 succeeds and bumps Customer.version; payment 2 replaying the captured (now stale) expected_customer_version fails 412 ERR_STALE_VERSION — two strictly sequential requests."
        test_recipe:
          setup: ["CASH customer, no invoices"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-LA1", name: "OCC Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "GET /customers/${cid}"
              as: CounterRep
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cid}/payments"
              payload: { amount_cents: 1000, expected_customer_version: "${cust_v}" }
              as: CounterRep
              captures: { credit: $.data.credit_added_cents }
            - call: "POST /customers/${cid}/payments"
              payload: { amount_cents: 500, expected_customer_version: "${cust_v}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "credit == 1000  (first payment parks as credit with no open invoices)"
            - "err == ERR_STALE_VERSION (HTTP 412)  (version advanced by the first payment)"

      - name: occ_waiver_full_accrual_then_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[waiver-stale-rental-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A full-accrual waiver (== boundary) succeeds and bumps the agreement version; a second waiver with the stale version fails ERR_STALE_VERSION (priority 5 beats the fiscal exceeds-check)."
        test_recipe:
          setup: ["CASH customer; DEMURRAGE rental start 2026-08-01 grace 5; clock 2026-08-20 -> accrued 1200"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-LA2", name: "OCC Waive Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-LA2", gas_grade: "OXYGEN", size: "MEDIUM" }
              as: BranchManager
              captures: { aid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "CYLINDER", cylinder_asset_id: "${aid}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra}"
              as: BranchManager
              captures: { ra_v: $.data.version }
          trigger:
            - call: "POST /rental-agreements/${ra}/waive"
              payload: { waive_amount_cents: 1200, reason: "billing dispute", expected_rental_agreement_version: "${ra_v}" }
              as: BranchManager
              captures: { waived: $.data.waived_cents, accrued: $.data.accrued_unbilled_cents }
            - call: "POST /rental-agreements/${ra}/waive"
              payload: { waive_amount_cents: 100, reason: "more goodwill", expected_rental_agreement_version: "${ra_v}" }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "waived == 1200 and accrued == 0  (== accrued is allowed; full waiver zeroes the accrual)"
            - "err == ERR_STALE_VERSION  (first waive bumped the version)"

      - name: logical_clock_default_is_fixed_at_start
        claim_type: derived_field_reconciliation
        grounds: [endpoints]
        distinguishing_aspect: "With no set_current_utc call, a rental starting 2026-08-01 reads accrued_unbilled_cents == 0 — proving the fixed default 2026-08-01T00:00:00Z rather than drifting wall-clock (which on any later date would show 1200)."
        test_recipe:
          setup: ["no clock call issued in this scenario"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-LA3", name: "Clock Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-LA3", gas_grade: "NITROGEN", size: "MEDIUM" }
              as: BranchManager
              captures: { aid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "CYLINDER", cylinder_asset_id: "${aid}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra: $.data.id }
          trigger:
            - call: "GET /rental-agreements/${ra}"
              as: CounterRep
              captures: { acc: $.data.accrued_unbilled_cents }
          assert:
            - "acc == 0  (logical clock == 2026-08-01 default == start_date; 0 days held)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_immediately_visible_on_read
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: PATCH /customers/{id} response carries the new name, and a subsequent GET agrees — no lag."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CM1", name: "Before Co" }
              as: CounterRep
              captures: { cid: $.data.id }
          trigger:
            - call: "PATCH /customers/${cid}"
              payload: { name: "After Co" }
              as: CounterRep
              captures: { patched_name: $.data.name, patched_v: $.data.version }
            - call: "GET /customers/${cid}"
              as: CounterRep
              captures: { got_name: $.data.name }
          assert:
            - "patched_name == 'After Co' and patched_v == 2"
            - "got_name == 'After Co'"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_credit_limit_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: credit_limit_equality_passes_then_one_order_over
          rationale: "Both the pass-at-equality and the exceed legs are asserted there."
      - name: error_class_full_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLASS_FULL]"]
        excluded_because:
          difficulty_instance: class_capacity_exact_fill_then_full
          rationale: "The 3rd enrollment into a cap-2 class triggers ERR_CLASS_FULL there."
      - name: error_account_on_hold_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCOUNT_ON_HOLD]"]
        excluded_because:
          difficulty_instance: order_confirm_blocked_by_customer_credit_hold
          rationale: "CREDIT_HOLD customer confirm is the trigger under test there."
      - name: error_route_not_dispatched_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_NOT_DISPATCHED]"]
        excluded_because:
          difficulty_instance: route_order_fulfill_blocked_until_route_dispatched
          rationale: "Fulfill-before-dispatch is the failure leg there."
      - name: error_rental_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: machine_turnaround_buffer_blocks_next_day_rental
          rationale: "The D+1 start_date rejection triggers ERR_RENTAL_OVERLAP there."
      - name: error_room_double_booked_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: room_halfopen_interval_adjacency
          rationale: "The 10:30-11:30 class triggers ERR_ROOM_DOUBLE_BOOKED there."
      - name: error_class_not_scheduled_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLASS_NOT_SCHEDULED]"]
        excluded_because:
          difficulty_instance: referential_beats_constraint_on_enrollment
          rationale: "Enrollment into a CANCELLED class triggers ERR_CLASS_NOT_SCHEDULED there."
      - name: error_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_confirm
          rationale: "Confirm on a CANCELLED order triggers ERR_INVALID_STATE there; also re-asserted by four state_machines corner instances above."
      - name: error_stale_version_covered_by_corner_layers
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: occ_payment_stale_customer_version_rejected
          rationale: "Both OCC rules trigger ERR_STALE_VERSION in the cross_cutting_layers section of this file (payment + waiver instances)."
