      - name: employer_suspend_remediate_cycle
        grounds:
          - state_machines.Employer.AUTHORIZED_to_SUSPENDED
          - state_machines.Employer.SUSPENDED_to_AUTHORIZED
          - state_machines.Employer.AUTHORIZED_to_AUTHORIZATION_LAPSED
        distinguishing_aspect: |
          Cyclic machine on Employer (different entity from the application
          appeal cycle): AUTHORIZED -> SUSPENDED -> AUTHORIZED -> (clock)
          AUTHORIZATION_LAPSED -> AUTHORIZED, including the strict-greater-than
          lapse boundary (clock == due date keeps AUTHORIZED; due + 1 lapses).
        test_recipe:
          setup:
            - "Employer emp registered (PENDING_AUTHORIZATION); nothing else exists"
          setup_api_calls:
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
          trigger:
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice, captures: { s1: $.data.authorization_status, due1: $.data.next_review_due_date } }
            - { call: "POST /skillbridge/employers/${emp}/periodic-review", payload: { outcome: "FAIL", notes: "missing documentation" }, as: ProgramOffice, captures: { s2: $.data.authorization_status } }
            - { call: "POST /skillbridge/employers/${emp}/periodic-review", payload: { outcome: "PASS", notes: "remediated" }, as: ProgramOffice, captures: { s3: $.data.authorization_status, due3: $.data.next_review_due_date } }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2027-02-28T00:00:00Z" }, as: ProgramOffice, captures: { lapsed0: $.data.employers_lapsed } }
            - { call: "GET /skillbridge/employers/${emp}", as: ProgramOffice, captures: { s4: $.data.authorization_status } }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: ProgramOffice, captures: { lapsed1: $.data.employers_lapsed } }
            - { call: "GET /skillbridge/employers/${emp}", as: ProgramOffice, captures: { s5: $.data.authorization_status } }
            - { call: "POST /skillbridge/employers/${emp}/periodic-review", payload: { outcome: "PASS", notes: "late review accepted" }, as: ProgramOffice, captures: { s6: $.data.authorization_status, due6: $.data.next_review_due_date } }
          assert:
            - "authorize at default clock: status AUTHORIZED, next_review_due_date == 2027-02-28 (2026-09-01 + 180 days)"
            - "FAIL review: AUTHORIZED -> SUSPENDED"
            - "PASS review: SUSPENDED -> AUTHORIZED (cycle edge), next_review_due_date == 2027-02-28"
            - "clock == 2027-02-28 (== due date): employers_lapsed == 0 and status still AUTHORIZED (strictly-greater comparison)"
            - "clock == 2027-03-01: employers_lapsed == 1 and status == AUTHORIZATION_LAPSED"
            - "late PASS review: AUTHORIZATION_LAPSED -> AUTHORIZED with next_review_due_date == 2027-08-28 (2027-03-01 + 180 days)"
  - rule_id: transitive_cascade
    instances:
      - name: audit_sanction_revocation_cascade
        grounds:
          - state_machines.Employer.AUTHORIZED_to_REVOKED
          - state_machines.EmployerOpening.OPEN_to_CLOSED
          - state_machines.ComplianceAudit.OPEN_to_CLOSED_SANCTIONED
          - calculations.compliance_score
        distinguishing_aspect: |
          Depth-3 cascade triggered by an audit close: SANCTIONED (score 55.00
          from one CRITICAL finding) revokes the employer (link 1); revocation
          closes its OPEN opening (link 2); the closure voids the PROPOSED
          match and terminates the ACTIVE match, zeroing the slot ledger and
          the member's active_match_count (link 3). Trigger differs from the
          wage-violation cascade.
        test_recipe:
          setup:
            - "Employer emp AUTHORIZED; opening op capacity 2 (REMOTE, required_skills [LOGISTICS])"
            - "Match mt1 (member m1, separation 2027-01-15) sitting PROPOSED on op for [2026-10-01, 2026-10-31)"
            - "Match mt2 (member m2, separation 2027-01-15) ACTIVE on op for the same window (plan approved, installation approved, clock advanced to 2026-10-01)"
            - "Audit a open on emp"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m1: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m2: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m1}" }, as: ServiceMember, as_user_id: "${m1}", captures: { app1: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m2}" }, as: ServiceMember, as_user_id: "${m2}", captures: { app2: $.data.id } }
