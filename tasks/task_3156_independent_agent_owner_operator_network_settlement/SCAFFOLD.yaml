# =============================================================================
# PRD Benchmark Seed Tables — task_3156
# Independent Agent & Owner-Operator Network Settlement (Landstar)
# =============================================================================

scenario: |
  Independent Agent & Owner-Operator Network Settlement (Landstar): freight agents operating independently who source shipments and receive a commission from load revenue, business capacity owners providing trucks under lease agreements with a revenue percentage split, load matching between agents and capacity owners through an internal board with acceptance rules, settlement computation splitting linehaul, fuel surcharge and accessorials among agent, capacity owner and company, insurance and occupational accident program participation with premium deduction, safety qualification and equipment inspection standards for capacity owners, agent territory and customer ownership rules with non-solicitation, escrow and maintenance account administration for capacity owners

domain_name: independent-agent-owner-operator-network-settlement
api_prefix: "/network"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: agent_code, type: string, source: input, description: "Network-unique agent code; uniqueness is scoped to the whole network", constraints: "unique across Agent.agent_code" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the independent freight agency" }
      - { name: home_state, type: string, source: input, description: "Two-letter US state code of the agent's home terminal" }
      - { name: commission_rate_pct, type: number, source: input, description: "Agent's percentage of the commissionable base (linehaul + accessorials), 0.0-1.0", constraints: "0.0 <= commission_rate_pct <= 1.0" }
      - { name: territory_codes, type: array, source: input, description: "Ordered list of two-letter state codes the agent may source loads from; order is the territory precedence", constraints: "non-empty; no duplicate state codes" }
      - { name: customer_ownership_days, type: integer, source: input, default: 365, description: "Number of days an agent exclusively owns a customer account after first booking; default 365" }
      - { name: status, type: enum, source: system, description: "PENDING_ENROLLMENT | ACTIVE | SUSPENDED | TERMINATED; initial PENDING_ENROLLMENT" }
      - { name: settlement_hold, type: boolean, source: computed, description: "Read-only posture gate; true when status is SUSPENDED or TERMINATED, false when status is PENDING_ENROLLMENT or ACTIVE. While true no load of this agent may be awarded from the board and no Settlement for this agent may be submitted or paid." }
      - { name: active_customer_count, type: computed, description: "Read-only count of CustomerAccount rows whose agent_id is this agent and whose exclusivity_status == OWNED_EXCLUSIVE as evaluated against the logical clock" }
      - { name: awarded_load_count, type: computed, description: "Read-only count of Load rows whose agent_id is this agent and whose status IN {AWARDED, COVERED, IN_TRANSIT, DELIVERED, SETTLED}" }

  - name: CapacityOwner
    parent: null
    common_fields: true
    fields:
      - { name: owner_code, type: string, source: input, description: "Network-unique business capacity owner code", constraints: "unique across CapacityOwner.owner_code" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the business capacity owner (BCO)" }
      - { name: home_terminal_city, type: string, source: input, description: "City of the BCO's home terminal" }
      - { name: revenue_split_pct, type: number, source: input, description: "BCO's percentage of the owner-operator base; 0.0-1.0", constraints: "0.0 <= revenue_split_pct <= 1.0" }
      - { name: oa_enrolled, type: boolean, source: input, default: false, description: "Whether the BCO participates in the occupational accident program; default false" }
      - { name: liability_insurance_deductible_cents, type: integer, source: input, default: 250000, description: "Per-incident deductible the BCO carries on the network liability policy; default 250000" }
      - { name: escrow_balance_cents, type: computed, description: "Read-only sum over posted, non-reversed EscrowTransaction.amount_cents where transaction_type IN {ESCROW_DEPOSIT, ESCROW_RELEASE}: deposits add, releases subtract. Floor 0. Gate: must be >= ESCROW_MIN_CENTS whenever qualification_posture == QUALIFIED_CLEAR." }
      - { name: maintenance_balance_cents, type: computed, description: "Read-only sum over posted, non-reversed EscrowTransaction.amount_cents where transaction_type IN {MAINTENANCE_DEPOSIT, MAINTENANCE_WITHDRAWAL}: deposits add, withdrawals subtract. Floor 0." }
      - { name: safety_score, type: number, source: computed, default: 100, description: "Read-only score starting at 100. Each aborted Trip subtracts 15; each ComplianceDocument that is EXPIRED at the current logical clock and still unresolved subtracts 5. Score floors at 0." }
      - { name: qualification_posture, type: enum, source: computed, description: "Read-only derived posture over the BCO and its children: QUALIFIED_CLEAR | QUALIFICATION_RESTRICTED | QUALIFICATION_FROZEN. FROZEN iff status == DECERTIFIED or any ComplianceDocument has status EXPIRED. RESTRICTED iff status == OUT_OF_SERVICE, or safety_score < SAFETY_MIN_SCORE, or escrow_balance_cents < ESCROW_MIN_CENTS, or at least one Equipment row has status IN {PENDING_INSPECTION, OUT_OF_SERVICE}. Otherwise QUALIFIED_CLEAR." }
      - { name: qualified_until, type: datetime, source: computed, description: "Read-only earliest expires_at among this BCO's ComplianceDocument rows whose status != REJECTED; null when the BCO has none" }
      - { name: status, type: enum, source: system, description: "PENDING_QUALIFICATION | QUALIFIED | OUT_OF_SERVICE | DECERTIFIED; initial PENDING_QUALIFICATION" }

  - name: Equipment
    parent: CapacityOwner
    common_fields: true
    fields:
      - { name: capacity_owner_id, type: string, source: input, description: "FK -> CapacityOwner.id; the BCO that operates this unit" }
      - { name: unit_number, type: string, source: input, description: "Fleet unit number", constraints: "unique within capacity_owner_id" }
      - { name: equipment_type, type: enum, source: input, description: "TRACTOR | STRAIGHT_TRUCK | VAN_TRAILER | REEFER_TRAILER | FLATBED_TRAILER" }
      - { name: model_year, type: integer, source: input, description: "Model year of the unit", constraints: "1980 <= model_year <= 2030" }
      - { name: inspection_due_at, type: datetime, source: input, description: "Deadline by which the next periodic inspection must be recorded" }
      - { name: inspection_passed_at, type: datetime, source: computed, description: "Read-only timestamp of the most recent recorded passing inspection; null before the first one" }
      - { name: inspection_status, type: enum, source: computed, description: "Read-only against the logical clock: CURRENT when inspection_passed_at is set and inspection_passed_at < inspection_due_at; DUE when inspection_passed_at is null and the clock is before inspection_due_at; OVERDUE when the clock is at or after inspection_due_at and no passing inspection was recorded strictly before inspection_due_at" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | PENDING_INSPECTION | OUT_OF_SERVICE | RETIRED; initial PENDING_INSPECTION" }

  - name: ComplianceDocument
    parent: CapacityOwner
    common_fields: true
    fields:
      - { name: capacity_owner_id, type: string, source: input, description: "FK -> CapacityOwner.id; the BCO this credential belongs to" }
      - { name: document_type, type: enum, source: input, description: "CDL | MEDICAL_CARD | MVR_REPORT | DRUG_TEST | OA_ENROLLMENT | LIABILITY_INSURANCE" }
      - { name: document_number, type: string, source: input, description: "Issuing authority's document number" }
      - { name: issued_at, type: datetime, source: input, description: "Date the credential was issued" }
      - { name: expires_at, type: datetime, source: input, description: "Date the credential lapses; must be strictly after issued_at", constraints: "expires_at > issued_at" }
      - { name: status, type: enum, source: computed, description: "Read-only against the logical clock over expires_at: VALID strictly before expires_at; EXPIRING_SOON when 0 < (expires_at - clock) <= EXPIRING_SOON_DAYS; EXPIRED when clock >= expires_at. REJECTED only when explicitly set by the verifying clerk." }

  - name: CustomerAccount
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; the agent that owns or shares this customer" }
      - { name: customer_ref, type: string, source: input, description: "Shipper reference the agent books under", constraints: "unique within agent_id" }
      - { name: shipper_name, type: string, source: input, description: "Legal name of the shipper" }
      - { name: first_booked_at, type: datetime, source: input, description: "Timestamp of the agent's first booking against this customer; the ownership clock starts here" }
      - { name: ownership_expires_at, type: computed, description: "Read-only = first_booked_at + (agent.customer_ownership_days days). Equal to first_booked_at when customer_ownership_days == 0." }
      - { name: exclusivity_status, type: enum, source: computed, description: "Read-only against the logical clock over ownership_expires_at: OWNED_EXCLUSIVE strictly before ownership_expires_at; OPEN_SHARED at or after it, unless released_reason is set, in which case RELEASED. When agent.customer_ownership_days == 0 the account is OPEN_SHARED from creation." }
      - { name: released_reason, type: enum, source: input, description: "null | NON_SOLICITATION_BREACH | AGENT_TERMINATED | CUSTOMER_REQUEST; null by default" }

  - name: Load
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; the agent that sourced the shipper and owns the commission" }
      - { name: awarded_capacity_owner_id, type: string, source: system, description: "FK -> CapacityOwner.id; the BCO the load was awarded to; null until an offer is accepted" }
      - { name: customer_ref, type: string, source: input, description: "Shipper reference this load books under; must match a CustomerAccount.customer_ref for the same agent" }
      - { name: origin_state, type: string, source: input, description: "Two-letter origin state code" }
      - { name: destination_state, type: string, source: input, description: "Two-letter destination state code" }
      - { name: linehaul_revenue_cents, type: integer, source: input, description: "Linehaul revenue billed to the shipper", constraints: "> 0" }
      - { name: fuel_surcharge_cents, type: integer, source: input, default: 0, description: "Fuel surcharge billed to the shipper; default 0", constraints: ">= 0" }
      - { name: accessorial_revenue_cents, type: integer, source: input, default: 0, description: "Accessorial revenue (detention, lumper, tarp) billed to the shipper; default 0", constraints: ">= 0" }
      - { name: dispatched_miles, type: integer, source: input, description: "Planned dispatched miles", constraints: "> 0" }
      - { name: board_required, type: boolean, source: computed, description: "Read-only. true when the promoting agent's status is ACTIVE and settlement_hold is false; false otherwise. A load whose board_required is false may never be awarded." }
      - { name: status, type: enum, source: system, description: "POSTED | AWARDED | COVERED | IN_TRANSIT | DELIVERED | SETTLED | CANCELLED; initial POSTED" }

  - name: LoadOffer
    parent: Load
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; the load being offered on the board" }
      - { name: capacity_owner_id, type: string, source: input, description: "FK -> CapacityOwner.id; the BCO the offer is directed to" }
      - { name: offered_pay_cents, type: integer, source: input, description: "Owner-operator pay the BCO would receive if the offer is accepted; must be > 0 and <= owner_pay_ceiling_cents", constraints: "> 0" }
      - { name: owner_pay_ceiling_cents, type: computed, description: "Read-only ceiling = floor((load.linehaul_revenue_cents + load.fuel_surcharge_cents) * capacity_owner.revenue_split_pct), rounded half up. An offer above this ceiling is rejected." }
      - { name: offered_at, type: datetime, source: input, description: "Timestamp the offer was posted to the board" }
      - { name: expires_at, type: computed, description: "Read-only = load-offer TTL boundary. The offer is no longer acceptable once the logical clock is at or after this instant." }
      - { name: selected_rank, type: integer, source: computed, description: "Read-only board rank of this offer among the LoadOffer rows on the same load whose status is OPEN. Lower is better. Ranking key: offered_pay_cents DESC, then offered_at ASC, then created_at ASC." }
      - { name: status, type: enum, source: system, description: "OPEN | ACCEPTED | DECLINED | EXPIRED | WITHDRAWN; initial OPEN" }

  - name: Trip
    parent: Load
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; the load being hauled" }
      - { name: capacity_owner_id, type: string, source: input, description: "FK -> CapacityOwner.id; the BCO hauling the load" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; the unit assigned to the trip" }
      - { name: departed_at, type: datetime, source: input, description: "Timestamp the unit departed the origin" }
      - { name: deadline_at, type: datetime, source: input, description: "Delivery appointment the trip must beat" }
      - { name: delivered_at, type: datetime, source: input, description: "Timestamp the trip was marked delivered; null until the DELIVER transition stamps it" }
      - { name: actual_miles, type: integer, source: input, description: "Miles actually run; recorded at completion", constraints: "> 0" }
      - { name: proof_of_delivery_code, type: string, source: input, description: "Signed BOL / POD reference; required at completion" }
      - { name: on_time, type: boolean, source: computed, description: "Read-only. null while delivered_at is null; otherwise true iff delivered_at <= deadline_at (exactly equal counts as on time)." }
      - { name: maintenance_reserve_cents, type: computed, description: "Read-only reserve withheld from owner-operator pay at completion, computed from actual_miles" }
      - { name: status, type: enum, source: system, description: "DISPATCH_PENDING | EN_ROUTE | DELIVERED | COMPLETED | ABORTED; initial DISPATCH_PENDING" }

  - name: Settlement
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; the completed trip being settled" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the agent earning the commission, copied from load.agent_id" }
      - { name: capacity_owner_id, type: string, source: system, description: "FK -> CapacityOwner.id; the BCO earning owner-operator pay, copied from trip.capacity_owner_id" }
      - { name: settlement_method, type: enum, source: input, description: "PROVISIONAL | FINAL; the caller selects which pairing of §1.3 variants to compute. PROVISIONAL is admissible only while the trip is COMPLETED; FINAL is admissible only after the trip's POD is on file and the load is DELIVERED or SETTLED." }
      - { name: commissionable_base_cents, type: computed, description: "Read-only = linehaul_revenue_cents + accessorial_revenue_cents; fuel surcharge is excluded for both PROVISIONAL and FINAL" }
      - { name: linehaul_revenue_allocated_cents, type: computed, description: "Read-only = load.linehaul_revenue_cents" }
      - { name: fuel_surcharge_allocated_cents, type: computed, description: "Read-only = load.fuel_surcharge_cents" }
      - { name: accessorial_allocated_cents, type: computed, description: "Read-only = load.accessorial_revenue_cents" }
      - { name: agent_share_cents, type: computed, description: "Read-only agent commission (§1.3 settlement_split)" }
      - { name: owner_operator_share_cents, type: computed, description: "Read-only BCO gross pay (§1.3 settlement_split)" }
      - { name: company_share_cents, type: computed, description: "Read-only company share (§1.3 settlement_split)" }
      - { name: oa_premium_cents, type: computed, description: "Read-only occupational accident premium withheld from the BCO; 0 when the BCO is not enrolled (§1.3 oa_premium)" }
      - { name: insurance_premium_cents, type: computed, description: "Read-only liability insurance premium withheld from the BCO (§1.3 insurance_premium)" }
      - { name: maintenance_withholding_cents, type: computed, description: "Read-only maintenance reserve withheld from the BCO; equals trip.maintenance_reserve_cents" }
      - { name: escrow_withholding_cents, type: computed, description: "Read-only escrow contribution withheld from the BCO (§1.3 escrow_withholding)" }
      - { name: advance_repayment_cents, type: computed, description: "Read-only portion of the BCO's outstanding advance recovered from this settlement (§1.3 advance_repayment)" }
      - { name: net_owner_operator_pay_cents, type: computed, description: "Read-only BCO net pay after every withholding (§1.3 settlement_split, net block)" }
      - { name: net_agent_pay_cents, type: computed, description: "Read-only agent net pay after advance recovery (§1.3 settlement_split, net block)" }
      - { name: settled_total_cents, type: computed, description: "Read-only conserved total = agent_share_cents + owner_operator_share_cents + company_share_cents. Invariant (§1.3): settled_total_cents == linehaul_revenue_allocated_cents + fuel_surcharge_allocated_cents + accessorial_allocated_cents exactly, for both variants." }
      - { name: variant_delta_cents, type: computed, description: "Read-only = FINAL net_owner_operator_pay_cents - PROVISIONAL net_owner_operator_pay_cents for the same trip; 0 until both variants have been computed" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | SETTLED | VOID; initial DRAFT" }

  - name: EscrowTransaction
    parent: CapacityOwner
    common_fields: true
    fields:
      - { name: capacity_owner_id, type: string, source: input, description: "FK -> CapacityOwner.id; the BCO whose escrow or maintenance account this entry moves" }
      - { name: transaction_type, type: enum, source: input, description: "ADVANCE | ADVANCE_REPAYMENT | ESCROW_DEPOSIT | ESCROW_RELEASE | MAINTENANCE_DEPOSIT | MAINTENANCE_WITHDRAWAL | OA_PREMIUM_DEDUCTION | INSURANCE_PREMIUM_DEDUCTION" }
      - { name: amount_cents, type: integer, source: input, description: "Signed magnitude as a positive integer; direction is implied by transaction_type. Must be > 0.", constraints: "> 0" }
      - { name: effective_at, type: datetime, source: input, description: "Instant the entry takes effect under the logical clock" }
      - { name: reverses_transaction_id, type: string, source: input, description: "Id of the EscrowTransaction this entry reverses; null for a forward entry. When set, this entry's transaction_type must be the declared compensating type for the target's type." }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED; initial POSTED" }
      - { name: resulting_escrow_balance_cents, type: computed, description: "Read-only escrow balance of the owning BCO immediately after this entry is applied" }
      - { name: resulting_maintenance_balance_cents, type: computed, description: "Read-only maintenance balance of the owning BCO immediately after this entry is applied" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Agent
    initial_state: PENDING_ENROLLMENT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ENROLLMENT
        to: ACTIVE
        trigger: POST /network/agents/{agentId}/activate
        actor: AgentManager
        preconditions:
          - "Agent.status == PENDING_ENROLLMENT (ERR_AGENT_NOT_ENROLLABLE)"
          - "Agent.territory_codes is non-empty (ERR_AGENT_TERRITORY_EMPTY)"
          - "No other Agent row holds any state_code in this Agent's territory_codes while that other agent's status IN {ACTIVE, SUSPENDED} (ERR_TERRITORY_CONFLICT)"
        side_effects:
          - "Agent.status → ACTIVE"
          - "Recompute Agent.settlement_hold (false, because status is now ACTIVE)"
          - "Recompute board_required on every Load whose agent_id is this agent (true for each load still in POSTED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /network/agents/{agentId}/suspend
        actor: AgentManager
        preconditions:
          - "Agent.status == ACTIVE (ERR_AGENT_NOT_ACTIVE)"
          - "body.reason_code is present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Agent.status → SUSPENDED"
          - "Agent.settlement_hold → true"
          - "Cascade depth 1: every Load whose agent_id is this agent and whose status == POSTED → CANCELLED, and each such Load's board offers with status OPEN → WITHDRAWN"
          - "Recompute board_required = false on every Load whose agent_id is this agent"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /network/agents/{agentId}/reinstate
        actor: AgentManager
        preconditions:
          - "Agent.status == SUSPENDED (ERR_AGENT_NOT_SUSPENDED)"
        side_effects:
          - "Agent.status → ACTIVE"
          - "Recompute Agent.settlement_hold (false, because status is now ACTIVE)"
          - "Recompute board_required on every Load whose agent_id is this agent"
      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /network/agents/{agentId}/terminate
        actor: NetworkAdministrator
        preconditions:
          - "Agent.status IN {PENDING_ENROLLMENT, ACTIVE, SUSPENDED} (ERR_AGENT_ALREADY_TERMINATED)"
          - "Agent has no Settlement whose status IN {PENDING_APPROVAL, APPROVED} (ERR_AGENT_SETTLEMENTS_OUTSTANDING)"
        side_effects:
          - "Agent.status → TERMINATED"
          - "Agent.settlement_hold → true"
          - "Cascade depth 1: every Load whose agent_id is this agent and whose status == POSTED → CANCELLED, and each such Load's board offers with status OPEN → WITHDRAWN"
          - "Cascade depth 2: every CustomerAccount whose agent_id is this agent and whose exclusivity_status == OWNED_EXCLUSIVE → released_reason = AGENT_TERMINATED, which recomputes exclusivity_status → RELEASED and decrements Agent.active_customer_count"
          - "Cascade depth 3: every CustomerAccount that this transition flipped to RELEASED and whose shipper_name matches an open Load on another agent's territory within NON_SOLICITATION_RADIUS_DAYS → that Load's promotion is rejected with ERR_NON_SOLICITATION_BREACH on the next award attempt"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /network/agents/{agentId}/terminate
        actor: NetworkAdministrator
        preconditions:
          - "Agent has no Settlement whose status IN {PENDING_APPROVAL, APPROVED} (ERR_AGENT_SETTLEMENTS_OUTSTANDING)"
        side_effects:
          - "Same cascade as SUSPENDED → TERMINATED"

  - entity: CapacityOwner
    initial_state: PENDING_QUALIFICATION
    terminal_states: [DECERTIFIED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: POST /network/capacity-owners/{capacityOwnerId}/qualify
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.status == PENDING_QUALIFICATION (ERR_CAPACITY_OWNER_NOT_QUALIFIABLE)"
          - "Every one of the six document_type values {CDL, MEDICAL_CARD, MVR_REPORT, DRUG_TEST, OA_ENROLLMENT, LIABILITY_INSURANCE} has at least one ComplianceDocument with status != REJECTED and expires_at strictly after the logical clock (ERR_SAFETY_DOCUMENT_MISSING)"
          - "CapacityOwner.escrow_balance_cents >= ESCROW_MIN_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
          - "CapacityOwner.safety_score >= SAFETY_MIN_SCORE (ERR_SAFETY_SCORE_BELOW_MINIMUM)"
          - "CapacityOwner has at least one Equipment with status IN {IN_SERVICE} (ERR_EQUIPMENT_NOT_QUALIFIED)"
        side_effects:
          - "CapacityOwner.status → QUALIFIED"
          - "Recompute qualification_posture (QUALIFIED_CLEAR when every restriction input is clear)"
          - "Recompute qualified_until = earliest non-REJECTED ComplianceDocument.expires_at"
      - from: QUALIFIED
        to: OUT_OF_SERVICE
        trigger: POST /network/capacity-owners/{capacityOwnerId}/suspend
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.status == QUALIFIED (ERR_CAPACITY_OWNER_NOT_QUALIFIED)"
          - "body.reason_code is present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "CapacityOwner.status → OUT_OF_SERVICE"
          - "CapacityOwner.qualification_posture → QUALIFICATION_RESTRICTED"
          - "Cascade depth 1: every Equipment whose capacity_owner_id is this BCO and whose status == IN_SERVICE → OUT_OF_SERVICE"
          - "Cascade depth 2: every Trip whose capacity_owner_id is this BCO and whose status == DISPATCH_PENDING or EN_ROUTE → ABORTED, and CapacityOwner.safety_score -= 15 per aborted trip"
          - "Cascade depth 3: every Load whose awarded_capacity_owner_id is this BCO and whose status == AWARDED → POSTED with awarded_capacity_owner_id reset to null, and each such load's offers with status ACCEPTED → DECLINED"
      - from: OUT_OF_SERVICE
        to: QUALIFIED
        trigger: POST /network/capacity-owners/{capacityOwnerId}/reinstate
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.status == OUT_OF_SERVICE (ERR_CAPACITY_OWNER_NOT_OUT_OF_SERVICE)"
          - "CapacityOwner.safety_score >= SAFETY_MIN_SCORE (ERR_SAFETY_SCORE_BELOW_MINIMUM)"
          - "CapacityOwner.escrow_balance_cents >= ESCROW_MIN_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
          - "No Equipment owned by this BCO has inspection_status == OVERDUE (ERR_EQUIPMENT_INSPECTION_OVERDUE)"
        side_effects:
          - "CapacityOwner.status → QUALIFIED"
          - "Recompute qualification_posture (QUALIFIED_CLEAR when every restriction input is clear)"
      - from: PENDING_QUALIFICATION
        to: DECERTIFIED
        trigger: POST /network/capacity-owners/{capacityOwnerId}/decertify
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.status != DECERTIFIED (ERR_CAPACITY_OWNER_ALREADY_DECERTIFIED)"
          - "CapacityOwner.escrow_balance_cents >= MIN_ESCROW_FOR_DECERT_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
        side_effects:
          - "CapacityOwner.status → DECERTIFIED"
          - "CapacityOwner.qualification_posture → QUALIFICATION_FROZEN"
      - from: QUALIFIED
        to: DECERTIFIED
        trigger: POST /network/capacity-owners/{capacityOwnerId}/decertify
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.escrow_balance_cents >= MIN_ESCROW_FOR_DECERT_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
        side_effects:
          - "CapacityOwner.status → DECERTIFIED"
          - "CapacityOwner.qualification_posture → QUALIFICATION_FROZEN"
          - "Cascade depth 1: every Equipment whose capacity_owner_id is this BCO and whose status == IN_SERVICE → OUT_OF_SERVICE"
          - "Cascade depth 2: every Trip whose capacity_owner_id is this BCO and whose status == DISPATCH_PENDING or EN_ROUTE → ABORTED"
          - "Cascade depth 3: every Load whose awarded_capacity_owner_id is this BCO and whose status IN {AWARDED, COVERED} → POSTED with awarded_capacity_owner_id reset to null"
      - from: OUT_OF_SERVICE
        to: DECERTIFIED
        trigger: POST /network/capacity-owners/{capacityOwnerId}/decertify
        actor: SafetyReviewer
        preconditions:
          - "CapacityOwner.escrow_balance_cents >= MIN_ESCROW_FOR_DECERT_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
        side_effects:
          - "Same cascade as QUALIFIED → DECERTIFIED"

  - entity: Equipment
    initial_state: PENDING_INSPECTION
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING_INSPECTION
        to: IN_SERVICE
        trigger: POST /network/equipment/{equipmentId}/record-inspection
        actor: SafetyReviewer
        preconditions:
          - "Equipment.status != RETIRED (ERR_EQUIPMENT_ALREADY_RETIRED)"
          - "body.inspected_at <= Equipment.inspection_due_at (ERR_EQUIPMENT_INSPECTION_OVERDUE)"
          - "body.result == PASS (ERR_EQUIPMENT_INSPECTION_FAILED)"
          - "body.inspector_certificate is present and non-empty (ERR_INVALID_REQUEST)"
          - "The owning CapacityOwner.status IN {PENDING_QUALIFICATION, QUALIFIED} (ERR_CAPACITY_OWNER_NOT_QUALIFIED)"
        side_effects:
          - "Equipment.inspection_passed_at = body.inspected_at"
          - "Equipment.status → IN_SERVICE"
          - "Recompute Equipment.inspection_status and the owning CapacityOwner.qualification_posture"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: POST /network/equipment/{equipmentId}/place-out-of-service
        actor: SafetyReviewer
        preconditions:
          - "Equipment.status == IN_SERVICE (ERR_EQUIPMENT_NOT_IN_SERVICE)"
          - "body.reason_code is present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Equipment.status → OUT_OF_SERVICE"
          - "Cascade depth 1: every Trip whose equipment_id is this unit and whose status IN {DISPATCH_PENDING, EN_ROUTE} → ABORTED, and the owning CapacityOwner.safety_score -= 15 per aborted trip"
          - "Recompute the owning CapacityOwner.qualification_posture (→ QUALIFICATION_RESTRICTED)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: POST /network/equipment/{equipmentId}/record-inspection
        actor: SafetyReviewer
        preconditions:
          - "body.inspected_at <= Equipment.inspection_due_at (ERR_EQUIPMENT_INSPECTION_OVERDUE)"
          - "body.result == PASS (ERR_EQUIPMENT_INSPECTION_FAILED)"
        side_effects:
          - "Equipment.inspection_passed_at = body.inspected_at"
          - "Equipment.status → IN_SERVICE"
          - "Recompute Equipment.inspection_status and the owning CapacityOwner.qualification_posture"
      - from: IN_SERVICE
        to: PENDING_INSPECTION
        trigger: POST /network/equipment/{equipmentId}/record-inspection
        actor: SafetyReviewer
        preconditions:
          - "The owning CapacityOwner.status IN {PENDING_QUALIFICATION, QUALIFIED} (ERR_CAPACITY_OWNER_NOT_QUALIFIED)"
          - "body.result == FAIL (ERR_EQUIPMENT_INSPECTION_FAILED) — a PASS recorded on a unit that is already IN_SERVICE refreshes inspection_passed_at and leaves the status unchanged"
          - "body.inspected_at < Equipment.inspection_due_at (ERR_EQUIPMENT_INSPECTION_OVERDUE)"
        side_effects:
          - "Equipment.status → PENDING_INSPECTION"
          - "Cascade depth 1: every Trip whose equipment_id is this unit and whose status IN {DISPATCH_PENDING, EN_ROUTE} → ABORTED, and the owning CapacityOwner.safety_score -= 15 per aborted trip"
          - "Recompute the owning CapacityOwner.qualification_posture"
      - from: PENDING_INSPECTION
        to: RETIRED
        trigger: POST /network/equipment/{equipmentId}/retire
        actor: NetworkAdministrator
        preconditions:
          - "Equipment.status != RETIRED (ERR_EQUIPMENT_ALREADY_RETIRED)"
          - "No LoadOffer with status OPEN references a Load whose awarded_capacity_owner_id is this unit's owner and whose origin_state is in this unit's owner territory (ERR_INVALID_REQUEST)"
        side_effects:
          - "Equipment.status → RETIRED"
          - "Cascade depth 1: every Trip whose equipment_id is this unit and whose status IN {DISPATCH_PENDING, EN_ROUTE} → ABORTED, and the owning CapacityOwner.safety_score -= 15 per aborted trip"
          - "Recompute the owning CapacityOwner.qualification_posture"
      - from: IN_SERVICE
        to: RETIRED
        trigger: POST /network/equipment/{equipmentId}/retire
        actor: NetworkAdministrator
        preconditions:
          - "No Trip whose equipment_id is this unit has status IN {DISPATCH_PENDING, EN_ROUTE} (ERR_EQUIPMENT_HAS_ACTIVE_TRIP)"
        side_effects:
          - "Equipment.status → RETIRED"
          - "Recompute the owning CapacityOwner.qualification_posture"

  - entity: Load
    initial_state: POSTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: POSTED
        to: AWARDED
        trigger: POST /network/load-offers/{offerId}/accept
        actor: CapacityOwnerOperator
        preconditions:
          - "Load.status == POSTED and Load.board_required == true (ERR_LOAD_NOT_OPEN_FOR_AWARD)"
          - "The accepting CapacityOwner is the offer's capacity_owner_id (ERR_OFFER_NOT_DIRECTED_TO_CAPACITY_OWNER)"
          - "LoadOffer.status == OPEN (ERR_OFFER_NOT_OPEN)"
          - "logical clock < LoadOffer.expires_at; the clock reaching expires_at is enough to close the offer (ERR_OFFER_EXPIRED)"
          - "LoadOffer is the top-ranked OPEN offer on this Load by selected_rank (ERR_OFFER_NOT_TOP_RANKED)"
          - "CapacityOwner.qualification_posture == QUALIFIED_CLEAR (ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR)"
          - "CapacityOwner.status == QUALIFIED (ERR_CAPACITY_OWNER_NOT_QUALIFIED)"
          - "No other Load with status IN {AWARDED, COVERED, IN_TRANSIT} has awarded_capacity_owner_id pointing at this BCO (ERR_CAPACITY_OWNER_BUSY)"
          - "Load.origin_state is in the owning Agent's territory_codes (ERR_TERRITORY_VIOLATION)"
          - "Load.board_required is still true at award time (ERR_LOAD_NOT_OPEN_FOR_AWARD)"
        side_effects:
          - "LoadOffer.status → ACCEPTED"
          - "Load.awarded_capacity_owner_id = accepting capacity_owner_id"
          - "Load.status → AWARDED"
          - "Cascade depth 1: every other LoadOffer on this Load whose status == OPEN → DECLINED, recomputing their selected_rank to null"
          - "Cascade depth 2: Agent.awarded_load_count += 1"
          - "Cascade depth 3: recompute Agent.settlement_hold (unchanged unless an advance ceiling was crossed concurrently)"
      - from: AWARDED
        to: COVERED
        trigger: POST /network/trips
        actor: CapacityOwnerOperator
        preconditions:
          - "Load.status == AWARDED (ERR_LOAD_NOT_AWARDED)"
          - "body.capacity_owner_id == Load.awarded_capacity_owner_id (ERR_TRIP_OWNER_MISMATCH)"
          - "CapacityOwner.qualification_posture == QUALIFIED_CLEAR (ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR)"
          - "Equipment.inspection_status == CURRENT (ERR_EQUIPMENT_INSPECTION_NOT_CURRENT)"
          - "Equipment.status == IN_SERVICE (ERR_EQUIPMENT_NOT_IN_SERVICE)"
          - "Equipment.equipment_type IN {TRACTOR, STRAIGHT_TRUCK} (ERR_EQUIPMENT_TYPE_MISMATCH)"
          - "No Trip referencing this Equipment has status IN {DISPATCH_PENDING, EN_ROUTE} (ERR_EQUIPMENT_ALREADY_ASSIGNED)"
        side_effects:
          - "Load.status → COVERED"
          - "Cascade depth 1: Load.awarded_capacity_owner_id stays set and the new Trip.status remains DISPATCH_PENDING"
      - from: COVERED
        to: IN_TRANSIT
        trigger: POST /network/trips/{tripId}/dispatch
        actor: CapacityOwnerOperator
        preconditions:
          - "Load.status == COVERED (ERR_LOAD_NOT_COVERED)"
          - "Trip.status == DISPATCH_PENDING (ERR_TRIP_NOT_DISPATCH_PENDING)"
          - "CapacityOwner.qualification_posture == QUALIFIED_CLEAR (ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR)"
        side_effects:
          - "Trip.status → EN_ROUTE"
          - "Load.status → IN_TRANSIT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /network/trips/{tripId}/complete
        actor: CapacityOwnerOperator
        preconditions:
          - "Load.status == IN_TRANSIT (ERR_LOAD_NOT_IN_TRANSIT)"
          - "Trip.status == EN_ROUTE (ERR_TRIP_NOT_EN_ROUTE)"
          - "body.proof_of_delivery_code is present and non-empty (ERR_INVALID_REQUEST)"
          - "body.actual_miles > 0 (ERR_INVALID_REQUEST)"
          - "logical clock <= Trip.deadline_at for the on-time determination to record true; lateness is permitted and records on_time = false (no rejection)"
        side_effects:
          - "Trip.delivered_at = logical clock"
          - "Trip.on_time = (Trip.delivered_at <= Trip.deadline_at)"
          - "Trip.actual_miles = body.actual_miles"
          - "Trip.maintenance_reserve_cents = ceil(trip.actual_miles / MAINTENANCE_RESERVE_CHUNK_MILES) * MAINTENANCE_RESERVE_CENTS_PER_CHUNK"
          - "Trip.status → DELIVERED"
          - "Load.status → DELIVERED"
      - from: DELIVERED
        to: SETTLED
        trigger: POST /network/settlements/{settlementId}/settle
        actor: SettlementOperator
        preconditions:
          - "Load.status == DELIVERED (ERR_LOAD_NOT_SETTLEABLE)"
          - "Trip.status == COMPLETED (ERR_TRIP_NOT_COMPLETED)"
          - "Settlement.status == APPROVED (ERR_SETTLEMENT_NOT_APPROVED)"
          - "Settlement.settlement_method == FINAL (ERR_SETTLEMENT_METHOD_MISMATCH)"
          - "The owning Agent.settlement_hold == false (ERR_AGENT_SETTLEMENT_HELD)"
          - "CapacityOwner.escrow_balance_cents >= ESCROW_MIN_CENTS (ERR_ESCROW_BALANCE_INSUFFICIENT)"
          - "expected_network_load_version equals the current Load.version (ERR_STALE_VERSION)"
        side_effects:
          - "Settlement.status → SETTLED"
          - "Load.status → SETTLED"
          - "Load.version += 1"
          - "Cascade depth 1: six EscrowTransaction rows are posted for the BCO — OA_PREMIUM_DEDUCTION, INSURANCE_PREMIUM_DEDUCTION, MAINTENANCE_DEPOSIT, ESCROW_DEPOSIT, ADVANCE_REPAYMENT, each recomputing CapacityOwner.escrow_balance_cents and CapacityOwner.maintenance_balance_cents"
          - "Cascade depth 2: recompute CapacityOwner.outstanding_advance_cents from the ADVANCE and ADVANCE_REPAYMENT rows, then recompute CapacityOwner.qualification_posture"
          - "Cascade depth 3: recompute Agent.outstanding_advance_cents and Agent.settlement_hold"
      - from: POSTED
        to: CANCELLED
        trigger: POST /network/loads/{loadId}/cancel
        actor: FreightAgent
        preconditions:
          - "Load.status == POSTED (ERR_LOAD_NOT_CANCELLABLE)"
          - "The calling agent owns the load (X-User-ID == Load.agent_id) (ERR_UNAUTHORIZED)"
        side_effects:
          - "Load.status → CANCELLED"
          - "Cascade depth 1: every LoadOffer with load_id == this load and status == OPEN → WITHDRAWN"
      - from: POSTED
        to: CANCELLED
        trigger: "system (Post-Agreement: the owning Agent transitions ACTIVE → SUSPENDED, or → TERMINATED, and this Load is still POSTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Load.status → CANCELLED"
          - "Cascade depth 1: every LoadOffer with load_id == this load and status == OPEN → WITHDRAWN"
          - "Load.board_required recomputed to false"
      - from: AWARDED
        to: POSTED
        trigger: "system (Post-Agreement: the awarded CapacityOwner → OUT_OF_SERVICE or → DECERTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Load.awarded_capacity_owner_id → null"
          - "Load.status → POSTED"
          - "Cascade depth 1: the previously ACCEPTED LoadOffer → DECLINED, which re-derives selected_rank for the remaining OPEN offers"

  - entity: LoadOffer
    initial_state: OPEN
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: POST /network/load-offers/{offerId}/accept
        actor: CapacityOwnerOperator
        preconditions:
          - "LoadOffer.status == OPEN (ERR_OFFER_NOT_OPEN)"
          - "CapacityOwner.qualification_posture == QUALIFIED_CLEAR (ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR)"
        side_effects:
          - "Load.status → AWARDED and Load.awarded_capacity_owner_id set"
      - from: OPEN
        to: DECLINED
        trigger: POST /network/load-offers/{offerId}/decline
        actor: CapacityOwnerOperator
        preconditions:
          - "LoadOffer.status == OPEN (ERR_OFFER_NOT_OPEN)"
          - "The declining CapacityOwner is the offer's capacity_owner_id (ERR_OFFER_NOT_DIRECTED_TO_CAPACITY_OWNER)"
        side_effects:
          - "LoadOffer.status → DECLINED"
          - "Re-derive selected_rank for every remaining OPEN offer on the same Load"
      - from: OPEN
        to: EXPIRED
        trigger: "system (the logical clock reaches LoadOffer.expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "LoadOffer.status → EXPIRED"
          - "Re-derive selected_rank for every remaining OPEN offer on the same Load"
      - from: OPEN
        to: WITHDRAWN
        trigger: POST /network/load-offers/{offerId}/withdraw
        actor: FreightAgent
        preconditions:
          - "LoadOffer.status == OPEN (ERR_OFFER_NOT_OPEN)"
          - "The calling agent owns the parent load (X-User-ID == Load.agent_id) (ERR_UNAUTHORIZED)"
        side_effects:
          - "LoadOffer.status → WITHDRAWN"
          - "Re-derive selected_rank for every remaining OPEN offer on the same Load"

  - entity: Trip
    initial_state: DISPATCH_PENDING
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: DISPATCH_PENDING
        to: EN_ROUTE
        trigger: POST /network/trips/{tripId}/dispatch
        actor: CapacityOwnerOperator
        preconditions:
          - "Trip.status == DISPATCH_PENDING (ERR_TRIP_NOT_DISPATCH_PENDING)"
          - "CapacityOwner.qualification_posture == QUALIFIED_CLEAR (ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR)"
          - "Equipment.inspection_status == CURRENT (ERR_EQUIPMENT_INSPECTION_NOT_CURRENT)"
        side_effects:
          - "Trip.status → EN_ROUTE"
          - "Load.status → IN_TRANSIT"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: POST /network/trips/{tripId}/complete
        actor: CapacityOwnerOperator
        preconditions:
          - "Trip.status == EN_ROUTE (ERR_TRIP_NOT_EN_ROUTE)"
          - "body.proof_of_delivery_code is present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Trip.delivered_at = logical clock"
          - "Trip.on_time = (Trip.delivered_at <= Trip.deadline_at)"
          - "Trip.status → DELIVERED"
          - "Load.status → DELIVERED"
      - from: DELIVERED
        to: COMPLETED
        trigger: POST /network/trips/{tripId}/verify-pod
        actor: SettlementOperator
        preconditions:
          - "Trip.status == DELIVERED (ERR_TRIP_NOT_DELIVERED)"
          - "Trip.proof_of_delivery_code is present and non-empty (ERR_POD_MISSING)"
          - "body.pod_verified == true (ERR_POD_MISSING)"
        side_effects:
          - "Trip.status → COMPLETED"
          - "Trip.maintenance_reserve_cents settled at ceil(trip.actual_miles / MAINTENANCE_RESERVE_CHUNK_MILES) * MAINTENANCE_RESERVE_CENTS_PER_CHUNK"
      - from: DISPATCH_PENDING
        to: ABORTED
        trigger: POST /network/trips/{tripId}/abort
        actor: CapacityOwnerOperator
        preconditions:
          - "Trip.status == DISPATCH_PENDING (ERR_TRIP_NOT_ABORTABLE)"
        side_effects:
          - "Trip.status → ABORTED"
          - "Cascade depth 1: CapacityOwner.safety_score -= 15, then recompute qualification_posture"
          - "Cascade depth 2: Load.status → POSTED and Load.awarded_capacity_owner_id → null"
          - "Cascade depth 3: the previously ACCEPTED LoadOffer on that Load → DECLINED and selected_rank re-derived for the remaining OPEN offers"
      - from: EN_ROUTE
        to: ABORTED
        trigger: POST /network/trips/{tripId}/abort
        actor: CapacityOwnerOperator
        preconditions:
          - "Trip.status == EN_ROUTE (ERR_TRIP_NOT_ABORTABLE)"
        side_effects:
          - "Same cascade as DISPATCH_PENDING → ABORTED"
      - from: DISPATCH_PENDING
        to: ABORTED
        trigger: "system (Post-Agreement: the hauling CapacityOwner → OUT_OF_SERVICE or → DECERTIFIED, or the assigned Equipment leaves IN_SERVICE)"
        actor: system
        preconditions: []
        side_effects:
          - "Trip.status → ABORTED"
          - "Cascade depth 1: CapacityOwner.safety_score -= 15, then recompute qualification_posture"
          - "Cascade depth 2: Load.status → POSTED and Load.awarded_capacity_owner_id → null"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: POST /network/settlements/{settlementId}/submit
        actor: SettlementOperator
        preconditions:
          - "Settlement.status == DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
          - "The referenced Trip.status IN {DELIVERED, COMPLETED} (ERR_TRIP_NOT_SETTLEABLE)"
          - "For settlement_method FINAL the Trip.status must be COMPLETED (ERR_POD_MISSING)"
          - "Agent.settlement_hold == false (ERR_AGENT_SETTLEMENT_HELD)"
          - "CapacityOwner.qualification_posture != QUALIFICATION_FROZEN (ERR_CAPACITY_OWNER_QUALIFICATION_FROZEN)"
          - "expected_owner_version equals the current Agent.version or CapacityOwner.version as named in the request (ERR_STALE_VERSION)"
        side_effects:
          - "Settlement.status → PENDING_APPROVAL"
          - "Recompute all §1.3 derived fields for the selected settlement_method"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: POST /network/settlements/{settlementId}/approve
        actor: NetworkAdministrator
        preconditions:
          - "Settlement.status == PENDING_APPROVAL (ERR_SETTLEMENT_NOT_PENDING_APPROVAL)"
          - "X-User-ID differs from the X-User-ID that submitted the settlement (ERR_SEGREGATION_OF_DUTIES)"
          - "Settlement.settled_total_cents == linehaul_revenue_allocated_cents + fuel_surcharge_allocated_cents + accessorial_allocated_cents (ERR_SETTLEMENT_ALLOCATION_IMBALANCE)"
          - "net_owner_operator_pay_cents >= 0 (ERR_OWNER_OPERATOR_PAY_NEGATIVE)"
          - "Settlement.variant_delta_cents == 0 when settlement_method == FINAL (ERR_SETTLEMENT_VARIANT_DIVERGENCE)"
        side_effects:
          - "Settlement.status → APPROVED"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: POST /network/settlements/{settlementId}/reject
        actor: NetworkAdministrator
        preconditions:
          - "Settlement.status == PENDING_APPROVAL (ERR_SETTLEMENT_NOT_PENDING_APPROVAL)"
          - "X-User-ID differs from the submitting X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Settlement.status → DRAFT"
          - "Cascade depth 1: all six derived allocation fields are reset to null pending recomputation"
      - from: APPROVED
        to: SETTLED
        trigger: POST /network/settlements/{settlementId}/settle
        actor: SettlementOperator
        preconditions:
          - "Settlement.status == APPROVED (ERR_SETTLEMENT_NOT_APPROVED)"
          - "expected_network_load_version equals the current Load.version (ERR_STALE_VERSION)"
        side_effects:
          - "Settlement.status → SETTLED"
          - "Load.status → SETTLED"
          - "Six EscrowTransaction rows posted for the BCO and one ADVANCE_REPAYMENT row for the agent"
      - from: DRAFT
        to: VOID
        trigger: POST /network/settlements/{settlementId}/void
        actor: SettlementOperator
        preconditions:
          - "Settlement.status == DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
        side_effects:
          - "Settlement.status → VOID"
          - "No escrow or maintenance balances move because no transaction was ever posted for a DRAFT settlement"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on a parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-supersedes-stale-load-view
    parent_entity: Load
    write_endpoint: "POST /network/load-offers"
    occ_field: "expected_network_load_version"
    description: |
      Posting a LoadOffer against a Load whose version has advanced since
      the client last read it is rejected, because the prior writer's board
      mutation legitimately supersedes the offer the client was about to
      place: the rival offer may already occupy the top rank, or the load
      may already be AWARDED. The client's board view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-settle-supersedes-stale-load-view
    parent_entity: Load
    write_endpoint: "POST /network/settlements/{settlementId}/settle"
    occ_field: "expected_network_load_version"
    description: |
      Settling a Settlement against a Load whose version has advanced since
      the operator last read it is rejected, because the load already
      carries the settlement effect the operator was about to apply — the
      load is already SETTLED. The operator's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: qualify-supersedes-stale-capacity-owner-view
    parent_entity: CapacityOwner
    write_endpoint: "POST /network/capacity-owners/{capacityOwnerId}/qualify"
    occ_field: "expected_network_capacity_owner_version"
    description: |
      Qualifying a CapacityOwner whose version has advanced since the
      reviewer last read it is rejected, because a compliance document or
      escrow deposit written in between legitimately supersedes the
      qualification decision the reviewer was about to record. The
      reviewer's posture view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-submit-supersedes-stale-agent-view
    parent_entity: Agent
    write_endpoint: "POST /network/settlements/{settlementId}/submit"
    occ_field: "expected_network_agent_version"
    description: |
      Submitting a Settlement for approval against an Agent whose version
      has advanced since the operator last read it is rejected, because the
      agent's settlement_hold posture was recomputed in between by an
      advance or a status change that legitimately supersedes the
      submission. The operator's hold view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: settlement_split
    trigger: "POST /network/settlements and POST /network/settlements/{settlementId}/submit — every derived allocation field is recomputed"
    algorithm: waterfall_allocation
    input_set: |
      Source fields: Load.linehaul_revenue_cents, Load.fuel_surcharge_cents,
      Load.accessorial_revenue_cents, Agent.commission_rate_pct,
      CapacityOwner.revenue_split_pct, CapacityOwner.oa_enrolled,
      CapacityOwner.liability_insurance_deductible_cents,
      CapacityOwner.outstanding_advance_cents, Trip.actual_miles,
      Trip.maintenance_reserve_cents. No Load in any other status participates:
      only the single Load referenced by Settlement.trip_id.
    formula: |
      EVALUATION ORDER IS PINNED — this is part (c) of the combinatorial rule.
      Run these eight steps in exactly this order; step k may read the value
      step j < k wrote, never the reverse.

      Step 1. linehaul_revenue_allocated_cents = load.linehaul_revenue_cents
              fuel_surcharge_allocated_cents = load.fuel_surcharge_cents
              accessorial_allocated_cents     = load.accessorial_revenue_cents

      Step 2. union_base_cents = linehaul + fuel_surcharge + accessorial
              commissionable_base_cents = linehaul + accessorial
              (fuel surcharge is EXCLUDED from the commissionable base)

      Step 3. agent_share_cents = round_half_up(
                  commissionable_base_cents * agent.commission_rate_pct)

      Step 4. owner_share_cents = round_half_up(
                  (linehaul + fuel_surcharge) * capacity_owner.revenue_split_pct)

      Step 5. company_share_cents = union_base_cents
                  - agent_share_cents - owner_share_cents
              (the company absorbs every rounding remainder, because it is the
               last bucket in the waterfall)

      Step 6. DERIVED BASE — reads only Step 4's output.
              Also derives, from Step 1's figures:
                oa_base_cents            = linehaul + accessorial
                insurance_base_cents     = linehaul + fuel_surcharge
                escrow_base_cents        = linehaul + accessorial
                advance_repay_base_cents = linehaul

      Step 7. Withholdings, each a CEILING so no bucket's remainder is lost.
              Order within this step is irrelevant; every input is a Step 6 base.
              IF capacity_owner.oa_enrolled == false:
                  oa_premium_cents = 0
              ELSE:
                  oa_premium_cents = ceil(oa_base_cents * OA_PREMIUM_RATE)
              insurance_premium_cents = ceil(insurance_base_cents * INSURANCE_PREMIUM_RATE)
              maintenance_withholding_cents = trip.maintenance_reserve_cents
              escrow_withholding_cents = ceil(escrow_base_cents * ESCROW_WITHHOLDING_RATE)
              cap_cents = ceil(advance_repay_base_cents * ADVANCE_REPAYMENT_RATE)
              advance_repayment_cents = min(capacity_owner.outstanding_advance_cents,
                                            cap_cents)
              IF insurance_premium_cents > owner_share_cents:
                  insurance_premium_cents = owner_share_cents

      Step 8. net_owner_operator_pay_cents = owner_share_cents
                  - oa_premium_cents - insurance_premium_cents
                  - maintenance_withholding_cents - escrow_withholding_cents
                  - advance_repayment_cents
              net_agent_pay_cents = agent_share_cents
              # the recovered advance is the BCO's liability, so the agent's
              # net pay carries no advance deduction
              settled_total_cents = agent_share_cents + owner_share_cents + company_share_cents

      INVARIANT (conserved quantity): settled_total_cents MUST equal
      linehaul + fuel_surcharge + accessorial EXACTLY for both variants.
      The company bucket absorbs the rounding remainder so this holds by
      construction; a provider that rounds the total independently drifts.
    constants:
      OA_PREMIUM_RATE: 0.0150
      INSURANCE_PREMIUM_RATE: 0.0210
      ESCROW_WITHHOLDING_RATE: 0.0500
      ADVANCE_REPAYMENT_RATE: 0.1000
      ESCROW_BALANCE_FLOOR_CENTS: 100000
      MAINTENANCE_RESERVE_CHUNK_MILES: 1000
      MAINTENANCE_RESERVE_CENTS_PER_CHUNK: 1200
      MIN_ESCROW_FOR_DECERT_CENTS: 25000
    precision: "integer cents; round_half_up on Steps 3 and 4; ceil on every Step 7 withholding"
    variants:
      - name: provisional
        when: "Settlement.settlement_method == PROVISIONAL, admissible while the referenced Trip.status == COMPLETED"
        difference: |
          Steps 7 and 8 use the OWNER-OPERATOR base (Step 4 output,
          owner_share_cents) as the derived base for the two percentage
          withholdings:
              oa_premium_cents        = ceil(owner_share_cents * OA_PREMIUM_RATE)
              insurance_premium_cents = ceil(owner_share_cents * INSURANCE_PREMIUM_RATE)
          escrow_withholding_cents, maintenance_withholding_cents and
          advance_repayment_cents are IDENTICAL to the base algorithm.
          net_owner_operator_pay_cents differs from final whenever
          ceil(owner_share * rate) != ceil(base * rate).
      - name: final
        when: "Settlement.settlement_method == FINAL, admissible only after POST /network/trips/{tripId}/verify-pod and with the Load in DELIVERED or SETTLED"
        difference: |
          Steps 7 and 8 use the SEPARATE bases defined in Step 6:
              oa_premium_cents        = ceil((linehaul + accessorial) * OA_PREMIUM_RATE)
              insurance_premium_cents = ceil((linehaul + fuel_surcharge) * INSURANCE_PREMIUM_RATE)
          escrow_withholding_cents, maintenance_withholding_cents and
          advance_repayment_cents are IDENTICAL to the base algorithm, and
          agent_share_cents / owner_share_cents / company_share_cents are
          IDENTICAL across both variants — only the two percentage
          withholdings move, so FINAL and PROVISIONAL differ only in
          net_owner_operator_pay_cents and in the two premium fields.

  - name: oa_premium
    trigger: "POST /network/settlements and POST /network/settlements/{settlementId}/submit"
    algorithm: tiered_pricing
    input_set: |
      CapacityOwner.oa_enrolled, CapacityOwner.status,
      CapacityOwner.safety_score, CapacityOwner.qualification_posture, and
      the Load revenue mix (linehaul + accessorial) or owner_share_cents
      depending on the active settlement_split variant.
    formula: |
      effective_oa_rate_pct:
        IF capacity_owner.oa_enrolled == false:  0.0000  (no premium at all)
        ELSE tier on safety_score:
          safety_score >= 95  ->  0.0150
          safety_score == 94  ->  0.0175     (the 95 boundary: 95 takes 0.0150,
                                             94 takes 0.0175 — inclusive above)
          safety_score == 93  ->  0.0175
          safety_score <= 92  ->  0.0200
      premium = ceil(base_cents * effective_oa_rate_pct)
      where base_cents is owner_share_cents (PROVISIONAL) or
      linehaul + accessorial (FINAL).
      A NON-ENROLLED BCO pays 0 regardless of safety_score.
    constants:
      OA_RATE_STANDARD: 0.0150
      OA_RATE_ELEVATED: 0.0175
      OA_RATE_HIGH: 0.0200
      SAFETY_TIER_STANDARD_MIN: 95
      SAFETY_TIER_ELEVATED_MIN: 93
    precision: "integer cents, ceil"
    variants:
      - name: non_enrolled
        when: "capacity_owner.oa_enrolled == false"
        difference: "oa_premium_cents is exactly 0 and no EscrowTransaction row of type OA_PREMIUM_DEDUCTION is posted at settle."
      - name: enrolled_tiered
        when: "capacity_owner.oa_enrolled == true"
        difference: "premium = ceil(base_cents * effective_oa_rate_pct); the rate is selected by the safety_score tier with the boundary INCLUSIVE at 95."

  - name: per_load_settlement_fee_tier
    trigger: "POST /network/agents/{agentId}/per-load-settlement-tier"
    algorithm: threshold
    input_set: |
      Source entity: Agent, with the eligible Load set = every Load whose
      agent_id is this agent and whose status IN {AWARDED, COVERED,
      IN_TRANSIT, DELIVERED, SETTLED}. Window: the rolling calendar month
      containing the logical clock, half-open [month_start 00:00:00Z,
      month_start+1month 00:00:00Z). Tie-break: not applicable (a pure
      count). Ordered by Load.created_at ASC when a stable enumeration is
      needed.
    formula: |
      anchor_month_start = first instant of the calendar month containing
        the logical clock, at 00:00:00Z.
      month_window_end   = anchor_month_start + 1 calendar month (half-open —
        a load created exactly at month_window_end belongs to the NEXT month).
      eligible_load_count = count(Load) where
        Load.agent_id == agent.id
        AND Load.status IN {AWARDED, COVERED, IN_TRANSIT, DELIVERED, SETTLED}
        AND Load.created_at >= anchor_month_start
        AND Load.created_at <  month_window_end
      per_load_settlement_fee_cents:
        eligible_load_count <= 0   ->  5000   (the empty-set floor — a month
                                              with zero eligible loads still
                                              bills the base per-load fee)
        eligible_load_count <= 50  ->  4500
        eligible_load_count <= 150 ->  4000
        else                       ->  3500
      paid_load_count = count(Load) where agent_id == agent.id
        AND status IN {DELIVERED, SETTLED}
      period_settlement_fee_cents =
        eligible_load_count * per_load_settlement_fee_cents
      effective_per_load_fee_cents = floor_cent(
        period_settlement_fee_cents / eligible_load_count)
    constants:
      TIER_1_FEE_CENTS: 5000
      TIER_2_FEE_CENTS: 4500
      TIER_3_FEE_CENTS: 4000
      TIER_4_FEE_CENTS: 3500
      TIER_1_MAX_LOADS: 50
      TIER_2_MAX_LOADS: 150
    precision: "integer cents; the aggregate fee is exact; effective_per_load_fee_cents is a floor division and is the distinct aggregate-vs-marginal boundary of this calculation"
    variants:
      - name: marginal
        when: "the tier rate is applied to every eligible load in the month (a flat marginal rate for the whole band)"
        difference: "period_settlement_fee_cents uses the single band rate for the entire count — 0 eligible loads still bills the base fee, so the schedule is never zero."
      - name: cumulative_bracket
        when: "the fee is charged per band and summed (0-50 at 5000, 51-150 at 4500, 151+ at 3500)"
        difference: "period_settlement_fee_cents is the sum of each band's fill, so 60 eligible loads bills 50*5000 + 10*4500 = 295000 under cumulative_bracket versus 60*4500 = 270000 under marginal."

  - name: agent_commission_lag_reconciliation
    trigger: "GET /network/agents/{agentId}/settlement-summary read"
    algorithm: chronological
    input_set: |
      Source entity: Settlement, filtered to rows whose agent_id is this
      agent and whose status IN {APPROVED, SETTLED}. Each row's gross
      contribution is agent_share_cents. Ordering key: the referenced Trip's
      delivered_at ASC, tie-broken by Settlement.created_at ASC. Only the
      single settlement row with the highest (delivered_at, created_at) key
      per Trip counts — earlier rows for the same Trip are superseded
      revisions and contribute nothing.
    formula: |
      running_gross_cents = 0
      for each counted Settlement in (trip.delivered_at ASC, created_at ASC) order:
          if settlement.settlement_method == PROVISIONAL:
              running_gross_cents += agent_share_cents
          else:  # FINAL
              running_gross_cents += agent_share_cents
              # the FINAL row supersedes the PROVISIONAL row for the same trip
      agent_gross_commission_cents = running_gross_cents across all counted rows
      outstanding_advance_cents(O) = capacity-side and agent-side sums, per
                                    the Agent.outstanding_advance_cents definition
    constants:
      NO_CONSTANTS: 0
    precision: "integer cents"
    variants:
      - name: as_of_delivery
        when: "the settlement summary is read"
        difference: "rows are ordered by the Trip's delivered_at, so a late-approved settlement for an early trip lands at its delivery position rather than at the end of the ledger."
      - name: as_of_creation
        when: "the settlement summary is read with ?order=CREATION"
        difference: "rows are ordered by Settlement.created_at, so the same rows net to the same total but the running series diverges after the first out-of-order approval."

  - name: safety_score
    trigger: "Trip → ABORTED (any variant), ComplianceDocument verify, and any read of CapacityOwner"
    algorithm: weighted_scoring
    input_set: |
      CapacityOwner rows, their Trip children with status == ABORTED, and
      their ComplianceDocument children whose status == EXPIRED when
      evaluated against the logical clock.
    formula: |
      safety_score = clamp(
          SAFETY_BASE_SCORE
            - SAFETY_ABORT_PENALTY * count(Trip where trip.capacity_owner_id == bco.id
                                             AND trip.status == ABORTED)
            - SAFETY_EXPIRED_DOC_PENALTY * count(ComplianceDocument where
                                             document.capacity_owner_id == bco.id
                                             AND document.status == EXPIRED),
          0, SAFETY_BASE_SCORE)
      Each expiry-verification job that observes the same still-expired
      document again does NOT double-charge it — the penalty is a function of
      the current EXPIRED count, not an accumulator.
    constants:
      SAFETY_BASE_SCORE: 100
      SAFETY_ABORT_PENALTY: 15
      SAFETY_EXPIRED_DOC_PENALTY: 5
      SAFETY_MIN_SCORE: 70
    precision: "integer"
    variants:
      - name: absolute_penalties
        when: "the score is recomputed from current child state"
        difference: "recomputation is idempotent — re-running the expiry job changes nothing."
      - name: additive_penalties
        when: "each expiry-verification job decrements the stored score"
        difference: "running the expiry job twice against the same expired document yields 90 rather than 95, so the score drifts with job frequency; the scaffold pins absolute_penalties."

  - name: equipment_inspection_due_boundary
    trigger: "POST /network/equipment/{equipmentId}/record-inspection and every read of Equipment"
    algorithm: threshold
    input_set: "Equipment rows plus the logical clock; ComplianceDocument.expires_at for the host BCO."
    formula: |
      inspection_status(equipment, now):
        IF equipment.status == RETIRED:            RETIRED
        ELSE IF equipment.inspection_passed_at is NOT NULL
                AND equipment.inspection_passed_at < equipment.inspection_due_at:
                                                   CURRENT
        ELSE IF now < equipment.inspection_due_at: DUE
        ELSE:                                      OVERDUE
      current_inspection_required to record a pass:
        body.inspected_at < equipment.inspection_due_at   (strictly before —
        inspected_at == inspection_due_at is rejected, so the deadline instant
        itself is already too late)
      document_status(document, now):
        IF document.status == REJECTED:            REJECTED
        ELSE IF now < document.expires_at:         VALID
        ELSE IF now >= document.expires_at:        EXPIRED
        ELSE IF 0 < (document.expires_at - now) <= EXPIRING_SOON_DAYS days:
                                                   EXPIRING_SOON
    constants:
      EXPIRING_SOON_DAYS: 30
      EQUIPMENT_TURNAROUND_BUFFER_HOURS: 2
    precision: "not applicable (state classification)"
    variants:
      - name: inclusive_deadline
        when: "the boundary semantics are read as inclusive"
        difference: "an inspection recorded exactly at inspection_due_at would pass; the scaffold pins the exclusive form."
      - name: exclusive_deadline
        when: "the boundary semantics are read as exclusive (pinned)"
        difference: "inspected_at == inspection_due_at is OVERDUE and is rejected with ERR_EQUIPMENT_INSPECTION_OVERDUE."

  - name: agent_territory_precedence
    trigger: "POST /network/loads (promotion) and POST /network/load-offers/{offerId}/accept (award)"
    algorithm: constraint_propagation
    input_set: |
      Agent.territory_codes (ordered), Load.origin_state, every other Agent
      whose status IN {ACTIVE, SUSPENDED}, CustomerAccount.exclusivity_status.
    formula: |
      is_territory_valid(agent, load):
        return load.origin_state IN agent.territory_codes
      # precedence: when two ACTIVE or SUSPENDED agents both list the state,
      # the agent that listed it EARLIER in its own territory_codes array wins
      # the state; a state may be held by at most one agent.
      first_listed_rank(agent, state) = index of state in agent.territory_codes
      owner_of_state(state) = argmin over agents A with status IN {ACTIVE, SUSPENDED}
                              and state IN A.territory_codes of
                              (first_listed_rank(A, state),
                               A.created_at ASC)   # created_at is the fallback
                                                   # and the tie-break; never id
      is_customer_owner(agent, customer_ref) =
        exists CustomerAccount CA where CA.agent_id == agent.id
          AND CA.customer_ref == customer_ref
          AND CA.exclusivity_status == OWNED_EXCLUSIVE
      is_nonsolicit_cleared(agent, customer_ref, now) =
        exists CustomerAccount CA where CA.customer_ref == customer_ref
          AND CA.exclusivity_status IN {OWNED_EXCLUSIVE, OPEN_SHARED}
          AND now < CA.ownership_expires_at
          OR (CA.exclusivity_status == OPEN_SHARED AND now >= CA.ownership_expires_at)
    constants:
      NON_SOLICITATION_RADIUS_DAYS: 90
    precision: "not applicable (classification); the fallback and tie-break use created_at, never id"
    variants:
      - name: array_order_precedence
        when: "a state appears in two agents' territories (pinned)"
        difference: "the state belongs to whichever agent lists it first in its own territory_codes array, with created_at ASC breaking an equal-index tie."
      - name: alphabetical_precedence
        when: "a state appears in two agents' territories, ordered by state_code"
        difference: "would hand the state to the alphabetically-first agent regardless of who claimed it first; the scaffold pins array_order_precedence."

  - name: escrow_withholding
    trigger: "POST /network/settlements/{settlementId}/settle and POST /network/escrow-transactions"
    algorithm: waterfall_allocation
    input_set: |
      CapacityOwner.escrow_balance_cents, CapacityOwner.maintenance_balance_cents,
      the settlement's escrow_base_cents (linehaul + accessorial),
      settlement_split Step 7.
    formula: |
      escrow_target_cents = ceil(escrow_base_cents * ESCROW_WITHHOLDING_RATE)
      escrow_deficit_cents = max(0, ESCROW_TARGET_BALANCE_CENTS
                                    - capacity_owner.escrow_balance_cents)
      IF capacity_owner.escrow_balance_cents >= ESCROW_BALANCE_FLOOR_CENTS:
          escrow_withholding_cents = 0
      ELSE:
          # fill the floor before the target: floor first, then target
          escrow_withholding_cents = min(escrow_target_cents,
                                         max(escrow_deficit_cents,
                                             ESCROW_BALANCE_FLOOR_CENTS
                                             - capacity_owner.escrow_balance_cents))
    constants:
      ESCROW_BALANCE_FLOOR_CENTS: 100000
      ESCROW_TARGET_BALANCE_CENTS: 200000
    precision: "integer cents, ceil"
    variants:
      - name: floor_first
        when: "the balance is below ESCROW_BALANCE_FLOOR_CENTS (pinned)"
        difference: "the floor bucket fills before the target bucket, so an under-floor BCO contributes up to the floor with no carry to the target."
      - name: target_first
        when: "the balance is below ESCROW_TARGET_BALANCE_CENTS"
        difference: "would size the withholding against the 200000 target directly, so an under-floor BCO contributes nothing until the target is nearly reached."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and carry a role declared in §1.7"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The caller's role must be permitted for this operation per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right; a body foreign key id must exist. Left-to-right order within one body is the order the endpoint's input list declares."
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type — ERR_AGENT_NOT_FOUND, ERR_CAPACITY_OWNER_NOT_FOUND, ERR_LOAD_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND, ERR_TRIP_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_CUSTOMER_ACCOUNT_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with path ids or body foreign keys

  - priority: 4
    category: state
    check: "Target resource must be in the state the operation requires (see §1.2 transition preconditions for each error id)"
    error_id: "varies (ERR_LOAD_NOT_OPEN_FOR_AWARD, ERR_OFFER_NOT_OPEN, ERR_AGENT_NOT_ACTIVE, ERR_SETTLEMENT_NOT_DRAFT, ERR_TRIP_NOT_EN_ROUTE, ERR_EQUIPMENT_NOT_IN_SERVICE, ...)"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 5
    category: state
    check: "The caller must own the resource it is acting on where §1.7 assigns ownership (agent_id, capacity_owner_id match X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /network/loads/{loadId}/cancel, POST /network/load-offers/{offerId}/withdraw, POST /network/load-offers/{offerId}/decline, POST /network/load-offers/{offerId}/accept"

  - priority: 6
    category: business_safety
    check: "The CapacityOwner's derived qualification posture must satisfy the operation's requirement, and the BCO/trip safety preconditions must hold (status QUALIFIED, safety_score >= SAFETY_MIN_SCORE, escrow at floor, equipment inspection CURRENT)"
    error_id: "varies (ERR_CAPACITY_OWNER_NOT_QUALIFIED, ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR, ERR_CAPACITY_OWNER_BUSY, ERR_EQUIPMENT_INSPECTION_OVERDUE, ERR_EQUIPMENT_INSPECTION_NOT_CURRENT, ERR_EQUIPMENT_NOT_IN_SERVICE, ERR_SAFETY_SCORE_BELOW_MINIMUM, ERR_SAFETY_DOCUMENT_MISSING)"
    http_status: 409
    applies_to: "POST /network/load-offers/{offerId}/accept, POST /network/trips, POST /network/trips/{tripId}/dispatch, POST /network/capacity-owners/{capacityOwnerId}/qualify, POST /network/capacity-owners/{capacityOwnerId}/reinstate, POST /network/equipment/{equipmentId}/record-inspection"

  - priority: 7
    category: compliance
    check: "The load must fall inside the promoting agent's territory, the customer account must not be under a live non-solicitation hold, and the awarded BCO must be safety-cleared — the network's regulatory/safety gate, evaluated after existence and state"
    error_id: "varies (ERR_TERRITORY_VIOLATION, ERR_CUSTOMER_NON_SOLICITATION_ACTIVE, ERR_AGENT_SETTLEMENT_HELD, ERR_AGENT_SETTLEMENTS_OUTSTANDING)"
    http_status: 422
    applies_to: "POST /network/loads, POST /network/load-offers, POST /network/load-offers/{offerId}/accept, POST /network/agents/{agentId}/terminate"

  - priority: 8
    category: business_referential
    check: "Temporal-overlap and single-assignment conflict checks: the BCO must not already hold a non-terminal load, and the equipment must not already be on a non-terminal trip"
    error_id: "varies (ERR_CAPACITY_OWNER_ALREADY_ON_LOAD, ERR_EQUIPMENT_ALREADY_ASSIGNED, ERR_OFFER_TIME_OVERLAP)"
    http_status: 409
    applies_to: "POST /network/load-offers/{offerId}/accept, POST /network/trips, POST /network/trips/{tripId}/dispatch"

  - priority: 9
    category: business_constraint
    check: "Structural integrity of the request against the offering BCO's fleet: the load's awarded BCO must own at least one Equipment, the equipment type must match the load's trailer requirement, and the offer's ceiling must not be exceeded"
    error_id: "varies (ERR_EQUIPMENT_FLEET_EMPTY, ERR_EQUIPMENT_TYPE_MISMATCH, ERR_OFFER_EXCEEDS_PAY_CEILING, ERR_TRIP_OWNER_MISMATCH)"
    http_status: 400
    applies_to: "POST /network/load-offers, POST /network/trips"

  - priority: 10
    category: business_fiscal
    check: "Money invariants must hold before any financial mutation is allowed: the settlement allocation must conserve the union base, no negative net owner-operator pay, and no negative balance may result from an escrow mutation"
    error_id: "varies (ERR_SETTLEMENT_ALLOCATION_IMBALANCE, ERR_OWNER_OPERATOR_PAY_NEGATIVE, ERR_ESCROW_BALANCE_INSUFFICIENT, ERR_MAINTENANCE_BALANCE_INSUFFICIENT, ERR_ESCROW_ALREADY_MATCHED, ERR_CAPACITY_OWNER_QUALIFICATION_FROZEN, ERR_LOAD_ALREADY_SETTLED)"
    http_status: 402
    applies_to: "POST /network/settlements, POST /network/settlements/{settlementId}/submit, POST /network/settlements/{settlementId}/approve, POST /network/settlements/{settlementId}/settle, POST /network/escrow-transactions, POST /network/escrow-transactions/{transactionId}/reverse"

  - priority: 11
    category: business_temporal
    check: "Logical-clock windows must still be open: the offer must not have reached its expiry instant and the customer's exclusivity window must still be running"
    error_id: "varies (ERR_OFFER_EXPIRED, ERR_CUSTOMER_EXCLUSIVITY_EXPIRED)"
    http_status: 409
    applies_to: "POST /network/load-offers/{offerId}/accept, POST /network/load-offers/{offerId}/decline"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Internal board selector policy ---
  - method: GET
    path: "/network/load-offers/board"
    description: "The internal load board view for one load: returns the load's offers ordered by the board selector policy — selected_rank ASC, i.e. offered_pay_cents DESC, then offered_at ASC, then created_at ASC. Offers that have reached expires_at against the logical clock are still listed but report status EXPIRED."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: [load_id]
    output: "LoadOffer[]"
    side_effects: []

  # --- CapacityOwner ---
  - method: POST
    path: "/network/capacity-owners"
    description: "Enroll a business capacity owner (BCO). Creates the BCO in PENDING_QUALIFICATION with the derived posture recomputed from empty account balances."
    roles: [NetworkAdministrator]
    code: 201
    input: ["owner_code", "legal_name", "home_terminal_city", "revenue_split_pct", "oa_enrolled?", "liability_insurance_deductible_cents?"]
    output: CapacityOwner
    side_effects:
      - "status = PENDING_QUALIFICATION"
      - "escrow_balance_cents = 0 and maintenance_balance_cents = 0"
      - "safety_score initialized to 100"
      - "qualification_posture recomputed → QUALIFICATION_RESTRICTED (escrow below floor)"

  - method: GET
    path: "/network/capacity-owners"
    description: "List business capacity owners, optionally filtered by posture or status."
    roles: [FreightAgent, NetworkAdministrator, SettlementOperator]
    code: 200
    input: ["status?", "qualification_posture?", "limit?", "offset?"]
    output: "CapacityOwner[]"
    side_effects: []

  - method: GET
    path: "/network/capacity-owners/{id}"
    description: "Get one business capacity owner with its derived posture, balances and safety score."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: CapacityOwner
    side_effects: []

  - method: POST
    path: "/network/capacity-owners/{id}/qualify"
    description: "Qualify a BCO. The decision is recorded against the version the caller observed; a stale expected_network_capacity_owner_version is rejected."
    roles: [SafetyReviewer]
    code: 200
    input: [expected_network_capacity_owner_version]
    output: CapacityOwner
    side_effects:
      - "status → QUALIFIED"
      - "increments CapacityOwner.version by 1"
      - "qualification_posture recomputed"
      - "qualified_until recomputed = earliest non-REJECTED ComplianceDocument.expires_at"

  - method: POST
    path: "/network/capacity-owners/{id}/deep-clone"
    description: "Test-driving endpoint. Creates a fresh CapacityOwner row that carries the SAME identified attributes as the source row — owner_code and legal_name get a distinct suffix so network-wide uniqueness holds, while revenue_split_pct, oa_enrolled, liability_insurance_deductible_cents and home_terminal_city are copied verbatim. The clone starts PENDING_QUALIFICATION with zero escrow and maintenance balances, safety_score 100, and no Equipment, ComplianceDocument, Trip or Settlement children."
    roles: [NetworkAdministrator]
    code: 201
    input: [source_capacity_owner_id]
    output: CapacityOwner
    side_effects:
      - "a new CapacityOwner row is created with status = PENDING_QUALIFICATION"
      - "escrow_balance_cents = 0, maintenance_balance_cents = 0, safety_score = 100"
      - "qualification_posture recomputed → QUALIFICATION_RESTRICTED (escrow below floor)"

  - method: POST
    path: "/network/capacity-owners/{id}/suspend"
    description: "Place a qualified BCO out of service; cascades to its fleet, its open trips and its awarded loads."
    roles: [SafetyReviewer]
    code: 200
    input: [reason_code]
    output: CapacityOwner
    side_effects:
      - "status → OUT_OF_SERVICE"
      - "increments CapacityOwner.version by 1"
      - "IN_SERVICE Equipment → OUT_OF_SERVICE; DISPATCH_PENDING/EN_ROUTE Trips → ABORTED; AWARDED Loads → POSTED"
      - "qualification_posture recomputed"

  - method: POST
    path: "/network/capacity-owners/{id}/reinstate"
    description: "Return an out-of-service BCO to QUALIFIED once safety, escrow and inspection gates clear."
    roles: [SafetyReviewer]
    code: 200
    input: [reason_code]
    output: CapacityOwner
    side_effects:
      - "status → QUALIFIED"
      - "increments CapacityOwner.version by 1"
      - "qualification_posture recomputed"

  - method: POST
    path: "/network/capacity-owners/{id}/decertify"
    description: "Permanently decertify a BCO. Freezes the qualification posture so no settlement may be submitted against it."
    roles: [SafetyReviewer]
    code: 200
    input: [reason_code]
    output: CapacityOwner
    side_effects:
      - "status → DECERTIFIED"
      - "increments CapacityOwner.version by 1"
      - "qualification_posture → QUALIFICATION_FROZEN"
      - "IN_SERVICE Equipment → OUT_OF_SERVICE; DISPATCH_PENDING/EN_ROUTE Trips → ABORTED; AWARDED/COVERED Loads → POSTED"

  # --- Equipment ---
  - method: POST
    path: "/network/equipment"
    description: "Add a unit to a BCO's fleet. The unit starts PENDING_INSPECTION and its derived inspection_status is evaluated against the logical clock on every read."
    roles: [SafetyReviewer, NetworkAdministrator]
    code: 201
    input: [capacity_owner_id, unit_number, equipment_type, model_year, inspection_due_at]
    output: Equipment
    side_effects:
      - "status = PENDING_INSPECTION"
      - "inspection_passed_at = null"
      - "owning CapacityOwner.qualification_posture recomputed"

  - method: GET
    path: "/network/capacity-owners/{id}/equipment"
    description: "List the units in one BCO's fleet with their derived inspection status."
    roles: [FreightAgent, CapacityOwnerOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["status?", "inspection_status?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  - method: GET
    path: "/network/equipment/{id}"
    description: "Get one unit with its derived inspection status."
    roles: [CapacityOwnerOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: POST
    path: "/network/equipment/{id}/record-inspection"
    description: "Record a periodic inspection result. inspected_at strictly before inspection_due_at is required. From PENDING_INSPECTION or OUT_OF_SERVICE a pass moves the unit to IN_SERVICE; a failure from IN_SERVICE moves it to PENDING_INSPECTION; a pass recorded on a unit already IN_SERVICE refreshes inspection_passed_at and leaves the status unchanged."
    roles: [SafetyReviewer]
    code: 200
    input: [inspected_at, result, inspector_certificate]
    output: Equipment
    side_effects:
      - "inspection_passed_at = inspected_at when result == PASS"
      - "status → IN_SERVICE (PASS) or PENDING_INSPECTION (FAIL)"
      - "increments Equipment.version by 1"
      - "inspection_status recomputed; owning CapacityOwner.qualification_posture recomputed"
      - "any DISPATCH_PENDING/EN_ROUTE Trip on this unit → ABORTED with CapacityOwner.safety_score -= 15"

  - method: POST
    path: "/network/equipment/{id}/place-out-of-service"
    description: "Remove a unit from service; aborts any non-terminal trip on the unit."
    roles: [SafetyReviewer]
    code: 200
    input: [reason_code]
    output: Equipment
    side_effects:
      - "status → OUT_OF_SERVICE"
      - "increments Equipment.version by 1"
      - "DISPATCH_PENDING/EN_ROUTE Trips on this unit → ABORTED; owning CapacityOwner.safety_score -= 15 each"
      - "owning CapacityOwner.qualification_posture recomputed"

  - method: POST
    path: "/network/equipment/{id}/retire"
    description: "Retire a unit permanently. Rejected while the unit is on a non-terminal trip."
    roles: [NetworkAdministrator]
    code: 200
    input: [reason_code]
    output: Equipment
    side_effects:
      - "status → RETIRED"
      - "increments Equipment.version by 1"
      - "owning CapacityOwner.qualification_posture recomputed"

  # --- ComplianceDocument ---
  - method: POST
    path: "/network/compliance-documents"
    description: "File a safety credential for a BCO. Status is derived from expires_at against the logical clock and is never client-supplied."
    roles: [SafetyReviewer]
    code: 201
    input: [capacity_owner_id, document_type, document_number, issued_at, expires_at]
    output: ComplianceDocument
    side_effects:
      - "status derived: VALID | EXPIRING_SOON | EXPIRED against the logical clock"
      - "owning CapacityOwner.qualification_posture and qualified_until recomputed"

  - method: GET
    path: "/network/capacity-owners/{id}/compliance-documents"
    description: "List a BCO's credentials with their clock-derived status."
    roles: [CapacityOwnerOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["document_type?", "status?", "limit?", "offset?"]
    output: "ComplianceDocument[]"
    side_effects: []

  - method: GET
    path: "/network/compliance-documents/{id}"
    description: "Get one credential with its clock-derived status."
    roles: [CapacityOwnerOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: []

  - method: POST
    path: "/network/compliance-documents/{id}/verify"
    description: "Re-evaluate a credential against the logical clock and recompute the host BCO's safety score and posture."
    roles: [SafetyReviewer]
    code: 200
    input: [verified_at]
    output: ComplianceDocument
    side_effects:
      - "status recomputed"
      - "owning CapacityOwner.safety_score recomputed from the current EXPIRED count"
      - "owning CapacityOwner.qualification_posture recomputed"

  # --- EscrowTransaction ---
  - method: POST
    path: "/network/escrow-transactions"
    description: "Post a forward escrow, maintenance, advance or premium-deduction entry. Direction is implied by transaction_type; a negative resulting balance is rejected."
    roles: [SettlementOperator, NetworkAdministrator]
    code: 201
    input: [capacity_owner_id, transaction_type, amount_cents, effective_at]
    output: EscrowTransaction
    side_effects:
      - "status = POSTED"
      - "derived CapacityOwner.escrow_balance_cents / maintenance_balance_cents recomputed"
      - "derived CapacityOwner.outstanding_advance_cents recomputed for ADVANCE / ADVANCE_REPAYMENT"
      - "CapacityOwner.qualification_posture recomputed when the escrow floor is crossed"

  - method: GET
    path: "/network/escrow-transactions"
    description: "List escrow and maintenance ledger entries, filterable by BCO, type or status."
    roles: [CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["capacity_owner_id?", "transaction_type?", "status?", "limit?", "offset?"]
    output: "EscrowTransaction[]"
    side_effects: []

  - method: GET
    path: "/network/capacity-owners/{id}/escrow-transactions"
    description: "List one BCO's escrow and maintenance ledger entries in effective_at ascending order."
    roles: [CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["transaction_type?", "status?", "from_effective_at?", "to_effective_at?", "limit?", "offset?"]
    output: "EscrowTransaction[]"
    side_effects: []

  - method: GET
    path: "/network/escrow-transactions/{id}"
    description: "Get one ledger entry with the resulting balances."
    roles: [CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: EscrowTransaction
    side_effects: []

  - method: POST
    path: "/network/escrow-transactions/{id}/reverse"
    description: "Post the declared compensating entry for a ledger entry, leaving the conserved balance invariant intact. The compensating map is fixed: ESCROW_DEPOSIT→ESCROW_RELEASE, MAINTENANCE_DEPOSIT→MAINTENANCE_WITHDRAWAL, ADVANCE→ADVANCE_REPAYMENT, ESCROW_RELEASE→ESCROW_DEPOSIT, MAINTENANCE_WITHDRAWAL→MAINTENANCE_DEPOSIT, ADVANCE_REPAYMENT→ADVANCE, OA_PREMIUM_DEDUCTION→ESCROW_RELEASE, INSURANCE_PREMIUM_DEDUCTION→ESCROW_RELEASE. A reversal whose target is already REVERSED, or whose type is not the declared compensating type, is rejected."
    roles: [SettlementOperator, NetworkAdministrator]
    code: 200
    input: [effective_at]
    output: EscrowTransaction
    side_effects:
      - "a compensating EscrowTransaction row is created and posted"
      - "the original row's status → REVERSED"
      - "derived CapacityOwner balances recomputed; reversal of a MAINTENANCE_DEPOSIT restores the pre-mutation balance exactly"
      - "CapacityOwner.qualification_posture recomputed when the escrow floor is crossed"

  # --- Agent ---
  - method: POST
    path: "/network/agents"
    description: "Enroll an independent freight agent. Territory overlap with a live agent is rejected at enrollment."
    roles: [NetworkAdministrator]
    code: 201
    input: ["agent_code", "legal_name", "home_state", "commission_rate_pct", "territory_codes", "customer_ownership_days?"]
    output: Agent
    side_effects:
      - "status = PENDING_ENROLLMENT"
      - "settlement_hold recomputed → true (status is not ACTIVE)"
      - "active_customer_count = 0; awarded_load_count = 0"

  - method: GET
    path: "/network/agents"
    description: "List agents, optionally filtered by status or by a territory state code."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "territory_state?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/network/agents/{id}"
    description: "Get one agent with its derived posture, counts and advance balance."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: POST
    path: "/network/agents/{id}/activate"
    description: "Activate an enrolled agent. Rejected when the agent's territory overlaps any live agent's territory."
    roles: [NetworkAdministrator]
    code: 200
    input: []
    output: Agent
    side_effects:
      - "status → ACTIVE"
      - "increments Agent.version by 1"
      - "settlement_hold recomputed"
      - "board_required recomputed on every Load whose agent_id is this agent"

  - method: POST
    path: "/network/agents/{id}/suspend"
    description: "Suspend an agent whose status is ACTIVE. Cancels its Load rows with status POSTED and flips their LoadOffer rows with status OPEN to WITHDRAWN."
    roles: [NetworkAdministrator]
    code: 200
    input: [reason_code]
    output: Agent
    side_effects:
      - "status → SUSPENDED; settlement_hold → true"
      - "increments Agent.version by 1"
      - "POSTED Loads of this agent → CANCELLED with their OPEN LoadOffers → WITHDRAWN"
      - "board_required recomputed on every Load whose agent_id is this agent"

  - method: POST
    path: "/network/agents/{id}/reinstate"
    description: "Return a suspended agent to ACTIVE once its advance balance is back under the ceiling."
    roles: [NetworkAdministrator]
    code: 200
    input: []
    output: Agent
    side_effects:
      - "status → ACTIVE; settlement_hold recomputed"
      - "increments Agent.version by 1"
      - "board_required recomputed on every Load whose agent_id is this agent"

  - method: POST
    path: "/network/agents/{id}/terminate"
    description: "Terminate an agent. Releases its exclusively-owned customer accounts and blocks new promotions against them."
    roles: [NetworkAdministrator]
    code: 200
    input: [reason_code]
    output: Agent
    side_effects:
      - "status → TERMINATED; settlement_hold → true"
      - "increments Agent.version by 1"
      - "POSTED Loads of this agent → CANCELLED with their OPEN LoadOffers → WITHDRAWN"
      - "OWNED_EXCLUSIVE CustomerAccounts → RELEASED with released_reason AGENT_TERMINATED"

  - method: GET
    path: "/network/agents/{id}/settlement-summary"
    description: "Chronological commission reconciliation for one agent: the running gross commission series over APPROVED and SETTLED settlements ordered by the referenced trip's delivered_at, tie-broken by Settlement.created_at."
    roles: [FreightAgent, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["order?"]
    output: "{ gross_commission_cents: integer, settlement_count: integer, last_fee_period_label: string }"
    side_effects: []

  - method: POST
    path: "/network/agents/{id}/per-load-settlement-tier"
    description: "Evaluate the per-load settlement fee tier for the current calendar month and return the schedule row; selecting the method computes the fee under the chosen tier interpretation."
    roles: [SettlementOperator, NetworkAdministrator]
    code: 200
    input: [settlement_method]
    output: "{ tier_load_count: integer, marginal_fee_cents: integer, cumulative_fee_cents: integer, effective_per_load_fee_cents: integer, month_start: datetime, month_end: datetime }"
    side_effects: []

  # --- CustomerAccount ---
  - method: POST
    path: "/network/customer-accounts"
    description: "Register a shipper under an agent. The exclusivity window starts at first_booked_at."
    roles: [FreightAgent, NetworkAdministrator]
    code: 201
    input: ["agent_id", "customer_ref", "shipper_name", "first_booked_at", "released_reason?"]
    output: CustomerAccount
    side_effects:
      - "ownership_expires_at recomputed = first_booked_at + agent.customer_ownership_days days"
      - "exclusivity_status derived: OWNED_EXCLUSIVE before ownership_expires_at, OPEN_SHARED at or after it"
      - "owning Agent.active_customer_count recomputed"

  - method: GET
    path: "/network/customer-accounts"
    description: "List customer accounts, optionally filtered by agent or exclusivity status."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["agent_id?", "customer_ref?", "exclusivity_status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []

  - method: GET
    path: "/network/agents/{id}/customer-accounts"
    description: "List one agent's customer accounts with their clock-derived exclusivity status."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["exclusivity_status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []

  - method: GET
    path: "/network/customer-accounts/{id}"
    description: "Get one customer account with its derived exclusivity window."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  # --- Load ---
  - method: POST
    path: "/network/loads"
    description: "Promote a load onto the agent's board. Rejected when the origin state is outside the agent's territory or the customer is under a live exclusivity hold held by a different agent."
    roles: [FreightAgent]
    code: 201
    input: ["agent_id", "customer_ref", "origin_state", "destination_state", "linehaul_revenue_cents", "fuel_surcharge_cents?", "accessorial_revenue_cents?", "dispatched_miles"]
    output: Load
    side_effects:
      - "status = POSTED"
      - "board_required recomputed from the agent's status and settlement_hold"
      - "awarded_capacity_owner_id = null"

  - method: GET
    path: "/network/loads"
    description: "List loads, optionally filtered by agent, status, origin state or assigned BCO."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["agent_id?", "awarded_capacity_owner_id?", "status?", "origin_state?", "limit?", "offset?"]
    output: "Load[]"
    side_effects: []

  - method: GET
    path: "/network/agents/{id}/loads"
    description: "List one agent's sourced loads with their board and award state."
    roles: [FreightAgent, AgentManager, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Load[]"
    side_effects: []

  - method: GET
    path: "/network/loads/{id}"
    description: "Get one load with its derived board_required flag and award state."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: Load
    side_effects: []

  - method: POST
    path: "/network/loads/{id}/cancel"
    description: "Cancel a load whose status is POSTED, flipping its LoadOffer rows with status OPEN to WITHDRAWN."
    roles: [FreightAgent]
    code: 200
    input: [reason_code]
    output: Load
    side_effects:
      - "status → CANCELLED"
      - "increments Load.version by 1"
      - "OPEN LoadOffers on this load → WITHDRAWN"

  - method: POST
    path: "/network/loads/{id}/settlement"
    description: "Compute or recompute the settlement split for one load's completed trip without persisting it, returning a freshly evaluated Settlement-shaped object."
    roles: [SettlementOperator, NetworkAdministrator]
    code: 200
    input: [settlement_method]
    output: "{ agent_share_cents: integer, owner_operator_share_cents: integer, company_share_cents: integer, oa_premium_cents: integer, insurance_premium_cents: integer, escrow_withholding_cents: integer, maintenance_withholding_cents: integer, advance_repayment_cents: integer, net_owner_operator_pay_cents: integer, net_agent_pay_cents: integer, settled_total_cents: integer }"
    side_effects: []

  # --- LoadOffer ---
  - method: POST
    path: "/network/load-offers"
    description: "Post an offer from a BCO to the internal board for a posted load. Rejected when the offer exceeds the derived pay ceiling."
    roles: [FreightAgent]
    code: 201
    input: [load_id, capacity_owner_id, offered_pay_cents, offered_at, expected_network_load_version]
    output: LoadOffer
    side_effects:
      - "status = OPEN"
      - "selected_rank recomputed for every OPEN offer on this load"
      - "increments Load.version by 1"

  - method: GET
    path: "/network/load-offers"
    description: "List board offers, optionally filtered by load, BCO, status or pay floor."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["load_id?", "capacity_owner_id?", "status?", "limit?", "offset?"]
    output: "LoadOffer[]"
    side_effects: []

  - method: GET
    path: "/network/loads/{id}/load-offers"
    description: "List one load's board offers ordered by the board selector policy (selected_rank ASC, then created_at ASC)."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LoadOffer[]"
    side_effects: []

  - method: GET
    path: "/network/load-offers/{id}"
    description: "Get one board offer with its derived ceiling, expiry and rank."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: LoadOffer
    side_effects: []

  - method: POST
    path: "/network/load-offers/{id}/accept"
    description: "Accept a board offer, awarding the load to the offering BCO. Only the LoadOffer whose status is OPEN and whose selected_rank is 1 on its load is acceptable."
    roles: [CapacityOwnerOperator]
    code: 200
    input: [accepted_at]
    output: LoadOffer
    side_effects:
      - "status → ACCEPTED; the other OPEN offers on the load → DECLINED with rank re-derived"
      - "Load status → AWARDED and awarded_capacity_owner_id set"
      - "increments Load.version by 1"
      - "owning Agent.awarded_load_count and settlement_hold recomputed"

  - method: POST
    path: "/network/load-offers/{id}/decline"
    description: "Decline a board offer, re-deriving the board ranks."
    roles: [CapacityOwnerOperator]
    code: 200
    input: [declined_at]
    output: LoadOffer
    side_effects:
      - "status → DECLINED"
      - "selected_rank re-derived for every remaining OPEN offer on the load"
      - "increments Load.version by 1"

  - method: POST
    path: "/network/load-offers/{id}/withdraw"
    description: "Withdraw a board offer from the load's board on behalf of the promoting agent."
    roles: [FreightAgent]
    code: 200
    input: [reason_code]
    output: LoadOffer
    side_effects:
      - "status → WITHDRAWN"
      - "selected_rank re-derived for every remaining OPEN offer on the load"
      - "increments Load.version by 1"

  # --- Trip ---
  - method: POST
    path: "/network/trips"
    description: "Cover an awarded load with a unit from the awarded BCO's fleet."
    roles: [CapacityOwnerOperator]
    code: 201
    input: [load_id, capacity_owner_id, equipment_id, departed_at, deadline_at]
    output: Trip
    side_effects:
      - "Trip.status = DISPATCH_PENDING"
      - "Load.status → COVERED"
      - "increments Load.version by 1"

  - method: GET
    path: "/network/trips"
    description: "List trips, optionally filtered by load, BCO, equipment or status."
    roles: [CapacityOwnerOperator, SettlementOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["load_id?", "capacity_owner_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/network/loads/{id}/trips"
    description: "List the trips covering one load, including aborted attempts, ordered by created_at ASC."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/network/capacity-owners/{id}/trips"
    description: "List one BCO's trips ordered by departed_at ASC, tie-broken by created_at ASC."
    roles: [CapacityOwnerOperator, SettlementOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["status?", "from_departed_at?", "to_departed_at?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/network/equipment/{id}/trips"
    description: "List the trips run on one unit in departed_at ascending order."
    roles: [CapacityOwnerOperator, SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/network/trips/{id}"
    description: "Get one trip with its derived on-time flag and maintenance reserve."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: POST
    path: "/network/trips/{id}/dispatch"
    description: "Dispatch a pending trip. Re-checks the BCO posture and the unit's inspection currency at the moment of dispatch."
    roles: [CapacityOwnerOperator]
    code: 200
    input: [dispatched_at]
    output: Trip
    side_effects:
      - "Trip.status → EN_ROUTE; Load.status → IN_TRANSIT"
      - "increments Trip.version by 1 and Load.version by 1"

  - method: POST
    path: "/network/trips/{id}/complete"
    description: "Mark a trip delivered with its proof of delivery. Records the on-time determination and the maintenance reserve."
    roles: [CapacityOwnerOperator]
    code: 200
    input: [actual_miles, proof_of_delivery_code]
    output: Trip
    side_effects:
      - "delivered_at = logical clock; on_time = (delivered_at <= deadline_at)"
      - "maintenance_reserve_cents = ceil(actual_miles / 1000) * 1200"
      - "Trip.status → DELIVERED; Load.status → DELIVERED"
      - "increments Trip.version by 1 and Load.version by 1"

  - method: POST
    path: "/network/trips/{id}/verify-pod"
    description: "Verify the proof of delivery, completing the trip so a FINAL settlement becomes admissible."
    roles: [SettlementOperator]
    code: 200
    input: [pod_verified]
    output: Trip
    side_effects:
      - "Trip.status → COMPLETED"
      - "increments Trip.version by 1"

  - method: POST
    path: "/network/trips/{id}/abort"
    description: "Abort a non-terminal trip. Penalizes the BCO's safety score and returns the load to the board."
    roles: [CapacityOwnerOperator]
    code: 200
    input: [reason_code]
    output: Trip
    side_effects:
      - "Trip.status → ABORTED"
      - "increments Trip.version by 1"
      - "CapacityOwner.safety_score -= 15 and qualification_posture recomputed"
      - "Load.status → POSTED with awarded_capacity_owner_id cleared; the ACCEPTED offer → DECLINED"

  # --- Settlement ---
  - method: POST
    path: "/network/settlements"
    description: "Create a DRAFT settlement for a delivered or completed trip, computing all §1.3 derived allocation fields for the requested method."
    roles: [SettlementOperator]
    code: 201
    input: [trip_id, settlement_method]
    output: Settlement
    side_effects:
      - "status = DRAFT"
      - "all allocation fields computed under the selected variant"
      - "variant_delta_cents recomputed"

  - method: GET
    path: "/network/settlements"
    description: "List settlements, optionally filtered by trip, agent, BCO, status or method."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["trip_id?", "agent_id?", "capacity_owner_id?", "status?", "settlement_method?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/network/trips/{id}/settlements"
    description: "List the settlement revisions for one trip ordered by created_at ASC."
    roles: [FreightAgent, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/network/agents/{id}/settlements"
    description: "List one agent's settlements ordered by created_at ASC."
    roles: [FreightAgent, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "settlement_method?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/network/capacity-owners/{id}/settlements"
    description: "List one BCO's settlements ordered by created_at ASC."
    roles: [CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: ["status?", "settlement_method?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/network/settlements/{id}"
    description: "Get one settlement with every derived allocation field."
    roles: [FreightAgent, CapacityOwnerOperator, SettlementOperator, NetworkAdministrator]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/network/settlements/{id}/submit"
    description: "Submit a draft settlement for approval, recomputing the split and checking the agent's hold posture against the version the operator observed."
    roles: [SettlementOperator]
    code: 200
    input: [expected_network_agent_version]
    output: Settlement
    side_effects:
      - "status → PENDING_APPROVAL"
      - "all allocation fields recomputed under the selected variant"
      - "increments Agent.version by 1"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/network/settlements/{id}/approve"
    description: "Approve a submitted settlement. The approver must be a different operator identity from the submitter."
    roles: [NetworkAdministrator]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status → APPROVED"
      - "increments Settlement.version by 1"
      - "the operator identity that submitted the settlement is recorded so the segregation-of-duties check has something to compare against"

  - method: POST
    path: "/network/settlements/{id}/reject"
    description: "Reject a submitted settlement back to DRAFT with its derived fields cleared."
    roles: [NetworkAdministrator]
    code: 200
    input: [reason_code]
    output: Settlement
    side_effects:
      - "status → DRAFT"
      - "derived allocation fields reset to null pending recomputation"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/network/settlements/{id}/settle"
    description: "Settle an approved settlement: posts the escrow, maintenance, premium and advance entries and closes the load. Guarded by the load's version."
    roles: [SettlementOperator]
    code: 200
    input: [expected_network_load_version]
    output: Settlement
    side_effects:
      - "status → SETTLED; Load.status → SETTLED"
      - "increments Load.version by 1 and Settlement.version by 1"
      - "OA_PREMIUM_DEDUCTION, INSURANCE_PREMIUM_DEDUCTION, MAINTENANCE_DEPOSIT and ESCROW_DEPOSIT EscrowTransactions posted for the BCO"
      - "an ADVANCE_REPAYMENT EscrowTransaction posted against the BCO's outstanding advance when advance_repayment_cents is non-zero"
      - "derived CapacityOwner and Agent balances and postures recomputed"

  - method: POST
    path: "/network/settlements/{id}/void"
    description: "Void a draft settlement that was never submitted."
    roles: [SettlementOperator]
    code: 200
    input: [reason_code]
    output: Settlement
    side_effects:
      - "status → VOID"
      - "increments Settlement.version by 1"

  - method: GET
    path: "/network/compliance-documents"
    description: "List safety credentials across the network, optionally narrowed to one BCO. The filtered-list form of the BCO-credential relationship; it returns an array of length 0 or more."
    roles: [SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["capacity_owner_id?", "document_type?", "status?", "limit?", "offset?"]
    output: "ComplianceDocument[]"
    side_effects: []

  - method: GET
    path: "/network/equipment"
    description: "List fleet units across the network, optionally narrowed to one BCO. The filtered-list form of the BCO-fleet relationship; it returns an array of length 0 or more."
    roles: [SafetyReviewer, NetworkAdministrator]
    code: 200
    input: ["capacity_owner_id?", "status?", "inspection_status?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every expiry, exclusivity and inspection rule. Before any call to this endpoint the clock reads the fixed default 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [NetworkAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "logical clock set to current_utc"
      - "every clock-derived field (ComplianceDocument.status, CustomerAccount.exclusivity_status, Equipment.inspection_status, LoadOffer expiry, Agent.settlement_hold) is re-evaluated on the next read"

  - method: POST
    path: "/_events/run_advance_post"
    description: "Post a driver advance against a BCO's escrow account through the normal business path, folding the resulting escrow debit and advance balance into one call. The response reports the advance transaction id, the escrow balance after the posting and the BCO's resulting outstanding advance."
    roles: [SettlementOperator, NetworkAdministrator]
    code: 200
    input: [capacity_owner_id, amount_cents, effective_at]
    output: { advance_transaction_id: string, escrow_balance_cents: integer, outstanding_advance_cents: integer }
    side_effects:
      - "an ADVANCE EscrowTransaction row is created with status POSTED"
      - "derived CapacityOwner.escrow_balance_cents and CapacityOwner.outstanding_advance_cents recomputed"
      - "CapacityOwner.qualification_posture recomputed when the escrow floor is crossed"

  - method: POST
    path: "/_events/run_period_close"
    description: "Run the settlement period close for one agent and calendar month: evaluates the per-load settlement fee schedule and returns the period row without persisting a charge."
    roles: [NetworkAdministrator]
    code: 200
    input: [agent_id, period_month]
    output: "{ period_month: string, eligible_load_count: integer, paid_load_count: integer, per_load_fee_cents: integer, period_fee_cents: integer, effective_per_load_fee_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role header is missing, or carries a role not declared in §1.7"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The caller's role is not listed on the endpoint's roles in §1.5"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller is authenticated but does not own the resource it is acting on (agent_id or capacity_owner_id mismatch)"
  - id: ERR_OFFER_NOT_DIRECTED_TO_CAPACITY_OWNER
    http: 403
    condition: "The acting BCO is not the capacity_owner_id the board offer was directed to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The approving operator identity equals the identity that submitted the settlement"

  # --- Resource Not Found ---
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "No Agent with the supplied id"
  - id: ERR_CAPACITY_OWNER_NOT_FOUND
    http: 404
    condition: "No CapacityOwner with the supplied id"
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "No Load with the supplied id"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "No LoadOffer with the supplied id"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "No Equipment with the supplied id"
  - id: ERR_TRIP_NOT_FOUND
    http: 404
    condition: "No Trip with the supplied id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "No Settlement with the supplied id"
  - id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No CustomerAccount with the supplied id"
  - id: ERR_COMPLIANCE_DOCUMENT_NOT_FOUND
    http: 404
    condition: "No ComplianceDocument with the supplied id"
  - id: ERR_ESCROW_TRANSACTION_NOT_FOUND
    http: 404
    condition: "No EscrowTransaction with the supplied id"

  # --- Request shape ---

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is absent, a field fails its declared type or range constraint, or a body field is not declared in the endpoint's input list"
  - id: ERR_INVALID_TRIP_WINDOW
    http: 400
    condition: "Trip.deadline_at is at or before Trip.departed_at"
  - id: ERR_EQUIPMENT_TYPE_MISMATCH
    http: 400
    condition: "The equipment_type supplied cannot haul the load (only TRACTOR and STRAIGHT_TRUCK are power units)"
  - id: ERR_EQUIPMENT_FLEET_EMPTY
    http: 400
    condition: "The award target BCO owns no Equipment row at all, so the award cannot be covered"
  - id: ERR_OFFER_EXCEEDS_PAY_CEILING
    http: 400
    condition: "LoadOffer.offered_pay_cents exceeds the derived owner_pay_ceiling_cents"
  - id: ERR_TRIP_OWNER_MISMATCH
    http: 400
    condition: "Trip.capacity_owner_id does not equal Load.awarded_capacity_owner_id"
  - id: ERR_AGENT_TERRITORY_EMPTY
    http: 400
    condition: "Agent.territory_codes is empty, so the agent can hold no state and cannot be activated"
  - id: ERR_EQUIPMENT_INSPECTION_FAILED
    http: 400
    condition: "An inspection is recorded with result != PASS, so the unit cannot return to IN_SERVICE"

  # --- Uniqueness ---
  - id: ERR_DUPLICATE_AGENT_CODE
    http: 409
    condition: "Agent.agent_code already exists in the network"
  - id: ERR_DUPLICATE_OWNER_CODE
    http: 409
    condition: "CapacityOwner.owner_code already exists in the network"
  - id: ERR_DUPLICATE_CUSTOMER_REF
    http: 409
    condition: "CustomerAccount.customer_ref already exists for the same agent_id"
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "Equipment.unit_number already exists for the same capacity_owner_id"

  # --- Agent lifecycle & territory ---
  - id: ERR_AGENT_NOT_ENROLLABLE
    http: 409
    condition: "Agent.status is not PENDING_ENROLLMENT, so activation is not admissible"
  - id: ERR_AGENT_NOT_ACTIVE
    http: 409
    condition: "The operation requires the agent to be ACTIVE"
  - id: ERR_AGENT_NOT_SUSPENDED
    http: 409
    condition: "The operation requires the agent to be SUSPENDED"
  - id: ERR_AGENT_ALREADY_TERMINATED
    http: 409
    condition: "Agent.status is already TERMINATED"
  - id: ERR_TERRITORY_CONFLICT
    http: 422
    condition: "A state code in this agent's territory_codes is already held by another agent whose status IN {ACTIVE, SUSPENDED}"
  - id: ERR_TERRITORY_VIOLATION
    http: 422
    condition: "Load.origin_state is not a member of the promoting agent's territory_codes"
  - id: ERR_AGENT_SETTLEMENT_HELD
    http: 422
    condition: "Agent.settlement_hold is true, so the agent may not promote loads or have settlements paid"
  - id: ERR_AGENT_SETTLEMENTS_OUTSTANDING
    http: 422
    condition: "The agent still has a Settlement in PENDING_APPROVAL or APPROVED, so termination is refused"

  # --- Customer ownership & non-solicitation ---
  - id: ERR_CUSTOMER_NON_SOLICITATION_ACTIVE
    http: 422
    condition: "The customer account is inside another arrangement's live non-solicitation window, so this agent may not promote or haul against it"
  - id: ERR_NON_SOLICITATION_BREACH
    http: 422
    condition: "A CustomerAccount with exclusivity_status RELEASED that is still inside NON_SOLICITATION_RADIUS_DAYS is matched by a Load of another agent whose status is POSTED"

  # --- Capacity-owner qualification ---
  - id: ERR_CAPACITY_OWNER_NOT_QUALIFIABLE
    http: 409
    condition: "CapacityOwner.status is not PENDING_QUALIFICATION, so qualify is not admissible"
  - id: ERR_CAPACITY_OWNER_NOT_QUALIFIED
    http: 409
    condition: "The operation requires CapacityOwner.status == QUALIFIED"
  - id: ERR_CAPACITY_OWNER_NOT_OUT_OF_SERVICE
    http: 409
    condition: "The operation requires CapacityOwner.status == OUT_OF_SERVICE"
  - id: ERR_CAPACITY_OWNER_ALREADY_DECERTIFIED
    http: 409
    condition: "CapacityOwner.status is already DECERTIFIED"
  - id: ERR_CAPACITY_OWNER_NOT_QUALIFIED_CLEAR
    http: 422
    condition: "CapacityOwner.qualification_posture is not QUALIFIED_CLEAR, so the load or trip may not proceed"
  - id: ERR_CAPACITY_OWNER_QUALIFICATION_FROZEN
    http: 422
    condition: "CapacityOwner.qualification_posture is QUALIFICATION_FROZEN, so no settlement may be submitted against this BCO"
  - id: ERR_CAPACITY_OWNER_BUSY
    http: 409
    condition: "The BCO already holds a Load in AWARDED, COVERED or IN_TRANSIT, so a second award would double-book the truck"
  - id: ERR_OFFER_TIME_OVERLAP
    http: 409
    condition: "The offer's haul window [trip.departed_at, trip.deadline_at) overlaps a window in which the BCO is already committed, so the BCO's single-truck slot is not free"
  - id: ERR_EQUIPMENT_TURNAROUND_OVERLAP
    http: 409
    condition: "The new trip departs before the unit's previous trip has been delivered plus the mandatory turnaround buffer, so the unit's interval is not free"
  - id: ERR_SAFETY_DOCUMENT_MISSING
    http: 422
    condition: "At least one of the six required document_type values has no ComplianceDocument that is non-REJECTED and unexpired at the logical clock"
  - id: ERR_SAFETY_SCORE_BELOW_MINIMUM
    http: 422
    condition: "CapacityOwner.safety_score is below SAFETY_MIN_SCORE (70)"

  # --- Equipment & inspection ---
  - id: ERR_EQUIPMENT_NOT_IN_SERVICE
    http: 409
    condition: "The operation requires Equipment.status == IN_SERVICE"
  - id: ERR_EQUIPMENT_ALREADY_RETIRED
    http: 409
    condition: "Equipment.status is already RETIRED"
  - id: ERR_EQUIPMENT_HAS_ACTIVE_TRIP
    http: 409
    condition: "A Trip on this unit is still DISPATCH_PENDING or EN_ROUTE, so the unit may not be retired"
  - id: ERR_EQUIPMENT_NOT_QUALIFIED
    http: 422
    condition: "The BCO owns no Equipment eligible to haul, so qualification is refused"
  - id: ERR_EQUIPMENT_INSPECTION_OVERDUE
    http: 409
    condition: "inspected_at is at or after Equipment.inspection_due_at, or the unit's derived inspection_status is OVERDUE"
  - id: ERR_EQUIPMENT_INSPECTION_NOT_CURRENT
    http: 409
    condition: "Equipment.inspection_status is not CURRENT, so the unit may not cover or dispatch a load"

  # --- Load lifecycle ---
  - id: ERR_LOAD_NOT_OPEN_FOR_AWARD
    http: 409
    condition: "Load.status is not POSTED, or Load.board_required is false"
  - id: ERR_LOAD_NOT_AWARDED
    http: 409
    condition: "Covering a load requires Load.status == AWARDED"
  - id: ERR_LOAD_NOT_COVERED
    http: 409
    condition: "Dispatching requires Load.status == COVERED"
  - id: ERR_LOAD_NOT_IN_TRANSIT
    http: 409
    condition: "Completing a trip requires Load.status == IN_TRANSIT"
  - id: ERR_LOAD_NOT_CANCELLABLE
    http: 409
    condition: "Cancelling requires Load.status == POSTED"
  - id: ERR_LOAD_NOT_SETTLEABLE
    http: 409
    condition: "Settling requires Load.status IN {DELIVERED, SETTLED}"

  # --- Offer lifecycle ---
  - id: ERR_OFFER_NOT_OPEN
    http: 409
    condition: "LoadOffer.status is not OPEN"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "The logical clock is at or after LoadOffer.expires_at, so the offer is no longer acceptable"
  - id: ERR_OFFER_NOT_TOP_RANKED
    http: 409
    condition: "The offer is not the top-ranked OPEN offer on its load under the board selector policy"

  # --- Trip lifecycle ---
  - id: ERR_TRIP_NOT_DISPATCH_PENDING
    http: 409
    condition: "Dispatching requires Trip.status == DISPATCH_PENDING"
  - id: ERR_TRIP_NOT_EN_ROUTE
    http: 409
    condition: "Completing requires Trip.status == EN_ROUTE"
  - id: ERR_TRIP_NOT_DELIVERED
    http: 409
    condition: "POD verification requires Trip.status == DELIVERED"
  - id: ERR_TRIP_NOT_ABORTABLE
    http: 409
    condition: "Aborting requires Trip.status IN {DISPATCH_PENDING, EN_ROUTE}"
  - id: ERR_TRIP_NOT_SETTLEABLE
    http: 409
    condition: "Submitting a settlement requires the referenced Trip.status IN {DELIVERED, COMPLETED}"
  - id: ERR_POD_MISSING
    http: 409
    condition: "A FINAL settlement or a POD verification was attempted with no verified proof_of_delivery_code on the trip"

  # --- Settlement lifecycle & money invariants ---
  - id: ERR_SETTLEMENT_NOT_DRAFT
    http: 409
    condition: "Submitting or voiding requires Settlement.status == DRAFT"
  - id: ERR_SETTLEMENT_NOT_PENDING_APPROVAL
    http: 409
    condition: "Approving or rejecting requires Settlement.status == PENDING_APPROVAL"
  - id: ERR_SETTLEMENT_NOT_APPROVED
    http: 409
    condition: "Settling requires Settlement.status == APPROVED"
  - id: ERR_SETTLEMENT_METHOD_MISMATCH
    http: 409
    condition: "The operation requires the settlement's declared settlement_method, which the row does not carry"
  - id: ERR_SETTLEMENT_ALLOCATION_IMBALANCE
    http: 402
    condition: "agent_share_cents + owner_operator_share_cents + company_share_cents does not equal linehaul + fuel_surcharge + accessorial"
  - id: ERR_OWNER_OPERATOR_PAY_NEGATIVE
    http: 402
    condition: "net_owner_operator_pay_cents would be below zero after the withholdings are applied"
  - id: ERR_SETTLEMENT_VARIANT_DIVERGENCE
    http: 402
    condition: "A FINAL settlement is approved while variant_delta_cents is non-zero, meaning the provisional and final splits have not been reconciled"

  # --- Escrow, maintenance & advances ---
  - id: ERR_ESCROW_BALANCE_INSUFFICIENT
    http: 402
    condition: "The mutation would drive CapacityOwner.escrow_balance_cents below zero, or the balance is below the floor ESCROW_MIN_CENTS where the rule requires the floor"
  - id: ERR_MAINTENANCE_BALANCE_INSUFFICIENT
    http: 402
    condition: "The mutation would drive CapacityOwner.maintenance_balance_cents below zero"
  - id: ERR_ESCROW_ALREADY_MATCHED
    http: 402
    condition: "The EscrowTransaction is already REVERSED, or the reversing entry's type is not the declared compensating type for the target's type"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the current version of the named parent entity"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FreightAgent
    description: "An independent freight agent that sources shipments: promotes loads, posts and withdraws board offers, registers customer accounts and reads its own commission reconciliation."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /network/loads — promote a load onto the agent's board"
      - "POST /network/loads/{loadId}/cancel — cancel a posted load"
      - "POST /network/load-offers/{offerId}/withdraw — withdraw a board offer"
    shared_operations:
      - "POST /network/customer-accounts — register a shipper under the agent"
      - "GET /network/load-offers/board — read a load's board"
      - "GET /network/loads, GET /network/loads/{loadId}, GET /network/agents/{agentId}/loads — read loads"
      - "GET /network/agents/{agentId}/settlement-summary — read the agent's commission reconciliation"
      - "GET /network/customer-accounts, GET /network/agents/{agentId}/customer-accounts — read customer accounts"

  - name: CapacityOwnerOperator
    description: "A business capacity owner supplying trucks under a lease agreement: accepts or declines board offers, covers and dispatches loads, records delivery, and reads its own escrow and maintenance accounts."
    identity: "entity_backed:CapacityOwner"
    exclusive_operations:
      - "POST /network/load-offers/{offerId}/accept — accept a board offer"
      - "POST /network/load-offers/{offerId}/decline — decline a board offer"
      - "POST /network/trips — cover an awarded load with a fleet unit"
      - "POST /network/trips/{tripId}/dispatch — dispatch a pending trip"
      - "POST /network/trips/{tripId}/complete — record delivery and proof of delivery"
      - "POST /network/trips/{tripId}/abort — abort a non-terminal trip"
    shared_operations:
      - "GET /network/capacity-owners/{capacityOwnerId}, GET /network/capacity-owners/{capacityOwnerId}/equipment, GET /network/capacity-owners/{capacityOwnerId}/compliance-documents, GET /network/capacity-owners/{capacityOwnerId}/escrow-transactions, GET /network/capacity-owners/{capacityOwnerId}/trips, GET /network/capacity-owners/{capacityOwnerId}/settlements — read own records"
      - "GET /network/load-offers/board — read a load's board"
      - "GET /network/equipment/{equipmentId}, GET /network/equipment/{equipmentId}/trips — read own fleet units"

  - name: SafetyReviewer
    description: "Compliance operator that qualifies business capacity owners, records equipment inspections and verifies safety credentials. Opaque operator identity, never an entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /network/capacity-owners/{capacityOwnerId}/qualify — qualify a BCO"
      - "POST /network/capacity-owners/{capacityOwnerId}/suspend — place a BCO out of service"
      - "POST /network/capacity-owners/{capacityOwnerId}/reinstate — reinstate a BCO"
      - "POST /network/capacity-owners/{capacityOwnerId}/decertify — decertify a BCO"
      - "POST /network/equipment — add a fleet unit"
      - "POST /network/equipment/{equipmentId}/record-inspection — record an inspection"
      - "POST /network/equipment/{equipmentId}/place-out-of-service — remove a unit from service"
      - "POST /network/compliance-documents — file a credential"
      - "POST /network/compliance-documents/{documentId}/verify — re-evaluate a credential"
    shared_operations:
      - "GET /network/capacity-owners — list BCOs"
      - "GET /network/equipment/{equipmentId}/trips — read a unit's trip history"

  - name: SettlementOperator
    description: "Settlement clerk that creates, submits and settles settlements, posts escrow and maintenance entries, and verifies proofs of delivery. Opaque operator identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /network/settlements — create a draft settlement"
      - "POST /network/settlements/{settlementId}/submit — submit a settlement for approval"
      - "POST /network/settlements/{settlementId}/settle — settle an approved settlement"
      - "POST /network/settlements/{settlementId}/void — void a draft settlement"
      - "POST /network/escrow-transactions — post a ledger entry"
      - "POST /network/escrow-transactions/{transactionId}/reverse — post a compensating entry"
      - "POST /network/trips/{tripId}/verify-pod — verify a proof of delivery"
      - "POST /network/agents/{agentId}/per-load-settlement-tier — evaluate the per-load fee tier"
    shared_operations:
      - "GET /network/settlements, GET /network/settlements/{settlementId}, GET /network/trips/{tripId}/settlements, GET /network/agents/{agentId}/settlements — read settlements"
      - "GET /network/escrow-transactions, GET /network/escrow-transactions/{transactionId} — read the ledger"

  - name: NetworkAdministrator
    description: "Network operator with override authority over agent enrollment and lifecycle, BCO enrollment, fleet retirement, and settlement approval. Opaque operator identity. Also the only role that may drive the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /network/agents — enroll an agent"
      - "POST /network/agents/{agentId}/activate — activate an agent"
      - "POST /network/agents/{agentId}/suspend — suspend an agent"
      - "POST /network/agents/{agentId}/reinstate — reinstate an agent"
      - "POST /network/agents/{agentId}/terminate — terminate an agent"
      - "POST /network/capacity-owners — enroll a BCO"
      - "POST /network/equipment/{equipmentId}/retire — retire a unit"
      - "POST /network/settlements/{settlementId}/approve — approve a settlement (must differ from the submitting identity)"
