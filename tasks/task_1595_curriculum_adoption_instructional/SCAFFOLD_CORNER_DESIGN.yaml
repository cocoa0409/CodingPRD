  - section: consistency_model
    instances:
      - name: mutation_visible_in_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "response_envelope"]
        distinguishing_aspect: "Immediate consistency: the create response already shows status DRAFT/version 1, and the auto-created BudgetLedger is readable in the very next request with zeros; an appropriation response itself shows the new totals."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
          trigger:
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id, cy_status: $.data.status, cy_version: $.data.version }
            - call: "GET /adoption-cycles/${cy_id}/budget-ledger"
              as: CurriculumDirector
              captures: { ap0: "$.data[0].appropriation_total", av0: "$.data[0].available_balance" }
            - call: "POST /adoption-cycles/${cy_id}/budget-appropriation"
              payload: { amount: 5000 }
              as: DistrictAdmin
              captures: { ap1: $.data.appropriation_total, av1: $.data.available_balance }
          assert:
            - "create response: status == DRAFT, version == 1"
            - "ledger readable immediately: appropriation_total == 0, available_balance == 0"
            - "appropriation response: appropriation_total == 5000.00, available_balance == 5000.00 in the same request"

  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role (or with an undeclared role) fail at priority 1 with 400 — before authorization, existence, or state checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /frameworks"
              as: Anonymous
              captures: { e1: $.data.error_id }
            - call: "POST /frameworks"
              payload: { code: "FW-1", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: Anonymous
              captures: { e2: $.data.error_id }
          assert:
            - "both calls return error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"
