              payload: { raw_score: 69, scenario_family: "RETAIL" }
              as: QaValidator
              captures: { outcome: $.data.outcome }
            - call: "GET /shoppers/${shopper_id}"
              payload: {}
              as: QaValidator
              captures: { cscore1: $.data.certification_score, status1: $.data.status }
          assert:
            - "Shopper.${shopper_id}.certification_score == 0 at registration (empty attempt set)"
            - "CertificationAttempt.outcome == FAILED for raw_score 69 (< 70 threshold)"
            - "Shopper.${shopper_id}.certification_score == 0 and status == REGISTERED after the FAILED attempt"

