# ============================================================================
# SCAFFOLD — Employee Perks & Discount Marketplace
# §1.0 response envelope, §1.1 entities, §1.2 state machines, §1.2.1 concurrency,
# §1.3 calculations, §1.4 validations, §1.5 endpoints, §1.6 errors, §1.7 RBAC
# ============================================================================

scenario: "Employee Perks & Discount Marketplace (employee perks program provider): merchant partner recruitment with offer negotiation and category coverage planning, employer client onboarding with eligibility file integration and branded storefront setup, offer eligibility, redemption verification and fraud prevention on employment status, commission and placement fee economics with revenue share back to employers where applicable, employee privacy protections limiting employer visibility into individual redemption, offer expiration, inventory limits and regional availability management, program engagement analytics and category demand feedback to partners, dispute handling for merchant fulfillment failures"

domain_name: employee-perks-discount-marketplace
api_prefix: /perks

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business entity is a peer collection under /perks with FK references in
  # the body; the only nested paths are (a) append-only child reads
  # (negotiation-rounds, eligibility-files) and (b) creation-in-parent-context
  # (placement-slots under an offer, disputes under a redemption).

  state_machine_shape: parallel
  state_machine_shape_notes: |
    Redemption carries two independent dimensions (verification_status ×
    fulfillment_status) and Employer carries two more (integration_status ×
    storefront_status) whose product drives the derived program_posture gate.
    PartnerAgreement is cyclic (PROVIDER_PROPOSED ⇄ MERCHANT_COUNTERED
    negotiation rounds), Dispute is cyclic (MERCHANT_RESPONDED ⇄ INFO_REQUESTED),
    Offer is cyclic (ACTIVE ⇄ PAUSED), RevenueShareStatement is cyclic
    (FINALIZED ⇄ REOPENED), EligibilityFile is branching (VALIDATED | REJECTED).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic   # LedgerEntry references either a Redemption or a PlacementSlot

  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  list_shape: |
    For response_type "array", data is the bare JSON array of objects and the four
    pagination_fields live alongside it in meta, so a list element is addressed as
    $.data[0].
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the merchant partner.
        constraints: "1..200 chars"
      - name: contact_email
        type: string
        source: input
        description: Partner-manager contact address for negotiation correspondence.
        constraints: "must contain '@'"
      - name: primary_category
        type: enum
        source: input
        description: Head-line perk category the merchant is recruited for.
        constraints: "one of {DINING, TRAVEL, WELLNESS, ELECTRONICS, CHILDCARE, EDUCATION, HOME_SERVICES}"
      - name: region_codes
        type: array
        source: input
        description: Regions the merchant can fulfil in; every Offer.region_codes value must be a member of this set.
        constraints: "non-empty; each element one of {CA, TX, NY, WA, IL}; no duplicates"
      - name: status
        type: enum
        source: system
        description: Recruitment/lifecycle state of the partner.
        default: PROSPECT
        constraints: "one of {PROSPECT, IN_NEGOTIATION, ACTIVE, SUSPENDED, TERMINATED}"
      - name: fault_event_count
        type: integer
        source: computed
        description: Count of Disputes on this merchant with status RESOLVED_MERCHANT_FAULT (all time).
        default: 0
      - name: fulfillment_failure_score
        type: integer
        source: computed
        description: Decayed fulfilment-failure score per calculations.merchant_fulfillment_failure_score; drives auto-suspension at >= 40.
        default: 0
      - name: accrued_commission_payable_cents
        type: integer
        source: computed
        description: Sum of LedgerEntry.amount_cents for this merchant_id over entry_type IN {COMMISSION_ACCRUAL, COMMISSION_REVERSAL, PLACEMENT_FEE, PLACEMENT_FEE_REFUND, DISPUTE_CREDIT_RECOVERY}.
        default: 0
      - name: active_agreement_count
        type: integer
        source: computed
        description: Count of PartnerAgreement rows with merchant_id = this id and status = ACTIVE.
        default: 0
      - name: suspended_at
        type: datetime
        source: system
        description: Logical-clock instant at which fulfillment_failure_score first reached 40; null while status != SUSPENDED.
        default: null

  - name: PartnerAgreement
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the partner this agreement is negotiated with."
      - name: category
        type: enum
        source: input
        description: Perk category this agreement covers; copied onto every Offer created under it.
        constraints: "one of {DINING, TRAVEL, WELLNESS, ELECTRONICS, CHILDCARE, EDUCATION, HOME_SERVICES}"
      - name: region_code
        type: enum
        source: input
        description: Single region this agreement (and its exclusivity, if granted) covers.
        constraints: "one of {CA, TX, NY, WA, IL}; must be a member of Merchant.region_codes"
      - name: status
        type: enum
        source: system
        description: Negotiation/lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PROVIDER_PROPOSED, MERCHANT_COUNTERED, ACCEPTED, ACTIVE, WITHDRAWN, TERMINATED}"
      - name: round_count
        type: integer
        source: computed
        description: Count of NegotiationRound rows with agreement_id = this id; capped by MAX_NEGOTIATION_ROUNDS = 4.
        default: 0
      - name: commission_rate_bps
        type: integer
        source: computed
        description: commission_rate_bps of the NegotiationRound with the highest round_number for this agreement; null until the first round exists.
        default: null
      - name: placement_fee_base_cents
        type: integer
        source: computed
        description: placement_fee_base_cents of the NegotiationRound with the highest round_number; per-day base rate used by calculations.placement_fee_pricing.
        default: null
      - name: employer_revenue_share_bps
        type: integer
        source: computed
        description: employer_revenue_share_bps of the NegotiationRound with the highest round_number.
        default: null
      - name: exclusivity_requested
        type: boolean
        source: input
        description: When true, activation runs the category/region exclusivity overlap check and grants exclusivity.
        default: false
      - name: exclusivity_window_start
        type: datetime
        source: computed
        description: exclusivity_window_start of the NegotiationRound with the highest round_number; null when not negotiated.
        default: null
      - name: exclusivity_window_end
        type: datetime
        source: computed
        description: exclusivity_window_end of the NegotiationRound with the highest round_number; window is half-open [start, end).
        default: null
      - name: exclusivity_granted
        type: boolean
        source: system
        description: Set true at activation when exclusivity_requested is true and the overlap check passes.
        default: false
      - name: accepted_by_role
        type: enum
        source: system
        description: Which side accepted the standing terms.
        default: null
        constraints: "one of {PARTNER_MANAGER, MERCHANT} or null"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the ACCEPTED -> ACTIVE transition.
        default: null
      - name: terminated_reason
        type: string
        source: system
        description: Free-text reason captured on ACTIVE -> TERMINATED or on WITHDRAWN.
        default: null

  - name: NegotiationRound
    parent: PartnerAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; the negotiation this proposal belongs to."
      - name: round_number
        type: integer
        source: computed
        description: Previous max round_number for the agreement + 1; the first round is 1.
      - name: proposer_role
        type: enum
        source: system
        description: Side that authored this round (PARTNER_MANAGER for propose, MERCHANT for counter).
        constraints: "one of {PARTNER_MANAGER, MERCHANT}"
      - name: commission_rate_bps
        type: integer
        source: input
        description: Proposed commission the provider takes on net charged amount.
        constraints: "integer 100..4000"
      - name: placement_fee_base_cents
        type: integer
        source: input
        description: Proposed per-day base placement fee for storefront slots.
        constraints: "integer 0..500000"
      - name: employer_revenue_share_bps
        type: integer
        source: input
        description: Proposed share of provider commission rebated to the employer client.
        constraints: "integer 0..5000"
      - name: exclusivity_window_start
        type: datetime
        source: input
        description: Proposed start of the category/region exclusivity window; null when no exclusivity is negotiated.
        default: null
      - name: exclusivity_window_end
        type: datetime
        source: input
        description: Proposed end of the exclusivity window, exclusive bound.
        default: null
      - name: note
        type: string
        source: input
        description: Free-text negotiation note.
        default: null

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Employer client name shown on the branded storefront.
        constraints: "1..200 chars"
      - name: region_code
        type: enum
        source: input
        description: Primary region of the employer client.
        constraints: "one of {CA, TX, NY, WA, IL}"
      - name: employee_count_declared
        type: integer
        source: input
        description: Headcount the employer declared at contracting; reporting only, never used in pricing.
        constraints: "integer 1..1000000"
      - name: revenue_share_enabled
        type: boolean
        source: input
        description: When false, employer_share_cents is forced to 0 on every redemption regardless of the agreement's employer_revenue_share_bps.
        default: false
      - name: privacy_min_cohort_size
        type: integer
        source: input
        description: k-anonymity floor for engagement analytics; category rows with distinct_redeemer_count below this value are suppressed.
        default: 8
        constraints: "integer 2..25"
      - name: integration_status
        type: enum
        source: system
        description: Eligibility-file integration dimension; evolves independently of storefront_status.
        default: NOT_CONFIGURED
        constraints: "one of {NOT_CONFIGURED, FILE_RECEIVED, VALIDATED, SYNCED, STALE}"
      - name: storefront_status
        type: enum
        source: system
        description: Branded-storefront dimension; evolves independently of integration_status.
        default: DRAFT
        constraints: "one of {DRAFT, BRANDED, PUBLISHED, SUSPENDED}"
      - name: program_posture
        type: enum
        source: computed
        description: Derived gate over the two dimensions per calculations.employer_program_posture; gates redemption creation and verification.
        default: SETUP
        constraints: "one of {SETUP, LIVE, RESTRICTED, FROZEN}"
      - name: brand_color_hex
        type: string
        source: system
        description: Storefront accent colour captured by the storefront setup call.
        default: null
      - name: logo_url
        type: string
        source: system
        description: Storefront logo captured by the storefront setup call.
        default: null
      - name: hero_headline
        type: string
        source: system
        description: Storefront headline captured by the storefront setup call.
        default: null
      - name: featured_categories
        type: array
        source: system
        description: Categories pinned on the storefront; participates in the category-coverage floor check on agreement termination.
        default: null
        constraints: "each element one of {DINING, TRAVEL, WELLNESS, ELECTRONICS, CHILDCARE, EDUCATION, HOME_SERVICES}; 0..7 elements"
      - name: eligible_headcount
        type: integer
        source: computed
        description: Per calculations.employer_eligible_headcount; drives the reach surcharge tier in calculations.placement_fee_pricing.
        default: 0
      - name: last_sync_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent EligibilityFile apply; INTEGRATION_STALE_DAYS is measured from here.
        default: null
      - name: accrued_share_cents
        type: integer
        source: computed
        description: "-1 * sum of LedgerEntry.amount_cents for this employer_id over entry_type IN {EMPLOYER_SHARE, EMPLOYER_SHARE_REVERSAL}; lifetime share accrued to the employer net of reversals, independent of whether a statement has been paid."
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Reason captured on the storefront suspend transition.
        default: null

  - name: EligibilityFile
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; owner of this eligibility batch."
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which the batch's memberships are considered current.
      - name: checksum
        type: string
        source: input
        description: Client-supplied integrity string echoed back; never used in any decision.
        constraints: "1..128 chars"
      - name: records
        type: array
        source: input
        description: "Pseudonymous employee records; each element: { external_employee_ref: string, employment_status: ACTIVE|LEAVE|TERMINATED, region_code: CA|TX|NY|WA|IL, eligibility_valid_from: ISO8601, eligibility_valid_until: ISO8601 }."
        constraints: "1..5000 elements; external_employee_ref unique within the array"
      - name: record_count
        type: integer
        source: computed
        description: Length of records.
      - name: invalid_record_count
        type: integer
        source: computed
        description: Count of records elements that are missing a key, carry an out-of-enum employment_status or region_code, or have eligibility_valid_until <= eligibility_valid_from.
        default: 0
      - name: valid_record_count
        type: integer
        source: computed
        description: record_count - invalid_record_count.
      - name: status
        type: enum
        source: system
        description: Batch lifecycle state.
        default: RECEIVED
        constraints: "one of {RECEIVED, VALIDATED, REJECTED, APPLIED}"
      - name: rejection_reason
        type: string
        source: system
        description: Set to "INVALID_RECORD_RATIO_EXCEEDED" when validation rejects the batch.
        default: null
      - name: created_membership_count
        type: integer
        source: computed
        description: Memberships created by this batch's apply; 0 until APPLIED.
        default: 0
      - name: updated_membership_count
        type: integer
        source: computed
        description: Existing memberships rewritten by this batch's apply; 0 until APPLIED.
        default: 0
      - name: suspended_membership_count
        type: integer
        source: computed
        description: Memberships of the employer set to SUSPENDED by this apply because their external_employee_ref was absent from records; 0 until APPLIED.
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant of the VALIDATED -> APPLIED transition.
        default: null

  - name: EmployeeMembership
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; taken from the EligibilityFile that created this membership."
      - name: source_file_id
        type: string
        source: system
        description: "FK -> EligibilityFile.id; the batch whose apply last wrote this row."
      - name: external_employee_ref
        type: string
        source: system
        description: Pseudonymous employee reference from the eligibility batch; unique per employer_id. Employer-visible, never exposed on merchant-facing reads.
      - name: employment_status
        type: enum
        source: system
        description: Employment dimension written by eligibility apply or by the employment-status endpoint.
        default: ACTIVE
        constraints: "one of {ACTIVE, LEAVE, TERMINATED}"
      - name: status
        type: enum
        source: computed
        description: "Eligibility dimension: REVOKED when employment_status = TERMINATED; SUSPENDED when an applied batch omitted this external_employee_ref; otherwise ELIGIBLE."
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, SUSPENDED, REVOKED}"
      - name: region_code
        type: enum
        source: system
        description: Region of record for this employee; matched against Offer.region_codes at redemption creation.
        constraints: "one of {CA, TX, NY, WA, IL}"
      - name: eligibility_valid_from
        type: datetime
        source: system
        description: Inclusive start of the employee's eligibility window.
      - name: eligibility_valid_until
        type: datetime
        source: system
        description: Exclusive end of the employee's eligibility window.
      - name: redemption_count_7d
        type: integer
        source: computed
        description: Count of Redemption rows for this membership_id with created_at in [clock_now - 7 days, clock_now) and verification_status IN {PENDING, VERIFIED}.
        default: 0
      - name: redemption_count_30d
        type: integer
        source: computed
        description: Count of Redemption rows for this membership_id with created_at in [clock_now - 30 days, clock_now) and verification_status IN {PENDING, VERIFIED, FAILED, VOID}.
        default: 0
      - name: last_employment_change_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent employment_status write.
        default: null

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; supplies category and all economics."
      - name: merchant_id
        type: string
        source: computed
        description: "FK -> Merchant.id; copied from the agreement at creation and never rewritten."
      - name: title
        type: string
        source: input
        description: Employee-facing offer title.
        constraints: "1..160 chars"
      - name: category
        type: enum
        source: computed
        description: Copied from PartnerAgreement.category at creation.
        constraints: "one of {DINING, TRAVEL, WELLNESS, ELECTRONICS, CHILDCARE, EDUCATION, HOME_SERVICES}"
      - name: discount_type
        type: enum
        source: input
        description: Shape of the employee discount.
        constraints: "one of {PERCENT, FIXED}"
      - name: discount_value_bps
        type: integer
        source: input
        description: Percentage discount in basis points; required when discount_type = PERCENT, must be omitted or null otherwise.
        default: null
        constraints: "integer 100..7000"
      - name: discount_value_cents
        type: integer
        source: input
        description: Flat discount in cents; required when discount_type = FIXED, must be omitted or null otherwise.
        default: null
        constraints: "integer 100..500000"
      - name: min_spend_cents
        type: integer
        source: input
        description: Minimum gross ticket the merchant may verify against this offer.
        default: 0
        constraints: "integer 0..1000000"
      - name: region_codes
        type: array
        source: input
        description: Regions where this offer is redeemable; must be a subset of the merchant's region_codes.
        constraints: "non-empty; each element one of {CA, TX, NY, WA, IL}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the redemption window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the redemption window; must be strictly after window_start.
      - name: inventory_limit
        type: integer
        source: input
        description: Total redeemable units; null means unlimited.
        default: null
        constraints: "integer 1..1000000 or null"
      - name: inventory_reserved
        type: integer
        source: computed
        description: Count of Redemption rows on this offer with verification_status = PENDING.
        default: 0
      - name: inventory_redeemed
        type: integer
        source: computed
        description: Count of Redemption rows on this offer with verification_status = VERIFIED.
        default: 0
      - name: per_member_limit
        type: integer
        source: input
        description: Maximum Redemption rows per membership on this offer counting only verification_status IN {PENDING, VERIFIED}.
        default: 1
        constraints: "integer 1..50"
      - name: sold_out
        type: boolean
        source: computed
        description: True when inventory_limit is not null and inventory_reserved + inventory_redeemed >= inventory_limit.
        default: false
      - name: status
        type: enum
        source: system
        description: Publication lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_REVIEW, ACTIVE, PAUSED, REJECTED, EXPIRED}"
      - name: review_note
        type: string
        source: system
        description: Reviewer note captured on the review decision.
        default: null
      - name: paused_reason
        type: string
        source: system
        description: "Reason captured on pause; set to MERCHANT_SUSPENDED when the pause is cascaded by merchant suspension."
        default: null
      - name: expired_at
        type: datetime
        source: system
        description: Logical-clock instant at which the epoch run expired this offer.
        default: null

  - name: PlacementSlot
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer being placed on a storefront."
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the storefront the slot runs on."
      - name: placement_tier
        type: enum
        source: input
        description: FEATURED slots consume the storefront category's overlapping-run capacity; STANDARD slots do not.
        constraints: "one of {STANDARD, FEATURED}"
      - name: slot_window_start
        type: datetime
        source: input
        description: Inclusive start of the placement run; slot intervals are treated as CLOSED [start, end].
      - name: slot_window_end
        type: datetime
        source: input
        description: Inclusive end of the placement run; must be strictly after slot_window_start.
      - name: slot_duration_days
        type: integer
        source: computed
        description: "max(1, ceil((slot_window_end - slot_window_start) / 86400 seconds))."
      - name: base_fee_cents
        type: integer
        source: computed
        description: Step 1 of calculations.placement_fee_pricing.
      - name: reach_surcharge_bps
        type: integer
        source: computed
        description: Reach tier selected from the employer's eligible_headcount in step 2 of calculations.placement_fee_pricing.
      - name: reach_surcharge_cents
        type: integer
        source: computed
        description: Step 2 output of calculations.placement_fee_pricing.
      - name: gross_fee_cents
        type: integer
        source: computed
        description: Step 3 output (base + surcharge) of calculations.placement_fee_pricing.
      - name: volume_discount_bps
        type: integer
        source: computed
        description: Volume tier selected from gross_fee_cents in step 4 of calculations.placement_fee_pricing.
      - name: volume_discount_cents
        type: integer
        source: computed
        description: Step 4 output of calculations.placement_fee_pricing.
      - name: placement_fee_cents
        type: integer
        source: computed
        description: Step 5 output (gross - discount); billed to the merchant as a PLACEMENT_FEE ledger entry on confirmation.
      - name: status
        type: enum
        source: system
        description: Slot lifecycle state.
        default: RESERVED
        constraints: "one of {RESERVED, CONFIRMED, RELEASED, COMPLETED}"
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the RESERVED -> CONFIRMED transition.
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into RELEASED.
        default: null
      - name: release_reason
        type: string
        source: system
        description: "Reason captured on release; set to OFFER_PAUSED when cascaded by merchant suspension."
        default: null

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer being redeemed."
      - name: membership_id
        type: string
        source: input
        description: "FK -> EmployeeMembership.id; the redeeming employee, who must be the acting Employee."
      - name: employer_id
        type: string
        source: computed
        description: "FK -> Employer.id; copied from the membership at creation."
      - name: merchant_id
        type: string
        source: computed
        description: "FK -> Merchant.id; copied from the offer at creation."
      - name: statement_id
        type: string
        source: system
        description: "FK -> RevenueShareStatement.id; stamped when a statement covering this redemption is finalized."
        default: null
      - name: intended_gross_amount_cents
        type: integer
        source: input
        description: Ticket amount the employee expects to spend; scores the SCREENING risk variant.
        constraints: "integer 100..5000000"
      - name: gross_amount_cents
        type: integer
        source: system
        description: Actual ticket amount supplied by the merchant at verification; scores the AUDIT risk variant and all economics.
        default: null
      - name: discount_amount_cents
        type: integer
        source: computed
        description: Step 1 of calculations.redemption_line_economics; null until verified.
        default: null
      - name: net_charged_cents
        type: integer
        source: computed
        description: Step 2 of calculations.redemption_line_economics; null until verified.
        default: null
      - name: commission_amount_cents
        type: integer
        source: computed
        description: Step 3 of calculations.redemption_line_economics; null until verified.
        default: null
      - name: employer_share_cents
        type: integer
        source: computed
        description: Step 4 of calculations.redemption_line_economics; null until verified.
        default: null
      - name: provider_net_cents
        type: integer
        source: computed
        description: Step 5 of calculations.redemption_line_economics; null until verified.
        default: null
      - name: verification_token
        type: string
        source: system
        description: Opaque single-use token minted at creation and returned in the creation response; the merchant must echo it to verify.
      - name: verification_expires_at
        type: datetime
        source: computed
        description: created_at + VERIFICATION_TTL_HOURS (72); verification is refused at or after this instant.
      - name: verification_status
        type: enum
        source: system
        description: First independent dimension.
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, FAILED, VOID}"
      - name: fulfillment_status
        type: enum
        source: system
        description: Second independent dimension; advances only while verification_status = VERIFIED.
        default: AWAITING
        constraints: "one of {AWAITING, FULFILLED, DISPUTED, REFUNDED}"
      - name: screening_risk_score
        type: integer
        source: computed
        description: SCREENING variant of calculations.fraud_risk_score, frozen at creation; gates nothing.
        default: null
      - name: audit_risk_score
        type: integer
        source: computed
        description: AUDIT variant of calculations.fraud_risk_score, recomputed at verification and at dispute resolution; blocks verification at >= 70.
        default: null
      - name: risk_block_reason
        type: string
        source: system
        description: "Set to FRAUD_RISK_THRESHOLD when verification is refused for audit_risk_score >= 70."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the PENDING -> VERIFIED transition; the accrual date for ACCRUAL-basis statements.
        default: null
      - name: fulfilled_at
        type: datetime
        source: system
        description: Logical-clock instant of the AWAITING -> FULFILLED transition; the settlement date for CASH-basis statements.
        default: null
      - name: refunded_at
        type: datetime
        source: system
        description: Logical-clock instant of the DISPUTED -> REFUNDED transition.
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into VOID.
        default: null
      - name: void_reason
        type: string
        source: system
        description: "One of MEMBER_CANCELLED, PROGRAM_FROZEN, MEMBERSHIP_INELIGIBLE, VERIFICATION_TTL_EXPIRED."
        default: null

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: redemption_id
        type: string
        source: input
        description: "FK -> Redemption.id; the redemption whose fulfilment failed."
      - name: raised_by_membership_id
        type: string
        source: computed
        description: "FK -> EmployeeMembership.id; copied from the redemption."
      - name: merchant_id
        type: string
        source: computed
        description: "FK -> Merchant.id; copied from the redemption."
      - name: reason
        type: enum
        source: input
        description: Employee-declared failure category.
        constraints: "one of {NOT_HONORED, WRONG_DISCOUNT, OFFER_EXPIRED, OUT_OF_STOCK, OTHER}"
      - name: description
        type: string
        source: input
        description: Employee narrative; never exposed to the employer.
        constraints: "1..1000 chars"
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle state.
        default: OPEN
        constraints: "one of {OPEN, MERCHANT_RESPONDED, INFO_REQUESTED, RESOLVED_MERCHANT_FAULT, RESOLVED_NO_FAULT}"
      - name: response_note
        type: string
        source: system
        description: Latest merchant response text.
        default: null
      - name: remedy_offered_cents
        type: integer
        source: system
        description: Remedy the merchant proposed in its latest response.
        default: null
      - name: info_request_count
        type: integer
        source: computed
        description: Number of times the platform has pushed the dispute back to INFO_REQUESTED.
        default: 0
      - name: response_deadline_at
        type: datetime
        source: computed
        description: Instant of entry into OPEN or INFO_REQUESTED + DISPUTE_RESPONSE_HOURS (120); the epoch run default-judges at or after this instant.
      - name: outcome_credit_cents
        type: integer
        source: system
        description: Goodwill credit granted to the employee on a merchant-fault resolution.
        default: null
      - name: default_judged
        type: boolean
        source: system
        description: True when the resolution was produced by the epoch run rather than by a platform decision.
        default: false
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of entry into a resolved state.
        default: null

  - name: RevenueShareStatement
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer the revenue share is owed to."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the statement period.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the statement period; must be strictly after period_start.
      - name: basis
        type: enum
        source: input
        description: Selects the inclusion-set variant of calculations.revenue_share_statement_totals.
        constraints: "one of {ACCRUAL, CASH}"
      - name: included_redemption_count
        type: integer
        source: computed
        description: Number of redemptions in the selected inclusion set.
        default: 0
      - name: gross_commission_cents
        type: integer
        source: computed
        description: Sum of the included redemptions' commission_amount_cents.
        default: 0
      - name: employer_share_cents
        type: integer
        source: computed
        description: Sum of the included redemptions' already-rounded employer_share_cents (per-redemption rounding, then sum).
        default: 0
      - name: provider_retained_cents
        type: integer
        source: computed
        description: gross_commission_cents - employer_share_cents.
        default: 0
      - name: reversal_adjustment_cents
        type: integer
        source: computed
        description: Sum of EMPLOYER_SHARE_REVERSAL LedgerEntry.amount_cents attached to this statement_id; non-zero only after a reopen.
        default: 0
      - name: status
        type: enum
        source: system
        description: Statement lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, REOPENED, PAID}"
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest transition into FINALIZED.
        default: null
      - name: reopened_at
        type: datetime
        source: system
        description: Logical-clock instant of the FINALIZED -> REOPENED transition.
        default: null
      - name: reopen_reason
        type: string
        source: system
        description: "Set to DISPUTE_REVERSAL when a merchant-fault resolution reverses an included redemption."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of the FINALIZED -> PAID transition.
        default: null
      - name: payment_reference
        type: string
        source: system
        description: Remittance reference captured at payment.
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: redemption_id
        type: string
        source: system
        description: "FK -> Redemption.id; null on placement-fee entries."
        default: null
      - name: placement_slot_id
        type: string
        source: system
        description: "FK -> PlacementSlot.id; null on redemption-economics entries."
        default: null
      - name: statement_id
        type: string
        source: system
        description: "FK -> RevenueShareStatement.id; stamped when a statement finalization or reopen claims the entry."
        default: null
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; null on placement-fee entries that carry no storefront revenue share."
        default: null
      - name: merchant_id
        type: string
        source: system
        description: "FK -> Merchant.id; always set."
      - name: entry_type
        type: enum
        source: system
        description: Ledger line type; signs are stated from the provider's perspective.
        constraints: "one of {COMMISSION_ACCRUAL, EMPLOYER_SHARE, COMMISSION_REVERSAL, EMPLOYER_SHARE_REVERSAL, PLACEMENT_FEE, PLACEMENT_FEE_REFUND, DISPUTE_CREDIT, DISPUTE_CREDIT_RECOVERY}"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount; positive is provider inflow, negative is provider outflow.
      - name: memo
        type: string
        source: system
        description: Human-readable provenance string.

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: PartnerAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, TERMINATED]
    transitions:
      - from: DRAFT
        to: PROVIDER_PROPOSED
        trigger: "POST /perks/agreements/{id}/propose"
        actor: PartnerManager
        preconditions:
          - "agreement.status = DRAFT"
          - "expected_agreement_version = agreement.version"
          - "agreement.round_count < 4 (MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "creates NegotiationRound with round_number = agreement.round_count + 1 and proposer_role = PARTNER_MANAGER"
          - "recomputes agreement.round_count, commission_rate_bps, placement_fee_base_cents, employer_revenue_share_bps, exclusivity_window_start, exclusivity_window_end from the highest round_number"
          - "sets Merchant.status PROSPECT -> IN_NEGOTIATION (no-op when already IN_NEGOTIATION)"
          - "increments PartnerAgreement.version by 1"
      - from: MERCHANT_COUNTERED
        to: PROVIDER_PROPOSED
        trigger: "POST /perks/agreements/{id}/propose"
        actor: PartnerManager
        preconditions:
          - "agreement.status = MERCHANT_COUNTERED"
          - "expected_agreement_version = agreement.version"
          - "agreement.round_count < 4 (MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "creates the next NegotiationRound with proposer_role = PARTNER_MANAGER"
          - "recomputes the agreement's standing terms from the highest round_number"
          - "increments PartnerAgreement.version by 1"
        note: "Cycle leg: PROVIDER_PROPOSED -> MERCHANT_COUNTERED -> PROVIDER_PROPOSED. The 5th round attempt is refused with ERR_NEGOTIATION_ROUND_LIMIT."
      - from: PROVIDER_PROPOSED
        to: MERCHANT_COUNTERED
        trigger: "POST /perks/agreements/{id}/counter"
        actor: Merchant
        preconditions:
          - "agreement.status = PROVIDER_PROPOSED"
          - "agreement.merchant_id = X-User-ID"
          - "expected_agreement_version = agreement.version"
          - "agreement.round_count < 4 (MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "creates the next NegotiationRound with proposer_role = MERCHANT"
          - "recomputes the agreement's standing terms from the highest round_number"
          - "increments PartnerAgreement.version by 1"
      - from: PROVIDER_PROPOSED
        to: ACCEPTED
        trigger: "POST /perks/agreements/{id}/decide with decision = ACCEPT"
        actor: Merchant
        preconditions:
          - "agreement.status = PROVIDER_PROPOSED"
          - "agreement.merchant_id = X-User-ID"
          - "agreement.round_count >= 1"
        side_effects:
          - "sets accepted_by_role = MERCHANT"
          - "increments PartnerAgreement.version by 1"
      - from: MERCHANT_COUNTERED
        to: ACCEPTED
        trigger: "POST /perks/agreements/{id}/decide with decision = ACCEPT"
        actor: PartnerManager
        preconditions:
          - "agreement.status = MERCHANT_COUNTERED"
        side_effects:
          - "sets accepted_by_role = PARTNER_MANAGER"
          - "increments PartnerAgreement.version by 1"
        note: "Branch: the side that did not author the standing round is the only side allowed to accept it."
      - from: PROVIDER_PROPOSED
        to: WITHDRAWN
        trigger: "POST /perks/agreements/{id}/decide with decision = WITHDRAW"
        actor: PartnerManager
        preconditions:
          - "agreement.status IN {DRAFT, PROVIDER_PROPOSED, MERCHANT_COUNTERED}"
        side_effects:
          - "sets terminated_reason = 'WITHDRAWN_IN_NEGOTIATION'"
          - "sets Merchant.status IN_NEGOTIATION -> PROSPECT when the merchant has no other agreement in {PROVIDER_PROPOSED, MERCHANT_COUNTERED, ACCEPTED, ACTIVE}"
          - "increments PartnerAgreement.version by 1"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /perks/agreements/{id}/activate"
        actor: PartnerManager
        preconditions:
          - "agreement.status = ACCEPTED"
          - "Merchant.status IN {PROSPECT, IN_NEGOTIATION, ACTIVE}"
          - "when exclusivity_requested = true: no ACTIVE agreement with exclusivity_granted = true, the same category and region_code, and a half-open [exclusivity_window_start, exclusivity_window_end) window overlapping this agreement's window"
        side_effects:
          - "sets activated_at = clock_now"
          - "sets exclusivity_granted = true when exclusivity_requested = true"
          - "sets Merchant.status -> ACTIVE and recomputes Merchant.active_agreement_count"
          - "increments PartnerAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /perks/agreements/{id}/terminate"
        actor: PartnerManager | PlatformAdmin
        preconditions:
          - "agreement.status = ACTIVE"
          - "NOT (the count of remaining ACTIVE agreements for this (category, region_code) would be 0 AND some Employer has program_posture = LIVE, region_code = agreement.region_code and agreement.category in featured_categories)"
        side_effects:
          - "sets terminated_reason from the request"
          - "sets exclusivity_granted = false"
          - "cascades every Offer of this agreement with status IN {DRAFT, PENDING_REVIEW, ACTIVE, PAUSED} to EXPIRED with expired_at = clock_now"
          - "each Offer that leaves ACTIVE or PAUSED releases its PlacementSlots with status IN {RESERVED, CONFIRMED} to RELEASED with release_reason = 'AGREEMENT_TERMINATED'"
          - "recomputes Merchant.active_agreement_count; the Merchant's own status is left untouched, so losing every agreement does not terminate the partner"
          - "increments PartnerAgreement.version by 1"

  - entity: Employer
    dimension: integration_status
    initial_state: NOT_CONFIGURED
    terminal_states: []
    transitions:
      - from: NOT_CONFIGURED
        to: FILE_RECEIVED
        trigger: "POST /perks/employers/{id}/eligibility-files"
        actor: EmployerAdmin
        preconditions:
          - "expected_employer_version = employer.version"
          - "employer.integration_status IN {NOT_CONFIGURED, FILE_RECEIVED, VALIDATED, SYNCED, STALE}"
        side_effects:
          - "creates EligibilityFile in RECEIVED with computed record_count, invalid_record_count, valid_record_count"
          - "recomputes Employer.program_posture"
          - "increments Employer.version by 1"
        note: "Same transition text applies from FILE_RECEIVED, VALIDATED, SYNCED and STALE — a new batch always pulls the integration dimension back to FILE_RECEIVED."
      - from: FILE_RECEIVED
        to: VALIDATED
        trigger: "POST /perks/eligibility-files/{id}/validate (batch accepted)"
        actor: EmployerAdmin | PlatformAdmin
        preconditions:
          - "file.status = RECEIVED"
          - "invalid_record_count * 10000 / record_count <= 500 (FILE_REJECT_THRESHOLD_BPS)"
        side_effects:
          - "sets EligibilityFile.status = VALIDATED"
          - "recomputes Employer.program_posture"
          - "increments Employer.version by 1"
      - from: FILE_RECEIVED
        to: FILE_RECEIVED
        trigger: "POST /perks/eligibility-files/{id}/validate (batch rejected)"
        actor: EmployerAdmin | PlatformAdmin
        preconditions:
          - "file.status = RECEIVED"
          - "invalid_record_count * 10000 / record_count > 500 (FILE_REJECT_THRESHOLD_BPS)"
        side_effects:
          - "sets EligibilityFile.status = REJECTED and rejection_reason = 'INVALID_RECORD_RATIO_EXCEEDED'"
          - "leaves Employer.integration_status at FILE_RECEIVED"
      - from: VALIDATED
        to: SYNCED
        trigger: "POST /perks/eligibility-files/{id}/apply"
        actor: EmployerAdmin
        preconditions:
          - "file.status = VALIDATED"
          - "file.employer_id = X-User-ID"
        side_effects:
          - "applies each valid record in records array order, creating or rewriting EmployeeMembership rows (see the EmployeeMembership machine)"
          - "sets memberships of this employer whose external_employee_ref is absent from records and whose status = ELIGIBLE to SUSPENDED"
          - "sets EligibilityFile.status = APPLIED, applied_at, created_membership_count, updated_membership_count, suspended_membership_count"
          - "sets Employer.last_sync_at = clock_now and recomputes eligible_headcount and program_posture"
          - "increments Employer.version by 1"
      - from: SYNCED
        to: STALE
        trigger: "system: POST /_ops/run-epoch when last_sync_at + 45 days (INTEGRATION_STALE_DAYS) <= clock_now"
        actor: system
        preconditions:
          - "employer.integration_status = SYNCED"
        side_effects:
          - "recomputes Employer.program_posture (PUBLISHED storefront therefore becomes RESTRICTED)"
          - "increments Employer.version by 1"

  - entity: Employer
    dimension: storefront_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: BRANDED
        trigger: "POST /perks/employers/{id}/storefront"
        actor: EmployerAdmin
        preconditions:
          - "employer.storefront_status IN {DRAFT, BRANDED}"
        side_effects:
          - "stores brand_color_hex, logo_url, hero_headline, featured_categories"
          - "recomputes Employer.program_posture"
          - "increments Employer.version by 1"
      - from: BRANDED
        to: PUBLISHED
        trigger: "POST /perks/employers/{id}/storefront/publish"
        actor: EmployerAdmin
        preconditions:
          - "employer.storefront_status = BRANDED"
        side_effects:
          - "recomputes Employer.program_posture (LIVE when integration_status = SYNCED, RESTRICTED when STALE, otherwise SETUP)"
          - "increments Employer.version by 1"
        note: "Deliberately independent of integration_status: publishing a storefront before the first eligibility sync leaves program_posture at SETUP."
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /perks/employers/{id}/storefront/suspend"
        actor: PlatformAdmin
        preconditions:
          - "employer.storefront_status = PUBLISHED"
        side_effects:
          - "stores suspension_reason"
          - "recomputes Employer.program_posture -> FROZEN"
          - "because the posture is FROZEN, every Redemption of this employer with verification_status = PENDING moves to VOID with void_reason = 'PROGRAM_FROZEN' and voided_at = clock_now"
          - "each voided redemption drops out of its offer's inventory_reserved count, which lowers inventory_reserved by 1 per redemption and recomputes Offer.sold_out"
          - "increments Employer.version by 1"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /perks/employers/{id}/storefront/publish"
        actor: EmployerAdmin
        preconditions:
          - "employer.storefront_status = SUSPENDED"
        side_effects:
          - "clears suspension_reason"
          - "recomputes Employer.program_posture"
          - "increments Employer.version by 1"
        note: "Cycle leg PUBLISHED -> SUSPENDED -> PUBLISHED; voided redemptions are not resurrected."

  - entity: EligibilityFile
    dimension: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /perks/eligibility-files/{id}/validate"
        actor: EmployerAdmin | PlatformAdmin
        preconditions:
          - "file.status = RECEIVED"
          - "invalid_record_count * 10000 / record_count <= 500"
        side_effects:
          - "drives Employer.integration_status FILE_RECEIVED -> VALIDATED"
          - "increments EligibilityFile.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /perks/eligibility-files/{id}/validate"
        actor: EmployerAdmin | PlatformAdmin
        preconditions:
          - "file.status = RECEIVED"
          - "invalid_record_count * 10000 / record_count > 500"
        side_effects:
          - "sets rejection_reason = 'INVALID_RECORD_RATIO_EXCEEDED'"
          - "increments EligibilityFile.version by 1"
        note: "Branch: the same trigger reaches VALIDATED or REJECTED purely on the invalid-record ratio; the boundary is inclusive (exactly 5.00% validates)."
      - from: VALIDATED
        to: APPLIED
        trigger: "POST /perks/eligibility-files/{id}/apply"
        actor: EmployerAdmin
        preconditions:
          - "file.status = VALIDATED"
        side_effects:
          - "creates or rewrites EmployeeMembership rows and suspends omitted memberships"
          - "drives Employer.integration_status VALIDATED -> SYNCED"
          - "increments EligibilityFile.version by 1"

  - entity: EmployeeMembership
    dimension: status
    initial_state: ELIGIBLE
    terminal_states: [REVOKED]
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /perks/eligibility-files/{id}/apply where the membership's external_employee_ref is absent from the batch"
        actor: EmployerAdmin
        preconditions:
          - "membership.status = ELIGIBLE"
        side_effects:
          - "because the membership is no longer ELIGIBLE, its Redemptions with verification_status = PENDING move to VOID with void_reason = 'MEMBERSHIP_INELIGIBLE'"
          - "each such void lowers the offer's inventory_reserved by 1 and recomputes Offer.sold_out"
          - "increments EmployeeMembership.version by 1"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /perks/eligibility-files/{id}/apply where the membership's external_employee_ref reappears with employment_status IN {ACTIVE, LEAVE}"
        actor: EmployerAdmin
        preconditions:
          - "membership.status = SUSPENDED"
        side_effects:
          - "rewrites employment_status, region_code, eligibility window and source_file_id"
          - "increments EmployeeMembership.version by 1"
      - from: ELIGIBLE
        to: REVOKED
        trigger: "POST /perks/memberships/{id}/employment-status with employment_status = TERMINATED"
        actor: EmployerAdmin
        preconditions:
          - "membership.employer_id = X-User-ID"
        side_effects:
          - "sets employment_status = TERMINATED and last_employment_change_at = clock_now"
          - "because the membership is REVOKED, its Redemptions with verification_status = PENDING move to VOID with void_reason = 'MEMBERSHIP_INELIGIBLE'"
          - "each such void lowers the offer's inventory_reserved by 1 and recomputes Offer.sold_out"
          - "increments EmployeeMembership.version by 1"
        note: "Depth-3 cascade: employment write -> status REVOKED -> pending redemptions VOID -> offer inventory released."
      - from: ELIGIBLE
        to: ELIGIBLE
        trigger: "POST /perks/memberships/{id}/employment-status with employment_status IN {ACTIVE, LEAVE}"
        actor: EmployerAdmin
        preconditions:
          - "membership.employer_id = X-User-ID"
        side_effects:
          - "sets employment_status and last_employment_change_at = clock_now"
          - "raises the employment term of the AUDIT fraud-risk variant on every later verification"
          - "increments EmployeeMembership.version by 1"

  - entity: Offer
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /perks/offers/{id}/submit"
        actor: Merchant
        preconditions:
          - "offer.status = DRAFT"
          - "offer.merchant_id = X-User-ID"
          - "PartnerAgreement.status = ACTIVE"
        side_effects:
          - "increments Offer.version by 1"
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /perks/offers/{id}/review with decision = APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "offer.status = PENDING_REVIEW"
          - "PartnerAgreement.status = ACTIVE"
          - "Merchant.status = ACTIVE"
        side_effects:
          - "stores review_note"
          - "increments Offer.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /perks/offers/{id}/review with decision = REJECT"
        actor: PlatformAdmin
        preconditions:
          - "offer.status = PENDING_REVIEW"
        side_effects:
          - "stores review_note"
          - "increments Offer.version by 1"
        note: "Branch: APPROVE and REJECT diverge on both the target state and the cross-entity precondition set."
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /perks/offers/{id}/pause"
        actor: Merchant | PlatformAdmin
        preconditions:
          - "offer.status = ACTIVE"
        side_effects:
          - "stores paused_reason"
          - "increments Offer.version by 1"
        note: "Pausing does NOT void already-pending redemptions; they may still be verified."
      - from: ACTIVE
        to: PAUSED
        trigger: "system: Merchant.status ACTIVE -> SUSPENDED cascade"
        actor: system
        preconditions:
          - "offer.status = ACTIVE"
          - "offer.merchant_id = the merchant being suspended"
        side_effects:
          - "sets paused_reason = 'MERCHANT_SUSPENDED'"
          - "because the offer left ACTIVE, its PlacementSlots with status IN {RESERVED, CONFIRMED} move to RELEASED with release_reason = 'OFFER_PAUSED'"
          - "each released slot that was CONFIRMED writes a PLACEMENT_FEE_REFUND LedgerEntry of -placement_fee_cents and lowers Merchant.accrued_commission_payable_cents by placement_fee_cents"
          - "increments Offer.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /perks/offers/{id}/resume"
        actor: Merchant
        preconditions:
          - "offer.status = PAUSED"
          - "offer.merchant_id = X-User-ID"
          - "Merchant.status = ACTIVE"
          - "PartnerAgreement.status = ACTIVE"
          - "offer.window_end > clock_now"
        side_effects:
          - "clears paused_reason"
          - "increments Offer.version by 1"
        note: "Cycle leg ACTIVE -> PAUSED -> ACTIVE."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: PartnerAgreement -> TERMINATED cascade (agreement or merchant termination)"
        actor: system
        preconditions:
          - "offer.status IN {DRAFT, PENDING_REVIEW, ACTIVE, PAUSED}"
        side_effects:
          - "sets expired_at = clock_now"
          - "because the offer left ACTIVE or PAUSED, its PlacementSlots with status IN {RESERVED, CONFIRMED} move to RELEASED with release_reason = 'AGREEMENT_TERMINATED', each CONFIRMED slot writing a PLACEMENT_FEE_REFUND LedgerEntry of -placement_fee_cents"
          - "increments Offer.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/run-epoch when offer.window_end <= clock_now"
        actor: system
        preconditions:
          - "offer.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "sets expired_at = clock_now"
          - "increments Offer.version by 1"

  - entity: PlacementSlot
    dimension: status
    initial_state: RESERVED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /perks/placement-slots/{id}/confirm"
        actor: PartnerManager
        preconditions:
          - "slot.status = RESERVED"
          - "Offer.status = ACTIVE"
          - "Employer.program_posture IN {LIVE, RESTRICTED}"
        side_effects:
          - "sets confirmed_at = clock_now"
          - "writes a PLACEMENT_FEE LedgerEntry of +placement_fee_cents for (merchant_id, placement_slot_id)"
          - "raises Merchant.accrued_commission_payable_cents by placement_fee_cents"
          - "increments PlacementSlot.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /perks/placement-slots/{id}/release"
        actor: Merchant | PartnerManager
        preconditions:
          - "slot.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "sets released_at = clock_now and release_reason from the request"
          - "frees the slot's contribution to the (employer_id, category) overlapping-FEATURED capacity and to the same merchant's cooldown footprint"
          - "increments PlacementSlot.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /perks/placement-slots/{id}/release"
        actor: Merchant | PartnerManager
        preconditions:
          - "slot.status = CONFIRMED"
        side_effects:
          - "writes a PLACEMENT_FEE_REFUND LedgerEntry of -placement_fee_cents"
          - "lowers Merchant.accrued_commission_payable_cents by placement_fee_cents"
          - "increments PlacementSlot.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: POST /_ops/run-epoch when slot_window_end < clock_now"
        actor: system
        preconditions:
          - "slot.status = CONFIRMED"
        side_effects:
          - "frees the slot's capacity and cooldown footprint"
          - "increments PlacementSlot.version by 1"

  - entity: Redemption
    dimension: verification_status
    initial_state: PENDING
    terminal_states: [FAILED, VOID]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /perks/redemptions/{id}/verify"
        actor: Merchant
        preconditions:
          - "redemption.verification_status = PENDING"
          - "redemption.merchant_id = X-User-ID"
          - "verification_token = redemption.verification_token"
          - "clock_now < redemption.verification_expires_at"
          - "Employer.program_posture IN {LIVE, RESTRICTED}"
          - "EmployeeMembership.status = ELIGIBLE and employment_status IN {ACTIVE, LEAVE}"
          - "gross_amount_cents >= Offer.min_spend_cents"
          - "AUDIT fraud_risk_score < 70 (FRAUD_BLOCK_THRESHOLD)"
        side_effects:
          - "stores gross_amount_cents and sets verified_at = clock_now"
          - "computes discount_amount_cents, net_charged_cents, commission_amount_cents, employer_share_cents, provider_net_cents per calculations.redemption_line_economics"
          - "stores audit_risk_score per the AUDIT variant of calculations.fraud_risk_score"
          - "writes LedgerEntry COMMISSION_ACCRUAL of +commission_amount_cents and, when employer_share_cents > 0, LedgerEntry EMPLOYER_SHARE of -employer_share_cents"
          - "recomputes Merchant.accrued_commission_payable_cents and Employer.accrued_share_cents from those entries"
          - "moves the offer's unit from inventory_reserved to inventory_redeemed (both are counts, so the sum is unchanged) and recomputes Offer.sold_out"
          - "increments Redemption.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /perks/redemptions/{id}/verify refused for AUDIT fraud_risk_score >= 70"
        actor: Merchant
        preconditions:
          - "every other verify precondition holds"
          - "AUDIT fraud_risk_score >= 70"
        side_effects:
          - "stores audit_risk_score and risk_block_reason = 'FRAUD_RISK_THRESHOLD'"
          - "leaves gross_amount_cents null and writes no LedgerEntry"
          - "drops the offer's inventory_reserved by 1 and recomputes Offer.sold_out"
          - "increments Redemption.version by 1"
        note: "Responds ERR_FRAUD_RISK_BLOCKED (422) while still persisting the FAILED dimension and the score that justified it."
      - from: PENDING
        to: VOID
        trigger: "POST /perks/redemptions/{id}/void"
        actor: Employee | PlatformAdmin
        preconditions:
          - "redemption.verification_status = PENDING"
          - "redemption.membership_id = X-User-ID when the actor is Employee"
        side_effects:
          - "sets voided_at = clock_now and void_reason = 'MEMBER_CANCELLED'"
          - "drops the offer's inventory_reserved by 1 and recomputes Offer.sold_out"
          - "increments Redemption.version by 1"
      - from: PENDING
        to: VOID
        trigger: "system: storefront suspend cascade, membership-ineligibility cascade, or POST /_ops/run-epoch when verification_expires_at <= clock_now"
        actor: system
        preconditions:
          - "redemption.verification_status = PENDING"
        side_effects:
          - "sets void_reason to PROGRAM_FROZEN, MEMBERSHIP_INELIGIBLE or VERIFICATION_TTL_EXPIRED respectively"
          - "drops the offer's inventory_reserved by 1 and recomputes Offer.sold_out"
          - "increments Redemption.version by 1"

  - entity: Redemption
    dimension: fulfillment_status
    initial_state: AWAITING
    terminal_states: [REFUNDED]
    transitions:
      - from: AWAITING
        to: FULFILLED
        trigger: "POST /perks/redemptions/{id}/fulfill"
        actor: Merchant
        preconditions:
          - "redemption.verification_status = VERIFIED"
          - "redemption.fulfillment_status = AWAITING"
          - "redemption.merchant_id = X-User-ID"
        side_effects:
          - "sets fulfilled_at = clock_now (the CASH-basis settlement date)"
          - "increments Redemption.version by 1"
        note: "Parallel dimension: the verification dimension is untouched by this call."
      - from: AWAITING
        to: DISPUTED
        trigger: "POST /perks/redemptions/{id}/disputes"
        actor: Employee
        preconditions:
          - "redemption.verification_status = VERIFIED"
          - "redemption.fulfillment_status IN {AWAITING, FULFILLED}"
          - "redemption.membership_id = X-User-ID"
          - "clock_now < redemption.verified_at + 30 days (DISPUTE_FILING_DAYS)"
        side_effects:
          - "creates Dispute in OPEN with response_deadline_at = clock_now + 120 hours"
          - "increments Redemption.version by 1"
      - from: FULFILLED
        to: DISPUTED
        trigger: "POST /perks/redemptions/{id}/disputes"
        actor: Employee
        preconditions:
          - "redemption.fulfillment_status = FULFILLED"
          - "clock_now < redemption.verified_at + 30 days"
        side_effects:
          - "creates Dispute in OPEN"
          - "increments Redemption.version by 1"
      - from: DISPUTED
        to: REFUNDED
        trigger: "system: Dispute -> RESOLVED_MERCHANT_FAULT (platform decision or epoch default judgment)"
        actor: system
        preconditions:
          - "redemption.fulfillment_status = DISPUTED"
        side_effects:
          - "sets refunded_at = clock_now"
          - "writes LedgerEntry COMMISSION_REVERSAL of -commission_amount_cents and, when employer_share_cents > 0, EMPLOYER_SHARE_REVERSAL of +employer_share_cents"
          - "when the dispute grants a credit: writes DISPUTE_CREDIT of -outcome_credit_cents and DISPUTE_CREDIT_RECOVERY of +outcome_credit_cents"
          - "recomputes Merchant.accrued_commission_payable_cents and Employer.accrued_share_cents"
          - "because reversal entries landed, a statement_id that is set and whose statement is FINALIZED moves that statement FINALIZED -> REOPENED"
          - "increments Redemption.version by 1"
      - from: DISPUTED
        to: FULFILLED
        trigger: "system: Dispute -> RESOLVED_NO_FAULT"
        actor: system
        preconditions:
          - "redemption.fulfillment_status = DISPUTED"
        side_effects:
          - "sets fulfilled_at = clock_now when it was null; writes no LedgerEntry"
          - "increments Redemption.version by 1"
        note: "Cycle leg AWAITING/FULFILLED -> DISPUTED -> FULFILLED on the fulfilment dimension."

  - entity: Dispute
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED_MERCHANT_FAULT, RESOLVED_NO_FAULT]
    transitions:
      - from: OPEN
        to: MERCHANT_RESPONDED
        trigger: "POST /perks/disputes/{id}/respond"
        actor: Merchant
        preconditions:
          - "dispute.status IN {OPEN, INFO_REQUESTED}"
          - "dispute.merchant_id = X-User-ID"
          - "clock_now < dispute.response_deadline_at"
        side_effects:
          - "stores response_note and remedy_offered_cents from the request"
          - "increments Dispute.version by 1"
      - from: MERCHANT_RESPONDED
        to: INFO_REQUESTED
        trigger: "POST /perks/disputes/{id}/request-info"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status = MERCHANT_RESPONDED"
          - "dispute.info_request_count < 2 (MAX_INFO_REQUESTS)"
        side_effects:
          - "raises info_request_count by 1"
          - "extends response_deadline_at to clock_now + 120 hours (DISPUTE_RESPONSE_HOURS)"
          - "increments Dispute.version by 1"
      - from: INFO_REQUESTED
        to: MERCHANT_RESPONDED
        trigger: "POST /perks/disputes/{id}/respond"
        actor: Merchant
        preconditions:
          - "dispute.status = INFO_REQUESTED"
          - "clock_now < dispute.response_deadline_at"
        side_effects:
          - "overwrites response_note and remedy_offered_cents"
          - "increments Dispute.version by 1"
        note: "Cycle leg MERCHANT_RESPONDED -> INFO_REQUESTED -> MERCHANT_RESPONDED, capped at 2 info requests."
      - from: MERCHANT_RESPONDED
        to: RESOLVED_MERCHANT_FAULT
        trigger: "POST /perks/disputes/{id}/resolve with outcome = MERCHANT_FAULT"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status IN {OPEN, MERCHANT_RESPONDED, INFO_REQUESTED}"
          - "outcome_credit_cents <= Redemption.net_charged_cents"
        side_effects:
          - "sets resolved_at = clock_now and outcome_credit_cents from the request"
          - "moves the Redemption fulfilment dimension DISPUTED -> REFUNDED, which writes the reversal and credit LedgerEntries and may REOPEN a FINALIZED RevenueShareStatement"
          - "raises Merchant.fault_event_count by 1 and sets Merchant.last_fault_at = clock_now"
          - "recomputes Merchant.fulfillment_failure_score per calculations.merchant_fulfillment_failure_score; at >= 40 (MERCHANT_SUSPEND_SCORE) Merchant.status ACTIVE -> SUSPENDED with suspended_at = clock_now, which pauses that merchant's ACTIVE offers and releases their RESERVED/CONFIRMED slots"
          - "increments Dispute.version by 1"
        note: "Cascade depth 5: Dispute -> Redemption -> LedgerEntry/RevenueShareStatement -> Merchant -> Offer -> PlacementSlot."
      - from: MERCHANT_RESPONDED
        to: RESOLVED_NO_FAULT
        trigger: "POST /perks/disputes/{id}/resolve with outcome = NO_FAULT"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status IN {OPEN, MERCHANT_RESPONDED, INFO_REQUESTED}"
        side_effects:
          - "sets resolved_at = clock_now and forces outcome_credit_cents = 0"
          - "moves the Redemption fulfilment dimension DISPUTED -> FULFILLED"
          - "leaves Merchant.fault_event_count, Merchant.fulfillment_failure_score and every ledger balance unchanged"
          - "increments Dispute.version by 1"
        note: "Branch: MERCHANT_FAULT and NO_FAULT diverge on target state, ledger writes and merchant scoring."
      - from: OPEN
        to: RESOLVED_MERCHANT_FAULT
        trigger: "system: POST /_ops/run-epoch when dispute.status = OPEN and response_deadline_at <= clock_now"
        actor: system
        preconditions:
          - "dispute.status = OPEN"
          - "dispute.response_note IS NULL"
        side_effects:
          - "sets default_judged = true and outcome_credit_cents = 0"
          - "applies the same MERCHANT_FAULT cascade as the platform-decided resolution"
          - "increments Dispute.version by 1"
        note: "A dispute in INFO_REQUESTED or MERCHANT_RESPONDED is never default-judged, even past the deadline."

  - entity: RevenueShareStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /perks/revenue-share-statements/{id}/finalize"
        actor: PartnerManager
        preconditions:
          - "statement.status IN {DRAFT, REOPENED}"
          - "period_end < clock_now"
        side_effects:
          - "recomputes included_redemption_count, gross_commission_cents, employer_share_cents, provider_retained_cents and reversal_adjustment_cents per calculations.revenue_share_statement_totals using statement.basis"
          - "stamps statement_id onto every Redemption the basis selected whose statement_id is currently null; an already-stamped redemption keeps its original statement_id but still counts in these totals"
          - "sets finalized_at = clock_now"
          - "increments RevenueShareStatement.version by 1"
      - from: FINALIZED
        to: REOPENED
        trigger: "system: a stamped Redemption receives a COMMISSION_REVERSAL LedgerEntry from a MERCHANT_FAULT dispute resolution"
        actor: system
        preconditions:
          - "statement.status = FINALIZED"
        side_effects:
          - "sets reopened_at = clock_now and reopen_reason = 'DISPUTE_REVERSAL'"
          - "leaves the previously computed totals in place until the next finalize recomputes them"
          - "increments RevenueShareStatement.version by 1"
      - from: REOPENED
        to: FINALIZED
        trigger: "POST /perks/revenue-share-statements/{id}/finalize"
        actor: PartnerManager
        preconditions:
          - "statement.status = REOPENED"
        side_effects:
          - "recomputes the totals, which now net out the reversed redemption"
          - "clears reopen_reason and sets finalized_at = clock_now"
          - "increments RevenueShareStatement.version by 1"
        note: "Cycle leg DRAFT -> FINALIZED -> REOPENED -> FINALIZED."
      - from: FINALIZED
        to: PAID
        trigger: "POST /perks/revenue-share-statements/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "statement.status = FINALIZED"
        side_effects:
          - "sets paid_at = clock_now"
          - "stores payment_reference from the request"
          - "writes no LedgerEntry: Employer.accrued_share_cents is a lifetime accrual and is unchanged by payment"
          - "increments RevenueShareStatement.version by 1"
        note: "A REOPENED statement cannot be paid; it must be re-finalized first."

  - entity: Merchant
    dimension: status
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: IN_NEGOTIATION
        trigger: "system: the first POST /perks/agreements/{id}/propose on any of this merchant's agreements"
        actor: system
        preconditions:
          - "merchant.status = PROSPECT"
        side_effects:
          - "increments Merchant.version by 1"
      - from: IN_NEGOTIATION
        to: ACTIVE
        trigger: "system: the first POST /perks/agreements/{id}/activate on any of this merchant's agreements"
        actor: system
        preconditions:
          - "merchant.status = IN_NEGOTIATION"
        side_effects:
          - "recomputes active_agreement_count"
          - "increments Merchant.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: a merchant-fault dispute resolution lifts fulfillment_failure_score to >= 40 (MERCHANT_SUSPEND_SCORE)"
        actor: system
        preconditions:
          - "merchant.status = ACTIVE"
        side_effects:
          - "sets suspended_at = clock_now"
          - "moves every ACTIVE Offer of this merchant to PAUSED with paused_reason = 'MERCHANT_SUSPENDED'"
          - "moves every RESERVED or CONFIRMED PlacementSlot of those offers to RELEASED with release_reason = 'OFFER_PAUSED', refunding each CONFIRMED slot's placement fee"
          - "increments Merchant.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /perks/merchants/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "merchant.status = SUSPENDED"
          - "the recomputed fulfillment_failure_score is < 40, which only happens once enough fault events have decayed"
        side_effects:
          - "clears suspended_at"
          - "leaves the paused offers PAUSED and the released slots RELEASED: reinstatement is not a rollback, the merchant must resume each offer explicitly"
          - "increments Merchant.version by 1"
        note: "Cycle leg ACTIVE -> SUSPENDED -> ACTIVE. Reinstating while the score is still >= 40 is refused with ERR_MERCHANT_SCORE_NOT_DECAYED."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /perks/merchants/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "merchant.status IN {PROSPECT, IN_NEGOTIATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "moves every PartnerAgreement of this merchant whose status IN {DRAFT, PROVIDER_PROPOSED, MERCHANT_COUNTERED, ACCEPTED, ACTIVE} to TERMINATED with terminated_reason = 'MERCHANT_TERMINATED'"
          - "each terminated agreement expires its DRAFT, PENDING_REVIEW, ACTIVE and PAUSED offers, and each expired offer releases its RESERVED and CONFIRMED slots, refunding every CONFIRMED slot's placement fee"
          - "recomputes active_agreement_count to 0"
          - "increments Merchant.version by 1"
        note: >
          Depth-4 cascade Merchant -> PartnerAgreement -> Offer -> PlacementSlot -> LedgerEntry.
          Platform termination deliberately BYPASSES the category-coverage floor that guards
          POST /perks/agreements/{id}/terminate: the floor protects employers from a partner
          manager walking away, not from a platform-level shutdown.

# ============================================================================
# 1.2.1 Concurrency Rules (OCC)
# ============================================================================
concurrency_rules:
  - rule_id: propose-stale-agreement
    parent_entity: PartnerAgreement
    write_endpoint: "POST /perks/agreements/{id}/propose"
    occ_field: expected_agreement_version
    error_id: ERR_STALE_VERSION
    http_status: 412
    description: >
      A negotiation round may only be proposed against the PartnerAgreement version the
      proposer last read. Every accepted proposal, decision and termination increments
      PartnerAgreement.version, so a proposer holding an older version is refused before any
      round-count or term validation runs.

  - rule_id: slot-reserve-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /perks/offers/{id}/placement-slots"
    occ_field: expected_offer_version
    error_id: ERR_STALE_VERSION
    http_status: 412
    description: >
      Reserving a placement slot is a write against the parent Offer's aggregate: it consumes
      overlapping-FEATURED capacity and cooldown footprint. The caller must echo the Offer
      version it read; a pause, resume, review or prior slot reservation invalidates it.

  - rule_id: eligibility-file-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /perks/employers/{id}/eligibility-files"
    occ_field: expected_employer_version
    error_id: ERR_STALE_VERSION
    http_status: 412
    description: >
      An eligibility file is loaded against the Employer aggregate it will mutate (membership
      roster and integration_status). The caller must echo the Employer version it read; a
      posture change, storefront transition or earlier file application invalidates it.

  - rule_id: counter-stale-agreement
    parent_entity: PartnerAgreement
    write_endpoint: "POST /perks/agreements/{id}/counter"
    occ_field: expected_agreement_version
    error_id: ERR_STALE_VERSION
    http_status: 412
    description: >
      The merchant side of the same negotiation aggregate. A counter must echo the
      PartnerAgreement version the merchant read; the provider's newer proposal has already
      bumped it, so a counter built on the previous proposal is refused instead of silently
      overwriting the standing terms.

# ============================================================================
# §1.3 Calculation Rules
# ============================================================================
calculations:

  - name: redemption_line_economics
    algorithm_type: tiered_pricing
    trigger: "POST /perks/redemptions/{id}/verify (PENDING -> VERIFIED)"
    inputs:
      - "Redemption.gross_amount_cents (supplied on the verify request)"
      - "Offer.discount_type, Offer.discount_value_bps, Offer.discount_value_cents"
      - "PartnerAgreement.commission_rate_bps, PartnerAgreement.employer_revenue_share_bps (standing terms of the offer's agreement)"
      - "Employer.revenue_share_enabled"
    variants:
      - variant: PERCENT
        applies_when: "Offer.discount_type = PERCENT"
        step_1_discount: "discount_amount_cents = min(gross_amount_cents, round_half_up(gross_amount_cents * Offer.discount_value_bps / 10000))"
      - variant: FIXED
        applies_when: "Offer.discount_type = FIXED"
        step_1_discount: "discount_amount_cents = min(Offer.discount_value_cents, gross_amount_cents)"
    formula: |
      Five ordered steps; every step rounds before feeding the next (round-then-chain,
      never compute a single fused expression):
        1. discount_amount_cents  = per the variant above
        2. net_charged_cents      = gross_amount_cents - discount_amount_cents
        3. commission_amount_cents = round_half_up(net_charged_cents * commission_rate_bps / 10000)
        4. employer_share_cents   = 0 when Employer.revenue_share_enabled is false,
                                    else round_half_up(commission_amount_cents * employer_revenue_share_bps / 10000)
        5. provider_net_cents     = commission_amount_cents - employer_share_cents
      The share is a slice of the ALREADY ROUNDED commission, not of net_charged_cents.
    rounding: "round_half_up to whole cents at each of steps 1, 3 and 4; integers only, never floats"
    constants:
      BPS_DENOMINATOR: 10000
    worked_examples:
      - label: "PERCENT 2000 bps, commission 1200 bps, share 2500 bps, revenue_share_enabled = true"
        given: "gross_amount_cents = 8396"
        expect: "discount 1679, net 6717, commission 806, employer_share 202, provider_net 604"
        note: "8396 * 0.20 = 1679.2 -> 1679; 6717 * 0.12 = 806.04 -> 806; 806 * 0.25 = 201.5 -> 202 (half-up, not half-even)."
      - label: "same terms, round-numbers control"
        given: "gross_amount_cents = 5000"
        expect: "discount 1000, net 4000, commission 480, employer_share 120, provider_net 360"
      - label: "FIXED variant on the same gross"
        given: "discount_type = FIXED, discount_value_cents = 800, gross_amount_cents = 5000"
        expect: "discount 800, net 4200, commission 504, employer_share 126, provider_net 378"
        note: "Variant divergence at identical gross: 1000/4000/480/120/360 (PERCENT) vs 800/4200/504/126/378 (FIXED)."
      - label: "revenue_share_enabled = false suppresses only step 4"
        given: "PERCENT 2000 bps, gross_amount_cents = 8396, revenue_share_enabled = false"
        expect: "discount 1679, net 6717, commission 806, employer_share 0, provider_net 806"

  - name: placement_fee_pricing
    algorithm_type: tiered_pricing
    trigger: "POST /perks/offers/{id}/placement-slots (slot creation, status RESERVED)"
    inputs:
      - "PartnerAgreement.placement_fee_base_cents (per-day base of the offer's agreement)"
      - "PlacementSlot.slot_window_start, PlacementSlot.slot_window_end"
      - "Employer.eligible_headcount (per calculations.employer_eligible_headcount, read at slot creation)"
    formula: |
      Five ordered steps. The tier of step 4 is keyed on the step-3 GROSS, i.e. AFTER the
      reach surcharge is added — pricing that keys the volume tier on the bare base, or that
      applies the volume discount before the surcharge, produces a different fee:
        1. slot_duration_days   = max(1, ceil((slot_window_end - slot_window_start) / 86400 seconds))
           base_fee_cents       = placement_fee_base_cents * slot_duration_days
        2. reach_surcharge_bps  = tier over Employer.eligible_headcount:
                                    headcount <= 3            -> 0 bps
                                    4 <= headcount <= 20      -> 1500 bps
                                    headcount >= 21           -> 3000 bps
           reach_surcharge_cents = round_half_up(base_fee_cents * reach_surcharge_bps / 10000)
        3. gross_fee_cents      = base_fee_cents + reach_surcharge_cents
        4. volume_discount_bps  = tier over gross_fee_cents:
                                    gross_fee_cents < 100000              -> 0 bps
                                    100000 <= gross_fee_cents < 200000    -> 500 bps
                                    gross_fee_cents >= 200000             -> 1200 bps
           volume_discount_cents = round_half_up(gross_fee_cents * volume_discount_bps / 10000)
        5. placement_fee_cents  = gross_fee_cents - volume_discount_cents
    rounding: "round_half_up to whole cents at steps 2 and 4; slot_duration_days uses ceiling"
    constants:
      REACH_TIER_1_MAX_HEADCOUNT: 3
      REACH_TIER_2_MAX_HEADCOUNT: 20
      REACH_TIER_2_BPS: 1500
      REACH_TIER_3_BPS: 3000
      VOLUME_TIER_2_FLOOR_CENTS: 100000
      VOLUME_TIER_2_BPS: 500
      VOLUME_TIER_3_FLOOR_CENTS: 200000
      VOLUME_TIER_3_BPS: 1200
      SECONDS_PER_DAY: 86400
    worked_examples:
      - label: "order-sensitive case: surcharge pushes the gross across the 200000 volume floor"
        given: "placement_fee_base_cents = 36000, 5-day window, eligible_headcount = 4"
        expect: "base 180000, reach_surcharge_bps 1500, surcharge 27000, gross 207000, volume_discount_bps 1200, discount 24840, placement_fee_cents 182160"
        note: "Keying the volume tier on the bare base (180000 -> 500 bps) and discounting before the surcharge yields 198000 instead of 182160."
      - label: "tier-1 reach, tier-1 volume"
        given: "placement_fee_base_cents = 36000, 2-day window, eligible_headcount = 2"
        expect: "base 72000, reach_surcharge_bps 0, surcharge 0, gross 72000, volume_discount_bps 0, discount 0, placement_fee_cents 72000"
      - label: "tier-3 reach"
        given: "placement_fee_base_cents = 36000, 5-day window, eligible_headcount = 21"
        expect: "base 180000, reach_surcharge_bps 3000, surcharge 54000, gross 234000, volume_discount_bps 1200, discount 28080, placement_fee_cents 205920"

  - name: fraud_risk_score
    algorithm_type: weighted_scoring
    trigger: "SCREENING at POST /perks/redemptions; AUDIT at POST /perks/redemptions/{id}/verify"
    inputs:
      - "EmployeeMembership.employment_status"
      - "EmployeeMembership.eligibility_valid_from (seasoning term)"
      - "the membership's other Redemption rows, filtered by the variant's window and status set"
      - "Redemption.gross_amount_cents (AUDIT only; unknown at creation time)"
      - "Merchant.fulfillment_failure_score (AUDIT only)"
    variants:
      - variant: SCREENING
        applies_when: "redemption creation; stored in Redemption.screening_risk_score and never rewritten"
        velocity_window_hours: 24
        velocity_status_set: "{PENDING}"
        terms: "employment + velocity + seasoning"
        note: "gates nothing: it is recorded for analytics only."
      - variant: AUDIT
        applies_when: "verification; stored in Redemption.audit_risk_score"
        velocity_window_hours: 168
        velocity_status_set: "{PENDING, VERIFIED, FAILED}"
        terms: "employment + velocity + seasoning + amount + merchant_risk"
        note: "blocks the transition at >= FRAUD_BLOCK_THRESHOLD (70) with ERR_FRAUD_RISK_BLOCKED."
    formula: |
      score = min(100, employment_points + velocity_points + seasoning_points
                        [+ amount_points + merchant_risk_points for the AUDIT variant])
        employment_points   = 15 when employment_status = LEAVE, else 0
        velocity_points     = min(40, 8 * prior_count) where prior_count counts the
                              membership's OTHER redemptions whose created_at lies in
                              [clock_now - velocity_window_hours, clock_now) and whose
                              verification_status is in the variant's status set
        seasoning_points    = 10 when clock_now < eligibility_valid_from + 7 days, else 0
        amount_points       = min(25, floor(gross_amount_cents / 10000))        (AUDIT only)
        merchant_risk_points = 10 when Merchant.fulfillment_failure_score >= 20  (AUDIT only), else 0
      The subject redemption is always excluded from prior_count.
    rounding: "integer arithmetic; amount_points uses floor division, never rounding"
    constants:
      FRAUD_BLOCK_THRESHOLD: 70
      LEAVE_STATUS_POINTS: 15
      VELOCITY_POINTS_PER_PRIOR: 8
      VELOCITY_POINTS_CAP: 40
      SEASONING_POINTS: 10
      MEMBERSHIP_SEASONING_DAYS: 7
      AMOUNT_POINTS_CENTS_PER_POINT: 10000
      AMOUNT_POINTS_CAP: 25
      MERCHANT_RISK_POINTS: 10
      MERCHANT_RISK_SCORE_FLOOR: 20
      SCREENING_VELOCITY_WINDOW_HOURS: 24
      AUDIT_VELOCITY_WINDOW_HOURS: 168
    worked_examples:
      - label: "variant divergence on one redemption"
        given: >
          employment_status = LEAVE; eligibility_valid_from = 2026-06-01 (seasoned);
          two VERIFIED redemptions created 2026-08-01T00:00:00Z, one PENDING redemption
          created 2026-08-03T00:00:00Z; the subject redemption is created and verified at
          2026-08-03T12:00:00Z with gross_amount_cents = 100000; merchant score 0
        expect: "screening_risk_score = 23 (15 + 8*1 + 0), audit_risk_score = 49 (15 + 8*3 + 10)"
        note: "SCREENING sees 1 prior (24h window, PENDING only); AUDIT sees 3 priors (168h window, PENDING+VERIFIED)."
      - label: "block boundary"
        given: "employment_status = LEAVE, seasoned membership, 5 priors inside 168h, gross_amount_cents = 150000"
        expect: "audit_risk_score = 70 -> ERR_FRAUD_RISK_BLOCKED and verification_status = FAILED"
      - label: "one cent below the block boundary"
        given: "identical setup, gross_amount_cents = 149999"
        expect: "audit_risk_score = 69 -> verification succeeds; amount_points = 14 because floor(149999/10000) = 14"

  - name: revenue_share_statement_totals
    algorithm_type: aggregation
    trigger: "POST /perks/revenue-share-statements/{id}/finalize"
    inputs:
      - "Redemption rows with employer_id = statement.employer_id"
      - "statement.period_start, statement.period_end, statement.basis"
      - "LedgerEntry rows of type EMPLOYER_SHARE_REVERSAL carrying this statement_id"
    variants:
      - variant: ACCRUAL
        applies_when: "statement.basis = ACCRUAL"
        inclusion_set: >
          Redemptions with verification_status = VERIFIED and verified_at in
          [period_start, period_end), regardless of fulfillment_status.
      - variant: CASH
        applies_when: "statement.basis = CASH"
        inclusion_set: >
          Redemptions with verification_status = VERIFIED, fulfillment_status = FULFILLED and
          fulfilled_at in [period_start, period_end). A verified-but-unfulfilled redemption is
          excluded even when its verified_at falls inside the period.
    formula: |
      included_redemption_count = |inclusion set|
      gross_commission_cents    = sum of commission_amount_cents over the inclusion set
      employer_share_cents      = sum of the redemptions' ALREADY ROUNDED employer_share_cents
                                  (per-redemption rounding, then sum; never round the summed
                                  commission)
      provider_retained_cents   = gross_commission_cents - employer_share_cents
      reversal_adjustment_cents = sum of EMPLOYER_SHARE_REVERSAL amounts stamped with this
                                  statement_id (0 on a first finalize)
      Both windows are half-open [start, end).
    rounding: "no rounding at this level; the only rounding already happened per redemption"
    constants: {}
    worked_examples:
      - label: "ACCRUAL over three redemptions"
        given: "verified redemptions of 8396, 8396 and 5000 gross under PERCENT 2000 / commission 1200 / share 2500, all verified inside the period, only the first fulfilled"
        expect: "included_redemption_count 3, gross_commission_cents 2092, employer_share_cents 524, provider_retained_cents 1568"
      - label: "CASH over the same data"
        given: "same three redemptions, only the 8396 one fulfilled inside the period"
        expect: "included_redemption_count 1, gross_commission_cents 806, employer_share_cents 202, provider_retained_cents 604"
      - label: "rounding order is observable"
        given: "only the two 8396 redemptions included"
        expect: "employer_share_cents 404 (202 + 202); rounding the summed commission 1612 * 0.25 = 403 is wrong"

  - name: merchant_fulfillment_failure_score
    algorithm_type: decay_function
    trigger: "recomputed whenever a Dispute of this merchant enters RESOLVED_MERCHANT_FAULT, and on every read of the merchant"
    inputs:
      - "Disputes with merchant_id = M and status = RESOLVED_MERCHANT_FAULT, each with its resolved_at"
      - "clock_now"
    formula: |
      score = sum over each merchant-fault dispute of 20 * decay(age_days), where
        age_days = floor((clock_now - resolved_at) / 86400 seconds)
        decay(age_days) = 1.0   when age_days <= 30
                        = 0.5   when 31 <= age_days <= 90
                        = 0.0   when age_days >= 91
      The sum is rounded half-up to a whole integer at the very end, after the decayed
      per-event contributions are added. Merchant.status ACTIVE -> SUSPENDED fires when the
      recomputed score is >= 40 (MERCHANT_SUSPEND_SCORE).
    rounding: "round_half_up on the final sum only; per-event contributions stay exact halves"
    constants:
      FAULT_EVENT_POINTS: 20
      DECAY_TIER_1_MAX_DAYS: 30
      DECAY_TIER_1_FACTOR: 1.0
      DECAY_TIER_2_MAX_DAYS: 90
      DECAY_TIER_2_FACTOR: 0.5
      DECAY_TIER_3_FACTOR: 0.0
      MERCHANT_SUSPEND_SCORE: 40
    worked_examples:
      - label: "two fresh faults trip the suspension"
        given: "faults resolved at 2026-08-01 and 2026-08-10, clock_now = 2026-08-10"
        expect: "score 40 (20 * 1.0 + 20 * 1.0) -> Merchant.status = SUSPENDED"
      - label: "the same two faults, one aged past the first decay step"
        given: "faults resolved at 2026-08-01 and 2026-08-10, clock_now = 2026-09-05 (35 and 26 days old)"
        expect: "score 30 (20 * 0.5 + 20 * 1.0); a merchant already SUSPENDED is not un-suspended by decay"
      - label: "fully decayed history"
        given: "single fault resolved 2026-04-01, clock_now = 2026-08-01 (122 days old)"
        expect: "score 0"

  - name: employer_program_posture
    algorithm_type: projection
    trigger: "recomputed on every Employer integration_status or storefront_status transition"
    inputs:
      - "Employer.integration_status"
      - "Employer.storefront_status"
    formula: |
      Evaluated as an ordered table; the first matching row wins:
        1. storefront_status = SUSPENDED                             -> FROZEN
        2. storefront_status IN {DRAFT, BRANDED}                     -> SETUP
        3. storefront_status = PUBLISHED and integration_status = SYNCED -> LIVE
        4. storefront_status = PUBLISHED and integration_status = STALE  -> RESTRICTED
        5. storefront_status = PUBLISHED, any other integration_status   -> SETUP
      Posture gating: SETUP refuses redemption creation with ERR_PROGRAM_NOT_LIVE; FROZEN
      refuses both creation and verification with ERR_PROGRAM_FROZEN; RESTRICTED refuses
      creation with ERR_PROGRAM_RESTRICTED but still allows an already-PENDING redemption to
      be verified; LIVE allows both.
    rounding: "n/a"
    constants: {}
    worked_examples:
      - label: "published before the first sync"
        given: "integration_status = NOT_CONFIGURED, storefront_status = PUBLISHED"
        expect: "program_posture = SETUP"
      - label: "stale integration"
        given: "integration_status = STALE, storefront_status = PUBLISHED"
        expect: "program_posture = RESTRICTED"
      - label: "suspension dominates a healthy integration"
        given: "integration_status = SYNCED, storefront_status = SUSPENDED"
        expect: "program_posture = FROZEN"

  - name: employer_eligible_headcount
    algorithm_type: aggregation
    trigger: "recomputed on eligibility apply, on every employment-status write and on every Employer read"
    inputs:
      - "EmployeeMembership rows with employer_id = E"
      - "clock_now"
    formula: |
      eligible_headcount = count of memberships where
        status = ELIGIBLE
        AND employment_status IN {ACTIVE, LEAVE}
        AND eligibility_valid_from <= clock_now < eligibility_valid_until
      Employer.employee_count_declared is never used here and never affects pricing.
    rounding: "n/a"
    constants: {}
    worked_examples:
      - label: "mixed roster"
        given: "5 memberships: 3 ELIGIBLE/ACTIVE in-window, 1 ELIGIBLE/LEAVE in-window, 1 REVOKED"
        expect: "eligible_headcount = 4, which selects reach tier 2 (1500 bps)"
      - label: "window edge is half-open"
        given: "1 ELIGIBLE/ACTIVE membership whose eligibility_valid_until = clock_now"
        expect: "that membership is excluded; eligible_headcount = 0"

  - name: engagement_analytics
    algorithm_type: aggregation
    trigger: "GET /perks/employers/{id}/engagement-report and GET /perks/category-demand"
    inputs:
      - "Redemption rows with verification_status = VERIFIED and verified_at in [period_start, period_end)"
      - "Employer.privacy_min_cohort_size (EMPLOYER_SCOPE)"
      - "PARTNER_MIN_EMPLOYER_COHORT (PARTNER_SCOPE)"
    variants:
      - variant: EMPLOYER_SCOPE
        applies_when: "GET /perks/employers/{id}/engagement-report"
        cohort_metric: distinct_redeemer_count
        cohort_floor: "Employer.privacy_min_cohort_size"
        row_scope: "the employer's own verified redemptions, grouped by Offer.category"
      - variant: PARTNER_SCOPE
        applies_when: "GET /perks/category-demand"
        cohort_metric: distinct_employer_count
        cohort_floor: "PARTNER_MIN_EMPLOYER_COHORT = 2"
        row_scope: "every verified redemption across all employers, grouped by Offer.category"
    formula: |
      For each category that has at least one redemption in the window, emit a row with
      redemption_count, discount_amount_cents (sum of Redemption.discount_amount_cents) and
      the variant's cohort_metric. When the cohort_metric is strictly below the variant's
      cohort_floor the row is suppressed: suppressed = true and redemption_count,
      discount_amount_cents and the cohort metric are all null. Rows are ordered by category
      name ascending.
      Period totals (total_redemption_count, total_discount_amount_cents and, for
      EMPLOYER_SCOPE, total_distinct_redeemer_count) are computed over EVERY redemption in the
      window including the suppressed categories, so an employer can still reconcile spend.
      suppressed_category_count reports how many rows were withheld.
      Neither variant ever emits membership_id, external_employee_ref, redemption ids or
      employer names.
    rounding: "n/a; sums of already-rounded cent amounts"
    constants:
      PARTNER_MIN_EMPLOYER_COHORT: 2
      DEFAULT_PRIVACY_MIN_COHORT_SIZE: 8
    worked_examples:
      - label: "EMPLOYER_SCOPE with privacy_min_cohort_size = 3"
        given: >
          DINING: 3 verified redemptions by 3 distinct memberships totalling 3000 discount
          cents; WELLNESS: 2 verified redemptions by 2 of those same memberships totalling
          1600 discount cents
        expect: >
          DINING row reported with redemption_count 3, discount_amount_cents 3000,
          distinct_redeemer_count 3; WELLNESS row suppressed with all three metrics null;
          suppressed_category_count 1; total_redemption_count 5,
          total_discount_amount_cents 4600, total_distinct_redeemer_count 3
      - label: "PARTNER_SCOPE floor is on employers, not redeemers"
        given: "TRAVEL: 6 verified redemptions from a single employer"
        expect: "TRAVEL row suppressed because distinct_employer_count 1 < 2, even though 6 redemptions exist"

  - name: eligibility_file_validation_ratio
    algorithm_type: threshold
    trigger: "POST /perks/eligibility-files/{id}/validate"
    inputs:
      - "EligibilityFile.records"
      - "EligibilityFile.record_count, EligibilityFile.invalid_record_count"
    formula: |
      A records element is invalid when any of these holds:
        - a required key (external_employee_ref, employment_status, region_code,
          eligibility_valid_from, eligibility_valid_until) is missing
        - employment_status is outside {ACTIVE, LEAVE, TERMINATED}
        - region_code is outside {CA, TX, NY, WA, IL}
        - eligibility_valid_until <= eligibility_valid_from
      invalid_ratio_bps = round_half_up(invalid_record_count * 10000 / record_count)
      The batch is REJECTED when invalid_ratio_bps > 500 (FILE_REJECT_THRESHOLD_BPS) and
      VALIDATED otherwise: the boundary is inclusive, exactly 500 bps still validates.
    rounding: "round_half_up on the ratio before the comparison"
    constants:
      FILE_REJECT_THRESHOLD_BPS: 500
      BPS_DENOMINATOR: 10000
    worked_examples:
      - label: "exactly at the threshold"
        given: "record_count 20, invalid_record_count 1"
        expect: "invalid_ratio_bps 500 -> VALIDATED, valid_record_count 19"
      - label: "one record fewer tips it over"
        given: "record_count 19, invalid_record_count 1"
        expect: "invalid_ratio_bps 526 -> REJECTED with rejection_reason = INVALID_RECORD_RATIO_EXCEEDED"
      - label: "clean batch"
        given: "record_count 10, invalid_record_count 0"
        expect: "invalid_ratio_bps 0 -> VALIDATED, valid_record_count 10"

# ============================================================================
# §1.4 Validation Rules (ordered; lower priority number is evaluated first)
# ============================================================================
# Evaluation bands:
#   10-19 identity      (who is calling)
#   20-29 existence     (do the referenced rows exist)
#   30-39 schema        (shape, enums, required fields, ranges)
#   40-49 concurrency   (optimistic-concurrency version echo)
#   50-59 state         (the target entity's own state)
#   60-69 cross_entity  (the state of a different entity the operation depends on)
#   70-79 temporal      (windows, deadlines, TTLs)
#   80-89 capacity      (counts, quotas, interval capacity)
#   90-99 economics and privacy
# Every endpoint evaluates its applicable rules in ascending priority order and returns the
# FIRST violation it meets; later violations are never reported.
validations:

  - rule_id: identity-header-present
    priority: 10
    category: identity
    condition: "X-User-ID header is absent or empty on any /perks endpoint"
    error_id: ERR_IDENTITY_REQUIRED
    applies_to: "every /perks endpoint"

  - rule_id: role-permits-operation
    priority: 12
    category: identity
    condition: "the acting user's role is not listed for the endpoint in §1.7"
    error_id: ERR_UNAUTHORIZED
    applies_to: "every /perks endpoint"

  - rule_id: actor-owns-resource
    priority: 14
    category: identity
    condition: >
      the role is permitted but the row belongs to a different principal: a Merchant acting on
      an agreement, offer, slot, redemption or dispute whose merchant_id is not the caller; an
      EmployerAdmin acting on an employer, eligibility file, membership or statement whose
      employer_id is not the caller; an Employee acting on a membership or redemption whose
      membership_id is not the caller
    error_id: ERR_SCOPE_VIOLATION
    applies_to: "every scoped read and write"

  - rule_id: privacy-individual-redemption-hidden
    priority: 16
    category: identity
    condition: >
      an EmployerAdmin calls GET /perks/redemptions/{id}, GET /perks/redemptions or
      GET /perks/disputes/{id} - individual redemption and dispute detail is never exposed to
      the employer, only the aggregated engagement report is
    error_id: ERR_PRIVACY_RESTRICTED
    applies_to: "GET /perks/redemptions, GET /perks/redemptions/{id}, GET /perks/disputes/{id}"
    note: "Evaluated before existence so a non-existent redemption id leaks nothing to an employer."

  - rule_id: referenced-row-exists
    priority: 20
    category: existence
    condition: "a path id or FK in the body names no row"
    error_id: "the entity's own NOT_FOUND code (ERR_MERCHANT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_EMPLOYER_NOT_FOUND, ERR_ELIGIBILITY_FILE_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_PLACEMENT_SLOT_NOT_FOUND, ERR_REDEMPTION_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_STATEMENT_NOT_FOUND)"
    applies_to: "every endpoint with a path id or an FK field"

  - rule_id: required-fields-present
    priority: 30
    category: schema
    condition: "a field with source: input and no default is missing, null, blank, of the wrong type or outside its documented range"
    error_id: ERR_VALIDATION
    applies_to: "every write endpoint"

  - rule_id: enum-values-known
    priority: 32
    category: schema
    condition: "an enum-typed field carries a value outside its constraint set"
    error_id: ERR_INVALID_ENUM_VALUE
    applies_to: "every write endpoint with an enum input"

  - rule_id: pagination-params-sane
    priority: 34
    category: schema
    condition: "limit is outside 1..100 or offset is negative or either is non-integer"
    error_id: ERR_INVALID_PAGINATION
    applies_to: "every list endpoint"

  - rule_id: interval-end-after-start
    priority: 36
    category: schema
    condition: >
      window_end <= window_start (Offer), slot_window_end <= slot_window_start (PlacementSlot),
      period_end <= period_start (RevenueShareStatement), exclusivity_window_end <=
      exclusivity_window_start (NegotiationRound, when both are supplied)
    error_id: ERR_INVALID_WINDOW
    applies_to: "POST /perks/offers, POST /perks/offers/{id}/placement-slots, POST /perks/revenue-share-statements, POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter"

  - rule_id: discount-shape-consistent
    priority: 37
    category: schema
    condition: >
      discount_type = PERCENT with discount_value_bps null or discount_value_cents non-null, or
      discount_type = FIXED with discount_value_cents null or discount_value_bps non-null
    error_id: ERR_DISCOUNT_SHAPE_MISMATCH
    applies_to: "POST /perks/offers"

  - rule_id: region-within-merchant-footprint
    priority: 38
    category: schema
    condition: >
      PartnerAgreement.region_code is not a member of Merchant.region_codes, or
      Offer.region_codes is not a subset of Merchant.region_codes
    error_id: ERR_REGION_NOT_COVERED
    applies_to: "POST /perks/agreements, POST /perks/offers"

  - rule_id: eligibility-refs-unique
    priority: 39
    category: schema
    condition: "two records elements of one eligibility file share an external_employee_ref"
    error_id: ERR_DUPLICATE_EMPLOYEE_REF
    applies_to: "POST /perks/employers/{id}/eligibility-files"

  - rule_id: version-echo-current
    priority: 40
    category: concurrency
    condition: "the request's expected_<parent>_version does not equal the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    applies_to: "POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter, POST /perks/offers/{id}/placement-slots, POST /perks/employers/{id}/eligibility-files"
    note: "Deliberately ordered BEFORE every state, temporal and capacity rule: a caller holding a stale read is told to re-read rather than being told about a limit it cannot see yet."

  - rule_id: target-state-permits-transition
    priority: 50
    category: state
    condition: "the target row is not in a state from which the requested trigger is declared in §1.2"
    error_id: "the entity's own INVALID_STATE code (ERR_AGREEMENT_INVALID_STATE, ERR_EMPLOYER_INVALID_STATE, ERR_FILE_INVALID_STATE, ERR_OFFER_INVALID_STATE, ERR_SLOT_INVALID_STATE, ERR_REDEMPTION_INVALID_STATE, ERR_DISPUTE_INVALID_STATE, ERR_STATEMENT_INVALID_STATE, ERR_MERCHANT_INVALID_STATE)"
    applies_to: "every action endpoint"

  - rule_id: membership-not-revoked
    priority: 52
    category: state
    condition: "an employment-status write targets a membership whose status = REVOKED"
    error_id: ERR_MEMBERSHIP_REVOKED
    applies_to: "POST /perks/memberships/{id}/employment-status"
    note: "REVOKED is terminal: a rehire needs a new eligibility batch, not a status flip."

  - rule_id: single-open-negotiation-per-lane
    priority: 54
    category: state
    condition: >
      a PartnerAgreement already exists for the same (merchant_id, category, region_code) with
      status IN {DRAFT, PROVIDER_PROPOSED, MERCHANT_COUNTERED, ACCEPTED, ACTIVE}
    error_id: ERR_DUPLICATE_AGREEMENT
    applies_to: "POST /perks/agreements"

  - rule_id: agreement-active-for-offer-work
    priority: 60
    category: cross_entity
    condition: "the offer's PartnerAgreement.status is not ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    applies_to: "POST /perks/offers, POST /perks/offers/{id}/submit, POST /perks/offers/{id}/review, POST /perks/offers/{id}/resume"

  - rule_id: merchant-not-suspended
    priority: 62
    category: cross_entity
    condition: "the acting or referenced Merchant.status IN {SUSPENDED, TERMINATED}"
    error_id: ERR_MERCHANT_SUSPENDED
    applies_to: "POST /perks/offers, POST /perks/offers/{id}/submit, POST /perks/offers/{id}/resume, POST /perks/offers/{id}/placement-slots, POST /perks/redemptions"

  - rule_id: membership-eligible-for-redemption
    priority: 63
    category: cross_entity
    condition: "the redeeming EmployeeMembership.status != ELIGIBLE or employment_status = TERMINATED"
    error_id: ERR_MEMBERSHIP_NOT_ELIGIBLE
    applies_to: "POST /perks/redemptions, POST /perks/redemptions/{id}/verify"

  - rule_id: program-posture-setup
    priority: 64
    category: cross_entity
    condition: "the Employer's program_posture = SETUP"
    error_id: ERR_PROGRAM_NOT_LIVE
    applies_to: "POST /perks/redemptions, POST /perks/offers/{id}/placement-slots, POST /perks/placement-slots/{id}/confirm"

  - rule_id: program-posture-frozen
    priority: 65
    category: cross_entity
    condition: "the Employer's program_posture = FROZEN"
    error_id: ERR_PROGRAM_FROZEN
    applies_to: "POST /perks/redemptions, POST /perks/redemptions/{id}/verify, POST /perks/offers/{id}/placement-slots, POST /perks/placement-slots/{id}/confirm"

  - rule_id: program-posture-restricted
    priority: 66
    category: cross_entity
    condition: "the Employer's program_posture = RESTRICTED"
    error_id: ERR_PROGRAM_RESTRICTED
    applies_to: "POST /perks/redemptions"
    note: >
      Asymmetric on purpose: a RESTRICTED (published storefront on a stale eligibility feed)
      program accepts no NEW redemption, but a redemption already PENDING when the feed went
      stale can still be verified and fulfilled.

  - rule_id: offer-region-covers-member
    priority: 67
    category: cross_entity
    condition: "EmployeeMembership.region_code is not a member of Offer.region_codes"
    error_id: ERR_REGION_NOT_COVERED
    applies_to: "POST /perks/redemptions"

  - rule_id: offer-window-open
    priority: 70
    category: temporal
    condition: "clock_now < Offer.window_start or clock_now >= Offer.window_end (half-open window)"
    error_id: ERR_OFFER_WINDOW_CLOSED
    applies_to: "POST /perks/redemptions"

  - rule_id: membership-window-open
    priority: 71
    category: temporal
    condition: "clock_now < eligibility_valid_from or clock_now >= eligibility_valid_until"
    error_id: ERR_MEMBERSHIP_WINDOW_CLOSED
    applies_to: "POST /perks/redemptions"

  - rule_id: verification-token-live
    priority: 72
    category: temporal
    condition: "clock_now >= Redemption.verification_expires_at (created_at + 72 hours)"
    error_id: ERR_VERIFICATION_EXPIRED
    applies_to: "POST /perks/redemptions/{id}/verify"

  - rule_id: dispute-filing-window-open
    priority: 73
    category: temporal
    condition: "clock_now >= Redemption.verified_at + 30 days (DISPUTE_FILING_DAYS)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    applies_to: "POST /perks/redemptions/{id}/disputes"

  - rule_id: dispute-response-deadline-open
    priority: 74
    category: temporal
    condition: "clock_now >= Dispute.response_deadline_at"
    error_id: ERR_DISPUTE_DEADLINE_PASSED
    applies_to: "POST /perks/disputes/{id}/respond"

  - rule_id: statement-period-closed
    priority: 75
    category: temporal
    condition: "clock_now <= RevenueShareStatement.period_end"
    error_id: ERR_PERIOD_NOT_CLOSED
    applies_to: "POST /perks/revenue-share-statements/{id}/finalize"

  - rule_id: exclusivity-window-free
    priority: 76
    category: temporal
    condition: >
      activation with exclusivity_requested = true while another PartnerAgreement with the same
      (category, region_code), status = ACTIVE and exclusivity_granted = true has an
      exclusivity window that overlaps this one. Windows are HALF-OPEN [start, end): two
      windows that merely touch (existing.end = new.start) do NOT overlap.
    error_id: ERR_EXCLUSIVITY_OVERLAP
    applies_to: "POST /perks/agreements/{id}/activate"

  - rule_id: negotiation-round-budget
    priority: 80
    category: capacity
    condition: "agreement.round_count >= 4 (MAX_NEGOTIATION_ROUNDS)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    applies_to: "POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter"

  - rule_id: offer-inventory-available
    priority: 81
    category: capacity
    condition: "Offer.inventory_limit is not null and inventory_reserved + inventory_redeemed >= inventory_limit"
    error_id: ERR_OFFER_SOLD_OUT
    applies_to: "POST /perks/redemptions"
    note: "Aggregate rule: each individual redemption is valid, the collective count is what fails."

  - rule_id: per-member-redemption-budget
    priority: 82
    category: capacity
    condition: "the membership already has per_member_limit redemptions on this offer with verification_status IN {PENDING, VERIFIED}"
    error_id: ERR_PER_MEMBER_LIMIT
    applies_to: "POST /perks/redemptions"

  - rule_id: featured-slot-capacity
    priority: 83
    category: capacity
    condition: >
      a FEATURED slot would make more than 2 (MAX_CONCURRENT_FEATURED_PER_CATEGORY) FEATURED
      slots with status IN {RESERVED, CONFIRMED} share one (employer_id, Offer.category) over
      intersecting run intervals. Slot intervals are CLOSED [slot_window_start,
      slot_window_end]: a new slot that starts exactly when an existing one ends DOES
      intersect it. STANDARD slots never consume this capacity.
    error_id: ERR_SLOT_CAPACITY_CONFLICT
    applies_to: "POST /perks/offers/{id}/placement-slots"

  - rule_id: merchant-slot-cooldown
    priority: 84
    category: capacity
    condition: >
      the same merchant already holds a FEATURED slot with status IN {RESERVED, CONFIRMED,
      COMPLETED} on the same (employer_id, Offer.category) whose run interval is separated from
      the new one by a GAP of fewer than 7 days (MERCHANT_SLOT_COOLDOWN_DAYS), where
      gap_days = floor((later.slot_window_start - earlier.slot_window_end) / 86400 seconds)
      and an intersecting pair has gap_days = 0. Unlike the capacity rule this one is a
      SEPARATION rule: two runs that do not overlap at all are still refused when the quiet
      period between them is too short.
    error_id: ERR_SLOT_COOLDOWN_CONFLICT
    applies_to: "POST /perks/offers/{id}/placement-slots"

  - rule_id: dispute-info-request-budget
    priority: 85
    category: capacity
    condition: "dispute.info_request_count >= 2 (MAX_INFO_REQUESTS)"
    error_id: ERR_MAX_INFO_REQUESTS
    applies_to: "POST /perks/disputes/{id}/request-info"

  - rule_id: category-coverage-floor
    priority: 86
    category: capacity
    condition: >
      terminating or withdrawing an agreement would drop the number of ACTIVE PartnerAgreements
      for its (category, region_code) to 0 while at least one Employer with
      program_posture = LIVE, region_code = the agreement's region and the category present in
      featured_categories still depends on it
    error_id: ERR_CATEGORY_COVERAGE_FLOOR
    applies_to: "POST /perks/agreements/{id}/terminate"
    note: "Conditional aggregate: the floor only bites when a live storefront actually features that category in that region."

  - rule_id: min-spend-met
    priority: 90
    category: economics
    condition: "the verify request's gross_amount_cents < Offer.min_spend_cents"
    error_id: ERR_MIN_SPEND_NOT_MET
    applies_to: "POST /perks/redemptions/{id}/verify"

  - rule_id: verification-token-matches
    priority: 91
    category: economics
    condition: "the verify request's verification_token != Redemption.verification_token"
    error_id: ERR_VERIFICATION_TOKEN_INVALID
    applies_to: "POST /perks/redemptions/{id}/verify"

  - rule_id: fraud-risk-under-threshold
    priority: 92
    category: economics
    condition: "the AUDIT fraud_risk_score computed at verification is >= 70 (FRAUD_BLOCK_THRESHOLD)"
    error_id: ERR_FRAUD_RISK_BLOCKED
    applies_to: "POST /perks/redemptions/{id}/verify"
    note: "Cascading validation: this rule needs gross_amount_cents to have passed min-spend first, so it is deliberately evaluated after rule min-spend-met."

  - rule_id: goodwill-credit-within-net
    priority: 93
    category: economics
    condition: "the resolve request's outcome_credit_cents > Redemption.net_charged_cents"
    error_id: ERR_CREDIT_EXCEEDS_NET
    applies_to: "POST /perks/disputes/{id}/resolve"

  - rule_id: exclusivity-terms-negotiated
    priority: 94
    category: economics
    condition: "activation with exclusivity_requested = true while the standing round's exclusivity_window_start or exclusivity_window_end is null"
    error_id: ERR_EXCLUSIVITY_TERMS_MISSING
    applies_to: "POST /perks/agreements/{id}/activate"

# ============================================================================
# §1.5 Endpoint Surface
# ============================================================================
# Roles are the §1.7 role names; X-User-ID carries the principal described there.
# `input:` lists request-body (or query-string, for GET) fields; a trailing `?`
# marks an optional field. Path ids are never listed in `input:`.
endpoints:

  # ---- test-harness control plane -----------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin, PartnerManager, Merchant, EmployerAdmin, Employee]
    input: [to_iso8601]
    output: { current_utc: string }
    notes: >
      Mandatory logical clock. Every timestamp comparison in this domain reads the logical
      clock, never the wall clock. The default clock value before any call is
      2026-08-01T00:00:00Z.

  - method: POST
    path: /_ops/run-epoch
    roles: [PlatformAdmin]
    input: []
    output: { expired_offer_count: integer, completed_slot_count: integer, voided_redemption_count: integer, stale_employer_count: integer, default_judged_dispute_count: integer }
    notes: >
      Deterministic sweep evaluated against the current logical clock, in this fixed order:
      (1) offers whose window_end <= clock_now go EXPIRED, (2) CONFIRMED slots whose
      slot_window_end < clock_now go COMPLETED, (3) PENDING redemptions past
      verification_expires_at go VOID with void_reason = VERIFICATION_TTL_EXPIRED,
      (4) SYNCED employers past last_sync_at + 45 days go STALE, (5) OPEN disputes with no
      response past response_deadline_at are default-judged MERCHANT_FAULT. Idempotent: a
      second run over the same clock reports all-zero counts.

  # ---- merchants -----------------------------------------------------------
  - method: POST
    path: /perks/merchants
    roles: [PartnerManager]
    input: [legal_name, contact_email, primary_category, region_codes]
    output: Merchant
    notes: "Created in PROSPECT with fault_event_count 0, fulfillment_failure_score 0, active_agreement_count 0."

  - method: GET
    path: /perks/merchants/{id}
    roles: [PartnerManager, PlatformAdmin, Merchant]
    input: []
    output: Merchant
    notes: "fulfillment_failure_score is recomputed against the current logical clock on every read, so decay is observable without a write."

  - method: GET
    path: /perks/merchants
    roles: [PartnerManager, PlatformAdmin]
    input: ["status?", "primary_category?", "region_code?", "limit?", "offset?"]
    output: Merchant[]
    notes: "region_code filters on membership of region_codes. Default sort: created_at ASC."

  - method: PATCH
    path: /perks/merchants/{id}
    roles: [PartnerManager]
    input: ["contact_email?", "region_codes?"]
    output: Merchant
    notes: "Shrinking region_codes never retro-invalidates existing agreements or offers."

  - method: POST
    path: /perks/merchants/{id}/reinstate
    roles: [PlatformAdmin]
    input: []
    output: Merchant
    notes: "SUSPENDED -> ACTIVE; refused with ERR_MERCHANT_SCORE_NOT_DECAYED while the recomputed fulfillment_failure_score is still >= 40."

  - method: POST
    path: /perks/merchants/{id}/terminate
    roles: [PlatformAdmin]
    input: [terminated_reason]
    output: Merchant
    notes: "Depth-4 cascade over agreements, offers, slots and the ledger; bypasses the category-coverage floor."

  # ---- partner agreements and negotiation ---------------------------------
  - method: POST
    path: /perks/agreements
    roles: [PartnerManager]
    input: ["merchant_id", "category", "region_code", "exclusivity_requested?"]
    output: PartnerAgreement
    notes: "Created in DRAFT with round_count 0 and null standing terms."

  - method: GET
    path: /perks/agreements/{id}
    roles: [PartnerManager, PlatformAdmin, Merchant]
    input: []
    output: PartnerAgreement

  - method: GET
    path: /perks/agreements
    roles: [PartnerManager, PlatformAdmin, Merchant]
    input: ["merchant_id?", "category?", "region_code?", "status?", "exclusivity_granted?", "limit?", "offset?"]
    output: PartnerAgreement[]

  - method: GET
    path: /perks/agreements/{id}/negotiation-rounds
    roles: [PartnerManager, PlatformAdmin, Merchant]
    input: ["limit?", "offset?"]
    output: NegotiationRound[]
    notes: "Append-only history ordered by round_number ASC; rounds are immutable and carry no version field."

  - method: POST
    path: /perks/agreements/{id}/propose
    roles: [PartnerManager]
    input: ["expected_agreement_version", "commission_rate_bps", "placement_fee_base_cents", "employer_revenue_share_bps", "exclusivity_window_start?", "exclusivity_window_end?", "note?"]
    output: PartnerAgreement
    notes: "Creates the next NegotiationRound and republishes the standing terms; also lifts a PROSPECT merchant to IN_NEGOTIATION."

  - method: POST
    path: /perks/agreements/{id}/counter
    roles: [Merchant]
    input: ["expected_agreement_version", "commission_rate_bps", "placement_fee_base_cents", "employer_revenue_share_bps", "exclusivity_window_start?", "exclusivity_window_end?", "note?"]
    output: PartnerAgreement

  - method: POST
    path: /perks/agreements/{id}/decide
    roles: [Merchant, PartnerManager]
    input: ["decision", "note?"]
    output: PartnerAgreement
    notes: >
      decision = ACCEPT moves PROVIDER_PROPOSED -> ACCEPTED (Merchant only) or
      MERCHANT_COUNTERED -> ACCEPTED (PartnerManager only): each side may only accept the
      other side's standing proposal. decision = WITHDRAW moves any of DRAFT,
      PROVIDER_PROPOSED, MERCHANT_COUNTERED to WITHDRAWN and is PartnerManager-only.

  - method: POST
    path: /perks/agreements/{id}/activate
    roles: [PartnerManager]
    input: []
    output: PartnerAgreement
    notes: "ACCEPTED -> ACTIVE; runs the exclusivity overlap check, grants exclusivity and lifts the merchant to ACTIVE."

  - method: POST
    path: /perks/agreements/{id}/terminate
    roles: [PartnerManager, PlatformAdmin]
    input: [terminated_reason]
    output: PartnerAgreement
    notes: "Guarded by the category-coverage floor; cascades the agreement's offers to EXPIRED and their live slots to RELEASED."

  # ---- employer clients ----------------------------------------------------
  - method: POST
    path: /perks/employers
    roles: [PlatformAdmin]
    input: ["name", "region_code", "employee_count_declared", "revenue_share_enabled?", "privacy_min_cohort_size?"]
    output: Employer
    notes: "Created with integration_status NOT_CONFIGURED, storefront_status DRAFT, program_posture SETUP, privacy_min_cohort_size default 8."

  - method: GET
    path: /perks/employers/{id}
    roles: [PlatformAdmin, EmployerAdmin, PartnerManager]
    input: []
    output: Employer
    notes: "eligible_headcount and program_posture are recomputed on read against the current logical clock."

  - method: GET
    path: /perks/employers
    roles: [PlatformAdmin, PartnerManager]
    input: ["region_code?", "program_posture?", "integration_status?", "storefront_status?", "limit?", "offset?"]
    output: Employer[]

  - method: PATCH
    path: /perks/employers/{id}
    roles: [EmployerAdmin, PlatformAdmin]
    input: ["revenue_share_enabled?", "privacy_min_cohort_size?", "employee_count_declared?"]
    output: Employer
    notes: "revenue_share_enabled is read at verification time, so flipping it never rewrites an already-verified redemption's employer_share_cents."

  - method: POST
    path: /perks/employers/{id}/storefront
    roles: [EmployerAdmin]
    input: [brand_color_hex, logo_url, hero_headline, featured_categories]
    output: Employer
    notes: "DRAFT -> BRANDED, or BRANDED -> BRANDED when re-posted; refused from PUBLISHED or SUSPENDED with ERR_EMPLOYER_INVALID_STATE."

  - method: POST
    path: /perks/employers/{id}/storefront/publish
    roles: [EmployerAdmin]
    input: []
    output: Employer

  - method: POST
    path: /perks/employers/{id}/storefront/suspend
    roles: [PlatformAdmin]
    input: [suspension_reason]
    output: Employer
    notes: "Drives program_posture to FROZEN and voids every PENDING redemption of the employer."

  - method: POST
    path: /perks/employers/{id}/eligibility-files
    roles: [EmployerAdmin]
    input: [expected_employer_version, effective_from, checksum, records]
    output: EligibilityFile
    notes: "Creates the batch in RECEIVED and drives integration_status to FILE_RECEIVED; computes record_count, invalid_record_count and valid_record_count immediately."

  - method: GET
    path: /perks/employers/{id}/eligibility-files
    roles: [EmployerAdmin, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: EligibilityFile[]

  - method: GET
    path: /perks/employers/{id}/engagement-report
    roles: [EmployerAdmin, PlatformAdmin]
    input: [period_start, period_end]
    output: { employer_id: string, period_start: string, period_end: string, privacy_min_cohort_size: integer, category_rows: "object[]", suppressed_category_count: integer, total_redemption_count: integer, total_discount_amount_cents: integer, total_distinct_redeemer_count: integer }
    notes: >
      EMPLOYER_SCOPE variant of calculations.engagement_analytics. Each element of
      category_rows is { category, suppressed, redemption_count, discount_amount_cents,
      distinct_redeemer_count } ordered by category ASC. The payload never contains
      membership ids, external_employee_ref values or redemption ids.

  - method: GET
    path: /perks/category-demand
    roles: [PartnerManager, Merchant]
    input: [period_start, period_end]
    output: { period_start: string, period_end: string, partner_min_employer_cohort: integer, category_rows: "object[]", suppressed_category_count: integer, total_redemption_count: integer }
    notes: >
      PARTNER_SCOPE variant of calculations.engagement_analytics. Each element of
      category_rows is { category, suppressed, redemption_count, discount_amount_cents,
      distinct_employer_count }. Employer names and ids are never emitted.

  # ---- eligibility files ---------------------------------------------------
  - method: GET
    path: /perks/eligibility-files/{id}
    roles: [EmployerAdmin, PlatformAdmin]
    input: []
    output: EligibilityFile

  - method: POST
    path: /perks/eligibility-files/{id}/validate
    roles: [EmployerAdmin, PlatformAdmin]
    input: []
    output: EligibilityFile
    notes: "RECEIVED -> VALIDATED or REJECTED purely on calculations.eligibility_file_validation_ratio."

  - method: POST
    path: /perks/eligibility-files/{id}/apply
    roles: [EmployerAdmin]
    input: []
    output: EligibilityFile
    notes: "VALIDATED -> APPLIED; creates/rewrites memberships in records order, suspends omitted memberships, sets last_sync_at and drives integration_status to SYNCED."

  # ---- employee memberships -----------------------------------------------
  - method: GET
    path: /perks/memberships/{id}
    roles: [EmployerAdmin, PlatformAdmin, Employee]
    input: []
    output: EmployeeMembership

  - method: GET
    path: /perks/memberships
    roles: [EmployerAdmin, PlatformAdmin]
    input: ["employer_id?", "source_file_id?", "status?", "employment_status?", "region_code?", "limit?", "offset?"]
    output: EmployeeMembership[]
    notes: "Default sort: created_at ASC, which is exactly the records order of the batch that created the rows, so data[0] is the first record of the first applied batch."

  - method: POST
    path: /perks/memberships/{id}/employment-status
    roles: [EmployerAdmin]
    input: [employment_status]
    output: EmployeeMembership
    notes: "TERMINATED revokes the membership and voids its PENDING redemptions; a REVOKED membership refuses further writes with ERR_MEMBERSHIP_REVOKED."

  # ---- offers --------------------------------------------------------------
  - method: POST
    path: /perks/offers
    roles: [Merchant]
    input: ["agreement_id", "title", "discount_type", "discount_value_bps?", "discount_value_cents?", "min_spend_cents?", "region_codes", "window_start", "window_end", "inventory_limit?", "per_member_limit?"]
    output: Offer
    notes: "Created in DRAFT; merchant_id and category are copied from the agreement and any client-supplied value for them is ignored."

  - method: GET
    path: /perks/offers/{id}
    roles: [Merchant, PartnerManager, PlatformAdmin, EmployerAdmin, Employee]
    input: []
    output: Offer
    notes: "inventory_reserved, inventory_redeemed and sold_out are recomputed on read."

  - method: GET
    path: /perks/offers
    roles: [Merchant, PartnerManager, PlatformAdmin, EmployerAdmin, Employee]
    input: ["agreement_id?", "merchant_id?", "category?", "status?", "region_code?", "sold_out?", "limit?", "offset?"]
    output: Offer[]

  - method: POST
    path: /perks/offers/{id}/submit
    roles: [Merchant]
    input: []
    output: Offer

  - method: POST
    path: /perks/offers/{id}/review
    roles: [PlatformAdmin]
    input: ["decision", "review_note?"]
    output: Offer
    notes: "decision is APPROVE or REJECT; APPROVE additionally requires PartnerAgreement.status = ACTIVE and Merchant.status = ACTIVE."

  - method: POST
    path: /perks/offers/{id}/pause
    roles: [Merchant, PlatformAdmin]
    input: [paused_reason]
    output: Offer

  - method: POST
    path: /perks/offers/{id}/resume
    roles: [Merchant]
    input: []
    output: Offer
    notes: "Refused while the merchant is SUSPENDED, the agreement is not ACTIVE, or the offer window has already closed."

  - method: POST
    path: /perks/offers/{id}/placement-slots
    roles: [Merchant]
    input: [expected_offer_version, employer_id, placement_tier, slot_window_start, slot_window_end]
    output: PlacementSlot
    notes: "Prices the slot through all five steps of calculations.placement_fee_pricing and enforces the FEATURED capacity and merchant cooldown rules."

  # ---- placement slots -----------------------------------------------------
  - method: GET
    path: /perks/placement-slots/{id}
    roles: [Merchant, PartnerManager, PlatformAdmin, EmployerAdmin]
    input: []
    output: PlacementSlot

  - method: GET
    path: /perks/placement-slots
    roles: [Merchant, PartnerManager, PlatformAdmin, EmployerAdmin]
    input: ["offer_id?", "employer_id?", "status?", "placement_tier?", "limit?", "offset?"]
    output: PlacementSlot[]

  - method: POST
    path: /perks/placement-slots/{id}/confirm
    roles: [PartnerManager]
    input: []
    output: PlacementSlot
    notes: "RESERVED -> CONFIRMED; writes the PLACEMENT_FEE ledger entry for placement_fee_cents."

  - method: POST
    path: /perks/placement-slots/{id}/release
    roles: [Merchant, PartnerManager]
    input: [release_reason]
    output: PlacementSlot
    notes: "Releasing a CONFIRMED slot writes the compensating PLACEMENT_FEE_REFUND entry so the slot's ledger nets to zero."

  # ---- redemptions ---------------------------------------------------------
  - method: POST
    path: /perks/redemptions
    roles: [Employee]
    input: [offer_id, membership_id, intended_gross_amount_cents]
    output: Redemption
    notes: >
      Created PENDING/AWAITING with a freshly minted verification_token (returned only here),
      verification_expires_at = created_at + 72 hours and the frozen SCREENING risk score.
      Reserves one inventory unit.

  - method: GET
    path: /perks/redemptions/{id}
    roles: [Employee, Merchant, PlatformAdmin]
    input: []
    output: Redemption
    notes: "EmployerAdmin is refused with ERR_PRIVACY_RESTRICTED even for its own employees' redemptions."

  - method: GET
    path: /perks/redemptions
    roles: [Employee, Merchant, PlatformAdmin]
    input: ["offer_id?", "membership_id?", "employer_id?", "merchant_id?", "statement_id?", "verification_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Redemption[]
    notes: "An Employee sees only its own membership's rows and a Merchant only its own merchant_id's rows, whatever filters are supplied."

  - method: POST
    path: /perks/redemptions/{id}/verify
    roles: [Merchant]
    input: [verification_token, gross_amount_cents]
    output: Redemption
    notes: "PENDING -> VERIFIED or, on an AUDIT score >= 70, PENDING -> FAILED with ERR_FRAUD_RISK_BLOCKED."

  - method: POST
    path: /perks/redemptions/{id}/fulfill
    roles: [Merchant]
    input: []
    output: Redemption

  - method: POST
    path: /perks/redemptions/{id}/void
    roles: [Employee, PlatformAdmin]
    input: []
    output: Redemption

  - method: POST
    path: /perks/redemptions/{id}/disputes
    roles: [Employee]
    input: [reason, description]
    output: Dispute
    notes: "Also moves the redemption's fulfilment dimension to DISPUTED and stamps response_deadline_at = clock_now + 120 hours."

  - method: GET
    path: /perks/redemptions/{id}/ledger-entries
    roles: [PlatformAdmin, Merchant]
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    notes: "Append-only; ordered by created_at ASC. The money-conservation invariant is checked here."

  # ---- disputes ------------------------------------------------------------
  - method: GET
    path: /perks/disputes/{id}
    roles: [Merchant, PlatformAdmin, Employee]
    input: []
    output: Dispute

  - method: GET
    path: /perks/disputes
    roles: [Merchant, PlatformAdmin, Employee]
    input: ["redemption_id?", "raised_by_membership_id?", "merchant_id?", "status?", "limit?", "offset?"]
    output: Dispute[]

  - method: POST
    path: /perks/disputes/{id}/respond
    roles: [Merchant]
    input: ["response_note", "remedy_offered_cents?"]
    output: Dispute

  - method: POST
    path: /perks/disputes/{id}/request-info
    roles: [PlatformAdmin]
    input: []
    output: Dispute
    notes: "MERCHANT_RESPONDED -> INFO_REQUESTED, resetting response_deadline_at; capped at 2 requests."

  - method: POST
    path: /perks/disputes/{id}/resolve
    roles: [PlatformAdmin]
    input: ["outcome", "outcome_credit_cents?"]
    output: Dispute
    notes: "outcome is MERCHANT_FAULT or NO_FAULT; outcome_credit_cents defaults to 0 and is forced to 0 on NO_FAULT."

  # ---- revenue share statements -------------------------------------------
  - method: POST
    path: /perks/revenue-share-statements
    roles: [PartnerManager, PlatformAdmin]
    input: [employer_id, period_start, period_end, basis]
    output: RevenueShareStatement
    notes: "Created in DRAFT with all totals at 0; nothing is computed until finalize."

  - method: GET
    path: /perks/revenue-share-statements/{id}
    roles: [PartnerManager, PlatformAdmin, EmployerAdmin]
    input: []
    output: RevenueShareStatement

  - method: GET
    path: /perks/revenue-share-statements
    roles: [PartnerManager, PlatformAdmin, EmployerAdmin]
    input: ["employer_id?", "status?", "basis?", "limit?", "offset?"]
    output: RevenueShareStatement[]

  - method: POST
    path: /perks/revenue-share-statements/{id}/finalize
    roles: [PartnerManager]
    input: []
    output: RevenueShareStatement
    notes: "DRAFT or REOPENED -> FINALIZED; recomputes every total from the basis variant and stamps statement_id onto the included redemptions."

  - method: POST
    path: /perks/revenue-share-statements/{id}/pay
    roles: [PlatformAdmin]
    input: [payment_reference]
    output: RevenueShareStatement
    notes: "FINALIZED -> PAID only; a REOPENED statement must be re-finalized first."

  # ---- ledger --------------------------------------------------------------
  - method: GET
    path: /perks/ledger-entries/{id}
    roles: [PlatformAdmin]
    input: []
    output: LedgerEntry

  - method: GET
    path: /perks/ledger-entries
    roles: [PlatformAdmin, PartnerManager]
    input: ["redemption_id?", "placement_slot_id?", "statement_id?", "employer_id?", "merchant_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    notes: "Immutable rows: no PATCH, no DELETE and no version field."

# ============================================================================
# §1.6 Error Catalog
# ============================================================================
errors:

  # ---- identity (band 10-19) ----------------------------------------------
  - error_id: ERR_IDENTITY_REQUIRED
    http_status: 401
    condition: "X-User-ID header absent or empty"
    raised_by: "every /perks endpoint"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the caller's role is not listed for the endpoint, or a proposer tries to accept its own standing proposal"
    raised_by: "every /perks endpoint; POST /perks/agreements/{id}/decide"
  - error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    condition: "the role is allowed but the row belongs to another merchant, employer or membership"
    raised_by: "every scoped read and write"
  - error_id: ERR_PRIVACY_RESTRICTED
    http_status: 403
    condition: "an EmployerAdmin asks for individual redemption or dispute detail instead of the aggregated report"
    raised_by: "GET /perks/redemptions, GET /perks/redemptions/{id}, GET /perks/disputes/{id}"

  # ---- existence (band 20-29) ---------------------------------------------
  - error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    condition: "no Merchant with the given id"
    raised_by: "GET/PATCH /perks/merchants/{id}, POST /perks/merchants/{id}/*, POST /perks/agreements (merchant_id)"
  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    condition: "no PartnerAgreement with the given id"
    raised_by: "GET /perks/agreements/{id}, POST /perks/agreements/{id}/*, POST /perks/offers (agreement_id)"
  - error_id: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    condition: "no Employer with the given id"
    raised_by: "GET/PATCH /perks/employers/{id}, POST /perks/employers/{id}/*, POST /perks/offers/{id}/placement-slots (employer_id), POST /perks/revenue-share-statements (employer_id)"
  - error_id: ERR_ELIGIBILITY_FILE_NOT_FOUND
    http_status: 404
    condition: "no EligibilityFile with the given id"
    raised_by: "GET /perks/eligibility-files/{id}, POST /perks/eligibility-files/{id}/*"
  - error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    condition: "no EmployeeMembership with the given id"
    raised_by: "GET /perks/memberships/{id}, POST /perks/memberships/{id}/employment-status, POST /perks/redemptions (membership_id)"
  - error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    condition: "no Offer with the given id"
    raised_by: "GET /perks/offers/{id}, POST /perks/offers/{id}/*, POST /perks/redemptions (offer_id)"
  - error_id: ERR_PLACEMENT_SLOT_NOT_FOUND
    http_status: 404
    condition: "no PlacementSlot with the given id"
    raised_by: "GET /perks/placement-slots/{id}, POST /perks/placement-slots/{id}/*"
  - error_id: ERR_REDEMPTION_NOT_FOUND
    http_status: 404
    condition: "no Redemption with the given id"
    raised_by: "GET /perks/redemptions/{id}, POST /perks/redemptions/{id}/*, GET /perks/redemptions/{id}/ledger-entries"
  - error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    condition: "no Dispute with the given id"
    raised_by: "GET /perks/disputes/{id}, POST /perks/disputes/{id}/*"
  - error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    condition: "no RevenueShareStatement with the given id"
    raised_by: "GET /perks/revenue-share-statements/{id}, POST /perks/revenue-share-statements/{id}/*"
  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    condition: "no LedgerEntry with the given id"
    raised_by: "GET /perks/ledger-entries/{id}"

  # ---- schema (band 30-39) ------------------------------------------------
  - error_id: ERR_VALIDATION
    http_status: 422
    condition: "a required input field is missing, null, blank, of the wrong type or outside its documented range"
    raised_by: "every write endpoint"
  - error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    condition: "an enum input carries a value outside its constraint set"
    raised_by: "every write endpoint with an enum input"
  - error_id: ERR_INVALID_PAGINATION
    http_status: 422
    condition: "limit outside 1..100, negative offset, or a non-integer value for either"
    raised_by: "every list endpoint"
  - error_id: ERR_INVALID_WINDOW
    http_status: 422
    condition: "an interval's end is less than or equal to its start"
    raised_by: "POST /perks/offers, POST /perks/offers/{id}/placement-slots, POST /perks/revenue-share-statements, POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter"
  - error_id: ERR_DISCOUNT_SHAPE_MISMATCH
    http_status: 422
    condition: "discount_type and the supplied discount_value_* pair disagree"
    raised_by: "POST /perks/offers"
  - error_id: ERR_REGION_NOT_COVERED
    http_status: 422
    condition: "an agreement region is outside the merchant footprint, an offer's regions are not a subset of it, or the redeeming member's region is outside the offer's regions"
    raised_by: "POST /perks/agreements, POST /perks/offers, POST /perks/redemptions"
  - error_id: ERR_DUPLICATE_EMPLOYEE_REF
    http_status: 422
    condition: "two records elements of one eligibility batch share an external_employee_ref"
    raised_by: "POST /perks/employers/{id}/eligibility-files"

  # ---- concurrency (band 40-49) -------------------------------------------
  - error_id: ERR_STALE_VERSION
    http_status: 412
    condition: "the echoed expected_<parent>_version does not match the parent's current version"
    raised_by: "POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter, POST /perks/offers/{id}/placement-slots, POST /perks/employers/{id}/eligibility-files"

  # ---- own-state (band 50-59) ---------------------------------------------
  - error_id: ERR_MERCHANT_INVALID_STATE
    http_status: 409
    condition: "the merchant is not in a state from which the requested trigger is declared, e.g. reinstating a merchant that is not SUSPENDED or terminating an already TERMINATED merchant"
    raised_by: "POST /perks/merchants/{id}/reinstate, POST /perks/merchants/{id}/terminate"
  - error_id: ERR_MERCHANT_SCORE_NOT_DECAYED
    http_status: 409
    condition: "reinstating a SUSPENDED merchant whose recomputed fulfillment_failure_score is still >= 40"
    raised_by: "POST /perks/merchants/{id}/reinstate"
  - error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    condition: "the agreement's status does not permit the requested negotiation, decision, activation or termination"
    raised_by: "POST /perks/agreements/{id}/propose, /counter, /decide, /activate, /terminate"
  - error_id: ERR_DUPLICATE_AGREEMENT
    http_status: 409
    condition: "an open or active agreement already exists for the same (merchant_id, category, region_code)"
    raised_by: "POST /perks/agreements"
  - error_id: ERR_EMPLOYER_INVALID_STATE
    http_status: 409
    condition: "the storefront or integration dimension does not permit the requested transition, e.g. branding a PUBLISHED storefront or publishing a DRAFT one"
    raised_by: "POST /perks/employers/{id}/storefront, /storefront/publish, /storefront/suspend"
  - error_id: ERR_FILE_INVALID_STATE
    http_status: 409
    condition: "validating a batch that is not RECEIVED, or applying one that is not VALIDATED"
    raised_by: "POST /perks/eligibility-files/{id}/validate, POST /perks/eligibility-files/{id}/apply"
  - error_id: ERR_MEMBERSHIP_REVOKED
    http_status: 409
    condition: "an employment-status write targets a REVOKED membership"
    raised_by: "POST /perks/memberships/{id}/employment-status"
  - error_id: ERR_OFFER_INVALID_STATE
    http_status: 409
    condition: "the offer's status does not permit submit, review, pause, resume or slot reservation"
    raised_by: "POST /perks/offers/{id}/submit, /review, /pause, /resume, /placement-slots"
  - error_id: ERR_SLOT_INVALID_STATE
    http_status: 409
    condition: "confirming a slot that is not RESERVED, or releasing one that is already RELEASED or COMPLETED"
    raised_by: "POST /perks/placement-slots/{id}/confirm, POST /perks/placement-slots/{id}/release"
  - error_id: ERR_REDEMPTION_INVALID_STATE
    http_status: 409
    condition: "verifying, voiding, fulfilling or disputing a redemption whose relevant dimension does not permit it"
    raised_by: "POST /perks/redemptions/{id}/verify, /void, /fulfill, /disputes"
  - error_id: ERR_DISPUTE_INVALID_STATE
    http_status: 409
    condition: "responding to a resolved dispute, requesting info from a state other than MERCHANT_RESPONDED, or resolving an already resolved dispute"
    raised_by: "POST /perks/disputes/{id}/respond, /request-info, /resolve"
  - error_id: ERR_STATEMENT_INVALID_STATE
    http_status: 409
    condition: "finalizing a PAID statement or paying a DRAFT or REOPENED one"
    raised_by: "POST /perks/revenue-share-statements/{id}/finalize, POST /perks/revenue-share-statements/{id}/pay"

  # ---- cross-entity state (band 60-69) ------------------------------------
  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    condition: "the offer's PartnerAgreement is not ACTIVE"
    raised_by: "POST /perks/offers, POST /perks/offers/{id}/submit, /review, /resume"
  - error_id: ERR_MERCHANT_SUSPENDED
    http_status: 409
    condition: "the acting or referenced merchant is SUSPENDED or TERMINATED"
    raised_by: "POST /perks/offers, POST /perks/offers/{id}/submit, /resume, /placement-slots, POST /perks/redemptions"
  - error_id: ERR_MEMBERSHIP_NOT_ELIGIBLE
    http_status: 409
    condition: "the redeeming membership is SUSPENDED or REVOKED, or its employment_status is TERMINATED"
    raised_by: "POST /perks/redemptions, POST /perks/redemptions/{id}/verify"
  - error_id: ERR_PROGRAM_NOT_LIVE
    http_status: 409
    condition: "the employer's program_posture is SETUP"
    raised_by: "POST /perks/redemptions, POST /perks/offers/{id}/placement-slots, POST /perks/placement-slots/{id}/confirm"
  - error_id: ERR_PROGRAM_FROZEN
    http_status: 409
    condition: "the employer's program_posture is FROZEN (storefront suspended)"
    raised_by: "POST /perks/redemptions, POST /perks/redemptions/{id}/verify, POST /perks/offers/{id}/placement-slots, POST /perks/placement-slots/{id}/confirm"
  - error_id: ERR_PROGRAM_RESTRICTED
    http_status: 409
    condition: "the employer's program_posture is RESTRICTED (published storefront on a stale eligibility feed) and a NEW redemption is requested"
    raised_by: "POST /perks/redemptions"

  # ---- temporal (band 70-79) ----------------------------------------------
  - error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 422
    condition: "clock_now is outside the offer's half-open [window_start, window_end)"
    raised_by: "POST /perks/redemptions"
  - error_id: ERR_MEMBERSHIP_WINDOW_CLOSED
    http_status: 422
    condition: "clock_now is outside the membership's half-open [eligibility_valid_from, eligibility_valid_until)"
    raised_by: "POST /perks/redemptions"
  - error_id: ERR_VERIFICATION_EXPIRED
    http_status: 422
    condition: "clock_now is at or after verification_expires_at (created_at + 72 hours)"
    raised_by: "POST /perks/redemptions/{id}/verify"
  - error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    condition: "clock_now is at or after verified_at + 30 days"
    raised_by: "POST /perks/redemptions/{id}/disputes"
  - error_id: ERR_DISPUTE_DEADLINE_PASSED
    http_status: 422
    condition: "clock_now is at or after the dispute's response_deadline_at"
    raised_by: "POST /perks/disputes/{id}/respond"
  - error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    condition: "finalizing a statement whose period_end is not strictly in the past"
    raised_by: "POST /perks/revenue-share-statements/{id}/finalize"
  - error_id: ERR_EXCLUSIVITY_OVERLAP
    http_status: 409
    condition: "granting exclusivity would overlap a live exclusivity window on the same (category, region_code); half-open windows that merely touch do not overlap"
    raised_by: "POST /perks/agreements/{id}/activate"

  # ---- capacity (band 80-89) ----------------------------------------------
  - error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    condition: "a 5th negotiation round is attempted on one agreement"
    raised_by: "POST /perks/agreements/{id}/propose, POST /perks/agreements/{id}/counter"
  - error_id: ERR_OFFER_SOLD_OUT
    http_status: 409
    condition: "inventory_reserved + inventory_redeemed has reached inventory_limit"
    raised_by: "POST /perks/redemptions"
  - error_id: ERR_PER_MEMBER_LIMIT
    http_status: 409
    condition: "the membership already holds per_member_limit live redemptions on this offer"
    raised_by: "POST /perks/redemptions"
  - error_id: ERR_SLOT_CAPACITY_CONFLICT
    http_status: 409
    condition: "a third FEATURED slot run would overlap two existing runs in one (employer_id, category); slot intervals are closed, so runs that merely touch still collide"
    raised_by: "POST /perks/offers/{id}/placement-slots"
  - error_id: ERR_SLOT_COOLDOWN_CONFLICT
    http_status: 409
    condition: "the same merchant's previous FEATURED run on the same (employer_id, category) is separated from the new one by fewer than 7 days"
    raised_by: "POST /perks/offers/{id}/placement-slots"
  - error_id: ERR_MAX_INFO_REQUESTS
    http_status: 409
    condition: "a third information request is attempted on one dispute"
    raised_by: "POST /perks/disputes/{id}/request-info"
  - error_id: ERR_CATEGORY_COVERAGE_FLOOR
    http_status: 409
    condition: "terminating the last ACTIVE agreement for a (category, region) that a LIVE employer storefront still features"
    raised_by: "POST /perks/agreements/{id}/terminate"

  # ---- economics and privacy (band 90-99) ---------------------------------
  - error_id: ERR_MIN_SPEND_NOT_MET
    http_status: 422
    condition: "the verified gross_amount_cents is below the offer's min_spend_cents"
    raised_by: "POST /perks/redemptions/{id}/verify"
  - error_id: ERR_VERIFICATION_TOKEN_INVALID
    http_status: 422
    condition: "the echoed verification_token does not match the one minted at creation"
    raised_by: "POST /perks/redemptions/{id}/verify"
  - error_id: ERR_FRAUD_RISK_BLOCKED
    http_status: 422
    condition: "the AUDIT fraud_risk_score at verification is >= 70"
    raised_by: "POST /perks/redemptions/{id}/verify"
  - error_id: ERR_CREDIT_EXCEEDS_NET
    http_status: 422
    condition: "the goodwill credit on a merchant-fault resolution exceeds the redemption's net_charged_cents"
    raised_by: "POST /perks/disputes/{id}/resolve"
  - error_id: ERR_EXCLUSIVITY_TERMS_MISSING
    http_status: 422
    condition: "exclusivity is requested but the standing negotiation round carries no exclusivity window"
    raised_by: "POST /perks/agreements/{id}/activate"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:

  - role: PlatformAdmin
    identity: opaque
    identity_notes: "X-User-ID carries an opaque platform staff identifier such as admin-001; it is never an entity id and is never scope-checked."
    exclusive_operations:
      - "POST /perks/employers (onboard an employer client)"
      - "POST /perks/employers/{id}/storefront/suspend"
      - "POST /perks/offers/{id}/review"
      - "POST /perks/merchants/{id}/reinstate"
      - "POST /perks/merchants/{id}/terminate"
      - "POST /perks/disputes/{id}/request-info"
      - "POST /perks/disputes/{id}/resolve"
      - "POST /perks/revenue-share-statements/{id}/pay"
      - "POST /_ops/run-epoch"
      - "GET /perks/ledger-entries/{id}"
    shared_operations:
      - "POST /perks/agreements/{id}/terminate (with PartnerManager)"
      - "POST /perks/offers/{id}/pause (with Merchant)"
      - "POST /perks/redemptions/{id}/void (with Employee)"
      - "POST /perks/eligibility-files/{id}/validate (with EmployerAdmin)"
      - "POST /perks/revenue-share-statements (with PartnerManager)"
      - "PATCH /perks/employers/{id} (with EmployerAdmin)"
      - "every GET except GET /perks/employers/{id}/engagement-report and GET /perks/category-demand"
    cannot:
      - "propose, counter or accept negotiation terms"
      - "create offers or redemptions"
      - "finalize a revenue share statement (segregation of duties: the finalizer and the payer are different roles)"

  - role: PartnerManager
    identity: opaque
    identity_notes: "X-User-ID carries an opaque provider staff identifier such as pm-001; it is never an entity id and is never scope-checked."
    exclusive_operations:
      - "POST /perks/merchants and PATCH /perks/merchants/{id}"
      - "POST /perks/agreements"
      - "POST /perks/agreements/{id}/propose"
      - "POST /perks/agreements/{id}/activate"
      - "POST /perks/placement-slots/{id}/confirm"
      - "POST /perks/revenue-share-statements/{id}/finalize"
    shared_operations:
      - "POST /perks/agreements/{id}/decide (ACCEPT only from MERCHANT_COUNTERED; WITHDRAW is PartnerManager-only)"
      - "POST /perks/agreements/{id}/terminate (with PlatformAdmin)"
      - "POST /perks/placement-slots/{id}/release (with Merchant)"
      - "POST /perks/revenue-share-statements (with PlatformAdmin)"
      - "GET /perks/category-demand (with Merchant)"
      - "GET /perks/ledger-entries (with PlatformAdmin)"
      - "reads of merchants, agreements, negotiation rounds, employers, offers, slots and statements"
    cannot:
      - "counter its own proposal or accept a proposal it authored (ERR_UNAUTHORIZED)"
      - "read GET /perks/redemptions/{id} or any individual redemption"
      - "pay a statement it finalized"

  - role: Merchant
    identity: entity_backed:Merchant
    identity_notes: "X-User-ID carries the Merchant.id of the acting partner; every merchant-scoped row is matched against it."
    exclusive_operations:
      - "POST /perks/agreements/{id}/counter"
      - "POST /perks/offers"
      - "POST /perks/offers/{id}/submit"
      - "POST /perks/offers/{id}/resume"
      - "POST /perks/offers/{id}/placement-slots"
      - "POST /perks/redemptions/{id}/verify"
      - "POST /perks/redemptions/{id}/fulfill"
      - "POST /perks/disputes/{id}/respond"
    shared_operations:
      - "POST /perks/agreements/{id}/decide (ACCEPT only, and only from PROVIDER_PROPOSED)"
      - "POST /perks/offers/{id}/pause (with PlatformAdmin)"
      - "POST /perks/placement-slots/{id}/release (with PartnerManager)"
      - "GET /perks/category-demand (with PartnerManager)"
      - "GET /perks/redemptions and GET /perks/redemptions/{id}, narrowed to its own merchant_id"
      - "GET /perks/redemptions/{id}/ledger-entries (with PlatformAdmin)"
    cannot:
      - "propose the first round or activate an agreement"
      - "confirm its own placement slot (ERR_UNAUTHORIZED): reservation and confirmation are split across the two peer roles"
      - "touch another merchant's agreements, offers, slots, redemptions or disputes (ERR_SCOPE_VIOLATION)"
      - "read an employer's engagement report"

  - role: EmployerAdmin
    identity: entity_backed:Employer
    identity_notes: "X-User-ID carries the Employer.id of the client organisation; every employer-scoped row is matched against it."
    exclusive_operations:
      - "POST /perks/employers/{id}/storefront"
      - "POST /perks/employers/{id}/storefront/publish"
      - "POST /perks/employers/{id}/eligibility-files"
      - "POST /perks/eligibility-files/{id}/apply"
      - "POST /perks/memberships/{id}/employment-status"
      - "GET /perks/employers/{id}/engagement-report"
    shared_operations:
      - "POST /perks/eligibility-files/{id}/validate (with PlatformAdmin)"
      - "PATCH /perks/employers/{id} (with PlatformAdmin)"
      - "reads of its own employer row, eligibility files, memberships, offers, slots and statements"
    cannot:
      - "read an individual Redemption or Dispute (ERR_PRIVACY_RESTRICTED) - only the aggregated engagement report"
      - "suspend its own storefront (ERR_UNAUTHORIZED): only the platform may freeze a program"
      - "touch another employer's rows (ERR_SCOPE_VIOLATION)"
      - "create or verify redemptions"

  - role: Employee
    identity: entity_backed:EmployeeMembership
    identity_notes: "X-User-ID carries the EmployeeMembership.id of the acting employee; the employer never acts on the employee's behalf."
    exclusive_operations:
      - "POST /perks/redemptions"
      - "POST /perks/redemptions/{id}/disputes"
    shared_operations:
      - "POST /perks/redemptions/{id}/void (with PlatformAdmin)"
      - "GET /perks/redemptions and GET /perks/redemptions/{id}, narrowed to its own membership_id"
      - "GET /perks/disputes and GET /perks/disputes/{id}, narrowed to its own membership_id"
      - "GET /perks/memberships/{id} for its own row; GET /perks/offers and GET /perks/offers/{id}"
    cannot:
      - "verify or fulfil its own redemption (ERR_UNAUTHORIZED): only the merchant may"
      - "read another employee's redemptions or disputes (ERR_SCOPE_VIOLATION)"
      - "write its own employment_status"
