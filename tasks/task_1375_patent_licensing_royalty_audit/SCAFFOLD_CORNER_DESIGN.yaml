              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingAnalyst
              captures: { r_fin: $.data.final_royalty_cents }
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l_bal: $.data.outstanding_balance_cents }
          assert:
            - "captured r_fin == 10000 (computed 10000 ties floor 10000)"
            - "captured l_bal == 10000 (no double accrual)"
      - name: underreport_screening_flag_path
        claim_type: correct_result
