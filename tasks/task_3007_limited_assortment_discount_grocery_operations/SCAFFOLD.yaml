scenario: "Limited-Assortment Discount Grocery Operations (Aldi U.S.): fixed narrow assortment with one or two options per category and rigorous SKU-count discipline, private-label supplier tendering with dual-source requirements and blind quality panels, shelf-ready packaging and pallet-display merchandising to minimize labor per case, cart-deposit and bring-your-own-bag policies with coin-return reconciliation, weekly Finds promotional buys with one-time quantity and no replenishment, cashier scan-rate performance standards and multi-barcode packaging design, store labor model with multi-role staffing and minimal replenishment shifts, quality guarantee double-refund policy and claim tracking"

domain_name: "limited-assortment-grocery"
api_prefix: "/v1"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique short category code, e.g. DAIRY, BAKERY"
        constraints: "unique across all categories"
      - name: name
        type: string
        source: input
        description: "Display name of the category"
      - name: sku_cap
        type: integer
        source: input
        description: "Maximum number of ACTIVE products allowed in this category at any time (limited-assortment discipline)"
        default: 2
        constraints: "1 <= sku_cap <= 5"
      - name: active_sku_count
        type: integer
        source: computed
        description: "Count of Product rows in this category whose status is ACTIVE (calculation category_sku_count)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN = new products may be activated; LOCKED = assortment full (active_sku_count == sku_cap), no further activations"
        default: OPEN
        constraints: "enum {OPEN, LOCKED}"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal supplier name"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"
      - name: quality_score
        type: number
        source: computed
        description: "Rolling quality history score 0..100 used in tender_award_score; starts at 80.0, recomputed when a tender this supplier participated in reaches AWARDED (winners +2, disqualified bidders -5, others unchanged), clamped to [0,100]"
        default: 80.0
      - name: status
        type: enum
        source: system
        description: "Supplier lifecycle; SUSPENDED suppliers cannot bid"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; owning category (limited assortment)"
      - name: sku_code
        type: string
        source: input
        description: "Globally unique SKU code"
        constraints: "unique across all products"
      - name: name
        type: string
        source: input
        description: "Product display name"
      - name: kind
        type: enum
        source: input
        description: "CORE = permanent line item subject to category sku_cap; FINDS = weekly promotional one-time buy, exempt from sku_cap but must be shelf-ready"
        constraints: "enum {CORE, FINDS}"
      - name: shelf_ready_packaging
        type: boolean
        source: input
        description: "True when the case ships in shelf-ready / pallet-display packaging (no decanting labor)"
      - name: barcode_count
        type: integer
        source: input
        description: "Number of scannable barcodes printed on the unit (multi-barcode design for scan-rate)"
        constraints: "barcode_count >= 1; when shelf_ready_packaging is true, barcode_count >= 2"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Target landed cost per unit in cents"
      - name: price_cents
        type: integer
        source: input
        description: "Shelf price per unit in cents"
      - name: primary_supplier_id
        type: string
        source: computed
        description: "FK -> Supplier.id; primary source assigned by tender award (nullable until awarded)"
        constraints: "nullable"
      - name: secondary_supplier_id
        type: string
        source: computed
        description: "FK -> Supplier.id; dual-source backup assigned by tender award, MUST differ from primary (nullable until awarded)"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "PROPOSED until dual-source tender award activates it; DISCONTINUED can be reactivated"
        default: PROPOSED
        constraints: "enum {PROPOSED, ACTIVE, DISCONTINUED}"

  - name: SupplierTender
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the private-label product being tendered"
      - name: bid_ceiling_cents
        type: integer
        source: input
        description: "Maximum acceptable unit cost; bids above are disqualified"
      - name: min_sources
        type: integer
        source: input
        description: "Number of distinct suppliers required to award (dual-source policy)"
        default: 2
        constraints: "fixed at 2 for this domain"
      - name: status
        type: enum
        source: system
        description: "Tender lifecycle; EVALUATING may loop back to OPEN via retender"
        default: DRAFT
        constraints: "enum {DRAFT, OPEN, CLOSED, EVALUATING, AWARDED, CANCELLED}"
      - name: winning_primary_bid_id
        type: string
        source: computed
        description: "References TenderBid.id (set by award); winning primary bid id (nullable until awarded)"
        constraints: "nullable"
      - name: winning_secondary_bid_id
        type: string
        source: computed
        description: "References TenderBid.id (set by award); winning secondary bid id from a different supplier (nullable until awarded)"
        constraints: "nullable"

  - name: TenderBid
    parent: null
    common_fields: true
    fields:
      - name: tender_id
        type: string
        source: input
        description: "FK -> SupplierTender.id; tender this bid belongs to"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; bidding supplier (one bid per supplier per tender)"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Offered unit cost in cents"
      - name: award_score
        type: number
        source: computed
        description: "Composite score from calculation tender_award_score; null until tender evaluation"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle driven by evaluation and award"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, ELIGIBLE, DISQUALIFIED, AWARDED_PRIMARY, AWARDED_SECONDARY, NOT_SELECTED}"

  - name: BlindQualityPanel
    parent: null
    common_fields: true
    fields:
      - name: bid_id
        type: string
        source: input
        description: "FK -> TenderBid.id; the bid whose sample is panel-tested (blind: no supplier identity on the panel)"
      - name: sample_code
        type: string
        source: input
        description: "Opaque blind sample code; MUST NOT equal or contain the supplier id or supplier name"
      - name: score
        type: integer
        source: computed
        description: "Blind panel score 0..100; null until scored"
        constraints: "nullable; 0 <= score <= 100"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> SCORED -> LOCKED; locked once tender evaluation consumes it"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, SCORED, LOCKED}"

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique store code"
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Store display name"
      - name: tier
        type: enum
        source: input
        description: "Store volume tier used by finds_allocation_waterfall"
        constraints: "enum {STANDARD, HIGH_VOLUME}"
      - name: weekly_labor_budget_cents
        type: integer
        source: input
        description: "Weekly labor spend ceiling for replenishment windows"
      - name: coins_outstanding
        type: integer
        source: computed
        description: "Coins currently held by customers in carts: INSERT - RETURN - CORRAL_COLLECT + AUDIT_ADJUST (calculation cart_coin_reconciliation); never negative"
        default: 0
      - name: coin_liability_cents
        type: integer
        source: computed
        description: "coins_outstanding * 25 (quarter deposit per cart)"
        default: 0
      - name: refund_liability_cents
        type: integer
        source: computed
        description: "Sum of refund_amount_cents over claims in status APPROVED for this store"
        default: 0
      - name: refund_paid_cents
        type: integer
        source: computed
        description: "Cumulative refund_amount_cents over claims that reached PAID"
        default: 0
      - name: finds_sell_through_pct
        type: number
        source: computed
        description: "Percentage 0..100 of allocated Finds quantity sold across this store's allocations in terminal sell states; recomputed when any of its allocations reaches SOLD_OUT or CLOSED"
        default: 0.0
      - name: status
        type: enum
        source: system
        description: "Store lifecycle"
        default: ACTIVE
        constraints: "enum {ACTIVE, CLOSED}"

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; employing store"
      - name: name
        type: string
        source: input
        description: "Employee full name"
      - name: role
        type: enum
        source: input
        description: "Multi-role staffing model role"
        constraints: "enum {CASHIER, STOCKER, SHIFT_LEAD}"
      - name: status
        type: enum
        source: system
        description: "Employment status"
        default: ACTIVE
        constraints: "enum {ACTIVE, INACTIVE}"

  - name: FindsBuy
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; must reference a FINDS product in status ACTIVE"
      - name: week_start_date
        type: string
        source: input
        description: "ISO date; first sale day of the weekly Finds window"
      - name: week_end_date
        type: string
        source: input
        description: "ISO date; last sale day (inclusive) of the weekly Finds window; must be >= week_start_date"
      - name: total_quantity
        type: integer
        source: input
        description: "One-time buy quantity; no replenishment is ever allowed"
        constraints: "total_quantity >= 1"
      - name: allocated_quantity
        type: integer
        source: computed
        description: "Sum of allocated_quantity over all FindsAllocation rows of this buy"
        default: 0
      - name: remaining_quantity
        type: integer
        source: computed
        description: "allocated_quantity minus sum of sold_quantity over its allocations"
        default: 0
      - name: status
        type: enum
        source: system
        description: "PLANNED -> ALLOCATED -> ON_SALE -> SOLD_OUT | CLOSED"
        default: PLANNED
        constraints: "enum {PLANNED, ALLOCATED, ON_SALE, SOLD_OUT, CLOSED}"

  - name: FindsAllocation
    parent: null
    common_fields: true
    fields:
      - name: finds_buy_id
        type: string
        source: computed
        description: "FK -> FindsBuy.id; owning buy (set by allocation planning)"
      - name: store_id
        type: string
        source: computed
        description: "FK -> Store.id; receiving store (set by allocation planning)"
      - name: allocated_quantity
        type: integer
        source: computed
        description: "Units allocated to this store by the waterfall"
      - name: sold_quantity
        type: integer
        source: computed
        description: "Units sold via the sell endpoint"
        default: 0
      - name: remaining_quantity
        type: integer
        source: computed
        description: "allocated_quantity - sold_quantity"
      - name: sale_start_date
        type: string
        source: computed
        description: "ISO date; first sellable day (from buy window, or clearance window once in CLEARANCE)"
      - name: sale_end_date
        type: string
        source: computed
        description: "ISO date; last sellable day, inclusive"
      - name: clearance_markdown_pct
        type: number
        source: input
        description: "Markdown fraction applied on clearance (e.g. 0.30); null until clearance"
        constraints: "nullable; 0 < clearance_markdown_pct < 1"
      - name: clearance_value_cents
        type: integer
        source: computed
        description: "Result of calculation clearance_markdown_value at clearance time; null otherwise"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "RESERVED -> ON_SALE -> SOLD_OUT | CLEARANCE -> CLOSED"
        default: RESERVED
        constraints: "enum {RESERVED, ON_SALE, SOLD_OUT, CLEARANCE, CLOSED}"

  - name: CartCoinEvent
    parent: null
    common_fields: false
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store whose cart fleet the event affects"
      - name: event_type
        type: enum
        source: input
        description: "INSERT = customer deposits a coin; RETURN = coin returned to customer; CORRAL_COLLECT = staff collect stray coins back to float; AUDIT_ADJUST = signed reconciliation adjustment"
        constraints: "enum {INSERT, RETURN, CORRAL_COLLECT, AUDIT_ADJUST}"
      - name: coin_count
        type: integer
        source: input
        description: "Number of coins; positive for INSERT/RETURN/CORRAL_COLLECT, signed for AUDIT_ADJUST"

  - name: RegisterShift
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store of the register"
      - name: cashier_id
        type: string
        source: input
        description: "FK -> Employee.id; the cashier staffing the register (must have role CASHIER)"
      - name: started_at
        type: datetime
        source: system
        description: "Server logical clock timestamp at shift open"
      - name: closed_at
        type: datetime
        source: system
        description: "Server logical clock timestamp at shift close; null while OPEN"
        constraints: "nullable"
      - name: items_scanned
        type: integer
        source: computed
        description: "Cumulative scanned items from scan events"
        default: 0
      - name: voids
        type: integer
        source: computed
        description: "Cumulative voided items from scan events"
        default: 0
      - name: provisional_scan_rate
        type: number
        source: computed
        description: "Provisional variant of calculation scan_rate, recomputed on every scan event"
        default: 0.0
      - name: final_scan_rate
        type: number
        source: computed
        description: "Final variant of calculation scan_rate, computed once at close; null while OPEN"
        constraints: "nullable"
      - name: compliance
        type: enum
        source: computed
        description: "COMPLIANT when final_scan_rate >= 1000 else BELOW_STANDARD; null while OPEN"
        constraints: "nullable; enum {COMPLIANT, BELOW_STANDARD}"
      - name: status
        type: enum
        source: system
        description: "OPEN -> CLOSED"
        default: OPEN
        constraints: "enum {OPEN, CLOSED}"

  - name: LaborWindow
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store being staffed"
      - name: aisle_zone
        type: string
        source: input
        description: "Aisle zone being replenished; overlap checks are scoped per (store_id, aisle_zone)"
      - name: role
        type: enum
        source: input
        description: "Staffing role booked into the window"
        constraints: "enum {CASHIER, STOCKER, SHIFT_LEAD}"
      - name: starts_at
        type: datetime
        source: input
        description: "Window start (ISO8601 UTC); half-open interval [starts_at, ends_at)"
      - name: ends_at
        type: datetime
        source: input
        description: "Window end (ISO8601 UTC); must be after starts_at"
      - name: cost_cents
        type: integer
        source: computed
        description: "Calculation labor_window_cost result"
      - name: status
        type: enum
        source: system
        description: "PLANNED -> CONFIRMED -> CANCELLED"
        default: PLANNED
        constraints: "enum {PLANNED, CONFIRMED, CANCELLED}"

  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; claimed product"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store of purchase (refund liability accrues here)"
      - name: quantity
        type: integer
        source: input
        description: "Units claimed"
        constraints: "quantity >= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price paid per unit in cents"
      - name: purchase_date
        type: string
        source: input
        description: "ISO date of purchase; must be within 45 days (inclusive) of the server logical clock at filing"
      - name: reason
        type: enum
        source: input
        description: "QUALITY_DEFECT triggers the double-refund guarantee; DAMAGED and OTHER use standard refund"
        constraints: "enum {QUALITY_DEFECT, DAMAGED, OTHER}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Calculation double_refund result; set at approval, null before"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "FILED -> UNDER_REVIEW -> APPROVED -> PAID; DISPUTED loops back to UNDER_REVIEW; APPROVED may be RESCINDED"
        default: FILED
        constraints: "enum {FILED, UNDER_REVIEW, DISPUTED, APPROVED, PAID, REJECTED, RESCINDED}"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Category
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system auto-transition when active_sku_count reaches sku_cap after a product activation"
        actor: system
        preconditions: ["active_sku_count == sku_cap"]
        side_effects: ["Category.updated_at refreshed", "Category.version increments by 1"]
      - from: LOCKED
        to: OPEN
        trigger: "system auto-transition when active_sku_count drops below sku_cap after a product discontinuation"
        actor: system
        preconditions: ["active_sku_count < sku_cap"]
        side_effects: ["Category.updated_at refreshed", "Category.version increments by 1"]

  - entity: Product
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system auto-transition inside POST /v1/tenders/{id}/award when both dual-source suppliers are assigned"
        actor: system
        preconditions:
          - "Product.category_id references a Category with status OPEN"
          - "Category.active_sku_count < Category.sku_cap for kind CORE (FINDS exempt)"
        side_effects:
          - "Product.primary_supplier_id and secondary_supplier_id set from winning bids"
          - "calculation category_sku_count recomputes Category.active_sku_count (which may auto-LOCK the Category)"
          - "Product.updated_at refreshed, Product.version increments by 1"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /v1/products/{id}/discontinue"
        actor: CategoryManager
        preconditions: ["Product.status == ACTIVE"]
        side_effects:
          - "calculation category_sku_count recomputes Category.active_sku_count (which may auto-OPEN the Category)"
          - "Product.updated_at refreshed, Product.version increments by 1"
      - from: DISCONTINUED
        to: ACTIVE
        trigger: "POST /v1/products/{id}/reactivate"
        actor: CategoryManager
        preconditions:
          - "Product.status == DISCONTINUED"
          - "Product.category_id references a Category with status OPEN"
          - "Category.active_sku_count < Category.sku_cap for kind CORE (FINDS exempt)"
        side_effects:
          - "calculation category_sku_count recomputes Category.active_sku_count (which may auto-LOCK the Category)"
          - "Product.updated_at refreshed, Product.version increments by 1"

  - entity: SupplierTender
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /v1/tenders/{id}/open"
        actor: ProcurementLead
        preconditions: ["SupplierTender.status == DRAFT"]
        side_effects: ["SupplierTender.updated_at refreshed", "SupplierTender.version increments by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/tenders/{id}/close"
        actor: ProcurementLead
        preconditions: ["SupplierTender.status == OPEN"]
        side_effects: ["SupplierTender.updated_at refreshed", "SupplierTender.version increments by 1"]
      - from: CLOSED
        to: EVALUATING
        trigger: "POST /v1/tenders/{id}/evaluate"
        actor: ProcurementLead
        preconditions:
          - "SupplierTender.status == CLOSED"
          - "every TenderBid of this tender has exactly one BlindQualityPanel and every such panel has status SCORED"
        side_effects:
          - "calculation tender_award_score computes award_score for each bid and sets each bid status to ELIGIBLE or DISQUALIFIED"
          - "every BlindQualityPanel of this tender's bids transitions SCORED -> LOCKED"
          - "SupplierTender.updated_at refreshed, SupplierTender.version increments by 1"
      - from: EVALUATING
        to: AWARDED
        trigger: "POST /v1/tenders/{id}/award"
        actor: ProcurementLead
        preconditions:
          - "SupplierTender.status == EVALUATING"
          - "primary_bid_id and secondary_bid_id reference ELIGIBLE bids of this tender from two distinct suppliers"
          - "tendered Product is in status PROPOSED and (for kind CORE) its Category has active_sku_count < sku_cap"
        side_effects:
          - "winning bids -> AWARDED_PRIMARY / AWARDED_SECONDARY; all other bids of the tender -> NOT_SELECTED"
          - "Product.primary_supplier_id and secondary_supplier_id set from winning bids; Product transitions PROPOSED -> ACTIVE"
          - "Product activation triggers calculation category_sku_count which updates Category.active_sku_count and may auto-transition the Category OPEN -> LOCKED"
          - "Supplier.quality_score recomputed for every supplier that bid (winners +2, disqualified -5, clamped [0,100])"
          - "SupplierTender.updated_at refreshed, SupplierTender.version increments by 1"
      - from: EVALUATING
        to: OPEN
        trigger: "POST /v1/tenders/{id}/retender (fewer than min_sources ELIGIBLE bids from distinct suppliers)"
        actor: ProcurementLead
        preconditions:
          - "SupplierTender.status == EVALUATING"
          - "count of ELIGIBLE bids from distinct suppliers < min_sources"
        side_effects:
          - "all bids revert to SUBMITTED with award_score null"
          - "BlindQualityPanel rows of this tender's bids revert LOCKED -> SCORED"
          - "SupplierTender.updated_at refreshed, SupplierTender.version increments by 1"
        note: "cyclic retender loop: EVALUATING -> OPEN -> CLOSED -> EVALUATING"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/tenders/{id}/cancel"
        actor: ProcurementLead
        preconditions: ["SupplierTender.status in {DRAFT, OPEN}"]
        side_effects: ["SupplierTender.updated_at refreshed", "SupplierTender.version increments by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /v1/tenders/{id}/cancel"
        actor: ProcurementLead
        preconditions: ["SupplierTender.status in {DRAFT, OPEN}"]
        side_effects: ["SupplierTender.updated_at refreshed", "SupplierTender.version increments by 1"]

  - entity: TenderBid
    initial_state: SUBMITTED
    terminal_states: [AWARDED_PRIMARY, AWARDED_SECONDARY, NOT_SELECTED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "system during POST /v1/tenders/{id}/evaluate when tender_award_score >= 0 (panel score >= 60 and unit_cost_cents <= bid_ceiling_cents)"
        actor: system
        preconditions: ["owning SupplierTender transitions CLOSED -> EVALUATING"]
        side_effects: ["award_score set", "TenderBid.updated_at refreshed, version increments by 1"]
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "system during POST /v1/tenders/{id}/evaluate when panel score < 60 or unit_cost_cents > bid_ceiling_cents"
        actor: system
        preconditions: ["owning SupplierTender transitions CLOSED -> EVALUATING"]
        side_effects: ["award_score set to -1.0 marker", "TenderBid.updated_at refreshed, version increments by 1"]
      - from: ELIGIBLE
        to: AWARDED_PRIMARY
        trigger: "system during POST /v1/tenders/{id}/award when selected as primary_bid_id"
        actor: system
        preconditions: ["owning SupplierTender transitions EVALUATING -> AWARDED"]
        side_effects: ["TenderBid.updated_at refreshed, version increments by 1"]
      - from: ELIGIBLE
        to: AWARDED_SECONDARY
        trigger: "system during POST /v1/tenders/{id}/award when selected as secondary_bid_id"
        actor: system
        preconditions: ["owning SupplierTender transitions EVALUATING -> AWARDED"]
        side_effects: ["TenderBid.updated_at refreshed, version increments by 1"]
      - from: ELIGIBLE
        to: NOT_SELECTED
        trigger: "system during POST /v1/tenders/{id}/award when not selected"
        actor: system
        preconditions: ["owning SupplierTender transitions EVALUATING -> AWARDED"]
        side_effects: ["TenderBid.updated_at refreshed, version increments by 1"]
      - from: ELIGIBLE
        to: SUBMITTED
        trigger: "system during POST /v1/tenders/{id}/retender"
        actor: system
        preconditions: ["owning SupplierTender transitions EVALUATING -> OPEN"]
        side_effects: ["award_score reset to null", "TenderBid.updated_at refreshed, version increments by 1"]
      - from: DISQUALIFIED
        to: SUBMITTED
        trigger: "system during POST /v1/tenders/{id}/retender"
        actor: system
        preconditions: ["owning SupplierTender transitions EVALUATING -> OPEN"]
        side_effects: ["award_score reset to null", "TenderBid.updated_at refreshed, version increments by 1"]

  - entity: BlindQualityPanel
    initial_state: SCHEDULED
    terminal_states: [LOCKED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /v1/panels/{id}/score"
        actor: QualityAssuranceLead
        preconditions:
          - "BlindQualityPanel.status == SCHEDULED"
          - "owning bid's tender is in status OPEN or CLOSED"
        side_effects: ["score set", "BlindQualityPanel.updated_at refreshed, version increments by 1"]
      - from: SCORED
        to: LOCKED
        trigger: "system during POST /v1/tenders/{id}/evaluate"
        actor: system
        preconditions: ["owning bid's tender transitions CLOSED -> EVALUATING"]
        side_effects: ["BlindQualityPanel.updated_at refreshed, version increments by 1"]
      - from: LOCKED
        to: SCORED
        trigger: "system during POST /v1/tenders/{id}/retender"
        actor: system
        preconditions: ["owning bid's tender transitions EVALUATING -> OPEN"]
        side_effects: ["BlindQualityPanel.updated_at refreshed, version increments by 1"]

  - entity: Store
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH not offered; store closure is out of scope (kept terminal for future use)"
        actor: system
        preconditions: []
        side_effects: []
        note: "no endpoint transitions a store to CLOSED in v1; status exists for ledger semantics"

  - entity: FindsBuy
    initial_state: PLANNED
    terminal_states: [SOLD_OUT, CLOSED]
    transitions:
      - from: PLANNED
        to: ALLOCATED
        trigger: "POST /v1/finds-buys/{id}/allocations"
        actor: CategoryManager
        preconditions:
          - "FindsBuy.status == PLANNED"
          - "at least one Store with status ACTIVE exists"
        side_effects:
          - "calculation finds_allocation_waterfall creates one FindsAllocation per ACTIVE store (status RESERVED)"
          - "FindsBuy.allocated_quantity and remaining_quantity recomputed"
          - "FindsBuy.version increments by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /v1/finds-buys/{id}/allocations (supersede: re-plan replaces the prior draft plan)"
        actor: CategoryManager
        preconditions:
          - "FindsBuy.status == ALLOCATED"
          - "expected_finds_buy_version matches current FindsBuy.version"
        side_effects:
          - "all existing FindsAllocation rows of this buy (all still RESERVED) are deleted and recreated by finds_allocation_waterfall"
          - "FindsBuy.allocated_quantity and remaining_quantity recomputed"
          - "FindsBuy.version increments by 1"
      - from: ALLOCATED
        to: ON_SALE
        trigger: "POST /v1/finds-buys/{id}/activate"
        actor: CategoryManager
        preconditions:
          - "FindsBuy.status == ALLOCATED"
          - "FindsBuy.allocated_quantity == FindsBuy.total_quantity (full conservation of the one-time buy)"
          - "tendered Product.status == ACTIVE"
          - "for every allocation store: no other ON_SALE or CLEARANCE allocation of that store has an inclusive sale window overlapping [week_start_date, week_end_date]"
        side_effects:
          - "every FindsAllocation of this buy transitions RESERVED -> ON_SALE with sale window copied from the buy"
          - "FindsBuy.version increments by 1"
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system auto-transition when remaining_quantity reaches 0 after a sell"
        actor: system
        preconditions: ["remaining_quantity == 0"]
        side_effects:
          - "Store.finds_sell_through_pct recomputed for every store holding an allocation of this buy"
          - "FindsBuy.version increments by 1"
      - from: ON_SALE
        to: CLOSED
        trigger: "POST /v1/finds-buys/{id}/close (week ended with unsold stock)"
        actor: CategoryManager
        preconditions:
          - "FindsBuy.status == ON_SALE"
          - "server logical clock date is after week_end_date"
          - "no allocation of this buy is in status ON_SALE (all SOLD_OUT, CLEARANCE, or CLOSED)"
        side_effects:
          - "Store.finds_sell_through_pct recomputed for every store holding an allocation of this buy"
          - "FindsBuy.version increments by 1"

  - entity: FindsAllocation
    initial_state: RESERVED
    terminal_states: [SOLD_OUT, CLOSED]
    transitions:
      - from: RESERVED
        to: ON_SALE
        trigger: "system during POST /v1/finds-buys/{id}/activate"
        actor: system
        preconditions: ["owning FindsBuy transitions ALLOCATED -> ON_SALE"]
        side_effects: ["sale_start_date/sale_end_date copied from buy window", "FindsAllocation.version increments by 1"]
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system auto-transition when a sell leaves remaining_quantity == 0"
        actor: system
        preconditions: ["remaining_quantity == 0"]
        side_effects:
          - "FindsBuy.remaining_quantity recomputed; if 0 the FindsBuy auto-transitions ON_SALE -> SOLD_OUT (which recomputes Store.finds_sell_through_pct)"
          - "FindsAllocation.version increments by 1"
      - from: ON_SALE
        to: CLEARANCE
        trigger: "POST /v1/allocations/{id}/clearance"
        actor: StoreManager
        preconditions:
          - "FindsAllocation.status == ON_SALE"
          - "remaining_quantity > 0"
          - "clearance_start_date >= sale_end_date + 1 day (mandatory clearance gap)"
        side_effects:
          - "calculation clearance_markdown_value computes clearance_value_cents"
          - "sale window replaced by [clearance_start_date, clearance_end_date]"
          - "FindsAllocation.version increments by 1"
      - from: CLEARANCE
        to: SOLD_OUT
        trigger: "system auto-transition when a sell leaves remaining_quantity == 0"
        actor: system
        preconditions: ["remaining_quantity == 0"]
        side_effects:
          - "FindsBuy.remaining_quantity recomputed; if 0 the FindsBuy auto-transitions ON_SALE -> SOLD_OUT"
          - "FindsAllocation.version increments by 1"
      - from: CLEARANCE
        to: CLOSED
        trigger: "system during POST /v1/finds-buys/{id}/close when clearance window ended with unsold stock"
        actor: system
        preconditions: ["owning FindsBuy transitions ON_SALE -> CLOSED"]
        side_effects: ["FindsAllocation.version increments by 1"]

  - entity: RegisterShift
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/register-shifts/{id}/close"
        actor: StoreManager
        preconditions:
          - "RegisterShift.status == OPEN"
          - "RegisterShift.store_id matches acting StoreManager's store"
        side_effects:
          - "closed_at set from server logical clock"
          - "calculation scan_rate final variant computes final_scan_rate and compliance"
          - "RegisterShift.version increments by 1"

  - entity: LaborWindow
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /v1/labor-windows/{id}/confirm"
        actor: StoreManager
        preconditions:
          - "LaborWindow.status == PLANNED"
          - "LaborWindow.store_id matches acting StoreManager's store"
        side_effects: ["LaborWindow.version increments by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/labor-windows/{id}/cancel"
        actor: StoreManager
        preconditions: ["LaborWindow.status in {PLANNED, CONFIRMED}"]
        side_effects: ["cost removed from weekly labor spend aggregation", "LaborWindow.version increments by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/labor-windows/{id}/cancel"
        actor: StoreManager
        preconditions: ["LaborWindow.status in {PLANNED, CONFIRMED}"]
        side_effects: ["cost removed from weekly labor spend aggregation", "LaborWindow.version increments by 1"]

  - entity: QualityClaim
    initial_state: FILED
    terminal_states: [PAID, REJECTED, RESCINDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /v1/claims/{id}/review"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status in {FILED, DISPUTED}"]
        side_effects: ["QualityClaim.version increments by 1"]
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /v1/claims/{id}/review (re-review after dispute)"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status in {FILED, DISPUTED}"]
        side_effects: ["QualityClaim.version increments by 1"]
        note: "cyclic dispute loop: UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/claims/{id}/approve"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status == UNDER_REVIEW"]
        side_effects:
          - "calculation double_refund computes refund_amount_cents"
          - "Store.refund_liability_cents increases by refund_amount_cents"
          - "QualityClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /v1/claims/{id}/reject"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status == UNDER_REVIEW"]
        side_effects: ["QualityClaim.version increments by 1"]
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /v1/claims/{id}/dispute"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status == UNDER_REVIEW"]
        side_effects: ["QualityClaim.version increments by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /v1/claims/{id}/pay"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status == APPROVED"]
        side_effects:
          - "Store.refund_liability_cents decreases by refund_amount_cents"
          - "Store.refund_paid_cents increases by refund_amount_cents"
          - "QualityClaim.version increments by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /v1/claims/{id}/rescind (compensating action reversing the approval)"
        actor: CustomerServiceAgent
        preconditions: ["QualityClaim.status == APPROVED"]
        side_effects:
          - "Store.refund_liability_cents decreases by refund_amount_cents (approval fully compensated)"
          - "QualityClaim.version increments by 1"

# =============================================================================
# Concurrency Rules (OCC on parent version only; see SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: finds-allocation-plan-stale-buy
    parent_entity: FindsBuy
    write_endpoint: "POST /v1/finds-buys/{id}/allocations"
    occ_field: "expected_finds_buy_version"
    description: |
      Re-planning allocations against a FindsBuy whose version has advanced
      since the client last read it is rejected. A superseding re-plan
      legitimately replaces the prior draft plan, so a client holding a stale
      view must re-read before re-planning.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: category-cap-update-stale
    parent_entity: Category
    write_endpoint: "PATCH /v1/categories/{id}"
    occ_field: "expected_category_version"
    description: |
      Updating sku_cap against a Category whose version has advanced since the
      client last read it is rejected. A cap change based on a stale assortment
      view could silently violate SKU discipline, so the client must re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: category_sku_count
    trigger: "whenever a CORE Product of the category is activated (award, reactivate) or discontinued"
    algorithm: aggregation
    formula: |
      active_sku_count = count(Product where product.category_id == category.id
                               AND product.kind == CORE AND product.status == ACTIVE)
      if active_sku_count >= sku_cap: category.status = LOCKED
      if active_sku_count <  sku_cap: category.status = OPEN
    input_set: "Products of the category with kind CORE and status ACTIVE only; PROPOSED and DISCONTINUED excluded; FINDS products excluded"
    constants: {}
    precision: "integer count"

  - name: tender_award_score
    trigger: "POST /v1/tenders/{id}/evaluate, for each bid of the tender"
    algorithm: weighted_scoring
    formula: |
      panel = the bid's BlindQualityPanel.score
      if panel < PANEL_MIN_SCORE or bid.unit_cost_cents > tender.bid_ceiling_cents:
          award_score = -1.0  (bid DISQUALIFIED)
      else:
          price_score = 100.0 * (tender.bid_ceiling_cents - bid.unit_cost_cents) / tender.bid_ceiling_cents
          award_score = round_half_up(W_PANEL * panel + W_PRICE * price_score + W_QUALITY * supplier.quality_score, 2)
      Selection for award: primary = ELIGIBLE bid with highest award_score;
      tie-break 1: lower unit_cost_cents; tie-break 2: earlier bid created_at.
      secondary = highest-scored ELIGIBLE bid whose supplier != primary supplier
      (same tie-breaks). id is never used for ranking or tie-breaks.
    input_set: "all TenderBid rows of the tender regardless of SUBMITTED status; each bid's single BlindQualityPanel; each bid's Supplier.quality_score"
    constants:
      W_PANEL: 0.5
      W_PRICE: 0.3
      W_QUALITY: 0.2
      PANEL_MIN_SCORE: 60
    precision: "2 decimal places, round_half_up"

  - name: finds_allocation_waterfall
    trigger: "POST /v1/finds-buys/{id}/allocations"
    algorithm: waterfall_allocation
    formula: |
      stores = all Store with status ACTIVE
      present_tiers = tiers of stores, in priority order [HIGH_VOLUME, STANDARD]
      shares renormalize over present tiers: if only one tier present, its share = 1.0
      For each tier in priority order:
        tier_pool = floor(total_quantity * TIER_SHARE[tier])
        per_store_quota = floor(tier_pool / count(stores in tier))
        assign per_store_quota to each store of the tier
      allocated_so_far = sum of assigned quotas
      leftover = total_quantity - allocated_so_far
      Distribute leftover one unit at a time to stores ordered by
      (tier priority, store created_at ASC) until leftover == 0.
      Each store's FindsAllocation.allocated_quantity = quota + leftover share.
      Evaluation order is pinned as above; id never participates in ordering.
    input_set: "Stores with status ACTIVE only; FindsBuy.total_quantity"
    constants:
      TIER_SHARE_HIGH_VOLUME: 0.6
      TIER_SHARE_STANDARD: 0.4
    precision: "integer units; floor for quotas"

  - name: clearance_markdown_value
    trigger: "POST /v1/allocations/{id}/clearance"
    algorithm: aggregation
    formula: |
      clearance_unit_cents = round_half_up(product.price_cents * (1 - clearance_markdown_pct), 0)
      clearance_value_cents = clearance_unit_cents * allocation.remaining_quantity
      PINNED ORDER: round per unit FIRST, then multiply by quantity.
      (The alternative order round_half_up(price * (1-pct) * qty) can differ by cents;
      the per-unit-first order is the contract.)
    input_set: "the allocation's remaining_quantity at clearance time; Product.price_cents; request clearance_markdown_pct"
    constants: {}
    precision: "unit cents integer, round_half_up"

  - name: scan_rate
    trigger: "provisional variant: on every POST /v1/register-shifts/{id}/scan; final variant: on POST /v1/register-shifts/{id}/close"
    algorithm: threshold
    formula: |
      provisional_scan_rate = round_half_up(items_scanned * 3600.0 / max(elapsed_seconds_since_started_at, 1), 2)
      final_scan_rate       = round_half_up((items_scanned - VOID_PENALTY * voids) * 3600.0 / max(closed_at - started_at in seconds, 1), 2)
      compliance = COMPLIANT if final_scan_rate >= SCAN_TARGET else BELOW_STANDARD
      Boundary: exactly SCAN_TARGET is COMPLIANT (>=, not >).
    input_set: "the shift's own items_scanned, voids, started_at, closed_at; server logical clock for elapsed time"
    constants:
      SCAN_TARGET: 1000
      VOID_PENALTY: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "while shift is OPEN, recomputed on each scan event"
        difference: "uses elapsed time so far and ignores voids; diverges from final whenever voids > 0 or the shift keeps running"
      - name: final
        when: "exactly once at shift close"
        difference: "deducts VOID_PENALTY items per void and uses full shift duration; drives compliance"

  - name: double_refund
    trigger: "POST /v1/claims/{id}/approve"
    algorithm: aggregation
    formula: |
      if claim.reason == QUALITY_DEFECT:
          refund_amount_cents = round_half_up(unit_price_cents * quantity * GUARANTEE_MULTIPLIER, 0)
      else:
          refund_amount_cents = round_half_up(unit_price_cents * quantity * STANDARD_MULTIPLIER, 0)
    input_set: "the claim's unit_price_cents, quantity, reason"
    constants:
      GUARANTEE_MULTIPLIER: 2.0
      STANDARD_MULTIPLIER: 1.0
    precision: "integer cents, round_half_up"
    variants:
      - name: standard
        when: "reason in {DAMAGED, OTHER}"
        difference: "1x refund of amount paid"
      - name: guarantee
        when: "reason == QUALITY_DEFECT"
        difference: "2x refund under the quality double-refund guarantee; identical inputs yield exactly double the standard variant"

  - name: cart_coin_reconciliation
    trigger: "on every POST /v1/stores/{id}/cart-coin-events and on GET /v1/stores/{id}/cart-reconciliation"
    algorithm: chronological
    formula: |
      Process the store's CartCoinEvent rows in created_at ASC order (tie-break: none needed,
      timestamps carry 3 fractional digits; never order by id):
        INSERT:          outstanding += coin_count
        RETURN:          outstanding -= coin_count
        CORRAL_COLLECT:  outstanding -= coin_count
        AUDIT_ADJUST:    outstanding += coin_count (signed)
      A RETURN, CORRAL_COLLECT, or AUDIT_ADJUST that would make outstanding negative
      is rejected with ERR_COIN_BALANCE_NEGATIVE (checked against the running prefix).
      coin_liability_cents = outstanding * COIN_VALUE_CENTS
    input_set: "all CartCoinEvent rows of the store, no status filter (append-only log)"
    constants:
      COIN_VALUE_CENTS: 25
    precision: "integer coins and cents"

  - name: labor_window_cost
    trigger: "POST /v1/stores/{id}/labor-windows (computed before budget validation)"
    algorithm: threshold
    formula: |
      hours = round_half_up((ends_at - starts_at) in seconds / 3600.0, 2)
      cost_cents = round_half_up(hours * ROLE_RATE_CENTS_PER_HOUR[role], 0)
      Weekly spend = sum of cost_cents over the store's LaborWindow rows with
      status in {PLANNED, CONFIRMED} whose starts_at falls in the same ISO week
      (Monday 00:00 UTC .. next Monday 00:00 UTC, half-open) as the new window.
      New window rejected when weekly_spend + cost_cents > store.weekly_labor_budget_cents.
    input_set: "the store's non-cancelled LaborWindow rows in the same ISO week; store.weekly_labor_budget_cents"
    constants:
      ROLE_RATE_CENTS_PER_HOUR_CASHIER: 1700
      ROLE_RATE_CENTS_PER_HOUR_STOCKER: 1800
      ROLE_RATE_CENTS_PER_HOUR_SHIFT_LEAD: 2400
    precision: "hours 2 decimal places round_half_up; cost integer cents round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles; entity_backed ownership checks (StoreManager.store_id == resource store, Cashier == shift cashier, SupplierRep == bid supplier)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body well-formed: all required fields present, correct types, enum members valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path id and body FK reference resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target resource in a state that permits the operation (tender OPEN for bids, shift OPEN for scans, claim reviewable, buy PLANNED/ALLOCATED for planning, allocation ON_SALE/CLEARANCE for sell, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "blind-panel integrity: sample_code must not equal/contain the bidding supplier's id or name; panels exist exactly one per bid"
    error_id: ERR_BLIND_VIOLATION
    http_status: 422
    applies_to: ["POST /v1/bids/{id}/panels"]
  - priority: 7
    category: business_temporal
    check: "interval rules: labor window half-open overlap per (store, aisle_zone); sale-window inclusive overlap per store; clearance gap >= 1 day; claim purchase_date within 45 days; sell within allocation sale window; finds close after week_end_date"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /v1/stores/{id}/labor-windows", "POST /v1/finds-buys/{id}/activate", "POST /v1/allocations/{id}/clearance", "POST /v1/claims", "POST /v1/allocations/{id}/sell", "POST /v1/finds-buys/{id}/close"]
  - priority: 8
    category: business_constraint
    check: "structural rules: SKU cap, dual-source distinctness, unique sku_code, shelf-ready multi-barcode minimums, one bid per supplier per tender, allocation conservation, no Finds replenishment, weekly window count limit"
    error_id: ERR_BUSINESS_CONSTRAINT
    http_status: 409
    applies_to: ["POST /v1/products", "POST /v1/products/{id}/reactivate", "POST /v1/tenders/{id}/award", "POST /v1/tenders/{id}/bids", "POST /v1/finds-buys/{id}/allocations", "POST /v1/finds-buys/{id}/activate", "POST /v1/stores/{id}/labor-windows"]
  - priority: 9
    category: business_fiscal
    check: "money rules last: bid ceiling, weekly labor budget, cart coin balance floor, sell quantity <= remaining"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: ["POST /v1/tenders/{id}/bids", "POST /v1/stores/{id}/labor-windows", "POST /v1/stores/{id}/cart-coin-events", "POST /v1/allocations/{id}/sell"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Categories ---
  - method: POST
    path: "/v1/categories"
    description: "Create a category with SKU cap (limited-assortment discipline)"
    roles: [CategoryManager]
    code: 201
    input: [code, name, "sku_cap?"]
    output: Category
    side_effects: ["Category created in status OPEN with active_sku_count 0"]
  - method: GET
    path: "/v1/categories"
    description: "List categories with pagination"
    roles: [CategoryManager, ProcurementLead, OperationsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Category[]
    side_effects: []
  - method: GET
    path: "/v1/categories/{id}"
    description: "Fetch one category"
    roles: [CategoryManager, ProcurementLead, OperationsAdmin]
    code: 200
    input: []
    output: Category
    side_effects: []
  - method: PATCH
    path: "/v1/categories/{id}"
    description: "Update sku_cap under OCC; reducing below current active count rejected"
    roles: [CategoryManager]
    code: 200
    input: [sku_cap, expected_category_version]
    output: Category
    side_effects:
      - "increments Category.version by 1"
      - "recalculates Category.status (OPEN/LOCKED) against the new cap"

  # --- Suppliers ---
  - method: POST
    path: "/v1/suppliers"
    description: "Register a supplier"
    roles: [ProcurementLead]
    code: 201
    input: [name, contact_email]
    output: Supplier
    side_effects: []
  - method: GET
    path: "/v1/suppliers/{id}"
    description: "Fetch one supplier"
    roles: [ProcurementLead, CategoryManager, QualityAssuranceLead]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: GET
    path: "/v1/suppliers/{id}/products"
    description: "List products sourced from this supplier as primary or secondary"
    roles: [ProcurementLead, CategoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/v1/suppliers/{id}/bids"
    description: "List bids placed by this supplier"
    roles: [ProcurementLead, QualityAssuranceLead]
    code: 200
    input: ["limit?", "offset?"]
    output: TenderBid[]
    side_effects: []

  # --- Products ---
  - method: POST
    path: "/v1/products"
    description: "Create a product (starts PROPOSED; activation only via tender award or reactivate)"
    roles: [CategoryManager]
    code: 201
    input: [category_id, sku_code, name, kind, shelf_ready_packaging, barcode_count, unit_cost_cents, price_cents]
    output: Product
    side_effects: []
  - method: GET
    path: "/v1/products"
    description: "List products, filterable by category/kind/status"
    roles: [CategoryManager, ProcurementLead, OperationsAdmin, CustomerServiceAgent]
    code: 200
    input: ["category_id?", "kind?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/v1/products/{id}"
    description: "Fetch one product"
    roles: [CategoryManager, ProcurementLead, OperationsAdmin, CustomerServiceAgent]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/v1/products/{id}/discontinue"
    description: "Discontinue an ACTIVE product"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["calculation category_sku_count recomputes Category.active_sku_count and may auto-OPEN the Category"]
  - method: POST
    path: "/v1/products/{id}/reactivate"
    description: "Reactivate a DISCONTINUED product if category has cap room"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["calculation category_sku_count recomputes Category.active_sku_count and may auto-LOCK the Category"]
  - method: GET
    path: "/v1/products/{id}/tenders"
    description: "List tenders for this product"
    roles: [ProcurementLead, CategoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplierTender[]
    side_effects: []

  # --- Tenders ---
  - method: POST
    path: "/v1/tenders"
    description: "Create a private-label supplier tender for a product"
    roles: [ProcurementLead]
    code: 201
    input: [product_id, bid_ceiling_cents, "min_sources?"]
    output: SupplierTender
    side_effects: []
  - method: GET
    path: "/v1/tenders/{id}"
    description: "Fetch one tender"
    roles: [ProcurementLead, QualityAssuranceLead, CategoryManager]
    code: 200
    input: []
    output: SupplierTender
    side_effects: []
  - method: POST
    path: "/v1/tenders/{id}/open"
    description: "Open a DRAFT tender for bids"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: SupplierTender
    side_effects: []
  - method: POST
    path: "/v1/tenders/{id}/close"
    description: "Close an OPEN tender to new bids"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: SupplierTender
    side_effects: []
  - method: POST
    path: "/v1/tenders/{id}/evaluate"
    description: "Score all bids (requires all panels SCORED); marks bids ELIGIBLE/DISQUALIFIED and locks panels"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: SupplierTender
    side_effects:
      - "calculation tender_award_score runs for every bid"
      - "BlindQualityPanel rows transition SCORED -> LOCKED"
  - method: POST
    path: "/v1/tenders/{id}/award"
    description: "Award primary and secondary bids from distinct suppliers; activates the product"
    roles: [ProcurementLead]
    code: 200
    input: [primary_bid_id, secondary_bid_id]
    output: SupplierTender
    side_effects:
      - "winning bids -> AWARDED_PRIMARY/AWARDED_SECONDARY; others -> NOT_SELECTED"
      - "Product suppliers set; Product PROPOSED -> ACTIVE; category_sku_count cascade may LOCK the Category"
      - "Supplier.quality_score recomputed for participating suppliers"
  - method: POST
    path: "/v1/tenders/{id}/retender"
    description: "Loop EVALUATING back to OPEN when dual-source requirement unmet"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: SupplierTender
    side_effects: ["bids revert to SUBMITTED with award_score null", "panels revert LOCKED -> SCORED"]
  - method: POST
    path: "/v1/tenders/{id}/cancel"
    description: "Cancel a DRAFT or OPEN tender"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: SupplierTender
    side_effects: []

  # --- Bids ---
  - method: POST
    path: "/v1/tenders/{id}/bids"
    description: "Supplier submits a bid on an OPEN tender (one per supplier per tender)"
    roles: [SupplierRep]
    code: 201
    input: [supplier_id, unit_cost_cents]
    output: TenderBid
    side_effects: []
  - method: GET
    path: "/v1/tenders/{id}/bids"
    description: "List bids of a tender"
    roles: [ProcurementLead, QualityAssuranceLead]
    code: 200
    input: ["limit?", "offset?"]
    output: TenderBid[]
    side_effects: []
  - method: GET
    path: "/v1/bids/{id}"
    description: "Fetch one bid"
    roles: [ProcurementLead, QualityAssuranceLead, SupplierRep]
    code: 200
    input: []
    output: TenderBid
    side_effects: []

  # --- Blind quality panels ---
  - method: POST
    path: "/v1/bids/{id}/panels"
    description: "Schedule a blind quality panel for a bid (opaque sample code; no supplier identity)"
    roles: [QualityAssuranceLead]
    code: 201
    input: [sample_code]
    output: BlindQualityPanel
    side_effects: []
  - method: GET
    path: "/v1/panels"
    description: "List panels, filterable by bid"
    roles: [QualityAssuranceLead, ProcurementLead]
    code: 200
    input: ["bid_id?", "status?", "limit?", "offset?"]
    output: BlindQualityPanel[]
    side_effects: []
  - method: GET
    path: "/v1/panels/{id}"
    description: "Fetch one panel"
    roles: [QualityAssuranceLead, ProcurementLead]
    code: 200
    input: []
    output: BlindQualityPanel
    side_effects: []
  - method: POST
    path: "/v1/panels/{id}/score"
    description: "Record the blind panel score 0..100"
    roles: [QualityAssuranceLead]
    code: 200
    input: [score]
    output: BlindQualityPanel
    side_effects: ["panel transitions SCHEDULED -> SCORED"]

  # --- Stores ---
  - method: POST
    path: "/v1/stores"
    description: "Create a store"
    roles: [OperationsAdmin]
    code: 201
    input: [code, name, tier, weekly_labor_budget_cents]
    output: Store
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}"
    description: "Fetch one store with computed ledger fields"
    roles: [OperationsAdmin, StoreManager, CategoryManager, CustomerServiceAgent]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- Employees ---
  - method: POST
    path: "/v1/stores/{id}/employees"
    description: "Hire an employee into a store (multi-role staffing)"
    roles: [StoreManager]
    code: 201
    input: [name, role]
    output: Employee
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}/employees"
    description: "List employees of a store"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: ["role?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/v1/employees/{id}"
    description: "Fetch one employee"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # --- Finds buys & allocations ---
  - method: POST
    path: "/v1/finds-buys"
    description: "Create a weekly Finds one-time promotional buy (no replenishment, ever)"
    roles: [CategoryManager]
    code: 201
    input: [product_id, week_start_date, week_end_date, total_quantity]
    output: FindsBuy
    side_effects: []
  - method: GET
    path: "/v1/finds-buys"
    description: "List Finds buys, filterable by product"
    roles: [CategoryManager, OperationsAdmin, StoreManager]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: FindsBuy[]
    side_effects: []
  - method: GET
    path: "/v1/finds-buys/{id}"
    description: "Fetch one Finds buy"
    roles: [CategoryManager, OperationsAdmin, StoreManager]
    code: 200
    input: []
    output: FindsBuy
    side_effects: []
  - method: POST
    path: "/v1/finds-buys/{id}/allocations"
    description: "Run (or supersede) the allocation waterfall; OCC-guarded on the buy version"
    roles: [CategoryManager]
    code: 201
    input: [expected_finds_buy_version]
    output: FindsBuy
    side_effects:
      - "calculation finds_allocation_waterfall creates/replaces FindsAllocation rows (status RESERVED)"
      - "increments FindsBuy.version by 1"
  - method: GET
    path: "/v1/finds-buys/{id}/allocations"
    description: "List allocations of a buy"
    roles: [CategoryManager, OperationsAdmin, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: FindsAllocation[]
    side_effects: []
  - method: POST
    path: "/v1/finds-buys/{id}/activate"
    description: "Activate an ALLOCATED buy once the full quantity is allocated and windows are conflict-free"
    roles: [CategoryManager]
    code: 200
    input: []
    output: FindsBuy
    side_effects: ["all allocations RESERVED -> ON_SALE with sale window copied from the buy"]
  - method: POST
    path: "/v1/finds-buys/{id}/close"
    description: "Close an ON_SALE buy after week end with unsold stock"
    roles: [CategoryManager]
    code: 200
    input: []
    output: FindsBuy
    side_effects: ["CLEARANCE allocations -> CLOSED; Store.finds_sell_through_pct recomputed"]
  - method: GET
    path: "/v1/allocations/{id}"
    description: "Fetch one allocation"
    roles: [CategoryManager, OperationsAdmin, StoreManager]
    code: 200
    input: []
    output: FindsAllocation
    side_effects: []
  - method: POST
    path: "/v1/allocations/{id}/sell"
    description: "Record a sale against an ON_SALE or CLEARANCE allocation"
    roles: [StoreManager]
    code: 200
    input: [quantity]
    output: FindsAllocation
    side_effects:
      - "sold_quantity += quantity; remaining_quantity recomputed"
      - "if remaining reaches 0 the allocation auto-transitions to SOLD_OUT, which recomputes FindsBuy.remaining_quantity, which may auto-transition the buy ON_SALE -> SOLD_OUT, which recomputes Store.finds_sell_through_pct"
  - method: POST
    path: "/v1/allocations/{id}/clearance"
    description: "Move unsold ON_SALE stock to clearance with a markdown and a mandatory gap day"
    roles: [StoreManager]
    code: 200
    input: [clearance_markdown_pct, clearance_start_date, clearance_end_date]
    output: FindsAllocation
    side_effects: ["calculation clearance_markdown_value computes clearance_value_cents"]
  - method: GET
    path: "/v1/stores/{id}/finds-allocations"
    description: "List allocations of a store"
    roles: [StoreManager, OperationsAdmin, CategoryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FindsAllocation[]
    side_effects: []

  # --- Cart coin ledger ---
  - method: POST
    path: "/v1/stores/{id}/cart-coin-events"
    description: "Append a cart deposit/return/collect/adjust event (append-only ledger)"
    roles: [Cashier, StoreManager]
    code: 201
    input: [event_type, coin_count]
    output: CartCoinEvent
    side_effects: ["calculation cart_coin_reconciliation updates Store.coins_outstanding and coin_liability_cents"]
  - method: GET
    path: "/v1/stores/{id}/cart-coin-events"
    description: "List cart coin events of a store (chronological)"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CartCoinEvent[]
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}/cart-reconciliation"
    description: "Computed coin reconciliation snapshot for the store"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: []
    output: "{ coins_inserted: integer, coins_returned: integer, coins_collected: integer, coins_adjusted: integer, coins_outstanding: integer, coin_liability_cents: integer }"
    side_effects: []

  # --- Register shifts / scan rate ---
  - method: POST
    path: "/v1/stores/{id}/register-shifts"
    description: "Open a register shift for a cashier; started_at stamped from the logical clock"
    roles: [StoreManager]
    code: 201
    input: [cashier_id]
    output: RegisterShift
    side_effects: ["started_at set from server logical clock"]
  - method: GET
    path: "/v1/stores/{id}/register-shifts"
    description: "List register shifts of a store"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RegisterShift[]
    side_effects: []
  - method: GET
    path: "/v1/register-shifts/{id}"
    description: "Fetch one register shift"
    roles: [StoreManager, Cashier, OperationsAdmin]
    code: 200
    input: []
    output: RegisterShift
    side_effects: []
  - method: GET
    path: "/v1/employees/{id}/register-shifts"
    description: "List register shifts staffed by an employee"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RegisterShift[]
    side_effects: []
  - method: POST
    path: "/v1/register-shifts/{id}/scan"
    description: "Record a batch of scanned items (and voids); recomputes provisional scan rate"
    roles: [Cashier]
    code: 200
    input: [items_count, "voids_count?"]
    output: RegisterShift
    side_effects: ["items_scanned/voids incremented", "calculation scan_rate provisional variant recomputes provisional_scan_rate"]
  - method: POST
    path: "/v1/register-shifts/{id}/close"
    description: "Close a shift; computes final scan rate and compliance flag"
    roles: [StoreManager]
    code: 200
    input: []
    output: RegisterShift
    side_effects: ["calculation scan_rate final variant computes final_scan_rate and compliance"]

  # --- Labor windows ---
  - method: POST
    path: "/v1/stores/{id}/labor-windows"
    description: "Book a replenishment/staffing window; cost computed, overlap and budget enforced"
    roles: [StoreManager]
    code: 201
    input: [aisle_zone, role, starts_at, ends_at]
    output: LaborWindow
    side_effects: ["calculation labor_window_cost computes cost_cents"]
  - method: GET
    path: "/v1/stores/{id}/labor-windows"
    description: "List labor windows of a store"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LaborWindow[]
    side_effects: []
  - method: GET
    path: "/v1/labor-windows/{id}"
    description: "Fetch one labor window"
    roles: [StoreManager, OperationsAdmin]
    code: 200
    input: []
    output: LaborWindow
    side_effects: []
  - method: POST
    path: "/v1/labor-windows/{id}/confirm"
    description: "Confirm a PLANNED window"
    roles: [StoreManager]
    code: 200
    input: []
    output: LaborWindow
    side_effects: []
  - method: POST
    path: "/v1/labor-windows/{id}/cancel"
    description: "Cancel a PLANNED or CONFIRMED window; its cost leaves the weekly aggregation"
    roles: [StoreManager]
    code: 200
    input: []
    output: LaborWindow
    side_effects: ["calculation labor_window_cost weekly spend re-aggregates without this window"]

  # --- Quality claims ---
  - method: POST
    path: "/v1/claims"
    description: "File a quality-guarantee claim (45-day window)"
    roles: [CustomerServiceAgent]
    code: 201
    input: [product_id, store_id, quantity, unit_price_cents, purchase_date, reason]
    output: QualityClaim
    side_effects: []
  - method: GET
    path: "/v1/claims"
    description: "List claims, filterable by product/store/status"
    roles: [CustomerServiceAgent, StoreManager, OperationsAdmin]
    code: 200
    input: ["product_id?", "store_id?", "status?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []
  - method: GET
    path: "/v1/claims/{id}"
    description: "Fetch one claim"
    roles: [CustomerServiceAgent, StoreManager, OperationsAdmin]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: POST
    path: "/v1/claims/{id}/review"
    description: "Move a FILED (or DISPUTED) claim under review"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: POST
    path: "/v1/claims/{id}/approve"
    description: "Approve a claim under review; computes the (possibly double) refund and debits store liability"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["calculation double_refund computes refund_amount_cents", "Store.refund_liability_cents increases"]
  - method: POST
    path: "/v1/claims/{id}/reject"
    description: "Reject a claim under review"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: POST
    path: "/v1/claims/{id}/dispute"
    description: "Send a claim under review into dispute (loops back via review)"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: POST
    path: "/v1/claims/{id}/pay"
    description: "Pay out an approved claim; liability moves to paid"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["Store.refund_liability_cents decreases", "Store.refund_paid_cents increases"]
  - method: POST
    path: "/v1/claims/{id}/rescind"
    description: "Compensating reversal of an approved-but-unpaid claim"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["Store.refund_liability_cents decreases by refund_amount_cents"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (ISO8601 UTC). Startup default before any set call is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [OperationsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server logical clock advanced; used by started_at/closed_at, claim windows, sell windows, labor ISO weeks"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or entity_backed ownership mismatch (wrong store/cashier/supplier)"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, or invalid enum member"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK reference does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource in a state that forbids the operation (generic state precondition failure)"
  - id: ERR_TENDER_NOT_OPEN
    http: 409
    condition: "Bid submitted on a tender not in status OPEN"
  - id: ERR_PANEL_INCOMPLETE
    http: 409
    condition: "Evaluate attempted while some bid lacks a panel or some panel is not SCORED"
  - id: ERR_BLIND_VIOLATION
    http: 422
    condition: "Panel sample_code equals/contains the bidding supplier's id or name, or a second panel is created for the same bid"
  - id: ERR_DUAL_SOURCE_REQUIRED
    http: 409
    condition: "Award with primary and secondary bids from the same supplier, or fewer than min_sources distinct ELIGIBLE suppliers"
  - id: ERR_SKU_CAP_EXCEEDED
    http: 409
    condition: "CORE product activation/reactivation would exceed the category sku_cap (count == cap already)"
  - id: ERR_SKU_CAP_BELOW_CURRENT
    http: 409
    condition: "PATCH sku_cap below the category's current active_sku_count"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "Product sku_code already exists"
  - id: ERR_BARCODE_COUNT_INVALID
    http: 422
    condition: "barcode_count < 1, or < 2 for shelf-ready products (multi-barcode scan-rate design)"
  - id: ERR_SHELF_READY_REQUIRED
    http: 422
    condition: "FINDS product created without shelf_ready_packaging (pallet-display merchandising policy)"
  - id: ERR_BID_DUPLICATE
    http: 409
    condition: "Supplier already has a bid on this tender"
  - id: ERR_BID_CEILING_EXCEEDED
    http: 422
    condition: "unit_cost_cents exceeds the tender bid_ceiling_cents at submission"
  - id: ERR_SUPPLIER_SUSPENDED
    http: 409
    condition: "Bid from a SUSPENDED supplier"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent entity's current version"
  - id: ERR_FINDS_NO_REPLENISHMENT
    http: 409
    condition: "Allocation planning attempted on a buy past ALLOCATED (one-time buy, no replenishment)"
  - id: ERR_ALLOCATION_INCOMPLETE
    http: 409
    condition: "Activate attempted while allocated_quantity != total_quantity"
  - id: ERR_PRODUCT_NOT_ACTIVE
    http: 409
    condition: "FindsBuy creation or activation against a product not in status ACTIVE"
  - id: ERR_SALE_WINDOW_CONFLICT
    http: 409
    condition: "Store would hold two ON_SALE/CLEARANCE allocations with overlapping inclusive sale windows"
  - id: ERR_CLEARANCE_GAP_VIOLATION
    http: 409
    condition: "clearance_start_date earlier than sale_end_date + 1 day"
  - id: ERR_ALLOCATION_EXHAUSTED
    http: 409
    condition: "Sell quantity exceeds allocation remaining_quantity"
  - id: ERR_SALE_WINDOW_INACTIVE
    http: 409
    condition: "Sell attempted outside the allocation's current sale window (logical clock)"
  - id: ERR_COIN_BALANCE_NEGATIVE
    http: 422
    condition: "Cart coin event would drive the store's running coin balance negative"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "Labor window overlaps an existing PLANNED/CONFIRMED window on the same (store, aisle_zone) under half-open semantics"
  - id: ERR_WINDOW_LIMIT_EXCEEDED
    http: 409
    condition: "Store would exceed 6 non-cancelled labor windows in the same ISO week"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 422
    condition: "Weekly labor spend plus new window cost exceeds store weekly_labor_budget_cents"
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 422
    condition: "purchase_date more than 45 days before the logical clock date at filing"
  - id: ERR_SHIFT_NOT_OPEN
    http: 409
    condition: "Scan or close attempted on a shift not in status OPEN"
  - id: ERR_CASHIER_ROLE_REQUIRED
    http: 422
    condition: "Register shift opened for an employee whose role is not CASHIER"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: OperationsAdmin
    description: "Central operations administrator; manages stores and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/stores"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read endpoints for stores, employees, shifts, labor windows, allocations, cart reconciliation"
  - name: CategoryManager
    description: "Owns assortment: categories, products, SKU discipline, and Finds buys"
    identity: opaque
    exclusive_operations:
      - "POST /v1/categories"
      - "PATCH /v1/categories/{id}"
      - "POST /v1/products and product discontinue/reactivate"
      - "POST /v1/finds-buys, allocations planning, activate, close"
    shared_operations:
      - "read categories, products, tenders, stores, allocations"
  - name: ProcurementLead
    description: "Runs private-label supplier tendering: suppliers, tenders, evaluation, award"
    identity: opaque
    exclusive_operations:
      - "POST /v1/suppliers"
      - "POST /v1/tenders and tender open/close/evaluate/award/retender/cancel"
    shared_operations:
      - "read categories, suppliers, products, bids, panels"
  - name: QualityAssuranceLead
    description: "Runs blind quality panels; cannot create or award tenders (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/bids/{id}/panels"
      - "POST /v1/panels/{id}/score"
    shared_operations:
      - "read suppliers, tenders, bids, panels"
  - name: SupplierRep
    description: "External supplier representative; bids only as their own supplier"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /v1/tenders/{id}/bids"
    shared_operations:
      - "GET /v1/bids/{id}"
  - name: StoreManager
    description: "Runs one store: employees, register shifts, labor windows, cart ledger, sells, clearance"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /v1/stores/{id}/employees"
      - "POST /v1/stores/{id}/register-shifts and close"
      - "POST /v1/stores/{id}/labor-windows, confirm, cancel"
      - "POST /v1/allocations/{id}/sell and clearance"
    shared_operations:
      - "POST /v1/stores/{id}/cart-coin-events (with Cashier)"
      - "read store-scoped resources, claims"
  - name: Cashier
    description: "Front-end cashier; scans items on own shift and records cart coin events"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /v1/register-shifts/{id}/scan"
    shared_operations:
      - "POST /v1/stores/{id}/cart-coin-events (with StoreManager)"
      - "GET /v1/register-shifts/{id}"
  - name: CustomerServiceAgent
    description: "Customer service; files and adjudicates quality-guarantee claims"
    identity: opaque
    exclusive_operations:
      - "POST /v1/claims and claim review/approve/reject/dispute/pay/rescind"
    shared_operations:
      - "read products, stores, claims"
