      - name: student_verification_invalid_state_and_reject_retry_loop
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Student.PENDING_to_REJECTED
          - state_machines.Student.REJECTED_to_PENDING
          - state_machines.Student.PENDING_to_VERIFIED
          - errors[ERR_STUDENT_INVALID_STATE]
          - entities.University.fields.verified_student_count
        distinguishing_aspect: "A decision on an UNVERIFIED student is rejected with ERR_STUDENT_INVALID_STATE; after REJECTED the student may re-request verification (revert edge) and a second decision reaches VERIFIED, bumping verified_student_count to 1."
        test_recipe:
          setup:
