# =============================================================================
# PRD Benchmark Scaffold — Wound Ostomy Continence Nurse Consult Service
# Difficulty band: beyond Expert (§0.4) — 13 entities, 70 endpoints, 36 errors,
# 7 calculation rules (3 dual-variant), 8 state machines (cyclic + parallel +
# branching + compound), 2 OCC races.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2681. Wound Ostomy Continence Nurse Consult Service (hospital wound and ostomy team): consult request triage by wound stage, ostomy complication or incontinence-associated damage, pressure injury present-on-admission documentation and staging validation, prevalence and incidence survey rounds with unit-level reporting, support surface and specialty bed ordering with rental cost controls, product formulary selection and standardized dressing change protocols, ostomy education, supply transition and outpatient follow-up scheduling, hospital-acquired pressure injury root cause analysis, nursing education and certification pipeline

domain_name: woc-consult-service
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer top-level collections joined by explicit foreign keys; no nesting of
  # business entities inside URL paths. Sub-paths exist only for action verbs
  # (e.g. /consult-requests/{consult_id}/triage) and computed reads.

  state_machine_shape: cyclic
  # ConsultRequest loops TRIAGED -> RETURNED_FOR_INFO -> REQUESTED -> TRIAGED
  # and ASSIGNED -> ESCALATED -> ASSIGNED; SkinAssessment loops
  # PENDING_VALIDATION -> DISPUTED -> PENDING_VALIDATION; WocNurse loops
  # CERTIFIED -> LAPSED -> CERTIFIED. SupportSurfaceOrder carries two parallel
  # dimensions (fulfillment_status x billing_status). PressureInjuryCase
  # branches OPEN -> {CLASSIFIED_POA, CLASSIFIED_HAPI} with divergent
  # side-effect sets. SurveyRound is compound (lock guarded by per-Unit
  # observation coverage).

  relationship_patterns:
    - one_to_many
    - self_referential      # PressureInjuryCase.predecessor_case_id -> PressureInjuryCase.id
    - cross_aggregate       # SupportSurfaceOrder spans Patient, Unit, SupportSurface, ConsultRequest

  role_model: segregation_of_duties
  # The WocNurse who staged a SkinAssessment may not validate it, and may not
  # lead the RCA for the PressureInjuryCase that assessment produced.

  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Density sources: (1) the same wound produces two different acuity scores
    (intake-provisional from the requesting unit's reported stage vs
    assessed-final from the validated stage plus measured area), which changes
    the priority band and therefore the SLA clock; (2) rental cost is a tiered
    per-day figure whose rounding order is pinned and whose vendor service fee
    tier is keyed on the PRE-fee projected cost, making the fee formula look
    circular; (3) the same survey observations yield divergent prevalence and
    incidence rates because the inclusion sets differ; (4) a single staging
    validation cascades four hops deep, ending in a posture hold on unrelated
    rental orders.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: Short hospital unit code used on survey reports.
        constraints: "Uppercase A-Z0-9 and hyphen, 2-12 chars; globally unique across Unit rows."
      - name: name
        type: string
        source: input
        description: Human-readable unit name.
        constraints: "1-120 chars."
      - name: bed_count
        type: integer
        source: input
        description: Licensed bed count, used as the at-risk census ceiling on survey rounds.
        constraints: ">= 1 and <= 400."
      - name: rental_budget_cap_cents
        type: integer
        source: input
        description: Ceiling on total support-surface rental money this Unit may hold encumbered plus committed.
        default: 0
        constraints: ">= 0; mutated only by POST /units/{unit_id}/budget-adjustments."
      - name: rental_encumbered_cents
        type: integer
        source: computed
        description: Sum of authorized_cost_cents over SupportSurfaceOrder rows for this Unit whose billing_status == ENCUMBERED.
        default: 0
        constraints: ">= 0."
      - name: rental_committed_cents
        type: integer
        source: computed
        description: Sum of actual_cost_cents over SupportSurfaceOrder rows for this Unit whose billing_status IN {COMMITTED, RECONCILED}.
        default: 0
        constraints: ">= 0."
      - name: rental_released_cents
        type: integer
        source: computed
        description: Lifetime running total of money released back to this Unit by denial, consult cancellation, or return-time downward revision. Audit counter only; never subtracted from.
        default: 0
        constraints: ">= 0; monotonically non-decreasing."
      - name: rental_available_cents
        type: integer
        source: computed
        description: Spendable headroom, recomputed on every ledger mutation as rental_budget_cap_cents - rental_encumbered_cents - rental_committed_cents.
        default: 0
        constraints: "May be 0 but never negative; every write path checks headroom before encumbering."
      - name: open_hapi_rca_count
        type: integer
        source: computed
        description: Count of PressureInjuryCase rows for this Unit whose status IN {RCA_REQUIRED, RCA_IN_PROGRESS, RCA_COMPLETE}.
        default: 0
        constraints: ">= 0."
      - name: disputed_staging_count
        type: integer
        source: computed
        description: Lifetime count of SkinAssessment rows for patients on this Unit that entered validation_status == DISPUTED.
        default: 0
        constraints: ">= 0; monotonically non-decreasing."
      - name: survey_posture
        type: enum
        source: computed
        description: Derived gate recomputed on every open_hapi_rca_count change; FROZEN when open_hapi_rca_count >= 4, else RESTRICTED when open_hapi_rca_count >= 2, else OPEN.
        default: OPEN
        constraints: "One of {OPEN, RESTRICTED, FROZEN}."
      - name: last_prevalence_rate
        type: number
        source: computed
        description: Prevalence percentage written by the most recent PUBLISHED SurveyRound whose round_type == PREVALENCE and whose participating_unit_ids contains this Unit id.
        default: null
        constraints: "2 decimal places, 0.00-100.00, or null when no PREVALENCE round has published."
      - name: last_incidence_rate
        type: number
        source: computed
        description: Incidence percentage written by the most recent PUBLISHED SurveyRound whose round_type == INCIDENCE and whose participating_unit_ids contains this Unit id.
        default: null
        constraints: "2 decimal places, 0.00-100.00, or null when no INCIDENCE round has published."

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical record number.
        constraints: "6-16 chars; globally unique across Patient rows."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the Unit currently holding this patient. Immutable after admission."
        constraints: "Referenced Unit must exist."
      - name: admitted_at
        type: datetime
        source: input
        description: Admission instant; anchors the present-on-admission documentation window.
        constraints: "ISO 8601 UTC, second precision (fractional seconds are not required); must be <= the logical clock at creation time."
      - name: discharged_at
        type: datetime
        source: computed
        description: Set by POST /patients/{patient_id}/discharge.
        default: null
      - name: status
        type: enum
        source: computed
        description: ADMITTED at creation; DISCHARGED after the discharge endpoint succeeds.
        default: ADMITTED
        constraints: "One of {ADMITTED, DISCHARGED}."
      - name: comorbidity_count
        type: integer
        source: input
        description: Count of acuity-relevant comorbidities; feeds consult_acuity_score.
        default: 0
        constraints: ">= 0 and <= 10."
      - name: device_related_risk
        type: boolean
        source: input
        description: True when a medical device (tracheostomy collar, brace, tubing) sits over an at-risk site; adds DEVICE_RELATED_POINTS to acuity.
        default: false
      - name: ostomy_present
        type: boolean
        source: input
        description: True when the patient has a stoma; required true before an OstomyEducationPlan may be created.
        default: false
      - name: poa_skin_assessment_documented
        type: boolean
        source: computed
        description: Set true the first time a SkinAssessment for this patient reaches validation_status == VALIDATED with poa_determination == POA.
        default: false
      - name: pending_outpatient_followup_count
        type: integer
        source: computed
        description: Count of OstomyEducationPlan rows for this patient whose status == FOLLOWUP_SCHEDULED.
        default: 0
        constraints: ">= 0."

  - name: WocNurse
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Nurse display name.
        constraints: "1-120 chars."
      - name: home_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the Unit this nurse is administratively based on. Does not restrict which units the nurse may consult on."
        constraints: "Referenced Unit must exist."
      - name: certification_status
        type: enum
        source: computed
        description: TRAINEE at creation; advanced by POST /woc-nurses/{nurse_id}/advance, certified by /certify, downgraded by /lapse.
        default: TRAINEE
        constraints: "One of {TRAINEE, CANDIDATE, CERTIFIED, LAPSED}."
      - name: ce_credits
        type: integer
        source: input
        description: Continuing-education credits on record; feeds certification_eligibility_score and is a hard gate at CE_CREDIT_FLOOR.
        default: 0
        constraints: ">= 0 and <= 200."
      - name: competency_signoff_count
        type: integer
        source: computed
        description: Number of accepted POST /woc-nurses/{nurse_id}/competency-signoffs calls.
        default: 0
        constraints: ">= 0."
      - name: last_competency_signoff_at
        type: datetime
        source: computed
        description: signed_off_at of the most recent accepted competency signoff, ordered by signed_off_at DESC then created_at DESC.
        default: null
      - name: mentored_consult_count
        type: integer
        source: computed
        description: Count of ConsultRequest rows whose assigned_nurse_id == this nurse and whose status == CLOSED.
        default: 0
        constraints: ">= 0."
      - name: certification_eligibility_score
        type: number
        source: computed
        description: Output of calculations.certification_eligibility_score, recomputed on every competency signoff and on every consult close.
        default: null
        constraints: "2 decimal places, 0.00-100.00, or null before the first recompute."
      - name: cert_expires_at
        type: datetime
        source: computed
        description: Expiry stamped by POST /woc-nurses/{nurse_id}/certify from its cert_expires_at input.
        default: null
      - name: active_consult_load
        type: integer
        source: computed
        description: Count of ConsultRequest rows whose assigned_nurse_id == this nurse and whose status IN {ASSIGNED, ASSESSED, PLAN_ACTIVE, ESCALATED}. Conserved quantity of compensating-invariant nurse_consult_load_conservation.
        default: 0
        constraints: ">= 0 and <= max_consult_load."
      - name: max_consult_load
        type: integer
        source: computed
        description: Load ceiling derived from certification_status via MAX_LOAD_BY_CERT — CERTIFIED 8, CANDIDATE 3, TRAINEE 0, LAPSED 0.
        default: 0
        constraints: "One of {0, 3, 8}."

  - name: ConsultRequest
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the consult is about."
        constraints: "Referenced Patient must exist and have status == ADMITTED at creation time."
      - name: requesting_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the Unit raising the consult. Must equal Patient.unit_id."
        constraints: "Referenced Unit must exist."
      - name: assigned_nurse_id
        type: string
        source: computed
        description: "FK -> WocNurse.id; set by POST /consult-requests/{consult_id}/assign, cleared by /escalate, re-set by a later /assign."
        default: null
      - name: consult_type
        type: enum
        source: input
        description: Consult family; selects TYPE_MULTIPLIER in consult_acuity_score.
        constraints: "One of {WOUND, OSTOMY, INCONTINENCE}."
      - name: reported_stage
        type: enum
        source: input
        description: Stage the requesting unit claims, used only by the intake_provisional acuity variant.
        constraints: "One of {NONE, MUCOSAL, STAGE_1, STAGE_2, STAGE_3, STAGE_4, DTI, UNSTAGEABLE}."
      - name: clinical_note
        type: string
        source: input
        description: Free-text intake narrative.
        constraints: "1-2000 chars."
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.ConsultRequest.
        default: REQUESTED
        constraints: "One of {REQUESTED, TRIAGED, RETURNED_FOR_INFO, ASSIGNED, ASSESSED, PLAN_ACTIVE, ESCALATED, CLOSED, CANCELLED}."
      - name: acuity_score
        type: number
        source: computed
        description: Output of calculations.consult_acuity_score under whichever variant acuity_variant names.
        default: null
        constraints: "1 decimal place, 0.0-100.0, or null before triage."
      - name: acuity_variant
        type: enum
        source: computed
        description: INTAKE_PROVISIONAL after triage; flipped to ASSESSED_FINAL when a SkinAssessment is filed against this consult.
        default: null
        constraints: "One of {INTAKE_PROVISIONAL, ASSESSED_FINAL} or null."
      - name: priority_band
        type: enum
        source: computed
        description: Threshold read of acuity_score — P1 when acuity_score >= 70.0, else P2 when acuity_score >= 40.0, else P3.
        default: null
        constraints: "One of {P1, P2, P3} or null before triage."
      - name: sla_due_at
        type: datetime
        source: computed
        description: triaged_at plus SLA_HOURS_BY_BAND for the current priority_band; recomputed whenever priority_band changes.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of accepted POST /consult-requests/{consult_id}/resubmit calls; capped by MAX_REVISIONS.
        default: 0
        constraints: ">= 0 and <= 2."
      - name: protocol_hold
        type: boolean
        source: computed
        description: Set true when any SkinAssessment for this consult has validation_status == DISPUTED; blocks POST /dressing-protocols. Cleared when that assessment returns to PENDING_VALIDATION via /restage.
        default: false
      - name: triaged_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent accepted triage call.
        default: null
      - name: escalation_count
        type: integer
        source: computed
        description: Number of accepted POST /consult-requests/{consult_id}/escalate calls.
        default: 0
        constraints: ">= 0."
      - name: closing_summary
        type: string
        source: computed
        description: Narrative supplied to POST /consult-requests/{consult_id}/close.
        default: null

  - name: SkinAssessment
    parent: null
    common_fields: true
    fields:
      - name: consult_request_id
        type: string
        source: input
        description: "FK -> ConsultRequest.id; the consult this bedside assessment answers."
        constraints: "Referenced ConsultRequest must exist and have status IN {ASSIGNED, ASSESSED} — ASSESSED covers the re-assessment self-transition."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must equal ConsultRequest.patient_id of consult_request_id."
        constraints: "Referenced Patient must exist."
      - name: staged_by_nurse_id
        type: string
        source: system
        description: "FK -> WocNurse.id; copied from the X-User-ID header of the WocNurse filing the assessment. Client-supplied values are ignored."
      - name: anatomic_location
        type: enum
        source: input
        description: Body site; supersession of a prior assessment is scoped to (patient_id, anatomic_location).
        constraints: "One of {SACRUM, HEEL_LEFT, HEEL_RIGHT, ISCHIUM, TROCHANTER, OTHER}."
      - name: observed_stage
        type: enum
        source: input
        description: Bedside stage; feeds STAGE_WEIGHT in the assessed_final acuity variant.
        constraints: "One of {MUCOSAL, STAGE_1, STAGE_2, STAGE_3, STAGE_4, DTI, UNSTAGEABLE}."
      - name: measured_area_cm2
        type: number
        source: input
        description: Wound surface area in square centimetres; feeds the area component of the assessed_final acuity variant.
        constraints: ">= 0 and <= 500; at most 1 decimal place."
      - name: observed_at
        type: datetime
        source: input
        description: Instant of bedside observation; compared against Patient.admitted_at + POA_WINDOW_HOURS by the poa determination.
        constraints: "ISO 8601 UTC; must be >= Patient.admitted_at and <= the logical clock."
      - name: present_on_admission_claimed
        type: boolean
        source: input
        description: What the filing nurse claims about present-on-admission status; advisory only until validation confirms it.
        default: false
      - name: poa_determination
        type: enum
        source: computed
        description: Output of calculations.poa_determination, written at validation time only.
        default: null
        constraints: "One of {POA, HAPI, INDETERMINATE} or null while validation_status == PENDING_VALIDATION or DISPUTED."
      - name: validation_status
        type: enum
        source: computed
        description: See state_machines.SkinAssessment.
        default: PENDING_VALIDATION
        constraints: "One of {PENDING_VALIDATION, VALIDATED, DISPUTED, SUPERSEDED}."
      - name: confirmed_stage
        type: enum
        source: computed
        description: Stage pinned by the validator; may differ from observed_stage. Used by the assessed_final acuity recompute at validation time.
        default: null
        constraints: "One of {MUCOSAL, STAGE_1, STAGE_2, STAGE_3, STAGE_4, DTI, UNSTAGEABLE} or null."
      - name: validated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who validated; compared against staged_by_nurse_id by the segregation-of-duties check.
        default: null
      - name: dispute_reason
        type: string
        source: computed
        description: Reason recorded by POST /skin-assessments/{assessment_id}/dispute.
        default: null
      - name: restage_count
        type: integer
        source: computed
        description: Number of accepted POST /skin-assessments/{assessment_id}/restage calls.
        default: 0
        constraints: ">= 0."

  - name: PressureInjuryCase
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; copied from the originating SkinAssessment."
      - name: unit_id
        type: string
        source: system
        description: "FK -> Unit.id; copied from Patient.unit_id at case creation; drives which Unit's open_hapi_rca_count and survey_posture move."
      - name: skin_assessment_id
        type: string
        source: system
        description: "FK -> SkinAssessment.id; the assessment whose validation opened this case."
      - name: predecessor_case_id
        type: string
        source: system
        description: "FK -> PressureInjuryCase.id; set on a successor case created when a superseding assessment reverses the POA determination for the same (patient_id, anatomic_location) pair."
        default: null
      - name: classification
        type: enum
        source: computed
        description: UNDETERMINED until the originating assessment is validated; then POA or HAPI per calculations.poa_determination.
        default: UNDETERMINED
        constraints: "One of {UNDETERMINED, POA, HAPI}."
      - name: status
        type: enum
        source: computed
        description: See state_machines.PressureInjuryCase.
        default: OPEN
        constraints: "One of {OPEN, CLASSIFIED_POA, CLASSIFIED_HAPI, RCA_REQUIRED, RCA_IN_PROGRESS, RCA_COMPLETE, CLOSED, RECLASSIFIED}."
      - name: rca_lead_nurse_id
        type: string
        source: computed
        description: "FK -> WocNurse.id; set by POST /pressure-injury-cases/{case_id}/rca-start."
        default: null
      - name: rca_due_at
        type: datetime
        source: computed
        description: Logical clock at the moment status became RCA_REQUIRED, plus RCA_DUE_HOURS.
        default: null
      - name: root_cause_category
        type: enum
        source: computed
        description: Category recorded by POST /pressure-injury-cases/{case_id}/rca-complete.
        default: null
        constraints: "One of {REPOSITIONING, SUPPORT_SURFACE, NUTRITION, DEVICE, MOISTURE, DOCUMENTATION} or null."
      - name: contributing_factors
        type: array
        source: computed
        description: Non-empty list of factor strings recorded by rca-complete.
        default: []
        constraints: "1-6 strings of 1-120 chars each once rca-complete has run."
      - name: closed_at
        type: datetime
        source: computed
        description: Logical clock at the moment status became CLOSED.
        default: null

  - name: SurveyRound
    parent: null
    common_fields: true
    fields:
      - name: round_type
        type: enum
        source: input
        description: PREVALENCE counts every injury present on the survey pass; INCIDENCE counts only new HAPIs with onset inside the window.
        constraints: "One of {PREVALENCE, INCIDENCE}."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive lower bound of the survey window.
        constraints: "ISO 8601 UTC."
      - name: window_end
        type: datetime
        source: input
        description: Inclusive upper bound of the survey window; window is the CLOSED interval [window_start, window_end].
        constraints: "ISO 8601 UTC; must be > window_start."
      - name: participating_unit_ids
        type: array
        source: input
        description: List of Unit id strings covered by this round. Not a foreign-key field; each element is validated to reference an existing Unit at creation.
        constraints: "1-20 unique Unit ids, each of which must exist."
      - name: status
        type: enum
        source: computed
        description: See state_machines.SurveyRound.
        default: PLANNED
        constraints: "One of {PLANNED, OPEN, LOCKED, PUBLISHED, CANCELLED}."
      - name: observation_count
        type: integer
        source: computed
        description: Count of SurveyObservation rows whose survey_round_id == this round.
        default: 0
        constraints: ">= 0."
      - name: published_at
        type: datetime
        source: computed
        description: Logical clock at the moment status became PUBLISHED.
        default: null

  - name: SurveyObservation
    parent: null
    common_fields: false
    fields:
      - name: survey_round_id
        type: string
        source: input
        description: "FK -> SurveyRound.id; the round this observation belongs to."
        constraints: "Referenced SurveyRound must exist and have status == OPEN."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; must be an element of SurveyRound.participating_unit_ids."
        constraints: "Referenced Unit must exist."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must have Patient.unit_id == unit_id and Patient.status == ADMITTED."
        constraints: "Referenced Patient must exist; at most one observation per (survey_round_id, patient_id)."
      - name: observer_nurse_id
        type: string
        source: input
        description: "FK -> WocNurse.id; the surveyor. Must have certification_status IN {CANDIDATE, CERTIFIED}."
        constraints: "Referenced WocNurse must exist."
      - name: observed_at
        type: datetime
        source: input
        description: Instant of the survey pass; must sit inside the CLOSED interval [SurveyRound.window_start, SurveyRound.window_end].
        constraints: "ISO 8601 UTC."
      - name: injury_present
        type: boolean
        source: input
        description: True when any pressure injury was seen on this patient during the pass; numerator input of the prevalence variant.
      - name: observed_stage
        type: enum
        source: input
        description: Stage seen during the pass; required when injury_present == true, must be omitted or null when injury_present == false.
        default: null
        constraints: "One of {MUCOSAL, STAGE_1, STAGE_2, STAGE_3, STAGE_4, DTI, UNSTAGEABLE} or null."
      - name: classification
        type: enum
        source: input
        description: Surveyor's POA/HAPI call for the injury seen; numerator filter of the incidence variant.
        constraints: "One of {NONE, POA, HAPI}; must be NONE when injury_present == false."
      - name: onset_at
        type: datetime
        source: input
        description: Documented onset instant of the injury; the incidence variant counts an observation only when onset_at sits inside the CLOSED round window.
        default: null
        constraints: "Required when classification == HAPI; null otherwise."
      - name: at_risk
        type: boolean
        source: input
        description: True when the patient was on the at-risk register during the pass; denominator input of the incidence variant.
        default: true

  - name: SupportSurface
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Vendor asset tag of the physical specialty bed or overlay.
        constraints: "3-24 chars; globally unique across SupportSurface rows."
      - name: surface_class
        type: enum
        source: input
        description: Therapy class of the surface.
        constraints: "One of {FOAM_OVERLAY, ALTERNATING_PRESSURE, LOW_AIR_LOSS, BARIATRIC_BED}."
      - name: daily_rate_cents
        type: integer
        source: input
        description: Vendor list rate per billable day before tier discounts; base input of rental_cost_projection.
        constraints: ">= 1 and <= 2000000."
      - name: vendor_name
        type: string
        source: input
        description: Rental vendor name.
        constraints: "1-120 chars."
      - name: status
        type: enum
        source: computed
        description: AVAILABLE at creation; IN_USE while an approved-or-delivered order occupies it; CLEANING during the reclean buffer after return.
        default: AVAILABLE
        constraints: "One of {AVAILABLE, IN_USE, CLEANING, RETIRED}."
      - name: occupied_until
        type: datetime
        source: computed
        description: Occupation high-water mark of this asset, written by the SupportSurface transitions - order.rental_end when an order on this asset is approved, then order.actual_return_at when that same order is returned. Ties broken by the driving order's created_at DESC. Null until this asset's first approval. Distinct from validations[priority=46], which recomputes blocked spans from the {APPROVED, DELIVERED} order rows themselves rather than from this field.
        default: null
      - name: available_from
        type: datetime
        source: computed
        description: occupied_until plus RECLEAN_BUFFER_HOURS. Two uses - the earliest rental_start a new order on this asset may carry, and the earliest logical-clock instant at which a CLEANING asset may return to AVAILABLE. Null while occupied_until is null.
        default: null

  - name: SupportSurfaceOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the surface is for."
        constraints: "Referenced Patient must exist and have status == ADMITTED."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the Unit whose rental ledger is charged. Must equal Patient.unit_id."
        constraints: "Referenced Unit must exist."
      - name: support_surface_id
        type: string
        source: input
        description: "FK -> SupportSurface.id; the physical asset being reserved."
        constraints: "Referenced SupportSurface must exist and have status != RETIRED."
      - name: consult_request_id
        type: string
        source: input
        description: "FK -> ConsultRequest.id; the consult that justifies the rental. Optional; when present, cancelling that consult releases this order's encumbrance."
        default: null
      - name: rental_start
        type: datetime
        source: input
        description: Inclusive start of the occupation interval on support_surface_id.
        constraints: "ISO 8601 UTC."
      - name: rental_end
        type: datetime
        source: input
        description: Exclusive end of the occupation interval; the interval is half-open [rental_start, rental_end) with a trailing RECLEAN_BUFFER_HOURS block.
        constraints: "ISO 8601 UTC; must be > rental_start."
      - name: authorized_days
        type: integer
        source: input
        description: Days the Unit authorizes; billable_days may not exceed it.
        constraints: ">= 1 and <= 120."
      - name: billable_days
        type: integer
        source: computed
        description: ceil((rental_end - rental_start) in hours / BILLABLE_DAY_HOURS); any partial day rounds up.
        default: null
        constraints: ">= 1."
      - name: projected_cost_cents
        type: integer
        source: computed
        description: Output of calculations.rental_cost_projection over billable_days at SupportSurface.daily_rate_cents.
        default: null
        constraints: ">= 0."
      - name: vendor_service_fee_cents
        type: integer
        source: computed
        description: Output of calculations.vendor_service_fee; tier keyed on projected_cost_cents BEFORE the fee is added.
        default: null
        constraints: ">= 0."
      - name: authorized_cost_cents
        type: integer
        source: computed
        description: projected_cost_cents + vendor_service_fee_cents; the exact amount encumbered on the Unit at approval.
        default: null
        constraints: ">= 0."
      - name: actual_return_at
        type: datetime
        source: computed
        description: actual_return_at supplied to POST /support-surface-orders/{order_id}/return.
        default: null
      - name: actual_cost_cents
        type: integer
        source: computed
        description: rental_cost_projection plus vendor_service_fee recomputed over the realised interval [rental_start, actual_return_at); the amount committed at return.
        default: null
        constraints: ">= 0."
      - name: fulfillment_status
        type: enum
        source: computed
        description: Logistics dimension; see state_machines.SupportSurfaceOrder.
        default: REQUESTED
        constraints: "One of {REQUESTED, APPROVED, DELIVERED, RETURNED, DENIED}."
      - name: billing_status
        type: enum
        source: computed
        description: Money dimension, independent of fulfillment_status; see state_machines.SupportSurfaceOrder.
        default: UNBILLED
        constraints: "One of {UNBILLED, ENCUMBERED, COMMITTED, RELEASED, RECONCILED}."
      - name: requires_director_override
        type: boolean
        source: computed
        description: Set true when Unit.survey_posture becomes RESTRICTED while this order is still fulfillment_status == REQUESTED; approval then demands director_override == true.
        default: false
      - name: posture_hold_applied_at
        type: datetime
        source: computed
        description: Logical clock at the moment requires_director_override flipped to true.
        default: null
      - name: delivered_at
        type: datetime
        source: computed
        description: delivered_at supplied to POST /support-surface-orders/{order_id}/deliver.
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: Reason recorded by POST /support-surface-orders/{order_id}/deny.
        default: null

  - name: FormularyProduct
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Catalogue SKU.
        constraints: "3-24 chars; globally unique across FormularyProduct rows."
      - name: name
        type: string
        source: input
        description: Product display name.
        constraints: "1-120 chars."
      - name: category
        type: enum
        source: input
        description: Dressing or ostomy product family.
        constraints: "One of {FOAM, HYDROCOLLOID, ALGINATE, SILVER_ANTIMICROBIAL, OSTOMY_BARRIER, SKIN_PROTECTANT}."
      - name: unit_cost_cents
        type: integer
        source: input
        description: Cost of one unit; feeds dressing_protocol_weekly_cost.
        constraints: ">= 0 and <= 1000000."
      - name: formulary_tier
        type: enum
        source: input
        description: PREFERRED and RESTRICTED are on formulary; NON_FORMULARY demands a justification and carries NON_FORMULARY_SURCHARGE_PCT.
        constraints: "One of {PREFERRED, RESTRICTED, NON_FORMULARY}."
      - name: status
        type: enum
        source: computed
        description: ACTIVE at creation; ARCHIVED by POST /formulary-products/{product_id}/archive, after which the product may not back a new DressingProtocol.
        default: ACTIVE
        constraints: "One of {ACTIVE, ARCHIVED}."

  - name: DressingProtocol
    parent: null
    common_fields: true
    fields:
      - name: consult_request_id
        type: string
        source: input
        description: "FK -> ConsultRequest.id; the consult this standing protocol serves."
        constraints: "Referenced ConsultRequest must exist and have status IN {ASSESSED, PLAN_ACTIVE} — PLAN_ACTIVE covers the protocol-revision self-transition."
      - name: formulary_product_id
        type: string
        source: input
        description: "FK -> FormularyProduct.id; the dressing selected."
        constraints: "Referenced FormularyProduct must exist and have status == ACTIVE."
      - name: change_frequency_hours
        type: integer
        source: input
        description: Hours between scheduled dressing changes.
        constraints: ">= 8 and <= 168."
      - name: units_per_change
        type: integer
        source: input
        description: Units of product consumed per change.
        constraints: ">= 1 and <= 20."
      - name: justification
        type: string
        source: input
        description: Clinical justification; required and non-blank when the product's formulary_tier == NON_FORMULARY.
        default: null
        constraints: "1-500 chars when supplied."
      - name: changes_per_week
        type: integer
        source: computed
        description: floor(HOURS_PER_WEEK / change_frequency_hours).
        default: null
        constraints: ">= 1."
      - name: weekly_cost_cents
        type: integer
        source: computed
        description: Output of calculations.dressing_protocol_weekly_cost.
        default: null
        constraints: ">= 0."
      - name: status
        type: enum
        source: computed
        description: ACTIVE at creation; SUPERSEDED when a later protocol is filed on the same consult; VOIDED when the consult is cancelled.
        default: ACTIVE
        constraints: "One of {ACTIVE, SUPERSEDED, VOIDED}."

  - name: OstomyEducationPlan
    parent: null
    common_fields: true
    fields:
      - name: consult_request_id
        type: string
        source: input
        description: "FK -> ConsultRequest.id; must have consult_type == OSTOMY and status IN {ASSESSED, PLAN_ACTIVE}."
        constraints: "Referenced ConsultRequest must exist."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must equal ConsultRequest.patient_id and have ostomy_present == true."
        constraints: "Referenced Patient must exist."
      - name: sessions_completed
        type: integer
        source: computed
        description: Number of accepted POST /ostomy-education-plans/{plan_id}/sessions calls.
        default: 0
        constraints: ">= 0."
      - name: teach_back_score
        type: integer
        source: computed
        description: teach_back_score of the most recent session, ordered by created_at DESC.
        default: null
        constraints: "0-100 or null."
      - name: supply_transition_status
        type: enum
        source: computed
        description: PENDING until POST /ostomy-education-plans/{plan_id}/transition-supplies succeeds.
        default: PENDING
        constraints: "One of {PENDING, TRANSITIONED}."
      - name: followup_appointment_at
        type: datetime
        source: computed
        description: Outpatient follow-up instant recorded by transition-supplies; cleared to null when the plan is closed incomplete.
        default: null
      - name: status
        type: enum
        source: computed
        description: See state_machines.OstomyEducationPlan.
        default: ACTIVE
        constraints: "One of {ACTIVE, TEACH_BACK_PASSED, SUPPLIES_TRANSITIONED, FOLLOWUP_SCHEDULED, CLOSED_INCOMPLETE}."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ConsultRequest
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: TRIAGED
        trigger: "POST /consult-requests/{consult_id}/triage"
        actor: WocNurse
        preconditions:
          - "consult.status == REQUESTED"
          - "Patient.status == ADMITTED for consult.patient_id"
        side_effects:
          - "acuity_score := calculations.consult_acuity_score under variant intake_provisional"
          - "acuity_variant := INTAKE_PROVISIONAL"
          - "priority_band := P1 when acuity_score >= 70.0, else P2 when acuity_score >= 40.0, else P3"
          - "triaged_at := logical clock"
          - "sla_due_at := triaged_at + SLA_HOURS_BY_BAND[priority_band]"
          - "increments ConsultRequest.version by 1"
      - from: TRIAGED
        to: RETURNED_FOR_INFO
        trigger: "POST /consult-requests/{consult_id}/return"
        actor: WocNurse
        preconditions:
          - "consult.status == TRIAGED"
          - "consult.revision_count < MAX_REVISIONS"
        side_effects:
          - "clinical_note is left intact; sla_due_at := null; priority_band and acuity_score are left intact"
          - "increments ConsultRequest.version by 1"
        note: "Cycle leg 1 of 2 on this entity."
      - from: RETURNED_FOR_INFO
        to: REQUESTED
        trigger: "POST /consult-requests/{consult_id}/resubmit"
        actor: UnitCharge
        preconditions:
          - "consult.status == RETURNED_FOR_INFO"
          - "consult.revision_count < MAX_REVISIONS"
        side_effects:
          - "clinical_note := payload clinical_note; reported_stage := payload reported_stage"
          - "revision_count := revision_count + 1"
          - "acuity_score := null; acuity_variant := null; priority_band := null; triaged_at := null; sla_due_at := null"
          - "increments ConsultRequest.version by 1"
        note: "Cycle leg 2 of 2 — returns the row to REQUESTED so triage runs again with the revised reported_stage."
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /consult-requests/{consult_id}/assign"
        actor: WocProgramDirector
        preconditions:
          - "consult.status == TRIAGED"
          - "WocNurse(payload assigned_nurse_id).certification_status IN {CANDIDATE, CERTIFIED}"
          - "WocNurse(payload assigned_nurse_id).active_consult_load < WocNurse.max_consult_load"
          - "Patient.status == ADMITTED for consult.patient_id"
        side_effects:
          - "assigned_nurse_id := payload assigned_nurse_id"
          - "WocNurse(assigned_nurse_id).active_consult_load := active_consult_load + 1; increments WocNurse.version by 1"
          - "increments ConsultRequest.version by 1"
      - from: ASSIGNED
        to: ESCALATED
        trigger: "POST /consult-requests/{consult_id}/escalate"
        actor: WocNurse | WocProgramDirector
        preconditions:
          - "consult.status == ASSIGNED"
          - "logical clock > consult.sla_due_at"
        side_effects:
          - "escalation_count := escalation_count + 1"
          - "WocNurse(assigned_nurse_id).active_consult_load is NOT changed — an ESCALATED consult still counts toward load"
          - "increments ConsultRequest.version by 1"
        note: "Cycle leg 1 of the escalation loop."
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /consult-requests/{consult_id}/assign"
        actor: WocProgramDirector
        preconditions:
          - "consult.status == ESCALATED"
          - "WocNurse(payload assigned_nurse_id).certification_status IN {CANDIDATE, CERTIFIED}"
          - "WocNurse(payload assigned_nurse_id).active_consult_load < WocNurse.max_consult_load when payload assigned_nurse_id != consult.assigned_nurse_id"
        side_effects:
          - "when payload assigned_nurse_id != consult.assigned_nurse_id: WocNurse(old assigned_nurse_id).active_consult_load := active_consult_load - 1 and WocNurse(new assigned_nurse_id).active_consult_load := active_consult_load + 1; increments both WocNurse.version by 1"
          - "assigned_nurse_id := payload assigned_nurse_id"
          - "increments ConsultRequest.version by 1"
        note: "Cycle leg 2 of the escalation loop — ASSIGNED -> ESCALATED -> ASSIGNED."
      - from: ASSIGNED
        to: ASSESSED
        trigger: "POST /skin-assessments (system auto-transition on the referenced ConsultRequest)"
        actor: system
        preconditions:
          - "consult.status == ASSIGNED"
          - "the new SkinAssessment's patient_id == consult.patient_id"
        side_effects:
          - "acuity_score := calculations.consult_acuity_score under variant assessed_final using the new assessment's observed_stage and measured_area_cm2"
          - "acuity_variant := ASSESSED_FINAL"
          - "priority_band recomputed from the new acuity_score with the same thresholds"
          - "sla_due_at := triaged_at + SLA_HOURS_BY_BAND[new priority_band]"
          - "increments ConsultRequest.version by 1"
      - from: ASSESSED
        to: PLAN_ACTIVE
        trigger: "POST /dressing-protocols (system auto-transition on the referenced ConsultRequest)"
        actor: system
        preconditions:
          - "consult.status == ASSESSED"
          - "consult.protocol_hold == false"
          - "the SkinAssessment for this consult with the latest created_at has validation_status == VALIDATED"
        side_effects:
          - "any pre-existing DressingProtocol for this consult with status == ACTIVE is set to SUPERSEDED"
          - "increments ConsultRequest.version by 1"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /skin-assessments (system self-transition on the referenced ConsultRequest)"
        actor: system
        preconditions:
          - "consult.status == ASSESSED"
          - "the new SkinAssessment's patient_id == consult.patient_id"
        side_effects:
          - "acuity_score := calculations.consult_acuity_score under variant assessed_final using the NEW assessment's observed_stage and measured_area_cm2; the superseded row never re-enters the formula"
          - "acuity_variant stays ASSESSED_FINAL"
          - "priority_band recomputed from the new acuity_score with the same thresholds"
          - "sla_due_at := triaged_at + SLA_HOURS_BY_BAND[new priority_band]"
          - "increments ConsultRequest.version by 1"
        note: "Re-assessment leg. Required for state_machines.SkinAssessment.PENDING_VALIDATION_to_SUPERSEDED / VALIDATED_to_SUPERSEDED and for state_machines.PressureInjuryCase.CLASSIFIED_HAPI_to_RECLASSIFIED to be reachable at all, and for concurrency_rules.assessment-create-stale-patient to be provoked without tripping the priority-10 state gate first."
      - from: PLAN_ACTIVE
        to: PLAN_ACTIVE
        trigger: "POST /dressing-protocols (system self-transition on the referenced ConsultRequest)"
        actor: system
        preconditions:
          - "consult.status == PLAN_ACTIVE"
          - "consult.protocol_hold == false"
          - "the SkinAssessment for this consult with the latest created_at has validation_status == VALIDATED"
        side_effects:
          - "any pre-existing DressingProtocol for this consult with status == ACTIVE is set to SUPERSEDED"
          - "increments ConsultRequest.version by 1"
        note: "Protocol-revision leg. Required for state_machines.DressingProtocol.ACTIVE_to_SUPERSEDED to be reachable."
      - from: PLAN_ACTIVE
        to: CLOSED
        trigger: "POST /consult-requests/{consult_id}/close"
        actor: WocNurse
        preconditions:
          - "consult.status == PLAN_ACTIVE"
          - "every PressureInjuryCase whose skin_assessment_id belongs to a SkinAssessment of this consult has status IN {CLASSIFIED_POA, RCA_COMPLETE, CLOSED, RECLASSIFIED}"
        side_effects:
          - "closing_summary := payload closing_summary"
          - "WocNurse(assigned_nurse_id).active_consult_load := active_consult_load - 1"
          - "WocNurse(assigned_nurse_id).mentored_consult_count := mentored_consult_count + 1"
          - "WocNurse(assigned_nurse_id).certification_eligibility_score := calculations.certification_eligibility_score; increments WocNurse.version by 1"
          - "increments ConsultRequest.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: RETURNED_FOR_INFO
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: ASSESSED
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: ESCALATED
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "see the shared cancel side-effect block on the PLAN_ACTIVE -> CANCELLED transition"
      - from: PLAN_ACTIVE
        to: CANCELLED
        trigger: "POST /consult-requests/{consult_id}/cancel"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "consult.status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "HOP 1 — consult.status := CANCELLED; when assigned_nurse_id is not null, WocNurse(assigned_nurse_id).active_consult_load := active_consult_load - 1 and increments WocNurse.version by 1"
          - "HOP 2 — caused by hop 1: every SupportSurfaceOrder WHERE consult_request_id == consult.id AND billing_status == ENCUMBERED has billing_status := RELEASED, and every such order WHERE fulfillment_status == REQUESTED also has fulfillment_status := DENIED with denial_reason := 'CONSULT_CANCELLED'; increments SupportSurfaceOrder.version by 1"
          - "HOP 3 — caused by hop 2: for each order whose billing_status became RELEASED, Unit(order.unit_id).rental_encumbered_cents := rental_encumbered_cents - order.authorized_cost_cents, Unit.rental_released_cents := rental_released_cents + order.authorized_cost_cents, Unit.rental_available_cents recomputed; increments Unit.version by 1"
          - "HOP 2b — caused by hop 1: every DressingProtocol WHERE consult_request_id == consult.id AND status == ACTIVE has status := VOIDED; increments DressingProtocol.version by 1"
          - "HOP 2c — caused by hop 1: every OstomyEducationPlan WHERE consult_request_id == consult.id AND status IN {ACTIVE, TEACH_BACK_PASSED, SUPPLIES_TRANSITIONED, FOLLOWUP_SCHEDULED} has status := CLOSED_INCOMPLETE and followup_appointment_at := null; increments OstomyEducationPlan.version by 1"
          - "HOP 3b — caused by hop 2c: for each plan whose status left FOLLOWUP_SCHEDULED, Patient(plan.patient_id).pending_outpatient_followup_count := pending_outpatient_followup_count - 1; increments Patient.version by 1"
          - "increments ConsultRequest.version by 1"
        note: "Compensation transition. The cancel side-effect block above is shared by every *_to_CANCELLED transition on this entity; order of hops is 1, 2, 3, 2b, 2c, 3b."

  - entity: SkinAssessment
    initial_state: PENDING_VALIDATION
    terminal_states: [SUPERSEDED]
    shape: branching_with_cycle
    transitions:
      - from: PENDING_VALIDATION
        to: VALIDATED
        trigger: "POST /skin-assessments/{assessment_id}/validate"
        actor: WocNurse | WocProgramDirector
        preconditions:
          - "assessment.validation_status == PENDING_VALIDATION"
          - "when X-User-Role == WocNurse: X-User-ID != assessment.staged_by_nurse_id"
          - "when payload present_on_admission_confirmed == true: assessment.observed_at <= Patient.admitted_at + POA_WINDOW_HOURS"
        side_effects:
          - "HOP 1 — validation_status := VALIDATED; confirmed_stage := payload confirmed_stage; validated_by_user_id := X-User-ID; poa_determination := calculations.poa_determination; when poa_determination == POA then Patient.poa_skin_assessment_documented := true and increments Patient.version by 1"
          - "HOP 1b — consult.acuity_score recomputed under variant assessed_final using confirmed_stage (not observed_stage) and measured_area_cm2; consult.priority_band and consult.sla_due_at recomputed; increments ConsultRequest.version by 1"
          - "HOP 2 — caused by hop 1: PressureInjuryCase WHERE skin_assessment_id == assessment.id has classification := poa_determination and status := CLASSIFIED_POA when poa_determination == POA, CLASSIFIED_HAPI when poa_determination == HAPI, and is left at OPEN when poa_determination == INDETERMINATE; increments PressureInjuryCase.version by 1"
          - "HOP 3 — caused by hop 2 reaching CLASSIFIED_HAPI only: that same PressureInjuryCase moves CLASSIFIED_HAPI -> RCA_REQUIRED and rca_due_at := logical clock + RCA_DUE_HOURS; increments PressureInjuryCase.version by 1"
          - "HOP 4 — caused by hop 3: Unit(case.unit_id).open_hapi_rca_count := open_hapi_rca_count + 1 and Unit.survey_posture recomputed via the FROZEN >= 4 / RESTRICTED >= 2 / OPEN ladder; increments Unit.version by 1"
          - "HOP 5 — caused by hop 4 when Unit.survey_posture changed to RESTRICTED or FROZEN: every SupportSurfaceOrder WHERE unit_id == case.unit_id AND fulfillment_status == REQUESTED has requires_director_override := true and posture_hold_applied_at := logical clock; increments SupportSurfaceOrder.version by 1"
          - "increments SkinAssessment.version by 1"
        note: "Branch A of the fork. Hops 1 -> 2 -> 3 -> 4 -> 5 is the deep transitive cascade; each hop is caused by the previous hop's mutation, not by the original validate call."
      - from: PENDING_VALIDATION
        to: DISPUTED
        trigger: "POST /skin-assessments/{assessment_id}/dispute"
        actor: WocProgramDirector
        preconditions:
          - "assessment.validation_status == PENDING_VALIDATION"
        side_effects:
          - "validation_status := DISPUTED; dispute_reason := payload dispute_reason; poa_determination stays null; confirmed_stage stays null"
          - "ConsultRequest(assessment.consult_request_id).protocol_hold := true; increments ConsultRequest.version by 1"
          - "Unit(Patient(assessment.patient_id).unit_id).disputed_staging_count := disputed_staging_count + 1; increments Unit.version by 1"
          - "no PressureInjuryCase field is touched — the case stays classification == UNDETERMINED, status == OPEN"
          - "increments SkinAssessment.version by 1"
        note: "Branch B of the fork. Divergent side-effect set from branch A: no case classification, no RCA, no Unit posture movement, but a protocol hold and a disputed-staging counter that branch A never touches."
      - from: DISPUTED
        to: PENDING_VALIDATION
        trigger: "POST /skin-assessments/{assessment_id}/restage"
        actor: WocNurse
        preconditions:
          - "assessment.validation_status == DISPUTED"
          - "X-User-ID == assessment.staged_by_nurse_id"
        side_effects:
          - "observed_stage := payload observed_stage; measured_area_cm2 := payload measured_area_cm2; restage_count := restage_count + 1; dispute_reason := null"
          - "ConsultRequest(assessment.consult_request_id).protocol_hold := false; increments ConsultRequest.version by 1"
          - "increments SkinAssessment.version by 1"
        note: "Closes the DISPUTED -> PENDING_VALIDATION -> DISPUTED cycle."
      - from: PENDING_VALIDATION
        to: SUPERSEDED
        trigger: "POST /skin-assessments (system, when the new row shares (patient_id, anatomic_location) with this row)"
        actor: system
        preconditions:
          - "assessment.validation_status IN {PENDING_VALIDATION, VALIDATED}"
          - "the incoming row has the same patient_id and anatomic_location"
        side_effects:
          - "validation_status := SUPERSEDED; increments SkinAssessment.version by 1"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /skin-assessments (system, when the new row shares (patient_id, anatomic_location) with this row)"
        actor: system
        preconditions:
          - "assessment.validation_status == VALIDATED"
          - "the incoming row has the same patient_id and anatomic_location"
        side_effects:
          - "validation_status := SUPERSEDED"
          - "PressureInjuryCase WHERE skin_assessment_id == assessment.id AND status IN {OPEN, CLASSIFIED_POA, CLASSIFIED_HAPI, RCA_REQUIRED} moves to RECLASSIFIED; a successor PressureInjuryCase is created with predecessor_case_id := that case id, skin_assessment_id := the new assessment id, classification := UNDETERMINED, status := OPEN"
          - "when the RECLASSIFIED case had status IN {CLASSIFIED_HAPI, RCA_REQUIRED}: Unit(case.unit_id).open_hapi_rca_count := open_hapi_rca_count - 1 and Unit.survey_posture recomputed; increments Unit.version by 1"
          - "increments SkinAssessment.version by 1"

  - entity: PressureInjuryCase
    initial_state: OPEN
    terminal_states: [CLOSED, RECLASSIFIED]
    shape: branching_compound
    transitions:
      - from: OPEN
        to: CLASSIFIED_POA
        trigger: "POST /skin-assessments/{assessment_id}/validate (system cascade hop 2)"
        actor: system
        preconditions:
          - "case.status == OPEN"
          - "calculations.poa_determination for the originating assessment == POA"
        side_effects:
          - "classification := POA; Unit.open_hapi_rca_count is NOT touched; no RCA is opened"
          - "increments PressureInjuryCase.version by 1"
      - from: OPEN
        to: CLASSIFIED_HAPI
        trigger: "POST /skin-assessments/{assessment_id}/validate (system cascade hop 2)"
        actor: system
        preconditions:
          - "case.status == OPEN"
          - "calculations.poa_determination for the originating assessment == HAPI"
        side_effects:
          - "classification := HAPI"
          - "immediately triggers the CLASSIFIED_HAPI -> RCA_REQUIRED transition below"
          - "increments PressureInjuryCase.version by 1"
      - from: CLASSIFIED_HAPI
        to: RCA_REQUIRED
        trigger: "system, caused by the case entering CLASSIFIED_HAPI"
        actor: system
        preconditions:
          - "case.status == CLASSIFIED_HAPI"
        side_effects:
          - "rca_due_at := logical clock + RCA_DUE_HOURS"
          - "Unit(case.unit_id).open_hapi_rca_count := open_hapi_rca_count + 1 and Unit.survey_posture recomputed; increments Unit.version by 1"
          - "increments PressureInjuryCase.version by 1"
      - from: RCA_REQUIRED
        to: RCA_IN_PROGRESS
        trigger: "POST /pressure-injury-cases/{case_id}/rca-start"
        actor: WocNurse
        preconditions:
          - "case.status == RCA_REQUIRED"
          - "WocNurse(payload rca_lead_nurse_id).certification_status == CERTIFIED"
          - "payload rca_lead_nurse_id != SkinAssessment(case.skin_assessment_id).staged_by_nurse_id"
        side_effects:
          - "rca_lead_nurse_id := payload rca_lead_nurse_id"
          - "increments PressureInjuryCase.version by 1"
      - from: RCA_IN_PROGRESS
        to: RCA_COMPLETE
        trigger: "POST /pressure-injury-cases/{case_id}/rca-complete"
        actor: WocNurse
        preconditions:
          - "case.status == RCA_IN_PROGRESS"
          - "X-User-ID == case.rca_lead_nurse_id"
          - "payload contributing_factors has length >= 1"
        side_effects:
          - "root_cause_category := payload root_cause_category; contributing_factors := payload contributing_factors"
          - "increments PressureInjuryCase.version by 1"
      - from: RCA_COMPLETE
        to: CLOSED
        trigger: "POST /pressure-injury-cases/{case_id}/close"
        actor: WocProgramDirector
        preconditions:
          - "case.status == RCA_COMPLETE"
        side_effects:
          - "closed_at := logical clock"
          - "Unit(case.unit_id).open_hapi_rca_count := open_hapi_rca_count - 1 and Unit.survey_posture recomputed via the same ladder; increments Unit.version by 1"
          - "when Unit.survey_posture returns to OPEN: every SupportSurfaceOrder WHERE unit_id == case.unit_id AND fulfillment_status == REQUESTED has requires_director_override := false and posture_hold_applied_at := null; increments SupportSurfaceOrder.version by 1"
          - "increments PressureInjuryCase.version by 1"
        note: "Compensation for the validate cascade — reverses hops 4 and 5 exactly."
      - from: CLASSIFIED_POA
        to: CLOSED
        trigger: "POST /pressure-injury-cases/{case_id}/close"
        actor: WocProgramDirector
        preconditions:
          - "case.status == CLASSIFIED_POA"
        side_effects:
          - "closed_at := logical clock; Unit counters are NOT touched because a POA case never incremented open_hapi_rca_count"
          - "increments PressureInjuryCase.version by 1"
      - from: CLASSIFIED_HAPI
        to: RECLASSIFIED
        trigger: "POST /skin-assessments (system, superseding assessment for the same (patient_id, anatomic_location))"
        actor: system
        preconditions:
          - "case.status IN {OPEN, CLASSIFIED_POA, CLASSIFIED_HAPI, RCA_REQUIRED}"
        side_effects:
          - "a successor PressureInjuryCase is created with predecessor_case_id := this case id"
          - "Unit(case.unit_id).open_hapi_rca_count := open_hapi_rca_count - 1 when this case had status IN {CLASSIFIED_HAPI, RCA_REQUIRED}; Unit.survey_posture recomputed; increments Unit.version by 1"
          - "increments PressureInjuryCase.version by 1"

  - entity: SupportSurfaceOrder
    dimension: fulfillment_status
    initial_state: REQUESTED
    terminal_states: [RETURNED, DENIED]
    shape: parallel_dimension_1_of_2
    note: |
      SupportSurfaceOrder carries TWO independent state dimensions on the same
      row. fulfillment_status tracks logistics; billing_status tracks money.
      POST /deliver moves only fulfillment_status; POST /reconcile moves only
      billing_status. The two dimensions therefore advance independently and a
      correct implementation must not couple them.
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /support-surface-orders/{order_id}/approve"
        actor: MaterialsCoordinator
        preconditions:
          - "order.fulfillment_status == REQUESTED"
          - "payload expected_unit_version == Unit(order.unit_id).version"
          - "Unit(order.unit_id).survey_posture != FROZEN"
          - "order.requires_director_override == false OR payload director_override == true"
          - "order.billable_days <= order.authorized_days"
          - "order.authorized_cost_cents <= Unit(order.unit_id).rental_available_cents"
          - "no other SupportSurfaceOrder on order.support_surface_id with fulfillment_status IN {APPROVED, DELIVERED} occupies an interval that collides with [order.rental_start, order.rental_end) extended by RECLEAN_BUFFER_HOURS"
        side_effects:
          - "fulfillment_status := APPROVED"
          - "billing_status := ENCUMBERED (the only call that moves both dimensions)"
          - "Unit(order.unit_id).rental_encumbered_cents := rental_encumbered_cents + order.authorized_cost_cents; Unit.rental_available_cents recomputed; increments Unit.version by 1"
          - "SupportSurface(order.support_surface_id).status := IN_USE; occupied_until := order.rental_end; available_from := order.rental_end + RECLEAN_BUFFER_HOURS; increments SupportSurface.version by 1"
          - "increments SupportSurfaceOrder.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /support-surface-orders/{order_id}/deny"
        actor: MaterialsCoordinator
        preconditions:
          - "order.fulfillment_status == REQUESTED"
        side_effects:
          - "fulfillment_status := DENIED; denial_reason := payload denial_reason"
          - "billing_status is left at UNBILLED because nothing was ever encumbered"
          - "increments SupportSurfaceOrder.version by 1"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /support-surface-orders/{order_id}/deliver"
        actor: MaterialsCoordinator
        preconditions:
          - "order.fulfillment_status == APPROVED"
          - "payload delivered_at >= order.rental_start"
        side_effects:
          - "fulfillment_status := DELIVERED; delivered_at := payload delivered_at"
          - "billing_status is NOT touched — it stays ENCUMBERED"
          - "increments SupportSurfaceOrder.version by 1"
        note: "Dimension-1-only transition; proves the two dimensions are independent."
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /support-surface-orders/{order_id}/return"
        actor: MaterialsCoordinator
        preconditions:
          - "order.fulfillment_status == DELIVERED"
          - "payload actual_return_at > order.rental_start"
        side_effects:
          - "fulfillment_status := RETURNED; actual_return_at := payload actual_return_at"
          - "actual_cost_cents := calculations.rental_cost_projection over ceil((actual_return_at - rental_start)/BILLABLE_DAY_HOURS) days, plus calculations.vendor_service_fee recomputed on that projected figure"
          - "billing_status := COMMITTED (this call moves both dimensions)"
          - "Unit(order.unit_id).rental_encumbered_cents := rental_encumbered_cents - order.authorized_cost_cents; rental_committed_cents := rental_committed_cents + order.actual_cost_cents; rental_released_cents := rental_released_cents + max(0, order.authorized_cost_cents - order.actual_cost_cents); rental_available_cents recomputed; increments Unit.version by 1"
          - "SupportSurface(order.support_surface_id).status := CLEANING; occupied_until := actual_return_at; available_from := actual_return_at + RECLEAN_BUFFER_HOURS; increments SupportSurface.version by 1"
          - "increments SupportSurfaceOrder.version by 1"

  - entity: SupportSurfaceOrder
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [RELEASED, RECONCILED]
    shape: parallel_dimension_2_of_2
    transitions:
      - from: UNBILLED
        to: ENCUMBERED
        trigger: "POST /support-surface-orders/{order_id}/approve"
        actor: MaterialsCoordinator
        preconditions:
          - "order.billing_status == UNBILLED"
          - "order.authorized_cost_cents <= Unit(order.unit_id).rental_available_cents"
        side_effects:
          - "Unit ledger encumbrance as described on the fulfillment REQUESTED -> APPROVED transition"
      - from: ENCUMBERED
        to: COMMITTED
        trigger: "POST /support-surface-orders/{order_id}/return"
        actor: MaterialsCoordinator
        preconditions:
          - "order.billing_status == ENCUMBERED"
        side_effects:
          - "Unit ledger commit-and-release as described on the fulfillment DELIVERED -> RETURNED transition"
      - from: ENCUMBERED
        to: RELEASED
        trigger: "POST /consult-requests/{consult_id}/cancel (system cascade hop 2)"
        actor: system
        preconditions:
          - "order.billing_status == ENCUMBERED"
          - "order.consult_request_id == the cancelled consult id"
        side_effects:
          - "Unit(order.unit_id).rental_encumbered_cents := rental_encumbered_cents - order.authorized_cost_cents; rental_released_cents := rental_released_cents + order.authorized_cost_cents; rental_available_cents recomputed; increments Unit.version by 1"
          - "increments SupportSurfaceOrder.version by 1"
        note: "Compensating leg of the money invariant unit_rental_ledger_conservation."
      - from: COMMITTED
        to: RECONCILED
        trigger: "POST /support-surface-orders/{order_id}/reconcile"
        actor: MaterialsCoordinator
        preconditions:
          - "order.billing_status == COMMITTED"
          - "order.fulfillment_status == RETURNED"
        side_effects:
          - "billing_status := RECONCILED; no ledger amount moves — rental_committed_cents already carries actual_cost_cents for both COMMITTED and RECONCILED"
          - "SupportSurface(order.support_surface_id).status := AVAILABLE when the logical clock >= SupportSurface.available_from; increments SupportSurface.version by 1"
          - "increments SupportSurfaceOrder.version by 1"
        note: "Dimension-2-only transition; proves the two dimensions are independent."

  - entity: SurveyRound
    initial_state: PLANNED
    terminal_states: [PUBLISHED, CANCELLED]
    shape: compound_guarded
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /survey-rounds/{round_id}/open"
        actor: WocProgramDirector
        preconditions:
          - "round.status == PLANNED"
          - "for round_type == PREVALENCE: no other SurveyRound with round_type == PREVALENCE, status IN {OPEN, LOCKED, PUBLISHED} and an overlapping CLOSED window shares any Unit id with round.participating_unit_ids"
          - "for round_type == INCIDENCE: at most MAX_CONCURRENT_INCIDENCE_ROUNDS - 1 other SurveyRounds with round_type == INCIDENCE, status IN {OPEN, LOCKED} and an overlapping CLOSED window share any Unit id with round.participating_unit_ids"
        side_effects:
          - "increments SurveyRound.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /survey-rounds/{round_id}/lock"
        actor: WocProgramDirector
        preconditions:
          - "round.status == OPEN"
          - "every Unit id in round.participating_unit_ids has at least one SurveyObservation with survey_round_id == round.id"
        side_effects:
          - "no further SurveyObservation may be created against this round"
          - "increments SurveyRound.version by 1"
        note: "Compound guard — the parent's transition is gated by the aggregate coverage of its observation children."
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /survey-rounds/{round_id}/publish"
        actor: WocProgramDirector
        preconditions:
          - "round.status == LOCKED"
        side_effects:
          - "published_at := logical clock"
          - "for each Unit id in participating_unit_ids: when round_type == PREVALENCE, Unit.last_prevalence_rate := calculations.unit_survey_metric variant prevalence; when round_type == INCIDENCE, Unit.last_incidence_rate := calculations.unit_survey_metric variant incidence; increments Unit.version by 1"
          - "increments SurveyRound.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /survey-rounds/{round_id}/cancel"
        actor: WocProgramDirector
        preconditions:
          - "round.status == PLANNED"
        side_effects:
          - "increments SurveyRound.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /survey-rounds/{round_id}/cancel"
        actor: WocProgramDirector
        preconditions:
          - "round.status == OPEN"
        side_effects:
          - "existing SurveyObservation rows are retained but no Unit metric is written"
          - "increments SurveyRound.version by 1"

  - entity: WocNurse
    initial_state: TRAINEE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: TRAINEE
        to: CANDIDATE
        trigger: "POST /woc-nurses/{nurse_id}/advance"
        actor: WocProgramDirector
        preconditions:
          - "nurse.certification_status == TRAINEE"
          - "nurse.competency_signoff_count >= 1"
        side_effects:
          - "certification_status := CANDIDATE; max_consult_load := MAX_LOAD_BY_CERT[CANDIDATE] = 3"
          - "increments WocNurse.version by 1"
      - from: CANDIDATE
        to: CERTIFIED
        trigger: "POST /woc-nurses/{nurse_id}/certify"
        actor: WocProgramDirector
        preconditions:
          - "nurse.certification_status IN {CANDIDATE, LAPSED}"
          - "nurse.certification_eligibility_score >= ELIGIBILITY_SCORE_FLOOR"
          - "nurse.ce_credits >= CE_CREDIT_FLOOR"
          - "nurse.competency_signoff_count >= SIGNOFF_FLOOR"
        side_effects:
          - "certification_status := CERTIFIED; cert_expires_at := payload cert_expires_at; max_consult_load := MAX_LOAD_BY_CERT[CERTIFIED] = 8"
          - "increments WocNurse.version by 1"
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /woc-nurses/{nurse_id}/lapse"
        actor: WocProgramDirector
        preconditions:
          - "nurse.certification_status == CERTIFIED"
        side_effects:
          - "certification_status := LAPSED; max_consult_load := MAX_LOAD_BY_CERT[LAPSED] = 0"
          - "active_consult_load is NOT changed — already-assigned consults stay assigned; only new assignments are blocked"
          - "increments WocNurse.version by 1"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /woc-nurses/{nurse_id}/certify"
        actor: WocProgramDirector
        preconditions:
          - "nurse.certification_status IN {CANDIDATE, LAPSED}"
          - "nurse.certification_eligibility_score >= ELIGIBILITY_SCORE_FLOOR"
          - "nurse.ce_credits >= CE_CREDIT_FLOOR"
          - "nurse.competency_signoff_count >= SIGNOFF_FLOOR"
        side_effects:
          - "certification_status := CERTIFIED; cert_expires_at := payload cert_expires_at; max_consult_load := 8"
          - "increments WocNurse.version by 1"
        note: "Closes the CERTIFIED -> LAPSED -> CERTIFIED renewal cycle."

  - entity: DressingProtocol
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, VOIDED]
    shape: linear_with_compensation
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /dressing-protocols (system, when a newer protocol is filed on the same consult_request_id)"
        actor: system
        preconditions:
          - "protocol.status == ACTIVE"
        side_effects:
          - "increments DressingProtocol.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /consult-requests/{consult_id}/cancel (system cascade hop 2b)"
        actor: system
        preconditions:
          - "protocol.status == ACTIVE"
          - "protocol.consult_request_id == the cancelled consult id"
        side_effects:
          - "increments DressingProtocol.version by 1"

  - entity: OstomyEducationPlan
    initial_state: ACTIVE
    terminal_states: [FOLLOWUP_SCHEDULED, CLOSED_INCOMPLETE]
    shape: linear_with_compensation
    transitions:
      - from: ACTIVE
        to: TEACH_BACK_PASSED
        trigger: "POST /ostomy-education-plans/{plan_id}/sessions"
        actor: WocNurse
        preconditions:
          - "plan.status == ACTIVE"
          - "payload teach_back_score >= TEACH_BACK_PASS_SCORE"
        side_effects:
          - "sessions_completed := sessions_completed + 1; teach_back_score := payload teach_back_score"
          - "increments OstomyEducationPlan.version by 1"
        note: "A session whose teach_back_score < TEACH_BACK_PASS_SCORE increments sessions_completed and updates teach_back_score but leaves status at ACTIVE."
      - from: TEACH_BACK_PASSED
        to: SUPPLIES_TRANSITIONED
        trigger: "POST /ostomy-education-plans/{plan_id}/transition-supplies"
        actor: WocNurse
        preconditions:
          - "plan.status == TEACH_BACK_PASSED"
          - "payload followup_appointment_at > the logical clock"
        side_effects:
          - "HOP 1 — supply_transition_status := TRANSITIONED; followup_appointment_at := payload followup_appointment_at"
          - "HOP 2 — caused by hop 1 setting followup_appointment_at: status advances SUPPLIES_TRANSITIONED -> FOLLOWUP_SCHEDULED and Patient(plan.patient_id).pending_outpatient_followup_count := pending_outpatient_followup_count + 1; increments Patient.version by 1"
          - "increments OstomyEducationPlan.version by 1"
      - from: SUPPLIES_TRANSITIONED
        to: FOLLOWUP_SCHEDULED
        trigger: "system, caused by followup_appointment_at becoming non-null"
        actor: system
        preconditions:
          - "plan.supply_transition_status == TRANSITIONED"
          - "plan.followup_appointment_at is not null"
        side_effects:
          - "Patient.pending_outpatient_followup_count := pending_outpatient_followup_count + 1 — this IS hop 2 of the TEACH_BACK_PASSED -> SUPPLIES_TRANSITIONED transition above, applied exactly ONCE per plan and never twice"
          - "increments OstomyEducationPlan.version by 1"
      - from: FOLLOWUP_SCHEDULED
        to: CLOSED_INCOMPLETE
        trigger: "POST /consult-requests/{consult_id}/cancel (system cascade hop 2c)"
        actor: system
        preconditions:
          - "plan.status IN {ACTIVE, TEACH_BACK_PASSED, SUPPLIES_TRANSITIONED, FOLLOWUP_SCHEDULED}"
        side_effects:
          - "followup_appointment_at := null"
          - "Patient(plan.patient_id).pending_outpatient_followup_count := pending_outpatient_followup_count - 1 when the plan left FOLLOWUP_SCHEDULED; increments Patient.version by 1"
          - "increments OstomyEducationPlan.version by 1"
      - from: ACTIVE
        to: CLOSED_INCOMPLETE
        trigger: "POST /consult-requests/{consult_id}/cancel (system cascade hop 2c)"
        actor: system
        preconditions:
          - "plan.status IN {ACTIVE, TEACH_BACK_PASSED, SUPPLIES_TRANSITIONED, FOLLOWUP_SCHEDULED}"
        side_effects:
          - "followup_appointment_at := null; Patient.pending_outpatient_followup_count is NOT changed because the plan never reached FOLLOWUP_SCHEDULED"
          - "increments OstomyEducationPlan.version by 1"

  - entity: SupportSurface
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "POST /support-surface-orders/{order_id}/approve (system)"
        actor: system
        preconditions:
          - "surface.status IN {AVAILABLE, CLEANING}"
        side_effects:
          - "occupied_until := order.rental_end; available_from := order.rental_end + RECLEAN_BUFFER_HOURS"
          - "increments SupportSurface.version by 1"
      - from: IN_USE
        to: CLEANING
        trigger: "POST /support-surface-orders/{order_id}/return (system)"
        actor: system
        preconditions:
          - "surface.status == IN_USE"
        side_effects:
          - "occupied_until := order.actual_return_at; available_from := order.actual_return_at + RECLEAN_BUFFER_HOURS"
          - "increments SupportSurface.version by 1"
      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /support-surface-orders/{order_id}/reconcile (system, only when the logical clock >= surface.available_from)"
        actor: system
        preconditions:
          - "surface.status == CLEANING"
          - "logical clock >= surface.available_from"
        side_effects:
          - "increments SupportSurface.version by 1"
        note: "Closes the AVAILABLE -> IN_USE -> CLEANING -> AVAILABLE cycle."
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /support-surfaces/{surface_id}/retire"
        actor: MaterialsCoordinator
        preconditions:
          - "surface.status IN {AVAILABLE, CLEANING}"
          - "no SupportSurfaceOrder on this surface has fulfillment_status IN {REQUESTED, APPROVED, DELIVERED}"
        side_effects:
          - "increments SupportSurface.version by 1"
      - from: CLEANING
        to: RETIRED
        trigger: "POST /support-surfaces/{surface_id}/retire"
        actor: MaterialsCoordinator
        preconditions:
          - "surface.status IN {AVAILABLE, CLEANING}"
          - "no SupportSurfaceOrder on this surface has fulfillment_status IN {REQUESTED, APPROVED, DELIVERED}"
        side_effects:
          - "increments SupportSurface.version by 1"

  - entity: FormularyProduct
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /formulary-products/{product_id}/archive"
        actor: WocProgramDirector
        preconditions:
          - "product.status == ACTIVE"
        side_effects:
          - "existing DressingProtocol rows keep their status; only new protocol creation is blocked"
          - "increments FormularyProduct.version by 1"

  - entity: Patient
    initial_state: ADMITTED
    terminal_states: [DISCHARGED]
    shape: linear
    transitions:
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /patients/{patient_id}/discharge"
        actor: UnitCharge | WocProgramDirector
        preconditions:
          - "patient.status == ADMITTED"
          - "payload discharged_at >= patient.admitted_at"
          - "no SupportSurfaceOrder for this patient has fulfillment_status IN {APPROVED, DELIVERED}"
        side_effects:
          - "discharged_at := payload discharged_at"
          - "increments Patient.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /skin-assessments"
    occ_field: "expected_patient_version"
    description: |
      Filing a SkinAssessment against a Patient whose version has advanced
      since the client last observed it is rejected. A second assessment for
      the same (patient_id, anatomic_location) legitimately supersedes the
      first under state_machines.SkinAssessment.VALIDATED_to_SUPERSEDED, so the
      write is not blocked by any state precondition; the stale-version check
      is what stops a writer whose view of the patient predates that
      supersession from silently discarding it.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: order-approve-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /support-surface-orders/{order_id}/approve"
    occ_field: "expected_unit_version"
    description: |
      Approving a SupportSurfaceOrder against a Unit whose version has
      advanced since the client read the rental ledger is rejected. Two
      distinct REQUESTED orders on the same Unit each satisfy every state
      precondition on their own, and each would legitimately succeed against
      the ledger the client observed; the stale-version check is what forces
      the second approver to re-read rental_available_cents before committing
      more of the same budget.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
global_constants:
  POA_WINDOW_HOURS: 24
  RCA_DUE_HOURS: 72
  MAX_REVISIONS: 2
  RECLEAN_BUFFER_HOURS: 12
  BILLABLE_DAY_HOURS: 24
  HOURS_PER_WEEK: 168
  MAX_CONCURRENT_INCIDENCE_ROUNDS: 2
  TEACH_BACK_PASS_SCORE: 80
  ELIGIBILITY_SCORE_FLOOR: 55.00
  CE_CREDIT_FLOOR: 30
  SIGNOFF_FLOOR: 2
  MAX_LOAD_BY_CERT: { TRAINEE: 0, CANDIDATE: 3, CERTIFIED: 8, LAPSED: 0 }
  SLA_HOURS_BY_BAND: { P1: 4, P2: 24, P3: 72 }
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"

calculations:

  - name: consult_acuity_score
    trigger: "POST /consult-requests/{consult_id}/triage (variant intake_provisional); POST /skin-assessments and POST /skin-assessments/{assessment_id}/validate (variant assessed_final)"
    algorithm: weighted_scoring
    formula: |
      # inputs, all pinned by exact field name:
      #   stage_source        -> see variants below
      #   comorbidity_count   -> Patient.comorbidity_count
      #   device_related_risk -> Patient.device_related_risk
      #   consult_type        -> ConsultRequest.consult_type
      #   measured_area_cm2   -> SkinAssessment.measured_area_cm2 (assessed_final only)
      base_points      = STAGE_WEIGHT[stage_source]
      comorbid_points  = min(COMORBIDITY_POINTS_CAP, COMORBIDITY_POINTS_EACH * comorbidity_count)
      device_points    = DEVICE_RELATED_POINTS if device_related_risk == true else 0
      area_points      = 0                                   # intake_provisional
                       | min(AREA_POINTS_CAP,
                             floor(measured_area_cm2 / AREA_POINTS_STEP_CM2) * AREA_POINTS_PER_STEP)
                                                             # assessed_final
      raw              = (base_points + comorbid_points + device_points + area_points)
                         * TYPE_MULTIPLIER[consult_type]
      # EVALUATION ORDER IS PINNED: round to 1 decimal FIRST, then clamp to
      # ACUITY_MAX. Clamping before rounding is forbidden.
      acuity_score     = min(ACUITY_MAX, round_half_up(raw, 1))
      priority_band    = P1 if acuity_score >= P1_THRESHOLD
                       else P2 if acuity_score >= P2_THRESHOLD
                       else P3
      sla_due_at       = ConsultRequest.triaged_at + SLA_HOURS_BY_BAND[priority_band]
    input_set: |
      Exactly one ConsultRequest row plus its Patient row. For variant
      assessed_final, additionally the single SkinAssessment row that drove the
      recompute — at creation time the row just inserted, at validation time the
      row being validated. No other assessment rows enter the formula, so a
      SUPERSEDED assessment never influences acuity_score.
    constants:
      STAGE_WEIGHT: { NONE: 0, MUCOSAL: 15, STAGE_1: 20, STAGE_2: 35, DTI: 45, STAGE_3: 60, UNSTAGEABLE: 70, STAGE_4: 80 }
      TYPE_MULTIPLIER: { WOUND: 1.00, OSTOMY: 1.15, INCONTINENCE: 0.90 }
      COMORBIDITY_POINTS_EACH: 5
      COMORBIDITY_POINTS_CAP: 25
      DEVICE_RELATED_POINTS: 10
      AREA_POINTS_STEP_CM2: 10
      AREA_POINTS_PER_STEP: 5
      AREA_POINTS_CAP: 15
      ACUITY_MAX: 100
      P1_THRESHOLD: 70.0
      P2_THRESHOLD: 40.0
    precision: "1 decimal place, round_half_up; priority_band comparisons use >= against P1_THRESHOLD then P2_THRESHOLD"
    variants:
      - name: intake_provisional
        when: "Run by POST /consult-requests/{consult_id}/triage, before any bedside assessment exists."
        difference: "stage_source := ConsultRequest.reported_stage and area_points := 0, because the requesting unit supplies no measurement."
      - name: assessed_final
        when: "Run by POST /skin-assessments (stage_source := SkinAssessment.observed_stage) and again by POST /skin-assessments/{assessment_id}/validate (stage_source := SkinAssessment.confirmed_stage)."
        difference: "stage_source comes from the WOC nurse's own staging and area_points is non-zero once measured_area_cm2 >= AREA_POINTS_STEP_CM2, so the same wound can move several priority bands relative to intake_provisional."

  - name: unit_survey_metric
    trigger: "POST /survey-rounds/{round_id}/publish, once per Unit id in SurveyRound.participating_unit_ids"
    algorithm: aggregation
    formula: |
      # Scope: SurveyObservation rows WHERE survey_round_id == round.id
      #        AND unit_id == the Unit being reported.
      # PREVALENCE variant
      prev_numerator   = count(rows WHERE injury_present == true)
      prev_denominator = count(rows)                      # every observation counts
      prevalence_rate  = 0.00 if prev_denominator == 0
                         else round_half_up(100 * prev_numerator / prev_denominator, 2)
      # INCIDENCE variant
      inc_numerator    = count(rows WHERE injury_present == true
                                     AND classification == HAPI
                                     AND round.window_start <= onset_at <= round.window_end)
      inc_denominator  = count(rows WHERE at_risk == true)
      incidence_rate   = 0.00 if inc_denominator == 0
                         else round_half_up(100 * inc_numerator / inc_denominator, 2)
    input_set: |
      Only SurveyObservation rows attached to the round being published and to
      the Unit being reported. Rows are immutable (SurveyObservation has
      common_fields: false), and the round is LOCKED before publish, so the set
      is frozen. Observations attached to other rounds on the same Unit are
      excluded. Ordering is irrelevant because both variants are pure counts.
    constants:
      PERCENT_SCALE: 100
      EMPTY_DENOMINATOR_RESULT: 0.00
    precision: "2 decimal places, round_half_up; an empty denominator yields exactly 0.00 and never raises"
    variants:
      - name: prevalence
        when: "SurveyRound.round_type == PREVALENCE; written to Unit.last_prevalence_rate."
        difference: "Numerator counts every observation with injury_present == true regardless of classification, so POA injuries are INCLUDED; denominator is the full observation count regardless of at_risk."
      - name: incidence
        when: "SurveyRound.round_type == INCIDENCE; written to Unit.last_incidence_rate."
        difference: "Numerator counts only classification == HAPI rows whose onset_at sits inside the CLOSED round window, so POA injuries are EXCLUDED; denominator counts only at_risk == true rows. Identical observation sets therefore yield a different percentage from the prevalence variant."

  - name: rental_cost_projection
    trigger: "POST /support-surface-orders (projected_cost_cents) and POST /support-surface-orders/{order_id}/return (recomputed over the realised interval for actual_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      interval_hours = (interval_end - rental_start) in whole hours
                       # interval_end = rental_end at creation,
                       #                actual_return_at at return
      billable_days  = ceil(interval_hours / BILLABLE_DAY_HOURS)   # any partial day rounds UP
      rate_for_day(d) = daily_rate_cents * TIER_1_FACTOR  if 1  <= d <= TIER_1_LAST_DAY
                      | daily_rate_cents * TIER_2_FACTOR  if TIER_1_LAST_DAY < d <= TIER_2_LAST_DAY
                      | daily_rate_cents * TIER_3_FACTOR  if d > TIER_2_LAST_DAY
      # ROUNDING ORDER IS PINNED: round EACH day's charge to whole cents with
      # round_half_up, THEN sum the rounded per-day figures. Summing the
      # unrounded per-day rates and rounding the total once is FORBIDDEN and
      # yields a different answer (e.g. 14 days at 12345 cents/day gives
      # 164192 per-day-then-sum versus 164189 sum-then-round).
      projected_cost_cents = sum over d in 1..billable_days of
                               round_half_up(rate_for_day(d), 0)
    input_set: "Exactly one SupportSurfaceOrder row and the SupportSurface row named by its support_surface_id. daily_rate_cents is read from the SupportSurface at calculation time."
    constants:
      TIER_1_LAST_DAY: 7
      TIER_2_LAST_DAY: 21
      TIER_1_FACTOR: 1.00
      TIER_2_FACTOR: 0.90
      TIER_3_FACTOR: 0.75
      BILLABLE_DAY_HOURS: 24
    precision: "whole cents; round_half_up applied ONCE PER DAY, never to the total"

  - name: vendor_service_fee
    trigger: "POST /support-surface-orders (immediately after rental_cost_projection) and POST /support-surface-orders/{order_id}/return"
    algorithm: threshold
    formula: |
      # This formula LOOKS circular: authorized_cost_cents is the figure the
      # Unit is charged, and the fee percentage is keyed on a cost tier — but
      # which cost? EVALUATION ORDER IS PINNED:
      #   step 1: read projected_cost_cents (PRE-fee figure)
      #   step 2: pick fee_pct from the tier that projected_cost_cents falls in
      #   step 3: fee = round_half_up(projected_cost_cents * fee_pct, 0)
      #   step 4: authorized_cost_cents = projected_cost_cents + fee
      # Keying step 2 on authorized_cost_cents is FORBIDDEN. Worked divergence:
      # projected 199000 -> tier 2 (5%) -> fee 9950 -> authorized 208950.
      # Had the tier been keyed on authorized_cost_cents (208950 >= 200000),
      # fee would have been 3% = 5970 and authorized 204970.
      fee_pct = FEE_PCT_TIER_1 if projected_cost_cents < FEE_TIER_2_FLOOR
              | FEE_PCT_TIER_2 if FEE_TIER_2_FLOOR <= projected_cost_cents < FEE_TIER_3_FLOOR
              | FEE_PCT_TIER_3 otherwise
      vendor_service_fee_cents = round_half_up(projected_cost_cents * fee_pct, 0)
      authorized_cost_cents    = projected_cost_cents + vendor_service_fee_cents
    input_set: "Exactly one SupportSurfaceOrder row; only its own projected_cost_cents participates."
    constants:
      FEE_TIER_2_FLOOR: 50000
      FEE_TIER_3_FLOOR: 200000
      FEE_PCT_TIER_1: 0.08
      FEE_PCT_TIER_2: 0.05
      FEE_PCT_TIER_3: 0.03
    precision: "whole cents, round_half_up on the fee only; the sum is exact integer addition"

  - name: poa_determination
    trigger: "POST /skin-assessments/{assessment_id}/validate"
    algorithm: chronological
    formula: |
      window_end = Patient.admitted_at + POA_WINDOW_HOURS
      # Candidate set: SkinAssessment rows WHERE patient_id == assessment.patient_id
      #   AND anatomic_location == assessment.anatomic_location
      #   AND validation_status IN {PENDING_VALIDATION, VALIDATED, DISPUTED, SUPERSEDED}
      # Ordering: observed_at ASC, then created_at ASC as the sole tie-break.
      # `id` is never consulted.
      earliest_observed_at = observed_at of the first row in that ordering
      poa_determination =
          POA           if present_on_admission_confirmed == true
        | HAPI          if present_on_admission_confirmed == false
                           AND earliest_observed_at > window_end
        | INDETERMINATE otherwise
    input_set: "All non-terminal and superseded SkinAssessment rows for the same (patient_id, anatomic_location) pair, so a later re-stage of the same site cannot flip an injury first documented on admission into a hospital-acquired one."
    constants:
      POA_WINDOW_HOURS: 24
    precision: "exact datetime comparison at millisecond resolution; the window bound is INCLUSIVE (observed_at == window_end is inside the window)"

  - name: certification_eligibility_score
    trigger: "POST /woc-nurses/{nurse_id}/competency-signoffs and the ConsultRequest PLAN_ACTIVE -> CLOSED transition"
    algorithm: weighted_scoring
    formula: |
      months_since = 0 if WocNurse.last_competency_signoff_at is null
                     else floor(((logical clock) - last_competency_signoff_at)
                                in whole hours / MONTH_HOURS)
      recency_component   = max(0, RECENCY_BASE - RECENCY_DECAY_PER_MONTH * months_since)
      credit_component    = min(CREDIT_COMPONENT_CAP, CREDIT_POINTS_PER_UNIT * WocNurse.ce_credits)
      mentored_component  = MENTORED_POINTS_PER_CONSULT
                            * min(MENTORED_CONSULT_CAP, WocNurse.mentored_consult_count)
      certification_eligibility_score =
        round_half_up(WEIGHT_RECENCY * recency_component
                    + WEIGHT_CREDITS * credit_component
                    + WEIGHT_MENTORED * mentored_component, 2)
      # Certification gate (all three must hold):
      #   certification_eligibility_score >= ELIGIBILITY_SCORE_FLOOR
      #   ce_credits                      >= CE_CREDIT_FLOOR
      #   competency_signoff_count        >= SIGNOFF_FLOOR
    input_set: "Exactly one WocNurse row plus the logical clock. mentored_consult_count is itself the count of that nurse's ConsultRequest rows with status == CLOSED."
    constants:
      MONTH_HOURS: 720
      RECENCY_BASE: 100
      RECENCY_DECAY_PER_MONTH: 5
      CREDIT_POINTS_PER_UNIT: 2
      CREDIT_COMPONENT_CAP: 60
      MENTORED_POINTS_PER_CONSULT: 10
      MENTORED_CONSULT_CAP: 4
      WEIGHT_RECENCY: 0.4
      WEIGHT_CREDITS: 0.4
      WEIGHT_MENTORED: 0.2
    precision: "2 decimal places, round_half_up applied once to the weighted sum; the three components are NOT individually rounded"

  - name: dressing_protocol_weekly_cost
    trigger: "POST /dressing-protocols"
    algorithm: aggregation
    formula: |
      changes_per_week = floor(HOURS_PER_WEEK / DressingProtocol.change_frequency_hours)
      base_cents       = changes_per_week
                         * FormularyProduct.unit_cost_cents
                         * DressingProtocol.units_per_change
      weekly_cost_cents = base_cents
                          if FormularyProduct.formulary_tier IN {PREFERRED, RESTRICTED}
                          else round_half_up(base_cents * (1 + NON_FORMULARY_SURCHARGE_PCT), 0)
    input_set: "Exactly one DressingProtocol row and the FormularyProduct row named by its formulary_product_id."
    constants:
      HOURS_PER_WEEK: 168
      NON_FORMULARY_SURCHARGE_PCT: 0.20
    precision: "whole cents; round_half_up applied once, only on the non-formulary branch"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority`; the FIRST
# failing row wins and no later row is evaluated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The X-User-Role is listed in the target endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's declared input schema — every required field present, types correct, enum members legal, numeric ranges and string lengths honored, pagination limit in [1,100] and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every id in the URL path resolves, validated left-to-right."
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_NURSE_NOT_FOUND | ERR_CONSULT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_SURVEY_ROUND_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_SURFACE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_PROTOCOL_NOT_FOUND | ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request body resolves, validated in the field order declared by the endpoint's input list."
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_NURSE_NOT_FOUND | ERR_CONSULT_NOT_FOUND | ERR_SURFACE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_SURVEY_ROUND_NOT_FOUND"
    http_status: 404
    applies_to: "POST /patients, POST /woc-nurses, POST /consult-requests, POST /consult-requests/{consult_id}/assign, POST /skin-assessments, POST /pressure-injury-cases/{case_id}/rca-start, POST /survey-rounds, POST /survey-observations, POST /support-surface-orders, POST /dressing-protocols, POST /ostomy-education-plans"

  - priority: 6
    category: business_referential
    check: "Cross-entity field agreement: ConsultRequest.requesting_unit_id == Patient.unit_id; SkinAssessment.patient_id == ConsultRequest.patient_id; SupportSurfaceOrder.unit_id == Patient.unit_id; SurveyObservation.unit_id == Patient.unit_id AND SurveyObservation.unit_id is an element of SurveyRound.participating_unit_ids; OstomyEducationPlan.patient_id == ConsultRequest.patient_id."
    error_id: ERR_ENTITY_LINK_MISMATCH
    http_status: 422
    applies_to: "POST /consult-requests, POST /skin-assessments, POST /support-surface-orders, POST /survey-observations, POST /ostomy-education-plans"

  - priority: 10
    category: state
    check: "ConsultRequest.status is in the from-set of the requested transition per state_machines.ConsultRequest."
    error_id: ERR_CONSULT_INVALID_STATE
    http_status: 409
    applies_to: "POST /consult-requests/{consult_id}/triage, /return, /resubmit, /assign, /escalate, /close, /cancel, POST /skin-assessments, POST /dressing-protocols, POST /ostomy-education-plans"

  - priority: 11
    category: state
    check: "SkinAssessment.validation_status is in the from-set of the requested transition per state_machines.SkinAssessment."
    error_id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /skin-assessments/{assessment_id}/validate, /dispute, /restage"

  - priority: 12
    category: state
    check: "SupportSurfaceOrder.fulfillment_status is in the from-set of the requested transition (approve and deny require REQUESTED, deliver requires APPROVED, return requires DELIVERED)."
    error_id: ERR_ORDER_NOT_PENDING
    http_status: 409
    applies_to: "POST /support-surface-orders/{order_id}/approve, /deny, /deliver, /return"

  - priority: 13
    category: state
    check: "SupportSurfaceOrder.billing_status is in the from-set of the requested billing transition (reconcile requires COMMITTED)."
    error_id: ERR_ORDER_INVALID_BILLING_STATE
    http_status: 409
    applies_to: "POST /support-surface-orders/{order_id}/reconcile"

  - priority: 14
    category: state
    check: "PressureInjuryCase.status is in the from-set of the requested transition (rca-start requires RCA_REQUIRED, rca-complete requires RCA_IN_PROGRESS, close requires status IN {RCA_COMPLETE, CLASSIFIED_POA})."
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /pressure-injury-cases/{case_id}/rca-start, /rca-complete, /close"

  - priority: 15
    category: state
    check: "SurveyRound.status is in the from-set of the requested transition; POST /survey-observations additionally requires the round to be OPEN."
    error_id: ERR_SURVEY_ROUND_NOT_OPEN
    http_status: 409
    applies_to: "POST /survey-rounds/{round_id}/open, /lock, /publish, /cancel, POST /survey-observations"

  - priority: 16
    category: state
    check: "Patient.status == ADMITTED wherever a clinical write is attempted against the patient."
    error_id: ERR_PATIENT_DISCHARGED
    http_status: 409
    applies_to: "POST /consult-requests, POST /consult-requests/{consult_id}/triage, /assign, POST /skin-assessments, POST /support-surface-orders, POST /survey-observations, POST /patients/{patient_id}/discharge"

  - priority: 17
    category: state
    check: "SupportSurface.status != RETIRED, FormularyProduct.status == ACTIVE, and the retire precondition (no order with fulfillment_status IN {REQUESTED, APPROVED, DELIVERED})."
    error_id: ERR_RESOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /support-surface-orders, POST /support-surfaces/{surface_id}/retire, POST /dressing-protocols, POST /formulary-products/{product_id}/archive"

  - priority: 20
    category: state
    check: "The OCC parent version supplied in the body equals the live parent version — expected_patient_version against Patient.version on POST /skin-assessments, expected_unit_version against Unit.version on POST /support-surface-orders/{order_id}/approve."
    error_id: "ERR_STALE_PATIENT_VERSION | ERR_STALE_UNIT_VERSION"
    http_status: 412
    applies_to: "POST /skin-assessments, POST /support-surface-orders/{order_id}/approve"

  - priority: 30
    category: business_safety
    check: "Segregation of duties. On POST /skin-assessments/{assessment_id}/validate with X-User-Role == WocNurse, X-User-ID must not equal SkinAssessment.staged_by_nurse_id. On POST /pressure-injury-cases/{case_id}/rca-start, the payload rca_lead_nurse_id must not equal the staged_by_nurse_id of the case's originating SkinAssessment. On POST /skin-assessments/{assessment_id}/restage, X-User-ID must equal staged_by_nurse_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /skin-assessments/{assessment_id}/validate, POST /skin-assessments/{assessment_id}/restage, POST /pressure-injury-cases/{case_id}/rca-start"

  - priority: 32
    category: business_safety
    check: "Certification gating. Assignment targets must have certification_status IN {CANDIDATE, CERTIFIED}; RCA leads must have certification_status == CERTIFIED; survey observers must have certification_status IN {CANDIDATE, CERTIFIED}."
    error_id: ERR_NURSE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /consult-requests/{consult_id}/assign, POST /pressure-injury-cases/{case_id}/rca-start, POST /survey-observations"

  - priority: 34
    category: business_safety
    check: "A DressingProtocol may only be filed when ConsultRequest.protocol_hold == false and the SkinAssessment for that consult with the latest created_at has validation_status == VALIDATED."
    error_id: ERR_STAGE_NOT_VALIDATED
    http_status: 422
    applies_to: "POST /dressing-protocols"

  - priority: 36
    category: business_safety
    check: "A ConsultRequest may only close when every PressureInjuryCase originating from its assessments has status IN {CLASSIFIED_POA, RCA_COMPLETE, CLOSED, RECLASSIFIED}."
    error_id: ERR_RCA_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /consult-requests/{consult_id}/close"

  - priority: 40
    category: business_temporal
    check: "present_on_admission_confirmed == true is only accepted when SkinAssessment.observed_at <= Patient.admitted_at + POA_WINDOW_HOURS."
    error_id: ERR_POA_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /skin-assessments/{assessment_id}/validate"

  - priority: 42
    category: business_temporal
    check: "SurveyObservation.observed_at must sit inside the CLOSED interval [SurveyRound.window_start, SurveyRound.window_end], and onset_at when supplied must be <= observed_at."
    error_id: ERR_OBSERVATION_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /survey-observations"

  - priority: 44
    category: business_temporal
    check: "Survey window contention on a Unit, using CLOSED-interval arithmetic with NO buffer: two rounds collide when window_start_a <= window_end_b AND window_start_b <= window_end_a. A PREVALENCE round may not open when any other PREVALENCE round with status IN {OPEN, LOCKED, PUBLISHED} collides on a shared Unit id (aggregate capacity 1). An INCIDENCE round may not open when MAX_CONCURRENT_INCIDENCE_ROUNDS or more INCIDENCE rounds with status IN {OPEN, LOCKED} already collide on a shared Unit id (aggregate capacity 2)."
    error_id: ERR_SURVEY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /survey-rounds/{round_id}/open"

  - priority: 46
    category: business_temporal
    check: "Support-surface occupation contention, using HALF-OPEN interval arithmetic plus a trailing reclean buffer: the candidate occupation is [rental_start, rental_end) and the blocked span of an existing order is [existing.rental_start, existing.rental_end + RECLEAN_BUFFER_HOURS). Approval is rejected when the candidate span intersects any blocked span of another SupportSurfaceOrder on the same support_surface_id with fulfillment_status IN {APPROVED, DELIVERED}. Aggregate capacity is exactly 1 — the asset is a single physical bed."
    error_id: ERR_SURFACE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /support-surface-orders/{order_id}/approve"

  - priority: 50
    category: business_constraint
    check: "ConsultRequest.revision_count < MAX_REVISIONS on both return and resubmit."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /consult-requests/{consult_id}/return, POST /consult-requests/{consult_id}/resubmit"

  - priority: 52
    category: business_constraint
    check: "WocNurse.active_consult_load < WocNurse.max_consult_load for the assignment target, evaluated before the increment. Re-assigning the same nurse already holding the consult skips this check."
    error_id: ERR_NURSE_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /consult-requests/{consult_id}/assign"

  - priority: 54
    category: business_constraint
    check: "At most one SurveyObservation per (survey_round_id, patient_id) pair."
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /survey-observations"

  - priority: 55
    category: business_constraint
    check: "Uniqueness of natural keys: Unit.unit_code, Patient.mrn, SupportSurface.asset_tag, FormularyProduct.sku."
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    applies_to: "POST /units, POST /patients, POST /support-surfaces, POST /formulary-products"

  - priority: 56
    category: business_constraint
    check: "A non-blank justification of 1-500 chars is required when FormularyProduct.formulary_tier == NON_FORMULARY."
    error_id: ERR_NON_FORMULARY_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /dressing-protocols"

  - priority: 58
    category: business_constraint
    check: "Unit.survey_posture must not be FROZEN when a new SupportSurfaceOrder is created, and an order whose requires_director_override == true may only be approved with director_override == true."
    error_id: ERR_UNIT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /support-surface-orders, POST /support-surface-orders/{order_id}/approve"

  - priority: 60
    category: business_constraint
    check: "Every Unit id in SurveyRound.participating_unit_ids has at least one SurveyObservation for the round before it may be locked."
    error_id: ERR_SURVEY_UNIT_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /survey-rounds/{round_id}/lock"

  - priority: 62
    category: business_constraint
    check: "Certification gate — certification_eligibility_score >= ELIGIBILITY_SCORE_FLOOR AND ce_credits >= CE_CREDIT_FLOOR AND competency_signoff_count >= SIGNOFF_FLOOR; advancement to CANDIDATE requires competency_signoff_count >= 1."
    error_id: ERR_CERTIFICATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /woc-nurses/{nurse_id}/certify, POST /woc-nurses/{nurse_id}/advance"

  - priority: 64
    category: business_constraint
    check: "OstomyEducationPlan preconditions — Patient.ostomy_present == true, ConsultRequest.consult_type == OSTOMY, and followup_appointment_at strictly after the logical clock on transition-supplies."
    error_id: ERR_OSTOMY_PLAN_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /ostomy-education-plans, POST /ostomy-education-plans/{plan_id}/transition-supplies"

  - priority: 70
    category: business_fiscal
    check: "SupportSurfaceOrder.billable_days <= SupportSurfaceOrder.authorized_days."
    error_id: ERR_RENTAL_DAYS_EXCEED_AUTHORIZATION
    http_status: 422
    applies_to: "POST /support-surface-orders/{order_id}/approve"

  - priority: 72
    category: business_fiscal
    check: "SupportSurfaceOrder.authorized_cost_cents <= Unit.rental_available_cents, and a budget adjustment may not drive rental_available_cents below 0."
    error_id: ERR_RENTAL_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /support-surface-orders/{order_id}/approve, POST /units/{unit_id}/budget-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# All business collections are peers at the root (entity_topology: flat);
# sub-paths carry action verbs and computed reads only.
# =============================================================================
endpoints:

  # ---- Unit ----------------------------------------------------------------
  - method: POST
    path: "/units"
    description: "Register a hospital unit and initialise its rental ledger."
    roles: [WocProgramDirector]
    code: 201
    input: [unit_code, name, bed_count, "rental_budget_cap_cents?"]
    output: Unit
    side_effects:
      - "rental_encumbered_cents, rental_committed_cents, rental_released_cents := 0"
      - "rental_available_cents := rental_budget_cap_cents"
      - "open_hapi_rca_count := 0; disputed_staging_count := 0; survey_posture := OPEN"

  - method: GET
    path: "/units"
    description: "List units, optionally filtered by derived posture."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["survey_posture?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: GET
    path: "/units/{unit_id}"
    description: "Read one unit including its live rental ledger and survey posture."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/units/{unit_id}/budget-adjustments"
    description: "Raise or lower a unit's rental budget cap. Business admin surface used by finance and by tests that need a specific ceiling."
    roles: [WocProgramDirector]
    code: 200
    input: [delta_cents, reason]
    output: Unit
    side_effects:
      - "rental_budget_cap_cents := rental_budget_cap_cents + delta_cents"
      - "rental_available_cents recomputed as cap - encumbered - committed"
      - "increments Unit.version by 1"

  # ---- Patient -------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Admit a patient onto a unit."
    roles: [UnitCharge, WocProgramDirector]
    code: 201
    input: [mrn, unit_id, admitted_at, "comorbidity_count?", "device_related_risk?", "ostomy_present?"]
    output: Patient
    side_effects:
      - "status := ADMITTED; poa_skin_assessment_documented := false; pending_outpatient_followup_count := 0"

  - method: GET
    path: "/patients"
    description: "List patients, filtered by unit or status. Reverse-reachability channel for Patient.unit_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}"
    description: "Read one patient including version, used to seed expected_patient_version."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/patients/{patient_id}/discharge"
    description: "Discharge a patient."
    roles: [UnitCharge, WocProgramDirector]
    code: 200
    input: [discharged_at]
    output: Patient
    side_effects:
      - "status := DISCHARGED; discharged_at := payload discharged_at"
      - "increments Patient.version by 1"

  # ---- WocNurse ------------------------------------------------------------
  - method: POST
    path: "/woc-nurses"
    description: "Register a WOC nurse at TRAINEE level."
    roles: [WocProgramDirector]
    code: 201
    input: [full_name, home_unit_id, "ce_credits?"]
    output: WocNurse
    side_effects:
      - "certification_status := TRAINEE; max_consult_load := 0; active_consult_load := 0"

  - method: GET
    path: "/woc-nurses"
    description: "List nurses. Reverse-reachability channel for WocNurse.home_unit_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["home_unit_id?", "certification_status?", "limit?", "offset?"]
    output: WocNurse[]
    side_effects: []

  - method: GET
    path: "/woc-nurses/{nurse_id}"
    description: "Read one nurse including certification_eligibility_score and active_consult_load."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: WocNurse
    side_effects: []

  - method: POST
    path: "/woc-nurses/{nurse_id}/competency-signoffs"
    description: "Record a competency signoff in the certification pipeline."
    roles: [WocProgramDirector]
    code: 200
    input: [signed_off_at, competency_domain]
    output: WocNurse
    side_effects:
      - "competency_signoff_count := competency_signoff_count + 1; last_competency_signoff_at := payload signed_off_at"
      - "certification_eligibility_score := calculations.certification_eligibility_score"
      - "increments WocNurse.version by 1"

  - method: POST
    path: "/woc-nurses/{nurse_id}/advance"
    description: "Advance a TRAINEE to CANDIDATE."
    roles: [WocProgramDirector]
    code: 200
    input: []
    output: WocNurse
    side_effects:
      - "certification_status := CANDIDATE; max_consult_load := 3"
      - "increments WocNurse.version by 1"

  - method: POST
    path: "/woc-nurses/{nurse_id}/certify"
    description: "Certify a CANDIDATE or renew a LAPSED nurse."
    roles: [WocProgramDirector]
    code: 200
    input: [cert_expires_at]
    output: WocNurse
    side_effects:
      - "certification_status := CERTIFIED; cert_expires_at := payload cert_expires_at; max_consult_load := 8"
      - "increments WocNurse.version by 1"

  - method: POST
    path: "/woc-nurses/{nurse_id}/lapse"
    description: "Lapse a CERTIFIED nurse's certification."
    roles: [WocProgramDirector]
    code: 200
    input: [reason]
    output: WocNurse
    side_effects:
      - "certification_status := LAPSED; max_consult_load := 0; active_consult_load unchanged"
      - "increments WocNurse.version by 1"

  # ---- ConsultRequest ------------------------------------------------------
  - method: POST
    path: "/consult-requests"
    description: "Raise a WOC consult from the bedside unit."
    roles: [UnitCharge]
    code: 201
    input: [patient_id, requesting_unit_id, consult_type, reported_stage, clinical_note]
    output: ConsultRequest
    side_effects:
      - "status := REQUESTED; revision_count := 0; escalation_count := 0; protocol_hold := false"

  - method: GET
    path: "/consult-requests"
    description: "List consults. Reverse-reachability channel for patient_id, requesting_unit_id and assigned_nurse_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["patient_id?", "requesting_unit_id?", "assigned_nurse_id?", "status?", "priority_band?", "limit?", "offset?"]
    output: ConsultRequest[]
    side_effects: []

  - method: GET
    path: "/consult-requests/{consult_id}"
    description: "Read one consult including acuity_score, acuity_variant, priority_band and sla_due_at."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: ConsultRequest
    side_effects: []

  - method: POST
    path: "/consult-requests/{consult_id}/triage"
    description: "Triage a REQUESTED consult; computes the intake_provisional acuity, priority band and SLA clock."
    roles: [WocNurse]
    code: 200
    input: []
    output: ConsultRequest
    side_effects:
      - "runs calculations.consult_acuity_score variant intake_provisional"
      - "status := TRIAGED; acuity_variant := INTAKE_PROVISIONAL; triaged_at := logical clock; sla_due_at set"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/return"
    description: "Return a triaged consult to the requesting unit for more information."
    roles: [WocNurse]
    code: 200
    input: [reason]
    output: ConsultRequest
    side_effects:
      - "status := RETURNED_FOR_INFO; sla_due_at := null"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/resubmit"
    description: "Resubmit a returned consult with a revised narrative and stage; re-enters REQUESTED so triage runs again."
    roles: [UnitCharge]
    code: 200
    input: [clinical_note, reported_stage]
    output: ConsultRequest
    side_effects:
      - "status := REQUESTED; revision_count := revision_count + 1; acuity_score, acuity_variant, priority_band, triaged_at, sla_due_at := null"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/assign"
    description: "Assign or re-assign a WOC nurse to a TRIAGED or ESCALATED consult."
    roles: [WocProgramDirector]
    code: 200
    input: [assigned_nurse_id]
    output: ConsultRequest
    side_effects:
      - "status := ASSIGNED; assigned_nurse_id set"
      - "WocNurse.active_consult_load incremented on the new nurse and decremented on the displaced nurse; increments WocNurse.version by 1 for each nurse touched"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/escalate"
    description: "Escalate an ASSIGNED consult whose SLA clock has passed."
    roles: [WocNurse, WocProgramDirector]
    code: 200
    input: [reason]
    output: ConsultRequest
    side_effects:
      - "status := ESCALATED; escalation_count := escalation_count + 1"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/close"
    description: "Close a consult whose protocol is active and whose pressure-injury cases are adjudicated."
    roles: [WocNurse]
    code: 200
    input: [closing_summary]
    output: ConsultRequest
    side_effects:
      - "status := CLOSED; closing_summary stored"
      - "WocNurse.active_consult_load decremented, mentored_consult_count incremented, certification_eligibility_score recomputed; increments WocNurse.version by 1"
      - "increments ConsultRequest.version by 1"

  - method: POST
    path: "/consult-requests/{consult_id}/cancel"
    description: "Cancel a non-terminal consult; runs the compensating cascade over protocols, education plans and rental encumbrances."
    roles: [UnitCharge, WocProgramDirector]
    code: 200
    input: [reason]
    output: ConsultRequest
    side_effects:
      - "status := CANCELLED"
      - "cascade hops 1, 2, 3, 2b, 2c, 3b per state_machines.ConsultRequest.PLAN_ACTIVE_to_CANCELLED"
      - "increments ConsultRequest.version by 1"

  # ---- SkinAssessment ------------------------------------------------------
  - method: POST
    path: "/skin-assessments"
    description: "File a bedside skin assessment against a consult whose status is ASSIGNED or ASSESSED. OCC-guarded on the patient because a second assessment for the same anatomic location legitimately supersedes the first."
    roles: [WocNurse]
    code: 201
    input: [consult_request_id, patient_id, anatomic_location, observed_stage, measured_area_cm2, observed_at, expected_patient_version, "present_on_admission_claimed?"]
    output: SkinAssessment
    side_effects:
      - "staged_by_nurse_id := X-User-ID; validation_status := PENDING_VALIDATION"
      - "any prior SkinAssessment with the same (patient_id, anatomic_location) and validation_status IN {PENDING_VALIDATION, VALIDATED} moves to SUPERSEDED"
      - "a PressureInjuryCase is created with classification UNDETERMINED, status OPEN, skin_assessment_id := the new assessment id, unit_id := Patient.unit_id"
      - "ConsultRequest moves ASSIGNED -> ASSESSED, or stays at ASSESSED on a re-assessment, and acuity_score is recomputed under variant assessed_final from the NEW row only; increments ConsultRequest.version by 1"
      - "increments Patient.version by 1"

  - method: GET
    path: "/skin-assessments"
    description: "List assessments. Reverse-reachability channel for consult_request_id, patient_id and staged_by_nurse_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["consult_request_id?", "patient_id?", "staged_by_nurse_id?", "validation_status?", "limit?", "offset?"]
    output: SkinAssessment[]
    side_effects: []

  - method: GET
    path: "/skin-assessments/{assessment_id}"
    description: "Read one assessment including poa_determination and confirmed_stage."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: SkinAssessment
    side_effects: []

  - method: POST
    path: "/skin-assessments/{assessment_id}/validate"
    description: "Validate a pending assessment's staging and present-on-admission call. Drives the four-hop HAPI cascade."
    roles: [WocNurse, WocProgramDirector]
    code: 200
    input: [confirmed_stage, present_on_admission_confirmed]
    output: SkinAssessment
    side_effects:
      - "validation_status := VALIDATED; confirmed_stage and validated_by_user_id set; poa_determination computed"
      - "cascade hops 1, 1b, 2, 3, 4, 5 per state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED"
      - "increments SkinAssessment.version by 1"

  - method: POST
    path: "/skin-assessments/{assessment_id}/dispute"
    description: "Dispute a pending assessment's staging; places a protocol hold on the consult instead of classifying the case."
    roles: [WocProgramDirector]
    code: 200
    input: [dispute_reason]
    output: SkinAssessment
    side_effects:
      - "validation_status := DISPUTED; ConsultRequest.protocol_hold := true; Unit.disputed_staging_count incremented"
      - "increments SkinAssessment.version by 1"

  - method: POST
    path: "/skin-assessments/{assessment_id}/restage"
    description: "Re-stage a disputed assessment; only the original staging nurse may do this, and the row returns to PENDING_VALIDATION."
    roles: [WocNurse]
    code: 200
    input: [observed_stage, measured_area_cm2]
    output: SkinAssessment
    side_effects:
      - "validation_status := PENDING_VALIDATION; restage_count incremented; ConsultRequest.protocol_hold := false"
      - "increments SkinAssessment.version by 1"

  # ---- PressureInjuryCase --------------------------------------------------
  - method: GET
    path: "/pressure-injury-cases"
    description: "List pressure-injury cases. Reverse-reachability channel for patient_id, unit_id, skin_assessment_id, predecessor_case_id and rca_lead_nurse_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["patient_id?", "unit_id?", "skin_assessment_id?", "predecessor_case_id?", "rca_lead_nurse_id?", "status?", "classification?", "limit?", "offset?"]
    output: PressureInjuryCase[]
    side_effects: []

  - method: GET
    path: "/pressure-injury-cases/{case_id}"
    description: "Read one case including classification, rca_due_at and root_cause_category."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: PressureInjuryCase
    side_effects: []

  - method: POST
    path: "/pressure-injury-cases/{case_id}/rca-start"
    description: "Open the root cause analysis on a HAPI case; the lead may not be the nurse who staged the originating assessment."
    roles: [WocNurse, WocProgramDirector]
    code: 200
    input: [rca_lead_nurse_id]
    output: PressureInjuryCase
    side_effects:
      - "status := RCA_IN_PROGRESS; rca_lead_nurse_id set"
      - "increments PressureInjuryCase.version by 1"

  - method: POST
    path: "/pressure-injury-cases/{case_id}/rca-complete"
    description: "Record the root cause and contributing factors."
    roles: [WocNurse]
    code: 200
    input: [root_cause_category, contributing_factors]
    output: PressureInjuryCase
    side_effects:
      - "status := RCA_COMPLETE; root_cause_category and contributing_factors stored"
      - "increments PressureInjuryCase.version by 1"

  - method: POST
    path: "/pressure-injury-cases/{case_id}/close"
    description: "Close an adjudicated case; reverses the unit's open-RCA counter and any posture hold it caused."
    roles: [WocProgramDirector]
    code: 200
    input: [closure_note]
    output: PressureInjuryCase
    side_effects:
      - "status := CLOSED; closed_at := logical clock"
      - "Unit.open_hapi_rca_count decremented and survey_posture recomputed; increments Unit.version by 1"
      - "posture holds on REQUESTED orders of that unit are lifted when posture returns to OPEN"
      - "increments PressureInjuryCase.version by 1"

  # ---- SurveyRound ---------------------------------------------------------
  - method: POST
    path: "/survey-rounds"
    description: "Plan a prevalence or incidence survey round over a set of units."
    roles: [WocProgramDirector]
    code: 201
    input: [round_type, window_start, window_end, participating_unit_ids]
    output: SurveyRound
    side_effects:
      - "status := PLANNED; observation_count := 0"

  - method: GET
    path: "/survey-rounds"
    description: "List survey rounds."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["status?", "round_type?", "limit?", "offset?"]
    output: SurveyRound[]
    side_effects: []

  - method: GET
    path: "/survey-rounds/{round_id}"
    description: "Read one survey round including observation_count and published_at."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: SurveyRound
    side_effects: []

  - method: POST
    path: "/survey-rounds/{round_id}/open"
    description: "Open a planned round for observation entry; enforces CLOSED-interval window contention per round_type."
    roles: [WocProgramDirector]
    code: 200
    input: []
    output: SurveyRound
    side_effects:
      - "status := OPEN"
      - "increments SurveyRound.version by 1"

  - method: POST
    path: "/survey-rounds/{round_id}/lock"
    description: "Lock an open round; requires at least one observation per participating unit."
    roles: [WocProgramDirector]
    code: 200
    input: []
    output: SurveyRound
    side_effects:
      - "status := LOCKED"
      - "increments SurveyRound.version by 1"

  - method: POST
    path: "/survey-rounds/{round_id}/publish"
    description: "Publish a locked round; writes the per-unit prevalence or incidence metric."
    roles: [WocProgramDirector]
    code: 200
    input: []
    output: SurveyRound
    side_effects:
      - "status := PUBLISHED; published_at := logical clock"
      - "runs calculations.unit_survey_metric once per participating unit and writes Unit.last_prevalence_rate or Unit.last_incidence_rate; increments Unit.version by 1"
      - "increments SurveyRound.version by 1"

  - method: POST
    path: "/survey-rounds/{round_id}/cancel"
    description: "Cancel a planned or open round without publishing metrics."
    roles: [WocProgramDirector]
    code: 200
    input: [reason]
    output: SurveyRound
    side_effects:
      - "status := CANCELLED"
      - "increments SurveyRound.version by 1"

  - method: GET
    path: "/survey-rounds/{round_id}/unit-report"
    description: "Computed read: per-unit numerators, denominators and both metric variants for this round, so a caller can see the prevalence/incidence divergence on identical observation data."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: "{ round_id: string, round_type: string, observation_total: integer, unit_rows: object[] }"
    side_effects: []
    note: "Each element of unit_rows carries unit_id, unit_code, observation_count, injury_present_count, hapi_in_window_count, at_risk_count, prevalence_rate, incidence_rate."

  # ---- SurveyObservation ---------------------------------------------------
  - method: POST
    path: "/survey-observations"
    description: "Record one immutable unit-level survey observation inside an OPEN round."
    roles: [WocNurse]
    code: 201
    input: [survey_round_id, unit_id, patient_id, observer_nurse_id, observed_at, injury_present, classification, "observed_stage?", "onset_at?", "at_risk?"]
    output: SurveyObservation
    side_effects:
      - "SurveyRound.observation_count := observation_count + 1; increments SurveyRound.version by 1"

  - method: GET
    path: "/survey-observations"
    description: "List observations. Reverse-reachability channel for survey_round_id, unit_id, patient_id and observer_nurse_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["survey_round_id?", "unit_id?", "patient_id?", "observer_nurse_id?", "limit?", "offset?"]
    output: SurveyObservation[]
    side_effects: []

  - method: GET
    path: "/survey-observations/{observation_id}"
    description: "Read one immutable observation."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: SurveyObservation
    side_effects: []

  # ---- SupportSurface ------------------------------------------------------
  - method: POST
    path: "/support-surfaces"
    description: "Add a rental specialty bed or overlay to the fleet."
    roles: [MaterialsCoordinator]
    code: 201
    input: [asset_tag, surface_class, daily_rate_cents, vendor_name]
    output: SupportSurface
    side_effects:
      - "status := AVAILABLE; occupied_until := null; available_from := null"

  - method: GET
    path: "/support-surfaces"
    description: "List fleet assets with their occupancy windows."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["surface_class?", "status?", "limit?", "offset?"]
    output: SupportSurface[]
    side_effects: []

  - method: GET
    path: "/support-surfaces/{surface_id}"
    description: "Read one asset including occupied_until and available_from."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: SupportSurface
    side_effects: []

  - method: POST
    path: "/support-surfaces/{surface_id}/retire"
    description: "Retire an asset from the fleet."
    roles: [MaterialsCoordinator]
    code: 200
    input: [reason]
    output: SupportSurface
    side_effects:
      - "status := RETIRED"
      - "increments SupportSurface.version by 1"

  # ---- SupportSurfaceOrder -------------------------------------------------
  - method: POST
    path: "/support-surface-orders"
    description: "Request a support surface for a patient; computes billable_days, the tiered projected cost, the vendor fee and the authorized cost without touching the unit ledger."
    roles: [MaterialsCoordinator, WocNurse]
    code: 201
    input: [patient_id, unit_id, support_surface_id, rental_start, rental_end, authorized_days, "consult_request_id?"]
    output: SupportSurfaceOrder
    side_effects:
      - "billable_days, projected_cost_cents, vendor_service_fee_cents, authorized_cost_cents computed via calculations.rental_cost_projection then calculations.vendor_service_fee"
      - "fulfillment_status := REQUESTED; billing_status := UNBILLED"
      - "requires_director_override := true when Unit.survey_posture == RESTRICTED at creation time"

  - method: GET
    path: "/support-surface-orders"
    description: "List rental orders. Reverse-reachability channel for patient_id, unit_id, support_surface_id and consult_request_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["patient_id?", "unit_id?", "support_surface_id?", "consult_request_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: SupportSurfaceOrder[]
    side_effects: []

  - method: GET
    path: "/support-surface-orders/{order_id}"
    description: "Read one rental order including both status dimensions and every cost figure."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: SupportSurfaceOrder
    side_effects: []

  - method: POST
    path: "/support-surface-orders/{order_id}/approve"
    description: "Approve a requested rental. OCC-guarded on the unit ledger; enforces the half-open plus reclean-buffer occupation rule and the rental budget ceiling."
    roles: [MaterialsCoordinator]
    code: 200
    input: [expected_unit_version, "director_override?"]
    output: SupportSurfaceOrder
    side_effects:
      - "fulfillment_status := APPROVED; billing_status := ENCUMBERED"
      - "Unit.rental_encumbered_cents += authorized_cost_cents; rental_available_cents recomputed; increments Unit.version by 1"
      - "SupportSurface.status := IN_USE; occupied_until and available_from set; increments SupportSurface.version by 1"
      - "increments SupportSurfaceOrder.version by 1"

  - method: POST
    path: "/support-surface-orders/{order_id}/deny"
    description: "Deny a requested rental."
    roles: [MaterialsCoordinator]
    code: 200
    input: [denial_reason]
    output: SupportSurfaceOrder
    side_effects:
      - "fulfillment_status := DENIED; denial_reason stored; billing_status stays UNBILLED"
      - "increments SupportSurfaceOrder.version by 1"

  - method: POST
    path: "/support-surface-orders/{order_id}/deliver"
    description: "Mark an approved surface delivered. Moves the fulfillment dimension ONLY."
    roles: [MaterialsCoordinator]
    code: 200
    input: [delivered_at]
    output: SupportSurfaceOrder
    side_effects:
      - "fulfillment_status := DELIVERED; delivered_at stored; billing_status untouched"
      - "increments SupportSurfaceOrder.version by 1"

  - method: POST
    path: "/support-surface-orders/{order_id}/return"
    description: "Return a delivered surface; recomputes the realised cost and commits it while releasing the unspent encumbrance."
    roles: [MaterialsCoordinator]
    code: 200
    input: [actual_return_at]
    output: SupportSurfaceOrder
    side_effects:
      - "fulfillment_status := RETURNED; actual_cost_cents computed over [rental_start, actual_return_at)"
      - "billing_status := COMMITTED; Unit ledger encumbrance released and actual cost committed; increments Unit.version by 1"
      - "SupportSurface.status := CLEANING; increments SupportSurface.version by 1"
      - "increments SupportSurfaceOrder.version by 1"

  - method: POST
    path: "/support-surface-orders/{order_id}/reconcile"
    description: "Reconcile a committed rental with the vendor invoice. Moves the billing dimension ONLY."
    roles: [MaterialsCoordinator]
    code: 200
    input: []
    output: SupportSurfaceOrder
    side_effects:
      - "billing_status := RECONCILED; no ledger amount moves; fulfillment_status untouched"
      - "SupportSurface.status := AVAILABLE when the logical clock >= available_from; increments SupportSurface.version by 1"
      - "increments SupportSurfaceOrder.version by 1"

  # ---- FormularyProduct ----------------------------------------------------
  - method: POST
    path: "/formulary-products"
    description: "Add a dressing or ostomy product to the formulary at a given tier."
    roles: [WocProgramDirector]
    code: 201
    input: [sku, name, category, unit_cost_cents, formulary_tier]
    output: FormularyProduct
    side_effects:
      - "status := ACTIVE"

  - method: GET
    path: "/formulary-products"
    description: "List formulary products by category, tier or status."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["category?", "formulary_tier?", "status?", "limit?", "offset?"]
    output: FormularyProduct[]
    side_effects: []

  - method: GET
    path: "/formulary-products/{product_id}"
    description: "Read one formulary product."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: FormularyProduct
    side_effects: []

  - method: POST
    path: "/formulary-products/{product_id}/archive"
    description: "Archive a product so it can no longer back a new protocol."
    roles: [WocProgramDirector]
    code: 200
    input: [reason]
    output: FormularyProduct
    side_effects:
      - "status := ARCHIVED"
      - "increments FormularyProduct.version by 1"

  # ---- DressingProtocol ----------------------------------------------------
  - method: POST
    path: "/dressing-protocols"
    description: "File the standardized dressing change protocol for an assessed consult; computes the weekly product cost."
    roles: [WocNurse]
    code: 201
    input: [consult_request_id, formulary_product_id, change_frequency_hours, units_per_change, "justification?"]
    output: DressingProtocol
    side_effects:
      - "changes_per_week and weekly_cost_cents computed via calculations.dressing_protocol_weekly_cost"
      - "status := ACTIVE; any prior ACTIVE protocol on the same consult moves to SUPERSEDED"
      - "ConsultRequest moves ASSESSED -> PLAN_ACTIVE, or stays at PLAN_ACTIVE on a protocol revision that supersedes the prior ACTIVE protocol; increments ConsultRequest.version by 1"

  - method: GET
    path: "/dressing-protocols"
    description: "List protocols. Reverse-reachability channel for consult_request_id and formulary_product_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["consult_request_id?", "formulary_product_id?", "status?", "limit?", "offset?"]
    output: DressingProtocol[]
    side_effects: []

  - method: GET
    path: "/dressing-protocols/{protocol_id}"
    description: "Read one protocol including changes_per_week and weekly_cost_cents."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: DressingProtocol
    side_effects: []

  # ---- OstomyEducationPlan -------------------------------------------------
  - method: POST
    path: "/ostomy-education-plans"
    description: "Open an ostomy education plan for an assessed ostomy consult."
    roles: [WocNurse]
    code: 201
    input: [consult_request_id, patient_id]
    output: OstomyEducationPlan
    side_effects:
      - "status := ACTIVE; sessions_completed := 0; supply_transition_status := PENDING"

  - method: GET
    path: "/ostomy-education-plans"
    description: "List education plans. Reverse-reachability channel for consult_request_id and patient_id."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: ["consult_request_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: OstomyEducationPlan[]
    side_effects: []

  - method: GET
    path: "/ostomy-education-plans/{plan_id}"
    description: "Read one education plan including teach_back_score and followup_appointment_at."
    roles: [WocNurse, UnitCharge, WocProgramDirector, MaterialsCoordinator]
    code: 200
    input: []
    output: OstomyEducationPlan
    side_effects: []

  - method: POST
    path: "/ostomy-education-plans/{plan_id}/sessions"
    description: "Record an education session and its teach-back score."
    roles: [WocNurse]
    code: 200
    input: [teach_back_score]
    output: OstomyEducationPlan
    side_effects:
      - "sessions_completed incremented; teach_back_score stored; status := TEACH_BACK_PASSED when teach_back_score >= TEACH_BACK_PASS_SCORE"
      - "increments OstomyEducationPlan.version by 1"

  - method: POST
    path: "/ostomy-education-plans/{plan_id}/transition-supplies"
    description: "Transition the patient to outpatient supplies and book the follow-up visit."
    roles: [WocNurse]
    code: 200
    input: [followup_appointment_at]
    output: OstomyEducationPlan
    side_effects:
      - "supply_transition_status := TRANSITIONED; followup_appointment_at stored; status advances SUPPLIES_TRANSITIONED then FOLLOWUP_SCHEDULED"
      - "Patient.pending_outpatient_followup_count incremented; increments Patient.version by 1"
      - "increments OstomyEducationPlan.version by 1"

  # ---- Test-driving surface (last rung of the §1.5 priority ladder) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and expiry rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Setting the clock never mutates business rows."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock is repositioned; no entity row is written"

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  # ---- transport / shape ---------------------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unknown X-User-ID header."
    trigger_condition: "The request carries no X-User-ID header, or the header value does not resolve to a registered principal."

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Caller role may not perform this operation."
    trigger_condition: "The caller authenticates but the resolved role is absent from the endpoint's roles list."

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request payload is missing a required field, has a wrong type, or carries an out-of-domain enum value."
    trigger_condition: "Any schema-level failure: absent required key, non-integer where integer is required, unparsable ISO-8601 timestamp, enum value outside the declared domain, negative money or day count."

  # ---- existence ----------------------------------------------------------
  - error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    message: "Unit does not exist."
    trigger_condition: "A path or payload unit_id matches no Unit row."

  - error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    message: "Patient does not exist."
    trigger_condition: "A path or payload patient_id matches no Patient row."

  - error_id: ERR_NURSE_NOT_FOUND
    http_status: 404
    message: "WOC nurse does not exist."
    trigger_condition: "A path or payload nurse_id / assigned_nurse_id / rca_lead_nurse_id / observer_nurse_id matches no WocNurse row."

  - error_id: ERR_CONSULT_NOT_FOUND
    http_status: 404
    message: "Consult request does not exist."
    trigger_condition: "A path or payload consult_request_id matches no ConsultRequest row."

  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    message: "Skin assessment does not exist."
    trigger_condition: "A path or payload skin_assessment_id matches no SkinAssessment row."

  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    message: "Pressure injury case does not exist."
    trigger_condition: "A path case_id matches no PressureInjuryCase row."

  - error_id: ERR_SURVEY_ROUND_NOT_FOUND
    http_status: 404
    message: "Survey round does not exist."
    trigger_condition: "A path or payload survey_round_id matches no SurveyRound row."

  - error_id: ERR_OBSERVATION_NOT_FOUND
    http_status: 404
    message: "Survey observation does not exist."
    trigger_condition: "A path observation_id matches no SurveyObservation row."

  - error_id: ERR_SURFACE_NOT_FOUND
    http_status: 404
    message: "Support surface does not exist."
    trigger_condition: "A path or payload support_surface_id matches no SupportSurface row."

  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    message: "Support surface order does not exist."
    trigger_condition: "A path order_id matches no SupportSurfaceOrder row."

  - error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    message: "Formulary product does not exist."
    trigger_condition: "A path or payload formulary_product_id matches no FormularyProduct row."

  - error_id: ERR_PROTOCOL_NOT_FOUND
    http_status: 404
    message: "Dressing protocol does not exist."
    trigger_condition: "A path protocol_id matches no DressingProtocol row."

  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "Ostomy education plan does not exist."
    trigger_condition: "A path plan_id matches no OstomyEducationPlan row."

  # ---- referential coherence ----------------------------------------------
  - error_id: ERR_ENTITY_LINK_MISMATCH
    http_status: 422
    message: "Referenced rows exist but do not belong together."
    trigger_condition: "Two supplied references disagree: the assessment's patient differs from the consult's patient, the order's patient is not on the order's unit, the observation's patient is not on the observation's unit, or the protocol's consult and the plan's consult name different patients."

  # ---- state gates --------------------------------------------------------
  - error_id: ERR_CONSULT_INVALID_STATE
    http_status: 409
    message: "Consult request is not in a state that permits this transition."
    trigger_condition: "The triggered ConsultRequest transition is not declared from the row's current status (for example triaging an already TRIAGED consult, assigning a REQUESTED consult, or any transition out of the terminal CLOSED or CANCELLED states)."

  - error_id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    message: "Skin assessment is not in a state that permits this transition."
    trigger_condition: "validate or dispute is called on an assessment that is not PENDING_VALIDATION, or restage is called on an assessment that is not DISPUTED, or any transition is attempted on a SUPERSEDED row."

  - error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    message: "Pressure injury case is not in a state that permits this transition."
    trigger_condition: "rca-start is called on a case that is not RCA_REQUIRED, rca-complete on a case that is not RCA_IN_PROGRESS, or close on a case whose status is neither RCA_COMPLETE nor CLASSIFIED_POA."

  - error_id: ERR_ORDER_NOT_PENDING
    http_status: 409
    message: "Support surface order is not awaiting approval."
    trigger_condition: "approve or deny is called on an order whose fulfillment_status is not REQUESTED, or deliver on an order that is not APPROVED, or return on an order that is not DELIVERED."

  - error_id: ERR_ORDER_INVALID_BILLING_STATE
    http_status: 409
    message: "Support surface order billing dimension is not in a state that permits this transition."
    trigger_condition: "reconcile is called on an order whose billing_status is not COMMITTED — still UNBILLED or ENCUMBERED, already terminal at RELEASED, or already RECONCILED."

  - error_id: ERR_SURVEY_ROUND_NOT_OPEN
    http_status: 409
    message: "Survey round is not open for the requested operation."
    trigger_condition: "An observation is filed against a round that is not OPEN, or open/lock/publish/cancel is called from a state that does not declare that transition."

  - error_id: ERR_PATIENT_DISCHARGED
    http_status: 409
    message: "Patient is discharged; inpatient WOC operations are closed."
    trigger_condition: "A consult request, skin assessment, survey observation, rental order, dressing protocol or education plan is created for a Patient whose status is DISCHARGED."

  - error_id: ERR_RESOURCE_NOT_ACTIVE
    http_status: 409
    message: "Referenced catalogue row has been retired or archived."
    trigger_condition: "A rental order names a SupportSurface whose status is RETIRED, or a dressing protocol names a FormularyProduct whose status is ARCHIVED."

  - error_id: ERR_RCA_NOT_COMPLETE
    http_status: 409
    message: "Root cause analysis is not finished."
    trigger_condition: "A pressure injury case is closed while its root_cause_category is null, or a unit's survey_posture is returned to OPEN while open_hapi_rca_count is greater than zero."

  - error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    message: "Consult request has already been returned for more information the maximum number of times."
    trigger_condition: "return is called on a consult whose revision_count has already reached MAX_REVISIONS (2)."

  - error_id: ERR_UNIT_POSTURE_RESTRICTED
    http_status: 409
    message: "Unit survey posture forbids this operation without a director override."
    trigger_condition: "A rental order is approved on a Unit whose survey_posture is FROZEN, or on a RESTRICTED unit without director_override set to true."

  - error_id: ERR_SURVEY_UNIT_COVERAGE_INCOMPLETE
    http_status: 409
    message: "Survey round cannot be locked before every participating unit has been observed."
    trigger_condition: "lock is called on an OPEN round for which at least one id in participating_unit_ids has no SurveyObservation row."

  # ---- temporal / capacity conflicts --------------------------------------
  - error_id: ERR_SURVEY_WINDOW_CONFLICT
    http_status: 409
    message: "Unit already carries the maximum number of survey rounds overlapping this window."
    trigger_condition: "A survey round is created or opened whose closed window [window_start, window_end] overlaps existing non-terminal rounds on a shared unit beyond the per-round-type capacity (1 concurrent PREVALENCE round, MAX_CONCURRENT_INCIDENCE_ROUNDS = 2 INCIDENCE rounds)."

  - error_id: ERR_SURFACE_UNAVAILABLE
    http_status: 409
    message: "Support surface is occupied or still within its reclean buffer for the requested interval."
    trigger_condition: "An order is approved whose half-open interval [rental_start, rental_end) overlaps another live order's interval extended by RECLEAN_BUFFER_HOURS (12) of trailing cleaning time on the same asset."

  - error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    message: "This patient has already been observed in this survey round."
    trigger_condition: "A second SurveyObservation is filed for the same (survey_round_id, patient_id) pair."

  - error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    message: "Natural key is already taken."
    trigger_condition: "A Unit reuses unit_code, a Patient reuses mrn, a SupportSurface reuses asset_tag, or a FormularyProduct reuses sku."

  # ---- optimistic concurrency ---------------------------------------------
  - error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    message: "Patient has changed since it was read."
    trigger_condition: "POST /skin-assessments supplies an expected_patient_version that differs from the Patient row's current version."

  - error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    message: "Unit has changed since it was read."
    trigger_condition: "POST /support-surface-orders/{order_id}/approve supplies an expected_unit_version that differs from the Unit row's current version."

  # ---- business / clinical rules ------------------------------------------
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    message: "The same person may not perform both halves of this control."
    trigger_condition: "The X-User-ID validating a skin assessment equals its staged_by_nurse_id, the RCA lead equals the nurse who staged the triggering assessment, or the nurse signing off a competency equals the subject nurse."

  - error_id: ERR_NURSE_NOT_CERTIFIED
    http_status: 422
    message: "Nurse certification status does not permit this action."
    trigger_condition: "A consult is assigned to a nurse whose certification_status is TRAINEE or LAPSED, an RCA lead is named whose certification_status is not CERTIFIED, or a survey observation names an observer whose certification_status is TRAINEE or LAPSED."

  - error_id: ERR_NURSE_LOAD_EXCEEDED
    http_status: 422
    message: "Nurse is already carrying the maximum consult load for their certification tier."
    trigger_condition: "A consult is assigned to a nurse whose active_consult_load has already reached MAX_LOAD_BY_CERT for their certification_status."

  - error_id: ERR_CERTIFICATION_NOT_ELIGIBLE
    http_status: 422
    message: "Nurse does not meet the certification pipeline gate."
    trigger_condition: "advance or certify is called on a nurse failing the corresponding gate: fewer than CE_CREDIT_FLOOR (30) credits, fewer than SIGNOFF_FLOOR (2) competency signoffs, or a certification_eligibility_score below ELIGIBILITY_SCORE_FLOOR (55.00)."

  - error_id: ERR_STAGE_NOT_VALIDATED
    http_status: 422
    message: "Operation requires a validated skin assessment stage."
    trigger_condition: "A dressing protocol is filed, or a consult is closed, while the consult's latest SkinAssessment validation_status is PENDING_VALIDATION or DISPUTED rather than VALIDATED."

  - error_id: ERR_POA_WINDOW_CLOSED
    http_status: 422
    message: "Present-on-admission may no longer be confirmed for this patient."
    trigger_condition: "validate supplies present_on_admission_confirmed = true for an assessment whose earliest observed_at falls later than admitted_at plus POA_WINDOW_HOURS (24)."

  - error_id: ERR_OBSERVATION_OUTSIDE_WINDOW
    http_status: 422
    message: "Observation timestamp falls outside the survey round window."
    trigger_condition: "A SurveyObservation carries an observed_at outside the closed interval [window_start, window_end] of its round, or an INCIDENCE observation carries an onset_at at or before window_start."

  - error_id: ERR_NON_FORMULARY_JUSTIFICATION_REQUIRED
    http_status: 422
    message: "Non-formulary product requires a written justification."
    trigger_condition: "A dressing protocol names a FormularyProduct whose formulary_tier is NON_FORMULARY while justification is absent, null or blank."

  - error_id: ERR_OSTOMY_PLAN_NOT_ELIGIBLE
    http_status: 422
    message: "Ostomy education plan is not ready for this step."
    trigger_condition: "transition-supplies is called on a plan whose status is not TEACH_BACK_PASSED, or an education plan is opened for a consult whose consult_type is not OSTOMY."

  - error_id: ERR_RENTAL_DAYS_EXCEED_AUTHORIZATION
    http_status: 422
    message: "Requested rental interval is longer than the authorized day count."
    trigger_condition: "A rental order's computed billable_days exceeds authorized_days, or rental_end is not strictly after rental_start."

  - error_id: ERR_RENTAL_BUDGET_EXCEEDED
    http_status: 402
    message: "Unit rental budget cannot absorb this authorization."
    trigger_condition: "approve would drive Unit.rental_encumbered_cents + Unit.rental_committed_cents above rental_budget_cap_cents, i.e. authorized_cost_cents exceeds rental_available_cents."

# =============================================================================
# 1.7 RBAC Matrix
# role_model: segregation_of_duties
#   The clinical controls in this domain are all two-person controls: the nurse
#   who stages a pressure injury may not validate its stage, may not lead its
#   root cause analysis, and may not sign off their own competency. Because the
#   WocNurse role is entity_backed, X-User-ID is directly comparable to
#   SkinAssessment.staged_by_nurse_id, PressureInjuryCase.rca_lead_nurse_id and
#   WocNurse.id, so every one of those controls is decidable server-side.
# =============================================================================
roles:
  - name: WocNurse
    description: "Certified or in-training wound/ostomy/continence nurse. Performs the bedside clinical work: staging, validation of another nurse's staging, protocol authoring, ostomy education and root cause analysis."
    identity: "entity_backed:WocNurse"
    exclusive_operations:
      - "POST /skin-assessments (stage a wound; staged_by_nurse_id is taken from X-User-ID and never from the payload)"
      - "POST /skin-assessments/{assessment_id}/validate"
      - "POST /skin-assessments/{assessment_id}/restage"
      - "POST /consult-requests/{consult_id}/triage"
      - "POST /consult-requests/{consult_id}/return"
      - "POST /consult-requests/{consult_id}/escalate"
      - "POST /consult-requests/{consult_id}/close"
      - "POST /pressure-injury-cases/{case_id}/rca-start"
      - "POST /pressure-injury-cases/{case_id}/rca-complete"
      - "POST /dressing-protocols"
      - "POST /ostomy-education-plans"
      - "POST /ostomy-education-plans/{plan_id}/sessions"
      - "POST /ostomy-education-plans/{plan_id}/transition-supplies"
      - "POST /survey-observations"
    shared_operations:
      - "POST /support-surface-orders (shared with MaterialsCoordinator)"
      - "every GET read endpoint (shared with UnitCharge, WocProgramDirector, MaterialsCoordinator)"

  - name: UnitCharge
    description: "Charge nurse of an inpatient unit. Requests consults for their own patients, admits and discharges patients, and reads unit-level survey reporting."
    identity: "entity_backed:Unit"
    exclusive_operations:
      - "POST /consult-requests"
      - "POST /consult-requests/{consult_id}/resubmit"
      - "POST /patients"
      - "POST /patients/{patient_id}/discharge"
    shared_operations:
      - "every GET read endpoint (shared with WocNurse, WocProgramDirector, MaterialsCoordinator)"

  - name: WocProgramDirector
    description: "Program director for the WOC service. Owns the formulary, the survey programme, the certification pipeline, unit budget caps and consult assignment."
    identity: "opaque"
    exclusive_operations:
      - "POST /units"
      - "POST /units/{unit_id}/budget-adjustments"
      - "POST /woc-nurses"
      - "POST /woc-nurses/{nurse_id}/competency-signoffs"
      - "POST /woc-nurses/{nurse_id}/advance"
      - "POST /woc-nurses/{nurse_id}/certify"
      - "POST /woc-nurses/{nurse_id}/lapse"
      - "POST /consult-requests/{consult_id}/assign"
