            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_b}", method: "DIE_CUT", expected_package_spec_version: "${spec_b_v}" }, as: DesignEngineer, captures: { cp_b: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_b}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_b}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_b: $.data.id } }
            - { call: "POST /api/toolings/${tool_b}/commission", payload: {}, as: DesignEngineer }
