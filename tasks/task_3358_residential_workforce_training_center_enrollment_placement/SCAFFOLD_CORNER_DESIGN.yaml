# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walking the claim-extraction guide
# section by section. Instances already exercised by a §1.8 difficulty instance
# are emitted as excluded_because stubs. Shared fixture literals match §1.8
# (default clock 2026-09-01T00:00:00Z; counselor-1 / reviewer-1 segregation pair).
scaffold_corner_design:
  - section: entities
    instances:
      - name: created_entities_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.TradeProgram.fields.required_credential_types
          - entities.TradeProgram.fields.supports_remediation
          - entities.Application.fields.status
          - entities.Credential.fields.status
        distinguishing_aspect: |
          Omitting optional inputs applies declared defaults: a program created
          without required_credential_types / supports_remediation shows [] and
          false; a new application starts SUBMITTED; a new credential starts
          EARNED. New entities report version == 1.
        test_recipe:
          setup: ["empty database; clock default"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Default Center", region_code: "R-NORTH", total_beds: 3 }, as: OperatorAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "CULINARY", capacity: 4 }, as: OperatorAdmin, captures: { p_reqs: $.data.required_credential_types, p_remed: $.data.supports_remediation, p_status: $.data.status, p_ver: $.data.version } }
            - { call: "POST /jc/applicants", payload: { full_name: "Def Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "CULINARY" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app_status: $.data.status } }
          assert:
            - "program: required_credential_types == [], supports_remediation == false, status == OPEN, version == 1"
            - "application: status == SUBMITTED on creation (initial_state)"
            - "applicant: assignment_status == NONE, version == 1"

      - name: system_field_injection_rejected
        claim_type: system_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          System-minted fields are not client-writable: a create body carrying an
          undeclared id field is rejected wholesale with ERR_INVALID_REQUEST
          rather than silently overriding the server-minted UUID.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/centers", payload: { name: "Inject Center", region_code: "R-NORTH", total_beds: 3, id: "00000000-0000-0000-0000-000000000000" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (undeclared body field), and no center is created"

      - name: applicant_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but unknown applicant UUID returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "GET /jc/applicants/11111111-2222-3333-4444-555555555555", as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (existence is validated before any business rule)"

      - name: child_listing_via_parent_subresource
        claim_type: parent_relationships
        grounds:
          - entities.TradeProgram.fields.center_id
        distinguishing_aspect: |
          The reverse-reachability sub-resource returns exactly the children of
          the addressed parent: two programs created under center A are listed
          there, while a program under center B is not, and an unknown parent id
          yields ERR_NOT_FOUND.
        test_recipe:
          setup: ["two centers; two WELDING programs under A; one CARPENTRY program under B"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "List A", region_code: "R-NORTH", total_beds: 3 }, as: OperatorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /jc/centers", payload: { name: "List B", region_code: "R-SOUTH", total_beds: 3 }, as: OperatorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "WELDING", capacity: 2 }, as: OperatorAdmin }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "CULINARY", capacity: 2 }, as: OperatorAdmin }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${cb}", trade_code: "CARPENTRY", capacity: 2 }, as: OperatorAdmin }
          trigger:
            - { call: "GET /jc/centers/${ca}/trade-programs", as: OperatorAdmin }
            - { call: "GET /jc/centers/11111111-2222-3333-4444-555555555555/trade-programs", as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "GET center A's programs returns exactly 2 rows (WELDING, CULINARY) — center B's CARPENTRY row is absent"
            - "unknown parent id: error_id == ERR_NOT_FOUND"

  - section: state_machines
    instances:
      - name: determine_before_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "determine is undefined from SUBMITTED (review must be opened first); the attempt fails with ERR_INVALID_STATE and the case stays SUBMITTED."
        test_recipe:
          setup: ["applicant with a fresh SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Skip Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; application remains SUBMITTED with determination_reasons == []"

      - name: appeal_on_terminal_eligible_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application, "validations[priority=7]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "ELIGIBLE is terminal: an appeal against a determined-eligible case fails with ERR_ALREADY_TERMINAL (lockdown reported before transition analysis)."
        test_recipe:
          setup: ["applicant whose application was determined ELIGIBLE"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Term Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "appeal", annual_income_cents: 100 }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL; application stays ELIGIBLE"

      - name: info_request_cycle_repeats
        claim_type: invalid_transition
        grounds: [state_machines.Application.UNDER_REVIEW_to_INFO_REQUESTED]
        excluded_because:
          difficulty_instance: application_review_appeal_cycle
          rationale: "The UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW loop is exercised inline in that instance's setup (request_info then provide_info)."

      - name: zero_tolerance_sanction_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConductIncident.INVESTIGATING_to_SANCTIONED, "validations[priority=10]", "errors[ERR_ZERO_TOLERANCE_BOARD_REQUIRED]"]
        distinguishing_aspect: "A VIOLENCE incident (zero_tolerance computed true) cannot be sanctioned directly; the sanction attempt fails with ERR_ZERO_TOLERANCE_BOARD_REQUIRED while a non-zero-tolerance THEFT incident accepts the same sanction."
        test_recipe:
          setup: ["TRAINING enrollment; one VIOLENCE incident and one THEFT incident, both INVESTIGATING"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "ZT Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Zt Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "VIOLENCE", occurred_at: "2026-08-20" }, as: ResidentialAdvisor, captures: { i_v: $.data.id, zt_flag: $.data.zero_tolerance } }
            - { call: "POST /jc/conduct-incidents/${i_v}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "THEFT", occurred_at: "2026-08-21" }, as: ResidentialAdvisor, captures: { i_t: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i_t}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
          trigger:
            - { call: "POST /jc/conduct-incidents/${i_v}/transition", payload: { action: "sanction", sanction_points: 3 }, as: ResidentialAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /jc/conduct-incidents/${i_t}/transition", payload: { action: "sanction", sanction_points: 3 }, as: ResidentialAdvisor, captures: { t_status: $.data.status } }
            - { call: "GET /jc/enrollments/${e1}/conduct-incidents", as: ResidentialAdvisor }
          assert:
            - "VIOLENCE incident: zero_tolerance == true on creation; sanction -> error_id == ERR_ZERO_TOLERANCE_BOARD_REQUIRED, status stays INVESTIGATING"
            - "THEFT incident (zero_tolerance false): sanction succeeds -> SANCTIONED with sanction_points 3"
            - "GET conduct-incidents sub-resource lists exactly 2 rows: ${i_v} INVESTIGATING and ${i_t} SANCTIONED (FK reverse-reachability)"

      - name: rolling_points_threshold_exactly_ten_activates_hold
        claim_type: side_effect_execution
        grounds: [calculations.conduct_rolling_points, entities.Enrollment.fields.conduct_hold]
        distinguishing_aspect: "Threshold precision on rolling points: totals 4 and 9 leave conduct_hold false; the sanction that lands the rolling total exactly on BOARD_REVIEW_THRESHOLD_POINTS (10) flips it true (>= semantics)."
        test_recipe:
          setup: ["TRAINING enrollment; three THEFT incidents inside the 90-day window, investigated"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Pts Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Pts Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "THEFT", occurred_at: "2026-08-10" }, as: ResidentialAdvisor, captures: { i1: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "sanction", sanction_points: 4 }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "CURFEW_VIOLATION", occurred_at: "2026-08-15" }, as: ResidentialAdvisor, captures: { i2: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i2}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i2}/transition", payload: { action: "sanction", sanction_points: 5 }, as: ResidentialAdvisor }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { hold_9: $.data.conduct_hold } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "OTHER", occurred_at: "2026-08-20" }, as: ResidentialAdvisor, captures: { i3: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i3}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
          trigger:
            - { call: "POST /jc/conduct-incidents/${i3}/transition", payload: { action: "sanction", sanction_points: 1 }, as: ResidentialAdvisor }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { hold_10: $.data.conduct_hold } }
          assert:
            - "after 4 + 5 = 9 rolling points: conduct_hold == false (below threshold)"
            - "after +1 = exactly 10 rolling points: conduct_hold == true (>= threshold, inclusive boundary)"

      - name: rolling_points_window_boundary_excludes_day_91
        claim_type: input_set_filtering
        grounds: [calculations.conduct_rolling_points]
        distinguishing_aspect: "Window boundary precision: an incident dated exactly 90 days before the clock (2026-06-03) is inside the inclusive window while one dated 2026-06-02 (day 91) drops out — two 5-point sanctions therefore total 5, not 10, and no hold engages."
        test_recipe:
          setup: ["TRAINING enrollment at default clock 2026-09-01; incidents occurred 2026-06-02 (outside) and 2026-06-03 (window edge, inside)"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Win Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Win Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "THEFT", occurred_at: "2026-06-02" }, as: ResidentialAdvisor, captures: { i_old: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i_old}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i_old}/transition", payload: { action: "sanction", sanction_points: 5 }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "THEFT", occurred_at: "2026-06-03" }, as: ResidentialAdvisor, captures: { i_edge: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i_edge}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i_edge}/transition", payload: { action: "sanction", sanction_points: 5 }, as: ResidentialAdvisor }
          trigger:
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { hold: $.data.conduct_hold } }
          assert:
            - "conduct_hold == false: only the 2026-06-03 sanction counts (rolling total 5); the 2026-06-02 sanction is day 91 and excluded"

      - name: credential_auto_advance_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: [state_machines.Credential.EARNED_to_VERIFIED]
        excluded_because:
          difficulty_instance: enrollment_parallel_training_residential_dims
          rationale: "The REMEDIATION -> TRAINING auto-advance on HSE verification is asserted there."

      - name: begin_training_without_verified_prereq_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Enrollment.training_status, "validations[priority=12]", "errors[ERR_PREREQUISITE_NOT_MET]"]
        distinguishing_aspect: "A REMEDIATION enrollment whose HSE credential exists but is merely EARNED (not VERIFIED) cannot begin training; the same gate also blocks a completion attempt."
        test_recipe:
          setup: ["program with required_credential_types [HSE] and supports_remediation true; enrollment in REMEDIATION; HSE credential recorded (EARNED) but never verified"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Prereq Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5, required_credential_types: ["HSE"], supports_remediation: true }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Pre Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id, e_st: $.data.training_status } }
            - { call: "POST /jc/credentials", payload: { enrollment_id: "${e1}", credential_type: "HSE" }, as: CareerInstructor, captures: { cr1: $.data.id } }
          trigger:
            - { call: "POST /jc/enrollments/${e1}/transition", payload: { action: "begin_training" }, as: EnrollmentManager, captures: { err: $.data.error_id } }
            - { call: "GET /jc/enrollments/${e1}/credentials", as: CareerInstructor, captures: { cr_st: "$.data[0].status" } }
          assert:
            - "enrollment created in REMEDIATION (prereq missing, remediation supported)"
            - "begin_training with the HSE credential only EARNED: error_id == ERR_PREREQUISITE_NOT_MET; enrollment stays REMEDIATION"
            - "GET credentials sub-resource lists exactly 1 row, status EARNED (FK reverse-reachability)"

      - name: revoked_credential_reblocks_completion
        claim_type: conditional_validation
        grounds: [state_machines.Credential.VERIFIED_to_REVOKED, "validations[priority=12]", "errors[ERR_PREREQUISITE_NOT_MET]"]
        distinguishing_aspect: "Prerequisites are re-evaluated at the completion gate: after HSE verification auto-advanced the enrollment to TRAINING, revoking that credential makes a subsequent complete fail with ERR_PREREQUISITE_NOT_MET even though the enrollment visibly sits in TRAINING."
        test_recipe:
          setup: ["REMEDIATION enrollment; HSE earned and verified (auto-advanced to TRAINING); then the credential is revoked"]
          setup_api_calls:
