  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refile_with_revoked_certificate_prefers_state_over_safety_error
        grounds:
          - validations[priority=74]
          - validations[priority=103]
          - errors[ERR_RETURN_ALREADY_FILED]
          - errors[ERR_CERTIFICATE_NOT_VALID_ON_DATE]
          - state_machines.ExemptionCertificate.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Error-category pair is state (priority 74, 409) versus business_safety (priority 103, 422):
          the second file attempt on an already-FILED return whose SCH_6 certificate has since been
          revoked violates both rules, and the ladder must return the 409 ERR_RETURN_ALREADY_FILED,
          never the 422 ERR_CERTIFICATE_NOT_VALID_ON_DATE.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER counterparty, one ACTIVE fully bonded DISTRIBUTOR filer, one ACTIVE RETAILER government fleet with an ACTIVE GOVERNMENT certificate valid 2026-01-01..2026-12-31."
            - "Clock at 2026-09-05T00:00:00Z."
            - "The distributor's 2026-08 return carries SCH_2 UNDYED_DIESEL 500.00 received and SCH_6 UNDYED_DIESEL 200.00 sold exempt to the fleet against that certificate; it is FILED with tax_due_cents 9270."
            - "The certificate is then revoked, so the filing-time re-check of priority 103 would now fail."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dakota County Fleet Services", fein: "41-2000001", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { gov_id: $.data.id, gov_v0: $.data.version }
            - call: "POST /mft/licensees/${gov_id}/bonds"
              payload: { amount_cents: 400000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${gov_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${gov_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "GOVERNMENT", document_number: "GOV-CERT-2553-B", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: LicensingOfficer
              captures: { gov_cert_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 500.00 }
              as: ReturnsExaminer
              captures: { d_sch_recv: $.data.id }
