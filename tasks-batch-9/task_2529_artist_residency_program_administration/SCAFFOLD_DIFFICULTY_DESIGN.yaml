            - call: "POST /panel-assignments/${pa3}/declare-conflict"
              payload: { conflict_type: "PRIOR_MENTORSHIP", conflict_detail: "taught the applicant in 2019" }
              as: Panelist
              as_user_id: "${p3}"
              captures: { err2: "$.data.error_id" }
