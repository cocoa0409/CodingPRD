      - name: staging_more_cullet_at_the_restrict_level_is_rejected_until_a_reversal_clears_it
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MELT_POSTURE_RESTRICTED]
          - validations[priority=46]
          - state_machines[Plant.melt_posture].transitions[OPEN->RESTRICTED]
          - state_machines[Plant.melt_posture].transitions[RESTRICTED->OPEN]
          - state_machines[CulletBatch.status].transitions[CHARGED->STAGED]
          - calculations.cullet_charge_allocation
        distinguishing_aspect: "RESTRICTED is not an error state that a caller can ask for — it is minted by the melt itself when cullet_fraction_ytd lands exactly ON cullet_restrict_fraction (0.2800 >= 0.28). From there staging is refused with ERR_MELT_POSTURE_RESTRICTED, and the ONLY way back to OPEN is to reverse a charge (dropping the ratio) and then have EnvironmentalCompliance RECOMPUTE; a RECOMPUTE issued while the ratio is still at the level is itself refused."
        test_recipe:
          setup:
            - "Plant NWK: max_cullet_fraction 0.30, cullet_restrict_fraction 0.28, melt_posture OPEN, cullet ledger all zeroes."
            - "Two STAGED external cullet batches created in this order: B1 1500.00 kg, B2 1300.00 kg (2800.00 kg received, all on hand)."
