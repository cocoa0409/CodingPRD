      - name: conservator_suspended_coapprove_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CONSERVATOR_NOT_ACTIVE]"]

        distinguishing_aspect: "Co-approval requires the conservator's CURRENT status ACTIVE: after suspension, the co-approve call fails with ERR_CONSERVATOR_NOT_ACTIVE even for the right conservator id."
        test_recipe:
          setup: ["ACTIVE client with EXCLUSIVE conservator (then SUSPENDED); disbursement in PENDING_CONSERVATOR"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Susp Sara", date_of_birth: "1986-07-23", ssn_last4: "1213", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
