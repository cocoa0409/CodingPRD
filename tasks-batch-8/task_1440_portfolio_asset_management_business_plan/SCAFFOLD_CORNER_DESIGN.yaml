      - name: lender_report_late_cascades_loan_watch
        claim_type: correct_result
        grounds: [calculations.lender_report_snapshot, state_machines.Loan.CURRENT_to_WATCH]
        distinguishing_aspect: "Late submission (2026-11-20 > due 2026-11-14 for Q3) freezes is_late=true and cascades Loan CURRENT -> WATCH and posture to ELEVATED — a cadence-driven side effect."
        test_recipe:
          setup: ["BASE; loan 300M @ 1000bps; Q3 report drafted (end 2026-09-30, due 2026-11-14); clock advanced to 2026-11-20"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id } }
            - { call: "POST /api/loans", payload: { asset_id: "${a1}", lender_name: "Bank", principal_balance_cents: 300000000, annual_interest_rate_bps: 1000, origination_date: "2026-01-01", maturity_date: "2028-06-30" }, as: PortfolioDirector, captures: { ln1: $.data.id } }
            - { call: "POST /api/lender-reports", payload: { loan_id: "${ln1}", period_label: "2026-Q3" }, as: AssetManager, as_user_id: "am-1", captures: { lr1: $.data.id, due: $.data.due_date } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T00:00:00Z" }, as: PortfolioDirector }
          trigger:
            - { call: "POST /api/lender-reports/${lr1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1", captures: { late: $.data.is_late, st: $.data.status } }
            - { call: "GET /api/loans/${ln1}", payload: {}, as: Analyst, captures: { ln_st: $.data.status } }
            - { call: "GET /api/portfolios/${p1}", payload: {}, as: Analyst, captures: { post: $.data.risk_posture } }
          assert:
