              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_CURRENT_PRICE (now == effective_to is outside the half-open window)"
            - "GET /agronomy/price-sheets/${ps_urea}: status == EXPIRED (lazy evaluation observable)"

