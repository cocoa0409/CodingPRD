  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource, or lead-gated op attempted by an office without LEAD+ACTIVE participation in that investigation" }
  - { id: ERR_STATE_OFFICE_NOT_FOUND, http: 404, condition: "No StateOffice with that id" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "No Investigation with that id" }
  - { id: ERR_PARTICIPATION_NOT_FOUND, http: 404, condition: "No Participation with that id" }
  - { id: ERR_RESPONSE_NOT_FOUND, http: 404, condition: "No ConsolidatedResponse with that id" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "No Settlement with that id" }
  - { id: ERR_ALLOCATION_LINE_NOT_FOUND, http: 404, condition: "No AllocationLine with that id" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "No Disbursement with that id" }
  - { id: ERR_CLAIMANT_NOT_FOUND, http: 404, condition: "No Claimant with that id" }
  - { id: ERR_MONITORING_PERIOD_NOT_FOUND, http: 404, condition: "No MonitoringPeriod with that id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_PHASE, http: 409, condition: "Investigation phase forbids the operation or the requested advance target" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state machine forbids the trigger from its current state" }
  - { id: ERR_PARTICIPATION_INACTIVE, http: 409, condition: "Participation is not ACTIVE (demand issuance or lead designation)" }
  - { id: ERR_LINE_NOT_DISBURSABLE, http: 409, condition: "Allocation line is not ELIGIBLE or DISBURSING" }
  - { id: ERR_SETTLEMENT_NOT_FUNDED, http: 409, condition: "Settlement fund is UNFUNDED (disbursement) or below FUNDED (advance to MONITORING)" }
  - { id: ERR_RESTITUTION_LOCKED, http: 409, condition: "Restitution already computed for this settlement" }
  - { id: ERR_SIGNED_STATE_CANNOT_WITHDRAW, http: 409, condition: "Office holds a SIGNED/LOCKED sign-on on a non-terminal settlement of this investigation" }
  - { id: ERR_COMPLIANCE_HOLD_ACTIVE, http: 409, condition: "Compliance hold blocks disbursement creation or release" }
  - { id: ERR_DUPLICATE_PARTICIPATION, http: 409, condition: "Office already has a non-WITHDRAWN participation in this investigation" }
  - { id: ERR_DUPLICATE_SIGN_ON, http: 409, condition: "Office already recorded a sign-on decision on this settlement" }
  - { id: ERR_DUPLICATE_FINDING, http: 409, condition: "A finding for this term_index already exists in this monitoring period" }
  - { id: ERR_PERIOD_NOT_CONTIGUOUS, http: 409, condition: "Previous monitoring period not closed, or new window would gap/overlap the previous one" }
  - { id: ERR_LEAD_WINDOW_OVERLAP, http: 409, condition: "A lead office already occupies an active lead window on another investigation" }
  - { id: ERR_NOT_A_PARTICIPANT, http: 422, condition: "Sign-on caller office lacks an ACTIVE participation in the settlement's investigation" }
  - { id: ERR_RESPONSE_DEMANDS_INVALID, http: 422, condition: "demand_ids empty, includes a non-ISSUED demand, or spans investigations" }
  - { id: ERR_INVALID_TERM_INDEX, http: 422, condition: "term_index out of range of the settlement's injunctive_terms" }
  - { id: ERR_SIGN_ON_WINDOW_CLOSED, http: 422, condition: "Sign-on attempted after sign_on_deadline" }
  - { id: ERR_CERTIFICATION_WINDOW_CLOSED, http: 422, condition: "Certification attempted after executed_at + APPROPRIATION_WINDOW_DAYS (no mutation)" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 422, condition: "Claimant registration after the claim window, or restitution compute at or before it" }
  - { id: ERR_PERIOD_NOT_STARTED, http: 422, condition: "Monitoring period opened before its window_start" }
  - { id: ERR_NEGOTIATED_SHARES_INVALID, http: 422, condition: "NEGOTIATED basis shares missing/mismatched keys or do not sum to 10000 bps" }
  - { id: ERR_ACTIVATION_QUORUM_MISSING, http: 422, condition: "Fewer than 2 leads or fewer than 3 active participations at activation" }
  - { id: ERR_NEGOTIATION_EXHAUSTED, http: 422, condition: "Counter would exceed MAX_SETTLEMENT_ROUNDS" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Execute attempted before deadline with sign-on quorum unmet; no state change" }
  - { id: ERR_CIA_TIER_INSUFFICIENT, http: 422, condition: "Lead designation requires cia_tier RESTRICTED or LEAD_ONLY" }
  - { id: ERR_PERIOD_LIMIT_REACHED, http: 422, condition: "Monitoring period index would exceed MONITORING_MAX_PERIODS" }
  - { id: ERR_NO_ACCEPTED_RESPONSE, http: 422, condition: "Advance to NEGOTIATION without an ACCEPTED or FULFILLED consolidated response" }
  - { id: ERR_NO_AGREED_SETTLEMENT, http: 422, condition: "Advance to SETTLEMENT_PENDING without a TERMS_AGREED or later settlement" }
  - { id: ERR_DEPOSIT_EXCEEDS_TOTAL, http: 422, condition: "Deposit would push deposited_cents past monetary_total_cents" }
  - { id: ERR_INSUFFICIENT_FUND_BALANCE, http: 422, condition: "Release exceeds the settlement's undisbursed deposited balance" }
  - { id: ERR_AMOUNT_EXCEEDS_REMAINING, http: 422, condition: "Disbursement amount is not in (0, line.remaining_cents]" }
  - { id: ERR_VALIDATION_EXCEEDS_CLAIM, http: 422, condition: "validated_loss_cents not in (0, claimed_loss_cents]" }
  - { id: ERR_USE_CODE_NOT_PERMITTED, http: 422, condition: "GENERAL_FUND_ONLY office requested a non-GENERAL_FUND use_code" }

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties: propose/counter/execute/certify/release
#     are split across five roles so no single role moves money end-to-end)
# =============================================================================
roles:
  - name: CommitteeChair
    description: "Executive committee coordinator; runs committee formation, phase advancement, sign-on opening, execution, and monitoring period scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /multistate/state-offices + PATCH /multistate/state-offices/{id}"
      - "POST /multistate/investigations + advance"
      - "POST /multistate/investigations/{id}/participations"
      - "POST /multistate/participations/{id}/designate-lead"
      - "POST /multistate/settlements/{id}/open-sign-on + execute"
      - "POST /multistate/settlements/{id}/monitoring-periods"
    shared_operations:
      - "POST /multistate/participations/{id}/withdraw"
      - "all GET endpoints"
  - name: LeadStateAG
    description: "Attorney general office user of a state holding a LEAD+ACTIVE participation in the relevant investigation"
    identity: "entity_backed:StateOffice"
    exclusive_operations:
      - "POST /multistate/investigations/{id}/settlements"
      - "POST /multistate/settlements/{id}/revise"
      - "POST /multistate/responses/{id}/accept"
    shared_operations:
      - "execute-cia, withdraw, demand create, sign-ons, disbursement create (own office only)"
      - "all GET endpoints"
  - name: ParticipatingStateAG
    description: "Attorney general office user of a member (non-lead) participating state"
    identity: "entity_backed:StateOffice"
    exclusive_operations: []
    shared_operations:
      - "execute-cia, withdraw, demand create, sign-ons, disbursement create (own office only)"
      - "all GET endpoints"
  - name: DefendantCounsel
    description: "Outside counsel for the investigation target; negotiates consolidated responses and settlement terms and funds the settlement"
    identity: opaque
    exclusive_operations:
      - "POST /multistate/investigations/{id}/responses"
      - "POST /multistate/responses/{id}/fulfill"
      - "POST /multistate/settlements/{id}/counter + agree-terms + deposit"
    shared_operations:
      - "all GET endpoints"
  - name: FundAdministrator
    description: "Settlement fund administrator; registers and validates claimants, computes restitution, releases certified disbursements"
    identity: opaque
    exclusive_operations:
      - "POST /multistate/settlements/{id}/claimants"
      - "POST /multistate/claimants/{id}/validate"
      - "POST /multistate/settlements/{id}/restitution-compute"
      - "POST /multistate/disbursements/{id}/release"
    shared_operations:
      - "all GET endpoints"
  - name: StateLegislature
    description: "Legislative appropriations authority of a state; certifies disbursements for its own state only"
    identity: "entity_backed:StateOffice"
    exclusive_operations:
      - "POST /multistate/disbursements/{id}/certify"
    shared_operations:
      - "all GET endpoints"
  - name: ComplianceMonitor
    description: "Independent compliance monitor; files per-term findings in monitoring periods"
    identity: opaque
    exclusive_operations:
      - "POST /multistate/monitoring-periods/{id}/findings"
    shared_operations:
      - "all GET endpoints"
