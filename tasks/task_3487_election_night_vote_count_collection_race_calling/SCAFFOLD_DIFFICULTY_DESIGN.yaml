              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call_w: $.data.id }
            - call: "POST /calls/${call_w}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CERTIFICATION" }
              as: ElectionOpsAdmin
            - call: "POST /contests/${cst}/recount-cases"
              payload: {}
              as: RecountOfficer
              captures: { rc: $.data.id }
            - call: "POST /recount-cases/${rc}/decisions"
              payload: { action: "ACTIVATE" }
              as: RecountOfficer
          trigger:
            - call: "POST /recount-cases/${rc}/decisions"
              payload: { action: "RESOLVE", outcome: "OVERTURNED", note: "hand recount reverses certified margin" }
              as: RecountOfficer
          assert:
            - "RecountCase.${rc}.status == RESOLVED_OVERTURNED and filed_margin_pct == 0.005"
            - "RaceCall.${call_w}.status == RETRACTED and retract_reason == \"RECOUNT_OVERTURNED\" (hop 1)"
            - "Contest.${cst}.call_status == UNCALLED and called_candidate_id is null (hop 2)"
            - "the CALL ResultDelivery for ${cust_prem} on ${cst} has status == STALE (hop 3)"
            - "a CALL_CREDIT ResultDelivery for ${cust_prem} exists with fee_cents == -4999 and status == SENT (hop 3 compensation)"
            - "Contest.${cst} now has 4 ResultDelivery rows: 2 VOTE_UPDATE SENT, 1 CALL STALE, 1 CALL_CREDIT SENT"
            - "ElectionEvent.${ev}.posture == TABULATION (activation auto-reopened CERTIFICATION)"

      - name: report_acceptance_rolls_up_county_then_contest_completion
        grounds:
          - state_machines.VoteReport.RECEIVED|FLAGGED_to_ACCEPTED
          - state_machines.Contest.tabulation_status_REPORTING_to_COMPLETE
          - calculations.tabulation_rollup
          - entities.County.fields.status
        distinguishing_aspect: "Depth-2 chain from the clerk's ACCEPT trigger: the acceptance recomputes tabulation_rollup (hop 1), and the rollup's per-county completion flips Contest.tabulation_status REPORTING -> COMPLETE only when the second county's report lands (hop 2) — a different trigger and propagation pattern than the recount cascade."
