      - name: new_program_on_same_baseline_supersedes_the_previous_one
        claim_type: side_effect_execution
        grounds:
          - state_machines.LightweightingProgram.RISK_ASSESSED_to_SUPERSEDED
          - concurrency_rules.program-create-stale-design
          - calculations.lightweighting_economics
        distinguishing_aspect: |
          Creating LW-S12B on the same baseline_design_id drives LW-S12A from RISK_ASSESSED to SUPERSEDED
