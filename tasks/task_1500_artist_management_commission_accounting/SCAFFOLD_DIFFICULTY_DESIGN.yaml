              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Cl", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "Venue 1", start_datetime: "2026-09-10T18:00:00Z", end_datetime: "2026-09-10T23:00:00Z", guarantee_cents: 100000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng1: $.data.id }
            - call: "POST /engagements/${eng1}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "Venue 2", start_datetime: "2026-09-10T20:00:00Z", end_datetime: "2026-09-11T02:00:00Z", guarantee_cents: 100000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /engagements/${eng2}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "Confirm is rejected with error_id == ERR_ENGAGEMENT_WINDOW_PAST (http 422)"
            - "The overlap condition ALSO holds (E2 window intersects CONFIRMED E1), so this is a genuine dual-failure: business_temporal (priority 11) wins over business_constraint (priority 13); ERR_ENGAGEMENT_OVERLAP is NOT returned"
            - "Engagement.${eng2}.status == HOLD (unchanged)"

