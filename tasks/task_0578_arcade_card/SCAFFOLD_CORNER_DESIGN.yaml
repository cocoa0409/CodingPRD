  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_redemption_stale_card_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[redemption-create-stale-card]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first redemption bumps the card version, a second redemption still carrying the pre-first expected_card_version is rejected ERR_STALE_VERSION (412) — checked before the points balance."
        test_recipe:
          setup: ["A card funded to 2000 points via two plays; prize price 500 stock 100; card version captured before the first redemption."]
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 1000 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /prize-items"
              payload: { name: "Teddy", points_price: 500, stock_qty: 100 }
              as: Manager
              captures: { prize_id: $.data.id }
            - call: "POST /members"
              payload: { email: "occ@x.com", full_name: "OCC" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 1000 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c_id}"
              payload: {}
              as: Attendant
              captures: { v0: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c_id}", prize_item_id: "${prize_id}", quantity: 1, expected_card_version: "${v0}" }
              as: Attendant
              captures: { red1: $.data.id }
          trigger:
            - call: "POST /redemptions"
              payload: { card_id: "${c_id}", prize_item_id: "${prize_id}", quantity: 1, expected_card_version: "${v0}" }
              as: Attendant
              captures: { err: $.data.error_id }
          assert:
            - "first redemption ${red1} succeeded (201)"
            - "trigger response error_id == ERR_STALE_VERSION (412)"

      - name: occ_wristband_issue_stale_booking_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wristband-issue-stale-booking]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first extra-wristband issue bumps booking version, a second issue carrying the pre-first expected_booking_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A CONFIRMED booking; its version captured after confirm."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room R", capacity: 30, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "hr@x.com", full_name: "HR" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /party-bookings/${bid}"
              payload: {}
              as: Cashier
              captures: { bv0: $.data.version }
            - call: "POST /party-bookings/${bid}/wristbands"
              payload: { expected_booking_version: "${bv0}" }
              as: Cashier
          trigger:
            - call: "POST /party-bookings/${bid}/wristbands"
              payload: { expected_booking_version: "${bv0}" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION (412)"

      - name: derived_balance_matches_ledger_sum
        claim_type: derived_field_reconciliation
        grounds: ["entities.GameCard.chip_balance_cents", "entities.CardLedgerEntry.chip_delta_cents"]
        distinguishing_aspect: "After a reload of 1000 and a play of cost 200, chip_balance_cents (800) equals the sum of CardLedgerEntry.chip_delta_cents over the card's ledger."
        test_recipe:
          setup: ["An anonymous ACTIVE card reloaded 1000 then charged one 200-cost play."]
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 200, points_award: 10 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /game-cards"
              payload: {}
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 1000 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
          trigger:
            - call: "GET /game-cards/${c_id}/ledger"
              payload: {}
              as: Cashier
          assert:
            - "GameCard.${c_id}.chip_balance_cents == 800"
            - "sum of CardLedgerEntry.chip_delta_cents over the card ledger == 800"

      - name: reconciliation_excludes_closed_cards
        claim_type: derived_field_reconciliation
        grounds: ["calculations.daily_reconciliation", "state_machines.GameCard.ACTIVE_to_CLOSED"]
        distinguishing_aspect: "A CLOSED card's balance is excluded from expected_chip_liability_cents at open — only ACTIVE/FROZEN cards are summed."
        test_recipe:
          setup: ["Card A reloaded 6000 then CLOSED; card B reloaded 3000 ACTIVE; reconciliation opened for 2026-05-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: Manager
            - call: "POST /members"
              payload: { email: "cl@x.com", full_name: "CL" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { ca: $.data.id }
            - call: "POST /game-cards/${ca}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${ca}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
            - call: "POST /game-cards/${ca}/close"
              payload: {}
              as: Manager
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { cb: $.data.id }
            - call: "POST /game-cards/${cb}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${cb}/reload"
              payload: { amount_cents: 3000 }
              as: Cashier
          trigger:
            - call: "POST /daily-reconciliations"
              payload: { business_day: "2026-05-06" }
              as: Manager
              captures: { exp: $.data.expected_chip_liability_cents }
          assert:
            - "DailyReconciliation expected_chip_liability_cents == 3000 (CLOSED card A's 6000 excluded)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: reload_reflects_new_balance_same_response
        claim_type: immediate
        grounds: ["endpoints.POST_/game-cards/{id}/reload", "entities.GameCard.chip_balance_cents"]
        distinguishing_aspect: "The reload response body itself already shows the updated chip_balance_cents and incremented version (immediate consistency)."
        test_recipe:
          setup: ["An anonymous ACTIVE card at balance 0."]
          setup_api_calls:
            - call: "POST /game-cards"
              payload: {}
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
              captures: { v_after_activate: $.data.version }
          trigger:
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 2500 }
              as: Cashier
              captures: { bal: $.data.chip_balance_cents, v: $.data.version }
          assert:
            - "reload response data.chip_balance_cents == 2500"
            - "reload response data.version == ${v_after_activate} + 1"
