  # ===========================================================================
  # Section: cross-cutting — OCC on listing version (rule already covered by §1.8-adjacent)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_listing_version_blocks_matching
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[resale-matching-stale-listing]"
        distinguishing_aspect: "run-matching with stale expected_listing_version returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Resale listing at version V; run matching once (V→V+1)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
