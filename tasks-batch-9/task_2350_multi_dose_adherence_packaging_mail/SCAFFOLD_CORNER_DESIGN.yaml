            - "${e_rar} == ERR_REFILL_AUTHORIZATION_NOT_FOUND, ${e_vac} == ERR_VACATION_EXCEPTION_NOT_FOUND, ${e_memo} == ERR_CREDIT_MEMO_NOT_FOUND, ${e_event} == ERR_ADHERENCE_EVENT_NOT_FOUND"
