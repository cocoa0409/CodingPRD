              payload: { first_name: "Dep", last_name: "Osit", date_of_birth: "1986-06-26", sex_at_birth: "F", primary_phone: "+15551400007" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MDP", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-11T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRDP" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
