scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: invoice_provisional_vs_final_expense_input_set
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.total_cents
          - entities.ExpenseEntry.fields.status
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          This dual-variant sits on the MONEY domain (Invoice cost accounting over a Case's
          sessions/expenses/searches): PROVISIONAL bills SUBMITTED+APPROVED expenses while FINAL
          bills APPROVED only, so identical Case data yields total_cents 38124 (PROVISIONAL) vs
          32724 (FINAL) — a 5400-cent line delta amplified to 5400 by the subtotal-keyed admin fee.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one Client, one CA-licensed JUNIOR investigator (rate 8333), one ACTIVE CA case with a 500000-cent retainer."
            - "Two COMPLETED 90-minute day sessions (each session_charge_cents 12500 → labor 25000)."
            - "One APPROVED expense of 4000 cents and one still-SUBMITTED expense of 5000 cents."
            - "One COMPLETED TLO skip-trace search with hit_count 10 → cost_cents 1300."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test", adverse_party_names: ["Victor Adverse"] }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic1_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject", confidentiality_level: "STANDARD" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
              captures: { a1_id: $.data.id }
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T11:00:00Z", end_at: "2026-06-02T12:30:00Z", location: "Post B" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /surveillance-sessions/${s2_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions/${s2_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "EQUIPMENT", amount_cents: 4000, incurred_at: "2026-06-02T13:00:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /expense-entries/${e1_id}/decision"
              payload: { decision: "APPROVE" }
              as: CaseManager
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "TRAVEL", amount_cents: 5000, incurred_at: "2026-06-02T14:00:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /skip-trace-searches"
              payload: { case_id: "${case_id}", database_code: "TLO", permissible_purpose_code: "LITIGATION", subject_identifier: "Sam Subject" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /skip-trace-searches/${q1_id}/execute"
              payload: { outcome: "COMPLETED", hit_count: 10 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CaseManager
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /invoices"
              payload: { case_id: "${case_id}", variant: "PROVISIONAL", expected_case_version: "${case_v1}" }
              as: CaseManager
              captures: { prov_id: $.data.id, prov_total: $.data.total_cents, prov_expense: $.data.expense_cents }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CaseManager
              captures: { case_v2: $.data.version }
            - call: "POST /invoices"
              payload: { case_id: "${case_id}", variant: "FINAL", expected_case_version: "${case_v2}" }
              as: CaseManager
              captures: { final_id: $.data.id, final_total: $.data.total_cents }
          assert:
            - "Invoice.${prov_id}.labor_cents == 25000"
            - "Invoice.${prov_id}.expense_cents == 9000"
            - "Invoice.${prov_id}.database_cents == 1300"
            - "Invoice.${prov_id}.subtotal_cents == 35300"
            - "Invoice.${prov_id}.admin_fee_cents == 2824"
            - "Invoice.${prov_id}.total_cents == 38124"
            - "Invoice.${final_id}.expense_cents == 4000"
            - "Invoice.${final_id}.subtotal_cents == 30300"
            - "Invoice.${final_id}.admin_fee_cents == 2424"
            - "Invoice.${final_id}.total_cents == 32724"
            - "Invoice.${prov_id}.status == VOID"
            - "ExpenseEntry.${e2_id}.status == SUBMITTED"

      - name: redaction_score_author_self_vs_compliance
        grounds:
          - calculations.redaction_score
          - entities.InvestigationReport.fields.author_redaction_score
          - entities.InvestigationReport.fields.compliance_redaction_score
          - state_machines.InvestigationReport.DRAFT_to_PEER_REVIEW
          - state_machines.InvestigationReport.REDACTION_REVIEW_to_REVISION_REQUESTED
        distinguishing_aspect: |
          This dual-variant sits on the COMPLIANCE/RISK domain (InvestigationReport redaction exposure),
          not on money: over the identical three cited evidence items the AUTHOR_SELF mean returns 17
          while the COMPLIANCE worst-case-plus-penalty returns 50, and only the COMPLIANCE value gates
          approval against the case's confidentiality threshold.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer; investigator INV1 (LEAD, author) and INV2 (SUPPORT, peer reviewer) both assigned and CA-licensed."
            - "One COMPLETED session carrying three evidence items: VIDEO (unredacted), DOC (redacted by compliance), PHOTO (unredacted)."
            - "A DRAFT report citing all three items in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Nate Ortiz", seniority: "SENIOR", hourly_rate_cents: 12000 }
              as: PlatformAdmin
              captures: { inv2_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject", confidentiality_level: "STANDARD" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv2_id}", role_on_case: "SUPPORT" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /evidence"
              payload: { case_id: "${case_id}", session_id: "${s1_id}", kind: "VIDEO", hash_sha256: "aaa111", captured_at: "2026-06-02T09:10:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { ev_video: $.data.id }
            - call: "POST /evidence"
              payload: { case_id: "${case_id}", session_id: "${s1_id}", kind: "DOC", hash_sha256: "bbb222", captured_at: "2026-06-02T09:20:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { ev_doc: $.data.id }
            - call: "POST /evidence"
              payload: { case_id: "${case_id}", session_id: "${s1_id}", kind: "PHOTO", hash_sha256: "ccc333", captured_at: "2026-06-02T09:30:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { ev_photo: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /evidence/${ev_doc}/redact"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CaseManager
              captures: { case_v1: $.data.version }
            - call: "POST /reports"
              payload: { case_id: "${case_id}", title: "Interim findings", evidence_ids: ["${ev_video}", "${ev_doc}", "${ev_photo}"], expected_case_version: "${case_v1}" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /reports/${rep_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { author_score: $.data.author_redaction_score }
            - call: "POST /reports/${rep_id}/peer-review"
              payload: { decision: "APPROVE" }
              as: Investigator
              as_user_id: "${inv2_id}"
            - call: "POST /reports/${rep_id}/redaction-review"
              payload: { decision: "REQUEST_REVISION", note: "PHOTO and VIDEO still exposed" }
              as: ComplianceOfficer
              captures: { compliance_score: $.data.compliance_redaction_score }
          assert:
            - "InvestigationReport.${rep_id}.author_redaction_score == 17"
            - "InvestigationReport.${rep_id}.compliance_redaction_score == 50"
            - "InvestigationReport.${rep_id}.status == REVISION_REQUESTED"
            - "InvestigationReport.${rep_id}.reviewer_investigator_id == ${inv2_id}"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: session_charge_night_weight_clamp_and_mileage
        grounds:
          - calculations.session_charge
          - entities.SurveillanceSession.fields.billable_minutes
          - entities.SurveillanceSession.fields.session_charge_cents
          - state_machines.SurveillanceSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (a): four interacting inputs (raw interval, night-window intersection, per-investigator
          hourly rate, mileage) combine non-linearly through a ceil'd 1.5x night weighting nested inside
          a min/max clamp — a 240-minute interval spanning 21:00-01:00 UTC bills 330 minutes, not 240,
          and the charge is 46670 cents, not the 33332 cents a flat-rate reading yields.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; ACTIVE CA case with a 500000-cent retainer."
            - "JUNIOR investigator with hourly_rate_cents 8333, CA-licensed and assigned as LEAD."
            - "One IN_PROGRESS session spanning 2026-06-02T21:00:00Z to 2026-06-03T01:00:00Z (180 night minutes, 60 day minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T21:00:00Z", end_at: "2026-06-03T01:00:00Z", location: "Night post" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
          trigger:
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 12.5 }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_minutes: $.data.billable_minutes, s1_charge: $.data.session_charge_cents }
          assert:
            - "SurveillanceSession.${s1_id}.billable_minutes == 330"
            - "SurveillanceSession.${s1_id}.session_charge_cents == 46670"
            - "SurveillanceSession.${s1_id}.status == COMPLETED"
            - "Case.${case_id}.billable_minutes_total == 330"

      - name: invoice_per_line_rounding_order_pinned
        grounds:
          - calculations.invoice_totals
          - calculations.session_charge
          - entities.Invoice.fields.labor_cents
          - entities.Invoice.fields.admin_fee_cents
        distinguishing_aspect: |
          Mode (b): rounding ORDER is the whole test. Two 90-minute sessions at 8333 cents/hour each
          produce exactly 12499.5 raw cents; rounding per session line then summing gives labor_cents
          25000 and total_cents 27000, while summing then rounding (24999.0 -> 24999) gives 26999 —
          the scaffold pins per-line rounding, so the correct answers are 25000 / 27000.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer, JUNIOR investigator at 8333 cents/hour assigned as LEAD."
            - "Two COMPLETED, non-overlapping 90-minute daytime sessions (09:00-10:30 and 11:00-12:30 UTC), zero mileage."
            - "No expenses, no skip-trace searches."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_charge: $.data.session_charge_cents }
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T11:00:00Z", end_at: "2026-06-02T12:30:00Z", location: "Post B" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /surveillance-sessions/${s2_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions/${s2_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CaseManager
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /invoices"
              payload: { case_id: "${case_id}", variant: "FINAL", expected_case_version: "${case_v1}" }
              as: CaseManager
              captures: { inv_id: $.data.id, inv_labor: $.data.labor_cents, inv_total: $.data.total_cents }
          assert:
            - "SurveillanceSession.${s1_id}.session_charge_cents == 12500"
            - "SurveillanceSession.${s2_id}.session_charge_cents == 12500"
            - "Invoice.${inv_id}.labor_cents == 25000"
            - "Invoice.${inv_id}.subtotal_cents == 25000"
            - "Invoice.${inv_id}.admin_fee_cents == 2000"
            - "Invoice.${inv_id}.total_cents == 27000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: case_active_suspended_active_retainer_cycle
        grounds:
          - state_machines.Case.ACTIVE_to_SUSPENDED
          - state_machines.Case.SUSPENDED_to_ACTIVE
          - calculations.retainer_balance
          - entities.Case.fields.status
        distinguishing_aspect: |
          CYCLE on the Case entity: ACTIVE -> SUSPENDED -> ACTIVE, both edges fired by the retainer
          posture recompute rather than by a client call — a DRAW pushes the balance under 25% of
          total_deposit_cents and a later DEPOSIT lifts it back over the (raised) low-water mark.
        test_recipe:
          setup:
            - "ACTIVE CA case whose only deposit is 100000 cents (low-water 25000)."
            - "LEAD-assigned CA-licensed investigator; one SUBMITTED expense of 80000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 100000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "EQUIPMENT", amount_cents: 80000, incurred_at: "2026-06-02T09:00:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /expense-entries/${e1_id}/decision"
              payload: { decision: "APPROVE" }
              as: CaseManager
            - call: "GET /cases/${case_id}"
