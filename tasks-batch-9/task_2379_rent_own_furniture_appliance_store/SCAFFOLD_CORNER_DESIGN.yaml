      - name: swap_side_effects_fire_in_their_declared_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceTicket.SCHEDULED_to_SWAP_ISSUED
          - entities.Store.fields.service_intake_open
        excluded_because:
          difficulty_instance: transitive_cascade / swap_cascade_closes_store_intake_so_next_ticket_is_rejected
          rationale: "That instance replays the entire swap side-effect list hop by hop (agreement -> SERVICE_SWAP_PENDING, old unit -> IN_SERVICE, replacement -> ON_RENT, units_in_service_count 1, service_intake_open false) and then observes the closure downstream."

      - name: payment_against_a_defaulted_agreement_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Agreement.payment_status.DEFAULTED
          - validations[priority=12].ERR_AGREEMENT_DEFAULTED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / defaulted_state_409_outranks_overpayment_fiscal_422
          rationale: "That instance posts a payment to a DEFAULTED agreement and asserts the 409 ERR_AGREEMENT_DEFAULTED, which is exactly the invalid-from rejection for the payment dimension."

      - name: payment_reversal_undoes_every_allocation_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Agreement.payment_status.CURRENT_to_DELINQUENT_via_reversal
          - endpoints[POST /renewal-payments/{id}/reverse]
        excluded_because:
          difficulty_instance: compensating_invariant / cash_conserved_when_a_payment_that_consumed_carried_credit_is_reversed
          rationale: "That instance replays the reversal against every bucket the forward posting touched (including restoring partial_credit_cents from partial_credit_before_cents) and asserts the conserved cash identity, so no drift remains to test separately."

  # ===========================================================================
  # 3. Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: verification_score_counts_only_verified_references_and_caps_at_three
        claim_type: input_set_filtering
        grounds:
          - calculations.customer_verification_score.input_set
          - calculations.customer_verification_score.constants.REFERENCE_POINTS_CAP
          - validations[priority=32].ERR_VERIFICATION_SCORE_TOO_LOW
          - state_machines.Customer.REJECTED_to_VERIFIED
        distinguishing_aspect: |
          Only check_status == VERIFIED references feed the score, and their
          contribution is capped at three. An applicant with employer_verified
          false, 24 residence months, 300000 income and three references of
          which one is UNREACHABLE scores 0+20+20+20 = 60 and cannot be
          approved; two more VERIFIED references (four in total) raise it to
          exactly 0+20+30+20 = 70 rather than 80, because the fourth reference is
          filtered out by the cap, not by its status.
        test_recipe:
          setup:
            - "one TX StateRtoRule (credit_inquiry_prohibited true)"
            - "one PENDING customer with employer_verified false, residence_months 24, monthly_income_cents 300000, government_id_verified true"
            - "three references: two checked VERIFIED and one checked UNREACHABLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ivy Chen", email: "ivy@example.com", phone: "+15125550111", state_code: "TX", employer_name: "Barton Springs Cafe", employer_verified: false, monthly_income_cents: 300000, residence_months: 24, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550112" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550113" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Cal Diaz", relationship: "FRIEND", phone: "+15125550114" }
              as: SalesAssociate
              captures: { ref3_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref3_id}/check"
              payload: { result: "UNREACHABLE" }
              as: SalesAssociate
          trigger:
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Nina Park", relationship: "COWORKER", phone: "+15125550115" }
              as: SalesAssociate
              captures: { ref4_id: $.data.id }
            - call: "POST /customer-references/${ref4_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Omar Vale", relationship: "FRIEND", phone: "+15125550116" }
              as: SalesAssociate
              captures: { ref5_id: $.data.id }
            - call: "POST /customer-references/${ref5_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
          assert:
            - "the first APPROVE returns 422 ERR_VERIFICATION_SCORE_TOO_LOW and Customer.${cust_id}.verification_status is still PENDING with verified_by_user_id == \"\""
            - "the REJECT returns 200 with verification_status == REJECTED and verification_score == 60 (0 employer + 20 residence + 20 for the two VERIFIED references + 20 income; the UNREACHABLE reference contributes nothing even though three reference rows exist)"
            - "Customer.${cust_id}.verified_reference_count == 2 at that point, then 4 after the two extra VERIFIED checks"
            - "the second APPROVE returns 200 with verification_status == VERIFIED, verified_by_user_id == u_officer_1 and verification_score == 70 — the reference term is capped at 30 for three or more, so the fourth VERIFIED reference adds nothing and the score is not 80"
            - "GET /customers/${cust_id}/references reports total_count == 5 with exactly one check_status == UNREACHABLE"

      - name: unrentable_grade_short_circuits_the_residual_to_a_write_off
        claim_type: threshold
        grounds:
          - calculations.unit_residual_value.variants[FINAL_AT_GRADING]
          - calculations.depreciation_tier
          - calculations.re_rent_rate
          - state_machines.InventoryUnit.RETURNED_PENDING_GRADE_to_RETIRED
        distinguishing_aspect: |
          An UNRENTABLE assessed_grade bypasses the decay formula entirely: the
          FINAL residual is 0 (not 96900 - deductions), which lands on the
          `final_residual_value_cents == 0` band ahead of the 0.80/0.60 ratio
          bands and yields WRITE_OFF plus a re_rent_rate of 0 with no division
          by a zero-or-negative residual. The unit is RETIRED with
          retired_reason UNRENTABLE_ON_GRADING and, unlike a GRADE_A/B/C
          grading, its condition_grade is NOT stepped and rent_cycle_count is
          NOT incremented.
        test_recipe:
          setup:
            - "one TX StateRtoRule"
            - "one DELIVERED TX agreement, WEEKLY x 52 on a NEW FURNITURE unit of cash_price_cents 120000"
            - "the unit voluntarily returned, so it sits RETURNED_PENDING_GRADE with a PROVISIONAL residual of 96900 and a PENDING ReturnInspection"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_tx_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_tx_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /agreements/${agr_id}/return"
              payload: { return_reason: "VOLUNTARY_RETURN" }
              as: SalesAssociate
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /return-inspections/${insp_id}/grade"
              payload: { assessed_grade: "UNRENTABLE", damage_deduction_cents: 40000, missing_parts_count: 2 }
              as: ServiceTechnician
              as_user_id: "u_tech_1"
