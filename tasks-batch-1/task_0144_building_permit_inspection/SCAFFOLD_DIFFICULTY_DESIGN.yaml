            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
            - call: "POST /inspection-slots"
              payload: { inspector_id: "${insp_id}", window_start: "2026-07-01T08:00:00Z", window_end: "2026-07-01T17:00:00Z", max_inspections: 5 }
              as: BuildingOfficial
              captures: { slot_id: $.data.id }
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
