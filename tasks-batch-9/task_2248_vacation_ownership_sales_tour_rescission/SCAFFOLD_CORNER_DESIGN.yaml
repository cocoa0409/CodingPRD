      - name: cascading_side_effects_five_links_deep
        excluded_because:
          difficulty_instance: rescission_validation_cascades_to_retraining_and_gallery_restriction
          rationale: "That 1.8 instance already verifies a five-link cascade end to end with an explicit per-link assertion, which is exactly this layer's claim."

      - name: dual_variant_calculation_delta
        excluded_because:
          difficulty_instance: refund_settlement_policy_variant_divergence_fl_vs_tx
          rationale: "That 1.8 instance already runs both refund-policy variants on identical inputs and asserts the cent-level delta between STATUTORY_FULL and CONTRACTUAL_NET_OF_GIFT."

      - name: rate_threshold_trigger_at_the_boundary
        excluded_because:
          difficulty_instance: channel_no_show_suspension_cascades_to_bulk_cancellation_and_slot_ledger
          rationale: "That 1.8 instance already crosses NO_SHOW_SUSPEND_THRESHOLD 0.5 at the NO_SHOW_MIN_SAMPLE 4 boundary and asserts the suspension it triggers."

      - name: derived_field_reconciliation_after_source_removal
        excluded_because:
          difficulty_instance: gallery_slot_ledger_conserved_across_booking_and_cancel
          rationale: "That 1.8 instance already reconciles booked_slot_count after create, cancel and re-create against the occupying-status row count."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: derived_and_cascaded_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /tour-bookings/{id}/check-in]
          - calculations.gift_liability_ledger
        distinguishing_aspect: "Nothing lags: the check-in response body itself already carries the rotation-assigned assigned_rep_id and the copied gift_value_cents 12500, and the very next reads -- with no intervening write and no clock advance -- show the representative ON_TOUR, the gallery counters recomputed and the channel's gift_liability_cents at 12500."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z, advanced to 2026-08-14T07:00:00Z."
            - "One gallery with one ACTIVE representative and one SCHEDULED booking on a channel whose incentive_gift_value_cents is 12500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-bookings/${b1}/check-in"
              payload: { issue_incentive_gift: true }
              as: GalleryManager
              captures: { rep1: $.data.assigned_rep_id }
            - call: "GET /sales-representatives/${r1}"
              payload: {}
              as: GalleryManager
            - call: "GET /sales-galleries/${g1}"
              payload: {}
              as: GalleryManager
            - call: "GET /tour-channels/${ch1}/no-show-summary"
              payload: {}
              as: MarketingManager
          assert:
            - "trigger 1's own response body carries status == CHECKED_IN, checked_in_at == 2026-08-14T07:00:00.000Z, assigned_rep_id == ${r1}, gift_issued == true and gift_value_cents == 12500"
            - "trigger 2 returns SalesRepresentative.${r1}.status == ON_TOUR and last_assigned_at == 2026-08-14T07:00:00.000Z"
            - "trigger 3 returns SalesGallery.${g1}.booked_slot_count == 1 and available_rep_count == 1"
            - "trigger 4 returns gift_liability_cents == 12500 and booked_count == 1 with no re-read delay"
            - "no assertion in this recipe requires a second read of the same resource to converge"
