  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_window_half_open_overlap
        grounds:
          - validations[priority=10]
          - state_machines.LocationPermit.REQUESTED_to_APPROVED
          - entities.LocationPermit.fields.window_start
          - entities.LocationPermit.fields.window_end
        distinguishing_aspect: >
          Half-open interval semantics on the Location resource: a permit
          [10:00,14:00) overlaps an APPROVED [12:00,16:00) and is rejected, but a
          back-to-back [16:00,18:00) touching the prior end is allowed (end is exclusive).
        test_recipe:
          setup:
            - "A production with a location holding one APPROVED permit over [2026-08-01T12:00Z, 2026-08-01T16:00Z)."
            - "A second REQUESTED permit on the same location over [2026-08-01T10:00Z, 2026-08-01T14:00Z)."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature LP", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /locations"
              payload: { production_id: "${prod_id}", name: "Rooftop", address: "1 Main St" }
              as: LineProducer
              captures: { loc_id: $.data.id }
            - call: "POST /location-permits"
              payload: { location_id: "${loc_id}", permit_number: "P-1", window_start: "2026-08-01T12:00:00.000Z", window_end: "2026-08-01T16:00:00.000Z" }
              as: LineProducer
              captures: { p1_id: $.data.id }
            - call: "POST /location-permits/${p1_id}/approve"
              payload: {}
              as: LineProducer
            - call: "POST /location-permits"
              payload: { location_id: "${loc_id}", permit_number: "P-2", window_start: "2026-08-01T10:00:00.000Z", window_end: "2026-08-01T14:00:00.000Z" }
              as: LineProducer
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /location-permits/${p2_id}/approve"
              payload: {}
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_PERMIT_WINDOW_CONFLICT"
            - "LocationPermit.${p2_id}.status == REQUESTED"

      - name: crew_time_conflict_closed_interval_touching
        grounds:
          - validations[priority=11]
          - state_machines.Assignment.CHECKED_IN_to_WRAPPED
          - entities.Assignment.fields.call_time
          - entities.Assignment.fields.wrap_time
        distinguishing_aspect: >
          Closed-interval semantics on the CrewMember resource (different interval
          arithmetic and entity than the permit half-open rule): two of the same
          crew member's wrapped occupations sharing a touching endpoint
          (first ends 18:00, second starts 18:00) DO conflict and the second
          check-out is rejected.
        test_recipe:
          setup:
            - "ACTIVE production; same SAG crew booked on two IN_PROGRESS days; first wrapped [06:00,18:00], second booked at call 18:00 on the same calendar timeline and checked out at 22:00."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature CT", production_type: "FEATURE", total_budget_cents: 2000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 1000000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-08-05", day_number: 1 }
              as: FirstAD
              captures: { day1_id: $.data.id, day1_v: $.data.version }
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-08-05", day_number: 2, unit: "SECOND" }
              as: FirstAD
              captures: { day2_id: $.data.id, day2_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day1_id}", crew_member_id: "${crew_id}", call_time: "2026-08-05T06:00:00.000Z", expected_shooting_day_version: "${day1_v}" }
              as: FirstAD
              captures: { asg1_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day1_id}", general_call_time: "2026-08-05T06:00:00.000Z" }
              as: FirstAD
              captures: { cs1_id: $.data.id }
            - call: "POST /call-sheets/${cs1_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day1_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg1_id}/check-in"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg1_id}/check-out"
              payload: { wrap_time: "2026-08-05T18:00:00.000Z", meal_breaks_taken: 2 }
              as: FirstAD
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day2_id}", crew_member_id: "${crew_id}", call_time: "2026-08-05T18:00:00.000Z", expected_shooting_day_version: "${day2_v}" }
              as: FirstAD
              captures: { asg2_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day2_id}", general_call_time: "2026-08-05T18:00:00.000Z" }
              as: FirstAD
              captures: { cs2_id: $.data.id }
            - call: "POST /call-sheets/${cs2_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day2_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg2_id}/check-in"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /assignments/${asg2_id}/check-out"
              payload: { wrap_time: "2026-08-05T22:00:00.000Z", meal_breaks_taken: 2 }
              as: FirstAD
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_CREW_TIME_CONFLICT"
            - "Assignment.${asg2_id}.attendance_status == CHECKED_IN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: committed_cost_conserved_under_book_then_cancel
        grounds:
          - state_machines.Assignment.SCHEDULED_to_NO_SHOW
          - state_machines.ShootingDay.CALLED_to_CANCELLED
          - entities.Production.fields.committed_cost_cents
          - entities.Assignment.fields.estimated_cost_cents
        distinguishing_aspect: >
          Conserved quantity = Production.committed_cost_cents. Forward (book
          assignment) adds estimated 251000 to committed; the compensating action
          (cancel the day -> assignment VOID) must remove exactly 251000, leaving
          committed_cost_cents back at 0 with no drift.
        test_recipe:
          setup:
            - "ACTIVE production, SAG fringe, committed_cost_cents == 0 before booking."
            - "Book one SAG crew (estimated 251000) onto a CALLED day, then cancel the day."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature INV1", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "SAG_AFTRA", fringe_rate_bps: 1800, pension_health_flat_cents: 15000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 200000, is_sag_aftra: true, union_code: "SAG_AFTRA" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-08-10", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-08-10T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-08-10T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /shooting-days/${day_id}/cancel"
              payload: {}
              as: FirstAD
          assert:
            - "Assignment.${asg_id}.estimated_cost_cents == 251000"
            - "Assignment.${asg_id}.payment_status == VOID"
            - "Production.${prod_id}.committed_cost_cents == 0"

      - name: page_eighths_conserved_under_schedule_then_cancel
        grounds:
          - state_machines.ShootingDay.PLANNED_to_CANCELLED
          - entities.ShootingDay.fields.estimated_page_eighths
          - entities.Scene.fields.shooting_day_id
          - entities.Scene.fields.page_eighths
        distinguishing_aspect: >
          A different conserved quantity (page-eighths, not money):
          ShootingDay.estimated_page_eighths goes 0 -> 8 when a scene is scheduled
          (forward), and the compensating cancel resets the scene's shooting_day_id
          to null so the day's estimated_page_eighths returns to 0 while the scene's
          own page_eighths (8) is unchanged.
        test_recipe:
          setup:
            - "ACTIVE production with one PLANNED day and one 8-eighths scene scheduled onto it."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature INV2", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-08-12", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /scenes"
              payload: { production_id: "${prod_id}", scene_number: "12A", page_eighths: 8, int_ext: "EXT", day_night: "NIGHT" }
              as: FirstAD
              captures: { scene_id: $.data.id }
            - call: "POST /scenes/${scene_id}/schedule"
              payload: { shooting_day_id: "${day_id}" }
              as: FirstAD
          trigger:
            - call: "POST /shooting-days/${day_id}/cancel"
              payload: {}
              as: FirstAD
          assert:
            - "ShootingDay.${day_id}.estimated_page_eighths == 0"
            - "Scene.${scene_id}.shooting_day_id == null"
            - "Scene.${scene_id}.page_eighths == 8"
