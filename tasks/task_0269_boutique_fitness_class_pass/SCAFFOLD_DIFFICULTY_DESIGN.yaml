  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_cross_studio_travel_buffer
        grounds:
          - calculations.instructor_double_book_window
          - validations[priority=12]
          - errors[ERR_INSTRUCTOR_CONFLICT]
        distinguishing_aspect: |
          Instructor resource with TRAVEL-BUFFER interval semantics: two sessions of the
          same instructor at DIFFERENT studios must be separated by >= 30 min. A 60-min
          session ending 11:00 at studio X and a session starting 11:20 at studio Y
          (gap 20 < 30) conflicts even though the time intervals do not overlap.
        test_recipe:
          setup:
            - "Instructor ina with a published 10:00-11:00 session at studio X; a second session at studio Y starting 11:20 same day."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Studio X", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_x: $.data.id }
            - call: "POST /studios"
              payload: { name: "Studio Y", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_y: $.data.id }
            - call: "POST /studios/${studio_x}/rooms"
              payload: { name: "X Room", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_x: $.data.id }
            - call: "POST /studios/${studio_y}/rooms"
              payload: { name: "Y Room", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_y: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_x}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow60", duration_min: 60, credit_cost: 5 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /sessions"
              payload: { studio_id: "${studio_x}", room_id: "${room_x}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { studio_id: "${studio_y}", room_id: "${room_y}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T11:20:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSTRUCTOR_CONFLICT (cross-studio gap 20min < 30min travel buffer)"

      - name: room_cleaning_buffer_padded_overlap
        grounds:
          - calculations.room_overlap_window
          - validations[priority=13]
          - errors[ERR_ROOM_CONFLICT]
        distinguishing_aspect: |
          Room resource with CLEANING-BUFFER interval semantics (different arithmetic
          and different resource than the instructor rule): a 10:00-11:00 session pads
          to 11:15; a second session in the SAME room starting 11:10 collides with the
          padded interval and is rejected, whereas the raw 60-min intervals do not
          overlap.
        test_recipe:
          setup:
            - "Room R has a 10:00-11:00 session; a second session in the same room starts 11:10 (within the 15-min cleaning pad)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Studio X", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_x: $.data.id }
            - call: "POST /studios/${studio_x}/rooms"
              payload: { name: "R", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_r: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_x}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ino", home_studio_id: "${studio_x}" }
              as: NetworkAdmin
              captures: { inst_b: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow60", duration_min: 60, credit_cost: 5 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /sessions"
              payload: { studio_id: "${studio_x}", room_id: "${room_r}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { studio_id: "${studio_x}", room_id: "${room_r}", instructor_id: "${inst_b}", template_id: "${tmpl_id}", starts_at: "2026-06-20T11:10:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_CONFLICT (11:10 < 11:00 + 15min cleaning pad = 11:15)"

