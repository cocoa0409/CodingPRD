        distinguishing_aspect: "Priority 1 fires before everything else: a POST /customers with no X-User-Role and no X-User-ID returns ERR_UNAUTHENTICATED (401) even though the body is perfectly valid."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with BOTH X-User-Role and X-User-ID omitted"
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "GET /customers (with valid headers) returns an empty array with total_count 0"

      - name: request_with_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]", "roles"]
        distinguishing_aspect: "A role string outside the seven declared roles is an authentication failure (401 ERR_UNAUTHENTICATED at priority 2), NOT an authorization failure (403 ERR_FORBIDDEN_ROLE at priority 3)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with X-User-Role: CraneWhisperer and a non-empty X-User-ID"
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err} != ERR_FORBIDDEN_ROLE"

