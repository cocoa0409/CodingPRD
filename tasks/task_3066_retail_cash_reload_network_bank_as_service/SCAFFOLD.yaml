# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7
# Retail Cash Reload Network & Bank-as-a-Service Program Management
# =============================================================================

scenario: |
  Retail Cash Reload Network & Bank-as-a-Service Program Management (Green Dot): reload location network with retailer agreements, fee splits and per-transaction limits, cash acceptance at the register credited to a prepaid or partner account with real-time funding, anti-money-laundering monitoring on cash loads with velocity and structuring detection, program manager services for third-party brands including card issuance, ledgering and compliance oversight, bank sponsorship obligations and regulator expectations on oversight of program partners, dispute and error resolution across programs with differing cardholder agreements, load reversal and fraud loss allocation between retailer, program and bank, retailer settlement and float management

domain_name: retail-cash-reload-network
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga
  entity_count: 12
  state_machine_count: 11
  calculation_count: 11
  validation_count: 30
  endpoint_count: 66
  error_code_count: 34
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: BankSponsor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Chartered bank legal name" }
      - { name: charter_state_code, type: string, source: input, description: "Two-letter charter state" }
      - { name: sponsorship_capacity_programs, type: integer, source: input, description: "Maximum number of sponsored programs the bank may carry", constraints: ">= 1" }
      - { name: oversight_tier, type: enum, source: input, description: "TIER_1 | TIER_2", default: "TIER_2" }
      - { name: regulator_exam_due_at, type: datetime, source: input, description: "Next regulator examination date" }
      - { name: active_program_count, type: integer, source: computed, description: "Count of sponsored Programs whose compliance_posture != FROZEN is not applied; counts every Program with sponsor_bank_id == this.id" }
      - { name: oversight_reviews_completed, type: integer, source: computed, description: "Count of POST /programs/{id}/oversight-review completions against this sponsor" }
      - { name: is_capacity_exhausted, type: boolean, source: computed, description: "True when active_program_count >= sponsorship_capacity_programs" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: sponsor_bank_id, type: string, source: input, description: "FK -> BankSponsor.id; sponsoring bank of record" }
      - { name: program_type, type: enum, source: input, description: "BAAS_PROGRAM_MANAGER | OWN_BANK_PROGRAM" }
      - { name: settlement_cycle, type: enum, source: input, description: "DAILY | WEEKLY", default: "DAILY" }
      - { name: oversight_review_due_at, type: datetime, source: input, description: "Regulator oversight review deadline" }
      - { name: compliance_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN; posture gates every child write" }
      - { name: open_aml_alert_count, type: integer, source: computed, description: "Count of AmlAlert with alert_status in {OPEN, UNDER_REVIEW} for this program" }
      - { name: posture_breach_count, type: integer, source: computed, description: "Count of CONFIRMED AmlAlert plus BrandPartner rows with partner_status == SUSPENDED and suspension_source == COMPLIANCE for this program (POSTURE-suspended brands are excluded so a posture cascade never sustains itself)" }
      - { name: posture_score, type: number, source: computed, description: "Weighted posture score, 2 dp half-up, capped at 100.00" }
      - { name: is_oversight_overdue, type: boolean, source: computed, description: "True when current logical clock > oversight_review_due_at" }
      - { name: last_posture_review_at, type: datetime, source: system, description: "Clock value at last posture-producing transition" }
      - { name: suspended_brand_count, type: integer, source: computed, description: "Count of BrandPartner rows with partner_status == SUSPENDED" }
      - { name: allocated_loss_total_cents, type: integer, source: computed, description: "Sum of total_loss_cents over LossAllocation rows with allocation_status IN {POSTED, RECOVERED}" }
      - { name: unallocated_confirmed_loss_cents, type: integer, source: computed, description: "Sum of principal_cents over LoadTransaction rows reversed with reversal_reason == AML_CONFIRMED that no LossAllocation with allocation_status IN {POSTED, RECOVERED} references" }

  - name: BrandPartner
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: brand_name, type: string, source: input, description: "Third-party brand name" }
      - { name: services_scope, type: array, source: input, description: "Subset of [CARD_ISSUANCE, LEDGERING, COMPLIANCE_OVERSIGHT, DISPUTE_HANDLING]" }
      - { name: card_issuance_enabled, type: boolean, source: input, description: "Brand runs its own card issuance", default: true }
      - { name: ledgering_enabled, type: boolean, source: input, description: "Program manager keeps the brand ledger" }
      - { name: compliance_oversight_enabled, type: boolean, source: input, description: "Program manager performs AML oversight for the brand" }
      - { name: partner_status, type: enum, source: computed, description: "PENDING_ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED" }
      - { name: suspension_source, type: enum, source: computed, description: "NONE | POSTURE | COMPLIANCE; distinguishes the two suspension causes so a restore only revives POSTURE-suspended brands" }
      - { name: onboarding_checklist_complete, type: boolean, source: computed, description: "True when every element of services_scope has its enabling flag true" }
      - { name: open_dispute_count, type: integer, source: computed, description: "Count of non-terminal DisputeCase whose card_account_id belongs to this brand" }

  - name: RetailerAgreement
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: retailer_name, type: string, source: input, description: "Retail chain name" }
      - { name: fee_split_retailer_pct, type: number, source: input, description: "Retailer share of convenience fee, 0 < pct < 1" }
      - { name: fee_split_program_pct, type: number, source: computed, description: "1 - fee_split_retailer_pct" }
      - { name: per_transaction_limit_cents, type: integer, source: input, description: "Maximum principal per single load", constraints: ">= 1" }
      - { name: daily_location_limit_cents, type: integer, source: input, description: "Maximum aggregate principal accepted per location per logical day" }
      - { name: settlement_period_hours, type: integer, source: input, description: "Length of a settlement period in hours", default: 24 }
      - { name: reload_enabled, type: boolean, source: input, description: "Whether reloads are contractually enabled", default: true }
      - { name: agreement_status, type: enum, source: computed, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: float_position_cents, type: integer, source: computed, description: "Retailer float currently retained by the program" }
      - { name: settled_fee_total_cents, type: integer, source: computed, description: "Cumulative per-transaction retailer fee shares already settled" }
      - { name: accrual_pending_cents, type: integer, source: computed, description: "Per-transaction retailer fee shares accrued but not yet settled" }
      - { name: contract_version_locked, type: boolean, source: computed, description: "True once the agreement has been cited by a POSTED LossAllocation" }

  - name: ReloadLocation
    parent: RetailerAgreement
    common_fields: true
    fields:
      - { name: retailer_agreement_id, type: string, source: input, description: "FK -> RetailerAgreement.id; governing agreement" }
      - { name: location_code, type: string, source: input, description: "Retailer store number", constraints: "unique within retailer_agreement_id" }
      - { name: state_code, type: string, source: input, description: "Two-letter store state" }
      - { name: register_count, type: integer, source: input, description: "Number of reload-capable registers", constraints: ">= 1" }
      - { name: location_status, type: enum, source: computed, description: "OPEN | RESTRICTED | CLOSED" }
      - { name: daily_accepted_cents, type: integer, source: computed, description: "Sum of posted_total_cents for FUNDED and SETTLED loads on the current logical day" }
      - { name: daily_txn_count, type: integer, source: computed, description: "Count of FUNDED and SETTLED loads on the current logical day" }
      - { name: aml_velocity_score, type: number, source: computed, description: "Location-level velocity score, 2 dp half-up" }
      - { name: is_velocity_breached, type: boolean, source: computed, description: "True when daily_txn_count >= VELOCITY_TXN_LIMIT or daily_accepted_cents >= VELOCITY_AMOUNT_LIMIT_CENTS" }
      - { name: last_epoch_index, type: integer, source: computed, description: "Logical-day index of the most recent reset of daily counters" }
      - { name: effective_per_transaction_limit_cents, type: integer, source: computed, description: "retailer_agreement.per_transaction_limit_cents, halved (floor) while location_status == RESTRICTED" }

  - name: CardAccount
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; issuing program" }
      - { name: brand_partner_id, type: string, source: input, description: "FK -> BrandPartner.id; brand under which the card is issued" }
      - { name: account_ref, type: string, source: input, description: "Partner-visible account reference", constraints: "unique within program_id" }
      - { name: cardholder_name, type: string, source: input, description: "Cardholder legal name" }
      - { name: cardholder_agreement_type, type: enum, source: input, description: "REG_E | VOLUNTARY | CORPORATE; drives dispute provisional credit" }
      - { name: balance_cents, type: integer, source: computed, description: "Spendable balance, never negative" }
      - { name: ledger_posted_cents, type: integer, source: computed, description: "Cumulative posted load principal accepted" }
      - { name: ledger_reversed_cents, type: integer, source: computed, description: "Cumulative reversed load principal" }
      - { name: funding_status, type: enum, source: computed, description: "UNFUNDED | FUNDED | DRAINED" }
      - { name: compliance_hold_status, type: enum, source: computed, description: "CLEAR | REVIEW | FROZEN; independent parallel dimension from funding_status" }
      - { name: window_load_count, type: integer, source: computed, description: "Count of loads in the trailing 24h window per the active velocity variant" }
      - { name: window_load_cents, type: integer, source: computed, description: "Sum of principal_cents of loads in the trailing 24h window per the active velocity variant" }
      - { name: structuring_txn_count, type: integer, source: computed, description: "Count of sub-threshold principal loads in the trailing 24h structuring window" }
      - { name: is_structuring, type: boolean, source: computed, description: "True when structuring_txn_count >= STRUCTURING_TXN_COUNT and their summed principal >= STRUCTURING_MIN_TOTAL_CENTS" }
      - { name: frozen_at, type: datetime, source: computed, description: "Clock value when compliance_hold_status last became FROZEN" }

  - name: LoadTransaction
    parent: ReloadLocation
    common_fields: true
    fields:
      - { name: reload_location_id, type: string, source: input, description: "FK -> ReloadLocation.id; register location accepting the cash" }
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; funded account" }
      - { name: settlement_batch_id, type: string, source: computed, description: "FK -> SettlementBatch.id; batch that settled this load, null until settled" }
      - { name: principal_cents, type: integer, source: input, description: "Cash principal tendered at the register", constraints: ">= 100" }
      - { name: convenience_fee_cents, type: integer, source: computed, description: "Tiered convenience fee from the principal tier table" }
      - { name: posted_total_cents, type: integer, source: computed, description: "principal_cents + convenience_fee_cents + large-load surcharge" }
      - { name: retailer_fee_share_cents, type: integer, source: computed, description: "Per-transaction rounded retailer share of convenience_fee_cents" }
      - { name: program_fee_share_cents, type: integer, source: computed, description: "convenience_fee_cents - retailer_fee_share_cents" }
      - { name: load_status, type: enum, source: computed, description: "INITIATED | FUNDED | DECLINED | SETTLED | REVERSED" }
      - { name: reversal_reason, type: enum, source: computed, description: "NONE | AML_CONFIRMED | DISPUTE_FAVOR_CARDHOLDER | RETAILER_REQUEST | STRUCTURING" }
      - { name: risk_flag, type: enum, source: computed, description: "NONE | VELOCITY | STRUCTURING" }
      - { name: funded_at, type: datetime, source: computed, description: "Clock value when load_status became FUNDED" }
      - { name: reversed_at, type: datetime, source: computed, description: "Clock value when load_status became REVERSED" }
      - { name: epoch_index, type: integer, source: system, description: "Logical-day index at creation" }

  - name: AmlAlert
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program under monitoring" }
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; account under monitoring" }
      - { name: alert_type, type: enum, source: input, description: "VELOCITY | STRUCTURING" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the monitoring window" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the monitoring window" }
      - { name: observed_txn_count, type: integer, source: computed, description: "Count of qualifying loads inside the window at raise time" }
      - { name: observed_total_cents, type: integer, source: computed, description: "Sum of principal_cents of qualifying loads inside the window at raise time" }
      - { name: structuring_hit_count, type: integer, source: computed, description: "Count of sub-threshold loads inside the window at raise time" }
      - { name: severity, type: enum, source: computed, description: "LOW | MEDIUM | HIGH" }
      - { name: alert_status, type: enum, source: computed, description: "OPEN | UNDER_REVIEW | CONFIRMED | DISMISSED" }
      - { name: raised_by_analyst_id, type: string, source: input, description: "Opaque analyst id that raised the alert" }
      - { name: assigned_analyst_id, type: string, source: computed, description: "Opaque analyst id that took the alert into review" }
      - { name: confirmed_by_analyst_id, type: string, source: computed, description: "Opaque compliance id that confirmed the alert" }
      - { name: linked_load_ids, type: array, source: computed, description: "LoadTransaction ids inside the window that carried the alert" }
      - { name: resolution_note, type: string, source: input, description: "Analyst note recorded at review time" }

  - name: DisputeCase
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; dispute program" }
      - { name: load_transaction_id, type: string, source: input, description: "FK -> LoadTransaction.id; disputed load" }
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; cardholder account" }
      - { name: cardholder_agreement_type, type: enum, source: computed, description: "Copied from CardAccount.cardholder_agreement_type at creation" }
      - { name: dispute_reason, type: enum, source: input, description: "UNAUTHORIZED_LOAD | INCORRECT_AMOUNT | GOODS_NOT_RECEIVED | ERROR_RESOLUTION" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed by the cardholder", constraints: ">= 1" }
      - { name: case_status, type: enum, source: computed, description: "OPEN | RETAILER_RESPONSE | PROGRAM_REVIEW | RESOLVED_CARDHOLDER | RESOLVED_RETAILER | ESCALATED | CLOSED" }
      - { name: response_round, type: integer, source: computed, description: "Negotiation round counter, starts at 0" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Provisional credit granted per the cardholder agreement variant" }
      - { name: final_liability_cents, type: integer, source: computed, description: "Liability pinned at resolution" }
      - { name: retailer_response_due_at, type: datetime, source: computed, description: "Clock deadline for retailer response, per agreement type window" }
      - { name: error_resolution_eligible, type: boolean, source: computed, description: "True when dispute_reason == ERROR_RESOLUTION and the load is FUNDED or SETTLED" }
      - { name: retailer_position, type: string, source: input, description: "Retailer narrative recorded at response" }
      - { name: resolution, type: string, source: input, description: "Resolution code recorded by compliance: CARDHOLDER | RETAILER | SPLIT" }

  - name: LossAllocation
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program bearing the loss" }
      - { name: load_transaction_id, type: string, source: input, description: "FK -> LoadTransaction.id; load that produced the loss" }
      - { name: retailer_agreement_id, type: string, source: input, description: "FK -> RetailerAgreement.id; retailer bearing a share" }
      - { name: dispute_case_id, type: string, source: input, description: "FK -> DisputeCase.id; originating dispute, null for AML-produced losses" }
      - { name: total_loss_cents, type: integer, source: input, description: "Total fraud or error loss to be allocated", constraints: ">= 1" }
      - { name: allocation_basis, type: enum, source: input, description: "FRAUD_LOSS | AML_CONFIRMED | DISPUTE_FAVOR_CARDHOLDER" }
      - { name: retailer_share_cents, type: integer, source: computed, description: "Retailer portion of the loss" }
      - { name: program_share_cents, type: integer, source: computed, description: "Program manager portion of the loss" }
      - { name: bank_share_cents, type: integer, source: computed, description: "Sponsor bank portion of the loss" }
      - { name: allocation_status, type: enum, source: computed, description: "DRAFT | POSTED | RECOVERED" }
      - { name: posted_at, type: datetime, source: computed, description: "Clock value when allocation_status became POSTED; null while DRAFT" }

  - name: SettlementBatch
    parent: RetailerAgreement
    common_fields: true
    fields:
      - { name: retailer_agreement_id, type: string, source: input, description: "FK -> RetailerAgreement.id; settled agreement" }
      - { name: period_start_at, type: datetime, source: input, description: "Inclusive period start" }
      - { name: period_end_at, type: datetime, source: input, description: "Exclusive period end" }
      - { name: batch_status, type: enum, source: computed, description: "SCHEDULED | OPEN | SETTLED | CLAWED_BACK" }
      - { name: gross_principal_cents, type: integer, source: computed, description: "Sum of principal_cents of loads settled into this batch" }
      - { name: accrued_retailer_share_cents, type: integer, source: computed, description: "Sum of per-transaction rounded retailer_fee_share_cents in the batch" }
      - { name: net_fee_payable_cents, type: integer, source: computed, description: "Period total convenience fee times fee_split_retailer_pct, rounded once (sum-then-round)" }
      - { name: settlement_rounding_delta_cents, type: integer, source: computed, description: "accrued_retailer_share_cents - net_fee_payable_cents" }
      - { name: chargeback_total_cents, type: integer, source: computed, description: "Sum of POSTED LossAllocation total_loss_cents charged to this agreement in the period" }
      - { name: float_retained_cents, type: integer, source: computed, description: "Float retained by the program, capped per constants" }
      - { name: settled_at, type: datetime, source: computed, description: "Clock value when batch_status became SETTLED" }

  - name: FloatWindow
    parent: ReloadLocation
    common_fields: true
    fields:
      - { name: reload_location_id, type: string, source: input, description: "FK -> ReloadLocation.id; location receiving cash" }
      - { name: window_start_at, type: datetime, source: input, description: "Closed-interval window start, inclusive" }
      - { name: window_end_at, type: datetime, source: input, description: "Closed-interval window end, inclusive" }
      - { name: armored_carrier, type: string, source: input, description: "Carrier delivering the float" }
      - { name: float_amount_cents, type: integer, source: input, description: "Cash amount delivered", constraints: ">= 1" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory clear gap required before and after this window", default: 120 }
      - { name: window_status, type: enum, source: computed, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Program
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    note: "compliance_posture is a derived posture band. It NEVER changes on its own: score drift is permitted and only constrains the next explicit transition. Every posture move is an explicit POST /programs/{id}/state carrying expected_program_version."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "to_posture == RESTRICTED"
          - "4.00 <= posture_score <= 59.99 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
          - "to_posture != compliance_posture (ERR_INVALID_STATE)"
        side_effects:
          - "[hop 1] BrandPartner rows of this program with partner_status == ACTIVE → SUSPENDED, suspension_source = POSTURE"
          - "[hop 1] ReloadLocation rows under this program's RetailerAgreement rows with location_status == OPEN → RESTRICTED; aml_velocity_score += 5.00 capped at 100.00"
          - "[hop 1] RetailerAgreement rows of this program with agreement_status == ACTIVE → SUSPENDED"
          - "compliance_posture = RESTRICTED; last_posture_review_at = current logical clock; version += 1"
      - from: OPEN
        to: FROZEN
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "to_posture == FROZEN"
          - "posture_score >= 60.00 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
        side_effects:
          - "[hop 1] BrandPartner rows of this program with partner_status IN {ACTIVE, SUSPENDED} → SUSPENDED, suspension_source = POSTURE"
          - "[hop 1] ReloadLocation rows under this program's agreements with location_status IN {OPEN, RESTRICTED} → CLOSED"
          - "[hop 2] AmlAlert rows of this program with alert_status == OPEN → UNDER_REVIEW, severity recomputed (HIGH), assigned_analyst_id left unchanged"
          - "[hop 3] CardAccount rows of this program: compliance_hold_status → FROZEN, frozen_at = current logical clock"
          - "[hop 4] LoadTransaction rows belonging to an account frozen in hop 3 with load_status == FUNDED → REVERSED, reversal_reason = AML_CONFIRMED, reversed_at = current logical clock; CardAccount.ledger_reversed_cents += principal_cents, balance_cents -= principal_cents floored at 0, funding_status recomputed"
          - "[hop 4] ReloadLocation.daily_accepted_cents -= posted_total_cents and daily_txn_count -= 1 for each load reversed in hop 4; retailer_agreement.accrual_pending_cents -= retailer_fee_share_cents and float_position_cents -= posted_total_cents"
          - "[hop 4] CardAccount.window trips and structuring_txn_count recomputed per the trailing variant; program.open_aml_alert_count and posture_score recomputed"
          - "[hop 5] LossAllocation rows with allocation_status == POSTED whose load_transaction_id is one of the loads reversed in hop 4 → RECOVERED; program.allocated_loss_total_cents unchanged"
          - "compliance_posture = FROZEN; last_posture_review_at = current logical clock; version += 1"
      - from: RESTRICTED
        to: OPEN
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "to_posture == OPEN"
          - "posture_score <= 3.99 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
        side_effects:
          - "BrandPartner rows with suspension_source == POSTURE → ACTIVE; rows with suspension_source == COMPLIANCE remain SUSPENDED"
          - "ReloadLocation rows of this program with location_status == RESTRICTED → OPEN"
          - "RetailerAgreement rows suspended by the posture cascade → ACTIVE"
          - "compliance_posture = OPEN; last_posture_review_at = current logical clock; version += 1"
        note: "Restoring OPEN never re-funds or re-instates a load; load-level compensation is a separate explicit call."
      - from: RESTRICTED
        to: FROZEN
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "posture_score >= 60.00 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
        side_effects:
          - "[hop 1] ReloadLocation rows of this program with location_status == RESTRICTED → CLOSED"
          - "[hop 2] AmlAlert rows of this program with alert_status == OPEN → UNDER_REVIEW, severity recomputed (HIGH)"
          - "[hop 3] CardAccount rows of this program: compliance_hold_status → FROZEN, frozen_at = current logical clock"
          - "[hop 4] LoadTransaction rows of accounts frozen in hop 3 with load_status == FUNDED → REVERSED, reversal_reason = AML_CONFIRMED; account ledger/balance and location/agreement counters unwound"
          - "[hop 4] account window trips, program.open_aml_alert_count and posture_score recomputed"
          - "[hop 5] POSTED LossAllocation rows covering the loads reversed in hop 4 → RECOVERED"
          - "compliance_posture = FROZEN; last_posture_review_at = current logical clock; version += 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "posture_score <= 0.00 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
        side_effects:
          - "ReloadLocation rows CLOSED by the freeze → RESTRICTED (never straight to OPEN)"
          - "CardAccount rows with compliance_hold_status == FROZEN → REVIEW (never straight to CLEAR)"
          - "compliance_posture = RESTRICTED; version += 1"
        note: "Unfreezing is not a compensating action: reversed loads remain REVERSED and previously POSTED LossAllocation rows remain RECOVERED."
      - from: FROZEN
        to: OPEN
        trigger: POST /programs/{id}/state
        actor: BankSponsor
        preconditions:
          - "posture_score <= 0.00 at request time (ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED)"
        side_effects:
          - "BrandPartner rows with suspension_source == POSTURE → ACTIVE"
          - "ReloadLocation rows CLOSED by the freeze → OPEN"
          - "CardAccount rows with compliance_hold_status == FROZEN → REVIEW (an unfrozen program still leaves every account under review)"
          - "compliance_posture = OPEN; version += 1"

  - entity: BrandPartner
    initial_state: PENDING_ONBOARDING
    terminal_states: [OFFBOARDED]
    shape: linear_with_revert
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: POST /brand-partners/{id}/state
        actor: ComplianceOfficer
        preconditions:
          - "to_status == ACTIVE"
          - "onboarding_checklist_complete == true (ERR_BRAND_ONBOARDING_INCOMPLETE)"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "partner_status = ACTIVE; version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /brand-partners/{id}/state
        actor: ComplianceOfficer
        preconditions:
          - "to_status == SUSPENDED"
          - "program.compliance_posture != FROZEN (ERR_PROGRAM_FROZEN — a FROZEN program already cascaded this suspension)"
        side_effects:
          - "[hop 1] partner_status = SUSPENDED, suspension_source = COMPLIANCE"
          - "[hop 2] CardAccount rows of this brand with compliance_hold_status == CLEAR → REVIEW"
          - "[hop 3] LoadTransaction rows of the accounts moved in hop 2 with load_status == INITIATED → DECLINED, reversal_reason = NONE (a pending load of a suspended brand can never be funded)"
          - "program.suspended_brand_count += 1 and program.posture_score recomputed (this suspension counts toward posture_breach_count because suspension_source == COMPLIANCE; it does NOT move compliance_posture on its own)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /brand-partners/{id}/state
        actor: ComplianceOfficer
        preconditions:
          - "to_status == ACTIVE"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "partner_status = ACTIVE, suspension_source = NONE"
          - "CardAccount rows of this brand with compliance_hold_status == REVIEW → CLEAR, unless a non-terminal AmlAlert references the account (those stay REVIEW)"
          - "CardAccount rows of this brand that were set FROZEN by a program freeze → REVIEW, then the same CLEAR rule above applies"
      - from: ACTIVE
        to: PENDING_ONBOARDING
        trigger: POST /brand-partners/{id}/state
        actor: ComplianceOfficer
        preconditions:
          - "to_status == PENDING_ONBOARDING"
          - "open_dispute_count == 0 (ERR_INVALID_STATE)"
        side_effects:
          - "partner_status = PENDING_ONBOARDING (revert for re-onboarding after a scope change)"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: POST /brand-partners/{id}/state
        actor: ComplianceOfficer
        preconditions:
          - "to_status == OFFBOARDED"
          - "open_dispute_count == 0 (ERR_INVALID_STATE)"
        side_effects:
          - "partner_status = OFFBOARDED; CardAccount rows of this brand with compliance_hold_status IN {CLEAR, REVIEW} → FROZEN"

  - entity: RetailerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == ACTIVE"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "agreement_status = ACTIVE; fee_split_program_pct = 1 - fee_split_retailer_pct"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == SUSPENDED"
        side_effects:
          - "agreement_status = SUSPENDED; ReloadLocation rows with location_status == OPEN → RESTRICTED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == ACTIVE"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "agreement_status = ACTIVE"
      - from: ACTIVE
        to: DRAFT
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == DRAFT"
          - "contract_version_locked == false (ERR_INVALID_STATE — an agreement cited by a POSTED or RECOVERED LossAllocation may not be renegotiated)"
        side_effects:
          - "agreement_status = DRAFT (renegotiation round: fee splits and limits may be revised while in DRAFT)"
      - from: DRAFT
        to: TERMINATED
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == TERMINATED"
        side_effects:
          - "agreement_status = TERMINATED; ReloadLocation rows of this agreement → CLOSED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /retailer-agreements/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == TERMINATED"
          - "accrual_pending_cents == 0 (ERR_INVALID_STATE — unsettled accruals must be settled first)"
        side_effects:
          - "agreement_status = TERMINATED; ReloadLocation rows of this agreement → CLOSED"

  - entity: ReloadLocation
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: POST /reload-locations/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == RESTRICTED"
        side_effects:
          - "location_status = RESTRICTED; per_transaction effective limit halved: effective_per_transaction_limit_cents = retailer_agreement.per_transaction_limit_cents / 2 rounded down"
      - from: RESTRICTED
        to: OPEN
        trigger: POST /reload-locations/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == OPEN"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "location_status = OPEN"
      - from: OPEN
        to: CLOSED
        trigger: POST /reload-locations/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == CLOSED"
          - "no LoadTransaction of this location with load_status IN {INITIATED, FUNDED} (ERR_INVALID_STATE)"
        side_effects:
          - "location_status = CLOSED; FloatWindow rows with window_status IN {REQUESTED, CONFIRMED} → CANCELLED"
      - from: RESTRICTED
        to: CLOSED
        trigger: POST /reload-locations/{id}/state
        actor: ProgramManager
        preconditions:
          - "to_status == CLOSED"
          - "no LoadTransaction of this location with load_status IN {INITIATED, FUNDED} (ERR_INVALID_STATE)"
        side_effects:
          - "location_status = CLOSED; FloatWindow rows with window_status IN {REQUESTED, CONFIRMED} → CANCELLED"

  - entity: CardAccount
    initial_state: UNFUNDED
    terminal_states: [DRAINED]
    shape: parallel
    note: "Two independent state dimensions on one row: funding_status (UNFUNDED → FUNDED → DRAINED) and compliance_hold_status (CLEAR ↔ REVIEW ↔ FROZEN). Compliance activity never changes funding_status except through the load reversal side effect, and funding activity never changes compliance_hold_status."
    transitions:
      - from: UNFUNDED
        to: FUNDED
        trigger: "system (first FUNDED LoadTransaction on this account)"
        actor: system
        preconditions: []
        side_effects:
          - "funding_status = FUNDED"
      - from: FUNDED
        to: DRAINED
        trigger: "system (funded loads reversed down to balance_cents == 0)"
        actor: system
        preconditions:
          - "balance_cents == 0 after the reversal in the same request"
        side_effects:
          - "funding_status = DRAINED; is_structuring recomputed"
      - from: DRAINED
        to: FUNDED
        trigger: "system (a subsequent successful load on a DRAINED account re-funds it)"
        actor: system
        preconditions: []
        side_effects:
          - "funding_status = FUNDED"
      - from: CLEAR
        to: REVIEW
        trigger: POST /card-accounts/{id}/hold
        actor: ComplianceAnalyst
        preconditions:
          - "to_hold_status == REVIEW"
        side_effects:
          - "compliance_hold_status = REVIEW"
        note: "Also entered by the BrandPartner SUSPENDED cascade (hop 2) and by the program FROZEN→* unfreeze."
      - from: REVIEW
        to: CLEAR
        trigger: POST /card-accounts/{id}/hold
        actor: ComplianceAnalyst
        preconditions:
          - "to_hold_status == CLEAR"
          - "no non-terminal AmlAlert references this account (ERR_AML_ALERT_PENDING)"
          - "program.compliance_posture != FROZEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "compliance_hold_status = CLEAR; frozen_at = null"
      - from: REVIEW
        to: FROZEN
        trigger: POST /card-accounts/{id}/hold
        actor: ComplianceAnalyst
        preconditions:
          - "to_hold_status == FROZEN"
        side_effects:
          - "[hop 1] compliance_hold_status = FROZEN, frozen_at = current logical clock"
          - "[hop 2] LoadTransaction rows of this account with load_status == FUNDED → REVERSED, reversal_reason = AML_CONFIRMED"
          - "[hop 3] POSTED LossAllocation rows whose load_transaction_id is a load reversed in hop 2 → RECOVERED"
      - from: CLEAR
        to: FROZEN
        trigger: POST /card-accounts/{id}/hold
        actor: ComplianceAnalyst
        preconditions:
          - "to_hold_status == FROZEN"
          - "at least one CONFIRMED AmlAlert for this account, or program.compliance_posture == FROZEN (ERR_INVALID_STATE)"
        side_effects:
          - "[hop 1] compliance_hold_status = FROZEN, frozen_at = current logical clock"
          - "[hop 2] LoadTransaction rows of this account with load_status == FUNDED → REVERSED, reversal_reason = AML_CONFIRMED"
          - "[hop 3] POSTED LossAllocation rows whose load_transaction_id is a load reversed in hop 2 → RECOVERED"
      - from: FROZEN
        to: REVIEW
        trigger: POST /card-accounts/{id}/hold
        actor: ComplianceAnalyst
        preconditions:
          - "to_hold_status == REVIEW"
        side_effects:
          - "compliance_hold_status = REVIEW (unfreezing never returns straight to CLEAR and never re-instates a reversed load)"
          - "balance_cents and funding_status recomputed from ledger_posted_cents and ledger_reversed_cents"

  - entity: LoadTransaction
    initial_state: INITIATED
    terminal_states: [DECLINED]
    shape: linear_with_revert
    transitions:
      - from: INITIATED
        to: FUNDED
        trigger: POST /load-transactions/{id}/fund
        actor: RetailerClerk
        preconditions:
          - "load_status == INITIATED (ERR_ALREADY_TERMINAL for DECLINED)"
          - "card_account.compliance_hold_status == CLEAR (ERR_ACCOUNT_FROZEN)"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
          - "the post-fund window trip is at or below VELOCITY_TXN_LIMIT and VELOCITY_AMOUNT_LIMIT_CENTS (ERR_VELOCITY_LIMIT_EXCEEDED); funding that lands exactly at the limit is permitted and raises the VELOCITY alert"
        side_effects:
          - "load_status = FUNDED, funded_at = current logical clock"
          - "card_account.balance_cents += principal_cents; ledger_posted_cents += principal_cents; funding_status = FUNDED"
          - "reload_location.daily_accepted_cents += posted_total_cents; daily_txn_count += 1; aml_velocity_score recomputed; is_velocity_breached recomputed"
          - "retailer_agreement.accrual_pending_cents += retailer_fee_share_cents; float_position_cents += posted_total_cents"
          - "card_account.window_load_count / window_load_cents / structuring_txn_count recomputed per the active velocity variant"
          - "system: an AmlAlert with alert_type VELOCITY, alert_status OPEN is created for the account when the recomputed VELOCITY trip now satisfies the predicate (idempotent — never a second OPEN VELOCITY alert for the same account); its observed counts and linked_load_ids are captured at raise time"
          - "program.open_aml_alert_count and posture_score recomputed"
      - from: INITIATED
        to: DECLINED
        trigger: POST /load-transactions/{id}/decline
        actor: RetailerClerk
        preconditions:
          - "load_status == INITIATED (ERR_ALREADY_TERMINAL otherwise)"
        side_effects:
          - "load_status = DECLINED, reversal_reason = NONE; no balance, ledger, accrual or float mutation"
      - from: FUNDED
        to: SETTLED
        trigger: POST /settlement-batches/{id}/settle
        actor: SettlementOperator
        preconditions:
          - "load_status == FUNDED"
          - "batch.batch_status == OPEN (ERR_INVALID_STATE)"
          - "load.funded_at >= batch.period_start_at and load.funded_at < batch.period_end_at"
        side_effects:
          - "load_status = SETTLED; settlement_batch_id = batch.id"
          - "batch.gross_principal_cents += principal_cents; batch.accrued_retailer_share_cents += retailer_fee_share_cents"
      - from: FUNDED
        to: REVERSED
        trigger: POST /load-transactions/{id}/reverse
        actor: ComplianceAnalyst
        preconditions:
          - "load_status == FUNDED (ERR_INVALID_STATE otherwise)"
          - "reversal_reason IN {AML_CONFIRMED, DISPUTE_FAVOR_CARDHOLDER, RETAILER_REQUEST, STRUCTURING} (ERR_INVALID_REQUEST on NONE)"
        side_effects:
          - "[hop 1] load_status = REVERSED, reversal_reason = requested reason, reversed_at = current logical clock"
          - "[hop 1] card_account.balance_cents -= principal_cents floored at 0; ledger_reversed_cents += principal_cents; funding_status recomputed (FUNDED → DRAINED when balance_cents == 0)"
          - "[hop 1] reload_location.daily_accepted_cents -= posted_total_cents; daily_txn_count -= 1; aml_velocity_score recomputed"
          - "[hop 1] retailer_agreement.accrual_pending_cents -= retailer_fee_share_cents; float_position_cents -= posted_total_cents"
          - "[hop 2] if the account's window trip no longer satisfies the STRUCTURING predicate, the account's AmlAlert rows with alert_type == STRUCTURING and alert_status == OPEN → DISMISSED"
          - "[hop 3] program.open_aml_alert_count recomputed from the dismissed alerts; program.posture_score recomputed"
      - from: SETTLED
        to: REVERSED
        trigger: POST /settlement-batches/{id}/clawback
        actor: SettlementOperator
        preconditions:
          - "batch.batch_status == SETTLED (ERR_SETTLEMENT_NOT_SETTLED otherwise)"
        side_effects:
          - "[hop 1] load_status = REVERSED, reversal_reason = RETAILER_REQUEST, reversed_at = current logical clock"
          - "[hop 1] card_account.balance_cents -= principal_cents floored at 0; ledger_reversed_cents += principal_cents"
          - "[hop 2] if the account's window trip no longer satisfies the STRUCTURING predicate, the account's OPEN STRUCTURING AmlAlert rows → DISMISSED"
          - "[hop 3] program.open_aml_alert_count recomputed; program.posture_score recomputed"
          - "[hop 1] batch.batch_status = CLAWED_BACK; retailer_agreement.float_position_cents -= float_retained_cents"
      - from: REVERSED
        to: SETTLED
        trigger: POST /load-transactions/{id}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "load_status == REVERSED (ERR_LOAD_NOT_REVERSED otherwise)"
          - "expected_load_transaction_version matches load.version (ERR_STALE_VERSION, 412)"
          - "no POSTED or RECOVERED LossAllocation references this load (ERR_INVALID_STATE — a compensated loss must be un-posted first)"
          - "card_account.compliance_hold_status != FROZEN (ERR_ACCOUNT_FROZEN)"
          - "expected_card_account_version matches card_account.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "load_status = SETTLED, settlement_batch_id = null; card_account.balance_cents += principal_cents; ledger_reversed_cents -= principal_cents; funding_status = FUNDED"
          - "program.unallocated_confirmed_loss_cents reduces by principal_cents when reversal_reason == AML_CONFIRMED"

  - entity: AmlAlert
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /aml-alerts/{id}/review
        actor: ComplianceAnalyst
        preconditions:
          - "alert_status == OPEN (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "alert_status = UNDER_REVIEW; assigned_analyst_id = X-User-ID; resolution_note recorded"
      - from: UNDER_REVIEW
        to: OPEN
        trigger: POST /aml-alerts/{id}/return
        actor: ComplianceAnalyst
        preconditions:
          - "alert_status == UNDER_REVIEW"
        side_effects:
          - "alert_status = OPEN; assigned_analyst_id = null (returned to the queue for a different analyst)"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: POST /aml-alerts/{id}/confirm
        actor: ComplianceOfficer
        preconditions:
          - "alert_status == UNDER_REVIEW"
          - "X-User-ID != raised_by_analyst_id (ERR_SEGREGATION_OF_DUTIES)"
          - "X-User-ID != assigned_analyst_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "[hop 1] alert_status = CONFIRMED, confirmed_by_analyst_id = X-User-ID"
          - "[hop 2] card_account.compliance_hold_status → FROZEN; frozen_at = current logical clock"
          - "[hop 3] LoadTransaction rows of that account with load_status == FUNDED → REVERSED, reversal_reason = AML_CONFIRMED"
          - "[hop 4] LossAllocation rows with allocation_status == POSTED whose load_transaction_id is a load reversed in hop 3 → RECOVERED, program.allocated_loss_total_cents unchanged"
          - "[hop 5] program.open_aml_alert_count -= 1 and program.posture_score recomputed; program.unallocated_confirmed_loss_cents increases by the principal of each load reversed in hop 3"
      - from: CONFIRMED
        to: UNDER_REVIEW
        trigger: POST /aml-alerts/{id}/reopen
        actor: ComplianceOfficer
        preconditions:
          - "alert_status == CONFIRMED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "alert_status = UNDER_REVIEW; confirmed_by_analyst_id = null; program.open_aml_alert_count += 1; posture_score recomputed"
        note: "Reopen is the classification-correction loop; it does not re-instate the loads the confirmation reversed."
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: POST /aml-alerts/{id}/dismiss
        actor: ComplianceOfficer
        preconditions:
          - "alert_status == UNDER_REVIEW"
        side_effects:
          - "alert_status = DISMISSED; program.open_aml_alert_count -= 1; program.posture_score recomputed"
      - from: OPEN
        to: DISMISSED
        trigger: "system (the account's window trip no longer satisfies the alert predicate)"
        actor: system
        preconditions:
          - "alert_type == STRUCTURING and card_account.is_structuring == false, or alert_type == VELOCITY and card_account.window trip below the velocity limits"
        side_effects:
          - "alert_status = DISMISSED; program.open_aml_alert_count -= 1; program.posture_score recomputed"

  - entity: DisputeCase
    initial_state: OPEN
    terminal_states: [RESOLVED_CARDHOLDER, RESOLVED_RETAILER, CLOSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: RETAILER_RESPONSE
        trigger: POST /disputes/{id}/retailer-response
        actor: RetailerClerk
        preconditions:
          - "case_status == OPEN (ERR_INVALID_STATE otherwise)"
          - "current logical clock <= retailer_response_due_at (ERR_DISPUTE_RESPONSE_WINDOW_CLOSED)"
          - "the acting retailer is party to the load's agreement (ERR_RETAILER_NOT_PARTY)"
        side_effects:
          - "case_status = RETAILER_RESPONSE; response_round += 1; retailer_position recorded"
      - from: RETAILER_RESPONSE
        to: RETAILER_RESPONSE
        trigger: POST /disputes/{id}/retailer-response
        actor: RetailerClerk
        preconditions:
          - "case_status == RETAILER_RESPONSE (supplemental retailer narrative after a return-to-retailer round)"
          - "current logical clock <= retailer_response_due_at (ERR_DISPUTE_RESPONSE_WINDOW_CLOSED)"
          - "the acting retailer is party to the load's agreement (ERR_RETAILER_NOT_PARTY)"
          - "response_round < 3 (ERR_INVALID_STATE - a third supplemental response is not accepted)"
        side_effects:
          - "case_status stays RETAILER_RESPONSE; response_round += 1; retailer_position superseded"
        note: "The self-loop makes the dispute machine genuinely cyclic: retailer then programme then retailer may repeat until the round cap."
      - from: RETAILER_RESPONSE
        to: PROGRAM_REVIEW
        trigger: POST /disputes/{id}/program-review
        actor: ComplianceAnalyst
        preconditions:
          - "case_status == RETAILER_RESPONSE"
        side_effects:
          - "case_status = PROGRAM_REVIEW"
      - from: PROGRAM_REVIEW
        to: RETAILER_RESPONSE
        trigger: POST /disputes/{id}/return-to-retailer
        actor: ComplianceAnalyst
        preconditions:
          - "case_status == PROGRAM_REVIEW"
          - "response_round < 3 (ERR_INVALID_STATE — the third round must be resolved or escalated)"
        side_effects:
          - "case_status = RETAILER_RESPONSE; retailer_response_due_at recomputed = clock + response window for the agreement type"
      - from: PROGRAM_REVIEW
        to: RESOLVED_CARDHOLDER
        trigger: POST /disputes/{id}/resolve
        actor: ComplianceOfficer
        preconditions:
          - "case_status == PROGRAM_REVIEW"
          - "resolution == CARDHOLDER"
        side_effects:
          - "[hop 1] case_status = RESOLVED_CARDHOLDER; final_liability_cents = claimed_amount_cents; provisional_credit_cents = provisional amount per the cardholder agreement variant"
          - "[hop 2] load_transaction → REVERSED, reversal_reason = DISPUTE_FAVOR_CARDHOLDER; card_account.balance_cents -= principal_cents floored at 0; ledger_reversed_cents += principal_cents"
          - "[hop 3] program.open_aml_alert_count / posture_score recomputed"
      - from: PROGRAM_REVIEW
        to: RESOLVED_RETAILER
        trigger: POST /disputes/{id}/resolve
        actor: ComplianceOfficer
        preconditions:
          - "case_status == PROGRAM_REVIEW"
          - "resolution == RETAILER"
        side_effects:
          - "case_status = RESOLVED_RETAILER; final_liability_cents = 0; provisional_credit_cents = 0"
      - from: RETAILER_RESPONSE
        to: ESCALATED
        trigger: POST /disputes/{id}/escalate
        actor: ComplianceAnalyst
        preconditions:
          - "case_status == RETAILER_RESPONSE"
          - "current logical clock > retailer_response_due_at (ERR_INVALID_STATE — escalation is open only after the retailer window closes)"
        side_effects:
          - "case_status = ESCALATED"
      - from: ESCALATED
        to: PROGRAM_REVIEW
        trigger: POST /disputes/{id}/program-review
        actor: ComplianceOfficer
        preconditions:
          - "case_status == ESCALATED"
        side_effects:
          - "case_status = PROGRAM_REVIEW"
      - from: RESOLVED_CARDHOLDER
        to: CLOSED
        trigger: POST /disputes/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "at least one LossAllocation with allocation_status IN {POSTED, RECOVERED} references this case, or final_liability_cents <= retailer_agreement.per_transaction_limit_cents (ERR_INVALID_STATE)"
        side_effects:
          - "case_status = CLOSED"
      - from: RESOLVED_RETAILER
        to: CLOSED
        trigger: POST /disputes/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "case_status == RESOLVED_RETAILER"
        side_effects:
          - "case_status = CLOSED"

  - entity: SettlementBatch
    initial_state: SCHEDULED
    terminal_states: [CLAWED_BACK]
    shape: linear
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: POST /settlement-batches/{id}/open
        actor: SettlementOperator
        preconditions:
          - "no other batch of the same agreement is in OPEN status (ERR_SETTLEMENT_PERIOD_OVERLAP)"
          - "retailer_agreement.agreement_status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "batch_status = OPEN"
      - from: OPEN
        to: SETTLED
        trigger: POST /settlement-batches/{id}/settle
        actor: SettlementOperator
        preconditions:
          - "at least one load in the period is FUNDED (ERR_SETTLEMENT_EMPTY_PERIOD)"
        side_effects:
          - "every FUNDED load with funded_at in [period_start_at, period_end_at) → SETTLED and attached to this batch"
          - "batch_status = SETTLED; settled_at = current logical clock"
          - "gross_principal_cents = Σ principal; accrued_retailer_share_cents = Σ per-transaction retailer_fee_share_cents"
          - "net_fee_payable_cents = round(Σ convenience_fee_cents * fee_split_retailer_pct) (sum-then-round variant)"
          - "settlement_rounding_delta_cents = accrued_retailer_share_cents - net_fee_payable_cents"
          - "retailer_agreement.settled_fee_total_cents += accrued_retailer_share_cents; accrual_pending_cents -= accrued_retailer_share_cents"
          - "chargeback_total_cents = Σ POSTED LossAllocation.total_loss_cents with posted_at in the period; float_retained_cents recomputed"
      - from: SETTLED
        to: CLAWED_BACK
        trigger: POST /settlement-batches/{id}/clawback
        actor: SettlementOperator
        preconditions:
          - "batch_status == SETTLED (ERR_SETTLEMENT_NOT_SETTLED)"
        side_effects:
          - "[hop 1] batch_status = CLAWED_BACK"
          - "[hop 1] every SETTLED load of this batch → REVERSED, reversal_reason = RETAILER_REQUEST; card_account balance and ledger adjusted"
          - "[hop 2] account window trips recomputed; OPEN STRUCTURING alerts that no longer qualify → DISMISSED"
          - "[hop 3] program.open_aml_alert_count and posture_score recomputed"
          - "retailer_agreement.float_position_cents -= float_retained_cents; accrual_pending_cents restored by accrued_retailer_share_cents"

  - entity: LossAllocation
    initial_state: DRAFT
    terminal_states: [RECOVERED]
    shape: linear
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: POST /loss-allocations/{id}/post
        actor: ComplianceOfficer
        preconditions:
          - "retailer_share_cents + program_share_cents + bank_share_cents == total_loss_cents (ERR_LOSS_ALLOCATION_MISMATCH)"
          - "program.compliance_posture == OPEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "allocation_status = POSTED; posted_at = current logical clock"
          - "retailer_agreement.contract_version_locked = true (the cited contract version is pinned)"
          - "program.allocated_loss_total_cents += total_loss_cents"
          - "Program confirmed-loss identity recomputed modulo POSTED==RECOVERED"
      - from: POSTED
        to: RECOVERED
        trigger: POST /loss-allocations/{id}/recover
        actor: SettlementOperator
        preconditions:
          - "allocation_status == POSTED"
          - "the retailer share has been charged through a settlement of the cited agreement (ERR_INVALID_STATE)"
        side_effects:
          - "allocation_status = RECOVERED; program.allocated_loss_total_cents unchanged (POSTED and RECOVERED both count as allocated)"

  - entity: FloatWindow
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    shape: linear
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: POST /float-windows/{id}/confirm
        actor: SettlementOperator
        preconditions:
          - "window_status == REQUESTED"
        side_effects:
          - "window_status = CONFIRMED"
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /float-windows/{id}/cancel
        actor: SettlementOperator
        preconditions:
          - "window_status == REQUESTED"
        side_effects:
          - "window_status = CANCELLED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: POST /float-windows/{id}/complete
        actor: SettlementOperator
        preconditions:
          - "window_status == CONFIRMED"
          - "retailer_agreement.float_position_cents + float_amount_cents <= FLOAT_CAP_CENTS (ERR_INVALID_STATE)"
        side_effects:
          - "window_status = COMPLETED; retailer_agreement.float_position_cents += float_amount_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: load-create-stale-account
    parent_entity: CardAccount
    write_endpoint: "POST /load-transactions"
    occ_field: "expected_card_account_version"
    description: |
      Creating a LoadTransaction against a CardAccount whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a concurrent load or a compliance hold has already changed the account (the
      hold path legitimately bumps the account's version) and the current writer's
      view of the account is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispute-create-stale-load
    parent_entity: LoadTransaction
    write_endpoint: "POST /disputes"
    occ_field: "expected_load_transaction_version"
    description: |
      Opening a DisputeCase against a LoadTransaction whose version has advanced
      since the client last observed it is rejected. A reversal, settlement or
      re-instatement legitimately supersedes the prior state of the load, so the
      disputing client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: brand-onboard-stale-program
    parent_entity: Program
    write_endpoint: "POST /brand-partners"
    occ_field: "expected_program_version"
    description: |
      Creating a BrandPartner under a Program whose version has advanced since the
      client last observed it is rejected. An oversight review or posture
      transition legitimately changes the program's posture, so a partner
      onboarded against a stale reading of the program is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: convenience_fee_cents
    trigger: "creation of a LoadTransaction (POST /load-transactions)"
    algorithm: tiered_pricing
    formula: |
      Marginal (not flat) tier rate table, allocated at the fee level:
        TIERS = [ (0,     2000,  199),    # rate_cents applied note: band 1 carries a FLAT 199
                  (2000, 10000,  249),    # marginal_cents
                  (10000,   null, 399) ]  # marginal_cents
      convenience_fee_cents = 0
      for (start, end, value) in TIERS:
        if principal_cents <= start: break
        if end is null:
          convenience_fee_cents += value
        elif value == 199:                       # band 1 is flat, not proportional
          convenience_fee_cents += 199
        else:
          span = end - start
          covered = min(principal_cents, end) - start
          convenience_fee_cents += value * covered / span
      return round_half_up(convenience_fee_cents, 2)
    input_set: "principal_cents of the load being created; tiers are fixed"
    constants:
      FEE_TIER_1_FLAT_CENTS: 199
      FEE_TIER_2_MARGINAL_CENTS: 249
      FEE_TIER_3_MARGINAL_CENTS: 399
    precision: "2 decimal places, round_half_up, applied once at the end of the tier walk"
    note: "Band 1 is flat (a 1500-cent load and a 2000-cent load both pay 199); bands 2 and 3 are marginal and proportional to the covered span. This is a third 'interpretation' trap for the PRD reader."
    variants:
      - name: flat_band_read
        when: "an engineer applies 249 flat for any principal above 2000"
        difference: "a 3000-cent load yields 448 instead of 232.38 — the tier walk above is authoritative"

  - name: effective_fee_schedule
    trigger: "settlement of a batch (POST /settlement-batches/{id}/settle) and per-load fee accrual at funding"
    algorithm: aggregation
    formula: |
      VARIANT AGGREGATE_AT_SETTLEMENT (authoritative for batch.settlement_rounding_delta_cents):
        batch_convenience_total = Σ convenience_fee_cents over loads settled into this batch
        batch_retailer_share = round_half_up(batch_convenience_total * fee_split_retailer_pct, 2)
      VARIANT ACCRUAL_AT_FUND (authoritative for retailer_agreement.accrual_pending_cents):
        incremental = Σ round_half_up(convenience_fee_cents * fee_split_retailer_pct, 2) per load
      settlement_rounding_delta_cents = accrual_pending_cents - batch_retailer_share
    input_set: "LoadTransaction rows with load_status == SETTLED attached to the batch"
    constants:
      DEFAULT_RETAILER_PCT: 0.60
    precision: "2 decimal places, round_half_up; variant A rounds once after summing, variant F rounds per load then sums"
    note: "This is the L2-vs-L1 reconciliation discrepancy of the domain: the same three loads produce a different payable under the two schedules."
    variants:
      - name: aggregate_at_settlement
        when: "computing the amount actually payable to the retailer for a period"
        difference: "sum-then-round; the rounding remainder lands once per period instead of once per load"
      - name: accrual_at_fund
        when: "computing accrual_pending_cents as loads fund"
        difference: "round-per-load-then-sum; drift versus the payable is accumulated and exposed as settlement_rounding_delta_cents"

  - name: velocity_trip
    trigger: "every load funding, reversal, and every state transition of the enclosing Program"
    algorithm: threshold
    formula: |
      Inputs: T = current logical clock; account; variant selector.
      VARIANT TRAILING_24H:
        qualifying = loads with load_status IN {FUNDED, SETTLED}
                    and funded_at > T - 24 hours
                    and funded_at <= T
        window_load_count = |qualifying|; window_load_cents = Σ principal_cents
        (the 24h window MOVES with every read; nothing is ever reset)
      VARIANT EPOCH_DAY:
        qualifying = loads with load_status IN {FUNDED, SETTLED}
                    and epoch_index == epoch_index_of(T)
        window_load_count = |qualifying|; window_load_cents = Σ principal_cents
        (a hard reset at logical-day rollover: the counter drops to the new day's loads)
      is_velocity_breached = (window_load_count >= VELOCITY_TXN_LIMIT)
                          OR (window_load_cents >= VELOCITY_AMOUNT_LIMIT_CENTS)
    input_set: "loads of the account in {FUNDED, SETTLED}; REVERSED and DECLINED loads excluded from both variants"
    constants:
      VELOCITY_TXN_LIMIT: 5
      VELOCITY_AMOUNT_LIMIT_CENTS: 1000000
    precision: "integer counts and cents; boundary is inclusive at both limits"
    note: "Both variants are declared; the epoch_day variant is the one used by the daily location counter reset, the trailing variant by per-load admission. Two loads in the same epoch day produce identical counts, but loads straddling a rollover diverge."
    variants:
      - name: trailing_24h
        when: "per-load admission control and structuring window evaluation"
        difference: "no reset event; a burst spanning midnight still counts"
      - name: epoch_day
        when: "the location daily counter and its reset on logical-day rollover"
        difference: "resets to zero at each epoch boundary, so the same burst is split across two days"

  - name: is_structuring
    trigger: "every load funding and every load reversal"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER (pinned — the band predicate is evaluated against the count
      tier BEFORE the total tier, so the count tier is the key):
        1. T = current logical clock
        2. below = loads with load_status IN {FUNDED, SETTLED}
                   and funded_at > T - 24 hours and funded_at <= T
                   and STRUCTURING_LOWER_CENTS <= principal_cents <= STRUCTURING_UPPER_CENTS
        3. structuring_txn_count = |below|
        4. structuring_total_cents = Σ principal_cents over below
        5. count_tier_met = structuring_txn_count >= STRUCTURING_TXN_COUNT
        6. total_tier_met = structuring_total_cents >= STRUCTURING_MIN_TOTAL_CENTS
        7. is_structuring = count_tier_met AND total_tier_met
      The observed count is the value the tier answer is keyed on; total_cents only
      confirms that the sub-threshold band was used to stay under the reporting
      threshold. Below the count tier the answer is false no matter how large the
      total is.
    input_set: "loads of the account in {FUNDED, SETTLED} within the trailing 24h closed-open window whose principal falls inside the sub-threshold band"
    constants:
      STRUCTURING_LOWER_CENTS: 9000
      STRUCTURING_UPPER_CENTS: 9999
      STRUCTURING_TXN_COUNT: 3
      STRUCTURING_MIN_TOTAL_CENTS: 27000
    precision: "integer counts and cents; band endpoints are inclusive on both sides"
    note: "3 loads of 9000 cents => structuring true; 2 loads of 9999 cents => 19998 < 27000 AND count 2 < 3 => false; 3 loads of 10000 cents are OUTSIDE the band (10000 > 9999) => false."

  - name: posture_score
    trigger: "every AmlAlert confirmation/dismissal/reopen, every BrandPartner suspension/restore, every Program posture transition, every oversight review"
    algorithm: weighted_scoring
    formula: |
      λ = POSTURE_LAMBDA_BASE                  # 0.10
      if program.is_oversight_overdue OR program.has_overdue_prior_review: λ = POSTURE_LAMBDA_OVERDUE   # 0.20
      n = program.posture_breach_count
      posture_score = 100 * (1 - (1 - λ)^n)
      clamp posture_score to [0.00, 100.00]; round_half_up 2 dp
      derived predicates (INDEPENDENT of λ):
        unfreeze_eligible = posture_score <= 3.99
        freeze_eligible   = posture_score >= 60.00
    input_set: "posture_breach_count = CONFIRMED AmlAlert rows + BrandPartner rows with partner_status == SUSPENDED, for this program"
    constants:
      POSTURE_LAMBDA_BASE: 0.10
      POSTURE_LAMBDA_OVERDUE: 0.20
      FREEZE_THRESHOLD: 60.00
      UNFREEZE_THRESHOLD: 3.99
    precision: "2 decimal places, round_half_up, applied after the clamp"
    note: |
      Worked values used by the design files:
      n=1, base λ  => 100*(1-0.9)   = 10.00
      n=1, overdue => 100*(1-0.8)   = 20.00
      n=2, base λ  => 100*(1-0.81)  = 19.00
      n=2, overdue => 100*(1-0.64)  = 36.00
      n=3, overdue => 100*(1-0.512) = 48.80
    variants:
      - name: linear_posture_read
        when: "an engineer scores 100 * λ * n"
        difference: "n=2 base-λ yields 20.00 instead of 19.00; the compounding form is authoritative"

  - name: provisional_credit_cents
    trigger: "DisputeCase creation (OPEN) and entry to PROGRAM_REVIEW"
    algorithm: threshold
    formula: |
      VARIANT REG_E:      provisional = min(claimed_amount_cents, PROVISIONAL_CAP_REG_E) at case creation
      VARIANT VOLUNTARY:  provisional = 0 at OPEN; on entry to PROGRAM_REVIEW provisional = min(claimed_amount_cents, PROVISIONAL_CAP_VOLUNTARY)
      VARIANT CORPORATE:  provisional = 0 at OPEN and at PROGRAM_REVIEW; on RESOLVED_CARDHOLDER
                          provisional = min(claimed_amount_cents, PROVISIONAL_CAP_CORPORATE)
      A failed dispute (RESOLVED_RETAILER) sets provisional_credit_cents back to 0 in every variant.
    input_set: "the disputed LoadTransaction and CardAccount.cardholder_agreement_type"
    constants:
      PROVISIONAL_CAP_REG_E: 2500
      PROVISIONAL_CAP_VOLUNTARY: 1500
      PROVISIONAL_CAP_CORPORATE: 500
      REG_E_ERROR_RESOLUTION_FLOOR_CENTS: 250
    precision: "integer cents"
    note: "REG_E error-resolution cases floor their provisional at REG_E_ERROR_RESOLUTION_FLOOR_CENTS when error_resolution_eligible is true — a claimed amount of 100 still yields 250."
    variants:
      - name: reg_e_immediate
        when: "CardAccount.cardholder_agreement_type == REG_E"
        difference: "credit is available from OPEN, capped at 2500"
      - name: voluntary_deferred
        when: "CardAccount.cardholder_agreement_type == VOLUNTARY"
        difference: "no credit until PROGRAM_REVIEW, capped at 1500"
      - name: corporate_at_resolution
        when: "CardAccount.cardholder_agreement_type == CORPORATE"
        difference: "no credit until RESOLVED_CARDHOLDER, capped at 500"

  - name: loss_allocation_split
    trigger: "creation of a LossAllocation and its POST transition"
    algorithm: waterfall_allocation
    formula: |
      retailer_share_cap_cents = min(total_loss_cents, retailer_agreement.per_transaction_limit_cents)
      retailer_share_cents = min(total_loss_cents, retailer_share_cap_cents)
      remaining = total_loss_cents - retailer_share_cents
      bank_pct = BANK_BEAR_PCT_BAAS if program.program_type == BAAS_PROGRAM_MANAGER else BANK_BEAR_PCT_OWN
      bank_share_cents = floor(remaining * bank_pct)
      program_share_cents = remaining - bank_share_cents      # absorbs the rounding remainder
    input_set: "total_loss_cents of the load; the cited RetailerAgreement per-transaction limit; the program type"
    constants:
      BANK_BEAR_PCT_BAAS: 0.15
      BANK_BEAR_PCT_OWN: 0.00
    precision: "integer cents; the program share absorbs the FLOOR remainder so the identity holds exactly"
    note: "The waterfall order is retailer cap first, then the bank percentage of what remains, then the program remainder — banks are never allocated a share of the retailer's capped layer."

  - name: funding_credit
    trigger: "funding or reversing a load on a CardAccount"
    algorithm: aggregation
    formula: |
      balance_cents = max(0, ledger_posted_cents - ledger_reversed_cents)
      funding_status = UNFUNDED if ledger_posted_cents == 0
                       else DRAINED if balance_cents == 0
                       else FUNDED
    input_set: "all posted and reversed loads of the account, irrespective of program posture"
    precision: "integer cents; the floor at zero is authoritative (reversals never drive the balance negative)"
    note: "ledger_posted_cents and ledger_reversed_cents only ever move at FUND and REVERSE; balance_cents is the derived field reconciled from them."

  - name: settlement_fee_rounding
    trigger: "POST /settlement-batches/{id}/settle"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER (pinned):
        per_load_share_i  = round_half_up(convenience_fee_cents_i * fee_split_retailer_pct, 2)
        accrued_retailer_share_cents = Σ_i per_load_share_i            # round-then-sum
        aggregate_convenience = Σ_i convenience_fee_cents_i
        net_fee_payable_cents = round_half_up(aggregate_convenience * fee_split_retailer_pct, 2)   # sum-then-round
        settlement_rounding_delta_cents = accrued_retailer_share_cents - net_fee_payable_cents
    input_set: "loads with load_status == SETTLED attached to this batch and funded_at within [period_start_at, period_end_at)"
    precision: "2 decimal places, round_half_up, applied in the pinned order above"
    note: "Both orders are computed; the delta is a first-class field. Example: fees of 232.38, 448.50 and 232.38 with pct 0.60 => round-then-sum 62.10 + 60.00 + 62.10 = 184.20; sum-then-round 913.26*0.60 = 547.956 => 547.96; delta = -363.76. The implementation MUST NOT collapse the two."

  - name: dispute_response_window
    trigger: "DisputeCase creation (POST /v1/disputes)"
    algorithm: threshold
    formula: |
      retailer_response_due_at = current logical clock + RESPONSE_WINDOW_HOURS[cardholder_agreement_type] * 3600 seconds
      RESPONSE_WINDOW_HOURS = { REG_E: 24, VOLUNTARY: 48, CORPORATE: 72 }
      A retailer response submitted at or before retailer_response_due_at is accepted;
      one submitted after it is rejected (ERR_DISPUTE_RESPONSE_WINDOW_CLOSED).
    input_set: "CardAccount.cardholder_agreement_type copied onto the case at creation"
    constants:
      REG_E_RESPONSE_HOURS: 24
      VOLUNTARY_RESPONSE_HOURS: 48
      CORPORATE_RESPONSE_HOURS: 72
    precision: "integer hours; the deadline comparison is inclusive (a response at exactly due_at is in time)"
    variants:
      - name: reg_e_short_window
        when: "cardholder_agreement_type == REG_E"
        difference: "24h rather than the voluntary 48h or corporate 72h window"

  - name: oversight_review_effect
    trigger: "POST /programs/{id}/oversight-review"
    algorithm: threshold
    formula: |
      overdue_days = floor((current logical clock - program.oversight_review_due_at) / 86400 seconds)
      if current logical clock <= program.oversight_review_due_at:
        overdue_days = 0
      passed = open_aml_alert_count == 0
      pending_breach_count = CONFIRMED alerts + SUSPENDED brands
      sponsor.oversight_reviews_completed += 1
      program.last_posture_review_at = current logical clock
      program.oversight_review_due_at = current logical clock + OVERSIGHT_INTERVAL_DAYS * 86400 seconds
      λ for posture_score drops back to POSTURE_LAMBDA_BASE once no overdue review remains
    input_set: "the program's alerts and brands at review time"
    constants:
      OVERSIGHT_INTERVAL_DAYS: 90
    precision: "integer day counts; the deadline comparison is inclusive (a review at exactly due_at is not overdue)"
    note: "A review that passes (zero open alerts) is still recorded when it is late; the bank oversight metric counts completions, not timeliness."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "The acting role is listed in the endpoint's roles for this call", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Every resource id present in the path resolves to an existing row, validated left-to-right along the path", error_id: ERR_ENTITY_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "Every FK id supplied in the request body resolves to an existing row", error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: state,                check: "The target resource's current status permits the requested operation (per its state machine's from: set)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all" }
  - { priority: 6,  category: state,                check: "Parent Program.compliance_posture != FROZEN for any write that creates or mutates a child of that program", error_id: ERR_PROGRAM_FROZEN, http_status: 409, applies_to: ["POST /v1/brand-partners", "POST /v1/retailer-agreements", "POST /v1/reload-locations", "POST /v1/load-transactions", "POST /v1/aml-alerts", "POST /v1/disputes", "POST /v1/loss-allocations", "POST /v1/settlement-batches", "POST /v1/float-windows", "POST /v1/programs/{id}/oversight-review", "POST /v1/brand-partners/{id}/state", "POST /v1/retailer-agreements/{id}/state", "POST /v1/reload-locations/{id}/state", "POST /v1/loss-allocations/{id}/post"] }
  - { priority: 7,  category: state,                check: "Parent RetailerAgreement.agreement_status == ACTIVE for load creation and settlement operations", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /v1/load-transactions", "POST /v1/settlement-batches", "POST /v1/settlement-batches/{id}/open", "POST /v1/settlement-batches/{id}/settle"] }
  - { priority: 8,  category: state,                check: "Parent Program.compliance_posture != RESTRICTED for onboard, first-fund and re-instate operations", error_id: ERR_PROGRAM_RESTRICTED, http_status: 409, applies_to: ["POST /v1/brand-partners", "POST /v1/brand-partners/{id}/state", "POST /v1/load-transactions", "POST /v1/load-transactions/{id}/reinstate"] }
  - { priority: 9,  category: state,                check: "CardAccount.compliance_hold_status == CLEAR for load creation and funding mutations, and != FROZEN for re-instatement", error_id: ERR_ACCOUNT_FROZEN, http_status: 409, applies_to: ["POST /v1/load-transactions", "POST /v1/load-transactions/{id}/fund", "POST /v1/load-transactions/{id}/reinstate"] }
  - { priority: 10, category: state,                check: "RetailerAgreement.contract_version_locked == false for renegotiation writes", error_id: ERR_CONTRACT_VERSION_LOCKED, http_status: 409, applies_to: ["POST /v1/retailer-agreements/{id}/state"] }
  - { priority: 11, category: state,                check: "ReloadLocation.location_status == OPEN for load creation and float-window operations", error_id: ERR_LOCATION_NOT_OPEN, http_status: 409, applies_to: ["POST /v1/load-transactions", "POST /v1/float-windows"] }
  - { priority: 12, category: state,                check: "The resource is not already terminal for the attempted transition (a DECLINED load stays DECLINED forever, a COMPLETED float window never moves again)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all" }
  - { priority: 13, category: business_referential, check: "BrandPartner.onboarding_checklist_complete == true before the brand may move to ACTIVE", error_id: ERR_BRAND_ONBOARDING_INCOMPLETE, http_status: 422, applies_to: ["POST /v1/brand-partners/{id}/state"] }
  - { priority: 14, category: business_referential, check: "The acting retailer is party to the cited RetailerAgreement of the disputed load", error_id: ERR_RETAILER_NOT_PARTY, http_status: 403, applies_to: ["POST /v1/disputes/{id}/retailer-response"] }
  - { priority: 15, category: business_safety,      check: "No AmlAlert with alert_status IN {OPEN, UNDER_REVIEW} references the account, and no unresolved CONFIRMED alert sits on it", error_id: ERR_AML_ALERT_PENDING, http_status: 409, applies_to: ["POST /v1/load-transactions", "POST /v1/card-accounts/{id}/hold"] }
  - { priority: 16, category: business_safety,      check: "The load would not push the account window past VELOCITY_TXN_LIMIT or VELOCITY_AMOUNT_LIMIT_CENTS under the active variant", error_id: ERR_VELOCITY_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /v1/load-transactions/{id}/fund"] }
  - { priority: 17, category: business_safety,      check: "A manually raised STRUCTURING alert requires the account to already satisfy the structuring predicate (3 or more sub-threshold loads in the trailing window summing to at least 27000 cents)", error_id: ERR_STRUCTURING_SUSPECTED, http_status: 422, applies_to: ["POST /v1/aml-alerts"] }
  - { priority: 18, category: business_constraint,  check: "principal_cents <= ReloadLocation.effective_per_transaction_limit_cents for the load", error_id: ERR_PER_TRANSACTION_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /v1/load-transactions"] }
  - { priority: 19, category: business_constraint,  check: "reload_location.daily_accepted_cents + posted_total_cents <= agreement.daily_location_limit_cents for load creation", error_id: ERR_DAILY_LOCATION_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /v1/load-transactions"] }
  - { priority: 20, category: business_constraint,  check: "principal_cents >= MIN_LOAD_PRINCIPAL_CENTS (100)", error_id: ERR_MINIMUM_LOAD_AMOUNT, http_status: 422, applies_to: ["POST /v1/load-transactions"] }
  - { priority: 21, category: business_constraint,  check: "principal_cents falls inside the sub-threshold band [STRUCTURING_LOWER_CENTS, STRUCTURING_UPPER_CENTS] while the account's structuring_txn_count is already >= STRUCTURING_TXN_COUNT (the band is closed once flagged)", error_id: ERR_STRUCTURING_BAND, http_status: 422, applies_to: ["POST /v1/load-transactions"] }
  - { priority: 22, category: business_constraint,  check: "retailer_share_cents + program_share_cents + bank_share_cents == total_loss_cents on the allocation", error_id: ERR_LOSS_ALLOCATION_MISMATCH, http_status: 422, applies_to: ["POST /v1/loss-allocations", "POST /v1/loss-allocations/{id}/post"] }
  - { priority: 23, category: business_constraint,  check: "The candidate period [period_start_at, period_end_at) does not share an interior with any OPEN SettlementBatch period of the same agreement (half-open adjacency is not an overlap)", error_id: ERR_SETTLEMENT_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /v1/settlement-batches"] }
  - { priority: 24, category: business_constraint,  check: "At least one FUNDED load falls in the batch period at settle time", error_id: ERR_SETTLEMENT_EMPTY_PERIOD, http_status: 422, applies_to: ["POST /v1/settlement-batches/{id}/settle"] }
  - { priority: 25, category: business_constraint,  check: "batch_status == SETTLED before a clawback", error_id: ERR_SETTLEMENT_NOT_SETTLED, http_status: 409, applies_to: ["POST /v1/settlement-batches/{id}/clawback"] }
  - { priority: 26, category: business_constraint,  check: "load_status == REVERSED before a re-instatement", error_id: ERR_LOAD_NOT_REVERSED, http_status: 409, applies_to: ["POST /v1/load-transactions/{id}/reinstate"] }
  - { priority: 27, category: business_constraint,  check: "No LossAllocation with allocation_status IN {POSTED, RECOVERED} references the load being re-instated (the allocated loss must be un-posted first)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /v1/load-transactions/{id}/reinstate"] }
  - { priority: 28, category: business_temporal,    check: "current logical clock <= DisputeCase.retailer_response_due_at for a retailer response", error_id: ERR_DISPUTE_RESPONSE_WINDOW_CLOSED, http_status: 409, applies_to: ["POST /v1/disputes/{id}/retailer-response"] }
  - { priority: 29, category: business_temporal,    check: "The FloatWindow interval [window_start_at, window_end_at] plus buffer_minutes on both sides does not overlap any non-CANCELLED FloatWindow of the same location", error_id: ERR_FLOAT_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /v1/float-windows"] }
  - { priority: 30, category: business_temporal,    check: "The load's funded_at lies inside [period_start_at, period_end_at) of the batch being settled", error_id: ERR_LOAD_OUTSIDE_SETTLEMENT_PERIOD, http_status: 409, applies_to: ["POST /v1/settlement-batches/{id}/settle"] }
  - { priority: 31, category: business_fiscal,      check: "retailer_agreement.float_position_cents + float_amount_cents <= FLOAT_CAP_CENTS (3000000)", error_id: ERR_FLOAT_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /v1/float-windows", "POST /v1/float-windows/{id}/complete"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- BankSponsor ---
  - method: POST
    path: "/v1/bank-sponsors"
    description: "Register a chartered bank as a sponsor of record"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, charter_state_code, sponsorship_capacity_programs, "oversight_tier?", regulator_exam_due_at]
    output: BankSponsor
    side_effects: ["active_program_count=0", "oversight_reviews_completed=0", "is_capacity_exhausted=false"]

  - method: GET
    path: "/v1/bank-sponsors/{id}"
    description: "Get a sponsor bank"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: BankSponsor
    side_effects: []

  - method: GET
    path: "/v1/bank-sponsors"
    description: "List sponsor banks"
    roles: [PlatformAdmin, BankSponsor, ComplianceOfficer, SettlementOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: BankSponsor[]
    side_effects: []

  # --- Program ---
  - method: POST
    path: "/v1/programs"
    description: "Create a reload program sponsored by a bank"
    roles: [PlatformAdmin]
    code: 201
    input: [name, sponsor_bank_id, program_type, "settlement_cycle?", oversight_review_due_at]
    output: Program
    side_effects: ["compliance_posture=OPEN", "posture_breach_count=0", "posture_score=0.00", "open_aml_alert_count=0", "sponsor.active_program_count += 1", "sponsor.is_capacity_exhausted recomputed"]

  - method: GET
    path: "/v1/programs/{id}"
    description: "Get a program"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/v1/programs"
    description: "List programs, optionally filtered by sponsor bank"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["sponsor_bank_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/v1/programs/{id}/state"
    description: "Move the program's compliance posture"
    roles: [BankSponsor, PlatformAdmin]
    code: 200
    input: [to_posture, expected_program_version]
    output: Program
    side_effects:
      - "Program.compliance_posture transitions per §1.2 (OPEN|RESTRICTED|FROZEN), firing the full side-effect chain including hop 1..4 cascades"
      - "increments Program.version by 1"
      - "last_posture_review_at = current logical clock"

  - method: POST
    path: "/v1/programs/{id}/oversight-review"
    description: "Record a bank oversight review of the program and advance its due date"
    roles: [BankSponsor, PlatformAdmin]
    code: 200
    input: ["review_note?"]
    output: Program
    side_effects:
      - "sponsor.oversight_reviews_completed += 1"
      - "oversight_review_due_at = current logical clock + 90 days"
      - "posture_score recomputed under the base lambda"
      - "increments Program.version by 1"

  # --- BrandPartner ---
  - method: POST
    path: "/v1/brand-partners"
    description: "Onboard a third-party brand under a program"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [program_id, brand_name, services_scope, "card_issuance_enabled?", "ledgering_enabled?", "compliance_oversight_enabled?", expected_program_version]
    output: BrandPartner
    side_effects: ["partner_status=PENDING_ONBOARDING", "suspension_source=NONE", "increments Program.version by 1"]

  - method: GET
    path: "/v1/brand-partners/{id}"
    description: "Get a brand partner"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: BrandPartner
    side_effects: []

  - method: GET
    path: "/v1/brand-partners"
    description: "List brand partners, optionally filtered by program"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: BrandPartner[]
    side_effects: []

  - method: POST
    path: "/v1/brand-partners/{id}/state"
    description: "Move a brand partner through onboarding, suspension and offboarding"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, "suspension_source?"]
    output: BrandPartner
    side_effects:
      - "BrandPartner.partner_status transitions per §1.2 including the hop 1..4 suspension cascade"
      - "program.posture_score recomputed"
      - "increments BrandPartner.version by 1"

  # --- RetailerAgreement ---
  - method: POST
    path: "/v1/retailer-agreements"
    description: "Create a retailer reload agreement with fee split and limits"
    roles: [PlatformAdmin, ProgramManager]
    code: 201
    input: [program_id, retailer_name, fee_split_retailer_pct, per_transaction_limit_cents, daily_location_limit_cents, "settlement_period_hours?", "reload_enabled?"]
    output: RetailerAgreement
    side_effects: ["agreement_status=DRAFT", "fee_split_program_pct = 1 - fee_split_retailer_pct", "accrual_pending_cents=0", "float_position_cents=0", "settled_fee_total_cents=0", "contract_version_locked=false"]

  - method: GET
    path: "/v1/retailer-agreements/{id}"
    description: "Get a retailer agreement"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: RetailerAgreement
    side_effects: []

  - method: GET
    path: "/v1/retailer-agreements"
    description: "List retailer agreements, optionally filtered by program"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: RetailerAgreement[]
    side_effects: []

  - method: POST
    path: "/v1/retailer-agreements/{id}/state"
    description: "Move a retailer agreement through draft, active, suspended, renegotiation and termination"
    roles: [ProgramManager]
    code: 200
    input: [to_status]
    output: RetailerAgreement
    side_effects:
      - "RetailerAgreement.agreement_status transitions per §1.2 including the ReloadLocation cascade"
      - "increments RetailerAgreement.version by 1"

  # --- ReloadLocation ---
  - method: POST
    path: "/v1/reload-locations"
    description: "Register a reload-capable store location"
    roles: [PlatformAdmin, ProgramManager]
    code: 201
    input: [retailer_agreement_id, location_code, state_code, register_count]
    output: ReloadLocation
    side_effects: ["location_status=OPEN", "daily_accepted_cents=0", "daily_txn_count=0", "aml_velocity_score=0.00", "is_velocity_breached=false", "last_epoch_index = epoch index of current logical clock"]

  - method: GET
    path: "/v1/reload-locations/{id}"
    description: "Get a reload location"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: ReloadLocation
    side_effects: []

  - method: GET
    path: "/v1/reload-locations"
    description: "List reload locations, optionally filtered by agreement or state"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["retailer_agreement_id?", "state_code?", "limit?", "offset?"]
    output: ReloadLocation[]
    side_effects: []

  - method: POST
    path: "/v1/reload-locations/{id}/state"
    description: "Move a reload location between open, restricted and closed"
    roles: [ProgramManager]
    code: 200
    input: [to_status]
    output: ReloadLocation
    side_effects:
      - "ReloadLocation.location_status transitions per §1.2; effective_per_transaction_limit_cents recomputed"
      - "FloatWindow cancellation cascade when closing"
      - "increments ReloadLocation.version by 1"

  # --- CardAccount ---
  - method: POST
    path: "/v1/card-accounts"
    description: "Open a prepaid or partner-funded card account"
    roles: [PlatformAdmin, ProgramManager]
    code: 201
    input: [program_id, brand_partner_id, account_ref, cardholder_name, cardholder_agreement_type]
    output: CardAccount
    side_effects: ["funding_status=UNFUNDED", "compliance_hold_status=CLEAR", "balance_cents=0", "ledger_posted_cents=0", "ledger_reversed_cents=0", "is_structuring=false"]

  - method: GET
    path: "/v1/card-accounts/{id}"
    description: "Get a card account"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: CardAccount
    side_effects: []

  - method: GET
    path: "/v1/card-accounts"
    description: "List card accounts, optionally filtered by brand or program"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator]
    code: 200
    input: ["program_id?", "brand_partner_id?", "limit?", "offset?"]
    output: CardAccount[]
    side_effects: []

  - method: POST
    path: "/v1/card-accounts/{id}/hold"
    description: "Move the account's compliance hold dimension"
    roles: [ComplianceAnalyst, ComplianceOfficer]
    code: 200
    input: [to_hold_status]
    output: CardAccount
    side_effects:
      - "CardAccount.compliance_hold_status transitions per §1.2 including the hop 1..3 freeze-reversal cascade"
      - "increments CardAccount.version by 1"

  # --- LoadTransaction ---
  - method: POST
    path: "/v1/load-transactions"
    description: "Accept cash at the register and create a pending reload"
    roles: [RetailerClerk]
    code: 201
    input: [reload_location_id, card_account_id, principal_cents, expected_card_account_version]
    output: LoadTransaction
    side_effects:
      - "load_status=INITIATED; convenience_fee_cents, posted_total_cents, retailer_fee_share_cents and program_fee_share_cents computed"
      - "risk_flag set to STRUCTURING when the creation itself trips the structuring predicate, else NONE"
      - "increments CardAccount.version by 1"
      - "epoch_index = epoch index of current logical clock"

  - method: GET
    path: "/v1/load-transactions/{id}"
    description: "Get a load transaction"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: LoadTransaction
    side_effects: []

  - method: GET
    path: "/v1/load-transactions"
    description: "List load transactions with filters"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["reload_location_id?", "card_account_id?", "settlement_batch_id?", "load_status?", "limit?", "offset?"]
    output: LoadTransaction[]
    side_effects: []

  - method: POST
    path: "/v1/load-transactions/{id}/fund"
    description: "Fund a pending reload in real time"
    roles: [RetailerClerk]
    code: 200
    input: []
    output: LoadTransaction
    side_effects:
      - "load_status=FUNDED; CardAccount balance and ledger credited; location counters and velocity score updated; agreement accrual and float updated; program posture_score recomputed"
      - "increments CardAccount.version by 1"

  - method: POST
    path: "/v1/load-transactions/{id}/decline"
    description: "Decline a pending reload before funding"
    roles: [RetailerClerk]
    code: 200
    input: ["decline_reason?"]
    output: LoadTransaction
    side_effects: ["load_status=DECLINED; no balance, ledger, accrual, float or counter mutation"]

  - method: POST
    path: "/v1/load-transactions/{id}/reverse"
    description: "Reverse a funded load and unwind its accounting"
    roles: [ComplianceAnalyst, ComplianceOfficer]
    code: 200
    input: [reversal_reason, expected_load_transaction_version]
    output: LoadTransaction
    side_effects:
      - "load_status=REVERSED with the requested reason; account balance/ledger, location counters and agreement accrual/float unwound"
      - "hop 2..3: OPEN STRUCTURING alerts dismissed and program counters/posture recomputed"
      - "increments CardAccount.version by 1 and LoadTransaction.version by 1"

  - method: POST
    path: "/v1/load-transactions/{id}/reinstate"
    description: "Re-instate a reversed load after its loss allocation is un-posted"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_card_account_version, expected_load_transaction_version]
    output: LoadTransaction
    side_effects:
      - "load_status=SETTLED; account balance and ledger restored; funding_status=FUNDED"
      - "program.unallocated_confirmed_loss_cents reduced when the reversal reason was AML_CONFIRMED"
      - "increments CardAccount.version by 1"

  # --- AmlAlert ---
  - method: POST
    path: "/v1/aml-alerts"
    description: "Raise an AML alert on an account window"
    roles: [ComplianceAnalyst]
    code: 201
    input: [program_id, card_account_id, alert_type, window_start_at, window_end_at, "resolution_note?"]
    output: AmlAlert
    side_effects: ["alert_status=OPEN", "severity computed from the observed window trip", "observed counts captured at raise time", "linked_load_ids populated"]

  - method: GET
    path: "/v1/aml-alerts/{id}"
    description: "Get an AML alert"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator]
    code: 200
    input: []
    output: AmlAlert
    side_effects: []

  - method: GET
    path: "/v1/aml-alerts"
    description: "List AML alerts with filters"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer]
    code: 200
    input: ["program_id?", "card_account_id?", "alert_status?", "limit?", "offset?"]
    output: AmlAlert[]
    side_effects: []

  - method: POST
    path: "/v1/aml-alerts/{id}/review"
    description: "Take an alert into review"
    roles: [ComplianceAnalyst]
    code: 200
    input: ["resolution_note?"]
    output: AmlAlert
    side_effects: ["alert_status=UNDER_REVIEW", "assigned_analyst_id = X-User-ID"]

  - method: POST
    path: "/v1/aml-alerts/{id}/return"
    description: "Return an alert to the open queue for a different analyst"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: AmlAlert
    side_effects: ["alert_status=OPEN", "assigned_analyst_id=null"]

  - method: POST
    path: "/v1/aml-alerts/{id}/confirm"
    description: "Confirm an alert as a genuine AML breach"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AmlAlert
    side_effects:
      - "alert_status=CONFIRMED; confirmed_by_analyst_id = X-User-ID"
      - "hop 2..4: account frozen, funded loads reversed with reason AML_CONFIRMED, POSTED loss allocations recovered"
      - "program.open_aml_alert_count -= 1 and posture_score recomputed"

  - method: POST
    path: "/v1/aml-alerts/{id}/reopen"
    description: "Reopen a confirmed alert when its classification was wrong"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AmlAlert
    side_effects: ["alert_status=UNDER_REVIEW", "confirmed_by_analyst_id=null", "program.open_aml_alert_count += 1 and posture_score recomputed"]

  - method: POST
    path: "/v1/aml-alerts/{id}/dismiss"
    description: "Dismiss an alert as not actionable"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AmlAlert
    side_effects: ["alert_status=DISMISSED", "program.open_aml_alert_count -= 1 and posture_score recomputed"]

  # --- DisputeCase ---
  - method: POST
    path: "/v1/disputes"
    description: "Open a dispute or error-resolution case against a load"
    roles: [ComplianceAnalyst, RetailerClerk]
    code: 201
    input: [program_id, load_transaction_id, card_account_id, dispute_reason, claimed_amount_cents, expected_load_transaction_version]
    output: DisputeCase
    side_effects:
      - "case_status=OPEN; cardholder_agreement_type copied from the account"
      - "provisional_credit_cents computed per the agreement-type variant"
      - "retailer_response_due_at computed from the agreement-type window"
      - "increments LoadTransaction.version by 1"

  - method: GET
    path: "/v1/disputes/{id}"
    description: "Get a dispute case"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []

  - method: GET
    path: "/v1/disputes"
    description: "List dispute cases with filters"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["program_id?", "load_transaction_id?", "card_account_id?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []

  - method: POST
    path: "/v1/disputes/{id}/retailer-response"
    description: "Record the retailer's response to a dispute"
    roles: [RetailerClerk]
    code: 200
    input: [retailer_position]
    output: DisputeCase
    side_effects: ["case_status=RETAILER_RESPONSE", "response_round += 1", "increments DisputeCase.version by 1"]

  - method: POST
    path: "/v1/disputes/{id}/program-review"
    description: "Move a dispute into program review"
    roles: [ComplianceAnalyst, ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: DisputeCase
    side_effects: ["case_status=PROGRAM_REVIEW", "provisional_credit_cents recomputed per the agreement-type variant", "increments DisputeCase.version by 1"]

  - method: POST
    path: "/v1/disputes/{id}/return-to-retailer"
    description: "Send a dispute back for another retailer response round"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["case_status=RETAILER_RESPONSE", "retailer_response_due_at recomputed", "increments DisputeCase.version by 1"]

  - method: POST
    path: "/v1/disputes/{id}/resolve"
    description: "Resolve a dispute in favour of the cardholder or the retailer"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution]
    output: DisputeCase
    side_effects:
      - "case_status set to RESOLVED_CARDHOLDER or RESOLVED_RETAILER; final_liability_cents pinned; provisional credit finalised or zeroed"
      - "hop 2..3 on cardholder resolution: load reversed with reason DISPUTE_FAVOR_CARDHOLDER; program counters recomputed"
      - "increments DisputeCase.version by 1"

  - method: POST
    path: "/v1/disputes/{id}/escalate"
    description: "Escalate a dispute whose retailer window has closed"
    roles: [ComplianceAnalyst]
    code: 200
    input: ["escalation_note?"]
    output: DisputeCase
    side_effects: ["case_status=ESCALATED", "increments DisputeCase.version by 1"]

  - method: POST
    path: "/v1/disputes/{id}/close"
    description: "Close a resolved dispute"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["case_status=CLOSED", "increments DisputeCase.version by 1"]

  # --- LossAllocation ---
  - method: POST
    path: "/v1/loss-allocations"
    description: "Allocate a fraud or error loss across retailer, program and bank"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [program_id, load_transaction_id, retailer_agreement_id, "dispute_case_id?", total_loss_cents, allocation_basis, "retailer_share_cents?"]
    output: LossAllocation
    side_effects:
      - "allocation_status=DRAFT; the waterfall split is computed (or the supplied retailer share validated against it) and the three shares persisted"
      - "retailer_agreement.contract_version_locked=true is applied at POST, not at creation"

  - method: GET
    path: "/v1/loss-allocations/{id}"
    description: "Get a loss allocation"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator]
    code: 200
    input: []
    output: LossAllocation
    side_effects: []

  - method: GET
    path: "/v1/loss-allocations"
    description: "List loss allocations with filters"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator]
    code: 200
    input: ["program_id?", "retailer_agreement_id?", "load_transaction_id?", "dispute_case_id?", "allocation_status?", "limit?", "offset?"]
    output: LossAllocation[]
    side_effects: []

  - method: POST
    path: "/v1/loss-allocations/{id}/post"
    description: "Post a loss allocation against the program and lock the cited contract version"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LossAllocation
    side_effects:
      - "allocation_status=POSTED; posted_at = current logical clock"
      - "retailer_agreement.contract_version_locked=true"
      - "program.allocated_loss_total_cents += total_loss_cents"
      - "increments RetailerAgreement.version by 1 and Program.version by 1"

  - method: POST
    path: "/v1/loss-allocations/{id}/recover"
    description: "Mark a posted allocation as recovered from the retailer"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: LossAllocation
    side_effects: ["allocation_status=RECOVERED; program.allocated_loss_total_cents unchanged"]

  # --- SettlementBatch ---
  - method: POST
    path: "/v1/settlement-batches"
    description: "Schedule a settlement period for a retailer agreement"
    roles: [SettlementOperator, PlatformAdmin]
    code: 201
    input: [retailer_agreement_id, period_start_at, period_end_at]
    output: SettlementBatch
    side_effects: ["batch_status=SCHEDULED", "all monetary totals initialised to 0"]

  - method: GET
    path: "/v1/settlement-batches/{id}"
    description: "Get a settlement batch"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: GET
    path: "/v1/settlement-batches"
    description: "List settlement batches with filters"
    roles: [PlatformAdmin, BankSponsor, ProgramManager, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: ["retailer_agreement_id?", "batch_status?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []

  - method: POST
    path: "/v1/settlement-batches/{id}/open"
    description: "Open a scheduled settlement period"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["batch_status=OPEN", "increments SettlementBatch.version by 1"]

  - method: POST
    path: "/v1/settlement-batches/{id}/settle"
    description: "Settle the batch, attaching funded loads and computing the payable"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementBatch
    side_effects:
      - "every FUNDED load in [period_start_at, period_end_at) → SETTLED and attached to this batch"
      - "gross_principal_cents, accrued_retailer_share_cents, net_fee_payable_cents, settlement_rounding_delta_cents, chargeback_total_cents, float_retained_cents computed"
      - "agreement.settled_fee_total_cents += accrued; accrual_pending_cents -= accrued"
      - "batch_status=SETTLED, settled_at = current logical clock"

  - method: POST
    path: "/v1/settlement-batches/{id}/clawback"
    description: "Claw back a settled batch and unwind its loads"
    roles: [SettlementOperator]
    code: 200
    input: ["reason?"]
    output: SettlementBatch
    side_effects:
      - "batch_status=CLAWED_BACK; every SETTLED load of the batch → REVERSED with reason RETAILER_REQUEST"
      - "hop 2..3: account window trips recomputed, OPEN STRUCTURING alerts dismissed, program counters recomputed"
      - "agreement.float_position_cents -= float_retained_cents; accrual_pending_cents restored"

  # --- FloatWindow ---
  - method: POST
    path: "/v1/float-windows"
    description: "Request an armored-carrier float delivery window for a location"
    roles: [SettlementOperator, ProgramManager]
    code: 201
    input: [reload_location_id, window_start_at, window_end_at, armored_carrier, float_amount_cents, "buffer_minutes?"]
    output: FloatWindow
    side_effects: ["window_status=REQUESTED"]

  - method: GET
    path: "/v1/float-windows/{id}"
    description: "Get a float window"
    roles: [PlatformAdmin, ProgramManager, ComplianceAnalyst, ComplianceOfficer, SettlementOperator, RetailerClerk]
    code: 200
    input: []
    output: FloatWindow
    side_effects: []

  - method: GET
    path: "/v1/float-windows"
    description: "List float windows with filters"
    roles: [PlatformAdmin, ProgramManager, SettlementOperator, RetailerClerk]
    code: 200
    input: ["reload_location_id?", "window_status?", "limit?", "offset?"]
    output: FloatWindow[]
    side_effects: []

  - method: POST
    path: "/v1/float-windows/{id}/confirm"
    description: "Confirm a requested float delivery window"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: FloatWindow
    side_effects: ["window_status=CONFIRMED", "increments FloatWindow.version by 1"]

  - method: POST
    path: "/v1/float-windows/{id}/cancel"
    description: "Cancel a requested or confirmed float window"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: FloatWindow
    side_effects: ["window_status=CANCELLED", "increments FloatWindow.version by 1"]

  - method: POST
    path: "/v1/float-windows/{id}/complete"
    description: "Complete a confirmed float delivery and credit the retailer float position"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: FloatWindow
    side_effects: ["window_status=COMPLETED", "retailer_agreement.float_position_cents += float_amount_cents"]

  # --- Test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock never falls back to wall-clock time; before any call to this endpoint every deadline, epoch index, trailing window and due-date rule reads that fixed default instant."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock = current_utc"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_ENTITY_NOT_FOUND, http: 404, condition: "A path resource id does not resolve to a stored row" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "A body FK id does not resolve to a stored row" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The resource's current status does not permit the requested transition, or a precondition on a related entity fails" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "A transition is attempted from a terminal state, or a second terminal write is attempted on the same row" }
  - { id: ERR_PROGRAM_FROZEN, http: 409, condition: "A write targeting a child of a program whose compliance_posture == FROZEN" }
  - { id: ERR_PROGRAM_RESTRICTED, http: 409, condition: "An onboard, re-fund, re-instate or float operation against a program whose compliance_posture == RESTRICTED" }
  - { id: ERR_PROGRAM_POSTURE_TRANSITION_BLOCKED, http: 409, condition: "The requested posture move is not eligible at the program's current posture_score (below 4.00 cannot move to RESTRICTED, below 60.00 cannot move to FROZEN, above 3.99 cannot move to OPEN)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "A load or settlement operation against a retailer agreement whose agreement_status != ACTIVE" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "A funding-affecting operation against a card account whose compliance_hold_status == FROZEN" }
  - { id: ERR_AML_ALERT_PENDING, http: 409, condition: "An operation requiring a clear account while a non-terminal AML alert references it" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The confirming X-User-ID equals the alert's raised_by_analyst_id or assigned_analyst_id" }
  - { id: ERR_PER_TRANSACTION_LIMIT_EXCEEDED, http: 422, condition: "principal_cents exceeds the location's effective per-transaction limit" }
  - { id: ERR_DAILY_LOCATION_LIMIT_EXCEEDED, http: 422, condition: "The load's posted total would push the location's daily accepted total past the agreement's daily location limit" }
  - { id: ERR_MINIMUM_LOAD_AMOUNT, http: 422, condition: "principal_cents is below the 100-cent minimum load principal" }
  - { id: ERR_VELOCITY_LIMIT_EXCEEDED, http: 422, condition: "The load would push the account's or location's window trip past the velocity transaction or amount limit under the active variant" }
  - { id: ERR_STRUCTURING_SUSPECTED, http: 422, condition: "The load makes the account's trailing window satisfy the structuring predicate (3 or more sub-threshold loads summing to at least 27000 cents)" }
  - { id: ERR_STRUCTURING_BAND, http: 422, condition: "A load whose principal falls inside the sub-threshold band is attempted while the account's structuring count is already at or above the structuring transaction count" }
  - { id: ERR_LOCATION_NOT_OPEN, http: 409, condition: "A load or float operation against a reload location whose location_status != OPEN" }
  - { id: ERR_CONTRACT_VERSION_LOCKED, http: 409, condition: "A renegotiation write against an agreement already cited by a POSTED or RECOVERED loss allocation" }
  - { id: ERR_BRAND_ONBOARDING_INCOMPLETE, http: 422, condition: "A brand partner is moved to ACTIVE while its onboarding checklist for the declared services scope is incomplete" }
  - { id: ERR_RETAILER_NOT_PARTY, http: 403, condition: "A retailer response against a dispute whose load belongs to another retailer's agreement" }
  - { id: ERR_DISPUTE_RESPONSE_WINDOW_CLOSED, http: 409, condition: "A retailer response submitted after the dispute's retailer_response_due_at" }
  - { id: ERR_LOSS_ALLOCATION_MISMATCH, http: 422, condition: "The three allocation shares do not sum exactly to total_loss_cents" }
  - { id: ERR_SETTLEMENT_NOT_SETTLED, http: 409, condition: "A clawback attempted on a batch whose batch_status != SETTLED" }
  - { id: ERR_SETTLEMENT_PERIOD_OVERLAP, http: 409, condition: "A settlement batch is opened while another batch of the same agreement is already OPEN" }
  - { id: ERR_SETTLEMENT_EMPTY_PERIOD, http: 422, condition: "A batch is settled with no FUNDED load inside its period" }
  - { id: ERR_LOAD_OUTSIDE_SETTLEMENT_PERIOD, http: 409, condition: "A load's funded_at falls outside the batch period being settled" }
  - { id: ERR_LOAD_NOT_REVERSED, http: 409, condition: "A re-instatement attempted on a load whose load_status != REVERSED" }
  - { id: ERR_FLOAT_WINDOW_OVERLAP, http: 409, condition: "A float window, including its buffer on both sides, overlaps a non-cancelled float window of the same location" }
  - { id: ERR_FLOAT_CAP_EXCEEDED, http: 422, condition: "Completing a float window would push the agreement's float position past the float cap" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "An expected_*_version input does not match the current version of the parent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required field is missing, an enum member is invalid, or an arithmetic/enum payload constraint fails" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Benchmark operator holding the platform's cross-tenant administrative surface; the only role that can register banks, create programs, or set the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/bank-sponsors"
      - "POST /v1/programs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /v1/brand-partners"
      - "POST /v1/retailer-agreements"
      - "POST /v1/reload-locations"
      - "POST /v1/card-accounts"
      - "POST /v1/settlement-batches"
      - "POST /v1/loss-allocations"
      - "POST /v1/programs/{id}/state"
      - "POST /v1/programs/{id}/oversight-review"
      - "all GET endpoints"

  - name: BankSponsor
    description: "The chartered bank of record for a program; owns posture transitions and oversight reviews for the programs it sponsors"
    identity: entity_backed:BankSponsor
    exclusive_operations:
      - "POST /v1/programs/{id}/state (only for a program whose sponsor_bank_id equals X-User-ID)"
    shared_operations:
      - "POST /v1/programs/{id}/oversight-review (only for a program whose sponsor_bank_id equals X-User-ID)"
      - "all GET endpoints"

  - name: ProgramManager
    description: "The program-manager operator for a program; owns retailer agreements, reload locations and card accounts"
    identity: entity_backed:Program
    exclusive_operations:
      - "POST /v1/retailer-agreements/{id}/state (only for an agreement whose program_id equals X-User-ID)"
      - "POST /v1/reload-locations/{id}/state (only for a location whose agreement's program_id equals X-User-ID)"
    shared_operations:
      - "POST /v1/retailer-agreements"
      - "POST /v1/reload-locations"
      - "POST /v1/card-accounts"
      - "POST /v1/float-windows"
      - "all GET endpoints"

  - name: RetailerClerk
    description: "A clerk at a reload location's retailer; the only role that can accept cash and fund a load, and the role that answers disputes"
    identity: entity_backed:RetailerAgreement
    exclusive_operations:
      - "POST /v1/load-transactions (only for a location under the clerk's retailer agreement)"
      - "POST /v1/load-transactions/{id}/fund"
      - "POST /v1/load-transactions/{id}/decline"
    shared_operations:
      - "POST /v1/disputes"
      - "POST /v1/disputes/{id}/retailer-response (only where the clerk's retailer agreement is party to the load)"
      - "all GET endpoints except GET /v1/aml-alerts and GET /v1/aml-alerts/{id}"

  - name: ComplianceAnalyst
    description: "AML monitoring operator; raises and works alerts, reverses loads, freezes accounts and negotiates dispute rounds"
    identity: opaque
    exclusive_operations:
      - "POST /v1/aml-alerts"
      - "POST /v1/aml-alerts/{id}/review"
      - "POST /v1/aml-alerts/{id}/return"
      - "POST /v1/disputes/{id}/return-to-retailer"
      - "POST /v1/disputes/{id}/escalate"
    shared_operations:
      - "POST /v1/aml-alerts/{id}/confirm"
      - "POST /v1/card-accounts/{id}/hold"
      - "POST /v1/load-transactions/{id}/reverse"
      - "POST /v1/disputes"
      - "POST /v1/disputes/{id}/program-review"
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Senior compliance operator holding the confirm, allocate and resolve surface; may not confirm an alert it raised or worked"
    identity: opaque
    exclusive_operations:
      - "POST /v1/aml-alerts/{id}/confirm"
      - "POST /v1/aml-alerts/{id}/reopen"
      - "POST /v1/aml-alerts/{id}/dismiss"
      - "POST /v1/disputes/{id}/resolve"
      - "POST /v1/disputes/{id}/close"
      - "POST /v1/loss-allocations/{id}/post"
      - "POST /v1/load-transactions/{id}/reinstate"
    shared_operations:
      - "POST /v1/brand-partners/{id}/state"
      - "POST /v1/brand-partners"
      - "POST /v1/card-accounts/{id}/hold"
      - "POST /v1/load-transactions/{id}/reverse"
      - "POST /v1/loss-allocations"
      - "POST /v1/disputes/{id}/program-review"
      - "all GET endpoints"

  - name: SettlementOperator
    description: "Settlement and float operator; owns batch lifecycle, clawbacks, loss recovery and armored-carrier float windows"
    identity: opaque
    exclusive_operations:
      - "POST /v1/settlement-batches"
      - "POST /v1/settlement-batches/{id}/open"
      - "POST /v1/settlement-batches/{id}/settle"
      - "POST /v1/settlement-batches/{id}/clawback"
      - "POST /v1/float-windows/{id}/confirm"
      - "POST /v1/float-windows/{id}/cancel"
      - "POST /v1/float-windows/{id}/complete"
      - "POST /v1/loss-allocations/{id}/recover"
    shared_operations:
      - "POST /v1/float-windows"
      - "all GET endpoints"