# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7; everything §1.8 already covers is
# emitted as an excluded_because stub. Sections and claim types follow
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: account_creation_defaults
        claim_type: creation
        grounds: [entities.Account]
        distinguishing_aspect: "A fresh account materializes with system defaults: credit_hold false, credit_balance_cents 0, version 1, and a prefix-free UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab One", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id, v: $.data.version, hold: $.data.credit_hold, bal: $.data.credit_balance_cents }
          trigger: []
          assert:
            - "v == 1 and hold == false and bal == 0"
            - "acct matches the bare-UUID shape (no type prefix such as acct_)"
      - name: account_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Account.fields.regulatory_class"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting regulatory_class (an input field with no default) is rejected with ERR_INVALID_REQUEST; nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Two", region: "NA" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"
      - name: kit_capacity_computed_input_ignored
        claim_type: computed_fields
        grounds: [calculations.kit_capacity_calc, entities.ReagentKit.fields.capacity_gb]
        distinguishing_aspect: "capacity_gb is server-computed from flow cell x chemistry (FC_MID 120 x V2 1.5 = 180.0); a client-supplied capacity_gb of 999 is ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-CAP", run_type: "STD_LONG", flow_cell_version: "FC_MID", chemistry_version: "V2", regulatory_clearance: "RUO_ONLY", shelf_life_days: 90, cold_chain_class: "REFRIGERATED_4", price_cents: 9000, samples_per_kit: 24, min_model_generation: 1, capacity_gb: 999 }
              as: PlatformAdmin
              captures: { cap: $.data.capacity_gb }
          assert:
            - "cap == 180.0 (120 * 1.5), not the client-sent 999"
      - name: instrument_duplicate_serial_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_DUPLICATE_SERIAL]"
        distinguishing_aspect: "serial_number is globally unique; reusing SN-DUP-1 across different accounts still conflicts."
        test_recipe:
          setup: ["two accounts and one model; first instrument with serial SN-DUP-1 registered"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Dup A", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acctA: $.data.id }
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Dup B", regulatory_class: "RUO", region: "EU" }
              as: AccountManager
              captures: { acctB: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acctA}", model_id: "${mdl}", serial_number: "SN-DUP-1", regulatory_mode: "RUO" }
              as: AccountManager
          trigger:
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acctB}", model_id: "${mdl}", serial_number: "SN-DUP-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_SERIAL (http 409)"
      - name: instrument_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a well-formed but absent instrument id yields ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /genomics/instruments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"
      - name: lot_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "The lot list honors the fixed envelope pagination: default limit 10 with total_count and has_more; limit=5&offset=10 returns the tail page of 1."
        test_recipe:
          setup: ["one kit; eleven lots registered under it"]
          setup_api_calls:
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-PG", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-01", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-02", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-03", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-04", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-05", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-06", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-07", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-08", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-09", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-10", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "PG-11", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
          trigger:
            - call: "GET /genomics/reagent-lots?kit_id=${kit}"
              as: SupplyPlanner
            - call: "GET /genomics/reagent-lots?kit_id=${kit}&limit=5&offset=10"
              as: SupplyPlanner
          assert:
            - "first page: response_type == array, 10 data rows, total_count == 11, has_more == true (envelope defaults limit 10)"
            - "tail page: 1 data row, total_count == 11, has_more == false"
      - name: run_record_immutable_surface
        claim_type: immutability
        grounds: [entities.RunRecord]
        distinguishing_aspect: "RunRecord declares common_fields false: its read surface carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["RUO account; OPERATIONAL instrument; QC_PASSED lot; ACTIVE license"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Imm", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-IM", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-IM-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LIM", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/software-licenses"
              payload: { account_id: "${acct}" }
              as: FinanceAdmin
              captures: { lic: $.data.id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "ACTIVATE" }
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/run-records"
              payload: { instrument_id: "${inst}", lot_id: "${lot}", license_id: "${lic}", run_at: "2026-09-10T00:00:00Z", run_mode: "STD_SHORT", analysis_mode: "LOCAL", samples_count: 8, output_gb: 2.0, outcome: "SUCCESS" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { run: $.data.id }
            - call: "GET /genomics/run-records?instrument_id=${inst}"
              as: LabOperator
              as_user_id: "${acct}"
          assert:
            - "run is a bare UUID; the created run record exposes id and created_at"
            - "the run record data has NO version field and NO updated_at field (common_fields false)"
            - "the list read returns exactly 1 row whose id == ${run}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: instrument_initial_state_ordered
        claim_type: initial_state
        grounds: [state_machines.Instrument]
        distinguishing_aspect: "A newly registered instrument starts in ORDERED with software_version 1.0.0 and empty applied_update_ids."
        test_recipe:
          setup: ["account and model exist"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Init", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
          trigger:
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-IN-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { st: $.data.install_state, sw: $.data.software_version }
          assert:
            - "st == ORDERED and sw == 1.0.0"
      - name: instrument_install_before_ship_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Instrument"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "INSTALL is defined only from SHIPPED; firing it on an ORDERED instrument is ERR_INVALID_STATE with no state change."
        test_recipe:
          setup: ["account, model, and an ORDERED instrument"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Ord", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-OR-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (http 409); the instrument remains ORDERED"
      - name: instrument_decommissioned_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Instrument]
        distinguishing_aspect: "DECOMMISSIONED is terminal: a subsequent SERVICE_OPEN (and any other event) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPERATIONAL instrument decommissioned by the AccountManager (no contracts attached)"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Term", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-TE-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "DECOMMISSION" }
              as: AccountManager
          trigger:
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; Instrument.${inst}.install_state remains DECOMMISSIONED"
      - name: order_double_submit_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReagentOrder"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "SUBMIT is defined only from DRAFT; a second SUBMIT on the ALLOCATED order fails with ERR_INVALID_STATE (no double reservation)."
        test_recipe:
          setup: ["account; kit with a QC_PASSED lot of 10; order of 2 SUBMITTED to ALLOCATED"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab DS", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-DS", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LDS", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-DS", quantity: 2 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
          trigger:
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; lot ${lot}.reserved_units remains 2 (no double reservation)"
      - name: lot_expiry_sweep_releases_and_backorders
        claim_type: side_effect_execution
        grounds: [state_machines.ReagentLot.QC_PASSED_to_EXPIRED, state_machines.ReagentOrder.ALLOCATED_to_BACKORDERED]
        distinguishing_aspect: "Advancing the clock past a lot's expiry_date flips it EXPIRED and runs the same release-and-backorder cascade as a QC failure: reserved order goes BACKORDERED with reservations emptied."
        test_recipe:
          setup: ["kit shelf 60d; lot manufactured 2026-07-07 (expiry 2026-09-05); QC_PASSED; order of 2 ALLOCATED against it"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Exp", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-EX", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LEX", manufacture_date: "2026-07-07T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-EX", quantity: 2 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
          trigger:
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { expired: $.data.lots_expired }
            - call: "GET /genomics/reagent-lots/${lot}"
              as: SupplyPlanner
              captures: { lot_qc: $.data.qc_status, lot_res: $.data.reserved_units }
            - call: "GET /genomics/reagent-orders/${ord}"
              as: SupplyPlanner
              captures: { ord_state: $.data.order_state }
          assert:
            - "expired == 1"
            - "lot_qc == EXPIRED and lot_res == 0"
            - "ord_state == BACKORDERED (cascade fired from the clock sweep, no direct order call)"
      - name: contract_expiry_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceContract.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "An ACTIVE contract whose coverage_end the clock reaches (coverage_end <= now) flips to EXPIRED via the sweep with no direct contract call."
        test_recipe:
          setup: ["account; instrument; ACTIVE contract with coverage [2026-09-01, 2026-09-10)"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab CE", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-CE-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2026-09-10T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000 }
              as: FinanceAdmin
              captures: { ctr: $.data.id }
            - call: "POST /genomics/service-contracts/${ctr}/activate"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { n_exp: $.data.contracts_expired }
            - call: "GET /genomics/service-contracts/${ctr}"
              as: FinanceAdmin
              captures: { st: $.data.contract_state }
          assert:
            - "n_exp == 1 and st == EXPIRED (coverage_end <= clock is inclusive of the end instant)"
      - name: transition_enrolled_expiry_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.TransitionProgram.ENROLLED_to_EXPIRED]
        distinguishing_aspect: "An ENROLLED transition program whose enrollment_window_end passes without appraisal flips to EXPIRED via the clock sweep."
        test_recipe:
          setup: ["account; old instrument (gen 2); new model gen 3; transition enrolled with window end 2026-09-10"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab TE", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-200", generation: 2, base_price_cents: 4000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { m_old: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-300", generation: 3, base_price_cents: 5000000, supported_chemistry_versions: ["V1", "V2"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { m_new: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${m_old}", serial_number: "SN-TE-9", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
