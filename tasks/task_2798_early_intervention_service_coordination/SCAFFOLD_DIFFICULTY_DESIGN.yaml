        distinguishing_aspect: |
          This instance pins HALF-OPEN datetime semantics on the provider's calendar, where the answer
          is the opposite of the authorization case: a 09:30-10:00 session may start exactly when the
          09:00-09:30 session ends when the setting is unchanged, but a 10:00-10:30 session in a
          different setting collides because the 30-minute travel buffer widens the interval, and only
          at 10:30-11:00 does the cross-setting session fit. Three outcomes (allow, deny, allow) come
          from three requests that differ only by 30 minutes and a setting_code. The other
          resource_temporal_overlap instance uses CLOSED date intervals with no buffer.
