              as: ComplianceAnalyst
              captures: { en_err: $.data.error_id }
          assert:
            - "en_err == \"ERR_VALIDATION\""

      - name: complaint_missing_damages_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_VALIDATION]", entities.CustomerComplaint.fields.damages_claimed_cents]
        distinguishing_aspect: "Required-field: omitting damages_claimed_cents is rejected before any business rule runs."
        test_recipe:
          setup: ["One rep"]
