        grounds:
          - state_machines.SalesReport.ACCEPTED_to_UNDER_AUDIT
          - state_machines.SalesReport.UNDER_AUDIT_to_DISPUTED
          - state_machines.SalesReport.DISPUTED_to_AMENDED
          - state_machines.SalesReport.AMENDED_to_SUBMITTED
