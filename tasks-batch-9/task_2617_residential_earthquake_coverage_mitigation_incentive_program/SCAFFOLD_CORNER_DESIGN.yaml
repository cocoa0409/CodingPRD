          - calculations.take_up_rate_evaluation
        excluded_because:
          difficulty_instance: take_up_rate_exactly_at_floor_does_not_downgrade_but_one_offer_later_does
          rationale: "That §1.8 boundary_precision_check instance already tests the TAKE_UP_FLOOR_BP threshold at value-1, exactly at value, and value+1 in basis points, together with the MIN_OFFER_SAMPLE gate that suppresses any downgrade on a small sample. It is the threshold claim for this calculation."

