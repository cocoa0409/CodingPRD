# =============================================================================
# PRD Benchmark Seed Tables — Lighting & Fan Showroom (Expert)
# SCAFFOLD.yaml — §1.0 through §1.7 (+ preamble)
# =============================================================================

scenario: |
  1013. Lighting & Fan Showroom: fixture SKU & config, design consult & lighting plan,
  special order & lead time, install-referral & delivery, trade/designer account,
  return/damage, energy/rebate, warranty

domain_name: lighting-fan-showroom
# Flat multi-collection API: entities live at root-level collections (/orders,
# /fixture-models, /trade-accounts, ...). api_prefix is the empty root so every
# top-level collection is mounted directly.
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; Order is the busiest hub but children
  # are addressed at their own root collections, not deeply nested URL paths.

  state_machine_shape: parallel
  # Order carries two independent state axes (fulfillment_status × payment_status).
  # DesignConsult adds a cyclic revision loop; the rest are branching pipelines.

  relationship_patterns:
    - one_to_many          # Order -> OrderLine; RebateProgram -> RebateClaim
    - cross_aggregate      # OrderLine -> FixtureModel; InstallReferral -> DeliveryJob
    - polymorphic: false

  role_model: hierarchical_override
  # StoreManager is a superset operator (authorized on every endpoint).
  # ShowroomAssociate = sales floor, FulfillmentCoordinator = delivery/install,
  # Designer = entity-backed trade-account holder acting on own resources.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TradeAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Trade/designer business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Store-issued credit ceiling in cents" }
      - { name: available_credit_cents, type: integer, source: computed, description: "= credit_limit_cents - sum(Order.committed_credit_cents for this account's Orders with fulfillment_status == CONFIRMED)" }
      - { name: annual_spend_cents, type: integer, source: computed, default: 0, description: "Sum of total_final_cents over this account's Orders whose payment_status == SETTLED and whose settled_at is within the trailing 365 days of the logical clock" }
      - { name: tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | SILVER | GOLD — recomputed from annual_spend_cents on every SETTLEMENT payment; GOLD if annual_spend_cents >= 5000000, SILVER if >= 2000000, else STANDARD" }
      - { name: discount_pct, type: number, source: computed, default: 0, description: "Tier -> pct: STANDARD 0.00, SILVER 0.08, GOLD 0.15" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED — set via PATCH by StoreManager" }

  - name: FixtureModel
    parent: null
    common_fields: true
    fields:
      - { name: sku_base, type: string, source: input, description: "Base SKU code (option suffixes appended per configuration)" }
      - { name: category, type: enum, source: input, description: "CEILING_FAN | CHANDELIER | PENDANT | SCONCE | RECESSED" }
      - { name: base_price_cents, type: integer, source: input, description: "Base list price of the unconfigured fixture" }
      - { name: base_wattage, type: integer, source: input, description: "Base fixture wattage" }
      - { name: energy_star, type: boolean, source: input, default: false, description: "True if the model is ENERGY STAR certified (rebate eligibility gate)" }
      - { name: special_order_only, type: boolean, source: input, default: false, description: "True if the model is never in-stock and always requires a SpecialOrder" }
      - { name: supplier_lead_days, type: integer, source: input, default: 0, description: "Default supplier lead time in days for special orders of this model" }
      - { name: options, type: array, source: input, description: "Array of config-option objects: { option_id (string), group (enum FINISH|BLADE_SPAN|DOWNROD|GLASS|CONTROL), label, price_delta_cents (integer), wattage_delta (integer), sku_suffix (string) }" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: trade_account_id, type: string, source: input, default: null, description: "FK -> TradeAccount.id; null for a retail (non-trade) order" }
      - { name: customer_name, type: string, source: input, description: "End customer name for the order" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "Axis 1: DRAFT | QUOTED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Axis 2 (independent of fulfillment): UNPAID | DEPOSIT_PAID | SETTLED | REFUNDED" }
      - { name: subtotal_estimate_cents, type: integer, source: computed, default: 0, description: "Provisional subtotal over ACTIVE lines, computed at quote time" }
      - { name: discount_estimate_cents, type: integer, source: computed, default: 0, description: "Provisional trade discount at quote time (tier observed at quote)" }
      - { name: total_estimate_cents, type: integer, source: computed, default: 0, description: "= subtotal_estimate_cents - discount_estimate_cents (provisional)" }
      - { name: subtotal_final_cents, type: integer, source: computed, default: null, description: "Final subtotal over ACTIVE (non-RETURNED/CANCELLED) lines, computed at SETTLEMENT" }
      - { name: discount_final_cents, type: integer, source: computed, default: null, description: "Final trade discount at SETTLEMENT (tier observed at settlement time)" }
      - { name: total_final_cents, type: integer, source: computed, default: null, description: "= subtotal_final_cents - discount_final_cents (final)" }
      - { name: committed_credit_cents, type: integer, source: system, default: 0, description: "Trade credit committed at confirm (= total_estimate_cents at confirm); released to 0 on cancel/complete" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Running sum of recorded payment amounts" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when payment_status became SETTLED" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: fixture_model_id, type: string, source: input, description: "FK -> FixtureModel.id" }
      - { name: selected_option_ids, type: array, source: input, default: [], description: "Subset of the fixture's options[].option_id chosen for this configuration" }
      - { name: configured_sku, type: string, source: computed, description: "fixture.sku_base with each selected option's sku_suffix appended in options[] declaration order" }
      - { name: quantity, type: integer, source: input, description: "Unit count (must be >= 1)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "= FixtureModel.base_price_cents + sum(selected options' price_delta_cents)" }
      - { name: is_special_order, type: boolean, source: computed, description: "= FixtureModel.special_order_only" }
      - { name: line_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETURNED | CANCELLED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id (the line requiring supplier fulfillment)" }
      - { name: supplier_lead_days, type: integer, source: input, description: "Promised supplier lead time in days" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | READY | CANCELLED" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when status became CONFIRMED" }
      - { name: estimated_ready_date, type: datetime, source: computed, default: null, description: "Forward-looking: = confirmed_at + supplier_lead_days (set at confirm)" }
      - { name: actual_ready_date, type: datetime, source: system, default: null, description: "Logical-clock timestamp when status became READY" }
      - { name: variance_days, type: integer, source: computed, default: null, description: "= floor((actual_ready_date - estimated_ready_date) in whole days); set at READY" }

  - name: DesignConsult
    parent: null
    common_fields: true
    fields:
      - { name: trade_account_id, type: string, source: input, description: "FK -> TradeAccount.id (the designer/account the consult belongs to)" }
      - { name: order_id, type: string, source: input, default: null, description: "FK -> Order.id; null until a plan is tied to an order" }
      - { name: room_type, type: string, source: input, description: "Room being lit (e.g., KITCHEN, GREAT_ROOM)" }
      - { name: fee_cents, type: integer, source: input, default: 0, description: "Consultation fee in cents" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | IN_REVIEW | REVISION | APPROVED (cyclic: IN_REVIEW -> REVISION -> IN_REVIEW)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times the plan re-entered REVISION; incremented on each request-revision" }

  - name: Installer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Installer / crew name" }
      - { name: service_area, type: string, source: input, description: "Service area label" }
      - { name: daily_capacity, type: integer, source: input, default: 3, description: "Max concurrent scheduled appointments used by capacity accounting" }
      - { name: active_referral_count, type: integer, source: system, default: 0, description: "Count of this installer's InstallReferrals currently in {REFERRED, SCHEDULED}; +1 on referral create, -1 when a referral leaves to COMPLETED/WITHDRAWN" }

  - name: InstallReferral
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id" }
      - { name: delivery_job_id, type: string, source: input, description: "FK -> DeliveryJob.id (the delivery this install depends on)" }
      - { name: appointment_start, type: datetime, source: input, default: null, description: "Appointment window start (set at schedule)" }
      - { name: appointment_end, type: datetime, source: input, default: null, description: "Appointment window end (set at schedule; half-open [start,end))" }
      - { name: status, type: enum, source: system, default: "REFERRED", description: "REFERRED | SCHEDULED | COMPLETED | WITHDRAWN" }

  - name: DeliveryTruck
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Truck / route name" }
      - { name: capacity_units, type: integer, source: input, default: 20, description: "Truck capacity in fixture units" }

  - name: DeliveryJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: delivery_truck_id, type: string, source: input, description: "FK -> DeliveryTruck.id" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (closed interval; BUFFER_MINUTES gap required between windows on one truck)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | DELIVERED | VOIDED" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id being returned (whole line)" }
      - { name: reason, type: enum, source: input, description: "DAMAGE | DEFECTIVE | CHANGED_MIND | WARRANTY" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REFUNDED | DENIED" }
      - { name: restocking_fee_cents, type: integer, source: computed, default: null, description: "Set at approve; 0 for DAMAGE/DEFECTIVE/WARRANTY; for CHANGED_MIND: 0 if days_since_delivery <= RESTOCK_GRACE_DAYS else round_half_up(line_value_cents * RESTOCK_FEE_PCT)" }
      - { name: refund_cents, type: integer, source: computed, default: null, description: "Set at refund; = line_value_cents - restocking_fee_cents, where line_value_cents = OrderLine.unit_price_cents * OrderLine.quantity" }

  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Energy rebate program name" }
      - { name: rebate_rate, type: number, source: input, description: "Per-line rebate rate applied to unit_price_cents (e.g., 0.075)" }
      - { name: wattage_ceiling, type: integer, source: input, description: "A line is eligible only if the fixture's effective wattage <= this ceiling" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total funded budget for the program" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "= budget_total_cents - sum(RebateClaim.claimed_cents for claims whose status == APPROVED)" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: rebate_program_id, type: string, source: input, description: "FK -> RebateProgram.id" }
      - { name: claimed_cents, type: integer, source: computed, description: "Round-per-line-then-sum: sum over eligible ACTIVE lines of round_half_up(OrderLine.unit_price_cents * OrderLine.quantity * RebateProgram.rebate_rate)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | VOID | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: PARALLEL dimensions (fulfillment_status × payment_status) ----
  - entity: Order
    initial_state: "DRAFT (fulfillment) / UNPAID (payment)"
    terminal_states: [COMPLETED, CANCELLED, REFUNDED]
    note: |
      Two independent axes on one row. Transitions are named by axis; the two
      axes evolve independently except where a precondition names the other.
    transitions:
      # --- fulfillment axis ---
      - from: DRAFT
        to: QUOTED
        trigger: "POST /orders/{id}/quote"
        actor: ShowroomAssociate
        preconditions:
          - "fulfillment_status == DRAFT"
          - "expected_order_version == Order.version (OCC)"
        side_effects:
          - "recompute subtotal_estimate_cents / discount_estimate_cents / total_estimate_cents via order_pricing[ESTIMATE] using tier observed now"
          - "increments Order.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /orders/{id}/quote (re-quote supersedes prior quote)"
        actor: ShowroomAssociate
        preconditions:
          - "fulfillment_status == QUOTED"
          - "expected_order_version == Order.version (OCC)"
        side_effects:
          - "recompute estimate fields (supersedes the prior quote)"
          - "increments Order.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: ShowroomAssociate
        preconditions:
          - "fulfillment_status == QUOTED"
          - "if trade_account_id != null: TradeAccount.available_credit_cents >= total_estimate_cents"
        side_effects:
          - "set committed_credit_cents = total_estimate_cents (debits TradeAccount.available_credit_cents by that amount)"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: bubble-up when a linked DeliveryJob transitions to DELIVERED"
        actor: system
        preconditions:
          - "fulfillment_status == CONFIRMED"
        side_effects:
          - "release committed_credit_cents to 0 (restores TradeAccount.available_credit_cents)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ShowroomAssociate
        preconditions: ["fulfillment_status in {DRAFT, QUOTED, CONFIRMED}"]
        side_effects: ["set all non-terminal OrderLines line_status = CANCELLED"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ShowroomAssociate
        preconditions: ["fulfillment_status in {DRAFT, QUOTED, CONFIRMED}"]
        side_effects: ["set all non-terminal OrderLines line_status = CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ShowroomAssociate
        preconditions: ["fulfillment_status == CONFIRMED"]
        side_effects:
          - "release committed_credit_cents to 0 (restores TradeAccount.available_credit_cents) — COMPENSATES the confirm debit"
          - "set all non-terminal OrderLines line_status = CANCELLED"
          - "CASCADE link1: every non-terminal SpecialOrder with order_id == this Order -> CANCELLED"
          - "CASCADE link1: every DeliveryJob with order_id == this Order and status == SCHEDULED -> VOIDED"
      # --- payment axis ---
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /orders/{id}/payments (kind=DEPOSIT)"
        actor: ShowroomAssociate
        preconditions: ["payment_status == UNPAID", "fulfillment_status in {QUOTED, CONFIRMED}"]
        side_effects: ["amount_paid_cents += amount_cents"]
      - from: UNPAID
        to: SETTLED
        trigger: "POST /orders/{id}/payments (kind=SETTLEMENT)"
        actor: ShowroomAssociate
        preconditions: ["payment_status in {UNPAID, DEPOSIT_PAID}", "fulfillment_status == CONFIRMED"]
        side_effects:
          - "compute subtotal_final_cents / discount_final_cents / total_final_cents via order_pricing[FINAL] using tier observed now"
          - "amount_paid_cents += amount_cents; set settled_at = clock"
          - "add total_final_cents into TradeAccount.annual_spend_cents (post-settlement) then recompute TradeAccount.tier/discount_pct"
      - from: DEPOSIT_PAID
        to: SETTLED
        trigger: "POST /orders/{id}/payments (kind=SETTLEMENT)"
        actor: ShowroomAssociate
        preconditions: ["payment_status in {UNPAID, DEPOSIT_PAID}", "fulfillment_status == CONFIRMED"]
        side_effects:
          - "compute final pricing (as above); set settled_at; recompute account tier"
      - from: SETTLED
        to: REFUNDED
        trigger: "system: bubble-up when a full-line ReturnRequest reaches REFUNDED and all lines are RETURNED/CANCELLED"
        actor: system
        preconditions: ["payment_status == SETTLED", "every OrderLine.line_status in {RETURNED, CANCELLED}"]
        side_effects: ["mark order fully refunded"]

  # ---- SpecialOrder: branching pipeline with cross-entity guard + cascade sink ----
  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [READY, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /special-orders/{id}/confirm"
        actor: FulfillmentCoordinator
        preconditions:
          - "status == REQUESTED"
          - "CROSS-ENTITY: parent Order (order_id).fulfillment_status == CONFIRMED"
        side_effects:
          - "set confirmed_at = clock"
          - "set estimated_ready_date = confirmed_at + supplier_lead_days (special_order_lead_time[ESTIMATED])"
      - from: CONFIRMED
        to: READY
        trigger: "POST /special-orders/{id}/complete"
        actor: FulfillmentCoordinator
        preconditions: ["status == CONFIRMED"]
        side_effects:
          - "set actual_ready_date = clock"
          - "set variance_days = floor(actual_ready_date - estimated_ready_date) (special_order_lead_time[ACTUAL])"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system: cascade from Order cancel (link1)"
        actor: system
        preconditions: ["status in {REQUESTED, CONFIRMED}"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system: cascade from Order cancel (link1)"
        actor: system
        preconditions: ["status in {REQUESTED, CONFIRMED}"]
        side_effects: []

  # ---- DesignConsult: CYCLIC revision loop ----
  - entity: DesignConsult
    initial_state: REQUESTED
    terminal_states: [APPROVED]
    transitions:
      - from: REQUESTED
        to: IN_REVIEW
        trigger: "POST /design-consults/{id}/submit-review"
        actor: Designer
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: IN_REVIEW
        to: REVISION
        trigger: "POST /design-consults/{id}/request-revision"
        actor: Designer
        preconditions: ["status == IN_REVIEW"]
        side_effects: ["increment revision_count by 1"]
      - from: REVISION
        to: IN_REVIEW
        trigger: "POST /design-consults/{id}/submit-review (loop back after revising)"
        actor: Designer
        preconditions: ["status == REVISION"]
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /design-consults/{id}/approve"
        actor: StoreManager
        preconditions: ["status == IN_REVIEW"]
        side_effects: []

  # ---- DeliveryJob: pipeline; cross-entity create guard; cascade sink (VOIDED) ----
  - entity: DeliveryJob
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-jobs/{id}/deliver"
        actor: FulfillmentCoordinator
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "BUBBLE-UP: parent Order.fulfillment_status CONFIRMED -> COMPLETED (releases committed credit)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: cascade from Order cancel (link1)"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "CASCADE link2: every InstallReferral with delivery_job_id == this job and status in {REFERRED, SCHEDULED} -> WITHDRAWN"

  # ---- InstallReferral: pipeline; cross-entity schedule guard; overlap; cascade sink ----
  - entity: InstallReferral
    initial_state: REFERRED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: REFERRED
        to: SCHEDULED
        trigger: "POST /install-referrals/{id}/schedule"
        actor: FulfillmentCoordinator
        preconditions:
          - "status == REFERRED"
          - "CROSS-ENTITY: linked DeliveryJob (delivery_job_id).status == DELIVERED"
          - "TEMPORAL: appointment [start,end) does not overlap any SCHEDULED InstallReferral for the same installer_id (half-open; adjacency end==start allowed)"
        side_effects: ["set appointment_start/appointment_end (Installer.active_referral_count unchanged — referral remains active)"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /install-referrals/{id}/complete"
        actor: FulfillmentCoordinator
        preconditions: ["status == SCHEDULED"]
        side_effects: ["decrement Installer.active_referral_count by 1"]
      - from: REFERRED
        to: WITHDRAWN
        trigger: "system: cascade from DeliveryJob VOIDED (link2)"
        actor: system
        preconditions: ["status in {REFERRED, SCHEDULED}"]
        side_effects: ["CASCADE link3: decrement Installer.active_referral_count by 1"]
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "system: cascade from DeliveryJob VOIDED (link2)"
        actor: system
        preconditions: ["status in {REFERRED, SCHEDULED}"]
        side_effects: ["CASCADE link3: decrement Installer.active_referral_count by 1 (restores Installer availability)"]

  # ---- ReturnRequest: branching pipeline; cascade to line + order recompute ----
  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [REFUNDED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-requests/{id}/approve"
        actor: StoreManager
        preconditions:
          - "status == REQUESTED"
          - "CROSS-ENTITY: parent Order.payment_status in {DEPOSIT_PAID, SETTLED}"
          - "target OrderLine.line_status == ACTIVE"
        side_effects:
          - "compute restocking_fee_cents (restocking_refund)"
          - "CASCADE bizB link1: target OrderLine.line_status ACTIVE -> RETURNED"
          - "CASCADE bizB link2: recompute Order.subtotal_final_cents/total_final_cents over remaining ACTIVE lines"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /return-requests/{id}/approve with adjudication=DENY"
        actor: StoreManager
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: REFUNDED
        trigger: "POST /return-requests/{id}/refund"
        actor: StoreManager
        preconditions: ["status == APPROVED"]
        side_effects:
          - "compute refund_cents = line_value_cents - restocking_fee_cents"
          - "BUBBLE-UP: if every OrderLine of the order is RETURNED/CANCELLED, Order.payment_status SETTLED -> REFUNDED"

  # ---- RebateClaim: branching; budget debit + compensating restore ----
  - entity: RebateClaim
    initial_state: SUBMITTED
    terminal_states: [VOID, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rebate-claims/{id}/approve"
        actor: StoreManager
        preconditions:
          - "status == SUBMITTED"
          - "RebateProgram.budget_remaining_cents >= claimed_cents"
        side_effects:
          - "debit RebateProgram.budget_remaining_cents by claimed_cents (FORWARD action of budget invariant)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rebate-claims/{id}/approve with adjudication=DENY"
        actor: StoreManager
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: APPROVED
        to: VOID
        trigger: "POST /rebate-claims/{id}/void"
        actor: StoreManager
        preconditions: ["status == APPROVED"]
        side_effects:
          - "restore RebateProgram.budget_remaining_cents by claimed_cents (COMPENSATES the approve debit — budget invariant)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-supersede-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/quote"
    occ_field: "expected_order_version"
    description: |
      Generating a quote against an Order whose version has advanced since the
      client last observed it is rejected. A re-quote legitimately supersedes
      the prior quote (product allows QUOTED -> QUOTED), so a second quote would
      itself succeed on identical state; OCC on Order.version reduces the
      supersede to a stale-version check. If another writer added a line or
      re-quoted (bumping Order.version), the current writer's expected_order_version
      is stale and the write is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_unit_price
    trigger: "on POST /orders/{id}/lines (line creation) and whenever an order is quoted/settled"
    algorithm: aggregation
    formula: |
      unit_price_cents = FixtureModel.base_price_cents
                       + sum(opt.price_delta_cents for opt in FixtureModel.options
                             if opt.option_id in OrderLine.selected_option_ids)
      configured_sku   = FixtureModel.sku_base + concat(opt.sku_suffix for selected opts
                                                        in options[] declaration order)
    input_set: "the single OrderLine's fixture + its selected options"
    constants: {}
    precision: "integer cents (exact)"

  - name: order_pricing
    trigger: "ESTIMATE on POST /orders/{id}/quote; FINAL on POST /orders/{id}/payments kind=SETTLEMENT"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum(line.unit_price_cents * line.quantity
                           for line in Order lines if line.line_status == ACTIVE)
      pct            = TradeAccount.discount_pct if Order.trade_account_id != null else 0.00
      raw_discount   = round_half_up(subtotal_cents * pct)
      discount_cents = min(raw_discount, DISCOUNT_CAP_CENTS)      # non-linear cap (>=3 inputs: subtotal, pct, cap)
      total_cents    = subtotal_cents - discount_cents
    input_set: "ACTIVE OrderLines of the order; trade tier resolved at evaluation time"
    constants:
      DISCOUNT_CAP_CENTS: 200000
      STANDARD_PCT: 0.00
      SILVER_PCT: 0.08
      GOLD_PCT: 0.15
    precision: "2-place cents via round_half_up on the discount; totals are integer cents"
    variants:
      - name: ESTIMATE
        when: "at quote time (fulfillment DRAFT/QUOTED -> QUOTED)"
        difference: "writes subtotal_estimate_cents/discount_estimate_cents/total_estimate_cents; tier is the value observed at quote time; includes every ACTIVE line present at quote"
      - name: FINAL
        when: "at SETTLEMENT (payment -> SETTLED)"
        difference: "writes subtotal_final_cents/discount_final_cents/total_final_cents; tier is re-read at settlement (may have upgraded since quote); excludes lines that became RETURNED/CANCELLED after quote"

  - name: special_order_lead_time
    trigger: "ESTIMATED at POST /special-orders/{id}/confirm; ACTUAL at POST /special-orders/{id}/complete"
    algorithm: forward_looking
    formula: |
      estimated_ready_date = confirmed_at + supplier_lead_days       # forward projection
      actual_ready_date    = clock at READY transition               # chronological fact
      variance_days        = floor((actual_ready_date - estimated_ready_date) / 1 day)
    input_set: "the single SpecialOrder; confirmed_at and clock positions"
    constants: {}
    precision: "whole days (floor of the datetime delta)"
    variants:
      - name: ESTIMATED
        when: "at confirm"
        difference: "purely projected from confirmed_at + promised supplier_lead_days; independent of when production actually finishes"
      - name: ACTUAL
        when: "at complete (READY)"
        difference: "the real logical-clock instant of READY; variance_days = signed difference vs ESTIMATED (positive = late)"

  - name: rebate_amount
    trigger: "on POST /rebate-claims (claim submission)"
    algorithm: weighted_scoring
    formula: |
      eligible(line) = FixtureModel(line.fixture_model_id).energy_star == true
                       AND effective_wattage(line) <= RebateProgram.wattage_ceiling
                       AND line.line_status == ACTIVE
      effective_wattage(line) = FixtureModel.base_wattage
                              + sum(opt.wattage_delta for selected opts)
      # ROUND PER LINE, THEN SUM (pinned order; sum-then-round is WRONG here):
      per_line(line) = round_half_up(line.unit_price_cents * line.quantity * RebateProgram.rebate_rate)
      claimed_cents  = sum(per_line(line) for line in Order lines if eligible(line))
    input_set: "ACTIVE OrderLines of the claim's order that pass the energy_star + wattage gate"
    constants: {}
    precision: "round_half_up per line to integer cents, THEN sum (order pinned)"

  - name: trade_tier_and_credit
    trigger: "annual_spend/tier recomputed on SETTLEMENT; available_credit recomputed on confirm/cancel/complete and on read"
    algorithm: threshold
    formula: |
      annual_spend_cents = sum(o.total_final_cents for o in account Orders
                               if o.payment_status == SETTLED
                               and o.settled_at >= clock - 365 days)
      tier = GOLD   if annual_spend_cents >= GOLD_THRESHOLD_CENTS
             SILVER if annual_spend_cents >= SILVER_THRESHOLD_CENTS
             STANDARD otherwise
      available_credit_cents = credit_limit_cents
                             - sum(o.committed_credit_cents for o in account Orders
                                   if o.fulfillment_status == CONFIRMED)
    input_set: "the account's SETTLED orders (for spend/tier) and CONFIRMED orders (for committed credit)"
    constants:
      GOLD_THRESHOLD_CENTS: 5000000
      SILVER_THRESHOLD_CENTS: 2000000
    precision: "integer cents; threshold comparison is inclusive (>=)"

  - name: restocking_refund
    trigger: "restocking_fee at POST /return-requests/{id}/approve; refund at POST /return-requests/{id}/refund"
    algorithm: threshold
    formula: |
      line_value_cents = OrderLine.unit_price_cents * OrderLine.quantity
      days_since_delivery = floor((clock - DeliveryJob.window_end_of_order) / 1 day)   # if no delivery, treated as 0
      if reason in {DAMAGE, DEFECTIVE, WARRANTY}: pct = 0.00
      elif reason == CHANGED_MIND:
           pct = 0.00 if days_since_delivery <= RESTOCK_GRACE_DAYS else RESTOCK_FEE_PCT
      restocking_fee_cents = round_half_up(line_value_cents * pct)
      refund_cents = line_value_cents - restocking_fee_cents
    input_set: "the single returned OrderLine + its order's delivery timing"
    constants:
      RESTOCK_FEE_PCT: 0.20
      RESTOCK_GRACE_DAYS: 14
    precision: "round_half_up to integer cents; grace boundary uses <= (inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "role is authorized for this endpoint per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "path-referenced resource exists (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all /{id} endpoints" }
  - { priority: 4, category: existence, check: "body-referenced FK entity exists (trade_account_id, fixture_model_id, order_id, order_line_id, installer_id, delivery_truck_id, delivery_job_id, rebate_program_id)", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "create endpoints" }
  - { priority: 5, category: business_constraint, check: "required fields present and enums/types valid (quantity>=1, valid category/reason/kind, valid selected_option_ids all in fixture.options)", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: all }
  - { priority: 8, category: state, check: "OCC: expected_order_version == Order.version on quote", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /orders/{id}/quote" }
  - { priority: 9, category: state, check: "adding a line requires Order.fulfillment_status == DRAFT", error_id: ERR_ORDER_NOT_DRAFT, http_status: 409, applies_to: "POST /orders/{id}/lines" }
  - { priority: 10, category: state, check: "target resource is in a state that permits the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 12, category: business_referential, check: "SpecialOrder confirm requires parent Order.fulfillment_status == CONFIRMED", error_id: ERR_ORDER_NOT_CONFIRMED, http_status: 409, applies_to: "POST /special-orders/{id}/confirm" }
  - { priority: 20, category: business_referential, check: "InstallReferral schedule requires linked DeliveryJob.status == DELIVERED", error_id: ERR_DELIVERY_NOT_READY, http_status: 409, applies_to: "POST /install-referrals/{id}/schedule" }
  - { priority: 25, category: business_temporal, check: "InstallReferral appointment [start,end) must not overlap another SCHEDULED referral for the same installer (adjacency allowed)", error_id: ERR_INSTALLER_UNAVAILABLE, http_status: 409, applies_to: "POST /install-referrals/{id}/schedule" }
  - { priority: 26, category: business_temporal, check: "DeliveryJob window must be >= BUFFER_MINUTES from every other non-VOIDED window on the same truck (buffer semantics)", error_id: ERR_TRUCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /delivery-jobs" }
  - { priority: 28, category: business_referential, check: "DeliveryJob create requires parent Order.fulfillment_status in {CONFIRMED, COMPLETED}", error_id: ERR_ORDER_NOT_CONFIRMED, http_status: 409, applies_to: "POST /delivery-jobs" }
  - { priority: 30, category: business_safety, check: "RebateClaim submission must have >= 1 eligible line (energy_star + wattage gate)", error_id: ERR_NO_ELIGIBLE_ITEMS, http_status: 422, applies_to: "POST /rebate-claims" }
  - { priority: 35, category: business_constraint, check: "RebateProgram.budget_remaining_cents >= claimed_cents at approve", error_id: ERR_REBATE_BUDGET_EXCEEDED, http_status: 409, applies_to: "POST /rebate-claims/{id}/approve" }
  - { priority: 38, category: business_referential, check: "ReturnRequest approve requires parent Order.payment_status in {DEPOSIT_PAID, SETTLED} and target line ACTIVE", error_id: ERR_LINE_NOT_RETURNABLE, http_status: 409, applies_to: "POST /return-requests/{id}/approve" }
  - { priority: 40, category: business_fiscal, check: "Order confirm requires TradeAccount.available_credit_cents >= total_estimate_cents for trade orders", error_id: ERR_INSUFFICIENT_CREDIT, http_status: 402, applies_to: "POST /orders/{id}/confirm" }
  - { priority: 42, category: business_constraint, check: "acting TradeAccount (Designer) must be ACTIVE and own the resource (X-User-ID == trade_account_id)", error_id: ERR_ACCOUNT_FORBIDDEN, http_status: 403, applies_to: "Designer-owned writes" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- TradeAccount ----
  - { method: POST, path: "/trade-accounts", description: "Create a trade/designer account", roles: [StoreManager], code: 201, input: [business_name, contact_email, "credit_limit_cents?"], output: TradeAccount, side_effects: ["tier=STANDARD, discount_pct=0, available_credit_cents=credit_limit_cents"] }
  - { method: GET, path: "/trade-accounts/{id}", description: "Read a trade account (computed tier/credit)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: TradeAccount }
  - { method: PATCH, path: "/trade-accounts/{id}", description: "Adjust credit limit or status", roles: [StoreManager], code: 200, input: ["credit_limit_cents?", "status?"], output: TradeAccount, side_effects: ["recompute available_credit_cents"] }

  # ---- FixtureModel ----
  - { method: POST, path: "/fixture-models", description: "Create a fixture model (with embedded config options)", roles: [StoreManager], code: 201, input: [sku_base, category, base_price_cents, base_wattage, "energy_star?", "special_order_only?", "supplier_lead_days?", "options?"], output: FixtureModel }
  - { method: GET, path: "/fixture-models/{id}", description: "Read a fixture model", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: FixtureModel }

  # ---- Installer / DeliveryTruck / RebateProgram (config resources) ----
  - { method: POST, path: "/installers", description: "Create an installer", roles: [StoreManager], code: 201, input: [name, service_area, "daily_capacity?"], output: Installer }
  - { method: GET, path: "/installers/{id}", description: "Read an installer (computed active_referral_count)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: Installer }
  - { method: POST, path: "/delivery-trucks", description: "Create a delivery truck", roles: [StoreManager], code: 201, input: [name, "capacity_units?"], output: DeliveryTruck }
  - { method: POST, path: "/rebate-programs", description: "Create an energy rebate program", roles: [StoreManager], code: 201, input: [name, rebate_rate, wattage_ceiling, budget_total_cents], output: RebateProgram, side_effects: ["budget_remaining_cents = budget_total_cents"] }
  - { method: GET, path: "/rebate-programs/{id}", description: "Read a rebate program (computed budget_remaining_cents)", roles: [ShowroomAssociate, StoreManager, FulfillmentCoordinator], code: 200, input: [], output: RebateProgram }

  # ---- Order ----
  - { method: POST, path: "/orders", description: "Create an order (DRAFT/UNPAID)", roles: [ShowroomAssociate, StoreManager, Designer], code: 201, input: [customer_name, "trade_account_id?"], output: Order }
  - { method: GET, path: "/orders/{id}", description: "Read an order", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: Order }
  - { method: GET, path: "/orders", description: "List/filter orders (reverse-reach Order.trade_account_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["trade_account_id?", "limit?", "offset?"], output: "Order[]" }
  - { method: POST, path: "/orders/{id}/lines", description: "Add a configured line to a DRAFT order", roles: [ShowroomAssociate, StoreManager, Designer], code: 201, input: [fixture_model_id, quantity, "selected_option_ids?"], output: OrderLine, side_effects: ["compute configured_sku/unit_price_cents/is_special_order (line_unit_price)"] }
  - { method: GET, path: "/order-lines/{id}", description: "Read an order line", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: OrderLine }
  - { method: GET, path: "/order-lines", description: "List/filter order lines (reverse-reach OrderLine.order_id and .fixture_model_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "fixture_model_id?", "limit?", "offset?"], output: "OrderLine[]" }
  - { method: POST, path: "/orders/{id}/quote", description: "Generate/supersede quote (ESTIMATE); OCC-guarded", roles: [ShowroomAssociate, StoreManager, Designer], code: 200, input: [expected_order_version], output: Order, side_effects: ["order_pricing[ESTIMATE]", "fulfillment DRAFT/QUOTED -> QUOTED", "increments Order.version by 1"] }
  - { method: POST, path: "/orders/{id}/confirm", description: "Confirm a QUOTED order (commit trade credit)", roles: [ShowroomAssociate, StoreManager, Designer], code: 200, input: [], output: Order, side_effects: ["set committed_credit_cents=total_estimate_cents; debit available credit", "fulfillment QUOTED -> CONFIRMED", "increments Order.version by 1"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel an order (cascade)", roles: [ShowroomAssociate, StoreManager], code: 200, input: [], output: Order, side_effects: ["fulfillment -> CANCELLED", "release committed credit (compensate)", "cascade lines/SpecialOrders/DeliveryJobs"] }
  - { method: POST, path: "/orders/{id}/payments", description: "Record a DEPOSIT or SETTLEMENT payment", roles: [ShowroomAssociate, StoreManager], code: 200, input: [kind, amount_cents], output: Order, side_effects: ["payment axis transition", "on SETTLEMENT: order_pricing[FINAL], set settled_at, recompute account tier/spend"] }

  # ---- SpecialOrder ----
  - { method: POST, path: "/special-orders", description: "Create a special order for a line (REQUESTED)", roles: [ShowroomAssociate, StoreManager], code: 201, input: [order_id, order_line_id, supplier_lead_days], output: SpecialOrder }
  - { method: GET, path: "/special-orders/{id}", description: "Read a special order", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: SpecialOrder }
  - { method: GET, path: "/special-orders", description: "List/filter special orders (reverse-reach order_id/order_line_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "order_line_id?", "limit?", "offset?"], output: "SpecialOrder[]" }
  - { method: POST, path: "/special-orders/{id}/confirm", description: "Confirm supplier order (set estimated_ready_date)", roles: [FulfillmentCoordinator, StoreManager], code: 200, input: [], output: SpecialOrder, side_effects: ["cross-entity guard on Order CONFIRMED", "special_order_lead_time[ESTIMATED]"] }
  - { method: POST, path: "/special-orders/{id}/complete", description: "Mark supplier order READY (set actual_ready_date/variance)", roles: [FulfillmentCoordinator, StoreManager], code: 200, input: [], output: SpecialOrder, side_effects: ["special_order_lead_time[ACTUAL]"] }

  # ---- DesignConsult ----
  - { method: POST, path: "/design-consults", description: "Create a design consult (REQUESTED)", roles: [Designer, StoreManager], code: 201, input: [trade_account_id, room_type, "fee_cents?", "order_id?"], output: DesignConsult }
  - { method: GET, path: "/design-consults/{id}", description: "Read a design consult", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: DesignConsult }
  - { method: GET, path: "/design-consults", description: "List/filter design consults (reverse-reach trade_account_id/order_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["trade_account_id?", "order_id?", "limit?", "offset?"], output: "DesignConsult[]" }
  - { method: POST, path: "/design-consults/{id}/submit-review", description: "REQUESTED->IN_REVIEW or REVISION->IN_REVIEW", roles: [Designer, StoreManager], code: 200, input: [], output: DesignConsult }
  - { method: POST, path: "/design-consults/{id}/request-revision", description: "IN_REVIEW->REVISION (increment revision_count)", roles: [Designer, StoreManager], code: 200, input: [], output: DesignConsult, side_effects: ["revision_count += 1"] }
  - { method: POST, path: "/design-consults/{id}/approve", description: "IN_REVIEW->APPROVED", roles: [StoreManager], code: 200, input: [], output: DesignConsult }

  # ---- DeliveryJob ----
  - { method: POST, path: "/delivery-jobs", description: "Schedule a delivery (buffer overlap check; Order CONFIRMED guard)", roles: [FulfillmentCoordinator, StoreManager], code: 201, input: [order_id, delivery_truck_id, window_start, window_end], output: DeliveryJob }
  - { method: GET, path: "/delivery-jobs/{id}", description: "Read a delivery job", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: DeliveryJob }
  - { method: GET, path: "/delivery-jobs", description: "List/filter delivery jobs (reverse-reach order_id/delivery_truck_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "delivery_truck_id?", "limit?", "offset?"], output: "DeliveryJob[]" }
  - { method: POST, path: "/delivery-jobs/{id}/deliver", description: "SCHEDULED->DELIVERED (bubble Order to COMPLETED)", roles: [FulfillmentCoordinator, StoreManager], code: 200, input: [], output: DeliveryJob, side_effects: ["bubble-up Order CONFIRMED->COMPLETED"] }

  # ---- InstallReferral ----
  - { method: POST, path: "/install-referrals", description: "Create an install referral (REFERRED)", roles: [ShowroomAssociate, FulfillmentCoordinator, StoreManager], code: 201, input: [order_id, installer_id, delivery_job_id], output: InstallReferral, side_effects: ["increment Installer.active_referral_count by 1"] }
  - { method: GET, path: "/install-referrals/{id}", description: "Read an install referral", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: InstallReferral }
  - { method: GET, path: "/install-referrals", description: "List/filter install referrals (reverse-reach order_id/installer_id/delivery_job_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "installer_id?", "delivery_job_id?", "limit?", "offset?"], output: "InstallReferral[]" }
  - { method: POST, path: "/install-referrals/{id}/schedule", description: "REFERRED->SCHEDULED (delivery-DELIVERED guard + installer half-open overlap)", roles: [FulfillmentCoordinator, StoreManager], code: 200, input: [appointment_start, appointment_end], output: InstallReferral, side_effects: ["set appointment window (active_referral_count unchanged)"] }
  - { method: POST, path: "/install-referrals/{id}/complete", description: "SCHEDULED->COMPLETED (decrement active_referral_count)", roles: [FulfillmentCoordinator, StoreManager], code: 200, input: [], output: InstallReferral, side_effects: ["decrement Installer.active_referral_count by 1"] }

  # ---- ReturnRequest ----
  - { method: POST, path: "/return-requests", description: "File a return/damage/warranty request (REQUESTED)", roles: [ShowroomAssociate, StoreManager], code: 201, input: [order_id, order_line_id, reason], output: ReturnRequest }
  - { method: GET, path: "/return-requests/{id}", description: "Read a return request", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: ReturnRequest }
  - { method: GET, path: "/return-requests", description: "List/filter return requests (reverse-reach order_id/order_line_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "order_line_id?", "limit?", "offset?"], output: "ReturnRequest[]" }
  - { method: POST, path: "/return-requests/{id}/approve", description: "Approve (restock calc + line cascade) or DENY", roles: [StoreManager], code: 200, input: ["adjudication?"], output: ReturnRequest, side_effects: ["restocking_refund fee", "cascade line->RETURNED + Order final recompute"] }
  - { method: POST, path: "/return-requests/{id}/refund", description: "APPROVED->REFUNDED (compute refund_cents)", roles: [StoreManager], code: 200, input: [], output: ReturnRequest, side_effects: ["refund_cents; bubble Order->REFUNDED if fully returned"] }

  # ---- RebateClaim ----
  - { method: POST, path: "/rebate-claims", description: "Submit an energy rebate claim (eligibility + claimed_cents)", roles: [ShowroomAssociate, StoreManager], code: 201, input: [order_id, rebate_program_id], output: RebateClaim, side_effects: ["rebate_amount claimed_cents; reject if no eligible line"] }
  - { method: GET, path: "/rebate-claims/{id}", description: "Read a rebate claim", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: [], output: RebateClaim }
  - { method: GET, path: "/rebate-claims", description: "List/filter rebate claims (reverse-reach order_id/rebate_program_id)", roles: [ShowroomAssociate, StoreManager, Designer, FulfillmentCoordinator], code: 200, input: ["order_id?", "rebate_program_id?", "limit?", "offset?"], output: "RebateClaim[]" }
  - { method: POST, path: "/rebate-claims/{id}/approve", description: "Approve (debit budget) or DENY", roles: [StoreManager], code: 200, input: ["adjudication?"], output: RebateClaim, side_effects: ["budget debit; reject if budget < claimed"] }
  - { method: POST, path: "/rebate-claims/{id}/void", description: "APPROVED->VOID (restore budget — compensating)", roles: [StoreManager], code: 200, input: [], output: RebateClaim, side_effects: ["restore RebateProgram.budget_remaining_cents"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: [StoreManager], code: 200, input: [to_iso8601], output: null }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID; role not recognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_ACCOUNT_FORBIDDEN, http: 403, condition: "Designer acting on a resource not owned by X-User-ID, or account not ACTIVE" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body-referenced foreign-key entity does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum/type, quantity<1, or selected_option_ids not all in fixture.options" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match Order.version on quote (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the requested transition" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Adding a line to an Order whose fulfillment_status is not DRAFT" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "SpecialOrder confirm or DeliveryJob create when parent Order is not CONFIRMED/COMPLETED" }
  - { id: ERR_DELIVERY_NOT_READY, http: 409, condition: "InstallReferral schedule when linked DeliveryJob.status != DELIVERED" }
  - { id: ERR_INSTALLER_UNAVAILABLE, http: 409, condition: "Install appointment overlaps another SCHEDULED referral for the same installer" }
  - { id: ERR_TRUCK_WINDOW_CONFLICT, http: 409, condition: "Delivery window within BUFFER_MINUTES of another non-VOIDED window on the same truck" }
  - { id: ERR_NO_ELIGIBLE_ITEMS, http: 422, condition: "Rebate claim has zero eligible lines (energy_star + wattage gate)" }
  - { id: ERR_REBATE_BUDGET_EXCEEDED, http: 409, condition: "RebateProgram.budget_remaining_cents < claimed_cents at approve" }
  - { id: ERR_LINE_NOT_RETURNABLE, http: 409, condition: "Return approve when order payment not in {DEPOSIT_PAID, SETTLED} or target line not ACTIVE" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Trade order confirm when available_credit_cents < total_estimate_cents" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic body validation failure not covered above (e.g., window_end <= window_start)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShowroomAssociate
    description: "Sales-floor staff: builds orders, quotes, special orders, files returns/rebate claims, creates install referrals"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/quote, POST /orders/{id}/confirm, POST /orders/{id}/cancel, POST /orders/{id}/payments"
      - "POST /special-orders, POST /return-requests, POST /rebate-claims, POST /install-referrals"
      - "all GET reads"

  - name: FulfillmentCoordinator
    description: "Back-of-house: confirms/completes supplier orders, runs delivery + install lifecycle"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /special-orders/{id}/confirm, POST /special-orders/{id}/complete"
      - "POST /delivery-jobs, POST /delivery-jobs/{id}/deliver"
      - "POST /install-referrals, POST /install-referrals/{id}/schedule, POST /install-referrals/{id}/complete"
      - "all GET reads"

  - name: Designer
    description: "Trade/designer account holder acting on own account; entity-backed by TradeAccount"
    identity: "entity_backed:TradeAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /design-consults (own account), POST /design-consults/{id}/submit-review, POST /design-consults/{id}/request-revision"
      - "POST /orders (own trade_account_id), POST /orders/{id}/lines, POST /orders/{id}/quote, POST /orders/{id}/confirm"
      - "GET reads of own resources"

  - name: StoreManager
    description: "Superset operator: catalog/config admin, approvals (returns, rebates, consults), credit adjustments, logical clock; authorized on every endpoint (hierarchical override)"
    identity: opaque
    exclusive_operations:
      - "POST /trade-accounts, PATCH /trade-accounts/{id}"
      - "POST /fixture-models, POST /installers, POST /delivery-trucks, POST /rebate-programs"
      - "POST /design-consults/{id}/approve"
      - "POST /return-requests/{id}/approve, POST /return-requests/{id}/refund"
      - "POST /rebate-claims/{id}/approve, POST /rebate-claims/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every other endpoint (override authority)"
