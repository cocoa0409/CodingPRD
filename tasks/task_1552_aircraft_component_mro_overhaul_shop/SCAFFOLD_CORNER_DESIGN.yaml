      - name: lease_overage_billed_at_1_5x
        claim_type: correct_result
        grounds: [calculations.lease_accrual_calc]
        distinguishing_aspect: "Inclusive-day billing plus overage multiplier: lease [2026-08-10, 2026-08-14] at 100000/day returned 2026-08-16 bills 5 contracted days (500000) plus 2 overage days at 1.5x (300000) = 800000; return exactly on end_date would bill zero overage."
        test_recipe:
          setup: ["SHOP unit SN-L1; lease ACTIVE [2026-08-10, 2026-08-14] @ 100000/day; clock at 2026-08-16T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
