              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
